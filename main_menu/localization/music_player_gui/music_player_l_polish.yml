 MusicPlayer_sol_chinese_Ambush_from_Ten_Sides_The_Complete_Epos_flavour: "Majstrovské dielo čínskej klasickej hudby, typicky hrané virtuózmi. Napísané v bojovom štýle a zobrazujúce bitku pri Gaixia v roku 202 pred n. l., kde bol generál Xiang Yu porazený Liu Bangom." # todo: NEW TRANSLATION

 Dan_Cecil_Hill_facts: "Dan Cecil Hill (Cayuga Nation, Heron Clan) je umelcom Haudensaunee (Irokézovia) špecializujúcim sa na tradičné strieborné kováčstvo a tvorbu fláút. Ako umelec, interpret a kultúrny vodca väčšinu svojho života pracoval na zachovaní a zdieľaní všetkých aspektov histórie svojho ľudu s koreňmi v predkoloniálnych časoch USA a ďalej." # todo: NEW TRANSLATION
 Pierre_Harmon: "Pierre Harmon" # todo: NEW TRANSLATION
 Pierre_Harmon_facts: "Pierre Harmon je známy hráč na flautu a renomovaný expert na prekolumbovskú hudbu. Je celosvetovo uznávaný za svoje hudbologické výskumy, najmä v oblasti aztéckej hudby, a vlastní jednu z najväčších zbierok starovekých nástrojov, ktorým sa počas kariéry venoval." # todo: NEW TRANSLATION

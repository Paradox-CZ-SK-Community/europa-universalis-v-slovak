 Martin_Rinckart: "Martin Rinckart (1586-1649)" # todo: NEW TRANSLATION
 Martin_Rinckart_facts: "Martin Rinckart bol luteránsky kňaz a autorm duchovných piesní, pôsobiaci ako archidiakon v Eilenburgu v Nordsachsen, kde sa narodil a zomrel." # todo: NEW TRANSLATION

 Dan_Cecil_Hill_facts: "Dan Cecil Hill (Cayuga Nation, Heron Clan) je umelec a hudobník Haudenosaunee (Irokézov), špecializujúci sa na tradičné domorodé strieborné remeslo a výrobu fláut. Je umelcom, interpretom a kultúrnym vodcom väčšinu svojho života; pracoval na zachovaní a zdieľaní všetkých aspektov histórie svojho ľudu siaha k predkoloniálnym časom na území dnešných USA a ešte ďalej." # todo: NEW TRANSLATION
 Pierre_Harmon: "Pierre Harmon" # todo: NEW TRANSLATION
 Pierre_Harmon_facts: "Pierre Harmon je známy hráč na flautu a renomovaný odborník na predkolumbovskú hudbu. Celosvetovo známy svojím muzikologickým výskumom, najmä v oblasti aztéckej hudby, tiež vlastní jednu z najväčších zbierok starých nástrojov, ktorým sa venoval počas celej svojej kariéry." # todo: NEW TRANSLATION

 MusicPlayer_01_Overture_I_Genesis: "01 - Overture I Genesis" # todo: NEW TRANSLATION
 MusicPlayer_01_Overture_I_Genesis_flavour: "'Svet sa prebúdza, slnečné svetlo postupne odhaľuje jeho tvár.'" # todo: NEW TRANSLATION
 MusicPlayer_02_Overture_II_The_Odyssey: "02 - Overture II Odyssey" # todo: NEW TRANSLATION
 MusicPlayer_02_Overture_II_The_Odyssey_flavour: "'Predohra nášho príbehu, v ktorej sa predstavujú jeho postavy a témy.'" # todo: NEW TRANSLATION
 MusicPlayer_03_Royal_Court_Invitation: "03 - Royal Court Invitation" # todo: NEW TRANSLATION
 MusicPlayer_03_Royal_Court_Invitation_flavour: "V tejto skladbe počuť čembalo — klávesový nástroj rozšírený v renesančnej a barokovej hudbe. Produkuje zvuk mechanickým trsákaním súboru strún upevnených na zvukovej doske: stlačenie klávesu pohne brkom (plectrom), ktoré trsne jednu strunu." # todo: NEW TRANSLATION
 MusicPlayer_25_The_Noble_Art_of_Diplomacy: "25 - The Noble Art of Diplomacy" # todo: NEW TRANSLATION
 MusicPlayer_25_The_Noble_Art_of_Diplomacy_flavour: "Rodina lutnovitých nástrojov má dlhú históriu v mnohých regiónoch sveta a obdobiach dejín; európska luta bola dominantným nástrojom renesančnej svetskej hudby v Európe." # todo: NEW TRANSLATION
 MusicPlayer_21_Conquer_or_Fall: "21 - Conquer or Fall" # todo: NEW TRANSLATION
 MusicPlayer_21_Conquer_or_Fall_flavour: "Epická skladba so trúbkami, sláčikmi a zborom. Predstavuje inšpiratívnu variáciu jednej z hlavných melodických tém hudby Europa Universalis V." # todo: NEW TRANSLATION
 MusicPlayer_07_For_the_Lost_Ones: "07 - For the Lost Ones" # todo: NEW TRANSLATION
 MusicPlayer_07_For_the_Lost_Ones_flavour: "Žalozpievavá a vznášajúca sa skladba, odrážajúca témy a motívy z iných diel v Europa Universalis V." # todo: NEW TRANSLATION
 MusicPlayer_12_Jester_Speaks_the_Truth: "12 - Jester Speaks the Truth" # todo: NEW TRANSLATION
 MusicPlayer_12_Jester_Speaks_the_Truth_flavour: "Skladba inšpirovaná ranorenesančnou hudbou, založená na variáciách hlavného melodického motívu hudby Europa Universalis V." # todo: NEW TRANSLATION
 MusicPlayer_05_The_Rise_of_an_Empire: "05 - The Rise of an Empire" # todo: NEW TRANSLATION
 MusicPlayer_05_The_Rise_of_an_Empire_flavour: "Vychádzajúc z hlavného motívu Europa Universalis V, táto skladba dynamicky vystihuje jadrovú emóciu zážitku." # todo: NEW TRANSLATION
 MusicPlayer_20_Thirty_Years: "20 - Thirty Years" # todo: NEW TRANSLATION
 MusicPlayer_20_Thirty_Years_flavour: "Tridsaťročná vojna (1618–1648) patrí medzi najdevastačnejšie konflikty v európskych dejinách, pričom zomrelo medzi 4,5 až 8 miliónmi ľudí. Vypukla v dôsledku reformácie a ďalej ju poháňali vonkajšie konflikty záujmov a staré rivality." # todo: NEW TRANSLATION
 MusicPlayer_24_The_Black_Death: "24 - The Black Death" # todo: NEW TRANSLATION
 MusicPlayer_24_The_Black_Death_flavour: "Čierna smrť, ktorá v 14. storočí zdecimovala populáciu Európy približne na polovicu, je jednou z najsmrteľnejších pandémií v dejinách ľudstva." # todo: NEW TRANSLATION
 MusicPlayer_10_Gloria_Patri: "10 - Gloria Patri" # todo: NEW TRANSLATION
 MusicPlayer_10_Gloria_Patri_flavour: "Vokálna variácia na Bachovu Suitu pre violončelo č. 1 v G-dur, BWV 1007: I. Prélude." # todo: NEW TRANSLATION
 MusicPlayer_14_Lux_aeterna: "14 - Lux Aeterna" # todo: NEW TRANSLATION
 MusicPlayer_14_Lux_aeterna_flavour: "Lux aeterna je text bežne zhudobňovaný ako súčasť rekviem v katolíckej cirkvi. Hovorí o Božej milosti a Jeho večnom svetle svietiacom na zosnulých." # todo: NEW TRANSLATION
 MusicPlayer_18_Falalalan: "18 - Falalalan" # todo: NEW TRANSLATION
 MusicPlayer_18_Falalalan_flavour: "História je v hudbe vždy prítomná, niekedy viacerými spôsobmi." # todo: NEW TRANSLATION
 MusicPlayer_22_A_Message_to_The_King: "22 - A Message to the King" # todo: NEW TRANSLATION
 MusicPlayer_22_A_Message_to_The_King_flavour: "Skladba plná naliehavosti a horlivosti, ktorá vyvoláva pocit, že rýchlosť je nesmierne dôležitá." # todo: NEW TRANSLATION
 MusicPlayer_08_No_Fear_No_Mercy: "08 - No Fear, No Mercy" # todo: NEW TRANSLATION
 MusicPlayer_08_No_Fear_No_Mercy_flavour: "Víťazná skladba pripomínajúca ticho pred bitkou a búšenie sŕdc bojovníkov v očakávaní." # todo: NEW TRANSLATION
 MusicPlayer_06_Pain_is_Salvation: "06 - Pain is Salvation" # todo: NEW TRANSLATION
 MusicPlayer_06_Pain_is_Salvation_flavour: "Texty miešajú angličtinu, starú nemčinu a latinčinu a hovoria o utrpení na ceste k spáse." # todo: NEW TRANSLATION
 MusicPlayer_04_In_Your_Honor: "04 - In Your Honor" # todo: NEW TRANSLATION
 MusicPlayer_04_In_Your_Honor_flavour: "Rozsiahlá skladba evokujúca zelené pastviny a úctu k Bohu a prírode." # todo: NEW TRANSLATION
 MusicPlayer_15_A_Bargain_with_Beelzebub: "15 - A Bargain with Beelzebub" # todo: NEW TRANSLATION
 MusicPlayer_15_A_Bargain_with_Beelzebub_flavour: "Náboženstvo a vojna, vojny kvôli náboženstvu. Zbožnosť a krvilačnosť sa premiešavajú. Storočia zobrazené tu sú storočia ostrých kontrastov prelínaných odtieňmi šedi." # todo: NEW TRANSLATION
 MusicPlayer_16_The_Path_to_Potsdam: "16 - The Path to Potsdam" # todo: NEW TRANSLATION
 MusicPlayer_16_The_Path_to_Potsdam_flavour: "Mesto Potsdam prišlo počas Tridsaťročnej vojny takmer o polovicu populácie." # todo: NEW TRANSLATION
 MusicPlayer_11_Maiden_Voyage: "11 - Maiden Voyage" # todo: NEW TRANSLATION
 MusicPlayer_11_Maiden_Voyage_flavour: "Skladba v tanečnom rytme, ako valenie vĺn pri vyplávaní na neznáme more." # todo: NEW TRANSLATION
 MusicPlayer_17_The_Coronation_of_a_Naked_Emperor: "17 - The Coronation of a Naked Emperor" # todo: NEW TRANSLATION
 MusicPlayer_17_The_Coronation_of_a_Naked_Emperor_flavour: "Dielo v sekulárnom barokovom štýle s využitím sláčikových nástrojov a čembala." # todo: NEW TRANSLATION
 MusicPlayer_13_Battle_of_Lutzen: "13 - Battle of Lützen" # todo: NEW TRANSLATION
 MusicPlayer_13_Battle_of_Lutzen_flavour: "Bitka pri Lützene sa odohrala 16. novembra 1632 medzi švédskou armádou, podporovanou jednotkami zo Saského kniežatstva a Hesenska-Kasselu, proti cisárskej armáde Svätého rímskeho cisára a je jednou z najdôležitejších bitiek Tridsaťročnej vojny. Po smrti švédskeho kráľa Gustáva II. Adolfa počas bitky bola založená Heilbronnská liga." # todo: NEW TRANSLATION
 MusicPlayer_26_Peace_of_Westphalia: "26 - Peace of Westphalia" # todo: NEW TRANSLATION
 MusicPlayer_26_Peace_of_Westphalia_flavour: "Vestfálsky mier je kolektívny názov dvoch samostatných mierových zmlúv podpísaných v Osnabrücku a Münsteri v roku 1648, ktoré ukončili Tridsaťročnú vojnu a priniesli mier Svätej rímskej ríši." # todo: NEW TRANSLATION
 MusicPlayer_23_The_Flagellant: "23 - The Flagellant" # todo: NEW TRANSLATION
 MusicPlayer_23_The_Flagellant_flavour: "Bičovanie je čin seba-bičiovania ako pokánie za hriechy a zdieľanie Kristovho utrpenia, prítomné v mnohých kresťanských tradíciách. Hnutie bičovačov bolo 14. storočné hnutie v západnom kresťanstve, ktoré začalo ako reakcia na vojnu, hlad a mor." # todo: NEW TRANSLATION
 MusicPlayer_19_O_quam_gloriosum: "19 - O quam gloriosum" # todo: NEW TRANSLATION
 MusicPlayer_19_O_quam_gloriosum_flavour: "Táto skladba je založená na texte, ktorý napísal Tomás Luis de Victoria (1548–1611) pre svoje 'Missa O quam gloriosum'." # todo: NEW TRANSLATION
 MusicPlayer_09_Libera_me_Domine: "09 - Libera me Domine" # todo: NEW TRANSLATION
 MusicPlayer_09_Libera_me_Domine_flavour: "Táto skladba kombinuje texty 'Pie Jesu' a 'Libera me', ktoré sa bežne zhudobňujú ako súčasť rekviem v katolíckej cirkvi. Prosia, aby zosnulí dostali Ježišovu milosť a pokoj a vykúpenie v deň súdu." # todo: NEW TRANSLATION
 MusicPlayer_sol_ashanti_Aho: "Ashanti - Aho" # todo: NEW TRANSLATION
 MusicPlayer_sol_ashanti_Aho_flavour: "Nana Osei Twum Barima je majster všetkých nástrojov používaných v hudbe a ceremóniách Ashanti, vrátane seperewy, tradičných trúbok a bicích. Je tiež nástupcom cisára a tvorcom Ashanti kráľovstva. Názov piesne sa prekladá ako 'Vojenský pokrik'." # todo: NEW TRANSLATION
 MusicPlayer_sol_ashanti_Asanteman_Yenim_Ko: "Ashanti - Asanteman Yenim Ko" # todo: NEW TRANSLATION
 MusicPlayer_sol_ashanti_Asanteman_Yenim_Ko_flavour: "Začiatok textu piesne sa približne prekladá ako 'Ashanti vedia bojovať, no nevedia utekať', a pokračuje v hlásaní nadvlády bojovníkov Ashanti." # todo: NEW TRANSLATION
 MusicPlayer_sol_ashanti_Seperewa_Akasa: "Ashanti - Seperewa Akasa" # todo: NEW TRANSLATION
 MusicPlayer_sol_ashanti_Seperewa_Akasa_flavour: "Názov piesne sa prekladá ako 'Seperewa prehovorila'. Seperewa je nástroj rodiny arfy-luty, s rezonančnou skrinkou tvaru boxu a 10–14 strunami navinutými priamo na krk nástroja. Pochádza zo Západnej Afriky, a hovorí sa, že kráľ Osei Tutu, zakladateľ ríše Asante/Ashanti, ho miloval natoľko, že si dal zhotoviť repliku zo zlata pre svoje kráľovské pomôcky." # todo: NEW TRANSLATION

 Qanun_facts: "Qanun, alebo kanun, je strunový nástroj zo skupiny cimbálov, ktorý mohol pochádzať z starovekého Mezopotámie, hoci jeho presný pôvod nie je istý." # todo: NEW TRANSLATION

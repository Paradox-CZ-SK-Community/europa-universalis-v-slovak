 MusicPlayer_01_Overture_I_Genesis: "01 - Overture I Genesis" # todo: NEW TRANSLATION
 MusicPlayer_01_Overture_I_Genesis_flavour: "'Svet sa prebúdza, slnečné svetlo odhaľuje jeho tvár kúsku po kúsku.'" # todo: NEW TRANSLATION
 MusicPlayer_02_Overture_II_The_Odyssey: "02 - Overture II Odyssey" # todo: NEW TRANSLATION
 MusicPlayer_02_Overture_II_The_Odyssey_flavour: "'Úvodná suita nášho príbehu, v ktorej sme oboznámení s jeho postavami a témami.'" # todo: NEW TRANSLATION
 MusicPlayer_03_Royal_Court_Invitation: "03 - Royal Court Invitation" # todo: NEW TRANSLATION
 MusicPlayer_03_Royal_Court_Invitation_flavour: "Cembalo, ktoré je počuť v tejto skladbe, je klávesový nástroj rozšírený v renesančnej a barokovej hudbe. Zvuk vytvára mechanickým brnkaním na súbor strún upevnených na rezonančnej doske — stlačením klávesu sa pohne brnkadlo (pierko), ktoré brnkne jednu strunu." # todo: NEW TRANSLATION
 MusicPlayer_25_The_Noble_Art_of_Diplomacy: "25 - The Noble Art of Diplomacy" # todo: NEW TRANSLATION
 MusicPlayer_25_The_Noble_Art_of_Diplomacy_flavour: "Rodina lutnových nástrojov má dlhú históriu v mnohých regiónoch sveta a historických obdobiach; európska luta je dominantným nástrojom v renesančnej svetskej hudbe v Európe." # todo: NEW TRANSLATION
 MusicPlayer_21_Conquer_or_Fall: "21 - Conquer or Fall" # todo: NEW TRANSLATION
 MusicPlayer_21_Conquer_or_Fall_flavour: "Epická skladba zahŕňajúca trúby, sláčikové nástroje a zbor. Predstavuje inšpiratívnu variáciu jednej z hlavných melódických tém hudby v Europa Universalis V." # todo: NEW TRANSLATION
 MusicPlayer_07_For_the_Lost_Ones: "07 - For the Lost Ones" # todo: NEW TRANSLATION
 MusicPlayer_07_For_the_Lost_Ones_flavour: "Žalošná a vznášajúca sa skladba, ozývajúca sa témami a motívmi z iných skladieb v Europa Universalis V." # todo: NEW TRANSLATION
 MusicPlayer_12_Jester_Speaks_the_Truth: "12 - Jester Speaks the Truth" # todo: NEW TRANSLATION
 MusicPlayer_12_Jester_Speaks_the_Truth_flavour: "Skladba inšpirovaná ranorenesančnou hudbou, točiaca sa okolo variácií hlavného melodického motívu hudby v Europa Universalis V." # todo: NEW TRANSLATION
 MusicPlayer_05_The_Rise_of_an_Empire: "05 - The Rise of an Empire" # todo: NEW TRANSLATION
 MusicPlayer_05_The_Rise_of_an_Empire_flavour: "Táto skladba, vedúca hlavným motívom Europa Universalis V, je hnacím vyjadrením jadrovej emócie zážitku." # todo: NEW TRANSLATION
 MusicPlayer_20_Thirty_Years: "20 - Thirty Years" # todo: NEW TRANSLATION
 MusicPlayer_20_Thirty_Years_flavour: "Tridsaťročná vojna (1618-1648) je jedným z najničivejších konfliktov v európskej histórii, ktorý si vyžiadal medzi 4,5 až 8 miliónmi obetí. Bola vyvolaná reformáciou 16. storočia a ďalej podnecovaná vonkajšími konfliktmi záujmov a starými rivalitami." # todo: NEW TRANSLATION
 MusicPlayer_24_The_Black_Death: "24 - The Black Death" # todo: NEW TRANSLATION
 MusicPlayer_24_The_Black_Death_flavour: "Čierna smrť, ktorá v 14. storočí zdecimovala populáciu Európy takmer na polovicu, je jednou z najničivejších pandémií v ľudskej histórii." # todo: NEW TRANSLATION
 MusicPlayer_10_Gloria_Patri: "10 - Gloria Patri" # todo: NEW TRANSLATION
 MusicPlayer_10_Gloria_Patri_flavour: "Vokálna variácia nad Bachovou Suitou pre violončelo č. 1 v G dur, BWV 1007: I. Prélude." # todo: NEW TRANSLATION
 MusicPlayer_14_Lux_aeterna: "14 - Lux Aeterna" # todo: NEW TRANSLATION
 MusicPlayer_14_Lux_aeterna_flavour: "Lux aeterna je text bežne spracúvaný v hudbe ako súčasť omše za zosnulých v katolíckej cirkvi. Hovorí o Božej milosti a jeho večnom svetle svietiacom na zomrelých." # todo: NEW TRANSLATION
 MusicPlayer_18_Falalalan: "18 - Falalalan" # todo: NEW TRANSLATION
 MusicPlayer_18_Falalalan_flavour: "História je v hudbe vždy prítomná, niekedy viacerými spôsobmi." # todo: NEW TRANSLATION
 MusicPlayer_22_A_Message_to_The_King: "22 - A Message to the King" # todo: NEW TRANSLATION
 MusicPlayer_22_A_Message_to_The_King_flavour: "Skladba naplnená naliehavosťou a horlivosťou, vyvolávajúca pocit, že konať rýchlo je najvyššou prioritou." # todo: NEW TRANSLATION
 MusicPlayer_08_No_Fear_No_Mercy: "08 - No Fear, No Mercy" # todo: NEW TRANSLATION
 MusicPlayer_08_No_Fear_No_Mercy_flavour: "Triumfálna skladba, pripomínajúca pokoj pred bitkou a bijúce srdcia bojovníkov v očakávaní." # todo: NEW TRANSLATION
 MusicPlayer_06_Pain_is_Salvation: "06 - Pain is Salvation" # todo: NEW TRANSLATION
 MusicPlayer_06_Pain_is_Salvation_flavour: "Texty kombinujú angličtinu, starú nemčinu a latinčinu a hovoria o utrpení na ceste k spáse." # todo: NEW TRANSLATION
 MusicPlayer_04_In_Your_Honor: "04 - In Your Honor" # todo: NEW TRANSLATION
 MusicPlayer_04_In_Your_Honor_flavour: "Rozsiahla skladba evokujúca zelené pastviny a úctu k Bohu a prírode." # todo: NEW TRANSLATION
 MusicPlayer_15_A_Bargain_with_Beelzebub: "15 - A Bargain with Beelzebub" # todo: NEW TRANSLATION
 MusicPlayer_15_A_Bargain_with_Beelzebub_flavour: "Náboženstvo a vojna, a vojny kvôli náboženstvu. Pobožnosť a krvilačnosť sa miešajú. Storočia zobrazené tu sú storočia ostrých kontrastov prelomené odtieňmi sivej." # todo: NEW TRANSLATION
 MusicPlayer_16_The_Path_to_Potsdam: "16 - The Path to Potsdam" # todo: NEW TRANSLATION
 MusicPlayer_16_The_Path_to_Potsdam_flavour: "Mesto Potsdam stratilo počas Tridsaťročnej vojny takmer polovicu svojej populácie." # todo: NEW TRANSLATION
 MusicPlayer_11_Maiden_Voyage: "11 - Maiden Voyage" # todo: NEW TRANSLATION
 MusicPlayer_11_Maiden_Voyage_flavour: "Skladba v tanečnom rytme, pripomínajúca kolísanie vĺn pri vyplávaní na neznáme more." # todo: NEW TRANSLATION
 MusicPlayer_17_The_Coronation_of_a_Naked_Emperor: "17 - The Coronation of a Naked Emperor" # todo: NEW TRANSLATION
 MusicPlayer_17_The_Coronation_of_a_Naked_Emperor_flavour: "Skladba v svetskom barokovom štýle, s dominantnými sláčikmi a cembalom." # todo: NEW TRANSLATION
 MusicPlayer_13_Battle_of_Lutzen: "13 - Battle of Lützen" # todo: NEW TRANSLATION
 MusicPlayer_13_Battle_of_Lutzen_flavour: "Bitka pri Lützen sa odohrala 16. novembra 1632 medzi švédskou armádou, podporovanou jednotkami zo Saska a Hesenska-Kassel, a cisárskou armádou Svätého rímskeho cisára. Je to jedna z najdôležitejších bitiek Tridsaťročnej vojny. Po smrti kráľa Gustáva Adolfa Švédskeho počas bitky bola založená Heilbronnská liga." # todo: NEW TRANSLATION
 MusicPlayer_26_Peace_of_Westphalia: "26 - Peace of Westphalia" # todo: NEW TRANSLATION
 MusicPlayer_26_Peace_of_Westphalia_flavour: "Mier vo Westfálsku je súhrnné pomenovanie pre dve samostatné mierové zmluvy podpísané v Osnabrücku a Münsteri v roku 1648, ktoré ukončili Tridsaťročnú vojnu a priniesli mier Svätej rímskej ríši." # todo: NEW TRANSLATION
 MusicPlayer_23_The_Flagellant: "23 - The Flagellant" # todo: NEW TRANSLATION
 MusicPlayer_23_The_Flagellant_flavour: "Sebazapieranie (bičovanie) je akt bičovania seba ako pokánie za hriechy a zdieľanie Ježišovho utrpenia, prítomné v mnohých kresťanských tradíciách. Flagelantizmus bol hnutím 14. storočia v západnom kresťanstve, ktoré vzniklo ako reakcia na vojnu, hladomor a mor." # todo: NEW TRANSLATION
 MusicPlayer_19_O_quam_gloriosum: "19 - O quam gloriosum" # todo: NEW TRANSLATION
 MusicPlayer_19_O_quam_gloriosum_flavour: "Táto skladba vychádza z textu, ktorý napísal Tomás Luis de Victoria (1548-1611) pre jeho 'Missa O quam gloriosum'." # todo: NEW TRANSLATION
 MusicPlayer_09_Libera_me_Domine: "09 - Libera me Domine" # todo: NEW TRANSLATION
 MusicPlayer_09_Libera_me_Domine_flavour: "Táto skladba kombinuje texty 'Pie Jesu' a 'Libera me', ktoré sa bežne zhudobňujú ako súčasť omše za zosnulých v katolíckej cirkvi. Prosia o milosť Ježiša pre odpočinutie zomrelých a o vykúpenie v deň súdu." # todo: NEW TRANSLATION
 MusicPlayer_sol_ashanti_Aho: "Ashanti - Aho" # todo: NEW TRANSLATION
 MusicPlayer_sol_ashanti_Aho_flavour: "Nana Osei Twum Barima je majstrom všetkých nástrojov používaných v hudbe a obradoch Ashanti, vrátane seperewy, tradičných rohů a bicích nástrojov. Je tiež nástupcom cisára a tvorcom kráľovstva Ashanti. Názov piesne sa prekladá ako 'Bojový pokrik'." # todo: NEW TRANSLATION
 MusicPlayer_sol_ashanti_Asanteman_Yenim_Ko: "Ashanti - Asanteman Yenim Ko" # todo: NEW TRANSLATION
 MusicPlayer_sol_ashanti_Asanteman_Yenim_Ko_flavour: "Začiatok textu piesne sa približne prekladá ako 'Ašanti vedia bojovať, ale nevedia utekať' a pokračuje vyhlasovaním nadradenosti ašantských bojovníkov." # todo: NEW TRANSLATION
 MusicPlayer_sol_ashanti_Seperewa_Akasa: "Ashanti - Seperewa Akasa" # todo: NEW TRANSLATION
 MusicPlayer_sol_ashanti_Seperewa_Akasa_flavour: "Názov piesne sa prekladá ako 'Seperewa hovorila'. Seperewa je nástroj z rodiny harfovo-lutnových nástrojov s rezonančnou skrinkou a 10–14 strunami napojenými na krk nástroja. Pochádza zo Západnej Afriky a hovorí sa, že kráľ Osei Tutu, zakladateľ impéria Asante/Ashanti, ho miloval natoľko, že bol vyrobený aj jeho zlatý náprotivok pre kráľovskú výbavu." # todo: NEW TRANSLATION

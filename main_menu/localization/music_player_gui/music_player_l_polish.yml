 MusicPlayer_sol_chinese_Ambush_from_Ten_Sides_The_Complete_Epos_flavour: "Muzikálne majstrovské dielo čínskej klasickej hudby, zvyčajne hrané virtuózmi. Napísané v bojovom štýle a zobrazujúce bitku pri Gaixia v roku 202 pred n. l., kde generál Xiang Yu utrpel porážku od Liu Banga." # todo: NEW TRANSLATION

 musicplayer_sol_byzantine_o_virgin_pure_flavour: "Agni Parthene (O Virgin Pure) je grécky mariánsky hymn zložený sv. Nektáriom z Aeginy koncom 19. storočia, prvýkrát publikovaný v jeho Theotokarione v roku 1905." # todo: NEW TRANSLATION

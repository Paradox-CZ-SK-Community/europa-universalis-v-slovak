 musicplayer_sol_byzantine_hymn_melodies_flavour: "Hymnus založený na melodickej tradícii byzantského jednohlasného spevu, formovaný modálnym systémom ôsmich echoi, ktoré po stáročia riadili pravoslávnu cirkevnú hudbu." # todo: NEW TRANSLATION
 musicplayer_sol_byzantine_hymn_no_136: "Byzantské - Hymnus č. 136" # todo: NEW TRANSLATION
 musicplayer_sol_byzantine_hymn_no_136_flavour: "Usporiadanie byzantského Žalmu 136, začínajúce modlitbou 'Otče náš' a refrénom 'Exomologiste to Kyrio, oti agathos' (Chváľte Pána, lebo je dobrý) spievané v tradičnom štýle zvolávania a odpovede pravoslávneho chorálu." # todo: NEW TRANSLATION

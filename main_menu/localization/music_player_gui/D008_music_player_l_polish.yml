 musicplayer_sol_byzantine_hymn_melodies: "Byzantské - Hymnové melódie" # todo: NEW TRANSLATION
 musicplayer_sol_byzantine_hymn_melodies_flavour: "Hymnus založený na melodickej tradícii byzantského jednohlasného spevu, formovaný modalitným systémom ôsmich echoi, ktorý po stáročia usmerňoval ortodoxnú cirkevnú hudbu." # todo: NEW TRANSLATION
 musicplayer_sol_byzantine_hymn_no_136: "Byzantský - Hymnus č. 136" # todo: NEW TRANSLATION
 musicplayer_sol_byzantine_hymn_no_136_flavour: "Úprava byzantského Žalmu 136, ktorá začína modlitbou 'Our Father' a refrénom 'Exomologiste to Kyrio, oti agathos' (Praise the Lord, for He is good), spievaná v tradičnom štýle volania a odpovede ortodoxného spevu." # todo: NEW TRANSLATION
 musicplayer_sol_byzantine_o_virgin_pure: "Byzantský - Ó, Panna čistá" # todo: NEW TRANSLATION
 musicplayer_sol_byzantine_o_virgin_pure_flavour: "Agni Parthene (Ó, Panna čistá) je grécky mariánsky hymnus zložený St. Nectarios of Aegina koncom 19. storočia, prvýkrát publikovaný v jeho Theotokarion v roku 1905." # todo: NEW TRANSLATION
 musicplayer_sol_byzantine_overture_ii_odyssey: "Byzantský - Predohra II: Odyssea" # todo: NEW TRANSLATION
 musicplayer_sol_byzantine_overture_ii_odyssey_flavour: "Interpretácia hlavnej predohry soundtracku, inšpirovaná zvukom byzantského jednohlasného spevu, ktorý kedysi znel kostolmi Konštantínopola. Aranžmán evokuje hudobnú tradíciu Východnej Rímskej ríše." # todo: NEW TRANSLATION

 doge_election_desc: "Je to typ [Concept('heir_selection','nástupnícke právo')|e] [ShowGovernmentTypeName('republic')], pri ktorom je [Concept('ruler','panovník')|e] volený z elít krajiny a vládne doživotne.\nAvšak dóža môže byť i zvrhnutý, ak jeho popularita u [ShowEstateTypeName('nobles_estate')] alebo u [ShowEstateTypeName('burghers_estate')] poklesne." # todo: NEW TRANSLATION # todo: CONCEPT CASE

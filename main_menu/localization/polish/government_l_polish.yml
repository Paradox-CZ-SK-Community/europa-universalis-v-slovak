 veche_selection_desc: "Je to typ [Concept('heir_selection','nástupnícke právo')|e] [ShowGovernmentTypeName('republic')], pri ktorom je [Concept('ruler','panovník')|e] vybraný medzi jedným alebo viacerými kandidátmi ľudovým zhromaždením alebo Veche.\n\n$veche_selection_best_candidate_desc$" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 veche_selection_best_candidate_desc: "Nový [Concept('ruler','panovník')|e] je vybraný pomocou [ShowCountryInteractionName('invite_prince')] [Concept('country_interaction','interakcie s krajinou')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 bank_selection_desc: "Je to typ [Concept('heir_selection','nástupnícke právo')|e] bankárskej rodiny, pri ktorom je [Concept('ruler','panovník')|e] vybraný medzi členmi dynastie." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 pirate_elective_desc: "Je to typ [Concept('heir_selection','nástupnícke právo')|e] pirátskej [ShowGovernmentTypeName('republic')], pri ktorom je [Concept('ruler','panovník')|e] vybraný medzi kandidátmi posádkami." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 cognatic_primogeniture_desc: "Ide o typ [Concept('heir_selection','nástupnícke právo')|e] [ShowGovernmentTypeName('monarchy')], ktorý nasleduje najstaršiu líniu vládnucej rodiny a uprednostňuje mužov pred ženami. Potomkovia zosnulého [Concept('heir','dediča')|e] zdedia miesto svojho rodiča v poradí dedenia pred ostatnými deťmi [Concept('ruler','panovníkom')|e]." # todo: CHANGED # todo: CONCEPT CASE
 absolute_cognatic_primogeniture_desc: "Ide o typ [Concept('heir_selection','nástupnícke právo')|e] [ShowGovernmentTypeName('monarchy')], ktorý nasleduje najstaršiu líniu vládnucej rodiny bez ohľadu na pohlavie. Potomkovia zosnulého [Concept('heir','dediča')|e] zdedia miesto svojho rodiča v poradí dedenia pred ostatnými deťmi [Concept('ruler','panovníkom')|e]." # todo: CHANGED # todo: CONCEPT CASE
 salic_law_desc: "Je to typ [Concept('heir_selection','nástupnícke právo')|e] [ShowGovernmentTypeName('monarchy')], pri ktorom je [Concept('ruler','panovník')|e] najstarší mužský potomok predchádzajúceho [ruler]. Ženské deti nikdy nemôžu dediť ani previesť právo na trón svojim synom." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 semi_salic_law_desc: "Je to typ [Concept('heir_selection','nástupnícke právo')|e] [ShowGovernmentTypeName('monarchy')], pri ktorom je [Concept('ruler','panovník')|e] najstarší mužský potomok predchádzajúceho [ruler]. Ženské deti nikdy nemôžu dediť, ale môžu previesť právo na trón svojim synom." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 partition_inheritance_desc: "Je to typ [Concept('heir_selection','nástupnícke právo')|e] [ShowGovernmentTypeName('monarchy')], pri ktorom je [Concept('ruler','panovník')|e] najstarší mužský potomok predchádzajúceho [ruler] a všetci ostatní mužskí potomkovia získavajú práva na menšie tituly a územia. Ženské deti nikdy nemôžu dediť ani previesť právo na trón svojim synom.\n\nKeď nový vládca nastúpi na trón, najmenej kontrolované provincie krajiny dostanú dodatočné penalizácie k ich [Concept('control','kontrola')|e], pretože sa rozdeľujú medzi bratmi nového vládcu." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 youngest_son_of_ruler_desc: "Je to typ [Concept('heir_selection','nástupnícke právo')|e] kráľovstva, pri ktorom je [Concept('ruler','panovník')|e] najmladší mužský potomok predchádzajúceho [ruler]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 fratricide_succesion: "Fratricída" # todo: NEW TRANSLATION
 fratricide_succesion_desc: "Je to typ [Concept('heir_selection','nástupnícke právo')|e] [ShowGovernmentTypeName('monarchy')], pri ktorom nový [Concept('ruler','panovníkovi')|e] nastupuje na trón, keď preukáže, že jeho majetok prevyšuje majetky rivalov, zvyčajne ich elimináciou." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 fratricide_succesion_best_candidate_desc: "Nový [Concept('ruler','panovník')|e] je vybraný, keď preukáže, že jeho majetok prevyšuje majetky rivalov, zvyčajne ich elimináciou." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 unigeniture: "Unigenitúra" # todo: NEW TRANSLATION
 unigeniture_desc: "Systém dedenia založený na jednom dedičovi. Nástup najstaršieho syna kráľovskej rodiny môže viesť k napätiu medzi ostatnými potenciálnymi dedičmi a členmi vládnucej dynastie v línii následnosti. To môže spôsobiť nestabilitu, keď ostatní synovia dostanú len menšie tituly." # todo: NEW TRANSLATION
 mamluk_succesion: "$mamluk$ sukcesia" # todo: NEW TRANSLATION
 mamluk_succesion_desc: "$mamluk_succesion_regency_desc$" # todo: NEW TRANSLATION
 oligarchic_elective_desc: "Je to typ [Concept('heir_selection','nástupnícke právo')|e] [ShowGovernmentTypeName('republic')], pri ktorom je [Concept('ruler','panovník')|e] vybraný z vrstiev vládnucej menšiny prostredníctvom [Concept('election','voľby')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 podesta_elective: "Elektívny podesta" # todo: NEW TRANSLATION
 podesta_elective_desc: "Je to typ [Concept('heir_selection','nástupnícke právo')|e] [ShowGovernmentTypeName('republic')], pri ktorom je [Concept('ruler','panovník')|e] vybraný z [Concept('country','krajiny')|e], ktorý má prítomnosť v [Concept('region','regióne')|e] svojho [Concept('capital','hlavnom meste')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 republic_4_year_terms_desc: "Je to typ [Concept('heir_selection','nástupnícke právo')|e] [ShowGovernmentTypeName('republic')], pri ktorom je [Concept('ruler','panovník')|e] zvolený [Concept('election','voľba')|e] na obdobie 4 rokov." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 republic_2_year_terms_desc: "Je to typ [Concept('heir_selection','nástupnícke právo')|e] [ShowGovernmentTypeName('republic')], pri ktorom je [Concept('ruler','panovník')|e] zvolený [Concept('election','voľba')|e] na obdobie 2 rokov." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 peasant_elective_desc: "Je to typ [Concept('heir_selection','nástupnícke právo')|e] [ShowGovernmentTypeName('republic')], pri ktorom je [Concept('ruler','panovník')|e] sedliak vybraný [Concept('election','voľba')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 theocratic_elective_desc: "Je to typ [Concept('heir_selection','nástupnícke právo')|e] [ShowGovernmentTypeName('theocracy')], pri ktorom je [Concept('ruler','panovník')|e] teokrat zvolený [Concept('election','voľba')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 bishopric_elective_desc: "Je to typ [Concept('heir_selection','nástupnícke právo')|e] [ShowGovernmentTypeName('theocracy')], pri ktorom je [Concept('ruler','panovník')|e] biskup zvolený [Concept('election','voľba')|e] medzi domácimi a zahraničnými kandidátmi." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 grandmaster_elective_desc: "Je to typ [Concept('heir_selection','nástupnícke právo')|e] [ShowGovernmentTypeName('theocracy')] s [ShowGovernmentReformName('military_order_reform')] [Concept('government_reform','reformou vlády')|e], pri ktorom je [Concept('ruler','panovník')|e] vybraný z rádov rádu prostredníctvom [Concept('election','voľby')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 abbot_elective_desc: "Je to typ [Concept('heir_selection','nástupnícke právo')|e] [ShowGovernmentTypeName('theocracy')], pri ktorom je [Concept('ruler','panovník')|e] opát zvolený [Concept('election','voľba')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 tribal_oldest_male_desc: "Je to typ [Concept('heir_selection','nástupnícke právo')|e] kmeňa, pri ktorom je [Concept('ruler','panovník')|e] najstarší mužský potomok predchádzajúceho [ruler]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 military_dictatorship: "Vojenská diktatúra" # todo: NEW TRANSLATION

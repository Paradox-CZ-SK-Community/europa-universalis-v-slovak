 order_of_calatrava_religious_order: "Rád Calatravy" # todo: NEW TRANSLATION
 order_of_calatrava_religious_order_desc: "Založil ho v roku 1158 cisterciánsky opát Raymond z Fitero, aby po odchode templárov bránil pevnosť Calatrava. Bol prvým vojenským rádom pôvodom z Kastílie." # todo: NEW TRANSLATION
 order_of_santiago_religious_order: "Rád Santiaga" # todo: NEW TRANSLATION
 order_of_santiago_religious_order_desc: "Vznikol okolo roku 1170, aby chránil pútnikov na ceste do Santiaga de Compostela a viedol svätú vojnu proti Maurom." # todo: NEW TRANSLATION
 order_of_alcantara_religious_order: "Rád Alcántary" # todo: NEW TRANSLATION
 order_of_alcantara_religious_order_desc: "Vznikol ako Rád San Julián del Pereiro okolo roku 1166 a meno Alcántara prijal po tom, čo mu bolo v roku 1218 udelené toto mesto." # todo: NEW TRANSLATION
 order_of_christ_religious_order: "Kristov rád" # todo: NEW TRANSLATION
 order_of_christ_religious_order_desc: "V roku 1319 ho založil portugalský kráľ Dinis ako nástupcu zrušeného rádu templárov. Prevzal ich portugalské majetky a svoje sídlo umiestnil do Tomaru." # todo: NEW TRANSLATION
 order_of_avis_religious_order: "Rád Avis" # todo: NEW TRANSLATION
 order_of_avis_religious_order_desc: "Portugalský rád, ktorý sa riadi benediktínskou regulou a je pomenovaný podľa mesta Avis, ktoré mu bolo udelené okolo roku 1211." # todo: NEW TRANSLATION
 order_of_montesa_religious_order: "Rád Montesy" # todo: NEW TRANSLATION
 order_of_montesa_religious_order_desc: "Založil ho v roku 1317 aragónsky kráľ Jakub II., aby prevzal zrušené majetky templárov a johanitov v Aragónskej korune. Jeho sídlom sa stal hrad Montesa vo Valencii." # todo: NEW TRANSLATION
 benedictine_order_religious_order: "Benediktínsky rád" # todo: NEW TRANSLATION
 benedictine_order_religious_order_desc: "Čierni mnísi, ktorí sa riadia regulou, ktorú v šiestom storočí napísal Benedikt z Nursie — základným kameňom západného mníšstva. Ich opáti patria k veľmožom Cirkvi." # todo: NEW TRANSLATION
 cistercian_order_religious_order: "Cisterciánsky rád" # todo: NEW TRANSLATION
 cistercian_order_religious_order_desc: "Prísna reforma z Cîteaux, založená v roku 1098 s cieľom vrátiť sa k dôslednému dodržiavaniu benediktínskej reguly. Jej bieli mnísi a laickí bratia sú známi kultivovaním pôdy a jej obrábaním na svojich kláštorných statkoch." # todo: NEW TRANSLATION
 augustine_order_religious_order: "Augustiniánsky rád" # todo: NEW TRANSLATION
 augustine_order_religious_order_desc: "Spoločenstvá kňazov žijúcich spoločne podľa reguly svätého Augustína, ktorí nie sú celkom mníchmi ani svetskými duchovnými. Ich kláštory slúžia katedrálam, prevádzkujú školy a nemocnice a vedú farnosti." # todo: NEW TRANSLATION
 dominican_order_religious_order: "Dominikánsky rád" # todo: NEW TRANSLATION
 dominican_order_religious_order_desc: "Rád kazateľov založený Dominikom de Guzmánom na boj proti heréze vzdelanosťou a hovoreným slovom. Jeho mnísi obsadzujú univerzitné katedry a z veľkých kazateľníc kresťanstva obhajujú cirkevné učenie." # todo: NEW TRANSLATION
 franciscan_order_religious_order: "Františkánsky rád" # todo: NEW TRANSLATION
 franciscan_order_religious_order_desc: "Menší bratia Františka z Assisi, zaviazaní k absolútnej chudobe v napodobňovaní Krista. Pohybujú sa medzi chudobnými mešťanmi, žobrú si o chlieb a kážu vlastným príkladom." # todo: NEW TRANSLATION

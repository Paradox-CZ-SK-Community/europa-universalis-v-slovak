 wardens_calling: "Strážcovia" # todo: NEW TRANSLATION
 wardens_calling_desc: "Pohraničný rád ustanovený na stráženie dlhodobo existujúcej hranice." # todo: NEW TRANSLATION
 confidants_calling: "Dôverníci" # todo: NEW TRANSLATION
 confidants_calling_desc: "Bratstvo spojené s korunou, ktoré slúži vládnucej dynastii a jej správe." # todo: NEW TRANSLATION
 mariners_calling: "Moreplavci" # todo: NEW TRANSLATION
 mariners_calling_desc: "Námorný križiacky rád ustanovený na boj na mori a objavovanie území za hranicami kresťanstva." # todo: NEW TRANSLATION
 contemplatives_calling: "Kontemplatívci" # todo: NEW TRANSLATION
 contemplatives_calling_desc: "Kláštorný rád zasvätený modlitbe, liturgii a asketickému odvráteniu sa od sveta." # todo: NEW TRANSLATION
 scholars_calling: "Učenci" # todo: NEW TRANSLATION
 scholars_calling_desc: "Vzdelávací rád, ktorý odpisuje rukopisy, vzdeláva duchovných a rozvíja umenie i vedy." # todo: NEW TRANSLATION
 cultivators_calling: "Pestovatelia" # todo: NEW TRANSLATION
 cultivators_calling_desc: "Reformný rád mníchov a laických bratov, ktorí kultivujú neúrodnú pôdu a obrábajú ju na svojich kláštorných statkoch." # todo: NEW TRANSLATION
 preachers_calling: "Kazatelia" # todo: NEW TRANSLATION
 preachers_calling_desc: "Rád mníchov zasvätený kázaniu, obracaniu neveriacich a obrane učenia." # todo: NEW TRANSLATION
 almoners_calling: "Almužníci" # todo: NEW TRANSLATION
 almoners_calling_desc: "Mnísi zaviazaní k chudobe, ktorí žobrú o chlieb a rozdávajú ho, pričom sa starajú o chudobných a chorých." # todo: NEW TRANSLATION
 confessors_calling: "Spovedníci" # todo: NEW TRANSLATION

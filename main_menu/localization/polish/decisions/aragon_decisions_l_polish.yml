 ara_coronate_ruler.desc.entry: "Nový panovník, ktorý nastúpil na trón, si nebude môcť riadne zabezpečiť vernosť [ShowEstateTypeName('nobles_estate')] a [ShowEstateTypeName('peasants_estate')], pokiaľ sa neuskutoční náležitý korunovačný obrad. Nekorunovaný panovník nie je uznaným panovníkom." # todo: NEW TRANSLATION

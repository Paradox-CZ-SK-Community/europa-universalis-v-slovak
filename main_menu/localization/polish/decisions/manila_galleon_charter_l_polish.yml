 charter_manila_galleon.title: "Vypraviť manilskú galeónu" # todo: NEW TRANSLATION
 charter_manila_galleon.desc: "Keď je spiatočná trasa cez Tichý oceán zmapovaná a overená, oceán už nie je prekážkou, ale cestou. Vybavme na našom západnom pobreží veľkú galeónu, naplňme jej podpalubie striebrom a pošlime ju severnou trasou do Ázie a späť — striebro na cestu tam, hodváb a korenie na cestu domov. Náklady sú vysoké a plavba dlhá, no jediná bezpečne navrátivšia sa galeóna sa nám mnohonásobne vyplatí. Do roka sa nevráti a more si ju ešte môže vziať; ale ak sa vráti domov, prinesie so sebou aj bohatstvo." # todo: NEW TRANSLATION
 charter_manila_galleon.a: "Vybavme galeónu a naložme na ňu striebro z tejto sezóny." # todo: NEW TRANSLATION

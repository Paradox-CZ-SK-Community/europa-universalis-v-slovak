 build_panama_canal.desc: "Naši inžinieri preskúmali úzky pás Nového sveta. Výstavba prieplavu, ktorý by spojil dva veľké oceány, je možná. Náklady budú obrovské, no odmena nevyčísliteľná." # todo: NEW TRANSLATION

l_polish:
 hab_monastery_reform_melk_decision.title: "Reformné hnutie v [ShowLocationNameWithNoTooltip('melk')]" # todo: NEW TRANSLATION
 hab_monastery_reform_melk_decision.desc: "Niektorí členovia nášho [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] sa zišli v oblasti [ShowLocationName('melk')], aby prediskutovali postupný úpadok mníšskej kultúry v krajine [ROOT.GetCountry.GetAltAdjective('D')]. S pribúdajúcimi sťažnosťami je čoraz jasnejšie, že naše kláštory naliehavo potrebujú reformy. Ak budeme konať rýchlo, môžeme sa stať žiarivým príkladom [ROOT.GetCountry.GetReligion.GetAdjective] reforiem." # todo: NEW TRANSLATION # todo: COUNTRY CASE
 hab_monastery_reform_melk_decision.desc.entry: "Kláštor, ktorý zabudol na svoju regulu, má pre nás menšiu cenu než prázdne pole, a tie naše už roky upadajú. Zhromaždenie v [ShowLocationName('melk')] nám poskytuje zámienku konať, kým sa na nás pozerá [ShowReligionAdjective('catholic')] svet, a ukázať sa ako vodcovia, nie nasledovníci." # todo: NEW TRANSLATION
 hab_monastery_reform_melk_decision.a: "Zaviesť reformy." # todo: NEW TRANSLATION
 hab_monastery_reform_melk_decision.b: "Súčasné pomery nám vyhovujú." # todo: NEW TRANSLATION
 hab_vienna_concordat_decision.title: "Konkordát z [ShowLocationNameWithNoTooltip('vienna')]" # todo: NEW TRANSLATION
 hab_vienna_concordat_decision.desc: "Po dlhých rokovaniach s pápežskými delegáciami sme konečne dospeli k dohode, ktorá vyhovuje záujmom krajiny [ROOT.GetCountry.GetAltAdjective('G')] aj krajiny [GetCountry('PAP').GetName]. Po stáročiach nepriateľstva a nedôvery medzi [GetUniqueInternationalOrganization('hre').GetName] a [GetUniqueInternationalOrganization('catholic_church').GetLeaderTitle] by to mohol byť prelomový okamih v našich vzťahoch a vytvoriť medzi nami priateľské väzby." # todo: NEW TRANSLATION # todo: COUNTRY CASE
 hab_vienna_concordat_decision.desc.entry: "Cisári a pápeži sa celé stáročia sporili o to, kto koho vymenúva, a tento spor nepriniesol úžitok nikomu. Dohoda s pápežom by nám odobrala časť slobody pri menovaní, no výmenou by sme získali niečo, čo sme nikdy nemali: pápežstvo, ktoré nepovažuje $hre$ za svojho súpera." # todo: NEW TRANSLATION
 hab_vienna_concordat_decision.a: "Podpísať zmluvu!" # todo: NEW TRANSLATION
 hab_vienna_concordat_decision.b: "Pomoc [GetUniqueInternationalOrganization('catholic_church').GetLeaderTitle] nepotrebujeme." # todo: NEW TRANSLATION
 hab_monastery_reform_accepted_decision.title: "Rada [ShowBuildingTypeNameWithNoTooltip('monastery')] krajiny [ROOT.GetCountry.GetAltAdjectiveWithNoTooltip('G')]" # todo: NEW TRANSLATION # todo: COUNTRY CASE
 hab_monastery_reform_accepted_decision.title.entry: "Rada [ShowBuildingTypeNameWithNoTooltip('monastery')] krajiny $HAB$" # todo: NEW TRANSLATION
 hab_monastery_reform_accepted_decision.desc: "Reformácia zasahuje našu krajinu a má vážne dôsledky aj pre našu organizáciu [ShowBuildingTypeName('monastery')]. [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] sa sťažuje na nedostatok nových členov v budovách typu [ShowBuildingTypeNameWithNoTooltip('monastery')] a na ich zúfalý finančný stav. Mohli by sme ustanoviť radu, ktorá by prevzala správu [ShowBuildingTypeNameWithNoTooltip('monastery')] v nádeji, že problém vyrieši." # todo: NEW TRANSLATION
 hab_monastery_reform_accepted_decision.desc.entry: "Prázdne noviciáty a prázdne pokladnice sú najprv správnymi, a až potom duchovnými problémami. Rada, ktorá by spravovala financie každého [ShowBuildingTypeName('monastery')] v našich krajinách, by ich mohla dať do poriadku oveľa rýchlejšie, než to $clergy_estate$ zvládne samo." # todo: NEW TRANSLATION
 hab_monastery_reform_accepted_decision.a: "Reformovať štruktúru [ShowBuildingTypeNameWithNoTooltip('monastery')]." # todo: NEW TRANSLATION
 hab_monastery_reform_accepted_decision.a.tt: "Odomkne [ShowProductionMethodName('hab_reformed_monastery_maintenance')] pre všetky budovy typu [ShowBuildingTypeNameWithNoTooltip('monastery')] v našej krajine." # todo: NEW TRANSLATION
 hab_monastery_reform_accepted_decision.b: "Budú sa musieť prispôsobiť sami." # todo: NEW TRANSLATION
 hab_tractatus_incorporalibus_decision.title: "Ťažkosti [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('peasants_estate')]" # todo: NEW TRANSLATION
 hab_tractatus_incorporalibus_decision.title.entry: "Ťažkosti $peasants_estate$" # todo: NEW TRANSLATION
 hab_tractatus_incorporalibus_decision.desc: "Zástupcovia [ROOT.GetCountry.GetGovernment.GetEstateName('peasants_estate')] oslovili [target_ruler.GetName] so žiadosťou o pomoc, keďže ich postavenie oslabujú pokračujúce útrapy spôsobené vojnou. Hoci nám na názoroch týchto roľníkov veľmi nezáleží, nemožno poprieť, že na zaistenie potrebných daní a vojenskej podpory potrebujeme ich spoluprácu. Ak im udelíme súbor zákonov upravujúcich ich povinnosti voči zemepánom, môžeme usporiadať vzťahy medzi oboma stranami a zabezpečiť ich právne vynútiteľnosť, čím uľahčíme riešenie budúcich sporov." # todo: NEW TRANSLATION
 hab_tractatus_incorporalibus_decision.desc.entry: "O povinnostiach, ktoré spočívajú len na zvyku, sa vedú spory pri každej neúrode, a vojna zmenila každú úrodu na neúrodu. Ak povinnosti $peasants_estate$ spíšeme, zaviažeme ich rovnako pevne ako ich zemepánov. Roľník, ktorý presne vie, čo dlhuje, je roľník, ktorý to aj zaplatí." # todo: NEW TRANSLATION
 hab_tractatus_incorporalibus_decision.a: "Udeliť im privilégium." # todo: NEW TRANSLATION
 hab_tractatus_incorporalibus_decision.b: "[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('peasants_estate')] sa opovažuje od nás niečo požadovať?" # todo: NEW TRANSLATION
 hab_tractatus_incorporalibus_decision.b.entry: "$peasants_estate$ sa opovažuje od nás niečo požadovať?" # todo: NEW TRANSLATION
 hab_geheime_kabinettskanzlei_decision.title: "[ShowGovernmentReformNameWithNoTooltip('geheime_kabinettskanzlei')]" # todo: NEW TRANSLATION
 hab_geheime_kabinettskanzlei_decision.desc: "Špionáž môže byť nespoľahlivým remeslom, najmä keď sa musíme spoliehať na priame kontakty s jednotlivcami. Iné krajiny už zriadili inštitúcie, ktoré sa týmto potrebám venujú, a teraz by sme si mali jednu z takýchto čiernych komôr vytvoriť aj my. [ShowGovernmentReformName('geheime_kabinettskanzlei')] by svoju činnosť vykonávala pod záštitou poštového úradu, vďaka čomu by mala ľahký prístup k pošte prechádzajúcej našou krajinou." # todo: NEW TRANSLATION
 hab_geheime_kabinettskanzlei_decision.a: "[ROOT.GetCountry.Custom('common_string_ok')]" # todo: NEW TRANSLATION
 hab_geheime_kabinettskanzlei_decision.a.entry: "$common_string_alright$" # todo: NEW TRANSLATION
 hab_geheime_kabinettskanzlei_decision.a_tt: "Odomkne [ShowGovernmentReformName('geheime_kabinettskanzlei')] [Concept('government_reform','reforma vlády')|e]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 hab_geheime_kabinettskanzlei_decision.b: "Spravodajstvo je zbytočná vec." # todo: NEW TRANSLATION
 hab_geheimer_rat_decision.title: "Zavedenie inštitúcie [ShowAdvanceNameWithNoTooltip('geheimrat')]" # todo: NEW TRANSLATION
 hab_geheimer_rat_decision.desc: "Hoci bolo naše nedávne zriadenie [ShowAdvanceName('geheimrat')] všeobecne oslavované, niektorí na našom dvore [ROOT.GetCountry.GetGovernment.GetCourtTitle] sa pýtajú, či takáto neformálna inštitúcia postačuje. Tvrdia, že by sa azda mala stať pevnou súčasťou politiky [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')], aby na záležitosti [ROOT.GetCountry.GetFlavorRank] vplývali len tí najdôveryhodnejší a najschopnejší jednotlivci." # todo: NEW TRANSLATION
 hab_geheimer_rat_decision.desc.entry: "Neformálny kruh poradcov vydrží presne tak dlho ako panovník, ktorý ho zhromaždil. Ak bude [ShowAdvanceName('geheimrat')] zakotvená v úradoch $crown_estate$, pretrvá aj po nás a záležitosti ríše zostanú v rukách niekoľkých mužov, ktorým sa dajú zveriť." # todo: NEW TRANSLATION
 hab_geheimer_rat_decision.a: "Urobiť z neho stálu inštitúciu!" # todo: NEW TRANSLATION
 hab_geheimer_rat_decision.a.tt: "Odomkne udalosti o významných osobnostiach, ktoré boli členmi [ShowGovernmentReformName('hab_geheimer_rat')]." # todo: NEW TRANSLATION
 hab_geheimer_rat_decision.b: "Jeho súčasná podoba plní svoj účel." # todo: NEW TRANSLATION
 hab_privilegium_maius_decision.title: "Privilegium Maius v našich rukách" # todo: NEW TRANSLATION
 hab_privilegium_maius_decision.desc: "Teraz, keď sme boli zvolení za [GetUniqueInternationalOrganization('hre').GetLeaderTitle], môžeme konečne napraviť vážnu chybu našich predchodcov na poste [GetUniqueInternationalOrganization('hre').GetLeaderTitle]. Ako vodca [GetUniqueInternationalOrganization('hre').GetName] môžeme udeliť privilégiá, ktoré si dynastia [target_ruler.GetDynasty.GetName] zaslúži." # todo: NEW TRANSLATION
 hab_privilegium_maius_decision.desc.entry: "Predchádzajúci cisári nám odopreli úplné uznanie našich oprávnených privilégií. Teraz, keď nám na hlave spočíva cisárska koruna, je konečne čas napraviť túto krivdu." # todo: NEW TRANSLATION
 hab_privilegium_maius_decision.a: "Je čas napraviť túto krivdu." # todo: NEW TRANSLATION
 hab_privilegium_maius_decision.privilegium_not_granted_tt: "Privilegium Maius ešte nebolo udelené v plnom rozsahu" # todo: NEW TRANSLATION
 hab_privilegium_maius_decision.privilegium_not_decided_tt: "Je po roku 1370 a Privilegium Maius ešte nebolo navrhnuté" # todo: NEW TRANSLATION

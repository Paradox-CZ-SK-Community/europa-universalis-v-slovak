l_polish:
 mos_prikazi_decision.title: "Zriadiť úrady $prikazi_reform$" # todo: NEW TRANSLATION
 mos_prikazi_decision.desc: "Neprítomnosť efektívnej správy sa považuje za prekážku, ktorá bráni krajine [ROOT.GetCountry.GetAltAdjective('D')] zaujať právoplatné miesto medzi veľmocami. Správu by sme mohli zlepšiť zriadením niekoľkých úradov, ktoré by dohliadali na rôzne oblasti štátnych záležitostí. Tie by následne urýchlili vykonávanie rozličných nariadení, ktoré vydáva [ROOT.GetCountry.GetGovernment.GetRuler.GetName], a pomohli centralizovať moc." # todo: NEW TRANSLATION # todo: COUNTRY CASE
 mos_prikazi_decision.desc.entry: "Vládca, ktorý podpíše nariadenie, nemá záruku, že si ho niekto v odľahlých končinách vôbec prečíta, nieto ešte poslúchne. Stále úrady, z ktorých každý zodpovedá za jednu oblasť štátnych záležitostí, by šírili vládcu slovo ďalej, než by to kedy dokázala jeho povesť." # todo: NEW TRANSLATION
 mos_prikazi_decision.a: "Ako inak máme fungovať?" # todo: NEW TRANSLATION
 mos_prikazi_decision.b: "Voľná ruka je receptom na úspech." # todo: NEW TRANSLATION
 mos_prikazi_decision.tt1: "Zriadi sa niekoľko úradov, ktoré umožnia [Concept('cabinet_members','členovia kabinetu')|e] dohliadať na ne prostredníctvom [Concept('cabinet_action','akcie kabinetu')|e]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 enable_prikazi_reform: "Umožní prístup k [ShowGovernmentReformName('prikazi_reform')] [Concept('government_reform','reforme vlády')|e]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 mos_prikazi_decision.historical_info: "Prikazy boli správne úrady, ktoré existovali za čias cárstva a na začiatku Ruskej ríše. Zohrávali kľúčovú úlohu pri uskutočňovaní cárových politík a rozhodnutí, no zaoberali sa aj každodennými štátnymi záležitosťami. Niektoré z väčších úradov sa venovali zahraničným veciam a boli kľúčové v čase, keď sa Rusko cítilo obkľúčené nepriateľmi a stále zápasilo o nezávislosť od Zlatej hordy." # todo: NEW TRANSLATION
 mos_razriadnyi_decision.title: "[ShowGovernmentReformNameWithNoTooltip('razriadnyi_reform')]" # todo: NEW TRANSLATION
 mos_razriadnyi_decision.desc: "Záznamov o obyvateľstve, majetku a daniach je málo, čo sťažuje kontrolu výdavkov aj financovanie rozšírenia našej správy. Mohli by sme vykonávať pravidelné sčítanie ľudu prostredníctvom novozriadeného úradu [ShowGovernmentReformName('razriadnyi_reform')], ktorý by zhromažďoval podrobné údaje o jednotlivcoch a domácnostiach v celej krajine [ROOT.GetCountry.GetAltAdjective('D')], aby sme mohli vyhodnotiť zdroje a povinnosti našich poddaných." # todo: NEW TRANSLATION # todo: COUNTRY CASE
 mos_razriadnyi_decision.desc.entry: "Pokladnica, ktorá nedokáže spočítať svojich poddaných, ich nemôže ani spravodlivo zdaniť. Naša už celé roky iba háda. Stály úrad pre sčítanie ľudu by presne zistil, koľko mužov a peňazí dokážeme získať, čo sa oplatí vedieť ešte pred prvým ťažením, ktoré tým financujeme." # todo: NEW TRANSLATION
 mos_razriadnyi_decision.a: "Prehľadajme každý kút." # todo: NEW TRANSLATION
 mos_razriadnyi_decision.b: "Je to zásah do súkromia a osobnej integrity." # todo: NEW TRANSLATION
 enable_razriadnyi_reform: "Umožní prístup k [ShowGovernmentReformName('razriadnyi_reform')] [Concept('government_reform','reforme vlády')|e]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 mos_razriadnyi_decision.historical_info: "Vojenská kancelária, #italic Razriadnyj prikaz#!, zaviedla nové sčítanie ľudu, aby určila daňovú povinnosť obyvateľstva podľa jeho bohatstva, majetku a spoločenského postavenia. Zároveň sa tak zabezpečilo, že každý stav poskytne požadovaný počet vojakov a vojnového materiálu v súlade so svojimi povinnosťami. Tieto záznamy sa stali nevyhnutnými na správu rozsiahleho a rozmanitého územia." # todo: NEW TRANSLATION
 mos_build_kremlin_decision.title: "Postaviť Kremeľ" # todo: NEW TRANSLATION
 mos_build_kremlin_decision.desc: "Krajiny Rusi opakovane čelia nájazdom, a preto musíme v časoch ťažkostí dokázať ochrániť našich ľudí. Opevnenie v okolí [target_location.GetName] nedokáže túto úlohu splniť a mohlo by padnúť, čím by sa oddialil náš vzostup medzi regionálne mocnosti.\n\nMali by sme postaviť mohutné opevnenie s hradbami, ktoré sa vyrovnajú všetkému v okolí." # todo: NEW TRANSLATION
 mos_build_kremlin_decision.desc.entry: "Nájazdníci nečakajú, kým sa hradby dokončia, a vyskúšajú ich hneď, ako budú môcť. Naše by takú skúšku neprežili. Prestavba obrany [ShowLocationName('moscow')] stojí majetok, ktorý by sme radšej nemíňali, no strata mesta by nás stála ešte oveľa viac." # todo: NEW TRANSLATION
 mos_build_kremlin_decision.a: "Nech privezie to najkvalitnejšie drevo [ShowGoodsNameWithNoTooltip('lumber')]." # todo: NEW TRANSLATION
 mos_build_kremlin_decision.b: "Nechceme provokovať susedov." # todo: NEW TRANSLATION
 mos_build_kremlin_decision.c: "Zabavme materiál z hradu [ShowBuildingTypeNameWithNoTooltip('castle')] nášho poddaného." # todo: NEW TRANSLATION
 threatened_by_military_expansion: "Ohrození vojenskou expanziou" # todo: NEW TRANSLATION
 safe_haven_during_raids: "Poskytuje útočisko počas nájazdov" # todo: NEW TRANSLATION
 mos_build_kremlin_decision.tt1: "Susední rivali považujú výstavbu mohutného opevnenia [ShowBuildingTypeNameWithNoTooltip('kremlin')] za nepriateľský čin" # todo: NEW TRANSLATION
 mos_build_kremlin_decision.tt2: "Susední poddaní považujú výstavbu mohutného opevnenia [ShowBuildingTypeNameWithNoTooltip('kremlin')] za bezpečné útočisko počas nájazdov" # todo: NEW TRANSLATION
 mos_build_kremlin_decision.a.custom1: "Každá susedná krajina stráca [ShowBiasValue('threatened_by_military_expansion')|+=0] [Concept('opinion','názor')|e] o nás" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 mos_build_kremlin_decision.a.custom2: "Každý susedný [Concept('subject','vazal')|e] získava [ShowBiasValue('safe_haven_during_raids')|+=0] [Concept('opinion','názor')|e] o nás" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 mos_build_kremlin_decision.b.custom1: "Každá susedná krajina získava #G 3#! [Concept('trust','dôvera')|e] voči nám" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 mos_build_kremlin_decision.b.custom2: "Každý susedný [Concept('subject','vazal')|e] stráca [ShowBiasValue('lack_of_protection')|+=0] [Concept('opinion','názor')|e] o nás" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 lack_of_protection: "Nedostatok ochrany" # todo: NEW TRANSLATION
 mos_kremlin_construction: "Výstavba Kremľa" # todo: NEW TRANSLATION
 mos_build_kremlin_decision.tt3: "Takmer všetok potrebný [ShowGoodsName('clay')] a [ShowGoodsName('lumber')] sa získa násilným zbúraním [ShowBuildingTypeNameWithNoTooltip('castle')] v jednej z provincií našich poddaných" # todo: NEW TRANSLATION
 mos_build_kremlin_decision.historical_info: "Pôvodný moskovský Kremeľ bol postavený prevažne z dreva a časom zahŕňal nielen hradby a veže, ale aj mnohé správne budovy. Jeho výstavba bola nákladným projektom, považovala sa však za nevyhnutnú, keďže jednoduché drevené opevnenia, ktoré sa dovtedy používali, opakovane zlyhávali pri tatárskych nájazdoch zameraných na získavanie otrokov a pri obliehaniach nepriateľmi." # todo: NEW TRANSLATION
 mos_vestiarium_decision.title: "Vestiárium" # todo: NEW TRANSLATION
 mos_vestiarium_decision.desc: "Kráľovská pokladnica nemá riadnu evidenciu ani nijaký inventár, takže je náročné určiť celkovú hodnotu nahromadeného majetku. Musíme nájsť spôsob, ako lepšie spravovať naše bohatstvo, pretože nám môže pomôcť dosiahnuť diplomatické ciele a posilniť správu celej krajiny." # todo: NEW TRANSLATION
 mos_vestiarium_decision.a: "Efektívna správa je kľúčom k úspechu." # todo: NEW TRANSLATION
 mos_vestiarium_decision.b: "Musíme utkať pavučinu diplomacie." # todo: NEW TRANSLATION
 mos_vestiarium_decision.custom: "Sprístupní [Concept('law','zákon')|e] [ShowLawName('vestiarium')]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 mos_vestiarium_decision.historical_info: "#italic Vestiárium#! Vasilija I. bol súpis cenností patriacich kráľovskej pokladnici. Zaviedli ho na vytvorenie finančných záznamov a inventára všetkého od drahých kovov, šperkov, látok a odevov až po predmety používané pri štátnych obradoch a ako diplomatické dary." # todo: NEW TRANSLATION
 mos_byzantine_court_ceremonies_decision.title: "Puto so starou dynastiou $BYZ_ADJ$" # todo: NEW TRANSLATION
 mos_byzantine_court_ceremonies_decision.desc: "Pád [ShowLocationName('constantinople')] nám otvoril možnosť sobášiť sa s bývalou vládnucou vrstvou krajiny [GetCountry('BYZ').GetName]. Sobáš so [sophia_palaiologina.GetName] by priniesol kultúrne vplyvy [GetCountry('BYZ').GetAdjectiveWithNoTooltip] na náš dvor [ROOT.GetCountry.GetGovernment.GetCourtTitle], posilnil naše nároky na prirodzené nástupníctvo Rímskej ríše a úlohu nositeľov viery [ShowReligionAdjective('orthodox')]. Každý potomok vládcu [ROOT.GetCountry.GetGovernment.GetRulerTitle] by sa navyše mohol hlásiť k pôvodu od cisárov padnutej ríše." # todo: NEW TRANSLATION
 mos_byzantine_court_ceremonies_decision.desc.entry: "Koruna získaná dobytím je stále korunou vzatou násilím; koruna spojená sobášom však pripomína dedičstvo. Spojením našej dynastie s krvou [ShowLocationName('constantinople')] by si každé dieťa z tohto zväzku mohlo jedného dňa nárokovať pôvod od cisárov, nie iba od dobyvateľov." # todo: NEW TRANSLATION
 mos_byzantine_court_ceremonies_decision.a: "Sobáš predurčený proroctvom." # todo: NEW TRANSLATION
 mos_byzantine_court_ceremonies_decision.a_tt: "Náš vládca si vezme potomka byzantskej vládnucej dynastie a v prípade potreby sa rozvedie so súčasným manželským partnerom." # todo: NEW TRANSLATION
 mos_byzantine_court_ceremonies_decision.b: "Neprináša veľa výhod." # todo: NEW TRANSLATION
 mos_byzantine_court_ceremonies_decision.tt1: "Potomok vládnucej byzantskej dynastie sa pridá ako [Concept('character','postava')|e]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 enable_byzantine_court_ceremonies_reform: "Umožní prístup k [ShowGovernmentReformName('byzantine_court_ceremonies_reform')] [Concept('government_reform','reforme vlády')|e]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 mos_byzantine_court_ceremonies_decision.tt2: "Jej nevraživosť voči niektorým diplomatom zhorší diplomatické vzťahy medzi nami a našimi [Concept('heathen','neznabohom')|e] susedmi" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 STATIC_MODIFIER_NAME_mongol_intolerance: "Mongolská neznášanlivosť" # todo: NEW TRANSLATION
 mos_byzantine_court_ceremonies_decision.historical_info: "Sobáš Ivana III. a Sofie Palaiologovny priniesol na moskovský dvor zložité dvorské obrady a etiketu, čím posilnil jeho nárok na titul Tretieho Ríma. Sofia porodila jedenásť detí a stala sa starou matkou neslávne známeho Ivana Hrozného. Jej neznášanlivosť voči mongolskej nadvláde viedla k viacerým diplomatickým incidentom a pomohla urýchliť odtrhnutie Moskovského kniežatstva od Zlatej hordy v roku 1480." # todo: NEW TRANSLATION
 mos_monastic_reformation_decision.title: "Zaviesť učenie Nila Sorského" # todo: NEW TRANSLATION
 mos_monastic_reformation_decision.desc: "Duchovný priekopník Nil Sorský presadzuje reformu cirkvi v reakcii na bohatstvo a materializmus, ktoré prenikli do niektorých [ROOT.GetCountry.GetAdjective] kláštorov. Jeho hnutie, známe ako nepraživci, navrhuje návrat k zásadám chudoby a pokory s dôrazom na jednoduchý život plne oddaný Kristovmu učeniu. Takéto pokusy pravdepodobne narazia na odpor zavedenej cirkvi, ktorá sa domnieva, že si musí zachovať určité hmotné bohatstvo, aby mohla plniť svoje poslanie." # todo: NEW TRANSLATION
 mos_monastic_reformation_decision.desc.entry: "Nil Sorský káže, že mních, ktorý vlastní pôdu, už stratil právo tvrdiť, že sa zriekol všetkého ostatného. Dostatočná časť duchovenstva s ním súhlasí, aby to cirkev znepokojovalo. Podpora nepraživcov nás pripraví o priazeň každého bohatého kláštora, no získa nám oddanosť mníchov, ktorí o majetok nikdy nestáli." # todo: NEW TRANSLATION
 mos_monastic_reformation_decision.a: "Podporme nepraživcov." # todo: NEW TRANSLATION
 mos_monastic_reformation_decision.b: "Podporme majetných." # todo: NEW TRANSLATION
 mos_monastic_reformation_decision.custom1: "Sprístupní [Concept('law','zákon')|e] [ShowLawName('monastic_reformation_movement')]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 mos_monastic_reformation_decision.custom2: "Politiku [Concept('policy','politiku')|e] v rámci zákona [ShowLawName('monastic_reformation_movement')] [Concept('law','zákona')|e] možno zmeniť iba raz za desať rokov" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 mos_monastic_reformation_decision.historical_info: "Nil Sorský bol ruský pravoslávny mních, ktorý pomohol sformovať hnutie známe ako nepraživci. Tvorili ho mnísi, ktorí sa usilovali o prísne dodržiavanie mníšskej chudoby a kritizovali vlastníctvo pôdy a bohatstva kláštormi. Niektorí členovia cirkvi, ktorí odmietali navrhované zmeny, sa postavili proti jeho učeniu. Napriek tomu zanechalo trvalú stopu v ruskej duchovnosti a Nil Sorský je dnes vo východnej pravoslávnej cirkvi uctievaný ako svätec." # todo: NEW TRANSLATION
 mos_stroganov_school_decision.title: "Založiť Stroganovovu školu" # todo: NEW TRANSLATION
 mos_stroganov_school_decision.desc: "Bohatá kupecká rodina [ShowDynastyName('stroganov_dynasty')] výrazne podporuje umenie a zvažuje založenie miestnej školy na tvorbu náboženských ikon, z ktorých mnohé by zdobili ich početné paláce v celej krajine [ROOT.GetCountry.GetFlavorRank]. Všetky diela vytvorené školou by boli určené výhradne na súkromné použitie a krajine ako celku by pravdepodobne nepriniesli úžitok. Získali by sme si však priazeň mocnej rodiny a prispeli k duchovnému blahu krajiny [ROOT.GetCountry.GetAltAdjective('G')]." # todo: NEW TRANSLATION # todo: COUNTRY CASE
 mos_stroganov_school_decision.desc.entry: "[ShowDynastyName('stroganov_dynasty')] chcú ikony pre svoje kaplnky, nie svätcov pre národ, a sú ochotní za to zaplatiť. Škola financovaná ich peniazmi nevytvorí nič, čo by pokladnica mohla minúť, iba rodinu, ktorá nám bude menej zaviazaná a bude od nás viac očakávať." # todo: NEW TRANSLATION
 mos_stroganov_school_decision.a: "Pomôžeme si navzájom." # todo: NEW TRANSLATION
 mos_stroganov_school_decision.b: "Radšej podporte ich obchod." # todo: NEW TRANSLATION
 mos_stroganov_school_decision.c: "Dovoľme im uplatniť vplyv na dvore." # todo: NEW TRANSLATION
 enable_stroganov_influences_cabinet_action: "Akcia [ShowCabinetActionName('stroganov_influences')] [Concept('cabinet_action','akcia kabinetu')|e] sa sprístupní členom dynastie [ShowDynastyNameWithNoTooltip('stroganov_dynasty')]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 mos_stroganov_school_decision.historical_info: "Stroganovova škola ikonopisectva vznikla v období rozkvetu stredovekého maliarstva v Rusku, ešte pred nástupom westernizácie umenia, ktorá sa neskôr rozšírila do východnej Európy. Tvorba školy odrážala predovšetkým vkus kráľovských a šľachtických mecenášov, medzi ktorých napokon patril aj cár. Škola sa tešila obľube až do založenia Petrohradu, ktoré urýchlilo jej úpadok, keďže sa postupne presadzovali západné vplyvy." # todo: NEW TRANSLATION
 mos_novodevichy_convent_decision.title: "Novodevičijský kláštor" # todo: NEW TRANSLATION
 mos_novodevichy_convent_decision.desc: "Po víťaznom dobytí oblasti [ShowAreaName('smolensk_area')] sa naskytá príležitosť pripomenúť si víťazstvo a zároveň posilniť južný obranný pás [ShowLocationName('moscow')] na ochranu krajiny [ROOT.GetCountry.GetAltAdjective('G')]. Nápad postaviť opevnený kláštor vychádza zo strategickej nevyhnutnosti, mohol by však poskytnúť domov aj mnohým ženám zo stavu [ShowPopTypeName('nobles')], ktoré boli nútené vstúpiť do kláštora, a tým si získať priazeň stavov [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]." # todo: NEW TRANSLATION # todo: COUNTRY CASE
 mos_novodevichy_convent_decision.desc.entry: "Víťazstvo má väčšiu cenu, keď ho pripomína niečo kamenné a trvalé. Opevnený kláštor južne od [ShowLocationName('moscow')] by strážil prístup získaný v oblasti [ShowAreaName('smolensk_area')] a zároveň by poskytol útočisko dcéram zo stavu [ShowPopTypeName('nobles')], ktoré si nikto iný nechce vziať. Je to výhoda, po ktorej bude stav $nobles_estate$ túžiť, hoci to nikdy neprizná." # todo: NEW TRANSLATION
 mos_novodevichy_convent_decision.a: "Za málo peňazí veľa muziky." # todo: NEW TRANSLATION
 mos_novodevichy_convent_decision.b: "[ShowLocationNameWithNoTooltip('moscow')] je už dostatočne chránená." # todo: NEW TRANSLATION
 mos_novodevichy_convent_decision.c: "Ponúknime dotáciu postihnutým ženám." # todo: NEW TRANSLATION
 mos_novodevichy_convent_decision.historical_info: "Novodevičijský kláštor založil veľkoknieža Vasilij III. na počesť úspešného dobytia oblasti Smolenska. Zriadili ho ako pevnosť a náboženskú inštitúciu na ochranu západných prístupov k mestu. Kláštor poskytoval útočisko aj ženám z ruských kráľovských rodín, ktoré boli nabádané, aby vstúpili do kláštora." # todo: NEW TRANSLATION
 mos_limit_namestnik_decision.title: "Moc namestnikov" # todo: NEW TRANSLATION
 mos_limit_namestnik_decision.desc: "Namestnici, čiže miestodržitelia, majú rozsiahle právomoci, ktoré im umožňujú spravovať aj najodľahlejšie oblasti krajiny [ROOT.GetCountry.GetAltAdjective('G')]. Toto usporiadanie prináša viacero problémov: prichádzame o značnú časť príjmov a len ťažko si udržiavame ich poslušnosť. Mali by sme sa usilovať o priamu kontrolu nad správou regiónov a centralizovať správu, možno aj na úkor miestnych elít." # todo: NEW TRANSLATION # todo: COUNTRY CASE
 mos_limit_namestnik_decision.desc.entry: "Miestodržiteľ, ktorý spravuje provinciu bez dohľadu, čoskoro začne vládnuť, akoby patrila jemu. Priama správa z centra by nám vrátila príjmy, ktoré si namestnikovia v súčasnosti nechávajú pre seba, no prišli by sme tým o lojalitu miestnych elít, na ktorej spočíva celý tento systém." # todo: NEW TRANSLATION
 mos_limit_namestnik_decision.a: "Je načase nechať to v minulosti." # todo: NEW TRANSLATION
 mos_limit_namestnik_decision.b: "Nepokazme to, čo funguje." # todo: NEW TRANSLATION
 disable_namestnik_policy: "[ShowPolicyName('namestnik_policy')] [Concept('policy','Politika')|e] sa stáva nedostupnou" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 mos_limit_namestnik_decision.historical_info: "Namestnici mali v Rusku rozsiahle správne a výkonné právomoci a pôsobili ako panovníkovi zástupcovia vo vzdialených územiach. Za vlády Ivana IV. boli ich právomoci do istej miery obmedzené, pretrvali však až do série reforiem, ktoré zaviedol Peter Veľký v rámci celkovej prestavby ruskej správy." # todo: NEW TRANSLATION
 mos_posolsky_prikaz_decision.title: "Posolský prikaz" # todo: NEW TRANSLATION
 mos_posolsky_prikaz_decision.desc: "Usilovná práca [ivan_viskovatiy.GetName] priniesla výsledky: zahraničné záležitosti sa spravujú efektívnejšie a byrokracia je jednoduchšia. Teraz sa navrhuje zriadiť samostatný úrad pre diplomaciu a podobné záležitosti, aby sa aj v tejto oblasti dodržiavali rovnaké štandardy ako v ostatných oblastiach správy." # todo: NEW TRANSLATION
 mos_posolsky_prikaz_decision.desc.entry: "$name_john.east_slavic_language$ $Viskovatiy$ už nejaký čas efektívne spravuje zahraničné záležitosti bez riadneho úradu. Ak toto usporiadanie zmeníme na trvalé, nebude nás to stáť nič, čo by jeho schopnosti už potichu neposkytovali." # todo: NEW TRANSLATION
 mos_posolsky_prikaz_decision.a: "Rozumná voľba." # todo: NEW TRANSLATION
 mos_posolsky_prikaz_decision.b: "Dielňa na medzinárodné intrigy." # todo: NEW TRANSLATION
 enable_posolsky_cabinet_action: "Umožní prístup k [ShowCabinetActionName('posolsky')] [Concept('cabinet_action','akcii kabinetu')|e]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 mos_posolsky_prikaz_decision.historical_info: "#italic Posolský prikaz#! bol vládnym úradom zodpovedným za zahraničné a diplomatické záležitosti. Zohrával dôležitú úlohu pri správe diplomatických vzťahov, vysielaní vyslancov a riadení medzinárodných záležitostí." # todo: NEW TRANSLATION
 mos_moscow_artillery_yard_decision.title: "[ShowLocationNameWithNoTooltip('moscow')] Moskovská delostrelecká zbrojnica" # todo: NEW TRANSLATION
 mos_moscow_artillery_yard_decision.desc: "S rozvojom delostreleckej techniky na bojisku je čoraz dôležitejšie zabezpečiť armáde dostatočnú zásobu munície a diel, aby mohla pokračovať vo vojnovom úsilí. Mali by sme poveriť našich inžinierov zriadením špecializovaného závodu na výrobu delostrelectva, ktorý premení [ShowLocationName('moscow')] na centrum technologických inovácií a spoľahlivého dodávateľa." # todo: NEW TRANSLATION
 mos_moscow_artillery_yard_decision.a: "Skvelý obchod." # todo: NEW TRANSLATION
 mos_moscow_artillery_yard_decision.b: "Radšej venujme čas vojenskému výcviku." # todo: NEW TRANSLATION
 mos_moscow_artillery_yard_decision.historical_info: "Moskovská delostrelecká zbrojnica bola postavená za vlády Ivana IV. a zohrala dôležitú úlohu pri posilňovaní vojenských schopností Ruska. Výroba kanónov a delostrelectva bola kľúčová pre rastúci vojenský vplyv Ruska a prispela k jeho úspechom vo viacerých konfliktoch." # todo: NEW TRANSLATION
 mos_ban_oprichniki_decision.title: "Nájazdy opričníkov" # todo: NEW TRANSLATION
 mos_ban_oprichniki_decision.desc: "Opričníci naďalej popravujú ľudí, ktorých považujú za nelojálnych. Nedávno sa ich terčom stalo niekoľko vidieckych sídiel [ShowPopTypeName('nobles')], v dôsledku čoho boli [ShowPopTypeName('peasants')] pracujúci na ich pôde vysídlení. Zároveň im bolo zakázané opustiť domácnosť, ku ktorej boli pridelení. Ak túto situáciu rýchlo nevyriešime, hrozí nám chronický nedostatok potravín." # todo: NEW TRANSLATION
 mos_ban_oprichniki_decision.a: "Ukončime pôsobenie opričníkov." # todo: NEW TRANSLATION
 mos_ban_oprichniki_decision.b: "To sa nás netýka." # todo: NEW TRANSLATION
 STATIC_MODIFIER_NAME_displaced_farmers: "Vysídlení roľníci" # todo: NEW TRANSLATION
 disable_oprichnik_policy: "[ShowPolicyName('oprichnik_policy')] [Concept('policy','Politika')|e] sa stáva nedostupnou" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 mos_ban_oprichniki_decision.historical_info: "Opričníci sa podieľali na konfiškácii majetku ľudí označených za nepriateľov štátu. Táto prax ešte viac upevnila hospodársku moc cára a jeho verných stúpencov, mala však neželaný následok: roľníci boli vysídľovaní a vyháňaní, keďže ich bývalí páni boli zabití alebo zajatí. To zasa zničujúco zasiahlo produkciu potravín, pretože polia zostávali neobrábané." # todo: NEW TRANSLATION
 mos_aptekarsky_prikaz_decision.title: "Aptekársky prikaz" # todo: NEW TRANSLATION
 mos_aptekarsky_prikaz_decision.desc: "Vládne úrady zriadené v súlade s reformou [ShowGovernmentReformName('prikazi_reform')] majú každý v štátnej správe svoju osobitnú úlohu, no nedávna morová nákaza zdôrazňuje potrebu opäť sa sústrediť na zdravie a blaho našich poddaných. Musíme zriadiť samostatný úrad, ktorý bude lepšie koordinovať potrebné opatrenia, keď nás postihne ďalší boží trest či smrtiaca nákaza, inak riskujeme nedostatok schopných pracovníkov na obrábanie pôdy a obranu nášho veľkého [ROOT.GetCountry.GetFlavorRank]." # todo: NEW TRANSLATION
 mos_aptekarsky_prikaz_decision.desc.entry: "Úrady Prikazu nie sú dobre vybavené na zvládanie epidémií ani na zavádzanie opatrení v oblastiach našej krajiny postihnutých morom. Mali by sme popri existujúcich úradoch zriadiť nový, samostatný úrad, ktorý bude pomáhať, ak našu populáciu opäť zasiahne mor." # todo: NEW TRANSLATION
 mos_aptekarsky_prikaz_decision.a: "Pijavice a púšťanie žilou pre všetkých." # todo: NEW TRANSLATION
 mos_aptekarsky_prikaz_decision.b: "Stačí nám modlitba." # todo: NEW TRANSLATION
 mos_aptekarsky_prikaz_decision.tt1: "Dvor sa raduje z prednostnej lekárskej starostlivosti, ktorú Aptekarský prikaz poskytuje vyšším spoločenským vrstvám" # todo: NEW TRANSLATION
 enable_aptekarsky_cabinet_action: "Udeľuje prístup k [ShowCabinetActionName('aptekarsky')] [Concept('cabinet_action','akcii kabinetu')|e]" # todo: RETRANSLATED ENGLISH # todo: CONCEPT CASE
 mos_aptekarsky_prikaz_decision.historical_info: "Aptekarský prikaz bol vládnym úradom so širokým rozsahom povinností. Dohliadal na výrobu a distribúciu liekov, reguloval lekárne a riešil otázky verejného zdravia. Zodpovedal aj za zdravie a blaho cára a jeho dvora. Aptekarský prikaz zostal dôležitou súčasťou správy cisárskeho Ruska až do svojho zrušenia po revolúcii v roku 1917." # todo: NEW TRANSLATION
 mos_bolshogo_dvortsa_prikaz_decision.title: "$bolshogo_dvortsa$" # todo: NEW TRANSLATION
 mos_bolshogo_dvortsa_prikaz_decision.desc: "Guvernér [alexey_lvov.GetName] z [ShowLocationName('nizhny_novgorod')] sa nedávno vrátil na dvor, aby sa ujal povinností okolničiho, vysokého úradníka, ktorý môže prevziať ďalšie správne úlohy. V súlade s reformou [ShowGovernmentReformName('prikazi_reform')] by sme mohli túto funkciu rozšíriť a vytvoriť nový prikaz, ktorý by dohliadal na záležitosti paláca a správu kláštorov. Jeho cieľom by bolo lepšie hospodáriť s výdavkami dvora a zabezpečiť úplné zavedenie politiky [ShowPolicyName('non_possessors')]." # todo: NEW TRANSLATION
 mos_bolshogo_dvortsa_prikaz_decision.desc.entry: "$name_alexis.east_slavic_language$ sa už teší dôvere, ktorú prináša hodnosť okolničiho; chýba mu len úrad, ktorý by jej zodpovedal. Zverením palácových majetkov a kláštorov do rúk jediného verného človeka by sme napravili správu, ktorá sa o ne dlhodobo stará nedostatočne a oddelene." # todo: NEW TRANSLATION
 mos_bolshogo_dvortsa_prikaz_decision.a: "Vhodné riešenie." # todo: NEW TRANSLATION
 mos_bolshogo_dvortsa_prikaz_decision.b: "Ďalší dohľad netreba." # todo: NEW TRANSLATION
 enable_bolshogo_dvortsa_cabinet_action: "Udeľuje prístup k [ShowCabinetActionName('bolshogo_dvortsa')] [Concept('cabinet_action','akcii kabinetu')|e]" # todo: RETRANSLATED ENGLISH # todo: CONCEPT CASE
 enable_bolshogo_dvortsa_cabinet_action.tt2: "[ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] sa teší dôvere, ktorú sme mu prejavili" # todo: NEW TRANSLATION
 mos_bolshogo_dvortsa_prikaz_decision.historical_info: "Knieža Alexey Mikhaylovich Lvov bol zástupcom guvernéra, ktorý rýchlo postupoval v cárskej správe. Viedol diplomatické delegácie a po vymenovaní za správcu cárskeho dvora pôsobil ako veľvyslanec. Stál na čele úradu pre záležitosti paláca a túto funkciu zastával až do svojho odchodu do dôchodku." # todo: NEW TRANSLATION
 mos_greek_latin_academy_decision.title: "Založiť $greek_latin_academy$" # todo: NEW TRANSLATION
 mos_greek_latin_academy_decision.desc: "Zbožný učenec pochádzajúci z [ShowLocationName('polotsk')] predložil návrh na založenie jazykovej akadémie, ktorá by sa zameriavala najmä na výučbu diplomatického jazyka, teda [latin.GetName], vládnym úradníkom. [simon_sitnianowicz.GetName], ktorý sa kontroverzných myšlienok nebojí, navrhol aj to, aby mu zverili výučbu gramatiky, poetiky a rétoriky pre obyčajných ľudí. Takúto iniciatívu by sme mali podporiť vyčlenením finančných prostriedkov, ktoré zabezpečia jej uskutočnenie." # todo: NEW TRANSLATION
 mos_greek_latin_academy_decision.desc.entry: "Naši diplomati neovládajú dostatočne [ShowLanguageName('latin_language')], čo výrazne škodí našim zahraničným záležitostiam. $name_simeon.east_slavic_language$ $Sitnianowicz$ navrhuje, že ho bude riadne vyučovať, a ponúkol sa aj, že bude obyčajných ľudí učiť rétorike, aby si jazyk lepšie osvojili." # todo: NEW TRANSLATION
 mos_greek_latin_academy_decision.a: "Kľúčom je komunikácia." # todo: NEW TRANSLATION
 mos_greek_latin_academy_decision.b: "Čas možno lepšie využiť na kázne a modlitby." # todo: NEW TRANSLATION
 mos_greek_latin_academy_decision.c: "Najmieme ho ako súkromného učiteľa." # todo: NEW TRANSLATION
 mos_greek_latin_academy_decision.d: "Ľud musí zostať v nevedomosti." # todo: NEW TRANSLATION
 mos_greek_latin_academy_decision.tt1: "$name_simeon.east_slavic_language$ $Sitnianowicz$ je pridaný ako [Concept('character','postava')|e]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 mos_greek_latin_academy_decision.tt2: "Venuje svoj čas šíreniu osvietených myšlienok a tvorbe poézie" # todo: NEW TRANSLATION
 mos_greek_latin_academy_decision.tt3: "[ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] s uspokojením sleduje vyhnanstvo muža s neortodoxnými názormi." # todo: NEW TRANSLATION
 mos_greek_latin_academy_decision.historical_info: "Symeon z Polocka bol bieloruský pravoslávny mních, básnik a prekladateľ, známy svojím literárnym prínosom, ktorý sa považuje za zásadný pre vznik pravoslávnej kresťanskej tradície. Do Ruska priniesol výučbu gréčtiny a latinčiny a počas života pomáhal prekladať diela viacerých západných teológov, čím uľahčil šírenie poznania v pravoslávnej cirkvi." # todo: NEW TRANSLATION
 mos_collegium_decision.title: "Kolégiá" # todo: NEW TRANSLATION
 mos_collegium_decision.desc: "Nedávna reorganizácia vládnych orgánov si vyžiadala účinnejšiu správu ministerstiev, aby sa predišlo prekrývaniu ich právomocí. Zrušme existujúci systém [ShowGovernmentReformName('prikazi_reform')] a nahraďme ho sústavou kolégií. Každé kolégium bude mať vlastné úlohy a oddelené právomoci a na požiadanie bude poskytovať rady v nevyriešených prípadoch." # todo: NEW TRANSLATION
 mos_collegium_decision.a: "Staré nech odíde, nové nech príde." # todo: NEW TRANSLATION
 mos_collegium_decision.b: "Správa štátu je citlivá záležitosť, s ktorou sa nesmie zahrávať." # todo: NEW TRANSLATION
 variable_prikazi_tt: "Systém prikazov spravuje štát" # todo: NEW TRANSLATION
 enable_collegium_reform: "Umožní prístup k [ShowGovernmentReformName('collegium_reform')] [Concept('government_reform','reforme vlády')|e]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 mos_collegium_decision.tt1: "[Concept('government_reform','Reforma vlády')|e] [ShowGovernmentReformNameWithNoTooltip('prikazi_reform')] a všetky súvisiace [Concept('cabinet_action','akcia kabinetu')|e] už nebudú dostupné" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 mos_collegium_decision.tt2: "Prijímajú sa opatrenia na zlepšenie správy [ShowLocationName('neva')] v súlade s [Concept('policy','politikou')|e] [ShowPolicyName('dop_law_governing_senate')]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 mos_collegium_decision.historical_info: "Po zriadení Vládneho senátu Peter Veľký založil rôzne kolégiá, správne orgány zodpovedné za jednotlivé oblasti štátnej správy, ako napríklad synodu a admirálsku radu. Inšpiráciu čerpal z podobných reforiem, ktoré nedávno zaviedlo susedné Švédsko. Potrebu reformy ešte umocňoval rastúci počet území Ruskej ríše." # todo: NEW TRANSLATION
 mos_sukharev_tower_decision.title: "Sucharevova veža" # todo: NEW TRANSLATION
 mos_sukharev_tower_decision.desc: "Námorníctvo potrebuje stály prísun schopných námorníkov a odovzdávanie vedomostí z generácie na generáciu. Aby sme naplnili naše námorné ambície, mali by sme založiť školu poskytujúcu technické vzdelanie a pripraviť tak pôdu na ďalšie rozširovanie ozbrojených síl. Nedávno bol predložený návrh majestátnej veže, v ktorej by takáto inštitúcia mohla sídliť a ktorá by zároveň skrášlila panorámu mesta [ShowLocationName('moscow')]." # todo: NEW TRANSLATION
 mos_sukharev_tower_decision.a: "Cieľ hodný našich ambícií." # todo: NEW TRANSLATION
 mos_sukharev_tower_decision.b: "Takýto prepych nepotrebujeme." # todo: NEW TRANSLATION
 mos_sukharev_tower_decision.tt1: "Najvyššie poschodie je vyhradené pre Jamesa Brucea, ktorý tu zriadi astronomické observatórium s nádherným výhľadom na hviezdy" # todo: NEW TRANSLATION
 mos_sukharev_tower_decision.tt2: "Na druhom poschodí vybudujú moderný systém zásobovania vodou v prospech [ShowLocationName('moscow')]" # todo: NEW TRANSLATION
 mos_sukharev_tower_decision.historical_info: "Sucharevova veža bola postavená koncom 17. storočia na pripomenutie víťazstva Petra Veľkého nad strelcami, ktorí proti nemu v predchádzajúcich rokoch povstali. V priebehu rokov slúžila na rôzne účely: ako kasárne, škola, súčasť infraštruktúry aj sklad pre obchodníkov. V roku 1934 ju sovietske úrady napokon zbúrali." # todo: NEW TRANSLATION
 mos_chosen_rada_decision.title: "Vybraná rada" # todo: NEW TRANSLATION
 mos_chosen_rada_decision.desc: "Moc [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] brzdí centralizáciu právomocí potrebnú na rýchle rozhodovanie. Navrhlo sa vytvorenie výkonnej rady vybraných jednotlivcov, ktorá by urýchlila vládne postupy a obmedzila vplyv šľachticov, a zároveň umožnila riešiť rozmanité problémy a zavádzať potrebné reformy. [alexi_adashev.GetName] a [sylvestr_the_priest.GetName] sú blízkymi priateľmi [ROOT.GetCountry.GetGovernment.GetRulerTitle] a očakáva sa, že zasadajú v rade." # todo: NEW TRANSLATION
 mos_chosen_rada_decision.desc.entry: "Rada obľúbencov sa zodpovedá panovníkovi; $nobles_estate$ sa nezodpovedá nikomu, a práve v tom je problém. Ak postavíme $name_alexander.east_slavic_language$ $adashev$ a $name_silvester.east_slavic_language$ do centra vlády, presunieme rozhodovanie zo zhromaždenia do miestnosti, ktorú skutočne ovládame." # todo: NEW TRANSLATION
 mos_chosen_rada_decision.a: "Mocná skupina schopných mužov." # todo: NEW TRANSLATION
 mos_chosen_rada_decision.a_tt: "$name_alexander.east_slavic_language$ $adashev$ a $name_silvester.east_slavic_language$ sa pridajú k nášmu [Concept('court','dvoru')|e]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 mos_chosen_rada_decision.b: "Takáto rada nebude mať žiadny vplyv." # todo: NEW TRANSLATION
 mos_chosen_rada_decision.tt3: "$name_alexander.east_slavic_language$ $adashev$ a $name_silvester.east_slavic_language$ sú na radosť [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')] prenasledovaní a popravení" # todo: NEW TRANSLATION
 enable_chosen_rada_reform: "Umožní prístup k [ShowGovernmentReformName('chosen_rada_reform')] [Concept('government_reform','reforme vlády')|e]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 mos_chosen_rada_decision.historical_info: "Vybraná rada bola skupinou poradcov, ktorí zohrali významnú úlohu v prvých rokoch vlády Ivana IV. Tvorili ju napríklad Alexi Adašev a kňaz Sylvestr, dôveryhodní poradcovia veľkokniežaťa Ivana IV. Pomáhali mu centralizovať moc, reformovať právny systém a riešiť rozličné problémy štátu." # todo: NEW TRANSLATION
 rus_russian_absolutism_decision.title: "Zásadná reforma štátnej správy" # todo: NEW TRANSLATION
 rus_russian_absolutism_decision.desc: "Nadišiel čas zmodernizovať správu [ROOT.GetCountry.GetAltAdjective('A')] a zbaviť sa zastaraných tradícií a neefektívnych spôsobov vládnutia. Posilnením zákonodarnej moci [ROOT.GetCountry.GetGovernment.GetRulerTitle] a zabezpečením toho, aby [ROOT.GetCountry.GetGovernment.GetRuler.GetHisHer] nariadenia rýchlo vykonával koordinovaný a centralizovaný vládny orgán, môžeme pokročiť vpred a zaistiť, že reformy nezmarí korupcia ani zdĺhavé odvolania." # todo: NEW TRANSLATION # todo: COUNTRY CASE
 rus_russian_absolutism_decision.desc.entry: "Nariadenie, ktoré musí najprv prejsť radou, kým sa môže uplatniť v praxi, je už napoly porazené. Sústredením právomoci do rúk panovníka a jediného koordinovaného ministerstva umožníme reformám predbehnúť odvolania a prieťahy, ktoré pochovali všetky predchádzajúce pokusy." # todo: NEW TRANSLATION
 rus_russian_absolutism_decision.a: "Nový začiatok." # todo: NEW TRANSLATION
 rus_russian_absolutism_decision.b: "Starý spôsob je lepší!" # todo: NEW TRANSLATION
 enable_russian_absolutism_reform: "Umožní prístup k [ShowGovernmentReformName('russian_absolutism')] [Concept('government_reform','reforme vlády')|e]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 rus_russian_absolutism_decision.tt1: "[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] pobúri otvorené pohŕdanie ich výsadami a nárokmi" # todo: NEW TRANSLATION
 rus_russian_absolutism_decision.historical_info: "Počas vlády Petra Veľkého nahradil stredoveké a zastarané formy vlády účinnou autokraciou. V roku 1711 zrušil bojarskú radu a zriadil senát ako najvyšší štátny orgán, ktorý koordinoval činnosť centra a miestnych úradov, dohliadal na príjmy a pripravoval zákony. Na civilné inštitúcie sa vzťahovala vojenská disciplína a v senáte držal službu gardový dôstojník." # todo: NEW TRANSLATION
 rus_state_controlled_church_decision.title: "Štátny dohľad" # todo: NEW TRANSLATION
 rus_state_controlled_church_decision.desc: "Patriarchát si zachováva značnú moc a vplyv, naďalej však bráni pokroku a inováciám v prospech tradícií a hromadenia cirkevnej moci. Musíme ho zrušiť a nahradiť novým systémom, ktorý posilní kontrolu vlády nad cirkvou a zabezpečí jej poslušnosť voči štátu." # todo: NEW TRANSLATION
 rus_state_controlled_church_decision.a: "Zrušiť patriarchát." # todo: NEW TRANSLATION
 rus_state_controlled_church_decision.b: "$common_string_leave_them_be$" # todo: NEW TRANSLATION
 rus_state_controlled_church_decision.c: "Všetko po starom, za určitú cenu." # todo: NEW TRANSLATION
 rus_state_controlled_church_decision.tt1: "Svätá synoda zavádza prísnu cenzúru všetkých publikácií" # todo: NEW TRANSLATION
 rus_state_controlled_church_decision.historical_info: "V roku 1721 Peter Veľký zrušil moskovský patriarchát, aby podriadil pravoslávnu cirkev štátu. Patriarchu nahradila Svätá synoda, duchovné kolégium zastupujúce vôľu cára. Na dohľad nad Svätou synodou bol vymenovaný oberprokurátor. Synoda neúprosne prenasledovala odporcov a zavádzala cenzúru publikácií." # todo: NEW TRANSLATION
 rus_academy_of_sciences_decision.title: "Akadémia vied" # todo: NEW TRANSLATION
 rus_academy_of_sciences_decision.desc: "Je dôležité podporovať vedomosti a vedecké bádanie, aby [ROOT.GetCountry.GetName] držalo krok so svetom. Navrhnime založenie akadémie vied v našom novom centre osvietenstva a premeňme ho na baštu inovácií v matematike, astronómii, fyzike, chémii a ďalších odboroch." # todo: NEW TRANSLATION
 rus_academy_of_sciences_decision.desc.entry: "Veľmoc, ktorá dováža matematiku a fyziku, bude vždy zaostávať za mocnosťami, ktoré si ich rozvíjajú samy. Akadémia vied v našom najnovšom meste by jasnejšie než akékoľvek víťazstvo svetu oznámila, že $RUS$ sa chce zaradiť medzi ne." # todo: NEW TRANSLATION
 rus_academy_of_sciences_decision.a: "Duševná sila musí držať krok s vojenskou." # todo: NEW TRANSLATION
 rus_academy_of_sciences_decision.b: "Pokrok vďaka dialógu." # todo: NEW TRANSLATION
 rus_academy_of_sciences_decision.tt1: "Príspevky $name_basil.east_slavic_language$ $tatishchev$ výrazne urýchľujú založenie akadémie a podporujú jej rozvoj v [ShowLocationName('neva')]" # todo: NEW TRANSLATION
 rus_academy_of_sciences_decision.tt2: "Literárne diela $name_james$ $Bruce$ sa pridávajú do zbierky akadémie a obohacujú jej odborné zdroje" # todo: NEW TRANSLATION
 rus_academy_of_sciences_decision.tt3: "Najlepšie hlavy našej krajiny aktívne udržiavajú rozsiahlu korešpondenciu s ďalšími vzdelávacími inštitúciami v Európe, vymieňajú si myšlienky a uprednostňujú diplomaciu" # todo: NEW TRANSLATION
 rus_academy_of_sciences_decision.historical_info: "Petrohradskú akadémiu vied založil Peter Veľký po svojej dlhej ceste po Európe v rámci Veľkého posolstva. Inšpiráciu čerpala z parížskej akadémie aj Kráľovskej spoločnosti v Londýne, ktoré mali podobný cieľ podporovať vedecký a odborný výskum. Akadémia zohrala dôležitú úlohu v rozvoji vedeckého poznania a kultúry v Rusku." # todo: NEW TRANSLATION
 rus_manifesto_of_freedom_decision.title: "Manifest slobody" # todo: NEW TRANSLATION
 rus_manifesto_of_freedom_decision.desc: "Vládnutie si vyžaduje stabilnú krajinu a silného panovníka, ktorý pevne drží opraty moci. V súčasnosti narastá nespokojnosť s rozhodnutiami [ROOT.GetCountry.GetGovernment.GetRuler.GetName] a bolo by rozumné zabezpečiť si podporu [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')], kým sa situácia nezlepší. Ponúknime štedré ústupky, ktoré [ShowPopTypeName('nobles')] oslobodia od štátnej služby a zaručia im ďalšie občianske slobody. Budeme sa tak môcť sústrediť na stabilizáciu krehkej absolutistickej vlády, ktorú si v súčasnosti užívame." # todo: NEW TRANSLATION # todo: COUNTRY CASE
 rus_manifesto_of_freedom_decision.desc.entry: "Absolútny panovník nespokojný s $nobles_estate$ v skutočnosti nemá až takú absolútnu moc. Oslobodením $nobles_estate$ od povinnej služby prídeme o ich povinnosti voči štátu, no získame si ich priazeň $nobles_estate$ a poskytneme im menej dôvodov na sprisahanie, kým sa trón upevní." # todo: NEW TRANSLATION
 rus_manifesto_of_freedom_decision.a: "Nevyhnutné zlo." # todo: NEW TRANSLATION
 rus_manifesto_of_freedom_decision.b: "Nájdime kompromis." # todo: NEW TRANSLATION
 rus_manifesto_of_freedom_decision.c: "Poburujúca myšlienka." # todo: NEW TRANSLATION
 rus_manifesto_of_freedom_decision.tt1: "Rozsiahle výsady udelené [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] nemožno odvolať počas vlády nášho súčasného panovníka" # todo: NEW TRANSLATION
 revoke_manifesto_of_freedom: "Rozsiahle privilégiá udelené [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] zostávajú nezrušiteľné počas panovania panovníka, ktorý ich udelil." # todo: NEW TRANSLATION
 rus_manifesto_of_freedom_decision.tt2: "[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] využíva zúfalú situáciu krajiny a aktívne bráni vláde [target_root_country.GetGovernment.GetRuler.GetName]" # todo: NEW TRANSLATION
 rus_manifesto_of_freedom_decision.historical_info: "#italic Manifest slobody šľachty#! udelil cisár Peter III. počas svojej krátkej a neúspešnej vlády. K jeho vzniku prispelo viacero okolností. Peter si odcudzil väčšinu šľachty zmenou geopolitických spojenectiev, pre ktoré Rusko prišlo o významné vojenské víťazstvo nad Pruskom. V snahe upevniť svoju vládu znížil šľachte povinnosti a na ich úhradu skonfiškoval cirkevné pozemky, čím si znepriatelil duchovenstvo. Jeho naliehanie na zavedenie pruského vojenského výcviku v armáde takmer vyvolalo povstanie a jeho manželka Katarína ho napokon zosadila pri prevrate." # todo: NEW TRANSLATION
 rus_speransky_liberalization_decision.title: "Závan zmien" # todo: NEW TRANSLATION
 rus_speransky_liberalization_decision.desc: "Zavedenie nového ústavného systému zostáva hlavnou prioritou pokrokového priekopníka [mikhail_speransky.GetName], ktorý naďalej pôsobí vo vláde a vedie úsilie o zavedenie vhodných zmien. Privítajme vietor zmien a vyplávajme do neprebádaných vôd, pričom naším jediným kompasom bude liberalizmus." # todo: NEW TRANSLATION
 rus_speransky_liberalization_decision.desc.entry: "$name_michael.east_slavic_language$ $Speransky$ strávil roky prípravou ústavy, ktorú sa zatiaľ nikto neodvážil schváliť. Ak ho teraz podporíme, zaviažeme sa k reformám, ktorých podobu nedokážeme úplne predvídať. Práve preto sa každý panovník pred nami rozhodol počkať." # todo: NEW TRANSLATION
 rus_speransky_liberalization_decision.a: "V ústrety vetru!" # todo: NEW TRANSLATION
 rus_speransky_liberalization_decision.b: "Kontroverzné a nebezpečné." # todo: NEW TRANSLATION
 enable_speransky_liberalization_reform: "Umožní prístup k [ShowGovernmentReformName('speransky_liberalization_reform')] [Concept('government_reform','reforme vlády')|e]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 rus_speransky_liberalization_decision.tt1: "Napriek odporu [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] sa prijímajú pokrokové opatrenia na modernizáciu správy [target_root_country.GetName]" # todo: NEW TRANSLATION
 rus_speransky_liberalization_decision.historical_info: "Cár Alexander I. sa počas svojej vlády usiloval o reformy a uskutočnil rozsiahle zmeny. V roku 1802 zaviedol organizovanejšiu správu zriadením ôsmich ministerstiev, čím prejavil svoje odhodlanie vládnuť účinne. V tomto období mal veľký vplyv cársky poradca a zástanca modernizácie Michail Speranskij." # todo: NEW TRANSLATION
 rus_free_economic_society_decision.title: "Slobodná ekonomická spoločnosť" # todo: NEW TRANSLATION
 rus_free_economic_society_decision.desc: "Poľnohospodárstvo zostáva základom našej spoločnosti, no pestovateľské postupy a poľnohospodárske techniky, ktoré používajú [ShowPopTypeName('peasants')], sa nemenia a prinášajú nízke výnosy v porovnaní s konkurenčnými mocnosťami. Jeden z našich architektov navrhol, že za skromnú sumu založí hospodársku organizáciu na podporu poznatkov o poľnohospodárstve a obchode, a ponúkol sa, že prevezme vedúcu úlohu v jej správe.\n\nAk má byť organizácia úspešná, mala by sa usilovať aj o lepšie vzdelávanie roľníkov a odbornú prípravu kvalifikovaných pracovníkov. Môže im poskytovať praktické rady a vydávať odborné časopisy a výskumné práce." # todo: NEW TRANSLATION
 rus_free_economic_society_decision.desc.entry: "Roľník, ktorý obrába pôdu tak, ako to robil jeho starý otec, nenasýti viac hladných krkov než on. $name_gregory.east_slavic_language$ $Orlov$ ponúka, že na vlastnú päsť a za nízku cenu založí spoločnosť, ktorá bude vyučovať lepšie postupy. Jej sľuby o časopisoch a vzdelávaní roľníkov však idú nad rámec pôvodného návrhu." # todo: NEW TRANSLATION
 rus_free_economic_society_decision.a: "Musíme sa predsa uživiť." # todo: NEW TRANSLATION
 rus_free_economic_society_decision.b: "Takto to nepôjde." # todo: NEW TRANSLATION
 STATIC_MODIFIER_NAME_potato_varieties_introduced: "Zavedené odrody zemiakov" # todo: NEW TRANSLATION
 rus_free_economic_society_decision.tt1: "Spoločnosť zavádza nové odrody [ShowGoodsName('potato')] a prelomové pestovateľské postupy, čím zvyšuje úrodu" # todo: NEW TRANSLATION
 rus_free_economic_society_decision.tt2: " [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] tlieskajú úsiliu zachovať si svoje mocenské postavenie nad [ShowPopTypeName('peasants')]" # todo: NEW TRANSLATION
 rus_free_economic_society_decision.historical_info: "Slobodnú hospodársku spoločnosť založil Grigorij Orlov s podporou cárovnej Kataríny II., ktorá sama cítila, že poľnohospodárske postupy v Rusku sú zastarané a zaostávajú za ostatnými veľmocami, najmä Britániou. Spoločnosť vydala niekoľko odborných prác o nových poľnohospodárskych technikách a plodinách a organizovala vzdelávanie roľníkov, aby mohli efektívnejšie obrábať pôdu a produkovať viac potravín." # todo: NEW TRANSLATION
 rus_imperial_academy_arts_decision.title: "Imperiálna akadémia umení" # todo: NEW TRANSLATION
 rus_imperial_academy_arts_decision.desc: "Vizionársky reformátor [ivan_shuvalov.GetName] neúnavne pokračuje vo [ivan_shuvalov.GetHisHer] reformách vzdelávacieho systému a naďalej podporuje umenie. [ivan_shuvalov.GetSheHe|U] chce založiť akadémiu, ktorá bude presadzovať najvyššie štandardy v umení a architektúre a rozvíjať umelecký talent [ROOT.GetCountry.GetAdjective] tým, že jej najsľubnejších študentov vyšle študovať do inovatívnych miest po celej Európe. Podporme túto iniciatívu a vybudujme centrum kultúrneho pokroku, ktoré premení [ShowLocationName('neva')] na maják klasicizmu." # todo: NEW TRANSLATION
 rus_imperial_academy_arts_decision.desc.entry: "$name_john.east_slavic_language$ $Shuvalov$ už reformoval školy; teraz chce akadémiu, ktorá vyšle našich najsľubnejších maliarov a architektov študovať do zahraničia a privedie späť umelcov takých schopných, že [ShowLocationName('neva')] už nebude musieť preberať svoj vkus z Európy." # todo: NEW TRANSLATION
 rus_imperial_academy_arts_decision.a: "Šľachetný návrh." # todo: NEW TRANSLATION
 rus_imperial_academy_arts_decision.b: "Povinnosti v kabinete majú prednosť." # todo: NEW TRANSLATION
 rus_imperial_academy_arts_decision.c: "Keď to funguje, netreba to meniť." # todo: NEW TRANSLATION
 rus_imperial_academy_arts_decision.tt1: "Vážený $name_gregory.east_slavic_language$ $Orlov$ venuje novozaloženej akadémii značnú časť svojej umeleckej zbierky" # todo: NEW TRANSLATION
 rus_imperial_academy_arts_decision.tt2: "$name_john.east_slavic_language$ $Shuvalov$ sa sústredí výhradne na povinnosti [Concept('cabinet','kabinet')|e], vo svojej funkcii vyniká a zvyšuje latku verejnej služby" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 rus_imperial_academy_arts_decision.tt3: "Súčasné architektonické štýly sa upevnia a zažijú druhú renesanciu" # todo: NEW TRANSLATION
 rus_imperial_academy_arts_decision.historical_info: "Imperiálna akadémia umení bola umelecká akadémia na brehu rieky Nevy v Petrohrade. Založil ju v roku 1757 Ivan Šuvalov, štátnik a milovník umenia. Podporovala neoklasicistický štýl a techniku, usilovala sa napodobniť európske umelecké akadémie a pozývala zahraničných umelcov, aby učili ruských študentov." # todo: NEW TRANSLATION
 mos_moscow_orphanage_decision.title: "Sirotinec s dobrým úmyslom" # todo: NEW TRANSLATION
 mos_moscow_orphanage_decision.desc: "Člen kabinetu [ivan_betskoy.GetName] predkladá pozoruhodný návrh, ako riešiť jednu z najväčších spoločenských tragédií: opúšťanie novorodencov. Navrhuje sa zriadiť bezpečný útulok pre najbiednejších a poskytnúť im obživu aj vzdelanie, aby z nich vyrástli užitoční členovia spoločnosti. Otázka financovania zostáva nevyriešená, no zvažuje sa niekoľko uskutočniteľných možností, ako túto iniciatívu podporiť." # todo: NEW TRANSLATION
 mos_moscow_orphanage_decision.desc.entry: "Dieťa opustené pri narodení dnes štát nestojí nič, no o dvadsať rokov ho bude stáť veľmi veľa, tak či onak. $name_john.east_slavic_language$ $Betskoy$ navrhuje útulok, v ktorom z nich vyrastú užitoční poddaní — ak sa len nájde niekto, kto to zaplatí." # todo: NEW TRANSLATION
 mos_moscow_orphanage_decision.a: "Výnosná investícia." # todo: NEW TRANSLATION
 mos_moscow_orphanage_decision.b: "Šľachetný cieľ." # todo: NEW TRANSLATION
 mos_moscow_orphanage_decision.c: "Každý nech sa stará o seba." # todo: NEW TRANSLATION
 mos_moscow_orphanage_decision.tt1: "Sirotinec zriadil niekoľko súkromných bankových pobočiek, ktoré spravujú pôžičky a úspory na financovanie jeho prevádzky" # todo: NEW TRANSLATION
 mos_moscow_orphanage_decision.tt2: "Pokladnica poskytne štedré financovanie" # todo: NEW TRANSLATION
 mos_moscow_orphanage_decision.historical_info: "Moskovský sirotinec založili v roku 1763 pod vedením cárovnej Kataríny Veľkej a Ivana Betského, ministra v jej vláde a zanieteného zástancu vzdelávacích reforiem. Inštitúcia vznikla v čase, keď osvietenské ideály naberali na sile v Rusku aj v celej Európe. Napriek štedrému financovaniu ju sužovala vysoká úmrtnosť dojčiat a jej vplyv na životy opustených detí bol obmedzený, hoci niektoré z nich využili poskytnuté vzdelanie a vďaka nemu si našli zamestnanie." # todo: NEW TRANSLATION
 rus_institute_of_noble_maidens_decision.title: "Ústav šľachtičných" # todo: NEW TRANSLATION
 rus_institute_of_noble_maidens_decision.desc: "Vzdelávanie žien je naďalej predmetom vášnivých sporov a nadšený zástanca tejto myšlienky [ivan_betskoy.GetName] ho dôrazne podporuje. Zvolal kabinet so zámerom založiť výchovnú inštitúciu určenú na vzdelávanie cnostných žien. Tie by mali byť cenným prínosom pre rodinu aj spoločnosť. Zriaďme vhodnú budovu zasvätenú pokrokovým myšlienkam a inklúzii a začnime formovať novú generáciu, oslobodenú od škodlivého vplyvu nevzdelaných rodičov." # todo: NEW TRANSLATION
 rus_institute_of_noble_maidens_decision.desc.entry: "Dcéra vychovávaná iba pre domácnosť nič nezvládne mimo nej. $name_john.east_slavic_language$ $Betskoy$ chce inštitúciu, ktorá naučí mladé ženy byť niečím viac, a stavia na predpoklade, že vzdelaná matka vychová schopnejšiu ďalšiu generáciu než nevzdelaná." # todo: NEW TRANSLATION
 rus_institute_of_noble_maidens_decision.a: "Postavme ho." # todo: NEW TRANSLATION
 rus_institute_of_noble_maidens_decision.b: "[ShowLocationNameWithNoTooltip('moscow')] je na to vhodná." # todo: NEW TRANSLATION
 rus_institute_of_noble_maidens_decision.b.tt: "Ak je [ShowBuildingTypeNameWithNoTooltip('novodevichy_convent')] prítomný, zmeníme jeho účel. Inak postavíme [ShowBuildingTypeNameWithNoTooltip('institute_of_noble_maidens')] v [ShowLocationNameWithNoTooltip('moscow')]" # todo: NEW TRANSLATION
 rus_institute_of_noble_maidens_decision.c: "Ohrozenie zavedeného poriadku." # todo: NEW TRANSLATION
 rus_institute_of_noble_maidens_decision.tt1: "Vytlačené zriaďovacie listiny sa rozpošlú všetkým dievčatám z [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] a [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')]" # todo: NEW TRANSLATION
 rus_printed_charters: "Tlačené listiny" # todo: NEW TRANSLATION
 rus_institute_of_noble_maidens_decision.historical_info: "Ústav šľachtičných založil Ivan Betský s výraznou podporou cárovnej Kataríny Veľkej. Jeho cieľom bolo sprostredkovať ženám myšlienky vtedajších intelektuálov vrátane Voltaira a Locka. Dievčatá nastupovali do kláštora v útlom veku a na šesť rokov sa odlúčili od rodičov. Ústav niekoľkokrát zmenil sídlo a financoval sa z ročného poplatku, ktorý mal zaistiť jeho výlučnosť a zabrániť prijímaniu príslušníčok nižších spoločenských vrstiev." # todo: NEW TRANSLATION
 rus_nakaz_decision.title: "Nakaz" # todo: NEW TRANSLATION
 rus_nakaz_decision.desc: "Je čoraz dôležitejšie priviesť [ROOT.GetCountry.GetName] do novej éry osvietenstva a pokroku. Vhodnou cestou by bola vizionárska reforma zákonníka, založená na podnetných zásadách, ktoré sa šíria Európou, ako sú rozum, spravodlivosť a ľudskosť. Ak tieto hodnoty prijmeme, konečne sa zbavíme zastaraných právnych postupov, ktoré brzdia spoločenský rozvoj. Vydajme sa cestou reforiem a zaveďme rovnosť všetkých občanov pred zákonom." # todo: NEW TRANSLATION
 rus_nakaz_decision.desc.entry: "Potreba zaviesť nový zákonník je čoraz zjavnejšia a mnohí osvietenskí učenci žiadajú nášho vládcu o reformu práva. Jeho násilné presadenie by však mohlo vyvolať prudký odpor niektorých zložiek našej vlády." # todo: NEW TRANSLATION
 rus_nakaz_decision.a: "Pokrok môže bolieť." # todo: NEW TRANSLATION
 rus_nakaz_decision.b: "Uspokojme sa s reformou trestného práva." # todo: NEW TRANSLATION
 rus_nakaz_decision.c: "Nedovolíme si to." # todo: NEW TRANSLATION
 enable_nakaz_reform: "Umožní prístup k [ShowGovernmentReformName('nakaz_reform')] [Concept('government_reform','reforme vlády')|e]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 rus_nakaz_decision.tt1: "[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] poburuje hrozba pre ich mocenské postavenie" # todo: NEW TRANSLATION
 rus_nakaz_decision.tt3: "Ústupok konzervatívnym silám posilní ich program" # todo: NEW TRANSLATION
 rus_nakaz_decision.historical_info: "#italic Nakaz Pravilnosti#! alebo #italic Inštrukcia o zákonoch#! bol zákonník, ktorý zaviedla Katarína Veľká v snahe modernizovať a reformovať právny systém. Pod vplyvom osvietenských myšlienok sa usiloval vytvoriť právny systém v súlade s pokrokovou filozofiou doby a zároveň zákony zjednodušiť a sprehľadniť. Zaviedol humánnejšie tresty, obmedzil používanie mučenia a zdôraznil rovnosť všetkých občanov pred zákonom. Nakaz sa nikdy naplno neuskutočnil, pretože sa proti nemu postavili mnohé konzervatívne sily, a Katarína napokon obrátila pozornosť k iným prioritám." # todo: NEW TRANSLATION
 rus_intellectual_movements_decision.title: "Nástup nacionalizmu" # todo: NEW TRANSLATION
 rus_intellectual_movements_decision.desc: "Definícia a údajná nadradenosť kultúry [ShowCultureGroupName('slavic_group')] sú medzi učencami predmetom vášnivých sporov. Názory sa rozchádzajú v tom, či máme zaujať viac prozápadný postoj a zabezpečiť, aby [ROOT.GetCountry.GetName] neuviazlo v nekonečnom kruhu tradícií, alebo či sa nedoceňuje dôležitosť kontinuity, ktorá by mala zostať ústrednou súčasťou zachovania identity [ROOT.GetCountry.GetAdjectiveWithNoTooltip]. Tento rozkol viedol k vzniku dvoch odlišných intelektuálnych hnutí, ktoré nás chcú viesť opačnými smermi. Musíme si zvoliť cestu, ktorá zodpovedá našej predstave o budúcnosti." # todo: NEW TRANSLATION
 rus_intellectual_movements_decision.desc.entry: "Učenci sa rozdelili v otázke, či si identitu [ShowCultureGroupName('slavic_group')] zaslúži zachovať nedotknutú, alebo ju obetovať v mene západného pokroku. Spor sa vyostril a vytvorili sa dva tábory, ktoré nemôžu oba určovať budúcnosť $RUS$. Výber jednej strany druhá neprijme bez protestov." # todo: NEW TRANSLATION
 rus_intellectual_movements_decision.a: "Podporiť slavianofilov." # todo: NEW TRANSLATION
 rus_intellectual_movements_decision.b: "Podporiť zapadnikov." # todo: NEW TRANSLATION
 rus_intellectual_movements_decision.custom1: "Sprístupní [Concept('law','zákon')|e] [ShowLawName('intellectual_movements')]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 rus_intellectual_movements_decision.custom2: "[Concept('policy','Politika')|e] v rámci [Concept('law','zákona')|e] [ShowLawName('intellectual_movements')] možno zmeniť iba raz za desať rokov" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 rus_intellectual_movements_decision.historical_info: "Zapadnici a slavianofili boli dve odlišné intelektuálne a ideologické hnutia v Rusku 19. storočia. Mali rozdielne názory na smerovanie Ruska, jeho vzťah k západnej Európe a zachovanie ruskej kultúrnej identity. Zapadnici uprednostňovali modernizáciu prijímaním západných myšlienok, inštitúcií a technológií, zatiaľ čo slavianofili zdôrazňovali zachovanie tradičných ruských hodnôt, duchovnosti a spoločenských štruktúr." # todo: NEW TRANSLATION
 rus_secretnoye_byuro_decision.title: "Tajná vyšetrovacia kancelária" # todo: NEW TRANSLATION
 rus_secretnoye_byuro_decision.desc: "Objavili sa obavy, či [current_policy.GetName] dokáže potlačiť výzvy elít voči vláde [ROOT.GetCountry.GetAltAdjective('D')]. Zahraničné vplyvy v Ríšskej rade navrhli osobitnú agentúru, ktorá by sa na túto úlohu hodila lepšie a ako prostriedok odstrašenia by uprednostňovala surovú silu. Obnovme používanie korbáča a reorganizujme tajnú políciu, aby sme znovu upevnili autoritu a zmarili každý pokus podkopať našu najvyššiu moc." # todo: NEW TRANSLATION # todo: COUNTRY CASE
 rus_secretnoye_byuro_decision.desc.entry: "Politika, ktorá iba odrádza od vzbury, nie je to isté ako politika, ktorá jej zabraňuje, a zahraniční agenti v štátnej správe si všimli rozdiel. Obnovenie používania korbáča a zriadenie tajnej polície na to dá odpoveď, no za cenu všetkej pretvárky, že $RUS$ vládne niečím miernejším než strachom." # todo: NEW TRANSLATION
 rus_secretnoye_byuro_decision.a: "Poslušnosť si občas žiada obete." # todo: NEW TRANSLATION
 rus_secretnoye_byuro_decision.b: "Sme nad takéto veci povznesení." # todo: NEW TRANSLATION
 enable_secretnoye_byuro_policy: "Umožní prístup k [ShowPolicyName('secretnoye_byuro_policy')] [Concept('policy','politike')|e]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 rus_secretnoye_byuro_decision.tt1: "Možno ho zvoliť iba vtedy, ak člen [Concept('cabinet_member','člen kabinetu')|e] vykonáva [Concept('cabinet_action','akcia kabinetu')|e] [ShowCabinetActionName('bironovshchina')]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 rus_secretnoye_byuro_decision.historical_info: "Tajná vyšetrovacia kancelária zohrávala významnú úlohu za vlády cárovnej Anny Ivanovny, ktorá ju využívala na udržiavanie politických protivníkov na uzde a upevňovanie svojej autoritárskej vlády. Tresty zahŕňali rozrezanie nosa či ubičovanie na smrť korbáčom, typickým bičom z remenca surovej kože alebo lana pripevneného k dlhej drevenej rukoväti. Odhaduje sa, že obeťami politických čistiek sa stalo približne dvadsaťtisíc šľachticov." # todo: NEW TRANSLATION
 rus_proclaim_tsardom_decision.title: "Vyhlásiť $tsardom$" # todo: NEW TRANSLATION
 rus_proclaim_tsardom_decision.desc: "Zjednotenie rusínskych krajín je zavŕšené a [GetInternationalOrganizationType('tatar_yoke').GetName] je zlomené. Naša [GetCountry('RUS').GetFlavorRank] teraz stojí nad všetkými kniežatstvami a naši [GetCountry('RUS').GetGovernment.GetEstateName('clergy_estate')] nás vyzývajú, aby sme si nárokovali dôstojnosť, ktorá tomu zodpovedá: náš panovník by mal byť korunovaný za [SelectLocalization(GetCountry('RUS').GetGovernment.GetRulerOrRegent.IsFemale,'rank_empire_tsar_ruler_female','rank_empire_tsar_ruler_male')], dediča dávnych cisárov a ochrancu [ShowReligionAdjective('orthodox')] viery.\n\nTakáto korunovácia by všetkým dvorom v Európe i všetkým stepným chanátom vyhlásila, že [GetCountry('RUS').GetName] sa neskláňa pred nijakou cudzou korunou." # todo: NEW TRANSLATION
 rus_proclaim_tsardom_decision.desc.entry: "Rusínske krajiny sú zjednotené, [GetInternationalOrganizationType('tatar_yoke').GetName] je zlomené a panovník, ktorý už vykonal prácu hodnú cisára, iba nemá cisársky titul. Nárokovať si ho nestojí nič okrem trúfalosti a všetkým európskym dvorom jasne oznámi, ako nás majú odteraz oslovovať." # todo: NEW TRANSLATION
 rus_proclaim_tsardom_decision.a: "Nech je náš panovník korunovaný za [SelectLocalization(GetCountry('RUS').GetGovernment.GetRulerOrRegent.IsFemale,'rank_empire_tsar_ruler_female','rank_empire_tsar_ruler_male')] celej Rusi." # todo: NEW TRANSLATION
 rus_proclaim_tsardom_decision.historical_info: "16. januára 1547 bol Ivan IV. Moskovský korunovaný v Katedrále Zosnutia Presvätej Bohorodičky v Kremli. Bol prvým moskovským vládcom, ktorému bol slávnostne udelený titul cára. Metropolita Makarius, ktorý presadzoval túto novú dôstojnosť, mu nasadil Monomachovu čiapku — korunu zdobenú drahokamami a lemovanú kožušinou, ktorú dvorská tradícia pokladala za dar byzantského cisára Konštantína IX. veľkokniežaťu Vladimírovi Monomachovi spred niekoľkých storočí.\n\nNový titul znamenal zámerný odklon od staršieho označenia veľkoknieža a potvrdzoval hodnosť rovnú cisárovi, ako aj nárok na dedičstvo zaniknutých kresťanských ríš Východu. Cudzie dvory ho uznávali pomaly: trvalo desaťročia diplomacie, kým Svätá ríša rímska a pápežstvo prijali cára ako titul rovnocenný kráľovi, a nie iba ako preklad titulu veľkoknieža." # todo: NEW TRANSLATION

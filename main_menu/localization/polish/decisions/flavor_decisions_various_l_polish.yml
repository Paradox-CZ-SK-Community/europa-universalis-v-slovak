l_polish:
 ser_novo_brdo_mine_decision.title: "Zákonník z [ShowLocationNameWithNoTooltip('novo_brdo')]" # todo: NEW TRANSLATION
 ser_novo_brdo_mine_decision.desc: "Rušné banské mesto [ShowLocationName('novo_brdo')] si vytvorilo vlastné pravidlá a postupy na riadenie zložitých činností a práv spojených s jeho výnosným priemyslom. V poslednom čase čoraz viac ľudí volá po prijatí komplexného celoštátneho banského zákonníka založeného na jeho zásadách. Navrhovaný [ShowPolicyName('novo_brdo_mining_law')] by štandardizoval organizáciu banských miest, vymedzil práva a povinnosti baníkov a zabezpečil spravodlivé postupy a bezpečnostné opatrenia v celej krajine [ROOT.GetCountry.GetAltAdjective('D')]." # todo: NEW TRANSLATION # todo: COUNTRY CASE
 ser_novo_brdo_mine_decision.desc.entry: "Jedno banské mesto si pokusmi a spormi osvojilo pravidlá, vďaka ktorým zostávajú jeho šachty výnosné a baníci sa kvôli nim navzájom nezabíjajú. Urobiť zo zvyklostí mesta [ShowLocationName('novo_brdo')] zákon platný pre každú baňu v $SER$ pripraví ostatné mestá o ich miestne zvyklosti, no uchráni ich pred tým, aby tie isté pravidlá nanovo a zle vymýšľali." # todo: NEW TRANSLATION
 ser_novo_brdo_mine_decision.a: "Spíšme nový zákon." # todo: NEW TRANSLATION
 ser_novo_brdo_mine_decision.b: "Zachovajme súčasné banské predpisy." # todo: NEW TRANSLATION
 has_unlocked_novo_brdo_tt: "Odomkol zákon prostredníctvom [Concept('decision','rozhodnutia')|e] #Y Zákonník z [ShowLocationNameWithNoTooltip('novo_brdo')]#!" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 STATIC_MODIFIER_NAME_ser_novo_brdo_code: "Kódex Novo Brdo" # todo: NEW TRANSLATION
 ser_novo_brdo_mine_decision.historical_info: "Banský zákonník Novo Brdo, ktorý v roku 1412 ustanovil Stefan Lazarević, bol komplexným súborom predpisov upravujúcich ťažbu, práva pracovníkov a organizáciu banských miest v stredovekom Srbsku. Podrobne stanovoval pravidlá vlastníckych práv, bezpečnostných opatrení a hospodárskych postupov a významne ovplyvnil rozvoj a prosperitu banských komunít." # todo: NEW TRANSLATION
 chi_grand_pronouncements_decision.title: "Veľké vyhlásenia" # todo: NEW TRANSLATION
 chi_grand_pronouncements_decision.desc: "[target_character.GetName|U] tvrdí, že pád predchádzajúcej dynastie zapríčinila výlučne korupcia a prekračovanie právomocí vládnych ministrov. V tomto duchu [target_character.GetHeShe] argumentuje, že by sa mal zaviesť prísnejší a viac formalistický právny poriadok, aby [ROOT.GetCountry.GetName] nepostihol rovnaký osud." # todo: NEW TRANSLATION
 chi_grand_pronouncements_decision.desc.entry: "Dynastie padajú v dôsledku vpádov oveľa menej často než rukou ministrov, ktorí im majú slúžiť. Dvor chce spísať natoľko prísny zákonník, aby si nijaký minister nepomýlil palác so svojím vlastným, nech to už stojí akokoľvek veľa z flexibility, ktorej sa takíto muži zvyčajne tešia." # todo: NEW TRANSLATION
 chi_grand_pronouncements_decision.a: "Zakročme proti korupcii." # todo: NEW TRANSLATION
 chi_grand_pronouncements_decision.b: "Korupcia? V našej vláde? To je nemožné." # todo: NEW TRANSLATION
 chi_ming_dynasty_code_will_be_changed: "[ShowPolicyName('chi_ming_dynasty_code_policy')] bude zmenený a bude obsahovať modifikátory [ShowModifier('chi_grand_pronouncements')]." # todo: NEW TRANSLATION
 integrated_grand_prounouncements: "Integrovalo [ShowModifier('chi_grand_pronouncements')] do [ShowPolicyName('chi_ming_dynasty_code_policy')]." # todo: NEW TRANSLATION
 cas_right_of_possession_decision.title: "[ShowPolicyNameWithNoTooltip('right_of_possesion')]" # todo: NEW TRANSLATION
 cas_right_of_possession_decision.desc: "Pod dôsledným vedením [ShowLawName('mesta_council_law')] naša [ShowGoodsName('wool')] prosperuje a rozširuje svoj vplyv v krajinách [ROOT.GetCountry.GetAdjective]. Aby organizácia naďalej prekvitala a zostala pod kontrolou, bolo by vhodné zaviesť [ShowPolicyName('right_of_possesion')], zákon, ktorý by upravoval využívanie pasienkov a stanovil primeraný strop nájomného." # todo: NEW TRANSLATION
 cas_right_of_possession_decision.desc.entry: "Cech, ktorý si sám dohliada na svoje záležitosti, napokon dohliada len na vlastné záujmy. [ShowLawName('mesta_council_law')] premenil [ShowGoodsName('wool')] na bohatstvo a pevný strop nájomného za pasienky by zaistil, že toto bohatstvo nebude celé vyťažené z roľníkov, ktorí si pôdu prenajímajú." # todo: NEW TRANSLATION
 cas_right_of_possession_decision.a: "Zaveďme [ShowPolicyNameWithNoTooltip('right_of_possesion')]." # todo: NEW TRANSLATION
 cas_right_of_possession_decision.b: "Súčasný stav je výhodnejší." # todo: NEW TRANSLATION
 cas_right_of_possession_decision.c: "Zrušme [ShowLawNameWithNoTooltip('mesta_council_law')]!" # todo: NEW TRANSLATION
 cas_right_of_possession_decision.c.tt: "Všetky lokality so surovinou [ShowGoodsNameWithNoTooltip('wool')], ktoré vlastníme v regióne [ShowRegionName('iberia_region')], natrvalo stratia modifikátor [ShowModifier('merino_wool')]" # todo: NEW TRANSLATION
 cas_altered_nueva_recopilacion_decision.title: "Novísima Recopilación" # todo: NEW TRANSLATION
 cas_altered_nueva_recopilacion_decision.desc: "Napriek tomu, že [ShowAdvanceName('enlightenment_advance')] preniká do [ROOT.GetCountry.GetAltAdjective('G')], mnohé naše zákony sú zastarané, najmä [ShowPolicyName('nueva_recopilacion_policy')]. [target_character.GetName] si to uvedomuje a chce odstrániť všetky tradicionalistické myšlienky a prepísať zákony tak, aby sa odklonili od rímskeho kánonického práva. Pomohlo by to vzdelávať masy a učiť ich viac než len [ROOT.GetCountry.GetReligion.GetAdjective] vieru, ktorá ovládla náš právny systém." # todo: NEW TRANSLATION # todo: COUNTRY CASE
 cas_altered_nueva_recopilacion_decision.desc.entry: "Právny poriadok spísaný ešte pred [ShowAdvanceName('enlightenment_advance')] nám stále vládne, akoby sa nič nezmenilo. Prepísanie [ShowPolicyName('nueva_recopilacion_policy')] tak, aby sa odklonil od rímskeho kánonického práva, by ľudí naučilo aj niečo iné než vieru, o ktorú sa súdy opierajú už celé storočie." # todo: NEW TRANSLATION
 cas_altered_nueva_recopilacion_decision.a: "Dovoľme týmto pokrokovým myšlienkam rozkvitať." # todo: NEW TRANSLATION
 cas_altered_nueva_recopilacion_decision.b: "Neodkláňajme sa od našich tradícií." # todo: NEW TRANSLATION
 cas_altered_nueva_recopilacion_decision.historical_info: "Novísima Recopilación bola vylepšenou verziou Nueva Recopilación a odklonila sa od rímskeho kánonického charakteru svojho predchodcu. Namiesto toho sa stala odrazovým mostíkom pre zjednotenie Kastílie a Aragónska v rámci španielskeho kráľovstva. Tieto zákony, zavedené v roku 1805, sa používali pri štúdiu právnych prípadov v Španielsku, no neboli také moderné ako vtedy nastupujúci napoleonský zákonník." # todo: NEW TRANSLATION
 spa_alter_nueva_recopilacion_policy_tt: "Bonusy [ShowPolicyName('nueva_recopilacion_policy')] [Concept('policy','politika')|e] sa teraz budú sústreďovať na [Concept('research','výskum')|e] a budú sa škálovať s [Concept('estate_power','silou stavu')|e] [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 cas_spanish_cloth_industry_decision.title: "Vynikajúca merino [ShowGoodsNameWithNoTooltip('wool')]" # todo: NEW TRANSLATION
 cas_spanish_cloth_industry_decision.desc: "Vyššia kvalita našej [ShowGoodsName('wool')] zvýšila jej dobrú povesť na ostatných európskych trhoch a vzrástol aj zahraničný dopyt. Ak podporíme toto odvetvie, ktoré vedie [ShowLawName('mesta_council_law')], môže sa pre nás stať veľmi výnosným exportným artiklom. Niektorí členovia [ShowLawNameWithNoTooltip('mesta_council_law')] tiež navrhujú využiť túto kvalitnú [ShowGoodsNameWithNoTooltip('wool')] ako základ pre vytvorenie [ROOT.GetCountry.GetAdjective] priemyslu s [ShowGoodsName('fine_cloth')] a vybudovať silný súkennícky priemysel [ROOT.GetCountry.GetCulture.GetName]!" # todo: NEW TRANSLATION
 cas_spanish_cloth_industry_decision.desc.entry: "Predaj surovej [ShowGoodsName('wool')] do zahraničia obohacuje cudzích tkáčov viac než nás. Vybudovanie obchodu s [ShowGoodsName('fine_cloth')] na základe [ShowLawName('mesta_council_law')] by nám umožnilo predávať hotový výrobok, ak sa nám podarí presvedčiť radu, že táto investícia stojí za námahu." # todo: NEW TRANSLATION
 cas_spanish_cloth_industry_decision.a: "Zamerajme sa na vývoz!" # todo: NEW TRANSLATION
 cas_spanish_cloth_industry_decision.a.tt: "Všetky lokality so surovinou [ShowGoodsNameWithNoTooltip('wool')], ktoré vlastníme v regióne [ShowRegionName('iberia_region')], získajú na 50 rokov modifikátor [ShowModifier('quality_merino_wool')]" # todo: NEW TRANSLATION
 cas_spanish_cloth_industry_decision.b: "Podporujme naše domáce odvetvie." # todo: NEW TRANSLATION
 cas_spanish_cloth_industry_decision.b.tt: "Odomkne španielske výrobné metódy súkna pre [ShowBuildingTypeNameWithNoTooltip('fine_cloth_guild')]." # todo: NEW TRANSLATION
 has_unlocked_spanish_cloth_industry: "Podporil španielsky textilný priemysel v rámci udalosti" # todo: NEW TRANSLATION
 STATIC_MODIFIER_NAME_quality_merino_wool: "Kvalitná merino vlna" # todo: NEW TRANSLATION
 por_casa_de_india_decision.title: "Casa da Índia" # todo: NEW TRANSLATION
 por_casa_de_india_decision.desc: "Musíme účinne dohliadať na záujmy a majetky [ROOT.GetCountry.GetAdjective] v $india$ a [ShowContinentName('africa')]. Navrhuje sa, že najlepším spôsobom, ako to dosiahnuť, je vytvoriť inštitúciu podriadenú priamo [ROOT.GetCountry.GetGovernment.GetAdjective] pokladníkovi, ktorá by mala monopolné práva na všetky súvisiace obchodné spojenia a tovary." # todo: NEW TRANSLATION
 por_casa_de_india_decision.desc.entry: "Obchod roztrúsený po $india$ a [ShowContinentName('africa')] je obchod, o ktorom nikto poriadne nevedie účty. Jediná inštitúcia podriadená pokladníkovi, ktorá by mala monopol na najdôležitejšie tovary, by zaň zodpovedala v jedinej účtovnej knihe." # todo: NEW TRANSLATION
 por_casa_de_india_decision.a: "To znie ako dobrý plán." # todo: NEW TRANSLATION
 por_casa_de_india_decision.a.tt: "Odomkne [Concept('government_reform','reforma vlády')|e] [ShowGovernmentReformName('por_casa_de_india')]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 hol_ned_shipbuilding_decision.title: "Fluitschip" # todo: NEW TRANSLATION
 hol_ned_shipbuilding_decision.desc: "Rozsiahle hospodárstvo [ROOT.GetCountry.GetCulture.GetName] kladie na našu obchodnú flotilu veľké nároky. Vody [ROOT.GetCountry.GetCulture.GetAltAdjectiveWithNoTooltip('G')] sú navyše veľmi plytké, takže bežné obchodné lode, ako napríklad karavely, nedokážu vplávať do mnohých prístavov [ROOT.GetCountry.GetAdjectiveWithNoTooltip]. Doteraz sme to riešili menšími boeiermi, no s finančnou podporou obchodníka [target_character.GetName] z mesta [ShowLocationName('hoorn')] sa podarilo vyvinúť nový typ lode.\nFluitschip, čiže fluyt, je dlhší, má charakteristickú hruškovitú zadnú časť a jeho konštrukcia umožňuje efektívne ovládanie malou posádkou. Dokáže prevážať väčší náklad, plaviť sa v plytkých holandských vodách a zároveň sa výborne správať na otvorenom mori, takže je pre našich obchodníkov darom z nebies." # todo: NEW TRANSLATION # todo: COUNTRY CASE
 hol_ned_shipbuilding_decision.desc.entry: "Boeier sa dostane do plytčín pri našich prístavoch, no odvezie príliš málo nákladu na to, aby sa plavba oplatila. $name_peter.dutch_dialect$ $name_john.dutch_dialect$ $Liorne$ financoval dlhší typ lode s hruškovitou zadnou časťou, ktorá zvládne oboje a prepraví poriadny náklad aj vo vodách sotva dosť hlbokých pre veslicu." # todo: NEW TRANSLATION
 hol_ned_shipbuilding_decision.a: "To je rozhodne dobrý nápad!" # todo: NEW TRANSLATION
 hol_ned_shipbuilding_decision_tt: "$name_peter.dutch_dialect$ $name_john.dutch_dialect$ $Liorne$ vstúpi na náš [Concept('court','dvor')|e]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 hol_ned_shipbuilding_decision.b: "Zaujímavý nápad, ale teraz naň nie je vhodný čas. Možno neskôr?" # todo: NEW TRANSLATION
 nov_ivan_hundred_strong_decision.title: "Obchodné združenie [ShowEstatePrivilegeNameWithNoTooltip('novgorod_ivans_hundred')]" # todo: NEW TRANSLATION
 nov_ivan_hundred_strong_decision.desc: "Ako jedno z hlavných obchodných centier sa [ROOT.GetCountry.GetAltAdjective('A')] stalo domovom mnohých mocných obchodných združení. Spomedzi nich má [ShowEstatePrivilegeName('novgorod_ivans_hundred')] mimoriadny vplyv a pevne ovláda obchod s tovarom [ShowGoodsName('beeswax')]. Mnohí vysokopostavení predstavitelia združenia sa obrátili na [our_ruler.GetName] a Veče s nádejou, že získajú ďalšiu podporu a rozšíria svoj vplyv. Niektorí členovia [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] potichu naliehajú na [our_ruler.GetNameWithNoTooltip], aby združenie ďalej neposilňoval, pretože by mohlo získať priveľký vplyv na obchod [ROOT.GetCountry.GetNameWithNoTooltip]." # todo: NEW TRANSLATION # todo: COUNTRY CASE
 nov_ivan_hundred_strong_decision.desc.entry: "[ShowEstatePrivilegeName('novgorod_ivans_hundred')] už ovláda obchod s tovarom [ShowGoodsName('beeswax')] dôkladnejšie, než by mal ktorýkoľvek cech, a jeho predstavitelia žiadajú ešte väčšiu podporu. $nobles_estate$ nás potichu žiada, aby sme ich odmietli, pretože sa obáva, že obchodnícke združenie bude príliš mocné na to, aby sa zodpovedalo Veče." # todo: NEW TRANSLATION
 nov_ivan_hundred_strong_decision.a: "Poskytnime im výraznejšiu podporu Veče." # todo: NEW TRANSLATION
 empower_ivan_hundred_privilege: "The [ShowEstatePrivilegeName('novgorod_ivans_hundred')] získa nasledujúce na 25 rokov:\n#R -5.00%#! [ShowModifierTypeName('global_crown_estate_power')] a #G +20.00%#! [ShowModifierTypeName('global_merchant_capacity_modifier')]" # todo: NEW TRANSLATION
 ivan_hundred_strengthened_requirement: "Nasledujúci bonus možno získať prostredníctvom [Concept('decision','rozhodnutia')|e] $nov_ivan_hundred_strong_decision.title$:" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 variable_ivan_hundred_strengthened_tt: "Privilégium [ShowEstatePrivilegeName('novgorod_ivans_hundred')] bolo posilnené" # todo: NEW TRANSLATION
 ivan_hundred_strengthened: "Posilnenie Ivanovej stovky" # todo: NEW TRANSLATION
 nov_ivan_hundred_beeswax_decision.title: "[ShowEstatePrivilegeNameWithNoTooltip('novgorod_ivans_hundred')] žiada o monopol na [ShowGoodsNameWithNoTooltip('beeswax')]" # todo: NEW TRANSLATION
 nov_ivan_hundred_beeswax_decision.desc: "Vďaka ďalšej podpore Veče sa [ShowEstatePrivilegeName('novgorod_ivans_hundred')] teší vyššiemu postaveniu. Združenie žiada o ďalšiu podporu svojich snáh a chce získať výhradný monopol na výrobu [ShowGoodsName('beeswax')] v Novgorode. Hoci malo vždy veľký vplyv na obchod, monopol by jeho kontrolu nad týmto tovarom definitívne upevnil." # todo: NEW TRANSLATION
 nov_ivan_hundred_beeswax_decision.a: "Vyhovejme ich žiadosti o väčší vplyv na obchod s tovarom [ShowGoodsNameWithNoTooltip('beeswax')]." # todo: NEW TRANSLATION
 nov_ivan_hundred_beeswax_decision.b: "Zabráňme [ShowEstatePrivilegeNameWithNoTooltip('novgorod_ivans_hundred')] v ďalšom posilňovaní." # todo: NEW TRANSLATION
 ivan_hundred_beeswax_increase: "[ShowEstatePrivilegeName('novgorod_ivans_hundred')] získa nasledujúce na 25 rokov:\n#G +10.00%#! [ShowModifierTypeName('selling_efficiency')] a #G +25.00%#! [ShowModifierTypeName('global_beeswax_output_modifier')]" # todo: CHANGED
 ivan_hundred_beeswax_increase_requirement: "Nasledujúci bonus možno získať prostredníctvom [Concept('decision','rozhodnutia')|e] $nov_ivan_hundred_beeswax_decision.title$:" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 ivan_hundred_beeswax: "Väčší vplyv na obchod s včelím voskom" # todo: NEW TRANSLATION
 kbo_serfdom_reform_decision.title: "Pokračovanie nájazdov za otrokmi" # todo: NEW TRANSLATION
 kbo_serfdom_reform_decision.desc: "Tak ako v mnohých častiach kontinentu, aj naše hospodárstvo vo veľkej miere závisí od prílevu a využívania nútenej pracovnej sily. Časté nájazdy, ktoré podporuje naša armáda a miestni vojvodcovia, zásobujú naše trhy novými pracovnými silami pre každú oblasť spoločnosti. Vďaka nedávnym úspechom a investíciám do týchto činností sme však nahromadili obrovské množstvo týchto ľudí. Preto musíme rozhodnúť, či budeme do nájazdov naďalej investovať a zvyšovať prílev podmanených ľudí na naše trhy, alebo im udelíme miesto v našej spoločnosti a umožníme im v nej prosperovať." # todo: NEW TRANSLATION
 kbo_serfdom_reform_decision.a: "Naše hospodárstvo z tohto obchodu výrazne získa." # todo: NEW TRANSLATION
 kbo_serfdom_reform_decision.b: "Usilujme sa začleniť všetkých do našej spoločnosti." # todo: NEW TRANSLATION
 kbo_pop_promotion_more_potent_tt: "Získame prístup k [ShowCabinetActionName('kbo_pop_promote_action')] jedinečnej [Concept('cabinet_action','akcii kabinetu')|e]" # todo: CHANGED # todo: CONCEPT CASE
 kbo_amenokal_salt_traders_decision.title: "Azalai a Taghlamt" # todo: NEW TRANSLATION
 kbo_amenokal_salt_traders_decision.desc: "Po stáročia od zavedenia tiav v západnej a strednej Afrike sa mnohí obchodníci vydávali cez nehostinné oblasti za ziskom a obchodnými dobrodružstvami po trasách, ako sú Azalai či Taghlamt. Títo mocní ľudia, známi ako Amenokal, dohliadali na karavány a cestovali naprieč púšťou od oázy k oáze, prepájali vzdialené miesta a obchodovali s cennou surovinou [ShowGoodsName('salt')]. Na trhoch sa soľ predávala v doskách či tehlách výmenou za potraviny, dobytok a ďalší dôležitý tovar. Rozhodnutie, či túto výsadnú dozorujúcu funkciu zveriť mocným jednotlivcom, je citlivá záležitosť, ktorú musia vyriešiť naši najdôveryhodnejší poradcovia." # todo: NEW TRANSLATION
 kbo_amenokal_salt_traders_decision.a: "Nech na obchod dohliada Amenokal každej karavány." # todo: NEW TRANSLATION
 kbo_sharia_courts_decision.title: "$sharia$ v krajine $KBO$" # todo: NEW TRANSLATION
 kbo_sharia_courts_decision.desc: "Náš veľký národ patril medzi najstarších a najrýchlejších prijímateľov [ShowReligionAdjective('sunni')] [ShowReligionGroupName('muslim')]. S novou horlivosťou pre pravú vieru a neúnavnou energiou sme urobili všetko, čo bolo v našich silách, aby sme upevnili naše náboženské hodnoty a ochránili ľud pred dotieravými neveriacimi. Jedna stránka našej viery sa však ešte neujala: $sharia$. Hoci súbor náboženských zákonov v našej krajine platí už dlho, zatiaľ nedosiahol do každého jej kúta. Niektorí naši poradcovia podporujú vytvorenie osobitných súdov, ktoré by presadzovali $sharia$, iní varujú pred prepájaním náboženstva a správy štátu." # todo: NEW TRANSLATION
 kbo_sharia_courts_decision.a: "Zakotvenie $sharia$ hlbšie v našej vláde je ďalším logickým krokom!" # todo: NEW TRANSLATION
 kbo_enable_sharia_courts_cabinet_action_tt: "Získame prístup k [ShowCabinetActionName('kbo_sharia_courts')] jedinečnej [Concept('cabinet_action','akcii kabinetu')|e]" # todo: CHANGED # todo: CONCEPT CASE
 teu_kulm_law_revised_decision.title: "Revízia zákona $kulm_law$" # todo: NEW TRANSLATION
 teu_kulm_law_revised_decision.desc: "[ShowSituationName('black_death')] pustošil po celom kontinente [ShowContinentName('europe')], decimoval mnohé mestá a uvrhol osady do záhuby. Hospodársky dosah na [ROOT.GetCountry.GetLongName] bol hrozný, no ešte horšie je, že úbytok obyvateľstva v Nemecku znížil migračný tlak a spomalil rast populácie v [ShowAreaName('prussia_area')]. Ak neposkytneme ďalšie podnety na sťahovanie do krajín [ROOT.GetCountry.GetAdjectiveWithNoTooltip], čoskoro nám nezostanú nijakí migranti, ktorí sú nevyhnutnou súčasťou našej kresťanizačnej misie." # todo: NEW TRANSLATION
 teu_kulm_law_revised_decision.desc.entry: "[ShowSituationName('black_death')] preriedil obyvateľstvo Nemecka natoľko, že na východ prichádza čoraz menej migrantov, hoci naša rehoľa v [ShowAreaName('prussia_area')] závisí od ich neustáleho prílevu. Zlepšenie podmienok pre osadníkov nás bude stáť ústupky, ktorých by sme sa radšej vyvarovali, no prázdna hranica nikoho neobráti." # todo: NEW TRANSLATION
 teu_kulm_law_revised_decision.a: "Poskytnime migrantom viac výhod." # todo: NEW TRANSLATION
 teu_kulm_law_revised_decision.b: "Budeme sa s tým musieť vyrovnať." # todo: NEW TRANSLATION
 teu_impact_on_kulm_law: "[ShowEstatePrivilegeName('kulm_law')] sa upraví takto:\n#g +0.1#! [ShowModifierTypeName('rural_migration_attraction')]\n#r -10.0%#! [ShowModifierTypeName('burghers_estate_max_tax')]" # todo: NEW TRANSLATION
 teu_impact_on_kulm_law_not_revised: "[ShowEstatePrivilegeName('kulm_law')] sa upraví takto:\n#r -50.0%#! [ShowModifierTypeName('german_migration_attraction_modifier')]\n#g +10.0%#! [ShowModifierTypeName('global_pop_assimilation_speed_modifier')]" # todo: NEW TRANSLATION
 kulm_law_revised_tooltip: "Revidoval [ShowEstatePrivilegeName('kulm_law')] prostredníctvom [Concept('decision','rozhodnutia')|e] $teu_kulm_law_revised_decision.title$." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 kulm_law_not_revised_tooltip: "Rozhodol sa nerevidovať [ShowEstatePrivilegeName('kulm_law')] prostredníctvom [Concept('decision','rozhodnutia')|e] $teu_kulm_law_revised_decision.title$." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 bra_kreditwerk_reformed_decision.title: "Reforma inštitúcie $bra_kreditwerk$" # todo: NEW TRANSLATION
 bra_kreditwerk_reformed_decision.desc: "Napriek právomociam udeleným Kreditwerku sa táto inštitúcia výrazne zadlžila a zle spravovala naše financie. Keďže Kreditwerk teraz čelí bezprostrednému bankrotu, musíme rozhodnúť o jeho budúcnosti. V radoch našich poradcov sa formuje niekoľko frakcií. Niektoré odporúčajú reformovať Kreditwerk a podriadiť ho priamej správe koruny, iné navrhujú inštitúciu úplne zrušiť." # todo: NEW TRANSLATION
 bra_kreditwerk_reformed_decision.a: "Reformujme inštitúciu pod správou koruny." # todo: NEW TRANSLATION
 bra_kreditwerk_reformed_decision.b: "Zbavme sa tejto pohromy." # todo: NEW TRANSLATION
 bra_kreditwerk_reformed_decision.c: "Zachráňme ju finančnou pomocou a nechajme ju pokračovať." # todo: NEW TRANSLATION
 boh_unity_brethren_decision.title: "Podpora jednoty bratov" # todo: NEW TRANSLATION
 boh_unity_brethren_decision.desc: "Počas rokov praktizovania [ShowReligionAdjective('hussite')] liturgie vyrástlo v našej krajine z jedného stromu viery mnoho vetiev. Veriaci sa hrnú do zhromaždení, aby sa zúčastnili cirkevných obradov, očistení a zbavení vplyvu zblúdených heretikov.\n\nV tomto prostredí zbožnosti a uctievania Boha sa však čoraz viac príslušníkov nášho [ShowEstateTypeName('clergy_estate')] prikláňa k extrémnemu výkladu [ShowReligionNameWithNoTooltip('hussite')]. Ten hlása, že šľachtici a obchodníci nesmú zastupovať cirkev, bohoslužby sa majú konať v jednoduchých a skromných obradoch a apoštolská postupnosť sa má odmietnuť." # todo: NEW TRANSLATION
 boh_unity_brethren_decision.desc.entry: "Viera, ktorá sa neustále rozrastá, napokon prerastie aj zámery svojich zakladateľov — a to sa stalo aj tej našej. Niektorí z nášho $clergy_estate$ teraz hlásajú, že šľachtici a obchodníci nemajú v cirkvi čo robiť. Je to čistejšie učenie než to, s ktorým sme začínali, ale aj oveľa viac rozvratné." # todo: NEW TRANSLATION
 boh_unity_brethren_decision.a: "Nech kážu, ich slová sú pravdivé." # todo: NEW TRANSLATION
 unity_brethren_privilege: "Jednota bratov" # todo: NEW TRANSLATION
 unity_brethren_privilege_desc: "Hnutie radikálnych [ShowReligionName('hussite')] zamerané na čistú eleganciu kázania a uctievania, sústreďujúce sa na vylúčenie mocných osôb z [ShowEstateTypeName('burghers_estate')] a [ShowEstateTypeName('nobles_estate')] a podporujúce materinský jazyk a zjednodušené obrady počas komunie." # todo: NEW TRANSLATION
 ara_sindicat_remenca_decision.title: "Sindicat Remença" # todo: NEW TRANSLATION
 ara_sindicat_remenca_decision.desc: "Šľachta v krajine [ROOT.GetCountry.GetLongName] začala prísne presadzovať pravidlá, ktoré pripútavajú roľníkov k pôde. V spojení s dôslednejším vymáhaním poddanských práv vo všeobecnosti to medzi roľníkmi vyvolalo nepokoje. Najchudobnejší roľníci dôrazne podporujú otvorenú vzburu, zatiaľ čo tí zámožnejší uprednostňujú, aby nás požiadali o reformy a ukončenie poddanských útlakov.\n\nBola by to skvelá príležitosť získať si podporu roľníkov, keďže so šľachtou neustále zápasíme o moc. Navrhuje sa, aby sme roľníkom dovolili založiť [ShowEstatePrivilegeName('ara_sindicat_remenca')], roľnícky cech či primitívnu odborovú organizáciu, ktorá by im poskytla väčšiu slobodu." # todo: NEW TRANSLATION
 ara_sindicat_remenca_decision.desc.entry: "Roľník absolútne pripútaný k pôde nemá zákonný spôsob, ako sa brániť svojmu pánovi — len nezákonný, a práve k nezákonnému odporu sa teraz uchyľujú tí najchudobnejší. Zriadenie cechu by zámožnejším roľníkom poskytlo zákonné východisko a za malú cenu by nám získalo ich vernosť v zápase so šľachtou." # todo: NEW TRANSLATION
 ara_sindicat_remenca_decision.a: "Dovoľme roľníkom založiť Sindicat Remença." # todo: NEW TRANSLATION
 ara_sindicat_remenca_decision.b: "Ignorujte sedliacku háveď." # todo: NEW TRANSLATION
 ara_sindicat_remenca: "Sindicat Remença" # todo: NEW TRANSLATION
 ara_sindicat_remenca_desc: "Sindicat Remença je cech roľníkov alebo primitívna odborová organizácia. Prvýkrát vznikol v Katalánsku v roku 1448." # todo: NEW TRANSLATION
 nov_tysiatskii_influential_decision.title: "Starý tysjackij" # todo: NEW TRANSLATION
 nov_tysiatskii_influential_decision.desc: "Hoci [ShowEstatePrivilegeName('tysiatskii_privilege')] zostalo voleným úradom v krajine [ROOT.GetCountry.GetAltAdjective('D')], vo veľkej miere ho naďalej kontroloval [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')], pričom mnohí zvolení tysjackiji pochádzali z rodín [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')]. V poslednom čase však bývalí tysjackiji aj po odchode z úradu získavajú značný vplyv na následné voľby a často presadzujú, aby ich vo funkcii vystriedal syn. Títo jednotlivci, známi ako #italic Starí tysjackiji#!, sa stali silou, s ktorou treba vo Veče počítať." # todo: NEW TRANSLATION # todo: COUNTRY CASE
 nov_tysiatskii_influential_decision.desc.entry: "Volený úrad len ťažko obmedzuje moc, ak voľby stále vyhrávajú tie isté rodiny. #italic Starí tysjackiji#! teraz aj po odchode z úradu smerujú hlasy k vlastným synom a $nobles_estate$ si toto miesto potichu privlastnili, hoci nie oficiálne." # todo: NEW TRANSLATION
 nov_tysiatskii_influential_decision.a: "Mali by sme sa pokúsiť využiť ich vplyv." # todo: NEW TRANSLATION
 nov_tysiatskii_influential_decision.b: "Usilujme sa oslabiť vplyv [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')] na tento úrad." # todo: NEW TRANSLATION
 nov_tysiatskii_influential_decision.b.entry: "Usilujme sa oslabiť vplyv $nobles_estate$ na tento úrad." # todo: NEW TRANSLATION
 nov_tysiatskii_influence_weakened: "Oslabený vplyv Tysiatskiia" # todo: NEW TRANSLATION
 nov_influential_tysiatskii: "Vplyvný Tysiatskii" # todo: NEW TRANSLATION
 nov_tysiatskii_influence_weakened_benefits: "[ShowEstatePrivilegeName('tysiatskii_privilege')] získa na 30 rokov tieto účinky:\n#G -25.00%#! [ShowModifierTypeName('global_nobles_estate_power')] a #G +0.10#! [ShowModifierTypeName('stability_investment')]" # todo: NEW TRANSLATION
 nov_tysiatskii_influence_event_happened: "Tysiatskii získal viac vplyvu!" # todo: NEW TRANSLATION
 nov_tysiatskii_influence_event_happened_possible_event: "Tysiatskii sa v budúcnosti môže pokúsiť presadiť svoju nadvládu nad [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')]!" # todo: NEW TRANSLATION
 nov_influential_tysiatskii_benefits: "[ShowEstatePrivilegeName('tysiatskii_privilege')] získa na 30 rokov tieto účinky:\n#R +25.00%#! [ShowModifierTypeName('global_nobles_estate_power')] a #G +15.00%#! [ShowModifierTypeName('army_heavy_infantry_power')]" # todo: NEW TRANSLATION
 nov_influential_tysiatskii_requirement: "Nasledujúci bonus možno získať prostredníctvom [Concept('decision','rozhodnutia')|e] $nov_tysiatskii_influential_decision.title$:" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 nov_tysiatskii_influence_weakened_requirement: "Nasledujúci bonus možno získať prostredníctvom [Concept('decision','rozhodnutia')|e] $nov_tysiatskii_influential_decision.title$:" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 boh_district_paving_decision.title: "Právo mestských štvrtí [ShowLocationNameWithNoTooltip('prague')] vyberať dane" # todo: NEW TRANSLATION
 boh_district_paving_decision.desc: "Ako sa mestské hranice [ShowLocationName('prague')] rozširujú, mnohé významné osobnosti, ktoré stoja na čele jednotlivých mestských štvrtí, napríklad Malá Strana, začali žiadať právo zdaňovať obyvateľov žijúcich na ich území.\n\nTento krok by nepochybne preniesol veľkú časť vplyvu z rúk našej pokladnice do rúk [ShowEstateTypeName('nobles_estate')], a preto ho musíme dôkladne zvážiť." # todo: NEW TRANSLATION
 boh_district_paving_decision.a: "Dobre teda, vyhovejme ich žiadosti." # todo: NEW TRANSLATION
 boh_joint_assembly_decrees_decision.title: "Spoločné generálne zhromaždenie" # todo: NEW TRANSLATION
 boh_joint_assembly_decrees_decision.desc: "Odkedy sme sa stali hlavou [GetUniqueInternationalOrganization('hre').GetName], všimli sme si výrazné rozdiely medzi súdnymi postupmi v Ríši a našimi vlastnými. Kultúrne a tradičné odlišnosti túto priepasť ešte zväčšujú, aj keď sa snažíme brániť a legitimizovať svoju vládu.\n\nV snahe upevniť naše postavenie a priblížiť náš ľud Ríši mnohí poradcovia [target_character.GetName] navrhli spoločné generálne zhromaždenie. Zasadali by v ňom členovia [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')], poprední predstavitelia všetkých ríšskych kniežat aj naši zástupcovia. Zhromaždenie by zároveň potvrdilo platnosť mnohých existujúcich rímskych zákonov týkajúcich sa ich výsad." # todo: NEW TRANSLATION
 boh_joint_assembly_decrees_decision.desc.entry: "Vládnuť $hre$ a vládnuť našim vlastným krajinám sú v praxi dve rôzne úlohy, na ktoré sa vzťahujú dva odlišné súbory zákonov. Každým rokom, keď nosíme obe koruny, je táto priepasť nepríjemnejšia. Spoločné zhromaždenie, v ktorom by zasadali naši $nobles_estate$ spolu s ríšskymi kniežatami, by potvrdilo rímske zákony, na ktorých im záleží, no zároveň by ich postavilo takmer na úroveň rovnocenných partnerov." # todo: NEW TRANSLATION
 boh_joint_assembly_decrees_decision.a: "Je to zásadný a nevyhnutný krok k legitimizácii našej vlády." # todo: NEW TRANSLATION
 every_elector_25_opinion_tt: "Každý voliteľ získa [ShowBiasValue('granted_joint_assembly_decrees_modifier')|+=0] náklonnosť k nám" # todo: NEW TRANSLATION
 ven_doges_palace_decision.title: "Rozšírenie [ShowBuildingTypeNameWithNoTooltip('doges_palace')]" # todo: NEW TRANSLATION
 ven_doges_palace_decision.desc: "Výstavba [ShowBuildingTypeName('doges_palace')] v [ShowLocationName('venice')] sa začala v 9. storočí a pokračovala aj v nasledujúcich storočiach. Palác, pôvodne navrhnutý ako stavba pripomínajúca pevnosť, sa časom premenil na nádhernú ukážku gotickej architektúry. Tento architektonický skvost slúži zároveň ako sídlo [ROOT.GetCountry.GetGovernment.GetRulerTitle], najvýznamnejšieho politického predstaviteľa [GetCountry('VEN').GetLongNameWithNoTooltip], aj ako domov rôznych vládnych úradov a súdov.\n\nBudova však časom viditeľne zostarla a potrebuje renováciu. Možno by sme ju mali premeniť na palác, ktorý zatieni aj kráľovské sídla západných panovníkov." # todo: NEW TRANSLATION
 ven_doges_palace_decision.desc.entry: "Palác, ktorého výstavba sa začala v 9. storočí ako pevnosť, časom nadobudol veľkoleposť skôr náhodou než zámerne — a je to na ňom vidieť. Prestavba [ShowBuildingTypeName('doges_palace')] na stavbu, ktorá zatieni sídla západných kráľov, by nás stála celý majetok, ktorý by sme inak mohli minúť na lode." # todo: NEW TRANSLATION
 ven_doges_palace_decision.a: "To znie dobre!" # todo: NEW TRANSLATION
 ven_doges_palace_decision.historical_info: "Do 16. storočia prešiel Dóžov palác rozsiahlymi renováciami a rozšíreniami, ktoré výrazne umocnili jeho veľkoleposť. Jedným z najpozoruhodnejších úprav bolo dokončenie ikonickej fasády obrátenej ku Canal Grande, ktorá všetkým prichádzajúcim po vode ukazovala architektonickú nádheru paláca. Toto obdobie renovácií a rozširovania ešte viac upevnilo jeho postavenie ako trvalého symbolu benátskej moci a autority. Jeho sály a komnaty s prepracovaným dizajnom a honosnou výzdobou boli nielen svedkami storočí politického diania, ale aj trvalým svedectvom bohatej histórie mesta a jeho pretrvávajúceho významu na svetovej scéne." # todo: NEW TRANSLATION
 ven_piazza_san_marco_decision.title: "[ShowBuildingTypeNameWithNoTooltip('piazza_san_marco')]" # todo: NEW TRANSLATION
 ven_piazza_san_marco_decision.desc: "Rastúca moc a bohatstvo nášho slávneho [ROOT.GetCountry.GetFlavorRank] si vyžadujú investície do rozvoja hlavného mesta, aby sa na veľkoleposti [ShowLocationName('venice')] viditeľne odrážala naša prosperita. Predložili návrh na prestavbu centrálneho námestia [ShowBuildingTypeName('piazza_san_marco')], ktoré by ozdobili nádherné oblúky a mramor a vystavili tak na obdiv nádheru našej námornej ríše. Takáto renovácia by skrášlila naše mesto a bola by svedectvom našej trvalej moci a kultúrneho významu." # todo: NEW TRANSLATION
 ven_piazza_san_marco_decision.desc.entry: "Námornej ríši, ktorá doma pôsobí chudobne, nikto neuverí jej zahraničnému bohatstvu. Prestavba námestia pred palácom v [ShowLocationName('venice')] z mramoru a s oblúkmi nás bude stáť peniaze, za ktoré si nič nenajeme, no získa nám povesť, ktorá otvorí dvere, kam sa samotné peniaze nedostanú." # todo: NEW TRANSLATION
 ven_piazza_san_marco_decision.a: "Zafinancujeme renováciu." # todo: NEW TRANSLATION
 unlocked_piazza_san_marco_tt: "Vďaka príbehovej [Concept('decision','rozhodnutiu')|e] sme odomkli [Concept('building','budova')|e] $piazza_san_marco$" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 ven_piazza_san_marco_decision.historical_info: "#italic Piazza San Marco#!, známe aj ako Námestie svätého Marka, je hlavné verejné námestie v talianskych Benátkach a jedna z najznámejších dominánt mesta. Námestie vzniklo približne v 9. storočí a svoju dnešnú rozlohu dosiahlo v 12. storočí. Odvtedy ho neustále skrášľovali renovácie a nové pamätihodnosti. Obklopujú ho ikonické budovy vrátane Baziliky svätého Marka, Dóžovho paláca a Hodinovej veže svätého Marka. Po stáročia slúžilo ako ústredné miesto stretávania v Benátkach a dejisko politického, náboženského i spoločenského života." # todo: NEW TRANSLATION
 ven_teatro_san_cassiano_decision.title: "[ShowBuildingTypeNameWithNoTooltip('teatro_san_cassiano')]" # todo: NEW TRANSLATION
 ven_teatro_san_cassiano_decision.desc: "[ShowLocationName('venice')], už teraz žiarivý klenot kultúrneho života [ShowRegionName('italy_region')], je oddávna domovom prosperujúcej komunity umelcov a performerov. V snahe ešte viac upevniť jeho postavenie centra umeleckej dokonalosti a poskytnúť našim talentovaným obyvateľom veľkolepé javisko narastajú výzvy na výstavbu nádherného divadla a opernej budovy. Navrhované [ShowBuildingTypeName('teatro_san_cassiano')] by bolo majákom nádhery a bohatstva, predstavovalo by umelecký lesk [ShowLocationNameWithNoTooltip('venice')] a priťahovalo obdivovateľov zďaleka." # todo: NEW TRANSLATION
 ven_teatro_san_cassiano_decision.desc.entry: "Mesto, ktoré už preslávilo umenie, nemá vhodné miesto, kde by mohlo predviesť svoje najlepšie diela. Navrhované [ShowBuildingTypeName('teatro_san_cassiano')] poskytne [ShowLocationName('venice')] javisko hodné jeho povesti a každému súperiacemu prístavu ďalší dôvod na závisť." # todo: NEW TRANSLATION
 ven_teatro_san_cassiano_decision.a: "Zadajme výstavbu!" # todo: NEW TRANSLATION
 unlocked_teatro_san_cassiano_tt: "Vďaka príbehovej [Concept('decision','rozhodnutiu')|e] sme odomkli [Concept('building','budova')|e] $teatro_san_cassiano$" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 ven_teatro_san_cassiano_decision.historical_info: "Teatro San Cassiano, postavené v Benátkach v roku 1637, bolo prvou verejnou opernou budovou na svete. Predstavovalo významný míľnik v dejinách divadelného umenia a upevnilo postavenie Benátok ako popredného kultúrneho centra." # todo: NEW TRANSLATION
 ven_walls_of_ston_decision.title: "Opevnenie [ShowLocationNameWithNoTooltip('dubrovnik')]" # todo: NEW TRANSLATION
 ven_walls_of_ston_decision.desc: "[ShowLocationName('dubrovnik')] je významné obchodné [target_location.GetRank.GetName] a jedno z najcennejších území našej námornej ríše. Napriek svojmu významu je obrana [ShowLocationNameWithNoTooltip('dubrovnik')] značne zastaraná, a preto je ľahkou korisťou pre nepriateľov, ktorí môžu zaútočiť z pevniny aj z mora. Investovať zlato do modernizácie existujúcich hradieb a výstavby riadneho opevnenia by určite nebolo zbytočné." # todo: NEW TRANSLATION
 ven_walls_of_ston_decision.desc.entry: "[ShowLocationName('dubrovnik')] nám počas dobrej obchodnej sezóny zarobí viac než väčšina našich provincií za celý rok, no mohla by ho dobyť aj lúpežná skupina, ktorá sa ani neunúva poriadne obliehať. Riadne hradby stoja zlato, ktoré by sme radšej minuli inde — až do dňa, keď bez nich mesto padne." # todo: NEW TRANSLATION
 ven_walls_of_ston_decision.a: "[ShowLocationNameWithNoTooltip('dubrovnik')] musí byť dobre chránený." # todo: NEW TRANSLATION
 ven_walls_of_ston_decision.b: "Súčasné opevnenie je dostatočne silné." # todo: NEW TRANSLATION
 ven_walls_of_ston_decision.historical_info: "Stonské hradby, postavené v 14. storočí, sú sústavou obranných kamenných múrov na polostrove Pelješac v Chorvátsku. Chránia cenné soľné panvy aj mesto Ston. S dĺžkou približne 7 kilometrov patria k najdlhším opevneniam v Európe a preslávili sa svojou impozantnou dĺžkou a strategickým významom v stredoveku." # todo: NEW TRANSLATION
 zan_husuni_kubwa_decision.title: "[ShowBuildingTypeNameWithNoTooltip('husuni_kubwa')]" # todo: NEW TRANSLATION
 zan_husuni_kubwa_decision.desc: "[GetCharacter('zan_abu_al_mawahib_al_hasan_ibn_suleiman').GetName] pôvodne zadal výstavbu [ROOT.GetCountry.GetGovernment.GetAdjective] sídla v centre [target_location.GetName], ktoré malo byť najpôsobivejším palácom. Nešťastné okolnosti, presmerovanie financií aj osobná choroba však projekt opakovane zdržiavali a takmer úplne zastavili. Napriek týmto problémom naši architekti predložili upravený plán paláca, rozšíreného o sklady a miestnosti určené na obchodné rokovania, ako aj o nádhernú trónnu sálu. Jedinou prekážkou je momentálne nedostatok peňazí." # todo: NEW TRANSLATION
 zan_husuni_kubwa_decision.desc.entry: "Každý vládca pred nami chcel tento palác dokončiť a každý z nich si našiel dôvod, prečo to nešlo. Nový plán pre [ShowLocationName('kilwa_kisiwani')], so skladmi zodpovedajúcimi nášmu obchodu a trónnou sálou hodnou prijímania hostí, čaká len na peniaze, ktorých chýbalo aj pri predošlých pokusoch." # todo: NEW TRANSLATION
 zan_husuni_kubwa_decision.a: "Zadajme výstavbu." # todo: NEW TRANSLATION
 zan_husuni_kubwa_decision.b: "Zatiaľ je to príliš drahé..." # todo: NEW TRANSLATION
 zan_husuni_kubwa_decision.historical_info: "Husuni Kubwa je svedectvom architektonického a politického umu Kilwského sultanátu na vrchole jeho moci v 14. storočí. Tento rozsiahly palácový komplex v Kilwa Kisiwani nechal postaviť sultán al-Ḥasan ibn Sulaymān. Rozprestieral sa na ploche 1,6 hektára, bol postavený prevažne z koralového kameňa a spájal svahilské, islamské a perzské architektonické vplyvy. Zahŕňal luxusné súkromné komnaty, veľké nádvoria, dômyselné kúpele a sklady, čo odrážalo jeho mnohostrannú úlohu kráľovského sídla, obchodného centra aj opevnenia." # todo: NEW TRANSLATION
 construct_the_building_at_another_time_tt: "Môžeme sa rozhodnúť postaviť [ShowBuildingTypeNameWithNoTooltip('husuni_kubwa')] inokedy..." # todo: NEW TRANSLATION
 unlocked_husuni_kubwa_tt: "Odomkli sme $husuni_kubwa$ [Concept('building','budova')|e] prostredníctvom príbehovej [Concept('event','udalosti')|e]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 pap_quirinal_palace_decision.title: "Letné sídlo pápežov" # todo: NEW TRANSLATION
 pap_quirinal_palace_decision.desc: "[GetCountry('PAP').GetGovernment.GetRulerTitle] prejavil záujem o zriadenie letného sídla mimo rušných a preplnených ulíc centra [ShowLocationName('rome')]. Kvirinál, jeden zo slávnych siedmich pahorkov [ShowLocationNameWithNoTooltip('rome')], sa považuje za ideálne miesto: ponúka pokojné útočisko s chladným vánkom a panoramatickými výhľadmi. Ak sa do toho pustíme, na návrh a výstavbu paláca by mohol dohliadať uznávaný architekt [fontana.GetName]." # todo: NEW TRANSLATION
 pap_quirinal_palace_decision.desc.entry: "Rušné centrum [ShowLocationName('rome')] je presne tým, čomu sa pápež chce vyhnúť, a Kvirinál ponúka vánok i výhľad bez davov. $name_dominic$ $Fontana$ je architekt, ktorý ho dokáže postaviť, ak bude Svätá stolica ochotná zaplatiť za druhé sídlo, ktoré vlastne nepotrebuje." # todo: NEW TRANSLATION
 pap_quirinal_palace_decision.a: "Postavme letné sídlo na Kvirináli." # todo: NEW TRANSLATION
 pap_quirinal_palace_decision.b: "Teraz nie je čas na okázalé projekty. Namiesto toho by sme sa mali sústrediť na zdokonaľovanie schopností našich umelcov." # todo: NEW TRANSLATION
 pap_quirinal_palace_decision.historical_info: "Kvirinálsky palác dal v roku 1583 postaviť pápež Gregor XIII. ako letné sídlo pápežov. Na jeho návrhu sa podieľali významní architekti vrátane Domenica Fontanu a palác poskytoval útočisko pred horúčavou a davmi v centre Ríma. Keď novovzniknuté Talianske kráľovstvo anektovalo väčšinu z toho, čo zostalo z Pápežského štátu, stal sa Kvirinálsky palác sídlom talianskych kráľov." # todo: NEW TRANSLATION
 nav_camara_comptos_decision.title: "Cámara de Comptos" # todo: NEW TRANSLATION
 nav_camara_comptos_decision.desc: "Financie krajiny sú vážna vec a náš [ROOT.GetCountry.GetGovernment.GetRuler.GetName] verí, že [ROOT.GetCountry.GetLongName] by veľmi prospelo zriadenie stálej inštitúcie, ktorá by sa nimi zaoberala.\n\nPodľa vzoru podobných inštitúcií v [GetCountry('FRA').GetLongName] bude náš štát ekonomicky životaschopnejší a lepšie pripravený vyrovnať sa s prípadnými finančnými ťažkosťami, ktoré nám môže priniesť naša neistá situácia." # todo: NEW TRANSLATION
 nav_camara_comptos_decision.desc.entry: "Pokladnica spravovaná improvizovane si v dobrých rokoch vedie celkom dobre, no v zlých zlyháva, a príklad $FRA$ ukazuje, že stála inštitúcia funguje lepšie než oboje. Založením vlastnej inštitúcie by vládca odovzdal časť osobnej kontroly nad štátnou pokladnicou výmenou za úrad, ktorý pretrvá aj po tom, čo sa mu prestane venovať." # todo: NEW TRANSLATION
 nav_camara_comptos_decision.a: "Zriadime stály súd." # todo: NEW TRANSLATION
 nav_camara_comptos_decision.historical_info: "Počiatky Cámara de Comptos siahajú k úradníkom nazývaným #italic oidores#! (od slovesa #italic oir#!, „počúvať“), ktorí spravovali a kontrolovali kráľovské financie prinajmenšom od roku 1258, keď vznikol prvý záznam o účtovnej knihe Comptos. Táto inštitúcia, výrazne ovplyvnená podobnými francúzskymi úradmi, napríklad parížskou #italic Chambre des Comptes#!, sa za kráľa Karola II. stala stálou inštitúciou. Jej úlohou bolo kontrolovať výdavky krajiny a radiť panovníkom vo finančných záležitostiach.\n\nPovažuje sa za najstarší audítorský súd v Španielsku a dodnes funguje ako služba parlamentu autonómneho spoločenstva Navarry." # todo: NEW TRANSLATION
 hun_bibliotheca_corviniana_decision.title: "[ShowBuildingTypeNameWithNoTooltip('bibliotheca_corviniana')]" # todo: NEW TRANSLATION
 hun_bibliotheca_corviniana_decision.desc: "Keď sa [ShowInstitutionName('renaissance')] šíri kontinentom ako lesný požiar a zapaľuje plamene poznania a kultúrnej obnovy, náš [ROOT.GetCountry.GetGovernment.GetCourtTitle] je plný úvah o možnostiach, ktoré prináša. V našich mestách sa začali zhromažďovať učenci, umelci a myslitelia, ktorých inšpiruje nová vlna myšlienok šíriaca sa po [ShowContinentName('europe')]. Objavil sa návrh postaviť v [ROOT.GetCountry.GetCapital.GetAltAdjective('L')] veľkolepú knižnicu, ktorá by prilákala učencov zďaleka a urobila z [GetCountry('HUN').GetName] baštu [ShowInstitutionNameWithNoTooltip('renaissance')]. Financovanie takého ambiciózneho projektu by však bolo veľmi nákladné. Investujeme do výstavby [ShowBuildingTypeName('bibliotheca_corviniana')]?" # todo: NEW TRANSLATION # todo: COUNTRY CASE
 hun_bibliotheca_corviniana_decision.desc.entry: "Každé mesto, ktoré tvrdí, že stojí na čele [ShowInstitutionName('renaissance')], už postavilo niečo na dôkaz svojich slov, len $HUN$ nie. Veľkolepá knižnica v hlavnom meste by prilákala učencov, ktorí nás dnes obchádzajú, a jej cena sa bude spätne ospravedlňovať ľahšie než teraz." # todo: NEW TRANSLATION
 hun_bibliotheca_corviniana_decision.a: "Veľkolepé!" # todo: NEW TRANSLATION
 hun_bibliotheca_corviniana_decision.b: "Viac nám prospeje zlepšenie našich vzdelávacích inštitúcií." # todo: NEW TRANSLATION
 unlocked_bibliotheca_corviniana_tt: "Vďaka príbehovej [Concept('decision','rozhodnutiu')|e] sme odomkli [Concept('building','budova')|e] $bibliotheca_corviniana$" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 hun_bibliotheca_corviniana_decision.historical_info: "Matej Korvín, prezývaný renesančný kráľ, bol významným mecenášom umenia a vedy. Počas jeho vlády sa Uhorsko stalo prvou krajinou mimo Talianska, ktorá prijala renesanciu, a Bibliotheca Corviniana bola jedným z jeho najvýznamnejších príspevkov ku kultúrnej obnove Uhorska. Slúžila ako centrum výmeny poznatkov a zohrávala kľúčovú úlohu pri šírení vedomostí po celej krajine. Do knižnice prichádzali učenci z celého kontinentu a prispievali k intelektuálnemu kvasu renesancie. Stala sa symbolom intelektuálneho zanietenia renesancie v Uhorsku aj moci mecenášstva pri rozvíjaní poznania a inovácií." # todo: NEW TRANSLATION
 mam_ablaq_palace_decision.title: "Citadela [ShowLocationNameWithNoTooltip('cairo')]" # todo: NEW TRANSLATION
 mam_ablaq_palace_decision.desc: "[target_location.GetName], centrum poznania, osvietenstva a čulého obchodu medzi vnútrozemím [ShowContinentName('africa')] a Stredozemím, je bijúcim srdcom nášho rozvíjajúceho sa [ROOT.GetCountry.GetFlavorRank]. Citadela slúžila generáciám najvýznamnejších a najváženejších panovníkov. Náš súčasný [ROOT.GetCountry.Custom('GetRulerOrRegentTitle')] nedávno dostal ambiciózne plány na rozšírenie jej rôznych častí. Zahŕňajú novú mešitu s medresou, väčšiu audienčnú sálu a tiež stredisko na výrobu kiswy." # todo: NEW TRANSLATION
 mam_ablaq_palace_decision.desc.entry: "Citadela, v ktorej sídlili celé generácie panovníkov, sa dá upraviť tak, aby vyzerala, akoby hostila len tých najväčších z nich. Rozšírenie o novú mešitu s medresou, honosnejšiu audienčnú sálu a dielňu na výrobu kiswy by o našej vláde vypovedalo rovnako veľa ako každé vojenské ťaženie, no stálo by omnoho menej krvi." # todo: NEW TRANSLATION
 mam_ablaq_palace_decision.a: "Dobre teda." # todo: NEW TRANSLATION
 mam_ablaq_palace_decision.b: "Radšej budeme šetriť." # todo: NEW TRANSLATION
 unlocked_ablaq_palace_tt: "Vďaka [Concept('decision','rozhodnutiu')|e] „$mam_ablaq_palace_decision.title$“ sme odomkli túto [Concept('building','budovu')|e]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 son_trans_saharan_decision.title: "Rozkvet transsaharského obchodu" # todo: NEW TRANSLATION
 son_trans_saharan_decision.desc: "Transsaharský obchod dosiahol nové výšiny, odkedy ovládame jeho trasy. Namiesto nečinného prizerania sa môžeme pokúsiť rozšíriť naše základne v cieľových mestách, kam dorážajú naše karavány. Najmä [ShowLocationName('alexandria')], [ShowLocationName('tunis')] a [ShowLocationName('fez')] sú hlavnými cieľmi, ktoré by sme mali podporiť." # todo: NEW TRANSLATION
 son_trans_saharan_decision.a: "Nech tieto karavánové zastávky prekvitajú." # todo: NEW TRANSLATION
 son_trans_saharan_decision.b: "Namiesto jednotlivých miest posilnime celý obchod." # todo: NEW TRANSLATION
 son_trans_saharan_decision.c: "Investovať do toho peniaze sa neoplatí." # todo: NEW TRANSLATION
 son_unlock_unique_buildings_in_alexandria_tunis_and_fez_tt: "Odomkne výstavbu [ShowBuildingTypeName('trans_saharan_trade_outposts')] v [ShowLocationName('fez')], [ShowLocationName('tunis')] a [ShowLocationName('alexandria')]" # todo: NEW TRANSLATION
 son_conversion_west_africa_decision.title: "Obrátenie národov [ShowReligionGroupAdjectiveWithNoTooltip('folk_african_group')]" # todo: NEW TRANSLATION
 son_conversion_west_africa_decision.desc: "Hoci sme najsilnejšou mocnosťou v [ShowRegionName('guinea_region')], stále existujú národy, ktoré nevyznávajú [ShowReligionGroupName('muslim')]. Mohli by sme ich obrátiť na vieru silou, no [target_character.GetName] chce zvoliť pokojnejšiu stratégiu. [target_character.GetSheHe|U] si želá šíriť [ShowReligionGroupNameWithNoTooltip('muslim')] diplomaciou, a nie mečom rozdúchavať ďalšie nepokoje." # todo: NEW TRANSLATION
 son_conversion_west_africa_decision.desc.entry: "Meč neobráti na vieru nikoho, kto prežije obrátenie, iba umlčí tých, ktorí by možno namietali. Vládca radšej vyšle do [ShowRegionName('guinea_region')] misionárov než vojakov a vymení tak rýchlejšie šírenie viery za také, po ktorom nezostane vypálená dedina." # todo: NEW TRANSLATION
 son_conversion_west_africa_decision.a: "To znie ako dobrý nápad." # todo: NEW TRANSLATION
 son_conversion_west_africa_decision.b: "Použitie sily je lepšia možnosť." # todo: NEW TRANSLATION
 son_unlock_diplo_action_to_demand_conversion_tt: "Odomkneme [ShowCountryInteractionName('demand_conversion_to_islam')] [Concept('country_interaction','interakcia s krajinou')|E] proti neveriacim v [ShowRegionName('guinea_region')]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 ori_elephant_hunting_grounds_decision.title: "Lov [ShowGoodsNameWithNoTooltip('elephants')]" # todo: NEW TRANSLATION
 ori_elephant_hunting_grounds_decision.desc: "Vzhľadom na prebytok [ShowGoodsName('elephants')] v krajine [ROOT.GetCountry.GetAltAdjective('D')] sa diskutuje o zvýšení počtu plukov využívajúcich tieto mocné zvieratá. Naše súčasné [ShowBuildingTypeName('elephant_hunting_grounds')] však nemajú potrebné zdroje na rozšírenie lovu a zabezpečenie dostatočného vybavenia. Možno nastal čas poskytnúť im potrebnú podporu. [target_character.GetName] a [ROOT.GetCountry.GetGovernment.GetCourtTitle] sú dokonca ochotní vyčleniť na tento účel časť vlastných financií." # todo: NEW TRANSLATION # todo: COUNTRY CASE
 ori_elephant_hunting_grounds_decision.desc.entry: "Slon má pre armádu len malú cenu, kým ho niekto neodchytí, nevycvičí a nevyzbrojí, a naše [ShowBuildingTypeName('elephant_hunting_grounds')] sa o nič z toho zatiaľ takmer vôbec nestarajú. Dvor je pripravený financovať rozšírenie z vlastných zdrojov, takže otázkou nie sú ani tak peniaze, ako skôr to, či viac vojnových slonov zodpovedá našim súčasným ambíciám." # todo: NEW TRANSLATION
 ori_elephant_hunting_grounds_decision.a: "Podporme tieto lovy." # todo: NEW TRANSLATION
 ori_elephant_hunting_grounds_decision.b: "Netreba na to míňať peniaze." # todo: NEW TRANSLATION
 ori_double_elephant_hunting_ground_level_tt: "Maximálna úroveň [ShowBuildingTypeName('elephant_hunting_grounds')] [Concept('building','budova')|e] bude zvýšená o #G +2#!" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 INCREASED_MAX_LEVEL_ELEPHANT_HUNTING_GROUND: "Zvýšená maximálna úroveň z [Concept('events','udalostí')|e]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 jap_rangaku_decision.title: "Rangaku" # todo: NEW TRANSLATION
 jap_rangaku_decision.desc: "Obchodníci [target_country.GetAdjective] už nejaký čas pôsobia na ostrove Dejima v [target_location.GetName] a kontakt medzi naším ľudom a touto enklávou je prísne kontrolovaný. Napriek tomu naše dve kultúry nevyhnutne zazreli čosi z tej druhej. Zdá sa, že [target_country.GetAdjectiveWithNoTooltip] ľud vie veci, ktoré my nepoznáme, najmä v oblasti medicíny, ale aj vedy, výroby a strojárstva. Niektorí naši bohatší občania sa dokonca rozhodli využiť služby [target_country.GetAdjectiveWithNoTooltip] chirurga v enkláve namiesto toho, aby sa spoliehali na miestnych lekárov.\n\nJe zrejmé, že intenzívnejší kontakt s týmito návštevníkmi zo Západu by nás mohol mnohému naučiť, ak sme ochotní trochu viac otvoriť naše provincie." # todo: NEW TRANSLATION
 jap_rangaku_decision.desc.entry: "Aj na prísne stráženej obchodnej stanici prenikajú cez múry, ktoré ju majú izolovať, záblesky poznania. Enkláva $NED_ADJ$ už roky sprostredkúva vedomosti z medicíny, strojárstva a vedy. Ak zmiernime ostražitosť, prenikne k nám viac z nich, no za cenu izolácie, ktorú mala naša stráž zachovať." # todo: NEW TRANSLATION
 jap_rangaku_decision.a: "Otvorme naše provincie poznatkom [target_country.GetAdjectiveWithNoTooltip]." # todo: NEW TRANSLATION
 jap_rangaku_decision.a.entry: "Otvorme naše provincie poznatkom $NED_ADJ$." # todo: NEW TRANSLATION
 jap_rangaku_decision.a.tt: "Odomkne [Concept('government_reform','reforma vlády')|e] [ShowGovernmentReformName('jap_rangaku')]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 jap_rangaku_decision.b: "Nechajme naše provincie uzavreté." # todo: NEW TRANSLATION
 mch_mandarin_language_reforms_decision.title: "Prijatie starého režimu" # todo: NEW TRANSLATION
 mch_mandarin_language_reforms_decision.desc: "Sme len ďalším článkom v rodovej línii božských cisárov $china$. Rôzne dynastie pred nami už vytvorili účinné byrokracie, vďaka ktorým dokázali udržať rozsiahlu [GetInternationalOrganization('middle_kingdom').GetName] pohromade. Prečo by sme nemali tieto zásady prevziať? Takýto krok by nás viac [ShowSocietyDirectionName('sinicized')], no zároveň by zachoval kontinuitu a posilnil našu autoritu v očiach prostého ľudu." # todo: NEW TRANSLATION
 mch_mandarin_language_reforms_decision.a: "Prevezmeme tieto inštitúcie." # todo: NEW TRANSLATION
 mch_mandarin_language_reforms_decision.b: "Uprednostnime [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')]." # todo: NEW TRANSLATION
 mch_mandarin_language_reforms_decision.b.entry: "Uprednostnime $tribes_estate$." # todo: NEW TRANSLATION
 unlock_chinese_language_reforms: "Týmto uzamknete [Concept('government_reform','reforma vlády')|e] [ShowGovernmentReformName('three_departments_system')]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 MCH_conditional_benefit: "Ak neprijmeme [ShowGovernmentReformName('three_departments_system')] [Concept('government_reform','reforma vlády')|e], [ShowEstatePrivilegeName('mch_tribal_favor')] poskytne dodatočné výhody." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 pru_unified_legal_system_decision.title: "Reforma práva" # todo: NEW TRANSLATION
 pru_unified_legal_system_decision.desc: "Štát, akým je ten náš, sa musí neustále prispôsobovať zmenám. V našom právnom systéme teraz stúpa po rebríčku sľubný kandidát, ktorý by mohol viesť naliehavo potrebnú reformu. Tento [target_character.GetName] pôsobí ako predseda súdu #italic Kammergericht#! a vypracoval plány na reformu právneho systému v celej krajine [ROOT.GetCountry.GetAltAdjective('D')]. Ak jeho snahy podporíme, mohli by viesť k rýchlej a zásadnej premene našej krajiny." # todo: NEW TRANSLATION # todo: COUNTRY CASE
 pru_unified_legal_system_decision.desc.entry: "Právny systém zdedený z tucta rôznych období nikomu neslúži obzvlášť dobre, no to zvyčajne stačí na to, aby prežil ďalšiu generáciu bez reformy. Predseda súdu #italic Kammergericht#! vypracoval plány, ako to zmeniť. Ak ho podporíme, zaviažeme sa k reforme, ktorej konečnú podobu zatiaľ nepoznáme." # todo: NEW TRANSLATION
 pru_unified_legal_system_decision.a: "Podporme jeho reformy!" # todo: NEW TRANSLATION
 pru_unified_legal_system_decision.a_tt: "[Concept('character','Postava')|e], ktorý navrhuje reformu, sa objaví na našom [Concept('court','dvor')|e]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 pru_unified_legal_system_decision.a.tt: "Pokrok reformy bude výrazne rýchlejší" # todo: NEW TRANSLATION
 pru_unified_legal_system_decision.b: "Skroťme jeho ambície." # todo: NEW TRANSLATION
 pru_unified_legal_system_decision.b.tt: "Pokrok reformy bude výrazne pomalší" # todo: NEW TRANSLATION
 boh_bohemian_commonwealth_decision.title: "Založenie spoločenstva" # todo: NEW TRANSLATION
 boh_bohemian_commonwealth_decision.desc: "Naša cesta dejinami vyniesla krajinu [ROOT.GetCountry.GetAltAdjective('A')] z postavenia malej mocnosti až na cisárske výslnie. Stali sme sa významnou silou na svetovej scéne, vládneme rozsiahlym územiam a mnohým národom. Riadenie takejto krajiny si však vyžaduje pevnú ruku. Vzhľadom na obavy zo separatizmu a napätie medzi národnosťami [ROOT.GetCountry.GetFlavorRank] niektorí navrhujú prijať novú ústavu. Tvrdia, že pri zakladaní väčšieho spoločenstva musíme hľadieť aj za hranice toho, čo sa tradične považovalo za [ROOT.GetCountry.GetAltAdjectiveWithNoTooltip('A')]. Naša ríša sa bude rozprestierať na rozľahlých územiach [ShowContinentName('europe')] a zaujmeme miesto medzi veľmocami sveta." # todo: NEW TRANSLATION # todo: COUNTRY CASE
 boh_bohemian_commonwealth_decision.desc.entry: "Ríša, ktorá vyrástla z malého kráľovstva, nevznikla tým, že by sa k mnohým národom pristupovalo ako k jednému. Aby sme ich teraz udržali pohromade, možno budeme musieť konečne uznať, že jedným národom nie sú. Nové spoločenstvo, širšie než územie, ktoré nám tradične patrilo, ohrozuje samotnú identitu, na ktorej ríša vyrástla. Riskujeme ju, aby sa ríša nerozpadla vo švíkoch." # todo: NEW TRANSLATION
 boh_bohemian_commonwealth_decision.a: "Prijmime novú ústavu." # todo: NEW TRANSLATION
 ned_unified_dutch_admiralties_decision.title: "Založenie piatich admirálstiev" # todo: NEW TRANSLATION
 ned_unified_dutch_admiralties_decision.desc: "Našim krajinám síce vládne [target_character.GetName], no rozdiely medzi provinciami rozdelili naše [ShowBuildingTypeName('admiralty')]. Súperenie medzi [ShowLocationName('groningen')], [ShowLocationName('hoorn')], [ShowLocationName('rotterdam')], [ShowLocationName('middelburg')] a [ShowLocationName('amsterdam')] nám bráni zjednotiť naše loďstvá. Ak im však dovolíme presadzovať vlastné záujmy, možno sa každé z nich bude angažovať ešte viac." # todo: NEW TRANSLATION
 ned_unified_dutch_admiralties_decision.desc.entry: "Päť admirálstiev podriadených piatim prístavom znamená päť loďstiev súperiacich o tie isté lode. Ak zjednotíme [ShowLocationName('groningen')], [ShowLocationName('hoorn')], [ShowLocationName('rotterdam')], [ShowLocationName('middelburg')] a [ShowLocationName('amsterdam')] pod jedno velenie, rivalita sa skončí. Ak im však ešte chvíľu dovolíme presadzovať vlastné záujmy, možno z nich napokon získame viac, než keby sme ich do zlúčenia nútili." # todo: NEW TRANSLATION
 ned_unified_dutch_admiralties_decision.a: "Dovoľme týmto admirálstvam, aby fungovali samostatne." # todo: NEW TRANSLATION
 ned_unified_dutch_admiralties_decision.b: "Zjednoťme ich." # todo: NEW TRANSLATION
 NED_UNLOCKS_UNIFIED_ADMIRALTIES_GOV_REFORM: "Odomkne [ShowGovernmentReformName('unified_admiralty_reform')] [Concept('government_reform','reforma vlády')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 ned_unified_dutch_admiralties_decision.historical_info: "Počas holandského povstania proti Habsburgovcom vytvoril holandský ľud konfederáciu, v ktorej si každá provincia mohla zachovať vlastné záujmy. Aj túto konfederáciu však sužovalo súperenie, keď štatisti a orangisti bojovali o kontrolu nad početnými provinciami. Celý tento systém bol zrušený až v napoleonskej ére, počas Batavskej republiky, čo viedlo k vzniku Holandského kráľovstva, ako ho poznáme dnes." # todo: NEW TRANSLATION
 hol_ned_seven_provinces_decision.title: "Sedem provincií" # todo: NEW TRANSLATION
 hol_ned_seven_provinces_decision.desc: "Hoci Nízke krajiny zjednotil spoločný cieľ, naďalej ich rozdeľujú právne nároky a kultúrne rozdiely. Túto nejednotnosť však môžeme využiť vo svoj prospech. Ak vytvoríme konfederáciu, v ktorej bude mať každá provincia vlastné zákony a práva, no zároveň bude poslúchať ústrednú vládu, zaistíme, že každá z nich bude chránená a bude môcť samostatne prosperovať. Nám to umožní obrátiť pozornosť navonok." # todo: NEW TRANSLATION
 hol_ned_seven_provinces_decision.a: "Vytvorme túto konfederáciu." # todo: NEW TRANSLATION
 hol_ned_seven_provinces_decision.b: "Decentralizácia nie je riešením." # todo: NEW TRANSLATION
 swe_age_of_freedom_decision.title: "Prehodnotenie absolutizmu" # todo: NEW TRANSLATION
 swe_age_of_freedom_decision.desc: "[ROOT.GetCountry.GetName|U] je na pokraji kolapsu. Súčasný [ROOT.GetCountry.GetGovernment.GetActiveRegentTitle] má toľko odporcov ako podporovateľov a každý deň vznikajú nové skupiny, ktoré podporujú konkurenčných uchádzačov o trón. Zahraničné mocnosti do [ROOT.GetCountry.GetAdjectiveWithNoTooltip] vlády zasahujú natoľko, že sa cítime skôr ako bábkový štát než veľký národ. Ľudia zo všetkých vrstiev otvorene odporujú neznesiteľnému bremenu absolútnej vlády.\n\nSnaha udržať si úplnú kontrolu sa môže zo strany [ROOT.GetCountry.GetGovernment.GetActiveRegentTitle] ukázať ako osudová chyba. Musíme sa pripraviť na násilný odpor bez ohľadu na to, ako sa rozhodneme." # todo: NEW TRANSLATION
 swe_age_of_freedom_decision.desc.entry: "Regent, ktorý má po celom kráľovstve súperov, v skutočnosti nevládne, iba rozhoduje spory. Zahraničné dvory si tento rozdiel všimli rovnako dobre ako naši poddaní. Trvať na absolútnej vláde teraz môže vyvolať boj, o ktorého výsledku nikto z nás nemôže byť istý, nech sa rozhodneme akokoľvek." # todo: NEW TRANSLATION
 swe_age_of_freedom_decision.a: "Zanechajme absolutizmus." # todo: NEW TRANSLATION
 swe_age_of_freedom_decision.b: "Držme sa oprát..." # todo: NEW TRANSLATION
 swe_age_of_freedom_always: "Toto je uzamknutá reforma, ktorú nie je možné zvoliť na odstránenie." # todo: NEW TRANSLATION
 swe_age_of_freedom_decision.historical_info: "Po smrti bezdetného Karola XII. prevzala vládu ako kráľovná jeho mladšia sestra Ulrika Eleonóra. Zarytý parlamentarista, kancelár Arvid Horn, okamžite využil túto príležitosť na odstránenie absolutizmu a posilnenie právomocí parlamentu. Hoci jeho demokratické zmýšľanie bolo svojím spôsobom chvályhodné, jeho kroky úplne destabilizovali Švédsko a na nasledujúcich 50 rokov z neho urobili bábku v rukách zahraničných záujmov. Počas takzvaného „veku slobody“ získala späť časť strateného vplyvu aj aristokracia. Mladá kráľovná však nevidela jasnú alternatívu, ktorá by príliš nerozrušila jej vojnou vyčerpaný ľud." # todo: NEW TRANSLATION
 iro_iroquois_interactions_decision.title: "Odkaz Veľkého mierotvorcu" # todo: NEW TRANSLATION
 iro_iroquois_interactions_decision.desc: "Konfederácia [ShowCultureGroupName('haudenosaunee_group')], kedysi rozdelený ľud, vznikla vďaka dielu Veľkého mierotvorcu Deganawidu, ktorý spojil znepriatelené kmene do jedného rodinného zväzku. Od založenia konfederácie zostali kmene [ShowCultureGroupNameWithNoTooltip('haudenosaunee_group')] zjednotené a žili vedľa seba v mieri. V poslednom čase sa však čoraz častejšie ozývajú hlasy, že by sa mal jeden kmeň stať dominantným a ujať sa vedúcej úlohy. Takýto krok by však mohol ohroziť samotné základy, na ktorých Deganawida založil konfederáciu [ShowCultureGroupNameWithNoTooltip('haudenosaunee_group')]." # todo: NEW TRANSLATION
 iro_iroquois_interactions_decision.a: "Časy sa menia." # todo: NEW TRANSLATION
 may_unify_haudenosaunee_confederation: "Odomyká interakcie [ShowCountryInteractionName('form_closer_bond_iroquois')] a [ShowCountryInteractionName('merge_tribe_iroquois')] voči ostatným národom [ShowCultureGroupName('haudenosaunee_group')]. Zjednotenie území [ShowCultureGroupNameWithNoTooltip('haudenosaunee_group')] nám umožní preformovať sa na zjednotenú Konfederáciu [ShowCultureGroupNameWithNoTooltip('haudenosaunee_group')]." # todo: NEW TRANSLATION

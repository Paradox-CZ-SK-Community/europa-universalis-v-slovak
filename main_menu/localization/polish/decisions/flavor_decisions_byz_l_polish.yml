 byz_army_reform_decision.desc: "Hoci naša armáda v minulosti dominovala vďaka thematám a početným odvodom, ktoré poskytovali, rast bohatstva a centralizácia ríš viedli k tomu, že sa armáda stala povolaním na plný úväzok. [target_character.GetName] a [target_character.GetHerHis] rada usilovne pripravujú novú organizáciu armády, ktorá bude menej závislá od vojsk poskytovaných stavom [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]." # todo: NEW TRANSLATION
 byz_army_reform_decision.desc.entry: "Hoci naša armáda v minulosti dominovala vďaka thematám a početným odvodom, ktoré poskytovali, rast bohatstva a centralizácia ríš viedli k tomu, že sa armáda stala povolaním na plný úväzok. Naša vláda by mohla pripraviť plán reformy armády, vďaka ktorému by sme boli menej závislí od podpory šľachty." # todo: NEW TRANSLATION
 byz_army_reform_decision.a: "Armáda bude slúžiť [target_character.GetNameWithNoTooltip]." # todo: NEW TRANSLATION

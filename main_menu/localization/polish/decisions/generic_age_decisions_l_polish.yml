l_polish:
 sponsor_a_cathedral_decision.title: "Podporiť výstavbu katedrály" # todo: NEW TRANSLATION
 sponsor_a_cathedral_decision.desc: "V našej krajine stále chýbajú miesta na uctievanie a praktizovanie našej viery. Mali by sme podporiť výstavbu novej [ShowBuildingTypeName('cathedral')], ktorá uspokojí potreby nášho ľudu." # todo: NEW TRANSLATION
 sponsor_a_cathedral_decision.a: "[ROOT.GetCountry.Custom('common_string_positive')]" # todo: NEW TRANSLATION
 sponsor_a_cathedral_decision.a.entry: "$common_string_brilliant$" # todo: NEW TRANSLATION
 sponsor_a_cathedral_cooldown_tt: "Počas vlády súčasného panovníka toto [Concept('decision','rozhodnutie')|e] ešte nepoužil" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 sponsor_a_cathedral_cost_estimate_tt: "[ShowBuildingTypeName('cathedral')] bude stáť základnú cenu 400@gold!. Zľavu poskytne $royal_sponsorship$ a výsledná cena závisí od [Concept('location','lokality')|e], v ktorom sa bude stavať." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 sponsor_a_great_madrasa_decision.title: "Podporiť výstavbu veľkej madrasy" # todo: NEW TRANSLATION
 sponsor_a_great_madrasa_decision.desc: "Hoci sa v našej krajine už nachádza mnoho miest na uctievanie, obyčajné [ShowBuildingTypeName('temple')] a [ShowBuildingTypeName('madrasa')] nestačia na uspokojenie potrieb našich vzdelancov. Mali by sme investovať do novej [ShowBuildingTypeName('great_madrasa')], ktorá im poskytne vhodné priestory na štúdium a šírenie vedomostí." # todo: NEW TRANSLATION
 sponsor_a_great_madrasa_decision.a: "[ROOT.GetCountry.Custom('common_string_positive')]" # todo: NEW TRANSLATION
 sponsor_a_great_madrasa_decision.a.entry: "$common_string_brilliant$" # todo: NEW TRANSLATION
 sponsor_a_great_madrasa_cooldown_tt: "$sponsor_a_cathedral_cooldown_tt$" # todo: NEW TRANSLATION
 sponsor_a_great_madrasa_cost_estimate_tt: "[ShowBuildingTypeName('great_madrasa')] bude stáť základnú cenu [ShowNamedValue('expensive_build_price_age_of_tradition')|0]@gold!. Zľavu poskytne $royal_sponsorship$ a výsledná cena závisí od [Concept('location','lokality')|e], v ktorom sa bude stavať." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 construct_a_grand_palace_decision.title: "Objednať výstavbu nového paláca" # todo: NEW TRANSLATION
 construct_a_grand_palace_decision.desc: "Náš dvor aj rodina nášho panovníka nemajú sídlo, ktoré by zodpovedalo ich prestíži. Mali by sme najať [ShowArtistTypeName('architect')], aby naplánoval výstavbu nového [ShowBuildingTypeName('grand_palace')]." # todo: NEW TRANSLATION
 construct_a_grand_palace_decision.a: "Bude to dôstojné sídlo." # todo: NEW TRANSLATION
 construct_a_grand_palace_decision.a_tt: "Najatý [ShowArtistTypeName('architect')] sa pridá k nášmu [Concept('court','dvoru')|e]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 strive_towards_thalassocracy_decision.title: "Založiť talasokraciu" # todo: NEW TRANSLATION
 strive_towards_thalassocracy_decision.desc: "Rozľahlé moria by sa mohli stať dôležitou súčasťou našej krajiny a jej hospodárskeho rozmachu, keby sa nám podarilo dostatočne ovládnuť vody pozdĺž nášho pobrežia. Výrazné investície do rozvoja námorníctva by nám umožnili prispôsobiť infraštruktúru novému zameraniu na zámorské ambície." # todo: NEW TRANSLATION
 strive_towards_thalassocracy_decision.a: "Vydajme sa na more." # todo: NEW TRANSLATION
 strive_towards_thalassocracy_decision.a.tt: "Na vybudovanie silného námorníctva budeme mať 20 rokov" # todo: NEW TRANSLATION
 strive_thalassocracy_coastal_markets_tt: "Vlastní aspoň jedno pobrežné [Concept('market_center','trhové centrum')|e]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 abandon_thalassocracy_decision.title: "Opustiť talasokraciu" # todo: NEW TRANSLATION
 abandon_thalassocracy_decision.desc: "Vládnutie prostredníctvom nadvlády nad moriami už nezodpovedá našim ambíciám. Mali by sme presmerovať svoje úsilie na pevninu, na ktorej žijeme." # todo: NEW TRANSLATION
 abandon_thalassocracy_decision.a: "Vráťme sa na pevnejšiu pôdu." # todo: NEW TRANSLATION
 found_trade_company_india_decision.title: "Podporiť naše ázijské obchodné trasy" # todo: NEW TRANSLATION
 found_trade_company_india_decision.desc: "Bohaté pobrežia [ShowSubContinentName('south_asia')] a [ShowSubContinentName('south_east_asia')] nám sľubujú veľké zisky. Hoci sa v súčasnosti o obchod starajú najmä jednotliví kupci, pre krajinu nášho postavenia je to očividne nevyhovujúce. Mali by sme využiť možnosti nášho štátu a vytvoriť rozsiahlejšie obchodné misie, ktoré prepoja tieto zahraničné trhy s našimi." # todo: NEW TRANSLATION
 found_trade_company_india_decision.a: "Investovať do indickej obchodnej spoločnosti." # todo: NEW TRANSLATION
 invite_foreign_advisor_decision.title: "Kúpiť zahraničné inovácie" # todo: NEW TRANSLATION
 invite_foreign_advisor_decision.desc: "Naša krajina výrazne zaostáva za ostatnými veľmocami sveta. Nemôžeme nečinne sedieť, zatiaľ čo nás iné krajiny predbiehajú v technológiách a inováciách. Ak ponúkneme štedrý plat jednotlivcovi z jednej z týchto krajín, môžeme sa pokúsiť dobehnúť ostatných a ďalej nezaostávať v snahe o modernizáciu." # todo: NEW TRANSLATION
 invite_foreign_advisor_decision.a: "Privítajme zahraničného učenca." # todo: NEW TRANSLATION
 invite_foreign_advisor_decision.a.tt: "Učenec zo zahraničnej [Concept('country','krajine')|e] sa pridá k nášmu [Concept('court','dvoru')|e]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 invite_foreign_advisor_decision.b: "Naši vlastní poradcovia nám stačia." # todo: NEW TRANSLATION
 invite_foreign_advisor_cooldown_tt: "$sponsor_a_cathedral_cooldown_tt$" # todo: NEW TRANSLATION
 disempower_the_parliament_decision.title: "Spochybniť práva parlamentu" # todo: NEW TRANSLATION
 disempower_the_parliament_decision.desc: "Náš parlament si za uplynulé storočia osvojil isté práva, ktoré obmedzujú slobodu konania našej vlády. Mali by sme sa obrátiť na tých, ktorí majú v parlamente trvalé kreslá, a odobrať im ich práva!" # todo: NEW TRANSLATION
 disempower_the_parliament_decision.a: "Musíme obmedziť právomoci parlamentu." # todo: NEW TRANSLATION
 disempower_the_parliament_decision.a_building_tt: "Odstránime [ShowBuildingTypeName('urban_parliament_seat')] v jednej z našich [Concept('locations','lokalít')|e]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 disempower_the_parliament_decision.a_tt: "Každý [Concept('pop','populácia')|e] v [Concept('location','lokalite')|e] stratí [ShowNamedValue('pop_satisfaction_severe_penalty')|+=2%] [Concept('pop_satisfaction','spokojnosti populácie')|e]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 disempower_the_parliament_decision.b: "Teraz nie je vhodný čas postaviť sa parlamentu." # todo: NEW TRANSLATION
 disempower_the_parliament_decision_cooldown_tt: "$sponsor_a_cathedral_cooldown_tt$" # todo: NEW TRANSLATION
 abolish_serfdom_decision.title: "Zrušiť nevoľníctvo" # todo: NEW TRANSLATION
 abolish_serfdom_decision.desc: "Nevoľníctvo, ktoré sa v našej krajine praktizuje už dlho, sa stalo prekážkou nášho hospodárskeho rozvoja. Vzhľadom na nestabilnú politickú situáciu našich čias by bolo múdre zrušiť túto prax dekrétom, upokojiť rastúcu strednú vrstvu a zmierniť utrpenie tých, ktorí žijú pod bičom." # todo: NEW TRANSLATION
 abolish_serfdom_decision.a: "Podpísať dekrét." # todo: NEW TRANSLATION
 abolish_serfdom_decision.b: "To by príliš narušilo stabilitu." # todo: NEW TRANSLATION
 abandon_absolutism_decision.title: "Opustiť absolutizmus" # todo: NEW TRANSLATION
 abandon_absolutism_decision.desc: "Absolutistická vláda nášho panovníka čoraz viac ohrozuje vnútornú stabilitu našej krajiny. Povesti o povstaní sú čoraz častejšie a potláčanie odporcov nášho režimu nie je jednoduché. Možno nastal čas obrátiť sa chrbtom k starým absolutistickým ideálom a prijať pre našu krajinu liberálnejšiu formu vlády." # todo: NEW TRANSLATION
 abandon_absolutism_decision.a: "Absolutizmus nám už nevyhovuje." # todo: NEW TRANSLATION
 abandon_absolutism_decision.b: "Naša moc je najvyššia!" # todo: NEW TRANSLATION
 jewish_expulsion_threat.title: "Hrozba vyhnania" # todo: NEW TRANSLATION
 jewish_expulsion_threat.desc: "Koruna vydáva oficiálne ultimátum: židovské komunity musia zaplatiť mimoriadnu daň, inak budú vyhnané. Hrozba prináša okamžitý zisk zo zastrašených komunít, no pretrvávajúca atmosféra neistoty narúša obchodné siete, ktoré židovskí sprostredkovatelia dlhodobo udržiavali." # todo: NEW TRANSLATION
 jewish_expulsion_threat.a: "Vydať ultimátum." # todo: NEW TRANSLATION
 jewish_expulsion_threat_cooldown_tt: "$sponsor_a_cathedral_cooldown_tt$" # todo: NEW TRANSLATION
 STATIC_MODIFIER_NAME_jewish_expulsion_threat: "Hrozba vyhnania" # todo: NEW TRANSLATION
 jews_may_choose_to_leave_tt: "Mnohé z našich [ShowReligionAdjective('judaism')] [Concept('pops','populácií')|e] sa presťahujú do susedných [Concept('countries','krajín')|e], pričom uprednostnia tie väčšie a tolerantnejšie\n\nKaždá [Concept('location','lokalita')|e], ktorú opustia, bude postihnutá účinkom [ShowModifier('jewish_expulsion_threat')], ktorého sila sa bude odvíjať od podielu [ShowReligionAdjectiveWithNoTooltip('judaism')] [pops]" # todo: NEW TRANSLATION # todo: CONCEPT CASE

l_polish:
 ach_greek_populace_decision.title: "Upokojenie [ShowCultureNameWithNoTooltip('greek_culture')] elity" # todo: NEW TRANSLATION
 ach_greek_populace_decision.desc: "Hoci [GetCountry('LAT').GetAdjective] vláda nad územím [ShowScriptedGeographyName('greece_geography')] viedla k úpadku niekdajšej [ShowCultureName('greek_culture')] elity, v niektorých oblastiach krajiny si členovia starých [ShowCultureNameWithNoTooltip('greek_culture')] rodín udržali moc vďaka kompromisom s latinským [GetEstateName('nobles_estate')]. Od pádu [GetCountry('LAT').GetLongNameWithNoTooltip] však príslušníci [ShowCultureNameWithNoTooltip('greek_culture')] obyvateľstva čoraz viac odolávajú latinskej vláde.\n\nV snahe zaistiť stabilnejšiu vládu pozval panovník členov zostávajúcich [ShowCultureNameWithNoTooltip('greek_culture')] rodín v krajine na dvor, aby dospeli ku kompromisu. Niektorí latinskí [GetEstateNameWithNoTooltip('nobles_estate')] však namiesto toho presadzujú ďalšie rozšírenie svojich práv nad [ShowCultureNameWithNoTooltip('greek_culture')] obyvateľstvom a tvrdia, že silnejšia latinská elita by potlačila nepokoje medzi [ShowCultureNameWithNoTooltip('greek_culture')] obyvateľstvom." # todo: NEW TRANSLATION
 ach_greek_populace_decision.desc.entry: "O tieto krajiny sa teraz neľahko delia dve elity a ani jedna neprijme podmienky tej druhej bez protihodnoty. Získaním priazne [ShowCultureName('greek_culture')] rodín si zabezpečíme pokoj medzi obyvateľstvom, zatiaľ čo ústupkami latinskému $nobles_estate$ si získame lojalitu tých, ktorí už držia meče." # todo: NEW TRANSLATION
 ach_greek_populace_decision.a: "Zachovať súčasný stav." # todo: NEW TRANSLATION
 ach_greek_populace_decision.b: "Podporiť latinský [GetEstateNameWithNoTooltip('nobles_estate')]." # todo: NEW TRANSLATION
 ach_greek_populace_decision.b.entry: "Podporiť latinský $nobles_estate$." # todo: NEW TRANSLATION
 ach_greek_populace_decision.c: "Usilovať sa o kompromis s [ShowCultureNameWithNoTooltip('greek_culture')] rodinami." # todo: NEW TRANSLATION
 ach_pope_proposes_latin_restoration.title: "Získať pápežovu podporu na obnovu Latinského cisárstva" # todo: NEW TRANSLATION
 ach_pope_proposes_latin_restoration.desc: "Pápežstvo si všimlo naše ťaženia v oblasti [ShowScriptedGeographyName('greece_geography')] a naša rastúca sila upútala jeho pozornosť.\n\nPápež uznáva náš nárok na [ShowGovernmentReformName('ach_heirs_of_the_latin_empire')] a ponúkol finančnú i politickú podporu [GetCountry('PAP').GetNameWithNoTooltip], ak mu pomôžeme napraviť vzťahy medzi [ShowReligionAdjective('catholic')] a [ShowReligionAdjective('orthodox')] cirkvami.\n\nPápež tiež nalieha, aby sa v prípade opätovného získania [ShowLocationName('constantinople')] neopakovala tragédia, ktorú Štvrtá križiacka výprava priniesla [ShowLocationNameWithNoTooltip('constantinople')]." # todo: NEW TRANSLATION
 ach_pope_proposes_latin_restoration.desc.entry: "[ShowFormableCountryName('LAT_f')] malo krátke trvanie, no náš nárok naň stále platí. Výmenou za podporu $PAP_ADJ$ by sme pomohli založiť skutočné [ShowReligionAdjective('catholic')] cisárstvo na Východe, s hlavným mestom v [ShowLocationName('constantinople')], ktoré by bolo trvácnejšie než to predošlé." # todo: NEW TRANSLATION
 ach_pope_proposes_latin_restoration.a: "Prijať požiadavky vyslanca $PAP_ADJ$ výmenou za jeho podporu." # todo: NEW TRANSLATION
 ach_pope_proposes_latin_restoration.b: "Na opätovné dobytie [ShowLocationNameWithNoTooltip('constantinople')] nepotrebujeme pápežovu podporu." # todo: NEW TRANSLATION
 lat_aggressive_conversion_policies_tt: "Ak založíme [GetCountry('LAT').GetLongName], pápež môže výmenou za svoju podporu žiadať, aby sme zaviedli tvrdú politiku obracania na vieru" # todo: NEW TRANSLATION
 lat_frankokratia_pope_proposes_latin_restoration.title: "Požiadať o pápežskú podporu na obnovu Latinského cisárstva" # todo: NEW TRANSLATION
 lat_frankokratia_pope_proposes_latin_restoration.desc: "Rastúci vplyv našej krajiny v oblasti [ShowScriptedGeographyName('greece_geography')] z nás urobil významnú mocnosť v regióne a pápež si všimol náš vzostup. S upadajúcim vplyvom krajiny [GetCountry('BYZ').GetName] nás pápež teraz považuje za hlavného kandidáta na obnovenie [GetCountry('LAT').GetLongName] v [ShowLocationName('constantinople')].\n\nAk vyhovieme niektorým požiadavkám [GetCountry('PAP').GetAdjectiveWithNoTooltip] a znovu získame [ShowLocationNameWithNoTooltip('constantinople')], pápež nám poskytne plnú podporu [GetCountry('PAP').GetLongNameWithNoTooltip] a uzná nášho panovníka za právoplatného vládcu [GetCountry('LAT').GetLongNameWithNoTooltip]." # todo: NEW TRANSLATION
 lat_frankokratia_pope_proposes_latin_restoration.desc.entry: "Rím sleduje umierajúce aj vzmáhajúce sa cisárstvo a pápež sa rozhodol, ktorému z nás dá prednosť. Právoplatnosť vlády nad obnoveným [ShowLocationName('constantinople')] nám môže udeliť on — a aj to urobí, ak prijmeme dosť jeho podmienok, aby dar pôsobil zaslúžene." # todo: NEW TRANSLATION
 lat_frankokratia_pope_proposes_latin_restoration.a: "Prijať pápežovu požiadavku na obnovu [GetCountry('LAT').GetLongNameWithNoTooltip]." # todo: NEW TRANSLATION
 lat_frankokratia_pope_proposes_latin_restoration.b: "Nebudeme sa podriaďovať pápežovým ambíciám." # todo: NEW TRANSLATION
 lat_greater_claims_of_the_latin_empire.title: "Rozsiahlejšie nároky Latinského cisárstva" # todo: NEW TRANSLATION
 lat_greater_claims_of_the_latin_empire.desc: "Po páde [ShowLocationName('constantinople')] v roku 1204 sa stará latinská elita rýchlo snažila upevniť svoju moc nad [GetCountry('BYZ').GetAdjective] državami v oblasti [ShowScriptedGeographyName('greece_geography')] a zároveň si nárokovala zvrchovanosť nad [ShowRegionName('balkan_region')]. V tom čase však krajiny [GetCountry('SER').GetName] a [GetCountry('BUL').GetName] predstavovali pre Latinov vážnych súperov. Krajina [GetCountry('BUL').GetNameWithNoTooltip] napokon výrazne prispela k zániku pôvodného cisárstva svojimi neustálymi vojenskými ťaženiami na latinské územia.\n\nTeraz, keď je Latinské cisárstvo obnovené, možno si budeme môcť podrobiť tieto krajiny a dosiahnuť to, čo sa starému cisárstvu nepodarilo." # todo: NEW TRANSLATION
 lat_greater_claims_of_the_latin_empire.desc.entry: "Prvé Latinské cisárstvo nepadlo pre pomstu krajiny $BYZ_ADJ$, ale pre susedov, ktorých si nikdy celkom nepodrobilo. [ShowRegionName('balkan_region')] si pamätá, kto si v roku 1204 nárokoval zvrchovanosť a kto tento nárok neskôr zlomil. Obnovené cisárstvo, ktoré bude tých istých súperov ignorovať, si koleduje o rovnaký koniec." # todo: NEW TRANSLATION
 lat_greater_claims_of_the_latin_empire.a: "Budeme sa usilovať rozšíriť ríšu na územia týchto dávnych súperov." # todo: NEW TRANSLATION
 lat_greater_claims_of_the_latin_empire.b: "Vyhnime sa opakovaniu chýb minulosti." # todo: NEW TRANSLATION
 lat_restore_the_holy_patriarchate.title: "Obnoviť svätý patriarchát v [ShowLocationNameWithNoTooltip('constantinople')]" # todo: NEW TRANSLATION
 lat_restore_the_holy_patriarchate.desc: "Hoci prvé vyplienenie [ShowLocationName('constantinople')] v roku 1204 vyvolalo odpor pápeža, obsadenie [ShowLocationNameWithNoTooltip('constantinople')] [ShowReligionAdjective('catholic')] križiakmi vytvorilo príležitosť na obnovenie patriarchátu a posilnenie [GetCountry('PAP').GetAdjective] moci. Keď však [GetCharacter('byz_michael_viii_palaiologos').GetName] v roku 1261 znovu dobyl [ShowLocationNameWithNoTooltip('constantinople')], titul opäť zanikol.\n\nTeraz, keď je nad [ShowLocationNameWithNoTooltip('constantinople')] opäť obnovená latinská vláda, mnohí z [GetEstateNameWithNoTooltip('clergy_estate')] naliehajú, aby sme patriarchát obnovili." # todo: NEW TRANSLATION
 lat_restore_the_holy_patriarchate.desc.entry: "Patriarcha sídliaci v [ShowLocationName('constantinople')] pod našou ochranou by podriadil vieru v meste nám, a nie Východu. Náš $clergy_estate$ nezabudol, že tento titul kedysi existoval, a chce ho znovu obsadiť." # todo: NEW TRANSLATION
 lat_restore_the_holy_patriarchate.a: "Povoliť obnovenie patriarchátu." # todo: NEW TRANSLATION
 lat_restore_the_holy_patriarchate.b: "Zaviazať sa chrániť obnovený patriarchát!" # todo: NEW TRANSLATION
 lat_restore_the_holy_patriarchate.c: "Využiť obnovený patriarchát na získanie vplyvu." # todo: NEW TRANSLATION
 lat_restore_the_holy_patriarchate.d: "Odmietnuť obnovenie patriarchátu." # todo: NEW TRANSLATION
 latin_patriarchate_of_constantinople: "Patriarchát [ShowLocationNameWithNoTooltip('constantinople')]" # todo: NEW TRANSLATION

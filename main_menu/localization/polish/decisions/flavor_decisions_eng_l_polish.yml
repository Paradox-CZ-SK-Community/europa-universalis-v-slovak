l_polish:
 eng_yorkist_tradition_decision.title: "Nábor byrokratov zo strednej triedy" # todo: NEW TRANSLATION
 eng_yorkist_tradition_decision.desc: "Získavať schopných mužov na vládne posty je čoraz ťažšie a ozývajú sa hlasy, že by sme mali rozšíriť výber aj o rastúcu strednú triedu, najmä právnikov, popri členoch [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')]. Obe strany netrpezlivo čakajú, či túto politiku zavedeme a vyhovieme výzvam na zmenu." # todo: NEW TRANSLATION
 eng_yorkist_tradition_decision.desc.entry: "Stredná trieda sa rozrastá, a preto niektorí volajú po tom, aby sa jej príslušníci mohli uchádzať o vládne posty. Ak chceme zamestnať schopných ľudí, zaradenie strednej triedy do nášho výberu by nám nepochybne rozšírilo možnosti." # todo: NEW TRANSLATION
 eng_yorkist_tradition_decision.a: "Podporíme ich." # todo: NEW TRANSLATION
 eng_yorkist_tradition_decision.b: "Vo vláde nemajú čo hľadať." # todo: NEW TRANSLATION
 enable_yorkist_tradition_policy: "Umožní prístup k [ShowPolicyName('yorkist_tradition_policy')] [Concept('policy','politike')|e]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 eng_yorkist_tradition_decision.historical_info: "Povyšovanie vládnych úradníkov zo strednej triedy, najmä duchovných a právnikov, bolo v Anglicku dlhoročnou yorkistickou tradíciou. Šľachta a duchovenstvo sa tomu rozhodne stavali na odpor, pretože to považovali za výsadu vyhradenú mužom s vyšším spoločenským postavením alebo tým, ktorých ustanovil Boh." # todo: NEW TRANSLATION
 eng_court_of_the_star_chamber_decision.title: "Súd Hvězdné komory" # todo: NEW TRANSLATION
 eng_court_of_the_star_chamber_decision.desc: "Spravodlivosť sa v súčasnosti vykonáva podľa zásad [ShowPolicyName('common_law_policy')]. Konania sú však únavne pomalé, keďže sa opierajú o precedensy a rozhodnutia sudcov. Vynesenie rozsudku v niektorých prípadoch trvá týždne, ak nie mesiace. Ozývajú sa výzvy na zriadenie ďalšieho súdneho orgánu s istou mierou flexibility v postupoch, ktorý by mohol riešiť prípady považované za príliš citlivé alebo zložité pre bežné súdy. Jedným z možných, hoci miernych dôsledkov by mohlo byť rozšírenie moci [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')], potláčanie opozície a trestanie nesúhlasu, keď to bude potrebné." # todo: NEW TRANSLATION
 eng_court_of_the_star_chamber_decision.desc.entry: "Precedens je naším tradičným spôsobom výkonu spravodlivosti, no nevyhnutne spomaľuje konania a predlžuje rozhodovanie v prípadoch. Druhý súd, ktorý by si mohol slobodne určiť vlastné postupy, by také záležitosti vyriešil rýchlo. Časom by sa z toho mohol stať zvyk, ktorý by $crown_estate$ prišiel vhod." # todo: NEW TRANSLATION
 eng_court_of_the_star_chamber_decision.a: "Neoceniteľný nástroj." # todo: NEW TRANSLATION
 eng_court_of_the_star_chamber_decision.b: "[ShowPolicyNameWithNoTooltip('common_law_policy')] postačí." # todo: NEW TRANSLATION
 enable_court_of_the_star_chamber_reform: "Umožní prístup k [ShowGovernmentReformName('court_of_the_star_chamber_reform')] [Concept('government_reform','reforme vlády')|e]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 eng_court_of_the_star_chamber_decision.historical_info: "Súd Hvězdné komory vznikol z rokovaní kráľovskej Tajnej rady a na význame postupne naberal počas vlády Henricha VII. Jeho názov pochádzal od hviezdneho vzoru na strope Westminsterského paláca, kde zasadal. V roku 1487 bol súd ustanovený ako samostatný súdny orgán, oddelený od rady, ktorého úlohou bolo prerokúvať žiadosti o nápravu." # todo: NEW TRANSLATION
 eng_benevolence_tax_decision.title: "Zavedenie dane z dobročinnosti" # todo: NEW TRANSLATION
 eng_benevolence_tax_decision.desc: "Vďaka vynikajúcej správe krajiny sa [ROOT.GetCountry.GetGovernment.GetRuler.GetName] podarilo po [ShowDisasterName('war_of_the_roses')] obnoviť moc a stabilitu [ROOT.GetCountry.GetAdjective] monarchie. [ROOT.GetCountry.GetGovernment.GetRuler.GetHisHer] pozornosť venovaná detailom a odpor k márnotratnému míňaniu prispeli k tomu, že sa teraz zameriava na získanie nových príjmov zavedením nemilosrdne účinného daňového mechanizmu." # todo: NEW TRANSLATION # todo: COUNTRY CASE
 eng_benevolence_tax_decision.desc.entry: "Vládca, ktorý málo míňa a starostlivo počíta, si čoskoro všimne, koľko míňajú ostatní. Mier dosiahnutý po [ShowDisasterName('war_of_the_roses')] zaistil stabilitu štátnej pokladnice a uvoľnil vládcovi ruky, aby sa zameral na mešce bohatých." # todo: NEW TRANSLATION
 eng_benevolence_tax_decision.a: "Mier a hospodárska prosperita." # todo: NEW TRANSLATION
 eng_benevolence_tax_decision.b: "Tešme sa zo stability, ktorú sme vytvorili." # todo: NEW TRANSLATION
 eng_benevolence_tax_decision.a.custom: "Sprístupní [Concept('government_reform','reforma vlády')|e] [ShowGovernmentReformName('benevolence_tax_reform')]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 eng_benevolence_tax_decision.historical_info: "Vláda Henricha VII. pomohla stabilizovať financie kráľovstva a upevniť moc monarchie. Kráľ s pomocou svojho kancelára Johna Mortona zaviedol daň z dobročinnosti. Zdôvodňoval ju tým, že človek žijúci skromne si musí šetriť, a preto si môže dovoliť prispieť na dobročinnosť; ten, kto žije rozhadzovačne, je očividne bohatý, a môže si teda dovoliť platiť tiež." # todo: NEW TRANSLATION
 eng_council_of_the_north_decision.title: "Rada Severu" # todo: NEW TRANSLATION
 eng_council_of_the_north_decision.desc: "Objavili sa návrhy, že nedostatok súdnej správy na severe ešte zhoršuje veľká vzdialenosť od [ROOT.GetCountry.GetCapital.GetName]. Zriadenie nezávislej rady v [target_location.GetName], ktorá by sa zaoberala takýmito záležitosťami, by jej zverilo časť právomocí a zároveň zaistilo dodržiavanie spravodlivosti." # todo: NEW TRANSLATION # todo: COUNTRY CASE
 eng_council_of_the_north_decision.desc.entry: "Spravodlivosť odložená o tri týždne, ktoré treba stráviť v sedle, je spravodlivosť odopretá. Rada sídliaca v [ShowLocationName('york')] s vlastnými právomocami by mohla rozhodovať o severných grófstvach bez toho, aby ich žiadosti najprv putovali cez celú krajinu. Cenou za to by boli právomoci, ktoré by sme už nemohli uplatňovať sami." # todo: NEW TRANSLATION
 eng_council_of_the_north_decision.a: "Súhlasíme." # todo: NEW TRANSLATION
 eng_council_of_the_north_decision.b: "Byrokracia nie je riešením." # todo: NEW TRANSLATION
 eng_council_of_the_north_decision.b_tt: "Každá lokácia v oblasti [ShowAreaName('northumbria_area')] získa [Concept('modifier','modifikátor')|e] [ShowModifier('lack_of_conciliar_justice')]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 STATIC_MODIFIER_NAME_lack_of_conciliar_justice: "Nedostatok konciliárnej spravodlivosti" # todo: NEW TRANSLATION
 eng_council_of_the_north_decision.historical_info: "Rada Severu bola správnym orgánom zriadeným s cieľom zaistiť priamejšiu kontrolu nad severnými grófstvami. Jej hlavnou úlohou bolo udržiavať zákon a poriadok a zabezpečiť vernosť najsevernejších poddaných Koruny. Napokon bola zrušená v roku 1641 počas anglickej občianskej vojny." # todo: NEW TRANSLATION
 eng_austere_monastic_life_decision.title: "Reforma kláštorov" # todo: NEW TRANSLATION
 eng_austere_monastic_life_decision.desc: "Nadmerné bohatstvo reholí v [ROOT.GetCountry.GetAltAdjective('L')] je reformistom už dlho tŕňom v oku. Ďalším dôvodom na presadzovanie zmien je nespokojnosť [ROOT.GetCountry.GetGovernment.GetEstateName('peasants_estate')] s mocnými cirkevnými inštitúciami.\n\nMohli by sme sa pokúsiť zmeniť tieto pomery a vrátiť rehole k asketickému a klauzúrnemu ideálu.\n\nV záznamoch po vizitáciách sa objavuje celkovo #Y [ROOT.GetVariable('num_of_monasteries').GetValue]#! kláštorov." # todo: NEW TRANSLATION # todo: COUNTRY CASE
 eng_austere_monastic_life_decision.desc.entry: "Nič nerozhorčuje chudobných tak ako bohatý pustovník. Reformisti to hovoria už roky, $peasants_estate$ s nimi začali súhlasiť a návrat reholí k ich sľubom by potešil každého okrem samotných reholí." # todo: NEW TRANSLATION
 eng_austere_monastic_life_decision.a: "Reformovať." # todo: NEW TRANSLATION
 eng_austere_monastic_life_decision.a.custom: "Členovia mníšskych rádov ich hromadne opustia a pridajú sa k [ROOT.GetCountry.GetGovernment.GetEstateName('peasants_estate')]" # todo: NEW TRANSLATION
 eng_austere_monastic_life_decision.b: "$common_string_leave_them_be$" # todo: NEW TRANSLATION
 eng_austere_monastic_life_decision.b.custom: "[ShowPopTypeName('clergy')] v mníšskych rádoch získajú [Concept('pop_satisfaction','spokojnosť populácie')|e] [ShowNamedValue('pop_satisfaction_extreme_bonus')|+=2%]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 eng_austere_monastic_life_decision.tt: "Kláštory nebude možné rozpustiť, kým nebude toto [Concept('privilege','privilégium')|e] odvolané" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 eng_austere_monastic_life_decision.historical_info: "Reformácia alebo zrušenie kláštorov bola významnou udalosťou 16. storočia, ktorá nasledovala po tom, ako Anglicko prijalo reformáciu. Thomas Cromwell, kráľov hlavný minister, sa spočiatku snažil rozložiť mníšsky systém, ktorý bol považovaný za predĺženú ruku rímskokatolíckej cirkvi. Vyvrcholením tejto udalosti bolo zatvorenie rehoľných domov vrátane kláštorov a opátstiev po celom Anglicku." # todo: NEW TRANSLATION
 eng_navy_board_decision.title: "Úrad námorníctva" # todo: NEW TRANSLATION
 eng_navy_board_decision.desc: "Uznáva sa, že naše hranice sú do istej miery zraniteľné voči zahraničnej invázii. Aby sme ochránili budúcnosť [ROOT.GetCountry.GetName], musíme ovládnuť moria obklopujúce náš ostrov a zabrániť akýmkoľvek pokusom o preniknutie na naše územie.\n\nRozšírením našich logistických kapacít a zefektívnením správy flotily môžeme posilniť stavbu lodí a zároveň podporovať väčšie námorníctvo s nižšími nákladmi." # todo: NEW TRANSLATION
 eng_navy_board_decision.desc.entry: "Ostrov je v bezpečí len natoľko, nakoľko sú bezpečné vody okolo neho, a naše vody strážia flotily, ktoré sme nepostavili. Ak zveríme lodenice, sklady a zásobovanie jednému úradu, udržíme na mori viac lodí za rovnaké peniaze. To je jediný druh rozšírenia námorníctva, ktorý si teraz môžeme dovoliť." # todo: NEW TRANSLATION
 eng_navy_board_decision.a: "Uskutočnime potrebné zmeny." # todo: NEW TRANSLATION
 eng_navy_board_decision.b: "Záleží nám predovšetkým na armáde." # todo: NEW TRANSLATION
 enable_navy_board_reform: "Umožní prístup k [ShowGovernmentReformName('navy_board_reform')] [Concept('government_reform','reforme vlády')|e]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 eng_navy_board_decision.historical_info: "V 16. storočí, za vlády kráľa Henricha VIII., bol zriadený Úrad námorníctva, ktorý dohliadal na námorné záležitosti vrátane stavby lodí a logistiky. Pod Henrichovým vedením úrad napomohol rozšíreniu anglickej flotily, ktorej cieľom bolo stať sa silou, s ktorou treba počítať, a zabezpečiť Anglicko pred zahraničnými inváziami." # todo: NEW TRANSLATION
 eng_grand_remonstrance_decision.title: "Veľká sťažnosť" # todo: NEW TRANSLATION
 eng_grand_remonstrance_decision.desc: "Zástupca parlamentu predložil zoznam sťažností, ktoré podľa neho napravia problémy s korupciou a duchovným vplyvom na štátne záležitosti. Poukazuje na to, že [ROOT.GetCountry.GetGovernment.GetRuler.GetName] vládne už dlhší čas bez zvolania parlamentu, a teraz sa usiluje zachovať jeho práva a výsady obmedzením moci monarchie.\n\nĎalším problémom sú kráľovi poradcovia z radov [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')], ktorých prítomnosť sa považuje za prejav vplyvu cirkvi na štátne záležitosti. Navrhuje sa zakázať členom duchovenstva účasť vo vláde. Parlament by výmenou ochotnejšie podporoval budúce zákony." # todo: NEW TRANSLATION
 eng_grand_remonstrance_decision.desc.entry: "Parlament spísal svoje sťažnosti, čo ľudia robia vtedy, keď očakávajú odpoveď, nie iba vypočutie. Chce obmedziť moc monarchie a vyhnať $clergy_estate$ z vlády. Výmenou naznačuje ochotu spolupracovať, akej sme sa roky nedočkali." # todo: NEW TRANSLATION
 eng_grand_remonstrance_decision.a: "Vypracovať dôkladne sformulované odmietnutie." # todo: NEW TRANSLATION
 eng_grand_remonstrance_decision.b: "Prijať podmienky." # todo: NEW TRANSLATION
 eng_grand_remonstrance_decision.c: "Pokúsiť sa dosiahnuť kompromis." # todo: NEW TRANSLATION
 eng_grand_remonstrance_decision.tt1: "Parlament môže reagovať nepriateľsky a pokúsiť sa za každú cenu obmedziť kráľovské právomoci" # todo: NEW TRANSLATION
 STATIC_MODIFIER_NAME_grand_remonstrance_refused: "Veľká remonstrácia odmietnutá" # todo: NEW TRANSLATION
 eng_grand_remonstrance_decision.b.custom: "Bude zavedená [Concept('government_reform','reforma vlády')|e] [ShowGovernmentReformName('grand_remonstrance_reform')]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 eng_grand_remonstrance_decision.c.custom1: "Nízke diplomatické schopnosti nášho vládcu znižujú šancu na úspech" # todo: NEW TRANSLATION
 eng_grand_remonstrance_decision.c.custom2: "Diplomatické schopnosti nášho vládcu môžu presvedčiť dostatok poslancov" # todo: NEW TRANSLATION
 eng_grand_remonstrance_decision.tt2: "Kompromis nemusí priniesť priaznivý výsledok" # todo: NEW TRANSLATION
 eng_grand_remonstrance_decision.historical_info: "Veľká sťažnosť bol politický dokument, ktorý parlament predložil anglickému kráľovi Karolovi I. v roku 1641. Vyjadroval jeho frustráciu z kráľa a navrhoval rozsiahle zmeny na obmedzenie jeho možnosti zasahovať do parlamentného rokovania. Zaoberal sa aj obavami z katolicizmu a vplyvom kráľových poradcov. Krátko po predložení Veľkej sťažnosti sa napätie medzi parlamentom a kráľom vystupňovalo a napokon viedlo k vypuknutiu anglickej občianskej vojny." # todo: NEW TRANSLATION
 eng_overhauled_admiralty_decision.title: "Reforma Rady admirality" # todo: NEW TRANSLATION
 eng_overhauled_admiralty_decision.desc: "Správca námorníctva prejavuje veľký potenciál napriek nedostatku námorných skúseností. Vplyv, usilovnosť a nadanie [samuel_pepys.GetName] by mohli pomôcť reformovať Radu admirality a profesionalizovať Kráľovské námorníctvo." # todo: NEW TRANSLATION
 eng_overhauled_admiralty_decision.desc.entry: "Námorníctvu nikdy nechýbali odvážni kapitáni, len niekto, kto by vedel počítať jeho zásoby. $name_samuel$ $Pepys$ nikdy nevelil lodi, a práve preto je veľmi pravdepodobne tým pravým človekom." # todo: NEW TRANSLATION
 eng_overhauled_admiralty_decision.a: "Vymenovať ho za tajomníka Rady." # todo: NEW TRANSLATION
 eng_overhauled_admiralty_decision.b: "Využiť plody jeho doterajšej práce." # todo: NEW TRANSLATION
 enable_overhauled_admiralty_reform: "Umožní prístup k [ShowGovernmentReformName('overhauled_admiralty_reform')] [Concept('government_reform','reforme vlády')|e]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 STATIC_MODIFIER_NAME_samuel_pepys_diligence: "Svedomitosť Samuela Pepysa" # todo: NEW TRANSLATION
 eng_overhauled_admiralty_decision.tt3: "jeho práca v Úrade námorníctva zefektívňuje operačné schopnosti námorníctva" # todo: NEW TRANSLATION
 eng_overhauled_admiralty_decision.historical_info: "Práca Samuela Pepysa bola kľúčová pri modernizácii a reforme Kráľovského námorníctva v dôležitom období jeho dejín. Medzi zmeny patrilo zlepšenie zásobovania námorníctva a zavedenie pravidelného platu pre námorníkov a dôstojníkov. Dnes si ho ľudia pamätajú najmä vďaka rozsiahlemu denníku, ktorý si písal desať rokov a v ktorom zaznamenával každý detail svojho života i historické udalosti, ako boli Veľký požiar a Veľký mor v Londýne." # todo: NEW TRANSLATION
 eng_taxation_law_decision.title: "Daň z príjmu" # todo: NEW TRANSLATION
 eng_taxation_law_decision.desc: "Finančná situácia krajiny je naďalej dosť krehká, čo podnecuje diskusie o potrebe reformy. Prevláda názor, že súčasné daňové systémy neúmerne zvýhodňujú bohatých a prinášajú vláde len malé príjmy. Člen vlády [william_pitt_the_younger.GetName] presadzuje dočasné zdanenie príjmov, ktoré by ozdravilo financie krajiny a prerozdelilo bohatstvo. Tento návrh sa však nebude páčiť [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] ani [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')]." # todo: NEW TRANSLATION
 eng_taxation_law_decision.desc.entry: "Daň, ktorá šetrí bohatých, prináša málo a nikoho neuspokojí. $name_william$ $Pitt$ navrhuje priamo zdaňovať príjmy, a to na obmedzený čas a prakticky bez výnimiek. Preto proti tomu budú $nobles_estate$ a $clergy_estate$ bojovať až do konca." # todo: NEW TRANSLATION
 eng_taxation_law_decision.a: "Spravodlivá a progresívna." # todo: NEW TRANSLATION
 eng_taxation_law_decision.b: "Uživia nás clá a spotrebné dane." # todo: NEW TRANSLATION
 eng_taxation_law_decision.c: "Politicky ožehavá záležitosť." # todo: NEW TRANSLATION
 eng_taxation_law_decision.custom: "Sprístupní [Concept('law','zákon')|e] [ShowLawName('eng_taxation_law')]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 eng_taxation_law_decision.tt: "Parlament je nespokojný s tým, že sa ignoruje krehká finančná stabilita krajiny [target_root_country.GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 STATIC_MODIFIER_NAME_temporary_income_tax: "Dočasná daň z príjmov" # todo: NEW TRANSLATION
 eng_taxation_law_decision.historical_info: "Daň z príjmu zaviedol britský premiér William Pitt mladší, aby zmiernil finančné zaťaženie spôsobené prebiehajúcimi napoleonskými vojnami. Pittova daň z príjmu bola progresívna, čo znamenalo, že ľudia s vyššími príjmami platili vyšší podiel zo svojho príjmu. Čelila odporu ľudí s vysokými príjmami a po skončení vojny bola napokon zrušená." # todo: NEW TRANSLATION
 eng_factory_working_conditions_decision.title: "Zákon o továrňach" # todo: NEW TRANSLATION
 eng_factory_working_conditions_decision.desc: "Reformátori presadzujú lepšie pracovné práva pre továrenských robotníkov, ktorí často čelia bezohľadnému vykorisťovaniu, nedostatočnej ochrane a nízkym mzdám. Každý pokus o zmenu súčasného stavu pravdepodobne narazí na odpor a môže nepriaznivo ovplyvniť hospodársky rast a produktivitu. Ak sa však situácia nezlepší, riskujeme odchod pracovnej sily." # todo: NEW TRANSLATION
 eng_factory_working_conditions_decision.a: "Tí úbožiaci potrebujú úľavu." # todo: NEW TRANSLATION
 eng_factory_working_conditions_decision.b: "Robotníci poháňajú hospodársky stroj." # todo: NEW TRANSLATION
 eng_factory_working_conditions_decision.c: "Nevďačníci by nám mohli prejaviť aspoň trochu vďačnosti." # todo: NEW TRANSLATION
 eng_factory_working_conditions_decision.custom: "Sprístupní [Concept('law','zákon')|e] [ShowLawName('factory_working_conditions_law')]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 eng_factory_working_conditions_decision.historical_info: "Zákon o továrňach bol významným právnym predpisom v Británii a predstavoval zlomový bod v úsilí o zlepšenie pracovných podmienok a ochranu práv továrenských robotníkov, najmä detí, ktoré by inak pracovali väčšinu dňa za mizernú mzdu. Zákon zaviedol vekové obmedzenia, povinnú školskú dochádzku a inšpekcie tovární. Majiteľov tovární prinútil zlepšiť všeobecnú bezpečnosť a viesť záznamy o zamestnancoch." # todo: NEW TRANSLATION
 eng_coke_smelting_decision.title: "Investícia do práce rodiny Darbyovcov" # todo: NEW TRANSLATION
 eng_coke_smelting_decision.desc: "Priekopnícky železiar [abraham_darby.GetName] vyvinul nový druh paliva do vysokých pecí. Toto palivo, známe jednoducho ako „koks“, je menej prchavé a dokáže vytvárať stabilnejšie vysoké teplo než drevené uhlie, ktoré priemysel v súčasnosti uprednostňuje. [abraham_darby.GetNameWithNoTooltip] teraz skúša jeho použitie vo svojej rodinnej [ShowBuildingTypeName('iron_foundry')], pričom výsledky sú sľubné." # todo: NEW TRANSLATION
 eng_coke_smelting_decision.desc.entry: "Drevené uhlie horí dosť horúco na kováčsku vyhňu, ale nikdy nie dosť na pec. $name_abraham$ $Darby$ vypaľovaním uhlia vytvoril palivo, ktoré horí rovnomernejšie. Prvé skúšky v jeho [ShowBuildingTypeName('iron_foundry')] naznačujú, že čoskoro bude možné vyrábať železo v množstve, ktoré by lesy nikdy nedokázali podporiť." # todo: NEW TRANSLATION
 eng_coke_smelting_decision.a: "Urobiť z toho priemyselný štandard." # todo: NEW TRANSLATION
 eng_coke_smelting_decision.tt2: "Nový zdroj spracovaného paliva si vyžaduje väčšie množstvo suroviny [ShowGoodsName('coal')]" # todo: NEW TRANSLATION
 enable_coke_smelting_advance: "Udeľuje prístup k [ShowAdvanceName('coke_smelting')] [Concept('advance','pokroku')|e]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 unlocked_advance_coke_smelting_tt: "Prijal rozhodnutie $eng_coke_smelting_decision.title$ [Concept('decision','rozhodnutie')|e]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 eng_coke_smelting_decision.historical_info: "Tavenie pomocou koksu, ktoré vynašiel Abraham Darby I., sa považuje za významný katalyzátor, ktorý výrazne urýchlil priemyselnú revolúciu. Jeho bezprostredným dôsledkom bola zásadná premena techník výroby železa, ktorá umožnila široké využitie železa a ocele v rôznych odvetviach. Zároveň položila základy masovej výroby liatiny, ktorá bola pre priemyselnú revolúciu kľúčová." # todo: NEW TRANSLATION
 eng_royal_society_decision.title: "Kráľovská spoločnosť" # todo: NEW TRANSLATION
 eng_royal_society_decision.desc: "Stretnutia najväčších vedeckých mysliteľov priniesli niektoré z najvýznamnejších vynálezov našej spoločnosti. Mohli by sme v [ROOT.GetCountry.GetCapital.GetName] zriadiť nezávislý orgán s vlastnou radou, ktorý by podporoval vedu a jej prínosy, oceňoval vynikajúce vedecké výsledky a poskytoval im podporu. Zároveň by poskytoval vedecké poradenstvo v oblasti politiky a vzdelávania a usmerňoval naše výskumné úsilie." # todo: NEW TRANSLATION # todo: COUNTRY CASE
 eng_royal_society_decision.desc.entry: "Učení muži sa už stretávajú, dopisujú si a vedú spory aj bez našej pomoci. Chýba im strecha nad hlavou a oficiálne poverenie. Ak im poskytneme oboje, budú nám prírodní filozofi krajiny poruke, aby odpovedali na naše otázky aj na tie vlastné." # todo: NEW TRANSLATION
 eng_royal_society_decision.a: "Skvelý nápad." # todo: NEW TRANSLATION
 eng_royal_society_decision.b: "Radšej investujme do našich univerzít." # todo: NEW TRANSLATION
 eng_royal_society_decision.historical_info: "Kráľovská spoločnosť bola založená v roku 1660, za vlády anglického kráľa Karola II. Jej zakladateľmi boli poprední členovia vedeckej obce, ktorým záležalo na rozširovaní hraníc vedeckého poznania a napredovaní vedy. Cieľom bolo vytvoriť priestor, kde by sa vedci, učenci a intelektuáli mohli stretávať a vymieňať si poznatky z výskumu, aby sa ich myšlienky pretavili do konkrétnych výsledkov." # todo: NEW TRANSLATION
 eng_royal_society_decision.tt1: "Náš vládca sa stane patrónom tejto novozaloženej učenenej spoločnosti" # todo: NEW TRANSLATION
 eng_royal_academy_of_arts_decision.title: "Kráľovská akadémia umení" # todo: NEW TRANSLATION
 eng_royal_academy_of_arts_decision.desc: "Navrhlo sa založiť inštitúciu, ktorej úlohou by bolo podporovať tvorivosť a rozvoj umenia, financovanú z prostriedkov [ROOT.GetCountry.GetGovernment.GetRuler.GetName]. Mala by slúžiť ako škola či akadémia dizajnu pre študentov umenia a každoročne organizovať výstavu súčasného umenia prístupnú všetkým umelcom." # todo: NEW TRANSLATION # todo: COUNTRY CASE
 eng_royal_academy_of_arts_decision.desc.entry: "Maliari vzdelaní v zahraničí si domov prinášajú cudzí vkus aj techniku. Naša vlastná akadémia so školou, každoročnou výstavou otvorenou všetkým umelcom a panovníkovou podporou by umožnila ďalšej generácii učiť sa svojmu remeslu doma." # todo: NEW TRANSLATION
 eng_royal_academy_of_arts_decision.a: "Schválené s umeleckým šarmom!" # todo: NEW TRANSLATION
 eng_royal_academy_of_arts_decision.b: "Radšej to vynaložme na vzdelávanie chudobných." # todo: NEW TRANSLATION
 STATIC_MODIFIER_NAME_increased_educational_spending: "Zvýšené výdavky na vzdelávanie" # todo: NEW TRANSLATION
 eng_royal_academy_of_arts_decision.historical_info: "Kráľovská akadémia umení je súkromne financovaná inštitúcia, ktorá sa venuje podpore výtvarného umenia a architektúry. V roku 1768 ju založila skupina umelcov vrátane sira Joshuu Reynoldsa a sira Williama Chambersa; jej prvým kráľovským patrónom sa stal kráľ Juraj III. Členstvo v Kráľovskej akadémii je veľmi prestížne a získavajú ho umelci a architekti, ktorí významne prispeli vo svojich odboroch." # todo: NEW TRANSLATION
 eng_enclosure_act_decision.title: "Zákon o ohradzovaní" # todo: NEW TRANSLATION
 eng_enclosure_act_decision.desc: "Majitelia tovární a pozemkov žiadajú parlament, aby povolil ďalšiu privatizáciu verejnej pôdy a urýchlil presun pracovnej sily z vidieka do miest. Hoci to pravdepodobne spôsobí značné spoločenské otrasy, zároveň to zabezpečí dostatok pracovnej sily a zvýši celkovú poľnohospodársku produkciu." # todo: NEW TRANSLATION
 eng_enclosure_act_decision.a: "Vysídlený robotník je produktívny robotník." # todo: NEW TRANSLATION
 eng_enclosure_act_decision.a.custom: "Rozhorčení [ShowPopTypeName('peasants')] sa vzbúria a 10 vidieckych [Concept('locations','lokalít')|e] stratí [ShowNamedValue('pop_satisfaction_ultimate_penalty')|+=2%] [Concept('prosperity','prosperita')|e]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 eng_enclosure_act_decision.tt: "Zákon urýchli urbanizáciu a podporí ďalšiu industrializáciu na úkor [ShowEstateTypeName('peasants_estate')]" # todo: NEW TRANSLATION
 enable_enclosure_act_policy: "Umožní prístup k [ShowPolicyName('enclosure_act')] [Concept('policy','politike')|e]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 enclosure_riots: "Nepokoje pri oplotení" # todo: NEW TRANSLATION
 eng_enclosure_act_decision.historical_info: "Zákony o ohradzovaní boli sériou zákonov prijatých v Anglicku, ktoré umožnili ďalšie ohradzovanie, čiže privatizáciu spoločnej pôdy a otvorených polí. Boli súčasťou širších hospodárskych a poľnohospodárskych premien, ktoré sa považovali za nevyhnutné na podporu rozvoja komerčného poľnohospodárstva a industrializácie. Tieto zákony prispeli k spoločenskej nerovnosti a vysídlili tisíce vidieckych robotníkov, ktorí boli nútení hľadať si prácu v mestách. Vyústili do nepokojov, počas ktorých roľníci a robotníci zbavení svojich práv vzdorovali strate tradičných výsad." # todo: NEW TRANSLATION
 sco_witchcraft_act_decision.title: "Zákon o čarodejníctve [ROOT.GetCountry.GetAdjectiveWithNoTooltip]" # todo: NEW TRANSLATION
 sco_witchcraft_act_decision.title.entry: "Zákon o čarodejníctve" # todo: NEW TRANSLATION
 sco_witchcraft_act_decision.desc: "Rastúca averzia ľudu voči čarodejniciam a čarodejníctvu čoraz častejšie prichádza pred súd. Hlásenia o činnosti čarodejníc sa hromadia pred [ROOT.GetCountry.GetGovernment.GetRuler.GetName] a vyžadujú si rýchle riešenie. Týkajú sa všeličoho: od zdanlivo neškodnej miestnej liečiteľky obvinenej z varenia elixírov až po údajné posadnutie démonmi. Dokonca sa nájde aj jeden roľník, ktorý prisahá, že sa raz premenil na mloka, no potom sa z toho dostal.\n\nPribúda návrhov na nový zákon, ktorý by prenasledoval čarodejnice, a [ROOT.GetCountry.GetGovernment.GetRulerTitle] už začal vyjadrovať aj [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHis] vlastný názor na túto záležitosť." # todo: NEW TRANSLATION # todo: COUNTRY CASE
 sco_witchcraft_act_decision.desc.entry: "Na súd teraz prichádza viac obvinení z čarodejníctva než z krádeží a niekto musí rozhodnúť, ktoré si zaslúžia súdne pojednávanie. Zákon by tejto záležitosti aspoň poskytol právny základ, hoci zákon proti čarodejniciam má zvláštnu vlastnosť: vytvára ich ešte viac." # todo: NEW TRANSLATION
 sco_witchcraft_act_decision.a: "Obhajovať zákon o čarodejníctve." # todo: NEW TRANSLATION
 sco_witchcraft_act_decision.b: "Odsúdiť ho." # todo: NEW TRANSLATION
 sco_witchcraft_act_decision.historical_info: "Škótsky zákon o čarodejníctve z roku 1563 vyhlásil praktizovanie čarodejníctva aj vyhľadávanie pomoci u čarodejníc za hrdelné zločiny. Veľkú úlohu pri jeho prijatí zohral Jakub VI. svojím zapojením do čarodejníckych procesov v North Berwicku, ktoré boli prvou veľkou sériou procesov podľa nového zákona. Kráľ v roku 1597 vydal v diele „Daemonologie“ obhajobu honov na čarodejnice, neskôr však začal byť čoraz skeptickejší a podnikol kroky na obmedzenie stíhaní. V Škótsku bolo za čarodejníctvo súdených odhadom 6 000 ľudí, pričom tri štvrtiny obvinených tvorili ženy a viac než 1 500 ľudí bolo popravených." # todo: NEW TRANSLATION
 sco_preserve_clan_autonomy_decision.title: "Štatúty z Iony" # todo: NEW TRANSLATION
 sco_preserve_clan_autonomy_decision.desc: "Hoci mnohí príslušníci [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] žijúci v [ROOT.GetCountry.GetAdjective] nížinách začali posielať svojich dedičov do miestnych škôl, mnohé zo zostávajúcich [ShowCultureName('highland')]ských klanov sa stále držia tradičného vzdelávania.\n\nS postupom času sa to začalo považovať za prekážku pre [ROOT.GetCountry.GetAltAdjectiveWithNoTooltip('A')]. Niektorí členovia [ROOT.GetCountry.GetGovernment.GetCourtTitle] navrhli zaviesť novú politiku, ktorá by prinútila členov týchto klanov zapísať svojich dedičov do niektorej zo škôl v nížinách [ROOT.GetCountry.GetAltAdjectiveWithNoTooltip('L')].\n\nTáto politika by nepochybne priniesla vzdelanejšiu generáciu klanových vodcov, no niektorí sa obávajú, že [ShowCultureNameWithNoTooltip('highland')]ské klany by sa tým začali podobať nížinným." # todo: NEW TRANSLATION # todo: COUNTRY CASE
 sco_preserve_clan_autonomy_decision.desc.entry: "Klan, ktorý vzdeláva svojich dedičov doma, vychová mužov verných klanu; klan, ktorý ich pošle na juh, vychová mužov verných tým, ktorí ich učili. Keby sme náčelníkov [ShowCultureName('highland')]ských klanov prinútili k tomu druhému, získali by sme užitočnejšiu generáciu lairdov, no menej horalskú." # todo: NEW TRANSLATION
 sco_preserve_clan_autonomy_decision.a: "Zaviesť štatúty." # todo: NEW TRANSLATION
 sco_preserve_clan_autonomy_decision.b: "Ich staré práva treba posilniť." # todo: NEW TRANSLATION
 eng_east_india_company_decision.title: "[ROOT.GetCountry.GetAdjectiveWithNoTooltip] Východoindická spoločnosť" # todo: NEW TRANSLATION
 eng_east_india_company_decision.title.entry: "Východoindická spoločnosť" # todo: NEW TRANSLATION
 eng_east_india_company_decision.desc: "Tak ako všetky ostatné prímorské národy našej doby, aj [ROOT.GetCountry.GetLongName] dokázalo zopakovať úsilie o zámorskú expanziu a nájsť cestu do Východnej Indie. Založenie spoločnosti, ktorá by využila jej mnohé bohatstvá, nám určite prinesie úžitok." # todo: NEW TRANSLATION
 eng_east_india_company_decision.desc.entry: "Cesta na východ už nie je tajomstvom, ktoré by sa oplatilo strážiť, a každý súper s prístavom sa po nej už plaví. Obchodná spoločnosť s kráľovskou výsadou by umožnila súkromnému kapitálu znášať riziko plavieb, zatiaľ čo koruna by získavala podiel z toho, čo sa vráti." # todo: NEW TRANSLATION
 eng_east_india_company_decision.a: "Využime to!" # todo: NEW TRANSLATION
 eng_east_india_company_decision.b: "Sústreďme sa na vlastnú krajinu." # todo: NEW TRANSLATION
 sco_company_of_scotland_decision.title: "Založiť [ShowGovernmentReformNameWithNoTooltip('company_of_scotland')]" # todo: NEW TRANSLATION
 sco_company_of_scotland_decision.desc: "S rastúcim záujmom o zámorský obchod nás čoraz viac znepokojuje nedostatočný vládny dohľad nad medzikontinentálnymi obchodnými trasami. Mali by sme udeliť obchodné monopoly schopným jednotlivcom a poveriť ich organizáciou našej lodnej dopravy a ochranou investícií." # todo: NEW TRANSLATION
 sco_company_of_scotland_decision.a: "Spoločnosť prinesie našej krajine prosperitu!" # todo: NEW TRANSLATION
 sco_company_of_scotland_decision.b: "To znie trochu riskantne." # todo: NEW TRANSLATION

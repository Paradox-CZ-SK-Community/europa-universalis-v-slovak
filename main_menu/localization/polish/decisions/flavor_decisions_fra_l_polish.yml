l_polish:
 fra_taille_tax_decision.title: "Zrod systému trvalého zdaňovania" # todo: NEW TRANSLATION
 fra_taille_tax_decision.desc: "Po náročnom úsilí [ruler_fra.GetName] dokončil reorganizáciu financií krajiny [ROOT.GetCountry.GetAltAdjective('G')]. Hoci [ROOT.GetCountry.GetNameWithNoTooltip] zachovávala politiku [ShowPolicyName('exceptional_only')], podľa ktorej sa dane vyberali iba počas vojny, [ruler_fra.GetShortNameWithNoTooltip] vytvoril rámec pre systém trvalého zdaňovania. Vďaka kompromisu so stavmi [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] a [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] možno novú politiku zaviesť, hoci sa stretne s nesúhlasom stavov [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')] a [ROOT.GetCountry.GetGovernment.GetEstateName('peasants_estate')]." # todo: NEW TRANSLATION # todo: COUNTRY CASE
 fra_taille_tax_decision.desc.entry: "O daň, o ktorej sa hlasuje iba v čase vojny, treba pri každom ťažení znova prosiť. Jej trvalé zavedenie by ukončilo toto žobranie a stavy $nobles_estate$ a $clergy_estate$ možno presvedčiť, aby súhlasili, ak jej bremeno ponesú namiesto nich stavy $burghers_estate$ a $peasants_estate$." # todo: NEW TRANSLATION
 fra_taille_tax_decision.a: "Vydajme ju." # todo: NEW TRANSLATION
 fra_taille_tax_decision.b: "Staré zvyky sú lepšie..." # todo: NEW TRANSLATION
 enables_taille_laws: "[ROOT.GetCountry.GetName] získa prístup k zákonom [ShowLawName('fra_taille')]" # todo: NEW TRANSLATION
 fra_taille_tax_decision.historical_info: "Za vlády Karola VII. došlo k reorganizácii francúzskych financií a zavedeniu dane Taille, čím sa vo Francúzsku zrodil systém trvalého zdaňovania. Šľachta a duchovenstvo boli od dane oslobodené, no novozavedená Taille, priama daň z pôdy, výrazne pomohla štátnym financiám po skončení storočnej vojny." # todo: NEW TRANSLATION
 fra_5_percent_tax_decision.title: "Päťpercentná daň [target_character.GetLastNameWithNoTooltip]" # todo: NEW TRANSLATION
 fra_5_percent_tax_decision.title.entry: "Päťpercentná daň $de_machault$" # todo: NEW TRANSLATION
 fra_5_percent_tax_decision.desc: "Keď bola pôvodne zavedená [ShowLawName('fra_taille')], nahradila starobylý feudálny systém zdaňovania, ktorý používala krajina [ROOT.GetCountry.GetLongName]. Postupom času sa však ukázalo, že staré výsady udelené stavu [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] a stavu [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] sú v širšom daňovom systéme štátu neefektívne.\n\n[target_character.GetName], člen správy krajiny [ROOT.GetCountry.GetAdjectiveWithNoTooltip], predložil návrh na predefinovanie zákona [ShowLawNameWithNoTooltip('fra_taille')]. Navrhuje zaviesť #italic päťpercentnú daň#! zo všeobecnej dane z pôdy, ktorá by sa vzťahovala aj na stavy [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')] a [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('clergy_estate')]. Návrh by síce prospieval štátnym financiám, no stavy [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('clergy_estate')] a [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')] už proti nemu dôrazne protestovali." # todo: NEW TRANSLATION
 fra_5_percent_tax_decision.desc.entry: "Výnimky udelené za služby spred stáročí každý rok zaťažujú štátnu pokladnicu. $name_john.french_language$ $name_baptiste$ $de_machault$ navrhuje, aby každý vlastník pôdy odvádzal rovnaký podiel z jej výnosov. Je to pomerne skromná suma, no princíp je natoľko neprijateľný, že stavy $clergy_estate$ a $nobles_estate$ už zúria." # todo: NEW TRANSLATION
 fra_5_percent_tax_decision.a: "Presadíme to!" # todo: NEW TRANSLATION
 fra_5_percent_tax_decision_tt: "$name_john.french_language$ $name_baptiste$ $de_machault$ sa pridá k nášmu [Concept('court','dvoru')|e]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 fra_5_percent_tax_decision.b: "Neodvážime sa ich rozhnevať." # todo: NEW TRANSLATION
 unlocks_machault_tax_reforms: "[ROOT.GetCountry.GetName] získa prístup k zákonom [ShowLawName('fra_5_percent_tax')], ktoré sú rozšírením [ShowLawName('fra_taille')]" # todo: NEW TRANSLATION
 fra_5_percent_tax_decision.historical_info: "Keď sa Jean-Baptiste de Machault v decembri 1745 stal generálnym kontrolórom financií vo Francúzsku, našiel krajinu na pokraji bankrotu. Ani šľachta, ani duchovenstvo neplatili všeobecnú daň z pôdy Taille. V roku 1749 sa Machault pokúsil reformovať systém a navrhol nahradiť starú desiatkovú daň, ktorej sa mnohí duchovní a šľachtici vyhýbali, päťpercentnou daňou bez výnimiek. Návrh vyvolal také hlasné protesty, že ho Machault nedokázal presadiť." # todo: NEW TRANSLATION
 fra_fouage_tax_decision.title: "Daň Fouage" # todo: NEW TRANSLATION
 fra_fouage_tax_decision.desc: "Počas [scope_ruler.GetHisHer] vlády žil [scope_ruler.GetName] v [scope_ruler.GetHisHer] postavení [ROOT.GetCountry.GetGovernment.GetRulerTitle] pomerne luxusným životom. Od nákladných ciest po rôznych panstvách v krajine [GetCountry('FRA').GetName] až po údržbu paláca [ROOT.GetCountry.GetGovernment.GetAdjective] v meste [ROOT.GetCountry.GetCapital.GetAltAdjective('L')] — štátna pokladnica [ROOT.GetCountry.GetGovernment.GetAdjective] sa takmer vyprázdnila. Aby vyvážili nákladný životný štýl panovníka [scope_ruler.GetShortNameWithNoTooltip], členovia kabinetu navrhli zaviesť vo forme novej dane z ohnísk #italic daň Fouage#!, ktorá by sa vyberala od domácností po celej krajine [GetCountry('FRA').GetNameWithNoTooltip]. Táto navrhovaná daň by síce predstavovala veľké bremeno pre stav [ROOT.GetCountry.GetGovernment.GetEstateName('peasants_estate')], no umožnila by štátnej pokladnici [ROOT.GetCountry.GetGovernment.GetAdjective] obnoviť svoje prostriedky a panovník [scope_ruler.GetShortNameWithNoTooltip] by si zároveň mohol zachovať [scope_ruler.GetHisHer] luxusný životný štýl." # todo: NEW TRANSLATION # todo: COUNTRY CASE
 fra_fouage_tax_decision.desc.entry: "Paláce, kráľovské cesty a dvor, ktorý cestuje v plnej paráde, sa neplatia z panovníkovho vrecka. Daň z ohnísk by rýchlo naplnila pokladnicu, keďže by sa vzťahovala na každú domácnosť v krajine $FRA$. To je dôvod, prečo sa pozdáva kabinetu, no nie tým, ktorí v tých domácnostiach žijú." # todo: NEW TRANSLATION
 fra_fouage_tax_decision.a: "Vyberajme ju v prospech stavu [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('crown_estate')]." # todo: NEW TRANSLATION
 fra_fouage_tax_decision.a.entry: "Vyberajme ju v prospech stavu $crown_estate$." # todo: NEW TRANSLATION
 fra_fouage_tax_decision.b: "Zatiaľ odložme zavedenie tejto dane." # todo: NEW TRANSLATION
 fra_fouage_tax_decision.c: "Štát nebude hradiť výstrelky panovníka [scope_ruler.GetShortNameWithNoTooltip]." # todo: NEW TRANSLATION
 fra_fouage_tax_decision.c.entry: "Štát nebude hradiť panovníkove výstrelky." # todo: NEW TRANSLATION
 variable_tt_enabled_fouage_tax: "Fouage povolené" # todo: NEW TRANSLATION
 fra_fouage_tax_decision.historical_info: "Daň Fouage (daň z ohnísk) sa prvýkrát vyberala za vlády kráľa Filipa III. na pokrytie kráľovských výdavkov, ako aj finančných dôsledkov čiernej smrti a storočnej vojny. Stala sa jednou z významných daní, ktorými panovníci Francúzska udržiavali kráľovskú pokladnicu. Hoci sa daň vyberala iba v niektorých [GetCountry('FRA').GetAdjectiveWithNoTooltip] regiónoch, v druhej polovici 14. storočia sa postupne rozšírila po celom Francúzsku." # todo: NEW TRANSLATION
 fra_edict_of_toleration_decision.title: "Edikt z Fontainebleau" # todo: NEW TRANSLATION
 fra_edict_of_toleration_decision.desc: "Šírenie reformácie vyvolalo vlnu otrasov naprieč kontinentom [ShowContinentName('europe')]. Mnohí, ktorí prestali dôverovať učeniu cirkvi [ShowReligionAdjective('catholic')], sa teraz hlásia k novozaloženej viere [ShowReligionAdjective('lutheran')]. Hoci väčšina obyvateľov krajiny [GetCountry('FRA').GetName] zostáva verná viere [ShowReligionAdjectiveWithNoTooltip('catholic')], rastúci vplyv prívržencov [ShowReligionAdjectiveWithNoTooltip('lutheran')] prinútil [ROOT.GetCountry.GetGovernment.GetCourtTitle] konať.\n\n[ruler_fra.GetName] bol požiadaný, aby prijal [ShowPolicyName('edict_of_fontainebleau')], edikt zameraný na potlačenie rastúceho vplyvu [ShowReligionAdjectiveWithNoTooltip('lutheran')] skôr, než v krajine [GetCountry('FRA').GetNameWithNoTooltip] vyvolá veľké nepokoje." # todo: NEW TRANSLATION
 fra_edict_of_toleration_decision.desc.entry: "Viera, ktorá sa šíri medzi obchodníkmi a tlačiarmi, sa vykoreňuje ťažšie než tá, ktorú vyznávajú roľníci. Zborov [ShowReligionAdjective('lutheran')] je zatiaľ málo a náš dvor sa musí rozhodnúť, či ich teraz zlomí pomocou [ShowPolicyName('edict_of_fontainebleau')], alebo sa naučí žiť po ich boku." # todo: NEW TRANSLATION
 fra_edict_of_toleration_decision.a: "Musíme zakročiť proti šíreniu herézy." # todo: NEW TRANSLATION
 fra_edict_of_toleration_decision.b: "Voči prívržencom [ShowReligionAdjectiveWithNoTooltip('lutheran')] by sme mali zachovať humanistický postoj." # todo: NEW TRANSLATION
 fra_colonial_ambitions_decision.title: "Návrat ku koloniálnym záležitostiam" # todo: NEW TRANSLATION
 fra_colonial_ambitions_decision.desc: "Náboženské nepokoje sužujú krajinu [GetCountry('FRA').GetName] už desaťročia a [ROOT.GetCountry.GetGovernment.GetAdjective] [ROOT.GetCountry.GetGovernment.GetCourtTitle] opäť navrhol usilovať sa o koloniálne ambície v Novom svete. Plavby predošlých objaviteľov už priniesli krajine [GetCountry('FRA').GetNameWithNoTooltip] množstvo informácií o nových územiach, no náboženský rozkol spôsobený reformáciou prinútil [ROOT.GetCountry.GetGovernment.GetCourtTitle] vzdať sa ďalších koloniálnych ambícií. Ostatné koloniálne mocnosti v kontinentu [ShowContinentName('europe')] si však už v Novom svete založili vlastné osady a osady krajiny [GetCountry('FRA').GetAdjectiveWithNoTooltip] môžu viesť k diplomatickým sporom s ostatnými koloniálnymi mocnosťami.\n\nNiektorí členovia [ROOT.GetCountry.GetGovernment.GetCourtTitle] tiež navrhli, aby sa štát pokúsil ovládnuť nové indické obchodné trasy a namiesto toho založil obchodnú spoločnosť v kontinentu [ShowContinentName('asia')]." # todo: NEW TRANSLATION
 fra_colonial_ambitions_decision.desc.entry: "Západnú cestu poznáme. Chýbalo nám len desaťročie pokoja doma, aby sme ju využili. Naši rivali toto desaťročie strávili zakladaním kolónií, takže každá naša osada by teraz vznikla na území niekoho iného — ibaže by sme namiesto toho obrátili pozornosť na obchod s kontinentom [ShowContinentName('asia')]." # todo: NEW TRANSLATION
 fra_colonial_ambitions_decision.a: "Mali by sme sa zamerať na územia Nového sveta." # todo: NEW TRANSLATION
 fra_colonial_ambitions_decision.b: "Namiesto toho by sme sa mali pokúsiť ovládnuť indický obchod." # todo: NEW TRANSLATION
 fra_centralize_monarchy_decision.title: "Zjednotenie apanážnych území" # todo: NEW TRANSLATION
 fra_centralize_monarchy_decision.desc: "Po stáročiach rozdrobenosti koruna konečne získala späť mnohé zaniknuté apanážne územia a opäť ich začlenila do kráľovskej domény. Rôzne vedľajšie vetvy kapetovského rodu sa síce ukázali ako schopní poddaní, no zároveň znemožňovali akékoľvek pokusy o centralizáciu. Teraz, keď sú tieto územia zjednotené, môžu [ROOT.GetCountry.GetGovernment.GetRuler.GetName] a jeho dvor podniknúť kroky k reforme krajiny [GetCountry('FRA').GetName] na modernejší štát." # todo: NEW TRANSLATION
 fra_centralize_monarchy_decision.desc.entry: "Po celé generácie vládli apanážnym územiam naši bratranci. Bolo to pohodlné, no znemožňovalo to reformy. Tieto územia konečne podliehajú priamo korune a ríšu, ktorá sa zodpovedá jedinej autorite, možno konečne spravovať ako jeden štát." # todo: NEW TRANSLATION
 fra_centralize_monarchy_decision.a: "Významný krok k modernizácii krajiny [GetCountry('FRA').GetNameWithNoTooltip]." # todo: NEW TRANSLATION
 fra_code_louis_decision.title: "Vypracovanie Zákonníka Ľudovíta" # todo: NEW TRANSLATION
 fra_code_louis_decision.desc: "[fra_ruler.GetName] a mnohí z [fra_ruler.GetHisHer] najbližších poradcov na [ROOT.GetCountry.GetGovernment.GetCourtTitle] dokončili prípravu #italic Zákonníka Ľudovíta#!, prvého pokusu o zjednotenie práva na celom území krajiny [ROOT.GetCountry.GetAltAdjective('G')]. Po stáročia [ROOT.GetCountry.GetAltAdjectiveWithNoTooltip('A')] existovali dva samostatné právne systémy: severné provincie sa riadili starými zvykovými zákonmi, zatiaľ čo v južných provinciách slúžilo ako hlavný právny poriadok rímske občianske právo.\n\nZákonník Ľudovíta by zjednotil právny poriadok krajiny [ROOT.GetCountry.GetAltAdjectiveWithNoTooltip('G')], no niektorí poradcovia vyzývajú na opatrnosť pri jeho rýchlom zavádzaní. Niektoré provincie, najmä južné, ktoré sa predtým riadili rímskym právom, môžu mať pri prijímaní nového zákonníka ťažkosti." # todo: NEW TRANSLATION # todo: COUNTRY CASE
 fra_code_louis_decision.desc.entry: "Obchodník, ktorý prejde z jednej provincie do druhej, mení zákonník rovnako ako kone. Jeden zákonník pre celú krajinu $FRA$ by to napravil, no južné provincie sa riadia rímskym právom už od čias pred vznikom kráľovstva a nevzdajú sa ho ľahko." # todo: NEW TRANSLATION
 fra_code_louis_decision.a: "Je načase, aby sa celá krajina [ROOT.GetCountry.GetNameWithNoTooltip] riadila jednotným právom." # todo: NEW TRANSLATION
 fra_code_louis_decision.a.entry: "Je načase, aby sme sa všetci riadili jednotným právom." # todo: NEW TRANSLATION
 fra_code_louis_decision.b: "Zatiaľ prijmime zákonník iba v severných provinciách krajiny [ROOT.GetCountry.GetAltAdjectiveWithNoTooltip('G')]." # todo: NEW TRANSLATION # todo: COUNTRY CASE
 fra_code_louis_decision.b.entry: "Zatiaľ prijmime zákonník iba v severných provinciách krajiny $FRA$." # todo: NEW TRANSLATION
 fra_versailles_residence_decision.title: "Stav [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')] a Versailles" # todo: NEW TRANSLATION
 fra_versailles_residence_decision.title.entry: "Stav $nobles_estate$ a Versailles" # todo: NEW TRANSLATION
 fra_versailles_residence_decision.desc: "Od svojho dokončenia sa Versailles rýchlo stalo obľúbeným miestom, kde [fra_ruler.GetName] a [ROOT.GetCountry.GetGovernment.GetAdjective] rodina ubytovávali príslušníkov významných politických rodov krajiny [ROOT.GetCountry.GetAltAdjective('G')]. Palác bol postavený ako symbol „božského práva vládnuť“ [ROOT.GetCountry.GetAdjectiveWithNoTooltip] [ROOT.GetCountry.GetGovernment.GetRulerTitle], no stal sa aj symbolom politickej priazne a spoločenského postavenia tých, ktorým bolo dovolené istý čas v ňom bývať.\n\nMnohí z [fra_ruler.GetHerHis] blízkych poradcov naliehajú na panovníka [fra_ruler.GetShortNameWithNoTooltip], aby pozval vplyvné rody, ktoré sa stále pridŕžajú starých feudálnych zvyklostí, na [ROOT.GetCountry.GetGovernment.GetCourtTitle], aby sa usadili vo Versailles. Získaním priazne týchto starých rodov by sa moc ešte viac sústredila v rukách stavu [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')]." # todo: NEW TRANSLATION # todo: COUNTRY CASE
 fra_versailles_residence_decision.desc.entry: "Veľký dom plný hostí je aj veľkým domom plným rukojemníkov. Rodiny, ktoré sa stále držia starých feudálnych zvykov, možno pozvať do Versailles a lichôtkami presvedčiť, aby tam zostali. Každé obdobie, ktoré tam strávia, je obdobím, počas ktorého sa ich stav $crown_estate$ musí báť o niečo menej." # todo: NEW TRANSLATION
 fra_versailles_residence_decision.a: "Pozvime významné rody, aby sa usadili vo Versailles." # todo: NEW TRANSLATION
 fra_versailles_residence_decision.b: "Palác bol postavený pre potešenie [ROOT.GetCountry.GetGovernment.GetAdjective] rodiny, tak to aj ponechajme." # todo: NEW TRANSLATION
 fra_versailles_residence_decision.b.entry: "Palác bol postavený pre potešenie kráľovskej rodiny, tak to aj ponechajme." # todo: NEW TRANSLATION
 this_may_lead_to_permanent_weakening_of_the_nobility: "Povolenie členom [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] prebývať vo Versailles môže viesť k trvalému oslabeniu ich vplyvu." # todo: NEW TRANSLATION
 fra_versailles_permanent_decision.title: "Stále sídlo pre stav [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')]" # todo: NEW TRANSLATION
 fra_versailles_permanent_decision.title.entry: "Stále sídlo pre stav $nobles_estate$" # todo: NEW TRANSLATION
 fra_versailles_permanent_decision.desc: "Snaha získať si lojalitu a politický vplyv stavu [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] tým, že sme mu povolili bývať vo Versailles, sa ukázala ako veľmi účinná. Mnohí príslušníci rôznych politických rodov si čoraz častejšie volia pobyt v paláci namiesto života na vlastných panstvách. Keď sa vo Versailles konajú [ROOT.GetCountry.GetGovernment.GetAdjective] bály, títo ľudia akoby podľahli čaru palácového luxusu a rýchlo si udržiavajú blízke vzťahy s [fra_ruler.GetName], aby si zachovali [fra_ruler.GetHisHer] priazeň.\n\nVersailles, ktoré bolo kedysi tŕňom v oku [ROOT.GetCountry.GetAdjective] [ROOT.GetCountry.GetGovernment.GetRulerTitle], takmer zviedlo moc mnohých príslušníkov stavu [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')]. Zdá sa však, že [fra_ruler.GetShortNameWithNoTooltip] sa napokon stal skutočne rovnocenným a neohrozeným [ROOT.GetCountry.GetGovernment.GetRulerTitle]." # todo: NEW TRANSLATION
 fra_versailles_permanent_decision.desc.entry: "Pasca zaklapla jemnejšie, než ktokoľvek čakal. Stav $nobles_estate$ teraz súperí o izby a prednosť v našom sídle, namiesto toho, aby bojoval o moc vo svojich vlastných. Panovník, ktorého už netrápia rivali, je neohrozený." # todo: NEW TRANSLATION
 fra_versailles_permanent_decision.a: "Vznešenosť Versailles navždy zatienila stav [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')]." # todo: NEW TRANSLATION
 fra_versailles_permanent_decision.a.entry: "Vznešenosť Versailles navždy zatienila stav $nobles_estate$." # todo: NEW TRANSLATION
 fra_versailles_permanent_decision.b: "Historickú moc stavu [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')] treba naďalej rešpektovať." # todo: NEW TRANSLATION
 fra_versailles_permanent_decision.b_tt: "Neskôr budeme môcť vybrať možnosť $permanent_residence_in_versailles$" # todo: NEW TRANSLATION
 fra_versailles_permanent_decision.b.entry: "Historickú moc stavu $nobles_estate$ treba naďalej rešpektovať." # todo: NEW TRANSLATION
 fra_marcel_great_ordinance_decision.title: "Veľká ordonancia" # todo: NEW TRANSLATION
 fra_marcel_great_ordinance_decision.desc: "Nedávne konflikty vážne vyčerpali financie stavu [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')], a tak [ROOT.GetCountry.GetGovernment.GetRuler.GetName] musel požiadať generálne stavy o obnovenú podporu pri získavaní prostriedkov a vojska pre stav [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('crown_estate')]. Posledné desaťročia však zasiali v generálnych stavoch nespokojnosť, najmä v treťom stave, kde sa podpora vojny stretáva so skepsou voči zmenám finančnej politiky od začiatku najnovšieho konfliktu. Jedným z čoraz významnejších vodcov opozície je vplyvný [etienne_marcel.GetName], ktorý získal veľkú podporu pre protinávrh, jenž by prelomil patovú situáciu v generálnych stavoch a zabezpečil korune nové financovanie. Vo svojej navrhovanej „Veľkej ordonancii“ [etienne_marcel.GetNameWithNoTooltip] požaduje, aby stav [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('crown_estate')] súhlasil s obmedzením svojich právomocí, čím by otvoril cestu reformám vedeným stavom [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')]." # todo: NEW TRANSLATION
 fra_marcel_great_ordinance_decision.desc.entry: "Rokovania o financovaní súčasných vojen v generálnych stavoch uviazli na mŕtvom bode. Tretí stav vedený vplyvnými obchodníkmi navrhol „Veľkú ordonanciu“ a za svoju podporu žiada viac výsad a právomocí. Môžeme ich návrh prijať alebo nájsť iný spôsob, ako zabezpečiť financovanie od generálnych stavov." # todo: NEW TRANSLATION
 fra_marcel_great_ordinance_decision.a: "Zúfalá doba si žiada zúfalé opatrenia." # todo: NEW TRANSLATION
 fra_marcel_great_ordinance_decision.b: "Radšej požiadajme o pomoc šľachtu!" # todo: NEW TRANSLATION
 fra_marcel_great_ordinance_decision.c: "Pokúsme sa s Marcelom vyjednať kompromis." # todo: NEW TRANSLATION
 fra_marcel_great_ordinance_decision_cooldown: "Nedávno odmietol spolupracovať s Marcelom" # todo: NEW TRANSLATION
 fra_marcel_great_ordinance_decision.historical_info: "Po bitke pri Poitiers a zajatí kráľa Jána II. musel dauphin Karol, ktorý vtedy vládol ako regent, zvolať generálne stavy, aby sa vyrovnal s následkami bitky. Narazil na prudký odpor Étienna Marcela, ktorý využíval vplyv tretieho stavu. Marcel požadoval, aby Karol súhlasil s viacerými dohodami, napríklad s podpísaním Veľkej ordonancie, a tiež s ďalšími politickými ústupkami, ako bolo prepustenie navarrského kráľa Karola „Zlého“, s ktorým bol Marcel politicky spojený. Karol spočiatku Marcelovým požiadavkám vzdoroval, no napokon im ustúpil a ordonanciu podpísal. Kráľ Ján II. však v roku 1357 ordonanciu zakázal, čím zabránil jej plnému uplatneniu." # todo: NEW TRANSLATION
 fra_marcel_compromise_decision.title: "Kompromis o Veľkej ordonancii" # todo: NEW TRANSLATION
 fra_marcel_compromise_decision.desc: "Krajina [ROOT.GetCountry.GetLongName] je naďalej uprostred vojny a ťažkosti, ktoré viedli [etienne_marcel.GetName] k predloženiu jeho návrhov, nepoľavili. V minulosti sme jeho návrhy odmietli, no možno budeme musieť čeliť skutočnosti: bez podpory generálnych stavov môže mať stav [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')] problém prežiť. Možno nastal čas obrátiť sa na [etienne_marcel.GetNameWithNoTooltip] a pokúsiť sa znovu prerokovať jeho predchádzajúci návrh, aby sme dosiahli kompromis. Budeme mu musieť prenechať časť vlastnej moci, no na oplátku môžeme získať finančnú podporu generálnych stavov." # todo: NEW TRANSLATION
 fra_marcel_compromise_decision.desc.entry: "Odmietli sme ustúpiť požiadavkám Veľkej ordonancie, no stále sme uprostred konfliktov a generálne stavy naďalej využívajú túto situáciu vo svoj prospech. Ak sa na ne obrátime, možno dosiahneme kompromis." # todo: NEW TRANSLATION
 fra_marcel_compromise_decision.a: "Pokúsme sa s Marcelom vyjednať kompromis." # todo: NEW TRANSLATION
 fra_marcel_compromise_decision.a.tt: "$Marcel$ sa nám už nebude stavať na odpor" # todo: NEW TRANSLATION
 fra_marcel_compromise_decision.historical_info: "$fra_marcel_great_ordinance_decision.historical_info$" # todo: NEW TRANSLATION
 fra_formalized_relations_decision.title: "Záležitosti regiónu [ShowRegionNameWithNoTooltip('italy_region')]" # todo: NEW TRANSLATION
 fra_formalized_relations_decision.desc: "V poslednom čase sa obnovil záujem o naše južné hranice pozdĺž Álp. Hoci [ROOT.GetCountry.GetGovernment.GetAdjective] [ROOT.GetCountry.GetGovernment.GetCourtTitle] v minulosti udržiaval kontakty s viacerými štátmi a rodmi skupiny [ShowCultureGroupName('italian_group')] z regiónu [ShowRegionName('italy_region')], jeho schopnosť udržiavať s týmto regiónom súdržné vzťahy bola obmedzená. Rôzni poradcovia a dvorania navrhli [fra_ruler.GetName], aby krajina [ROOT.GetCountry.GetName] rozšírila svoj vplyv v regióne. Hoci sa región [ShowRegionNameWithNoTooltip('italy_region')] skladá z mnohých rozličných štátov, tie by sa mohli stať mocnými politickými spojencami. Niektorí členovia [ROOT.GetCountry.GetGovernment.GetCourtTitle] zase odporúčajú zvoliť si panovačnejší prístup a pokúsiť sa násilím dostať našich susedov zo skupiny [ShowCultureGroupNameWithNoTooltip('italian_group')] pod nadvládu krajiny [ROOT.GetCountry.GetAltAdjectiveWithNoTooltip('G')]." # todo: NEW TRANSLATION # todo: COUNTRY CASE
 fra_formalized_relations_decision.desc.entry: "V posledných rokoch pripomínajú alpské priesmyky čoraz menej hranicu a čoraz viac príležitosť. Štáty skupiny [ShowCultureGroupName('italian_group')] v regióne [ShowRegionName('italy_region')] sú bohaté, rozdrobené a možno ich získať buď za spojencov, alebo za poddaných — podľa toho, ktorú radu si zvolíme." # todo: NEW TRANSLATION
 fra_formalized_relations_decision.a: "Usilujme sa o priateľské vzťahy s užitočnými štátmi." # todo: NEW TRANSLATION
 fra_formalized_relations_decision.b: "Zatiaľ by sme mali zachovať neutrálnu politiku." # todo: NEW TRANSLATION
 fra_formalized_relations_decision.c: "Naši susedia zo skupiny [ShowCultureGroupNameWithNoTooltip('italian_group')] by sa mali lepšie pod našou nadvládou." # todo: NEW TRANSLATION

l_polish:
 tur_enderun_academy_decision.title: "Akadémia Enderûn" # todo: NEW TRANSLATION
 tur_enderun_academy_decision.desc: "Aby sme pre našu rozrastajúcu sa ríšu vychovali správcov a generálov, mohli by sme zriadiť školu, ktorú by viedol úzky kruh dvora, aby študenti zostali blízko panovníka. Nielenže by nám to poskytlo množstvo cenných poznatkov, ale študentov by to aj pripútalo k nám a zaistilo by to pretrvávajúci význam dynastie [ROOT.GetCountry.GetGovernment.GetRuler.GetDynasty.GetName] vo všetkých štátnych záležitostiach.\n\nNemali by sme však prijímať iba šľachticov, ale aj každého dostatočne nadaného mladíka bez ohľadu na jeho pôvod." # todo: NEW TRANSLATION
 tur_enderun_academy_decision.desc.entry: "Sluha vychovaný v paláci vďačí za svoje postavenie dynastii, nie menu svojho otca. Škola vedená vnútorným dvorom nám poskytne správcov a veliteľov, ktorých kariéra sa začne aj skončí podľa našej vôle, a niet dôvodu vyhradiť jej lavice iba pre urodzených." # todo: NEW TRANSLATION
 tur_enderun_academy_decision.a: "Toto je budúcnosť!" # todo: NEW TRANSLATION
 tur_enderun_academy_decision.historical_info: "Mehmed II. založil školu na nádvorí novopostaveného paláca Topkapi. Študentov vyberali spomedzi najsľubnejších odvedencov devširme (odvedených kresťanských mladíkov) a vzdelávali ich v islamskej viere, vedách a vojenskom umení, ako aj v mnohých jazykoch. Obsadzovanie štátnych úradov odvedencami devširme, ktorí sa vzdelávali v palácovej škole a boli verní sultánovi, tvorilo v pätnástom a šestnástom storočí základ osmanského patrimoniálneho systému vlády." # todo: NEW TRANSLATION
 tur_expanded_timariot_decision.title: "Rozšírenie timariotského systému" # todo: NEW TRANSLATION
 tur_expanded_timariot_decision.desc: "Na financovanie rozšírenia timariotského systému nám šikovní radcovia navrhli presmerovať časť príjmov z vakfu, nadácií pri mešitách, ktoré poskytujú dobročinnú pomoc nešťastným a opusteným. To by nepochybne ešte viac posilnilo našu armádu a obmedzilo moc [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')], mohlo by to však vyvolať rozsiahlu nespokojnosť, keď sa o tom dozvedia zbožnejšie vrstvy ľudu." # todo: NEW TRANSLATION
 tur_expanded_timariot_decision.desc.entry: "Pôda udelená jazde si na seba zarobí; dobročinné nadácie nám nezabezpečia nič, s čím by sa dalo pochodovať. Presmerovaním vakfu by sme vyslali do poľa viac jazdcov a zároveň pristrihli krídla $clergy_estate$, no zbožní si sotva nevšimnú, kam sa peniaze podeli." # todo: NEW TRANSLATION
 tur_expanded_timariot_decision.a: "Štát tie peniaze potrebuje." # todo: NEW TRANSLATION
 tur_expanded_timariot_decision.b: "Vakfu sa nesmieme nikdy dotknúť!" # todo: NEW TRANSLATION
 tur_expanded_timariot_decision.historical_info: "Mehmed II. sa usiloval za každú cenu rozšíriť svoju osobnú moc v Osmanskej ríši. Ku koncu svojej vlády sa pokúsil obmedziť moc ulemov presmerovaním príjmov z nadácií #italic vakfu#!, ktoré ich podporovali, do timariotského systému, čím posilnil osmanskú armádu. Tento krok sa však ukázal ako kontroverzný..." # todo: NEW TRANSLATION
 tur_enderun_service_decision.title: "Vnútorná služba" # todo: NEW TRANSLATION
 tur_enderun_service_decision.desc: "Schopní eunuchovia-otroci už dlho zohrávajú v našej vláde obmedzenú úlohu, no títo vykastrovaní muži, bez ambícií založiť si rodinu a získať svetskú moc, v sebe skrývajú veľký potenciál. Keďže na dvore máme niekoľko nadaných mladých otrokov, mohli by sme takých schopných dvoranov pevnejšie pripútať k dynastii [ROOT.GetCountry.GetGovernment.GetRuler.GetDynasty.GetName] a zveriť im formálne miesta v našej domácnosti, na úkor podlízavých starých [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')], ktorí sa o tieto posty kedysi uchádzali." # todo: NEW TRANSLATION # todo: COUNTRY CASE
 tur_enderun_service_decision.desc.entry: "Muž, ktorý nemôže založiť vlastnú dynastiu, má len malý dôvod budovať ju na náš úkor. Formálne posty v domácnosti pre palácových eunuchov by pozdvihli tých najschopnejších z nich nad $nobles_estate$, ktorí tieto miesta už dlho považujú za svoje dedičstvo." # todo: NEW TRANSLATION
 tur_enderun_service_decision.a: "Na reformu dvora je najvyšší čas." # todo: NEW TRANSLATION
 tur_enderun_service_decision.b: "Nie, aj naďalej sa musíme spoliehať na [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')]." # todo: NEW TRANSLATION
 tur_enderun_service_decision.b.entry: "Nie, aj naďalej sa musíme spoliehať na $nobles_estate$." # todo: NEW TRANSLATION
 tur_enderun_service_decision.historical_info: "#italic Enderûn#!, slovo odvodené z perzského výrazu pre #italic vnútro#!, označovalo dvoranov najbližších osmanskému sultánovi. Odlišovali sa od #italic Birûn#!, vonkajšej služby, ktorá predstavovala byrokraciu ríše. Enderûn tvorili predovšetkým eunuchovia a mladí kresťanskí otroci. Ich úlohou bola najmä starostlivosť o cisársku rodinu a jej vzdelávanie, no časom niektorí z nich získali veľkú politickú moc." # todo: NEW TRANSLATION
 tur_imperial_harem_decision.title: "Usporiadanie háremu" # todo: NEW TRANSLATION
 tur_imperial_harem_decision.desc: "Doteraz bol dvor dynastie [ROOT.GetCountry.GetGovernment.GetRuler.GetDynasty.GetName] roztrúsený po rôznych palácoch a úradoch. Ak však naozaj túžime po veľkosti, mohli by sme sústrediť svoju moc a prítomnosť v [capital_location.GetName]. To by si vyžadovalo presunúť tam všetky kráľovské konkubíny Cariye a ubytovať ich v uzavretých priestoroch plných prepychu.\n\n[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')] by to však vnímali ako útok na seba, pretože by mnohých z nich pripravilo o osobný prístup k [target_ruler.GetName], ktorý si už dlho užívajú." # todo: NEW TRANSLATION
 tur_imperial_harem_decision.desc.entry: "Moc patrí tomu, kto stojí najbližšie k panovníkovi, a v súčasnosti je to ten, kto náhodou vlastní najbližší palác. Sústreďme domácnosť do jedného stráženého sídla v hlavnom meste a túto otázku vyriešime raz a navždy. Práve preto to bude $nobles_estate$ tak prekážať." # todo: NEW TRANSLATION
 tur_imperial_harem_decision.a: "Zriadiť cisársky hárem." # todo: NEW TRANSLATION
 tur_imperial_harem_decision.b: "Naše usporiadanie dvora funguje dobre aj takto." # todo: NEW TRANSLATION
 tur_imperial_harem_decision.historical_info: "V 16. storočí sa moc osmanskej dynastie sústredila v paláci Topkapi v Konštantínopole a väčšina členov kráľovskej rodiny, najmä ženy, tam strávila celý život. Hárem sa tak premenil na dobre organizovanú hierarchickú inštitúciu. Dôraz na odlúčenie dynastického života od sveta zmenil osobný prístup k panovníkovi na veľkú výsadu, a tým vyjadroval jeho moc." # todo: NEW TRANSLATION
 tur_eunuch_viziers_decision.title: "Zriadenie úradu Kızlar Ağası" # todo: NEW TRANSLATION
 tur_eunuch_viziers_decision.desc: "[mehmed_agha.GetName] je brilantný eunuch na dvore [ROOT.GetCountry.GetGovernment.GetCourtTitle] a jeden zo strážcov [ROOT.GetCountry.GetGovernment.GetAdjective] háremu. Niekoľko frakcií na [ROOT.GetCountry.GetGovernment.GetCourtTitle] chce preňho zriadiť nový úrad: #italic Kızlar Ağası#!, strážca dievčat. V tejto úlohe by dohliadal na súkromné komnaty [ROOT.GetCountry.GetGovernment.GetRulerTitle] a sprostredkúval by vzťahy medzi háremom a vysokou radou. Zároveň by sa povzniesol nad starého bieleho hlavného eunucha, #italic Kapı Ağası#!, ktorý zodpovedá za sluhov-chlapcov na [ROOT.GetCountry.GetGovernment.GetCourtTitle], no nikdy mu nebolo možné úplne dôverovať." # todo: NEW TRANSLATION
 tur_eunuch_viziers_decision.desc.entry: "Ten, kto ovláda prístup do súkromných komnát panovníka, ovláda oveľa viac než len dvere. $name_muhammad.turkish_language$ má na taký úrad dosť dôvtipu a jeho povýšenie na #italic Kızlar Ağası#! by zároveň vyriešilo dávnu otázku lojality hlavného bieleho eunucha." # todo: NEW TRANSLATION
 tur_eunuch_viziers_decision.a: "Povýšiť Kızlar Ağası." # todo: NEW TRANSLATION
 mehmed_agha_tt: "Do nášho dvora vstúpi schopná [Concept('character','postava')|e] a získa [Concept('modifier','modifikátor')|e] [ShowModifier('kizlar_agha_modifier')]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 tur_eunuch_viziers_decision.b: "Namiesto toho posilniť Kapı Ağası." # todo: NEW TRANSLATION
 valide_sultan_objects.tt: "Valide Sultan to neprijme." # todo: NEW TRANSLATION
 mehmed_agha_fired.tt: "[mehmed_agha.GetNameWithNoTooltip] opúšťa [ROOT.GetCountry.GetGovernment.GetCourtTitle]." # todo: NEW TRANSLATION
 tur_eunuch_viziers_decision.historical_info: "Počet eunuchov na osmanskom dvore neustále rástol. V roku 1574 bol pre Mehmeda Aghu zriadený úrad Kızlar Ağası, ktorý eunuchom priniesol bezprecedentnú moc. Africkí eunuchovia sa považovali za dôveryhodnejších, pretože ich domoviny boli tak ďaleko, a časom získali omnoho väčší vplyv než bieli eunuchovia. Aj vďaka úzkym väzbám Kızlar Ağası na mocné Valide Sultany (kráľovné matky) sa tento úrad čoskoro stal úradom veľkovezíra prvej hodnosti, nad ktorým stáli už len veľkovezír a $common_string_shaikh_al_islam$." # todo: NEW TRANSLATION
 tur_sekban_system_decision.title: "Ukončiť [ShowAdvanceNameWithNoTooltip('timariots')]" # todo: NEW TRANSLATION
 tur_sekban_system_decision.desc: "Systém [ShowAdvanceName('timariots')], ktorý nám dlho dobre slúžil, čelí vážnym problémom. Pôda, ktorú udeľujeme týmto jazdcom, je čoraz viac rozdrobená a neúrodná a nepriatelia vyzbrojení mušketami zabezpečili, že jazda už na bojisku nedominuje tak ako kedysi. Ak prestaneme udeľovať ďalšie timarské pozemky, ich držitelia časom zostarnú a zomrú a my ich budeme môcť premeniť na daňové farmy v priamy prospech štátu. Armádu by sme tiež mohli modernizovať a viac sa zamerať na pechotu vyzbrojenú strelnými zbraňami." # todo: NEW TRANSLATION
 tur_sekban_system_decision.a: "Musíme sa prispôsobiť dobe." # todo: NEW TRANSLATION
 timars_unavailable.tt: "Timar [Concept('reforms','reformy')|e] budú navždy nedostupné." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 tur_sekban_system_decision.historical_info: "Systém udeľovania pozemkov sipáhijskej jazde sa časom stal neudržateľným. Keď sa veľké osmanské výboje stali minulosťou, už nebolo dosť pôdy na rozdávanie. O pôdu žiadali aj iné armádne frakcie, najmä janičiari. Osmani si uvedomili, že reforma už dávno mešká, systém zrušili a začali sa viac spoliehať na verbovanie vojakov sekbanov z roľníctva." # todo: NEW TRANSLATION
 tur_kanum_i_osmani_decision.title: "[ShowPolicyNameWithNoTooltip('tur_kanum_i_osmani')]" # todo: NEW TRANSLATION
 tur_kanum_i_osmani_decision.desc: "Vďaka rozmachu [ROOT.GetCountry.GetFlavorRank] žije v jeho hraniciach množstvo rôznych národov. Mnohí už splynuli s naším národom a riadia sa starými [ROOT.GetCountry.GetAdjective] zákonmi. Zdá sa však, že tieto zákony nestačia. [target_character.GetName], známy ako priekopník reforiem, chce namiesto toho prepísať celý právny poriadok krajiny [ROOT.GetCountry.GetAltAdjectiveWithNoTooltip('G')] a dosiahnuť vnútornú stabilitu, nie podporovať rozširovanie hraníc výbojmi." # todo: NEW TRANSLATION # todo: COUNTRY CASE
 tur_kanum_i_osmani_decision.desc.entry: "Zákony napísané pre pohraničné kniežatstvo nestačia na riadenie ríše obývanej mnohými národmi. Jednotný zákonník vydaný v našom mene, ktorý bude záväzný pre všetkých, prinesie vnútorný poriadok, aký ďalšie výboje nedokážu zabezpečiť. A za jednu éru sme toho dobyli viac než dosť." # todo: NEW TRANSLATION
 tur_kanum_i_osmani_decision.a: "Tieto zákony nás privedú do novej éry." # todo: NEW TRANSLATION
 tur_kanum_i_osmani_decision.b: "Na tieto reformy nezabudneme." # todo: NEW TRANSLATION
 tur_change_tur_kanum_policy_to_give_values_weighted_by_crown_power: "Modifikátory ([Concept('modifiers','modifikátory')|e]), ktoré politika [ShowPolicyName('tur_kanum_i_osmani')] [Concept('policy','politika')|e] poskytuje, budú o #Y 50%#! účinnejšie, avšak ich efekt bude škálovaný podľa [Concept('estate_power','sily stavu')|e] [GetEstateName('crown_estate')]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 tur_autonomous_kadiluks_decision.title: "Posilniť kádího" # todo: NEW TRANSLATION
 tur_autonomous_kadiluks_decision.desc: "#italic Kádí#!, sudcovia vo všetkých dôležitých záležitostiach [ShowReligionGroupAdjective('muslim')] ľudu, sú už dlho pilierom štátu a úrad kádího je snom mnohých učencov. Nedávny pokrok v správe krajiny a daňovom hospodárení však vedie kádíov k tomu, aby žiadali väčšiu autonómiu nad pozemkovými údelmi #italic kadiluk#!, za ktoré zodpovedajú. Tvrdia, že ak im ju poskytneme, posilníme svoj nárok na prvenstvo vo svete [ShowReligionGroupNameWithNoTooltip('muslim')] a navždy upevníme dôveru medzi nimi a Vznešenou portou." # todo: NEW TRANSLATION
 tur_autonomous_kadiluks_decision.a: "Našu dôveru si zaslúžia." # todo: NEW TRANSLATION
 tur_autonomous_kadiluks_decision.b: "Už teraz majú dosť veľkú moc." # todo: NEW TRANSLATION
 has_enabled_kadiluks_privilege: "Toto [Concept('estate_privilege','privilégiá stavu')|e] bolo udelené prostredníctvom [Concept('decision','rozhodnutia')|e] „$tur_autonomous_kadiluks_decision.title$“" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 tur_autonomous_kadiluks_decision.historical_info: "V Osmanskej ríši 17. storočia sultánova moc postupne slabla a čoraz väčší vplyv získavali inštitúcie, ako boli janičiari a kádíovia. Kadiluk bola oblasť pod právomocou kádího, ktorý v nej dohliadal na dane aj vojenské odvody. Prostredníctvom kadilukov mohli kádíovia uplatňovať značný vplyv, najmä v provinciách mimo bezprostredného dosahu kráľovskej moci. Ich postavenie dosiahlo nový vrchol po Edirnskom incidente v roku 1703, keď bol zosadený sultán Mustafa II." # todo: NEW TRANSLATION
 tur_malikane_decision.title: "Reforma $ottoman_tax_farming$" # todo: NEW TRANSLATION
 tur_malikane_decision.desc: "Po zvážení našej ekonomiky pripravil [grand_vizier.GetName] nový systém daňového hospodárenia nazvaný #italic Malikâne#!. Dedina alebo okres sa vydraží najvyššej ponuke a víťaz získa doživotné právo vyberať tam dane. [grand_vizier.GetSheHe] tvrdí, že tým vylepšíme starý systém, pretože daňový farmár bude mať väčší záujem o dlhodobú prosperitu svojich pozemkov a nebude ich tak ochotný vyžmýkať dosucha ešte pred koncom svojho funkčného obdobia. Ušetríme si aj byrokratické starosti so správou všetkých tých jednoročných zmlúv, ktoré bývali kedysi bežné — na druhej strane však boli celkom výnosné." # todo: NEW TRANSLATION
 tur_malikane_decision.desc.entry: "Daňový farmár, ktorý drží dedinu jeden rok, ju vyžmýka; ten, kto ju drží doživotne, sa o ňu bude starať. #italic Malikâne#! predáva toto doživotné právo najvyššej ponuke a vymieňa tučné každoročné dražby z minulosti za okresy, z ktorých sa bude dať vyberať daň aj o desať rokov." # todo: NEW TRANSLATION
 tur_malikane_decision.a: "Zaviesť túto reformu." # todo: NEW TRANSLATION
 malikane_available.tt: "Reforma [ShowGovernmentReformName('ottoman_malikane_tax_reform')] [Concept('government_reform','reforma vlády')|e] bude dostupná." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 tur_malikane_decision.historical_info: "Systém Malikâne zaviedol v roku 1695 nešťastný veľkovezír Elmas Mehmed Pasha. Zrejme mal dobré úmysly a chcel zlepšiť dlhodobé hospodárske zisky, no čiastočne neuspel. Stará generácia držiteľov daňových fariem kládla systému prudký odpor a štátny dohľad nad novým typom doživotných údelov bol nedostatočný. Napriek reforme štát čoskoro utrpel vojenské porážky a mal problémy vyplácať vojakov. Elmasa v roku 1697 zabili jeho vlastní muži a v roku 1703 neplatení janičiari zvrhli Mustafu II." # todo: NEW TRANSLATION
 tur_coffee_house_espionage_decision.title: "Prenikanie do kaviarní" # todo: NEW TRANSLATION
 tur_coffee_house_espionage_decision.desc: "Kaviarne, v ktorých sa stretávajú mnohí príslušníci [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')], sa príliš často stávajú útočiskom zradných pletiek a dokonca aj plánov na povstanie, najmä medzi $janissaries_advance$. Živé rozhovory pri tmavej káve a sladkých zákuskoch síce prospievajú obchodu a spoločenskému životu, no neuškodilo by rozšíriť našu špionážnu sieť a zaistiť, aby nám neušla žiadna tajná výmena názorov. " # todo: NEW TRANSLATION
 tur_coffee_house_espionage_decision.desc.entry: "Muži hovoria pri káve otvorenejšie než pri výsluchu a v kaviarňach, kde sa stretáva $burghers_estate$, sa šíria reči, ktoré by nám $janissaries_advance$ najradšej navždy zatajili. Keby sme ich zatvorili, prišli by sme o obchod aj klebety. Ak ich však naplníme vlastnými poslucháčmi, neprídeme ani o jedno." # todo: NEW TRANSLATION
 tur_coffee_house_espionage_decision.a: "Informácie sú moc." # todo: NEW TRANSLATION
 tur_coffee_house_espionage_decision.b: "Zakročme proti kaviarňam." # todo: NEW TRANSLATION
 tur_coffee_house_espionage_decision.c: "Nech káva prúdi bez prekážok." # todo: NEW TRANSLATION
 coffee_house_espionage_available.tt: "The [ShowGovernmentReformName('ottoman_coffee_house_espionage')] [Concept('government_reform','reforma vlády')|e] bude dostupný." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 tur_coffee_house_espionage_decision.historical_info: "Kaviarne v Osmanskej ríši boli rušnými miestami stretávania mužov rôznych povolaní, národností a vierovyznaní. Tureckí remeselníci sa tu mohli stretnúť s ruskými tulákmi aj benátskymi obchodníkmi. Stali sa tak fórom pre verejné debaty, nové myšlienky, umenie — a povstania. Janičiarske kaviarne ponúkali najmä možnosť nadväzovať kontakty s tajnými sieťami, ktoré sa zaoberali vraždami, informáciami a zdrojmi. Vláda do kaviarní a podobných verejných inštitúcií nasadzovala množstvo špiónov, aby získala prehľad o náladách verejnosti a prípadných plánoch na zločiny či povstania." # todo: NEW TRANSLATION
 tur_new_order_army_decision.title: "Armáda nového poriadku" # todo: NEW TRANSLATION
 tur_new_order_army_decision.desc: "Keď [target_ruler.GetName] uvažoval o sile našich súperov a nebezpečenstvách meniaceho sa sveta, no najmä o neustálej hrozbe vzbury zo strany neposlušných a skazených $janissaries_advance$, [target_ruler.GetSheHe] dostal nový nápad. [target_ruler.GetSheHe|U] chce zreformovať armádu na vysoko profesionálnu modernú silu, ktorú posilnia inštruktori z [ShowContinentName('europe')], nové uniformy, tradície a výcvik. Riskuje tým však hnev $janissaries_advance$, $bashi_bazouks$, členov $sekban_system$ a všetkých ostatných, ktorí ťažia zo súčasného stavu." # todo: NEW TRANSLATION
 tur_new_order_army_decision.desc.entry: "Prekážkou modernej armády nie sú peniaze ani inštruktori, ale armáda, ktorú už máme. Ak vedľa $janissaries_advance$ vybudujeme disciplinované vojsko, vyzbrojíme mužov, ktorým jedného dňa prikážeme janičiarov rozpustiť. Aj $bashi_bazouks$ a $sekban_system$ dokážu tento zámer odhaliť rovnako dobre ako my." # todo: NEW TRANSLATION
 tur_new_order_army_decision.a: "Túto zmenu potrebujeme." # todo: NEW TRANSLATION
 tur_new_order_army_decision.b: "Staré spôsoby nám stačia." # todo: NEW TRANSLATION

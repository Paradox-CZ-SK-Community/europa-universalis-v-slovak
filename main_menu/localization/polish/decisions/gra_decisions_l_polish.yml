l_polish:
 expand_the_alhambra.title: "Rozšíriť $alhambra$" # todo: NEW TRANSLATION
 expand_the_alhambra.desc: "Nad pahorkom Sabīka vyrastá ďalšie krídlo. Tam, kde predchádzajúce vlády postavili prvé nádvoria a veže, budujeme vlastné siene, ktorých klenby zdobí #italic muqarnaṣ#! a steny verše, aby si každý vyslanec, ktorý vystúpi k palácu, prečítal v kameni svedectvo o trvácnosti nášho rodu.\n\nCena nespočíva len v mramore, ale aj v posolstve, ktoré nesie: trón, ktorý buduje na stáročia, neočakáva svoj pád. Každé dokončené poschodie posilňuje posádku citadely a rozširuje jej záhrady a hovorí [GetCountry('CAS').GetName] aj [GetCountry('MOR').GetName], že hodláme zostať pánmi vlastného pobrežia." # todo: NEW TRANSLATION
 expand_the_alhambra.a: "Položme základy." # todo: NEW TRANSLATION
 expand_the_alhambra_construct_tt: "Začína sa rozširovanie [ShowBuildingTypeName('alhambra')]" # todo: NEW TRANSLATION

l_polish:
 spa_establish_the_council_of_castile_decision.title: "Zriadiť $royal_council_of_castile$" # todo: NEW TRANSLATION
 spa_establish_the_council_of_castile_decision.desc: "Príliš dlho bola [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')] spútaná vrtochmi drobnej [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] a neefektívnou spleťou miestnych právomocí. [ShowGovernmentReformName('royal_council_of_castile')], ktorú navrhol [target_character.GetName] a podporujú ju reformátori aj rojalisti, ponúka víziu centralizovanejšieho štátu spravovaného profesionálmi. Ak rade zveríme dohľad nad výberom daní, súdnictvom a menovaním úradníkov, budeme môcť lepšie nasmerovať zdroje [ROOT.GetCountry.GetFlavorRank] v prospech celého kráľovstva, namiesto toho, aby sme ich prenechali miestnym správcom." # todo: NEW TRANSLATION
 spa_establish_the_council_of_castile_decision.desc.entry: "Keď vládneme prostredníctvom spleti miestnych právomocí, $crown_estate$ závisí od toho, kto má v jednotlivých oblastiach práve navrch. Stály zbor vyškolených úradníkov, ktorí sa zodpovedajú iba nám — [ShowGovernmentReformName('royal_council_of_castile')] — by vyňal dane, súdnictvo a menovania z dosahu miestnych záujmov." # todo: NEW TRANSLATION
 spa_establish_the_council_of_castile_decision.a: "Nech rada dohliada na [ROOT.GetCountry.GetFlavorRank]." # todo: NEW TRANSLATION
 spa_establish_the_council_of_castile_decision.a.entry: "Nech rada dohliada na kráľovstvo." # todo: NEW TRANSLATION
 establish_the_council_of_castile_tt: "Odomkne [ShowBureaucracyTypeName('spa_council_of_castile_bureaucracy')]" # todo: NEW TRANSLATION
 established_the_council_of_castile_tt: "Rozhodnutím $spa_establish_the_council_of_castile_decision.title$ bola zriadená [ShowBureaucracyTypeName('spa_council_of_castile_bureaucracy')]." # todo: NEW TRANSLATION
 spa_establish_the_council_of_castile_decision.historical_info: "Kráľovská a najvyššia rada Kastílie bola založená koncom 15. storočia za vlády Katolíckych panovníkov, Ferdinanda II. Aragónskeho a Izabely I. Kastílskej. Rada, pôvodne stredoveký poradný orgán, sa premenila na ústredný nástroj kráľovskej moci. Slúžila na obmedzenie moci vysokej šľachty, obchádzanie miestnych privilégií a profesionalizáciu správy prostredníctvom menovania právnikov a úradníkov so vzdelaním na univerzitách, ktorí konali v záujme kráľovstva." # todo: NEW TRANSLATION

l_polish:
 ara_unite_barcelona_dynasty.title: "Zjednotenie dynastie" # todo: NEW TRANSLATION
 ara_unite_barcelona_dynasty.desc: "Keďže [ShowCultureName('sicilian')] sicílske nešpory zabezpečili trón našej dynastii, náš vplyv v [ShowRegionName('italy_region')] vzrástol. Napriek tomu si [ShowAreaName('sicily_area')] stále zachováva svoju suverenitu a drží sa bokom od našej dynastickej politiky. Namiesto toho, aby sme túto príležitosť premárnili, by sme možno mohli kontaktovať našich tamojších príbuzných, upevniť dynastické zväzky a potenciálne tak odštartovať naše ambície v [ShowRegionNameWithNoTooltip('italy_region')]." # todo: NEW TRANSLATION
 ara_unite_barcelona_dynasty.a: "Pokúsme sa zjednotiť obe koruny." # todo: NEW TRANSLATION
 ara_unite_barcelona_dynasty.b: "Budú nám slúžiť ako poddaní." # todo: NEW TRANSLATION
 ara_effects_only_take_place_if_sic_accepts_tt: "Účinky nastanú iba v prípade, že [GetCountry('SIC').GetName] súhlasí" # todo: NEW TRANSLATION
 ara_vassalize_bosnia.title: "Požadovať vazalizáciu od [GetCountry('BOS').GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 ara_vassalize_bosnia.desc: "Veľký vládca [GetCountry('BOS').GetName] sa už dlho snaží brániť suverenitu krajiny pred mocichtivými susedmi. Keďže sa nedokážu brániť sami, niekoľkí príslušníci [GetCountry('BOS').GetGovernment.GetEstateName('nobles_estate')] sa obrátili na nášho vládcu a dvor so žiadosťou, aby sme ich ochránili pred prípadnou inváziou. Radšej sa stanú našimi poddanými, než by mali padnúť do rúk pohanov — a to môžeme využiť vo svoj prospech." # todo: NEW TRANSLATION
 ara_vassalize_bosnia.a: "Je čas požiadať ich, aby sa nám podriadili." # todo: NEW TRANSLATION
 ara_ask_bosnia_for_vassalization: "Budeme požadovať, aby sa [GetCountry('BOS').GetName] podriadila" # todo: NEW TRANSLATION

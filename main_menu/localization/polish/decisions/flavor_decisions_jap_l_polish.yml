 jap_adopt_japan_identity_decision.title: "Prijať meno $JAP$" # todo: NEW TRANSLATION
 jap_adopt_japan_identity_decision.desc: "Klany sa vyčerpali vzájomnými bojmi a jeden rod sa povznesol nad ostatné. Svet nás však stále pozná pod menom tohto rodu, a nie podľa krajiny, ktorej teraz vládneme.\n\nPrijmime meno $JAP$, aby každý dvor a každá provincia vedeli, že ríša je jednotná a patrí nám." # todo: NEW TRANSLATION
 jap_adopt_japan_identity_decision.a: "Sme $JAP$." # todo: NEW TRANSLATION
 jap_adopt_japan_identity_decision.color_tt: "Prijmeme #Y červenú#! ako farbu našej krajiny" # todo: NEW TRANSLATION
 jap_adopt_japan_identity_decision.historical_info: "Tokugawa Iejasu ukončil v roku 1603 viac než storočie občianskych vojen a prijal titul šóguna, pričom vládol zjednotenému Japonsku z Eda. Pred ním Oda Nobunaga a Tojotomi Hidejoši zlomili moc súperiacich vojenských vládcov. Európski obchodníci a vyslanci tej doby vo všeobecnosti považovali šóguna za vládcu celého Japonska." # todo: NEW TRANSLATION

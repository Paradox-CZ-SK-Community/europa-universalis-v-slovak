l_polish:
 prospect_for_coal.title: "Prieskum ložísk uhlia" # todo: NEW TRANSLATION
 prospect_for_coal.desc: "Vek pary a železa poháňa uhlie a naša pôda môže ukrývať to, po čom náš priemysel tak zúfalo túži. Vynaložme politický kapitál na vyslanie tímov geológov a banských inžinierov do oblastí s uhoľnými ložiskami, aby preskúmali terén, vyhĺbili prieskumné šachty pozdĺž sľubných slojov a otvorili novú baňu tam, kde zem vydá najbohatšiu úrodu. Prieskumníci začnú v najmenej výnosných častiach našich vidieckych majetkov, kde obrábanie polí na úkor baníctva prinesie len malé straty. Nová baňa sa najprv rozbehne v malom a postupne sa rozrastie, aby zásobovala naše pece." # todo: NEW TRANSLATION
 prospect_for_coal.a: "Poveriť prieskumné tímy." # todo: NEW TRANSLATION
 prospect_for_coal_effect_tt: "[coal_prospect_location.GetName] bude teraz produkovať [ShowGoodsName('coal')], namiesto suroviny [coal_prospect_location.GetRawMaterial.GetName]" # todo: NEW TRANSLATION
 prospect_for_coal.historical_info: "Veľké uhoľné panvy Porúria, Horného Sliezska a Južného Walesu poháňali priemyselnú revolúciu a systematické hľadanie uhlia premenilo pokojné vidiecke oblasti na jedny z najhustejšie industrializovaných regiónov na svete. Geologický prieskum sa koncom 18. a začiatkom 19. storočia vyvinul na samostatnú odbornú disciplínu, keď štáty a podnikatelia súperili v hľadaní paliva, od ktorého závisel nový strojový vek." # todo: NEW TRANSLATION

l_polish:
 pol_shooting_societies_decision.title: "Strelecké spolky" # todo: NEW TRANSLATION
 pol_shooting_societies_decision.desc: "Život je často plný nebezpečenstiev a cudzích votrelcov, ktorí sa chcú zmocniť našich prosperujúcich krajín. V záujme obrany vlasti začali mnohí členovia [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')] zakladať strelecký spolok v [ShowLocationName('krakow')], ktorého cieľom je udržiavať prosperitu a vycvičiť schopnú domobranu ostrostrelcov.\n\nAko sa naše panstvo a ľud rozrastajú, nové mestečká a mestá túžia zakladať vlastné strelecké spolky, a tak mnohí ich zástupcovia začali oficiálne žiadať o podporu pri zakladaní takýchto spolkov v každom meste a mestečku." # todo: NEW TRANSLATION
 pol_shooting_societies_decision.desc.entry: "Mestskí obyvatelia, ktorí cvičia s vlastným pušným prachom a strelivom, nestoja pokladnicu nič, a predsa nastúpia, keď ich povolajú do vojska. To, čo sa začalo ako jeden spolok v [ShowLocationName('krakow')], by sa mohlo stať výsadou udelenou každému mestu, ktoré si ho bude ochotné financovať, ak budú mať $burghers_estate$ dôveru a budú im zverené zbrane." # todo: NEW TRANSLATION
 pol_shooting_societies_decision.a: "Streľba na kohúty nie je žiadny #italic žĺtok#!, vyžaduje si presnosť a zručnosť!" # todo: NEW TRANSLATION
 pol_shooting_societies_decision.b: "Ten, ktorý vznikol v [ShowLocationNameWithNoTooltip('krakow')], postačí." # todo: NEW TRANSLATION
 pol_shooting_societies_decision.historical_info: "Spolok známy ako Spoločnosť kohúta odvodzuje svoj názov v rámci bratstva od prvých streleckých súťaží. Spočiatku používali ako terče živé sliepky a kohúty, neskôr ich nahradili drevené figúrky kohútov známe ako #italic kurs#!. Táto zmena viedla k vzniku pôvodného názvu #italic Bratstvo kuraťa#!, keďže #italic kur#! v hovorovej poľštine znamená #italic kohút#!.\n\nS nástupom strelných zbraní začala byť podobnosť medzi kohútikom a hlavou kohúta nápadná. Keď sa strelci pripravovali na výstrel natiahnutím kohútika, tento úkon sa opisoval ako „natiahnutie“ zbrane, čím sa spojenie s pomenovaním podľa kohúta ešte upevnilo." # todo: NEW TRANSLATION
 pol_privilege_of_koszyce_decision.title: "Košická výsada" # todo: NEW TRANSLATION
 pol_privilege_of_koszyce_decision.desc: "[ruler_scope.GetName] oslovil [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] so žiadosťou, aby v prípade úmrtia bez mužského potomka mohla na trón nastúpiť dcéra. Pre [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')] je to skvelá príležitosť získať od [ROOT.GetCountry.GetGovernment.GetRulerTitle] ďalšie výsady, na čom sa všetci zhodnú. Vďaka takejto výsade by sa znížili dane platené [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')] a ďalšie dane by sa bez ich súhlasu nemohli zaviesť. Navyše, každý budúci [ROOT.GetCountry.GetGovernment.GetRulerTitle] by musel uhradiť náklady na svoju návštevu, čo by pre [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')] bolo nepochybne ponižujúce." # todo: NEW TRANSLATION
 pol_privilege_of_koszyce_decision.desc.entry: "Nástupníctvo dcéry na trón si vyžaduje súhlas a v tejto ríši má súhlas svoju cenu. $nobles_estate$ si ju vyčíslia v peniazoch a daňových výnimkách a každá ústupnosť, ktorú teraz udelíme, sa stane precedensom, ktorý už nijaký budúci $crown_estate$ nebude môcť odvolať." # todo: NEW TRANSLATION
 pol_privilege_of_koszyce_decision.a: "Splníme ich požiadavky." # todo: NEW TRANSLATION
 POL_may_form_union_with_lit_at_later_date: "S nadobudnutím [ShowEstatePrivilegeName('privilege_of_koszyce')] bude [ROOT.GetCountry.GetName] schopné vytvoriť úniu s [GetCountry('LIT').GetName] cez udalosť $flavor_pol.55.title$." # todo: NEW TRANSLATION
 pol_privilege_of_koszyce_decision.historical_info: "Košickú výsadu udelil šľachte Ľudovít I., panovník, ktorý vládol Uhorsku aj Poľsku v personálnej únii. Vďaka tejto výsade bolo zaistené nástupníctvo jednej z jeho dcér, no za cenu mnohých výsad pre šľachtu, čím sa Poľsko vydalo na cestu k budúcej „šľachtickej demokracii“. Nástupníctvo jeho dcéry Jadwigy viedlo k následnému sobášu s litovským veľkokniežaťom Jogailom, k personálnej únii Poľska a Litvy a napokon k vzniku Poľsko-litovského spoločenstva." # todo: NEW TRANSLATION
 pol_nihil_novi_decision.title: "Nihil Novi" # todo: NEW TRANSLATION
 pol_nihil_novi_decision.desc: "[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] predložili na nedávnom zasadnutí [ROOT.GetCountry.GetGovernment.GetParliament.GetName] nanajvýš smiešny návrh. Ich bludy o vlastnej [ROOT.GetCountry.GetGovernment.GetAdjective] spôsobilosti ich priviedli k presvedčeniu, že majú právo, aby sa o nich neprijímal nijaký zákon bez ich súhlasu. Nehorázne! Bez ich podpory však nebudeme môcť financovať ďalšie vojenské ťaženia. Musíme preto ich návrh zvážiť, nech sa zdá akokoľvek absurdný. Navyše chcú obmedziť práva mešťanov a zakázať svojim nevoľníkom voľný pohyb. Možno nám nezostane nič iné, než petícii [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')] vyhovieť." # todo: NEW TRANSLATION
 pol_nihil_novi_decision.desc.entry: "Náš parlament prerokúva petíciu, podľa ktorej by $nobles_estate$ nepodliehali nijakému zákonu, ktorý sami neschválili, a zároveň by sa ešte viac obmedzili mešťania i nevoľníci. Je to urážka, ktorá sa vydáva za žiadosť, a ak ju odmietneme, budeme musieť nájsť iný spôsob, ako financovať naše vojny." # todo: NEW TRANSLATION
 pol_nihil_novi_decision.a: "Nech si užijú svoje malicherné práva." # todo: NEW TRANSLATION
 pol_nihil_novi_decision.b: "Nechajme si to zatiaľ na pamäti." # todo: NEW TRANSLATION
 pol_nihil_novi_decision.b_tt: "Neskôr si budeme môcť zvoliť $nihil_novi$" # todo: NEW TRANSLATION
 pol_nihil_novi_decision.historical_info: "#italic Nihil novi nisi commune consensu#! je názov poľskej ústavy z roku 1505, ktorá stanovila, že bez všeobecného súhlasu šľachty nemožno prijať nijaký nový zákon. Považuje sa za začiatok šľachtickej demokracie v Poľsku a bola jedným zo základných kameňov neskoršej #italic Zlatej slobody#!." # todo: NEW TRANSLATION
 pol_rule_of_the_sejm_decision.title: "Voliteľná monarchia v Poľsku" # todo: NEW TRANSLATION
 pol_rule_of_the_sejm_decision.desc: "[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')], istí si svojimi výsadami, začali znovu vznášať starobylé nároky. Odvolávajúc sa na historické precedensy, čoraz viac príslušníkov [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')] tvrdí, že majú nescudziteľné právo vyberať nástupcov [ROOT.GetCountry.GetFlavorRank]. Hoci by sme radi takýmto absurdným nárokom odporovali, nemôžeme si nevšimnúť, že [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')] získavajú čoraz väčšiu moc na úkor [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')]. Či sa nám to páči alebo nie, budeme im musieť zveriť voľbu budúcich panovníkov." # todo: NEW TRANSLATION
 pol_rule_of_the_sejm_decision.desc.entry: "Kto vyberá panovníka, ten ovláda monarchiu. $nobles_estate$ zosilneli natoľko, že sa to odvážili vyhlásiť nahlas, a $crown_estate$ už nemá dosť síl, aby im odporoval." # todo: NEW TRANSLATION
 pol_rule_of_the_sejm_decision.a: "Dôverujeme Sejmu!" # todo: NEW TRANSLATION
 pol_rule_of_the_sejm_decision.historical_info: "Vďaka mnohým výsadám získaným v 14. a 15. storočí získala poľská šľachta právo voliť poľského panovníka. Spočiatku nikto nespochybňoval nástupníctvo jednotlivých Jagelovcov, a tak boli voľby iba formalitou. To sa zmenilo po zániku jagelovskej dynastie, keď sa v prvých voľbách musela šľachta rozhodovať medzi viacerými cudzími šľachticmi. Skutočné kráľovské voľby sa začali v roku 1573 voľbou Henricha z Valois a až do zániku Poľsko-litovského spoločenstva v 18. storočí sa panovníci vyberali spomedzi zahraničných kandidátov." # todo: NEW TRANSLATION

 STATIC_MODIFIER_DESC_bul_patron_of_bulgarias_revival: "Náš vládca je odhodlaný oživiť naše umenie, kultúru a vedy v snahe obnoviť slávne dni vlády Simeona Veľkého." # todo: NEW TRANSLATION
 STATIC_MODIFIER_NAME_bul_conqueror_of_constantinople: "Dobývateľ Konštantínopolu" # todo: NEW TRANSLATION
 STATIC_MODIFIER_DESC_bul_conqueror_of_constantinople: "Veľkí dobyvatelia minulosti, či už Krum alebo Simeon, stáli pred hradbami Konštantínopolu, no nikdy ich nevideli padnúť pod bulharskými zástavami. To, čo nedokázali dosiahnuť oni, sa teraz podarilo, a náš panovník bude zapamätaný titulom hodným tohto bezprecedentného triumfu." # todo: NEW TRANSLATION
 STATIC_MODIFIER_NAME_bul_unrecognized_imperial_title: "Neuznaný cisársky titul" # todo: NEW TRANSLATION
 STATIC_MODIFIER_DESC_bul_unrecognized_imperial_title: "Hoci je náš cisársky titul uznávaný doma, cudzie krajiny spochybňujú jeho legitimitu a vnímajú nás iba ako kráľov zahalených do vypožičanej veľkoleposti." # todo: NEW TRANSLATION
 STATIC_MODIFIER_NAME_bul_powerful_local_elites: "Mocné miestne elity" # todo: NEW TRANSLATION
 STATIC_MODIFIER_DESC_bul_powerful_local_elites: "Toto miesto je ovládané mocnými elitami, ktoré do veľkej miery jednajú nezávisle, čo podkopáva našu kontrolu nad územím i legitimitu koruny." # todo: NEW TRANSLATION
 STATIC_MODIFIER_NAME_bul_diplomatic_reintegration: "Diplomatická reintegrácia" # todo: NEW TRANSLATION
 STATIC_MODIFIER_DESC_bul_diplomatic_reintegration_desc: "Územia oddelené od Bulharska musia byť opätovne začlenené pod našu autoritu. Staré rozdelenia budú napravené diplomaticky bez potreby ďalšieho krvoproliatia." # todo: NEW TRANSLATION

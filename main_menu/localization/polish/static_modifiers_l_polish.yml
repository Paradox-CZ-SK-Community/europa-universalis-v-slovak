 STATIC_MODIFIER_NAME_orthodox_protect_the_faith_modifier: "V obrane viery" # todo: NEW TRANSLATION
 STATIC_MODIFIER_DESC_orthodox_protect_the_faith_modifier: "Výzva na vyhladenie pohanov a heretikov rovnako znie našim ľuďom ako hudba, keď prichádzajú brániť naše územia a vieru." # todo: NEW TRANSLATION
 STATIC_MODIFIER_NAME_patriarch_increase_baptism_modifier: "Hromadné krsty" # todo: NEW TRANSLATION
 STATIC_MODIFIER_DESC_patriarch_increase_baptism_modifier: "Aby sa rozšírila sláva a svetlo Kristovo, organizujú sa hromadné krsty, aby mohli byť pohania prijatí do náručia Cirkvi." # todo: NEW TRANSLATION
 STATIC_MODIFIER_NAME_patriarch_sponsors_monasteries_modifier: "Kláštory podporované patriarchom" # todo: NEW TRANSLATION
 STATIC_MODIFIER_DESC_patriarch_sponsors_monasteries_modifier: "Kristus je duša Cirkvi, ale klerici sú jej krv a svaly. Patriarcha schválil a podporil výstavbu nových kláštorov, aby sa telo Cirkvi mohlo rozrastať." # todo: NEW TRANSLATION
 STATIC_MODIFIER_NAME_patriarch_improved_relations_modifier: "Skvelá delegácia patriarchu" # todo: NEW TRANSLATION
 STATIC_MODIFIER_DESC_patriarch_improved_relations_modifier: "Delegácia patriarchu mala tak skvelé skúsenosti pri návšteve našej krajiny, že povesť o našej veľkoleposti a pohostinnosti sa už šíri." # todo: NEW TRANSLATION
 STATIC_MODIFIER_NAME_patriarch_rally_population_modifier: "Náboženské nadšenie" # todo: NEW TRANSLATION
 STATIC_MODIFIER_DESC_patriarch_rally_population_modifier: "Sme služobníci Krista a Jeho Cirkvi. Naši ľudia sú pripravení brániť ju proti každému nepriateľovi vďaka povzbudeniu od delegácie patriarchu." # todo: NEW TRANSLATION
 STATIC_MODIFIER_NAME_patriarch_peace_modifier: "Pokojné rozjímanie" # todo: NEW TRANSLATION
 STATIC_MODIFIER_DESC_patriarch_peace_modifier: "Delegácia patriarchu pripomenula našim ľuďom posolstvo pokoja, ktoré poslal Kristus, a povzbudila k rozjímaniu nad týmito slovami." # todo: NEW TRANSLATION

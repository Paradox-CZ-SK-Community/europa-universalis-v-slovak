l_polish:
 anr_manual_digest_policy: "Manuálny digest" # todo: NEW TRANSLATION
 anr_manual_digest_policy_desc: "Systematický právny súhrn, ktorý zostavili právnici spolukniežatstva, kodifikuje andorrské obyčajové právo, poskytuje jasné precedensy pre súdy v údoliach a upevňuje trvalé právne tradície krajiny." # todo: NEW TRANSLATION
 anr_pareatges: "Pareatges" # todo: NEW TRANSLATION
 anr_pareatges_desc: "Zakladateľská listina spolukniežatstva rozdeľuje zvrchovanosť medzi dvoch pánov, vymedzuje právny základ andorrskej vlády a povinnosti každého z vrchných pánov voči krajine a jej obyvateľom." # todo: NEW TRANSLATION
 anr_pareatges_honored_policy: "Listina dodržiavaná" # todo: NEW TRANSLATION
 anr_pareatges_honored_policy_desc: "Pareatges sa v plnej miere dodržiavajú, obaja vrchní páni sú uznaní a ich príslušné práva rešpektované — starostlivá rovnováha, ktorá zachováva andorrskú autonómiu a udržiava stabilné vonkajšie vzťahy krajiny." # todo: NEW TRANSLATION
 anr_pareatges_reinforced_policy: "Listina upevnená" # todo: NEW TRANSLATION
 anr_pareatges_reinforced_policy_desc: "Ústavný rámec spolukniežatstva sa ďalej upevňuje, právne štruktúry sa prehlbujú a miestna správa získava pevnejšie základy — dosah vrchných pánov sa obmedzuje, no vnútorný poriadok krajiny tým silnie." # todo: NEW TRANSLATION
 bayaa_shura_council_policy: "Rada šúry" # todo: NEW TRANSLATION
 bayaa_shura_council_policy_desc: "#italic bay'a#! sa uskutočňuje prostredníctvom formálnej poradnej rady právnikov a šľachticov, ktorej rokovania dodávajú nástupníctvu váhu islamského učeneckého konsenzu. Ich spoločné potvrdenie ukotvuje legitimitu panovníka v náboženských a aristokratických tradíciách krajiny." # todo: NEW TRANSLATION
 bayaa_succession_law: "Nástupníctvo prostredníctvom bay'a" # todo: NEW TRANSLATION
 bayaa_succession_law_desc: "#italic bay'a#! je prísaha vernosti, ktorou poprední muži krajiny — šľachtici, učenci a kmeňoví náčelníci tvoriaci #italic ahl al-ḥall wa'l-'aqd#! — potvrdzujú právo nového panovníka vládnuť. Tento zákon určuje spôsob, akým sa toto potvrdenie uskutočňuje, a čí hlas má v nástupníckej rade najväčšiu váhu." # todo: NEW TRANSLATION
 bayaa_tribal_assembly_policy: "Kmeňové zhromaždenie" # todo: NEW TRANSLATION
 bayaa_tribal_assembly_policy_desc: "#italic bay'a#! potvrdzuje veľké zhromaždenie kmeňových náčelníkov, ktorých spoločná prísaha zaväzuje popredné klany uznávať autoritu nového panovníka a zaisťuje ich spoluprácu aj v odľahlých končinách krajiny. Toto kmeňové potvrdenie široko rozdeľuje politickú legitimitu, zároveň však posilňuje moc konfederácie na úkor ústrednej vlády." # todo: NEW TRANSLATION
 bled_makhzen_siba_law: "Bled el-Maḵzan a Bled es-Siba" # todo: NEW TRANSLATION
 bled_makhzen_siba_law_desc: "Marocký sultanát nikdy nespravoval celé svoje územie prostredníctvom priamej správy. #italic bled el-maḵzan#! — krajina vlády — je usadená oblasť, kde kráľovskí úradníci vyberajú dane a udržiavajú poriadok, zatiaľ čo #italic bled es-siba#! — krajina odporu — je kmeňové zázemie, ktoré uznáva duchovnú autoritu sultána, no bráni sa jeho daňovému dosahu. Tento zákon určuje, kde leží rovnováha." # todo: NEW TRANSLATION
 cas_alcabala_policy: "Alcabala" # todo: NEW TRANSLATION
 cas_alcabala_policy_desc: "Kráľovská daň z predaja, uvalená na všetky obchodné transakcie, plní pokladnicu za cenu nevôle kupcov — ide o širokú daň, ktorá zasahuje každú obchodnú dohodu na trhu aj každý náklad predaný v prístave." # todo: NEW TRANSLATION
 unlocks_cas_alcabala_tax: "Odomkne [Concept('government_reform','reforma vlády')|e] [ShowGovernmentReformName('cas_alcabala_tax')]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 cas_encabezamiento_policy: "Encabezamiento" # todo: NEW TRANSLATION
 cas_encabezamiento_policy_desc: "Mestá a mestečká vyjednávajú pevne stanovené ročné sumy namiesto platenia celej #italic alcabala#!, čím kupcom poskytujú väčšiu predvídateľnosť a miestnym zhromaždeniam umožňujú spravovať vlastné fiškálne záležitosti v rámci dohodnutého limitu." # todo: NEW TRANSLATION
 cas_fiscal_law: "Kastílsky fiškálny systém" # todo: NEW TRANSLATION
 cas_fiscal_law_desc: "Rámec, ktorým koruna získava príjmy od svojich poddaných, utvára rovnováhu medzi kráľovskou pokladnicou a prosperitou kupcov a vlastníkov pôdy." # todo: NEW TRANSLATION
 cat_constitucions_de_catalunya_policy: "Constitucions de Catalunya" # todo: NEW TRANSLATION
 cat_constitucions_de_catalunya_policy_desc: "Ústavný rámec Katalánska zaväzuje korunu rešpektovať zákony a slobody svojich poddaných — bez súhlasu #italic Corts#! nemožno prijať žiadny nový zákon a hlas parlamentu má váhu stáročí precedensov." # todo: NEW TRANSLATION
 centralized_makhzen_policy: "Centralizovaný Maḵzan" # todo: NEW TRANSLATION
 centralized_makhzen_policy_desc: "Sultán rozširuje priamu kráľovskú správu, vysiela quwwād a vyberačov daní hlboko do kmeňového zázemia a podriaďuje miestne zvyklosti autorite trónu. Pokladnica bohatne, no kmeňové konfederácie sa búria proti povinnostiam, ktoré považujú za porušenie tradičnej autonómie." # todo: NEW TRANSLATION
 dhimmi_persecution_policy: "Obmedzenie dhimmi" # todo: NEW TRANSLATION
 dhimmi_persecution_policy_desc: "Na nemoslimské komunity sa vyvíja nátlak, aby konvertovali alebo odišli, čím sa krajina zbavuje nábožensky odlišných poddaných a posilňuje sa vplyv viery na celom území." # todo: NEW TRANSLATION
 dhimmi_regulations_law: "Postavenie dhimmi" # todo: NEW TRANSLATION
 dhimmi_regulations_law_desc: "Právne postavenie nemoslimských poddaných pod islamskou vládou ovplyvňuje spolužitie komunít aj spôsob, akým rozmanité národy krajiny prispievajú k jej prosperite." # todo: NEW TRANSLATION
 dhimmi_status_policy: "Chránené komunity dhimmi" # todo: NEW TRANSLATION
 dhimmi_status_policy_desc: "Nemoslimským poddaným sa podľa islamského práva poskytuje formálna ochrana a výmenou za slobodu vierovyznania platia #italic jizya#!. Ich obchod obohacuje trhy krajiny, no zároveň spomaľuje náboženské konverzie." # todo: NEW TRANSLATION
 fuero_juzgo_policy: "Fuero Juzgo" # todo: NEW TRANSLATION
 fuero_juzgo_policy_desc: "Staroveký vizigótsky zákonník, zachovaný a prispôsobený počas stáročí reconquisty, zostáva základom spravodlivosti v našej krajine — zaväzuje šľachticov jeho precedensmi a v očiach cirkvi i ľudu legitimizuje našu vládu." # todo: NEW TRANSLATION
 limpieza_de_sangre_law: "Limpieza de Sangre" # todo: NEW TRANSLATION
 limpieza_de_sangre_law_desc: "Zákony o čistote krvi určujú, kto môže zastávať úrad, vstúpiť do rehole alebo si nárokovať šľachtický pôvod, a vytvárajú právnu hranicu medzi starými kresťanmi a ľuďmi židovského, maurského či iného pôvodu." # todo: NEW TRANSLATION
 limpieza_mainstream_enforcement_policy: "Bežné uplatňovanie" # todo: NEW TRANSLATION
 limpieza_mainstream_enforcement_policy_desc: "Požiadavky #italic limpieza#! sa presadzujú prostredníctvom zavedených inštitúcií a postup v hodnosti si vyžaduje genealogické preverovanie — dostatočne účinne na zachovanie systému, no bez plnej prísnosti striktného výkladu." # todo: NEW TRANSLATION
 limpieza_relaxed_enforcement_policy: "Miernejšie uplatňovanie" # todo: NEW TRANSLATION
 limpieza_relaxed_enforcement_policy_desc: "Rastúci tlak reformátorov a praktické potreby obchodu vedú k uvoľneniu presadzovania čistoty krvi, vďaka čomu talent a majetok zavážia viac než genealogické preverovanie." # todo: NEW TRANSLATION
 limpieza_strict_enforcement_policy: "Prísne uplatňovanie" # todo: NEW TRANSLATION
 limpieza_strict_enforcement_policy_desc: "Preverovanie čistoty krvi sa vykonáva dôsledne a conversos a moriscos sú vylúčení z verejných úradov, cirkvi aj vojenských rádov. Tieto zákony pevne podrobujú inštitúcie krajiny nárokom na vieru predkov." # todo: NEW TRANSLATION
 mll_dret_civil_policy: "Dret Civil de Mallorca" # todo: NEW TRANSLATION
 mll_dret_civil_policy_desc: "Mallorská tradícia občianskeho práva, založená na rímskej praxi a katalánskej listine, presne upravuje majetok, zmluvy a dedičstvo, čím podporuje obchod a zachováva osobitú identitu našich poddaných." # todo: NEW TRANSLATION
 nav_fueros_policy: "Navarrské fueros" # todo: NEW TRANSLATION
 nav_fueros_policy_desc: "Staroveké listiny Navarry zaručujú práva a zvyklosti jej obyvateľov pred zásahmi koruny a každý nový panovník prisahá, že bude dodržiavať #italic fueros#!, skôr než sa naňho začnú vzťahovať zákony kráľovstva." # todo: NEW TRANSLATION
 negotiated_authority_policy: "Dohodnutá autorita" # todo: NEW TRANSLATION
 negotiated_authority_policy_desc: "Sultán vládne prostredníctvom dohôd a uznávania, nie priameho donucovania: uznáva autonómiu kmeňových konfederácií výmenou za formálnu podriadenosť a neoficiálnu vojenskú spoluprácu. Príjmy prúdia do pokladnice pomalšie, no krajina drží pohromade bez neustálych treníc spôsobených vynucovanou poslušnosťou." # todo: NEW TRANSLATION
 gra_learning_haven: "Útočisko vzdelanosti pre všetkých" # todo: NEW TRANSLATION
 gra_learning_haven_desc: "Namiesto obmedzovania vzdelania podľa náboženskej príslušnosti, kultúrnych názorov či podobných hľadísk budeme podporovať skutočne učenú spoločnosť, ktorá umožní nové vedecké objavy." # todo: NEW TRANSLATION
 ara_italian_dual_court: "Dvojitý dvor v [ShowRegionNameWithNoTooltip('italy_region')]" # todo: NEW TRANSLATION
 ara_italian_dual_court_desc: "Zriadením dvoch dvorov v našej krajine môžeme spravovať obe jej časti bez toho, aby sme sa museli spoliehať na miestnu šľachtu." # todo: NEW TRANSLATION
 unlock_italian_court_tt: "Odomkne [Concept('building','budova')|e] [ShowBuildingTypeName('italian_court_building')]" # todo: NEW TRANSLATION # todo: CONCEPT CASE

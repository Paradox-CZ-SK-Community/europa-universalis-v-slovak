l_polish:
 seven_cities_caesars.1.title: "Pyrit a kremeň" # todo: NEW TRANSLATION
 seven_cities_caesars.1.desc: "Päť mesiacov po príchode do Patagónie dorazila výprava do údolia, ktoré preživší z potopenej galeóny opísali sudcovi v Buenos Aires. Niet tu nijakého mesta. Sú tu len opustené chatrče, možno generáciu staré, ktoré postavili pastieri alebo lovci. Koryto potoka sa presvedčivo trblieta, no skúšač rúd si vzorky prezrie a hneď určí, že ide o mačacie zlato a biely kremeň. V údolí je slušná zásoba guanaka a takmer nič iné. [target_leader.GetName] píše správu v závetrí čadičového útesu, kým už tretí deň fúka vietor." # todo: NEW TRANSLATION
 seven_cities_caesars.1.a: "Buď nám klamali, alebo klamú. Zložte zástavu, vraciame sa." # todo: NEW TRANSLATION
 seven_cities_caesars.1.historical_info: "Legenda o Meste Cézarov, španielsky hovoriacom sídle, ktoré založili preživší stroskotania lode na patagónskom pobreží v šestnástom storočí a údajne ukryli vo vnútrozemí, mala dôveru španielskej koruny až do osemnásteho storočia. V rokoch 1530 až 1750 vyslali na jeho hľadanie najmenej sedem výprav. Ani jedna nič nenašla. Legenda pretrvávala sčasti preto, že Patagónia sa v tom čase skutočne ťažko mapovala, sčasti preto, že sa preživší stroskotancov občas znovu objavili s podrobnými príbehmi, ktorými vysvetľovali svoju dlhú neprítomnosť, a sčasti preto, že koloniálne úrady mali sklon konať na základe uveriteľných chýrov, namiesto toho, aby ich ignorovali." # todo: NEW TRANSLATION
 seven_cities_caesars.2.title: "Strieborný prúd v chladnej krajine" # todo: NEW TRANSLATION
 seven_cities_caesars.2.desc: "Krajina, do ktorej sme vstúpili, je drsnejšia, než opisovali preživší, a chudobnejšia, než sľubovali, no nie je úplne bezcenná. V dvoch údoliach, ktorými sme prešli, sú potoky so striebornou rudou. Mapučskí obchodníci, s ktorými sa výprava skontaktovala minulý týždeň, niesli drobné výrobky zo striebra a tvrdia, že pochádzajú z podhoria ďalej na západ. Krajina, ak nie mesto, je skutočná. Obchod možno rozbehnúť. Druhé Potosí tu nebude, ale niečo tu predsa len bude. [target_leader.GetName] nariaďuje postaviť opevnenú obchodnú stanicu tam, kam výprava dorazila." # todo: NEW TRANSLATION
 seven_cities_caesars.2.a: "Postavte stanicu. Skromné patagónske striebro ju zaplatí." # todo: NEW TRANSLATION
 seven_cities_caesars.2.historical_info: "V Patagónii sa v skromnom obchodnom množstve ťažilo striebro v niekoľkých malých baniach otvorených v neskorom koloniálnom období, predovšetkým na území dnešnej argentínskej provincie Río Negro a pozdĺž východného úbočia Ánd. Hospodársky význam týchto baní bol vždy obmedzený v porovnaní s veľkým andským strieborným hospodárstvom na severe, no stačili na to, aby podporili sieť španielskych a neskôr argentínskych obchodných staníc, ktoré postupne nahradili obchodnú sieť Mapučov, cez ktorú prebiehal obchod v období po objavení." # todo: NEW TRANSLATION
 seven_cities_caesars.3.title: "Cézarovci nájdení" # todo: NEW TRANSLATION
 seven_cities_caesars.3.desc: "Krajina, ktorú opisovali preživší, je skutočná, a v nej je aj mesto, o ktorom rozprávali. Medzi dvoma horami, na dne skrytého údolia, leží sídlo s asi dvetisíc obyvateľmi: oblečením španielske, jazykom španielske, hoci s nezvyčajnými posunmi samohlások po dvoch generáciách, a vierou španielske, hoci ich kňaz je starý muž bez nástupcu. Už šesťdesiat rokov tu žijú z kukurice, ktorú ich ženy pestujú na dne údolia, a zo striebra, ktoré ryžujú z potokov. Nečakali, že ich niekto nájde. Kronikár píše celú noc. [target_leader.GetName] za úsvitu žiada o posily." # todo: NEW TRANSLATION
 seven_cities_caesars.3.a: "Stratených poddaných koruny sme našli. Údolie je naše." # todo: NEW TRANSLATION
 seven_cities_caesars.3.historical_info: "V historických záznamoch sa občas objavia skryté španielsky hovoriace skupiny potomkov preživších stroskotancov. Najznámejším prípadom je Gonzalo Guerrero medzi Maymi, ich počet je však vždy malý a ich sídla nie sú stratenými mestami z legiend. Patagónska verzia legendy, samotné Mesto Cézarov, sa nikdy nepotvrdila. Údolie, v ktorom malo byť ukryté, bolo od konca devätnásteho storočia mnohokrát zmapované a podľa všeobecného názoru kartografov a prospektorov, ktorí ho skúmali, v ňom nie je nič." # todo: NEW TRANSLATION

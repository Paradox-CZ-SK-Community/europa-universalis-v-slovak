 seven_cities_sierra.1.title: "Hora Bieleho kráľa" # todo: NEW TRANSLATION
 seven_cities_sierra.1.desc: "Po ôsmich mesiacoch v Chacu dorazila výprava k úpätiu hôr, ktoré sprievodcovia z kmeňa Guaraní opisovali ako krajinu striebornej hory. Krajina je nehostinná, rozbrázdená soľnými panvami a vyschnutými korytami riek; úpätia, keď k nim dorazili, tvorí holá červená skala a potoky, ktoré z nich stekajú, nenesú nijaké striebro. Sprievodcovia po naliehaní priznajú, že ich rada Guaraníov vyslala, aby viedli výpravu čo najďalej od svojho územia v nádeji, že sa už nevráti. [target_leader.GetName] dvoch z nich obesí a ostatných prepustí. Cesta späť bude hladná." # todo: NEW TRANSLATION
 seven_cities_sierra.1.a: "Otočte výpravu. Strieborná hora je len guaraníjská poviedka." # todo: NEW TRANSLATION
 seven_cities_sierra.1.historical_info: "Španielska koruna väčšinu 16. storočia verila legende o Sierra de la Plata, striebornej hore v srdci vnútrozemia Južnej Ameriky. Bola hlavným dôvodom založenia Asunciónu, ktorý mal slúžiť ako základňa výpravy na dobytie striebornej krajiny. Skutočné striebro južných Ánd sa napokon našlo ďalej na západ, v Potosí, a dosiahlo sa k nemu úplne inou cestou; krajina riek a trávnatých plání medzi Asunciónom a Andami sa ukázala byť taká chudobná, ako prví objavitelia dúfali, že bude bohatá." # todo: NEW TRANSLATION
 seven_cities_sierra.2.title: "Striebro v podhorí" # todo: NEW TRANSLATION
 seven_cities_sierra.2.desc: "Krajina, do ktorej sme dorazili, je krajinou striebra, hoci nie v takom zázračnom rozsahu, aký sľubovala legenda. V dvoch údoliach v podhorí, ktoré sme preskúmali, sú činné strieborné bane. Prevádzkujú ich miestne komunity pod vedením náčelníka, ktorý je ochotný prijať španielske vyslanectvo. V porovnaní s Andami je ich výnos skromný. No táto krajina skutočne existuje, bane sú skutočné a obchod možno otvoriť za podmienok, ktoré si nevyžadujú úplnú vojenskú okupáciu. [target_leader.GetName] vyjedná obchodnú dohodu a symbolický poplatok." # todo: NEW TRANSLATION
 seven_cities_sierra.2.a: "Podpíšte dohodu. Aj skromné, no stabilné množstvo striebra má cenu." # todo: NEW TRANSLATION
 seven_cities_sierra.2.historical_info: "Na východných svahoch centrálnych Ánd sa nachádzajú ložiská striebra využívané na obchod, hoci sú oveľa menšie než v pohorí Potosí ďalej na západ. Koncom 16. storočia vznikli malé španielske banské prevádzky na území dnešnej severnej Argentíny a južnej Bolívie, zvyčajne v rámci systému encomienda a za účasti miestnych obyvateľov Diaguita a Chicha. Legendárna Sierra de la Plata, celá hora zo striebra, sa nikdy nenašla, pretože nikdy neexistovala; skutočná geologická štruktúra andského strieborného hospodárstva tvorila sieť menších ložísk, z ktorých jedine Potosí bolo dosť veľké na to, aby sa samo stalo legendou." # todo: NEW TRANSLATION
 seven_cities_sierra.3.title: "Hora striebra" # todo: NEW TRANSLATION
 seven_cities_sierra.3.desc: "Krajina z legendy je skutočná a výprava ju našla. Je tu hora, rozlomená na troch miestach, so striebornou rudou na povrchu v žilách hrubých ako dlaň. Skúšač rudy hlási vyšší obsah striebra než čokoľvek, čo sa v Západnej Indii dosiaľ zaznamenalo. Vládcovia Chicha, ktorí ovládajú úpätia, sú ochotní prijať vyslanectvo; zaujímajú ich železné nástroje a španielske kone, nie podmanenie. Zmluvu možno vyjednať. Hora je nám otvorená. [target_leader.GetName] vysiela k pobrežiu troch jazdcov so vzorkami zapečatenými v olovených schránkach. Korunu nebude treba dlho presviedčať." # todo: NEW TRANSLATION
 seven_cities_sierra.3.a: "Podpíšte zmluvu. Postavte cestu. Horu sme našli." # todo: NEW TRANSLATION
 seven_cities_sierra.3.historical_info: "Strieborná hora Potosí, skutočná hora, s ktorou sa legenda o Sierra de la Plata neskôr stotožnila, nebola objavená španielskou výpravou pátrajúcou po legende. V roku 1545 ju objavil domorodý baník, ktorého meno sa v prameňoch uvádza v rôznych podobách, a jej existenciu oznámil španielskym úradom v Cuzcu. Takmer dve storočia sa z hory ťažilo viac striebra než z ktoréhokoľvek iného miesta na svete a stala sa motorom drahých kovov raného novovekého svetového hospodárstva. V tomto zmysle bola legenda pravdivá; iba zemepis mala trochu pomýlený." # todo: NEW TRANSLATION
 seven_cities_sierra.10.title: "Striebro zo západu" # todo: NEW TRANSLATION
 seven_cities_sierra.10.desc: "Pred rokmi ho vyhlásili za mŕtveho, keď zmizol pri plavbe, ktorá sa skončila na skalách ďaleko na juhu. Dnes ráno však stojí pri bráne a pýta sa na výpravu po mene. V pästi zviera zauzlenú šatku a v nej striebro: sponu a dve sploštené koráliky z tepaného kovu, ktoré sa, ako vraví [target_character.GetName], podávali z ruky do ruky z krajiny hlboko vo vnútrozemí, kde Biely kráľ vládne striebornou horou. Muž nevie napísať ani vlastné meno a dosiaľ sa nikdy nemýlil v tom, kde leží pobrežie. Skúšač hryzne do korálikov, odváži ich a bez slova mu ich vráti." # todo: NEW TRANSLATION
 seven_cities_sierra.10.a: "Nasledujte jeho cestu. Najmite ho ako sprievodcu." # todo: NEW TRANSLATION
 seven_cities_sierra.10.b: "Kúpte všetko, čo má pri sebe, aj jeho mlčanie." # todo: NEW TRANSLATION
 plata_castaway_road_tt: "[target_character.GetName] sa pridá k výprave a zakreslí nám do máp svoju cestu do vnútrozemia" # todo: NEW TRANSLATION
 plata_silver_in_hand_tt: "Striebro stroskotanca sa pridá ku koristi výpravy" # todo: NEW TRANSLATION
 seven_cities_sierra.10.historical_info: "Aleixo Garcia, portugalský námorník, ktorý v roku 1516 stroskotal na ostrove Santa Catarina spolu s preživšími zo Solísovej výpravy, sa od svojich guaraníjských hostiteľov dopočul o Bielom kráľovi v západných horách, ktorý vládne krajine striebra. Okolo roku 1524 sa vydal za touto správou do vnútrozemia a ako prvý Európan sa dotkol bohatstva Ánd. Vrátil sa so striebrom ulúpeným na hraniciach ríše Inkov, roky predtým, než Pizarro vôbec uvidel Peru. Garciu na ceste späť zabili, no jeho striebro putovalo ďalej: niekoľko kúskov dorazilo k pobrežiu a dostalo sa do rúk posádok Sebastiána Cabota. Presvedčilo ho, aby zanechal plavbu na Moluky a vydal sa hore riekou, ktorú premenoval na Río de la Plata, teda rieku striebra, hoci nikdy nijaké striebro neniesla." # todo: NEW TRANSLATION
 seven_cities_sierra.11.title: "Zástup bez zástav" # todo: NEW TRANSLATION
 seven_cities_sierra.11.desc: "Rada rokuje dlho do noci a ráno prichádza cez tlmočníkov ponuka: obyvatelia riečnych krajov vytiahnu s nami proti krajine Bieleho kráľa. Nie ako sprievodcovia ani nosiči, ale ako vojsko, tisíce bojovníkov silné, a každý má svoje dôvody. Ich starí otcovia podnikali výpravy do hôr ešte predtým, než ktokoľvek z nás prekročil oceán, a pamätajú si cesty i brody v krajine smädu medzi nami a cieľom. Dôstojníci sa nevedia zhodnúť. Taký veľký zástup na ceste nevyhladne, vraví jeden. Taký veľký zástup, namieta druhý, nemôže doraziť inak než ako vojsko." # todo: NEW TRANSLATION
 seven_cities_sierra.11.a: "Prijmite ich. Nikto neprejde krajinou smädu sám." # todo: NEW TRANSLATION
 seven_cities_sierra.11.b: "Odmietnite a ponúknite dary. Malé skupiny prejdú tam, kde vojská útočia." # todo: NEW TRANSLATION
 seven_cities_sierra.11.historical_info: "Keď sa Aleixo Garcia okolo roku 1524 vydal na západ, necestoval ako objaviteľ s nosičmi: pochodoval s guaraníjským vojenským zástupom, ktorý sa počtom rátal na tisíce. Pridal sa k výprave, ktorú Guaraníovia podnikali z vlastných dôvodov proti hraniciam ríše Inkov. Spojené sily prekročili Chaco, krajinu smädu, ktorej sa Španieli neskôr naučili báť, a prenikli tak hlboko k výspám ríše, že Inkovia potom hranicu opevnili. Európske dejiny zaznamenali nájazd ako objaviteľskú výpravu. Z pohľadu Guaraníov sa k vojne, ktorú aj tak viedli, smel pridať cudzí námorník s bradou." # todo: NEW TRANSLATION
 seven_cities_sierra.12.title: "Hranica Bieleho kráľa" # todo: NEW TRANSLATION
 seven_cities_sierra.12.desc: "Konečne sa pred nami týči úpätie hôr, modré a obrovské. Dediny pod ním vydávajú svedectvo: pri hrdlách a zápästiach sa leskne tepané striebro, jemnejšie než čokoľvek, čo sme dosiaľ videli na pobreží. Nad dedinami sa priesmyky dvíhajú ku krajine, odkiaľ striebro pochádza, no keď príde reč na tú krajinu, hlasy stíchnu. Vládcovia hôr strážia priesmyky, vravia dedinčania. Sledujú, kto nimi stúpa. Nepočuli sme však, že by sledovali, kto sa vracia." # todo: NEW TRANSLATION
 seven_cities_sierra.12.desc_castaway: "Značky stroskotanca na ceste sa skončili. Priznáva, že toto údolie je najďalej, kam sa kedy dostal, a stojí tam, kde sa chodník stáča do priesmykov. Striebro, ktoré niesol, mu vraj vymenili práve tu, na tomto mieste, za predmety prinesené z hôr nad nami. Za týmto bodom sa jeho zemepisná znalosť rovná klebetám kohokoľvek iného. Je dosť čestný, aby to povedal nahlas, a mužom sa to odpúšťa ťažšie než lož. Z jeho cesty nám zostal len smer, ktorým ukazuje: nahor." # todo: NEW TRANSLATION
 seven_cities_sierra.12.a: "Do priesmykov. Hora je na dosah." # todo: NEW TRANSLATION
 seven_cities_sierra.12.b: "Obchodujte na úpätí hory. Aj trpezlivosť prináša striebro." # todo: NEW TRANSLATION
 plata_silver_seized: "#Y Návrat z nájazdu do pohraničných údolí je bohatý na tepané striebro#!" # todo: NEW TRANSLATION
 plata_host_shields_the_raid: "#Y Zástup našich spojencov kryje nájazd a vracia sa bohatý na tepané striebro#!" # todo: NEW TRANSLATION
 plata_frontier_rises: "#Y Priesmyky sa pred nami vyprázdnia a potom hory odpovedia silou#!" # todo: NEW TRANSLATION
 seven_cities_sierra.12.historical_info: "Hranica Inkov nebola čiarou na mape, ale pásmom s posádkami — a tie odpovedali. Okolo roku 1525 bol zástup Aleixa Garciu na ceste späť rozprášený a Garciu zabili spolu s väčšinou jeho mužov. Juan de Ayolas zopakoval tento scenár v roku 1537: prekročil Chaco, dorazil do krajiny striebra, naložil výpravu korisťou a na spiatočnej ceste ho pri Candelarii prepadli a zničili aj s celou skupinou, keďže zmeškal stretnutie s loďami. Striebro bolo skutočné a hora tiež, no tridsať rokov viedla každá cesta k nej cez územie niekoho, kto ho opevňoval už od prvého nájazdu. Keď Španieli v roku 1545 napokon ovládli Potosí, dostali sa k nemu z opačnej strany." # todo: NEW TRANSLATION
 seven_cities_sierra.13.title: "Sladké more" # todo: NEW TRANSLATION
 seven_cities_sierra.13.desc: "Deň cesty od pevniny sa voda zmení. Hĺbkomer ju ochutná, vypľuje a ochutná znovu. Privolajú správcu zásob vody, potom lodivodov, a do hodiny si už na celej lodi šepkajú: more zosladlo. Nijaká rieka známa svetu nevyplavuje svoju vodu tak ďaleko od pevniny. Lodivodi sa dohadujú, aká krajina môže napájať také ústie, a muži sa nakláňajú cez zábradlie, hľadia na západ do prázdna a pijú vodu z oceánu zovretú v dlaniach, lebo je zadarmo." # todo: NEW TRANSLATION
 seven_cities_sierra.13.desc_castaway: "Dnes ráno zosladla voda pod kýlom, a kým sa lodivodi ešte dohadovali, čo to znamená, stroskotanec vyšiel na palubu, ochutnal vodu z dlane a prikývol tak, ako prikyvuje človek pri pohľade na vlastnú bránu. Toto je voda z rieky, vraví. Kedysi po nej zišiel dolu so striebrom pod košeľou. Niekde za západným oparom sa rieka zužuje a začína cesta k bielemu kráľovi." # todo: NEW TRANSLATION
 seven_cities_sierra.13.a: "V správach ju pomenujte: Rieka striebra." # todo: NEW TRANSLATION
 seven_cities_sierra.13.b: "Zamerajte ústie a zakreslite ho do mapy, až potom čokoľvek pomenujeme." # todo: NEW TRANSLATION
 seven_cities_sierra.13.historical_info: "Juan Díaz de Solís vplával do veľkého ústia v roku 1516 a nazval ho Mar Dulce, Sladké more, podľa sladkej vody, s ktorou sa jeho lode stretli ďaleko od pobrežia. Pri pokuse o prvé vylodenie ho zabili obyvatelia severného brehu. Medzi preživšími z jeho výpravy, ktorí stroskotali pri návrate na ostrove Santa Catarina, bol aj Aleixo Garcia. Jeho striebro neskôr podnietilo každú výpravu v tejto časti sveta, aby sa vydala do vnútrozemia. Koncom 20. rokov 16. storočia premenoval Sebastián Caboto túto vodu na Río de la Plata, rieku striebra, na základe týchto príbehov. Striebro z Ánd sa za jeho života touto riekou nikdy nedostalo, ale názov sa ujal a časom ho prevzala celá krajina pri ústí: Argentina, krajina striebra." # todo: NEW TRANSLATION

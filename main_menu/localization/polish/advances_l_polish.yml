 northern_center_of_arts: "Severné centrum umenia" # todo: NEW TRANSLATION
 northern_center_of_arts_desc: "$novgorod$ je dôležitým kultúrnym centrom v $europe$. Pleskotné príbehy hovoria o našom písomnom a intelektuálnom obyvateľstve, zložitej náboženskej výtvarnosti a veľkolepej architektúre, čo zvyšuje prestíž nášho rozkvitajúceho mesta a celej krajiny." # todo: CHANGED
 city_of_churches: "Mesto kostolov" # todo: NEW TRANSLATION
 city_of_churches_desc: "V $novgorod$ je viac než osemdesiat $orthodox_ADJ$ kostolov, z ktorých niektoré sú najväčšími pozemnými držiteľmi v kniežatstve. Ich bohatstvo a náboženské postavenie umožňujú Cirkvi výrazne ovplyvňovať populáciu a naši občania sú v dôsledku toho zbožnejší — v dobrom slova zmysle." # todo: CHANGED
 novgorodian_fur_trade: "Novgorodský obchod s kožušinami" # todo: NEW TRANSLATION
 novgorodian_fur_trade_desc: "$fur$, hodvábne zlato $RUS$! Kým iné štáty získavajú bohatstvo obchodovaním s $goods_gold$ a inými vzácnymi kovmi, naším zdrojom príjmov sú kvalitné $fur$, ktoré domovina poskytuje." # todo: CHANGED
 grand_dukes_army: "Armáda veľkokniežaťa" # todo: NEW TRANSLATION
 grand_dukes_army_desc: "Vedenie vojsk je najdôležitejšou povinnosťou veľkovojvodu, ktorého vymenovala Veče republika. Pod takým silným a skúseným vedením sa naše armády stanú oveľa smrteľnejšími v boji." # todo: CHANGED
 ushkuiniks: "Ushkuynici" # todo: NEW TRANSLATION
 ushkuiniks_desc: "Vikingskému podobní #italic Ushkuynik#! piráti boli kedysi užitočným nástrojom na potláčanie konkurencie. Bohužiaľ, boli sme prinútení prestať ich využívať kvôli zásahu cudzích mocností, najmä Moskvy. Mali by sme ich opäť financovať a posielať lupiť ďalšie pobrežia — to ukáže každému, kto sú praví majstri severu!" # todo: CHANGED
 baltic_shipyard: "Baltská lodenica" # todo: NEW TRANSLATION
 baltic_shipyard_desc: "Postavíme veľký strojársky prístav na východnom pobreží Baltského mora a budeme dominovať zámorskému obchodu!" # todo: CHANGED
 veche_advance: "Veče" # todo: NEW TRANSLATION
 veche_advance_desc: "$veche_advance$ je populárne zhromaždenie s koreňmi v pradávnych kmeňových radách, ktoré existovali dávno pred časmi Rus'. Je najvyššou súdnou a legislatívnou autoritou štátu." # todo: CHANGED
 birch_bark_manuscript: "Brezová kôra ako rukopisy" # todo: CHANGED
 birch_bark_manuscript_desc: "Písanie a čítanie sú základné piliere našej spoločnosti. Náboženské texty i záznamy našej histórie musia byť zaznamenané, aby sa budúce generácie mohli učiť o našich kultúrnych úspechoch. V tejto krajine mamy hojnosť brezy a jej papierová biela kôra sa stane naším pergamenom." # todo: CHANGED
 novgorod_first_chronicle: "$NOV$ Prvá kronika" # todo: CHANGED
 novgorod_first_chronicle_desc: " #italic Novgorod First Chronicle#! podrobne popisuje históriu našej krajiny od čias legendárneho varjazského povstaleckého veliteľa Rurika až po súčasnosť. Je to kultúrne dedičstvo, ktoré sa hrdinsky odovzdáva z generácie na generáciu." # todo: CHANGED
 defenses_of_novgorod: "Opevnenia $NOV$" # todo: CHANGED
 defenses_of_novgorod_desc: "Republika $NOV$ je cieľom mnohých vonkajších hrozieb. Či už sú to západní heretici z $scandinavia_region$, nenechavé nemecké sily na juhozápade, alebo iné $RUS_ADJ$ mocnosti na juhu; všetci sa rozpadnú pred nohami našich nezlomných opevnení." # todo: CHANGED
 reforms_of_the_posadnichestvo: "Reformy posadničestva" # todo: NEW TRANSLATION
 reforms_of_the_posadnichestvo_desc: " #italic Posadnik#! je najvyšší administratívny post v našich mestách a mestách a je dôležitejšou funkciou než starostovstvo. S rastom mesta rastú aj povinnosti, vplyv a počet Posadnikov v správe." # todo: CHANGED
 cork_stoppers: "Korokové zátky" # todo: CHANGED
 cork_stoppers_desc: "Pokroky vo výrobe fliaš umožnili vinárom vyrábať fľaše v štandardizovaných veľkostiach a v dôsledku toho znovuzaviesť použitie korkových zátok. To je oveľa efektívnejší spôsob utesnenia vína než textilné zátky a umožňuje jeho prepravu oveľa ďalej než predtým. Možno práve vidíme zrod svetového trhu s $wine$..." # todo: CHANGED
 colonial_policy_advance: "Koloniálna politika" # todo: NEW TRANSLATION
 colonial_policy_advance_desc: "Nové krajiny a hranice, ktoré osídľujú naši kolonisti, vyžadujú nové formy riadenia a organizácie." # todo: CHANGED
 native_policy_advance: "Politika voči domorodcom" # todo: NEW TRANSLATION
 native_policy_advance_desc: "Nové krajiny objavené našimi odvážnymi prieskumníkmi sú obyčajne obývané ľuďmi, ktorých považujeme za zvláštnych a nevzdelaných. Je čas vytvoriť oficiálnu politiku na reguláciu stretov medzi našimi výpravami a domorodcami týchto zemí." # todo: CHANGED
 slave_raid_advance: "Pobrežné nájazdy" # todo: NEW TRANSLATION
 slave_raid_advance_desc: "Naša krajina má dlhú tradíciu nájazdov na pobrežia pre zajatie otrokov, peniaze a ďalšie potrebné veci." # todo: CHANGED
 crown_power_advance_discovery: "Štátnictvo" # todo: NEW TRANSLATION
 crown_power_advance_discovery_desc: "S tým, ako autorita panovníka stúpa na dominantnú moc v našom panstve, vyvstáva potreba komplexnej vládnej štruktúry a primeraného byrokratického aparátu na jej riadenie." # todo: CHANGED
 crown_power_advance_reformation: "'Cuius Regio, Eius Religio'" # todo: CHANGED
 crown_power_advance_reformation_desc: "Kým náš vládca pevne drží záležitosti pozemské, stáva sa nevyhnutným, aby prevzal aj záležitosti nebeské. Cirkev a štát musia splynúť." # todo: CHANGED
 crown_power_advance_absolutism: "Absolutizmus" # todo: NEW TRANSLATION
 crown_power_advance_absolutism_desc: "Keď sú teraz veci svetské i božské pod autoritou panovníka, máloktoré veci unikajú jeho dosahu. Absolútna vláda teraz dominuje v našom panstve." # todo: CHANGED
 crown_power_advance_revolutions: "Národ" # todo: NEW TRANSLATION
 crown_power_advance_revolutions_desc: "Po zjednotení všetkých mocí pod železnou päsťou nášho vodcu si poddaní v celej krajine náhle uvedomili zmysel príslušnosti. Nech je akákoľvek región pod naším panovaním, sú súčasťou národa a jeho ľudu rovnako." # todo: CHANGED
 sergeants_at_arms_advance: "Seržanti pri zbrani" # todo: NEW TRANSLATION
 sergeants_at_arms_advance_desc: "Malá skupina verných družiní, ktoré chránia a slúžia panovníkovi, Sergeants-at-Arms stojí hneď pod rytiermi. Slúžia panovníkovi nielen ako telesní strážcovia, ale aj pri vyberaní pôžičiek, odvodoch mužov a lodí a plnia policajné úlohy." # todo: CHANGED
 alberghi_28_advance: "$alberghi_28$" # todo: NEW TRANSLATION
 alberghi_28_advance_desc: "$alberghi_28_desc$" # todo: NEW TRANSLATION
 genoese_banking_traditions: "$GEN_ADJ$ bankovnícke tradície" # todo: CHANGED
 genoese_banking_traditions_desc: "Vzostup $GEN$ ako hlavného obchodného centra stredovekého $ITA$ viedol k skorému rozvoju nových foriem úveru a jednej z najstarších bankových inštitúcií na svete." # todo: CHANGED
 genoese_maritime_diplomacy: "$GEN_ADJ$ námorná diplomacia" # todo: CHANGED
 genoese_maritime_diplomacy_desc: "Keď sa mesto $GEN$ stalo republikou zameranou na záujmy svojej obchodníckej triedy, rozvinulo silný vplyv v zahraničí a uzavrelo početné dohody s spojencami a klientmi naprieč Stredozemím." # todo: CHANGED
 bank_of_saint_george: "Banka svätého Juraja" # todo: NEW TRANSLATION
 bank_of_saint_george_desc: "Banka Svätého Juraja je finančná inštitúcia založená na konsolidáciu všetkých dlhov $GEN$ s cieľom stať sa kreditnou ramenou krajiny a financovať jej podniky v zámoří." # todo: CHANGED
 the_age_of_the_genoese: "Vek $GEN_ADJ$" # todo: CHANGED
 the_age_of_the_genoese_desc: "Finančný rozvoj $GEN$ v posledných desaťročiach spôsobil, že $GEN_ADJ$ bankári sa stali jednými z najvyhľadávanejších, stimulujúc pýchu našej krajiny ako patrónov uznávaných umelcov pre svoje vily a paláce." # todo: CHANGED
 hospital_advance: "Nemocnice" # todo: NEW TRANSLATION
 hospital_advance_desc: "Nemocnice boli prvýkrát založené počas stredoveku, aby poskytovali starostlivosť chorým, chudobným a invalidným. Zvyčajne vedené náboženskými rádomi, tieto nemocnice ponúkali rad medicínskych služieb vrátane základnej ošetrovateľskej starostlivosti, bylinných liekov a neskôr chirurgie. Často boli umiestnené pri kostoloch alebo kláštoroch a mali oddelené oddelenia pre mužov a ženy. Napriek obmedzeným medicínskym poznatkom zohrávali tieto nemocnice dôležitú úlohu poskytovaním útočiska, útechy a určitej formy liečby tým, čo to potrebovali v ťažkých časoch." # todo: CHANGED
 banking_country_traditions: "Bankové tradície" # todo: NEW TRANSLATION
 banking_country_traditions_desc: "Kým mnohí hľadajú bohatstvo v príležitostiach obchodu, náš štát napĺňa kasy ponukou úplne férových a dostupných pôžičiek." # todo: CHANGED
 genoese_crossbowmen: "$a_genoese_crossbowmen$" # todo: NEW TRANSLATION
 genoese_crossbowmen_desc: "$a_genoese_crossbowmen_desc$" # todo: NEW TRANSLATION
 genoese_galley: "$n_genoese_galley$" # todo: NEW TRANSLATION
 genoese_galley_desc: "$n_genoese_galley_desc$" # todo: NEW TRANSLATION
 italian_galleass: "$n_italian_galleass$" # todo: NEW TRANSLATION
 italian_galleass_desc: "$n_italian_galleass_desc$" # todo: NEW TRANSLATION
 genoese_flexibility: "$GEN_ADJ$ flexibilita" # todo: CHANGED
 genoese_flexibility_desc: "Naše štátne námorníctvo môže slúžiť viacerým účelom, nielen ako vojenská zbraň. Vďaka našim znalostiam a skúsenostiam môžeme rýchlo premeniť vojnové galeje na obchodné — a naopak, ak to bude potrebné." # todo: CHANGED
 genoese_school: "$GEN_ADJ$ škola" # todo: CHANGED
 genoese_school_desc: "Maľovanie a vizuálne umenie všeobecne kvitlo v $ITA$ od $renaissance$. Niet preto divu, že bohatý a vážený štát ako $GEN$ otvára vlastnú $GEN_ADJ$ školu umenia." # todo: CHANGED
 government_size_renaissance: "Stály kabinet" # todo: NEW TRANSLATION
 government_size_renaissance_desc: "Panovníci mali tradične radu poradcov, ktorá ich viedla pri dôležitých rozhodnutiach. Časom sa vláda rozrástla natoľko, že potrebujeme viac stálych poradných pozícií na riešenie každodenného riadenia." # todo: CHANGED
 renaissance_court: "$renaissance$ dvor" # todo: CHANGED
 renaissance_court_desc: "$renaissance$ sa rozšírilo ďaleko a široko, a v dôsledku toho náš dvor priťahuje zasvätených umelcov a učencov, vytvárajúc najvznešenejšie diela, aké kedy videl svet." # todo: CHANGED
 rgo_size_advance_renaissance: "Mlyny" # todo: NEW TRANSLATION
 rgo_size_advance_renaissance_desc: "Mlýny sa používajú od staroveku. Teraz však dokážeme vyvíjať modernejšie a efektívnejšie veterné a vodné mlyny, ktoré zlepšujú našu produkciu." # todo: CHANGED
 food_advance_renaissance: "Intenzívne poľnohospodárstvo" # todo: NEW TRANSLATION
 food_advance_renaissance_desc: "Poľnohospodárstvo je základom väčšiny spoločností. Nedávne pokroky zvýšili produktivitu našich polí a fariem, čím vytvorili cenné potravinové prebytky." # todo: CHANGED
 crown_power_advance_renaissance: "Svrchovanosť" # todo: NEW TRANSLATION
 crown_power_advance_renaissance_desc: "Tradičné vládnutie vyžadovalo, aby vládcovia rokovali so stavmi a vyvažovali konkurenčné sily. Moderné teórie však ustanovujú panovníka ako najvyššiu autoritu v ríši — nad všetkými inštitúciami a stavmi, bez podriadenia akejkoľvek pozemskej moci." # todo: CHANGED
 global_supply_limit_modifier_advance_2: "Zásobovacie trasy" # todo: NEW TRANSLATION
 global_supply_limit_modifier_advance_2_desc: "Pozemná vojna je čoraz viac závislá na zásobovaní väčších armád. Preto lepšia organizácia našich zásobovacích vozov zvýši operačnú kapacitu." # todo: CHANGED
 naval_morale_advance_1: "Stredoveké plachtenie" # todo: NEW TRANSLATION
 naval_morale_advance_1_desc: "Pokroky v plachtárstve v posledných desaťročiach zvýšili odborné schopnosti a dôveru našich námorníkov, čo im umožňuje bezpečne navigovať pozdĺž pobrežných vôd." # todo: NEW TRANSLATION
 slave_trade_act_advance: "Zákon o obchode s otrokmi" # todo: NEW TRANSLATION
 slave_trade_act_advance_desc: "Tok pracovníkov do a z našich kolónií je výnosná a citlivá záležitosť. Preto musíme investovať do legislatívnych snáh ju zdokonaliť." # todo: CHANGED
 order_headquarters_advance: "$order_headquarters$" # todo: NEW TRANSLATION
 order_headquarters_advance_desc: "Zriadenie lojálnych Rádov nepochybne zvýši naše miestne obranné schopnosti a uľahčí nábor zdatných bojovníkov." # todo: CHANGED
 LIV_crusader_forts: "Baltské križiacke pevnosti" # todo: NEW TRANSLATION
 LIV_crusader_forts_desc: "Mnohé pevnosti v našich teritóriách boli postavené a financované našimi početnými križiackymi družinami. Vychované pevne opevnené múry budú slúžiť a chrániť našich ľudí mnoho rokov!" # todo: CHANGED
 scholasticism: "Klasická scholastika" # todo: NEW TRANSLATION
 scholasticism_desc: "Založený na aristotelovskej logike a spisoch ranných $christian_ADJ$ otcov, scholastika sa snaží šíriť poznanie zdôrazňovaním náboženských dogiem a tradícií." # todo: CHANGED
 organized_religion: "Organizované náboženstvo" # todo: NEW TRANSLATION
 organized_religion_desc: "Náboženstvo zohráva veľkú úlohu v každej spoločnosti, no nie každá viera má rovnakú štruktúru. Organizované náboženstvo má systematicky usporiadané rituály a presvedčenia a nasleduje definované doktríny." # todo: CHANGED
 guilds: "Cechy" # todo: NEW TRANSLATION
 guilds_desc: "Cech je združenie obchodníkov alebo remeselníkov, ktorí sa spojili pre vzájomnú ochranu, pomoc a prospech. Cechy vytvárajú monopol na svoje produkty a obchod a stanovujú štandardy kvality a ceny výrobkov." # todo: CHANGED
 colonial_tradition: "Koloniálne tradície" # todo: NEW TRANSLATION
 colonial_tradition_desc: "Náš štát vznikol a formoval sa ambíciami 'otcov zakladateľov', prvých kolonistov, ktorí prišli z starej krajiny. Mnohé z návykov a tradícií, ktoré priniesli, ovplyvnili našu spoločnosť v tomto novom a zvláštnom svete." # todo: CHANGED
 colonial_heritage: "Koloniálne dedičstvo" # todo: NEW TRANSLATION
 colonial_heritage_desc: "Ako kolónia nesieme dedičstvo impériových ambícií našej materskej krajiny." # todo: CHANGED
 colonial_ambition: "Koloniálne ambície" # todo: NEW TRANSLATION
 colonial_ambition_desc: "Mnohí naši ľudia sa usadili v Novom svete, aby začali nový život; objavovali zázraky za morom a urobili z neposednej kontinentu svoj domov. Ich ambície sú naše, keď sa odvážame stále ďalej do neznáma." # todo: NEW TRANSLATION
 power_projection_advance_1: "Imperiálne ambície" # todo: NEW TRANSLATION
 power_projection_advance_1_desc: "Ako krajiny rástli a štáty sa konsolidovali počas vrcholného stredoveku, ich ambície tiež rástli, čo viedlo k pokusom o vytvorenie a obnovenie impérií v ich regiónoch." # todo: CHANGED
 trade_advance_age_of_trad: "Obchodné jarmoky" # todo: NEW TRANSLATION
 trade_advance_age_of_trad_desc: "Ako sa obchodné trasy oživovali a rozširovali v stredoveku, objavili sa nové obchodné praktiky. Jedným z nich boli veľké trhy, každoročne organizované v mestách, kde sa stretávali obchodníci z rôznych miest a uzatvárali dohody." # todo: CHANGED
 colonial_assembly: "Koloniálne zhromaždenie" # todo: NEW TRANSLATION
 colonial_assembly_desc: "Veľká časť zákonodarných práv nad daňami a vládnym výdavkami bola presunutá do koloniálnych správ." # todo: CHANGED
 founding_fathers: "Zakladatelia" # todo: NEW TRANSLATION
 founding_fathers_desc: "Týka sa všetkých politikov, vojakov, diplomatov a iných, ktorí zohrali vplyvnú úlohu pri založení národa vybojovaním nezávislosti a vytvorením nového systému vlády." # todo: CHANGED
 colonial_militia: "Koloniálna milícia" # todo: NEW TRANSLATION
 colonial_militia_desc: "Pri absencii pravidelných posádok zohrávali koloniálne milície dôležitú úlohu v miestnych konfliktoch a hraničných nájazdoch proti domorodým kmeňom a iným kolóniám. Zvyčajne sa skladali z dospelých mužov-obyvateľov, ktorí si zvyčajne museli zabezpečiť vlastnú výzbroj a výstroj." # todo: CHANGED
 new_frontiers: "Nové hranice" # todo: NEW TRANSLATION
 new_frontiers_desc: "Snahy posúvať koloniálne hranice stále hlbšie v Novom svete, zakladaním všetkého od malých obchodných staníc po plnohodnotné osady s veľkými oblasťami obdarených polí." # todo: NEW TRANSLATION
 continental_trade: "Kontinentálny obchod" # todo: NEW TRANSLATION
 continental_trade_desc: "Kým kolónie Nového sveta museli dovážať veľa manufaktúrovaných produktov, stali sa tiež hlavným dodávateľom surovín pre trhy v $europe$." # todo: CHANGED
 manufacturing_center: "Imperiálne výrobné centrum" # todo: CHANGED
 manufacturing_center_desc: "Naši občania sú oporným bodom obchodného impéria nás nadriadených. Zahraničné tovary sa k nám dodávajú a my ich spracujeme na hotové výrobky." # todo: CHANGED
 free_thinkers: "Slobodní myslitelia" # todo: NEW TRANSLATION
 free_thinkers_desc: "Viaceroslobodomyšlienkárov" # todo: CHANGED
 liberty_heroes: "Synovia slobody" # todo: CHANGED
 liberty_heroes_desc: "Mnohí vodcovia nezávislostných vojen v Novom svete mali nielen potrebné vojenské schopnosti, ale aj charizmu potrebnú na udržanie morálky, držanie armády pokope a inšpiráciu ľudu." # todo: CHANGED
 beat_to_windward_advance: "Plachtenie proti vetru!" # todo: NEW TRANSLATION
 beat_to_windward_advance_desc: "Karavely s latinskými plachtami sú veľmi obratné a umožňujú im ľahko obracať proti vetru. To robí plavbu cez nepriaznivé počasie a nebezpečné more omnoho rýchlejšou." # todo: NEW TRANSLATION
 route_to_the_indies_advance: "Cesta do Indie" # todo: NEW TRANSLATION
 route_to_the_indies_advance_desc: "Obchod s Dálnym východom je nevyhnutný pre udržanie nášho spôsobu života. Pevná pozemná trasa je však pomalá a nákladná. Ak by sme našli morské spojenie, otvorilo by to veľa obchodných príležitostí pre našich kupcov." # todo: CHANGED
 educated_bureaucrats: "Vzdelaní byrokrati" # todo: NEW TRANSLATION
 educated_bureaucrats_desc: "Úradníci spravujúci našu administratívu nie sú negramotní a leniví dediči miest; sú to vzdelaní a talentovaní jednotlivci, ktorí si svoje posty zaslúžili prácou a zásluhami. Takáto správa bezpochyby funguje hladšie a efektívnejšie." # todo: CHANGED
 efficient_bureaucracy: "Efektívna byrokracia" # todo: NEW TRANSLATION
 efficient_bureaucracy_desc: "Byrokracia je olejom, ktorý hladko roztočí kolesá našej správy. Vymenovaním efektívnych úradníkov s talentom a vôľou riadne plniť svoje úlohy zabezpečíme plynulú prevádzku vládnych štruktúr." # todo: CHANGED
 appointed_chain_of_command: "Menovaný reťazec velenia" # todo: NEW TRANSLATION
 appointed_chain_of_command_desc: "Mať talentovaných vojenských odborníkov vedúcich naše sily do bitiek, namiesto nekompetentných šľachticov, ktorým boli posty pridelené len kvôli krvi, zlepší efektivitu našich armád. Výsledkom je, že dokážeme jednoduchšie velenie väčším silám." # todo: CHANGED
 abacus_advance: "Abakus" # todo: NEW TRANSLATION
 abacus_advance_desc: "Abacus môže byť starodávnou technológiou, no práve vďaka správnym účtovným nástrojom a knihám sme schopní viesť presné účty nášho bohatstva. Bez týchto nástrojov a talentovaných expertov, ktorí vedia s nimi pracovať, by sme boli slepí k reálnemu bohatstvu krajiny." # todo: CHANGED
 temporary_appointments: "Dočasné menovania" # todo: NEW TRANSLATION
 temporary_appointments_desc: "Mať členov dvora v doživotných pozíciách nesie riziko nadobudnutia neprimeranej moci a vplyvu. Taktiež majú tendenciu venovať menej úsilia úlohám z dôvodu nadmernej zodpovednosti. Aby sme sa tomu vyhli, môžeme zaviesť systém dočasných menovaní. Tak budú úradníci prideľovaní na pozície, na ktoré sú najvhodnejší, ale ľahko ich budeme môcť presadiť, ak by spôsobili upokojenie." # todo: CHANGED
 non_inheritable_offices: "Neodovzdateľné úrady" # todo: CHANGED
 non_inheritable_offices_desc: "Mať úradníkov, ktorí odovzdávajú svoje úrady z otca na syna, je mor na našej administratíve! Nevychádza z toho nič, len apatia a rozklad každej pobočky autority. Odteraz by mali byť úrady prideľované tým, ktorí ich najlepšie vykonajú, bez ohľadu na pôvod." # todo: CHANGED
 government_sanctioned_celebrations: "Štátom schválené oslavy" # todo: NEW TRANSLATION
 government_sanctioned_celebrations_desc: "Náš ľud sa rád raduje pri každej dobrej správe, či už v prospech krajiny alebo pri spomínaní kalendárnych dní. Namiesto toho, aby tieto radostné zhromaždenia organizovali sami, nech ich naša administratíva zorganizuje veľkolepé verejné oslavy, aby sme ukázali, že sa o ľudí staráme a zároveň podporili pocit jednoty." # todo: CHANGED
 efficient_logistics: "Efektívna logistika" # todo: NEW TRANSLATION
 efficient_logistics_desc: "Logistika a komunikácia nám umožňujú riadne spravovať celé územie. Na lepšiu komunikáciu medzi provinčnými guvernérmi a centrálnou vládou potrebujeme dobre ustálenú sieť ciest pre našich kuriérov." # todo: CHANGED
 ledgers_double_checking: "Dôkladné účtovníctvo" # todo: CHANGED
 ledgers_double_checking_desc: "Nedostatok prísnosti v účtovníctve umožňuje korupciu rozkvitať a rozkladať krajiny zvnútra! Aby sme sa vyhli tejto hrozbe pre našu správu, musíme zabezpečiť, že všetky zmeny v pokladnici sú pedantne zdokumentované." # todo: CHANGED
 province_governors: "Provincijní guvernéri" # todo: CHANGED
 province_governors_desc: "Naše provincie nie sú autonómne riadené ani miestnymi šľachticmi hladnými po moci. Namiesto toho sú guvernéri vymenovaní centrálnou administratívou zodpovední za rozšírenie našej moci do každého sídla v krajine." # todo: CHANGED
 right_to_rule: "Právo vládnuť" # todo: NEW TRANSLATION
 right_to_rule_desc: "Naša správa vychádza z predpokladu, že najtalentovanejší ľudia majú byť pridelení na patričné miesta. Vládca by mal byť najnadanejším členom ríše, ako sa patrí líderovi celej krajiny. V prípade, že by vládca chýbal darom, potrebujeme ľudí schopných 'vylepšiť' pravdu prostredníctvom monumentálnych sôch, ohromujúcich obrazov alebo oslavných veršov, aby komunikovali výnimočnú kompetenciu vládcu." # todo: CHANGED
 talented_traders: "Nadaní obchodníci" # todo: NEW TRANSLATION
 talented_traders_desc: "Rovnako ako obsadzujeme administratívu talentovanými úradníkmi, musíme zabezpečiť, aby obchodnú infraštruktúru spravovali zruční profesionáli. Mať len najbystrejších ľudí do vedenia obchodu udrží pohyb tovarov a príjmov plynulý." # todo: CHANGED
 smooth_administration: "Plynulé riadenie" # todo: NEW TRANSLATION
 smooth_administration_desc: "Mať administráciu zloženú z najtalentovanejších a najvhodnejších jednotlivcov v ríši pomáha krajine plynulo fungovať a našej autorite plynúť nerušene, bez ohľadu na okolnosti." # todo: CHANGED
 ara_a_maritime_realm: "Morské panstvo" # todo: NEW TRANSLATION
 ara_a_maritime_realm_desc: "Naše panstvo je pevne sústredené na rozľahlosť mora a orientované na námorné aktivity. So strategickým pohľadom využíva námornú silu a obchod na posilnenie svojho postavenia a rozšírenie vplyvu. Naša námorná orientácia formuje politiku a podporuje námornú kultúru, ktorá poháňa prosperitu štátu." # todo: CHANGED
 ara_desperta_ferro: "Desperta Ferro!" # todo: NEW TRANSLATION
 ara_desperta_ferro_desc: "#italic Desperta Ferro!#! — Prebuď železo! — je strašný bojový výkrik $a_almogavars$, vyvolávajúci prítomnosť železa v boji. Je sprevádzaný nárazmi kopí a vrhacích ostrieľov o kremeň, aby sa vytvorili iskry. Medzi bojovými výkrikmi ako #italic Aragó!#! a #italic Sant Jordi!#! #italic Desperta Ferro!#! vyniká ako najslávnejší a najunikátnejší." # todo: CHANGED
 ara_a_mediterranean_trade_power: "Stredomorská obchodná veľmoc" # todo: NEW TRANSLATION
 ara_a_mediterranean_trade_power_desc: "Pokojné mora Stredozemia hladia naše pobrežia a lákajú náš ľud k obchodným aktivitám z generácie na generáciu. Naše rušné obchodné centrá a strategické obchodné stanice roztrúsené po Stredozemí zohrávajú kľúčovú úlohu pri dosahovaní ambície stať sa dominantnou silou v obchode." # todo: CHANGED
 ara_fleet_ordinances: "Flotilové ustanovenia" # todo: NEW TRANSLATION
 ara_fleet_ordinances_desc: "V rušnom Stredozemí sa stretávajú flotily z celého sveta, čo vyvoláva potrebu právneho systému riešiť zločiny na zaneprázdnenom mori a zemi. #italic Ordinacions sobre lo fet de la mar#!, alebo #italic Ustanovenia o tom, čo sa deje na mori#!, je jedným z najstarších vojenských súdnych kodexov, vytvoreným na vládnutie flotilám. Táto unikátna reakcia na obdobie po čiernej smrti náboruje členov posádok vrátane zločincov mimo $ARA$, čo vedie k harmonizovanému kódexu utvorenému z rôznych tradícií namiesto pouhej kodifikácie existujúcich námorných zvyklostí." # todo: RETRANSLATED ENGLISH
 ara_valencian_golden_age: "$VAL_ADJ$ zlatý vek" # todo: CHANGED
 ara_valencian_golden_age_desc: "Ríša, v ktorej žijeme, dosiahla literárne výšky, ktoré mnohí susední národy ešte nedosiahli, vďaka vynikajúcim dielam autorov ako Joanot Martorell, Ausiàs March a Isabel de Villena. Ich hlboké literárne diela pozdvihli našu kultúru na bezkonkurenčné úrovne a zaplnili hrdosťou náš ľud. Nepochybne je náš národ žiarivým majákom kultúry." # todo: CHANGED
 ara_remenca: "Remença" # todo: NEW TRANSLATION
 ara_remenca_desc: "Systém #italic Remença#!, špecifický pre $CAT$, má ekvivalenty v iných územiach Koruny a podporuje kolektívne snaženie o väčšiu produkciu surovín. Prostredníctvom tohto rámca naše krajiny zažívajú prílev bohatstva, čo rozohne potenciál pre významný pokrok k naplneniu našich cieľov. Harmonizáciou týchto systémov vybudujeme prostredie posilnené hojnosťou zdrojov a podporíme cestu rastu a prosperity pre naše panstvo." # todo: CHANGED
 ara_chartered_merchant_companies: "Udelené obchodné spoločnosti" # todo: NEW TRANSLATION
 ara_chartered_merchant_companies_desc: "Naši obchodníci míňajú zdroje na vzájomnú konkurenciu. To je nerozum; mali by sme zamerať všetky sily na preberanie obchodu od iných! Zriaďme privilegované spoločnosti, ktorým sa dajú dočasné monopoly na obchod v určitých regiónoch, pričom ich obnovenie bude závisieť na odovzdaní zaslúženého podielu Korune." # todo: CHANGED
 ara_stronger_united: "Silnejší, zjednotení" # todo: NEW TRANSLATION
 ara_stronger_united_desc: "Od zjednotenia nás s hrabstvom Barcelona v roku 1164 funguje $ARA$ ako konfederácia zložená z odlišných ríš pod jedným vládcom. Tieto rozdiely priniesli prosperitu a udržali individuálne identity, no tiež vytvorili ilúziu nejednotnosti. To si vyžaduje administratívne reformy na posilnenie našej únie pri zachovaní jedinečných charakteristík každého územia." # todo: CHANGED
 ara_constellation_cities: "Konštelácia miest" # todo: NEW TRANSLATION
 ara_constellation_cities_desc: "Od svojho vzniku pozostáva náš štát z rôznych ríš zjednotených pod jedným vládcom. Avšak každá ríša si zachováva svoje tradície a zákony. V dôsledku toho sa vyformovalo mnoho hlavných miest, ktoré sú regionálnymi metropolami, zastupujúcimi a spravujúcimi svoje oblasti." # todo: CHANGED
 ara_protection_of_the_little_folk: "Chrániť malý ľud" # todo: CHANGED
 ara_protection_of_the_little_folk_desc: "Naši vojaci chcú, aby sa ich blízki mali o čo postarať, keby padli v bitke. $ARA$ splní svoju povinnosť a zriadi systém pracovných domov pre siroty padlých." # todo: CHANGED
 ara_gunpowder_souls: "Duše z pušného prachu" # todo: NEW TRANSLATION
 ara_gunpowder_souls_desc: "Oslava #italic Fallas#! pôsobila ako katalyzátor v Korune $ARA$, podnecujúc pokroky v artilerii prostredníctvom praktických skúseností s prácou s prachom pre petardy a ohňostroje. Táto svátnosť podnietila ducha inovácií, vedúceho k rozvoju nových stratégií a poznatkov v oblasti delostrelectva." # todo: CHANGED
 ara_mossos_esquadra: "Mossos d'Esquadra" # todo: NEW TRANSLATION
 ara_mossos_esquadra_desc: " #italic Escuadras de Paisanos#!, známe tiež ako #italic Esquadres de Catalunya#! alebo #italic Mossos d'Esquadra#!, sú miestnou gardou venovanou ochrane obchodných trás a trhov, využívajúc znalosť terénu. Inšpirovaní ich úspechom chceme zriadiť podobné milície v ostatných územiach, zložené z miestnych obyvateľov. To by podporilo pokojné spolunažívanie a udržalo poriadok v regióne." # todo: CHANGED
 cas_repoblaciones: "Repoblaciones" # todo: NEW TRANSLATION
 cas_repoblaciones_desc: "Rozsiahle dobytia našich predkov vytvorili krajinu s viac pôdou než ľuďmi ochotnými ju obývať a obdobať. To viedlo k naliehavej potrebe prilákať prisťahovalcov z iných regiónov." # todo: CHANGED
 cas_the_reconquista: "Reconquista" # todo: NEW TRANSLATION
 cas_the_reconquista_desc: "Po rokoch od pádu Vizigótskeho kráľovstva sme viedli vojnu proti Maurům. To nám dalo železnú disciplínu, ktorú len málo môže preukázať. Povzbuďte sa, bojovníci $CAS$, a ukážte svetu našu odhodlanosť!" # todo: CHANGED
 cas_castilian_navy: "$CAS_ADJ$ námorníctvo" # todo: CHANGED
 cas_castilian_navy_desc: "Ako poloostrov obklopený morom na troch stranách a s cenným $strait_of_gibraltar$ tvrdo bojovaným rôznymi mocnosťami sa ovládnutie morí stalo otázkou života a smrti. Z našich stoviek kilometrov pobrežia naši predkovia začali skrotiť vlny a premeniť národ na nebojácnu námornú mocnosť." # todo: CHANGED
 cas_cronicas_reales: "Króniky kráľov" # todo: NEW TRANSLATION
 cas_cronicas_reales_desc: "Zostavením kroník písaných predchádzajúcimi panovníkmi dokážeme vytvoriť kompendium, ktoré detailne zaznamená každú udalosť v našom panstve a pôvod všetkých našich vládcov. Tieto poznatky nám pomôžu nielen vytvoriť lepšie kultúrne základy, ale aj pomôžu súčasným a budúcim vládcov správne posúdiť súčasné udalosti cez porovnanie s minulými." # todo: CHANGED
 cas_masters_of_the_orders: "Majstri rád" # todo: NEW TRANSLATION
 cas_masters_of_the_orders_desc: "Keďže Rekonkista už nie je našou hlavnou úlohou, nemôžeme ospravedlniť nezávislosť Rádov. Ak panovník zaujme post Majstra v každom Ráde, získa nielen významnú moc, ale aj prístup k vojenskému know-how týchto križiakov." # todo: CHANGED
 cas_new_world: "Nový svet" # todo: NEW TRANSLATION
 cas_new_world_desc: "Novoodkryté krajiny môžu byť obsadené a osídlené podnikavými kolonistami, ktorí budú posielať hodnotné obchodné tovary naspäť do našej ríše. Pošleme niekoľko verných kolonistov do Nového sveta, nech si urobia nároky a nájdu spôsoby, ako zužitkovať prírodné poklady, a tak vytvoria základ našich koloniálnych snáh." # todo: CHANGED
 cas_reform_of_millones: "Reforma Millones" # todo: NEW TRANSLATION
 cas_reform_of_millones_desc: "S prijatím reformy #italic Millones#! môžeme zdaňovať obyvateľstvo efektívnejšie. Ide o nepriame vyberanie daní cez poplatok na potraviny." # todo: CHANGED
 cas_marine_infantry: "$CAS_ADJ$ námorná pechota" # todo: CHANGED
 cas_marine_infantry_desc: "S mocným námorníctvom prichádza potreba námorníkov zdatných v boji v akomkoľvek prostredí, vrátane boja mimo paluby. Aby sme to prekonali, zregulujeme našu námornú pechotu tak, aby sa stala silnou zbraňou kdekoľvek, kde bojuje." # todo: CHANGED
 cas_pasos: "$CAS_ADJ$ Pasos" # todo: CHANGED
 cas_pasos_desc: "Zatiaľ čo #italic Pasos#! Veľkého týždňa sú starou tradíciou v $CAS$, sochárske diela, ktoré ich sprevádzajú, dosiahli nedávno ohromný nový vrchol. Umelec ako Juan de Juni a Gregorio Fernández začali robiť $CAS_ADJ$ #italic Pasos#! najimpozantnejšími na Pologu." # todo: CHANGED
 cas_real_academia_espanola: "Real Academia Española" # todo: NEW TRANSLATION
 cas_real_academia_espanola_desc: "Ako sa náš jazyk vyvíja a rozširuje po svete, je zrejmé, že ho treba regulovať a zachovať. Aby sme ochránili základné charakteristiky a vlastnosti materinského jazyka, založíme #italic Real Academia Española#! na stanovenie štandardov správneho používania." # todo: CHANGED
 cas_canal_de_castilla: "Canal de Castilla" # todo: NEW TRANSLATION
 cas_canal_de_castilla_desc: "Inšpirovaný vodnými systémami po celom $europe$, ktoré sa používajú na obchod i zavlažovanie, #italic Canal de Castilla#! prinesie vodu z hôr na severe #italic Meseta#! a zavlaží obilné polia starej Kastílie. Tento inžiniersky počin zvýši úrodu, vytvorí prebytok na obchod a umožní jeho transport pre export." # todo: CHANGED
 cas_royal_factories: "Královské továrne" # todo: NEW TRANSLATION
 cas_royal_factories_desc: "Aby sme zabránili exportu surovín namiesto hodnotnejších výrobkov, vybudujeme sieť štátom podporovaných kráľovských tovární, ktoré industrializujú náš štát. Pevnejšia domáca výroba povedie k silnejšej národnej ekonomike." # todo: CHANGED
 gra_banu_nasr: "Banū Naṣr" # todo: NEW TRANSLATION
 gra_banu_nasr_desc: "Pochádzame z klanu Banū l-Ḫazraj a sme z rodu Saʿd ibn ʿUbāda, druha proroka Muhammada. Zakladateľ našej dynastie, Muhammad I, ovládal územie zahrňujúce $granada$, $jaen$, $almeria$ a $malaga$, hoci niektoré z týchto území padli do rúk $christian_ADJ$ vojsk. Odvtedy sme s neústupnosťou odolávali ich postupom a budeme tak pokračovať s mocou našich predkov." # todo: CHANGED
 gra_nasrid_art: "Nasridské umenie" # todo: NEW TRANSLATION
 gra_nasrid_art_desc: "Remeselníci a architekti $GRA$ sú najzručnejší na svete. Vytvárajú diela, ktoré sú nielen užitočné, ale aj esteticky príjemné, krásne kombinujúc formu a funkciu." # todo: CHANGED
 gra_skillful_envoys: "Zručné posolstvá" # todo: NEW TRANSLATION
 gra_skillful_envoys_desc: "Naše obratné využívanie diplomacie neraz rozhodlo medzi životom a smrťou. Nesmie nás to uspokojiť; musíme ďalej trénovať našich vyslancov, aby sme zaistili ich úspech." # todo: CHANGED
 gra_razzias: "Nasridské razzie" # todo: NEW TRANSLATION
 gra_razzias_desc: "Hranice našich nepriateľov sú lákavé príležitosti. Ak razantne zaútočíme bleskovými nájazdami, prekvapíme protivníka a spôsobíme mu trvalé škody." # todo: CHANGED
 gra_muttavia_armies: "Mutawwi'a armády" # todo: CHANGED
 gra_muttavia_armies_desc: "$GRA$ má obmedzený počet obyvateľov, a nemôžeme naraziť dosť mužov na odvedenie armády. Tam, kde nám chýba ľud, nám nechýba zlato — to môžeme použiť na najatie žoldnierov pod našimi prápormi." # todo: CHANGED
 gra_expand_qanahs: "Rozšíriť qanáh" # todo: NEW TRANSLATION
 gra_expand_qanahs_desc: "Zeme $GRA$ sú úrodné, no rozšírením zavlažovacích kanálov by sme lepšie využili zásobu vody a vypestovali kvalitnejšie plodiny." # todo: CHANGED
 gra_adaptative_trade: "Adaptívny obchod" # todo: NEW TRANSLATION
 gra_adaptative_trade_desc: "Naša privilégiovaná pozícia sprostredkovateľa medzi $christian_ADJ$ a $muslim_ADJ$ národmi je ohrozená. Táto hrozba môže byť príležitosťou modernizovať obchodné metódy a obnoviť naše postavenie ako mostu medzi vzdialenejšími trhmi a $europe$." # todo: CHANGED
 gra_expand_the_frontier: "Rozšíriť hranicu" # todo: NEW TRANSLATION
 gra_expand_the_frontier_desc: "Od založenia dynastie sa naše územia zmenšovali. Teraz sme v silnejšej pozícii, schopní nielen získať späť stratené územia, ale rozšíriť ríšu aj nad pôvodné hranice." # todo: CHANGED
 gra_a_strong_rule: "Silná vláda" # todo: NEW TRANSLATION
 gra_a_strong_rule_desc: "Kolá generácií našej vládnucej rodiny navzájom bojovali, destabilizujúce krajinu. Je čas, aby mocný vládca dôrazne uplatnil autoritu, ukázal, že je jedinou osobou schopnou udržať mier a priviesť prosperitu." # todo: CHANGED
 gra_modernized_economy: "Modernizovaná ekonomika" # todo: NEW TRANSLATION
 gra_modernized_economy_desc: "Moderné časy vyžadujú modernú ekonomiku, schopnú prosperovať v silno konkurenčnom prostredí. Upgradovaním infraštruktúry a zefektívnením výrobných procesov maximalizujeme produkciu pri rovnakej spotrebe zdrojov." # todo: CHANGED
 gra_ghazawat: "Nasridské ghazávy" # todo: NEW TRANSLATION
 gra_ghazawat_desc: "Ako potomkovia bojovníkov, čo bojovali pod prorokom, musíme brániť našu ríšu s rovnakou odvahou. Každá bitka za $GRA$ je #italic ghazawat#! — svätý zápas na uchovanie $muslim$ proti náporu $christian$." # todo: CHANGED
 gra_a_new_golden_era: "Nové zlaté obdobie" # todo: NEW TRANSLATION
 gra_a_new_golden_era_desc: "Al-Andalus bol kedysi centrom učenia, domovom výnimočných učencov ako 'Aḥmad Ibn Rušd, 'Abū al-Qāsim a Muḥammad bin Ṭufayl. Mali by sme pokračovať v tejto dlhoročnej intelektuálnej tradícii." # todo: CHANGED
 nav_transatlantic_whaling: "Transatlantické lovy veľrýb" # todo: NEW TRANSLATION
 nav_transatlantic_whaling_desc: "Basvaské $basque$ veľrybárske tradície predstavujú stáročia skúseností a naši odborníci sú často konzultovaní inými národmi, ktoré chcú rozšíriť a zlepšiť vlastné veľrybárstvo. Mali by sme využiť túto expertízu založením veľrybárskych spoločností pozdĺž $atlantic_ocean_continent$." # todo: CHANGED
 nav_shipbuiling_experts: "Odborní stavitelia lodí" # todo: CHANGED
 nav_shipbuiling_experts_desc: "More pohladí naše pobrežie a skrýva zdroje čakajúce na odvážnych. Storočia naše pobrežie hýri prístavmi a lodinami, bez prestania stavajúc plavidlá na dobrodružstvá a zisk na otvorenom mori." # todo: CHANGED
 nav_memories_reconquista: "Spomienky na Reconquistu" # todo: NEW TRANSLATION
 nav_memories_reconquista_desc: "Náš ľud aktívne prispieval do Rekonquisty, podporujúc $christian_ADJ$ snahy o znovuzískanie $iberia_region_ADJ$ spod $muslim_ADJ$ nadvlády. Napriek tomu, že ďalší teritoriálny rast sa stal neudržateľným, $NAV$ zohral dôležitú úlohu v tomto ťažení cez vojenské kampane a spojenectvá s okolnými $christian_ADJ$ kráľovstvami." # todo: CHANGED
 nav_a_renaissance_realm: "Renaissance ríša" # todo: CHANGED
 nav_a_renaissance_realm_desc: "Hoci naša ríša pochádza z horských údolí Pyrenejí, náš ľud bol výrazne ovplyvnený humanistickými ideami zo severu i juhu. Prijímaním tohto nového myslenia ľudia $NAV$ nestrácajú tradície, ale spájajú ich do svojej identity." # todo: CHANGED
 nav_fearless_seamen: "Nebojácni námorníci" # todo: NEW TRANSLATION
 nav_fearless_seamen_desc: "Náš ľud vždy hľadel na more s obdivom a rešpektom, vedomý si odmien i nebezpečenstiev, ktoré prináša. Naši predkovia založili spoločenstvá žijúce nielen pri mori, ale z mora, rozvinúc obdivuhodné námorné zručnosti. námorníci z našich brehov sú známi po celom Atlantiku." # todo: CHANGED
 nav_always_ready: "Vždy pripravení" # todo: NEW TRANSLATION
 nav_always_ready_desc: "Vznikli sme ako malá ríša obkolesená mohutnými nepriateľmi zo všetkých smerov. To hlboko formovalo náš národný charakter a prístup k svetu. Sme preto stále ostražití a pripravení okamžite reagovať na každé znamenie hrozby." # todo: CHANGED
 nav_chartered_councils: "Udelené rady" # todo: NEW TRANSLATION
 nav_chartered_councils_desc: "Každé historické územie zformuje radu závislú na vládcovi a volenú miestnymi obyvateľmi, ktorá zaručí rešpektovanie ich tradičných zákonov či #italic Fueros#!. Tento medzikrok nám umožní lepšiu a efektívnejšiu správu našich krajín bez zasahovania do miestnych záujmov." # todo: CHANGED
 nav_people_of_the_sea: "Ľudia mora" # todo: NEW TRANSLATION
 nav_people_of_the_sea_desc: "Náš ľud sú skúsení námorníci a celý svet to vie. Naše schopnosti budú očividnou výhodou v námorných bitkách, čo nás predurčí k úspechu." # todo: CHANGED
 nav_basque_ferocity: "$basque$ zujalosť" # todo: NEW TRANSLATION
 nav_basque_ferocity_desc: "Ešte pred bitkou pri $roncesvalles$, kvôli ktorej $FRA_ADJ$ stále plače, alebo ťaženia $NAV_ADJ$ Spoločnosti, naši ľudia boli vždy považovaní za krutých bojovníkov. Nikdy nedajme nepriateľom zabudnúť na to." # todo: CHANGED
 nav_an_industrious_folk: "Pracovitý ľud" # todo: NEW TRANSLATION
 nav_an_industrious_folk_desc: "Zem, ktorú obývame, možno nie je najbohatšia, ale $basque$ ľud je pracovitý, pilne získava to, čo potrebuje. Či už tavením $iron$ v dielňach, výrobou dreva na drevné uhlie alebo stavbou najlepších lodí, naše panstvo je bohaté vďaka úsiliu a zručnosti našich ľudí." # todo: CHANGED
 nav_mercantile_expansion: "Obchodná expanzia" # todo: NEW TRANSLATION
 nav_mercantile_expansion_desc: "Storočia naša spoločnosť obchodovala nielen so susedmi, ale aj s ďalekými krajinami. To nielenže urobilo našich obchodníkov mimoriadne zručními, ale aj rozšírilo inovácie z mnohých národov ďalej a širšie, než by inak bolo možné." # todo: CHANGED
 nav_navarrese_defense_force: "$NAV_ADJ$ obraná sila" # todo: CHANGED
 nav_navarrese_defense_force_desc: "S postupným zosilnením susedov hrozí nárast nebezpečenstva pre národnú existenciu. Na riešenie toho zriadime vojenské oddelenie zamerané na posilnenie našich síl vyšším počtom vojakov bez kompromitovania kvality rekrutov." # todo: CHANGED
 nav_shipyards_ironworks: "Lodiarne a železiarne" # todo: NEW TRANSLATION
 nav_shipyards_ironworks_desc: "Tradície stavby lodí, výroby ocele a spracovania železa sú v našich zemiach prítomné stáročia. Ako sa rozvíjajú nové techniky, musíme aktualizovať procesy. Aj najstaršie tradície musia prijať modernitu, aby zostali cenné." # todo: CHANGED
 nav_adept_traders: "Obratní obchodníci" # todo: NEW TRANSLATION
 nav_adept_traders_desc: "Kvalita našich lodí, zručnosť obchodníkov a efektivita výrobných procesov urobila náš obchod mimoriadne výnosným. Prílev bohatstva do krajiny nás posilní ako nikdy predtým." # todo: CHANGED
 nav_the_national_military_academy: "Národná vojenská akadémia" # todo: NEW TRANSLATION
 nav_the_national_military_academy_desc: "S profesionalizáciou armády je zrejmá potreba výcvikového strediska pre našich regrútov. Zriadime zbor skúsených vojakov, ktorí naučia základy vojny a vyformujú z regrútov špičku našej armády." # todo: CHANGED
 nav_royal_basque_society: "Kráľovská $basque$ spoločnosť" # todo: CHANGED
 nav_royal_basque_society_desc: " #italic Euskalerriaren Adiskideen Elkartea#!, Kráľovská $basque$ Spoločnosť priateľov krajiny, bola založená na podporu rozvoja $basque$ ekonomiky, kultúry a vedy. V nadchádzajúcich rokoch prinesie krajine veľký osoh." # todo: CHANGED
 nav_efficient_bureaucracy: "Efektívna byrokracia" # todo: NEW TRANSLATION
 nav_efficient_bureaucracy_desc: "Náš štát si udržiava byrokratické tradície od svojho vzniku, avšak meniace sa časy vyžadujú nové prístupy. $NAV$ získalo obdiv za pionierske administratívne inovácie." # todo: CHANGED
 nav_riflemen_march: "Pochod puškarov" # todo: NEW TRANSLATION
 nav_riflemen_march_desc: "Zavedenie pušiek do našich armád vyžadovalo nové prístupy k výcviku a disciplíne. Naši velitelia vyvinuli inovatívne pochodové formácie, ktoré sa stali slávnymi dôkazmi našej vojenskej spôsobilosti a sústredenia." # todo: CHANGED
 por_battle_ourique: "Bitka pri $ourique$" # todo: CHANGED
 por_battle_ourique_desc: "V roku 1139 naše statočné sily porazili päť maurských kráľov v bitke. Tento čin bude žiť naveky v pamäti našich vojakov a poslúži im ako inšpirácia poraziť akéhokoľvek nepriateľa, nech je akokoľvek mocný či vyzbrojený." # todo: CHANGED
 por_establishment_portuguese_navy: "Založenie $POR_ADJ$ námorníctva" # todo: CHANGED
 por_establishment_portuguese_navy_desc: "Kráľ Dinis položil základy $POR_ADJ$ námorníctva menovaním $GEN_ADJ$ obchodníka Manuela Pessanha, pôvodne Pessagno, za admirála národnej flotily. Pessanhove úlohy boli brániť pobrežie $POR_ADJ$ proti pirátskym nájazdom $muslim_ADJ$ a vytvoriť silnú obchodnú flotilu." # todo: CHANGED
 por_estimulate_rural_areas: "Podporiť vidiecke oblasti" # todo: NEW TRANSLATION
 por_estimulate_rural_areas_desc: "Mnohé miesta v krajine, predovšetkým vidiecke a odľahlé oblasti, sa vylidňujú, polia, lesy a bane upadajú do nečinnosti. Reformou príslušných aspektov právneho systému povzbudíme ľudí zostať na vidieku a obnoviť jeho produktivitu." # todo: CHANGED
 por_pursuing_waves: "V honbe za vlnami" # todo: NEW TRANSLATION
 por_pursuing_waves_desc: "Zdá sa, že zem nestačí pre časť populácie. Niektorí ľudia hľadia na more a cítia #italic saudade#!, akoby šlo o dlho stratenú lásku. Prístavy a doky sú plné nadšených námorníkov, ktorí sa zapisujú na plavby ako opojení túžbou objavovať svet. Veľmi využijeme týchto horlivých námorníkov." # todo: CHANGED
 por_bombardeiros: "Bombardeiros" # todo: NEW TRANSLATION
 por_bombardeiros_desc: "Technologické pokroky nám pomohli vyvinúť výrazne silnejšie dela, no paluby väčšiny lodí nedokážu uniesť ich hmotnosť. Posilnením lodí budeme schopní niesť viac munície a naše námorníctvo bude obávané pre hroziacu palebnú silu." # todo: CHANGED
 por_feitorias: "Feitorias" # todo: NEW TRANSLATION
 por_feitorias_desc: "Pošlime našich #italic feitors#! do všetkých kútov Východu a etablujme národ ako dominantnú obchodnú silu v $indian_ocean_region$. Vytvorením siete pevne opevnených obchodných staníc pozdĺž pobreží $africa$ a $india$ dokážeme dominovať miestnemu obchodu bez vynaloženia veľkých prostriedkov." # todo: CHANGED
 por_ordenancas: "Ordenanças" # todo: NEW TRANSLATION
 por_ordenancas_desc: "Náš štát potrebuje profesionálnu armádu na stráženie svätých hraníc našej veľkolepej ríše. Reforma odvodového systému a vycvičenie mladých regrútov sú nevyhnutné." # todo: CHANGED
 por_the_bandeirantes: "Podporiť bandeirantes" # todo: NEW TRANSLATION
 por_the_bandeirantes_desc: "Niekedy členovia výprav za zajatím otrokov narazia na zlato a iné drahé kovy či kamene. Rozšírenie informácií o takýchto objavoch by mohlo prilákať odvážnych duší ochotných emigrovať do našich kolónií a hľadať tam šťastie." # todo: CHANGED
 por_colonial_governors: "Koloniálni guvernéri" # todo: NEW TRANSLATION
 por_colonial_governors_desc: "Poslaním našich najschopnejších úradníkov vládnuť kolóniám a staniciam zabezpečíme, že tieto osady zostanú pokojné a verné materskej krajine, zatiaľ čo my budeme sledovať prúd ziskov." # todo: CHANGED
 por_royal_absolutism: "Kráľovský absolutizmus" # todo: NEW TRANSLATION
 por_royal_absolutism_desc: "Príliš dlho bola naša kráľovská autorita obmedzovaná nekonštruktívnym zásahom šľachty, ktorej lokálne záujmy ohrozujú všeobecné dobro. Ignorujeme Cortes úplne a budeme vládnuť bez ich zásahov." # todo: CHANGED
 por_royal_military_academy: "Kráľovská akadémia opevnenia, artilérie a kresby" # todo: CHANGED
 por_royal_military_academy_desc: "Náš delostrelecký zbor a opevnenia boli dlhodobo kľúčom k obrane našej krajiny, vďaka čomu je naša malá vlasť ťažko dobytiteľná pre nepriateľské armády. Zriadime vojenskú akadémiu — #italic Academia Real de Fortificação, Artilharia e Desenho#! — aby sme vycvičili našich dôstojníkov v týchto odboroch a tým premenili naše pevnosti a delostrelectvo na najlepšie na svete!" # todo: NEW TRANSLATION
 por_vinho_porto: "Vinho do $porto$" # todo: CHANGED
 por_vinho_porto_desc: "Na brehoch rieky Douro, na severe krajiny, sa pestujú hrozno na výrobu jedinečného $wine$ fortifikovaného destilátom, známeho ako #italic Port Wine#!. Keďže sme jediný národ produkujúcí tento lahodný nápoj, nesmieme nechať ujsť príležitosť zarobiť na jeho exporte veľké zisky." # todo: CHANGED
 spa_school_salamanca: "Škola $salamanca$" # todo: CHANGED
 spa_school_salamanca_desc: "So sídlom na univerzite v $salamanca$ sa záujmy školy rozsahujú od teológie, cez ekonomiku až po politickú filozofiu. Ako jedna z popredných škôl myšlienok vo $catholic_ADJ$ svete zaručuje naša prítomnosť v $SPA$, že krajina zostane na čele intelektuálnych otázok." # todo: CHANGED
 spa_viceroyalties: "$SPA_ADJ$ vicekráľovstvá" # todo: CHANGED
 spa_viceroyalties_desc: "Nové krajiny za oceánom na nás čakajú, aby sme ich obsadili. Rozdelíme toto územie a každú časť zveríme zástupcom vlády, ktorí založia usporiadané osady. Cieľom je urobiť tieto miesta atraktívnymi tak, aby sa naši ľudia usadili a upevnili tam našu prítomnosť." # todo: CHANGED
 spa_siglo_de_oro: "Siglo de Oro" # todo: NEW TRANSLATION
 spa_siglo_de_oro_desc: "Naša ríša prekypuje kultúrnymi a umeleckými úspechmi všetkých druhov. Ak správne nasmerujeme túto kreativitu a podporíme ju bohatými mecenášmi, spustíme skutočné Zlaté storočie $SPA_ADJ$ umenia." # todo: CHANGED
 spa_revival_of_ecclesiastical_discipline: "Obnova cirkevnej disciplíny" # todo: NEW TRANSLATION
 spa_revival_of_ecclesiastical_discipline_desc: "Náboženská laxnosť sa rozšírila medzi našimi ľuďmi a odvracia nás od Boha. Podpíšme zmluvy s náboženskými vodcami, aby sme posilnili väzbu medzi nimi a vládou a vrátili sa k úctivému štátu." # todo: CHANGED
 spa_naval_reforms: "$SPA_ADJ$ námorné reformy" # todo: CHANGED
 spa_naval_reforms_desc: "Námorníctvo sme neuprednostnili a v dôsledku toho zaostávame za konkurenciou v kvalite a výkone. Je potrebná reforma, ktorá nás znovu vynesie na právoplatné miesto námornej nadvlády." # todo: CHANGED
 spa_spanish_enlightenment: "$SPA_ADJ$ osvetlenstvo" # todo: CHANGED
 spa_spanish_enlightenment_desc: "Radikálne nové myšlienky prenikli do myslí vedúcich osobností $SPA$, inšpirujúc ich k ambicióznym plánom, ktoré nás vyčlenia medzi národy sveta." # todo: CHANGED
 tercio: "Terciá" # todo: CHANGED
 tercio_desc: "#italic Tercio#! pechota bola vyvinutá hlavne brilantným generálom Gonzalom Fernándezom de Córdoba, nazývaným #italic El Gran Capitán#! počas Talianskych vojen. Je to mix formácie kopijníkov a muškietierov. Vďaka tomuto kombinovanému prístupu formácia súčasne využíva rigiditu ťažkej pechoty a palebnú silu muškietierov z diaľky, čo ju robí ideálnou obrannou aj útočnou silou." # todo: CHANGED
 catalan_galley: "$CAT_ADJ$ galeje" # todo: CHANGED
 catalan_galley_desc: " $n_catalan_galley$ je väčšia verzia starovekých gréckych galejí, ktoré kedysi dominovali Stredozemiu." # todo: CHANGED
 early_iberian_caravel: "Raný $iberia_region_ADJ$ karavel" # todo: CHANGED
 early_iberian_caravel_desc: "Pôvodne z $iberia_region_ADJ$, prvé karavely boli malé, no veľmi rýchle lode používané na pobrežný rybolov a obchod. Ich používanie v $iberia$ je také rozšírené, že región sa môže hrdiť najpokročilejšími karavelami." # todo: CHANGED
 iberian_caravel: "$iberia_region_ADJ$ karavely" # todo: CHANGED
 iberian_caravel_desc: "Potrebа rýchlejších a spoľahlivejších karavel viedla našich staviteľov lodí k vylepšeniu konštrukcie. Kým karavely sú bežné po celom $europe$, $iberia_region_ADJ$ modely zostávajú nadpriemerne inovatívne a rýchle." # todo: CHANGED
 early_iberian_galleon: "Raný $iberia_region_ADJ$ galeón" # todo: CHANGED
 early_iberian_galleon_desc: "Raný, no mocný oceánsky plavec, $n_early_iberian_galleon$ je pôvodný vynález z $iberia$ s nižším zámkom kormidla a dlhým trupom, vďaka čomu sú obzvlášť stabilné a odolné proti čelnému vetru." # todo: CHANGED
 square_rigged_caravel: "Karavely so štvorplachtou" # todo: CHANGED
 square_rigged_caravel_desc: "Spojením $n_iberian_caravel$ a $n_carrack$ vznikla nová loď: rýchla, pevná a presne to, čo potrebujeme na ovládnutie morí." # todo: CHANGED
 iberian_galleon: "$iberia_region_ADJ$ galeóny" # todo: CHANGED
 iberian_galleon_desc: "$n_iberian_galleon$ je viac štýlizovaná verzia $n_early_iberian_galleon$. Sú to nesmierne silné plavidlá, ktoré zničia akúkoľvek opozíciu na otvorenom mori." # todo: CHANGED
 ara_almogavars: "$a_almogavars$" # todo: NEW TRANSLATION
 ara_almogavars_desc: "$a_almogavars_desc$" # todo: NEW TRANSLATION
 ara_catalan_crossbowmen: "$a_catalan_crossbowmen$" # todo: NEW TRANSLATION
 ara_catalan_crossbowmen_desc: "$a_catalan_crossbowmen_desc$" # todo: NEW TRANSLATION
 ara_late_almogavars: "$a_late_almogavars$" # todo: NEW TRANSLATION
 ara_late_almogavars_desc: "$a_late_almogavars_desc$" # todo: NEW TRANSLATION
 cas_lanzas_de_castilla: "$a_lanzas_de_castilla$" # todo: NEW TRANSLATION
 cas_lanzas_de_castilla_desc: "$a_lanzas_de_castilla_desc$" # todo: NEW TRANSLATION
 por_cacadores: "Caçadores" # todo: NEW TRANSLATION
 por_cacadores_desc: "Prezývaní #italic Fighting Cocks#!, #italic Caçadores#! sú elitná ľahká pechota v $POR_ADJ$ armáde, ktorá nosí hnedé uniformy na odlíšenie od bežných vojakov." # todo: CHANGED
 dan_levy_recruitment: "Spoliehanie sa na brancov" # todo: NEW TRANSLATION
 dan_levy_recruitment_desc: "Naše územie chráni prírodné bariéry, predovšetkým Jutský polostrov a $DAN_ADJ$ súostrovie. Táto obranná geografia nám veľmi pomáha pri útoku, pretože nám dáva čas zobrať ľudské zdroje skôr, než nepriateľ dosiahne naše jadro." # todo: CHANGED
 dan_old_naval_traditions: "$DAN_ADJ$ námorné siete" # todo: CHANGED
 dan_old_naval_traditions_desc: "Každá časť našej krajiny obklopená vodami Baltského a Severného mora. To nám dáva jedinečnú výhodu využívať vodné cesty pre dopravu a komunikáciu, čím výrazne skracuje dobu presunu medzi regiónmi." # todo: CHANGED
 dan_rulers_of_the_north: "Skutoční vládcovia severu" # todo: NEW TRANSLATION
 dan_rulers_of_the_north_desc: "Vládci $DAN$ si po stáročia nárokujú nadvládu nad severskými regiónmi. Prezentovanie odkazu kráľov ako Canute 'the Great' nám dodá vnútornú a vonkajšiu legitimitou potrebnú na podporu našich nárokov." # todo: CHANGED
 dan_reliance_mercenaries: "Spoliehanie sa na žoldnierov" # todo: NEW TRANSLATION
 dan_reliance_mercenaries_desc: "4DAN$ nemôže spoľahnúť na obrovskú populáciu na zásobovanie armád. Preto musíme zabezpečiť, aby žoldnierske spoločnosti boli ochotné slúžiť štátu a garantovať ich lojalitu pevnými zmluvami." # todo: CHANGED
 dan_rentekammer_advance: "Rentekammeret" # todo: NEW TRANSLATION
 dan_rentekammer_advance_desc: "Zriadením samostatného úradu pre našu pokladnicu, #italic Rentekammeret#!, budeme mať lepšiu kontrolu nad financiami a schopnosť efektívnejšie viesť vládu. S dokumentáciou všetkých finančných záznamov budeme ľahšie predvídať budúce výdavky a stabilizovať rozpočet." # todo: CHANGED
 dan_royal_danish_navy: "$DAN_ADJ$ štátne námorníctvo" # todo: CHANGED
 dan_royal_danish_navy_desc: "Naša krajina je obklopená vodami a preto je zraniteľná voči dominancii akejkoľvek mocnosti s veľkým loďstvom. Aby sa tomu zabránilo, musíme financovať flotilu schopnú chrániť naše pobrežie a projekovať moc do severného $europe$." # todo: CHANGED
 dan_danish_orthodoxy: "Náboženská jednotnosť" # todo: NEW TRANSLATION
 dan_danish_orthodoxy_desc: "V turbulentnom náboženskom obraze $europe$ musíme nastaviť $DAN$ na cestu správnosti a zostať verní doktrínam našej cirkvi." # todo: CHANGED
 dan_expanded_dockyards: "Sucháňa v $kobenhavn$" # todo: CHANGED
 dan_expanded_dockyards_desc: "Náš štát má dlhú a pyšnú históriu stavby lodí. Naši skúsení stavitelia potrebujú moderný a priestranný dok na stavbu námorníctva, ktoré môže hrdo niesť meno $DAN_ADJ$. Vody okolo $kobenhavn$ sú ideálnym miestom na jeho výstavbu." # todo: CHANGED
 dan_danish_legislation: "Dánska legislatíva" # todo: NEW TRANSLATION
 dan_danish_legislation_desc: "Regionálne zákony Jutska, Zélandu a Skánie tvorili základ nášho právneho kódexu storočia. V prospech ríše by sme mali tieto zákony zhromaždiť a zjednotiť do jedného komplexného systému známeho ako #italic Danske Lov#!." # todo: CHANGED
 dan_danish_agriculture: "Zameranie na poľnohospodárstvo" # todo: NEW TRANSLATION
 dan_danish_agriculture_desc: "Hoci je terén $DAN_ADJ$ relatívne chudobný na vzácne suroviny, nahrádza to poľnohospodárskou hojnosťou. Zameriame sa na optimalizáciu pestovania a potravinovej produkcie, aby sme zaistili obyvateľstvo pred budúcimi hladomormi." # todo: CHANGED
 dan_royal_life_guards: "Kráľovská garda" # todo: NEW TRANSLATION
 dan_royal_life_guards_desc: "Kráľovskí gardisti sú elitným $DAN_ADJ$ plukom, ktorý zároveň stráži panovníka a plní ceremoniálne povinnosti." # todo: CHANGED
 dan_scanian_regiment: "Skánsky pluk" # todo: NEW TRANSLATION
 dan_scanian_regiment_desc: "Skánsky pluk je vojenská jednotka zostavená z narukovaných roľníkov, zriadená na zníženie závislosti od žoldnierov a vytvorenie organizovanejšej stálaj armády pod priamou kráľovskou autoritou." # todo: NEW TRANSLATION
 dan_admiralty_college: "Kolegiát Admirality" # todo: NEW TRANSLATION
 dan_admiralty_college_desc: "Založením centralizovaného kolegia na výcvik námorných veliteľov budeme schopní vychovať skúsených vodcov oboznámených s našimi pobrežnými vodami. To zlepší námornú obranu a lepšie ochráni suverenitu $DAN_ADJ$." # todo: CHANGED
 dan_trading_economy: "Námorný národ" # todo: CHANGED
 dan_trading_economy_desc: "Nemôžeme vyrábať všetko, čo potrebujeme na ekonomickú stabilitu sami. Musíme sa spoľahnúť na stabilnú obchodnú sieť na vývoz našich tovarov a dovoz toho, čo sami nevyrábame." # todo: CHANGED
 ven_printing_industry: "Tlačiarenský priemysel" # todo: NEW TRANSLATION
 ven_printing_industry_desc: "Od vynálezu tlačiarenského lisu preukázali ľudia z $VEN$ nadanie pre jeho využitie. Mali by sme podporiť ďalší rozvoj nášho tlačiarenského priemyslu, pretože potenciálne výhody sú mnohé." # todo: CHANGED
 ven_stato_da_mar: "Stato da Mar" # todo: NEW TRANSLATION
 ven_stato_da_mar_desc: "Obchod je životnou krvou $VEN$ a kompetentné riadenie našich zámorských obchodných staníc je pre naše obchodné záujmy zásadné. Centralizovaním správy týchto území do jednej jednotky posilníme náš obchod." # todo: CHANGED
 ven_state_inquisition: "Založiť štátnu inkvizíciu" # todo: NEW TRANSLATION
 ven_state_inquisition_desc: "Štátna inkvizícia je trojčlenný senát sudcov zriadený na riešenie hrozieb vnútornému bezpečiu. Malý počet členov umožňuje rýchle konanie a čoskoro vytvoria sieť agentov doma i v zahraničí na odhalenie zradcov." # todo: CHANGED
 venetian_arsenal_advance: "$VEN_ADJ$ Arsenal" # todo: CHANGED
 venetian_arsenal_advance_desc: "Arzenál $VEN$, pochádzajúci z 12. storočia, je základom našej moci." # todo: CHANGED
 ven_venetian_thalassocracy: "$VEN_ADJ$ Talasokracia" # todo: CHANGED
 ven_venetian_thalassocracy_desc: "$VEN$ mal vždy blízky vzťah k moru. Obchod a komercia sú hlboko zakorenené v našej správe a $VEN_ADJ$ obchodníci majú prístup k väčším zdrojom než v ktoromkoľvek inom štáte." # todo: CHANGED
 ven_venetian_palaces: "$venetian_palaces$" # todo: NEW TRANSLATION
 ven_venetian_palaces_desc: "$venetian_palaces_desc$" # todo: NEW TRANSLATION
 ven_gothic_architecture: "Gotická architektúra" # todo: NEW TRANSLATION
 ven_gothic_architecture_desc: "Pod vplyvom $BYZ_ADJ$ architektúry a s náznakmi islamskej estetiky je jedinečný $ven_gothic_architecture$ jadrom $VEN_ADJ$ identity a obľúbený medzi vyššou triedou. Mnohí aristokrati a prosperujúci obchodníci podporujú šírenie tohto štýlu architektúrou svojím zlatom." # todo: CHANGED
 ven_ship_mounted_gunpowder_weapons: "Palné zbrane na lodiach" # todo: NEW TRANSLATION
 ven_ship_mounted_gunpowder_weapons_desc: "Námorné súboje boli po stáročia skôr pozemné bitky na plávajúcich doskách než priamy boj medzi loďami. Zavedením strelných zbraní na naše lode sa môžeme odtiahnuť od staromódneho spôsobu vedenia boja a zničiť nepriateľské plavidlá skôr, než sa priblížia na pristátie." # todo: CHANGED
 ven_magistrato_alla_sanita: "Magistrato alla Sanità" # todo: NEW TRANSLATION
 ven_magistrato_alla_sanita_desc: "#italic $ven_magistrato_alla_sanita$#! — Magistrát zdravia — je kľúčová úradná inštitúcia v našom štáte, ktorá dohliada na prevenciu chorôb a epidémií." # todo: CHANGED
 ven_venetian_painting: "$VEN_ADJ$ Maľba" # todo: CHANGED
 ven_venetian_painting_desc: "$ITA$ ako celok je preslávené svojimi kultúrnymi úspechmi a $VEN_ADJ$ maľba je jedným z jeho najväčších príspevkov. Umelecké osobnosti prichádzajú zďaleka, aby zažili naše nádherné galérie a boli svedkami nášho kultúrneho znovuzrodenia." # todo: CHANGED
 ven_venetian_school_of_music: "$VEN_ADJ$ Škola hudby" # todo: CHANGED
 ven_venetian_school_of_music_desc: "Kým naše maľby priťahujú milovníkov výtvarného umenia, $VEN_ADJ$ hudba putuje ďaleko a je obľúbená medzi tými, ktorí hľadajú melódické osvietenie. Mnohí významní skladatelia sa vyučia na našich konzervatóriách a nájdu veľký úspech po celej $europe$, šíriac našu kultúru každou zlatou notou." # todo: CHANGED
 ven_mixed_naval_tactics: "Kombinované námorné taktiky" # todo: NEW TRANSLATION
 ven_mixed_naval_tactics_desc: "Veslované plavidlá boli štandardom od vzniku $VEN_ADJ$ námorníctva. Avšak plachetnice teraz hrajú čoraz dominantnejšiu úlohu v Stredomorí. Naše námorníctvo sa prispôsobí prijatím mohutnej galeasy, hybridnej lode využívajúcej veslá aj plachty." # todo: CHANGED
 ven_naval_conscription: "Námorná branná povinnosť" # todo: NEW TRANSLATION
 ven_naval_conscription_desc: "Odkedy $VEN$ existuje, naše gály veslovali slobodní muži za mzdu, no akutný nedostatok pracovnej sily sťažuje nájsť kvalifikovaných veslárov. Nemáme inú možnosť než pristúpiť ku konštitučnému naverbovaniu pre posádky našich gál." # todo: CHANGED
 ven_provveditori_ai_beni_inculti: "'Provveditori ai Beni Inculti'" # todo: CHANGED
 ven_provveditori_ai_beni_inculti_desc: "Toto oddelenie pre neobrobené prírodné zdroje bolo zriadené na uľahčenie odvodňovania močiarov a zavlažovania suchých pôd. Konečným cieľom je zlepšiť zásobovanie potravou pre $VEN$." # todo: CHANGED
 cunning_diplomacy: "Prefíkaná diplomacia" # todo: NEW TRANSLATION
 cunning_diplomacy_desc: "Postavení medzi silnejšími nepriateľmi na oboch stranách si $WAL_ADJ$ vládcovia osvojili šikovnosť v preskupovaní spojenectiev, keď bolo rozumné. Niektorí si istotu trónu zaistili podporou $TUR_ADJ$, potom uzavreli spojenectvá s $HUN_ADJ$ alebo s $hre$." # todo: CHANGED
 boyar_regime: "Bojarský režim" # todo: NEW TRANSLATION
 boyar_regime_desc: "Dohoda z Alba Iulia upevnila moc $WAL_ADJ$ šľachty. Rada dvanástich vplyvných bojárov teraz pracuje spolu s #italic voivode#!, aby vykonávala výkonnú vládu krajiny." # todo: CHANGED
 home_of_hussars: "Domov husárov" # todo: NEW TRANSLATION
 home_of_hussars_desc: "Hoci formácie ľahkej jazdy sú starý pojem, prví balkánski husári — alebo #italic gusari#! — sa objavili ako pomocné jednotky $BYZ$, naverbovaní hlavne z $BYZ-ADJ$-drženého $serbia_region$ v 10. a 11. storočí. Aj po úpadku $BYZ-ADJ$ moci tradícia zostala a bola v nasledujúcich storočiach ďalej zdokonaľovaná." # todo: CHANGED
 serbian_mining: "$SER_ADJ$ Baníctvo" # todo: CHANGED
 serbian_mining_desc: "Balkánske hory sú plné rúd pripravených na ťažbu skúsenými baníkmi. Ako v iných častiach $eastern_europe$, $SER$ privítalo skúsených $SAX_ADJ$ baníkov na rozvoj baníctva. Mestá ako $novo_brdo$ vyrástli do veľkých metropol poháňaných bohatstvom vytiahnutým zo zeme." # todo: CHANGED
 mimic_the_phoenix: "Napodobniť Fénixa" # todo: NEW TRANSLATION
 mimic_the_phoenix_desc: "Nadšene prijímame spôsoby $BYZ$, snažiac sa napodobniť ich zákony a celkový štýl. Čerpajúc z bohatej rímskej tradície, usilujeme sa vlerovať našu správu a právny systém ich esenciou v snahe stvárniť v našom kráľovstve gráciu a sofistikovanosť $BYZ$." # todo: CHANGED
 rallying_the_troops: "Zvolanie vojsk" # todo: NEW TRANSLATION
 rallying_the_troops_desc: "Náš štát vyvinul rôzne metódy na rýchle zhromažďovanie vojska, takže nás žiadny nepriateľ nemôže prekvapiť nepripravených. Táto výhoda nám pomohla stáť pevne napriek zdanlivým nevýhodám; sme pripravení do boja. Jednotní ideme vpred, rozhodnutí brániť česť a vlasť!" # todo: CHANGED
 keepers_of_the_gate: "Strážcovia brány" # todo: NEW TRANSLATION
 keepers_of_the_gate_desc: "Drsné terény $SER$ dali vzniknúť mohutnej obranné sieti, stelesnenej impozantnou pevnosťou Smederevo. Tieto trvalé opevnenia chránia našu krajinu a robia inváziu znepokojujúcou perspektívou. Od horských masívov po strategické údolia riek stoja obrany $SER$ ako svedectvo našej odolnosti a nezlomného ducha." # todo: CHANGED
 poklisars: "Poklisars" # todo: NEW TRANSLATION
 poklisars_desc: "Od najskorších dní nášho štátu sme často hľadeli za hranice — či už za účelom výhodných obchodných ciest, udobrenia mocných susedov a budovania spojenectiev, alebo vytvorenia pevných partnerstiev proti spoločným nepriateľom. #italic Poklisars#! sú veľvyslanci, ktorí tieto misie vykonávajú v našom mene." # todo: CHANGED
 the_rebirth_of_the_patriarchate: "Obrodenie patriarchátu" # todo: NEW TRANSLATION
 the_rebirth_of_the_patriarchate_desc: "V 14. storočí Stefan Dušan usiloval povýšiť arcibiskupstvo $SER$ na patriarchát. Odvtedy sa naše duchovenstvo snaží byť nezávislé od $constantinople$, upevňujúc spojenie medzi pozemskou ríšou, naším národom a duchovným svetom." # todo: CHANGED
 reform_the_ecclesiastical_authorities: "Reforma cirkevných autorít" # todo: NEW TRANSLATION
 reform_the_ecclesiastical_authorities_desc: "$SER$ dlho stálo na križovatke východných a západných vplyvov, vrátane tých $orthodox_ADJ$ $christian_ADJ$ a $catholic_ADJ$ Cirkvi. Je čas vydať sa cestou cirkevných reforiem, posilniť naše náboženské inštitúcie a zabezpečiť duchovné blaho kráľovstva." # todo: CHANGED
 balkan_hajduks: "Balkánski hajduci" # todo: NEW TRANSLATION
 balkan_hajduks_desc: "Na rozdiel od $HUN_ADJ$ protějšků, #italic Hajduks#! v $SER$ a susedných balkánskych územiach si vyslúžili zlovestnú povesť. Títo muži vedú tvrdo život banditov, stále v ohrození, stále na pochode. Avšak počas vojen často zapĺňali rady $SER_ADJ$ armád svojou skúsenosťou a húževnatosťou, poskytujúc výbornú — hoci mierne nedisciplinovanú — pechotu." # todo: CHANGED
 foreign_relations_bureau: "Úrad pre zahraničné vzťahy" # todo: NEW TRANSLATION
 foreign_relations_bureau_desc: "Naša ríša si uvedomila dôležitosť budovania priateľských vzťahov a aliancií so susednými krajinami. Aby sme to uľahčili, zriadime špecializovaný úrad venovaný zahraničným záležitostiam. Udržiavaním sústredenia na diplomaciu budeme lepšie pripravení navigovať zložitú sieť medzinárodných vzťahov a zabezpečiť prosperitu národa." # todo: NEW TRANSLATION
 serbian_enlightenment: "$SER_ADJ$ Osvietenie" # todo: CHANGED
 serbian_enlightenment_desc: "Inšpirovaní myšlienkami Osvietenia sa naši národní hrdinovia, napríklad Dositej Obradović, usilovali pozdvihnúť náš hovorový jazyk a literatúru. Pohnutí nedostatkom sekulárnych diel pre obyčajných ľudí, Dositej Obradović viedol snahu premostiť priepasť medzi písaným a hovoreným $serbian_dialect$. Starostlivým tvorcom gramatík a slovníkov, písaním nových diel a prekladom cudzích prác podporujeme literárne oživenie vďaka práci týchto vizionárov." # todo: CHANGED
 military_modernization: "Vojenská modernizácia" # todo: NEW TRANSLATION
 military_modernization_desc: "Náš ľud si pamätá zrodenie nášho národa: obkolesení mocnými silami predstavujúcimi trvalé, hrozivé ohrozenia pre našu bezpečnosť. Táto trvalá ostražitosť vytvorila kultúru nekompromisnej pripravenosti, ktorá zabezpečuje, že naše ozbrojené sily stoja ako štít proti nepriazni. Nebojazní a rešpektovaní, naši vojaci z nás urobili nie korisť, ale mohutného protivníka, odrádzajúceho každého, kto by porušil našu suverenitu." # todo: CHANGED
 seljuk_heritage: "Seldžucké dedičstvo" # todo: NEW TRANSLATION
 seljuk_heritage_desc: "Aby sme prijali budúcnosť, musíme si pamätať, čo sme sa naučili od $IRA$ a Veľkých Seldžukov, a budovať štát, ktorý dokáže zjednotiť rozdielne národy a vierovyznania do väčšieho celku." # todo: CHANGED
 turkic_traditions: "Turkické tradície" # todo: NEW TRANSLATION
 turkic_traditions_desc: "Pochádzame z stepí. Vietor, ťažkosti a vzrušenie z bitky budú vždy v našej krvi a nesmieme na to nikdy zabudnúť." # todo: CHANGED
 millets: "Kanunnamy" # todo: NEW TRANSLATION
 millets_desc: "Zriadením jedinečných právnych kódov v každej provincii nášho impéria môžeme zabezpečiť, aby naše panovanie bolo vnímané ako spravodlivé a rovnoprávne. Tieto právne knižnice, známe ako #italic Kanunname#!, zohľadnia miestne okolnosti a tradície v každej z našich rozmanitých a rozsiahlych provincií." # todo: CHANGED
 ghazi: "Ghazi" # todo: NEW TRANSLATION
 ghazi_desc: "V súlade s stepnými tradíciami sú naši šľachtici bojovníkmi hranice a staneme sa nebojácnymi v boji za rozšírenie Obydlia $muslim$." # todo: CHANGED
 azeb_irregulars: "Azeb nepravidelníci" # todo: NEW TRANSLATION
 azeb_irregulars_desc: "Nezadaní mladí muži povolaní z najchudobnejších vrstiev spoločnosti, Azebovia nebudú slúžiť len ako vojaci a námorníci, ale aj ako stavitelia, saperi a zbrojármi. Prostredníctvom systému posádok vo vybudovaných pevnostiach zabezpečíme, že budú vždy platení." # todo: NEW TRANSLATION
 bashi_bazouks: "Bashi-bazouks" # todo: NEW TRANSLATION
 bashi_bazouks_desc: "Nevládní nepravidelní vojaci naverbovaní z marginalizovaných skupín obyvateľstva, niekedy priam vandali, #italic bashi-bazouks#! sú lacným spôsobom posádkovania pevností a výpostí. S ich sklonmi k lupičstvu a bezohľadnému zabíjaniu ich možno vždy spoľahnúť, že narobia zmätok na fronte nepriateľa." # todo: CHANGED
 ottoman_bureaucracy: "Birûn" # todo: NEW TRANSLATION
 ottoman_bureaucracy_desc: "#italic Birûn#!, čiže Exteriérová služba, tvorí skupinu administrátorov, vojenských dôstojníkov a náboženských učencov mimo osobného blízkeho kruhu vládcu. Spoločne tvoria efektívnu byrokraciu zdedenú po $IRA$ a Veľkých Seldžukoch, ďalej adaptovanú prvkami z $BYZ$, čím je skutočne jedinečne $TUR_ADJ$." # todo: CHANGED
 ahdnames: "Ahidnâme" # todo: NEW TRANSLATION
 ahdnames_desc: "Nazývané tiež kapitulačné listiny, $ahdnames$ sú zmluvné dohody s inými štátmi čerpajúce z $muslim_ADJ$ i sekulárneho práva. $ahdnames$ sa najčastejšie používajú na garantovanie ochrany a práv zahraničných obchodníkov a klerikov v našich krajinách, zabezpečujúc, že spravodlivosť je zachovaná a obchod môže plynúť bez prekážok." # todo: CHANGED
 dragomans: "Dragomans" # todo: NEW TRANSLATION
 dragomans_desc: "Prekladatelia, tlmočníci a sprievodcovia v jednom, $dragomans$ sú skúsení úradníci pracujúci na zlepšení našich diplomatických a obchodných vzťahov s rôznymi komunitami a krajinami. Väčšina dragománov pochádza z $greek_culture$, hoci niektorí sú z $jewish_ADJ$, $armenian_culture$ alebo iných viacjazyčných prostredí." # todo: CHANGED
 kafes: "Kafes" # todo: NEW TRANSLATION
 kafes_desc: "Umiestnením našich nezvládnuteľných princov do špeciálnej časti harému, $kafes$, môžeme zabrániť bezduchým povstaniam a rivalite medzi bratmi, ktorá kedysi sužovala náš režim." # todo: NEW TRANSLATION
 timariots: "Timarioti" # todo: NEW TRANSLATION
 timariots_desc: "Poskytovaním timarových pozemkov jazdcom Sipâhi im umožníme používať tento nový štátom podporovaný majetok na zabezpečenie seba a svojho družstva. To nám umožní nasadiť viac mohutných jazdeckých síl." # todo: NEW TRANSLATION
 autonomous_pashas: "Autonómni pašovia" # todo: NEW TRANSLATION
 autonomous_pashas_desc: "Vyváženie miestnych potrieb proti národným záujmom je jedným z najťažších aspektov vlády. Vzhľadom na pomalé tempo komunikácie môže trvať dlho, kým základné dekréty dorazia aj do relatívne blízkych provinciach. Musíme podporiť väčšiu autonómiu miestnych guvernérů, aby sa zabezpečilo, že miestne záujmy budú riešené včas." # todo: CHANGED
 lawcode_of_suleiman: "Zákonník Suleimana" # todo: NEW TRANSLATION
 lawcode_of_suleiman_desc: "Sulejman je zapamätaný ako jeden z veľkých vládcov histórie, vojak, zákonodarca a reformátor. Zatiaľ čo Západ pozná ho ako Sulejmana Nádherného, v jeho rodnej krajine ho volajú 'Zákonodarca'. Centrom jeho reforiem bolo prehodnotenie $TUR_ADJ$ dynastického práva, #italic Kanun#!, aby ho zosúladil so $sharia$." # todo: CHANGED
 ottoman_tax_farming: "Muqāta'ah" # todo: NEW TRANSLATION
 ottoman_tax_farming_desc: "Systém daňového farmárčenia, kde šľachtici nakupujú právo vyberať príjmy z parciel štátnej pôdy. $ottoman_tax_farming$ vyrovnáva rozdeľovanie bohatstva v impériu a odvracia šľachtu od korupcie, čím im dáva záujem podporovať štát." # todo: CHANGED
 ottoman_waystations: "Menzil" # todo: NEW TRANSLATION
 ottoman_waystations_desc: "Komplexný systém zásobovacích dep a ubytovní pre vojakov a úradníkov, #italic menzil#! waystations umožňujú našim armádam menej spoliehať sa na drancovanie a zostať dobre zásobené na každej hranici." # todo: CHANGED
 late_ottoman_bureaucracy: "Mālīye" # todo: NEW TRANSLATION
 late_ottoman_bureaucracy_desc: "Obrovská, rozmanitá a vysoko organizovaná byrokracia obsadená najzručnejšími pisármi, $late_ottoman_bureaucracy$ usiluje byť fundamentálnou a nekompromisnou inštitúciou štátu." # todo: NEW TRANSLATION
 tulip_period: "Obdobie tulipánov" # todo: NEW TRANSLATION
 tulip_period_desc: "Zreformujeme staré a stagnujúce tradície, zasadíme tulipány do všetkých záhrad a uvedieme novú zlatú éru obchodu a prepojení." # todo: CHANGED
 imperial_school_of_naval_engineering: "Cisárska škola námorného inžinierstva" # todo: NEW TRANSLATION
 imperial_school_of_naval_engineering_desc: "Táto nová škola, #italic Mühendishane-i Bahr-i Hümâyûn#!, nám pomôže vzdelávať staviteľov lodí, námorných dôstojníkov a námorníkov pre námorníctvo i obchodnú flotilu." # todo: CHANGED
 ayans: "Âyan" # todo: NEW TRANSLATION
 ayans_desc: "$ayans$ sú provinční magnáti rôzneho pôvodu, ktorí vykazujú značnú miestnu autonómiu, ale zároveň poskytujú pripravený zdroj príjmov z daňového farmingu a vojenských síl pre štát." # todo: NEW TRANSLATION
 french_language_in_all_courts: "$french_language$ Jazyk na všetkých dvoroch" # todo: CHANGED
 french_language_in_all_courts_desc: "Dlhú dobu bol $latin_language$ jazykom kultúrnej výmeny v $europe$... ale úprimne povedané, tento jazyk je takmer mŕtvy ako starovekí Rimania, ktorí ním hovorili. Potrebujeme nový #italic lingua franca#! a nič neznamená 'lingua franca' viac než $french_language$." # todo: CHANGED
 elan: "Élan!" # todo: NEW TRANSLATION
 elan_desc: "Kultivovanie doktríny útoku je charakteristickým znakom našej armády. Naši muži musia bojovať s #italic élan#! — duchom a vervou — čo nám dáva jasnú výhodu na bojisku." # todo: CHANGED
 estates_general: "Stavy" # todo: CHANGED
 estates_general_desc: "Podľa niektorých existujú Stavy od roku 1303. V priebehu času sa ich forma presunula z rady menovaných kráľovských zástupcov na zvolených zástupcov. Táto zmena štruktúry dala Stavom a daniam, ktoré uvalia, väčšiu legitimitu." # todo: CHANGED
 fra_gendarmes: "Gendarmérske družiny" # todo: NEW TRANSLATION
 fra_gendarmes_desc: "Spoluúčasť na odvode odhalila veľké riziká a ukázala sa ako obmedzujúca. Mali by sme verbovať ťažko vyzbrojenú jazdu a platiť im pevný plat, aby sme vytvorili stály vojenský zbor." # todo: CHANGED
 fra_integration_of_new_territories: "Konsolidácia krajiny" # todo: NEW TRANSLATION
 fra_integration_of_new_territories_desc: "Náš vplyv nad inými štátmi je nepopierateľný. Prečo ho nevyužiť a inkorporovať tieto štáty priamo do nášho kráľovstva?" # todo: CHANGED
 fra_reliance_on_privateers: "Spoliehanie sa na korzárov" # todo: NEW TRANSLATION
 fra_reliance_on_privateers_desc: "Priama konkurencia s inými námornými mocnosťami by mohla byť pre naše financie škodlivá. Mali by sme posilniť našu obchodnú flotilu, aby lúpežne zabavovala a zajímala obchodné lode nepriateľov. To nielenže zabezpečí zdravý príjem pre štát, ale tiež naruší námorné hospodárstva našich rivalov." # todo: CHANGED
 fra_reformation_of_taxation: "Zriadenie Recettes Générales" # todo: NEW TRANSLATION
 fra_reformation_of_taxation_desc: "Intendanti zodpovední za výber daní obyvateľstva nebudú menovaní stavmi, ale priamo naším panovníkom. Tým zabezpečíme, že títo úradníci budú lojálni len panovníkovi a zhromaždia všetky oprávnené výnosy." # todo: CHANGED
 fra_school_of_fontainebleau: "Severný manierizmus" # todo: NEW TRANSLATION
 fra_school_of_fontainebleau_desc: "Ako národ bohatý na $renaissance$ by sme mali investovať do vytvorenia jedinečnej, výrazne $FRA_ADJ$ estetiky. Pozývaním zahraničných umelcov do našich krajín a sponzorovaním školy pre umelecké vzdelávanie budeme schopní označiť umelecké diela ako nezameniteľne $FRA_ADJ$." # todo: CHANGED
 vauban_fortifications: "Inovatívne opevnenia" # todo: NEW TRANSLATION
 vauban_fortifications_desc: "Náš génius v opevňovaní nie je radikálnym odklonom v dizajne; inovácie spočívajú predovšetkým v umiestnení pevností. Využitím terénu na maximum aj základné pevnosti vyžadujú väčšie úsilie a zásoby na dobytie." # todo: CHANGED
 the_philosophes: "Filozofi" # todo: NEW TRANSLATION
 the_philosophes_desc: "S hrdosťou sme doma toľkých najuznávanejších filozofov týchto osvietených čias. Títo myslitelia vytvárajú stálu vlnu prelomových myšlienok, ktoré stimulujú pokrok vo všetkých oblastiach, od banálnych až po životne dôležité." # todo: CHANGED
 fra_expansion_of_france: "Historické nároky" # todo: CHANGED
 fra_expansion_of_france_desc: "Sledujeme línie nášho národa späť k Charlemagneovmu impériu a môžeme preto nároky týchto krajín považovať za súčasť nášho právoplatného územia. S podporou odhodlaných súdov budeme schopní identifikovať a znovu dobyť všetky tieto dlhé územia." # todo: CHANGED
 liberty_egalite_fraternity: "Sloboda, rovnosť, bratstvo" # todo: NEW TRANSLATION
 liberty_egalite_fraternity_desc: "Keď sú všetci muži vyhlásení za rovnakých podľa našich nových zákonov, prívrženci iných vier budú konečne povolaní plne sa zúčastňovať na našej vláde a prispieť k nášmu národnému pokroku." # todo: CHANGED
 fra_code_civil: "Občiansky kódex" # todo: NEW TRANSLATION
 fra_code_civil_desc: "Musíme nahradiť chaotický guláš zákonov vládnucich nášmu štátu jedným, jednotným právnym kódexom, ktorý sa bude vzťahovať na celé obyvateľstvo. Tento #italic Code Civil#! bude základom našej vlády a ustanoví spravodlivý systém pre každého v našom kráľovstve." # todo: CHANGED
 magna_carta_advance: "$magna_carta_reform$" # todo: NEW TRANSLATION
 magna_carta_advance_desc: "$magna_carta_reform_desc$" # todo: NEW TRANSLATION
 royal_navy: "Kráľovské námorníctvo" # todo: NEW TRANSLATION
 royal_navy_desc: "Okolo roku 1495 investovala monarchia $tudor_dynasty$ výrazne nie len do lodí, ale aj do rozsiahlej infraštruktúry na ich údržbu. To mnohí považujú za oficiálne založenie Kráľovského námorníctva." # todo: CHANGED
 eltham_ordinance: "Nariadenie z Elthamu" # todo: NEW TRANSLATION
 eltham_ordinance_desc: "Elthamské nariadenia predstavovali prvý pokus $ENG$ o zefektívnenie kráľovskej byrokracie a jej urobienie adaptabilnejšou a nákladovo efektívnejšou. Ordinancie sa pokúsili o reformu znížením výdavkov kráľovského domu a konsolidáciou niektorých byrokratických funkcií." # todo: CHANGED
 secretaries_of_state: "Štátni tajomníci" # todo: NEW TRANSLATION
 secretaries_of_state_desc: "Panovník mal vždy sekretára zodpovedného za kráľovskú korešpondenciu. Táto pozícia sa postupne vyvinula do funkcie Tajomníka štátu, mocného ministra, ktorý nielen sprostredkováva kráľovské dekréty, ale má aj vysokú úroveň administratívnej moci." # todo: CHANGED
 navigation_acts: "Navigačné akty" # todo: NEW TRANSLATION
 navigation_acts_desc: "Tieto akty predstavujú vrchol merkantilizmu. Obchod musí byť vykonávaný našimi loďami a prejsť najprv našimi prístavmi, kde budeme vyberať colné poplatky a ostatné dane." # todo: CHANGED
 eng_red_coats: "Červené kabáty" # todo: NEW TRANSLATION
 eng_red_coats_desc: "Život v $ENG_ADJ$ armáde je namáhavý a prísne organizovaný, ale formuje charakter. Nepoddajnú povahu našich vojsk, ako aj ich zručnosť so strelnými zbraňami, sa neboja naši nepriatelia." # todo: CHANGED
 eng_experimental_riflemen: "$a_experimental_riflemen$" # todo: NEW TRANSLATION
 eng_experimental_riflemen_desc: "$a_experimental_riflemen_desc$" # todo: NEW TRANSLATION
 sick_and_hurt_board: "Rada pre chorých a ranených" # todo: NEW TRANSLATION
 sick_and_hurt_board_desc: "Táto inštitúcia sa starala o blahobyt bežných námorníkov v Kráľovskom námorníctve. Zaviedla sériu reforiem, ktoré výrazne zlepšili zdravie námorníkov pri službe." # todo: CHANGED
 british_bill_of_rights: "$ENG_ADJ$ Charta práv" # todo: CHANGED
 british_bill_of_rights_desc: "Široká séria reforiem obmedzujúcich kráľovskú moc, najmä v justičných otázkach. Medzi inými ustanoveniami ustanavujú, že panovník nemôže jednotne zvyšovať armády, predpisovať kruté a nezvyčajné tresty ani zasahovať do slobodných volieb členov Parlamentu." # todo: CHANGED
 defense_of_the_faith: "Obrana viery" # todo: NEW TRANSLATION
 defense_of_the_faith_desc: "Boli sme vyhnaní z $acre$ a $CYP$, ale Rád Špitálnych rytierov sa už viac neodstúpi. V pohanskom čase stál Kolos na stráži v prístave Rodosu, dnes však najväčšie opevnenia, aké svet kedy videl, preberajú stráž!" # todo: CHANGED
 assistance_to_the_suffering: "Pomoc trpiacim" # todo: NEW TRANSLATION
 assistance_to_the_suffering_desc: "Náš Rád sa volá Rytieri špitála z dôvodu: pôvodne sme boli ochrannou silou pútnického špitála v $jerusalem$. Hoci $jerusalem$ je stratený pre Saracénov, stále poskytujeme lekársku pomoc potrebným, vrátane našich statočných rytierov, ktorí sa na bojiská vracajú oveľa rýchlejšie než väčšina armád." # todo: CHANGED
 reconquista_of_the_sea: "Rekonkvista mora" # todo: NEW TRANSLATION
 reconquista_of_the_sea_desc: "Pri častých stretách s cudzími korzármi sme dospeli k názoru, že títo šmejdi môžu mať pravdu v lúpení pobrežia, len si vybrali nesprávne ciele. Pirátstvo je hanebný hriech v čase mieru, no v čase vojny ho nazývame 'privatérstvo' — a to je už iná vec." # todo: CHANGED
 friends_in_need: "Priatelia v núdzi" # todo: NEW TRANSLATION
 friends_in_need_desc: "Náš Rád bol založený vernými dušami z každej krajiny kresťanstva. Táto skutočnosť spolu s našou potrebou vonkajšej podpory pre plnenie misií nás naučila verbovať pomocné ruky pre našu vec. Využijeme našu prítomnosť po celom $europe$, aby sme oslovili mocných $catholic_adj$ vládcov a získali ich na našu stranu." # todo: CHANGED
 scourge_of_the_corsairs: "Mor korzárov" # todo: NEW TRANSLATION
 scourge_of_the_corsairs_desc: "Preslávilý $turkish_culture$ privatér Hayreddin Barbarossa zviedol mnoho legendárnych súbojov s Rytiermi, ale nebol jediným korzárom, ktorého stretnutie sme mali. $turkish_culture$ nájazdy a drancovanie južného $europe$, tolerované Barbarskými štátmi a financované Turkami, musia skončiť. Rytieri urobia svoju prácu a ochránia nevinných námorníkov za každú cenu." # todo: CHANGED
 crusader_tradition: "Tradícia križiakov" # todo: NEW TRANSLATION
 crusader_tradition_desc: "Rytieri nášho Rádu bojovali proti Saladínovi a bránili posledný križiacky výbeh, $acre$. Kto potrebuje inšpiráciu k hrdinským skutkom, nech sa pozrie na činy Rytierov Rádu špitála. Meno Rytieri špitála je naozaj večné, rovnako ako naša odvážnosť v bitke." # todo: CHANGED
 ecumenical_defenders_of_christendom: "Ekumenickí obrancovia kresťanstva" # todo: NEW TRANSLATION
 ecumenical_defenders_of_christendom_desc: "Reformácia uškodila našej veci, keď rytieri z $GER$ a $scandinavian_region$ začali klásť otázky o povahe Sviatosti, no všadeprítomná hrozba $turkic_group$ má zvyk robiť z týchto sporov malé problémy. Možno by sme sa mali sústrediť na obranu a teologické debaty nechať na potom, keď bude Saracénska hrozba zažehnaná?" # todo: CHANGED
 a_neverending_crusade: "Nikdy nekončiaca križiacka výprava" # todo: CHANGED
 a_neverending_crusade_desc: "Kým bude akýkoľvek verný $catholic_ADJ$ vystavený náboženskému prenasledovaniu, naša misia nie je u konca! Či už pri púti k Hrobu Pána, alebo pri preplavovaní morí a odpieraní korzárom, nikdy neprestaneme cvičiť a nikdy nezazrieme odpočinku, pripravení skočiť do boja v okamihu." # todo: CHANGED
 inspired_builders: "Inšpirovaní stavitelia" # todo: NEW TRANSLATION
 inspired_builders_desc: "Hoci hlavným povolaním nášho Rádu je boj, slúžime ľudu aj inými spôsobmi. Po stáročia sme rozvinuli umenie rýchlej výstavby, stavaním budov a opevnení s pozoruhodnou rýchlosťou. Túto odbornosť použijeme na prerobenie nášho hlavného mesta na nedobytnú pevnosť a zároveň dynamické centrum kultúry." # todo: CHANGED
 the_right_hand_pope: "Pravá ruka pápeža" # todo: NEW TRANSLATION
 the_right_hand_pope_desc: "Ako čas plynie a križiacke výpravy sa stávajú vzdialenou spomienkou, dôležitosť mať pápeža pri srdci rastie. Získame si jeho priazeň a staneme sa jeho najdôvernejšími radcami. Naša oddanosť jeho službe nám prirodzene prinesie veľké výhody — prečo si ich teda neužiť?" # todo: CHANGED
 a_brand_new_world: "Úplne nový svet" # todo: NEW TRANSLATION
 a_brand_new_world_desc: "Svet sa mení a tí, ktorí sa neprispôsobia, budú zabudnutí históriou. Náš Rád pretrval viac než pol tisícročia a teraz nezmizne! Naše smrteľné telá raz odídu, no náš Rád musí najprv dosiahnuť nesmrteľnosť. Premeníme sa na najmodernejší štát našej doby a posilníme sa v samotnom jadre." # todo: CHANGED
 an_order_with_state: "Rád s vlastným štátom" # todo: NEW TRANSLATION
 an_order_with_state_desc: "Kým niektoré národy sú popisované ako #italic Armáda s štátom#!, my sme vždy boli Rád s národom, odkedy sme získali Rodos od Grékov. Napriek tomu obdivujeme efektívnosť, s akou oni využili svoje zdroje k staniu sa mocným štátom. Inšpirovaní ich úspechom zavedieme reformy, aby naša armáda mohla čeliť akémukoľvek nepriateľovi s istotou." # todo: CHANGED
 local_merchant_preference: "Preferencia miestnych obchodníkov" # todo: NEW TRANSLATION
 local_merchant_preference_desc: "Teoreticky môže byť obchodník občanom sveta, plaviac sa do ktoréhokoľvek prístavu, ktorý mu vyhovuje. My však dáme výhody domácim obchodníkom, napríklad prednosť pri nakladaní a vykladaní nákladu, aby sme zabezpečili, že naši obchodníci majú všetky stimuly privádzať svoje tovary domov." # todo: NEW TRANSLATION
 association_with_unbelievers: "Stýkanie sa s nevercami" # todo: NEW TRANSLATION
 association_with_unbelievers_desc: "Sú ľudia, ktorí cítia, že by sme sa s nevercami vôbec nemali stýkať. My sme urobili veľa pre to, aby sme tomu zabránili, lebo len cez styky s pohanskými národmi sa s nimi budeme môcť obchodovať." # todo: CHANGED
 port_security_improvement: "Zlepšenie bezpečnosti prístavov" # todo: NEW TRANSLATION
 port_security_improvement_desc: "Aby sme získali plný finančný úžitok z obchodu, potrebujeme lode a ich náklad bezpečné v našich prístavoch. Musíme zabezpečiť, aby oblasti, kde sa obchodníci schádzajú, boli bez drobnej kriminality." # todo: CHANGED
 end_of_shipbuilding_guilds: "Zánik cechov staviteľov lodí" # todo: NEW TRANSLATION
 end_of_shipbuilding_guilds_desc: "Kým sa v $arabia$ stavali lode, existovali cechy kontrolujúce výrobu. Hoci poskytovali cennú službu pri uchovaní tradícií stavby lodí, teraz bránia pokroku. Musíme otvoriť lodársky priemysel pre každého, kto má talent." # todo: CHANGED
 skilled_captains: "Zruční kapitáni" # todo: NEW TRANSLATION
 skilled_captains_desc: "Musíme zabezpečiť, aby naši kapitáni spĺňali najvyššie štandardy námornej zručnosti a znalostí, aby vedeli využiť každú výhodu v každej situácii." # todo: CHANGED
 expansion_of_trade_contacts: "Rozšírenie obchodných kontaktov" # todo: NEW TRANSLATION
 expansion_of_trade_contacts_desc: "Musíme zabezpečiť, aby naši obchodníci boli vždy vítaní kdekoľvek pôjdu. Preto použijeme všetky dostupné prostriedky, aby sme všetkých panovníkov, ktorých poznáme, presvedčili privítať našich obchodníkov." # todo: CHANGED
 unlock_gallowglass_advance: "$a_gallowglass$" # todo: NEW TRANSLATION
 unlock_gallowglass_advance_desc: "$a_gallowglass_desc$" # todo: NEW TRANSLATION
 unlock_reformed_gallowglass_advance: "$a_reformed_gallowglass$" # todo: NEW TRANSLATION
 unlock_reformed_gallowglass_advance_desc: "$a_reformed_gallowglass_desc$" # todo: NEW TRANSLATION
 unlock_late_gallowglass_advance: "$a_late_gallowglass$" # todo: NEW TRANSLATION
 unlock_late_gallowglass_advance_desc: "$a_late_gallowglass_desc$" # todo: NEW TRANSLATION
 scottish_salmon: "$SCO_ADJ$ Ochrana lososov" # todo: CHANGED
 scottish_salmon_desc: "Naše rieky a pobrežia sú bohaté na lososy. S opatrnou starostlivosťou a prísnou legislatívou dokážeme tento zdroj využiť a formovať našu lokálnu ekonomiku smerom na export tohto žiadaného druhu rýb." # todo: CHANGED
 scottish_morale: "$SCO_ADJ$ Odvaha" # todo: CHANGED
 scottish_morale_desc: "Od začiatku našej vojny proti $ENG_ADJ$ tyranii sme si udržali nezávislosť vďaka statočným snahám odvážneho $SCO_ADJ$ ľudu. Pamiatka na statočných mužov ako William Wallace bude motivovať naše armády brániť a chrániť $SCO_ADJ$ nezávislosť navždy!" # todo: CHANGED
 scottish_longbowmen: "$ENG_ADJ$-$SCO_ADJ$ Dlhí lukostrelci" # todo: CHANGED
 scottish_longbowmen_desc: "Keďže naše väzby s $ENG$ boli posilnené, zakomponujeme niektoré ich vojenské taktiky a premeníme naše jednotky na hrozivé sily." # todo: CHANGED
 peel_towers_advance: "Peelove veže" # todo: NEW TRANSLATION
 peel_towers_advance_desc: "Peelove veže boli vyvinuté na zmiernenie nebezpečenstiev života v pohraničných oblastiach. Slúžia ako ochrana proti vpádom nepriateľských lúpežných družín, poskytujúc útočisko pre ľudí a cenný dobytok a sú rýchlym spôsobom, ako upozorniť susedné mestá svetlicami na blížiace sa armády." # todo: CHANGED
 scottish_tenacity: "Vytrvalá krajina" # todo: NEW TRANSLATION
 scottish_tenacity_desc: "Vojna môže byť dlhá a vyčerpávajúca. Ak chceme brániť nezávislosť, musíme byť pripravení znášať ťažké časy. Naše obyvateľstvo je odolné ako zem, ktorú volajú domov, a odoláva cudzincom až do posledného dychu." # todo: CHANGED
 influx_of_english_nobles: "$ENG_ADJ$ Administrátori" # todo: CHANGED
 influx_of_english_nobles_desc: "Zabezpečenie pokoja s naším južným susedom viedlo k stálemu prílevu $ENG_ADJ$ aristokratov do našej správy. To nám umožňuje efektívnejšie uplatňovať kontrolu nad krajinou." # todo: CHANGED
 scottish_trade_connections: "$north_sea$ Obchodné prepojenia" # todo: CHANGED
 scottish_trade_connections_desc: "Naša krajina leží na okraji $western_europe$ a hojne postráda zdroje. Ak chceme ekonomicky prosperovať, musíme investovať a rozšíriť naše obchodné spojenia do ďalších regiónov. Oblasť $north_sea_area$ nás môže spojiť s bohatými trhmi a obchodnými príležitosťami, ak sa naučíme využiť jej potenciál." # todo: CHANGED
 comets: "Kométy?" # todo: NEW TRANSLATION
 comets_desc: "Nedávno sme získali celkom zvláštnu knihu. Volá sa #italic On the True Significance of Comets against the Vanity of Astrologers#! a je plná dôležitých informácií o týchto podozrivých telesách. Rozhodli sme, že všetci v kráľovstve by mali poznať jej obsah." # todo: CHANGED
 modernized_royal_scots_navy: "Kráľovské škótske námorníctvo" # todo: NEW TRANSLATION
 modernized_royal_scots_navy_desc: "Od vojen za nezávislosť sme plánovali posilniť a modernizovať naše námorníctvo. Predtým sme využívali feudálne povinnosti na doplnenie posádok a lodí, teraz však vytvoríme modernú flotilu vlastnenú kráľom a založenú v našom prístave Newhaven." # todo: CHANGED
 royal_revenue: "Zabezpečiť kráľovské príjmy" # todo: CHANGED
 royal_revenue_desc: "Ak má $SCO$ pokračovať v samostatnom bytiu, musíme zabezpečiť stabilné zdroje príjmov. Sprísnením kontroly nad povinnosťami, ktoré nám dlhujú kráľovské statky a feudálne vlastníctva, môžeme zvýšiť naše právoplatné dane. Týmito metódami zabezpečíme, že Koruna bude mať dostatočné prostriedky uplatňovať svoju vôľu bez závislosti na iných zdrojoch." # todo: CHANGED
 scottish_education: "$SCO_ADJ$ Univerzity" # todo: CHANGED
 scottish_education_desc: "Po rokoch posielania našich najbystrejších študentov do zahraničných univerzít je čas zlepšiť domáce vzdelávanie a poskytnúť miesto v $SCO$, kde sa môžu rozvíjať najväčšie mysle našej krajiny. Náš ľud by mal usilovať získať cenné poznatky a zručnosti doma namiesto plytvania času a peňazí na zahraničné inštitúcie." # todo: CHANGED
 act_of_revocation: "Akt revokácie" # todo: NEW TRANSLATION
 act_of_revocation_desc: "Dlhodobo bolo zvykom darovať časti kráľovskej domény našej šľachte ako odmenu za služby, no tento systém nie je udržateľný, ak chceme zachovať integritu domény. Odteraz budeme trvať na prenájme týchto pozemkov namiesto ich trvalého darovania." # todo: CHANGED
 scottish_diplomacy: "Spoľahlivé spojenectvo" # todo: CHANGED
 scottish_diplomacy_desc: "Storočia sme sa spoliehali na diplomaciu a kontakt s kontinentálnymi mocnosťami, aby sme si zabezpečili nezávislosť. Je čas túto prax formalizovať a zafixovať trvanie našich väzieb na stáročia." # todo: CHANGED
 scottish_highlander_advance: "Zriadiť horalské pluky" # todo: NEW TRANSLATION
 scottish_highlander_advance_desc: "Nábaľovanie plukov z ľudí žijúcich v $SCO_ADJ$ Vysočine môže byť rozhodujúcim krokom pre naše vojenské snahy." # todo: CHANGED
 scottish_whisky: "Škótska whisky" # todo: NEW TRANSLATION
 scottish_whisky_desc: "Hoci destilérne existujú v $SCO$ už dlhý čas, musíme zabezpečiť, aby tento priemysel konečne podliehal dohľadu štátu. Toto dohliadanie nám umožní zaujímať vedúce postavenie vo výrobe liehovín a rozšíriť exportné odvetvie." # todo: CHANGED
 scottish_enlightenment: "$SCO_ADJ$ Osvietenie" # todo: CHANGED
 scottish_enlightenment_desc: "Rýchle pokroky v filozofii, politickej ekonomike a medicíne viedli k množstvu úspechov našich krajanov, ktoré môžu posunúť $SCO$ na čelo globálnych inovácií. Toto obdobie $SCO_ADJ$ Osvietenia môže byť pre nás silným nástrojom na svetovej scéne." # todo: CHANGED
 swabian_league_of_cities: "Liga miest" # todo: NEW TRANSLATION
 swabian_league_of_cities_desc: "$SWA$ je domovom mnohých bohatých miest, ktoré sú lákadlom pre zahraničnú ambíciu. Aby sme lepšie chránili našu krajinu, mali by sme sa spojiť v čase vojny a spoločne bojovať proti cudzej invázii." # todo: CHANGED
 swabian_frugal_people: "Šetrné financie" # todo: NEW TRANSLATION
 swabian_frugal_people_desc: "Mnohí obviňujú náš ľud z lakomstva a smejú sa našej zdravej hospodárskej opatrnosti. Našťastie nad ich posmechom nepočuť šumenie dukátov v našich mešcoch." # todo: CHANGED
 franconian_proud_knights: "Rytieri impéria" # todo: NEW TRANSLATION
 franconian_proud_knights_desc: "Náš ľud prisľúbil dlhý rad hrdých rytierov cisárskej službe. Stelesňujú ideály rytierstva, ktoré sú už menej časté, no zostávajú podstatnou súčasťou našej identity. Máme za sebou dlhú históriu vzdelávania v cnostiach a vojenských záležitostiach. Táto tradícia cisárskych rytierov prirodzene zvyšuje ochotu našej šľachty prispievať oddielmi v nádeji na zisk slávy v poctivej bitke." # todo: CHANGED
 franconian_wine_bottles: "Silvaner a Bocksbeutel" # todo: NEW TRANSLATION
 franconian_wine_bottles_desc: " #italic bocksbeutel#! je významnou súčasťou našich vinohradníckych tradícií. Ľahko rozpoznateľný tvar fľaše slúži ako akýsi vyslanec pre krásne vína z nášho regiónu, ako Silvaner alebo Riesling. Vzorné zručnosti našich sklárskych majstrov a vinohradníkov nám určite prinesú hospodárske výhody." # todo: CHANGED
 westphalian_monastic_traditions: "Krajina kláštorov" # todo: NEW TRANSLATION
 westphalian_monastic_traditions_desc: "$north_german_region$ je domovom mnohých $catholic_ADJ$ pevností, ako sú biskupstvá v $munster$ a $paderborn$. Mníšsky život a regionálne náboženské tradície majú všeobecne pozitívny vplyv na gramotnosť a vzdelanie nášho duchovenstva, pretože existuje veľa príležitostí na ich ďalšie vzdelávanie. Tento prístup k učeniu tiež pomáha Svätej Matke Cirkvi vytvárať intelektuálne stádo vhodné na kňazské povinnosti." # todo: CHANGED
 north_german_hanseatic_traditions: "Hanzoví obchodníci" # todo: NEW TRANSLATION
 north_german_hanseatic_traditions_desc: "Ľudia z $north_german_region$ už dlho ťažia z prístupu k Baltskému moru. Kým mnohí južní susedia musia tovar prepravovať riekami, naši obchodníci majú dlhú tradíciu plavieb po Baltu, ktoré im priniesli závideniahodné bohatstvo." # todo: CHANGED
 german_baltic_sailors: "Baltskí námorníci" # todo: NEW TRANSLATION
 german_baltic_sailors_desc: "Drsné podnebie rodí odolných ľudí. Preplavovanie studeného Baltu zanechalo stopy na našich námorníkoch, čím ich spravilo mentálne odolnými a mimoriadne zručnými vo svojom remesle. To je ich konečný úžitok, pretože more vie byť nemilosrdná pani." # todo: CHANGED
 german_populating_the_countryside: "Priťahovanie správnych ľudí" # todo: NEW TRANSLATION
 german_populating_the_countryside_desc: "Podpora osídľovania vidieckych oblastí a pridelenie pôdy ľuďom bude skvelým základom na postupné zvyšovanie bohatstva a produktivity našich redšie osídlených území." # todo: CHANGED
 german_fair_towns: "Mestá cisárskych trhov" # todo: NEW TRANSLATION
 german_fair_towns_desc: "Cisárske trhy sú vzácnym privilégiom udeleným len niekoľkým vybraným mestám, vytvárajúc jedny z najväčších trhov v $europe$ a robia tieto mestá obchodným srdcom $hre$. Centralizovaná povaha týchto trhov umožňuje obchodníkom plánovať a efektívne rokovať v prostredí, kde profitujú z voľnosti a prístupu k rozmanitým tovarom." # todo: CHANGED
 german_imperial_roads: "Cisárska sieť ciest" # todo: NEW TRANSLATION
 german_imperial_roads_desc: "Od čias Rimanov spájajú cestné siete miesta po celom $GER$, čo uľahčuje obchod a cestovanie. Tieto cesty poskytujú aj kritické logistické výhody, najmä pri presune vojsk." # todo: CHANGED
 landsknechte: "Landsknechte" # todo: NEW TRANSLATION
 landsknechte_desc: "Z neustálych vojen $GER$ vznikol nový typ organizácie jednotiek: $landsknechte$, zmiešané sily vytvorené inovatívnymi štvorcami pikovníkov, s arkebúznikmi podporujúcimi z bokov a prednou líniou zloženou z neodmysliteľných #italic Doppelsöldner#!, 'dvojplatených mužov', nesúcich dvojručné meče. To umožňuje taktiky kombinujúce boj na blízko a stredný dostrel." # todo: CHANGED
 german_biedermeier: "Biedermeier" # todo: NEW TRANSLATION
 german_biedermeier_desc: "Obdobie Biedermeier označuje posun k sociálnej konzervatívnosti zo strany vyšších vrstiev a ich nostalgii za časmi, keď mali najväčší vplyv. Táto sociálna zmena prinútila našich slobodnejších občanov zatvárať svoje tvorivé a intelektuálne snahy do relatívneho súkromia, ďaleko od verejného pohľadu. Zatiaľ čo to neúmyselne posilňuje rozvoj kultúrnej identity medzi obchodníkmi, tiež prinútilo mnoho cenných myslí opustiť našu krajinu a hľadať slobodu inde — berúc so sebou svoje talenty." # todo: CHANGED
 custom_union_of_the_rhine: "Rýnska mincová únia" # todo: NEW TRANSLATION
 custom_union_of_the_rhine_desc: "V nesmiernom patchworku nášho veľkého impéria je spolupráca medzi susednými skupinami rozhodujúca pre zdravie našej ekonomiky. Pridáme sa k colnej únii Rýna a prijmeme ich #italic gulden#! mince, aby sme zjednodušili obchodné transakcie našim kupcom a racionalizovali medzinárodnú diplomaciu." # todo: CHANGED
 lub_hanseatic_coins: "Wendischer Münzverein" # todo: NEW TRANSLATION
 lub_hanseatic_coins_desc: "Novo založená organizácia medzi mestami s výraznou hanseatskou prítomnosťou, Wendish Coinage Treaty nám poskytne pevný základ pre uľahčenie obchodu a podnikania v našich krajinách." # todo: NEW TRANSLATION
 hamburg_port_cities: "Sieť prístavov" # todo: NEW TRANSLATION
 hamburg_port_cities_desc: "Naša krajina prežíva vďaka silným väzbám na námorný obchod a neustálom výmene tovarov. Aby sme udržali poriadok v prístave, budeme musieť vyhĺbiť nové vodné cesty a postaviť viac dokov a skladov, čím prilákame nových kupcov a ich lode." # todo: NEW TRANSLATION
 saiger_process: "Saigerov proces" # todo: NEW TRANSLATION
 saiger_process_desc: "Nový a revolučný taviaci proces, obohacujúci medi obsahujúcu striebro pomocou olova, nám umožní zvýšiť produktivitu našich baní." # todo: NEW TRANSLATION
 german_river_toll_castle_advance: "$german_river_toll_castle$" # todo: NEW TRANSLATION
 german_river_toll_castle_advance_desc: "$german_river_toll_castle_desc$" # todo: NEW TRANSLATION
 german_mountain_toll_castle_advance: "$german_mountain_toll_castle$" # todo: NEW TRANSLATION
 german_mountain_toll_castle_advance_desc: "$german_mountain_toll_castle_desc$" # todo: NEW TRANSLATION
 austrian_tradition: "Dom slávy" # todo: NEW TRANSLATION
 austrian_tradition_desc: "Náš vzostup k moci vyvolal veľkú závist; riválne domy $hre$ súperia o našu pozíciu ako ochrancov juhovýchodnej hranice. Napriek týmto okolnostiam sme hrdí na vykonávanie diplomatických manévrov bez konkurencie." # todo: CHANGED
 austrian_heritage: "Dedičstvo Rudolfa I." # todo: NEW TRANSLATION
 austrian_heritage_desc: "Víťazstvo Rudolfa I. nad jeho rivalmi zabezpečilo naše postavenie medzi veľkými domami $hre$ a je predmetom mnohých príbehov a piesní. Odvaha jeho a jeho rytierov v bitke na Marchfelde bude inšpirovať naše vojská po stáročia." # todo: CHANGED
 hab_expert_mountaineers: "Krajina hôr a riek" # todo: NEW TRANSLATION
 hab_expert_mountaineers_desc: "Náš ľud je dobre prispôsobený na prekonávanie prekážok našej krajiny, od vysokých štítov a priechodov našich hôr až po široké rieky údolí." # todo: NEW TRANSLATION
 austrian_marriage_policy: "'Tu Felix Austria Nube'" # todo: CHANGED
 austrian_marriage_policy_desc: "'Nech iní vedú vojny; ty, šťastné $HAB$, žen sa!' Preto čo Mars dá iným, Venuša dáte — kráľovstvá." # todo: CHANGED
 habsburg_dominance: "$HAB_ADJ$ Diplomatická odbornosť" # todo: CHANGED
 habsburg_dominance_desc: "Vzhľadom na naše umiestnenie v centre celého $europe$ musíme prijať vysoko flexibilný prístup k zahraničnej diplomacii. Spojenectvá a rivality sa môžu rozpadnúť rovnako ľahko, ako vzniknú, a naši diplomati musia byť vycvičení pokrývať každú možnú pozíciu." # todo: CHANGED
 austrian_military_flexibility: "Taktika Landsknechtov" # todo: NEW TRANSLATION
 austrian_military_flexibility_desc: "Len všestranné taktiky zložené z delostreleckého šoku, jazdeckých šarží a neústupnej pechoty naverbovanej z $landknechte$ môžu viesť k víťazstvu." # todo: CHANGED
 edict_of_restitution: "Edikt o restitúcii" # todo: NEW TRANSLATION
 edict_of_restitution_desc: "Trocha účtovníctva nám pomôže prečkať náboženské nepokoje, ktoré by našu ríšu mohli postihnúť. Tento neškodný edikt určite nespustí ďalší konflikt." # todo: CHANGED
 austrian_court: "$HAB_ADJ$ Dvor" # todo: CHANGED
 austrian_court_desc: "Udržiavanie našich diplomatických vzťahov si vyžaduje čas a úsilie, a nasadenie príliš mnohých ľudí na diplomatické misie by mohlo negatívne ovplyvniť našu efektivitu a poškodiť našu reputáciu. $HAB_ADJ$ Dvor zabezpečuje zjednodušený prístup, nasadzujúc správnych vyslancov v správnom čase a pritom získava potrebné informácie bez nadmerného rozptyľovania zdrojov." # todo: CHANGED
 geheimrat: "Tajná rada" # todo: NEW TRANSLATION
 geheimrat_desc: "#italic Geheimer Rat#! je elitný poradný zbor zložený z vysokopostavených šľachticov a úradníkov, slúžiaci ako centrálna inštitúcia na vedenie našich politických, vojenských a administratívnych rozhodnutí." # todo: CHANGED
 hofkriegsrat: "Hofkriegsrat" # todo: NEW TRANSLATION
 hofkriegsrat_desc: "Náš vojnový snem môže fungovať len s patričnou byrokratickou štruktúrou. Len keď poznáme každý detail o našich vojskách a logistike, dokážeme brániť ríšu pred nepriateľskými votrelcami." # todo: CHANGED
 military_border: "Vojenská hranica" # todo: NEW TRANSLATION
 military_border_desc: "Obrana našich hraníc je vážna záležitosť a kladie značný finančný tlak na štát. Riešením, ktoré sme našli, je udeľovanie veľkorysých pozemkov na pohraničí za účelom vybudovania profesionálnej vojenskej triedy. To zabezpečí väčšiu disciplínu a uľahčí migráciu do redšie osídlených oblastí nášho štátu." # todo: CHANGED
 austrian_ambition: "Osvietenie cez vzdelanie" # todo: NEW TRANSLATION
 austrian_ambition_desc: "Naši vládci musia získať čo najlepšie vzdelanie, aby naplnili ideál osvieteného panovníka." # todo: NEW TRANSLATION
 austrian_state_industrialization: "Štátna industrializácia" # todo: NEW TRANSLATION
 austrian_state_industrialization_desc: "Priemyselná modernizácia musí byť vždy prioritou našej správy. Len prostredníctvom modernej výroby môžeme konkurovať našim rivalom na globálnej úrovni." # todo: CHANGED
 wiener_klassik: "Wiener Klassik" # todo: NEW TRANSLATION
 wiener_klassik_desc: "Viedenský klasicizmus je transformačná sila v hudbe. Diela našich najlepších skladateľov zrevolucionalizujú západnú hudobnú tradíciu odvážnou, trendotvornou inováciou symfonických, operných a komorných útvarov." # todo: CHANGED
 multicultural_empire: "Multikultúrna ríša" # todo: NEW TRANSLATION
 multicultural_empire_desc: "$HAB$ je rozmanité a multikultúrne kráľovstvo, odhodlané prijímať a uspokojovať početné etnické menšiny, aby udržalo jednotu a stabilitu uprostred rastúcich nacionalistických napätí." # todo: CHANGED
 imperial_artillery: "Cisárske delostrelectvo" # todo: NEW TRANSLATION
 imperial_artillery_desc: "Rýchlo sa meniaca povaha vojny nás núti modernizovať naše jednotky a taktiky. Aby sme zostali pred nepriateľmi, urobíme z nášho delostrelectva pýchu cisárskej armády." # todo: CHANGED
 alchemy_advance: "Alchýmia" # todo: NEW TRANSLATION
 alchemy_advance_desc: "Umenie alchýmie zahŕňa tvorbu elixírov a lektvarov pomocou kombinácie bylín, minerálov a iných prírodných zložiek. Hoci nie je vždy spoľahlivá, použitie alchýmie môže niekedy priniesť pozoruhodné výsledky pri liečbe rôznych neduhov." # todo: NEW TRANSLATION
 anatomy_advance: "Anatómia" # todo: NEW TRANSLATION
 anatomy_advance_desc: "Lekári vyvíjajú pokročilejšie chápanie ľudského tela, čo vedie k účinnejším liečbam zranení a chorôb. Toto poznanie, prevažne získané z praktických pitiev ľudských tiel, tiež zlepšuje chirurgické techniky a znižuje riziká medicínskych zákrokov." # todo: CHANGED
 surgery_advance: "Chirurgia" # todo: NEW TRANSLATION
 surgery_advance_desc: "Barberchirurgovia vyvíjajú sofistikovanejšie techniky liečenia zranení a chorôb a vynález nových chirurgických nástrojov robí zákroky bezpečnejšími a efektívnejšími. V dôsledku toho pacienti prežívajú zranenia a choroby, ktoré by pred pár rokmi boli smrteľné." # todo: CHANGED
 pharmacology_advance: "Farmakológia" # todo: NEW TRANSLATION
 pharmacology_advance_desc: "Alchymisti a lekári skúmajú nové zlúčeniny a chemické zmesi pri hľadaní liekov. Niektorí z týchto raných farmaceutov vyvinuli liečby bežných chorôb ako horúčka, prechladnutie a tráviace problémy a ich metódy sľubujú do budúcnosti. Avšak stále je veľa čo sa učiť a mnohé z týchto nových liekov môžu byť nebezpečné, ak nie sú správne pripravené." # todo: NEW TRANSLATION
 sanitation_advance: "Sanitácia" # todo: NEW TRANSLATION
 sanitation_advance_desc: "Obce investujú do zlepšených sanitárnych opatrení, ako sú systémy odstraňovania odpadu a zásobovania čistou vodou. To zníži šírenie chorôb a zlepší celkové zdravie populácie. Rozvoj moderných sanitárnych praktík umožní ľuďom žiť bližšie pri sebe bez toho, aby podľahli chorobám." # todo: NEW TRANSLATION
 vaccination_advance: "Očkovanie" # todo: NEW TRANSLATION
 vaccination_advance_desc: "S vývojom vakcín dokážu lekári poskytnúť obyvateľstvu imunitu proti smrteľným chorobám. Tieto vakcíny pomáhajú znižovať šírenie nákaz a predchádzať epidémiám. Vstreknutím malej dávky oslabených alebo mŕtvych baktérií či vírusov dokáže imunitný systém rozpoznať a bojovať proti chorobe, ak sa s ňou stretnú znova." # todo: NEW TRANSLATION
 vibrant_court_advance: "Živý dvor" # todo: NEW TRANSLATION
 vibrant_court_advance_desc: "Veľké mysle prúdia k nášmu dvoru z celého známeho sveta, prinášajúc rozmanité jazyky, módu a umenie. V dôsledku tohto vystavenia sme sa viac prispôsobili ich cudzím 'zvykom'." # todo: CHANGED
 patio_process_advance: "Patio Process" # todo: NEW TRANSLATION
 patio_process_advance_desc: "$patio_process_advance$ pozostáva z metódy rafinácie nízkokvalitných strieborných a zlatých rúd chemickým roztokom založeným na ortuti, aby sa katalyzovala amalgamačná reakcia." # todo: CHANGED
 pan_amalgamation_advance: "Pan-amalgamácia" # todo: NEW TRANSLATION
 pan_amalgamation_advance_desc: "$pan_amalgamation_advance$ je zlepšením $patio_process_advance$, ktoré urýchľuje spracovanie." # todo: CHANGED
 milanese_tradition: "$lombard$ Dedičstvo" # todo: CHANGED
 milanese_tradition_desc: "Sláva a vplyv $lombard$ kráľovstva sú stále badateľné dodnes. Ako ich jasní duchovní dediči si šľachta $MLO$ užíva vyšší stupeň autority a rešpektu než ich rovesníci." # todo: CHANGED
 milanese_heritage: "Tradícia kondotiérov" # todo: NEW TRANSLATION
 milanese_heritage_desc: "Ľudia z $MLO$ sú zvyknutí bojovať ako žoldnieri v neustálych sporoch v regióne, získavajúc povesť veľmi schopných vojakov." # todo: CHANGED
 renaissance_prince: "$renaissance$ Princ" # todo: CHANGED
 renaissance_prince_desc: "Iní vládcovia v $italy_region$ možno iba pretvárne hlásia podporu kultúrneho znovuzrodenia, ktoré sa pred nami prejavuje; nech $MLO$ vyjde ako jeho srdce pod naším patronátom." # todo: CHANGED
 patron_of_music: "Patrón hudby" # todo: NEW TRANSLATION
 patron_of_music_desc: "Hudobné umenie bolo smutne zanedbávané inými kniežatami. My, naopak, budeme patronovať hudbe pre slávu Boha i nás samých a $MLO$ zažiari v dôsledku." # todo: CHANGED
 lowered_power_of_barons: "Znížená moc barónov" # todo: NEW TRANSLATION
 lowered_power_of_barons_desc: "Umenie a kultúra sú cenné, ale ak chceme zostať nezávislí, čo naozaj potrebujeme, je #italic peniaze#!. Aby sme získali, čo potrebujeme, musíme oslabiť moc regionálnej šľachty a zabezpečiť, aby viac peňazí prúdilo do centra štátu." # todo: CHANGED
 age_of_condottieri: "Doba kondotiérov" # todo: NEW TRANSLATION
 age_of_condottieri_desc: "Keď sú žoldnieri základom mnohých armád, bolo by rozumné mať aj my vlastných žoldnierov. Zabezpečme, aby prechádzajúci žoldnierski kapitáni boli u nás srdečne vítaní, aby nás mali v pamäti, keď ich budeme potrebovať." # todo: CHANGED
 encouragement_of_philosophers: "Podpora filozofov" # todo: NEW TRANSLATION
 encouragement_of_philosophers_desc: "My v $MLO$ sme dlhoroční podporovatelia $renaissance$ myšlienok. Mali by sme v tejto tradícii pokračovať podporou a budovaním zariadení pre najlepších mysliteľov v celom $europe$, dúfajúc, že ich to sem pritiahne." # todo: CHANGED
 merchant_princes: "Obchodnícki kniežatá" # todo: NEW TRANSLATION
 merchant_princes_desc: "Veľké pobrežné mestá $ITA$ profitovali z rozsiahlych obchodných sietí prinášajúcich bohatstvo a moc. Naša krajina nemusí byť na pobreží, no to neznamená, že $MLO$ nemôže získať svoj podiel morského obchodu. Nech je známe, že bohatí obchodníci, ktorí prinesú bohatstvá sveta, budú na dvore $MLO$ vítaní." # todo: CHANGED
 rulership_of_enlightened_principals: "Vládnutie podľa osvietených princípov" # todo: NEW TRANSLATION
 rulership_of_enlightened_principals_desc: "Osvietenskí filozofi inšpirovali nové teórie správy. Štruktúrovaním vlády podľa princípov zásluh, spravodlivosti a efektivity získame väčšiu podporu. Aspoň u tých, na ktorých skutočne záleží..." # todo: CHANGED
 milanese_ambition: "Nové $lombard$ kráľovstvo" # todo: CHANGED
 milanese_ambition_desc: "Sláva predchádzajúceho $lombard$ kráľovstva bledne v porovnaní s tým, čo ľudia $MLO$ dosiahli a čo im stále patrí. Všetci sa nám sklonia!" # todo: CHANGED
 pap_head_of_the_church: "Hlava cirkvi" # todo: NEW TRANSLATION
 pap_head_of_the_church_desc: "Kurió a Svätý Stolec sú úzko prepojené s $PAP_ADJ$ vládou. Kardináli z iných štátov sa môžu snažiť ovplyvniť teologické smerovanie 4christian$, ale napokon bude mať $PAP$ v Kuriu vždy najväčší vplyv." # todo: CHANGED
 pap_the_word_of_the_lord: "Slovo Pánovo" # todo: NEW TRANSLATION
 pap_the_word_of_the_lord_desc: "Ako jeho najvernejší služobníci; jeho najsvätejší biskupi, sme tí, čo čítajú a interpretujú Božie slovo. Naša diplomacia je preto podložená božskou autoritou." # todo: CHANGED
 ecclesiastical_primacy: "Cirkevná primátia" # todo: NEW TRANSLATION
 ecclesiastical_primacy_desc: "Pápež má suverénnu autoritu ustanovovať kanonické a cirkevné zákony v $catholic_ADJ$ Cirkvi. Štát zdieľa osobitný vzťah s tými, ktorí sa podriadia vôli $catholic_ADJ$ autority." # todo: CHANGED
 papal_investiture_and_tithes: "$PAP_ADJ$ investitúry a desiatky" # todo: CHANGED
 papal_investiture_and_tithes_desc: "Do $rome$ prúdi bohatstvo $christian_ADJ$ $europe$." # todo: CHANGED
 glory_of_rome: "Sláva $rome$" # todo: CHANGED
 glory_of_rome_desc: "Ovládame veľké mesto a starobylé hlavné mesto Rimanov. Sme jedinými strážcami ich úžasnej tradície!" # todo: CHANGED
 donation_of_constantine: "Darovanie Konštantína" # todo: NEW TRANSLATION
 donation_of_constantine_desc: "Donácia Konštantína dokazuje našu autoritu udeľovať titul cisára Rimanov komukoľvek, koho si zvolíme. Môže tiež naznačovať, že sme celkom zruční pri falšovaní dokumentov." # todo: CHANGED
 centralize_the_states: "Zcentralizovať štáty" # todo: NEW TRANSLATION
 centralize_the_states_desc: "Konsolidujeme našu moc v $PAP_ADJ$ provinciách prevzatím autority od miestnych kniežat." # todo: CHANGED
 holy_father: "Svätý Otec" # todo: NEW TRANSLATION
 holy_father_desc: "Byť Vikarom Boha pre rímskych $catholic_ADJ$ veriacich nám dáva určitú politickú voľnosť. Pápežská bula, dokumenty s oficiálnou pečaťou pápeža, majú váhu samotného Božieho slova. S nimi boli panovníci prekliati a celé kontinenty rozdelené." # todo: CHANGED
 pap_legacy_of_the_military_orders: "Dedičstvo vojenských rádu" # todo: NEW TRANSLATION
 pap_legacy_of_the_military_orders_desc: "Hoci éra Svätých rádu už dávno pominula, jej dedičstvo zostáva hlbokou inšpiráciou pre vojakov Boha, ktorí prisahajú brániť Svätý Stolec pred pohanmi a kacírmi." # todo: CHANGED
 teu_crusader_discipline: "Krížová disciplína" # todo: NEW TRANSLATION
 teu_crusader_discipline_desc: "Náš veľký rád bol formovaný v ohni a krvi Tretej križiackej výpravy počas obliehania $acre$ v roku 1191. Kým pôvodne sme sa starali o chorých a slabých, rád sa premenil na ozbrojenú skupinu rytierov s nezlomnou oddanosťou a disciplínou." # todo: NEW TRANSLATION
 teu_teutonic_heavy_cavalry: "Teutónska ťažká jazda" # todo: NEW TRANSLATION
 teu_teutonic_heavy_cavalry_desc: "Niet väčšieho symbolu moci a vojenskej sily než ťažká jazda. Kým v mnohých štátoch ju tvoria šľachtici, každý Teutonský rytier je zároveň členom našej ťažkej jazdy a podstúpi prísny výcvik križiaka." # todo: CHANGED
 teu_reformed_order_army: "Reformovaná rádová armáda" # todo: NEW TRANSLATION
 teu_reformed_order_army_desc: "Rytieri $GER_ADJ$ a veteráni krížových výprav nie sú dostatočne početní, aby zostali základom našich armád. Musíme reorganizovať vojenské sily tak, aby zahŕňali domáce dane a pluky schopné nahradiť rytierov na bojisku." # todo: CHANGED
 teu_peasants_recruitment: "Verbovanie roľníkov" # todo: CHANGED
 teu_peasants_recruitment_desc: "Je nám jasné, že sa nemôžeme ďalej spoliehať na zahraničných dobrovoľníkov na doplnenie našich armád bez ohľadu na ich skúsenosť. Namiesto toho vytvoríme systém, ktorý nám umožní povolávať našich poddaných, či už $GER_ADJ$ alebo ne-$GER-ADJ$." # todo: CHANGED
 teu_infantry_tactics: "Taktika pechoty" # todo: NEW TRANSLATION
 teu_infantry_tactics_desc: "Súčasné bitky v $europe$ dokazujú, že nastáva vek pechoty. Je čas vyvinúť nové taktiky, osvojiť si používanie piky a premeniť našu stredovekú koncepciu pomocnej pechoty na hlavné bojové sily budúcich armád." # todo: CHANGED
 teu_teutonic_religious_authority: "Teutónska náboženská autorita" # todo: NEW TRANSLATION
 teu_teutonic_religious_authority_desc: "Ukončíme voľnú náboženskú autonómiu miestnych biskupov v našej ríši. Všetky náboženské záležitosti, od zdaňovania po obracanie obyvateľstva, budú teraz štátne záležitosti." # todo: CHANGED
 teu_expanded_marches: "Rozšírené pohraničné marky" # todo: NEW TRANSLATION
 teu_expanded_marches_desc: "Udelíme autonómiu miestnym guvernérom našich pohraničných regiónov a reformujeme ich državy na marky. Tieto špeciálne zóny budú platiť nižšie dane štátu výmenou za povinnosť udržiavať najvyššiu bojovú pripravenosť za vojny i mieru. To nám poskytne značnú vojenskú flexibilitu pri malých nákladoch." # todo: CHANGED
 teu_prussian_bishops: "$prussian$ Biskupi" # todo: CHANGED
 teu_prussian_bishops_desc: "Udelíme ďalšie práva a privilégiá našim $prussian$ biskupom, čím zabezpečíme ich lojalitu vo všetkých záležitostiach." # todo: CHANGED
 teu_one_state_one_religion: "Jeden štát, jedno náboženstvo" # todo: NEW TRANSLATION
 teu_one_state_one_religion_desc: "Rezervujeme všetky štátne úrady len pre tých, ktorí nasledujú naše náboženstvo. Kacíri a pohania už nie sú vítaní v našej ríši." # todo: CHANGED
 teu_absolute_order: "Absolútny poriadok" # todo: NEW TRANSLATION
 teu_absolute_order_desc: "Všetky štátne právomoci sú skonsolidované v našom ráde. Každý čin a každé rozhodnutie prechádza hierarchiou Teutonského rádu skôr, než sa vykoná. Samozrejme, táto byrokracia nie je pre každého obľúbená, ale zaručuje absolútnu moc #italic Hochmeister#!." # todo: CHANGED
 legacy_of_breton_independence: "Dedičstvo $breton$ nezávislosti" # todo: CHANGED
 legacy_of_breton_independence_desc: "$brittany_area$ nikdy skutočne nebola súčasťou $FRA$. Hoci sme boli zmasakrovaní Frankmi, Vikingmi a $ENG_ADJ$ v minulosti, doposiaľ sme si udržali svoju unikátnu identitu. Nech všetci susedia vedia, že $BRI$ zostane naveky slobodný, posledný bašta pravých galských tradícií!" # todo: CHANGED
 estates_of_brittany: "Stavy $BRI$" # todo: CHANGED
 estates_of_brittany_desc: "Prvýkrát zvolané v 14. storočí, Stavy $BRI$ umožnili slobodným mužom zo všetkých vrstiev spoločnosti, dokonca Tretiemu Stavu, zdieľať svoje sťažnosti a predkladať žiadosti panovníkovi. Zvolaním Stavov môžeme zmierniť napätie v našom doméniu." # todo: CHANGED
 dutch_education: "Holandské vzdelanie" # todo: NEW TRANSLATION
 dutch_education_desc: "Kým náš ľud vždy dosahoval vyššie miery gramotnosti na všetkých úrovniach, táto výhoda sa v novom svete stáva čoraz zrejmejšou. Len ten, kto je obmedzeného rozhľadu, by sa o tento náskok nepokúsil postarať a zvýšiť ho." # todo: CHANGED
 dutch_golden_age_art: "Holandské umenie" # todo: NEW TRANSLATION
 dutch_golden_age_art_desc: "$common_string_prefix_article$ $NED$ historicky stál v čele technologických a kultúrnych pokrokov. Musíme naďalej podporovať vynálezcov, umelcov a spisovateľov, aby sme si udržali náskok pred ostatnými štátmi." # todo: CHANGED
 a_trading_hub: "Obchodné centrum" # todo: NEW TRANSLATION
 a_trading_hub_desc: "Náš národ je požehnaný dobre etablovaným sústredením miest orientovaných na obchod a dobrodružnými námorníkmi ochotnými priniesť bohatstvo zo všetkých kútov sveta. Títo námorníci budú vynikajúcim spôsobom, ako obchodovať s inými krajinami a dosahovať značné zisky." # todo: CHANGED
 platoon_fire: "Palba čaty" # todo: NEW TRANSLATION
 platoon_fire_desc: "Štandardná salva spočívala v tom, že každý rad vystrelil naraz pre maximálnu palebnú silu. Vyvinuli sme však systém paľby po častiach, kde jedna časť pluku stále strieľa, zatiaľ čo ostatní sa znovu nabíjajú, čím sa odstránia prestávky medzi útokmi, ktoré by nepriateľ mohol využiť." # todo: CHANGED
 concentration_power: "Koncentrácia moci" # todo: NEW TRANSLATION
 concentration_power_desc: "Príliš dlho bola naša krajina nerovnomerne spravovaná viacerými #italic stadtholders#! v rôznych provinciách, pričom najsilnejší z nich pôsobil ako #italic primus inter pares#! medzi rovesníkmi. Je čas urobiť pozíciu dedičnou a sústrediť moc do rúk jedného vládcu." # todo: CHANGED
 a_fortified_border: "Opevnená hranica" # todo: NEW TRANSLATION
 a_fortified_border_desc: "Naše hranice nie sú dobre chránené prírodnými bariérami ako niektoré iné štáty. Avšak máme rozum a múdrosť dosť na to, aby sme vybudovali najmohutnejšie opevnenia, ktoré odradia nepriateľov a ochránia naše rodiny." # todo: CHANGED
 netherlandish_protoindustry: "$NED_ADJ$ Verlagssystem" # todo: CHANGED
 netherlandish_protoindustry_desc: "Dlhý čas bola naša zem domovom rušných miest s vyššou koncentráciou remeselníkov než u susedov. Tento dôraz nás urobil vysoko produktívnymi." # todo: CHANGED
 a_dynamic_society: "Dynamická spoločnosť" # todo: NEW TRANSLATION
 a_dynamic_society_desc: "Naše územia sú útočiskom pre odvážnych. Kto chce zlepšiť svoj život, nájde tu príležitosť, a my využijeme talenty týchto ambicióznych jednotlivcov na posilnenie národa." # todo: CHANGED
 an_early_urbanization: "Skorá urbanizácia" # todo: NEW TRANSLATION
 an_early_urbanization_desc: "Nízke krajiny tradične mali vysokú mieru urbanizácie, čo nám dovolilo dosahovať moc nad očakávania. Mali by sme tento trend zrýchliť vytvorením robustnej siete prosperujúcich sídel, ktoré nám pomôžu vytvoriť bohatšiu budúcnosť." # todo: CHANGED
 polders_advance: "Poldery" # todo: NEW TRANSLATION
 polders_advance_desc: "Nízke krajiny sú mimoriadne náchylné na povodne; mnohé katastrofálne záplavy medzi 11. a 14. storočím viedli k vzniku Zuiderzee. Prebytočné zaplavovanie tiež soli znemožnilo pobrežné pôdy. Našťastie máme teraz technológiu na znovuzískanie tejto poškodené pôdy a jej produktívne využitie v poľnohospodárstve." # todo: CHANGED
 netherlandish_ship_building: "$NED_ADJ$ Stavba lodí" # todo: CHANGED
 netherlandish_ship_building_desc: "Keďže Nízke krajiny sú domovom niektorých z najväčších prístavných miest v $europe$, je prirodzené, že majú aj jedny z najlepších lodeníc. Schopnosť zamestnať zručných miestnych remeselníkov výrazne znižuje náklady na získavanie nových obchodných flotíl." # todo: CHANGED
 brb_the_four_quartiers: "Štyri kvartály" # todo: NEW TRANSLATION
 brb_the_four_quartiers_desc: "Štyri kvartály sú štyri provincie, do ktorých je rozdelené jadro $BRA$. Každý quartier je tvorený centrom veľkých a menších miest, niektoré opevnené a iné nie. Všetky fungujú v dokonalom súlade ako dobre namazaný stroj, plniac naše truhlice veľkým bohatstvom." # todo: CHANGED
 fla_cloth: "$FLA_ADJ$ $cloth$" # todo: CHANGED
 fla_cloth_desc: "$FLA_ADJ$ $cloth$ priemysel je závisťou sveta. Obchodníci prichádzajú zďaleka predávať svoj $wool$ do $FLA$, kde vyrábame najkvalitnejší $cloth$." # todo: CHANGED
 frisian_trading_traditions: "Obchodné tradície" # todo: NEW TRANSLATION
 frisian_trading_traditions_desc: "Dlho predtým, než si južnejšie hrabstvá vyvinuli vlastné trasy, naši predkovia dominovali pobrežnému obchodu v $europe$ od Baltského mora po Biskajský záliv. Musíme oživiť túto starú námornú zručnosť, aby sme si znovu vydobili svoje právoplatné postavenie." # todo: CHANGED
 gel_warring_spirit: "Bojovný duch" # todo: NEW TRANSLATION
 gel_warring_spirit_desc: "Niektorí nás nazývajú v boji náročnými, ale to je len preto, že sa boja našej moci. Dobré vycvičené stála armáda je nevyhnutná pre prežitie v tejto chaotickej dobe. Naši protivníci sa čoskoro naučia rešpektovať náš otriasajúci duch." # todo: CHANGED
 hai_expert_embassadors: "Skúsení veľvyslanci" # todo: NEW TRANSLATION
 hai_expert_embassadors_desc: "Naši vládcovia boli vždy zruční so slovom a ich diplomatická zručnosť rozšírila ich vplyv ďaleko za hranice našej krajiny. Ako geopolitické tlaky rastú, musíme začať pestovať priateľstvá s inými štátmi na ochranu a rozšírenie nášho vplyvu." # todo: CHANGED
 hol_sailors: "Holandskí námorníci" # todo: NEW TRANSLATION
 hol_sailors_desc: "Krajina pieskov a zaplavených území, ľudia $HOL$ vždy považovali more za svoj prirodzený druhý domov, kde hojnosť zdrojov a slávne dobrodružstvá čakajú na tých, ktorí sú odvážni ich nasledovať." # todo: CHANGED
 lie_athens_north: "Atény severu" # todo: NEW TRANSLATION
 lie_athens_north_desc: "$liege$ je kultúrnym centrom už stáročia, domovom najvýznamnejších učencov v regióne a závisťou našich rivalov. Nebudeme však zhovievaví; nikdy neprestaneme zlepšovať naše inštitúcie." # todo: CHANGED
 lux_destined_rule: "Predurčení vládnuť" # todo: NEW TRANSLATION
 lux_destined_rule_desc: "Veľká dynastia Luxemburkov, ktorej meno vychádza z mena našej krajiny, je teraz najdôležitejšou rodinou v $europe$. To musí byť znamenie z Nebes a použijeme toto božské požehnanie na ďalšie rozšírenie nášho vplyvu." # todo: CHANGED
 utr_city_churches: "Mesto kostolov" # todo: NEW TRANSLATION
 utr_city_churches_desc: "$utrecht$, často nazývaný #italic Mesto kostolov#!, je domovom ikonickej Domovej veže. Duchovné centrum $common_string_prefix_article$ $NED$ a sídlo biskupstva Utrechtu je majákom viery od staroveku." # todo: CHANGED
 brb_brabantine_rights: "$BRB_ADJ$ Práva" # todo: CHANGED
 brb_brabantine_rights_desc: "Ako iné národy, je čas kodifikovať slobody našich poddaných, aby sme identifikovali a ochránili ich práva a motivovali ich pokračovať v práci pre lepšiu budúcnosť našej krajiny." # todo: CHANGED
 fla_flemish_renaissance: "$FLA_ADJ$ $renaissance$" # todo: CHANGED
 fla_flemish_renaissance_desc: "Ako jeden z najbohatších regiónov na kontinentoch veľká časť bohatstva prirodzene plynie k umeleckému patrónstvu. $FLA_ADJ$ obchodníci zadávajú majstrovským maliarom diela, ktoré, hoci možno nie praktické, rozžiaria aj najzamračenejší deň. S desiatkami našich obchodníkov aktívne najímajúcimi umelcov vytvárame vlastné charakteristické $renaissance$." # todo: CHANGED
 frisian_resisting_invader: "Odpor voči votrelcovi" # todo: NEW TRANSLATION
 frisian_resisting_invader_desc: "Obkľúčení nepriateľmi sú naši ľudia zvyknutí drsne brániť svoje územia, bojovať tak urputne, že mnohí bykoľvek invázii utekajú a nikdy sa nevrátia. Tí, ktorí nás neujdú, môžu nájsť útechu v myšlienke, že ich krv pohnojí pôdu $FRI$." # todo: CHANGED
 gel_healthy_economy: "Zdravá ekonomika" # todo: NEW TRANSLATION
 gel_healthy_economy_desc: "Rozšírili sme hranice nielen mečom, ale starostlivým finančným plánovaním, ktoré nám umožnilo kúpiť vplyv nad žiadanými územiami — alebo kúpiť ich priamo. Pri rozumnej finančnej správe môže tento ekonomický trend pokračovať udržateľne." # todo: CHANGED
 hai_frontier_march: "Pohraničná marka" # todo: NEW TRANSLATION
 hai_frontier_march_desc: "Ako pohraničná provincia $hre$ si $HAI$ vypestovalo drsný ducha z dlhoročných bojov na hranici. Tento duch robí náš ľud prirodzene náchylným k obranným akciám, čo môžeme využiť vo svoj prospech." # todo: CHANGED
 hol_maritime_warfare: "Námorná vojna" # todo: NEW TRANSLATION
 hol_maritime_warfare_desc: "Ako námorná krajina sú naši námorníci zvyknutí na námorné boje, či už proti rivalom alebo pirátom pokúšajúcim sa lupiť naše lode. V každom prípade musí byť naše námorníctvo pripravené čeliť každému nepriateľovi kedykoľvek." # todo: CHANGED
 lie_devoted_land: "Oddaná krajina" # todo: NEW TRANSLATION
 lie_devoted_land_desc: "Ako súčasť jedného z najväčších diecéz v oblasti nepochybne platí hlboké oddanie našich ľudí. Ukážeme svetu, že naša viera v Boha je rovnako silná ako viera v národ." # todo: CHANGED
 lux_fortress_europe: "Pevnosť $europe$" # todo: CHANGED
 lux_fortress_europe_desc: "Nedobytná pozícia $LUX$, so skalným útvarom Bock slúžiacim ako prirodzená pevnosť, je neuveriteľne silná. Naši nepriatelia by zahynuli pri každom pokuse o dobytí našich držávok. Poučíme sa z prírody a postavíme všetky naše pevnosti tak, aby využívali miestny terén vo svoj prospech." # todo: CHANGED
 utr_blessed_land: "Požehnaná krajina" # todo: NEW TRANSLATION
 utr_blessed_land_desc: "Sám pápež ovplyvňuje voľbu nášho kniežaťa-biskupa, meniac tradičný päťkapitúlkový volebný formát, aký sme mali predtým. To je jasný dôkaz, že naša zem je božsky požehnaná!" # todo: CHANGED
 brb_land_culture: "Krajina kultúry" # todo: NEW TRANSLATION
 brb_land_culture_desc: "Založením Univerzity $leuven$, $BRA$ pevne umiestnilo seba do centra kultúry v $common_string_prefix_article$ $NED$. Študenti z celého $europe$ prichádzajú študovať a zdieľať svoje vedomosti v našich krajinách." # todo: CHANGED
 fla_prospering_agriculture: "Prosperujúce poľnohospodárstvo" # todo: NEW TRANSLATION
 fla_prospering_agriculture_desc: "Keď naše textilné, luxusné a finančné odvetvia čelia rastúcej konkurencii, je zrejmé, že musíme lepšie spravovať využívanie pôdy. Vytvorením regionálnych sýpok ďalej diverzifikujeme ekonomiku a posilníme zásoby potravín proti hladomoru alebo zlej úrode." # todo: CHANGED
 frisian_legend_grutte_pier: "Legenda o Grutte Pierovi" # todo: NEW TRANSLATION
 frisian_legend_grutte_pier_desc: "V našich krajinách sa tradujú príbehy o pirátovi vysokom sedem stôp a silnom ako vôl. Tieto príbehy inšpirujú mnohých vyraziť na more a robiť to, čo naši predkovia – plenit neopevnené pobrežia." # todo: CHANGED
 gel_expand_kwarteers: "Rozšíriť kvartály" # todo: NEW TRANSLATION
 gel_expand_kwarteers_desc: "Rovnako ako v prípade $BRA$, $GEL$ sa tradične delí na štyri štvrte. Tento systém provincií okolo silného centrálneho mesta sa osvedčil ako efektívny spôsob správy národa a mal by byť použitý aj v nových regiónoch, ktoré sa k nám pripoja." # todo: CHANGED
 hai_bustling_towns: "Rušné mestá" # todo: NEW TRANSLATION
 hai_bustling_towns_desc: "Naše živé mestské sídla sú plné potenciálu. S malým úsilím ich môžeme urobiť neuveriteľne bohatými spolu s ich zázemiami, čo nám umožní dôkladne ich zdanovať." # todo: CHANGED
 hol_trading_spirit: "Obchodný duch" # todo: NEW TRANSLATION
 hol_trading_spirit_desc: "Náš štát je obklopený morom, takže je prirodzené, že sa odvážime po rozbúrených vlnách hľadať obchodné prístavy a zbožie, ktoré obohatia naše pobrežie." # todo: CHANGED
 lie_inspiring_mecenas: "Inšpirujúci mecenáš" # todo: NEW TRANSLATION
 lie_inspiring_mecenas_desc: "Náš národ inšpiruje umelcov z celého $europe$, ktorí prichádzajú vytvárať svoje majstrovské diela. Nešetríme nákladmi podporiť týchto umelcov a pritiahnuť nové talenty, čím sa etablujeme ako centrum umenia a kultúry." # todo: CHANGED
 lux_heirs_john_blind: "Dedičia Jána Slepého" # todo: NEW TRANSLATION
 lux_heirs_john_blind_desc: "John the Blind, hrdinský kráľ $BOH$ a gróf $LUX$, sa narodil v našom skromnom území. Zomrel v bitke pri Crécy vo veku päťdesiatich rokov, nabiehajúc do boja napriek slepote. Jeho statočná a čestná smrť bude inšpirovať našich vojakov po stáročia." # todo: CHANGED
 utr_skilled_diplomats: "Zruční diplomati" # todo: NEW TRANSLATION
 utr_skilled_diplomats_desc: "S rastúcim vplyvom našich susedov je prežitie národa závislé na našej schopnosti nájsť verných mocných spojencov, ktorí nás podržia v čase núdze." # todo: CHANGED
 golden_fleece: "Rád Zlatého rúna" # todo: NEW TRANSLATION
 golden_fleece_desc: "Jeden z popredných rytier•ských rád v $europe$. Byť Rytierom Zlatého rúcha je znak veľkého postavenia a dobre sa to odráža na nás." # todo: CHANGED
 wagenburg: "Wagenburg" # todo: NEW TRANSLATION
 wagenburg_desc: "Počas husitských vojen sa naše armády spoliehali na vozové tábory nazývané #italic Wagenburg#! na víťazstvo nad početne silnejšími vojskami. Hoci vždy nemusíme nasadiť vozy, princíp zostáva: ostreľovači pechoty bojujúci z pripravených obranných pozícií sa stanú našou štandardnou doktrínou." # todo: CHANGED
 hussite_traditions: "$hussite_ADJ$ tradície" # todo: NEW TRANSLATION
 hussite_traditions_desc: "Cez zápasy a bratstvo prívrženci našej viery odolávajú všetkým vonkajším pokusom o konverziu. Naše neotrasené náboženské korene, vychádzajúce zo starodávnych učenie, znejú pravdivo v srdciach všetkých, čo chcú zachovať svoju vieru a žiť v mieri po boku iných 4christian_ADJ$ veriacich." # todo: CHANGED
 kutnohorian_deal: "Kutnohorská dohoda" # todo: NEW TRANSLATION
 kutnohorian_deal_desc: "Šľachta bude vždy citlivá na ochranu svojich privilégií. Zaručenie týchto privilégií navždy by veľmi pomohlo získať si ich lojalitu." # todo: CHANGED
 bohemian_thaler: "$BOH_ADJ$ Taler" # todo: CHANGED
 bohemian_thaler_desc: "Roky bol štandardnou menou v našej krajine #italic groschen#!, strieborná minca používaná v celom $hre$. Objavenie nových zdrojov striebra nám umožňuje vytvoriť väčšiu mincu, #italic thaler#!, nazývanú tiež 'toler' alebo 'daler', ktorá sa stane silnou a vplyvnou dosť na to, aby dominovala obchodu a stala sa novým štandardom." # todo: CHANGED
 fortified_towns: "Opevnené mestá" # todo: NEW TRANSLATION
 fortified_towns_desc: "Po zúriacich $hussite_wars$ a v snahe ochrániť našu vieru a ľud sme financovali mnoho opevnených miest. Odvtedy sme získali veľkú odbornú zručnosť v budovaní opevnení a konštruovaní nepreniknuteľných obrán." # todo: CHANGED
 maori_ta_moko_advance: "Tā Moko" # todo: NEW TRANSLATION
 maori_ta_moko_advance_desc: "S prepracovanými krivkami a špirálami #italic Tā Moko#! si rituálne vryjeme pigment do kože, premieňajúc naše telá na živé tapisérie cti a histórie." # todo: NEW TRANSLATION
 maori_ceremonial_haka_advance: "Ceremoniálna Haka" # todo: NEW TRANSLATION
 maori_ceremonial_haka_advance_desc: "Zem sa trasie, keď naši bojovníci vykonávajú #italic Haka#!, ich divé výkriky a synchronizované pohyby sa ozývajú bojiskom. Tento zastrašujúci ceremoniálny tanečný rituál posilňuje srdce každého bojovníka a poskytuje výrazné zvýšenie morálky pozemným silám." # todo: CHANGED
 maori_whakapapa_advance: "Whakapapa" # todo: NEW TRANSLATION
 maori_whakapapa_advance_desc: "Sila a jednota pramenia z poznania vlastného #italic Whakapapa#!, zložitej siete genealogických väzieb, ktorá spája celé #italic iwi#!. Toto hlboké porozumenie spoločnému pôvodu podporuje jednotné postavenie proti všetkým ťažkostiam." # todo: NEW TRANSLATION
 maori_te_reo_advance: "Te Reo" # todo: NEW TRANSLATION
 maori_te_reo_advance_desc: "Vieme, že zachovaním a pestovaním #italic Te Reo#!, nášho posvätného jazyka, udržiavame živé spojenie s našou kultúrou a tradíciami." # todo: NEW TRANSLATION
 maori_rua_kumara_advance: "Rua Kūmara" # todo: NEW TRANSLATION
 maori_rua_kumara_advance_desc: "Zdokonalením pestovania a skladovania #italic kūmara#! hľúz v špeciálne postavených #italic rua#!, alebo skladovacích jamách, si zabezpečíme, že naše bruchá budú plné aj v najtvrdších zimách." # todo: CHANGED
 maori_he_whakaputanga_advance: "He Whakaputanga" # todo: NEW TRANSLATION
 maori_he_whakaputanga_advance_desc: "Takzvaná 'Deklarácia nezávislosti Nového Zélandu' je dokument, ktorý raz a navždy ustanovuje zjednotený $maori_culture$ štát nezávislý. Keď bude znenie úplne pochopené všetkými stranami, naši náčelníci sa môžu konečne zjednotiť a byť slobodní od cudzích zásahov." # todo: CHANGED
 the_ark_of_the_covenant: "Archa zmluvy" # todo: NEW TRANSLATION
 the_ark_of_the_covenant_desc: "Sme jediný národ, ktorý uchováva svätú Archu zmluvy poté, čo ju tisíce rokov dozadu tajne previezol Menelik I. s božskou pomocou. Je skrytá pred verejným zrakom, aby jej niekto neukradol náš svätý národný poklad. Replika Archy je umiestnená v každom našom kostole ako pripomienka, že naše panovanie je požehnané Bohom." # todo: CHANGED
 roof_of_africa: "Strecha $africa$" # todo: CHANGED
 roof_of_africa_desc: "Náš ľud obýva vysokohoria už celé generácie, znášajúc extrémne podmienky, ktoré nás učinili odolnými a silnými. To nám poskytuje výraznú výhodu voči nepriateľom, kedykoľvek vstúpime do konfliktu." # todo: NEW TRANSLATION
 solomonid_claim: "$solomonid_dynasty$ Dedičný nárok" # todo: CHANGED
 solomonid_claim_desc: "Predkovia našich vládcov pochádzajú z panovníkov Aksumu; z krvných línií kráľa Šalamúna a kráľovnej zo Sáby. Zvrhli sme $zagwe_dynasty$ panovníkov, aby sme legitimizovali naše panovanie a pevne obnovili kráľovstvo do svojej náležitej dynastie." # todo: CHANGED
 nagusa_negast: "Nəgusä Nägäst" # todo: NEW TRANSLATION
 nagusa_negast_desc: "Náš vládca je kráľ všetkých kráľov; dedič rodu Aksum spolu s prvým vládcov, Menelikom I., synom kráľa Šalamúna a kráľovny zo Sáby. Všetci naši králi pochádzajú z dynastie $solomonid_dynasty$ a dedičstvo nemusí ísť výlučne z otca na syna." # todo: CHANGED
 a_permanent_capital: "Trvalé hlavné mesto" # todo: NEW TRANSLATION
 a_permanent_capital_desc: "Storočia nášmu národu chýbalo trvalé hlavné mesto; dvor nasledoval panovníkov, kamkoľvek sa im zapáčilo. Hoci tento prístup má svoje výhody, aby sme efektívne vládli nášmu rozľahlému štátu, potrebujeme ustanoviť silnú centrálnu autoritu na vhodnom trvalom mieste." # todo: NEW TRANSLATION
 external_friends: "Zahraniční priatelia" # todo: NEW TRANSLATION
 external_friends_desc: "Naši vyslanci do $rome$ a $iberia_region$ v hľadaní vojenskej podpory boli pomerne úspešní — v skutočnosti nás dostali na mapu. Tieto snahy o nájdenie spojencov by mali pokračovať." # todo: CHANGED
 eternal_crusade: "Večná krížová výprava" # todo: NEW TRANSLATION
 eternal_crusade_desc: "Ako $christian_ADJ$ národ sa ocitáme obklopení $muslim_ADJ$ protivníkmi, ktorí využívajú každú príležitosť nás zaútočiť. Aby sme zaistili naše prežitie, musíme byť pripravení okamžite sa brániť." # todo: NEW TRANSLATION
 prester_john: "Prester John" # todo: NEW TRANSLATION
 prester_john_desc: "Ľudia z $europe$ hľadajú Prester Johna celé stáročia a sú presvedčení, že náš vládca ním musí byť, keďže zdieľame $christian_ADJ$ vieru. Není dôvod ich opravovať, veď sú šťastní a ochotní sa s nami podeliť o svoje nápady." # todo: CHANGED
 an_iron_fist: "Železná päsť" # todo: NEW TRANSLATION
 an_iron_fist_desc: "Náš región je kultúrne a nábožensky rozmanitý a jedinou vecou, ktorá ho drží pokope, nie je súcit, ale silný vládca schopný rýchlo a rozhodne potlačiť každú vzburu." # todo: CHANGED
 a_true_ethiopian_church: "Pravá $ETH_ADJ$ Cirkev" # todo: CHANGED
 a_true_ethiopian_church_desc: "Externé vplyvy majú svoje využitie, no ich prístup môže zmeniť podstatu našich vierovyznaní. Aby sme si udržali identitu, musíme zabezpečiť domácu primárnosť našej vlastnej Tewahedo Cirkvi." # todo: CHANGED
 origin_of_coffee: "Pôvod $coffee$" # todo: CHANGED
 origin_of_coffee_desc: "Z našich krajín pochádza $coffee$, keďže máme ideálne podmienky pre jeho pestovanie. Hoci ho možno pestovať aj inde, naše je uctievané pre svoju kvalitu a vyváža sa v tonách. Musíme z toho urobiť spôsob privádzania bohatstva do našej krajiny." # todo: CHANGED
 a_modern_nation: "Moderný štát" # todo: NEW TRANSLATION
 a_modern_nation_desc: "Napriek našej zdanlivej izolácii sme dobre oboznámení s inováciami vo svete a neotálejeme s ich zavádzaním, aby sme si udržali konkurenčnú výhodu nad rivalmi." # todo: CHANGED
 cawa_advance: "Ç̌äwa Regiments" # todo: NEW TRANSLATION
 cawa_advance_desc: "#italic Ç̌äwa#! slúžia ako $ETH$'ov šľachticov v službe cisára. Sú profesionálnou vojenskou triedou, známi svojou krutosťou." # todo: CHANGED
 a_renaissance_cawa_advance: "$a_renaissance_cawa$" # todo: NEW TRANSLATION
 a_renaissance_cawa_advance_desc: "$a_renaissance_cawa_desc$" # todo: NEW TRANSLATION
 a_discovery_cawa_advance: "$a_discovery_cawa$" # todo: NEW TRANSLATION
 a_discovery_cawa_advance_desc: "$a_discovery_cawa_desc$" # todo: NEW TRANSLATION
 a_reformation_cawa_advance: "$a_reformation_cawa$" # todo: NEW TRANSLATION
 a_reformation_cawa_advance_desc: "$a_reformation_cawa_desc$" # todo: NEW TRANSLATION
 a_absolutism_cawa_advance: "$a_absolutism_cawa$" # todo: NEW TRANSLATION
 a_absolutism_cawa_advance_desc: "$a_absolutism_cawa_desc$" # todo: NEW TRANSLATION
 a_revolutions_cawa_advance: "$a_revolutions_cawa$" # todo: NEW TRANSLATION
 a_revolutions_cawa_advance_desc: "$a_revolutions_cawa_desc$" # todo: NEW TRANSLATION
 epic_of_sundiata: "Epos o Sundiata" # todo: NEW TRANSLATION
 epic_of_sundiata_desc: "$epic_of_sundiata$ rozpráva o legendárnom ťažení Sundiata Keita, zakladateľa $MAL_ADJ$ impéria a hrdinu nášho ľudu. Jeho príbeh sa prenáša z generácie na generáciu a vždy bol veľkým zdrojom inšpirácie." # todo: CHANGED
 kouroukan_fouga_advance: "Kouroukan Fouga" # todo: NEW TRANSLATION
 kouroukan_fouga_advance_desc: "$kouroukan_fouga_advance$ je základná ústava $MALI$. Pokrýva všetky aspekty života, od rodinného života vo vidieckych dedinách až po suverenitu Mansa." # todo: CHANGED
 gold_of_bure: "Zlato z Bure" # todo: NEW TRANSLATION
 gold_of_bure_desc: "Dvojité zlaté bane v Bambuku a Bure sú známe ako najväčšie zlaté ložiská, aké kto pozná, a patria nám! Zvlášť bane v Bure produkovali neuveriteľné bohatstvo, ktoré údajne destabilizovalo egyptské hospodárstvo infláciou pri návšteve Mansa Mūsā. Naša ekonomika je však zvyknutá na konštantný prílev zlata a je ťažšie ju inflovať." # todo: CHANGED
 accounts_of_the_atlantic_voyage: "Záznamy o atlantskej plavbe" # todo: NEW TRANSLATION
 accounts_of_the_atlantic_voyage_desc: "Podľa legendárneho Mansa Mūsā jeho predchodca vykonal cestu cez $atlantic_ocean_continent$ v nádeji objaviť hranice oceánu. Zatiaľ čo niektorí v panovníckej triede považujú tento čin za hanebné vzdanie sa povinností, iní to vidia ako inšpiráciu na prieskum nepoznaných kútov sveta." # todo: CHANGED
 reclamation_of_land: "Získavanie pôdy" # todo: NEW TRANSLATION
 reclamation_of_land_desc: "Sahara nie je statická. Môže rásť alebo ustupovať podľa zrážok a obytný pás nazývaný $sahel_region$, kde sídlime, sa tomu prispôsobuje. Veľké sucho by mohlo premeniť značnú časť kráľovstva na púšť. Avšak v dobrých rokoch môžeme získať späť niektoré okrajové územia Sahara a učiniť ich znovu úrodnými." # todo: CHANGED
 mandinka_warrior_spirit: "Mandinka bojovnícky duch" # todo: NEW TRANSLATION
 mandinka_warrior_spirit_desc: "Či už pohania alebo $muslim_ADJ$, Mandinka muži boli najlepší bojovníci, akých videl $sahel_region$. Odvaha našich vojsk je obdivuhodná, rovnako aj ich pýcha. Keď Mansa zdvihne armádu, nie je to len najväčšia v $sahel_region$, ale aj najlepšia!" # todo: CHANGED
 markets_for_salt: "Trhy pre $salt$" # todo: CHANGED
 markets_for_salt_desc: "V našom kráľovstve má $salt$ cenu zlata. Ale na juhu, v hustých lesoch Ašanti a Jorubov, je soľ cennejšia #italic než zlato#!. Našťastie máme vlastné zásoby $salt$ a dosť zlata, aby sme získali ľubovoľné množstvo. Možno nájdeme ešte viac trhov, kde je $salt$ cennejšia než zlato?" # todo: CHANGED
 west_african_slave_trade: "Západoafrický obchod s otrokmi" # todo: NEW TRANSLATION
 west_african_slave_trade_desc: "Ešte pred vznikom nášho imperia predchádzajúca Wagadou, Ghana, predávala $slaves_goods$ cez púšte Arabom. Nasledovali sme túto tradíciu roky, dodávajúc arabskému svetu obrovské množstvo $slaves_goods$. Teraz Európania žiadajú ešte viac otrokov na prácu v tzv. Novom svete. Máme málo správ, no ich dopyt je ohromujúci a stále sa vracajú, niekedy aj lúpežne napádajúc naše pobrežia a násilne odvádzajúc našich ľudí. Nastal čas zaviesť poriadok v tomto obchode a obmedziť Európanov na vybrané obchodné prístavy, kde budú kupovať, nie kradnúť $slaves_goods$." # todo: CHANGED
 kele_koun_advance: "The Kèlè-Koun" # todo: NEW TRANSLATION
 kele_koun_advance_desc: "Kèlè-Koun, alebo 'hlava vojny', sú velitelia pechoty bojujúcej za Impérium, nazývanej Kèlè-Bolo, 'arm vojny'. Na rozdiel od Ton-Tigi, feudálnych pánov $MAL$, Kèlè-Koun nie sú nevyhnutne súčasťou $nobles_estate$. Kèlè-Koun majú #italic jonow#!, 'otrokov', ktorí nesú zbrane a výstroj až do ich začlenenia do Sofa bataliónov." # todo: CHANGED
 sofa_levies_advance: "Sofa verbované oddiely" # todo: NEW TRANSLATION
 sofa_levies_advance_desc: "Pôvodne boli všetci vojaci v zboroch Kèlè-Bolo #italic horon#!, čiže 'slobodní muži', ale najnovší vývoj v $MAL$ donútil začleniť #italic jonow#!, 'otrokov', aby slúžili v armáde ako bojovníci namiesto nosičov zbraní. Títo otrockí vojaci sa následne nazývali 'Sofa', brániac pevnosti ako posádka." # todo: CHANGED
 mandekalu_levies: "Mandekalu verbované oddiely" # todo: NEW TRANSLATION
 mandekalu_levies_desc: "$mandekalu_levies$ tvoria chrbticu $MAL_ADJ$ armády. Slobodní muži Impéria sú povolaní do zbrane v časoch vojny a je veľkou cťou pre nich zúčastniť sa bitiek so svojimi vlastnými zbraňami." # todo: CHANGED
 farari_corps_advance: "Farari zbor" # todo: NEW TRANSLATION
 farari_corps_advance_desc: "$farari_corps_advance$ sú elita $MAL_ADJ$ vojsk. Velitelia sami osebe, sú vysoko rešpektovaní pre svoju skúsenosť a odvahu." # todo: CHANGED
 sudano_sahelian_architecture_advance: "Sudánsko-sahelská architektúra" # todo: NEW TRANSLATION
 sudano_sahelian_architecture_advance_desc: "Trávy, savany a púšte $west_africa$ poskytujú málo materiálov vhodných na stavby, preto robíme maximum z dostupného. Použitie hlinených tehál a hlinenej omietky znižuje náklady na budovy a zároveň im dáva výrazný štýl príjemný oku." # todo: CHANGED
 stories_of_the_gao_empire: "Príbehy $gao$ impéria" # todo: CHANGED
 stories_of_the_gao_empire_desc: "Predtým než $MAL_ADJ$ impérium ovládlo $west_africa$, mesto $gao$ bolo hlavným mestom vlastného impéria. Hoci takmer neexistujú písané záznamy $gao$ impéria, jeho dedičstvo žije v našich ústnych tradíciách a inšpiruje každého, kto raz túži dosiahnuť veľkosť." # todo: CHANGED
 malian_military_tactics: "$MAL_ADJ$ Vojenské taktiky" # todo: CHANGED
 malian_military_tactics_desc: "Počas nášho času ako poddaní $MAL$ sa náš ľud veľa naučil z ich velenia a bojových taktík. Tieto vedomosti pomôžu našej pechote v budúcich bitkách." # todo: CHANGED
 gold_to_salt_trade: "$golds_goods$ za $salt$ obchod" # todo: CHANGED
 gold_to_salt_trade_desc: "Niektorí hovoria, že $salt$ má hodnotu svojho váhy v $golds_goods$... možno by bolo presnejšie povedať, že $golds_goods$ má hodnotu svojej váhy v $salt$. Tak či onak, výmenou týchto dvoch komodít sme vytvorili rozkvitajúce obchodné siete." # todo: CHANGED
 independence_from_mali: "Nezávislosť od $MAL$" # todo: CHANGED
 independence_from_mali_desc: "Mnohé roky sme boli poddaní $MAL$. Ako moc $MAL$ ochabla, naša vzrástla a teraz môžeme tvrdiť, že sme plne nezávislí od $MAL_ADJ$ nadvlády. Vykročme kroky, aby sme si túto nezávislosť udržali." # todo: CHANGED
 jihad_against_the_pagans: "$jihad$ proti pohanom" # todo: NEW TRANSLATION
 jihad_against_the_pagans_desc: "Napriek stáročným snahám sunnitských sultanátov je $west_africa$ stále sužovaná hrozbou animistických pohanov. Zdvihnutím zástavy $jihad$ môžeme očistiť naše územia od neveriacich a zároveň rozšíriť hranice." # todo: CHANGED
 sankore_madrassah: "Sankoré Madrasah" # todo: CHANGED
 sankore_madrassah_desc: "Hovorí sa, že škola pri mešite Sankoré je najväčším centrom učenia v celom $africa$. Kto by bol prekvapený, keď tu teraz diskutuje toľko múdrych mužov z ďalekého $arabia_region$ a $maghreb_region$ o filozofii a náboženstve?" # todo: CHANGED
 the_hajj: "The Ḥajj" # todo: NEW TRANSLATION
 the_hajj_desc: "Rovnako ako Mansa Mūsā z $MAL$ kedysi, aj naši panovníci sa môžu vydať na púť do $mecca$, plniac piaty pilier $muslim$ a niesť zlato ako symbol našho bohatstva a moci. Ako pútnici $MAL_ADJ$ dávnych čias, svet bude žasnúť nad našim bohatstvom a veľkoleposťou." # todo: CHANGED
 sharia: "Šaría" # todo: NEW TRANSLATION
 sharia_desc: "Svätý zákon, ktorý prorok nasledoval pri vládnutí $medina$, by mal byť neotrasiteľným základom zákonov, ktorými riadime spoločnosť. Reformou nášho trestného kódexu podľa učení proroka prinesieme harmóniu a spravodlivosť ľudu." # todo: CHANGED
 trans_sahara_trade: "Transsaharský obchod" # todo: NEW TRANSLATION
 trans_sahara_trade_desc: "Naši obchodníci často prinášajú fascinujúce veci z dvorov $north_africa$. Možno by mohli nájsť a priniesť ešte viac zaujímavých drobností?" # todo: CHANGED
 modernization_of_the_military: "Modernizácia armády" # todo: NEW TRANSLATION
 modernization_of_the_military_desc: "Náš štát žije a zomiera schopnosťami našej armády. Naše ozbrojené sily nielen zabezpečujú prežitie, ale sú aj dôvodom nášho vzostupu k veľkosti. Nemôžeme si dovoliť zaostať v pokroku!" # todo: CHANGED
 university_naples: "Univerzita $NAP$" # todo: CHANGED
 university_naples_desc: "Založená v roku 1224 cisárom Fridrichom II., Univerzita $NAP$ je jednou z najstarších verejných inštitúcií v $ITA$. So sekulárnym založením poskytla generáciám študentov komplexné vzdelanie a prispela k intelektuálnemu pokroku v rôznych oblastiach." # todo: CHANGED
 mercantile_spirit: "Obchodnícky duch" # todo: NEW TRANSLATION
 mercantile_spirit_desc: "$NAP$, inšpirované významnou námornou republikou Amalfi, sa môže pochváliť živou kultúrou obchodu. Strategické prístavy vrátane mesta $naples$ slúžili ako dôležité uzly, spájajúc kráľovstvo s ďalekými krajinami a podporujúc hospodársku prosperitu cez výmenu tovarov a myšlienok." # todo: CHANGED
 consolidate_the_royal_domain: "Kráľovská doména" # todo: NEW TRANSLATION
 consolidate_the_royal_domain_desc: "Dedičstvo bohatého kráľovstva nám prináleží, no dosiahnutie skutočnej prosperity bránia archaické zákony a zvyky. Predchádzajúci vládcovia vyvažovali šľachtické privilégiá a hospodársku moc, no my musíme prispôsobiť postoje a regulácie modernej dobe. Posilnením šľachtických súdov a konsolidáciou ich pozemkov vytvoríme jasnejšiu právnu hierarchiu. Súčasne posilníme mestá ako centrá kráľovskej autority a podporíme rozmach mestského obchodu a remesiel." # todo: CHANGED
 academia_pontaniana: "Accademia Pontaniana" # todo: NEW TRANSLATION
 academia_pontaniana_desc: "Dlhý čas sa $NAP$ snažilo byť centrom moderného učenia, pritahujúc veľké mysle veku a šíriac svetlo $renaissance$. Pod vedením Giovanniho Pontana sa diskusné kruhy dostali do štruktúry a organizácie. Je vhodné pomenovať akadémiu po jej horlivom vedcovi." # todo: CHANGED
 encouraged_city_living: "Podpora mestského života" # todo: NEW TRANSLATION
 encouraged_city_living_desc: "Zdedičili sme nádherné mesto po predkoch. Musíme ho naďalej skrášľovať a zlepšovať túto metropolu Stredomoria, aby mohla naďalej rásť a prosperovať. Už sa neuspokojíme len s opravami prístavu a budov; vykonáme komplexné vylepšenia, ktoré lepšie udržia našich ľudí, vrátane stavby akvaduktov, odvodnenia mokradí a dláždenia ciest." # todo: CHANGED
 crush_the_barons: "Zlomená moc barónov" # todo: NEW TRANSLATION
 crush_the_barons_desc: "Miestni baróni stále vykonávajú veľkú mieru moci nad $NAP$ vidiekom. Ak chceme pokračovať v centralizácii kráľovstva, musíme ich moc zlomit alebo riskovať, že proti nám spikonšpirujú." # todo: CHANGED
 expanded_arsenale: "Rozšírené Arsenale" # todo: NEW TRANSLATION
 expanded_arsenale_desc: "Storočia bol Arsenál $NAP$ centrom našej lodnej výroby a hlavným námorným zariadením. Potrebuje však rozšírenie a modernizáciu, aby zostal účinný proti nepriateľským stredomorským flotilám. Rozšírme komerčné i vojenské kapacity prístavu a vybudujme efektívnejší Arsenál na udržiavanie väčšej, mocnejšej flotily." # todo: CHANGED
 city_of_artists: "Mesto umelcov" # todo: NEW TRANSLATION
 city_of_artists_desc: "S podporou najväčších umelcov sveta sa sláva nášho mesta rozšíri po celom svete. Všetci sa budú diviť veľkosti našich maliarov, básnikov, spevákov a hercov. Nech $NAP_ADJ$ kultúra je mierou, ktorou sa budú hodnotiť iné centrá umenia!" # todo: CHANGED
 institutional_reorganization: "Inštitucionálna reorganizácia" # todo: NEW TRANSLATION
 institutional_reorganization_desc: "Zrušením Kolaterálnej rady a zriadením #italic Real Camera di Santa Chiara#! vykonáme v $NAP$ zásadné právne reformy. Prebiehajúce projekty zorganizujú legislatívny komplex, konsolidujú zákony do #italic Codice Carolino#! a zavedú #italic Onciario Cadastre#! pre daňovú reformu." # todo: CHANGED
 a_central_power: "Centrálna moc Stredomoria" # todo: CHANGED
 a_central_power_desc: "Naša výhodná centrálna poloha v Stredomorí nám umožňuje bezproblémový prístup ku ktorémukoľvek pobrežiu. Mali by sme využiť tento kapitál na hľadanie spojenectiev, nadväzovanie nových priateľstiev a rozšírenie hraníc. S morom ako našou bránou sa otvára množstvo príležitostí na rast a prosperitu v našom úsilí o väčší vplyv a bezpečnosť." # todo: NEW TRANSLATION
 neapolitan_industrialization: "$NAP_ADJ$ Industrializácia" # todo: CHANGED
 neapolitan_industrialization_desc: "$NAP$ zažil postupný proces industrializácie v posledných desaťročiach. Kľúčové sektory ako textil, stavba lodí a železiarstvo zaznamenali výrazný rast, poháňaný investíciami a technologickými pokrokmi. Tento prechod k industrializácii zohrá významnú úlohu v premenení $NAP$ na významné ekonomické centrum." # todo: CHANGED
 neapolitan_army_reforms: "$NAP_ADJ$ Vojenské reformy" # todo: CHANGED
 neapolitan_army_reforms_desc: "Náš národ potrebuje prejsť rozsiahlymi vojenskými reformami, modernizujúc svoje ozbrojené sily, aby čelil výzvam meniaceho sa bojiska. Tieto reformy posilnia taktické schopnosti, zjednodušia veliteľské štruktúry a zlepšia výcvikové programy, čím sa staneme silnou silou v regióne." # todo: NEW TRANSLATION
 tws_unified_legal_code: "Jednotný právny kódex" # todo: NEW TRANSLATION
 tws_unified_legal_code_desc: "Územia tvoriace naše kráľovstvo trpeli povstaniami kvôli nespravodlivým aplikáciám zákonov. Aby sme tomu predišli v budúcnosti, mali by sme štandardizovať náš právny kódex a zabezpečiť spravodlivé uplatňovanie zákonov. To určite zabráni tomu, aby sa povstania vymkli kontrole." # todo: CHANGED
 tws_ensure_loyal_families: "Vernosť šľachtických rodín" # todo: NEW TRANSLATION
 tws_ensure_loyal_families_desc: "Šľachtické rody oboch Sicílií prejavujú veľkú moc namiesto nás. Udelením prestížnych, no bezvýznamných úradov na dvore im zabezpečíme vernosť a zaistíme stabilné vládnutie na vidieku." # todo: NEW TRANSLATION
 tws_revitalize_the_lands: "Pritiahnuť nových obyvateľov" # todo: NEW TRANSLATION
 tws_revitalize_the_lands_desc: "Predchádzajúci panovníci kládli príliš veľký dôraz na vybrané oblasti našej krajiny. Ak si chceme udržať obidve Sicílie, budeme musieť investovať rovnako a spravodlivo do oboch častí. Jedným krokom k tomuto cieľu je prilákať osadníkov do doteraz zanedbaných oblastí." # todo: CHANGED
 tws_capable_vicars: "Spôsobilí vikári" # todo: NEW TRANSLATION
 tws_capable_vicars_desc: "Jedným zo špecifických problémov nášho zjednoteného štátu je spravovanie obidvoch strán Messinskéú prielivu. Keďže náš vládc nemôže byť prítomný na oboch stranách súčasne, druhá musí byť zverená vikárovi vládnúcim v mene panovníka. Musíme menovať len najspôsobilejších a najdôveryhodnejších ľudí pre túto dôležitú úlohu, aby sme predchádzali korupcii." # todo: CHANGED
 tws_oversea_ambitions: "Zámořské ambície" # todo: NEW TRANSLATION
 tws_oversea_ambitions_desc: "Rozšírenie našich území v Taliansku je ťažké a vyžaduje navigáciu v spletitých sieťach spojenectiev a rizikom hnevu pápeža. Preto by sme sa mali obzrieť za more, kde nás čakajú potenciálne bohatstvá v severnej Afrike a Grécku." # todo: CHANGED
 tws_protect_the_coastline: "Zvýšiť námorné hliadky" # todo: NEW TRANSLATION
 tws_protect_the_coastline_desc: "Naše pobrežie je rozsiahle a zraniteľné pirátskym útokom hľadajúcim otrokov. Potrebujeme zriadiť námorníctvo na hliadkovanie, ochranu a nakoniec porazenie tejto zlej hrozby pre náš ľud." # todo: CHANGED
 arte_della_lana: "Arte della Lana" # todo: NEW TRANSLATION
 arte_della_lana_desc: "#italic Arte della Lana#! — cech vlny — kontroluje jeden z najdôležitejších odvetví v $FLO$. Oddaný výrobe kvalitného $cloth$ a podporovaný silnou a zručnou pracovnou silou, tento cech pomohol mnohým obchodníkom a remeselníkom zbohatnúť v priebehu storočí." # todo: CHANGED
 florino_d_oro: "Fiorino d'Oro" # todo: NEW TRANSLATION
 florino_d_oro_desc: "Veľmi silná mena, založená na vynikajúcej zlatovej čistote a používaná mnohými štátmi a inštitúciami po celom $europe$. Prijatím #Y Florin#! ako našej meny pozitívne ovplyvníme príjmy a znížime deficit." # todo: CHANGED
 a_land_of_banks: "Krajina bánk" # todo: NEW TRANSLATION
 a_land_of_banks_desc: "$TUS$ je centrom bankovníctva v $europe$, so silnými finančnými inštitúciami so sídlom v hlavných mestách. Z týchto báz ich vplyv siahá cez $italy_region$ až do severného $europe$ prostredníctvom rozsiahlych obchodných sietí a lukratívnych partnerstiev." # todo: CHANGED
 florentine_citizen_militia: "$FLO_ADJ$ Občianska milícia" # todo: CHANGED
 florentine_citizen_militia_desc: "Ak chceme, aby náš ľud kvitnul po dlhé roky, musia byť pripravení mobilizovať sa a brániť naše ideály a vlasť! Vytvorenie občianskej milície, rovnakej skúsenosti a zuřivosti ako iné armády v $europe$, nám veľmi pomôže chrániť naše územie." # todo: CHANGED
 birthplace_of_renaissance: "Kolíska $renaissance$" # todo: CHANGED
 birthplace_of_renaissance_desc: "Naša oddanosť výtvarnému umeniu, kultivácia umeleckých talentov a inovatívne myslenie nás postavili ako jedného z popredných vodcov kultúrneho, filozofického a vedeckého pokroku na svete!" # todo: CHANGED
 florentine_school: "$FLO_ADJ$ Škola" # todo: CHANGED
 florentine_school_desc: "Ako jedna z najvplyvnejších súčasných umeleckých škôl, $FLO_ADJ$ techniky a jemné detaily nás ustanovili ako kultúrneho vodcu $europe$, produkujúc majstrovské diela definujúce $renaissance$." # todo: CHANGED
 tuscan_uffizi: "Uffizi" # todo: NEW TRANSLATION
 tuscan_uffizi_desc: "Pôvodne určené na konsolidáciu správy niekoľkých cechov a agentúr, Uffizi sú cenným zdrojom centralizovanej moci, uchovávajúc a vystavujúc rozličné umelecké diela ako znamenie kultúrnej nadradenosti a prejav bohatstva." # todo: CHANGED
 medici_porcelain: "Medici $porcelain$" # todo: CHANGED
 medici_porcelain_desc: "Počas posledných desaťročí sa mnohé pokusy snažili napodobniť vlastnosti pravého $porcelain$, exotického tovaru z Ďalekého východu. S pomocou skúsených alchymistov a dôkladného vedeckého poznania určite dokážeme vyrobiť $porcelain$ vynikajúcej kvality." # todo: CHANGED
 porto_franco: "Porto Franco" # todo: NEW TRANSLATION
 porto_franco_desc: "Otvorením našich prístavov pre zahraničných obchodníkov a zrušením dovozných poplatkov určite nahromadíme viac kapitálových ziskov z našich obchodných snáh." # todo: CHANGED
 accademia_cimento: "Accademia del Cimento" # todo: NEW TRANSLATION
 accademia_cimento_desc: "#italic Accademia del Cimento#! je vedecké združenie založené v $FLO$ študentmi Galilea. Prvá inštitúcia svojho druhu, tento prelomový inkubátor vedeckého rozvoja bol zasvätený princípom experimentovania. Spoločnosť mala motto 'Skúšaj a skúšaj znova' a publikovala #Italic Saggi#!, knihu, ktorá stanovila súčasné štandardy pre laboratórnu prax." # todo: CHANGED
 tuscan_municipal_reforms: "$TUS_ADJ$ Muničné reformy" # todo: CHANGED
 tuscan_municipal_reforms_desc: "Vstupujúc do éry absolútizmu a vrcholnej centralizovanej moci musíme reformovať miestnu správu zavedením jednotných postupov a premeniť miestne systémy na nástroje centrálnej moci." # todo: CHANGED
 tuscan_physiocratic_reforms: "$TUS_ADJ$ Fyziokratické reformy" # todo: CHANGED
 tuscan_physiocratic_reforms_desc: "Posilnením našich poľnohospodárskych sektorov a lepšou starostlivosťou o našich ľudí bezpochyby zabezpečíme pevné základy pre naše novovzniknuté modernizované ekonomické systémy." # todo: CHANGED
 tuscan_new_trade_system: "Nový $TUS_ADJ$ Obchodný systém" # todo: CHANGED
 tuscan_new_trade_system_desc: "Éra nadvlády obchodných cechov pomaly končí, ich vplyv slabne tvárou v tvár absolutistickej centrálnosti. Reformou ich správy a presunom veľkej časti kontroly na hlavy štátu určite zvýšime zisky." # todo: CHANGED
 pis_anziani_del_popolo: "Anziani del Popolo" # todo: NEW TRANSLATION
 pis_anziani_del_popolo_desc: "Rada starších bola pôvodne založená v snahe upokojit rivalitu medzi rodinami $gherardesca_dynasty$ a $visconti_dynasty$. Od jej založenia ovplyvňuje, kto kontroluje a vládne republike." # todo: CHANGED
 pis_maritimes_legacy: "Dedičstvo námornej republiky" # todo: CHANGED
 pis_maritimes_legacy_desc: "Po stáročia bol $PIS$ jednou z dominantných mocností Stredozemia, značný vplyvný a s impozantnou obchodnou sieťou. Hoci sme teraz možno len tieň veľkého $PIS$ minulosti, naše dedičstvo zostáva. $PIS$ si pamätá." # todo: CHANGED
 pis_the_university_of_pisa: "Univerzita $PIS$" # todo: CHANGED
 pis_the_university_of_pisa_desc: "Jedno z najstarších centier vyššieho vzdelávania v $ITA$ a vlastne v celom $europe$, Univerzita $PIS$ má takmer legendárnu povesť výnimočnosti v učení a výskume." # todo: CHANGED
 sie_artists: "$SIE_ADJ$ Škola maľby" # todo: CHANGED
 sie_artists_desc: "Umenie maľby vo $ITA$ kvitlo už od začiatku $renaissance$, no žiadni umelci sa nevyrovnajú zručnosti a kvalite tých zo $SIE$. $SIE_ADJ$ umenie je nadpozemské a elegantné, s ťažkým dôrazom na zázraky vykonané biblickými postavami a svätcami. Kým iní umelci môžu vytvárať diela krásne pre danú chvíľu, subtílnejší štýl $SIE_ADJ$ školy zabezpečí, že jej diela budú obdivované ešte stáročia." # todo: CHANGED
 sie_studium_senese: "Studium Senese" # todo: NEW TRANSLATION
 sie_studium_senese_desc: "Považovaná za prvú verejne financovanú univerzitu, Univerzita $siena$ je pýchou mesta, vzdelávajúc našich občanov, aby všetci mohli slúžiť národu s odvahou a zručnosťou." # todo: CHANGED
 sie_council_priori: "Rada Priorov" # todo: NEW TRANSLATION
 sie_council_priori_desc: "Po sérii neúspešných republikánskych a kráľovských vlád sme založili Radu ľudu $SIE$, ktorá dúfajme nepodľahne vysoce pôrodným manévrom a korupcii ako mnohé predtým. Aj keď počet zástupcov v Rade a spôsob ich voľby je stále v pohybe, decentralizácia vlády týmto spôsobom zabráni $SIE$ skloniť sa do nadvlády šľachty." # todo: CHANGED
 republican_assembly_advance: "Republikánske zhromaždenie" # todo: NEW TRANSLATION
 republican_assembly_advance_desc: "Srdcom našej republiky je $republican_assembly$, mimoriadne vitálna inštitúcia, ktorá nám umožňuje byť riadení rytierovou cnosťou a dokonalosťou." # todo: CHANGED
 kbo_iron_helmet_musketeers: "$a_iron_helmet_musketeers$" # todo: NEW TRANSLATION
 kbo_iron_helmet_musketeers_desc: "Ako postupujú vojenské taktiky, rovnako musí postupovať aj naša stratégia. Adaptovaním zahraničných inovácií a techník ako formácie, línie paľby a nové strelné receptúry určite budeme víťazní!" # todo: CHANGED
 kbo_fixed_military_camps: "Stále vojenské tábory" # todo: NEW TRANSLATION
 kbo_fixed_military_camps_desc: "Zriadením stálych vojenských táborov v strategických miestach v celej našej doménii zabezpečíme, že naša armáda utrpí menej strát z opotrebenia a bude sa dať rýchlo mobilizovať keď bude treba." # todo: CHANGED
 kbo_permanent_sieges: "Obliehacie taktiky Kanemu" # todo: NEW TRANSLATION
 kbo_permanent_sieges_desc: "Naše armády sú skúsené so siege zariadeniami, ale prijatím mobilného delostrelectva, ktoré dokáže udržiavať trvalú paľbu, by sme si zaistili víťazstvo vždy, keď napadneme nepriateľské hradby!" # todo: CHANGED
 kbo_council_clan_heads: "Rada náčelníkov klanov" # todo: NEW TRANSLATION
 kbo_council_clan_heads_desc: "Delegovanie administratívnych povinností na miestnych hláv klanov môže znamenať upustenie časti centrálnej moci, no naši poradcovia trvajú, že z toho vyťažíme veľké výhody." # todo: CHANGED
 meissen_lion: "Meißenský lev" # todo: NEW TRANSLATION
 meissen_lion_desc: "Meißenský lev, tiež známy ako #italic Markmeißnische Löwe#!, má zvláštne miesto v heraldike. Symbol sily dynastie $wettin_dynasty$, brnený čierny lev s červeným jazykom hľadí doľava na zlatom poli. Jeho obraz sa objavuje v rôznych formách — na maľovaných náhrobných kameňoch, zástavách, prilbách, minciach a pečatách — symbolizujúc príslušnosť mesta $meissen$ k #italic Mark Meißen#! a zdobí erby mnohých miest a obcí. Niektorí ho spájajú s prefarbeným thüringenským levom." # todo: CHANGED
 a_mining_heritage: "Banícke dedičstvo" # todo: NEW TRANSLATION
 a_mining_heritage_desc: "Po stáročia ťaženie formovalo našu krajinu, ekonomiku a kultúru. Významné $silver$ objavy v regióne priťahovali baníkov a obchodníkov z rôznych oblastí, podporujúc rast Krušných hôr a rozširovanie významu a rozvoja našej ríše." # todo: CHANGED
 meissner_groschen: "Meißenský groš" # todo: NEW TRANSLATION
 meissner_groschen_desc: "#italic Meißner groschen#! bude slúžiť ako naša národná mena. Táto minca je založená na #italic Prague groschen#!, ktorú nahradíme. Nový veľký groš označí začiatok novej éry v histórii nášho razenia a umožní nám lepšie kontrolovať jej prúdenie." # todo: CHANGED
 a_resilient_soul: "Odolný duch" # todo: NEW TRANSLATION
 a_resilient_soul_desc: "Náš ľud je skutočne odolný, stelesňujúc nezlomnú vôľu v tvári výziev. Prekonávajú nepriazeň s neochvejným duchom, nachádzajúc silu v jednote a pevnom záväzku k spoločným hodnotám. Ich nezlomná odolnosť nás posúva vpred, umožňujúc nám prekonať každú prekážku. Vždy vyjdeme silnejší a rozhodnejší." # todo: CHANGED
 saxon_court: " $SAX_ADJ$ Dvor" # todo: CHANGED
 saxon_court_desc: "$SAX_ADJ$ Dvor je pilierom Elektorálneho $SAX$ vládnutia, spolu s civilnou a vojenskou správou. Súdne predpisy definujú povinnosti a denné rutiny úradníkov, pričom dvor sám sa skladá z nobilu a poddaných slúžiacich panovníckej rodine v správe. Tradične mal každý dospelý člen vládnucej rodiny vlastný dvor, no teraz vytvoríme jediný, trvalý dvor v našom hlavnom meste, priťahujúc najlepšie mozgy v ríši." # todo: CHANGED
 a_tolerant_society: "Tolerantná spoločnosť" # todo: NEW TRANSLATION
 a_tolerant_society_desc: "Náboženské spory a intolerancia sužujú iné krajiny, ale my pevne odmietame nechávať tieto rozbroje konať sa v našom kráľovstve. Nech už sú vierovyznania našich poddaných akékoľvek, národ bude založený na pevných pilieroch tolerancie a bratsva, podporujúc harmonickú koexistenciu všetkých komunít. Zjednotení spoločnou víziou budujeme krajinu, kde úcta a porozumenie rozkvitajú a pripravujú cestu k prosperite." # todo: CHANGED
 furstenschule: "Fürstenschule" # todo: NEW TRANSLATION
 furstenschule_desc: "Ako Reformácia naberá na sile a štát preberá kontrolu nad náboženskou správou, vzniká nová povinnosť pre formujúci sa štát: vzdelávanie, ktoré bolo predtým v kompetencii Cirkvi. Založíme kniežacie školy v Pforte, $grimma$ a $meissen$ využitím bývalých mníšskych majetkov. Štát tak prevezme významnú úlohu v formovaní vzdelávacieho prostredia a pestovaní znalostí pre budúcich vodcov $SAX$." # todo: CHANGED
 bonded_by_loyalty: "Spojení vernosťou" # todo: NEW TRANSLATION
 bonded_by_loyalty_desc: "Naše statočné vojská nikdy neohýbajú neochvejne! Ukazujú výnimočnú morálku a lojalitu, pevne stojac pri obrane krajiny alebo podpore spojencov. S nezlomným duchom budú tlačiť vpred aj v zúfalých okolnostiach, odmietajúc prehru až do úplného vyčerpania." # todo: CHANGED
 meissner_porcelain: "Meissner $porcelain$" # todo: CHANGED
 meissner_porcelain_desc: "$SAX$ je prvou krajinou v $europe$, ktorá vyrába $porcelain$, čo prinesie bohatstvo a prestíž dvora dynastie $wettin_dynasty$." # todo: CHANGED
 saxon_baroque: "$SAX_ADJ$ Baroko" # todo: CHANGED
 saxon_baroque_desc: "$dresden$ a $leipzig$, medzi inými miestami, získali medzinárodné uznanie ako centrá $SAX_ADJ$ baroka. Nádherná architektúra, ako Dresdner Hof, stelesňuje veľkoleposť $SAX$, zatiaľ čo diela Johanna Sebastiana Bacha premenili $leipzig$ na mesto hudby a bohatého vysokého kultúrneho života. Región sa môže pochváliť jedinečnými prejavmi kultúry vrátane remeselných výrobkov z Krušných hôr a kulinárskych tradícií ako #italic Dresdner Christstollen#!." # todo: CHANGED
 retablissement: "Rétablissement" # todo: NEW TRANSLATION
 retablissement_desc: "Po búrlivých vojnách sa pre $SAX$ rodí nová éra — pozoruhodné $SAX_ADJ$ #italic Rétablissement#!. Uprostred trosiek našej minulosti sa náš národ znovu zrodí ako fénix, obnovujúc zničenú ekonomiku a kráčajúc cestou k prosperite. Poháňaný víziou štátnych reforiem a disciplinovaným hospodárením, náš národ sa stane obchodným centrom.\n\nS bezkonkurenčnou administratívnou šikovnosťou a strategickým zameraním na hospodársky rast táto rozhodujúca transformácia formuje osud $SAX$ na stáročia dopredu." # todo: CHANGED
 saxon_industrialization: "$SAX_ADJ$ Industrializácia" # todo: CHANGED
 saxon_industrialization_desc: "Úspešná skorá industrializácia $SAX$ je evidentná; priemyselný sektor je vysoko rozvinutý v porovnaní s inými regiónmi. Manufakturný systém zameraný prevážne na export kvitne a urobí z $SAX$ vedúci štát v procese industrializácie $GER$. Vznik menších obchodných centier a obchodných vzťahov bude kľúčový pre rast ekonomiky a prepojenie na iné trhy v $europe$." # todo: CHANGED
 land_of_many_religions: "Kraj mnohých náboženstiev" # todo: NEW TRANSLATION
 land_of_many_religions_desc: "Náš ľud žije bok po boku s mužmi a ženami mnohých viery. Táto rozmanitá sociálna skladba je zakotvená v našich právnych rámcoch a presvedčeniach. Spoločne sme silnejší!" # todo: CHANGED
 ukrainian_farmlands: "Ukrajinské polia" # todo: NEW TRANSLATION
 ukrainian_farmlands_desc: "Ukrajina, alebo 'krajina hraníc' v $slavic$ jazyku, je región rozprestierajúci sa na južnom konci našej veľkej domény. Je domovom vysoko produktívnych obilných fariem, ktoré sú životne dôležité pre naše prežitie a prosperitu, keďže zásobujú veľa obilia do našich skladov a obchodníkom po celom $europe$." # todo: CHANGED
 migrant_opportunities: "Príležitosti pre prisťahovalcov" # todo: NEW TRANSLATION
 migrant_opportunities_desc: "Obchodné príležitosti a sľub lepšieho života sú jednými z dôvodov, prečo naše mestá a osady prijímajú neustále vlny imigrácie. Mnohí muži a ženy sa presťahujú do našich krajín hľadať šťastie a ich prítomnosť a príspevky zvyšujú aj naše bohatstvo." # todo: CHANGED
 two_realms: "Dve oblasti" # todo: NEW TRANSLATION
 two_realms_desc: "Vzhľadom na veľkosť nášho štátu podlieha naša jurisdikcia dvom odlišným rámcom: na severe leží jadro našich území, hrdo prijímajúc naše kultúrne tradície a spoločenské zvyky. Avšak naše južné a východné regióny sa často do istej miery odlišujú od centrálnych noriem. Rešpektovanie tejto rozmanitosti posilní náš národ a naše geopolitické postavenie." # todo: CHANGED
 chacery_slavonic: "Kancelárska slovančina" # todo: NEW TRANSLATION
 chacery_slavonic_desc: "Aby sme prepojili náš ľud naprieč obrovským územím, potrebujeme jednotný jazyk a mnoho gramotných členov duchovenstva, ktorí ho budú šíriť. Vývoj takého jazyka na zaznamenávanie našej histórie a udržiavanie administratívneho aparátu nie je len znak národnej hrdosti a prestíže, ale aj prostriedok na vytvorenie odlišnej vlády, ktorá nás jazykovo a kultúrne oddelí od východných susedov." # todo: CHANGED
 supremus_dux_lithuaniae: "'Supremus Dux Lithuaniae'" # todo: CHANGED
 supremus_dux_lithuaniae_desc: "Ak chceme brániť sa proti agresívnym $polish$ a $russian_group$ nepriateľom, musíme prejaviť silu! Zriadenie titulu #italic Supreme Duke of Lithuania#! rozhodne potvrdí našu autoritu, najmä proti rastúcej moci šľachty a iných, ktorí hľadajú porušenie našej suverenity." # todo: CHANGED
 ties_with_the_holy_see: "Vzťahy so Svätou Stolicou" # todo: NEW TRANSLATION
 ties_with_the_holy_see_desc: "Roky rokovaní so Svätým Otcom vyústili do prijatia $catholic$ s požehnaním našich $polish$ susedov a pápeža samotného počas búrlivého a jedinečného procesu christianizácie. Po našej snahe o hľadanie duchovnej identity je jasné, že sme sa stali majákom $catholic$, štítom proti nevercom a kacírstvu, ktoré ohrozuje spoločnosť." # todo: CHANGED
 patriarchate_of_lithuania: "Patriarchát $LIT$" # todo: CHANGED
 patriarchate_of_lithuania_desc: "Zrušenie $romuva$, viery našich predkov, otriaslo základmi $LIT_ADJ$ spoločnosti. Napriek tomu, aby sme si zabezpečili lepšiu budúcnosť, zvolili sme cestu $orthodox$ a plne oslavujeme našu novú identitu. Ak chceme v tom uspieť, musia mať náboženské autority nášho novo prijatého $orthodox_ADJ$ vyznania autonómiu od cudzích patriarchátov, aby sme sa vyhli vonkajšej intervencii." # todo: CHANGED
 columns_of_gediminids: "Stĺpy $gediminid_dynasty$s" # todo: CHANGED
 columns_of_gediminids_desc: "Erb, ktorý visí na našich zástavách, pochádza z jednej z našich najoslávenejších dynastií, rodu $gediminid_dynasty$. Mnohí z ich najschopnejších viedli náš národ cez búrlivé časy do hojnosti s opatrnou štátnou správou a schopným vedením. Stĺpy takýchto veľkých vodcov symbolizujú pevnú základňu a húževnatosť našej krajiny a našich ľudí." # todo: CHANGED
 warlord_dukes: "Vojnoví kniežatá" # todo: NEW TRANSLATION
 warlord_dukes_desc: "Po viac než dvoch pozoruhodných storočiach vojen $LIT_ADJ$ vojvodovia premenili voľnú federáciu kmeňov na zjednotený vojenský štát. Postavili silný odpor proti agresii $catholic_ADJ$ svätých rádov a zároveň dobyli rozsiahle územia na Východe. Tieto legendárne úspechy naďalej inšpirujú dnešných vojenských veliteľov." # todo: CHANGED
 auksine_laisve: "Auksinė Laisvė" # todo: NEW TRANSLATION
 auksine_laisve_desc: "#italic Auksinė Laisvė#!, alebo 'Zlatá sloboda', je súbor zákonov a privilégií, ktoré postavujú šľachtu nášho štátu nad ostatné triedy a často dokonca nad moc Koruny alebo Rady. Tento jedinečný systém sa rozšíril do $LIT$ cez $POL$ a má za cieľ zvýšiť lojalitu šľachty k panovníkovi, pokiaľ monarcha neporuší svoj sľub zachovať túto výnimočnú slobodu pre šľachtu." # todo: CHANGED
 magdeburg_laws: "Magdeburské právo" # todo: NEW TRANSLATION
 magdeburg_laws_desc: "Jedným z dôsledkov západného posunu $LIT$ je zavedenie 4GER_ADJ$ mestských zákonov do mnohých mestských oblastí krajiny. Magdeburské právo v miestnej podobe upravuje rôzne ekonomické a politické aspekty urbanizácie — od plánovania miest až po obchod a dane." # todo: CHANGED
 magnate_estates: "Magnátske panstvá" # todo: NEW TRANSLATION
 magnate_estates_desc: "Magnáti v $LIT$ sú nazývaní 'malí králi' pre svoje rozsiahle panstvá a súkromné armády. Brániac nedeliteľnosť svojich domén a snažiac sa maximalizovať zisk z nich, rozvinú systém v mnohých ohľadoch pripomínajúci staroveké rímske #italic latifundia#!, kde bohatí jednotlivci vlastnia veľké statky často obhospodarované otrokmi alebo nájomnými roľníkmi." # todo: CHANGED
 lithuanian_hussars: "$LIT_ADJ$ Husári" # todo: CHANGED
 lithuanian_hussars_desc: "Krídlatí husári sú ťažkou jazdou $LIT$, rovnako ako v $POL$. Zavedeni v oboch krajinách reformami Štefana Bathoryho, kráľa $POL$ a veľkovojvodu $LIT$, zostanú neporažení na bojiskách východnej $europe$ viac než storočie." # todo: CHANGED
 statutes_of_lithuania: "Štatúty $LIT$" # todo: CHANGED
 statutes_of_lithuania_desc: "Štatúty $LIT$ sú súborom troch rôznych právnych reforiem, ktoré agregujú, zjednocujú a aktualizujú zákony krajiny. Známé prísnymi trestami a zavedením trestu smrti, sú v súlade s mnohými súčasnými západnými trestnými kódmi. Každý zločin má byť potrestaný rovnako bez ohľadu na postavenie páchateľa, ale v praxi sú sedliaci často znevýhodňovaní oproti iným stavom." # todo: CHANGED
 lithuanian_renaissance: "$LIT_ADJ$ $renaissance$" # todo: CHANGED
 lithuanian_renaissance_desc: "$LIT$ zažil $renaissance$ na konci 15. a začiatku 16. storočia. Inšpirovaný myšlienkami reformácie a ovplyvnený $ITA_ADJ$ $renaissance$, došlo k rozmachu vzdelania, umenia, architektúry a literatúry. Toto obdobie tiež uvidí vznik písanej formy $lithuanian_dialect$ a následne prvých diel v $lithuanian_dialect$ literatúre." # todo: CHANGED
 bavarian_legitimacy: "$BAV_ADJ$ Védlosť vojvodu" # todo: CHANGED
 bavarian_legitimacy_desc: "Dostali sme vládu nad $BAV$ priamo od cisára! Ozdobením seba ako božsky menovaný ochrancovia $BAV$ zabezpečíme, že naša legitimita nebude spochybnená." # todo: CHANGED
 bavarian_imperial_knights: "$BAV_ADJ$ Cisárski rytieri" # todo: CHANGED
 bavarian_imperial_knights_desc: "Naši šľachtici sa vyznačili ako statoční rytieri v službe $hre$. Mali by sme tento stav pestovať a starostlivo udržiavať tieto oddiely, aby sme zabezpečili prežitie nášho vojvodského postavenia." # todo: CHANGED
 exploit_the_alpine_trade: "Obchodné uzly $BAV$" # todo: CHANGED
 exploit_the_alpine_trade_desc: "Naše územie často prechádzajú obchodníci, ktorí chcú vymeniť $salt$, $silver$ a $livestock$ v bohatých krajinách na juhu. Boli by sme hlúpi, keby sme nevyužili ich prítomnosť, a preto zriadime rušné obchodné uzly vo vlastných krajinách, aby sme pritiahli ich podnikanie." # todo: CHANGED
 bavarian_brewing_expertise: "Zruční sládkovia" # todo: NEW TRANSLATION
 bavarian_brewing_expertise_desc: "Naše pozemky sú bohaté na plodiny a čistú vodu potrebnú na varenie piva a náš ľud si túto hojnosť užíva. Mnohé malé pivovary by sa mohli rozrastať do úspešných podnikov s primeranou podporou." # todo: CHANGED
 bavarian_culture_buildings: "$BAV_ADJ$ Kultúrne inštitúcie" # todo: CHANGED
 bavarian_culture_buildings_desc: "S našou vlasťou pri úpätí krásnych Álp sme cieľom umelcov zo všetkého $europe$, ktorí hľadajú inšpiráciu v našej úžasnej krajine. Ak postavíme a podporíme vhodné kultúrne inštitúcie, môžeme premeniť náš dvor na centrum elegancie, ktoré môže konkurovať aj najprestížnejším mocnostiam v $europe$." # todo: CHANGED
 bavarian_stem_duchy: "Sny o zjednotení" # todo: NEW TRANSLATION
 bavarian_stem_duchy_desc: "Kedysi nás vládlo $BAV$, zjednotení kultúrou a spojenými pod jedným praporom. Musíme zabezpečiť, aby nová $BAV_ADJ$ štátnosť bola rovnako mocná, domov hodený silných a hrdých ľudí." # todo: CHANGED
 bavarian_zelousness: "Jedna viera pre $BAV$" # todo: CHANGED
 bavarian_zelousness_desc: "Musíme zabezpečiť, aby náš ľud zostal zjednotený vo viere a aby nebol rozdelený kacírom." # todo: CHANGED
 bavarian_hofkriegsrat: "$BAV_ADJ$ Hofkriegsrat" # todo: CHANGED
 bavarian_hofkriegsrat_desc: "Zriadenie rady s jedinou úlohou — radovať panovníka v časoch konfliktu — nám pomôže vyvinúť schopnejšie ozbrojené sily." # todo: CHANGED
 bavarian_flexible_diplomats: "Praktická diplomacia" # todo: NEW TRANSLATION
 bavarian_flexible_diplomats_desc: "Či už odpovedáme cisárskemu prelátnemu pánovi alebo sa kulíšime k potenciálnemu zahraničnému spojenectvu, naši diplomati musia byť pripravení na všetko. Len ak budú mať pri tom $BAV_ADJ$ záujmy na prvom mieste, dosiahneme skutočný úspech v diplomatických manévroch." # todo: CHANGED
 foundation_of_bavarian_army: "Armáda pre $BAV$" # todo: CHANGED
 foundation_of_bavarian_army_desc: "Len s impozantnou stálou armádou budeme mať vojenskú silu, potrebnú na zodpovedanie našich ambícií. S dôkladným zameraním ju rozšírime bez zničenia štátnych financií." # todo: CHANGED
 bavarian_coinage: "$BAV$ Mena" # todo: CHANGED
 bavarian_coinage_desc: "Naša ríša potrebuje novú štandardizovanú menu slúžiacu ako jednotná národná mena. Zriadenie štátnej mincovne v hlavnom meste by zabezpečilo našu plnú kontrolu nad novou mincťou." # todo: CHANGED
 bavarian_purity_law: "$BAV_ADJ$ Zákon o čistote" # todo: CHANGED
 bavarian_purity_law_desc: "Vynikajúca kvalita nášho piva je oslavovaná po stáročia, ale aby naše pivo dosiahlo legendárny status, musíme zabezpečiť jeho nepretržité postavenie a nadvládu. Niekoľko vládcov v minulosti vytvorilo regulácie a štandardy pre varenie tohto úžasného nápoja; môžeme túto tradíciu využiť ako pečať kvality našich pivovarov." # todo: CHANGED
 hsa_holpfennige: "Hohlpfennig" # todo: NEW TRANSLATION
 hsa_holpfennige_desc: "Pôvodne razený medzi mestami $LUB$ a $HAM$, #italic Hohlpfennig#! bol dutou mincou vyvinutou ako prostriedok proti rozsiahlemu znehodnocovaniu v čase, keď každá mincovňa mala odlišné štandardy týkajúce sa koncentrácie striebra v minci. Ako prostriedok pre vykonávanie transakcií táto mena uľahčí naše obchodné aktivity a premostí priepasť medzi zahraničnými trhmi a našimi obchodníkmi." # todo: NEW TRANSLATION
 hsa_the_cog: "The $n_hanseatic_cog$" # todo: NEW TRANSLATION
 hsa_the_cog_desc: "$n_hanseatic_cog_desc$" # todo: NEW TRANSLATION
 hsa_hanseatic_ties: "$HSA_ADJ$ Väzby" # todo: CHANGED
 hsa_hanseatic_ties_desc: "Náš Zväz je domovom mnohých miest a obchodných cechov, každý s vlastnými agendami a cieľmi. Aby sme udržali prosperitu a rozšírili náš dosah, musíme venovať veľkú pozornosť diplomatickým snahám." # todo: CHANGED
 hsa_seal_of_the_hansa: "Pečať $HSA$" # todo: CHANGED
 hsa_seal_of_the_hansa_desc: "Na trhoch po celej $europe$, od $london$ po $novgorod$, sú naši obchodníci známi svojim bohatstvom. Naša schopnosť mobilizovať veľké obchodné flotily a zladiť desiatky miest do dokonalého symfónia zisku a výmeny komodít je bezkonkurenčná." # todo: CHANGED
 hsa_hanseatic_shipwrights: "$HSA_ADJ$ Stavbári lodí" # todo: CHANGED
 hsa_hanseatic_shipwrights_desc: "V čase, keď je $europe$ zahalené vo vojne a vládci zúfalo hľadajú expanziu, obracajú sa na nás, aby sme im postavili veľké flotily, ktoré im umožnia plniť ambície. Obeh námorného remesla spojený s najlepšími drevami na kontinente robí náš proces stavby lodí bezkonkurenčný!" # todo: CHANGED
 hsa_draft_merchant_privileges: "Práva obchodníkov" # todo: NEW TRANSLATION
 hsa_draft_merchant_privileges_desc: "Obchodníci podnikajúci pod našou pečaťou nesú obrovský vplyv a krvácajú peňaženkami. Preto zafixovanie ich privilégií v zahraničných a domácom obchode len posilní naše schopnosti profitovať." # todo: CHANGED
 hsa_mastery_of_the_sea: "Majstrovstvo nad morom" # todo: NEW TRANSLATION
 hsa_mastery_of_the_sea_desc: "Naše námorné tradície spojili naše osudy s mocným morom. Aby sme získali všetky výhody z morských zdrojov, musíme sa naučiť ovládnuť jeho silu — a zaobchádzať s ním náležite. To bude mať obrovský dopad na náš obchod." # todo: CHANGED
 hsa_exchange_of_ideas: "Výmena myšlienok" # todo: NEW TRANSLATION
 hsa_exchange_of_ideas_desc: "Naši cestujúci obchodníci, ktorí vykonávajú obchod v zahraničí, sú vynikajúcim zdrojom zahraničných poznatkov. Keď sa vracajú na naše brehy, prinášajú so sebou inovácie a inšpiráciu." # todo: CHANGED
 hsa_global_reach: "Globálny dosah" # todo: NEW TRANSLATION
 hsa_global_reach_desc: "Rozšírené prijatie obchodu na globálnej úrovni otraslo merkantilistickým svetom v základoch. Teraz je bežné obchodovať s cudzími obchodníkmi zo všetkých kútov sveta a naša pokladnica z toho ťaží." # todo: CHANGED
 hsa_hanseatic_treasury: "$HSA_ADJ$ Pokladnica" # todo: CHANGED
 hsa_hanseatic_treasury_desc: "Silná ekonomika je len jedným z výsledkov našej prosperity. S dostatkom mincí a pretekajúcimi truhlicami sme sa etablovali ako robustní a spoľahliví veritelia." # todo: CHANGED
 hsa_regularized_contributions: "Štandardizované príspevky" # todo: NEW TRANSLATION
 hsa_regularized_contributions_desc: "Mnohé subjekty v rámci nášho zväzu musia byť podrobené pevnej kontrole, aby sme zjednotili ich mesačné a ročné príspevky do našej pokladnice." # todo: NEW TRANSLATION
 hsa_reform_the_hanstag: "Reformovať Hanstag" # todo: NEW TRANSLATION
 hsa_reform_the_hanstag_desc: "V časoch problémov a vyvíjajúcich sa myšlienok sa naše centrálné inštitúcie zhromaždení a rozhodovania musia prispôsobiť novým výzvam a paradigmám." # todo: CHANGED
 hsa_concept_of_mercantilism: "Koncept merkantilizmu" # todo: NEW TRANSLATION
 hsa_concept_of_mercantilism_desc: "V priebehu storočí sme usilovne pracovali na začlenení našich transakcií do globálneho obchodu. Teraz viac než kedykoľvek predtým musíme chrániť vlastných obchodníkov, aby sme nepadli za obeť frakcionizmu a zahraničnej konkurencii." # todo: CHANGED
 the_hansa_bank: "Banka $HSA$" # todo: CHANGED
 the_hansa_bank_desc: "Po zavedení nášho nového systému príspevkov môžeme založiť banku pre členov na používanie. Podporená zdrojmi Zhromaždenia, akreditív z banky bude rovnako dobrý ako hotovosť. To a ďalšie finančné nástroje dajú našim obchodníkom výhodu oproti iným krajinám." # todo: CHANGED
 pal_palatine_lion: "Palatínsky lev" # todo: NEW TRANSLATION
 pal_palatine_lion_desc: "Pochádzajúci z dynastického erbu rodu Wittelsbachovcov, Palatínsky lev je jadrom našej legitimity. Zobrazený s červenou korunou, znamená našu úlohu cisárskeho vikára a arc‑správcu Svätého rímskeho impéria. Pokiaľ bude Palatínsky lev hrdo vystavený na našom štíte, naša legitimita nebude spochybňovaná." # todo: NEW TRANSLATION
 pal_castles_on_rhine: "Hrady na Rýne" # todo: NEW TRANSLATION
 pal_castles_on_rhine_desc: "Postavením viacerých hradov na kľúčových miestach pozdĺž Rýna budeme môcť rozšíriť a upevniť kontrolu nad riekou a obchodom ním prechádzajúcim." # todo: CHANGED
 pal_cultivate_vineyards: "Vinice a sady Rýna" # todo: NEW TRANSLATION
 pal_cultivate_vineyards_desc: "Hoci naše územie je malé, slnečné brehy Rýna sú ideálne na vinohrady a sady. S trochu úsilia by tieto mohli udržať našu miestnu ekonomiku produkciou vína." # todo: CHANGED
 pal_protection_of_exclaves: "Miestne opevnenie" # todo: NEW TRANSLATION
 pal_protection_of_exclaves_desc: "Keďže naše územia sú rozptýlené, sme zraniteľní voči útokom viacerých cudzích mocností. Výstavba mnohých opevnených pevností v našich zemiach nám kúpi čas na zvolanie armády a odrazenie pokusu o obsadenie jednej z našich rozpojených provincií." # todo: NEW TRANSLATION
 pal_fractured_territory: "Konsolidovať územia" # todo: NEW TRANSLATION
 pal_fractured_territory_desc: "Naša administrácia je zručná v správe viacerých nesúvislých území bez straty kontroly. Vďaka tomu môžeme vybudovať silnú byrokraciu schopnú zvládnuť aj tie najnáročnejšie úlohy." # todo: CHANGED
 pal_a_just_ruler: "Mierny a pokojný vládca" # todo: NEW TRANSLATION
 pal_a_just_ruler_desc: "Jediný efekt krvi je vyvolať ďalšiu krv. Preto musíme byť spravodlivým vládcom a zmieriť sa s nepriateľmi, aby sme ustanovili trvalý mier na našich územiach." # todo: CHANGED
 pal_heaven_of_tolerance: "Palatínatská tolerancia" # todo: NEW TRANSLATION
 pal_heaven_of_tolerance_desc: "Nech už sú denominácie akékoľvek, všetci $christian_ADJ$ ľudia musia byť vítaní v mestách a obciach našej krajiny. Kým iní utláčajú náboženské menšiny, naša tolerancia zabezpečí stály prílev prisťahovalcov a my z toho profitujeme." # todo: CHANGED
 pal_mildness_to_the_commoners: "Odpustenie pre roľníkov" # todo: NEW TRANSLATION
 pal_mildness_to_the_commoners_desc: "Keď naše roľníctvo povstane proti šľachte, jednoznačne povstáva proti našej vlastnej vláde. Nemali by sme však prehnane trestať tých, ktorí sa vzbúrili. Miernejšími následkami budú všetci viac zladení s našou autoritou." # todo: NEW TRANSLATION
 pal_humanist_court: "Humanistické vzdelávanie" # todo: NEW TRANSLATION
 pal_humanist_court_desc: "Aby dobre vládli, naši vládci musia získať komplexné vzdelanie v humanistických ideách. Na tento účel musíme najať uznávaných humanistov na výchovu našich vládcov a dedičov a sústrediť náš dvor na tieto princípy." # todo: NEW TRANSLATION
 pal_heidelberg_catechism: "Heidelberský katekizmus" # todo: NEW TRANSLATION
 pal_heidelberg_catechism_desc: "Reformácia vyvolala mnoho diskusií o povahe našej viery. Mali by sme investovať do komplexného katekizmu, ktorému sa naše ľudstvo môže pridržiavať." # todo: NEW TRANSLATION
 pal_bilbiotheca_palatina: "Chrániť #italic Bibliotheca Palatina#!" # todo: NEW TRANSLATION
 pal_bilbiotheca_palatina_desc: "Bohatá na teologické spisy rôznych $christian_ADJ$ denominácií, #italic Bibliotheca Palatina#! je jedným z našich najcennejších pokladov. Ochrana vedomostí a kultúrnej hodnoty obsiahnutej v týchto dokumentoch musí byť vysokou prioritou, aby sme naďalej mohli spoľahnúť na jej materiály." # todo: NEW TRANSLATION
 palatinate_romanticism: "Podporiť romantické hnutie" # todo: NEW TRANSLATION
 palatinate_romanticism_desc: "Významná časť romantického hnutia je sústredená okolo $heidelberg$. Mali by sme tento fenomén využiť a podporiť týchto a iných umelcov, aby sme posilnili naše medzinárodné uznanie." # todo: CHANGED
 amazigh_slave_raids: "Amazighské otrocké nájazdy" # todo: NEW TRANSLATION
 amazigh_slave_raids_desc: "Naši pobrežní lúpežníci nám zabezpečujú stály prísun zajatcov z $europe$ cez námorné nájazdy a pobrežné vpády. Tento stabilný prísun zotročených osôb je kľúčový k rozšíreniu pracovnej sily a zvýšeniu hospodárskeho úspechu." # todo: CHANGED
 zenata_roots: "Korene Zenata" # todo: NEW TRANSLATION
 zenata_roots_desc: "Náš ľud pochádza zo Zenata, kmeňa známeho najmä pre svoju dôležitú vlnársku výrobu a zručnosť pri pastierstve veľkých stáda." # todo: CHANGED
 mor_marabouts: "Ṣūfí marabúti" # todo: NEW TRANSLATION
 mor_marabouts_desc: "Niekoľko skupín učiteľov Ṣūfí si urobilo z Maroka svoj domov. Musíme zabezpečiť, aby sme týmto svätým mužom poskytli útočisko a vzali si ich učenia k srdcu." # todo: NEW TRANSLATION
 trans_saharan_trade: "Transsaharský obchod" # todo: NEW TRANSLATION
 trans_saharan_trade_desc: "Karavány veľkých saharských trás obchodujú $salt$ a iné tovary z $north_africa$ za $slaves_goods$ a $goods_gold$ zo sub-saharských kráľovstiev. Cez tieto hodnotné kanály bohatstva budujeme naše veľké dedičstvo." # todo: CHANGED
 first_fleet_of_the_med: "Prvá flotila Stredozemia" # todo: NEW TRANSLATION
 first_fleet_of_the_med_desc: "Nekedy sa al-Muwaḥḥidūn pýchili tým, že vlastnili jedno z najmocnejších námorných síl v celom Stredozemí. Dnes náš ľud stále vlastní tradície a odborné znalosti, aby znovu rozhorel túto vášeň a obnovil našu veľkosť na oceánoch." # todo: CHANGED
 slave_soldiers: "Otroci‑vojaci" # todo: NEW TRANSLATION
 slave_soldiers_desc: "Aby sme mali lojálny zbor dobre vycvičených stálych vojakov, nasadíme disciplinovaných otrokárskych vojakov z našej spoločnosti." # todo: CHANGED
 desert_power: "Sila púšte" # todo: NEW TRANSLATION
 desert_power_desc: "Náš región obývajú mnohí roľníci a kmeňové skupiny, ktoré predstavujú nižšie vrstvy spoločnosti. Napriek relatívnej chudobe majú veľký vplyv na obchodné trasy medzi našimi mestami cez pusté púšte. Zahrnutím týchto ľudí pod našu jurisdikciu a zabezpečením ich lojality si budujeme mocné odnože púšte." # todo: CHANGED
 atlantic_trade_routes: "Atlantické obchodné trasy" # todo: NEW TRANSLATION
 atlantic_trade_routes_desc: "Úspešne navigované námorníkmi z $europe$, tieto nové morské trasy otvorili prítok tovarov a mincí z Nového sveta a Ďalekého východu." # todo: CHANGED
 foreign_politics: "Zahraničná politika" # todo: NEW TRANSLATION
 foreign_politics_desc: "Aby sme zvíťazili nad nepriateľmi, musíme nadviazať patričné diplomatické kanály a oficiálnu spoluprácu s krajinami, ktoré zdieľajú našu nepriateľskú náladu voči nim." # todo: CHANGED
 saharan_gold_trade: "Saharský $goods_gold$ obchod" # todo: CHANGED
 saharan_gold_trade_desc: "$goods_gold$ ťažené v našom území je vysokej kvality a výborným prostriedkom na rozšírenie nášho vplyvu na obchodné trasy s cudzími prístavmi." # todo: CHANGED
 jaysh_armies_advance: "Jaysh: armády" # todo: NEW TRANSLATION
 jaysh_armies_advance_desc: "Nastal nový vek vojenstva a spolu s ním potreba nových regimentov lojálnych síl. Jaysh bojovníci, naverbovaní z našej kmeňovej populácie, poskytujú disciplinovaných vojakov oboznámených s regionálnym bojom a miestnym terénom." # todo: CHANGED
 black_guard: "$a_black_guard$" # todo: NEW TRANSLATION
 black_guard_desc: "$a_black_guard_desc$" # todo: NEW TRANSLATION
 shurfa_status: "Šurfá' status" # todo: NEW TRANSLATION
 shurfa_status_desc: "Medzi všetkými ľuďmi $muslim_ADJ$ sveta je málo tých, ktorí sa môžu pýšiť potomstvom Veľkého Proroka. My samozrejme sme medzi tým šťastným málinkom." # todo: CHANGED
 maghrebi_administration: "Maghrebijská správa" # todo: NEW TRANSLATION
 maghrebi_administration_desc: "Storočia autonómie a drsné prostredie zrodili separatistické sklony medzi regionálnymi kmeňmi v našich hraniciach. Maghrebi správa rieši túto skutočnosť vytvorením siete regionálnych guvernérov, ktorí presadzujú centrálnu autoritu a vôľu panovníka pri rešpekte miestnych zvykov." # todo: CHANGED
 barid: "Barīd" # todo: NEW TRANSLATION
 barid_desc: "Poštová služba, ktorá siaha až na najodľahlejšie rohy nášho impéria, zodpovedá za všetku komunikáciu medzi naším hlavným mestom a miestnymi centrami moci po celej krajine." # todo: CHANGED
 karimi_merchants: "Kārimí obchodníci" # todo: NEW TRANSLATION
 karimi_merchants_desc: "Silní obchodníci, ktorí sa prevažne zaoberajú koreninami, títo námorní giganti zarobili veľa na toku exotického tovaru až po brehy $india$ — a ďalej." # todo: CHANGED
 mamluk_soldiers: "$a_mamluk_unit_traditions$" # todo: NEW TRANSLATION
 mamluk_soldiers_desc: "$a_mamluk_unit_traditions_desc$" # todo: NEW TRANSLATION
 royal_mamluks: "Královskí mamlukovia" # todo: NEW TRANSLATION
 royal_mamluks_desc: "Královskí mamlukovia sú elitné jadro mamluckej armády, slúžiace ako osobná garda sultána. Starostlivo vybraní a tvrdo cvičení, sú známi svojou lojálnosťou, výnimočnými bojovými schopnosťami a neochvejnou oddanosťou." # todo: NEW TRANSLATION
 red_sea_trade: "Obchod Červeného mora" # todo: NEW TRANSLATION
 red_sea_trade_desc: "Korzistický obchod cez Červené more je kľúčovým zdrojom nášho bohatstva a musíme nad ním získať plnú kontrolu. Hroziac podpáliť prambory Červeného mora mimo našej autority, ktoré prijímajú korzinové kúpy, môžeme získať leví podiel tohto lukratívneho obchodu. Možno s tým nezískame veľa priateľov, ale získame dosť zlata na naše potešenie." # todo: CHANGED
 mamluk_halqah: "$a_halqah_unit$" # todo: NEW TRANSLATION
 mamluk_halqah_desc: "$a_halqah_unit_desc$" # todo: NEW TRANSLATION
 reform_the_mamluk_corps: "$a_mamluk_unit_renaissance$" # todo: NEW TRANSLATION
 reform_the_mamluk_corps_desc: "$a_mamluk_unit_renaissance_desc$" # todo: NEW TRANSLATION
 kashif: "Kāshif" # todo: NEW TRANSLATION
 kashif_desc: "Naše sultanát je obrovské, a preto musíme robiť múdre, opatrné rozhodnutia o jeho správe. Zamestnať obzvlášť vzdelaných ľudí ako miestnych guvernérov je brilantný krok, ktorý by nakoniec posunul geopolitické váhy v náš prospech." # todo: CHANGED
 port_customs: "Prístavné clá" # todo: NEW TRANSLATION
 port_customs_desc: "Označenie našich prístavov ako oficiálnych obchodných zón pre prichádzajúci náklad je krok, ktorý určite zvýši obchodný význam nášho územia, aj keď to bude na úkor susedov a nepriateľov." # todo: CHANGED
 masters_of_the_nile: "Páni Nílu" # todo: NEW TRANSLATION
 masters_of_the_nile_desc: "Žilou nášho sultanátu je rieka Nílu. Pretínajúc našu krajinu, jej vody tvoria najúrodnejšie územia a jej životodarná sila prináša prosperitu a bohatstvo do celého nášho panstva." # todo: CHANGED
 indian_networks: "Indické siete" # todo: NEW TRANSLATION
 indian_networks_desc: "Naši obchodníci obchodujú s tovarmi z trhov $alexandria$ až po brehy Adenu a až ďaleko k $india$. Tieto rozsiahle siete kontaktov, obchodu a kapitálu nás postavili do popredia námorného obchodu." # todo: CHANGED
 study_foreign_gunpowder_techniques: "Zahraničný prach" # todo: NEW TRANSLATION
 study_foreign_gunpowder_techniques_desc: "Veľké impériá $europe$ a Východu dosiahli prelom vo využití strelného prachu a jeho vojenských aplikácií. Štúdium ich metód a implementácia zlepšení do vlastných zbraní by výrazne posilnili našu armádu." # todo: CHANGED
 secure_mediterranean_ports: "Zabezpečiť stredomorské prístavy" # todo: NEW TRANSLATION
 secure_mediterranean_ports_desc: "Naše prístavy po Stredozemnom mori patria medzi najbohatšie v regióne. Obchodníci z každého kúta známeho sveta prichádzajú do $alexandria$ a Káhiry obchodovať s koreninami, $silk$ a drahými kameňmi. Vytvorenie obchodnej flotily na uľahčenie a ochranu našich námorných ciest by bolo múdrym krokom." # todo: CHANGED
 bohemian_imperial_standing: "$BOH_ADJ$ $HRE_ADJ$ Stála sila" # todo: CHANGED
 bohemian_imperial_standing_desc: "Naše postavenie v rámci $hre$ je plné prestíže, veľkoleposti a autority. Len málo členov má toľko mäkkej moci ako my, vďaka našim schopným diplomatom a siete spojencov." # todo: CHANGED
 bohemian_crystal: "$BOH_ADJ$ Kryštál" # todo: CHANGED
 bohemian_crystal_desc: "Len máloktoré dielne v známom svete majú kapacitu vyrábať sklo a kryštál s rovnakou kvalitou a jasnosťou ako naše, nieto ešte konkurovať našim prepracovaným výrobným postupom." # todo: CHANGED
 students_of_foreign_courts: "Študenti cudzích dvorov" # todo: NEW TRANSLATION
 students_of_foreign_courts_desc: "Členovia našich kráľovských dynastií sú zvyknutí cestovať do zahraničia. Trávili veľkú časť svojho dospievania ako študenti slávnych dvorov ďaleko od domova v snahe získať dôkladné vyučovanie v štátovom hospodárení." # todo: CHANGED
 urbanization_decrees: "Dekréty o urbanizácii" # todo: NEW TRANSLATION
 urbanization_decrees_desc: "Ako súčasť snáh o modernizáciu $prague$ vydáme granty povzbudzujúce významné postavy presťahovať svoje podniky do hlavného mesta a ponúknuť privilégiá pre prilákanie zručných a bohatých zahraničných prisťahovalcov. Tento prílev talentu a kapitálu premení naše $prague$ na prosperujúcu, kozmopolitnú metropolu." # todo: CHANGED
 seat_of_metropolitan_bishop: "Sídlo metropolitného biskupa" # todo: NEW TRANSLATION
 seat_of_metropolitan_bishop_desc: "Národ $RUS_ADJ$ potrebuje pevné náboženské vedenie. Historicky sme dobre spolupracovali s Cirkevou a rozšírenie tohto vzťahu by prospelo nám všetkým. Ak presunieme sídlo metropolitného biskupa do $moscow$, posilníme putá medzi našou vierou a štátom." # todo: CHANGED
 pomestnoe_voisko: "Pomestnoe Voisko" # todo: NEW TRANSLATION
 pomestnoe_voisko_desc: "Prepojením pozemkov získaných konfiskáciou na šľachtických jazdcoch môžeme vybudovať novú triedu vojakov na obranu nášho kniežactva." # todo: CHANGED
 strength_of_the_boyars: "Sila bojarov" # todo: NEW TRANSLATION
 strength_of_the_boyars_desc: "Trieda Bojarov je v mnohých ohľadoch základom $RUS$, no rovnako ako ich musíme posilniť, musíme ich aj kontrolovať. Musíme chrániť miesta Bojarov v Dome (Dume), ale zároveň zabezpečiť, aby boli závislí od nás pre ďalšie posilnenie ich vplyvu." # todo: CHANGED
 zasechnaya_cherta: "Zasečná čerta" # todo: NEW TRANSLATION
 zasechnaya_cherta_desc: "Aby sme odolali neustálym tatárskym nájazdom, naši predkovia vybudovali líniu úzko postavených a dobre bránených pevností. Ako náš štát rastie, mali by sme pokračovať v rozširovaní tejto 'Abatis Line', aby sme zabezpečili ochranu ľudu pred cudzími útokmi." # todo: CHANGED
 russian_artillery_yard: "$RUS_ADJ$ Delostrelecká dielňa" # todo: CHANGED
 russian_artillery_yard_desc: "Nadvláda v paľbe rozhoduje, kto vyhrá obliehania dneška aj rozhodujúce otvorené bitky zajtrajška. Musíme postaviť špičkovú delostreleckú dielňu v srdci našej krajiny, aby naše armády nikdy nechýbali delá ani munícia." # todo: CHANGED
 life_long_conscription: "Doživotná branná povinnosť" # todo: NEW TRANSLATION
 life_long_conscription_desc: "Aby sme nasytili naše stále rastúce armády, mali by sme rozšíriť podmienky vojenskej služby tak, aby sa stala celoživotným záväzkom. To ponúkne sociálnu mobilitu tým, ktorí by inak žili v nižších povolaniach, a poskytne nám spoľahlivý zdroj vojakov pre naše impérium." # todo: CHANGED
 the_mestnichestvo_advance: "$the_mestnichestvo$" # todo: NEW TRANSLATION
 the_mestnichestvo_advance_desc: "$the_mestnichestvo_desc$" # todo: NEW TRANSLATION
 table_of_ranks: "Tabuľka hodností" # todo: NEW TRANSLATION
 table_of_ranks_desc: "Zrušenie Mestničestva bolo prvým krokom k vytvoreniu viac meritokratického štátneho aparátu. Tabuľka hodností ďalej kodifikovala tento princíp, pričom vojenské postupy sú viazané na výkon namiesto pôvodu." # todo: CHANGED
 voivode_advance: "Voivoda" # todo: NEW TRANSLATION
 voivode_advance_desc: "#italic voivode#! je vojenský veliteľ s regionálnou administratívnou právomocou, ktorý bráni územie a udržiava poriadok. Voivode môže byť užitočný pri prekonávaní výziev obmedzených komunikačných prostriedkov, pretože má právomoc robiť rozhodnutia bez čakania na schválenie." # todo: CHANGED
 haudenosaunee_tradition: "Dedičstvo Hiawathu" # todo: NEW TRANSLATION
 haudenosaunee_tradition_desc: "Legendárny Hiawatha, uctievaný medzi $IRO_ADJ$ ľudom ako veľký rečník a vodca, stanovil vysoký štandard diplomacie. Uctíme ho nasledovaním jeho príkladu v našich diplomatických vzťahoch." # todo: CHANGED
 haudenosaunee_heritage: "Divocí bojovníci" # todo: NEW TRANSLATION
 haudenosaunee_heritage_desc: "Bolo by chybou považovať nás za slabých kvôli našej diplomatickej sile. Naši bojovníci sú rovnako suroví a hrdí ako tí z ktoréhokoľvek militaristického spoločenstva a podcenenie ich je najčastejšou príčinou smrti našich rivalov." # todo: CHANGED
 tree_of_peace: "Strom mieru" # todo: NEW TRANSLATION
 tree_of_peace_desc: "Strom pokoja je dedičstvom Veľkého zmieriteľa a symbolom nášho záväzku k jednote medzi rôznymi kmeňmi, ako aj reprezentáciou samotných náčelníkov." # todo: CHANGED
 kainerekowa: "Kaianere'kó:wa" # todo: NEW TRANSLATION
 kainerekowa_desc: "Musíme vždy ctít prácu Hiawathu a Veľkého zmieriteľa, Veľkého zákona pokoja, ktorý zjednotil našich päť národov pod jediným účelom a dal nám naše pravidlá správy." # todo: CHANGED
 mourning_wars: "Smútočné vojny" # todo: NEW TRANSLATION
 mourning_wars_desc: "Je dlhodobou tradíciou nášho ľudu adoptovať zajatých bojovníkov do našich kmeňov. Avšak aby sme doplnili naše počty a zaistili obrannú i útočnú silu, mali by sme usilovať o adopciu celých kmeňov do $IRO$, nielen jednotlivcov." # todo: CHANGED
 warriors_unity: "Jednota bojovníkov" # todo: NEW TRANSLATION
 warriors_unity_desc: "Nemusíme byť najväčší kmeň z hľadiska počtu, ale naša kmeňová povaha nám dáva to, čo ostatným chýba: jednotu! Naši bojovníci bojujú ako bratia a stoja spolu na bojisku. Pokiaľ túto tradíciu zachováme, nemôžeme prehrať!" # todo: CHANGED
 haudenosaunee_ambition: "Vzorová konfederácia" # todo: NEW TRANSLATION
 haudenosaunee_ambition_desc: "Konfederácia $IRO$ sa stala vzorom úspechu. Všetky národy okolo nás sú ohromené naším vynikajúcim vládnutím!" # todo: CHANGED
 three_sisters: "Poľnohospodárstvo troch sestier" # todo: NEW TRANSLATION
 three_sisters_desc: "Naša zem je úrodná, bohatá na plodiny, no spôsob pestovania kukurice, fazule a tekvice spolu patrí k našim najväčším poľnohospodárskym úspechom. Spoločne pestované plodiny dávajú vyšší výnos než keď sa sádzajú samostatne." # todo: CHANGED
 maple_syrup: "Javorový sirup" # todo: NEW TRANSLATION
 maple_syrup_desc: "Množstvo javora v našej krajine produkuje veľké množstvo miazgy, ktorú možno zhromažďovať a variť na chutný sladký sirup a iné dobroty." # todo: CHANGED
 stickball_game: "Hra stickball" # todo: NEW TRANSLATION
 stickball_game_desc: "Starobylá tradícia hrania stickballu je súčasťou našej kultúry po celé veky. Používaná pri rituáloch alebo na urovnanie sporov, stovky bojovníkov sa zhromažďujú na poli s drevenými palicami a jedným guličkovým loptičkou, ktorú treba nasmerovať k vyznačenému cieľu. Táto prax nielenže zbližuje náš ľud, ale udržuje našich bojovníkov vo výbornej kondícii." # todo: CHANGED
 wampum: "Wampum" # todo: NEW TRANSLATION
 wampum_desc: "Zmes bielych a fialových korálok z rôznych mušlí, wampum sa používa na mnohé účely, ako zaznamenávanie zmlúv a ústnych dejín, uľahčovanie diplomacie a slúženie ako prostriedok výmeny pri obchode. Wampum sa objavuje všade, kam kráča náš ľud." # todo: CHANGED
 shared_brotherhood: "Zdieľané bratstvo" # todo: NEW TRANSLATION
 shared_brotherhood_desc: "Zjednotení v učení Veľkého zákona mieru, náš ľud si udržiava silný zmysel pre bratstvo a jednotu, napriek ich rozdielnemu kmeňovému pôvodu." # todo: CHANGED
 captives_in_war: "Zajatci vo vojne" # todo: NEW TRANSLATION
 captives_in_war_desc: "Vojny vedieme hlavne kvôli zajatiu, ktoré nahrádza naše vlastné straty. Nie všetkých zajatcov však treba adoptovať do kmeňa; niektorí môžu byť namiesto toho využití ako pracovná sila." # todo: CHANGED
 haudenosaunee_present_giving: "$IRO_ADJ$ Darovanie darov" # todo: CHANGED
 haudenosaunee_present_giving_desc: "Základom našich obchodných interakcií je výmena darov. Keď sa náš ľud zjednotí a pracuje pre dobro celku, akt darovania je vždy sprevádzaný odplatným darom." # todo: NEW TRANSLATION
 pochtecayotl: "Pōchtēcayōtl" # todo: NEW TRANSLATION
 pochtecayotl_desc: "Obchodníci cestujú ďaleko, do provincií ďaleko za hranicami našej moci, ba aj na územia našich rivalov. Ak by títo obchodníci, snáď, slúžili aj ako naše oči a uši, aké tajomstvá by sme sa mohli dozvedieť?" # todo: CHANGED
 warrior_societies: "Vojenské spoločnosti" # todo: NEW TRANSLATION
 warrior_societies_desc: "Naša spoločnosť je pozoruhodne dynamická, ponúkajúc obyčajným ľuďom, nazývaným #italic mācēhualtin#!, cestu stať sa #italic pīpiltin#!, teda šľachtou, vďaka výnimočnej vojenskej službe cez honorárny systém rangu #italic tlahuiztli#!. Táto jedinečná možnosť sociálneho postupu dáva nášmu ľudu jasnú výhodu oproti susedným spoločnostiam." # todo: CHANGED
 chinampas: "Chinampy" # todo: NEW TRANSLATION
 chinampas_desc: "Zruční v terasovaní kopcov na pestovanie a šikovní v tvorbe orných plôch na plytkých častiach jazier prostredníctvom vynaliezavých #italic chinampas#!, poľnohospodárske schopnosti nášho ľudu výrazne prospejú spoločnosti." # todo: NEW TRANSLATION
 people_of_war: "Ľud vojny" # todo: NEW TRANSLATION
 people_of_war_desc: "Či už berieme zbrane za slávou, aby sme zasiali strach do nepriateľov, chytali zajatcov na obete, alebo jednoducho získavali bohatstvo, náš ľud je zvyknutý na neustály stav vojny a znáša jeho útrapy s väčšou odolnosťou než členovia iných národov." # todo: CHANGED
 tlahtocayotl: "Tlahtohcāyōtl" # todo: NEW TRANSLATION
 tlahtocayotl_desc: "Vytvoríme systém provincii pre mestské štáty integrované do našej ríše v snahe zcentralizovať moc." # todo: CHANGED
 calpixcayotl: "Calpixcāyōtl" # todo: NEW TRANSLATION
 calpixcayotl_desc: "Naše tributárne regióny dostanú menovaných zberačov tribútov, nazývaných #italic calpixqueh#!, ktorí budú zodpovední za zabezpečenie nepretržitého toky tribútov. V každom tributárnom štáte bude #italic calpixqui#! v regióne a ďalší v hlavnom meste nášho štátu." # todo: CHANGED
 reformed_telpochcalli: "Reformované Tēlpōchcalli" # todo: NEW TRANSLATION
 reformed_telpochcalli_desc: "Keď čelíme novým nepriateľom, musia sa vyvinúť alebo osvojiť nové vojenské taktiky. Tieto nenahraditeľné poznatky sa budú vyučovať v našich #italic Tēlpōchcalli#!." # todo: NEW TRANSLATION
 nahuatl_domination: "$nahua_culture$ Dominancia" # todo: CHANGED
 nahuatl_domination_desc: "Nadriadenosť kultúry $nahua_culture$ je zrejmá, keď susedné národy ju stále častejšie preberajú. Toto kultúrne šírenie a nárast vplyvu otvára príležitosti, aby sme rozšírili svoju politickú kontrolu ďaleko za hranice." # todo: CHANGED
 the_return_of_quetzalcoatl: "Návrat Quetzalcōātl" # todo: NEW TRANSLATION
 the_return_of_quetzalcoatl_desc: "Kontakt s cudzincami z iných kontinentov nám dal zaujímavé nové predstavy o našich bohoch. #italic Quetzalcōātl#! proroctvo odhaľuje realitu za mýtmi — záblesk pravdy. #italic Quetzalcōātl#!, 'Perovitý had', sa čoskoro vráti a ohlási transformačnú éru, zaháňajúc temnotu za osvetlenie. Symbolizujúc kozmickú fúziu, spojí hmotu a ducha, obnoví rovnováhu a povýši ľudské vedomie." # todo: CHANGED
 brave_as_hummingbird: "Odvážny ako vták kolibrík" # todo: NEW TRANSLATION
 brave_as_hummingbird_desc: "Kolibrík zohráva kľúčovú úlohu v našej mytológii. Spojený s bohom vojny Huītzilōpōchtlim, stelesňuje reinkarnáciu padlých bojovníkov a cení sa za svoju odvahu. Kolibrík sa stane novým symbolom našich prápory, inšpirujúc našich vojakov bojovať až do smrti!" # todo: CHANGED
 new_trade_opportunities: "Nové obchodné príležitosti" # todo: NEW TRANSLATION
 new_trade_opportunities_desc: "Potreby nášho ľudu sa prispôsobujú novým trhom, ktoré sa otvorili našim obchodníkom, a školíme našich kupcov v metódach maximalizácie výnosov." # todo: CHANGED
 aztec_chargers: "$AZT_ADJ$ Chargers" # todo: NEW TRANSLATION
 aztec_chargers_desc: "Agresívna povaha našich bojovníkov je známa — a obávaná — aj za hranicami. Keď začína bitka, naši nepriatelia sa trasú pri pohľade na našich bojovníkov trúsiacich sa na nich s divokosťou, akoby ich mali prebehnúť poslovia Smrti samotnej." # todo: CHANGED
 chasqui: "Chasqui" # todo: NEW TRANSLATION
 chasqui_desc: " #italic chasquis#! sú poslovia nášho štátu. Vyberaní z najzdatnejších a najodolnejších bežcov v krajine, títo agilní muži nesú $quipu$ šnúry, správy, dary a iné informácie a doručujú ich adresátom. Šírenie ideí ako aj väčšina našej diplomacie leží na ich pleciach." # todo: CHANGED
 military_mita: "Vojenská Mit'a" # todo: NEW TRANSLATION
 military_mita_desc: " #italic mit'a#! je povinný systém verejnej služby, základ Inkskej spoločnosti, a tvorí chrbticu vojenskej služby. Každý #italic ayllu#! musí prispieť schopnými mužmi, prispôsobenými boju v horách, aby poskytli pracovnú silu pre štátne projekty a vojenskú službu." # todo: CHANGED
 warachikuy: "Warachikuy" # todo: NEW TRANSLATION
 warachikuy_desc: " #italic warachikuy#! je svätý obrad, kde sú mladí muži skúšaní vo svojich zručnostiach, statočnosti a vynaliezavosti, ako aj vo fyzických schopnostiach ako beh, streľba, boj a odolnosť pri predĺženom vynechaní spánku. Tí, ktorí tieto skúšky vynikajúco prejdú, sú povýšení na dôstojnícke hodnosti v našej stále rastúcej armáde." # todo: CHANGED
 mitma: "Povinnosti Mitma" # todo: NEW TRANSLATION
 mitma_desc: "Aby naši panovníci v minulosti mohli podnikať veľké stavebné projekty, museli splniť starodávne tradície pozvaním každého malého náčelníka do hlavného mesta, obdarovať ich a usporiadať veľké hostiny. Ako náš štát rastie, toto už nie je ideálny spôsob na vykonávanie týchto prác. Dodávanie práce a materiálov na stavbu by mala byť povinnosťou každého náčelníka v našich krajinách." # todo: CHANGED
 quipu: "Quipu" # todo: NEW TRANSLATION
 quipu_desc: "Systém používajúci uzly na šnúre na ukladanie informácií, účtovníctvo a ďalšie informačné úkony. Každý uzol predstavuje číslo od nuly do deväť. Uzly môžu tiež odkazovať na logogramy na tej istej šnúre. Uzly ukazujú, ktorá slabika v logograme sa má použiť, a kombinovaním viacerých šnúr možno tvoriť vety." # todo: CHANGED
 drafted_hatun_runas: "Povolaní Hatun Runas" # todo: NEW TRANSLATION
 drafted_hatun_runas_desc: " #italic Hatun Runas#! sú dedinský ľud našej ríše. Jeden z päťdesiatich mužov je vybraný do vojenskej služby vo svojich dvadsiatych piatych narodeninách a branci sú povolaní na nasledujúcich sedem rokov. Tento systém brannej služby nám pomáha udržiavať značnú profesionálnu armádu s disciplínou prevyšujúcou sily našich protivníkov." # todo: CHANGED
 llama_michis: "Lama Michis" # todo: NEW TRANSLATION
 llama_michis_desc: "Lamy majú v našej spoločnosti mnohé funkcie. Slúžia ako ťavy, sú obetované, poskytujú mäso a vlnu, a dokonca nám dávajú hnoj pre naše polia. Kontrolou chovu a využitia lam prostredníctvom vládnych #italic michis#!, čiže pastierov, zabezpečíme prísne sledovanie populácie lam. To poskytne príležitosť pre nárast ich počtu." # todo: CHANGED
 inc_tambo: "Vylepšené stanice Tambo" # todo: NEW TRANSLATION
 inc_tambo_desc: "Náš systém ciest je jedným z najcennejších aktív ríše. Aby sme ešte viac prospeli armáde a správe, vystavíme #italic tambo#! stanice pozdĺž všetkých hlavných ciest. Tieto stanice budú postavené na vzdialenosť jediného dňa pochodu a poskytnú úkryt a zásoby pre cestujúcich." # todo: CHANGED
 adapted_incan_army: "Adaptabilná inkaská armáda" # todo: CHANGED
 adapted_incan_army_desc: "Nájazdníci zo zvláštnych krajín vkročili na naše územie a ohrozujú našu existenciu. No naše armády sú prispôsobivé; prispôsobujú sa novým taktikám nepriateľa, naučia sa používať vlastné zbrane proti nim a bojujú s neslomnou odhodlanosťou inšpirovanou protivníkmi." # todo: CHANGED
 pukara_advance: "$pukara_building$" # todo: NEW TRANSLATION
 pukara_advance_desc: "$pukara_building_desc$" # todo: NEW TRANSLATION
 terraces_advance: "$terraces$" # todo: NEW TRANSLATION
 terraces_advance_desc: "$terraces_desc$" # todo: NEW TRANSLATION
 tambo_advance: "$tambo$" # todo: NEW TRANSLATION
 tambo_advance_desc: "$tambo_desc$" # todo: NEW TRANSLATION
 incamisana_advance: "$incamisana$" # todo: NEW TRANSLATION
 incamisana_advance_desc: "$incamisana_desc$" # todo: NEW TRANSLATION
 kor_fortresses_of_goguryeo: "Pevnosti Goguryeo" # todo: NEW TRANSLATION
 kor_fortresses_of_goguryeo_desc: "$korea_region$ bolo kedysi domovom mnohých kráľovstiev. Napriek tomu vplyv jedného kráľovstva obzvlášť pretrváva dodnes: Goguryeo, predchodca Goryeo. Goguryeo nám zanechalo mnoho odkazov, vrátane kamenných opevnení a techník stavby hradov, ktoré sa používajú až do dnes." # todo: CHANGED
 kor_korean_artisanry: "$korean_culture$ Remeselníctvo" # todo: CHANGED
 kor_korean_artisanry_desc: "$korea_region$ vždy mala umelecké tradície, no umenie naozaj rozkvitlo po našom národnom zjednotení, uvádzajúc nás do zlatého veku kultúrnych úspechov. Medzi našimi mnohými úspechmi vyniká remeselníctvo nášho ľudu ako maják zručnosti a kultivovanosti." # todo: CHANGED
 kor_korean_barracks_advance: "$korean_barracks$" # todo: NEW TRANSLATION
 kor_korean_barracks_advance_desc: "$korean_barracks_desc$" # todo: NEW TRANSLATION
 kor_court_poetry: "Dvorová poézia" # todo: NEW TRANSLATION
 kor_court_poetry_desc: "Naša aristokracia kladie veľký dôraz na kultúrny rozvoj ducha a mysle. Literatúra, ako poézia v $classical_chinese_language$, je u dvora veľmi cenená. Šľachta i vládnuca trieda sú nadšení kultúrnym dopadom písaného slova." # todo: CHANGED
 kor_metal_movable_type: "Kovové pohyblivé písmo" # todo: NEW TRANSLATION
 kor_metal_movable_type_desc: "Pohyblivý typ je staroveká tlačová technológia používaná ľudmi $CHI_ADJ$ už pred mnohými storočiami. Avšak dynastia Goryeo vyvinula kovovú formu pohyblivého typu, čím zefektívnila tlač. Teraz môžeme tlačiť knihy s bezprecedentnou efektivitou." # todo: CHANGED
 kor_gunpowder_engines: "Mechanizmy s čiernym prachom" # todo: NEW TRANSLATION
 kor_gunpowder_engines_desc: "Naše sily poznajú taktické využitie pušného prachu už stáročia. Reverzným inžinierstvom dizajnov $CHI_ADJ$ a vďaka inováciám Choe Museona sme zvládli výrobu pušného prachu aj konštrukciu strojov, ktoré ho vojensky využívajú." # todo: CHANGED
 kor_hwachas_advance: "$a_hwacha$" # todo: NEW TRANSLATION
 kor_hwachas_advance_desc: "$a_hwacha_desc$" # todo: NEW TRANSLATION
 kor_early_turtle_ship_advance: "$n_early_turtle_ship$" # todo: NEW TRANSLATION
 kor_early_turtle_ship_advance_desc: "$n_early_turtle_ship_desc$" # todo: NEW TRANSLATION
 kor_korean_gunnery: "$korean_gunnery$" # todo: NEW TRANSLATION
 kor_korean_gunnery_desc: "Ako sa technológia pušného prachu zlepšuje, rastie aj naša vynaliezavosť, a v dôsledku toho sme vyvinuli nový obranný systém. Hoci je jednoduchý v koncepcii i realizácii, inštalácia diel v našich opevneniach výrazne zvýši ich obranné schopnosti." # todo: CHANGED
 kor_hangeul_alphabet: "Abeceda Hangeul" # todo: NEW TRANSLATION
 kor_hangeul_alphabet_desc: "Jazyk $korean_language$ je tak zásadne odlišný od akejkoľvek formy $chinese_language_family$, že použitie $chinese_language_family$ znakov robí väčšinu ľudí, okrem najvzdelanejších, negramotnými. Naša nová abeceda je vedeckejšia a umožní všetkým ľuďom čítať a písať vo vlastnom jazyku." # todo: CHANGED
 kor_grand_code: "Veľký zákon pre štátnu správu " # todo: NEW TRANSLATION
 kor_grand_code_desc: "Aby sme zaistili správne a stabilné vládnutie, musíme najprv kodifikovať presne, ako vláda bude fungovať. To bude základom prvej písomnej ústavy nášho národa." # todo: CHANGED
 kor_border_defense_council: "Rada pre obranu hraníc" # todo: NEW TRANSLATION
 kor_border_defense_council_desc: "Naše hranice sú neustále ohrozované, či už barbaormi zo severu, alebo pirátmi z mora. Aby sme zabezpečili, že naše armády sú vždy pripravené rýchlo čeliť každej hrozbe, zriadime radu dôstojníkov venovanú kontrole a zabezpečeniu hraníc." # todo: CHANGED
 kor_panokseon_advance: "$n_panokseon$" # todo: NEW TRANSLATION
 kor_panokseon_advance_desc: "$n_panokseon_desc$" # todo: NEW TRANSLATION
 kor_korean_cannon: "Kanón $korean_culture$" # todo: CHANGED
 kor_korean_cannon_desc: "Hoci už máme bohaté skúsenosti s použitím pušného prachu a diel, nemali by sme prestať v technologickom vývoji. Vývoj menších, no odolnejších diel a vynájdenie efektívnejších spôsobov znovunabíjania zrevolucionizuje našu artériu a veľmi prospeje armáde aj námornej sile." # todo: CHANGED
 hyanyak_system: "Systém Hyangyak" # todo: CHANGED
 hyanyak_system_desc: "Poľnohospodárstvo je základom nášho hospodárstva, preto je efektívne riadenie dedín nesmierne dôležité. Zavedieme systém #italic hyangyak#!, ktorý ustanovuje samosprávu pre dediny. Tieto dohody stanovujú normy správania, pravidlá riešenia sporov a ďalšie občianske postupy zamerané na vytvorenie stabilných, sebestačných komunít." # todo: CHANGED
 kor_geobukseon: "Geobukseon" # todo: NEW TRANSLATION
 kor_geobukseon_desc: "Obrana našich pobreží je kľúčová pre naše prežitie, a v dôsledku tejto ostražitosti sme vyvinuli geniálnu 'korytnačiu loď'. Tieto ťažko obrnené kolosy zaistia, že žiadna nepriateľská loď neprenikne do našich pobrežných oblastí." # todo: CHANGED
 kor_hopae_system: "Systém Hopae" # todo: NEW TRANSLATION
 kor_hopae_system_desc: " #italic hopae#! je systém identifikačných štítkov vyžadujúci, aby všetci ľudia $korean_culture$ nosili dôkaz mena, miesta narodenia, postavenia a bydliska. To umožňuje úradom rýchlo overiť totožnosť a podľa potreby sledovať pohyb osoby." # todo: CHANGED
 kor_daedongbeop: "Daedongbeop" # todo: NEW TRANSLATION
 kor_daedongbeop_desc: "Nový súbor reforiem, ktoré postupne zavedú doteraz prehliadané zlepšenia do daňového systému. Odvod tribútneho poplatku uložného na domácnosti bude nahradený jednotnou daňou z ornej pôdy a daň z tovaru bude obmedzená kvótou, ktorá umožní podnikavým sedliakom a veľkoobchodníkom vytvárať a predávať prebytočný tovar. To znamená nižšie dane pre sedliakov, zvýšené príjmy pre štát a celkový nárast obchodu." # todo: CHANGED
 natural_seamanship: "Prírodné námorné zručnosti" # todo: NEW TRANSLATION
 natural_seamanship_desc: "S rastom nášho rybolovu sa rozšíril aj počet námorníkov v ríši. Mali by sme využiť túto príležitosť a naverbovať niektorých z nich do našej flotily, pretože námorníctvo je rovnako dôležité ako samotná loď." # todo: CHANGED
 call_of_our_forefathers: "Volanie našich predkov" # todo: NEW TRANSLATION
 call_of_our_forefathers_desc: "Dávno predtým naši slávni predkovia vyplávali a zakladali kolónie na severe. Naše ságy dokonca hovoria, že dosiahli nový svet a založili Vinland. Musíme ísť v ich šľapajách." # todo: CHANGED
 pioneer_spirit: "Duch priekopníkov" # todo: NEW TRANSLATION
 pioneer_spirit_desc: "V dávnych časoch naši ľudia čelili otvorenému moru, aby zakladali kolónie na vzdialených brehoch. Oživme v našom ľude ducha dobrodruhov, aby znova vyplávali!" # todo: CHANGED
 nor_shipbuilding: "Vojenské lodiarstvo" # todo: NEW TRANSLATION
 nor_shipbuilding_desc: "Rozšírenie nášho rybolovného priemyslu viedlo aj k rozvoju stavby lodí. Máme k dispozícii pripravenú základňu školených lodiarov na rozšírenie našej produkcie." # todo: CHANGED
 write_new_sagas: "Písať nové ságy" # todo: NEW TRANSLATION
 write_new_sagas_desc: "Bystré mysle uchovávajú poznanie\nZnámé od dávnych čias\nSpievané za súmraku\nSagy sú naše dedičstvo\nPodporené založením\nKaždá krajina bude mať svoje vlastné" # todo: CHANGED
 expansive_policies: "Expanzívna politika" # todo: NEW TRANSLATION
 expansive_policies_desc: "$brandenburg_area$ má chudobnú piesočnatú pôdu, za čo si vyslúžila nepeknú prezývku 'Pieskovisko $hre$.' Táto bieda však poháňala markgrófov k agresívnej expanzii a uplatňovaniu nárokov na susedné územia. Tieto dobytia urobili našu krajinu oveľa kultúrne rozmanitejšou než zvyšok Ríše." # todo: CHANGED
 northern_march: "Severná pohraničná marka" # todo: NEW TRANSLATION
 northern_march_desc: "V raných dňoch $hre$ bola oblasť $brandenburg_area$ osídlená a spravovaná kmeňmi $slavic_group$, až kým cisár nevytvoril Severnú marku, aby oblasť podrobil a opevnil. Postupom času sa táto Severná marka premenila na $brandenburg_area$, stávajúc sa jedným z najdôležitejších regiónov $hre$." # todo: CHANGED
 divide_estates: "Rozdeliť stavy" # todo: NEW TRANSLATION
 divide_estates_desc: "Zjednotené tri stavy tvoria účinný blok proti moci panovníka. Aby sme konsolidovali našu kontrolu, musíme systematicky využiť šľachtu proti ostatným stavom." # todo: CHANGED
 soldiers_fortune: "Žoldnieri" # todo: NEW TRANSLATION
 soldiers_fortune_desc: "Naše krajiny sú väčšinou riedko osídlené a obkolesené nepriateľmi. Nutnosť silnejšej obrany nás prinútila najímať vojakov zo zahraničia, ktorí budú bojovať pod našou zástavou za odmenu." # todo: CHANGED
 iron_tooth: "Železný zub" # todo: NEW TRANSLATION
 iron_tooth_desc: "Posilnenie kontroly dvora nad zemami markgrófstva dá nášmu vládcovi prívlastok #italic Iron Tooth#!, akoby sme na neho zahryzli ako útočný pes. Naša vláda zanechá stopu na národe, stopu, ktorá vzbudí hrdosť a lojalitu aj v najnižšie postavenom sedliakovi v $brandenburg_area$." # todo: CHANGED
 kammergericht: "Založiť Kammergericht" # todo: NEW TRANSLATION
 kammergericht_desc: "Aby sme zregularizovali kontrolu Marky Braniborskej, nahradíme miestne obyčajové právo rímskym právom. Ďalej zregulujeme súdnictvo presunom Najvyššieho súdu z dvora voliteľného kniežaťa, ktorý má tendenciu sa premiestňovať, na pevné centrálne miesto. To súčasne zlepší spravodlivosť a obmedzí moc miestnych magnátov." # todo: CHANGED
 margrave_council: "Tajná rada Kurmarky" # todo: NEW TRANSLATION
 margrave_council_desc: "Autorita markgrófa je vystavená veľkému ohrozeniu v dôsledku stále rastúcej moci našich Stavov. Stavy sú pre národ veľkým prínosom, no hrozba, ktorú predstavujú pre našu moc, si vyžaduje vytvorenie novej rady, ktorá zredukuje reálnu moc stavov do viac poradnej pozície pre markgrófa. Takto si môžeme naďalej užívať prínosy našich Stavov pri menších obavách o ich požiadavky." # todo: CHANGED
 religious_toleration: "Náboženská tolerancia" # todo: NEW TRANSLATION
 religious_toleration_desc: "Stabilita v našich domovských regiónoch je kľúčom k nášmu úspechu inde. Rozširovaním sa a súčasným podporovaním náboženskej tolerancie zlepšíme nielen stabilitu doma, ale urobíme aj z nášho štátu útočisko pre tých, ktorí utekajú pred prenasledovaním inde." # todo: CHANGED
 army_professionalism: "Profesionalizmus armády" # todo: NEW TRANSLATION
 army_professionalism_desc: "Ako sme sa naučili z perského vpádu do Grécka dávno predtým, malá armáda dokáže poraziť väčšiu — ak má železnú disciplínu a správne výcvik. Musíme pozdvihnúť našu armádu, aby spĺňala tieto mimoriadne štandardy." # todo: CHANGED
 soldier_king: "Vojak-kráľ $PRU$" # todo: CHANGED
 soldier_king_desc: "Väčšina štátov sú krajiny, ktoré majú armádu. $PRU$ je naopak armáda, ktorá má krajinu! Mnohí králi $PRU$ boli rovnako vojakmi ako panovníkmi; každý ukončil svoje panovanie nielen reformou štátu, ale i zanechaním trvalého vplyvu na armádu." # todo: CHANGED
 auftragstaktik: "Auftragstaktik" # todo: NEW TRANSLATION
 auftragstaktik_desc: " #italic Auftragstaktik#!, alebo 'misiová taktika', je systém, v ktorom sú podriadení velitelia informovaní o cieľoch bitky alebo vojny svojimi nadriadenými a potom sú im umožnené konať na vlastnú iniciatívu. Tento systém umožňuje našim práporom rozvinúť bližší vzťah s ich veliteľmi, prinášajúc lepšie výsledky." # todo: CHANGED
 goose_step: "Husí pochod" # todo: NEW TRANSLATION
 goose_step_desc: "Hoci vyzerá trochu zvláštne, 'husí krok' je navrhnutý tak, aby pomáhal našim mužom držať líniu pri postupe na nepriateľa. To poskytuje našim armádam hmatateľnú výhodu na bojisku." # todo: CHANGED
 mounted_people: "Jazdný ľud" # todo: NEW TRANSLATION
 mounted_people_desc: "Náš ľud na koni vzkvétal po stáročia, a tieto majestátne tvory sú neoddeliteľnou súčasťou našej kultúry a moci. Sme hrdí na naše bezkonkurenčné zručnosti v chove koní a umení jazdectva a streľby z jazdy, ktoré prispievajú k našej nadvláde na bojisku." # todo: CHANGED
 falconry_mastery: "Majstrovstvo sokoliarstva" # todo: NEW TRANSLATION
 falconry_mastery_desc: "Hlboko zakorenená v našej kultúre, sokoliarstvo predstavuje puto medzi naším ľudom a týmito vznešenými dravcami, a zdokonalili sme zručnosť v tomto starodávnom umení. Naši sokoliari sú známi schopnosťou trénovať tieto raptory na lov a zadržanie koristi." # todo: CHANGED
 rich_lands: "Bohaté krajiny" # todo: NEW TRANSLATION
 rich_lands_desc: "Naše krajiny sú bohaté na úrodnú pôdu a zdroje od prérí po husté lesy, pripravené na premenu našimi húževnatými mužmi a ženami. Použijeme všetky dostupné prostriedky na múdre riadenie darovanej zeme a tak prinesieme prosperitu každej domácnosti." # todo: CHANGED
 jurchen_honor: "Jurchenská česť" # todo: NEW TRANSLATION
 jurchen_honor_desc: "Náš ľud miluje prejavy sily a iné ukážky zručnosti; každý Jurchen verí, že ukázaním svojich schopností získa úctu rovesníkov. Táto oprávnená sebaúcta robí našich bojovníkov nesmierne odvážnymi, pripravenými bojovať proti kohokoľvek." # todo: CHANGED
 unite_the_tribes: "Zjednotiť kmene" # todo: NEW TRANSLATION
 unite_the_tribes_desc: "Od vzniku národa boli Jurcheni zjednotení a rozdelení do viacerých kmeňov a aliancií, nie vždy priateľských. Tento dynamický stav je s nami od nepamäti — rovnako ako túžba zjednotiť všetky kmene pod jednou zástavou. Prišiel čas uspokojiť toto dlho snívané želanie!" # todo: CHANGED
 leader_under_sky: "Vodca pod nebom" # todo: NEW TRANSLATION
 leader_under_sky_desc: "Náš ľud je už príliš dlho rozdelený a potrebujeme niekoho dosť silného, aby ich zjednotil a donútil svet sa pred nami triasť. Nebo bude viesť činy a myšlienky tohto vodcu a ukáže nám jasnú budúcnosť." # todo: CHANGED
 foraging_our_way: "Zháňanie potravy" # todo: NEW TRANSLATION
 foraging_our_way_desc: "Sme lovci a žijeme v súlade s prírodou, aj tí z nás v mestách. Je v našej krvi nájsť správnu cestu v tmavom lese; vedieť, ktoré dary prírody si vziať. Táto múdrosť nám umožňuje prežiť kdekoľvek bez ťažkostí." # todo: CHANGED
 deliberative_council: "Deliberačná rada kniežat a ministrov" # todo: NEW TRANSLATION
 deliberative_council_desc: "Pôvodne nazývaná 'Rada rozmyslu', táto inštitúcia vznikla z neformálnych orgánov podporujúcich spoluprácu medzi vodcami ríše. Štruktúra Rady sa transformovala, zameriavajúc sa na kolektívne aristokratické vládnutie a politické deliberácie, najmä v zahraničných a vojenských záležitostiach. Členstvo je obmedzené na vojenských veliteľov mimo cisárskeho klanu, čo zabezpečuje účasť elity a zároveň udržiava konečnú autoritu panovníka." # todo: CHANGED
 manchu_script: "Mančuské písmo" # todo: NEW TRANSLATION
 manchu_script_desc: "Mančuská abeceda vznikla kombináciou klasických $mongolian_language$ znakov s jurchenskou fonetikou. Tento jedinečný písomný systém umožňuje písanie v stĺpcoch zľava doprava. S rôznymi tvarmi písmen a kontextuálnou adaptabilitou pre počiatočné, stredné, koncové a izolované pozície zachováva najjemnejšie nuansy nášho jazyka." # todo: CHANGED
 the_eight_banners: "Osem zástav" # todo: NEW TRANSLATION
 the_eight_banners_desc: "Systém ôsmich zástav je jadrom našej spoločnosti a armády. Dedením členstva a pridelením pôdy a príjmov sú Zástavy povýšené na elitu, a to z dobrého dôvodu — od dobytia susedov až po budúce kampane, naša dominancia závisí od ich sily." # todo: CHANGED
 a_new_dawn: "Nový úsvit" # todo: NEW TRANSLATION
 a_new_dawn_desc: "Náš národ sa znovuzrodil. Staré spôsoby života sú preč, ako sny roztápajúce sa do ranného svetla. Je čas čeliť svetu ako plne zmodernizovaný národ." # todo: CHANGED
 manchu_reborn: "Manču znovuzrodené" # todo: NEW TRANSLATION
 manchu_reborn_desc: "Ako sa náš národ zásadne zmenil, tak sa zmení aj naša armáda. Svet sa nám otvoril a na obzore sa objavia nové výzvy. Ak chceme v tomto novom paradigme prežiť, musíme byť pripravení konať." # todo: CHANGED
 inigo_architecture: "Palladiánska architektúra" # todo: CHANGED
 inigo_architecture_desc: "Architektonické inovácie Iniga Jonesa nepochybne ovplyvnia budúce generácie architektov. Jeho propagácia klasickej architektúry a dôraz na proporcie a harmóniu sú považované za znaky neoklasicistického hnutia v $ENG$." # todo: CHANGED
 sailing_and_fighting_instructions: "Blakeove plavebné a bojové pokyny" # todo: NEW TRANSLATION
 sailing_and_fighting_instructions_desc: "Robert Blake napísal niekoľko súborov pravidiel a predpisov, ktoré viedli k rozsiahlym námorným reformám. Patria sem nové taktiky pre blokády a vylodenia, ako aj prijatie bojového usporiadania v jednom rade za sebou." # todo: CHANGED
 coke_smelting: "Koksové tavenie" # todo: NEW TRANSLATION
 coke_smelting_desc: "Vynález koksového tavenia, najmä jeho použitie pri výrobe $iron$ a $steel$, je úzko spätý s priemyselnou revolúciou. $iron$ a $steel$ sa momentálne vyrábajú tradičnými metódami, ako je tavenie na drevené uhlie, zatiaľ čo nová metóda prinesie vyšší výkon a nižšie náklady na údržbu." # todo: CHANGED
 water_frame: "Vodný rám" # todo: NEW TRANSLATION
 water_frame_desc: "Vodný rám je pradený stroj používaný v textilnom priemysle na výrobu bavlnenej priadze. Táto inovácia prispeje k vzniku veľkých textilných tovární poháňaných vodnými kolesami." # todo: NEW TRANSLATION
 fortress_church_advance: "$fortress_church$" # todo: NEW TRANSLATION
 fortress_church_advance_desc: "$fortress_church_desc$" # todo: NEW TRANSLATION
 saquiyah: "Sāqiyah" # todo: NEW TRANSLATION
 saquiyah_desc: "The $saquiyah$ je mechanické zariadenie navrhnuté na uľahčenie dopravy vody do vyšších polôh. Tiež známe ako #italic Persian wheel#!, #italic tablia#!, #italic rehat#! a #italic tympanum#!, koleso je kľúčové v zavlažovacích systémoch v oblastiach s minimálnym alebo žiadnym prúdiacim tokom vody." # todo: NEW TRANSLATION
 sepak_takraw: "Sepak Takraw" # todo: NEW TRANSLATION
 sepak_takraw_desc: "Keďže sa $sepak_takraw$ praktizoval po dlhú dobu po celom $south_east_asia$ od jeho adaptácie z starovekej $chinese_group$ #italic Cùjū#!, a je tiež známy ako #italic Sepak Raga#!, #italic Takraw#!, #italic Chinlone#! alebo #italic Sipa#! podľa krajiny, #italic $sepak_takraw$#! nie je len hra. Hoci cieľom je kopať loptu medzi hráčmi a udržať ju vo vzduchu, je to tiež forma pravidelného fyzického cvičenia a hrá sa nielen pre zábavu, ale aj ako vojenský tréning pre armádu." # todo: NEW TRANSLATION
 three_teachings: "Tri učenia" # todo: NEW TRANSLATION
 three_teachings_desc: "The $three_teachings$ sú filozofia pochádzajúca z $CHI$, ktorá kombinuje učenia $SECT_CONFUCIANISM_NAME$, $SECT_DAOISM_NAME$ a $buddhist$ do harmonického, jednotného učenia. $SECT_CONFUCIANISM_NAME$ predstavuje ideológiu zákona, zatiaľ čo $SECT_DAOISM_NAME$ je svetový názor radikálnych intelektuálov. Tieto dva oproti stojace póly filozofického spektra sú prepojené filozofiami $buddhist$." # todo: NEW TRANSLATION
 dlh_origin_of_hindustani: "Pôvod $hindustani_language$" # todo: CHANGED
 dlh_origin_of_hindustani_desc: "Jazyk $hindustani_language$ sa vyvinul z apabhramsy — stredného indoárijského jazyka — a vznikol ako kontaktový jazyk $DLH$. Keďže $hindustani_language$ čerpá vplyvy z $persian_language$, $arabic_language$ a turkických jazykov, ale aj zo starého hindského jazyka, diplomacia s $muslim_ADJ$ svetom a $hindu_ADJ$ svetom sa stáva jednoduchšou úlohou." # todo: NEW TRANSLATION
 dlh_indo_persian_culture: "Indo-perzská kultúra" # todo: NEW TRANSLATION
 dlh_indo_persian_culture_desc: "$persian_language$ bol dominantným jazykom dvora odvtedy, čo vznikol $DLH_ADJ$ sultanát. Ako taký, vplyv $persian_language$ sa syntetizoval s miestnymi indickými kultúrami." # todo: CHANGED
 dlh_turkic_conqueror_roots: "$turkic_group$ dobyvateľské korene" # todo: NEW TRANSLATION
 dlh_turkic_conqueror_roots_desc: "Hoci nazývame $india$ svojím domovom, predkovia nášho štátu pochádzali z $turkic_group$. Ich skoré úspechy ako dobyvatelia a vládcovia od čias $mamluk$ dynastie, ako aj úspechy nasledujúcej Khalji dynastie, inšpirujú našich vojakov a diplomatov posúvať hranice $DLH$ do kažného kúta $india$." # todo: NEW TRANSLATION
 dlh_revert_ghiyath_reforms: "Zrušiť Ghiyathove reformy" # todo: NEW TRANSLATION
 dlh_revert_ghiyath_reforms_desc: "Hlúpe ekonomické rozhodnutia Ghiyath al-Dina priniesli nášmu štátu $DLH$ len finančnú skazu. Musíme zvrátiť jeho šialenstvo a obnoviť používanie zlata a striebra pri razení mincí." # todo: NEW TRANSLATION
 dlh_restore_the_delhi_empire: "Obnoviť veľkosť $DLH$" # todo: NEW TRANSLATION
 dlh_restore_the_delhi_empire_desc: "$DLH_ADJ$ sultanát kedysi zahŕňal takmer celé $india$. Musí znovu povstať!" # todo: NEW TRANSLATION
 dlh_reintegrate_former_provinces: "Reintegrovať bývalé provincie" # todo: NEW TRANSLATION
 dlh_reintegrate_former_provinces_desc: "Kedysi rozľahlý $DLH_ADJ$ sultanát stratil väčšinu svojich bývalých vlastníctiev, ale nezabudli sme, ako nimi spravovať. Keď budeme pracovať na obnovení našej minulého slávy, pripomenieme miestnym vládcov ich povinnosti voči sultánovi." # todo: NEW TRANSLATION
 dlh_textile_innovation: "Inovatívna textilná výroba" # todo: NEW TRANSLATION
 dlh_textile_innovation_desc: "Kvitnúci textilný priemysel v $DLH$ robí z nášho štátu stredisko technologických inovácií v tomto odvetví. Ako skorí príjemcovia bavlnárskej odstredivky a valcového prevodu vieme, aké dôležité je byť v týchto veciach vpredu. Teraz musíme zabezpečiť čo najširšie prijatie kolovacieho stroja." # todo: CHANGED
 dlh_afghan_nobility: "$afghan_culture$ šľachta" # todo: NEW TRANSLATION
 dlh_afghan_nobility_desc: "Veľa $DLH_ADJ$ šľachty pochádza z radov $afghan_culture$ komunity, ľudu s dlhou históriou dobytia a vlády v severnom $india$. Aj keď sú niekedy politickou prekážkou, ich vojenské zručnosti sú nepochybné." # todo: NEW TRANSLATION
 dlh_grand_trunk: "Chrániť Grand Trunk Road" # todo: NEW TRANSLATION
 dlh_grand_trunk_desc: "Grand Trunk Road vedie z $kabul$ v Afganistane až po pobrežie $bengal_area$. Mnohé z najdôležitejších obchodných miest pozdĺž jej trasy patria do našej ríše, a tak je na nás, aby sme zabezpečili dobrú údržbu cesty a ochranu pred banditmi." # todo: CHANGED
 dlh_cosmopolitan_religions: "Kozmopolitné náboženstvá" # todo: NEW TRANSLATION
 dlh_cosmopolitan_religions_desc: "$india$ je obrovský subkontinent s prítomnosťou viacerých náboženstiev. Aby sme zabezpečili stabilitu v rámci nášho štátu, mali by sme rozšíriť práva rôznych vierovyznaní a upevniť lojalitu ich stúpencov." # todo: CHANGED
 dlh_revive_the_tughlaq_architecture: "Obnova tughlaqovskej architektúry" # todo: CHANGED
 dlh_revive_the_tughlaq_architecture_desc: "Za vrcholu dynastie $tughlaq$ a najstabilnejšej éry nášho štátu veľkí architekti a umelci vytvárali mešity a mauzóleá v jedinečnom štýle Tughlaq. Ako sa naše zdroje vyčerpali kvôli vnútorným problémom, starostlivosť o túto architektúru upadla. Je čas ju oživiť a opäť ustanoviť $DLH$ ako ríšu umenia a divov." # todo: CHANGED
 dlh_throne_of_india: "Indický trón" # todo: NEW TRANSLATION
 dlh_throne_of_india_desc: "Storočia každý veľký indický impérium vládlo z $delhi$. Je to sedadlo dobyvateľov a naše dedičné právo. Nech každý vie, že $delhi$ je opäť domovom právoplatného vládcu celého $india$!" # todo: NEW TRANSLATION
 dlh_hindustani_identity: "$HIN_ADJ$ identita" # todo: NEW TRANSLATION
 dlh_hindustani_identity_desc: "Zahraničné myšlienky o národnosti a kultúrnej identite dorazili do $india$. Hoci kultúrna rôznorodosť $india$ zostane vysoká, je jasné, že naša geografia i hodnoty $muslim$ nám dávajú pocit jednoty v podobe $HIN_ADJ$ identity." # todo: CHANGED
 vij_city_of_victory: "Mesto víťazstva" # todo: NEW TRANSLATION
 vij_city_of_victory_desc: "$vijayanagar$ — 'Mesto víťazstva' — je srdcom nášho štátu a jedného dňa sa stane srdcom celého $hindu_ADJ$. Nech žiari ako maják kultúry a tradície, keď odráža $muslim_ADJ$ votrelcov!" # todo: CHANGED
 vij_an_army_for_city_of_victory: "Armáda pre Mesto víťazstva" # todo: NEW TRANSLATION
 vij_an_army_for_city_of_victory_desc: "Aby Mesto víťazstva bolo hodné svojho mena, potrebujeme armádu, ktorá dokáže vybojovať tieto víťazstvá. Zabezpečíme, aby naše jednotky boli dobre vycvičené a hrdé na svoju službu." # todo: CHANGED
 vij_arab_horses: "Arabské kone" # todo: NEW TRANSLATION
 vij_arab_horses_desc: "Kone z $arabia_region$ sú oveľa lepšie než naše miestne plemená. Využijeme naše obchodné spojenia, aby sme zabezpečili stálu dodávku pre našu armádu." # todo: CHANGED
 vij_first_indian_artillery: "Prvé indické delostrelectvo" # todo: NEW TRANSLATION
 vij_first_indian_artillery_desc: "Vojenské využitie pušného prachu ešte nie je rozšírené, no má potenciál formovať budúcnosť vojny. Musíme preskúmať užitočnosť a výhody tohto prostriedku." # todo: CHANGED
 vij_the_bunds: "The Bunds" # todo: NEW TRANSLATION
 vij_the_bunds_desc: "Naša spoločnosť stojí na poľnohospodárstve v dosť suchom regióne $karnakassala_area$. #italic bunds#!, tiež nazývané #italic anecut#!, zabezpečujú našim mestám a poliam potrebnú sladkovodnú zásobu." # todo: CHANGED
 vij_adroit_diplomacy: "Obratná diplomacia" # todo: NEW TRANSLATION
 vij_adroit_diplomacy_desc: "Nás mnohonásobní votrelci ukázali opakovane tú istú slabosť: sklony medzi sebou bojovať. Musíme byť vždy pripravení túto slabosť využiť vo svoj prospech." # todo: CHANGED
 vij_promotion_of_trade: "Podpora obchodu" # todo: NEW TRANSLATION
 vij_promotion_of_trade_desc: "Naše územie leží na jednej z kľúčových obchodných trás z Východu na Západ. Musíme zabezpečiť naše prístavy tak, aby k nám pristávali kapitáni... čím získame príležitosť zdaňovať ich." # todo: CHANGED
 vij_carnatic_music: "Karnatická hudba" # todo: NEW TRANSLATION
 vij_carnatic_music_desc: "Musíme odolávať $muslim_ADJ$ invázii na všetkých frontoch. Hudobné tradície severných štátov už vykazujú znaky cudzích vplyvov. To je rúhanie, lebo hudba je božské umenie, ktoré pochádza od Dív a bohov. Ukážeme $hindu_ADJ$ ľudu, že sa zaviažeme brániť toto sväté umenie." # todo: CHANGED
 vij_cultural_integration: "Kultúrna integrácia" # todo: NEW TRANSLATION
 vij_cultural_integration_desc: "Kultúrna rôznorodosť $india$ je jedným z našich určujúcich rysov. Umožnením našim osadám vládnuť podľa vlastných zvykov si zabezpečíme ich lojalitu a integráciu do spoločnosti." # todo: CHANGED
 vij_rule_in_accord_with_dharma: "Vládnuť podľa Dharmy" # todo: CHANGED
 vij_rule_in_accord_with_dharma_desc: " #Italic Dharma#! je hlavným pilierom našich náboženských a spoločenských hodnôt. Náš štát môže byť spravodlivý a cnostný len ak naši vládcovia sami stelesňujú a žijú v súlade s dharmou." # todo: CHANGED
 vij_harsh_penal_code: "Prísny trestný zákon" # todo: NEW TRANSLATION
 vij_harsh_penal_code_desc: "Prísne tresty — vrátane trestu smrti — sú spôsobom, ako v tejto spoločnosti udržiavame zákon a poriadok. Zavedením a dôsledným presadzovaním prísneho trestného zákonníka zabezpečíme, že zločinci sa budú báť následkov svojich činov, čím vytvoríme stabilitu istotou potrestania." # todo: CHANGED
 vij_decentralized_rule: "Decentralizované vládnutie" # todo: NEW TRANSLATION
 vij_decentralized_rule_desc: "Ako náš štát rastie, rastie aj administratívna záťaž vlády a riziko povstaní. Aby sme tomu zabránili, zriadime systém decentralizovanej správy, kde osady budú riešiť svoje menšie záležitosti samy a len pri vážnych problémoch sa obrátia na centrálny dvor." # todo: CHANGED
 vij_indian_throne: "Indický trón" # todo: NEW TRANSLATION
 vij_indian_throne_desc: "$india$ je pridlho pod hrozbou $muslim_ADJ$. Pohanské ríše si nárokujú vládu z $delhi$ na severe, no ich vierovyznanie a vláda stoja v priamom rozpore s tým, čo si náš ľud želá. Nie, nové sídlo moci musí byť zriadené — a $vijayanagar$ bude novým trónom $india$!" # todo: CHANGED
 tnk_legitimate_rule: "Starobylé korene" # todo: NEW TRANSLATION
 tnk_legitimate_rule_desc: "Naši predkovia vládli zemiam $tamil_land_area$ po stáročia. V týchto časoch, keď nás dominujú cudzinci, by sme sa mali oprieť o naše starodávne putá k tejto zemi, aby sme ospravedlnili našu nadvládu." # todo: CHANGED
 tnk_resist_invaders: "Odborný odpor" # todo: NEW TRANSLATION
 tnk_resist_invaders_desc: "Naša turbulentná história zaznamenáva víťazstvá i drvivé porážky. Ak chceme prežiť a opäť dominovať ako významná mocnosť, musíme vyvinúť dôkladné pochopenie toho, ako najlepšie využiť naše domáce terény na spomalenie a zdržanie nepriateľských armád, kým nenastane možnosť priameho odporu." # todo: CHANGED
 tnk_pearls_of_india: "Odbornosť v lovení perál" # todo: CHANGED
 tnk_pearls_of_india_desc: "Náš ľud vyvinul vynikajúcu zručnosť pri ponáračkách a zbere perál pozdĺž našich pobreží. Okrem jasných ekonomických výhod dáva prirodzená príťažlivosť našich ľudí k vode vynikajúcich a ľahko vycvičiteľných námorníkov, čo nám poskytuje výhodu proti námorným nepriateľom." # todo: CHANGED
 tnk_expertise_in_conflicts: "Otužovaní vojnou" # todo: NEW TRANSLATION
 tnk_expertise_in_conflicts_desc: "Počas našej búrlivej histórie sme nikdy neuhli pred konfliktom a zdá sa, že sme nezlomní. Musíme túto odhodlanosť zbrať a použiť ju na vzbudiť vo svojom ľude horlivosť, ktorá ich inšpiruje k ešte tvrdším bojom." # todo: CHANGED
 tnk_imperial_legacy: "Cisárske pándijské dedičstvo" # todo: NEW TRANSLATION
 tnk_imperial_legacy_desc: "Zeme južného $india$ dlho znášali nájazdy cudzincov a ambicióznych vojvodcov snažiacich sa založiť vlastné domény. Musíme využiť veľkú históriu našej starej dynastie ako odôvodnenie nároku na túto zem, pretože iba my môžeme priniesť stabilitu a pokoj naspäť do nášho právoplatného územia." # todo: CHANGED
 paik_system_advance: "$paik_system$" # todo: NEW TRANSLATION
 paik_system_advance_desc: "$paik_system_desc$" # todo: NEW TRANSLATION
 paik_regiments_advance: "$a_paik_infantry$" # todo: NEW TRANSLATION
 paik_regiments_advance_desc: "$a_paik_desc$" # todo: NEW TRANSLATION
 advanced_paik_system_advance: "Pokročilé paiky" # todo: NEW TRANSLATION
 advanced_paik_system_advance_desc: "$a_late_paik_infantry_desc$" # todo: NEW TRANSLATION
 baghlah_advance: "$n_baghlah$" # todo: NEW TRANSLATION
 baghlah_advance_desc: "$n_baghlah_desc$" # todo: NEW TRANSLATION
 bng_bengali_vassal_system: "$BNG_ADJ$ systém vazalov" # todo: NEW TRANSLATION
 bng_bengali_vassal_system_desc: "Počas vlády $DLH$ ľud $bengali$ slúžil svojmu pánovi ako produktívni vazali. $DLH_ADJ$ systém bude slúžiť ako základ pre naše vlastné vazalské systémy v rokoch nadvlády $bengali$." # todo: CHANGED
 bng_bengali_paik: "$BNG_ADJ$ Paik" # todo: NEW TRANSLATION
 bng_bengali_paik_desc: " #italic paiks#! sú chrbticou našej armády. Zatiaľ čo iné štáty majú aktívny systém Paik a využívajú paikov ako všeobecné povstalecké zložky, náš štát udržuje menších, no veľmi dobre organizovaných paikov a poskytuje im dostatočnú vojenskú podporu." # todo: CHANGED
 bng_bengali_architecture: "$bengali$ architektúra" # todo: NEW TRANSLATION
 bng_bengali_architecture_desc: "Zmes starovekej urbánnej architektúry, $muslim_ADJ$ inžinierskych vplyvov a tradičných $bengali$ techník stavby striech, jedinečný $bengali$ architektonický štýl sa používa pri náboženských a kultúrnych stavbách všetkého druhu. Vďaka našej odbornosti na tento štýl je stavba takýchto budov pre nás podstatne jednoduchšia a lacnejšia než pre iné národy." # todo: CHANGED
 bng_habshi_generals: "Habshi generáli" # todo: NEW TRANSLATION
 bng_habshi_generals_desc: "Abesínsky vojenskí otroci hrajú významnú úlohu v našej armáde ako elitná pechota. Tí, ktorí vynikajú ako velitelia, dostanú vyššie velenie, zatiaľ čo tí, ktorí prejavia výnimočnú vernosť, budú tvoriť palácovú gardu." # todo: CHANGED
 bng_war_elephants: "Vojnoví sloni" # todo: NEW TRANSLATION
 bng_war_elephants_desc: "Hoci sú pomalé, obratnosť slonov v našom riečnom teréne je kľúčová pre rýchle doplňovanie našich vojsk. Navyše slony pomáhajú na bojisku svojou impozantnou veľkosťou a desivou silou." # todo: CHANGED
 bng_rupees: "Mincovanie rupí" # todo: NEW TRANSLATION
 bng_rupees_desc: "Nedostatok široko prijatej štandardizovanej meny brzdí náš obchodný rozvoj. Ako jeden z popredných hospodárskych mocností subkontinentu sme v dobrej pozícii začať mincovnú produkciu nového strieborného raziva so štandardnými hmotnosťami, ktoré nazveme #italic rupee#!." # todo: CHANGED
 bng_bengali_traders: "$BNG_ADJ$ obchodníci" # todo: NEW TRANSLATION
 bng_bengali_traders_desc: "Región $indian_ocean_region$ spája naše lokálne trhy s tými v $south_east_asia$ a $china$. Preto budeme klásť veľký dôraz na maximalizáciu našej prítomnosti na týchto trhoch po mori a tým zvýšiť obchodné zisky." # todo: CHANGED
 bng_bengali_poetry: "$bengali$ poézia" # todo: NEW TRANSLATION
 bng_bengali_poetry_desc: "Písané slovo je jednou z najvplyvnejších a najtrvácnejších foriem umenia. $bengali$ poézia bude rozprávať príbehy epických dobyvateľov, príťažlivé drámy a podnetné filozofické otázky, ktoré rozšíria a posilnia povesť $bengali$ kultúry." # todo: CHANGED
 bng_religious_pluralism: "Náboženský pluralizmus" # todo: NEW TRANSLATION
 bng_religious_pluralism_desc: "$india$ je domovom mnohých náboženstiev: $hindu$ väčšinovo, $muslim$ ako preferované vierovyznanie vládnucich vrstiev, a niekoľko drobných náboženstiev ako $buddhist$ a $jain$ medzi pracujúcimi menšinami. Prosadzovanie jedného náboženstva nad iné spôsobí nevyhnutný chaos a nepokoj. Preto by sme sa mali usilovať o náboženský pluralizmus a nerobiť rozdiely medzi vierami v našom štáte." # todo: CHANGED
 bng_artillery_corps: "Delostrelecký zbor" # todo: NEW TRANSLATION
 bng_artillery_corps_desc: "Delostrelectvo je účinný prostriedok v kampaniach. Musíme zabezpečiť efektívny delostrelecký zbor špecializujúci sa na spôsobovanie poškodenia nepriateľským formáciám ešte pred ich priamym stretom s našou pechotou." # todo: CHANGED
 bng_bengali_trade_fleet: "$BNG_ADJ$ obchodná flotila" # todo: NEW TRANSLATION
 bng_bengali_trade_fleet_desc: "Obchodná flotila $bengali$ prináša exotické tovary zo vzdialených krajín, ako aj drahocenné $goods_gold$ a $silver$, na trhy delty Gangy. Naši obchodníci sú ďaleko známi v diaľavách sveta vďaka impozantnej obchodnej flotile." # todo: CHANGED
 bng_shipbuilding_industry: "Lodiarenský priemysel" # todo: NEW TRANSLATION
 bng_shipbuilding_industry_desc: "Námorný obchod je pre náš štát životne dôležitý. Náš obchod aj vojnové lode sú jednými z najdôležitejších aspektov hospodárstva, a preto silno podporujeme odvetvie stavby lodí." # todo: CHANGED
 bng_bengali_industrialization: "Industrializovaná výroba muslínu" # todo: CHANGED
 bng_bengali_industrialization_desc: "$BNG$ má jedinečné postavenie v $india$, aby začalo revolúciu bez precedensu. Muslín — špeciálna bavlnená látka, ktorou sú známi $bengali$ tkáči — je ideálnym obchodným artiklom pre industrializáciu. Sme pripravení využiť nové objavy v našom už svetovom textilnom priemysle. Začnime priemyselnú revolúciu!" # todo: CHANGED
 raj_militaristic_society: "Militaristická spoločnosť" # todo: NEW TRANSLATION
 raj_militaristic_society_desc: "Medzi civilnou a vojenskou spoločnosťou takmer neexistuje rozdiel u Rádžputov. Náš štát je hostiteľom, definovaný ľuďmi skôr než územím, a jeho ľudia sú bojovníci. Musíme zabezpečiť, aby vojenské zbory primerane spĺňali naše administratívne potreby pri rozširovaní." # todo: CHANGED
 raj_combat_training: "Bojový výcvik" # todo: NEW TRANSLATION
 raj_combat_training_desc: "Každý vojak je vycvičený do boja, no naši ľudia začínajú výcvik v oveľa mladšom veku, čo im dáva zručnosti prevyšujúce iných nezrelých vojakov." # todo: CHANGED
 raj_clan_loyalties: "Vernosti klanu" # todo: NEW TRANSLATION
 raj_clan_loyalties_desc: "Vplyv nášho klanu presahuje hranice. Pri dopĺňaní radov našej armády môžeme čerpať z iných skupín Rajputov zo severného $india$." # todo: CHANGED
 raj_monumental_architecture: "Monumentálna architektúra" # todo: NEW TRANSLATION
 raj_monumental_architecture_desc: "Aký má zmysel víťazstvo, ak neexistuje nič, čo by zvěčnilo naše úspechy? Postavíme monumenty, ako ohromujúcu Vežu víťazstva, aby budúce generácie poznali naše najväčšie bitky a boli podľa toho inšpirované." # todo: CHANGED
 raj_marwari_horses: "Marwari kone" # todo: NEW TRANSLATION
 raj_marwari_horses_desc: "Rovnako ako ich páni, rajputská jazdectvo je starostlivo vycvičené pôsobiť na bojisku. Hovorí sa, že kôň Marwari opustí bojisko len za troch okolností — víťazstvo, smrť alebo nesenie zraneného pána do bezpečia. Starostlivosťou o tieto božské tvory zabezpečíme večnú dominanciu našich jazdcov na bojiskách $india$." # todo: CHANGED
 raj_reorganized_rajput_regiments: "Reorganizované rajputské pluky" # todo: NEW TRANSLATION
 raj_reorganized_rajput_regiments_desc: "Tradičné štruktúry klanov sú vynikajúcim základom pre modernizovaný plukový systém. Existujúce hierarchie založené na príbuzenskom vzťahu a bezpodmienečnej lojalite sa dajú ľahko premeniť na organizovaný a formálny reťazec velenia." # todo: NEW TRANSLATION
 raj_martial_smiths: "Vojenskí kováči" # todo: NEW TRANSLATION
 raj_martial_smiths_desc: "Vojny sa nevyhrávajú len taktikou a odvahou, ale aj zbraňami. Naši kováči musia vyrobiť najlepšie bojové zbrane pre našich bojovníkov na obranu Rádžputov." # todo: CHANGED
 raj_fortress_architecture: "Architektúra pevností" # todo: NEW TRANSLATION
 raj_fortress_architecture_desc: "Vzostup $DLH$ a invázie $muslim_ADJ$ bojovníkov minulosti boli výstrahou. Musíme byť vždy pripravení na cudzích votrelcov, a preto zamestnáme najzručnejších architektov na navrhovanie nepriestrelných pevností naprieč naším kráľovstvom. Veľmi dlhé múry, ktoré budú potrebné na ochranu našej krajiny, sú ambicióznym projektom, no naša odhodlanosť zabezpečí jeho dokončenie." # todo: CHANGED
 raj_expanded_artillery_arm: "Rozšírené delostrelectvo" # todo: NEW TRANSLATION
 raj_expanded_artillery_arm_desc: "Obliehania rozhodujú vojny. Musíme experimentovať s konštruovaním väčších a lepších diel na zborenie mnohých hradov našich nepriateľov, doma i v zahraničí." # todo: CHANGED
 raj_the_purbias: "Purbias" # todo: NEW TRANSLATION
 raj_the_purbias_desc: "Rajputi sa rozšírili po severnom $india$ v honbe za slávou. #italic Purbias#!, elitní rajputskí bojovníci, ktorí pôsobia ako žoldnieri, sú známi svojimi bojovými schopnosťami a rozširujú našu hrozivú povesť." # todo: CHANGED
 raj_mandatory_firearm_drilling: "Povinné cvičenia s palnými zbraňami" # todo: NEW TRANSLATION
 raj_mandatory_firearm_drilling_desc: "Mnohí rajputskí vojaci sú odborníkmi na osobné strelné zbrane. Mali by sme využiť týchto hardovaných veteránov na výcvik ďalšej generácie vojakov, namiesto toho, aby sme riskovali stratu ich odbornosti v boji. Všetci naši vojaci musia byť vycvičení v taktike strelných zbraní predtým, než ich pošleme do prvej línie." # todo: CHANGED
 raj_painting_school: "Škola rajputského maľovania" # todo: NEW TRANSLATION
 raj_painting_school_desc: "Rajputskí maliari majú už výbornú povesť, no môže byť ešte lepšia. Podnietime našich umelcov rozvíjať svoje zručnosti a pridať ku cti našej dynastie založením školy maliarstva špecifickej pre náš štát." # todo: CHANGED
 raj_rajput_resistance: "Rajputský odpor" # todo: NEW TRANSLATION
 raj_rajput_resistance_desc: "Rajputskí básnici-hudobníci rozprávajú príbehy našich mnohých bojov proti cudzím dobyvateľom a o tom, ako by naše predky radšej zomreli než sa vzdať. Podnietime tento duch jednoty a dáme našim hudobníkom dôvod písať nové balady o statočnosti tvárou v tvár smrti." # todo: CHANGED
 raj_martial_ethos: "Vojenský étos" # todo: NEW TRANSLATION
 raj_martial_ethos_desc: "Výchova a tradície rajputských bojovníkov zaručujú širokú základňu pre nábor dôstojníkov, ktorí povedú naše armády. Aby sme toho využili, formalizujeme kariérne príležitosti a postupy na povzbudenie týchto sľubných mladých bojovníkov, aby slúžili ako dôstojníci." # todo: CHANGED
 npl_the_divya_upadesh: "Divya Upadesh" # todo: NEW TRANSLATION
 npl_the_divya_upadesh_desc: " #italic Divya Upadesh#! obsahuje deväť princípov, ktoré tvoria jadro politického a národného života v $nepal_area$, ako aj zásady úspešnej zahraničnej politiky. Zhŕňa stáročia $nepali_group$ myslenia o správe, vojne a mieri. Nasledovaním týchto princípov bude $nepal_area$ schopné vyhnúť sa podvratom blízkych impérií a nájazdom cudzincov." # todo: CHANGED
 npl_gurkhas: "$a_gurkha$" # todo: NEW TRANSLATION
 npl_gurkhas_desc: "$a_gurkha_desc$" # todo: NEW TRANSLATION
 ori_bulwark_of_the_hindu: "Bastión $hindu$" # todo: NEW TRANSLATION
 ori_bulwark_of_the_hindu_desc: "$muslim_ADJ$ veriaci vtrhli do $india$ a podrobili mnohých $hindu_ADJ$ obyvateľov svojej krutej vláde. Napriek tomu $ORI$ stojí neohrozene proti vojskám $muslim$. Sme bulwarkom $hindu$ a obraníme naše tradície a kultúru proti každému cudzincovi!" # todo: CHANGED
 ori_anka_year_system: "Anka systém rokov" # todo: NEW TRANSLATION
 ori_anka_year_system_desc: "Systém #italic Anka#! je naša metóda zaznamenávania regálnych rokov vládcov. Roky končiace na 6 alebo 0 sú vynechané, okrem roku 10, ktorý sa zachová. Počítanie začína na roku 2, nie na roku 1, a vždy začína na #italic Sunia#!, našom fiskálnom novom roku." # todo: CHANGED
 ori_lord_of_elephants: "Gajapati" # todo: NEW TRANSLATION
 ori_lord_of_elephants_desc: "Kone nie sú domáce v $ORI$ a krajina nie je vhodná na ich chov. Naše džungle sú však preslávené veľkým počtom slonov. V hustých džungliach východného $india$ môže dobre vykonaná taktická spolupráca medzi slonmi a pechotou byť rovnako smrteľná ako jazdectvo. Zvýšme veľkosť našich sloních zborov a zlepšime ich taktiku, aby sme boli známi ako skutočný #italic Gajapati#!, 'Pán slonov'." # todo: CHANGED
 ori_servitor_of_jagganath: "Služobník Jagannatha" # todo: NEW TRANSLATION
 ori_servitor_of_jagganath_desc: "Uctievanie Jagannatha, Pána vesmíru, spája náš ľud. Predchádzajúci vládcovia $ORI$ boli považovaní za potomkov Jagannatha. Náš súčasný vládca nemusí byť jeho potomkom, ale musíme všade tlmočiť, že náš vodca je sluhom Jagannatha, a že akékoľvek neuposlúchnutie voči nemu je zrada proti Pánovi Jagannathovi." # todo: CHANGED
 ori_parikshas: "Parikshas" # todo: NEW TRANSLATION
 ori_parikshas_desc: "$ORI$ bolo dlho rozdelené medzi mnohých princov, no ich čas sa skončil! Prevezmeme kontrolu nad týmito zemami a vymenujeme týchto malicherných kniežacikov za regionálnych guvernérov — #italic parikshas#! — namiesto toho, aby sme dovolili týmto drobným kniežatám rozriediť našu cisársku autoritu." # todo: CHANGED
 ori_odia_militarization: "Odijská militarizácia" # todo: NEW TRANSLATION
 ori_odia_militarization_desc: "Hrozba $muslim_ADJ$ nikdy neustáva ani nespí. Musíme zabezpečiť, aby naše ozbrojené sily boli pripravené čeliť a odrážať votrelcov vždy a všade." # todo: CHANGED
 ori_refined_cloth_production: "Rafinovaná výroba $cloth$" # todo: CHANGED
 ori_refined_cloth_production_desc: "$ORI$ je od staroveku slávne pre svoje vysokokvalitné tkaniny. Podporíme textilné cechy $ORI$ vo zdokonaľovaní metód výroby jemného Kalinga $cloth$." # todo: CHANGED
 ori_patronize_temple_construction: "Patrónované stavanie chrámov" # todo: CHANGED
 ori_patronize_temple_construction_desc: "Sláva minulých dynastií sa odráža vo veľkoleposti chrámov, ktoré zanechali. Zlepšime naše mnohé nádherné chrámové komplexy a postavme nové, aby sme ďalej rozvíjali kalingskú architektúru." # todo: CHANGED
 ori_encourage_salt_trade: "$salt$ obchod" # todo: CHANGED
 ori_encourage_salt_trade_desc: "Vysokokvalitné $salt$ z $ORI$ je žiadaná v celom $india$. Urobme všetko, čo môžeme na podporu obchodu s $salt$, aby sme z neho bohatli." # todo: CHANGED
 ori_expansion_of_infrastructure: "Rozšírenie infraštruktúry" # todo: NEW TRANSLATION
 ori_expansion_of_infrastructure_desc: "Ako technológia napreduje, pribúda aj obyvateľov v našej ríši. Industrializácia priniesla výrazný rast populácie, a preto musíme rozšíriť infraštruktúru, aby sme zvládli tieto rastúce komunity." # todo: CHANGED
 bah_arabian_horses: "Arabské kone" # todo: NEW TRANSLATION
 bah_arabian_horses_desc: "Klíma $india$ je najlepšie len podpriemerná na chov a kríženie koní. Kone z $arabia_region$ sú však vynikajúce, výrazne lepšie než naše domáce plemená. Využijeme obchodné väzby na zaistenie stálej dodávky týchto koní pre naše vojská." # todo: CHANGED
 bah_amir_rebellion: "Povstanie Amíra" # todo: NEW TRANSLATION
 bah_amir_rebellion_desc: "Náš štát sa zrodil z povstania Amira Hasana Gangu proti ubohej vláde $DLH$. Víťazstvo nad $DLH_ADJ$ sultanátom stále žije v mysliach našej šľachty a vojska dodnes." # todo: CHANGED
 bah_nobility_hindu_expansion: "Integrácia hindu elít" # todo: CHANGED
 bah_nobility_hindu_expansion_desc: "Hoci šľachta občas ohrozuje suverenitu vládcu, je pre náš štát užitočná, pretože je kľúčová pri správe našich rozsiahlych majetkov. Po získaní nezávislosti od $DLH$ sme získali vládu nad takmer výlučne $hindu_ADJ$ poddanými, zatiaľ čo naši $muslim_ADJ$ šľachtici sú menšinou neschopnou viesť masy. Musíme rozšíriť a stabilizovať našu aristokraciu povýšením sľubných $hindu_ADJ$ kandidátov do jej radov." # todo: CHANGED
 bah_gharbians: "Gharbiani" # todo: NEW TRANSLATION
 bah_gharbians_desc: "Rozviazanie vzťahov s $DLH$ pri založení vlastného kráľovstva uvoľnilo naše puto s $muslim_ADJ$-dominéranými severnými časťami $india$. Keďže náš štát nemá pevne zafixovanú $muslim_ADJ$ šľachtu, nachádzame sa v neistom postavení a mohli by sme byť odkázaní na miestnych $hindu_ADJ$ feudalov.\nNašťastie naša povesť predchádza nás. Príbehy o bohatstve $deccan_region$ sa šíria po celom $muslim_ADJ$ svete a mnohí ambiciózni hľadači šťastia podnikajú námornú cestu do našich prístavov. Využitím bohatstva $india$ na prilákanie talentovaných západniarov, alebo #italic Gharbians#!, na náš dvorný dvor, môžeme zabezpečiť, že našej krajine nikdy nebudú chýbať schopné mysle na vedenie armád, vyberanie daní a správu poddaných." # todo: CHANGED
 bah_legacy_of_gisu_daraz: "Dedičstvo Gisu Daraza" # todo: NEW TRANSLATION
 bah_legacy_of_gisu_daraz_desc: "$india$ všeobecne, a náš štát obzvlášť, má históriu ako centrum súfijskej tradície. Snaha našich vládcov pritiahnuť a patronovať súfijských šejkov zo všetkých kútov sveta svedčí o pobožnosti a veľkej duchovnej sile našich panovníkov a dvora.\nPrijatie súfijských konceptov duchovnej suverenity a inkluzívnej povahy súfijského učenia pomôže vytvoriť prostredie, kde sa rozmanité vierovyznania $bah_gharbians$ a domorodcov $decca_region$ môžu miešať a prosperovať bez konfliktov." # todo: CHANGED
 bah_meltpot_of_languages: "Jazykový tavící kotol" # todo: CHANGED
 bah_meltpot_of_languages_desc: "$decca_region$ je región mnohých jazykov a kultúr; veľký prílev ľudí pôvodu $iranian_group$, $turkic_group$, $afghan_culture$ a $arabian_group$ zvýraznil kozmopolitnosť nášho štátu. Hoci historicky jazyk $persian_language$ slúžil potrebám našich predchodcov, nová zmes miestnych jazykov — spolu s $persian_language$ a $arabic_language$ — sa stáva bežnejšou. Táto jazyková zmes sa dokonca stala zdrojom kultúrnej inšpirácie pre vznikajúcich umelcov." # todo: CHANGED
 bah_karimis: "Kārimī" # todo: NEW TRANSLATION
 bah_karimis_desc: "Storočia indicko-egyptský obchod dominovali skupiny obchodníkov a kapitánov so sídlom v $egypt_region$, známe ako $bah_karimis$. Kľúčoví pre každodenné podnikanie v $indian_ocean_region$ obchode, táto obchodná organizácia je dnes bohatá a mocná. Od pobrežia $tamil$ po prístavy $swahili_culture$ obchodných miest až po $lower_egyptian_culture$ prístavy za $gulf_aden_province$, sultáni, šľachtici i bežní ľudia prichádzajú kúpiť exotické tovary alebo si požičať peniaze od $bah_karimis$.\nOrganizácia v poslednej dobe prejavila veľký záujem o náš štát a len získať môžeme z rozvíjania našich vzťahov s ňou." # todo: CHANGED
 bah_takht_e_firoza: "Takht-e-Fīrozā" # todo: NEW TRANSLATION
 bah_takht_e_firoza_desc: "Prvou vecou, ktorú hosť v našej kráľovskej audience zbadá, je Tyrkysový trón našej dynastie. Tento unikátny kus kráľovského zariadenia bol pôvodne darovaný porazeným $telugu$ radžom Kapayom a je v mnohých ohľadoch ultimátnym symbolom našej dynastie. Vznešený a jedinečný, zosobňuje bohatstvo $deccan_region$ a neobvyklú kombináciu štýlov, ktorá je známkou nášho kozmopolitného štátu." # todo: CHANGED
 bah_bahmani_primogeniture: "Bahmání primogenitúra" # todo: NEW TRANSLATION
 bah_bahmani_primogeniture_desc: "Náš nezvyčajný zvyk vždy odovzdáva trón najstaršiemu synovi súčasného vládcu občas vytváral istú nestabilitu, keď regenti a príležitostní šľachtici bez váhania skúšali zneužiť dieťa na tróne alebo podporiť nároky závistlivého príbuzného. Teraz je však tento zvyk pevne inštitucionalizovaný a pri nástupe na trón je málo tých, ktorí by odvážne vystúpili proti pravému dedičovi našej dynastie." # todo: CHANGED
 bah_madrasa_of_mahmud_gawan: "Veľká madrasa $deccan_region$" # todo: CHANGED
 bah_madrasa_of_mahmud_gawan_desc: "Po mnoho rokov náš štát sťahoval schopných ľudí z širšieho $muslim_ADJ$ sveta a zároveň začleňoval to najlepšie z predchádzajúcich štátov. To vytvorilo bohatú kozmopolitnú kultúru, ktorá nie je úplne $farsi_culture$, $arabian_group$, $marathi_culture$, $telugu$ ani $kannadiga$. Založenie veľkej madrasy v našom hlavnom meste by prispelo k ďalšiemu rozvoju učenia týchto mnohých kultúr a tiež by svetu ukázalo veľkosť nášho štátu." # todo: CHANGED
 guj_hub_of_the_indian_ocean_trade: "Stredisko obchodu v $indian_ocean_region$" # todo: NEW TRANSLATION
 guj_hub_of_the_indian_ocean_trade_desc: "Vďaka monzúnovým vetrom a svojej špecifickej polohe slúži $GUJ$ už dlho ako uzol obchodovania Východ-Západ v $indian_ocean_region$, spájajúc $red_sea_area$, $egypt_region$ a Malaccu. V dôsledku toho boli $GUJ$ obchodníci dôležitými sprostredkovateľmi prinášajúcimi cenné tovary ako korenie z ostrovov Maluku a $silk$ z 4CHI$, ktoré potom predávali kupcom prichádzajúcim zo západu." # todo: CHANGED
 guj_garba: "Garba!" # todo: NEW TRANSLATION
 guj_garba_desc: "Pôvodne vzniknutý z uctievaných tancov žien na počesť $hindu_ADJ$ bohyne Ambaji, náš ľud vyvinul nový veľmi pôvabný tanec nazývaný Garba. Základom tanca je spievanie a rytmické tlieskanie v kruhovom usporiadaní. Dnes naši muži a ženy používajú tento tanec na oslavy rozličných príležitostí, zbiehajúc sa ako komunita a nosiac nádherne vyšívané šaty. Všetci spoločne, mladí i starí, sedliaci aj princovia, $muslim_ADJ$ aj $hindu_ADJ$, tancujúc v stále väčšom kruhu." # todo: CHANGED
 guj_jain_routes: "$jain_ADJ$ spojenia" # todo: NEW TRANSLATION
 guj_jain_routes_desc: "$jain$ je starodávny spôsob života formovaný Mahavírom. Po tisíc rokov bol $GUJ$ pevnosťou $jain_ADJ$ komunity a viery, s mnohými svätými miestami a chrámami. Kráľovské dynastie patronovali tomuto náboženstvu, vytvárajúc spoločenstvo s $hindu_ADJ$ ľudom. $muslim_ADJ$ invázie zo západu Mahmudom z Ghazni a Mohamdom z Ghoru prenasledovali $jain_ADJ$ komunitu, ničili chrámy, premieňali ich na mešity a pálili $jain_ADJ$ knižnice. Napriek tomu sa $jain_ADJ$ ľudia v $GUJ$ zachovali, prispôsobili sa a prosperujú, využívajúc svoje spojenia s $jain_ADJ$ komunitami po svete ako centrum viery a obchodu." # todo: CHANGED
 guj_gujarati_lipi: "$GUJ_ADJ$ Lipi" # todo: NEW TRANSLATION
 guj_gujarati_lipi_desc: " $GUJ_ADJ$ Lipi je nový abecedný a písomný systém vyvinutý merkantilnými kruhmi. Tiež známy ako #italic saraphi#! (bankári), #italic vaniasai#! (obchodníci) alebo #italic mahajani#! (trhovníci) písmo vďaka svojmu spojeniu s obchodom, jeho používanie sa rýchlo rozšírilo po $GUJ$, $KUT$ a $SND$ pre písanie regionálnych jazykov a štúdium $sanskrit_language$. $zoroastrian$ komunita ho tiež prijala ako písmo pre avestánčinu. Tento spoločný písomný systém spája rôznorodé komunity, uľahčuje praktickú komunikáciu a vytvára spoločnú identitu." # todo: CHANGED
 guj_gujarati_merchant_diaspora: "$GUJ_ADJ$ obchodnícka diaspora" # todo: NEW TRANSLATION
 guj_gujarati_merchant_diaspora_desc: "Náš ľud obchoduje na každom pobreží, hľadá obchod a nasleduje obchodné vetry. Naše flotily neustále plávajú za novými príležitosťami a naši obchodníci rozumejú remeslu stavby lodí a hodnote budovania dobrých, pevných plavidiel pri obmedzenom rozpočte." # todo: CHANGED
 mug_zamindar_system: "Systém zamindárov" # todo: NEW TRANSLATION
 mug_zamindar_system_desc: "Zamindari sú feudálni vládcovia, ktorí spravujú naše územia autonómne alebo polonezávisle. Hoci sú vlastníci pôdy, ktorú spravujú a tvoria časť našej šľachty, nakoniec slúžia ako vnútorní vazali Koruny." # todo: CHANGED
 mug_mughal_ibadat_khana: "$ibadat_khana$" # todo: NEW TRANSLATION
 mug_mughal_ibadat_khana_desc: "$ibadat_khana_desc$" # todo: NEW TRANSLATION
 mug_an_indian_padshah: "Indický padšáh" # todo: NEW TRANSLATION
 mug_an_indian_padshah_desc: "Hoci sme prišli do $india$ ako cudzinci, teraz vládneme ako indický padšáh, prijímajúc miestne tradície a prekračujúc delenia kasty a vierovyznania. Ako náš štát zahŕňa mnoho vier a kultúr, naša administrácia bude čerpať talent zo všetkých komunít, dávajúc každému — bez ohľadu na kastu, náboženstvo alebo kultúru — rovnakú príležitosť slúžiť nášmu veľkému domu a slávnej ríši." # todo: CHANGED
 mug_mughal_architecture: "$MUG_ADJ$ architektúra" # todo: NEW TRANSLATION
 mug_mughal_architecture_desc: "Veľká ríša si vyžaduje rovnako monumentálne stavby. V našej kozmopolitnej ríši architekti už vytvárajú nádherné stavby, ktoré ohromia budúce generácie. Naša dynastia by mala byť v popredí tohto hnutia, vytvárajúc veľké architektonické diela, aké svet ešte nevidel." # todo: CHANGED
 mug_fatawa_e_alamgiri: "Fatawa-i-Alamgiri" # todo: NEW TRANSLATION
 mug_fatawa_e_alamgiri_desc: "$mug_fatawa_e_alamgiri$ je zhrnutie založené na šaríi, slúžiace ako primárny právny kódex upravujúci rôzne aspekty života v našom impériu. Je to jedna z najkomplexnejších zbierok $muslim_ADJ$ zákonov, etiky, vojenských stratégií, ekonomických politík, spravodlivosti a princípov." # todo: NEW TRANSLATION
 samanta_advance: "Sāmanta feudalizmus" # todo: NEW TRANSLATION
 samanta_advance_desc: "Sāmanta — #italic neighbor#! — je termín označujúci vazalov a tributárnych náčelníkov. Je to feudálny systém, ktorý bol po stáročia jedným z pilierov našej spoločnosti. Hoci tento systém momentálne stráca význam, stále ostáva základom našej politickej štruktúry." # todo: CHANGED
 kalaripayattu_advance: "Kalaripayattu" # todo: NEW TRANSLATION
 kalaripayattu_advance_desc: "Kalaripayattu — #italic Practice in the Arts of the Battlefield#! — je staré indické bojové umenie, ktorého pôvod je v $malabar_area$. Bojovníci nášho štátu budú trénovaní v umení Kalaripayattu, aby sme zabezpečili ich schopnosti v boji zblízka a v stretoch." # todo: NEW TRANSLATION
 nair_military_advance: "Nairská vojenská sila" # todo: NEW TRANSLATION
 nair_military_advance_desc: "Nair sú rôznorodá skupina $hindu_ADJ$ kast z $malabar_area$ s dlhou históriou zapojenia do vojenských záležitostí. Ich skúsenosti, rovnako ako ich rolí pre #italic kalari#!, budú veľmi cenné v našich súčasných konfliktoch." # todo: CHANGED
 mhr_ashta_pradhan_advance: "$mhr_ashta_pradhan$" # todo: NEW TRANSLATION
 mhr_ashta_pradhan_advance_desc: "$mhr_ashta_pradhan_desc$" # todo: NEW TRANSLATION
 mhr_tradition_of_military_service: "Tradícia vojenskej služby" # todo: NEW TRANSLATION
 mhr_tradition_of_military_service_desc: "$marathi_culture$ jazdci majú dlhú tradíciu služby ako 'Bargirs' pre sultanáty Dekanu. Zvýšená militarizácia Dekanu v dôsledku mnohých vojen vedených v oblasti urobila z našej jazdy jednu z najnebezpečnejších síl v $india$." # todo: NEW TRANSLATION
 mhr_forts_of_maharashtra: "Pevnosti Maháráštry" # todo: NEW TRANSLATION
 mhr_forts_of_maharashtra_desc: "V týchto kopcovitých a hustými lesmi pokrytých územiach je udržiavanie série pevností útočnou aj obrannou nevyhnutnosťou. Starostlivá údržba našich opevnení by preto mala byť najvyššou prioritou." # todo: CHANGED
 mhr_peasant_soldiers: "Sedliacki vojaci" # todo: NEW TRANSLATION
 mhr_peasant_soldiers_desc: "Dediny Deshu sú plné schopných mužov, ktorí by boli ochotní slúžiť v našich vojskách. Naverbujme $marathi_language$ hovoriacich členov našej populácie do armády." # todo: CHANGED
 mhr_office_of_the_peshwa: "Úrad Pešvu" # todo: NEW TRANSLATION
 mhr_office_of_the_peshwa_desc: " #italic Peshwa#! bude naším hlavným ministrom, úplne oddaným civilnej správe aj dohľadu nad vojenskými operáciami. Táto konsolidácia moci nás urobí dostatočne flexibilnými na rýchlu a efektívnu expanziu." # todo: CHANGED
 mhr_encourage_brahmin_ties: "Podpora väzieb s Brāhmaṇami" # todo: NEW TRANSLATION
 mhr_encourage_brahmin_ties_desc: "Náš finančný sektor je ovládaný bráhmanskými bankárskymi rodinami. Integrujme ich viac do našej administratívy najatím ich ako výbercov daní a vytvorením predpisov na posilnenie ich práv a ochranu ich tradícií. Získame priazeň našich finančníkov i prístup k učeným a schopným administrátorom." # todo: CHANGED
 pun_breadbasket_of_india: "Žitnica $india$" # todo: NEW TRANSLATION
 pun_breadbasket_of_india_desc: "Päť veľkých riek — Indus, Jhelum, Chenab, Ravi a Sutlej — pretínajú územia $punjab_area$, ktorým poskytujú pôde neporovnateľnú úrodnosť. Okrem toho, že nám umožňujú vyvážať potraviny a bavlnu susedom, umožňujú rast našich miest a podporujú všelijakú špecializovanú výrobu. Musíme robiť všetko pre podporu rozvoja poľnohospodárstva a chrániť našich farmárov pred banditmi a zbojníkmi v susedných oblastiach." # todo: CHANGED
 pun_encourage_indo_persian_trade: "Podporiť indicko-perzský obchod" # todo: NEW TRANSLATION
 pun_encourage_indo_persian_trade_desc: "Na západnom okraji $india$ leží $PUN$, ktoré vždy stálo na križovatke ekonomickej a kultúrnej výmeny medzi $india$ a $persia_region$. Starobylá Grand Trunk Road, ktorá spája východné $india$ s $farsi_culture$ svetom, prechádza našimi zemami predtým, než vedie do afganských horských priechodov. Tieto priechody sú však sužované kmeňovými lúpežníkmi a banditmi. Podporujme dopravu pozdĺž tejto starodávnej a živé trasy a urobme všetko pre ochranu obchodníkov výstavbou karavanserajov a policajným zabezpečením týchto ciest." # todo: CHANGED
 pun_punjabi_textile_industry: "$PUN_ADJ$ textilný priemysel" # todo: NEW TRANSLATION
 pun_punjabi_textile_industry_desc: "$PUN$ je hlavné centrum textilnej výroby. $cloth$ z našich tkáčov je špeciálne vyrábaný pre trhy po celom $asia$ a $europe$, a naši tkáči patria medzi najproduktívnejších v $india$." # todo: CHANGED
 pun_foundation_of_the_khalsa: "Khalsa" # todo: NEW TRANSLATION
 pun_foundation_of_the_khalsa_desc: "$sikhism$, náboženstvo pôvodom z $PUN$, sa rýchlo šíri po našich krajinách. Členovia tejto viery prichádzajú zo všetkých kast a prostredí a budú brániť svoj štát bez ohľadu na svoje predchádzajúce zamestnania." # todo: CHANGED
 pun_gurmukhi_script: "Písmo Gurmukhī" # todo: NEW TRANSLATION
 pun_gurmukhi_script_desc: "Písmo Gurmukhī je #italic abugida#! vyvinutá v krajoch $PUN$ a obľúbená medzi našimi $sikhism_ADJ$ gurujmi. Naše duchovenstvo ho používa na zapisovanie $sikhism_ADJ$ textov." # todo: CHANGED
 pun_strength_of_the_misls: "Sila Mislov" # todo: NEW TRANSLATION
 pun_strength_of_the_misls_desc: "Administratívny systém štátov Misl v $PUN$ im umožňuje nasadiť impozantné jazdecké sily. V čase núdze môžeme tieto sily povolať, aby bojovali proti spoločnému nepriateľovi." # todo: CHANGED
 pun_reforming_the_punjabi_army: "Reforma $PUN_ADJ$ armády" # todo: NEW TRANSLATION
 pun_reforming_the_punjabi_army_desc: "Spôsoby našich predkov boli správne a roky sa osvedčili. Aby naše armády pokračovali v triumfoch na bojiskách, musíme vytvoriť profesionálnejšie vojsko. Študovaním usporiadania armád iných krajín a prispôsobením ich metód, kde je to rozumné, môžeme vytvoriť efektívnejšiu $PUN_ADJ$ armádu, pričom si zachováme unikátne vlastnosti nášho súčasného vojenského systému." # todo: CHANGED
 religious_melting_pot: "Náboženská fúzia" # todo: NEW TRANSLATION
 religious_melting_pot_desc: "Mnohé rôzne náboženstvá ovplyvnili náš ľud, od tradičných ľudových viere až po $hindu$ a $buddhist$ z $india$ a $china$. Postupom času si ľudia vytvorili určitú mieru náboženskej synkretizácie, miešajúc viaceré presvedčenia bez úplného odmietnutia ktoréhokoľvek z nich." # todo: CHANGED
 akson_thai: "Akson Thai" # todo: NEW TRANSLATION
 akson_thai_desc: "Pôvodne založené na starovekom $khmer_language$ písme, písmo $thai_culture$ sa vyvinulo tak, aby vyhovovalo zložitej fonológii nášho jazyka. Vlastné písmo bezpochyby prispelo k rozvoju našej jedinečnej kultúry." # todo: CHANGED
 father_governs_children: "Otec vládne deťom" # todo: NEW TRANSLATION
 father_governs_children_desc: "Naši vládci sú známi svojím blízkym spojením s obyčajnými ľuďmi. Nech náš ľud vždy žije slobodne a šťastne pod vedením svojich majestátnych, nebeských vládcov!" # todo: CHANGED
 thai_war_elephants: "Vojnové slony" # todo: NEW TRANSLATION
 thai_war_elephants_desc: "Slony boli v $indochina_region$ využívané ako ťažní aj palácoví jazdci po celé generácie, pričom králi sa často pustili do súbojov na slonoch proti vodcom protivnej strany." # todo: CHANGED
 thai_royal_poets: "Kráľovskí básnici" # todo: NEW TRANSLATION
 thai_royal_poets_desc: "Aký má zmysel vyhrávať vojny, ak o našich víťazstvách nik spieva? Náš dvor bude útočiskom básnikov a naša história ich bude inšpiráciou." # todo: CHANGED
 trading_links: "Obchodné spojenia" # todo: NEW TRANSLATION
 trading_links_desc: "Naša krajina bola križovatkou obchodu od staroveku. Naša blízkosť k $india$ a $china$ umožnila obchod prúdiť našimi zemami, rovnako ako vzťahy a výmeny s mnohými rôznymi krajinami." # todo: CHANGED
 foreign_mercenaries: "Zahraniční žoldnieri" # todo: NEW TRANSLATION
 foreign_mercenaries_desc: "Nedávno sme zaznamenali prílev barbariánov z cudzích krajín. Niektorí sú obchodníci, iní bojovníci. Využime ich v našich armádach." # todo: CHANGED
 toi_muay: "Toi Muay" # todo: NEW TRANSLATION
 toi_muay_desc: "Učené našim vojakom na bojové účely, je to neozbrojené bojové umenie využívajúce údery, zápasenie a techniky boja na zemi. Ovládanie tohto umenia umožňuje našim jednotkám zostať smrteľnými aj vtedy, keď stratia zbrane." # todo: CHANGED
 trading_embassies: "Obchodné zastupiteľstvá" # todo: NEW TRANSLATION
 trading_embassies_desc: "Početné obchodné lode prichádzajúce a odchádzajúce z našich vôd nás zoznámili s mnohými vzdialenými krajinami. Zriadením trvalých obchodných veľvyslanectiev s týmito ďalekými miestami môžeme premeniť príležitostný obchod na formálne vzťahy." # todo: CHANGED
 photduang: "Photduang" # todo: NEW TRANSLATION
 photduang_desc: "Naša mena môže cudzím prísť zvláštna, ale #italic $photduang$#! nám slúžili dobre po stáročia. Guľaté strieborné guličky so štampovanými úradnými známkami tvoria základ našej ekonomiky." # todo: NEW TRANSLATION
 personal_executions: "Osobné popravy" # todo: NEW TRANSLATION
 personal_executions_desc: "Odteraz budú najhorší zločinci osobne popravení vládcom. Tým si ľudia uvedomia, že sme usporiadaný štát odhodlaný k spravodlivosti, a prejavia náležitú poslušnosť zákonu." # todo: CHANGED
 close_subjects: "Blízki poddaní" # todo: NEW TRANSLATION
 close_subjects_desc: "Pre nás sú naši poddaní neoddeliteľnou súčasťou národa, nie niečo oddelené. Udržiavame s nimi úzke väzby a sú plne integrovaní do našej byrokracie a správy." # todo: CHANGED
 ayu_prestigious_cavalry: "Prestížna kavaléria" # todo: NEW TRANSLATION
 ayu_prestigious_cavalry_desc: "Či už na koni alebo na slonovi, môžeme sa pochváliť impozantnou jazdou, zvyčajne zloženou z potomkov najvýznamnejších rodín. Ich príspevky v podpore našej pechoty sú neoceniteľné." # todo: CHANGED
 ayu_white_elephant: "Biely slon" # todo: NEW TRANSLATION
 ayu_white_elephant_desc: "Biely slon symbolizuje posvätné kráľovstvo v $buddhist$ tradícii a je tiež emblémom nášho vládcu. Vlastnenie bieleho slona legitimizuje našu autoritu a dokazuje poddaným, že vládneme so žehnaním božstva." # todo: CHANGED
 ayu_ayutthaya_literature: "$AYU_ADJ$ literatúra" # todo: NEW TRANSLATION
 ayu_ayutthaya_literature_desc: "Náš kraj má bohatú a komplexnú literárnu tradíciu, od epických #italic Lilit#! básní rozprávajúcich slávne vojnové konflikty až po #italic Nirat#! poetiku o cestách a strate milovaných; od ľudových legiend o miestnych hrdinoch po panegyriky oslavujúce činy našich najslávnejších vládcov." # todo: CHANGED
 ayu_phrai_luang: "Phrai Luang" # todo: NEW TRANSLATION
 ayu_phrai_luang_desc: "Všetci slobodní muži povinní slúžiť #italic phrai#! nie len slúžia vo vojne — #italic $ayu_phrai_thaan$#! — ale tiež pomáhajú pri výstavbe verejných prác podľa uváženia miestnych guvernérov." # todo: CHANGED
 ayu_phrai_thaan: "Phrai Thaan" # todo: NEW TRANSLATION
 ayu_phrai_thaan_desc: "Všetci muži vo veku osemnásť rokov majú byť registrovaní v armádnych zoznamoch a ich informácie odovzdané vládnej byrokracii. Každý mužský občan je vhodný do brannej služby v čase vojny a zabezpečíme, že tak bude, ak to bude potrebné." # todo: CHANGED
 ayu_floating_rice: "Plávajúca ryža" # todo: NEW TRANSLATION
 ayu_floating_rice_desc: "Ryža sa v našej krajine pestuje už celé stáročia, no neustále záplavy našich riek vždy sťažovali správnu kultiváciu. Táto nová odroda ryže, zvyknutá rásť vo vode, nám poskytne stabilný zdroj potravín aj pri preliatí riek." # todo: CHANGED
 ayu_sakdina: "Sakdina" # todo: NEW TRANSLATION
 ayu_sakdina_desc: "Naša spoločnosť je prísne organizovaná podľa systému $ayu_sakdina$. Každý pozná svoje miesto v spoločnosti a koľko majetku a pozemkov mu prináleží. Táto organizácia veľmi uľahčuje výber daní." # todo: CHANGED
 ayu_cosmopolitan_trade: "Kozmopolitný obchod" # todo: NEW TRANSLATION
 ayu_cosmopolitan_trade_desc: "Naša krajina je domovom mnohých ľudí z ďaleka, ktorí prišli dúfať, že tu zbohatnú. Mať toľko ľudí a tovarov prechádzajúcich našimi hranicami nám prináša mnoho výhod." # todo: CHANGED
 suk_breaker_of_chains: "Lámač reťazí" # todo: NEW TRANSLATION
 suk_breaker_of_chains_desc: "Nie je to tak dávno, čo sme boli pod autoritou $KHM_ADJ$, ale získali sme slobodu a zaujali náležité miesto ako nezávislá mocnosť. Získali sme obdiv rýdzosti od našich rovesníkov a ich úctu." # todo: CHANGED
 suk_birthplace_of_a_culture: "Kolíska kultúry" # todo: NEW TRANSLATION
 suk_birthplace_of_a_culture_desc: "Sme považovaní za prvé nezávislé $thai_culture$ kráľovstvo, pretože ako prví sme sa vzbúrili proti autorite $KHM_ADJ$ a osamostatnili sa. Ako také sa na nás všetci $thai_culture$ ľudia pozerajú s obdivom." # todo: CHANGED
 suk_ram_khamhaeng_stele: "$name_ram_khamhaeng$ stéla" # todo: NEW TRANSLATION
 suk_ram_khamhaeng_stele_desc: "Veľká časť histórie ranného $SUK_ADJ$ kráľovstva pochádza z nápisov na $suk_ram_khamhaeng_stele$, objednaných veľkým kráľom na zaznamenanie jeho slávneho panovania. $suk_ram_khamhaeng_stele$ je posvätným dedičstvom a nepochybne dôkazom nášho miesta v histórii." # todo: CHANGED
 suk_akson_sukhothai: "Písmo $SUK$" # todo: NEW TRANSLATION
 suk_akson_sukhothai_desc: "Hoci písmo $thai_culture$ je už bežné medzi všetkými $thai_culture$ ľuďmi, nesmie sa zabudnúť, že bolo vyvinuté v našej krajine a pod naším vedením. Preto písmo $thai_culture$ nie je len spájacou silou našej kultúry, ale aj dôkazom našej individuality." # todo: CHANGED
 suk_wat_si_sawai: "Wat Si Sawai" # todo: NEW TRANSLATION
 suk_wat_si_sawai_desc: "Sme známi pre mnohé nádherné chrámy, ako $suk_wat_si_sawai$, jeden z najstarších v $sukhothai$. Postavený počas vlády $KHM_ADJ$ ako $hindu_ADJ$ chrám, jeho následné prestavanie z neho urobilo symbol našej identity. Viera nášho ľudu je silná." # todo: CHANGED
 suk_sukhothai_ceramics: "$SUK$ keramika" # todo: NEW TRANSLATION
 suk_sukhothai_ceramics_desc: "Keramika sa u $thai_culture$ ľudí vyrába od pradávna, pod vplyvom $chinese_group$ keramiky, no s vlastným štýlom. Keramika z našej krajiny má najvyššiu hodnotu a často sa obchoduje na veľké vzdialenosti za more." # todo: CHANGED
 suk_military_history: "Vojenská história" # todo: NEW TRANSLATION
 suk_military_history_desc: "Naše armády majú dlhú históriu víťazstiev v boji. Preto je post v našej armáde považovaný za čestný a prestížny a mnoho ľudí je ochotných slúžiť." # todo: CHANGED
 suk_unstoppable_army: "Nezastaviteľná armáda" # todo: NEW TRANSLATION
 suk_unstoppable_army_desc: "Mnohí sa v minulosti pokúšali zastaviť náš postup a expanziu, no všetci zlyhali pred našou armádou. Stala sa nezastaviteľnou silou, ktorá bez problémov rozdrví každú prekážku." # todo: CHANGED
 sia_experienced_ambassadors: "Skúsení veľvyslanci" # todo: NEW TRANSLATION
 sia_experienced_ambassadors_desc: "Máme rozsiahle politické skúsenosti. Zrod našej krajiny nebol dosiahnutý len silou zbraní. Naša diplomatická povesť sa určite stane zdrojom vplyvu na svete." # todo: CHANGED
 sia_rise_to_equal_heights: "Dosiahnuť rovnakú úroveň" # todo: NEW TRANSLATION
 sia_rise_to_equal_heights_desc: "Mnohé časti našej krajiny sú riedko osídlené. Mali by sme zlepšiť podmienky v týchto regiónoch, aby žiadna ich časť nevyzerala menejcenná a aby všetko žiarilo rovnako." # todo: CHANGED
 sia_advanced_elephant_warfare: "Pokročilé slonacie vojny" # todo: NEW TRANSLATION
 sia_advanced_elephant_warfare_desc: "Nie je nezvyčajné, že naše najväčšie básne chvália naše vojnové slony jednotlivo. Ukážme našim nepriateľom prečo!" # todo: CHANGED
 sia_consolidation_of_state: "Konsolidácia štátu" # todo: NEW TRANSLATION
 sia_consolidation_of_state_desc: "Decentralizovaný systém nás môže pripraviť o kontrolu nad vzdialenejšími provinciami. Ak máme byť skutočnou zjednocujúcou ríšou pre $thai_culture$ ľud, musí byť zjednotená aj naša správa provincií." # todo: CHANGED
 sia_education_reform: "Reformy vzdelávania" # todo: NEW TRANSLATION
 sia_education_reform_desc: "Ako hovoril náš Pán Buddha, neprijímame niečo len preto, že sa to často hovorí; musíme to sami zažiť. Vzdelanie je základom poznania a ak chceme vynikať v technológii, musíme najprv vyniknúť vo vzdelaní." # todo: CHANGED
 sia_royal_absolutism: "Kráľovský absolutizmus" # todo: NEW TRANSLATION
 sia_royal_absolutism_desc: "Druhý len Nebu — tak by mal byť panovník. Ctihodný a uctievaný, našim vodcom patrí vláda nad Zemou tak, ako bohovia vládnu nad Nebom." # todo: CHANGED
 sia_thai_unity: "Jednota $thai_culture$" # todo: NEW TRANSLATION
 sia_thai_unity_desc: "Sme bezpochyby lídrami všetkých $thai_culture$ ľudí. Naše jednotky sú hrdé, že slúžia ako obrancovia našej kultúry a identity a bojujú urputne za túto česť." # todo: CHANGED
 rom_spqr: "S.P.Q.R." # todo: NEW TRANSLATION
 rom_spqr_desc: "Senát a ľud Ríma sú večnými základmi nášho štátu. Odkazom na túto starobylú autoritu pripomíname, že Rím nevládne len silou zbraní, ale vôľou svojich občanov a inštitúcií." # todo: CHANGED
 rom_pax_romana: "Pax Romana" # todo: NEW TRANSLATION
 rom_pax_romana_desc: "Mier pod Rímom neznamená absenciu vojny, ale triumf poriadku. Presadzovaním zákonov a budovaním rozsiahlych ciest, ako aj mocou našich armád, prinesieme stabilitu a prosperitu do každého kúta Ríše." # todo: CHANGED
 rom_restore_the_legions: "Obnovenie légii" # todo: NEW TRANSLATION
 rom_restore_the_legions_desc: "Legie boli kedysi pýchou Ríma, obávané a rešpektované po celom svete. Ich obnova znamená aj oživenie disciplíny, organizácie a nezdolného ducha, na ktorom stojí naše veľké impérium." # todo: CHANGED
 rom_revival_of_arts_and_culture: "Obroda umenia a kultúry" # todo: NEW TRANSLATION
 rom_revival_of_arts_and_culture_desc: "Rím bol rovnako centrom kultúry ako impériom dobytí. Sponzorovaním básnikov, učencov a architektov opäť rozžiarime tvory, ktoré kedysi osvetľovali starý svet." # todo: CHANGED
 rom_new_corpus_juris_civilis: "Novus Corpus Juris Civilis" # todo: NEW TRANSLATION
 rom_new_corpus_juris_civilis_desc: "Naši právnici zostavia a zdokonalia náš právny poriadok do komplexného súboru, čerpajúc múdrosť Justiniána a republiky. Tým zaistíme spravodlivosť pre všetkých rímskych občanov." # todo: CHANGED
 rom_bread_and_circuses: "Panem et Circenses" # todo: NEW TRANSLATION
 rom_bread_and_circuses_desc: "Ľudí treba udržať nasýtených a zabavených, lebo nespokojnosť rodí povstanie. Kladením obilia na ich stoly a poskytovaním rozptýlenia ako hry a verejné slávnosti získame ich lojalitu a posilníme štát ich vlastenectvom." # todo: CHANGED
 rom_citizenship: "Rímske občianstvo" # todo: NEW TRANSLATION
 rom_citizenship_desc: "Občianstvo je krvný obeh Ríma, spájajúci ľudí každej provincie do jedného politického telesa. Rozšírenie týchto práv zaručí integráciu a sľub vzostupu pre každého, kto slúži impériu." # todo: CHANGED
 rom_all_roads_lead_to_rome: "Všetky cesty vedú do Ríma" # todo: NEW TRANSLATION
 rom_all_roads_lead_to_rome_desc: "Rímsky cestný systém je závisťou sveta. Zväzuje našu ríšu, urýchľuje obchodníkov, poslov a vojakov — všetky cesty končia v Večnom meste." # todo: CHANGED
 rom_provincial_governors: "Guvernéri provincií" # todo: NEW TRANSLATION
 rom_provincial_governors_desc: "Naše vzdialenejšie provincie nemožno účinne riadiť len z Ríma. Umiestnením kompetentných guvernérov do okrajových regiónov zabezpečíme, že naše zákony budú dodržiavané a dane platené včas aj v najvzdialenejších kútoch impéria." # todo: CHANGED
 rom_imperium_sine_fine: "Imperium Sine Fine" # todo: NEW TRANSLATION
 rom_imperium_sine_fine_desc: "Osud Ríma nepozná hranice. Od Pilierov Herculových až po okraje zemegule budeme rozširovať našu nadvládu bez konca, prinášajúc civilizáciu všade tam, kde vliezda Impérskeho orla." # todo: CHANGED
 rom_triumphs: "Rímske triumfy" # todo: NEW TRANSLATION
 rom_triumphs_desc: "Triumf nie je len sprievod. Je to živá pamäť dobytia, prechádzaná ulicami našich najväčších miest. Také obrady inšpirujú vernosť, úžas, strach a ambície v rovnakom pomere." # todo: CHANGED
 rom_roman_architecture: "Rímska architektúra" # todo: NEW TRANSLATION
 rom_roman_architecture_desc: "Od akvaduktov po amfiteátre, rímske inžinierstvo zanecháva monumenty, ktoré vydržia storočia. Naša majstrovská práca s kameňom a oblúkom ukáže svetu, že veľkosť Ríma je večná." # todo: CHANGED
 byz_heart_of_orthodoxy_advance: "Srdce $orthodox$" # todo: NEW TRANSLATION
 byz_heart_of_orthodoxy_advance_desc: "$constantinople$ je bijúcim srdcom živej viery. S hrdosťou sme domovom $orthodox$, nositeľov Ekumenického patriarchátu, a obrancov kresťanstva proti našim pohanským nepriateľom." # todo: CHANGED
 byz_akritai_advance: "Akritai" # todo: NEW TRANSLATION
 byz_akritai_advance_desc: "Sústredené predovšetkým na obranu hraníc, tieto ľahké jednotky dostávajú pôdu na obrábanie a zároveň ju chránia. Akritai sú najlepší v obrannom boji, najmä proti jazde, a často sú prvou odpoveďou proti vonkajším hrozbám." # todo: CHANGED
 byz_cataphracts_advance: "Neskoré kataphrakty" # todo: NEW TRANSLATION
 byz_cataphracts_advance_desc: "Hoci sa vojna od čias prvej inkarnácie našej ríše výrazne vyvinula, vrátane zavedenia pušného prachu, taktiky vyvinuté našimi predkami zostávajú často efektívne. Naši kátaphrakti stelesnia to najlepšie z našej starej i modernej bojovej múdrosti." # todo: CHANGED
 byz_historiography_advance: "$BYZ_ADJ$ Historiografia" # todo: CHANGED
 byz_historiography_advance_desc: "Náš ľud stojí na pleciach gigantov; je našou povinnosťou zanechať komplexné záznamy o sláve našej ríše, aby inšpirovali a poučili budúce generácie. Dôkladným zdokumentovaním životov našich výnimočných predkov, sledovaním našich cnostných línií a popisom našich zložitých tradícií prekročíme obyčajné historické záznamy a staneme sa skutočne legendárnymi." # todo: CHANGED
 men_of_letters_advance: "Muži písmen" # todo: NEW TRANSLATION
 men_of_letters_advance_desc: "Nie je žiadnym tajomstvom, že iné národy nám závidia literárne úspechy a osvietenú minulosť. Snažia sa najímať učiteľov z nášho dvora, túžiac po poznaní, ktoré vyformovalo mocné impéria a vytvorilo kultúrnu krajinu celého kontinentu. Práve cez týchto mužov písma si susedia zamilujú našu históriu a vzdelajú sa v našich spôsoboch." # todo: CHANGED
 byz_shield_of_the_west: "Štít Západu" # todo: NEW TRANSLATION
 byz_shield_of_the_west_desc: "Stojíme medzi $europe$ a morom pohanov ako štít proti cudzím hrozbám. Náš meč bude navždy zdvihnutý proti tým, ktorí sa snažia zničiť našu vieru, pripravení udrieť na každého, kto pohŕda našimi tradíciami." # todo: CHANGED
 byz_court_of_languages: "Dvor jazykov" # todo: NEW TRANSLATION
 byz_court_of_languages_desc: "Dvor $constantinople$ priťahuje diplomatov a návštevníkov zo všetkých kútov známeho sveta. Preto zabezpečujeme, aby všetky jazyky boli rovnako rešpektované a prijaté — praktická nevyhnutnosť pre impérium na križovatke civilizácií." # todo: CHANGED
 byz_poikilia: "Poikilia" # todo: NEW TRANSLATION
 byz_poikilia_desc: "Byzantská kultúra zaujala $europe$ svojou #italic poikilia#! — naša jedinečná estetika. Zdôrazňujúc vizuálnu rozmanitosť a ohromujúcu paletu farieb, poikilia vytvára symfóniu tónov a prvkov v našom umení a architektúre." # todo: CHANGED
 byz_crossroads_of_continents: "Medzikontinentálna križovatka" # todo: CHANGED
 byz_crossroads_of_continents_desc: "$BYZ$ sa nachádza medzi $europe$ a $asia$, čím je v mnohých ohľadoch spojnicou Východu a Západu. Naša výhodná poloha je veľmi výnosná a tiež nám umožnila výrazne rozšíriť náš námorný vplyv." # todo: CHANGED
 byz_the_new_helepolis: "Dobývač miest" # todo: NEW TRANSLATION
 byz_the_new_helepolis_desc: "Už vieme nasadzovať a zdokonaľovať mocné obliehacie stroje. Avšak prispôsobením našich návrhov na použitie pušného prachu budeme schopní úplne ovládnuť našich nepriateľov pomocou diel." # todo: CHANGED
 byz_reaffirm_synod_powers: "Reformované postupy synodu" # todo: NEW TRANSLATION
 byz_reaffirm_synod_powers_desc: "Byrokracia je nočnou morou pre krajinu našej veľkosti. Aby sme zlepšili postupy súvisiace s konaním $orthodox_synod$, zrevídujeme byrokratické procesy a prehodnotíme súvisiacu legislatívu." # todo: CHANGED
 byz_byzantine_inquisition: "$BYZ_ADJ$ Inkvizícia" # todo: CHANGED
 byz_byzantine_inquisition_desc: "$europe$ je pohltené náboženskými nepokojmi. Musíme byť pripravení vyrývať škaredé buriny herézy, ktoré sa objavia v záhrade našej Ríše, aby nepreobrastala pohanstvom. Naša pobožná obrana proti heretickému vniknutiu zabráni našej nestabilite." # todo: CHANGED
 byz_autokratoria_rhomaion: "Autokratoría Rhōmaíōn" # todo: NEW TRANSLATION
 byz_autokratoria_rhomaion_desc: "Náš veľký národ je nepochybným dedičom slávy a prestíže Ríma, a znovuzískanie tej dávno stratenej krajiny je našou hlavnou motiváciou." # todo: CHANGED
 byz_modernized_strategikon: "Modernizovaný Stratēgikon" # todo: NEW TRANSLATION
 byz_modernized_strategikon_desc: " #italic Strategikon#! — starodávny manuál jazdeckých taktik, logistiky a bojovej doktríny — nám dobre slúžil v dobách vojny. No keď sa vojna mení, musíme sa prispôsobiť. Naše taktiky a pluky sa prispôsobili modernému boju, používajúc zbrane takej deštrukcie, akej by Maurice nikdy nepredpokladal." # todo: CHANGED
 byz_ancient_greek_studies: "Štúdie starovekého $greek_culture$" # todo: NEW TRANSLATION
 byz_ancient_greek_studies_desc: "Znovuobjavenie a obnova starovekého $greek_culture$ umenia nám poskytla príležitosť lepšie vzdelávať masy a zachovať naše vysoké vedecké a kultúrne ideály. Dôkladne preskúmame múdrosť našich predkov." # todo: CHANGED
 byz_the_new_imperial_army: "Nová cisárska armáda" # todo: NEW TRANSLATION
 byz_the_new_imperial_army_desc: "Naša armáda zaostávala za ostatnými v $europe$ príliš dlho. Zavedením rozsiahlych vojenských reforiem a rozšírením brannej povinnosti dúfame vybudovať modernú armádu hodnú znovuzrodeného a nádherného fénixa, ktorý symbolizuje našu ríšu." # todo: CHANGED
 expand_varangian_guard_advance: "Rozšíriť Varjagovú gardu" # todo: NEW TRANSLATION
 expand_varangian_guard_advance_desc: "Varjagovia slúžia našej krajine po stáročia so cťou a oddanosťou. Rozšírením ich radov ešte viac posilníme stabilitu a ochranu $BYZ$." # todo: CHANGED
 imperatorskiy_moskovskiy_universitet: "Imperatorskiy Moskovskiy Universitet" # todo: NEW TRANSLATION
 imperatorskiy_moskovskiy_universitet_desc: "Imperiálna univerzita je venovaná štúdiu filozofie, medicíny a práva a hrá významnú úlohu vo vzdelávaní a výskume $RUS_ADJ$. Bola založená ako súčasť vzdelávacích reforiem polymata Michaila Lomonosova, zdôrazňujúc význam vedeckého bádania a inovácií." # todo: CHANGED
 hurricane_hardy: "Hurricane Hardy" # todo: NEW TRANSLATION
 hurricane_hardy_desc: "Dizajny Feodora Apraksina sú robustné a odolné, čo umožňuje lodiam prežiť väčšinu búrok, ktoré Matka príroda dokáže vzbudiť. Inovatívna konštrukcia výrazne prispieva k každým námorným ambíciám." # todo: NEW TRANSLATION
 preobrazhensky_semyonovsky_imperial_guard: "Preobrazhenský Semyonovský cisársky garda" # todo: NEW TRANSLATION
 preobrazhensky_semyonovsky_imperial_guard_desc: " 'Hračka armáda' je organizovaná do elitných jednotiek, tvoriacich cisársku gardu, ktorá chráni záujmy monarchie. Často sa zúčastňujú dvorových ceremónií, prehliadok a iných významných udalostí, ukazujúc svoj význam nad rámec vojenskej služby." # todo: CHANGED
 kasztelanowie: "Kasztelanowie" # todo: NEW TRANSLATION
 kasztelanowie_desc: "Kasteláni sú hlasom panovníka po našom území. Zodpovedajú za vyberanie daní a vynucovanie zákona a môžu dokonca vykonávať spravodlivosť v mene Koruny." # todo: CHANGED
 land_of_promise: "Zem zasľúbená" # todo: NEW TRANSLATION
 land_of_promise_desc: "Úrodné oblasti nášho panstva sú žiadaným cieľom mnohých prisťahovalcov, najmä tých nižšieho stavu, hľadajúcich lepší a prosperujúcejší život." # todo: CHANGED
 statute_of_kalisz: "Štatút z Kalisza" # todo: NEW TRANSLATION
 statute_of_kalisz_desc: "Známa ako Všeobecná charta slobôd $judaism_ADJ$, táto legislatíva obsahuje články, ktoré umožňujú všetkým Židom v našej ríši slobodu uctievania, obchodu a cestovania. Štatút tiež sa snaží zredukovať počet obvinení z rituálneho vraždenia Židov šírených $catholic_ADJ$ cirkvou." # todo: CHANGED
 corona_regni_poloniae: "Corona Regni Poloniae" # todo: NEW TRANSLATION
 corona_regni_poloniae_desc: "Táto legislatíva ustanovuje kráľovstvo ako nerozlučiteľnú kolektívnu entitu, vlastnenú nie jednou dynastiou alebo panovníkom, ale celým stavom šľachty. Vládci slúžia kráľovstvu, oni ho #italic nevlastnia#!. Tento pojem kolektivity je hlboko zakorenený v našej spoločnosti." # todo: CHANGED
 krakow_grosz: "Krakovský groš" # todo: NEW TRANSLATION
 krakow_grosz_desc: "Aby sme reformovali náš menový systém, zavedieme novú menu, #italic Kraków Grosz#!. Mince razené zo striebra sú určené, aby ohrozili moc $BOH_ADJ$ #italic Prague Groschen#! a pomohli etablovať naše kráľovstvo ako priekopníka centralizovaného zberu daní." # todo: CHANGED
 stone_and_brick: "Kameň a tehla" # todo: NEW TRANSLATION
 stone_and_brick_desc: "Po stáročia sme používali drevo na stavbu miest a opevnení, no teraz systematicky modernizujeme infraštruktúru výmenou zraniteľných drevených stavieb za silnejšie kamenné a tehlové. Zdedičili sme drevené mestá, ale opustíme ich opevnené kameňom a tehlou." # todo: CHANGED
 council_of_three_lands_advance: "Rada troch krajín" # todo: NEW TRANSLATION
 council_of_three_lands_advance_desc: "Náš štát má dlhú históriu prijímania ubohých, prenasledovaných $judaism_ADJ$ ľudí. Zriadenie rady, ktorá sa bude starať o ich potreby a hájiť ich práva, prispeje k stabilite a duchovnej sile tohto kráľovstva." # todo: CHANGED
 polish_renaissance: "$polish_group$ $renaissance$" # todo: CHANGED
 polish_renaissance_desc: "Inšpirovaní ideálmi $ITA_ADJ$ $renaissance$, prežívame kultúrny zlatý vek. Naše literárne úspechy, architektonické rozkoše a kultivovaná atmosféra náboženskej tolerancie viedli k rozkvetu kultúry naprieč našou zemou." # todo: CHANGED
 granary_of_europe: "Sklad obilia $europe$" # todo: CHANGED
 granary_of_europe_desc: "Úrodné polia nášho panstva sú domovom najbohatších obilných úrod v $europe$, čiastočne vďaka $folwark_system$. S našou milosťou zásobujeme trhy za hranicami, zabezpečujúc prosperitu a sýtosť nášho ľudu." # todo: CHANGED
 komisja_edukacji_narodowej: "Komisia národného školstva" # todo: NEW TRANSLATION
 komisja_edukacji_narodowej_desc: "Potreba nášho štátu po schopných administrátoroch viedla k systematickej vzdelávacej reforme. Zriadime prvé ministerstvo školstva v $europe$, venované rozširovaniu gramotnosti medzi obyvateľstvom, čo by malo viesť k nárastu kvalifikovaných kandidátov do našej rastúcej administratívy." # todo: CHANGED
 szkola_rycerska: "Rytierovská škola" # todo: NEW TRANSLATION
 szkola_rycerska_desc: "Založením 'Školy rytierov' na výcvik mládeže šľachty v vojenskej viede a ich vlasteneckom povinnosti vytvoríme generácie schopného, oddaného vojenského a civilného personálu." # todo: CHANGED
 great_sejm_reforms: "Reformy Veľkého sejmu" # todo: NEW TRANSLATION
 great_sejm_reforms_desc: "Ak chceme prežiť a naďalej prosperovať, náš vládny mechanizmus musí fungovať efektívne a byť založený na pevných základoch. Parlament prijme modernizované postupy a posilní svoju autoritu. Cieľom je obmedziť moc šľachty a zmierniť rastúce zneužívanie nevoľníctva." # todo: CHANGED
 late_winged_hussars_advance: "Neskorí krídloví husári" # todo: NEW TRANSLATION
 late_winged_hussars_advance_desc: "Vývoj $POL_ADJ$ husárstva zahŕňal prijatie ťažšej výzbroje s červeno-bielymi farbami. Používali dlhšiu kopiju asi šesť metrov, čo ich rozprášenie pri nájazde činilo neuveriteľne ničivým, často lámalo morálku nepriateľov a nútilo ich k úteku." # todo: CHANGED
 winged_hussars_advance: "Krídloví husári" # todo: NEW TRANSLATION
 winged_hussars_advance_desc: "Husári boli pôvodne ľahkou jazdeckou jednotkou na prieskum, ale s poklesom starej feudálnej armády sme prešli na profesionálne pluky, ktorých jadro tvoria ťažšie, obrnené husári. Strach z týchto krídlových bojovníkov rozoženie nepriateľov ako malé deti!" # todo: CHANGED
 wojsko_komputoe: "Wojsko Komputowe" # todo: NEW TRANSLATION
 wojsko_komputoe_desc: " 'Compute Army' bola založená na ročnom rozpočte vypočítanom a schválenom Sejmom. Myšlienkou bolo poskytnúť Commonwealthu stabilnú stálú armádu na obranu." # todo: CHANGED
 folwark_system: "Systém Folwark" # todo: CHANGED
 folwark_system_desc: "Folwark systém bol produkčný systém zdôrazňujúci vytváranie poľnohospodárskych prebytkov. Sedliaci boli podnecovaní pracovať buď cez prenájmy alebo prinútením. Tento systém tvoril pilier nášho hospodárstva." # todo: CHANGED
 baihua: "Báihuàwén" # todo: NEW TRANSLATION
 baihua_desc: "Naše panstvo sa tiahne ďaleko za obzor. Vznik spoločného písaného jazyka medzi našimi poddanými nám určite pomôže preklenúť rozdiely, pozdvihne našu kultúru a zníži konflikty založené na nedorozumení a jazykových rozdieloch." # todo: NEW TRANSLATION
 zaju: "Zájù" # todo: NEW TRANSLATION
 zaju_desc: "Tieto predstavenia, zvyčajne pozostávajúce zo štyroch dejstiev, sú brilantnou ukážkou tanca a hudby a farebným vyjadrením umeleckej výšky, ktorej naše spoločenstvo dosiahlo." # todo: NEW TRANSLATION
 successors_of_genghis_khan: "Nástupcovia $genghis_khan_name_no_tooltip$" # todo: NEW TRANSLATION
 successors_of_genghis_khan_desc: "Od dní totálneho dobytia až po rozľahlé rozloženie veľkej ríše $genghis_khan_name_no_tooltip$, náš ľud pochádza z pokolení, ktoré otrasali zemou. My sme tí, čo sú predurčení písať dejiny." # todo: CHANGED
 confucian_influences: "Konfuciánske vplyvy" # todo: NEW TRANSLATION
 confucian_influences_desc: "Ak chceme riadiť svoju ríšu správne, naši poradcovia nájdu veľkú múdrosť v konfuciánskom učení, ktoré zdôrazňuje meritoriálny výber úradníkov, pozornosť k administratívnym detailom a ďalšie základné rady pre vytvorenie zdravého a prosperujúceho štátu." # todo: CHANGED
 extensive_canal_works: "Rozsiahle práce na kanáloch" # todo: NEW TRANSLATION
 extensive_canal_works_desc: "Množstvo riek križujúcich naše územie má veľký hospodársky potenciál. Vytvorením rozsiahlej siete kanálov môžeme spojiť vodné cesty s vnútrozemskými sídlami, uľahčiť dopravu a zároveň zabezpečiť spoľahlivý zdroj vody pre náš ľud." # todo: CHANGED
 zhongshu_sheng: "Zhōngshū Shěng" # todo: NEW TRANSLATION
 zhongshu_sheng_desc: "Jedna z najdôležitejších vetiev #italic Three Departments and Six Ministries#!, centrálna sekretariátka je zodpovedná za prípravu a kodifikáciu mnohých cisárskych reforiem a dekrétov." # todo: CHANGED
 lijia_system: "Lǐ Jiǎ systém" # todo: NEW TRANSLATION
 lijia_system_desc: "Pod systémom #italic Lǐ Jiǎ#! môžeme vykonávať kontrolu nad pohraničnými územiami cez alokáciu usadených armád. Udelením pôdy a poľnohospodárskych práv našim stacionovaným vojakom budú naše hranice bezpečnejšie a naša autorita potvrdená." # todo: CHANGED
 yulin_tuce: "Yúlín Túcè" # todo: NEW TRANSLATION
 yulin_tuce_desc: "Daňové úniky su vždy problémom, ktorý sužoval aj našich predkov, no môžeme mať riešenie: zostavením registrov pre okresy a provincie lepšie budeme sledovať dane, ktoré centrálnej vláde dlží každý pozemok. Toto zdanenie je takmer vždy stanovené podľa výnosu obilia z každého premeraného pole." # todo: CHANGED
 weisuo_system: "Wèi Suǒ" # todo: NEW TRANSLATION
 weisuo_system_desc: "Mnohí by si priali dobiť naše krajiny. Ak chceme brániť svoje územie, musíme zaviesť systém pevností zameraný na rýchlu odozvu proti inváziám. Náborom miestnych vojakov doplníme našu obrannú silu zásobami a efektívnejšou logistikou." # todo: CHANGED
 grand_coordinators: "Veľkí koordinátori" # todo: NEW TRANSLATION
 grand_coordinators_desc: "Udržať kontrolu nad našimi územiami, tvorbu politík a vojenské operácie je životne dôležité pre pokračovanie našej dynastie. Vytvorením Veľkých koordinátorov, orgánu vysokopostavených úradníkov schopných koordinovať správu naprieč ríšou, upevníme svoju pozíciu efektívnym stabilizovaním vnútorných a vonkajších záležitostí." # todo: CHANGED
 the_censorate: "Cenzorát" # todo: NEW TRANSLATION
 the_censorate_desc: "Rovnako ako iné inštitúcie v našej administratíve, táto vetva vlády zodpovedá za predchádzanie korupcii. Cenzori majú za úlohu držať palácové intrigy a zneužívanie moci na uzde, často sú vnímaní ako oči a uši cisára." # todo: NEW TRANSLATION
 the_tea_trade: "Obchod s $tea$" # todo: CHANGED
 the_tea_trade_desc: " $tea$ je základný nápoj našej spoločnosti a stal sa centrom spoločenských zhromaždení, obľúbeným nápojom mnohých. To nepochybne vedie nielen k pestovaniu nových odrôd, ale aj k produkčnému boomu." # todo: CHANGED
 tu_bing: "Tǔ Bīng" # todo: NEW TRANSLATION
 tu_bing_desc: "V snahe posilniť obranu hraníc musíme vytvoriť systém náboru založený na miestnych vojakoch a stálych obranároch. Títo bojovníci budú cenným doplnkom našich vojenských schopností a budú oddelení od systému #italic Wèi Suǒ#!." # todo: CHANGED
 tusi_titles: "Tituly Tǔsī" # todo: NEW TRANSLATION
 tusi_titles_desc: "Tituly udeľované vojvodcom a miestnym silákom — tieto administratívne pozície sa používajú na potláčanie nepokojov a udržanie vidieckeho obyvateľstva pod centrálnou kontrolou." # todo: NEW TRANSLATION
 salt_monopoly: "Obnovenie monopolu na $salt$" # todo: CHANGED
 salt_monopoly_desc: "Monopol na $salt$ bol kedysi náš najdôležitejší zdroj príjmov, no predchádzajúci cisári ho zrušili, aby povzbudili voľný obchod. Teraz je čas vrátiť obchod s $salt$ pod štátnu kontrolu." # todo: CHANGED
 reform_the_grand_secretariat: "Reforma Veľkého sekretariátu" # todo: NEW TRANSLATION
 reform_the_grand_secretariat_desc: "Považovaný za #italic de facto#! najvyššiu inštitúciu v našej krajine, #italic Grand Secretariat#! slúžil našim vládcom po stáročia. Táto mocná skupina ministrov kabinetu musí prejsť reformou, aby sa zvýšila jej účinnosť." # todo: CHANGED
 grand_military_parades: "Veľké vojenské prehliadky" # todo: NEW TRANSLATION
 grand_military_parades_desc: "Naša slávna vojenská história je veľkým zdrojom inšpirácie a hrdosti. Organizovaním prepracovaných prehliadok, kde predvedieme naše armády, rozhodne preukážeme našu vojenskú skúsenosť a bezkonkurenčnú silu." # todo: CHANGED
 silver_standard: "Strieborný štandard" # todo: NEW TRANSLATION
 silver_standard_desc: "Prevedením väčšiny povinností voči centrálnej vláde — od poll daní po pracovné povinnosti sedliakov či dary miestnych úradníkov — do jednej striebornej platby, ktorej výška sa stanoví podľa počtu obyvateľov a obrábanej pôdy v každom prefektúre, zjednodušíme výber daní a zvýšime príjmy." # todo: CHANGED
 nine_garrisons_of_the_great_wall: "Deväť posádok Veľkého múru" # todo: NEW TRANSLATION
 nine_garrisons_of_the_great_wall_desc: "Aby sme sa ubránili pred zúrivými nájazdmi barbarov, musíme urobiť viac než len opraviť Veľký múr. Deväť posádok sú militarizované mestá pozdĺž M úra, ktoré nielen pomôžu brániť najdôležitejšie priechody, ale tiež zlepšia logistickú situáciu na našej severnej hranici." # todo: CHANGED
 the_red_cannon: "Červené delo" # todo: NEW TRANSLATION
 the_red_cannon_desc: "Rudochvostí barbaři z $europe$ môžu byť nevychovaní a necivilizovaní, ale vedia robiť delá a strelné zbrane dobrej kvality. Dovoz a duplikácia ich zbraní dá našej armáde významnú výhodu proti všetkým votrelcom." # todo: CHANGED
 woodblock_printing: "Drevorytová tlač" # todo: NEW TRANSLATION
 woodblock_printing_desc: "Výroba elegantných ilustrácií, umeleckých diel a kníh pomocou tejto tlačovej metódy upútala pozornosť nášho ľudu a naši majstri tlačiari sa neustále snažia zlepšovať techniku. Drevorytové tlačenie sa stalo súčasťou našej kultúry a s nedávnymi zlepšeniami a rozšírením literárnej produkcie ešte pozdvihne náš prestíž." # todo: CHANGED
 green_standard_army: "Armáda Zeleného standartu" # todo: NEW TRANSLATION
 green_standard_army_desc: "Zelená štandardná armáda, vojenská sila zložená prevažne z etnických Hàn vojakov, koexistuje s našimi armádami Osem Zástav. Pôvodne vytvorená z kapitulujúcich oddielov a dobrovoľne nábornej dlhodobej služby priťahuje ľudí z menej privilegovaných vrstiev. Používa sa ako policajná sila po konsolidácii a zohrá kľúčovú úlohu v miestnej vojenskej správe, zatiaľ čo Bannermeni budú vyhradení pre núdzové situácie a dlhodobý odpor." # todo: CHANGED
 great_tax_reform: "Veľká daňová reforma" # todo: NEW TRANSLATION
 great_tax_reform_desc: "Náš bohatý národ má dostatok peňazí a úrodné polia, ale toto bohatstvo si vyžaduje komplexné zdanenie. Veľká daňová reforma umožní efektívnejšie riadenie príjmov, čo by malo zabezpečiť zdravší rozpočet pre našu ríšu." # todo: CHANGED
 junji_chu: "Jūnjī Chù" # todo: NEW TRANSLATION
 junji_chu_desc: "Tiež známa ako Veľká rada, #italic Jūnjī Chù#! má na starosti vojenské záležitosti. Ako najdôležitejšia privátna rada zatienila Grand Secretariat, ktorý vládol minulým dynastiám. Napriek dôležitej úlohe zostane táto rada vnútri dvora neformálna, pričom jej členovia budú zastávať aj iné úradné funkcie." # todo: CHANGED
 jingdezhen_porcelain: "Jǐngdézhèn $porcelain$" # todo: CHANGED
 jingdezhen_porcelain_desc: "Náš $porcelain$ priemysel je symbolom prosperity a tradičnej remeselnej dokonalosti žijúcej v našej ríši. Zdokonalením už vynikajúcich techník výroby $porcelain$ v Jǐngdézhèn rozšírime svoj kultúrny vplyv ďaleko." # todo: CHANGED
 sanxitang: "Sānxītáng" # todo: NEW TRANSLATION
 sanxitang_desc: "Síň troch rarít je naším najvznešenejším útočiskom vzácnych a cenných predmetov a diel umenia. Vďaka štedrému patronátu nášho vládcu sa rozvinula do miesta pre akademické diskusie, prednášky a kultúrne podujatia, podporujúc intelektuálnu výmenu a vedecké aktivity." # todo: CHANGED
 monuments_to_greatness: "Pamätníky veľkoleposti" # todo: NEW TRANSLATION
 monuments_to_greatness_desc: "Za tisícročia existencie nášho ľudu prežili stovky katastrof vďaka svojej húževnatosti. Táto vnútorná pevnosť sa stala definujúcou črtou našej spoločnosti. Ukazujeme našu odolnosť v sile armády a božskej kráse nášho umenia." # todo: CHANGED
 ten_great_campaigns: "Desať veľkých ťažení" # todo: NEW TRANSLATION
 ten_great_campaigns_desc: "Desať veľkých kampaní je zameraných na rozšírenie nášho vplyvu vnútri i mimo hraníc. Na dosiahnutie toho zorganizujeme obrovskú armádu na potlačenie akéhokoľvek odporu. Udusíme život každému povstaniu skôr, než vytiahne hlavu, a naša sláva bude večná." # todo: CHANGED
 tributary_system: "Tributárny systém" # todo: NEW TRANSLATION
 tributary_system_desc: "Systém podriadených miestnych vojevôdov a ďalších vládcov, ktorí nám pravidelne posielajú dary vernosti ako uznanie našej nadvlády. Zlepšenie a centralizácia tohto systému by nám pomohla upevniť kontrolu a vyžmýkať z nich viac." # todo: CHANGED
 timurid_cavalry: "$TIM_ADJ$ jazda" # todo: NEW TRANSLATION
 timurid_cavalry_desc: "Rovnako ako veľký $genghis_khan_name_no_tooltip$ ovládal stepi silou svojej jazdy, tak aj my triumfujeme cez naše nesporiteľné kone. Šľachtené pre najprudší boj a osadené najlepšie vycvičenými vojakmi na svete, naša jazda vzbudí strach v srdciach nepriateľov." # todo: CHANGED
 timurid_architecture: "$TIM_ADJ$ architektúra" # todo: NEW TRANSLATION
 timurid_architecture_desc: "Architektúra $persia_region$ bola po stáročia závistou známeho sveta. Musíme podporovať nový architektonický štýl, ktorý prekoná všetko doteraz, aby sme si nárokovali svoje narodenie ako majstrov tohto umenia." # todo: CHANGED
 the_mantle_of_the_great_khan: "Plášť veľkého $rank_kingdom_horde_ruler_suffix_male$" # todo: NEW TRANSLATION
 the_mantle_of_the_great_khan_desc: "Smrť $genghis_khan_name_no_tooltip$ vytvorila mocenské vákuum, ktoré priviedlo mnohých, čo by mali vedieť lepšie, do súboja o nástup. Avšak strategickými sobášmi sme upevnili nárok na pôvod z rodu veľkého $rank_kingdom_horde_ruler_suffix_male$ a bojovníci stepi nám prisľúbia vernosť." # todo: CHANGED
 turco_persian_tradition: "Turko-perská tradícia" # todo: NEW TRANSLATION
 turco_persian_tradition_desc: "$IRA$ bol vždy nepopierateľným centrom kultúry a jazyka v regióne, ovplyvňujúc rôzne $turkic_group$ národy po stáročia. Prijmeme túto zmes kultúr a vytvoríme vlastnú jedinečnú tradíciu." # todo: CHANGED
 tamerlane_chess: "Tamerlánove šachy" # todo: NEW TRANSLATION
 tamerlane_chess_desc: "Táto nová verzia šachu, vynález nášho veľkého menovca, vylepšuje predchádzajúce verzie. Používanie jej pomôže našim generálom zlepšiť strategické a taktick é schopnosti." # todo: CHANGED
 chagatai_literature: "$karluk_language$ literatúra" # todo: NEW TRANSLATION
 chagatai_literature_desc: "Jazyk $karluk_language$ východných stepí je oveľa vhodnejší niesť myšlienky a idey našej veľkej línie než $persian_language$ alebo $arabic_language$. Musíme propagovať používanie nášho tradičného jazyka a vytvoriť novú literárnu tradíciu." # todo: CHANGED
 nambardar_levy: "Nambardar Levy" # todo: NEW TRANSLATION
 nambardar_levy_desc: " $nambardar_levy$, alebo #italic čerig-i nambardar#!, označuje naše jednotky prichádzajúce nie z $mongolian_culture$ alebo $turkic_group$ pôvodu, ale z pôvodného $iranian_group$ obyvateľstva. Vďaka nim môžeme budovať väčšie armády, než by bolo možné skôr." # todo: CHANGED
 timurid_renaissance: "$TIM_ADJ$ $renaissance$" # todo: CHANGED
 timurid_renaissance_desc: "Od počiatku $TIM_ADJ$ expanzie naše mestá priťahujú najväčších remeselníkov a múdrych ľudí doby. Vďaka pokračujúcej podpore umenia, vedy a literatúry sme urobili z $herat$ a $samarkand$ najjasnejšie perly sveta." # todo: CHANGED
 riches_of_the_silk_road: "Kontrola Hodvábnej cesty" # todo: NEW TRANSLATION
 riches_of_the_silk_road_desc: "Pokiaľ naši obchodníci kontrolujú obchod cez územia $transoxiana_area$ a $samarkand$, obchod na Hodvábnej ceste bude plynúť bez prekážok a bohatstvo našej dynastie bude naďalej rásť." # todo: NEW TRANSLATION
 reform_the_diwan: "Reforma Dīwānu" # todo: NEW TRANSLATION
 reform_the_diwan_desc: "Máme šťastie, že nás obsluhujú lojálni a dobre vzdelaní $farsi_culture$ úradníci, ktorí ovládli umenie správy po generácie. Avšak dedičné úrady môžu s časom stagnovať a stratiť inováciu. Znížením počtu dedičných úradov s každou generáciou zabezpečíme, že odmena pôjde nielen vernosti, ale aj schopnosti. Schopní administrátori musia vystúpiť na vysoké posty bez ohľadu na rodové väzby." # todo: CHANGED
 conquerors_legacy: "Dedičstvo dobyvateľa" # todo: NEW TRANSLATION
 conquerors_legacy_desc: "Naša slávna ríša vyrástla z odkazu veľkých dobyvateľov. Bola to zuřivosť vojsk $genghis_khan_name_no_tooltip$, ktorá mu umožnila dobyť od $europe$ po $china$. Ako jeho nástupcovia budú naše sily rovnako hrozivé ako jeho." # todo: CHANGED
 glh_kipchak_khanate: "Kipčacký chanát" # todo: NEW TRANSLATION
 glh_kipchak_khanate_desc: "Naša veľká krajina je tiež známa ako Kipčacký chanát, vládnuci nad všetkými územiami Kuman-Kipčackej konfederácie. S takými rozsiahlymi územiami pod našou správou budú armády, ktoré môžeme zhromaždiť, nespočetné." # todo: NEW TRANSLATION
 glh_legacy_of_jochi: "Dedičstvo Joči" # todo: NEW TRANSLATION
 glh_legacy_of_jochi_desc: "Po smrti $genghis_khan_name_no_tooltip$ aj jeho syn Joči čoskoro zomrel. Napriek tomu jeho prítomnosť a dedičstvo sú v našej krajine stále citeľné, až do tej miery, že sme známi ako Ulus Joči. Bojovníci sa hrnú pod naše prápory, aby udržali túto povesť." # todo: CHANGED
 glh_legacy_of_the_golden_horde: "Odkaz Zlatéj hordy" # todo: NEW TRANSLATION
 glh_legacy_of_the_golden_horde_desc: "Boli sme jednou z hlavných súčastí ríše $genghis_khan_name_no_tooltip$ a predstavujeme hlavnú politickú silu v $eastern_europe$ a na stepiach. Svet sa pred nami bude chvieť!" # todo: CHANGED
 glh_perso_mongol_administration: "Perso-$MGE_ADJ$ správa" # todo: CHANGED
 glh_perso_mongol_administration_desc: "Naši predkovia vylepšovali administratívny systém po stáročia a nehanbili sa prevziať nápady a metódy kultúr, ktoré podrobili. Náš súčasný administratívny systém je čiastočne založený na tradíciách siahajúcich až ku veľkému $genghis_khan_name_no_tooltip$ a čiastočne na tom, čo sme prevzali od $IRA_ADJ$ a $muslim_ADJ$ byrokratov v dobytých krajinách." # todo: CHANGED
 glh_tatar_traditions: "Tatárske tradície" # todo: NEW TRANSLATION
 glh_tatar_traditions_desc: "Naša ríša už nemusela byť vládnutá z konskej sedla, no naše armády zostávajú majstrami jazdy. Po stáročia sme zotrvali verní svojim koreňom, zabezpečujúc, že málokto sa vyrovná zručnosti našich jazdcov. Ako napredujeme a prijímame nové technológie a taktiky, staviame na silných organizovaných vojenských tradíciách $MGE_ADJ$ impéria." # todo: CHANGED
 glh_secure_the_trade_routes: "Zabezpečiť obchodné trasy" # todo: NEW TRANSLATION
 glh_secure_the_trade_routes_desc: "Nie všetky bohatstvá sveta pochádzajú z našej vlasti. Obchod je zdroj všetkého bohatstva a Zlatá Horda vždy chránila obchodníkov. Zabezpečením bezpečnosti tých, ktorí chcú prepravovať tovar cez našu krajinu, zabezpečíme stabilný prúd kožušín, hodvábu, korenia a iných tovarov do našich miest. Či už si predajú tovar nám alebo nie, ich prítomnosť vytvára bohatstvo." # todo: CHANGED
 glh_religious_pragmatism: "Náboženský pragmatizmus" # todo: NEW TRANSLATION
 glh_religious_pragmatism_desc: "Prísne a neflexibilné doktríny nikdy nezískali veľa obdivovateľov medzi tatárskymi hordami. Keď veľký $Oz_Beg$ $rank_kingdom_horde_ruler_suffix_male$ prijal $muslim$, pozval k sebe vieru Sufi šejka alebo zanieteného kádija.\n\nStoročia tradície a vernosti sú na čom radšej budujeme štát. Náboženstvo má svoju úlohu, ale radšej uvidíme prosperitu krajiny než zánik v chaosu vynútenej náboženskej homogenity." # todo: CHANGED
 glh_modernization_of_steppes: "Modernizácia stepí" # todo: NEW TRANSLATION
 glh_modernization_of_steppes_desc: "Je to dávno, čo armády $genghis_khan_name_no_tooltip$ po prvýkrát uchopili step. Náš štát odvtedy prekonal očakávania našich predkov a teraz stojíme ako globálna mocnosť vlastnými zásluhami. Začneme proces modernizácie našich území, aby sme jedného dňa boli svetlom pre celý svet." # todo: CHANGED
 cri_genghisid_legacy: "Genghisidské dedičstvo" # todo: NEW TRANSLATION
 cri_genghisid_legacy_desc: "Naši predkovia jazdili s $genghis_khan_name_no_tooltip$ pri jeho drancovaní známeho sveta. Udržali sme svoje vojenské tradície a pokračujeme v panovaní prinajmenšom $rank_kingdom_horde_ruler_suffix_male$ zostupnom z rodu Genghisidov." # todo: CHANGED
 cri_slavers: "Otročiari stepí" # todo: NEW TRANSLATION
 cri_slavers_desc: "Je tu veľké bohatstvo v obchode s $slaves_goods$; nič netušiaci $christian_ADJ$ zajatci, ktorí sa ocitnú v našich rukách, dosahujú vysokú cenu na trhoch $turkish_culture$, $AIA_ADJ$ a $ITA_ADJ$." # todo: CHANGED
 cri_free_cattle_grazing: "Voľné pasenie dobytka" # todo: NEW TRANSLATION
 cri_free_cattle_grazing_desc: "Neukladáme žiadne obmedzenia pastierom pri pasení ich veľkých stád koní a dobytka. Chovatelia sú slobodní vykonávať svoj obchod, môžu bezpečne cestovať po stepi a slobodne obchodovať." # todo: NEW TRANSLATION
 cri_steppe_commanders: "Velitelia stepí" # todo: NEW TRANSLATION
 cri_steppe_commanders_desc: "$CRI_ADJ$ velitelia jazdy zvládli umenie mobility v stepnom boji, používajúc rýchlosť, obkľúčenie a previerky na prekonanie pomalších európskych armád." # todo: CHANGED
 cri_devshirme_of_the_steppes: "Devširme stepí" # todo: NEW TRANSLATION
 cri_devshirme_of_the_steppes_desc: "$CRI_ADJ$ elity napodobňovali prvky $TUR_ADJ$ vojensko-administratívnych praktík, miešajúc $turkic_group$ a $muslim_ADJ$ systémy na riadenie ľudských zdrojov a vojenskej účinnosti." # todo: CHANGED
 chg_legacy_of_chagatai: "Odkaz Čagataja" # todo: NEW TRANSLATION
 chg_legacy_of_chagatai_desc: "Dedičstvo $genghis_khan_name_no_tooltip$ je naše vďaka jeho synovi Chagataiovi. Všetci sa pred nami budú chvieť, keď si nárokoveme jeho slávu!" # todo: CHANGED
 chg_chagatai_riders: "Čagatajskí jazdci" # todo: NEW TRANSLATION
 chg_chagatai_riders_desc: "Kone $genghis_khan_name_no_tooltip$ prešli a dobyli územia od $europe$ po $china$. Ako jeho dedičia bude naša jazda vstrašiť nepriateľov rovnakým spôsobom." # todo: CHANGED
 chg_the_mountain_khanate: "Horský chanát" # todo: NEW TRANSLATION
 chg_the_mountain_khanate_desc: "Sme ukrytí medzi $balkhash_lake$ a Tiānshānom. Je to tvrdá a nemilosrdná zem, ktorú náš ľud vie využiť ako zbraň proti prípadným inváziám." # todo: CHANGED
 chg_border_wars: "Neustále hraničné vojny" # todo: NEW TRANSLATION
 chg_border_wars_desc: "Obkolesení národmi, ktoré nás odporujú, čelíme neustálemu boju o udržanie hraníc. Naši neustále bdelí vojaci majú bohaté príležitosti zdokonaľovať zručnosti v boji, čo dáva vznik bojom otvrdenému národu pripravenému získať Chagataiskú slávu." # todo: CHANGED
 chg_sons_of_chagatai: "Synovia Čagataja $rank_kingdom_horde_ruler_suffix_male$" # todo: NEW TRANSLATION
 chg_sons_of_chagatai_desc: "Môžeme sledovať svoj pôvod až ku Chagatai $rank_kingdom_horde_ruler_suffix_male$, druhému synovi $genghis_khan_name_no_tooltip$, ktorý kedysi vládol týmto zemiam a založil mocné mongolské nástupnícke štát. Hoci uplynula dlhá doba, môžeme stále nárokovať značnú legitímnosť apelovaním na dedičstvo nášho neohrozeného predka." # todo: CHANGED
 chg_tradition_of_conquest: "Tradícia dobyvania" # todo: NEW TRANSLATION
 chg_tradition_of_conquest_desc: "Dobývanie ľudí nie je jednoduché; nie každý je pripravený prijať našu osvietenú vládu. Zistili sme však, že existujú ľahšie spôsoby, ako priviesť ľudí do našej ríše než budovať horu lebiek — niečo, čo naši predkovia nikdy nepoznali." # todo: CHANGED
 chg_scheming_court: "Dvor intríg" # todo: NEW TRANSLATION
 chg_scheming_court_desc: "Neustále mocenské boje medzi rôznymi kniežatami, šľachtou, mestami a kmeňmi v Chagatajskej Chanate vychovali národ mimoriadne schopných intrigánov. Ak dokážeme dať stranou spory a túto energiu nasmerovať na prekonanie nepriateľov, bude to veľká výhoda." # todo: CHANGED
 chg_glory_of_conquest: "Sláva dobytia" # todo: NEW TRANSLATION
 chg_glory_of_conquest_desc: "Nech je známe, že chlapec sa nemôže stať mužom, kým najprv nevojde do našej neporaziteľnej rýchlej jazdy, že si nemôže vziať ženu, kým nesvedčí o odvahe, že nie je hodný chatrče, kým nespáli cudzí príbytok. Nech je služba v našich armádach jedinou cestou k mužnosti." # todo: NEW TRANSLATION
 chg_unrelenting_horde: "Neúprosná horda" # todo: NEW TRANSLATION
 chg_unrelenting_horde_desc: "Naše armády budú kráčať ako veľké hordy $genghis_khan_name_no_tooltip$. Naše vojská prejdú po nepriateľoch ako čepeľ trávy na našich rodných stepiach. Všetci sa budú báť sily našich armád!" # todo: NEW TRANSLATION
 mge_pax_mongolica: "Pax Mongolica" # todo: NEW TRANSLATION
 mge_pax_mongolica_desc: "Po zjednotení všetkých $mongolian_culture$ území pod našou zástavou sa stabilita a prosperita, ktorú si náš ľud môže užívať, neobjavila od čias veľkého $genghis_khan_name_no_tooltip$." # todo: CHANGED
 mge_all_under_a_khan: "Všetko pod $rank_kingdom_horde_ruler_suffix_male$" # todo: NEW TRANSLATION
 mge_all_under_a_khan_desc: "$genghis_khan_name_no_tooltip$ zjednotil široké územia pod svojou zástavou. Opätovným zjednotením častí pod autoritou jediného $rank_kingdom_horde_ruler_suffix_male$ prisahajú všetky národy našej ríše vernosť nám." # todo: CHANGED
 mge_ghostly_horses_of_the_plain: "Duchovné kone rovniny" # todo: NEW TRANSLATION
 mge_ghostly_horses_of_the_plain_desc: "Zručnosť $mongolian_culture$ jazdcov je svetoznáma. Naši nepriatelia sa trasú pri pohľade na oblak prachu v diaľke, obávajúc sa, že je to náš príchod!" # todo: CHANGED
 mge_yeke_mongol_ulus: "Yeke Mongol Ulus" # todo: NEW TRANSLATION
 mge_yeke_mongol_ulus_desc: "Ako pôvodní Mongoli sme obnovili #italic Yeke Mongol Ulus#!, Veľký mongolský štát, oživujúc slávu $genghis_khan_name_no_tooltip$ veľkej ríše. Ak dostaneme šancu, náš ľud zopakuje činy Veľkého $rank_kingdom_horde_ruler_suffix_male$ a zjednotí kedysi rozľahlé územia $MGE_ADJ$ Chanatu." # todo: CHANGED
 mge_life_of_steppe_warrior: "Život stepného bojovníka" # todo: NEW TRANSLATION
 mge_life_of_steppe_warrior_desc: "Step je nehostinné a kruté miesto pre nevycvičeného. My sme na tento tvrdý život zvyknutí, a preto sú naši ľudia odolní a vedia prežiť. Postaráme sa, aby všetci naši vojaci zdedili tieto schopnosti a dokázali ľahšie prežiť v extrémnych podmienkach." # todo: CHANGED
 mge_multicultural_empire: "Mnohokultúrna ríša" # todo: NEW TRANSLATION
 mge_multicultural_empire_desc: "Územia veľkého $MGE_ADJ$ impéria sú domovom mnohých rôznych národov, všetci zjednotení pod slávou mocného $rank_kingdom_horde_ruler_suffix_male$." # todo: CHANGED
 mge_improved_yam_system: "Vylepšený systém jam" # todo: NEW TRANSLATION
 mge_improved_yam_system_desc: "Systém staniční #italic yam#! po celej ríši uľahčoval komunikáciu a logistiku už za čias veľkého $genghis_khan_name_no_tooltip$. Po znovuzavedení a zlepšení tohto systému môžu naši poslovia prekonať obrovské vzdialenosti rýchlosťou, ktorá bola kedysi nepomysliteľná." # todo: CHANGED
 mge_mongolian_mobility: "Mongolská mobilita" # todo: NEW TRANSLATION
 mge_mongolian_mobility_desc: "Každý z našich vojakov má typicky tri až štyri kone, čo im umožňuje meniť jazdné zvieratá vždy, keď sa unavia, a cestovať rýchlo dni bez zastavenia. Ich nadpočetné kone poskytujú aj potravinové rezervy cez mlieko i mäso, čím sú naše armády menej náchylné na hladovanie než 'civilizované' armády. To nám umožňuje obchádzať nepriateľov a prekonávať obrovské vzdialenosti v kratších časoch, než si kedy predstavovali." # todo: CHANGED
 mge_kheshig: "Kheshig" # todo: NEW TRANSLATION
 mge_kheshig_desc: " #italic Kheshig#! kedysi tvorili hrdinskú osobnú gardu veľkého $MGE_ADJ$ $rank_kingdom_horde_ruler_suffix_male$. Ich potomkovia budú naďalej chrániť $rank_kingdom_horde_ruler_suffix_male$ $MGE$ pri jeho pochode do boja." # todo: CHANGED
 mge_glory_of_the_khan: "Sláva $rank_kingdom_horde_ruler_suffix_male$" # todo: NEW TRANSLATION
 mge_glory_of_the_khan_desc: "Výnimočný $genghis_khan_name_no_tooltip$ zhromaždil obrovskú armádu ako nikdy predtým. Sme dedičmi jeho slávy, a preto naša armáda prekoná aj najväčšie hordu minulosti." # todo: CHANGED
 horse_lords: "Pánovia koní stepi" # todo: CHANGED
 horse_lords_desc: "Náš ľud a kone zdieľajú neoddeliteľné puto. Deti vyrastajú pri žriebätách, učia sa jazdiť od útleho veku. Starostlivý chov a vyčerpávajúci výcvik týchto zvierat sú našou najväčšou pýchou a sme známi po celom svete ako najlepší chovatelia koní." # todo: CHANGED
 kurultai_advance: "Kurultaj" # todo: NEW TRANSLATION
 kurultai_advance_desc: "Zvolíme $rank_empire_horde_ruler_suffix_male$ zhromaždením vodcov z každého bojového zoskupenia pod jednou strechou. V tomto #italic kurultai#! sa rozhodne osud nášho ľudu a vodcovia budú vyberaní medzi tými, ktorí sa cítia hoden viesť nás." # todo: CHANGED
 beyond_the_sun: "Za slnkom" # todo: NEW TRANSLATION
 beyond_the_sun_desc: "Doba Veľkých hord ešte neskončila. Poučili sme sa z chýb našich nepriateľov a teraz povstávame múdrejší a silnejší. Všetky krajiny, kde sa slnko rodí a zapadá, musia byť naše." # todo: NEW TRANSLATION
 steppe_slave_raiding: "Otrocké nájazdy z stepí" # todo: NEW TRANSLATION
 steppe_slave_raiding_desc: "Naše nájazdové družiny sa pohybujú rýchlosťou vetra, udeľujúc údery a miznúc skôr, než niekto zareaguje. Lúpenie napadnutých osád je samo o sebe výnosné, a zajatci, ktorých chytime, majú vysokú cenu na otrokovom trhu." # todo: CHANGED
 caravanserai_advance: "$caravanserai$" # todo: NEW TRANSLATION
 caravanserai_advance_desc: "Obchodné trasy vznikli v $central_asia$ za posledné tisícročie a vytvorili sieť známu ako Hodvábna cesta. Kľúčové pre jej rozmach boli $caravanserai$, miesta, kde sa karavány a obchodníci mohli zastaviť a odpočinúť." # todo: CHANGED
 borjigin_blood: "Krv $borjigin_dynasty$" # todo: CHANGED
 borjigin_blood_desc: "Zdieľame krv dynastie $borjigin_dynasty$, samotného $genghis_khan_name_no_tooltip$. Všetky krajiny sa nám klaňajú v uznaní nášho pôvodu a všetky územia stepí nás uznajú za svojich." # todo: CHANGED
 turco_mongol_tradition: "Turko-mongolská tradícia" # todo: NEW TRANSLATION
 turco_mongol_tradition_desc: "Aj keď dynastia $borjigin_dynasty$ má mongolský pôvod, územia dobyté $genghis_khan_name_no_tooltip$ v $central_asia$ boli prevažne obývané $turkic_group$ populáciou. V dôsledku toho vznikla odlišná zmiešaná kultúra medzi týmito dvoma skupinami." # todo: CHANGED
 yams_of_the_great_khan: "Jamové stanice veľkého $rank_kingdom_horde_ruler_suffix_male$" # todo: NEW TRANSLATION
 yams_of_the_great_khan_desc: "Aby poslovia dokázali cestovať dostatočne rýchlo, aby držali krok s mongolskými armádami, $genghis_khan_name_no_tooltip$ zriadil systém relajných staníc alebo #italic yams#!, ktoré boli situované každých 30–60 km a poskytovali jedlo, úkryt a náhradné kone pre posly mongolských armád. Toto umožnilo správam cestovať rýchlosťou koňa bez spomalenia únavou. Týmto spôsobom naša ríša prekonala logistické problémy spôsobené obrovským rozsahom Pax Mongolica — aspoň dočasne." # todo: CHANGED
 mandate_of_the_khan: "Mandát $rank_kingdom_horde_ruler_suffix_male$" # todo: NEW TRANSLATION
 mandate_of_the_khan_desc: "Ako prikáže $rank_kingdom_horde_ruler_suffix_male$, tak prikazujú bohovia. Jednota nášho ľudu pramení z vernosti nášmu veľkému vodcovi. Len ten, kto dokáže obrátiť vôľu verných ľudí, je hoden našej oddanosti." # todo: CHANGED
 there_shall_be_no_grass: "Nebude tam žiadna tráva" # todo: NEW TRANSLATION
 there_shall_be_no_grass_desc: "Kde prejde naša horda, tráva už nikdy nevyroste; zem už nebude živiť našich nepriateľov. Deň a noc ubehnú a pôda zostane pustá, bez úrody. Niektorým hladom sa nedá uniknúť." # todo: CHANGED
 slavery_before_death: "Otroctvo pred smrťou" # todo: NEW TRANSLATION
 slavery_before_death_desc: "Rasovanie a ničenie miest sú súčasťou vojny. V minulosti naši bojovníci zvykli vyrážať do raptúzy, ničia a plenia všetko, čo sa im postavilo do cesty, a zabíjali tých, ktorí stáli im v ceste. Hoci to posilňovalo ich morálku, tieto činy neboli ekonomické. S týmto novým prístupom môžeme aspoň zotročiť tých, ktorí sú schopní pracovať, namiesto bezhlavého sťatia ich pre lebku trónu." # todo: CHANGED
 horde_loyalty: "Vernosť horde" # todo: NEW TRANSLATION
 horde_loyalty_desc: "Lojalita nášho ľudu je nepochybná. Nikto, kto žil pod prosperujúcou vládou $rank_kingdom_horde_ruler_suffix_male$, by si nikdy nepomyslel, že by ju opustil." # todo: NEW TRANSLATION
 horde_loot_discovery_advance: "Zisky z nájazdov" # todo: NEW TRANSLATION
 horde_loot_discovery_advance_desc: "Plienenie bolo vždy súčasťou našej identity. Drancovanie a rabovanie sú spôsobom, akým sa náš ľud učí bojovať a získavať značné osobné bohatstvo. Nie je na tom nič zlé, ak podporíme ešte viac nájazdov — aspoň nie pre nás." # todo: CHANGED
 trampling_horde: "Dupajúca horda" # todo: NEW TRANSLATION
 trampling_horde_desc: "$genghis_khan_name_no_tooltip$ rozozvučal svet svojimi dobytiami a my spravíme to isté. Svet sa naučí báť zvuk valiacich kopyt, keď sa naša jazda priblíži!" # todo: CHANGED
 watchers_of_the_silk_road: "Strážci Hodvábnej cesty" # todo: NEW TRANSLATION
 watchers_of_the_silk_road_desc: "My nestaviame, neobchodujeme. Berieme si to, čo potrebujeme... a niekedy viac. Naši bojovníci dbajúc o obchodníkov a ich cesty nám odhalili najbezpečnejšie cesty na prepravu tovaru." # todo: CHANGED
 logistics_of_khan: "Logistika $rank_kingdom_horde_ruler_suffix_male$" # todo: NEW TRANSLATION
 logistics_of_khan_desc: "Ľudia zabúdajú, že dobytia Veľkého $rank_kingdom_horde_ruler_suffix_male$ boli rovnako výsledkom vynikajúcej logistiky ako vojenskej sily. Musíme napodobniť techniky Veľkého $rank_kingdom_horde_ruler_suffix_male$ a súčasne ich aktualizovať moderným poznaním. To nám poskytne väčší priestor na dobytie." # todo: CHANGED
 populating_the_steppes: "Osídľovanie stepí" # todo: NEW TRANSLATION
 populating_the_steppes_desc: "Rovnako ako prinášame skazu nepriateľom, musíme priniesť pokoj tým, ktorí žijú v našich hraniciach. Udržiavaním vnútornej stability a povzbudzovaním talentovaných mužov a žien z celej ríše k plánovaniu a osídľovaniu nových veľkých miest skrotíme stepi." # todo: CHANGED
 a_magnanimous_empire: "Veľkorysá ríša" # todo: NEW TRANSLATION
 a_magnanimous_empire_desc: "Veľký $rank_kingdom_horde_ruler_suffix_male$ nebol známy len svojím mečom, ale aj výnimočnou štedrosťou voči tým, ktorí múdro sklonili kolená. Tí, ktorí privítajú vládu nášho tolerantného impéria, budú považovaní za jeho súčasť." # todo: CHANGED
 horde_ardor: "Horlivosť hordu" # todo: NEW TRANSLATION
 horde_ardor_desc: "Naše kone sú takmer rovnako kruté a desivé pre nepriateľov ako ich jazdci. Pohľad na našu jazdu vystrojenú do boja je ako sledovať nezastaviteľnú silu démonov z pekla." # todo: CHANGED
 ira_sasanian_heritage: "Sásánovské dedičstvo" # todo: NEW TRANSLATION
 ira_sasanian_heritage_desc: "Pred islamským dobytím $persia_region$ bola táto oblasť domovom Sasánovskej ríše, ktorá kedysi vládla od Kaukazu na západe až po pohorie Kirthar na východe. Mnohé z jej veľkých kultúrnych prínosov formovali našu kultúrnu a umeleckú identitu." # todo: CHANGED
 ira_islamized_persia: "$IRA_ADJ$ $muslim$" # todo: CHANGED
 ira_islamized_persia_desc: "Islamizácia $IRA$ bola dlhodobý proces. Nie je ešte úplne dokončená, no naše náboženstvo sa stalo jedným z hlavných pilierov našej národnej identity. Mnohé z našich starých tradícií sa zmiešali s učením $muslim$ a teraz tvoria jadro našej kultúry." # todo: CHANGED
 ira_shahnameh: "$shahnameh$" # todo: NEW TRANSLATION
 ira_shahnameh_desc: " #italic $shahnameh$#! — Kniha kráľov — je epická báseň a národný poklad $farsi_culture$ ľudu. Opisuje historickú a mytologickú minulosť ríš, ktoré kedysi ovládali Veľké $persia_region$, a jej príbehy prispeli k $farsi_culture$ kultúre nespočetnými spôsobmi." # todo: CHANGED
 ira_restoration_of_cities: "Obnova miest" # todo: NEW TRANSLATION
 ira_restoration_of_cities_desc: "Mongolská invázia zanechala $IRA$ v troskách. Mnohé mestá veľkého rozsahu boli znížené na ruiny. Avšak nastal čas obnoviť, čo bolo zničené, a znovu postaviť úchvatnú ríšu $IRA$." # todo: CHANGED
 ira_improved_silk_road: "Vylepšiť Hodvábnu cestu" # todo: NEW TRANSLATION
 ira_improved_silk_road_desc: "Systém zlepšení ciest a mostov, reťaz stráží ochraňujúca cesty za malý poplatok a sieť $caravanserai$ pre odpočinok a osvieženie. Všetky tieto vylepšenia pomôžu obchodníkom na Hodvábnej ceste a zároveň prinesú štátu výnosy." # todo: CHANGED
 ira_promotion_of_irrigation: "Podpora zavlažovania" # todo: NEW TRANSLATION
 ira_promotion_of_irrigation_desc: "Ako následok mongolského vpádu je $IRA$ v niektorých oblastiach odľahčená obyvatelstvom v porovnaní s predchádzajúcimi ríšami, ktoré tieto země držali. Podpora zavlažovania by mala pomôcť našim ľuďom rozvíjať poľnohospodárstvo potrebné na zvýšenie populácie a pomôcť nám zotaviť sa z minulých strát." # todo: CHANGED
 ira_persian_horses: "$IRA_ADJ$ kone" # todo: CHANGED
 ira_persian_horses_desc: "Kone zohrávajú v našej spoločnosti zásadnú úlohu. Mnohí z našich ľudí vyrastajú po boku svojich stajníkov, čo sa odráža v starostlivosti chovateľov a v odolnosti našej jazdy." # todo: CHANGED
 ira_spread_of_persian_influence: "$IRA_ADJ$ vplyv" # todo: CHANGED
 ira_spread_of_persian_influence_desc: "$persian_language$ je starobylý jazyk s históriou dlhšou než život mnohých ríš. Ani $muslim_ADJ$ dobytie nedokázalo zničiť jadro $IRA_ADJ$ identity a mnohé štáty sa snažia napodobniť našu kultúru." # todo: CHANGED
 ira_persian_rug_production: "$IRA_ADJ$ výroba kobercov" # todo: CHANGED
 ira_persian_rug_production_desc: "$IRA$ je od dávna preslávené krásnymi kobercami a kobercami. Avšak keď Mongoli zdevastovali ríšu, veľká časť tohto kultúrneho dedičstva zmizla. Aby $IRA$ úplne obnovilo svoju zvrátenú slávu, musíme znovu získať ekonomickú silu a obnova tohto legendárneho priemyslu je prvým krokom." # todo: CHANGED
 ira_safaviyya_order_hall: "$safaviyya_order_hall$" # todo: NEW TRANSLATION
 ira_safaviyya_order_hall_desc: "$safaviyya_order_hall_desc$" # todo: NEW TRANSLATION
 ira_the_qizilbash: "$qizilbash$" # todo: NEW TRANSLATION
 ira_the_qizilbash_desc: " #italic $qizilbash$#! — Červené hlavy — sú šiitské vojenské hnutie založené Ṣafawiyya. Viesť ich náboženskou oddanosťou a silnými väzbami k súfizmu sú títo bojovníci pripravení bojovať za náš štát a tvoriť jadro našej armády." # todo: CHANGED
 ira_the_qurchi: "Qurchi" # todo: NEW TRANSLATION
 ira_the_qurchi_desc: "Zatiaľ čo $qizilbash$ sú chrbticou $IRA_ADJ$ vojsk, #italic Qurchi#! sú kráľovskou gardou brániacou panovníka a nábor sú z radov $qizilbash$. Namiesto udeľovania pôdy sú títo vojaci platení z kráľovskej kasy." # todo: CHANGED
 ira_religious_state: "Náboženský štát" # todo: NEW TRANSLATION
 ira_religious_state_desc: "Bez ohľadu na oficiálne vierovyznanie nášho štátu, $IRA$ vždy zostane inherentne náboženskou krajinou. Každý aspekt nášho života je vedený náboženskými princípmi a dokonca i vláda sa riadi základnými hodnotami pri rozhodovaní o morálnych a právnych otázkach." # todo: CHANGED
 ira_the_ghilman: "$a_ghilman$" # todo: NEW TRANSLATION
 ira_the_ghilman_desc: " $a_ghilman$ sú vojenské jednotky zložené z bývalých $christian_ADJ$ otrokov kaukazského pôvodu. $a_ghilman$ prechádzajú prísnym vojenským výcvikom a sú obratní v používaní strelných zbraní, čo z nich robí neoddeliteľnú súčasť národnej armády. Slúžia ako protipól iným vplyvným vetvám ozbrojených síl." # todo: CHANGED
 ira_encouraged_art: "Podporiť umenie" # todo: NEW TRANSLATION
 ira_encouraged_art_desc: "$IRA_ADJ$ umenie je veľmi žiadané. Zberatelia z blízka i ďaleka sem cestujú v dave, aby si zakúpili naše vynikajúce výtvory. Mali by sme štátne podporovať našich talentovaných umelcov, pretože tento obchod s estetickými výrobkami je veľmi výnosný." # todo: CHANGED
 ira_nazir: "Dvorový Nāẓir" # todo: NEW TRANSLATION
 ira_nazir_desc: " #italic Nāẓir#!, alebo dozorcovia, sú územní správcovia a predstavujú oči a uši Šáha. Všetky kroky dvora sú dohliadané Nāẓirom a dvorania sú povyšovaní na jeho príkaz. Dokonca aj veľký vezír musí pracovať v spojení s Nāẓirom." # todo: CHANGED
 ira_the_tofangchi: "$a_tofangchi$" # todo: NEW TRANSLATION
 ira_the_tofangchi_desc: " $a_tofangchi$ sú naše mušketyrové zbori. Hoci strelné zbrane sa už používajú, ich prítomnosť v našich radoch je ešte nepravidelná, pretože mnohí z našich bojovníkov uprednostňujú tradičný luk. Pluky $a_tofangchi$ sa snažia to zmeniť, pretože sú vyškolení v používaní moderných zbraní." # todo: CHANGED
 ira_the_tupchi: "$a_tupchi$" # todo: NEW TRANSLATION
 ira_the_tupchi_desc: "$a_tupchi_desc$" # todo: NEW TRANSLATION
 ira_religious_unity_policy: "Politika náboženskej jednoty" # todo: NEW TRANSLATION
 ira_religious_unity_policy_desc: "Doba veľkých náboženských rozkolov sa skončila. V týchto búrlivých časoch si $muslim$ nemôže dovoliť vnútorné spory. Budeme obhajovať politiku vnútorného a vonkajšieho náboženského zjednotenia a zmieriť sa s tým, čo sme kedysi považovali za herézu." # todo: CHANGED
 ira_afsharid_navy: "Obrana pobrežia $persian_gulf$" # todo: CHANGED
 ira_afsharid_navy_desc: "Hoci naše územia sú väčšinou v hornatinách pohoria Zagros, $IRA$ má aj pobrežné državy. Zatiaľ čo minulé dynastie mohli venovať málo pozornosti námornej ochrane impéria, náš ľud je viac uvedomelý o mori a naši námorníci sú ochotní brániť naše pobrežia." # todo: CHANGED
 ira_jazayerchi: "$a_jazayerchi$ pechotný zbor" # todo: NEW TRANSLATION
 ira_jazayerchi_desc: "$a_jazayerchi_desc$" # todo: NEW TRANSLATION
 uc_bey_advance: "$uc_bey$" # todo: NEW TRANSLATION
 uc_bey_advance_desc: "$uc_bey_desc$" # todo: NEW TRANSLATION
 seljuk_roots: "Korene seldžukov" # todo: NEW TRANSLATION
 seljuk_roots_desc: "Sme obkolesení nepriateľmi zo všetkých strán, preto je silná armáda nevyhnutnosťou. Našťastie nie sme slabý ľud. Od nepravidelných Ġuzāt a Akıncılar lúpežníkov po Sipâhi $TUR$, svet sa naučil rešpektovať našu vojenskú silu. Postavme armádu hodnú impéria, inšpirovanú našou slávnou históriou a tradíciami." # todo: CHANGED
 heirs_of_rum: "Potomkovia Rûm" # todo: CHANGED
 heirs_of_rum_desc: "Po prežití búrlivého obdobia a víťazstve v boji o dominanciu nad susednými bejlikmi nastal čas obnoviť hranice kedysi veľkého Sultanátu Rûm!" # todo: CHANGED
 splendor_of_anatolia: "Plesk $anatolia_region$" # todo: CHANGED
 splendor_of_anatolia_desc: "Náš región je domovom niektorých najimpozantnejších madrás a mešít v celom $muslim_ADJ$ svete. S ich precíznosťou a bohatým talentom vynikajú naši remeselníci bezkonkurenčne." # todo: CHANGED
 persian_in_the_court: "$IRA_ADJ$ pri dvore" # todo: CHANGED
 persian_in_the_court_desc: "Perzština slúži ako administratívny jazyk už dlhé roky, dedičstvo z našich starobylých koreňov. To nám pomohlo prekonať sociálne a kultúrne bariéry, ktoré často vznikajú v vysoko rozmanitých štátoch." # todo: CHANGED
 akinji_cavalry: "Akıncılar" # todo: NEW TRANSLATION
 akinji_cavalry_desc: "Naše regimente ľahkej jazdy často robia nájazdy a niekedy sa usadzujú v susedných územiach. Známí svojou odvahou v boji, žili a pôsobili ako lúpežníci na hraniciach, často prvá línia obrany proti vpádom a ideálne umiestnení na útok a pretrhnutie obchodných trás nepriateľa." # todo: CHANGED
 crossroads_of_commerce: "Križovatka obchodu" # todo: NEW TRANSLATION
 crossroads_of_commerce_desc: "Naše $caravanserais$ podporujú tok obchodu, informácií a ľudí od $china$ po $europe$ cez naše územia. Táto blízkosť k dôležitým obchodným trasám uvoľnila príliv bohatstva po celej našej krajine." # todo: CHANGED
 fratricide_succesion_advance: "$fratricide_succesion$" # todo: NEW TRANSLATION
 fratricide_succesion_advance_desc: "$fratricide_succesion_desc$" # todo: NEW TRANSLATION
 flexible_loyalty: "Pružná lojalita" # todo: NEW TRANSLATION
 flexible_loyalty_desc: "Náš štát stojí uprostred sporu medzi bojujúcimi vierami $europe$ a rôznymi cudzími hrozbami. Jediný spôsob, ako prežiť v tejto búrke, je zaujať flexibilný postoj ku spolupráci s miestnymi žoldnierskymi skupinami." # todo: CHANGED
 heritage_of_the_rus: "Dedičstvo Rus'" # todo: NEW TRANSLATION
 heritage_of_the_rus_desc: "Zeme Rus' sa dávno rozpadli na fragmentované štáty, ale spomienka na našu kedysi veľkú ríšu, vládnutú z $kyiv$, žiari v nás všetkých. Ak si prídeme na starú módu a zdôrazníme naše spojenie s predkami, budeme schopní vybudovať vlastné tradície pre náš ľud." # todo: CHANGED
 mother_of_russian_cities: "Matka štátov Rus'" # todo: NEW TRANSLATION
 mother_of_russian_cities_desc: "$kyiv$ bola kedysi žiarivým hlavným mestom veľkej ríše siahajúcej od severných lesov $novgorod$ po južné brehy Čierneho mora. Po rozpade Rus' a mongolských nájazdoch z toho zostalo málo. Avšak prišiel čas na naše znovuzrodenie a bez ohľadu na utrpenie našich miest prisaháme, že sa zotavia a prosperujú ďalšie storočia!" # todo: CHANGED
 international_influences: "Zahraničné vplyvy" # todo: NEW TRANSLATION
 international_influences_desc: "Mnohí cudzinci obchodníci a cestovatelia často navštevujú naše cesty, prinášajúc našej krajine obrovské bohatstvo. Mohli by sme presvedčiť niektorých z týchto obchodníkov, aby sa natrvalo usadili v našich mestách, ak im zaručíme, že nebudú prenasledovaní pre svoje vierovyznanie." # todo: CHANGED
 reuniting_rus: "Zjednotenie Rus'" # todo: NEW TRANSLATION
 reuniting_rus_desc: "Sme pravými dedičmi Kyjevskej Rusi a tieto země musia byť opäť zjednotené pod našou zástavou!" # todo: CHANGED
 united_faith: "Zjednotená viera" # todo: NEW TRANSLATION
 united_faith_desc: "Nech je naša situácia akákoľvek, musíme zaistiť jednotu našej viery. Len keď bude naše duchovenstvo zjednotené a medzi frakciami nebude rozkol, môžu sa sústrediť na svoju hlavnú úlohu viesť a podporovať ľud." # todo: CHANGED
 east_and_west: "Východ a Západ" # todo: NEW TRANSLATION
 east_and_west_desc: "Naša strategická poloha medzi východnými a západnými impériami dala našim obchodníkom príležitosť pôsobiť ako kľúčoví sprostredkovatelia lukratívnych regionálnych obchodných trás." # todo: CHANGED
 ruthenian_state_advance: " $UKR_ADJ$ štát" # todo: CHANGED
 ruthenian_state_advance_desc: "V minulosti sme sa podrobovali cudzej vplyvom a prispôsobovali ich zvykom, aby sme udržali priateľské vzťahy. Ale časy sa zmenili a teraz musíme potvrdiť naše vlastné zvyky, alebo riskujeme opätovné upadnutie do sféry cudzích vplyvov." # todo: CHANGED
 ruthenian_rural_buildings: "$UKR_ADJ$ dediny" # todo: CHANGED
 ruthenian_rural_buildings_desc: "Veľká časť $ruthenia_region$ je vidiecka a prázdna. Aj keď naše veľké mestá ako $kyiv$ majú dôležité funkcie, nesmieme zanedbať vzdialené pôdy alebo malé dediny, ktoré nám poskytujú dôležité zásoby potravín a surovín." # todo: CHANGED
 ruthenia_commoner_education: "Vzdelanie pre všetkých $UKR_ADJ$ obyvateľov" # todo: CHANGED
 ruthenia_commoner_education_desc: "Zriadením miestnych škôl zabezpečíme, že naše obyvateľstvo bude dobre vzdelané na všetkých úrovniach spoločnosti." # todo: CHANGED
 cossack_raids: "Kozácke nájazdy" # todo: NEW TRANSLATION
 cossack_raids_desc: "Naši kozáci žijú takmer v trvalom stave vojny a osvojili si lúpežné taktiky podobné tým $MGE_ADJ$ hordám. Hoci si tým nezískame veľa priateľov, nesmierne to obohacuje naše poklady." # todo: CHANGED
 tamed_steppes: "Skrotené stepi" # todo: NEW TRANSLATION
 tamed_steppes_desc: "Hoci väčšina považuje stepi za nehostinné a bezcenné územia, naši kozáci sa im prispôsobili a dokážu nielen prežiť, ale aj prosperovať v divočine. Vďaka ich odbornosti dokážeme tieto zeme využiť a profitovať z nich." # todo: CHANGED
 cossacks_recruitment: "Nábor Kozákov" # todo: CHANGED
 cossacks_recruitment_desc: "Kozáci sú hroziví bojovníci a ich schopnosť prežiť drsnú stepnú divočinu je takmer bezkonkurenčná. Majú miesto v našom štáte aj v armáde ako elitná sila, ktorá bude presadzovať našu vládu nad stepami." # todo: CHANGED
 cossacks_escaped_serfs: "Utečení nevoľníci" # todo: NEW TRANSLATION
 cossacks_escaped_serfs_desc: "Mnohí kozáci sa narodili v nevoľníctve. Unavení feudálnou útlakou ušli svojim pánom a hľadali slobodný život na stepiach. Musíme naďalej vítat týchto utekajúcich nevoľníkov do našej spoločnosti." # todo: CHANGED
 cossacks_hetmanate: "Kozácky hetmanát" # todo: NEW TRANSLATION
 cossacks_hetmanate_desc: "Medzi kozákmi nie sú králi ani chánovia. Vedu ich #italic ataman#!, ktorý je ich najvyšším vojenským veliteľom, no vo veciach štátu a spoločnosti je len prvým medzi rovnými. Politická moc spočíva v Rade, legislatívnej a vojenskej zhromaždení, v ktorej môžu kozáci všetci vyjadriť svoj názor." # todo: CHANGED
 cossack_administration: "Kozácka správa" # todo: NEW TRANSLATION
 cossack_administration_desc: "Udzelením našim kozáckym vodcom dvojitej úlohy ako generálov i správcov zrýchlime nábor do armády a zabezpečíme vysoké štandardy výcviku." # todo: CHANGED
 steppe_riders: "Jazdci stepí" # todo: NEW TRANSLATION
 steppe_riders_desc: "Stepi sú zvláštne a zradné miesto na život. Keď vstúpite do Nekonečného mora trávy, váš kôň prestane byť iba zvieraťom alebo majetkom a skutočne sa stane súčasťou vás. Tak ako telo nemôže prežiť bez srdca alebo pečene, na stepiach určite neprežije bez koňa. Dobrou správou však je, že tí, ktorí sa v takej situácii ocitnú, nájdu nespočetne zaujímavých spôsobov, ako zahynúť..." # todo: CHANGED
 cossacks_exploration_advance: "Kozácke prieskumy" # todo: NEW TRANSLATION
 cossacks_exploration_advance_desc: "Naši kozáci žijú na okrajoch krajiny, čo ich robí vynikajúcimi kandidátmi na prieskumníkov, ktorí vycestujú za naše hranice na poslednú hranicu, preskúmajú cudzie krajiny a civilizácie, a odvážne sa vydajú tam, kam ešte nikto predtým nešiel..." # todo: CHANGED
 cossacks_military_society: "Vojenská spoločnosť" # todo: NEW TRANSLATION
 cossacks_military_society_desc: "Medzi civilnou a vojenskou spoločnosťou kozákov takmer neexistuje rozdiel. Sú to zbor definovaný ľudom skôr než územím, ktoré ovládajú, a ich ľud sú bojovníci. Musíme zabezpečiť, aby vojenské deliteľstvá správne zodpovedali našim administratívnym potrebám, keď sa zbor rozrastá." # todo: CHANGED
 cossacks_serf_autonomy: "Autonómia kozáckych poddaných" # todo: CHANGED
 cossacks_serf_autonomy_desc: "Žiadny človek by nemal trpieť tyraniou medzi kozákmi. Keď dobyjeme nové územia, poddaní, roľníci a otroci tam budú zaobchádzaní ako rovnocenní s naším vlastným ľudom." # todo: CHANGED
 cossacks_colonization_advance: "Kozácka kolonizácia" # todo: NEW TRANSLATION
 cossacks_colonization_advance_desc: "Naši kozáci sú už zvyknutí sa voľne potulovať a prekračovať hranice. Môžeme ich využiť na podporu ďalšej osídľovacej činnosti a tak rozšíriť náš vplyv na nepretknuté krajiny." # todo: CHANGED
 cossacks_registered: "Kozácke registre" # todo: NEW TRANSLATION
 cossacks_registered_desc: "Keď sa rady našich kozákov rozrastajú, musíme viesť záznamy o sile každého pluku, ich počte a o tom, ako sú zásobovaní. Centralizovaný register nám umožní podporiť potreby všetkých kozákov." # todo: CHANGED
 cossack_reputation: "Desivá povesť" # todo: CHANGED
 cossack_reputation_desc: "Naši kozáci si už vybudovali povesť divokých bojovníkov. To samo o sebe stačí, aby zasialo strach do sŕdc našich nepriateľov, keď ich stretnú v boji." # todo: CHANGED
 geo_georgian_highlands: "$GEO_ADJ$ vysočiny" # todo: NEW TRANSLATION
 geo_georgian_highlands_desc: "Zeme $GEO$ sú ukryté medzi Kaukazskými horami a žiadna cudzia moc nikdy nemala ľahké preniknúť na naše územie. Naša húževnatosť a odolnosť sú legendárne." # todo: CHANGED
 geo_georgian_script: "$georgian_culture$ písmo" # todo: NEW TRANSLATION
 geo_georgian_script_desc: "„$georgian_culture$ abeceda“, vytvorená pred storočiami, nie je len jedna abeceda, ale v skutočnosti tri. #italic Mkhedruli#! je písmo používané civilnou správou, zatiaľ čo #italic Asomtavruli#! a #italic Nuskhuri#! používa naša cirkev. Vďaka tomu môžu naše Sväté písma zostať nedotknuté laickým jazykom a zároveň sa ľud s nimi cíti spätý." # todo: CHANGED
 geo_georgian_isolation: "$GEO_ADJ$ izolácia" # todo: NEW TRANSLATION
 geo_georgian_isolation_desc: "Obklopení mocnými krajinami s náboženstvami a kultúrami veľmi odlišnými od našich sme nútení používať oportunistickú diplomaciu a často meniť spojenectvá, aby sme uspokojili všetkých a zachovali pokoj čo najdlhšie." # todo: CHANGED
 geo_legacy_of_saint_nino: "Dedičstvo svätej Nino" # todo: NEW TRANSLATION
 geo_legacy_of_saint_nino_desc: "$GEO má jednu z najstarších $christian_ADJ$ cirkví na svete, ktorej korene siahajú až ku konverzii regiónu svätou Ninou pred viac ako tisícročiami. Počas storočí $GEO_ADJ$ cirkev slúžila ako čoraz zjednocujúca sila vo všetkých $GEO_ADJ$ štátoch a bola centrálnym prvkom $GEO_ADJ$ kultúry proti vplyvom $BYZ_ADJ$, $MGE_ADJ$ a $muslim_ADJ$. Keďže v tomto regióne zostáva len málo ďalších $christian_ADJ$ kráľovstiev a lojalita v rámci $GEO$ je roztrieštená, cirkev stále zohráva dôležitú úlohu zjednocujúcej sily proti cudzím vplyvom." # todo: CHANGED
 geo_restoration_of_fortresses_and_churches: "Obnova pevností a kostolov" # todo: NEW TRANSLATION
 geo_restoration_of_fortresses_and_churches_desc: "Naše mnohé pevnosti a kostoly pomohli krajine odolávať a prežiť medzi vpádmi cudzích vplyvov. Naše pevnosti chránia zem, zatiaľ čo naše kostoly chránia ducha, a musíme udržiavať oboje v perfektnom stave, ak chceme prosperovať." # todo: CHANGED
 geo_sadrosho_districts: "Sadrosho Districts" # todo: NEW TRANSLATION
 geo_sadrosho_districts_desc: "#italic Sadrosho#!, prápory, sú špeciálne vojenské obvody používané na mobilizačné účely. Rozdelením nášho územia na niekoľko sadrosho, z ktorého každý má svojho vlastného vojenského veliteľa, môžeme lepšie organizovať nábor a rozdeľovanie všetkých našich vojsk." # todo: CHANGED
 geo_dasturlamali: "Dasturlamali" # todo: NEW TRANSLATION
 geo_dasturlamali_desc: "$GEO zažilo búrlivé stáročia od $MGE_ADJ$ invázie, poznačené periodickým rozdelením, meniacimi sa vonkajšími tlaky a vzostupom vplyvu miestnej šľachty. Starý $GEO_ADJ$ feudálny systém sa stal zastaraným, alebo aspoň čiastočne odstráneným. $geo_dasturlamali$, komplexný súbor pravidiel a usmernení popisujúcich povinnosti poddaných a šľachty voči kráľovi a štátu, posilňuje vnútorný poriadok a slúži ako základ právneho rámca nášho kráľovstva." # todo: CHANGED
 geo_georgian_embassies: "$GEO_ADJ$ veľvyslanectvá" # todo: NEW TRANSLATION
 geo_georgian_embassies_desc: "Mám tradíciu nadväzovať silné diplomatické väzby so všetkými národmi okolo nás bez ohľadu na naše možné rozdiely. V dôsledku toho sú naši diplomati vždy dobre prijímaní a rešpektovaní." # todo: CHANGED
 geo_georgian_unification: "$GEO_ADJ$ zjednotenie" # todo: NEW TRANSLATION
 geo_georgian_unification_desc: "$GEO bolo v minulosti rozdelené cudzím aj vnútorným vplyvom. Ale vlastenecký $GEO_ADJ$ ľud je viac než ochotný bojovať, aby $GEO$ už nikdy nebolo rozdelené." # todo: CHANGED
 geo_legacy_of_saint_george: "Dedičstvo svätého Juraja" # todo: NEW TRANSLATION
 geo_legacy_of_saint_george_desc: "Naše spojenie s legendárnym svätým Jurajom je dobre známe v $christian_ADJ$ aj $muslim_ADJ$ svete. Tak ako odvážne čelil a zabil hrozivého draka, tak aj naši vojaci čelia nepriateľom v boji." # todo: CHANGED
 geo_bagrationi_dynasty: "$Bagrationi$ dynastia" # todo: NEW TRANSLATION
 geo_bagrationi_dynasty_desc: "Dynastia tak stará, že jej počiatky sú zahalené tajomstvom, králi a kráľovné rodu $Bagrationi$ vládli $GEO$ od 9. storočia, najprv ako kniežatá a potom ako monarchovia." # todo: NEW TRANSLATION
 geo_georgian_golden_age: "$GEO_ADJ$ zlatý vek" # todo: NEW TRANSLATION
 geo_georgian_golden_age_desc: "$GEO prežívalo kultúrne a náboženské Zlaté obdobie, ktoré bolo náhle prerušené kvôli $MGE_ADJ$ inváziám. Toto obdobie zaznamenalo vrchol našich kultúrnych úspechov, ale teraz sa k nemu vrátime a dosiahneme ešte väčšie výšiny." # todo: CHANGED
 geo_legacy_of_tamar: "Dedičstvo Tamary" # todo: NEW TRANSLATION
 geo_legacy_of_tamar_desc: "Tamar bola jednou z najväčších vládcov, akých národ mal. Jej vojenské a kultúrne úspechy sú legendárne a samotná spomienka na jej meno stále vzbudzuje úctu v srdciach všetkých $GEO_ADJ$." # todo: CHANGED
 geo_david_the_builder: "Davit Staviteľ" # todo: NEW TRANSLATION
 geo_david_the_builder_desc: "Považovaný za najväčšieho vládcu v histórii našej krajiny, kráľ Dávid Staviteľ priviedol $GEO$ na jeho vrchol. Vybudoval mocné, kultúrne vplyvné kráľovstvo a maják pre $christian$ a $GEO_ADJ$ ľud." # todo: CHANGED
 geo_georgian_titles: "$GEO_ADJ$ tituly" # todo: NEW TRANSLATION
 geo_georgian_titles_desc: "'Kráľ kráľov, silný a nezraniteľný, majestátny a ochranca svätého kráľovstva Abcházov, Ibérijcov, Ranov, Kacheťanov, Arménov, Šahansšacha a Širvansšacha, Východu i Západu, Juhu i Severu, oboch krajín, dvoch trónov a korun, božský súdec a vládca trónu.' Tituly nášho vládcu sú početné a na dvore ich bude všetci rešpektovať!" # todo: CHANGED
 geo_georgian_numismatics: "$GEO_ADJ$ numizmatika" # todo: NEW TRANSLATION
 geo_georgian_numismatics_desc: "Naša krajina má bohatú tradíciu razenia mincí, vpisujúc ich nielen v $georgian_language$, ale aj v $arabic_language$ a $persian_language$, keďže slúžia ako mena pre obchod cez našu krajinu a s našimi susedmi." # todo: CHANGED
 geo_beacon_of_christianity: "Maják $christian$" # todo: CHANGED
 geo_beacon_of_christianity_desc: "$GEO je už stáročia útočiskom pre $christian$ v Kaukaze, dokonca aj keď je obklopené a izolované nasledovníkmi $muslim$. Horlivá viera nášho ľudu je inšpiráciou pre všetkých našich náboženských bratov." # todo: CHANGED
 geo_georgian_principalities: "$GEO_ADJ$ kniežatstvá" # todo: NEW TRANSLATION
 geo_georgian_principalities_desc: "Naša regionálna správa je rozdelená do mnohých kniežatstiev a území. Delegovanie moci týmto spôsobom nám umožňuje účinnejšie uplatňovať vládu." # todo: CHANGED
 geo_georgian_resilience: "$GEO_ADJ$ odolnosť" # todo: NEW TRANSLATION
 geo_georgian_resilience_desc: "Naša krajina bola v dlhých dejinách roztrieštená zvonka aj zvnútra viac než raz. Avšak podobne ako bájny vták Fénix, zakaždým povstala z popola a znova sa etablovala ako sila, s ktorou treba rátať. Odolnosť nášho ľudu je chvályhodná." # todo: CHANGED
 sme_jaqeli_dynasty: "Dynastia $jaqeli_dynasty$" # todo: CHANGED
 sme_jaqeli_dynasty_desc: "Napriek skromným začiatkom dokázala dynastia $jaqeli_dynasty$ nadviazať mnoho úspešných vzťahov a vybudovať silné väzby s vládcami okolitých štátov. Vďaka tomu máme dobrú povesť v diplomatickej sfére." # todo: CHANGED
 sme_atabegs_of_samtskhe: "Atabegovia $SME$" # todo: NEW TRANSLATION
 sme_atabegs_of_samtskhe_desc: "Nie sme len časťou kráľovstva $GEO$, pred dlhým časom sme získali kráľovské uznanie a s ním titul atabega. Tento titul bol predtým udeľovaný len arménskym vazalom, takže jeho udelenie je znamením výnimočnosti a rešpektu, ktorý nám $GEO_ADJ$ monarcha preukazuje." # todo: CHANGED
 sme_proactive_diplomacy: "Proaktívna diplomacia" # todo: NEW TRANSLATION
 sme_proactive_diplomacy_desc: "Zatiaľ čo sme ešte súčasťou $GEO$, $SME$ funguje so značnou nezávislosťou. Táto privilegovaná pozícia vyžaduje stály diplomatický prehľad a aktívnu zahraničnú politiku, zabezpečujúcu priame kanály k mocným. Robíme to zároveň s aktívnym zasahovaním do vnútorných politík, manipuláciami s následníctvom a budovaním dynastických spojenectiev tak, aby nám najviac prospeli. Prežitie nášho relatívne malého štátu závisí na udržiavaní týchto diplomatických tradícií. Nech nikto nepovie, že sme urobili málo alebo jednal bez rozumu!" # todo: CHANGED
 sme_fortresses_of_samtskhe: "Pevnosti $SME$" # todo: NEW TRANSLATION
 sme_fortresses_of_samtskhe_desc: "Naše hornaté územie mnohokrát slúžilo ako štít proti cudzím inváziám. Vďaka tomu sme sa naučili stavať silné pevnosti a byť vždy pripravení na obrannú vojnu. Toto dedičstvo sily a pripravenosti musíme uchovať za každú cenu — pevnosti $SME$ musí byť trvale dobre udržiavané, osádzané a zásobované, pretože cudzie invázie nie sú možnosťou, ale istotou." # todo: CHANGED
 sme_independent_ambitions: "Nezávislé ambície" # todo: NEW TRANSLATION
 sme_independent_ambitions_desc: "$SME často muselo skloniť hlavu pred cudzími vládcami, či už $muslim_ADJ$ alebo $christian_ADJ$; $georgian_culture$, $turkic_group$ alebo $iranian_group$. Aby sme vybudovali trvalý štát schopný prežiť nezávisle a postaviť sa chamtivým cudzím mocnostiam, musíme zriadiť nezávislé inštitúcie: raziť vlastnú menu, vytvoriť vlastné zákony a podporovať vlastných teológov a spisovateľov." # todo: CHANGED
 sme_protect_trade_routes: "Chrániť obchodné cesty" # todo: NEW TRANSLATION
 sme_protect_trade_routes_desc: "Naša poloha na križovatke $georgia_area$, $anatolia_region$, $armenia_area$ a $azerbaijan_area$ pritahuje veľké množstvo obchodníkov. Avšak stály hrozba nájazdov nomádskych kmeňov spochybňuje bezpečnosť ciest. Musíme patrične chrániť všetky cesty a hostince, aby obchodné príjmy mohli nerušene prúdiť do štátnej pokladnice." # todo: CHANGED
 sme_frontier_warriors: "Hraniční bojovníci" # todo: NEW TRANSLATION
 sme_frontier_warriors_desc: "Kaukaz formovali nomádsky panovníci od nepamäti, no úrodné pastviny $SME$ presvedčili mnohé kmene, aby sa usadili. Nesmieme dovoliť, aby to narušilo stabilitu nášho kráľovstva; namiesto toho treba dohodnúť podmienky s usadzujúcimi sa kmeňmi, aby prispeli k našim vojenským ambíciám výmenou za pôdu." # todo: CHANGED
 sme_sacred_land: "Svätá zem" # todo: NEW TRANSLATION
 sme_sacred_land_desc: "Zeme $SME$ sú domovom miest posvätných a uctievaných medzi $georgian_culture$ ľudom. Jaskynný kláštor Vardzia, starobylý kostol Atskuri s jeho zázračnou ikonou Panny Márie a kláštor Anča s ikonou Anchiskhati sú niektoré z najvýznamnejších svätých miest v našom kráľovstve. Ochraňovaním a starostlivosťou o $SME$ cirkev, oddeľujúc ju od cirkvi $GEO$, zabezpečíme, že náš ľud zostane jednotný aj v čase nepriazne." # todo: CHANGED
 sme_bridge_between_worlds: "Most medzi svetmi" # todo: NEW TRANSLATION
 sme_bridge_between_worlds_desc: "Naša krajina vždy slúžila ako most medzi $christian_ADJ$ a $muslim_ADJ$ svetmi. V dôsledku toho si ľudia oboch viery v našich hraniciach zvykli na vzájomnú interakciu." # todo: CHANGED
 arm_legacy_of_hayk: "Dedičstvo Hayka" # todo: NEW TRANSLATION
 arm_legacy_of_hayk_desc: "Hayk, potomok Noemov, založil naše kráľovstvo pri úpätí Araratu po porážke Babyloňanov a stal sa patriarchom národa. Celý náš ľud pozná tento príbeh a sme hrdí patriť k tak prastarému rodu." # todo: CHANGED
 arm_mount_ararat: "Hora Ararat" # todo: NEW TRANSLATION
 arm_mount_ararat_desc: "Hora Ararat, kde sa po Potope zastavila Noemova archa, je miestom, kde sa náš národ prvýkrát zformoval. Preto náš ľud bráni posvätosť našej zeme s obzvlášť svätou horlivosťou, keď je ohrozená." # todo: CHANGED
 arm_apostolic_church: "$ARM_ADJ$ Apoštolská cirkev" # todo: NEW TRANSLATION
 arm_apostolic_church_desc: "$ARM bola prvým národom, ktorý vyhlásil $christian$ za štátne náboženstvo. Naše náboženské tradície, najmä tie klérovske, sú významnou súčasťou našej identity." # todo: CHANGED
 arm_land_reclamation: "Vykúpené územie" # todo: CHANGED
 arm_land_reclamation_desc: "$ARM bolo stáročia zničené vojnami. Vykúpením krajiny stratenej v týchto bojoch, sprístupnením ju na obývanie a obnovou zrúcaných kostolov a pevností môžeme zlepšiť životy ľudu a získať pevnejšiu kontrolu nad územím." # todo: CHANGED
 arm_border_nation: "Pohraničný národ" # todo: NEW TRANSLATION
 arm_border_nation_desc: "Od pradávna je $ARM nechceným bojiskom medzi väčšími mocnosťami. Aj po obnovení našej suverenity je zostať neutrálom extrémne ťažké — upokojiť všetkých nie je nemožné, no ani jednoduché." # todo: CHANGED
 arm_melikdom_organization: "Organizácia melikátov" # todo: NEW TRANSLATION
 arm_melikdom_organization_desc: "Ako jedno z mála bašt nezávislého $ARM_ADJ$ štátu je $ARM riadené feudálnymi panovníkmi nazvanými #italic meliks#!, pretože starý systém $arm_nakharar_titles$ sa po $MGE_ADJ$ inváziách zrútil. Vzťah medzi melikmi a ich poddanými je skôr vzťahom veliteľa a nižšieho dôstojníka než feudálneho pána a poddaného." # todo: CHANGED
 arm_mountain_armies: "Horské armády" # todo: NEW TRANSLATION
 arm_mountain_armies_desc: "$ARM je hornatá krajina. Náš ľud sa týmto terénom prispôsobil počas storočí a vyvinul mnoho spôsobov, ako tieto hory využiť v náš prospech. Naše armády zhromažďujú sa ochotne na výzvu, iste v ochrane, ktorú našej jedinečnej krajine poskytujú." # todo: CHANGED
 arm_nakharar_titles: "Tituly Nakharar" # todo: NEW TRANSLATION
 arm_nakharar_titles_desc: "Systém #italic Nakharar#! bol v $ARM v nepretržitom používaní od jeho vzniku až po časy $MGE_ADJ$ invázií, keď sa zrútil. Hoci tituly už nie sú v používaní, určité charakteristiky systému pretrvávajú a zlepšujú schopnosti našej šľachty a armád." # todo: CHANGED
 arm_greater_armenia: "Veľké $ARM$" # todo: NEW TRANSLATION
 arm_greater_armenia_desc: "V našej dlhej a slávnej histórii sa $ARM_ADJ$ kráľovstvá rozprestierali na veľkom území rovnako ako náš $armenian_culture$ ľud. Napodobňovaním týchto dávnych ríš sa stávame majákom pre všetkých $armenian_culture$ ľudí, ktorí sa radi zjednotia pod naším vedením." # todo: CHANGED
 arm_highland_fortresses: "Vysokohorské pevnosti" # todo: NEW TRANSLATION
 arm_highland_fortresses_desc: "Naše pevnosti sú skvelým symbolom našej odolnosti a vytrvalosti, postavené tak, aby vzdorovali nielen drsnej miestnej klíme, ale aj každému cudziemu dobyvateľovi hlúpo sa odvážiacemu útoku do nášho neúprosného terénu." # todo: CHANGED
 swiss_oath_of_rutli: "Prísaha z Rütli" # todo: NEW TRANSLATION
 swiss_oath_of_rutli_desc: "Povieme si prísahu tejto novej únie: Budeme jedným národom bratov a žiadne trápenie ani nebezpečenstvo nás nerozdelí. Žiadny cudzí tyran nebude vládnuť našej ríši!" # todo: CHANGED
 swiss_halberd_infantry: "Dedičstvo Morgarten" # todo: NEW TRANSLATION
 swiss_halberd_infantry_desc: "Keď sme bránili slobodu v bitke pri Morgarten, mali sme dôležitú výhodu proti prekliatym $habsburg_dynasty$ invázorom: halapartňa, jednoduchá, no smrteľná zbraň, ktorá dokáže odraziť každého nepriateľa. Vytrénovanie našich vojsk v jej použití nám dá výhodu proti nepriateľom, aj keď majú početnú prevahu." # todo: CHANGED
 swiss_eternal_alliance: "Večná aliancia lesných kantónov" # todo: CHANGED
 swiss_eternal_alliance_desc: "Uzavreli sme večné spojenectvo s priateľmi v susedných kantónoch. Keby nebolo tejto zmluvy, určite by sme podľahli inváziám $habsburg_dynasty$ a znova upadli pod vládu cudzích tyranov. Tieto aliancie zabezpečia naše prežitie na stáročia." # todo: CHANGED
 swiss_mercenaries: "$SWI_ADJ$ žoldnieri" # todo: NEW TRANSLATION
 swiss_mercenaries_desc: "Naše vojská sú široko uznávané ako výnimoční bojovníci. Našťastie pre nás ich služby nepotrebujeme trvale, čo nám umožňuje prenajímať ich cudzím mocnostiam, získavať príjmy a zabezpečiť im cenné bojové skúsenosti." # todo: CHANGED
 the_swiss_confederation: "Princípy konfederácie" # todo: CHANGED
 the_swiss_confederation_desc: "Každý člen našej konfederácie prispieva cennými zdrojmi k spoločnej veci. Naše decentralizované riadenie tejto aliancie štátov slúži vyššiemu účelu, takže sa nemôžeme rozpadnúť do občianskej vojny pri nezhodách medzi mestami alebo kantónmi." # todo: CHANGED
 swiss_reislaufer: "The Reisläufer" # todo: NEW TRANSLATION
 swiss_reislaufer_desc: "$a_reislaufer_desc$ Mali by sme z týchto veteránov zostaviť pluky a nasadiť ich v našich armádach." # todo: NEW TRANSLATION
 swiss_recovery_and_prosperity: "Trpiace kráľovstvo" # todo: NEW TRANSLATION
 swiss_recovery_and_prosperity_desc: "Minulé konflikty ukázali, že odrážanie útočníkov nie je našou jedinou starosťou. Údolia našich kantónov sú po každej bitke zdevastované; treba vykonať opatrné kroky na obnovenie prosperity našej zeme." # todo: CHANGED
 alpine_defensiveness: "Alpská obrana" # todo: CHANGED
 alpine_defensiveness_desc: "$SWI_ADJ$ krajina je tvorená náročným terénom, horami a údoliami. Musíme nájsť spôsob, ako prekonať výzvy nášho prostredia a využiť ho ako zbraň proti potencionálnym dobyvateľom." # todo: CHANGED
 swiss_religious_refuge: "Útočisko pre utečencov" # todo: NEW TRANSLATION
 swiss_religious_refuge_desc: "Zatiaľ čo iní vyháňajú náboženské menšiny a rušivé osoby, my im radi ponúkneme domov. V $SWI$ si budú môcť vybudovať nový život a vďaka tomu budú naklonení oslavovať našu vládu." # todo: CHANGED
 swiss_tolerance: "$SWI_ADJ$ tolerancia" # todo: NEW TRANSLATION
 swiss_tolerance_desc: "Prečo by sme sa mali zabíjať kvôli nejasným otázkam transsubstanciácie a predestinácie, keď by sme mohli tú energiu použiť na zjednotenie nášho horského domova?\n\nPreto bude každý kantón $SWI$ mať najvyššiu právomoc v otázkach náboženstva vo svojom regióne. Toto síce nezastaví všetky náboženské spory, ale zaistí, že bez ohľadu na vieru si ľudia nájdu miesto, kde nebudú prenasledovaní." # todo: CHANGED
 swiss_clockwork: "Majstri súkolí" # todo: NEW TRANSLATION
 swiss_clockwork_desc: "Niektorí hlupáci si myslia, že hodiny slúžia len na meranie času, no kto raz uvidí silu otáčajúcich sa ozubených kolies, pochopí, že hodiny dokážu takmer čokoľvek. Možno sám Stvoriteľ sveta navinul bytosť ako hodiny a nechal prevodové kolá pokračovať, tikajúc veky. Tak či tak, $SWI_ADJ$ hodinári sú najväčší majstri tohto umenia — hneď po Bohu, samozrejme." # todo: CHANGED
 swiss_ambition: "$SWI_ADJ$ osvietenstvo" # todo: NEW TRANSLATION
 swiss_ambition_desc: "Nemusíme vytvárať jedinečnú identitu národa, keďže náš ľud sa rád zjednocuje pod zástavami kantónov a ideálmi našej konfederácie. Ale podporou najosvietenejších učencov našej doby dokážeme formovať novú éru pre $SWI_ADJ$ ľud a upevniť jedinečné rysy našej #italic Eidgenossenschaft#!. Tento helvétizmus tvorí základ nášho osvietenia." # todo: CHANGED
 swiss_banking: "$SWI_ADJ$ bankovníctvo" # todo: NEW TRANSLATION
 swiss_banking_desc: "Sme útočiskom nielen pre prenasledovaných ľudí z iných krajín, ale aj pre ich bohatstvo. Vo veľkých trezoroch, skrytých za silnými múrmi a chránených našimi najdôveryhodnejšími vojakmi, budeme najlepším miestom pre uloženie cenností občanov chudobných, vojnových krajín." # todo: CHANGED
 zmw_experienced_cattle_herder: "Skúsení pastieri" # todo: NEW TRANSLATION
 zmw_experienced_cattle_herder_desc: "Chov dobytka vyžaduje zručnosť a je kľúčový pre naše prežitie. Ak chceme stabilizovať a rozšíriť našu vládu, mali by sme rozšíriť pastviny a pasienky." # todo: CHANGED
 zmw_stone_builders: "Stavitelia $ZMW$" # todo: CHANGED
 zmw_stone_builders_desc: "Ohromujúce kamenné stavby $ZMW$ impozantne pôsobia na mnohých návštevníkov našej veľkej krajiny. Pokračovanie našich architektonických tradícií nám umožní rozširovať naše veľké kamenné mestá, ktoré budú stáť po stáročia." # todo: CHANGED
 zmw_encourage_new_settlements: "Nové územia pre zdroje" # todo: NEW TRANSLATION
 zmw_encourage_new_settlements_desc: "Za našimi hranicami ležia rozľahlé územia, posiate zdrojmi a pastvinami čakajúcimi na obsadenie naším ľudom. Musíme podporiť osídľovanie týchto území a zakladať nové mestá." # todo: CHANGED
 zmw_rekindling_the_royal_fires: "Znovuzapálenie kráľovských ohňov" # todo: CHANGED
 zmw_rekindling_the_royal_fires_desc: "Naši podriadení náčelníci musia preukázať svoju vernosť nám a bohom tým, že raz ročne pricestujú do hlavného mesta a z našich ohňov zapaľujú svoje miestne. Po roku naše vojsko ich oheň uhasí a oni musia vykonať novú cestu." # todo: CHANGED
 zmw_strict_gold_regulations: "Obmedzenia obchodu s $goods_gold$" # todo: CHANGED
 zmw_strict_gold_regulations_desc: "Zem nám dáva množstvo tovaru, o ktorý majú cudzinci veľký záujem, no naše bohaté zásoby $goods_gold$ žiaria jasnejšie než čokoľvek iné. Hoci sú takéto bohatstvá požehnaním, štát musí prísne regulovať obchod a vlastníctvo $goods_gold$, aby zabránil ničivým následkom ľudskej chamtivosti a machináciám poškodzujúcim naše príjmy." # todo: CHANGED
 zmw_spokesman_before_the_dead: "Rečník pred mŕtvymi" # todo: CHANGED
 zmw_spokesman_before_the_dead_desc: "Náš vládca nie je len svetským vodcom, ale očakáva sa, že bude hovoriť aj v mene duchov mŕtvych. Pred každou kampaňou alebo žatvou bude komunikovať úctu a potreby našich predkov prostredníctvom obradov alebo tancov. Bez usilovného vládcu, ktorý starostlivo udržiava kráľovské hroby a drží blízky kontakt s našimi mŕtvymi, môže všetko rýchlo sklznuť do chaosu." # todo: CHANGED
 zmw_elected_administrators: "Regionálni správcovia" # todo: NEW TRANSLATION
 zmw_elected_administrators_desc: "Tradične boli všetci naši správcovia, aj na lokálnej úrovni, priamymi príbuznými vládcu. Ako naše impérium rastie a dozrieva, je však čas prejaviť úctu miestnemu poznaniu našich poddaných a dovoliť im vyberať vlastných správcov." # todo: CHANGED
 zmw_discipline_and_traning: "Pravidelný výcvik" # todo: NEW TRANSLATION
 zmw_discipline_and_traning_desc: "Disciplína, príprava a výcvik sú faktory, ktoré vyhrávajú bitky. S týmto vedomím naši velitelia úspešne zaviedli detailné nové taktiky a organizačné vylepšenia. Využime tieto inovácie rozdelením bojovníkov do plukov a pravidelným tréningom s lukmi, oštepmi, dýkami a sekerami. Cvičenie im tiež umožní bojovať v formáciách bez strachu a poraziť oveľa početnejších nepriateľov." # todo: CHANGED
 zmw_merchant_taxes: "Obchodné poplatky" # todo: NEW TRANSLATION
 zmw_merchant_taxes_desc: "S príchodom nových obchodníkov do oblasti Zambezi vznikla potreba upevniť našu autoritu. Každý, kto chce obchodovať tu a prevážať naše cenné $goods_gold$ a $ivory$ na iné brehy, musí byť najprv schválený naším vládcov a zaplatiť daň za povolenie. Ak platby zlyhajú, všetok cudzí tovar bude zabavený štátom." # todo: CHANGED
 zmw_controlling_the_mutapan_riches: "Kontrola bohatstva" # todo: NEW TRANSLATION
 zmw_controlling_the_mutapan_riches_desc: "Západní cestovatelia nazvali našu zem 'Ophir' a bohatstvo našich zlatých baní a obchod cez Zambezi nám počas storočí závideli mnohí návštevníci. Využime kontrolu nad týmito zdrojmi a vybudujme trvalé obchodné stanice, ktoré sa môžu rozrásť do rušných miest." # todo: CHANGED
 zmw_empowering_the_rozwi: "Posilnenie Rozwi" # todo: NEW TRANSLATION
 zmw_empowering_the_rozwi_desc: "Naše územia sú domovom mnohých zručných bojovníkov. Medzi nimi sú Rozwi, disciplinovaní bojovníci pripravení brániť náš ľud proti každému, kto by sa odvážil vziať si naše právo na pôdu." # todo: CHANGED
 zmw_cow_horn_tactics: "Formácie kravského rohu" # todo: NEW TRANSLATION
 zmw_cow_horn_tactics_desc: "Prispôsobenie sa neustále meniacim taktikám vojny nie je jednoduché. Proti potenciálne silnejším nepriateľom by sme sa mali spoliehať predovšetkým na vlastnú obratnosť. Ak dokážeme pritlačiť protivníkov do blízkeho boja a poslať pluk na obkľúčenie ich síl, spôsobíme im zničujúce straty." # todo: CHANGED
 khm_religious_flexibility: "Jedna viera pre $KHM$" # todo: NEW TRANSLATION
 khm_religious_flexibility_desc: "Náš kraj prežil nepokojnú dobu, keď kráľovská patronácia kolísala medzi $hindu$ a rôznymi vetvami $buddhist$. Musíme podporiť zvolenú vieru v celej krajine, aby sme vybudovali stabilitu, a dôverovať, že náš vládca si vybral pravú cestu pre náš ľud." # todo: CHANGED
 khm_royal_procession: "$KHM_ADJ$ kráľovské procesie" # todo: NEW TRANSLATION
 khm_royal_procession_desc: "Naši vládcovia vynikajú v tvorbe okázalých procesií, udalostí oslňujúcej pompéznosti, ktoré málokto dokáže prekonávať. Tieto výstredné ukážky národného bohatstva potvrdzujú moc a jasnosť panovníka a úžasné bohatstvo nášho štátu. Žiarivý sprievod slonov, pokladov a kráľovskej gardy vzbudí úctu a rešpekt v srdciach nášho ľudu a získa ich vernosť." # todo: CHANGED
 khm_ballista_elephants: "Balistické slony" # todo: NEW TRANSLATION
 khm_ballista_elephants_desc: "Slony sú impozantné tvory a prevyšujú nad akýmkoľvek iným zvieraťom, ktoré poznáme. Je čas využiť tieto ich kvality na vzbudenie strachu v nepriateľoch použitím týchto majestátnych zvierat vo vojne. Slony tiež unesú veľkú váhu, čo nám umožní na ne namontovať vojnové stroje. Postavením dvojstrunových kuší a vybavením nimi našich slonov vytvoríme nástroj, ktorý nám umožní ešte lepšie dominovať na bojiskách." # todo: NEW TRANSLATION
 khm_great_builders: "Hydraulické mestá" # todo: NEW TRANSLATION
 khm_great_builders_desc: "Naše veľké mestá majú mnoho #italic barays#! a kanálov pripravených na ukladanie a distribúciu vody po území. Budovanie a udržiavanie tejto siete vodných ciest s majstrovstvom zabezpečí, že populácia bude prosperovať aj počas nestálych monzúnových období." # todo: CHANGED
 khm_recruitment_of_peasants: "Nábor roľníkov" # todo: NEW TRANSLATION
 khm_recruitment_of_peasants_desc: "Budeme potrebovať posilniť našu armádu novými rekrutmi, ktorých ľahko nájdeme medzi roľníckou triedou. S troškou výcviku zabezpečíme, že rady budú kedykoľvek doplnené schopnými vojakmi." # todo: CHANGED
 khm_foreign_production_skills: "Pozvať zahraničných odborníkov" # todo: NEW TRANSLATION
 khm_foreign_production_skills_desc: "Náš ľud nie je zvyknutý na výrobu hodvábu a preferuje iné textílie, ale máme šťastie, že cudzinci sa usadili v našich mestách a založili dielne. Mali by sme prijať podobný prístup v iných odvetviach tým, že priamo pozveme cudzích remeselníkov priniesť svoje zručnosti sem a rozšíriť tak našu výrobu." # todo: CHANGED
 khm_utilize_the_rivers: "Životodarné rieky $KHM$" # todo: NEW TRANSLATION
 khm_utilize_the_rivers_desc: "Naše rieky poskytujú vynikajúci spôsob, ako prepravovať suroviny a tovary z vnútrozemských území do prístavov, ktoré sú napojené na zahraničné obchodné trasy. Využitie tejto siete spojí naše mestá a urýchli komunikáciu medzi nimi." # todo: CHANGED
 khm_champa_mercenaries: "Vodcovia žoldnierov $CHA$" # todo: NEW TRANSLATION
 khm_champa_mercenaries_desc: "V minulosti sme bojovali spolu s divokými bojovníkmi $CHA$. Ak si zabezpečíme služby ich najschopnejších veliteľov v čase konfliktu, naše sily budú dobre vycvičené a oddýchnuté, pripravené skočiť do boja ako čerstvé posily." # todo: CHANGED
 khm_restore_angkor: "Obnova $angkor$" # todo: NEW TRANSLATION
 khm_restore_angkor_desc: "Veľké mesto $angkor$ bolo kedysi brilantným príkladom našej architektonickej geniality. Kvôli vonkajším tlakom sme museli výstavbu prerušiť, ale mali by sme sa vrátiť k koreňom našej spoločnosti a znova stavieť monumenty našej slávy." # todo: CHANGED
 khm_modern_navy: "Moderné námorníctvo pre $KHM$" # todo: NEW TRANSLATION
 khm_modern_navy_desc: "Nesmú sme dovoliť, aby iní dominovali moriam a kontrolovali obchod, od ktorého závisí náš štát. Vytvorme moderné námorné sily schopné čeliť pirátom či protivníkovi kdekoľvek v $south_east_asia$." # todo: CHANGED
 khm_invest_in_irrigation: "Rozšíriť baraje" # todo: NEW TRANSLATION
 khm_invest_in_irrigation_desc: "Hoci naše existujúce vodné nádrže pokrývajú súčasné poľnohospodárske nároky, mohli by sme podporiť viac obyvateľov, keby sme vykopali ďalšie #italic barays#! v iných častiach krajiny a položili základy pre nové mestské centrá." # todo: CHANGED
 khm_protection_from_raids: "Zabezpečiť hranice" # todo: NEW TRANSLATION
 khm_protection_from_raids_desc: "Naše územia sú často ohrozované nájazdmi a náš cenný $angkor$ je obzvlášť zraniteľný voči blokádam. Musíme investovať do komplexného systému opevnení s dostatočnými posádkami, aby vydržali akúkoľvek inváziu a ochránili náš ľud a národné poklady." # todo: CHANGED
 khm_old_grudges: "Vedení rivalitou" # todo: NEW TRANSLATION
 khm_old_grudges_desc: "Náš ľud bol v minulosti ponížen núteným sklonom pred cudzími dobyvateľmi. Hoci sa nedá vyhnúť každej porážke, staré rivality podnecujú náš ľud bojovať dlhšie a tvrdšie, horieť túžbou vymazať hanbu z minulosti." # todo: CHANGED
 peasant_connections_advance: "Spojenia so sedliakmi" # todo: NEW TRANSLATION
 peasant_connections_advance_desc: "Naši obchodníci nadviazali spojenia s vidieckymi osadami vnútri aj mimo hraníc. Vďaka tomu dokážu zabezpečiť lepšie ceny potravín, než by sa inak očakávalo." # todo: CHANGED
 settle_the_frontier_advance: "Volanie po hranici" # todo: NEW TRANSLATION
 settle_the_frontier_advance_desc: "Sme obklopení slabo bránenými územiami pripravenými na obsadenie! Pošlime niekoľko odvážnych dvoranov, aby v týchto neobsadených krajinách presadzovali našu autoritu." # todo: CHANGED
 tre_pontic_trail_mastery: "$pontic_greek_culture$ Majstrovstvo steziek" # todo: NEW TRANSLATION
 tre_pontic_trail_mastery_desc: "Naša zem je ako náš dom; jej lesy sú našou záhradou. Poznáme každý kúsok lepšie než ktokoľvek iný. Každý chodník a stezka sú nám známe a využijeme toto poznanie, ak by si niekto trúfol nás napadnúť." # todo: CHANGED
 tre_komnenos_legacy: "Dedičstvo $komnenos_dynasty$" # todo: NEW TRANSLATION
 tre_komnenos_legacy_desc: "Nech nik nezabudne, že sme potomkami $komnenos_dynasty$, ktorí vládli nad $BYZ_ADJ$ ríšou. Aj keď teraz vládneme inému štátu, odkaz a prestíž našej dynastie zostávajú nepopierateľné." # todo: CHANGED
 tre_princes_of_the_lazes: "Kniežatá $laz_culture$" # todo: NEW TRANSLATION
 tre_princes_of_the_lazes_desc: "Národ $laz_culture$ obýva tieto země po stáročia. Hoci našu ríšu vytvorili ľudia $greek_culture$, mnohí $laz_culture$ zostali v našich hraniciach. To viedlo niektorých našich nepriateľov, aby nás posmešne nazývali $tre_princes_of_the_lazes$ a považovali nás za menejcenných. Čokoľvek hovoria, to nám neuberá na dedičstve a hrdo nosíme tento titul." # todo: CHANGED
 tre_strategic_marriages: "Strategické manželstvá" # todo: NEW TRANSLATION
 tre_strategic_marriages_desc: "Kráľovstvá sa dobyvajú nielen mečom. Uzatváraním manželských zväzkov s okolitými štátmi si vytvárame príležitosti dediť ich tróny — alebo aspoň rozšíriť nad nimi silný vplyv." # todo: CHANGED
 tre_grand_komnenoi: "Veľkí Komnenoi" # todo: NEW TRANSLATION
 tre_grand_komnenoi_desc: "Dynastia $komnenos_dynasty$ mohla byť z trónu $BYZ_ADJ$ už dávno vyhnaná, no jej sláva nezhasla. Členom nášho rodu sa stále preukazuje náležitý rešpekt a toto uznanie siaha ďaleko za naše hranice." # todo: CHANGED
 tre_pontic_mountains: "Hory $pontic_greek_culture$" # todo: NEW TRANSLATION
 tre_pontic_mountains_desc: "Rovnako ako Alpy oddeľujú $french_group$ a $italian_group$, $pontic_greek_culture$ Hory oddeľujú našu poslednú $greek_culture$ enklávu v $anatolia_region$ od $turkic_group$ dobyvateľov, ktorí obsadili Anatólske roviny. Pontus bol vždy viac $greek_culture$ než zvyšok $anatolia_region$; možno odkaz veľkého Mithridata inšpiruje našich bojovníkov a vzbudí v Turkoch strach, aký mal voči Rimanom?" # todo: CHANGED
 tre_byzantine_birthright: "$BYZ_ADJ$ Dedičné právo" # todo: NEW TRANSLATION
 tre_byzantine_birthright_desc: "Veľká $BYZ_ADJ$ ríša pod vládou našich predkov bola skutočne niečo obdivuhodné. Zrada a klamstvo mohli zvrhnúť ich režim, ale $BYZ$ povstal ako bájny vták z popola, aby znovu získal svoju minulosť a teraz nikto nepochybuje o našej autorite!" # todo: CHANGED
 tre_trapezuntine_monasteries: "Kláštory $TRE_ADJ$" # todo: NEW TRANSLATION
 tre_trapezuntine_monasteries_desc: "Naša viera zachraňuje duše nášho ľudu a náš klérus zaručuje ich spásu. Čo sú teda naše kláštory, ak nie prameňom a zdrojom takejto spásy?" # todo: CHANGED
 tre_greek_stronghold: "Oporný bod $greek_language$" # todo: NEW TRANSLATION
 tre_greek_stronghold_desc: "Už od staroveku bol $greek_language$ jazykom vzdelania a vedy. Keď sem prišli naši predkovia, priniesli so sebou nielen odhodlanie, ale aj svoju kultúru a rodný jazyk. Tradičné $greek_language$ vzdelanie je v našej krajine stále živé." # todo: CHANGED
 tre_komnenoi_princesses: "Komnenoi princezné" # todo: NEW TRANSLATION
 tre_komnenoi_princesses_desc: "Z rodu $komnenos_dynasty$ vzišlo niekoľko pozoruhodných žien a mnoho vládcov z $europe$ aj neveriaci žiadali o ich ruky. Naša línia je dobre ctená a naše princezné dvojnásobne, lebo umožňujú cudzincom nárokovať si legitimitu cez náš rod a nám udržiavať vplyv na cudzích dvoroch." # todo: CHANGED
 tre_terminus_of_the_silk_road: "Terminus Hodvábnej cesty" # todo: NEW TRANSLATION
 tre_terminus_of_the_silk_road_desc: "Aj keď sa hlbokou dávkou staroveku nazývalo naše mesto Trapezous, naše územie bolo vždy miestom, kde pozemná trasa cez $asia$ stretá námornú cestu vedúcu k Stredozemiu. Stali sme sa slávnym ako koncový bod Hodvábnej cesty, bohatstvo $china$ a $india$ prechádzalo našimi zemami na ceste do $europe$. Keďže naše kráľovstvo stále leží na tomto kľúčovom mieste, niet dôvodu nepokračovať a podporovať tento stály tok medzikontinentálneho obchodu." # todo: CHANGED
 tre_lessons_of_the_fourth_crusade: "Lekcie štvrtej križiackej výpravy" # todo: NEW TRANSLATION
 tre_lessons_of_the_fourth_crusade_desc: "Isaakios Angelos, ktorý pred storočiami zvrhol našu líniu, bol sám zosadený a oslepený. Pod zámienkou obnoviť starého slepého blázna na tróne vojská $VEN_ADJ$ potom vydrancovali $constantinople$. Ak z tejto udalosti plynie radcu, je to, že zrada a klamstvo sú všadeprítomné v boji o moc, no zároveň môžu zabezpečiť víťazstvo." # todo: CHANGED
 tre_trapezuntine_endurance: "$TRE_ADJ$ Vytrvalosť" # todo: NEW TRANSLATION
 tre_trapezuntine_endurance_desc: "Vyhnaní z vlasti, a predsa nás náš rod prežil. Nútení žiť v horskej pustatine obklopení nepriateľmi, a predsa náš ľud prosperoval. Sme nápadití a rozhodnutí vyťažiť maximum z toho, čo máme, a vždy sa prispôsobiť okolnostiam." # todo: CHANGED
 palm_tree_masters: "Majstri paliem" # todo: NEW TRANSLATION
 palm_tree_masters_desc: "Možno nemáme rozvinutý výrobný priemysel, ale jedno máme v hojnom množstve — palmy. Dosť pevné na stavbu a stavbu lodí, no zároveň pružné na tvarovanie remeselníkmi; ovládnutie použitia tohto unikátneho dreva nám pomôže rozšíriť námorné aktivity, zlepšiť výrobu a nakoniec naplniť naše vrecká." # todo: CHANGED
 kilwan_trade_network: "$ZAN_ADJ$ Obchodné siete" # todo: NEW TRANSLATION
 kilwan_trade_network_desc: "Pritahujúc obchodníkov až z $persia_region$ a $arabia_region$, naše hlavné mesto sa stalo živým obchodným centrom, sprostredkujúcim obchod od rohu $africa$ až po pobrežia $china$." # todo: CHANGED
 the_dhow: "$n_kilwan_dhow$" # todo: NEW TRANSLATION
 the_dhow_desc: "$n_kilwan_dhow_desc$" # todo: NEW TRANSLATION
 the_kilwan_zambuc: "$n_kilwan_zambuc$" # todo: NEW TRANSLATION
 the_kilwan_zambuc_desc: "$n_kilwan_zambuc_desc$" # todo: NEW TRANSLATION
 bantu_and_perso_arabian: "$bantu_language_family$ a persko-arabské" # todo: NEW TRANSLATION
 bantu_and_perso_arabian_desc: "Odkedy sme pochádzali z $arabia_region$ a $persia_region$, založili sme spoločenstvá pozdĺž $swahili_coast_region$, ktoré integrujú miestnu $bantu_language_family$ s cieľom udržať spoločenský poriadok a otvoriť cestu pre nové architektonické a kultúrne pokroky." # todo: CHANGED
 zanj_taxation: "Zanjské zdanenie" # todo: NEW TRANSLATION
 zanj_taxation_desc: "Pôvodne termín opisujúci obyvateľov vnútorného $africa$, najmä tých pôvodu $bantu_language_family$, títo ľudia tvoria podstatnú časť našej demografie. Hoci majú mnohé privilégiá a povinnosti, sú patrične danení, aby sa tieto privilégiá zachovali. Ich pokojné, relatívne autonómne postavenie v rámci právneho rámca viedlo k organickému rozvoju jazykových fenoménov a nových kultúrnych tradícií." # todo: CHANGED
 zan_food_imports: "Dovoz potravín" # todo: NEW TRANSLATION
 zan_food_imports_desc: "Úsvit novej éry námorných ciest nám priniesol nové príležitosti zabezpečiť potravu pre náš ľud. Kým kedysi sme obchodovali len s vnútrozemím $africa$ kvôli dôležitým zásobám $millet$, $livestock$ a $rice$, teraz máme prístup k prístavom, kde je jedlo lacnejšie a dostupnejšie." # todo: CHANGED
 zan_kilwan_latitude_staves: "Tyče pre určenie zemepisnej šírky" # todo: NEW TRANSLATION
 zan_kilwan_latitude_staves_desc: "Naša vynikajúca lodná technológia nám umožňuje plachtiť ďalej a dlhšie než konkurencia, čo nám dáva významnú výhodu v námorných aktivitách." # todo: CHANGED
 shirazi_legacy: "Širaziho dedičstvo" # todo: NEW TRANSLATION
 shirazi_legacy_desc: "Náš zakladateľ pochádzal z $shiraz$, syn 'Amīra z $persia_region$, čo robí naše právo vládnuť nepopierateľným." # todo: CHANGED
 zan_gold_trade_of_africa: "Obchod s $goods_gold$ v $africa$" # todo: CHANGED
 zan_gold_trade_of_africa_desc: "Naše bohaté zásoby $goods_gold$ z mnohých zdrojov po celom $east_africa$ sú pilierom našej ekonomiky. Musíme plne využiť naše zásoby a použiť naše bohatstvo na podporu a rozšírenie silnej meny. To nám pomôže rozvíjať sa ako obchodné centrum." # todo: CHANGED
 zan_diplomacy_through_trade: "Diplomacia cez obchod" # todo: NEW TRANSLATION
 zan_diplomacy_through_trade_desc: "Sme jedinečne situovaní tam, kde sa stretáva bohatstvo z $china$, $india$ a $europe$. To nám nielen prináša finančné výhody, ale dáva nám veľký vplyv v diplomatickej hre medzi ríšami a cudzími mocnosťami..." # todo: CHANGED
 cha_matrilineal_heritage: "Matrilineárne dedičstvo" # todo: NEW TRANSLATION
 cha_matrilineal_heritage_desc: "Ženy v našej spoločnosti majú viac úcty a ocenenia než v mnohých susedných krajinách. Dedičné právo každého dieťaťa prichádza zo strany matky a ženy majú širokú škálu slobôd a spoločenských povinností." # todo: CHANGED
 cha_religious_tolerance: "Náboženská tolerancia" # todo: NEW TRANSLATION
 cha_religious_tolerance_desc: "Naša spoločnosť je taviacim kotlom rôznych náboženských vplyvov. $buddhist_ADJ$ myšlienky z $china$, $hindu_ADJ$ praktiky z $india$ a šírenie $muslim$ v $south_east_asia$ vytvárajú jedinečné prostredie, kde je náboženská tolerancia kľúčová pre zachovanie spoločnosti." # todo: CHANGED
 cha_dharmic_presence: "$dharmic_ADJ$ prítomnosť" # todo: NEW TRANSLATION
 cha_dharmic_presence_desc: "Bohovia $dharmic_ADJ$ nás žehnajú svojou prítomnosťou. Nech ich sila vedie nás v tých najťažších časoch." # todo: NEW TRANSLATION
 cha_kshatriya: "Kṣatriya" # todo: NEW TRANSLATION
 cha_kshatriya_desc: "$cha_kshatriya$ je pojem prevzatý z $hindu_ADJ$ spoločností a popisuje elitnú šľachtu nášho štátu. Keďže pojem pochádza z $india$, naša šľachta zaujíma podobné úlohy v armádnych a dvorových záležitostiach ako ich náprotivky v $india$." # todo: CHANGED
 cha_veteran_shipbuilders: "Skúsení stavitelia lodí" # todo: NEW TRANSLATION
 cha_veteran_shipbuilders_desc: "Náš štát sa spolieha na námornú dominanciu, aby zabezpečil politickú, vojenskú a ekonomickú prítomnosť v $indochina_region$. Preto je schopnosť rýchlo stavať lode pre naše prežitie veľkého významu." # todo: CHANGED
 cha_haluwbilau: "Haluwbilau" # todo: NEW TRANSLATION
 cha_haluwbilau_desc: "$cha_haluwbilau$ sú elitní bojovníci, ktorí zastávajú kľúčové pozície v našich pozemných i námorných silách. Vyberaní pre svoje talenty a odvahu vedú armády a lode do boja a zároveň zmierňujú spory v miestnych komunitách." # todo: CHANGED
 cha_commercial_state: "Obchodný štát" # todo: NEW TRANSLATION
 cha_commercial_state_desc: "Veľa nášho bohatstva pochádza z obchodu. Mali by sme sa sústrediť na rozšírenie a zdokonalenie našich výmenných praktík s konečným cieľom vytvoriť obchodný štát." # todo: CHANGED
 cha_boarding_tactics: "Taktiky nástupu na palubu" # todo: NEW TRANSLATION
 cha_boarding_tactics_desc: "Vzhľadom na náš náročný domáci terén sa dobyvatelia pri pokuse o inváziu musia spoliehať na námorné schopnosti. Desaťročia pirátstva v okolí nás naučili cenné taktiky nástupu na palubu, ktoré nám umožňujú použiť protivníkovu loď proti nemu samotnému." # todo: CHANGED
 cha_towers_on_water: "Veže na vode" # todo: NEW TRANSLATION
 cha_towers_on_water_desc: "Ako námorná moc veľa nášho bohatstva a sily pochádza z mora a našej dominancie nad ním. Na zabezpečenie tejto prevahy vyvinuli naši stavitelia špeciálne veľké bojové lode známe ako #italic Towers on the Water#!, hybrid medzi ťažkou loďou a galérou." # todo: CHANGED
 cha_cham_cultural_influence: "$cham_culture$ Kultúrny vplyv" # todo: NEW TRANSLATION
 cha_cham_cultural_influence_desc: "Hoci niektorí susedia považujú našu kultúru za menejcennú, klamú sa — mnohé naše kultúrne prvky prenikajú do ich domnelých 'civilizovaných' dvorov. $cham_culture$ bubnovanie, piesne, tance, poézia... tieto umenia zanechali jasnú a trvalú stopu v tom, čo iné národy považujú za umelecké úspechy!" # todo: CHANGED
 dai_vietnamese_architecture: "$vietnamese_culture$ Architektúra" # todo: NEW TRANSLATION
 dai_vietnamese_architecture_desc: "Hoci sme ovplyvnení $chinese_group$, naša architektúra zostáva odlišná a jedinečná pre náš štát. Pri zachovaní koncepcií Fēng Shuǐ bolo mnoho typických $chinese_group$ prvkov vynechaných alebo adaptovaných pre naše špecifické prostredie." # todo: NEW TRANSLATION
 dai_tran_hung_dao: "Trần Hưng Đạo" # todo: NEW TRANSLATION
 dai_hung_dao_trans_military_feats: "$dai_tran_hung_dao$ Taktiky" # todo: NEW TRANSLATION
 dai_hung_dao_trans_military_feats_desc: "$dai_tran_hung_dao$ bol kedysi cisársky princ $DAI$. Slúžil ako dôstojník počas prvej $MGE_ADJ$ invázie do $DAI$ v roku 1258 a ako hlavný veliteľ počas druhého vojnového ťaženia proti $MGE_ADJ$ v roku 1285 a ich tretieho pokusu v roku 1287. Počas týchto krvavých konfliktov vyvinul taktiky, ktoré spoľahlivo odrážali nájazdy jazdeckých húf." # todo: CHANGED
 dai_nha_nhac: "Nhã Nhạc" # todo: CHANGED
 dai_nha_nhac_desc: "$dai_nha_nhac$ je tradičná hudba hraná na našich dvoroch a vystupujúca pri ročných obradoch. Je viditeľným aspektom našej kultúry a pilierom našich tradícií." # todo: CHANGED
 dai_confucian_administration: "Konfuciánska administratíva" # todo: NEW TRANSLATION
 dai_confucian_administration_desc: "Naša byrokracia je mimoriadne dôležitá, a preto volíme do štátnej správy iba najspôsobilejších administrátorov. Znalí konfuciánskych textov z $CHI$, títo úradníci zabezpečujú hladké a stabilné fungovanie byrokracie." # todo: CHANGED
 dai_giao_chi_arquebus: "Giao Chỉ Arquebus" # todo: NEW TRANSLATION
 dai_giao_chi_arquebus_desc: "$dai_giao_chi_arquebus$ je hlavným prvkom našej armády. Vyrábaný a prispôsobený špecifickým potrebám našich vojakov, tento typ arkebuzy získal uznanie nielen medzi $chinese_group$ ľuďmi, ale aj západnými pozorovateľmi." # todo: CHANGED
 dai_ca_tru: "Ca Trù" # todo: CHANGED
 dai_ca_tru_desc: "$dai_ca_tru$ je $vietnamese_culture$ žánrom hudobného rozprávania, ktorý slúži ako zábava aj náboženský účel." # todo: CHANGED
 dai_trade_advance: "Obchodné zmluvy" # todo: NEW TRANSLATION
 dai_trade_advance_desc: "Naša existencia bola príliš dlho formovaná $CHI$. Ak chceme zanechať vlastnú stopu vo svete, musíme rozšíriť náš dosah mimo sféru vplyvu $chinese_group$." # todo: CHANGED
 dai_literary_reform: "Literárna reforma" # todo: NEW TRANSLATION
 dai_literary_reform_desc: "Storočia sme písali dokumenty v $classical_chinese_language$. Napriek tomu sa pre náš jazyk používa Chữ Nôm, domáce písmo založené na Chữ Hán. Chữ Nôm bolo nestandardizované a na administratívne účely sa používalo nedostatočne v porovnaní s $classical_chinese_language$, preto je tu tlak na reformu písma, aby bolo vhodnejšie pre administráciu." # todo: CHANGED
 dai_don_dien: "Đôn Điên" # todo: NEW TRANSLATION
 dai_don_dien_desc: "$dai_don_dien$ je systém využívajúci vojenské kolónie, kde vojaci a bezpozemkí roľníci vyklčujú územie na založenie nových dedín. Tieto dediny sú po troch rokoch začlenené do administratívneho systému a ľudia, ktorí zem vyčistili, si ju môžu následne nárokovať a obhospodarovať." # todo: CHANGED
 dai_thuan_thien: "Thuận Thiên" # todo: NEW TRANSLATION
 dai_thuan_thien_desc: "$dai_thuan_thien$, alebo Vôľa Neba, je meno legendárneho meča, ktorý nosil náš osloboditeľ Lê Lợi. Podľa príbehov mu meč dal silu tisícov mužov, dosť na to, aby konečne zvrhol jarmo $CHI_ADJ$ nadvlády. Mnohí v našej krajine vnímajú Lê Lỗiho ako dokonalú podobu ideálneho vodcu." # todo: CHANGED
 foreign_architectural_influence: "Zahraničný architektonický vplyv" # todo: NEW TRANSLATION
 foreign_architectural_influence_desc: "Počas mnohých dobyvačných ciest po $indonesia_region$ sme stretli množstvo nových a úžasných foriem umenia, ktoré môžeme adoptovať a povzniesť, čím sa naša kultúra stane príkladom regionálnych umeleckých úspechov. Zavedením nových techník a sponzorovaním umelcov sa naša kultúra stane symbolom umeleckých výtvorov regiónu." # todo: CHANGED
 maj_home_of_the_sea_nomads: "Domov morských nomádov" # todo: NEW TRANSLATION
 maj_home_of_the_sea_nomads_desc: "$n_kabang_desc$" # todo: NEW TRANSLATION
 maj_jong_advance: "$n_jong$" # todo: NEW TRANSLATION
 maj_jong_advance_desc: "$n_jong_desc$" # todo: NEW TRANSLATION
 maj_bajang_ratu: "Brána $bajang_ratu$" # todo: NEW TRANSLATION
 maj_bajang_ratu_desc: "$bajang_ratu_desc$" # todo: NEW TRANSLATION
 maj_late_karambit_warriors: "$a_late_karambit_warrior$" # todo: NEW TRANSLATION
 maj_late_karambit_warriors_desc: "$a_late_karambit_warrior_desc$" # todo: NEW TRANSLATION
 maj_sumpah_palapa: "Sumpah Palapa" # todo: NEW TRANSLATION
 maj_sumpah_palapa_desc: "Náš vojenský veliteľ priamo podlieha panovníkovi a má dosť vplyvu na formovanie budúcnosti ríše. Aby si uvedomil vážnosť svojej úlohy, musí zložiť slávnostnú prísahu, ktorá podčiarkuje naše sny o dobytí a posilňuje nášho ducha." # todo: CHANGED
 maj_bubu_and_jala: "Bubu & Jala" # todo: NEW TRANSLATION
 maj_bubu_and_jala_desc: "$bubu_building_desc$" # todo: NEW TRANSLATION
 maj_the_magic_arrow: "Magická Šípka" # todo: NEW TRANSLATION
 maj_the_magic_arrow_desc: "$a_cetbang_cannon_desc$" # todo: NEW TRANSLATION
 maj_maritime_silk_road: "Morská Hodvábna cesta" # todo: NEW TRANSLATION
 maj_maritime_silk_road_desc: "Naša geografická poloha a rastúci vplyv nám umožňujú dozerať na rozsiahlu a lukratívnu obchodnú sieť, ktorá prenáša $silk$ a $spices$ z Východu na Západ." # todo: CHANGED
 maj_restore_candi_shrines: "Obnova svätyní Candi" # todo: NEW TRANSLATION
 maj_restore_candi_shrines_desc: "Po celom Nusantare stoja chrámy známe ako #italic candi#!. Mali by sme tieto chrámy obnoviť všade, kde ich nájdeme, aby sme obnovili vieru nášho ľudu." # todo: CHANGED
 maj_the_ghali: "$n_madurese_gali$" # todo: NEW TRANSLATION
 maj_the_ghali_desc: "$n_madurese_gali_desc$" # todo: NEW TRANSLATION
 maj_island_colonies: "Ostrovné kolónie" # todo: NEW TRANSLATION
 maj_island_colonies_desc: "Kontakt so susedmi v súostroví nám jasne ukázal, že suroviny a neobsadené územia sú zrelé na získanie a môžu pod našou správou prosperovať." # todo: CHANGED
 maj_preservation_of_javanese_history: "Zachovanie histórie $javanese_culture$" # todo: NEW TRANSLATION
 maj_preservation_of_javanese_history_desc: "História $javanese_culture$ ľudu je integrálnou súčasťou našej kultúrnej identity. Aby sme túto identitu ochránili, musíme zachovať tradície, na ktorých vybudovali naše veľké kráľovstvo." # todo: CHANGED
 heian_kyo: "Heian-Kyō" # todo: CHANGED
 heian_kyo_desc: "Mesto Heian-Kyō je sídlom cisára už stáročia a centrom umenia a kultúry. Tam sa rozvíjal rozmarný dvor dynastie $fujiwara_dynasty$ a všetci v $JAP$ sa naň dívali s obdivom. Akceptujme jeho tradičnú úlohu a našou patronáciou opäť rozkvitnime kultúru hlavného mesta." # todo: CHANGED
 matsuri: "Matsuri" # todo: NEW TRANSLATION
 matsuri_desc: "Každé lokálne svätyňa a chrám má vlastné festivaly a oslavy. Ľudia sa vždy tešia zapojiť, pretože je to príležitosť prejaviť oddanosť a vďaku miestnemu ochrancovi #italic Kami#!." # todo: CHANGED
 onmyodo: "Onmyōdō" # todo: NEW TRANSLATION
 onmyodo_desc: "Teórie Jinu a Jangu, ktoré prišli z $china$ pred storočiami, sa v $JAP$ vyvinuli do $onmyodo$. Odborní praktici, nazývaní #italic onmyōji#!, sa zaoberajú očistou a vyháňaním zlých a pomstychtivých duchov, ako aj veštením, astronómiou a štúdiom prírody." # todo: CHANGED
 sumo: "Sumō" # todo: NEW TRANSLATION
 sumo_desc: "Pochádzajúc z starovekého poľnohospodárskeho rituálu, v ktorom tance slúžili ako modlitba za dobrú úrodu, prax $sumo$ sa vymkla z dvora a je teraz obľúbená medzi ľudom. Slúži tiež ako forma bojového tréningu." # todo: CHANGED
 nanto_rokushuu: "Nanto Rokushū" # todo: NEW TRANSLATION
 nanto_rokushuu_desc: "Chrámy $nara$ boli vplyvné od príchodu $buddhist$ z $china$. Šesť škôl, ktoré sa okolo nich vytvorili, sú renomovaným útočiskom poznania, obzvlášť učenia Buddhu a rôznych ciest k osvieteniu. Učia však aj bežnejšie, no rovnako cenné predmety, ako správna správa kláštora." # todo: CHANGED
 shinbutsu_shuugou: "Shinbutsu-Shūgō" # todo: NEW TRANSLATION
 shinbutsu_shuugou_desc: "Odkedy sa $buddhist$ dostal do $japan_region$, jeho učenia koexistujú s uctievaním miestnych #italic Kami#!. To viedlo k ich vzájomnému zblíženiu do jedenho kombinovaného súboru presvedčení, hoci s odlišnými rituálnymi praktikami." # todo: CHANGED
 honji_suijaku: "Honji Suijaku" # todo: NEW TRANSLATION
 honji_suijaku_desc: "Jednou z kľúčových praktík v $shinbutsu_shuugou$ je identifikovať miestne #italic Kami#! ako prejavy rôznych Buddhov a Buddhov ako prejavy rôznych #italic Kami#!. Nakoniec sú jedno a to isté, pričom základné formy alebo #italic Honji#! nadobúdajú rôzne aspekty, alebo #italic suijaku#!." # todo: CHANGED
 hachiman_worship: "Kult Hachimana" # todo: NEW TRANSLATION
 hachiman_worship_desc: "Hachiman je jedným z najuctievanejších božstiev. Pôvodne zosobnenie Ōjin Tennō, po zavedení $buddhist$ bol neskôr identifikovaný aj ako bodhisattva. Je ochrancom cisárskej línie a patrónom bojovníckej triedy." # todo: NEW TRANSLATION
 gozan_jissetsu: "Gozan Jissetsu" # todo: NEW TRANSLATION
 gozan_jissetsu_desc: "Systém 'Päť hôr' vznikol v $china$ v štáte podporovanom Chán $buddhist_ADJ$ kláštormi, na svätých horách, ktoré dali systému meno. V $japan_region$ sa tradícia pokračovala v období $kamakura$ sponzorovaním zenových chrámov — Päť hôr $kyoto$ a Päť hôr $kamakura$. Udržiavaním našej podpory takýchto inštitúcií ich môžeme využiť na stabilizáciu našej vlády." # todo: CHANGED
 bodaiji: "Bodaiji" # todo: NEW TRANSLATION
 bodaiji_desc: "Od staroveku uctieva náš ľud predkov. Najvplyvnejší z našich vládcov stavajú celé chrámy, kde budú pochovaní a po smrti uctievaní, a kde ich skutky a slová budú večne spomínané." # todo: CHANGED
 kagura: "Kagura" # todo: NEW TRANSLATION
 kagura_desc: "Pôvodne posvätné rituálne tance predvádzané na dvore #italic miko#!, svätyňovými služobnicami, $kagura$ inšpirovalo aj populárne rituálne tance po celom $japan_region$. Tieto tance sa vyvinuli do mnohých podôb, pričom všetky zachovávajú tradíciu a rituál, z ktorého prišli." # todo: CHANGED
 obon: "Obon" # todo: NEW TRANSLATION
 obon_desc: "Jeden z najdôležitejších festivalov v našej kultúre, $obon$ je časom uctenia mŕtvych, obzvlášť našich predkov. Počas osláv sa prinášajú obety jedla a vykonávajú rituálne tance. Ľudia tiež zapália ohne a lampáše, aby naviedli duše mŕtvych domov na oslavy a potom späť do sveta mŕtvych." # todo: CHANGED
 neo_confucianism: "Neo-$SECT_CONFUCIANISM_NAME$" # todo: NEW TRANSLATION
 neo_confucianism_desc: "$SECT_CONFUCIANISM_NAME$ má tisícročiovú históriu a Neo-$SECT_CONFUCIANISM_NAME$ existuje v $japan_region$ už stáročia. Avšak aktívna štátna podpora tejto viery posilní našu autoritu." # todo: CHANGED
 danka_system: "Systém Danka" # todo: NEW TRANSLATION
 danka_system_desc: "Po stáročia mali domácnosti v $japan_region$ blízke vzťahy s miestnymi $buddhist_ADJ$ chrámami, poskytujúc im finančnú podporu výmenou za duchovné služby. Formálne presadenie tohto systému udrží náš ľud oddaný viere a zabezpečí dôležitú úlohu náboženstva v spoločnosti." # todo: CHANGED
 harae: "Harae" # todo: NEW TRANSLATION
 harae_desc: "V našej viere je praktika #italic $harae$#!, rituálnej očisty, kľúčová na odstránenie všetkých #italic tsumi#!, hriechov, a #italic kegare#!, duchovnej nečistoty. Nariadením, aby naša populácia vykonávala $harae$ pravidelne a správne, zabezpečíme, že naša krajina zostane duchovne čistá." # todo: CHANGED
 jisha_bugyou: "Jisha-Bugyō" # todo: NEW TRANSLATION
 jisha_bugyou_desc: "Administrátor a dozor nad všetkými chrámami a svätyňami, $jisha_bugyou$ tiež dohliada na činnosť náboženských inštitúcií, aby ich záujmy boli v súlade so záujmami vlády." # todo: CHANGED
 kokugaku: "Kokugaku" # todo: NEW TRANSLATION
 kokugaku_desc: "Takmer od založenia krajiny boli $japan_region$ a $shinto$ ovplyvňované zahraničnými ideami z $china$ a $buddhist$. Nové hnutie tvrdí, že náš národný duch je prirodzene čistý a že spoločnosť treba očistiť od cudzích vplyvov." # todo: CHANGED
 home_shrines: "Domáce svätyne" # todo: NEW TRANSLATION
 home_shrines_desc: "Rituály a náboženská prax boli tradične sústredené v svätyniach a chrámoch. Avšak čoraz viac ľudí umiestňuje do domov domáce rodinné svätyne, nazývané #italic kamidana#!, na uctievanie Kami, a #italic butsudan#! ako $buddhist_ADJ$ oltáre pre predkov." # todo: CHANGED
 fukko_shinto: "Fukko $shinto$" # todo: NEW TRANSLATION
 fukko_shinto_desc: "Keď ľudia odmietajú cudzie vplyvy v našej kultúre, odmietajú aj učenie $buddhist_ADJ$ a $SECT_CONFUCIANISM_NAME$ zasahujúce do našej viery. Vzhľadom na túto vznikajúcu požiadavku po náboženskom očistení môže byť formálna revitalizácia $shinto$ rozumná." # todo: CHANGED
 jap_bushido: "Bushidō" # todo: NEW TRANSLATION
 jap_bushido_desc: "Hoci nikdy nebolo formálne kodifikované do presných pravidiel, spôsob správania bojovníka je jasný: povinnosť bojovníka je bojovať a vyhráť v boji a rozšíriť slávu vlastného klanu bez ohľadu na prostriedky potrebné na dosiahnutie cieľa." # todo: CHANGED
 jap_land_of_the_rising_sun: "Krajina vychádzajúceho slnka" # todo: NEW TRANSLATION
 jap_land_of_the_rising_sun_desc: "$japan_region$ má dlhú a slávnu históriu. Naše jedinečné kultúrne tradície, odvážni vojaci a nepremožiteľná geografia nás robia silnejšími než mnohé iné štáty v regióne. Prišiel čas, aby Krajina vychádzajúceho slnka zaujala postavenie medzi veľkými národmi sveta!" # todo: CHANGED
 jap_ancestral_legacy: "Dedičné dedičstvo" # todo: NEW TRANSLATION
 jap_ancestral_legacy_desc: "Ancestrálne línie nášho klanu sú dobre známe a naša povesť je pilierom našej identity — ten sa snažíme za každú cenu udržať, pretože naša história nás definuje a zaručuje naše právo vládnuť." # todo: CHANGED
 jap_shinobi: "Shinobi no Mono" # todo: NEW TRANSLATION
 jap_shinobi_desc: "Informácie sú kľúčom k získaniu výhody v každej situácii. Už dávno používame špiónov a infiltrátorov na zber spravodajských informácií. Títo $jap_shinobi$ pochádzajú z triedy samurajov, hoci môžu byť naverbovaní aj z roľníkov a poslaní do nepriateľského územia, kde sa zakorenia a vytvoria siete informátorov." # todo: CHANGED
 jap_head_hunting: "Zber hláv" # todo: NEW TRANSLATION
 jap_head_hunting_desc: "Úspechy bojovníka v boji sú skutočne pozoruhodné len ak sa dajú dokázať. Samurai zhromažďujú odseknuté hlavy zabitých nepriateľov, aby ich neskôr predložili generálovi. Čím viac a dôležitejších hláv samuraj prinesie, tým lepšie odmeny dostane." # todo: CHANGED
 jap_ichiban_yari: "Ichiban Yari" # todo: NEW TRANSLATION
 jap_ichiban_yari_desc: "Vykročiť krviprelievanie prvý je pocta a dobré znamenie, preto naši bojovníci túžia zasadiť prvý úder, kedykoľvek majú príležitosť." # todo: CHANGED
 jap_ashigaru: "Ashigaru" # todo: NEW TRANSLATION
 jap_ashigaru_desc: "Vojna bola vždy doménou mocných samurajov. Nedávny vývoj však ukázal potrebu silnejších posíl, a tak naše bojové polia teraz zahŕňajú aj roľnícke jednotky. Títo #italic ashigaru#! nebudú priemerným davom — ich prísny výcvik a bohaté skúsenosti z bitiek ich robia výnimočnými bojovníkmi porovnateľnými so samurajmi." # todo: CHANGED
 jap_daiku_construction: "Daiku staviteľstvo" # todo: NEW TRANSLATION
 jap_daiku_construction_desc: "Tradičné stolárske techniky, alebo #italic daiku#!, sa v $japan_region$ používajú od prvých dní našej histórie. Naše drevené stavby sú pružné a odolné, a obdivované pre svoju krásu a majstrovské spracovanie. Od najskromnejšej chatrče po najprepracovanejší palác je drevo naším najuniverzálnejším stavebným materiálom." # todo: CHANGED
 jap_wandering_ronin: "Putujúci rónin" # todo: NEW TRANSLATION
 jap_wandering_ronin_desc: "Samuraji sa často potulujú krajinou hľadajúc najvýhodnejšie zamestnanie, meniac svoju lojalitu tomu, kto lepšie zaplatí. Títo bojovníci prichádzajú a odchádzajú ako nemotorné vlny, no vždy ich môžeme využiť." # todo: CHANGED
 jap_reformed_land_holding: "Reforma vlastníctva pôdy" # todo: NEW TRANSLATION
 jap_reformed_land_holding_desc: "Tradične sme oceňovali pôdu podľa veľkosti, no to nedokáží zohľadniť, že nie každá pôda je rovnaká. Odteraz bude jej hodnota založená na tom, koľko $rice$ sa na nej dá vypestovať. To zefektívni ekonomické rozhodnutia a umožní lepšie využitie poľnohospodárskych činností." # todo: CHANGED
 jap_jokamachi: "Jōkamachi" # todo: NEW TRANSLATION
 jap_jokamachi_desc: "Nepokojné časy sú pre náš ľud mimoriadne nebezpečné, preto sa radi usádzajú okolo bezpečia opevnených miest. Tieto zhluky sa časom menia na mestá, ktoré nielen poskytujú ochranu, ale aj obchodné a kultúrne výhody." # todo: CHANGED
 jap_terakoya: "Terakoya" # todo: NEW TRANSLATION
 jap_terakoya_desc: "Tieto súkromné školy poskytujú základné vzdelanie bežnému ľudu, podporujúc gramotnosť, počtársku zručnosť a morálne hodnoty. #italic Terakoya#! zohrávajú kľúčovú úlohu pri formovaní vzdelanejšej a spoločensky uvedomelej populácie, prispievajúc k národnej stabilite a pokroku." # todo: CHANGED
 jap_codified_bushido: "Kodifikované Bushidō" # todo: NEW TRANSLATION
 jap_codified_bushido_desc: "Očakávané správanie bojovníka sa čoraz viac idealizuje a hodnoty ako česť a vernosť získavajú väčší význam než ich praktické využitie v boji. Táto romantizovaná a kodifikovaná verzia #italic Bushidō#! však zlepší vnímanie našich armád, aj keď to nemusí presne odrážať ich skutočné správanie." # todo: CHANGED
 kgk_omi_genji: "Ōmi-Genji" # todo: NEW TRANSLATION
 kgk_omi_genji_desc: "Sme Ōmi-Genji, potomkovia vetvy Uda Genji z rodu Minamoto, ktorí po generácie vládli Ōmi ako dediční #italic Shugo#!. Naša pevná pozícia nám dáva neotrasiteľnú legitimitu brániť a spravovať našu ancestrálnu doménu." # todo: CHANGED
 kgk_emerging_clan: "Vznikajúci klan" # todo: NEW TRANSLATION
 kgk_emerging_clan_desc: "Napriek impozantnému pôvodu je náš klan veľmi nový, keďže náš odchod od klanu Sasaki je relatívne čerstvý. Náš ľud je dychtivý dokázať svoju hodnotu ako potomkovia nezávislého mena." # todo: CHANGED
 akt_march_of_akita: "Pochod $akita$" # todo: CHANGED
 akt_march_of_akita_desc: "$akita$, náš feud v severnom Dewa, bol starobylou zónou konfliktu proti severným 'barbarom'. Hranice $JAP$ sa rozšírili ďaleko na sever, no duch našich predkov stále žije v našej krvi — nech každý, kto sa odváži postaviť nám do cesty, pocíti náš hnev!" # todo: CHANGED
 akt_ezo_kanrei: "$ezo_area$ Kanrei" # todo: CHANGED
 akt_ezo_kanrei_desc: "Pozícia $ezo_area$ #italic Kanrei#!, správcu $ezo_area$, je priradená nášmu klanu od čias $kamakura$ šógunátu. Máme na starosti správu ostrova ako miesta vyhnanstva pre zločincov, čo vyžaduje neustálu komunikáciu cez prieliv." # todo: CHANGED
 akt_ainu_trade: "Obchod s $ainu_culture$" # todo: NEW TRANSLATION
 akt_ainu_trade_desc: "Sme medzi prvými $japanese_group$, ktorí nadviazali trvalý obchod s $ainu_culture$. Naše lode premávajú medzi ich a našimi zemami a prinášajú vzájomné výhody obom komunitám." # todo: CHANGED
 asa_legacy_of_emperor_keitai: "Dedičstvo cisára Keitai" # todo: NEW TRANSLATION
 asa_legacy_of_emperor_keitai_desc: "Pred mnohými storočiami cisár Keitai zahájil kampaň, aby si zobral cisársky trón z $echizen_province$. Rovnako by sme nemali váhať prejaviť moc za hranicami a vpadnúť do susedných štátov, keď situácia zavolá." # todo: CHANGED
 asa_control_of_buddhist_sects: "Kontrola $buddhism_ADJ$ sekcií" # todo: CHANGED
 asa_control_of_buddhist_sects_desc: "$echizen_province$ je domovom mnohých dôležitých chrámov reprezentujúcich rôzne sekty, ako Eiheiji zo školy Sōtō a Heisenji z Tendai tradície, medzi inými. Ak ich všetky podriadime našej kontrole a zabezpečíme náboženský pokoj v celej provincii, stane sa to základom ideálnej náboženskej politiky pre celý národ." # todo: CHANGED
 ask_defender_of_the_imperial_court: "Obhajcovia cisárskeho dvora" # todo: NEW TRANSLATION
 ask_defender_of_the_imperial_court_desc: "Keď $kamakura$ šógunát padol, boli sme tí, ktorí chránili cisára a cisársky dvor. To nám poskytlo postavenie v popredí všetkých klanov v $JAP$ ako skutočného ochráncu cisárstva a jeho dvorových tradícií." # todo: CHANGED
 ask_bugyoshu_and_hokushu: "Bugyōshū and Hōkōshū" # todo: NEW TRANSLATION
 ask_bugyoshu_and_hokushu_desc: "Musíme posilniť autoritu našich administratívnych úradníkov, ako sú magistráti Bugyōshū a velitelia Hōkōshū. Silná byrokracia môže niekedy byť jedinou prekážkou medzi nami a otvorenou občianskou vojnou." # todo: CHANGED
 ask_higashiyama_culture: "Kultúra Higashiyama" # todo: NEW TRANSLATION
 ask_higashiyama_culture_desc: "Postavená okolo asketov zenového $buddhism$, Higashiyama kultúra nachádza krásu v jednoduchosti. Podporila rozvoj formálneho čajového obradu, #italic ikebana#! aranžovanie kvetov, divadlo a umenie. Tento rozkvet kultúry priniesol veľkú prestíž praktikujúcim umenia a odrazí sa dobre na našom panstve." # todo: CHANGED
 ask_shugo_system: "Shugo System" # todo: NEW TRANSLATION
 ask_shugo_system_desc: "#italic Shugo#! sú dôležití vazali pre šógunát, ktorí spravujú krajinu v mene $JAPANESE_SHOGUNATE_LEADER_MALE$. Vďaka nim môžeme spravovať naše územia lepšie a efektívnejšie." # todo: CHANGED
 cba_lineage_of_taira: "Línia $taira_dynasty$" # todo: CHANGED
 cba_lineage_of_taira_desc: "Klan $chiba_dynasty$ je starou vetvou $taira_dynasty$, ktorá sa od nich oddelila v neskorom období Heian. To nám dáva viac moci a vplyvu, než by inak naše politické postavenie naznačovalo." # todo: CHANGED
 cba_katori_jingu: "$katori_shrine$" # todo: NEW TRANSLATION
 cba_katori_jingu_desc: "$katori_shrine$ je zasvätená Futsunushi no Kami, patronovi bojových umení, uctievanému každým bojovníkom v $japan_region$. Stať sa hlavným patrónom tejto svätyne a povzbudzovať našich samurajov trénovať tam upevní našu legitimitu a súčasne posilní morálku a schopnosti našich bojovníkov." # todo: CHANGED
 cba_dream_of_masakado: "Sen Masakado" # todo: NEW TRANSLATION
 cba_dream_of_masakado_desc: "$taira_dynasty$ no Masakado, veľký bojovník a blízky príbuzný nášho klanu, raz sa snažil zostať cisárom Východného $japan_region$. Žiaľ, Masakado nemohol splniť svoj sen, ale jeho túžba založiť nový národ samurajov by mala byť našou vodítkovou hviezdou." # todo: CHANGED
 cba_irrigation_of_southern_kanto: "Zavlažovanie južného Kantó" # todo: NEW TRANSLATION
 cba_irrigation_of_southern_kanto_desc: "Veľké časti našej domény sú močaristé a nedokážu podporiť intenzívne poľnohospodárstvo. Nové poznatky v zavlažovaní však umožňujú odvodniť močiare a obrábať nové orniny. Pusťme sa do veľkého projektu rozvoja týchto inak zbytočných pôd; môžeme na tom patrične profitovať." # todo: CHANGED
 csk_clans_of_tosa: "Klan v $tosa_province$" # todo: CHANGED
 csk_clans_of_tosa_desc: "Naša domovská provincia $tosa_province$ bola vždy rozdelená medzi mocné klany. Ak chceme rozšíriť državy, musíme spojiť sily s týmito klanmi — pomôžu nám v povstaní a my im odmenujeme zvýšenie moci." # todo: CHANGED
 csk_god_of_arts: "Boh umení" # todo: NEW TRANSLATION
 csk_god_of_arts_desc: "Ancestrálny zakladateľ nášho klanu, Hata no Kawakatsu, bol vysoko uctievaný ako patrón umenia, od tradičných tancov po divadlo. Náš klan musí naplniť jeho dedičstvo, aby sme si zaslúžili rešpekt, ktorý nám patrí." # todo: CHANGED
 csk_unification_of_shikoku: "Zjednotenie Šikoku" # todo: NEW TRANSLATION
 csk_unification_of_shikoku_desc: "Shikoku je pre zvyšok $japan_region$ vnímaná ako chudobná a izolovaná zem, kde sa nič dôležité nedialo. Nech pokračujú v tomto presvedčení a prehliadajú naše zjednotenie ostrova, kým nebude neskoro." # todo: CHANGED
 csk_expand_the_navy: "Rozšíriť námorníctvo" # todo: NEW TRANSLATION
 csk_expand_the_navy_desc: "$japan_region$ je národom ostrovov, a preto je silné námorníctvo absolútnou nevyhnutnosťou. $tosa_province$ je ideálnym miestom začať budovať vlastnú flotu." # todo: CHANGED
 dte_fujiwara_hokke: "$fujiwara_dynasty$ Hokke" # todo: CHANGED
 dte_fujiwara_hokke_desc: "Ako jedna z vetiev severného domu $fujiwara_dynasty$ je nezvratná legitimita našej vlády." # todo: CHANGED
 dte_oshu_shugo: "Ōshū Shugo" # todo: NEW TRANSLATION
 dte_oshu_shugo_desc: "Ako ctihodný klan pôvodom z obdobia $kamakura$ máme silný nárok vládnuť nad celou provinciou Ōshū. Pre nás je navyše nejasné, ktoré územie presne Ōshū obnáša, čo nám len prospieva." # todo: CHANGED
 dte_dragon_of_oshu: "Drak Ōshū" # todo: NEW TRANSLATION
 dte_dragon_of_oshu_desc: "Naša sila a moc budú závidené nepriateľmi. Naša povesť bude navždy spojená s Drakom z Ōshū." # todo: CHANGED
 dte_intensive_domain_development: "Intenzívny rozvoj domén" # todo: NEW TRANSLATION
 dte_intensive_domain_development_desc: "Mnohí považujú oblasť $ou_area$ za chudobnú kvôli drsnej klíme a horám, no región skrýva veľký potenciál. Pomocou infraštruktúrnych investícií — nových miest, vodných ciest, rozšírenej pestovateľskej pôdy — a zrušením dusivých mýtnych poplatkov a daní môžeme výrazne zlepšiť naše srdce krajiny a spraviť našich poddaných bohatšími." # todo: CHANGED
 htk_hatakeyama_heritage: "Dedičstvo Hatakeyama" # todo: NEW TRANSLATION
 htk_hatakeyama_heritage_desc: "Niektorí považujú našich klanových vodcov za vzburychtivých rozvratníkov kvôli stigma pripojenej k nášmu menu. Toto nepriateľstvo je však iba symbolom našej odolnosti. Znovuzrodili sme sa; nikdy sa nevzdáme a budeme bojovať za to, čo je naše, bez ohľadu na odpor!" # todo: CHANGED
 htk_shogunate_ties: "Spojenia so šógunátom" # todo: NEW TRANSLATION
 htk_shogunate_ties_desc: "Ako klan, ktorý zostupuje z jednej vetvy $ashikaga_dynasty$, máme obzvlášť silné väzby na autoritu Šógunátu. Pokiaľ si túto asociáciu zachováme, náš klan zostane vysoko cenený." # todo: CHANGED
 htk_clan_spread: "Rozšírenie klanu" # todo: NEW TRANSLATION
 htk_clan_spread_desc: "Náš klan sa neuspokojí s jedným miestom a snaží sa rozšíriť svoj vplyv po celej krajine. Nech sa rozšíri akokoľvek ďaleko, autorita klanu musí byť bezpochybná v každej našej držbe." # todo: CHANGED
 hsk_rising_clan: "Stúpajúci klan" # todo: NEW TRANSLATION
 hsk_rising_clan_desc: "Aj keď sú naše korene relatívne skromné v porovnaní s inými klanmi pochádzajúcimi z $ashikaga_dynasty$, napriek tomu sme dokázali výrazne rozšíriť náš vplyv. Náš klan je na vzostupe a nič by nemalo brzdiť našu vzostupnú dráhu!" # todo: CHANGED
 hsk_control_of_izumi_sea: "Kontrola $izumi$ mora" # todo: CHANGED
 hsk_control_of_izumi_sea_desc: "Uzemie nášho klanu sa tradične nachádza okolo prielivu Kii. Ovládnutie obchodu vstupujúceho na pevninu touto cestou prinesie obrovský zisk a my porastieme do veľkosti." # todo: CHANGED
 hsk_branches_and_retainers: "Vetvy a vazali" # todo: NEW TRANSLATION
 hsk_branches_and_retainers_desc: "Náš rozvetvený klan kontroluje bohaté územia cez sieť lojálnych príbuzných a vazalov. Zachovaním vnútornej harmónie v dynastii sa náš klan stane jedným z najsilnejších v $JAP$." # todo: CHANGED
 img_claim_to_shogunate: "Nárok na Šógunát" # todo: NEW TRANSLATION
 img_claim_to_shogunate_desc: "Keďže náš klan pochádza z rodu $ashikaga_dynasty$, máme silný nárok na pozíciu $JAPANESE_SHOGUNATE_LEADER_MALE$, keby hlavná línia zanikla. Aj keď Bakufu nie je ohrozené, je v našom najlepšom záujme pripomínať každému našu legitimitu. Pre istotu..." # todo: CHANGED
 img_supreme_ruler_of_tokaido: "Kontrola Tōkaidō" # todo: NEW TRANSLATION
 img_supreme_ruler_of_tokaido_desc: "Tōkaidō je najdôležitejšou obchodnou cestou medzi stredným a východným $japan_region$. Keďže naše ancestrálne země sú v strede tohto obchodu, bolo by rozumné získať kontrolu nad celým regiónom, aby sme získali najväčšie výhody z miestnej komerčnej činnosti." # todo: CHANGED
 img_unlikely_alliances: "Nepravdepodobné spojenectvá" # todo: NEW TRANSLATION
 img_unlikely_alliances_desc: "Niekedy je najlepší spôsob, ako poraziť nepriateľa, spraviť z neho priateľa. Zabezpečenie našej vlády strategickými sobášmi nielen upokojí našich protivníkov a získa nám nových spojencom, ale tiež nám umožní nakoniec dominovať rivalom krvnou líniou." # todo: CHANGED
 img_march_to_kyoto: "Pochod na $kyoto$" # todo: NEW TRANSLATION
 img_march_to_kyoto_desc: "V týchto nebezpečných časoch, keď $japan_region$ a $kyoto$ sú zmietané politickým chaosem, môže ktokoľvek vtrhnúť do hlavného mesta a uchopiť moc. Ako blízki príbuzní $ashikaga_dynasty$ je naša povinnosť — a právo — zabezpečiť stabilitu krajiny." # todo: CHANGED
 isk_sanindo_gate: "$sanindou_area$ brána" # todo: NEW TRANSLATION
 isk_sanindo_gate_desc: "Provincia $tango_province$ je bránou do $kyoto$ v oblasti $sanindou_area$ a miestom kľúčového ekonomického významu. Pevne si tu etablujúc a rozširujúc svoje vplyvy, môžeme vyťažiť z tejto prosperity." # todo: CHANGED
 isk_minister_of_samurai_dokoro: "Minister Samurai-Dokoro" # todo: NEW TRANSLATION
 isk_minister_of_samurai_dokoro_desc: "Sme jedným zo štyroch mocných klanov tradíčne menovaných za hlavných veliteľov vojenských a policajných záležitostí v Samurai-Dokoro. Je preto našou povinnosťou i privilégiom udržiavať pokoj v hlavnom meste a dôležitých miestach." # todo: CHANGED
 ito_gokenin_family: "Rodina Gokenin" # todo: NEW TRANSLATION
 ito_gokenin_family_desc: "Naši predkovia pomohli Minamoto no Yoritomovi pri zakladaní $kamakura$ šógunátu. Ako odmenu sme boli zaradení medzi jeho #italic Gokenin#! a dostali panstvo v $hyuuga_province$. Toto je pocta, ktorú si málo rodín v Kjúšú užíva." # todo: CHANGED
 ito_sympathy_to_foreign_faiths: "Sympatia k novým vieram" # todo: NEW TRANSLATION
 ito_sympathy_to_foreign_faiths_desc: "Cudzinci privážajú do našej krajiny cudzí náboženské presvedčenia. Samozrejme musíme zabezpečiť, aby to neohrozilo naše tradičné náboženstvá, ale pokiaľ to nepredstavuje riziko, nevidíme dôvod zakazovať ľuďom slobodnú voľbu viery." # todo: CHANGED
 kkc_disinguished_family_in_kyushu: "Významná rodina" # todo: NEW TRANSLATION
 kkc_disinguished_family_in_kyushu_desc: "Na rozdiel od iných mocných klanov v Kjúšú sa naša rodina usadila tu ešte pred založením $kamakura$ šógunátu. Naše úspechy sú dobre známe a naše meno rešpektované." # todo: CHANGED
 kkc_resistance_against_foreign_intervention: "Odpor proti inváziám" # todo: NEW TRANSLATION
 kkc_resistance_against_foreign_intervention_desc: "Naše zásluhy pri obrane krajiny proti $MGE_ADJ$ inváziám sú dobre známe. Významné činy Kikuchi Takefusu v odpore voči votrelcom sú široko oslavované a všetky naše jednotky sa snažia bojovať rovnako statočne." # todo: CHANGED
 ktb_southern_court: "Stúpenci cisára" # todo: NEW TRANSLATION
 ktb_southern_court_desc: "Počas cisárskeho rozkolu sme podporovali Južný dvor, prejavujúc vernosť Chrysantémovému trónu napriek ťažkostiam. Táto povesť vernej služby nám prináša viac prestíže a morálnej autority než mnohým menším domom, ktoré teraz dominujú v $japan_region$." # todo: CHANGED
 ktb_control_of_ise: "Kontrola $ise_province$" # todo: NEW TRANSLATION
 ktb_control_of_ise_desc: "Od bohatého juhu až po hustejšie osídlený sever sme rozšírili kontrolu nad celou provinciou $ise_province$. To nám umožní plne využiť provinčné zdroje na ďalší rast vplyvu nášho klanu." # todo: CHANGED
 ktb_blessing_of_amaterasu: "Požehnanie Amaterasu" # todo: NEW TRANSLATION
 ktb_blessing_of_amaterasu_desc: "Ako strážcovia najsvätejších svätyní $japan_region$ v $ise_province$ sme požehnaní Amaterasu, bohyňou slnka a vesmíru. Musíme rásť, aby sme boli hodní starostlivosti o tento národný poklad, ktorý nám získa rešpekt $japanese_group$ ľudu." # todo: CHANGED
 ktb_the_march_of_kitabatake_akiee: "Pochod Kitabatake Akiie" # todo: NEW TRANSLATION
 ktb_the_march_of_kitabatake_akiee_desc: "Náš ušľachtilý predok Kitabatake Akiie dokázal, že aj dlhý pochod z $ou_area$ do centrálneho $japan_region$ môže byť vykonaný rýchlo, ak má človek rozhodnosť. Musíme sa z tohto skutku učiť a trénovať naše armády v rýchlom manévrování, aby sme sa mohli rýchlo presúvať medzi frontami podľa potreby." # todo: CHANGED
 kno_shugo_of_iyo: "Shugo provincie $iyo_province$" # todo: NEW TRANSLATION
 kno_shugo_of_iyo_desc: "Od neskorého obdobia Heian sme boli najväčšou námornou mocnosťou v oblasti Seto Inland Sea. Náš námořníctvo je dôvodom, prečo sme sa stali #italic Shugo#! tejto provincie." # todo: CHANGED
 kno_ruler_of_inland_sea: "Panovanie nad Vnútorným morom" # todo: NEW TRANSLATION
 kno_ruler_of_inland_sea_desc: "Seto Inland Sea má špeciálny význam pre obchodné trasy $japan_region$, a udržiavať námornú prevahu tu môže spraviť náš klan bohatým. Musíme sa uistiť, že vždy máme silné loďstvo pre kontrolu námorného obchodu." # todo: CHANGED
 kno_murakami_suigun: "Murakami Suigun" # todo: NEW TRANSLATION
 kno_murakami_suigun_desc: "Klan Murakami je známy pre pirátstvo v Seto Inland Sea. Integrujme ich plne do nášho klanu a pošleme týchto hrozivých súkromníkov do boja proti našim nepriateľom!" # todo: CHANGED
 mri_descendant_of_oe_hiromoto: "Potomkovia Ōe no Hiromoto" # todo: NEW TRANSLATION
 mri_descendant_of_oe_hiromoto_desc: "Ōe no Hiromoto, učenec a politik, ktorý výrazne prispel k založeniu $kamakura$ šógunátu, bol predkom nášho klanu. Jeho duch v nás dodnes žije a hrdíme sa efektívnou správou zeme, ktorú pre nás zabezpečil." # todo: CHANGED
 mri_munakata_three_goddesses: "Tri bohyne Munakata" # todo: NEW TRANSLATION
 mri_munakata_three_goddesses_desc: "Tri dcéry Susanoo-no-Mikoto sú patrónkami mora a navigácie. Ich požehnanie urobí naše námorníctvo nezastaviteľným." # todo: CHANGED
 nbu_genji_in_the_north: "Ōshū Genji" # todo: NEW TRANSLATION
 nbu_genji_in_the_north_desc: "Sme pôvodne vedľajšia vetva Kai Genji; náš zakladateľ dostal panstvo v provincii Ōshū ako odmenu za vernú službu $kamakura$ šógunátu. Časom sme si privykli na túto oblasť s drsnými zimami a vieme, ako využiť tieto podmienky v náš prospech." # todo: CHANGED
 nbu_fight_against_famines: "Boj proti hladomoru" # todo: CHANGED
 nbu_fight_against_famines_desc: "Kvôli studeným vetrom neskoro na jeseň a ťažkým snehom až do skorého jari naši ľudia často trpia ťažkými hladomormi a hladom. Musíme vybudovať zásoby potravín a zamyslieť sa, ako môžeme zlepšiť pôdu pod našou kontrolou, aby sme prekonali budúce katastrofy." # todo: NEW TRANSLATION
 nbu_northern_horses: "Severné kone" # todo: NEW TRANSLATION
 nbu_northern_horses_desc: "Mutsu má ranče, z ktorých sa v staroveku posielali kone do $kyoto$. Tradícia chovu koní pretrváva dodnes a je to tradícia, ktorú by sme mali rozvíjať, pretože nám umožňuje vychovávať ťažkú jazdu ľahšie než mnohí susedia." # todo: CHANGED
 oda_uninspiring_clan: "Neinšpirujúci klan" # todo: NEW TRANSLATION
 oda_uninspiring_clan_desc: "Napriek vznešenému pôvodu náš klan nie je považovaný za obzvlášť významný, hrozivý alebo zaujímavý pre cudzích. Ich podceňovanie našej sily a prefíkanosti čoskoro ukáže svoju cenu..." # todo: CHANGED
 oda_generals: "$ODA$ generáli" # todo: NEW TRANSLATION
 oda_generals_desc: "Posadnutosť rodom a privilégiami oslabila krajinu a vzostup samostatných mocných klanov jasne ukázal, ako zbytočné sú také myšlienky. Vezmime si túto lekciu k srdcu a nech úspech a schopnosť rozhodujú, kto by mal povstať do velenia našich armád. Silné vedenie je nevyhnutné pre rýchlu expanziu." # todo: CHANGED
 oda_tenka_fubu: "Tenka Fubu" # todo: NEW TRANSLATION
 oda_tenka_fubu_desc: "Je jasne naším osudom ovládať celú krajinu v našom panstve. Nikto nebude odolávať našej autorite a všetko pod nebom sa podriadi našej vojenskej sile." # todo: NEW TRANSLATION
 oda_triple_firing: "Trojité paľby" # todo: NEW TRANSLATION
 oda_triple_firing_desc: "Príchod palných zbraní a ich ďalší rozvoj revolucionalizujú vojnu v $japan_region$. Dokážeme dominovať bojisku, ak masterujeme tieto nové zbrane. Na zvýšenie kadencie paľby sa naši arkebuzieri zoradia, umožňujúc jednej línii strieľať, zatiaľ čo dve iné dobíjajú." # todo: CHANGED
 oda_influential_strongholds: "Vplyvné pevnosti" # todo: NEW TRANSLATION
 oda_influential_strongholds_desc: "$japan_region$ je krajina hradov a opevnení. Výstavba silných obranných pozícií umožní uplatniť vplyv v politickej oblasti aj na cestách dôležitých pre vojenské ťaženia. Táto lekcia musí byť našou prioritou. Prostredníctvom našich hradov tiež udržiavame prítomnosť a moc nad obyčajnými ľuďmi. Vždy uprednostňujme znižovanie nepriateľských pevností a stavbu vlastných na strategických miestach." # todo: CHANGED
 oda_patronization_of_the_west: "Podpora Západu" # todo: NEW TRANSLATION
 oda_patronization_of_the_west_desc: "Západní misionári priniesli do našej krajiny mnoho nápadov a techník a, na rozdiel od starých $buddhist_ADJ$ sekier, nemajú prepojenia na skorumpovaných pozemkových pánov alebo povstalecké mestá. Mali by sme týchto cudzincov privítať v našich mestách a zistiť, aké výhody by mohli priniesť nášmu dvoru." # todo: CHANGED
 ogs_ogasawara_ryu: "Ogasawara-Ryū" # todo: NEW TRANSLATION
 ogs_ogasawara_ryu_desc: "Tradičné formy mnohých vecí sú v našej spoločnosti vysoko cenené. Formalizovali sme oficiálny systém bojových umení a etikety pre samurajov od čias zakladateľa nášho klanu Ogasawara Nagakiyo, ktorý vytvoril školu, kam by mali všetci samuraji chodiť učiť sa správne techniky." # todo: CHANGED
 ogs_shinano_shugo: "Shugo provincie $shinano_province$" # todo: NEW TRANSLATION
 ogs_shinano_shugo_desc: "Náš klan patrí k podvetve Minamoto a vládne provincii $shinano_province$ ako jej #italic Shugo#!. Naša zem je hornatá a nepriateľská pre mnohých. Pre náš ľud však už dlho slúži ako súčasť našej obrany proti vonkajším útokom. Vezmime si túto skúsenosť so sebou, kamkoľvek naše armády pôjdu, a vždy si osvojme podrobné informácie o teréne, kde sa budeme biť." # todo: CHANGED
 ogs_kiso_uma: "Kiso-Uma" # todo: NEW TRANSLATION
 ogs_kiso_uma_desc: "Kone z oblasti Kiso sú naša preferovaná plemenná línia. Nie sú najvyššie ani najschopnejšie rýchlosťou, ale vynahrádzajú to vysokou výdržou a sú dostatočne odolné, aby prežili v horských podmienkach." # todo: CHANGED
 ogs_improvment_of_nakasendo: "Zlepšenie Nakasendō" # todo: NEW TRANSLATION
 ogs_improvment_of_nakasendo_desc: "Nakasendō je jednou z najdôležitejších ciest medzi centrálnym a východným $japan_region$. Kontrola nad ňou znamená kontrolu nad obchodom, ktorý ňou prechádza." # todo: CHANGED
 suw_suwa_taisha: "Suwa Taisha" # todo: NEW TRANSLATION
 suw_suwa_taisha_desc: "Suwa Taisha pri jazere Suwa je jednou z najstarších svätyní v $japan_region$ a je veľmi uctievaná po celej krajine. Jej najdôležitejší festival, #italic Onbashira-matsuri#!, dokazuje odvahu nášho ľudu, keď nesú posvätné kmene z hôr do svätyne." # todo: CHANGED
 otm_lord_of_bungo: "Pán z Bungo" # todo: NEW TRANSLATION
 otm_lord_of_bungo_desc: "Sme #italic Shugo#! provincie Bungo od čias $kamakura$ éry. Tieto země sú známe svojou úrodnou pôdou a bohaté úrody nám umožňujú živiť väčšie armády než mnohí iní $daimyo$." # todo: CHANGED
 otm_domination_of_kyushu: "Ovládnutie Kjúšú" # todo: NEW TRANSLATION
 otm_domination_of_kyushu_desc: "Sme menovaní #italic Shugo#! provincií $bungo_province$, $hizen_province$ a $hyuuga_province$. To nás ideálne pozicionuje k nároku na celé Kjúšú!" # todo: CHANGED
 otm_nanban_trade: "Privítanie nanban obchodu" # todo: NEW TRANSLATION
 otm_nanban_trade_desc: "Iní môžu cudzincov označovať za barbarov, ale my rozpoznávame výhody a prínosy obchodu s nimi. Nech je známe, že vždy budú vítaní v našich prístavoch — a my rozšírime svoju obchodnú sieť ďalej než naši rivali." # todo: CHANGED
 otm_christian_conversion: "$christian_ADJ$ konverzie" # todo: CHANGED
 otm_christian_conversion_desc: "Naše stále častejšie styky s cudzincami vzbudili v mnohých z nášho klanu záujem o $christian$. $christian_ADJ$ vieru vyznáva mnoho mocných stúpencov medzi našimi pánmi a vazalmi, a niektorí sú zapálenými konvertitmi. Využime týchto $christian_ADJ$ konvertitov, nech už si náš klan zvolí ktorúkoľvek cestu, a použime ich vplyv a horlivosť na ďalšie naše ciele." # todo: CHANGED
 ouc_descendant_of_baekje: "Potomkovia Baekje" # todo: CHANGED
 ouc_descendant_of_baekje_desc: "Náš kronikár hovorí, že sme potomkami princa Imseonga z kráľovského rodu starovekého kráľovstva Baekje, ktoré kedysi panovalo v $korea_region$. Tento legendárny pôvod nám dáva prestížne postavenie v $east_asia$." # todo: CHANGED
 ouc_korea_trade: "Obchod s $korea_region$" # todo: CHANGED
 ouc_korea_trade_desc: "Vďaka našej polohe sme klanom, ktorý obchoduje s $korea_region$ najaktívnejšie, a tým máme takmer monopol na mnohé exotické tovary. Musíme urobiť všetko pre to, aby sme si udržali túto výhodnú pozíciu a využili ju proti každému, kto by nás chcel ohrozovať." # todo: CHANGED
 ouc_fight_against_wokou: "Proti pirátom" # todo: CHANGED
 ouc_fight_against_wokou_desc: "Aby sme si udržali dobré vzťahy so štátmi na kontinente kvôli našim obchodníkom, musíme vykonávať stály námorný dohľad. Pokiaľ budú v našich vodách bežní piráti a pašeráci, cudzinci nám nebudú dôverovať a môžu nám aj škodiť." # todo: CHANGED
 ouc_welcome_missionaries: "Privítanie západných misionárov" # todo: NEW TRANSLATION
 ouc_welcome_missionaries_desc: "Ako sa rozširuje náš obchodný okruh, prichádzame do častejšieho kontaktu s cudzincami a ich zvláštnymi zvyklosťami a vierami. Nech už veria čomukoľvek, ich mena stojí za to; mali by sme sa tváriť otvorení ich myšlienkam tak, ako sme otvorení ich obchodom, ak chceme zabezpečiť opakovaný obchod." # todo: CHANGED
 stk_hitachi_genji: "Genji z $hitachi_province$" # todo: NEW TRANSLATION
 stk_hitachi_genji_desc: "Sme jedna z najstarších línií Minamoto v regióne Kantō a bojujeme za slávu nášho klanu vo východnom $japan_region$ ešte predtým, než Minamoto no Yoritomo založil $kamakura$ šógunát. Naša pozícia ako #italic Shugo#! $hitachi_province$ preto nikdy nie je spochybnená." # todo: CHANGED
 stk_kashima_jingu: "$kashima_shrine$" # todo: NEW TRANSLATION
 stk_kashima_jingu_desc: "$kashima_shrine$ je jednou z troch najdôležitejších svätyní v Kantō regióne. Táto svätyňa je zasvätená Takemikazuchi-no-O-no-Kami, bohu hromu a mečov, a zároveň patrónovi $sumo$ zápasov. Našu starostlivosť o túto svätyňu posilňuje odhodlanie našich armád." # todo: CHANGED
 stk_eastern_coalitions: "Východné koalície" # todo: NEW TRANSLATION
 stk_eastern_coalitions_desc: "Bez ohľadu na nepriateľské klany okolo nás sme vždy predstavovali rozumnú tretiu stranu, ku ktorej sa iné klany môžu pripojiť pre ochranu pred útočníkmi. Táto tradícia východných koalícií nám poslúži, pokiaľ zabezpečíme, že klany, ktoré sa na nás spoliehajú, nikdy nebudú musieť obávať o ochranu." # todo: CHANGED
 sba_multiple_shugo: "Viaceré šugo" # todo: NEW TRANSLATION
 sba_multiple_shugo_desc: "Boli sme zvolení #italic Shugo#! viacerých provincií. Spravovanie týchto zemi nás urobí bohatými vďaka príjmom z úrodných ryžových polí a dielní najzručnejších remeselníkov regiónu." # todo: CHANGED
 sba_access_to_northern_japan: "Väzby na Ōshū" # todo: NEW TRANSLATION
 sba_access_to_northern_japan_desc: "Provincia Ōshū je naším druhým domovom a miestom, odkiaľ náš klan pochádza. Musíme využiť naše väzby na Ōshū, aby sme získali silné bojové kone domáceho pôvodu." # todo: CHANGED
 sba_shiba_retainers: "$SBA$ vazali" # todo: NEW TRANSLATION
 sba_shiba_retainers_desc: "Máme talentovaných, ale ambicióznych vazalov v našom klane. Sú častým zdrojom rodinných napätí a bolo by múdre ich upokojiť. Na druhej strane, pevný dohľad a štědré, strategické odmeny by z týchto mocných rodín mohli urobiť najväčšie aktíva našej vlády." # todo: CHANGED
 smz_satsuma_shugo: "$satsuma_province$ šugo" # todo: NEW TRANSLATION
 smz_satsuma_shugo_desc: "Tradične sme držali titul #italic Shugo#! $satsuma_province$; jeho meno sa stalo synonymom nášho klanu. Naši vojaci sú hrdí na toto a sú vždy pripravení brániť naše územie." # todo: CHANGED
 smz_tsurinobuse: "Tsurinobuse" # todo: NEW TRANSLATION
 smz_tsurinobuse_desc: "#italic Tsurinobuse#!, 'návnada a prepad', je naša najefektívnejšia taktika. Táto stratégia nám umožňuje poraziť nepriateľov, keď sme početne prekonaní, čo je veľmi cenná zručnosť. Urobme z toho hlavnú taktiku našich armád a dajme hlúpým veliteľom rivalov malé prekvapenie." # todo: CHANGED
 smz_shimazu_charge: "$SMZ$ nápor" # todo: NEW TRANSLATION
 smz_shimazu_charge_desc: "Aj keď sme obkľúčení a prekonaní počtom, naši vojaci budú kráčať dopredu až za nepriateľské línie. Nápor našich oddielov bude legendárny!" # todo: CHANGED
 smz_tanegashima: "Tanegashima Teppō" # todo: NEW TRANSLATION
 smz_tanegashima_desc: "Západní, ktorí prvý pristáli na Tanegashime, priniesli nové a zaujímavé zbrane. Tieto arkebuzy sa stávajú čoraz bežnejším javom po celom $japan_region$, no nikde nie sú dostupné tak dlho ako tu." # todo: CHANGED
 smz_early_westernization: "Raná westernizácia" # todo: NEW TRANSLATION
 smz_early_westernization_desc: "Vďaka častému skorému kontaktu so Západom sme sa veľa naučili o cudzej technológii a inováciách. Tieto poznatky môžeme využiť pri reformách v ekonomike, priemysle a vzdelávaní, čo nám dá výhodu nad ostatnými klanmi." # todo: CHANGED
 shn_vice_minister_of_dazaifu: "Námestník ministra Dazaifu" # todo: NEW TRANSLATION
 shn_vice_minister_of_dazaifu_desc: "Ako naznačuje meno nášho klanu, pochádzame z určeného vice ministra Dazaifu v provincii $chikuzen_province$. Táto inštitúcia bola od staroveku diplomatickým a vojenským centrom regiónu a tradične spravujeme severné Kjúšú ako cisárov zástupcovia." # todo: CHANGED
 shn_defender_against_mongols: "Obranca $JAP$" # todo: CHANGED
 shn_defender_against_mongols_desc: "Ako prominentná samurajská rodina zo severného Kjúšú sme statočne bojovali proti $MGE_ADJ$ inváziám. Pokiaľ bude treba, opäť povstane a budeme brániť Kjúšú a celú ríšu proti vonkajším votrelcom." # todo: CHANGED
 shn_diplomacy_through_tsushima: "Diplomacia cez Cušimu" # todo: CHANGED
 shn_diplomacy_through_tsushima_desc: "Vďaka našej prítomnosti v $tsushima_province$ máme bohaté skúsenosti s rokovaniami s $korea_region$. Týmto spôsobom sme vždy držali otvorený kanál k vonkajšiemu svetu, aj keď boli oficiálne styky zakázané." # todo: CHANGED
 soo_tradition_of_wakou: "Tradícia wakō" # todo: NEW TRANSLATION
 soo_tradition_of_wakou_desc: "Hoci oceňujeme zákonný a pokojný obchod, musíme byť pripravení na napäté vojenské situácie. Našťastie miestna tradícia pirátstva môže pomôcť vyriešiť niektoré bojové problémy." # todo: CHANGED
 soo_fight_for_tsushima: "Boj za Tsushimu" # todo: NEW TRANSLATION
 soo_fight_for_tsushima_desc: "Ležiac medzi $asia$ a ostrovmi $japan_region$, naše domovy $tsushima_province$ a okolité vody sú miestami, kde štáty narážajú a bojujú. Nech sú naše flotily silné, aby sme nielen bránili krajinu, ale ju aj rozširovali!" # todo: CHANGED
 soo_bahan_ship: "Bahan Ship" # todo: NEW TRANSLATION
 soo_bahan_ship_desc: "Naše súkromné lode nesú vlajku Hachimana a šíria des všade, kam prídu. Nikto by si nedovolil napadnúť flotilu chránenú samotným bohom vojny!" # todo: CHANGED
 tkd_kai_shugo: "$kai_province$ šugo" # todo: NEW TRANSLATION
 tkd_kai_shugo_desc: "Sme potomkovia Genji z $kai_province$ a tradične menovaní #italic Shugo#! tejto provincie. S týmto spojom sme neoddeliteľne spätí a známe kone z kraja sú synonymom našej pechoty." # todo: CHANGED
 tkd_takeda_ryu: "Takeda-Ryū" # todo: NEW TRANSLATION
 tkd_takeda_ryu_desc: "Tradičné formy bojového umenia sa v našej rodine cvičia po generácie. Špeciálny dôraz kladieme na jazdu a streľbu z konského chrbta, vďaka čomu sú naše jazdecké oddiely omnoho efektívnejšie než tie z iných klanov." # todo: CHANGED
 tkd_tiger_of_kai: "Tigr z Kai" # todo: NEW TRANSLATION
 tkd_tiger_of_kai_desc: "Silní vodcovia lepšie strážia svoje domény než akékoľvek hradby. Naši generáli musia tvrdo trénovať a zaslúžiť si titul 'Tiger of Kai'." # todo: CHANGED
 tkd_fuurinkazan: "Fūrinkazan" # todo: NEW TRANSLATION
 tkd_fuurinkazan_desc: "'Rýchli ako vietor, jemní ako les, divokí ako oheň, nepohnuteľní ako hora.' Slová veľkého vojnového majstra Sun-cua budú natrvalo vpísané do histórie nášho rodu ako naše motto." # todo: CHANGED
 tki_genji_in_mino: "Genji z $mino_province$" # todo: NEW TRANSLATION
 tki_genji_in_mino_desc: "Ako hlava Genji v $mino_province$ a jeho menovaný #italic Shugo#! sme po generácie viedli miestnych samurajov. Naša doména zaujíma výhodnú pozíciu na kontrolu susedných regiónov." # todo: CHANGED
 tki_banner_of_bellflower: "Zástava zvončeka" # todo: CHANGED
 tki_banner_of_bellflower_desc: "Keďže sme tu Shugo po celé generácie, náš erb je už synonymom $mino_province$. Všetci, čo tu žijú, budú bojovať pod našou zástavou." # todo: CHANGED
 tki_flood_control_of_three_rivers: "Protipovodňová ochrana" # todo: NEW TRANSLATION
 tki_flood_control_of_three_rivers_desc: "V našej domovskej provincii často tri veľké rieky Kiso, Nagara a Ibi spôsobujú vážne záplavy ryžových polí. Mali by sme regulovať tento odtok a využiť ho na zvýšenie výnosu vo všetkých provinciách pod našou vládou." # todo: CHANGED
 ues_strong_dynastic_ties: "Silné dynastické väzby" # todo: NEW TRANSLATION
 ues_strong_dynastic_ties_desc: "Náš rod pochádza z prestížneho rodu $fujiwara_dynasty$ a máme tiež silné väzby na $ashikaga_dynasty$, keďže matka $ashikaga_dynasty$ Takauji bola z nášho klanu. Tieto dynastické väzby budú neoceniteľné pre náš prospech." # todo: CHANGED
 ues_double_shugo: "Dvojité šugo" # todo: NEW TRANSLATION
 ues_double_shugo_desc: "Boli sme menovaní #italic Shugo#! oboch provincií $kouzuke_province$ a $tango_province$. Ich bohaté země sú ideálnym východiskom pre náš rozmach." # todo: CHANGED
 ues_eastern_power: "Východná sila" # todo: NEW TRANSLATION
 ues_eastern_power_desc: "Hoci sme získali pôdu na východe i západe $japan_region$, práve na východe môžeme skutočne vzkvetať. Naše územia tam sú bohaté a môžeme prilákať mnohých zručných miestnych bojovníkov do našich služieb." # todo: CHANGED
 ues_dragon_of_echigo: "Drak z Echigo" # todo: NEW TRANSLATION
 ues_dragon_of_echigo_desc: "Náš klan vypestoval takú výnimočnú odvahu a spravodlivosť, že naši protivníci sa boja nás už len pri pomyslení na boj. Vyhlásime silu našich vodcov svetu a každý sa zachveje pri pomyslení na Draka z Echigo!" # todo: CHANGED
 utn_fujiwara_descendant: "Potomkovia $fujiwara_dynasty$" # todo: CHANGED
 utn_fujiwara_descendant_desc: "Naša genealogia ukazuje, že naši predkovia boli pôvodne členmi rodu $fujiwara_dynasty$ z $kyoto$. Toto príbuzenské puto k starovekej a uctievanej dynastii je veľmi užitočné pri nadväzovaní diplomatických spojení s cisárskym dvorom a s inými klanmi." # todo: CHANGED
 utn_legacy_of_nasu_no_yoichi: "Dedičstvo Nasu no Yoichi" # todo: NEW TRANSLATION
 utn_legacy_of_nasu_no_yoichi_desc: "$shimotsuke_province$ bolo kedysi domovom Nasu no Yoichiho, slávneho lukostrelca počas Genpei vojny. Dodnes si bojovníci $shimotsuke_province$ vážia jeho meno; sme hrdo nazývaní 'najlepšími lukostrelcami v Kantō' a nesieme odkaz Nasu no Yoichiho." # todo: CHANGED
 utn_mediator_of_kanto: "Mediátor Kantó" # todo: NEW TRANSLATION
 utn_mediator_of_kanto_desc: "Ako jeden z najstarších klanov v Kantō máme prenikavé pochopenie regionálnej politiky a mnohokrát sme pôsobili ako sprostredkovateľ medzi rôznymi frakciami. Táto všestranná znalosť regiónu nám umožňuje rozširovať naše územie efektívne bez provokovania ostatných." # todo: CHANGED
 ymn_descendant_of_nitta: "Potomkovia $nitta_dynasty$" # todo: CHANGED
 ymn_descendant_of_nitta_desc: "Sme potomkovia rodu $nitta_dynasty$, dávnych rivalov $ashikaga_dynasty$. Pre niektorých je to dôkaz našej lojality, pre iných nás to robí prirodzeným nepriateľom. Musíme múdro využiť naše pôvodné línie ako diplomatickú zbraň." # todo: CHANGED
 ymn_mediate_succession_disputes: "Mediácia sporov o následníctvo" # todo: CHANGED
 ymn_mediate_succession_disputes_desc: "Keď sa mnohé iné klany hádajú o tom, kto je pravým dedičom, obráťajú sa na nás, aby sme sprostredkovali svoje spory. Tým získavame jedinečnú moc a dôveru, čo nám uľahčuje získavanie nových spojenectiev a kontaktov — a tiež destabilizovanie rivalov." # todo: CHANGED
 ymn_leader_of_western_army: "Západná armáda" # todo: NEW TRANSLATION
 ymn_leader_of_western_army_desc: "Utvorme veľkú západnú armádu, ktorá zjednotí rozhádané štáty $japan_region$. Zruční generáli, dobre vycvičení vojaci a neochvejná odvaha rýchlo zlomia odolnosť Východných!" # todo: CHANGED
 ymn_isolated_heartland: "Izolované vnútrozemie" # todo: NEW TRANSLATION
 ymn_isolated_heartland_desc: "Naše domovské územia sú hornaté a izolované. Našťastie to znamená, že potenciálni dobyvatelia by mali veľmi ťažkú cestu k našim zemiam! Vybudujme obranu tak, aby dopĺňala prirodzenú ochranu geografie — každý votrelc to bude hlboko ľutovať." # todo: CHANGED
 dahomey_amazons: "Amazónky Dahomey" # todo: CHANGED
 dahomey_amazons_desc: "Oddiel ženských bojovníčok, naverbovaných medzi kráľovými manželkami. Získali si povesť mýtických Amazónok vďaka svojej húževnatosti v boji a strachu, ktorý vzbudzujú v radoch nepriateľov. Tieto $dahomey_amazons$ sú celkom oddané $DAH$ a jeho záujmom." # todo: CHANGED
 dah_children_of_the_panther: "Deti pantera" # todo: NEW TRANSLATION
 dah_children_of_the_panther_desc: "Naše starobylé legendy hovoria, že náš kráľovský rod pochádza z zväzku princeznej a pantera. Tento starobylý a mystický príbeh zvýši našu prestíž a slávu." # todo: CHANGED
 dah_slave_hunts: "Lov na otrokov" # todo: NEW TRANSLATION
 dah_slave_hunts_desc: "Pri lúpežných vpádoch do okolitých území získavame otrokov, ktorí sa môžu ekonomicky zamestnať alebo vymeniť pri obchode, ale taktiež môžu slúžiť v armáde. Takto zvýšime počet bojovníkov, ktorých možno povolať do zbrania." # todo: CHANGED
 dah_migan_mehu: "Migan a Mehu" # todo: NEW TRANSLATION
 dah_migan_mehu_desc: "Migan a Mehu sú dvaja hlavní ministrovia vládcu. Jeden dozerá na sever, druhý na juh; jeden na spravodlivosť, druhý na obchod. Spolu prinášajú stabilitu a prosperitu." # todo: CHANGED
 dah_lagredis: "Lagredis" # todo: NEW TRANSLATION
 dah_lagredis_desc: "Tajnym umiestnením mužských dvoranov, prezlečených za kráľove manželky v hareme, môžu konať nenápadne ako vládcove oči a uši, najmä v otázkach palácových intrig." # todo: CHANGED
 dah_yovogan: "Yovogan" # todo: NEW TRANSLATION
 dah_yovogan_desc: "Keďže k nám prichádza stále viac cudzincov, mali by sme zriadiť nový úrad v našej vláde na štúdium a učenie sa z ich spôsobov, aby sme z tohto výmeny kultúr profitovali." # todo: CHANGED
 dah_dahomey_palaces: "Paláce Abomey" # todo: NEW TRANSLATION
 dah_dahomey_palaces_desc: "Vybudovanie rozľahlého palácového komplexu v našom hlavnom meste by bolo elegantné, no zároveň ohromujúce vyjadrenie našej moci. Každý, kto by uvažoval o vzbure, by bol zaiste odradený pohľadom na naše pompézne paláce." # todo: CHANGED
 kbo_ribat_fortifications: "Opevnenia Ribāṭ" # todo: NEW TRANSLATION
 kbo_ribat_fortifications_desc: "Používané v celom $muslim_ADJ$ svete, tieto malé opevnenia poskytujú ochranu karavánam, obchodným strediskám a odľahlým komunitám." # todo: CHANGED
 people_of_allah: "Ľudia $muslim_god_name$" # todo: NEW TRANSLATION
 people_of_allah_desc: "Sme nasledovníci $muslim_god_name$, jediného pravého Boha, a riadime sa Jeho slovom. Všetci, ktorí v Neho veria, sú v Jeho očiach našimi bratmi a sestrami." # todo: NEW TRANSLATION
 holy_revelation: "Sväté zjavenie" # todo: NEW TRANSLATION
 holy_revelation_desc: "Slovo $muslim_god_name$ bolo zjavené Jeho prorokovi Muḥammadovi, pokoj s ním, a prepisané do Svätého $common_string_quran$. Cez jeho verše sa vôľa $muslim_god_name$ prenáša na Jeho veriacich a všetci $muslim_ADJ$ veriaci by mali byť oboznámení s jeho pasážami." # todo: NEW TRANSLATION
 islamic_calligraphy: "Islamská kaligrafia" # todo: NEW TRANSLATION
 islamic_calligraphy_desc: "$muslim$ nie je len náboženstvo pokoja, ale aj umenia. K calligrafii používaná pri písaní veršov $common_string_quran$ a mien prorokov často balancuje medzi písaným slovom a umením." # todo: CHANGED
 islamic_prayer: "Aṣ-Ṣalāh Farḍ" # todo: NEW TRANSLATION
 islamic_prayer_desc: "Jedným z piatich pilierov $muslim$ je Aṣ-Ṣalāh, povinnosť pre $muslim_ADJ$ veriacich vykonávať denné modlitby. Aj keď počet modlitieb za deň a presné pohyby sa môžu líšiť medzi školami, akt dennej modlitby je spoločný pre všetkých $muslim$." # todo: CHANGED
 zakah: "Al-Zakāh Wājib" # todo: NEW TRANSLATION
 zakah_desc: "Jedným z Piatich pilierov $muslim$ je Al-Zakāh, forma almužny považovaná za náboženskú povinnosť pre každého $muslim_ADJ$ veriacého. Dávanie peňazí na pomoc chudobným je povinná charita pre každého, kto si to môže dovoliť, a považuje sa za daň." # todo: NEW TRANSLATION
 muslim_lineage: "$muslim_ADJ$ línia" # todo: NEW TRANSLATION
 muslim_lineage_desc: "Od čias Muhammada, mier s ním, je $muslim$ neoddeliteľne spätý s vládnou štruktúrou. Naša dynastická línia je teda legitimizovaná aj vierou." # todo: CHANGED
 muslim_caravans: "$muslim_ADJ$ karavány" # todo: NEW TRANSLATION
 muslim_caravans_desc: "Od mnohých línií Hodvábnej cesty až po soľné trasy Sahary má náš ľud tradíciu obchodných ciest do vzdialených krajín, poskytujúc nám a zvyšku $muslim_ADJ$ sveta široký výber tovarov." # todo: CHANGED
 islamic_golden_age: "Zlatý vek islamu" # todo: NEW TRANSLATION
 islamic_golden_age_desc: "Vplyv, ktorý mal $islamic_golden_age$ na celý svet, nielen v $muslim_ADJ$ krajinách, je nezapierateľný. Niektoré z týchto neveriacich národov sa práve teraz vynárajú z temnoty nevedomosti a činí svoje prvé pokusy o 'objavy' v umení a vedách, ktoré sme my vynašli — a zdokonalili — dávno pred nimi." # todo: CHANGED
 ramadan: "Ramaḍān" # todo: NEW TRANSLATION
 ramadan_desc: "Spomienka na prvé zjavenie prorokovi Muhammadovi, mier s ním, mesiac $ramadan$ je najposvätnejším mesiacom v $muslim$. Počas tohto mesiaca sa od všetkých $muslim_ADJ$ veriacich očakáva vykonávanie Ṣawm — pôst a zdržanie sa počas denných hodín — ako aj modlitba a rozjímanie." # todo: CHANGED
 sunnah: "Sunnah" # todo: NEW TRANSLATION
 sunnah_desc: "Skladajúca sa z tradícií a skutkov pripisovaných Muhammadovi, mier s ním, $sunnah$ určuje správanie každého $muslim_ADJ$ veriacich a zároveň dáva meno $sunni$. Hoci sa detaily líšia medzi právnymi školami, všetky majú základ v $sunnah$." # todo: CHANGED
 imamate: "Imamate" # todo: NEW TRANSLATION
 imamate_desc: "Základom viery $shia_ADJ$ je, že Muḥammad, pokoj s ním, určil 'Alī ibn Abī Ṭāliba za svojho nasledovníka. Postava Imáma je teda duchovným vodcom pochádzajúcim z línie Muḥammada, pokoj s ním, ktorý vedie všetkých $muslim_ADJ$ veriacich." # todo: NEW TRANSLATION
 indian_sea_trade: "Obchod v Indickom oceáne" # todo: NEW TRANSLATION
 indian_sea_trade_desc: "$muslim_ADJ$ obchodníci sú po generácie moreplavci $indian_ocean_region$, cestujúc neuveriteľne ďaleko za vzácnym a cenným tovarom. Od východných pobreží $africa$ cez pobrežie $india$ až po korenisté ostrovy $indonesia_region$ — vody krížom prechádzajú lode $muslim_ADJ$ veriacich." # todo: CHANGED
 muslim_trade_communities: "$muslim_ADJ$ obchodné komunity" # todo: NEW TRANSLATION
 muslim_trade_communities_desc: "Prítomnosť $muslim_ADJ$ obchodníkov v diaľavách ich stavia do kontaktu s mnohými odlišnými národmi a vierami. Vznik obchodných komunít medzi nimi umožnil určitú miera miešania a synkretizmu ich presvedčení s pravým slovom $muslim_god_name$." # todo: CHANGED
 expansionist_faith: "Expanzívna viera" # todo: NEW TRANSLATION
 expansionist_faith_desc: "Od svojich počiatkov v $arabia_region$ sa $muslim$ rozšíril rýchlo a ďaleko. V niekoľkých generáciách jeho veriaci zasiahli od $iberia_region$ po $india$ — najrýchlejšie náboženské rozšírenie, aké svet kedy zažil. Sú nové krajiny čakajúce na naše svetlo — možno je čas na druhú $muslim_ADJ$ expanziu." # todo: CHANGED
 blend_of_influences: "Zmes vplyvov" # todo: NEW TRANSLATION
 blend_of_influences_desc: "$muslim$ sa rozšíril do mnohých nových miest od svojho vzniku v $arabia_region$ a pri tom prišiel do styku s mnohými odlišnými národmi a spôsobmi života. Počas tohto procesu sa odohralo mnoho výmen vplyvov, až do takej miery, že mnohé charakteristiky, ktoré pôvodne nepatrili k $muslim$, sa s vierou pevne spojili." # todo: CHANGED
 islamic_schoolars: "Islamskí učenci" # todo: NEW TRANSLATION
 islamic_schoolars_desc: "$muslim$ vždy podporoval štúdium a analýzu svojich spísaní, až sme vyvinuli rôzne školy myslenia, ako ich interpretovať. Naši učenci sú preto mimoriadne učenými vo $common_string_quran$ a iných svätých textoch a schopní viesť hlboké teologické diskusie." # todo: CHANGED
 gunpowder_empires: "Impériá pušného prachu" # todo: NEW TRANSLATION
 gunpowder_empires_desc: "Prášok možno vynašli na Ďalekom východe, ale prostredníctvom $muslim$ sa stal široko používaný po celom svete. Strelné zbrane sú stálicou našich armád po generácie a ich výroba a použitie patria k naszym identitám." # todo: CHANGED
 established_holy_sites: "Ustanovené sväté miesta" # todo: NEW TRANSLATION
 established_holy_sites_desc: "Zatiaľ čo iné náboženstvá majú voči posvätným miestam laxné a nekonzistentné názory, pravidlá $muslim$ ohľadom svätých miest sú jasné. Naši ľudia svoje púte vykonajú s patričnou úctou a dôstojnosťou." # todo: CHANGED
 islamic_courts: "Islamské dvory" # todo: NEW TRANSLATION
 islamic_courts_desc: "Královské dvory $muslim_ADJ$ krajín boli vždy medzi najobdivovanejšími na svete. Oceňované pre svoju kultúru a honosné vybavenie, príbehy o veľkoleposti našich dvorov sa šírili ďaleko a náš ľud je hrdý na túto povesť." # todo: CHANGED
 schools_of_thought: "Školy myslenia" # todo: NEW TRANSLATION
 schools_of_thought_desc: "Tradične $muslim$ kládol dôraz na hľadanie poznania a vzdelania. Od právnych a teologických škôl až po veľké knižnice a inštitúcie učenia zriadené rôznymi vládcami, $muslim_ADJ$ učenie si získalo obdiv naprieč $muslim_ADJ$ svetom i ďaleko za jeho hranicami." # todo: CHANGED
 distant_trade_ventures: "Vzdialené obchodné výpravy" # todo: NEW TRANSLATION
 distant_trade_ventures_desc: "Najziskovejší tovar prichádza z najvzdialenejších miest. Po dlhé roky $muslim_ADJ$ obchodníci podnikali dlhé cesty po zemi i mori hľadajúc výhodné obchodné príležitosti." # todo: CHANGED
 resilient_merchants: "Odolní obchodníci" # todo: NEW TRANSLATION
 resilient_merchants_desc: "$muslim_ADJ$ obchodníci znášajú najdrsnejšie podmienky na svojich cestách. Od priechodu horúcimi pieskami Sahary a Gobi po spojené monzúnové vody $indian_ocean_region$, viackrát dokázali, že podstúpia akékoľvek útrapy, len aby obchod úspešne prebehol." # todo: CHANGED
 jewels_of_the_desert: "Drahokamy púšte" # todo: NEW TRANSLATION
 jewels_of_the_desert_desc: "$muslim$ povstal z pieskov $arabia_region$ a rozšíril sa po väčšinou aridnom regióne. Napriek tomu sa niektoré $muslim_ADJ$ mestá stali ako prosperujúce drahokamy v nehostinnom púšti, skutočné oázy zbohatnuté obchodom, architektúrou a zavlažovaním. S múdrym plánovaním a investíciami môže každé púštne sídlo dosiahnuť podobný status." # todo: CHANGED
 comprehensive_land_survey: "Komplexné pozemkové zameranie" # todo: NEW TRANSLATION
 comprehensive_land_survey_desc: "Aby sme vedeli, kto má platiť dane, musíme vedieť, komu čo patrí. Komplexné pozemkové mapovanie a jeho pravidelná aktualizácia sú preto nevyhnutné. Vždy dostaneme, čo nám patrí!" # todo: CHANGED
 counting_the_people: "Sčítanie ľudu" # todo: NEW TRANSLATION
 counting_the_people_desc: "Keď už vieme, kto vlastní čo, logickým krokom je zistiť, kto kde žije. To nám povie, kde hľadať nových rekrutov do našich armád." # todo: CHANGED
 cosmopolitan_court: "Kozmopolitný dvor" # todo: NEW TRANSLATION
 cosmopolitan_court_desc: "Ľudia zďaleka obdivujú krásu a sofistikovanosť nášho $muslim_ADJ$ dvora. Stali sme sa atraktívnym miestom pre talentované osobnosti všetkého druhu, čo len pridáva na živelnosti a prestíži nášho dvora." # todo: CHANGED
 caliphate: "Ḵilāfa" # todo: NEW TRANSLATION
 caliphate_desc: "#italic Ḵilāfa#!, alebo Kalifát, je zjednotenie všetkých $muslim_ADJ$ veriacich pod jedným vládcov v podobe $rank_empire_muslim_ruler_male$, ktorý je politickým a duchovným nástupcom Muhammada, mier s ním. Hoci sú rôzne názory na to, kto je oprávnený stať sa $rank_empire_muslim_ruler_male$, idea zjednotenia všetkých $muslim$ pod jednou zástavou bola vždy hlavným cieľom tohto procesu." # todo: CHANGED
 ibadi_imamate: "$ibadi_ADJ$ imámat" # todo: NEW TRANSLATION
 ibadi_imamate_desc: "Na rozdiel od $caliphate$ alebo božsky vymenovaného $shia_ADJ$ Imáma, $ibadi_ADJ$ Imám nevládne nad celým $muslim_ADJ$ svetom, ale spravuje lokálne spoločenstvo. Každá obec môže byť vládnutá nezávisle vlastným Imámom." # todo: CHANGED
 contacts_network: "Sieť kontaktov" # todo: NEW TRANSLATION
 contacts_network_desc: "Široký dosah $muslim$ nás dostal do kontaktu s mnohými cudzími krajinami. Udržiavanie bohatej siete medzinárodných kontaktov je vždy prospešné pre diplomaciu." # todo: CHANGED
 infiltration_tactics: "Infiltračné taktiky" # todo: NEW TRANSLATION
 infiltration_tactics_desc: "Hoci starobylý $nizari_school$ $shia_ADJ$ rád #italic Ḥashshāshīyīn#! bol značne mýtizovaný a prehnaný nad ich pôvodný rozsah, ich taktiky podvratného pôsobenia a atentátov boli nespochybniteľne efektívne. Ak použijeme podobné infiltračné taktiky, môžeme očakávať podobný úspech." # todo: CHANGED
 unified_armies: "Zjednotené armády" # todo: NEW TRANSLATION
 unified_armies_desc: "Nedá sa poprieť, že $muslim$ sa rozšíril do mnohých rôznych kultúr a národov od svojho vzniku v $arabia_region$. Pokiaľ veria v $muslim_god_name$, ktokoľvek by mal byť schopný bojovať v Jeho mene bez ohľadu na pôvod." # todo: CHANGED
 harsh_environments: "Nehostinné prostredia" # todo: NEW TRANSLATION
 harsh_environments_desc: "$muslim$ sa od svojho založenia rozšíril do civilizácií v niektorých z najdrsnejších prostredí sveta. Ak sa niekto zvonka pokúsi vtrhnúť na naše územia, bude to mimoriadne ťažké — a dobre tak!" # todo: CHANGED
 four_noble_truths: "Štyri ušľachtilé pravdy" # todo: NEW TRANSLATION
 four_noble_truths_desc: "Základné učenie Buddhu, $four_noble_truths$, vysvetľuje realitu bytosti. Nič nie je trvalé, čo spôsobuje utrpenie duchu v dôsledku jeho pripútanosti k pominuteľnej existencii. Toto duchovné utrpenie možno zmierniť oslobodením sa od túžby a pustením pripútaností, čo sa dosahuje nasledovaním $noble_eightfold_path$." # todo: CHANGED
 noble_eightfold_path: "Ušľachtilá osmerá cesta" # todo: NEW TRANSLATION
 noble_eightfold_path_desc: "Cesta k oslobodeniu zo Saṃsāry a dosiahnutiu Nirvány, $noble_eightfold_path$ je najčistejším výtahom $buddhist_ADJ$ praktík. Určuje duševný stav aj telesné činy a stanovuje správne správanie pre každého nasledovníka $buddhist$." # todo: CHANGED
 middle_way: "Stredná cesta" # todo: NEW TRANSLATION
 middle_way_desc: "Buddha nás učí vyvarovať sa extrémom; ani zmyslové rozkoše, ani extrémna askéza nevedú k osvieteniu." # todo: CHANGED
 three_jewels: "Tri klenoty" # todo: NEW TRANSLATION
 three_jewels_desc: "$three_jewels$, alebo Tri útočiská, sú tri opory, v ktorých sa nasledovník $buddhist$ uchýli. Tieto útočiská sú #italic Buddha#!, osvietený; #italic Dharma#!, učenie Buddhu; a #italic Saṃgha#!, mníšska komunita, ktorá zachováva Dharmu." # todo: CHANGED
 buddhist_syncretism: "$buddhist_ADJ$ synkretizmus" # todo: NEW TRANSLATION
 buddhist_syncretism_desc: "$buddhist$ má pôvod v $india$, no rozšíril sa ďaleko a prišiel do kontaktu s mnohými inými vierami. Preto obsahuje veľa synkretizmu nielen s predchádzajúcimi $hindu_ADJ$ tradíciami, ale aj s rozličnými božstvami, s ktorými sa stretol." # todo: CHANGED
 sutra: "Sútra" # todo: NEW TRANSLATION
 sutra_desc: "Typ posvätného textu v $dharmic_ADJ$ a $buddhist_ADJ$ náboženstvách, menia sa v podobe a obsahu. Napriek tomu sú považované za platné zdroje poznania a dôkladné skúmanie je potrebné k rozvoju ducha." # todo: CHANGED
 buddhist_councils: "$buddhist_ADJ$ koncily" # todo: NEW TRANSLATION
 buddhist_councils_desc: "Po celej histórii $buddhist_ADJ$ mníšske rady diskutovali o kanonických textoch cez rôzne školy. Hoci konkrétna forma, výsledky a záznamy sa môžu líšiť podľa školy, zjednocujúca sila takýchto rád — prinášajúc rozličné tradície do dialógu — by sa nemala podceniť." # todo: CHANGED
 buddhist_canon: "$buddhist_ADJ$ kánon" # todo: NEW TRANSLATION
 buddhist_canon_desc: "Nazývaný rôznymi menami a dokonca obsahujúci rozdielne texty podľa vetvy $buddhist$, $buddhist_canon$ je zbierkou posvätných $buddhist_ADJ$ textov. Obsahuje všetko, od mníšskych pravidiel po #italic Sūtra#!, učenia Buddhu, a každý oddaný $buddhist$ by mal byť s nimi oboznámený." # todo: CHANGED
 pali_canon: "$pali_language$ kánon" # todo: NEW TRANSLATION
 pali_canon_desc: "Hoci existuje mnoho rôznych kánonov v $buddhist$, v závislosti od školy, $theravada_ADJ$ $pali_canon$ je najstarší a najprestížnejší. Ostatné školy si vytvorili svoje kánony z mixu textov rôznych pôvodov, no $pali_canon$ zostal nezmenený od čias Ašóku 'Veľkého' a obsahuje slová samotného Buddhu. Bol tiež základom pre mnohé ďalšie školy." # todo: CHANGED
 buddhist_universities: "$buddhist_ADJ$ univerzity" # todo: NEW TRANSLATION
 buddhist_universities_desc: "Od staroveku boli $buddhist_ADJ$ centrá tiež centrami učenia a poznania, priťahujúc ľudí zďaleka, aby študovali v našich inštitúciách. Nālandā bola v minulosti najväčší z týchto centier, no mnohé iné nasledovali jej príklad." # todo: CHANGED
 xuanzang_travels: "Cesty Xuánzànga" # todo: NEW TRANSLATION
 xuanzang_travels_desc: "Xuanzang, $chinese_group$ $buddhist_ADJ$ mních žijúci počas dynastie Táng v 7. storočí, podnikol sedemnásťročnú pozemnú cestu do $india$, aby navštívil jeho centrá učenia a zhromaždil veľké množstvo $buddhist$ textov. Okrem iného navštívil Nalandu, kde sa učil od najlepších majstrov, a po návrate do $china$ priniesol viac než tisíc dokumentov, ktoré výrazne prispeli k $mahayana$. Jeho cesta a záznamy poslúžili ako základ pre príbeh #italic Cesta na Západ#!, v ktorom mních je poverený Buddhou cestou do $india$ hľadať sväté texty, sprevádzaný medzi inými Kráľom Opíc, Sun Wukong." # todo: RETRANSLATED ENGLISH
 silk_road_transmission: "Prenos cez Hodvábnu cestu" # todo: NEW TRANSLATION
 silk_road_transmission_desc: "Je nepopierateľný vplyv, aký mala Hodvábna cesta na šírenie $buddhist$. Či už po zemi alebo mori, obchod umožnil, aby $buddhist$ prenikol ďaleko od svojich indických koreňov." # todo: CHANGED
 bodhisattva: "Bodhisattva" # todo: NEW TRANSLATION
 bodhisattva_desc: "Nezávisle od školy $buddhist$, $bodhisattva$ je dôležitou postavou, hoci ich charakteristiky a význam sa líšia medzi tradíciami. Vo všetkých prípadoch si zasluhujú úctu a obdiv." # todo: CHANGED
 avalokitesvara: "Avalokiteśvara" # todo: NEW TRANSLATION
 avalokitesvara_desc: "Tiež známy ako Guānyīn alebo Kannon, $avalokitesvara$ je jedným z najslávenejších bodhisattvov. Zobrazený ako muž alebo žena v závislosti od školy, a niekde považovaný aj za pôvod všetkých $hindu_ADJ$ božstiev, $avalokitesvara$ je bodhisattva súcitu a je spojený s mantrou #italic Oṃ maṇi padme hūm̐#!." # todo: NEW TRANSLATION
 maitreya: "Maitreya" # todo: NEW TRANSLATION
 maitreya_desc: "$maitreya$ je v súčasnosti $bodhisattva$, prorokovaný ako budúci a posledný Buddha tejto éry. Jeho osudom je znovuobnovenie učenia Dharmy vo svete po tom, čo ho ľudstvo zabudne, a preto je nástupcom Siddhārtha Gautama." # todo: NEW TRANSLATION
 mount_meru: "Hora Meru" # todo: NEW TRANSLATION
 mount_meru_desc: "$mount_meru$ je posvätná hora v centre vesmíru v fyzickom i duchovnom zmysle pre $hindu$, $buddhist$ a $jain$. Keďže je stredom, okolo ktorého sa všetko točí, tak aj celá naša krajina sa točí okolo nášho vládcu." # todo: CHANGED
 naraka: "Naraka" # todo: NEW TRANSLATION
 naraka_desc: "Tiež nazývané #italic Niraya#!, $naraka$ označuje ríše utrpenia, kde sa zlé karmické zásluhy čistia pred reinkarnáciou. Existuje mnoho $naraka$ ríš a doba pobytu i tresty závisia od miery karmy potrebnej pred znovuzrodením do vyšších ríš." # todo: CHANGED
 four_heavenly_kings: "Štyria nebeskí králi" # todo: NEW TRANSLATION
 four_heavenly_kings_desc: "Každý vládne nad jedným z kardinálnych smerov, $four_heavenly_kings$ strážia Deva ríšu pred Asurami. Tiež posudzujú cnosti a morálku smrteľníkov." # todo: CHANGED
 vegetarianism: "Vegetariánstvo" # todo: NEW TRANSLATION
 vegetarianism_desc: "Hoci závisí od školy, existujú pravidlá Dharma ohľadom zdržania sa konzumácie mäsa. Každá škola má iný názor na prísnosť tohto zdržania a tiež na to, či sa vzťahuje len na mníšsku komunitu, alebo na obyvateľstvo všeobecne." # todo: CHANGED
 edicts_of_ashoka: "Edikty Ašóku" # todo: NEW TRANSLATION
 edicts_of_ashoka_desc: "Zákonný kód publikovaný cisárom Ašókom 'Veľkým' v 3. storočí pred n. l., tieto edikty obsahujú predpisy podporujúce $buddhist$. Hoci tento kód pochádza z dávnej minulosti, stále si zaslúži úctu a váženie každým členom $buddhist_ADJ$ spoločenstva." # todo: CHANGED
 five_precepts: "Päť predpisov" # todo: NEW TRANSLATION
 five_precepts_desc: "Základný kód $buddhist_ADJ$ etiky a morálky, $five_precepts$ predstavuje najzákladnejšie pravidlá, ktorými sa majú riadiť veriaci $buddhist$, či už sú súčasťou mníšskej komunity alebo nie. Nariadzujú zdržanie sa zabíjania, krádeže, sexuálneho nemorálneho konania, klamstva a opojenia." # todo: CHANGED
 monastic_communities: "Mníšske komunity" # todo: NEW TRANSLATION
 monastic_communities_desc: "$buddhist_ADJ$ život sa sústreďuje okolo komunít mníchov a mníšok, nazývaných #italic Saṃgha#!. Riadi ich #italic Vinaya#!, pravidlá a príkazy určujúce činnosť každej $buddhist_ADJ$ náboženskej komunity." # todo: CHANGED
 prestigious_schools: "Prestížne školy" # todo: NEW TRANSLATION
 prestigious_schools_desc: "$buddhist$ sa rozvinul do mnohých škôl, každá sústredená okolo typu mníšskej komunity a preferencie určitých textov. Niektoré z týchto škôl získali prestíž, iné boli odsunuté do zabudnutia. Spojenie s uznávanými školami prináša istú mieru prestíže aj ich podporovateľom." # todo: CHANGED
 offerings: "Obety" # todo: NEW TRANSLATION
 offerings_desc: "Je predpisom $buddhist$ prinášať obety $three_jewels$ s cieľom nahromadiť zásluhy. Tieto obety môžu byť materiálne či nemateriálne a niektoré mníšske komunity úplne závisia na jedle darovanom nasledovníkmi pre svoje prežitie." # todo: CHANGED
 incense_burning: "Pálenie kadidla" # todo: NEW TRANSLATION
 incense_burning_desc: "Pálenie kadidla je základom akéhokoľvek $buddhist_ADJ$ rituálu či obety. V rôznych formách je bežné, že laickí aj zasvätení mnísi a mníšky zapália kadidlo pred vykonaním rituálu alebo meditácie. Vôňa kadidla preto neodmysliteľne presiakuje každý $buddhist_ADJ$ chrám." # todo: CHANGED
 ascetic_practices: "Askézske praktiky" # todo: NEW TRANSLATION
 ascetic_practices_desc: "Hoci Buddha varoval pred nebezpečenstvom extrémnej askézy, niektorí mnísi stále praktizujú prísne praktiky. Obmedzovanie druhu látky, ktorú môžu nosiť, jedla, ktoré môžu konzumovať, alebo miesta, kde môžu bývať, sú niektoré z obmedzení prijatých tými, ktorí kráčajú touto cestou. Aj keď sa takéto strohé správanie nevyžaduje pre získanie zásluh, má svoje výhody pre praktikujúceho." # todo: CHANGED
 mindfulness: "Všímavosť" # todo: NEW TRANSLATION
 mindfulness_desc: "Podstatná súčasť $buddhist_ADJ$ praxe, $mindfulness$ znamená byť vedomý javov tela i mysle, pričom má človek stále prítomné učenie Buddhu v mysli. Vďaka tomu možno predchádzať neželaným stavom a rozvíjať žiadané." # todo: CHANGED
 dana: "Dāna" # todo: NEW TRANSLATION
 dana_desc: "Vyjadrujúce štedrosť, $dana$ je definovaná ako akt dávania bez očakávania odmeny a je kľúčovou cnosťou vo všetkých náboženstvách súvisiacich s Dharmou. Pomáhanie iným nesebecky, či už individuálne alebo spoločne, je jedným z hlavných spôsobov, ako nahromadiť karmu." # todo: NEW TRANSLATION
 ahimsa: "Ahiṃsā" # todo: NEW TRANSLATION
 ahimsa_desc: "Koncept $ahimsa$, teda nenásilia, je kľúčovou cnosťou vo všetkých náboženstvách nasledovaných Dharmou. Konflikty sa odporúča riešiť pokojne dialógom namiesto použitia sily. Bohužiaľ to nie je vždy možné, ale násilie by malo byť vždy až poslednou možnosťou a jeho použitie musí byť spravodlivé." # todo: NEW TRANSLATION
 resistance_to_persecution: "Odolnosť voči prenasledovaniu" # todo: NEW TRANSLATION
 resistance_to_persecution_desc: "Hoci sa $buddhist$ rozšíril široko po svete, zažil aj nemalé prenasledovanie v priebehu vekov. Jeho chrámy a obrazy mohli byť zničené, nasledovníci zabití alebo nútení do úkrytu, no napriek tomu jeho veriaci pretrvali." # todo: CHANGED
 buddhist_meditation: "$buddhist_ADJ$ meditácia" # todo: NEW TRANSLATION
 buddhist_meditation_desc: "Meditácia je bežnou praxou medzi všetkými $buddhist_ADJ$ nasledovníkmi, bez ohľadu na školu. Cieľom je cvičiť myseľ a ducha, rozvíjať všímavosť, pokoj a vhľad a tak napokon dosiahnuť osvietenie." # todo: CHANGED
 sruti: "Śruti" # todo: NEW TRANSLATION
 sruti_desc: "Význam 'to, čo je počuté', $sruti$ sú najposvätnejšie a najstaršie texty $hindu$. Považujú sa za božie zjavenie a nie sú pripisované ľudskému autorstvu, hoci niektorí popierajú ich božský pôvod a pritom uznávajú ich autoritu." # todo: CHANGED
 vedah: "Vēdaḥ" # todo: NEW TRANSLATION
 vedah_desc: "Hlavné texty medzi $sruti$ sú $vedah$, najstaršie texty v $sanskrit_language$. Ich autorstvo je v $mahabarata$ pripisované Brahmovi a zahŕňajú Ṛgveda, Yajurveda, Sāmaveda a Atharvaveda." # todo: CHANGED
 smrti: "Smṛti" # todo: NEW TRANSLATION
 smrti_desc: "Význam 'to, čo je zapamätané', $smrti$ texty sú inšpirované alebo vychádzajú zo $vedah$ a preto sú považované za menej autoritatívne než $sruti$, pretože sú od nich odvodené. Napriek tomu, na rozdiel od $sruti$, $smrti$ majú pripísaných autorov a sú prenášané prostredníctvom rukopisov." # todo: CHANGED
 mahabarata: "Mahābhārata" # todo: NEW TRANSLATION
 mahabarata_desc: "Jeden z dvoch hlavných $smrti$ textov spolu s $ramayana$, $mahabarata$ je epos starovekého $india$. Je to najdlhší epický verš vôbec napísaný, približne desaťkrát objemnejší než $greek_language$ #italic Iliad#! a #italic Odyssey#! dokopy, a rozpráva príbeh dynastického boja o trón starobylého $indian_group$ kráľovstva Kuru, ktorý vyvrcholil v Kurukshetra vojne, nazývanej tiež $mahabarata$ vojna. Príbeh končí smrťou $krishna_avatar$ a zánikom jeho dynastie." # todo: CHANGED
 ramayana: "Rāmāyaṇa" # todo: NEW TRANSLATION
 ramayana_desc: "Jeden z dvoch hlavných $smrti$ textov spolu s $mahabarata$, $ramayana$ je epos starovekého $india$. Rozpráva život $rama_avatar$, avatara $vishnu_god$, ako princa kráľovstva Kosala. Zdôrazňuje dôležitosť cnosti vo všetkých aspektoch života človeka." # todo: NEW TRANSLATION
 purana: "Purāṇa" # todo: NEW TRANSLATION
 purana_desc: "Považované za súčasť $smrti$, $purana$ sú texty s rozmanitým obsahom: kozmológia, božské rodokmene, astronómia, gramatika, milostné príbehy... takmer všetko možno v nich nájsť. Aj keď nie sú súčasťou $sruti$, ich vplyv na $hindu_ADJ$ viery a spoločnosť je silný, pretože spájajú miestne presvedčenia a tradície do spoločného naratívu $vedah$." # todo: CHANGED
 atman: "Ātman" # todo: NEW TRANSLATION
 atman_desc: "Považovaný za pravé a večné nemenné Ja, $atman$ je esencia individuálneho vedomia. Podľa $astika$ škôl je $atman$ odlišný od mysle a tela a líši sa od Jivātman, ktorý pretrváva cez mnohé životy. Naproti tomu $nastika$ školy interpretujú tento koncept inak alebo ho úplne odmietajú." # todo: CHANGED
 nastika_schools: "Nāstika školy" # todo: NEW TRANSLATION
 nastika_schools_desc: "Niektoré myslenkové školy v $hindu$ sa odchýlili od hlavného prúdu, odmietajúc autoritu $vedah$ a existenciu $atman$. Tieto školy, ako $jain$ a $buddhist$, sú teda heterodoxné, hoci stále obsahujú mnohé spoločné jadrové presvedčenia $hindu$." # todo: CHANGED
 astika_schools: "Āstika školy" # todo: NEW TRANSLATION
 astika_schools_desc: "Nazývané ortodoxné školy $hindu$, akceptujú autoritu $vedah$ a existenciu $atman$. Hoci pozostávajú z mnohých vetiev, tento spoločný súhlas im dáva veľa spoločnej pôdy." # todo: CHANGED
 diversity_of_beliefs: "Rôznorodosť presvedčení" # todo: NEW TRANSLATION
 diversity_of_beliefs_desc: "Presvedčenia ľudí $india$ sa zameriavajú okolo konceptu Dharmy a textu $vedah$, no prejavujú sa v rozmanitých formách a praktikách. Dokonca bohovia uctievaní nie sú rovnakí pre všetkých, no spoločný vláknom konceptu prechádza naprieč." # todo: CHANGED
 ishvara: "Īśvara" # todo: NEW TRANSLATION
 ishvara_desc: "Interpretované rôzne podľa školy alebo prúdu $hindu$, $ishvara$ označuje Najvyššiu bytosť alebo Boha. Môže to byť $shiva_god$ pre $shaivism$, $vishnu_god$ pre $vaishnavism$ alebo akýkoľvek osobný boh jednotlivca." # todo: CHANGED
 sanskritization: "Sanskritizácia" # todo: NEW TRANSLATION
 sanskritization_desc: "$hindu$ sa rozšíril ďaleko za hranice $india$ a mnoho kultúr prijalo pojmy a tituly z $sanskrit_language$, aby označili vlastnú identitu. Takto sa koncepty $hindu$ hladko preplietli a zmenili miestne presvedčenia." # todo: CHANGED
 bhakti_movement: "Hnutie Bhakti" # todo: NEW TRANSLATION
 bhakti_movement_desc: "Vzniknuvší v 6. storočí, tento hnutie podporuje lásku a oddanosť osobnému bohu alebo osvietenému jednotlivcovi. Oslovuje laickú populáciu priamym jazykom. Toto veľmi vplyvné hnutie mení spôsob, akým náš ľud chápe náboženstvo a vieru." # todo: CHANGED
 yoga: "Jóga" # todo: NEW TRANSLATION
 yoga_desc: "Významná $hindu_ADJ$ škola a filozofia, $yoga$ je súbor fyzických a duchovných praktík určených k ovládaniu mysle a tela. Cvičená po tisícročia, takmer sa stala synonymom cesty k osvieteniu." # todo: CHANGED
 diwali: "Diwali" # todo: NEW TRANSLATION
 diwali_desc: "Volaná sviatkom svetla, $diwali$ oslavuje triumf Dharmy; víťazstvo dobra nad zlom a svetla nad tmou. Zapálime sviečky a lampy ako symbol víťazstva a uctíme si predkov." # todo: CHANGED
 holi: "Holi" # todo: NEW TRANSLATION
 holi_desc: "Slávený na začiatku jari pri príležitosti jej príchodu, $holi$ je festival farieb a lásky. Spomíname si na poľnohospodárstvo a dobré úrody a zároveň si užívame množstvo farieb, ktoré jar prináša. Je to tiež čas na zábavu a riešenie sporov, odstraňovanie emocionálnych nečistôt." # todo: NEW TRANSLATION
 holy_rivers: "Posvätné rieky" # todo: NEW TRANSLATION
 holy_rivers_desc: "Rieky a ich uctievanie boli vždy dôležitou súčasťou $hindu$. Od Indu po Gangy, mnohé rieky sú považované za sväté a na ich brehoch sa vykonávajú mnohé rituály očistenia. Ich vody sú považované za posvätné a sú bežným miestom očistných obradov." # todo: CHANGED
 advaita_vedanta: "Advaita Vedānta" # todo: NEW TRANSLATION
 advaita_vedanta_desc: "Odmietajúc dualizmus medzi vedomím a hmotou, $advaita_vedanta$ tvrdí, že $atman$, teda najvnútornejšie ja alebo vedomie, je to isté ako najvyššia realita alebo vedomie vesmíru, Brahman. V tomto zmysle je fyzický materiálny svet len ilúziou, ktorá skrýva konečnú realitu Brahmana." # todo: NEW TRANSLATION
 hindu_muslim_relations: "$hindu_ADJ$-$muslim_ADJ$ vzťahy" # todo: NEW TRANSLATION
 hindu_muslim_relations_desc: "V minulosti medzi $hindu$ a $muslim$ prebiehalo množstvo interakcií a bude tomu tak i naďalej. Naše národy sa naučili žiť pokoji a došlo dokonca k určitému stupňu synkretizmu medzi týmito dvoma vierami." # todo: CHANGED
 hindu_unification: "$hindu_ADJ$ zjednotenie" # todo: NEW TRANSLATION
 hindu_unification_desc: "Napriek rozdielom v presvedčeniach a praktikách naprieč $hindu$ existuje viac spoločného než rozdielov. Objavuje sa spoločný ucelený pohľad na $hindu$, ktorý môže národu priniesť veľký pocit jednote." # todo: CHANGED
 hindu_architecture: "$hindu_ADJ$ architektúra" # todo: NEW TRANSLATION
 hindu_architecture_desc: "Bez ohľadu na štýl stavby — či už Śikhara, Vimāna alebo Prāṅg — $hindu_ADJ$ chrámy sú všade rozoznateľné podľa vysokých, zdobených veží. Predstavujú $mount_meru$, viac či menej zdôraznené podľa regiónu; tieto veže slúžia ako prejav viery i moci." # todo: CHANGED
 varna_system: "Systém Varṇa" # todo: NEW TRANSLATION
 varna_system_desc: "Od čias $vedah$ existuje koncept, že Dharma človeka patrí do jednej zo štyroch kategórií: #italic Brāhmaṇa#!, učenci alebo kňazi; #italic Kṣatriya#!, vládci alebo bojovníci; #italic Vaiśya#!, roľníci alebo obchodníci; alebo #italic Śūdra#!, remeselníci alebo služobníci. Tieto kategórie nie sú rigidné, skôr ideálom povolania jednotlivca a mali veľký vplyv na $hindu_ADJ$ spoločnosť." # todo: CHANGED
 extreme_pacifism: "Extrémny pacifizmus" # todo: NEW TRANSLATION
 extreme_pacifism_desc: "Na základe konceptu $ahimsa$ $hindu$ vždy podporuje pacifizmus a nenásilie. Naši nepriatelia by si nás však stále mali vážiť, pretože v prípade provokácie môžeme ukázať úplne opačný extrém." # todo: CHANGED
 hindu_empires: "$hindu_ADJ$ ríše" # todo: NEW TRANSLATION
 hindu_empires_desc: "V minulosti existovalo mnoho impérií, ktoré nasledovali $hindu$. Od Maurya a Gupta v $india$, po ríšu Śrīvijaya v $indonesia_region$ a dlhotrvajúcu dynastiu Chola — $hindu$ vždy bolo duchovnou silou za trónmi mocných vládcov." # todo: CHANGED
 sacred_cattle: "Posvätné kravy" # todo: NEW TRANSLATION
 sacred_cattle_desc: "V rámci $ahimsa$ je zabíjanie dobytka zakázané. Skôr sú uctievané a považované za materinské postavy, symboly obetavého zásobovania. Uctievajú sa od čias $vedah$ a stále si držia obrovský rešpekt." # todo: CHANGED
 riches_of_asia: "Bohatstvo $asia$" # todo: NEW TRANSLATION
 riches_of_asia_desc: "$asia$ je známa po celom svete svojim bohatstvom. Od bohatých miest $persia_region$ a $india$, cez vysoko žiadaný luxus produkovaný v $china$, až po takmer mytické Ostrovy korenia v $indonesia_region$, vzácne tovary z $asia$ sú žiadané všade." # todo: CHANGED
 silk_road: "Hodvábna cesta" # todo: NEW TRANSLATION
 silk_road_desc: "Či už pozemná trasa cez Gobi púšť a $persia_region$, alebo námorná vetva cez $indian_ocean_region$ a $indonesia_region$, krajiny Ázie sú stáročia prechádzané obchodníkmi hľadajúcimi zisk na slávnej Hodvábnej ceste." # todo: CHANGED
 exchange_of_ideas: "Výmena myšlienok" # todo: NEW TRANSLATION
 exchange_of_ideas_desc: "Nielen mince a zisk sa pohybujú po $silk_road$, ale aj myšlienky a poznanie idú v smere a protismere obchodníkov po jej trase." # todo: CHANGED
 legacy_of_great_empires: "Dedičstvo veľkých ríš" # todo: NEW TRANSLATION
 legacy_of_great_empires_desc: "Od dračieho trónu $china$, cez rozličné ríše $persia_region$, až po mocné $hindu_ADJ$ a $buddhist_ADJ$ dynastie $india$ a $south_east_asia$, $asia$ bola domovom mnohých mocných impérií v priebehu dejín." # todo: CHANGED
 arduous_terrain: "Náročný terén" # todo: NEW TRANSLATION
 arduous_terrain_desc: "$asia$ zahŕňa nehostinné krajiny — od vysokých štítov Himalájí po tristosopúštnu rozlohu Gobi a husté džungle $india$ a $south_east_asia$. A to ani nespomíname monzúnové a tajfúnové sezóny či takmer neustále zemetrasenia! Ľudia sa naučili žiť v takom nepriateľskom prostredí, no dobyvatelia budú mať veľmi ťažkú úlohu." # todo: CHANGED
 fertile_lands: "Úrodné krajiny" # todo: NEW TRANSLATION
 fertile_lands_desc: "Vo všeobecnosti sú krajiny $asia$ požehnané hojným dažďom a mnohými riekami. Okrem niektorých najaridnejších púštnych oblastí poskytuje naša zem dostatok potravy pre obyvateľstvo. Dokonca aj v tých regiónoch, kde to nie je, dokáže ľud s tým máloho veľa dosiahnuť." # todo: CHANGED
 crossroads_of_religions: "Krížovatka náboženstiev" # todo: NEW TRANSLATION
 crossroads_of_religions_desc: "$hindu$, $buddhist$, $muslim$ a dokonca $tengri$ sú náboženstvá, ktoré sa rozšírili mimo svoje pôvodné oblasti. $asia$ bola svedkom tejto výmeny presvedčení po stáročia a často to viedlo k miešaniu a synkretizmu medzi nimi." # todo: CHANGED
 religious_syncretism: "Náboženský synkretizmus" # todo: NEW TRANSLATION
 religious_syncretism_desc: "Interakcia medzi vierami občas vedie k syntéze namiesto odmietnutia. Cudzie myšlienky a praxe by sa preto nemali vnímať ako hrozba, ale ako príležitosť naučiť sa a prípadne začleniť cenné prvky do vlastnej tradície." # todo: CHANGED
 source_of_knowledge: "Zdroj poznania" # todo: NEW TRANSLATION
 source_of_knowledge_desc: "Zatiaľ čo cudzie národy sa pýšia vedúcimi pozíciami v poznaní a rozvoji, niektoré 'objavy' sú v $asia$ známe už stáročia. Od technologickej zručnosti $china$ po starodávnu literatúru $india$ — Východ nemá čo závidieť Západu." # todo: CHANGED
 structured_society: "Štruktúrovaná spoločnosť" # todo: NEW TRANSLATION
 structured_society_desc: "Náboženské a filozofické tradície, zvlášť $hindu$ a $SECT_CONFUCIANISM_NAME$, historicky ovplyvňovali sociálnu organizáciu v častiach $asia$, zdôrazňujúc plnenie predpísaných sociálnych úloh. Rigidita života v týchto systémoch je kompenzovaná relativne jednoduchým udržiavaním spoločenského poriadku." # todo: CHANGED
 incense_preeminence: "Preponderancia $incense$" # todo: CHANGED
 incense_preeminence_desc: "$incense$ bola súčasťou života v $asia$ po stáročia, možno viac než kdekoľvek inde. Hoci ho používajú aj iné náboženstvá pri rituáloch, jeho takmer všadeprítomnosť v $hindu_ADJ$ a $buddhist_ADJ$ obradoch, ako aj bežné použitie medzi $muslim$ ľudom, mu dáva stálu prítomnosť v celej $asia$." # todo: CHANGED
 incense_trade_route: "Trasa obchodu s $incense$" # todo: CHANGED
 incense_trade_route_desc: "Vysoký dopyt po $incense$, nielen v $asia$ ale aj mimo nej, vyžaduje vytvorenie obchodných trás venovaných jeho preprave. Podobne ako slávnejšia $silk_road$, tento obchod s $incense$ prepája Východ so Západom." # todo: CHANGED
 wake_of_the_mongol_horde: "Pozostalí po $MGE_ADJ$ hordách" # todo: CHANGED
 wake_of_the_mongol_horde_desc: "Takmer niet miesta v $asia$, ktoré by nepocítilo vplyv $MGE_ADJ$ dobytí. Po páde kedysi veľkej ríše zhotovenej $genghis_khan_name_no_tooltip$ konečne krajina pomaly ožíva po tom, čo bola prešľapkaná jeho koňmi." # todo: CHANGED
 cultural_melting_pot: "Kultúrny kotol" # todo: NEW TRANSLATION
 cultural_melting_pot_desc: "$asia$ je nesmierne rozmanitý región s množstvom kultúr. Táto rozmanitosť a výmena kultúrnych vplyvov umožnili našim krajinám vzkvetať v architektúre, hudbe, záhradníctve a ďalších oblastiach." # todo: CHANGED
 rise_of_great_individuals: "Vzostup veľkých osobností" # todo: NEW TRANSLATION
 rise_of_great_individuals_desc: "História dokazuje, že najvýnimočnejší jednotlivci vystúpia do popredia a dosiahnu veľké veci. Raz za čas impériá vznikli alebo padli rukou jedného vládcu, a takéto činy si zaslúžia úctu a obdiv." # todo: CHANGED
 the_pentarchy: "Pentarchia" # todo: NEW TRANSLATION
 the_pentarchy_desc: "Starý cirkevný poriadok formulovaný cisárom Justinianom je v $orthodox$ stále naplno v platnosti. Hoci patriarchát $rome$ sa považuje za nadradený, pre #italic autentickú#! Cirkev zostávajú mestá $constantinople$, $alexandria$, $antioch$ a $jerusalem$ podstatnejšie." # todo: CHANGED
 imperial_creed: "Cisársky credo" # todo: NEW TRANSLATION
 imperial_creed_desc: "$orthodox$ bola oficiálnym vierou Rímskej ríše od prijatia $christian$. Bludy Západu a ich falošní 'císaři' nemôžu spochybniť našu legitímnosť." # todo: CHANGED
 filioque_issue: "Problém Filioque" # todo: NEW TRANSLATION
 filioque_issue_desc: "Kacírske pridanie #italic Filioque#! doložky, ktorá tvrdí, že Duch Svätý vychádza z Otca 'a Syna', bolo uskutočnené bez zvolania príslušného ekumenického koncilu, a preto je nelegitímne. Sme strážcami pravého modlitby a $rome$ bude zatratené za ich kacírske bludy!" # todo: CHANGED
 septuagint: "Septuaginta" # todo: NEW TRANSLATION
 septuagint_desc: "Náš Starý zákon je zakódovaný v $greek_language$, v verzii známej ako $septuagint$, čo je preklad z $hebrew_language$ vykonaný v 3. storočí pred Kristom. Zostavil ho 72 izolovaných prekladateľov, ktorí každému presne rovnakým spôsobom preložili text. Je preto určite božím zjavením a priamym slovom Boha." # todo: CHANGED
 anagignoskomena: "Anagignoskomena" # todo: NEW TRANSLATION
 anagignoskomena_desc: "Naša Biblia obsahuje všetky knihy hodné úcty a štúdia, hoci niektoré môžu mať menší význam než iné. $anagignoskomena$ sa v $hebrew_language$ Biblii nenachádzajú, a preto sa im venuje menšia pozornosť, no sú napriek tomu hodné čítania a nemali by byť prehliadané." # todo: CHANGED
 church_guidance: "Vedenie Cirkvi" # todo: NEW TRANSLATION
 church_guidance_desc: "Písma sú slovom Božím, ale len Cirkev vie správne interpretovať ich význam a vzťahovať ho stádu. Akékoľvek samostatné čítanie alebo interpretácia Písiem mimo vedenia Cirkvi by len viedla k bludu a na cestu k heréze." # todo: CHANGED
 unchanging_tradition: "Nemenná tradícia" # todo: NEW TRANSLATION
 unchanging_tradition_desc: "Tradícia, ktorú nám odovzdali Ježiš Kristus a apoštoli, je konzistentná bez akýchkoľvek zmien, doplnení alebo výnimiek. Naša viera je neotrasiteľná vo svojich pravdách a to, čo je v tomto svete zásadné a pravdivé, nemôže byť zmenené ľudskou rukou." # todo: CHANGED
 church_councils: "Cirkovné koncily" # todo: NEW TRANSLATION
 church_councils_desc: "Keďže Cirkev musí byť zjednotená vo svojich úsudkoch, každá záležitosť príliš zložitá na to, aby ju vyriešil jediný biskup, si vyžaduje zvolanie koncilu, kde biskupi preskúmajú myslenie samotnej Cirkvi. Rozhodnutia koncilu tak budú odrážať konsenzus celej Cirkvi." # todo: CHANGED
 greek_rite: "$greek_culture$ rít" # todo: NEW TRANSLATION
 greek_rite_desc: "Naše obrady a kánonické praktiky boli stáročia dobre definované podľa rítov $greek_culture$ z $constantinople$. Hoci v niektorých miestach môžu existovať drobné odchýlky, v obradoch vykonávaných naprieč $orthodox$ panuje pozoruhodná homogenita." # todo: CHANGED
 physical_body_of_christ: "Fyzické telo Krista" # todo: NEW TRANSLATION
 physical_body_of_christ_desc: "Naša Cirkev je fyzickým prejavom Tela Kristovho na Zemi, bez rozdielu od toho nebeského. Ako taká je Cirkev telesným stelesnením Pána Spasiteľa, poslaným pre dobro svojho ľudu." # todo: CHANGED
 sight_veneration: "Uctievanie ikon" # todo: CHANGED
 sight_veneration_desc: "Najdôležitejším aspektom úcty je pripomínanie veriacim veľkých činov, zázrakov a postáv cez ich zmysly. Preto sú naše kostoly vyzdobené živými obrazmi a farbami, naplnené hudbou a voňajúce naším svätým kadidlom, aby prítomnosť Krista na Zemi mohla byť okamžite cítiť všetkými vnútri." # todo: CHANGED
 theotokos: "Theotokos" # todo: NEW TRANSLATION
 theotokos_desc: "Panna Mária je kľúčovou postavou v našom vierovyznaní, keďže naplnila Starú zmluvu tým, že v sebe nosila Novú zmluvu v osobe Krista. Ako nositeľka Krista vteleného Bohu bola doslova Matkou Božou a má vynikajúce postavenie nad všetkými ostatnými svätými." # todo: CHANGED
 heavenly_architecture: "Neboštrukturálna architektúra" # todo: NEW TRANSLATION
 heavenly_architecture_desc: "$orthodox_ADJ$ náboženské budovy sú navrhnuté na napodobnenie neba. Ich výstavba je sústredená okolo baziliky, centrálneho kupola, ktorý slúži ako strecha a symbolizuje nebo. Bohato zdobené krásnymi obrazmi a trblietavými zlatými ikonami sú skutočným zázrakom." # todo: CHANGED
 iconostasis: "Ikonostás" # todo: NEW TRANSLATION
 iconostasis_desc: "Jednou z kľúčových čŕt každého $orthodox_ADJ$ kostola je $iconostasis$, stena s ikonami, ktorá oddeľuje hlavné telo budovy od oltára. Ikony, ktoré obsahuje, slúžia ako vizualizácia spojenia medzi uctievačmi a Najsvätejším, a teda spojenia medzi Nebom a ľuďmi, usmerňujúc veriacich na cestu k nebu." # todo: CHANGED
 julian_calendar: "Juliánsky kalendár" # todo: NEW TRANSLATION
 julian_calendar_desc: "Čas našej krajiny a našej Cirkvi bol stáročia meraný $julian_calendar$, vydaným Juiliom Cézarom v roku 46 pred n. l. Nielen zjednocuje všetky východné $christian_ADJ$ národy, ale tiež určuje, kedy sa majú konať dôležité sviatky a oslavy." # todo: NEW TRANSLATION
 paschal_cycle: "Paschálny cyklus" # todo: NEW TRANSLATION
 paschal_cycle_desc: "$orthodox$ obsahuje niektoré pohyblivé sviatky okolo #italic Pascha#!, Veľkej noci, organizované v $paschal_cycle$. Desať týždňov pred Paschou sa nazýva #italic Triodion#!, zatiaľ čo päťdesiat dní po Pasche sa nazýva #italic Pentekostárion#!. Tento cyklus označuje najdôležitejšie oslavy v liturgickom roku." # todo: CHANGED
 oktoechos: "Oktōēchos" # todo: NEW TRANSLATION
 oktoechos_desc: "Októry modulový systém písania hudby, $oktoechos$ je systém, ktorý sa stal základom písania náboženských chantov a hudby pre Cirkev po stáročia. Je základom $orthodox_ADJ$ spevu, hoci s niektorými kultúrnymi odchýlkami." # todo: NEW TRANSLATION
 prestigious_monasticism: "Význačné mníšstvo" # todo: NEW TRANSLATION
 prestigious_monasticism_desc: "V $orthodox$ je mníšstvo a askéza vysoko cenené a takmer povinné. Každý biskup musí byť najprv mníchom; ak nie je, musí sa stať mníchom pred svojou vysviackou. Kláštory a centrá mníšstva tak majú veľký vplyv na náš kňazský život." # todo: NEW TRANSLATION
 national_rites: "Národné rity" # todo: NEW TRANSLATION
 national_rites_desc: "Prítomnosť rôznych autokefálnych patriarchátov v našej Cirkvi umožňuje určité variácie medzi národnými ritmi jednotlivých krajín. Jednota posolstva však zostáva, a Cirkev ako jedna entita nie je rozbitá." # todo: CHANGED
 heirs_of_rome: "Dediči Ríma" # todo: NEW TRANSLATION
 heirs_of_rome_desc: "Mnohí si nárokujú byť dedičmi Ríma a skutočne celého Rímskeho impéria. Avšak len naše náboženstvo je pravou vierou starého Impéria, a preto len my môžeme oprávnene tvrdiť, že sme jeho priamymi potomkami." # todo: CHANGED
 legacy_of_saint_andrew: "Dedičstvo svätého Ondreja" # todo: NEW TRANSLATION
 legacy_of_saint_andrew_desc: "Podľa legendy sám svätý Ondrej navštívil Skythiu a severné pobrežia $black_sea_area$, prorokujúc veľký rozkvet $christian$ keď dosiahol budúce miesto $kyiv$." # todo: CHANGED
 christianization_of_the_slavs: "Christianizácia Slovanov" # todo: NEW TRANSLATION
 christianization_of_the_slavs_desc: "Ľudia Kyjevskej Rusi boli medzi prvými východnými $slavic_group$ národmi, ktorí prijali svetlo Kristovo a konvertovali na $orthodox$. Odtiaľ sa viera rozšírila do celého regiónu." # todo: CHANGED
 cyril_and_methodius: "Cyril a Metod" # todo: NEW TRANSLATION
 cyril_and_methodius_desc: "Dvaja $BYZ_ADJ$ teológovia z 9. storočia, títo muži zohrali kľúčovú úlohu pri evanjelizácii Slovanov. Pripisuje sa im vytvorenie hlaholiky, prvého písma použitého na prepis $church_slavonic_language$, a ich nasledovníci neskôr vyvinuli cyriliku, pomenovanú na počesť Cyrila." # todo: CHANGED
 interaction_between_church_and_state: "Interakcia medzi cirkvou a štátom" # todo: NEW TRANSLATION
 interaction_between_church_and_state_desc: "Patriarcháty majú absolútnu autoritu nad vlastnými jurisdikciami a tým, ktorí v nich sídlia. Spojením ich autority s autoritou vládcu môžeme využiť zdroje Cirkvi a použiť ich na posilnenie štátnej moci." # todo: CHANGED
 outwards_expansion: "Expanzia von" # todo: NEW TRANSLATION
 outwards_expansion_desc: "Je svätým povolaním Cirkvi priniesť svetlo Kristovo pohanom a neveriacim. Musíme ísť za naše hranice niesť spásu každej zablúdenej duši!" # todo: CHANGED
 justified_holy_wars: "Oprávnené sväté vojny" # todo: NEW TRANSLATION
 justified_holy_wars_desc: "Nemôžeme dovoliť, aby pohania a heretici diktovali naše konanie. Je naším svätým povolaním očistiť krajinu od ich nečistoty, aby sa na Zemi mohol prejaviť pravý Boží poriadok." # todo: CHANGED
 resistance_to_the_infidels: "Odolnosť voči nevercom" # todo: NEW TRANSLATION
 resistance_to_the_infidels_desc: "Naši $orthodox_ADJ$ bratia sa niekedy nachádzali pod jarmom cudzích neveriacich. Avšak naučili sme sa znášať takéto utláčanie a dokonca žiť v mieri po boku týchto neveriacich." # todo: CHANGED
 eastern_ecumenism: "Východný ekumenizmus" # todo: NEW TRANSLATION
 eastern_ecumenism_desc: "$christian_ADJ$ denominácie zo Orientálnej ortodoxie sú pre neskúsených často zamieňané s Východným $orthodox$. Hoci sa v mnohých kľúčových bodoch líšia od nás, sú stále $christian_ADJ$ a naše početné spoločné rysy by mohli byť využité na ich návrat k správnej viere." # todo: CHANGED
 structured_patriarchates: "Štruktúrované patriarcháty" # todo: NEW TRANSLATION
 structured_patriarchates_desc: "Naše patriarcháty boli vždy dobre organizované a štruktúrované, každé so svojimi atribútmi a delimitáciami. To umožňuje lepšie fungovanie Cirkvi, čo vedie k lepšiemu fungovaniu štátu." # todo: CHANGED
 second_council_of_ephesus: "Druhý koncil v Efeze" # todo: NEW TRANSLATION
 second_council_of_ephesus_desc: "$second_council_of_ephesus$, zvolaný v roku 449 na podnet pápeža Dioscora z $alexandria$, bol legitímnym $christian_ADJ$ koncilom napriek jeho odsúdeniu $catholic_ADJ$ a $orthodox_ADJ$ Cirkvami. Na tomto koncile bola oficiálne prijatá formula Cyrila z Alexandrie — ktorá tvrdí, že Kristus je jedna vtelená prirodzenosť, zároveň ľudská i božská." # todo: CHANGED
 rejection_of_chalcedon: "Odmietnutie Chalcedonu" # todo: NEW TRANSLATION
 rejection_of_chalcedon_desc: "Keďže neprijali $second_council_of_ephesus$, koncil v Chalkedóne bol zvolaný na podnet pápeža Leva I., ktorý požadoval zrušenie $second_council_of_ephesus$. My tento falošný koncil odmietame a stojíme pri rozhodnutiach prijatých na pôvodnom koncile." # todo: CHANGED
 monophysite_vs_miaphysite: "Monofyzitizmus vs $miaphysite_ADJ$" # todo: NEW TRANSLATION
 monophysite_vs_miaphysite_desc: "Hoci $miaphysite$ tiež vyhlasuje, že Kristova osoba má len jednu prirodzenosť, líši sa podstatne od eutychianistického monofyzitického názoru, ktorý tvrdí, že ľudskosť Krista bola pohltená jeho božstvom. Aj keď niektorí nás nazývajú nasledovníkmi monofyzitizmu, ide skôr o slovnú zhodu; v podstate sú naše názory jasne odlišné." # todo: NEW TRANSLATION
 original_christianity: "Pôvodné $christian$" # todo: NEW TRANSLATION
 original_christianity_desc: "V $christian_ADJ$ svete bolo mnoho schiziem a rozdelení, no naše vyznanie siaha korene k pôvodnému pravému $christian$ formulovanému na Prvom nikajskom koncile. Každé odštiepenie od hlavnej vetvy po tomto bode je len herézou." # todo: CHANGED
 beyond_the_borders: "Za hranicami" # todo: NEW TRANSLATION
 beyond_the_borders_desc: "$christian$ nepochybne vzniklo v kolíske Rímskej ríše a mnohé jeho vetvy zostali spokojné zostať v tom regióne. $miaphysite$, však, po odsúdení chalkedóncami zostalo na okrajoch Impéria a rozšírilo sa ďaleko za svoje miesto pôvodu, prinášajúc svetlo Božie do najodľahlejších miest." # todo: CHANGED
 isolated_reaches: "Izolované kraje" # todo: NEW TRANSLATION
 isolated_reaches_desc: "$miaphysite$ sa podarilo rozšíriť do veľmi vzdialených oblastí. Aj keď sme obklopení nepriateľmi a heretikmi, naša viera zostala silná." # todo: CHANGED
 independent_leaders: "Nezávislí vodcovia" # todo: NEW TRANSLATION
 independent_leaders_desc: "V dôsledku izolácie $miaphysite$ bolo niekedy ťažké nadviazať kontakt s ostatnými patriarchátmi. Preto sa naši vodcovia naučili konať samostatne, pričom sa zároveň snažia udržiavať kontakty so zvyškom $christian_ADJ$ sveta, pokiaľ je to možné." # todo: CHANGED
 jerusalem_focus: "Zameranie na $jerusalem$" # todo: NEW TRANSLATION
 jerusalem_focus_desc: "Sväté mesto $jerusalem$ máme vždy na mysli, lebo nielenže tam Ježiš kázal a zomrel, ale aj tam sa vráti pri svojom Druhom príchode. Preto vždy radi smerujeme modlitby smerom k $jerusalem$, nech sme kdekoľvek." # todo: CHANGED
 acceptance_of_old_testament: "Prijatie Starého zákona" # todo: NEW TRANSLATION
 acceptance_of_old_testament_desc: "Niektoré $christian_ADJ$ denominácie rozhodli znížiť dôležitosť Starého zákona, tvrdiac, že príchod Ježiša ho úplne nahrádza. My však trváme na tom, že je stále relevantný a niektoré inštrukcie v ňom sú rovnako platné ako v čase, keď boli napísané." # todo: CHANGED
 primacy_of_alexandria: "Primát $alexandria$" # todo: NEW TRANSLATION
 primacy_of_alexandria_desc: "Hoci $miaphysite$ má mnoho vetiev a nezávislých vodcov, uznávame $alexandria$ a jeho sídlo ako nášho duchovného vodcu. Toto je však prejav úcty voči apoštolskému stolcu a spôsob, ako ho poctiť, nie udelenie nejakých osobitných privilégií." # todo: CHANGED
 school_of_alexandria: "Škola $alexandria$" # todo: NEW TRANSLATION
 school_of_alexandria_desc: "Katechetická $school_of_alexandria$, údajne založená sám apoštolom Markom, je najstaršou školou katechizmu na svete. Tam sa biblické a teologické štúdiá učili od začiatku samotného $christian$. Hoci škola sama bola zničená, keď biskup $rome$ bol vyhlásený za nadradeného patriarchovi z $alexandria$, jej tradícia pretrvala." # todo: CHANGED
 preserving_of_local_languages: "Zachovanie miestnych jazykov" # todo: CHANGED
 preserving_of_local_languages_desc: "Napriek dôležitosti $greek_language$ a $latin_language$ v ranom $christian$ si $miaphysite$ zachovalo liturgiu v miestnych nárečiach, ako sú $coptic_language$, $aramaic_language$ a $armenian_language$. Tieto jazyky sú vznešené samy o sebe a každá $miaphysite_ADJ$ vetva si uchováva svoj historický jazyk." # todo: CHANGED
 double_patriarchate: "Dvojité patriarchát" # todo: NEW TRANSLATION
 double_patriarchate_desc: "Obe $alexandria$ aj $antioch$ sa považujú za majúce dva odlišné patriarcháty, jeden pre $miaphysite$ a druhý pre $orthodox$. Hoci obaja môžu nárokovať legitímnosť, len $miaphysite$ zachováva pravé patriarcháty." # todo: CHANGED
 eastern_christianity: "Východné $christian$" # todo: NEW TRANSLATION
 eastern_christianity_desc: "Súčasťou sme vetvy takzvaného $eastern_christianity$, ktorá spája mnohé odlišné denominácie s rôznymi teologickými a liturgickými tradíciami, ale aj so spoločnými kultúrnymi aspektmi." # todo: CHANGED
 life_among_infidels: "Život medzi neveriacimi" # todo: CHANGED
 life_among_infidels_desc: "Krajiny veriacich boli často znečistené prítomnosťou neveriacich, no práve preto naši klerici vykročili do neznáma prinášať svetlo Ježiša do vzdialených krajín. Tieto straty však ovplyvnili márne duše viac spôsobmi, než by sa očakávalo, aj keď sme ich nedokázali presvedčiť o omyle ich presvedčení." # todo: CHANGED
 gradual_departure: "Postupné odchádzanie" # todo: NEW TRANSLATION
 gradual_departure_desc: "Hoci nás rýchlo označili za heretikov, $miaphysite$ nepretrhlo zväzky so zvyškom $christian_ADJ$ sveta okamžite. Udržiavali sme kontakt s ostatnými patriarchátmi a zúčastňovali sme sa koncilov, no postupne sa ukázalo, že $miaphysite$ je príliš odlišné od tých heretických názorov." # todo: CHANGED
 thrive_under_persecution: "Vzrastanie pod prenasledovaním" # todo: CHANGED
 thrive_under_persecution_desc: "Hoci boli naši veriaci po stáročia prenasledovaní heretikmi, naše učenie pretrvalo. Nezáleží na tom, koľkokrát nás zrazia, my sa znovu postavíme!" # todo: CHANGED
 preserver_of_national_identity: "Strážca národnej identity" # todo: NEW TRANSLATION
 preserver_of_national_identity_desc: "V dôsledku našej histórie prenasledovania a utláčania sa Cirkev stala zodpovednou za uchovávanie našej identity. V náručí Cirkvi boli naše jazyky a tradície uchované v bezpečí, a preto máme neotrasiteľnú dôveru v túto inštitúciu." # todo: CHANGED
 defense_against_heretics: "Ochrana proti heretikom" # todo: NEW TRANSLATION
 defense_against_heretics_desc: "Odkedy sme sa odtrhli od ostatných $christian_ADJ$ vierovyznaní, heretici nás mnohokrát obvinili a odsúdili. Môžu sa nazývať $christian_ADJ$, ale ich názory sú zjavne skreslené, zatiaľ čo náš pohľad je jasný svetlom Božím." # todo: CHANGED
 remote_patriarchates: "Vzdialené patriarcháty" # todo: NEW TRANSLATION
 remote_patriarchates_desc: "Dobytie a prenasledovanie opakovane nútili naše patriarcháty presúvať sa po páde ich stolíc do rúk pohanských dobyvateľov. Hoci teraz pôsobíme z nových lokalít, pôvodné sídla zostávajú duchovne uctievané v našej tradícii, hoci z diaľky." # todo: CHANGED
 further_reaches: "Ďaleké kraje" # todo: NEW TRANSLATION
 further_reaches_desc: "Napriek mnohým pokusom neveriacich zastaviť šírenie našej viery, tá sa predsa len dostala k mnohým rôznym národom a kultúram, prinášajúc svetlo všade, kam prišla." # todo: CHANGED
 internal_communion: "Vnútorné spoločenstvo" # todo: NEW TRANSLATION
 internal_communion_desc: "Napriek nezávislým patriarchom si všetky vetvy $miaphysite$ udržiavajú vzájomnú komuniu. To im pomáha budovať vzťahy medzi sebou a podporuje jednotu v Cirkvi." # todo: CHANGED
 cradle_of_monasticism: "Kolíska mníšstva" # todo: NEW TRANSLATION
 cradle_of_monasticism_desc: "Monasticizmus v $christian$ sa zrodil v $egypt_region$, keď sa $christian_ADJ$ veriaci uchýlili do púšte, aby sa modlili a zasvätili svoje životy Bohu. $miaphysite$ tak môže nárokovať túto históriu ako svoju prostredníctvom alexandrijskej tradície." # todo: CHANGED
 unique_architecture: "Jedinečná architektúra" # todo: NEW TRANSLATION
 unique_architecture_desc: "Relatívna izolácia našich patriarchátov viedla k rozvoju jedinečných architektonických štýlov pre naše sväté miesta. Hoci iné $christian_ADJ$ denominácie môžu byť prominentnejšie, naša fascinujúca architektúra je inšpiráciou pre veriacich." # todo: CHANGED
 medicinal_infusions: "Liečivé nálevy" # todo: NEW TRANSLATION
 medicinal_infusions_desc: "Liečivé vlastnosti niektorých rastlín pomohli našim ľuďom prekonávať rôzne choroby po stáročia. Napári z určitých listov vraj dokonca predlžujú životy našich ľudí." # todo: CHANGED
 canoe_travels: "Kanue" # todo: NEW TRANSLATION
 canoe_travels_desc: "Ľahké kanoe sú dokonale prispôsobené vodným cestám $north_america$. Tieto plavidlá dokážu preplávať plytké rieky a sú dostatočne ľahké na prenášanie — portáž — keď je to potrebné. Týmto spôsobom môžeme premeniť nesúvislé vodné toky na plnohodnotné obchodné trasy, čím uľahčíme tok obchodu a ľudí." # todo: CHANGED
 seasonal_economy: "Sezónna ekonomika" # todo: NEW TRANSLATION
 seasonal_economy_desc: "V ťažkých časoch sa musíme naučiť vytrvať v živote, a život je synonymom prírody. Zmena ročných období si vyžaduje zmenu nášho spôsobu života; dediny musia byť prispôsobivé a mobilné." # todo: CHANGED
 fishing_habits: "Rybárske zvyky" # todo: NEW TRANSLATION
 fishing_habits_desc: "Niekedy je ťažké uveriť, že niektorí z našich ľudí sa narodili na zemi a nie vo vode, pretože ich telá plávajú s takou obratnosťou, že je takmer nemožné odlíšiť ich od prúdu rieky. V dôsledku toho sme odborníci na rybolov." # todo: CHANGED
 whale_hunters: "Lovci veľrýb" # todo: NEW TRANSLATION
 whale_hunters_desc: "Veľryby, delfíny, mrože, tulene... všetko, čo nám more dáva, lovíme." # todo: CHANGED
 moundbuilding_advance: "Stavitelia mohýl" # todo: NEW TRANSLATION
 moundbuilding_advance_desc: "Ceremoniálne kopce postavené našimi predkami sú monumentmi ich sofistikovaných zemných inžinierskych zručností. Zapojením týchto kopcov do plánovania našej infraštruktúry zachováme určujúcu tradíciu našej civilizácie." # todo: CHANGED
 bison_hunters: "Lovci bizónov" # todo: NEW TRANSLATION
 bison_hunters_desc: "Bizon je rozhodujúcim zdrojom pre náš ľud. Každú časť zvieraťa používame ako poctu jeho obeti. Kŕmime našich ľudí jeho mäsom, kosti používame na nástroje; kožu využívame na ochranu pred chladom a kožušiny na oblečenie. Dokonca aj duša zvieraťa má pre nás symbolický význam. Taký je význam bizona pre našu kultúru, že by sme sa bez nich cítili stratení." # todo: CHANGED
 federal_constitution: "Budovatelia federácie" # todo: NEW TRANSLATION
 federal_constitution_desc: "Mali by sme sa zjednotiť s inými skupinami našich príbuzných a vytvoriť federáciu, ktorá bude na prvom mieste klásť vzájomnú dôveru a rozvoj." # todo: CHANGED
 shared_knowledge: "Zdieľané poznanie" # todo: NEW TRANSLATION
 shared_knowledge_desc: "Inovácia môže prísť v mnohých formách a ak chceme predbehnúť konkurenčné kmene, budeme musieť preskúmať každú výhodu, ktorú môžeme získať." # todo: CHANGED
 slash_and_burn: "Pálené políčko (slash-and-burn)" # todo: NEW TRANSLATION
 slash_and_burn_desc: "Poľnohospodárska technika, ktorá zahŕňa strategické kosenie a pálenie vegetácie za účelom získania vrstvy výživného popola, ktorý hnojí pôdu pod ním a robí ju vynikajúcou pre pestovanie plodín. Naučili sme sa, že pôda po tejto metóde zosilnie, ako kosť po zlomení." # todo: CHANGED
 council_of_elders: "Rada starších" # todo: NEW TRANSLATION
 council_of_elders_desc: "Naša kmeňová vláda zabezpečuje, že každý má v nej hlas a rovnaké slovo pri rozhodovaní o kľúčových záležitostiach. Táto spoločná správa nás nabáda zvažovať nové perspektívy." # todo: CHANGED
 experienced_fur_hunters: "$fur$ obchod" # todo: CHANGED
 experienced_fur_hunters_desc: "Obchodovanie s $fur$ s ostatnými kmeňmi a cudzincami je neoddeliteľnou súčasťou našej ekonomiky. Veľmi si ceníme naše lovectvo a preto dokážeme dodať kožušiny najvyššej kvality." # todo: CHANGED
 pyramid_architecture: "Pyramídová architektúra" # todo: NEW TRANSLATION
 pyramid_architecture_desc: "Naši predkovia konštruovali obrovské kamenné pyramídy v dávnych časoch Teōtīhuacān, Tik'al, Copan a Palenque. Nezabudli sme umenie stavať pyramídy a môžeme v tejto tradícii pokračovať." # todo: CHANGED
 ball_game: "Tlachtli" # todo: NEW TRANSLATION
 ball_game_desc: "Srdcom spoločenského života v našej spoločnosti je lopta, pri ktorej sa hráči snažia udržať loptu v hranom dvore udieraním ju bokmi. Je to rituálna alternatíva k vojne a zároveň veľká súčasť náboženského života." # todo: CHANGED
 war_bonfires: "Vojnové vatry" # todo: NEW TRANSLATION
 war_bonfires_desc: "Siet' pohraničných osád prepojených obrovskými vatrami, ktoré sú zažiate viditeľné z veľkej vzdialenosti, nám umožní rýchlo upozorniť viaceré osady na hrozby a tým pádom reagovať oveľa rýchlejšie." # todo: CHANGED
 merchant_officials: "Obchodní úradníci" # todo: NEW TRANSLATION
 merchant_officials_desc: "Obchodníci a ich obchodovanie významne prispievajú k národnému príjmu. Obchodníci sú však zároveň vynikajúcimi zdrojmi informácií, pretože často majú možnosť priamo pozorovať situáciu u susedov. Udelením im oficiálnych rolí v vláde môžeme využiť ich poznatky a mobilitu v náš prospech." # todo: CHANGED
 copperworking: "Spracovanie medi" # todo: NEW TRANSLATION
 copperworking_desc: "Naši remeselníci začali vyrábať nástroje z $copper$, vzácneho kovu, ktorý sa nachádza po celom našom území. Ak sa ovládneme túto zručnosť, poskytne nám to obrovskú výhodu oproti susedom." # todo: CHANGED
 system_of_tributaries: "Systém tributárnych štátov" # todo: NEW TRANSLATION
 system_of_tributaries_desc: "Priama vláda si vyžaduje rozsiahle investície do podmanenia a pacifikácie konkurenčných skupín. Inštalovaním lojálneho miestneho úradníka, ktorý bude vládnuť lokálne a platiť ročný tribut, eliminujeme hrozby z akéhokoľvek súperiaceho $altepetl$ a pritom naplníme našu pokladnicu." # todo: CHANGED
 refined_obsidian_weaponry: "Obsidianové zbrane" # todo: NEW TRANSLATION
 refined_obsidian_weaponry_desc: "Obsidian je vynikajúci materiál na výrobu všetkých druhov nástrojov a zbraní. Tvrdá, sklovitá hornina drží ostrie výborne, čo uľahčuje výrobu čepeľí, hrotov kopál alebo šípov, ktoré zanechávajú smrteľné rany na nepriateľovi." # todo: CHANGED
 precious_stones_art: "Rezbarstvo drahých kameňov" # todo: CHANGED
 precious_stones_art_desc: "Náš región je bohatý na drahé kamene, ktoré sú vynikajúce na pridanie farby, detailov a lesku do umeleckých diel a bežných predmetov. Naši remeselníci sa skrze tieto trblietavé drahokamy zvečnia a vytvoria veľké monumenty našej kultúry." # todo: CHANGED
 cultivate_the_land: "Obrábajme pôdu" # todo: CHANGED
 cultivate_the_land_desc: "Džungľa je nehostinné prostredie na život, obzvlášť pre poľnohospodárske kultúry. Vyčistenie častí džungle na ornú pôdu je preto jednou z našich najdôležitejších úloh. Musíme zorganizovať ľud tak, aby sme mohli nasadiť veľké pracovné sily na tieto práce vždy, keď to bude potrebné." # todo: CHANGED
 feathered_serpent: "Piernatý had" # todo: NEW TRANSLATION
 feathered_serpent_desc: "Legenda o Pierokradovom hadovi je známou po celých našich krajinách. Hoci táto postava predstavuje pre mnohých rôzne veci — ako Quetzalcōātl medzi $nahua_group$, K'uk'ulkan medzi $maya_language$ alebo Q'uq'umatz medzi $kiche_culture$ — je to zjednocujúca postava pre všetkých." # todo: CHANGED
 ritual_bloodletting: "Rituálne krvácanie" # todo: NEW TRANSLATION
 ritual_bloodletting_desc: "Mnohé kultúry v tomto regióne považujú rituálne obety a krvácanie zo strany vládcu za spôsob kladenia úcty bohom. Zachovávanie tejto tradície poteší bohov a potvrdí naše právo vládnuť cez božský dar." # todo: CHANGED
 valley_irrigation: "Medzúdolné zavlažovanie" # todo: NEW TRANSLATION
 valley_irrigation_desc: "Vybudovaním rozsiahlych sietí kanálov a prepojením vodných tokov údolí našej domoviny môžeme značne zlepšiť zavlažovanie a produktivitu našich polí." # todo: CHANGED
 artisan_migration: "Presídlenie remeselníkov" # todo: CHANGED
 artisan_migration_desc: "Nie je správne, aby dobyté územia mali lepších remeselníkov a múdrejších poradcov než naše hlavné mesto. Najlepšie ruky a mysle impéria musia byť privezené do hlavného mesta, aby nám slúžili priamo." # todo: CHANGED
 terrace_farming: "Poľnohospodárstvo na terasách" # todo: NEW TRANSLATION
 terrace_farming_desc: "Aby sme maximálne využili obmedzený priestor v našich vysočinách, vyvinuli sme terasové polia — sériu stupňovitých polí na svahoch hôr — a lepšie techniky zavlažovania." # todo: CHANGED
 mountain_cities: "Pevnosti na vrcholkoch" # todo: NEW TRANSLATION
 mountain_cities_desc: "Naše mestá a pevnosti zaberajú vrcholky obrovských hôr, ďaleko nad mraky. Predstavujú obrovskú prekážku pre každého, kto by nás chcel napadnúť." # todo: CHANGED
 river_trade: "Riečny obchod" # todo: NEW TRANSLATION
 river_trade_desc: "Bohatstvo našich veľkých riek a morí vždy živiť našich ľudí. Prijmime riečny obchod a chráňme množstvo obchodníkov, ktorí putujú pozdĺž pobrežia k ústiu veľkej rieky, aby nám nikdy nechýbali kvalitné tovary, ktoré nám prinášajú." # todo: CHANGED
 rainforests_and_mountaintops: "Dážďové pralesy a horské vrcholy" # todo: NEW TRANSLATION
 rainforests_and_mountaintops_desc: "Dážďové pralesy a hory našej zeme sú plné života. Okrem duchov lesov tu žijú jaguáre, anakondy, tarantuly a množstvo ďalších zvierat, ktoré pre tých, čo ich poznajú, predstavujú malú priame nebezpečenstvo. Pre útočiaceho nepriateľa však môžu tieto krajiny pôsobiť ako pevnosť a divé zvieratá ako jej obrancovia." # todo: CHANGED
 knot_system: "Systém uzlov" # todo: NEW TRANSLATION
 knot_system_desc: "Použitím usporiadaní šnúrok a uzlov na zaznamenávanie informácií môžeme výrazne uľahčiť správu našich krajín a vedenie presných záznamov o dôležitých údajoch." # todo: CHANGED
 llama_farming: "Chov ľám" # todo: CHANGED
 llama_farming_desc: "Naše obrovské stáda lám nám poskytujú látky na oblečenie, mäso na kŕmenie a ťahové zvieratá na prenášanie bremien. Sú pre nás naozaj neoceniteľné." # todo: CHANGED
 mountain_roads: "Sieť horských ciest" # todo: NEW TRANSLATION
 mountain_roads_desc: "Aby sme uľahčili distribúciu tovaru, je potrebná veľká sieť horských ciest spájajúcich vzdialené údolia a prechádzajúcich hlbokými tiesňavami. Postavme ich." # todo: CHANGED
 tears_of_the_sun: "Slzy Slnka" # todo: NEW TRANSLATION
 tears_of_the_sun_desc: "Hoci dobrodruhovia z ďalekých krajín snívajú o nájdení skrytého zlata na horských chodníkoch vysokých Ánd, pre nás má toto žlté kovanie väčší umelecký a posvätný význam než čisto ekonomickú hodnotu." # todo: NEW TRANSLATION
 hidden_cities: "Skryté mestá" # todo: NEW TRANSLATION
 hidden_cities_desc: "V zemi obrovských vrcholov a nepreniknuteľných dažďových pralesov sú mnohé naše mestá takmer neprístupné pre cudzincov. Môžu zostať skryté celé storočia, zabudnuté svetom." # todo: NEW TRANSLATION
 potato_production: "Produkcia zemiakov" # todo: NEW TRANSLATION
 potato_production_desc: "Keďže kukurica rastie slabo na vysokých plošinách našej zeme, naučili sme sa spoliehať na výživné korene miestnej rastliny. Zvýšením produkcie môžeme nakŕmiť náš ľud a našich bojovníkov touto ľahko udržiavateľnou plodinou." # todo: CHANGED
 head_hunters: "Lovci lebiek" # todo: NEW TRANSLATION
 head_hunters_desc: "Dobývanie území od slabších národov je nevyhnutným zlom v našom štáte. Tieto okolnosti vytvorili jedinečný vojenský kódex, podľa ktorého je zajatie nepriateľa nažive najvyšším prejavom odvahy a statočnosti. Vďaka tomu sú naši ľudia známi majstrovstvom v živom zajímaní." # todo: CHANGED
 border_raiders: "Zruční nájazdníci" # todo: NEW TRANSLATION
 border_raiders_desc: "Naši nájazdníci sú preslávení schopnosťou viesť bleskové útoky na nič netušiacich nepriateľov. Ich rýchlosť a schopnosť vyhnúť sa odvetnej reakcii by mali byť študované a využité aj našimi pravidelnými vojskami." # todo: CHANGED
 lva_baltic_forestry: "Baltské lesníctvo" # todo: NEW TRANSLATION
 lva_baltic_forestry_desc: "Naše lesy sú životne dôležitým zdrojom, poskytujú drevo na výstavbu a palivo. Musíme ich múdro spravovať, aby sme zabezpečili ich trvalú hojnosť." # todo: NEW TRANSLATION
 lva_baltic_forts: "Baltské pevnosti" # todo: NEW TRANSLATION
 lva_baltic_forts_desc: "Naša sieť pevností a hradov roztrúsených po krajine poskytuje prvú líniu obrany proti votrelcom. Tieto pevnosti nám umožňujú monitorovať a kontrolovať kľúčové trasy cez Baltské more." # todo: NEW TRANSLATION
 irish_travelling_bards_advance: "Putujúci bardovia" # todo: NEW TRANSLATION
 irish_travelling_bards_advance_desc: "Tradiční básnici vycvičení v dvornej kultúre prechádzajú našimi krajinami a hľadajú pána, ktorý by ich zamestnal." # todo: NEW TRANSLATION
 irish_booleying_advance: "Booleying dobytka" # todo: NEW TRANSLATION
 irish_booleying_advance_desc: "V $IRE$ je chov dobytka naším spôsobom života. Ušľachtilý hovädzí dobytok nie je len zdrojom potravy, ale symbolom bohatstva. Praktikou #italic booleying#!, systémom presunu našich stád z jedného vzdialeného pastviny na druhú, môžeme toto bohatstvo rozmnožiť." # todo: CHANGED
 irish_monastacism_advance: "Ostrovné mníšstvo" # todo: NEW TRANSLATION
 irish_monastacism_advance_desc: "Hoci sme teraz v zásade zjednotení s rímskymi $catholic_ADJ$ praktikami, náboženský život na našich ostrovoch stále kladie veľký dôraz na svetské kleriky." # todo: CHANGED
 guards_of_the_shannon_advance: "Stráže Shannonu" # todo: NEW TRANSLATION
 guards_of_the_shannon_advance_desc: "Pevnosť Athlone, stojaca nad mohutnou riekou Shannon, je kľúčom k ovládaniu srdca $IRE$. O'Kellyovci z $HYM$, dlhoroční páni týchto krajín, tvrdo bojovali na obranu svojich držieb proti $norman$ nájazdom." # todo: CHANGED
 hiberno_norman_keeps_advance: "Hiberno-normanské bašty" # todo: NEW TRANSLATION
 hiberno_norman_keeps_advance_desc: "Naši $norman$ predkovia postavili nádherné veže, aby udržali kontrolu nad nepriateľským vnútrom $IRE$." # todo: CHANGED
 irish_frontier_settlement_advance: "$IRE_ADJ$ pohraničné osady" # todo: CHANGED
 irish_frontier_settlement_advance_desc: "Zem, ktorú sme vydobyli od $IRE_ADJ$, je zrelá na využitie. Musíme len zabezpečiť, aby sem migrovali správni ľudia a osídlili tieto lacné statky." # todo: CHANGED
 celtic_raiders_advance: "Keltský hnev" # todo: NEW TRANSLATION
 celtic_raiders_advance_desc: "Po tisícročia naše divoké a obratné guerillové boje sužovali našich nepriateľov, premáhajúc ich ničivou sériou obratných šarvátok a hrôzostrašných nájazdov." # todo: CHANGED
 ple_pale_defenseworks_advance: "Pale — obranné práce" # todo: NEW TRANSLATION
 ple_pale_defenseworks_advance_desc: "Naša hranica je definovaná ľahkými obrannými prácami hrádzí a palisád navrhnutých na odrážanie našich nepokojov vyvolávajúcich susedov od spustenia otravujúcich nájazdov." # todo: CHANGED
 ple_irish_viking_towns_advance: "Staré vikingské mestá" # todo: NEW TRANSLATION
 ple_irish_viking_towns_advance_desc: "Staré obchodné prístavy založené Ostmenmi sú stále rušnými centrami obchodnej činnosti, kde môžu šikovní nadobudnúť bohatstvo." # todo: NEW TRANSLATION
 cel_defensive: "Kopce hovoria keltsky" # todo: NEW TRANSLATION
 cel_defensive_desc: "Storočia života v tieni dobytia naučili našich bojovníkov umeniu trpezlivosti a odolnosti. Môžeme sa vrhnúť do nebezpečenstva, ale vieme aj vytrvať, brániť sa a udeľovať úder len vtedy, keď to má zmysel." # todo: CHANGED
 cel_western_shore: "Západné pobrežie" # todo: NEW TRANSLATION
 cel_western_shore_desc: "Tisíce rokov sme rybárčili, obchodovali a bojovali pozdĺž divokých atlantických pobreží. Z týchto drsných vôd sme sa naučili námorníctvo, ktoré nemá konkurenciu." # todo: CHANGED
 cel_the_wests_awake: "Západ sa prebúdza" # todo: NEW TRANSLATION
 cel_the_wests_awake_desc: "Po dlhých storočiach ticha sa starodávny duch keltských národov opäť prebúdza, pripravený získať späť svoje miesto medzi veľkými civilizáciami sveta." # todo: NEW TRANSLATION
 cel_celtic_nations: "Keltské národy" # todo: NEW TRANSLATION
 cel_celtic_nations_desc: "Naše zjednotenie stojí na ideáli spojenectva rozmanitých ľudí keltského sveta pod spoločným práporným znakom. Prostredníctvom spolupráce chceme uchovať naše dedičstvo, podporovať naše hodnoty a zabezpečiť, aby keltské národy v čase vonkajších tlakov a zmien prosperovali spoločne." # todo: NEW TRANSLATION
 cel_celtic_diaspora: "Keltská diaspora" # todo: NEW TRANSLATION
 cel_celtic_diaspora_desc: "Od drobného gazdu po náčelníka mnohí opustili naše brehy v dôsledku tiesní či nádeje, tkaním rozsiahlej siete príbuzenských väzieb, ktorá šíri náš jazyk, zvyky a hrdosť do vzdialených krajín." # todo: NEW TRANSLATION
 cel_pan_celtic_nationalism: "Pan-keltizmus" # todo: NEW TRANSLATION
 cel_pan_celtic_nationalism_desc: "Naša vízia zjednoteného keltského sveta je viac než ideál — je to výzva pre všetkých, ktorí zdieľajú naše dedičstvo. Spoločne tvoríme putá, ktoré presahujú hranice, čím robíme našu identitu takou trvácnou ako kopce a moria, ktoré voláme domovom." # todo: NEW TRANSLATION
 ire_grand_jury_system: "Systém veľkej poroty" # todo: NEW TRANSLATION
 ire_grand_jury_system_desc: "Krajinné veľké poroty ukladajú poplatky na cesty, mosty a súdne budovy. S sudcami jazdiacimi na assize sa dohľad sprísňuje v každom hrabstve." # todo: NEW TRANSLATION
 ire_irish_establishment: "$IRE_ADJ$ zriadenie" # todo: CHANGED
 ire_irish_establishment_desc: "Trvalá armáda v $IRE$ — a kontrolovaná #italic z#! Írska — udržiava posádky pripravené a náklady nízko. Pre našu pravidelnú armádu to znamená pravidelný plat. Pre našich logistikov a intendantov to znamená rastúcu sieť kasární, ktorá udrží náklady pod kontrolou." # todo: CHANGED
 ire_irish_volunteers: "$IRE_ADJ$ dobrovoľníci" # todo: CHANGED
 ire_irish_volunteers_desc: "Občianske zbory sú zriadené na domovskú obranu a pobrežné stráženie. Cvičiac na vlastné náklady, prebúdzajú verejnú morálku a spevňujú radu." # todo: NEW TRANSLATION
 legacy_of_the_normans: "Dedičstvo $norman$" # todo: CHANGED
 legacy_of_the_normans_desc: "Kovaná v ohni dobytia, $SIC_ADJ$ $norman$ armáda skombinovala nezastaviteľný nápor $norman$ rytierov so strategickou sofistikovanosťou $BYZ_ADJ$, arabského a $lombard$ vojenského umenia. Pánmi bojovej zúrivosti i taktickej pružnosti si vybudovali kráľovstvo na križovatke civilizácií." # todo: CHANGED
 sic_constitions_of_melfi: "Konštitúcie z Melfi" # todo: NEW TRANSLATION
 sic_constitions_of_melfi_desc: "Cisár Fridrich II., hohenštaufenský kráľ $SIC$, zostavil právny kódex pre $SIC$ známy ako Konštitúcie z Melfi, alebo #italic Liber Augustalis#!. Dodnes používaný, predstavuje pevný základ vládnutia nášho štátu, regulujúc verejné právo, súdny postup a feudálne, súkromné a trestné právo." # todo: CHANGED
 sic_studium_generale: "Studium Generale" # todo: NEW TRANSLATION
 sic_studium_generale_desc: "Založená kráľom Alfonzom V. z $ARA$, univerzita v $catania$ bola najstaršia v $SIC$ a jednou z mála južných inštitúcií s plným štatútom #italic Studium Generale#!. Vďaka kráľovskej listine a spojeniu scholastického a právneho vzdelania vychovala juristov, teológov a vedcov, ktorí slúžili Cirkvi aj Korune v kultúrne rozmanitom regióne." # todo: CHANGED
 sic_naval_vigilance: "Námorná ostražitosť" # todo: NEW TRANSLATION
 sic_naval_vigilance_desc: "Neustále nájazdy barbareských pirátov a $TUR_ADJ$ lodí prinútili $SIC$ udržiavať bdelú pobrežnú obranu. Jeho galeje a pevnosti sa stali kľúčovými na ochranu južného $europe$." # todo: CHANGED
 sic_sicilian_silk: "$SIC_ADJ$ $silk$" # todo: CHANGED
 sic_sicilian_silk_desc: "V časoch Fridricha II. bol $silk$ hlavným exportom $SIC$. Hoci náš priemysel na výrobu $silk$ postupom času upadol a produkcia bola prekonaná severnými $ITA_ADJ$ štátmi, nie je dôvod, prečo by sa nemohol opäť povzniesť. Investíciou do našej výroby $silk$ môžeme opäť rozkvitnúť pracovníkov a remeselníkov." # todo: CHANGED
 sic_sicilian_enlightenment: "$SIC_ADJ$ osvietenstvo" # todo: CHANGED
 sic_sicilian_enlightenment_desc: "Hoci vzdialené od veľkých salónov $paris$ alebo $vienna$, $SIC$ rozvíjalo vlastné osvietenstvo. Intelektuáli spochybňovali feudálne privilégiá, podporovali vedu a presadzovali právne reformy, často v rámci $catholic_ADJ$ humanizmu. Tieto myšlienky položili základy modernity v tieni monarchie a tradície." # todo: CHANGED
 sic_sicilian_reforms: "$SIC_ADJ$ reformy" # todo: CHANGED
 sic_sicilian_reforms_desc: "S časom naše inštitúcie zostarli alebo sa stali neefektívnymi. Reformy sú nevyhnutné, ak chceme, aby naša krajina prosperovala. Naše najlepšie mysle budú tvrdo pracovať, aby sa zabránilo plytvaniu a aby naše procesy boli čo najefektívnejšie." # todo: CHANGED
 nomadic_tendencies: "Nomádske sklony" # todo: NEW TRANSLATION
 nomadic_tendencies_desc: "Mnohí z našich ľudí žili celý život ako nomádi, podľa nášho zvyku sa presúvať z jedného obývateľného miesta na druhé. Aj teraz, keď sa všetko mení a budujeme mesto pre náš ľud, niektorí si zachovávajú nomádské tradície a naďalej putujú." # todo: CHANGED
 skilled_cavalry_raids: "Jazdecké nájazdy" # todo: NEW TRANSLATION
 skilled_cavalry_raids_desc: "Od čias našich predkov boli jazdci strojmi našich dobyvačných výprav. Hromotĺk ich kopyt ozývajúci sa stepami $sahel_region$ šíril strach medzi našimi nepriateľmi a priniesol nám mnohé víťazstvá." # todo: CHANGED
 land_of_the_ancestors: "Zem predkov" # todo: NEW TRANSLATION
 land_of_the_ancestors_desc: "Zem nie je majetok ani obyčajný prach; je naším spojením s veľkými predkami. Z lepších krajín nás oni strážia. Nikdy nesmieme nechať toto puto prerušené a musíme sa o tieto krajiny starať na počesť tých, ktorí ich prvý osídlili." # todo: CHANGED
 wandering_scholars: "Putujúci učenci" # todo: NEW TRANSLATION
 wandering_scholars_desc: "Spoločenstvá učených škôl rôznych vier žijú na našom území a ponúkajú náboženské vyučovanie každému, kto ho prijme." # todo: CHANGED
 community_of_the_faithful: "Panstvo mnohých jazykov" # todo: NEW TRANSLATION
 community_of_the_faithful_desc: "Naša ríša je domovom ľudí zo stoviek rôznych prostredí. Hovoria množstvom jazykov a prichádzajú zo všetkých svetových strán, no každý vo svojom jazyku vzdáva úctu nášmu vládcovi, čím sme vzájomne spútaní." # todo: CHANGED
 bound_by_service: "Spojení službou" # todo: NEW TRANSLATION
 bound_by_service_desc: "Sme jeden ľud a máme jednu armádu. Zoskupením vojakov zo všetkých našich území a zatláčaním do vojenskej služby dobytých ľudí ich môžeme lepšie integrovať do našej spoločnosti a zároveň zvýšiť ich akceptáciu našej vlády." # todo: CHANGED
 regnal_chronicles: "Panovnícke kroniky" # todo: NEW TRANSLATION
 regnal_chronicles_desc: "Mali by sme zaznamenávať dejiny našich splendidných vládcov a ich slávnych činov vo veľkých kronikách, aby boli odovzdávané naprieč generáciami a stále pamätané." # todo: CHANGED
 expanded_slave_trade: "Ovládniť trh s otrokmi" # todo: CHANGED
 expanded_slave_trade_desc: "Dopyt po $slaves_goods$ od vonkajších obchodníkov rastie z dňa na deň. Naša pozícia v $africa$ nás robí ideálnymi sprostredkovateľmi tohto obchodu. Podporme tých, ktorí hľadajú trhy s otrokmi, aby tak konali v našich krajinách a robili svoje obchody na našich trhoch." # todo: CHANGED
 gifts_and_hostages: "Dary a rukojemníci" # todo: NEW TRANSLATION
 gifts_and_hostages_desc: "Hoci je náš ľud teraz zjednotený, čin klaňať sa spoločnému vrchnému pánovi neprišiel ľahko. Zvolaním všetkých podrobených vládcov do hlavného mesta ich môžeme využiť ako prestížnych kráľovských vyslancov. Niektorí by to nazvali politikou braní rukojemníkov; my to jednoducho vnímame ako spôsob, ako pripomenúť našim nezávislejším poddaným ich lojalitu." # todo: CHANGED
 people_of_ornaments: "Ľudia ornamentácie" # todo: CHANGED
 people_of_ornaments_desc: "Naši remeselníci sú preslávení ďaleko a široko a vraví sa, že nemôžu nechať povrch bez výzdoby. Využime túto povesť naplno a propagujme ich tvorbu čo najviac." # todo: CHANGED
 courtly_competition: "Súťaž na dvore" # todo: NEW TRANSLATION
 courtly_competition_desc: "Zaneprázdnený šľachtic je dobre správaný šľachtic. V našich krajinách je toľko dvorových titulov, že niektorí tvrdia, že polovica našich mužov nejaký má. Uistime sa, že naši dvorania strávia čas súperením o pozornosť a viditeľnosť; budú príliš zaneprázdnení na to, aby spriadali spiknutia proti našej vláde." # todo: CHANGED
 overnight_army: "Armáda cez noc" # todo: NEW TRANSLATION
 overnight_army_desc: "Naše hlavné mesto a iné mestá sú budované podľa vzoru armádnych táborov. Majú krídla, predvoje a čela. Zabezpečením prenikania vojenského myslenia do každodenného života zlepšíme našu celkovú bojovú pohotovosť." # todo: CHANGED
 mining_tradition: "Banícka tradícia" # todo: NEW TRANSLATION
 mining_tradition_desc: "Naša zem je bohatá na vzácne suroviny, pripravené byť vyťažené a predané zahraničným obchodníkom za veľké zisky. Boli by sme nerozumní, keby sme to nevyužili." # todo: NEW TRANSLATION
 intercontinental_trade: "Vzdialený obchod" # todo: CHANGED
 intercontinental_trade_desc: "Naši obchodníci často prinášajú z dvorov vzdialených krajín fascinujúce veci. Možno by sme mohli dosiahnuť ešte vzdialenejšie pobrežia?" # todo: CHANGED
 expanded_grazing_grounds: "Rozšírené pastviny" # todo: NEW TRANSLATION
 expanded_grazing_grounds_desc: "Naše územie má veľa pôdy vhodnej na pasenie stád, čo nám uľahčuje rozšíriť produkciu $livestock$." # todo: CHANGED
 african_sturdy_grains_advance: "Pestovanie odolných obilnín" # todo: NEW TRANSLATION
 african_sturdy_grains_advance_desc: "Silnejší dôraz na poľnohospodársku produkciu pomôže nášmu ľudu prosperovať. Našťastie máme dostatok priestoru a úrodnej pôdy na pestovanie viacerých plodín." # todo: CHANGED
 legacy_of_ivan_asen_ii: "Dedičstvo Ivana Asena II." # todo: NEW TRANSLATION
 legacy_of_ivan_asen_ii_desc: "Panovanie Ivana Asena II. znamenalo nový vrchol $BUL_ADJ$ moci, diplomacie a hospodárskej expanzie. Jeho dedičstvo pretrváva ako základ pre silný a centralizovaný štát." # todo: CHANGED
 bulgarian_orthodox_patriarchate: "$BUL_ADJ$ $orthodox_ADJ$ patriarchát" # todo: CHANGED
 bulgarian_orthodox_patriarchate_desc: "Povýšenie $BUL_ADJ$ Cirkvi na patriarchát potvrdilo $tarnovo$ ako duchovného rivala $constantinople$, posilňujúc našu národnú jednotu skrze vieru." # todo: CHANGED
 expansionist_ambitions: "Expanzné ambície" # todo: NEW TRANSLATION
 expansionist_ambitions_desc: "Ako sa Balkán rozpadal, mnohé vzostupné mocnosti hľadali expanziu navonok. Ambiciózni vládcovia usilovali o integráciu rozmanitých krajín pod jednu silnejšiu korunu, využívajúc slabosť $BYZ_ADJ$." # todo: CHANGED
 fortress_of_the_balkans: "Pevnosť Balkánu" # todo: NEW TRANSLATION
 fortress_of_the_balkans_desc: "Tvárou v tvár neustálym hrozbám od križiakov, $BYZ$ a Mongolov si $BUL$ vybudovalo rozsiahlu sieť opevnených miest a horských obrán." # todo: CHANGED
 revival_of_the_literary_schools: "Obnova literárnych škôl" # todo: NEW TRANSLATION
 revival_of_the_literary_schools_desc: "Inšpirovaní kultúrnym renesančným obdobím za Ivana Alexandera sa $BUL_ADJ$ skriptóriá a školy stali strážcami $slavic_group$ $orthodox_ADJ$ identity." # todo: CHANGED
 reformation_of_the_bulgarian_patriarchate: "Reforma $BUL_ADJ$ patriarchátu" # todo: CHANGED
 reformation_of_the_bulgarian_patriarchate_desc: "Oživenie nezávislosti $BUL_ADJ$ patriarchátu posilnilo náboženský vplyv i morálnu autoritu štátu." # todo: CHANGED
 promote_estates_general: "Podporiť Generálne stavy" # todo: NEW TRANSLATION
 promote_estates_general_desc: "$BUR$ je feudálny útvar s rôznymi časťami spojenými za rôznych podmienok, čo vytvorilo silné lokálne identity. Podporou centrálneho zhromaždenia dáme fórum týmto záujmom, čím podporíme hladké a nevyvolávajúce spory vládnutie." # todo: CHANGED
 reform_the_feudal_army: "Reforma feudálnej armády" # todo: NEW TRANSLATION
 reform_the_feudal_army_desc: "Feudálny systém odvodenia vojsk sa ukázal byť pomalý a nespolehlivý v tejto novej ére profesionálnej vojny. Inšpirovaní $FRA_ADJ$ modelom nahradíme rozhádzané vazalské húfy platenými družinami, zručnými dôstojníkmi a integrovanými armádami. Disciplinované jadro profesionálnych vojakov bude chrbticou modernej a prispôsobivej armády." # todo: CHANGED
 influence_of_the_burgundian_towns: "Vplyv $BUR_ADJ$ miest" # todo: CHANGED
 influence_of_the_burgundian_towns_desc: "Tradičné Stavy uprednostňujú klérus a šľachtu, ale rastúce bohatstvo a politický význam miest už nemožno ignorovať. Zreformovaním jeho štruktúry tak, aby odrážala rastúcu silu meštianskej triedy, zabezpečíme vyváženejšie vládnutie pri zachovaní privilégií ostatných stavov. Silnejší mestský hlas tiež zvýši naše administratívne kapacity a urýchli urbanizáciu." # todo: CHANGED
 compagnie_d_ordonnance: "Compagnies d'Ordonnance" # todo: NEW TRANSLATION
 compagnie_d_ordonnance_desc: "Naša závislosť na feudálnych odvodoch sa ukázala ako nedostatočná pre požiadavky modernej vojny. Vytvorenie trvalo kontrahovaných jazdeckých jednotiek, #italic $compagnie_d_ordonnance$#!, nám poskytuje spoľahlivú a profesionálnu vojenskú silu priamo vernú Korune." # todo: CHANGED
 create_the_regimental_system: "Vytvoriť plukový systém" # todo: NEW TRANSLATION
 create_the_regimental_system_desc: "Aby sme zabezpečili konzistentnú mobilizáciu a dostatočné zásobovanie bojovníkmi, musíme zaviesť formálny regimentuálny systém. Táto reforma nám umožní efektívnejšie organizovať ľudské zdroje, centralizovať velenie a znížiť závislosť od miestnej šľachty a žoldnierov.                                                                        " # todo: CHANGED
 heirs_of_rollo: "Dediči Rolla" # todo: NEW TRANSLATION
 heirs_of_rollo_desc: "Dedičstvo Rolla, vikingského zakladateľa $NRM$, naďalej definuje náš vládnuci dom. Taká prestížna línia prináša posilnenú legitimitu a rešpekt medzi našimi rovesníkmi." # todo: CHANGED
 trade_ports_in_the_channel: "Prístavy kanála" # todo: CHANGED
 trade_ports_in_the_channel_desc: "Naša poloha pozdĺž Lamanšského prielivu nám umožňuje vyniknúť ako obchodný priechod. Investovaním do prístavných miest a obchodnej infraštruktúry môžeme dominovať regionálnemu obchodu pri minimalizácii nákladov na zámořské operácie." # todo: NEW TRANSLATION
 norman_law: "$NRM_ADJ$ právo" # todo: CHANGED
 norman_law_desc: "Náš štát je riadený vlastným obyčajným právnym kódom, $couteume_de_normaundie$. Zaručujúc šľachtické privilégia, decentralizovanú moc a vlastnícke práva, táto právna tradícia zabezpečuje miestnu stabilitu a zdôrazňuje našu odlišnú identitu." # todo: NEW TRANSLATION
 the_exchequer: "The Exchequer" # todo: NEW TRANSLATION
 the_exchequer_desc: "Náš legislatívny orgán musí zostať nezávislý od vonkajších vplyvov, aby sa zachovala naša kultúrna identita a nezávislosť. Inšpirovaní anglo-normanskými fiškálnymi inštitúciami, naše parlamentné postupy určite posilnia kráľovské príjmy a zlepšia administratívny dohľad." # todo: NEW TRANSLATION
 frontline_in_the_caroline_war: "Frontová línia v Karolínskej vojne" # todo: CHANGED
 frontline_in_the_caroline_war_desc: "Počas dlhých konfliktov medzi $FRA$ a $ENG$ sme stáli ako strategické bojisko. Tlak vojny vytvoril odolný dôstojnícky zbor a tradície bojovej dokonalosti, ktoré pretrvávajú dodnes." # todo: CHANGED
 tunisian_corsairs: "$TUN_ADJ$ korzári" # todo: CHANGED
 tunisian_corsairs_desc: "Zo svojich pevností v $TUN$ a La Goulette dominujú naši korzári Stredozemiu. So svižnými galejami a štátnou podporou budia strach v cudzích obchodníkoch a posilňujú našu námornú silu bezohľadnou efektivitou." # todo: CHANGED
 tamazight: "Tamazight" # todo: NEW TRANSLATION
 tamazight_desc: "Berbersky hovoriaci ľudia vnútrozemia sú dôležitou súčasťou našej spoločnosti. Uznaním ich kultúrnej identity a podporou gramotnosti rozšírime svoju schopnosť spravovať rozmanité regióny bez straty súdržnosti či pevnej kontroly moci." # todo: NEW TRANSLATION
 guardians_of_ifriqiya: "Strážcovia Ifrīqya" # todo: NEW TRANSLATION
 guardians_of_ifriqiya_desc: "Ako dediči starobylých miest Kartágo a Kairuánu nesieme štafetu ochrancu srdca $maghreb_region$. Naše panstvo prináša stabilitu, ktorú všetci v kedysi spornom regióne privítajú." # todo: CHANGED
 saharan_trade: "Saharský obchod" # todo: NEW TRANSLATION
 saharan_trade_desc: "Od oáz $ghadames$ až po karavány $sahel_region$ naši obchodníci zabezpečujú a získavajú príjmy z transsaharských trás, ktoré nás spájajú s bohatstvom vnútrozemia. $goods_gold$, $salt$ a $slaves_goods$ prúdia severným smerom pod našou ochranou a dohľadom." # todo: CHANGED
 al_caid: "Al-Qā'id" # todo: NEW TRANSLATION
 al_caid_desc: "Menovaním lojálneho #italic Qā'id#! na dohľad nad provinciami a reguláciu obchodu v mene štátu posilníme mestských obchodníkov a zároveň zaistíme provinciálnu správu. Zabezpečenie spravodlivých obchodov a regulovaných trhov výrazne posilní našu ekonomickú bázu." # todo: CHANGED
 connections_with_the_christian_world: "Spojenia s $christian_ADJ$ svetom" # todo: CHANGED
 connections_with_the_christian_world_desc: "Zmluvy a obchodné dohody s $christian_ADJ$ štátmi zabezpečujú, že diplomacia a pragmatizmus slúžia našim dlhodobým záujmom. Hoci sa naša viera líši od ich, nemali by sme zatvárať dvere príležitostiam." # todo: CHANGED
 attract_foreign_pirates: "Priťahovať zahraničných pirátov" # todo: NEW TRANSLATION
 attract_foreign_pirates_desc: "Naše prístavy sú už dávno útočiskom pre tých, ktorí hľadajú bohatstvo na mori. Privítaním týchto skúsených námorníkov bez ohľadu na vieru alebo pôvod môžeme ďalej posilniť naše korzárske loďstvo a rozšíriť námornícky personál." # todo: NEW TRANSLATION
 rais_of_the_navy: "Ra'īs námorníctva" # todo: NEW TRANSLATION
 rais_of_the_navy_desc: "Naši korzárski kapitáni, #italic Ra'īs#!, nie sú len pirátmi. Sú skúsenými námornými veliteľmi a ich skúsenosti na mori sú hlbokým prameňom námornej tradície, ktorá posilňuje hrdú históriu našej flotily." # todo: CHANGED
 export_monopolies: "Exportné monopoly" # todo: NEW TRANSLATION
 export_monopolies_desc: "Kontrolou kľúčového exportu, ako olivový olej, textil a $dyes$, zabezpečíme domáci blahobyt aj vplyv v zahraničí. Takéto protekcionistické praktiky nám umožnia projektovať moc cez obchod rovnako ako dobytím, zaisťujúc našim obchodníkom nadvládu nad cudzincami na našich trhoch." # todo: CHANGED
 beacon_of_maghrebi_trade: "Maják maghrebskej obchodnej siete" # todo: NEW TRANSLATION
 beacon_of_maghrebi_trade_desc: "$TLE$ leží na križovatke saharských karaván, stredomorského obchodu a andalúzskej eminentnosti. Ako obchod prosperuje cez jeho trhy a prístavy, musíme naďalej rozširovať naše obchodné siete, presadzujúc náš vplyv nad regionálnym obchodom." # todo: CHANGED
 qalat_al_mashwar_advance: "$qalat_al_mashwar$" # todo: NEW TRANSLATION
 qalat_al_mashwar_advance_desc: "Opevnený komplex $qalat_al_mashwar$ stojí ako vojenská bašta i symbol dynastickej autority. Investíciou do jeho rozšírenia sa posilní obrana $TLE$ a zároveň zabezpečí administratívna kontrola nad okolím." # todo: CHANGED
 hispano_moresque_style: "Hispano-moreský štýl" # todo: NEW TRANSLATION
 hispano_moresque_style_desc: "Naše mestá odrážajú jedinečnú zmes andalúzskej elegancie a maghrebskej architektúry. Hispano-moreský štýl, odovzdávaný cudzími remeselníkmi a šľachtou, podnecuje nové kultúrne rozkvet a zvyšuje prestíž nášho dvora." # todo: NEW TRANSLATION
 city_of_scholars: "Mesto učencov" # todo: NEW TRANSLATION
 city_of_scholars_desc: "$TLE$ je už dlhé roky centrom islamského učenia a intelektuálnej výmeny. Naše madrasas priťahujú učencov zo $maghreb_region$ a Al-'Andalus, podporujúc vedecký a teologický pokrok generácií." # todo: CHANGED
 entrepot_connections: "Prepojenia obchodných skladov" # todo: NEW TRANSLATION
 entrepot_connections_desc: "Aby sme prosperovali ako obchodné centrum, naše mestá musia byť prepojené pevnou infraštruktúrou. Zmocnením šľachty stavať a udržiavať strategické cesty zlepšujeme vnútorný obchod a posilňujeme tepny nášho panstva." # todo: NEW TRANSLATION
 perpetual_general_captain_of_the_people: "Trvalý generálny kapitán ľudu" # todo: NEW TRANSLATION
 perpetual_general_captain_of_the_people_desc: "V meniacich sa politikách stredovekého $VER$ sa titul 'Capitano del Popolo' stal viac než ceremoniálnou funkciou — stal sa trvalým nárokom na vedenie. Zakorenený v obci a využívaný Scaligeri na legitimizáciu ich moci, dal ich vláde trvalosť v meste, kde bola lojalita ťažko získateľná." # todo: CHANGED
 scaligers_military_ambitions: "Vojenské ambície Scaligerov" # todo: CHANGED
 scaligers_military_ambitions_desc: "Scaligeri nielen snívali o vládnutí $VER$, ale aj o jeho premene na $lombard$ mocnosť. Ich ťaženia zasiahli Po údolie, stretávajúc sa s $ML$, $VEN$ a Padovou. Táto túžba zanechala stopu v podobe opevnených miest, vystužených húfov a dvora, ktorý vdýchol vojenské reformy." # todo: CHANGED
 court_of_great_refugees: "Dvor veľkých utečencov" # todo: NEW TRANSLATION
 court_of_great_refugees_desc: "Naše veľké hlavné mesto sa stalo útočiskom pre umelcov, exulantov a mysliteľov — vysídlených vojnou, vierou alebo politikou inde v $ITA$. Títo utečenci obohatia dvor o nové techniky, odvážne myšlienky a kultúrne prieniky, čo urobí $VER$ zriedkavým útočiskom inovácií v turbulentných časoch." # todo: CHANGED
 consolidate_italian_holdings: "Konsolidovať $ITA_ADJ$ državy" # todo: CHANGED
 consolidate_italian_holdings_desc: "Scaligeri panovali nielen nad $VER$, ale nad rastúcou sieťou miest severného $italy_region$. Udržať takúto ríšu pohromade vyžaduje starostlivú diplomaciu, šikovné delegovanie a dobre platené profesionálne armády. Iba konsolidáciou môže $VER$ obstáť ako skutočný rival ostatným veľkým mocnostiam polostrova." # todo: CHANGED
 the_adige: "Adige" # todo: NEW TRANSLATION
 the_adige_desc: "Rieka Adige je životnou tepnou $VER$ — kanálom pre obchod, poľnohospodárstvo a prosperitu. Ako jej vody tečú z Álp až do Jadranského mora, tak aj bohatstvo prúdi cez naše trhy a polia, živiac mestá i dediny." # todo: CHANGED
 marmorina: "Marmorina" # todo: NEW TRANSLATION
 marmorina_desc: "V časoch pokoja $VER$ kvitlo pod vládcami, ktorí si cenili krásu rovnako ako moc. Mesto si získa meno 'Marmorina' pre hojnosť rímskeho mramoru, sôch a pôvabnej architektúry. Nový most cez Adige, Ponte Navi, je inžinierskym činom, zatiaľ čo veža Gardello — prvé vodou poháňané hodiny v $ITA$ — udávala hodiny tichej vzostupnosti. Toto dedičstvo rafinovanosti nepochybne formuje nielen naše panorámy, ale aj to, ako budeme zapísaní v dejinách." # todo: CHANGED
 diocese_of_smolensk: "Diecéza $SMO$" # todo: CHANGED
 diocese_of_smolensk_desc: "Kedysi duchovná bašta $orthodox_ADJ$ $christian$ a domov jednej z najstarších biskupstiev v regióne, diecéza $SMO$ stelesňuje neotrasiteľnú vieru nášho ľudu." # todo: CHANGED
 smolenskian_resolve: "Odolnosť $SMO_ADJ$" # todo: CHANGED
 smolenskian_resolve_desc: "Po stáročia bol $SMO$ krajina rozparcelovaná cudzincami — $LIT_ADJ$ kniežatami, $POL_ADJ$ kráľmi a $MOS_ADJ$ princami. Aby sme prežili, držali sme sa toho, čo nás spájalo: našej viery a pevnosti. Ak máme znovu povstať, musíme zahodiť rozdiely a zjednotiť sa okolo svätej myšlienky, že nadovšetko existuje len $SMO$." # todo: CHANGED
 link_the_steppes_trade: "Spojiť obchod stepí" # todo: NEW TRANSLATION
 link_the_steppes_trade_desc: "Umiestnené medzi lesom a stepou, $SMO$ dlho predstavovalo križovatku vojny a obchodu. Zlepšením pozemnej infraštruktúry a zabezpečením karavanových trás môžeme znovu prekovať našu úlohu ako dôležitý záves medzi severným Rusiami, Baltičkom a južnými obchodnými trasami stepí." # todo: CHANGED
 hub_of_militarism: "Centrum militarizmu" # todo: NEW TRANSLATION
 hub_of_militarism_desc: "Dlho nás vojna definovala, no teraz sa stane zdrojom našej sily. Z ruinálnej náruče vojny a obliehaní povstáva $SMO$ ako centrum vojenskej výroby — dela, strelný prach, taktika a doktrína vychádzajú z našich dielní. Nech svet vidí nás nie ako korisť, ale ako kladivo, ktoré má biť na kovadle cudzích dobyvateľov." # todo: CHANGED
 armories_of_smolensk: "Zbrojnice $SMO$" # todo: CHANGED
 armories_of_smolensk_desc: "Po desaťročiach vojen na každej hranici sme sa naučili bojovať zbraňami východu i západu. Zlúčením $MOS_ADJ$ húževnatosti so západnou presnosťou naše zbrojnice teraz vyrábajú elitnú ťažkú techniku a taktiky, ktoré nemajú konkurenciu. Z našich výhní prichádza palebná sila — a z palebnej sily dominancia a vytrvalosť." # todo: CHANGED
 capetian_house_of_anjou: "Kapetovský dom $ANJ$" # todo: CHANGED
 capetian_house_of_anjou_desc: "V našej krvi koluje mocná zmes kapetovskej dôstojnosti a anžuvínskej ambície. Hoci už nenosíme korunu Jeruzalema, zostávame dedičmi kráľovskej tradície, ktorá kedysi siahala od $ANJ$ po $ALB$. Opatrnou diplomaciou a plánovaním môžeme znovu povzniesť veľkoleposť našich predkov a získať späť, čo nám neprávom odňali." # todo: CHANGED
 lords_of_the_rhone_corridor: "Páni rhônskeho koridoru" # todo: NEW TRANSLATION
 lords_of_the_rhone_corridor_desc: "Údolie Rhôny bolo vždy našou tepnou moci a naše hrady strážia jeho priechod ako kamenní strážcovia. Tieto opevnenia sú jedny z najpevnejších v celom $europe$, stály znak našej vojenskej a inžinierskej zdatnosti, vždy bdie nad našou doménou." # todo: CHANGED
 angevin_heraldry: "Angevínska heraldika" # todo: NEW TRANSLATION
 angevin_heraldry_desc: "Zlaté ľalie a dvojhlavé orly na našich banneroch hovoria o starobylých právach a kráľovských ambíciách. Nároky, ktoré siahajú cez $italy_region$ až po $ALB$ a $jerusalem$, stále znejú v našich srdciach. Nech Dom Valois-Anjou vystúpi vyššie než kedykoľvek predtým!" # todo: CHANGED
 le_livre_des_tournois: "Le Livre des Tournois" # todo: NEW TRANSLATION
 le_livre_des_tournois_desc: "Písaný kráľovskou rukou, 'Kniha turnajov' je viac než manuál — je to vyjadrenie dvornej pýchy a rytieriavskej identity. Naša šľachta sa pripravuje nielen na vojnu, ale aj na divadlo, a tak zachováva vojenskú disciplínu a prestíž po celom panstve." # todo: NEW TRANSLATION
 statutes_of_aix: "Aixské statúty" # todo: NEW TRANSLATION
 statutes_of_aix_desc: "Séria voľne zosúrodených zákonov a statútov tvorí právny chrbticový systém našej správy. Tieto statúty miešajú rímsku jurisprudenciu s miestnymi zvykmi a anjouvskou tradíciou, čo nám umožňuje spravovať patchwork regiónov ako jedno súdržné panstvo: pravú zložitú monarchiu, kde sú časti rôznorodé, ale koruna nerozdeliteľná." # todo: NEW TRANSLATION
 rade_of_toulon: "Záliv $toulon$" # todo: CHANGED
 rade_of_toulon_desc: "Prírodný prístav $toulon$ ponúka ideálne východisko pre naše námorné ambície. Zatiaľ čo $marseille$ kvitne ako naše obchodné drahokam, $toulon$ bude zbrojnicou $PRO$ a východiskovým bodom budúcej námornej moci." # todo: CHANGED
 piqure_de_marseilles: "Piqûre de $marseille$" # todo: CHANGED
 piqure_de_marseilles_desc: "V dielňach $marseille$ remeselníci šijú jemné #italic boutis#! prešívané prikrývky v $PRO_ADJ$ štýle — oceňované naprieč $europe$ pre ich kvalitu a šarm. Podobne ako naše kniežatstvo, umelecké diela vytvorené v našom panstve sú zložené z mnohých častí zošitých do jednotného celku: prešívaná zem, bohatá na textúru a kultúru." # todo: CHANGED
 orm_a_vast_emporium: "Rozsiahle trhovisko" # todo: NEW TRANSLATION
 orm_a_vast_emporium_desc: "Hovorí sa, že $ORM$ je 'obrovské trhovisko, kde boli národy a tovary každého druhu zo všetkých častí sveta' alebo že 'keby bol celý svet zlatým prsteňom, $ORM$ by bol jeho drahokamom'. Identita našej ríše je neoddeliteľne spätá s obchodom. Lode z $gujarat_area$, $arabia_region$ a dokonca $CHI$ kotvia v našich prístavoch, vymieňajúc korenie, $gems$, $silk$ a príbehy." # todo: CHANGED
 hormuz_toll: "Colné poplatky $ORM$" # todo: CHANGED
 hormuz_toll_desc: "Na najužšom mieste $persian_gulf$ stojí $ORM$, strážca medzi západom a východom morskej obchodnej cesty. Žiadne plavidlo neprejde bez nášho vedomia — alebo bez zaplatenia poplatku. Storočia tento klačný poplatok nielenže nás obohacoval, ale formoval aj našu diplomaciu a spôsob, akým projektujeme moc cez rozľahlé moria." # todo: CHANGED
 gate_of_the_persian_gulf: "Brána $persian_gulf$" # todo: CHANGED
 gate_of_the_persian_gulf_desc: "$ORM$ kontroluje prieliv spájajúci $indian_ocean_continent$ s vnútrozemím $asia$. Kto ovláda tento životne dôležitý priechod, diktuje rytmus námorného premávky. Náš príkaz nad týmito vodami musí byť absolútny, inak sa náš vplyv zmenší." # todo: CHANGED
 moqarrariya: "Inštitucionalizovať moqarrariyu" # todo: NEW TRANSLATION
 moqarrariya_desc: "Po generácie naše kráľovstvo udržiavalo pokoj s pevninou cez starobylý tributárny systém známy ako #italic Moqarrariya#!. Namiesto spoliehania sa na zvyk a vyjednávanie si tieto tribúty kodifikujme do formálnych paktov — zabezpečujúc čerstvú vodu, bezpečnosť ciest a dlhodobú stabilitu spoľahlivou diplomaciou." # todo: CHANGED
 develop_qeshm_and_ormuz: "Investovať do Qeshm a $ORM$" # todo: CHANGED
 develop_qeshm_and_ormuz_desc: "Hoci sú ostrovy Qeshm a $ORM$ suché a skalnaté, vďaka starostlivému zásobovaniu a bohatému obchodu tu pretrváva mestský život. Pri náležitých investíciách môžu ich prístavy a dielne ďalej kvitnúť, premieňajúc ich z logistických uzlov na centrá inovácií a produktivity." # todo: CHANGED
 ormuzi_navy: "Flota $ORM_ADJ$" # todo: CHANGED
 ormuzi_navy_desc: "$persian_gulf$ každý deň preplávajú naše flotily — či už obchodné, hliadkové alebo ozbrojené sprievody. Aby sme však zodpovedali ambíciám tých, ktorí nám závidia, musíme rozšíriť a modernizovať. Nech $ORM$ nebude len obchodnou stanicou: nech sa stane námornou zbrojnicou." # todo: CHANGED
 mint_of_the_gulf: "Mincovňa zálivu" # todo: NEW TRANSLATION
 mint_of_the_gulf_desc: "Ormuzská minca koluje od $basra_al_hamra$ po $bengal_area$, dôveryhodná svojou čistotou a hmotnosťou. Inštitucionalizáciou našej mincovne a rozšírením emisie posilníme našu finančnú suverenitu — a uchopíme fiškálnu nadvládu nad $indian_ocean_region$." # todo: CHANGED
 sav_savoyard_flexibility: "$SAV_ADJ$ diplomacia" # todo: CHANGED
 sav_savoyard_flexibility_desc: "Vďaka našej vratkej polohe medzi väčšími mocnosťami sa musíme spoliehať na diplomatické schopnosti pre prežitie. Udržiavaním vzťahov aj s našimi najnebezpečnejšími nepriateľmi budeme schopní presúvať naše spojenectvá tak, aby sme zabezpečili trvácnosť krajiny." # todo: CHANGED
 sav_house_of_savoy: "Zjednotený dom" # todo: NEW TRANSLATION
 sav_house_of_savoy_desc: "$SAV$ je od svojho vzniku vládnutý stabilnou líniou dynastických grófov. Zabezpečením jednoty našej vládnucej rodiny a udržiavaním silného spojenia s miestnymi zástupcami zabránime rozdrobeniu nášho územia." # todo: CHANGED
 sav_fight_the_vaudois: "Postavme sa proti kacírstvu" # todo: NEW TRANSLATION
 sav_fight_the_vaudois_desc: "Naše krajiny dlhodobo trpia heretickým učením valdenských. Silou vôle a s božskou podporou sme dokázali obmedziť ich vplyv a budeme naďalej brániť jedinú pravú vieru pred nebezpečnými myšlienkami." # todo: CHANGED
 sav_embrace_the_vaudois: "Svetlo v tme" # todo: NEW TRANSLATION
 sav_embrace_the_vaudois_desc: "Prijali sme učenie valdenského hnutia a sme odhodlaní chrániť túto vieru pred krutou $catholic_ADJ$ Cirkvou, ktorá sa snaží jej myšlienky vymazať." # todo: CHANGED
 sav_alpine_pass_control: "Kontrola horských priechodov" # todo: CHANGED
 sav_alpine_pass_control_desc: "Priechod cez Alpy je za bežných okolností nepríjemný a pre povozy alebo väčšiu družinu môže byť priam nemožný. Udržiavaním dobrých ciest, prístreškov a odpočívadiel budeme schopní dominovať náročnému terénu a zabezpečiť stálu výmenu obchodníkov cez naše územie." # todo: CHANGED
 sav_the_shroud_of_turin: "Púť k Turínskej plachte" # todo: CHANGED
 sav_the_shroud_of_turin_desc: "Naša ríša vlastní najsvätejší relikviár, kus látky s tvárou Ježiša z Nazareta. Samozrejme priťahuje nespočet pútnikov, všetkých túžiacich vidieť a uctievať tento mimoriadny relikviár. Tento stály prúd pútnikov prináša veľké bohatstvo do nášho územia — čo je nám veľmi na prospech." # todo: CHANGED
 sav_repopulate_the_valleys: "Osídliť alpské údolia" # todo: NEW TRANSLATION
 sav_repopulate_the_valleys_desc: "Mnoho ľudí v našej ríši opúšťa alpské údolia, kde sa narodili, aby sa usadili v mestských oblastiach na oboch stranách horského hrebeňa. Toto vyludnenie zanecháva menšie dediny v nižších údoliach v neistom, politicky nestabilnom postavení. Musíme zabezpečiť, aby údolia boli dostatočne zalidnené a primerane udržiavané." # todo: CHANGED
 mai_diadema_regni: "Diadema Regni" # todo: NEW TRANSLATION
 mai_diadema_regni_desc: "Naše milované mesto bolo opísané ako 'Diadema Regni', Koruna kráľovstva, prívlastok, o ktorý usilovne dbáme. Zachovanie tohto postavenia nám pomôže zostať nad ostatnými cisárskymi mestami z hľadiska prestíže a politického vplyvu." # todo: CHANGED
 mai_city_and_archbishop: "Práva mesta" # todo: NEW TRANSLATION
 mai_city_and_archbishop_desc: "Obyvatelia $MAI$ prosperovali vďaka rozsiahlym právam udeleným im Adalbertom z $MAI$ na začiatku 12. storočia. Tieto práva, vyryté do bronzových dverí katedrály, budú pripomienkou spolupráce medzi odlišnými mocami v meste — kňazstvom a občianskou komunitou." # todo: CHANGED
 mai_leader_rheinish_league: "Rýnska liga" # todo: NEW TRANSLATION
 mai_leader_rheinish_league_desc: "Keď Rheinský zväz existoval, prirodzene sme zaujali vedúce a usmerňujúce postavenie pre ostatných členov. Hoci sa zväz rozpustil, musíme urobiť všetko pre to, aby sme si udržali vplyv nad našimi bývalými spojencami." # todo: CHANGED
 mai_zealous_fight_against_heretics: "Chráňme našu vieru" # todo: CHANGED
 mai_zealous_fight_against_heretics_desc: "Náboženskú jednotu našej krajiny musíme brániť pred každou hrozbou. Ak našim armádam poskytneme morálne vedenie v podobe vojenských kaplánov, budú oveľa viac motivované brániť naše presvedčenia." # todo: CHANGED
 mai_vicar_of_mainz: "Správa vikára" # todo: NEW TRANSLATION
 mai_vicar_of_mainz_desc: "Aby sa naše krajiny spravovali spoľahlivo aj v neprítomnosti vládcov, mali by sme ustanoviť vikára. S rozsiahlymi právomocami môže vikár vládnuť v našom najlepšom záujme a neustále pripomínať obyčajným ľuďom našu prítomnosť." # todo: CHANGED
 mai_mainz_kingdom: "Mainzer Königreich" # todo: NEW TRANSLATION
 mai_mainz_kingdom_desc: "Hoci popolcová streda je bežným sviatkom, má v našej krajine obzvlášť hlboké korene. Kým verejnosť oslavuje #italic Fastnacht#!, teda karneval, maskami a hojými hostinami, náš dvor bude mať špeciálnu udalosť. Počas karnevalových osláv prehodíme role na dvore žrebovaním, pričom sa aj panovník bude musieť zapojiť. Tento zvyk vymenovania rolí, nazývaný #italic Mainzer Königreich#!, sa rozšíri ďaleko za naše hranice a pomôže rozšíriť naše kultúrne dedičstvo." # todo: CHANGED
 mai_center_of_printing: "Tlačiarne $mainz$" # todo: CHANGED
 mai_center_of_printing_desc: "Rozšírením nášho už rastúceho tlačového priemyslu sa môžeme stať vedúcim producentom kníh v $europe$." # todo: CHANGED
 mai_garrison_of_the_rhine: "Garnizón Rýna" # todo: CHANGED
 mai_garrison_of_the_rhine_desc: "Obrana našich hraníc môže byť náročná, zvlášť keď nám rieka rozdeľuje krajinu na dve časti. Musíme vybudovať rozsiahlu sieť posádok a opevnení, ktoré odolajú nepriateľom." # todo: CHANGED
 cro_maritime_connections: "Námorné spojenia" # todo: NEW TRANSLATION
 cro_maritime_connections_desc: "Vzhľadom na náš členitý pobrežný obrys je takmer nemožné spojiť pobrežné osady cestou. Z tohto dôvodu budeme musieť založiť trvalé spojenia loďami, čím zabezpečíme, že tovar i ľudia nebudú trpieť dlhšími pozemnými cestami." # todo: CHANGED
 cro_reliance_on_adriatic: "Bohatstvá Jadranu" # todo: NEW TRANSLATION
 cro_reliance_on_adriatic_desc: "HoJNÉ more nám dáva prístup k množstvu $fish$ a $salt$, ktoré môžu nasýtiť náš ľud, udržať miestnu ekonomiku a poskytnúť nám bohaté exportné tovary." # todo: CHANGED
 cro_trade_posts: "Chorvátske obchodné stanice" # todo: NEW TRANSLATION
 cro_trade_posts_desc: "Naše územie leží medzi mnohými atraktívnymi destináciami pre obchodníkov. Namiesto toho, aby sme ich len prepúšťali ako zprostredkovateľov, mali by sme podporiť časť tohto obchodu sami a pobrať si svoju spravodlivú časť stredomorského obchodu." # todo: CHANGED
 cro_influx_of_foreign_knowledge: "Prílev cudzieho poznania" # todo: NEW TRANSLATION
 cro_influx_of_foreign_knowledge_desc: "Mnoho cudzích umelcov a učencov prešlo našimi krajinami, ale mali by sme ich motivovať, aby zostali. Vybudovanie domácej komunity talentovaných tvorcov rozhodne posunie naše kultúrne úspechy ďalej." # todo: CHANGED
 cro_antemurale_christianitatis: "Antemurale Christianitatis" # todo: NEW TRANSLATION
 cro_antemurale_christianitatis_desc: "Považujeme sa za obrancov $christian$ a za bulwark proti heretikom a pohanom." # todo: CHANGED
 cro_pandurs_recruitment: "Nábor pandurov" # todo: NEW TRANSLATION
 cro_pandurs_recruitment_desc: "Zriadime pluky ľahkej pechoty, ktorí budú slúžiť ako polícia a ochrana proti lúpežníkom v časoch pokoja. Títo muži tiež ľahko doplnia našu armádu v prípade potreby." # todo: CHANGED
 arabia_felix: "Arabia Felix" # todo: NEW TRANSLATION
 arabia_felix_desc: "Od antiky je $YEM$ známa ako 'Arabia Felix', Šťastná Arabia. Požehnaná miernym horským podnebím a úrodnou pôdou v mori púšte zostáva jedným z najprirodzenejšie prosperujúcich regiónov polostrova. Pestujme toto bohatstvo a využime ho ako základ pre rozkvitajúcu ríšu." # todo: CHANGED
 coffea_arabica: "Káva Arabica" # todo: NEW TRANSLATION
 coffea_arabica_desc: "Hoci sa iní pokúsili transplantovať našu milovanú kávu, $coffee$ z $arabia_region$ zostáva bezkonkurenčná chuťou a slávou. Od rušného prístavu Mocha až po dvory vzdialených vládcov je svetova túžba po našom nápoji nenásytná." # todo: CHANGED
 zaydi_scholarly_traditions: "$zaidi_school$ učené tradície" # todo: NEW TRANSLATION
 zaydi_scholarly_traditions_desc: "Hory $YEM$ boli dlhé veky domovom $zaidi_school$ imámátu, centra učenia a zbožnosti. Zakorenení v islamskej jurisprudencii, teológii a racionalizme, naši učenci po stáročia zabezpečujú zákonnosť a morálnu integritu našej vlády." # todo: CHANGED
 rasulid_bureaucracy: "Bureaukracia $rasulid_dynasty$" # todo: CHANGED
 rasulid_bureaucracy_desc: "Dynastia $rasulid_dynasty$ priniesla do našich krajín bezprecedentný administratívny poriadok. S registračnými záznamami, daňovými systémami a robustnou štruktúrou kabinetu premenili Jemen na jeden z najefektívnejšie spravovaných štátov v regióne." # todo: CHANGED
 control_of_the_red_sea: "Kontrola Červeného mora" # todo: CHANGED
 control_of_the_red_sea_desc: "Každý obchod z $india$ a $africa$ musí prejsť prieplavom zvaným Brána Úmrtnosti. Vymáhajme našu nadvládu nad týmto námorným úzkym miestom a premeňme každú plávajúcu loď na príležitosť." # todo: CHANGED
 yem_unite_the_tribes: "Zjednotiť $YEM_ADJ$ kmene" # todo: CHANGED
 yem_unite_the_tribes_desc: "Od pobrežia Tihāmah po pohoria Ḥarāz je naše územie domovom nespočetne nezávislých kmeňov. Hoci dlho odolávali centralizovanej autorite, sú zároveň našou silou. Zjednotením ich pod jednou príčinou môžeme lepšie využiť ich ako pracovnú silu." # todo: CHANGED
 port_of_aden: "Prístav Áden" # todo: NEW TRANSLATION
 port_of_aden_desc: "Prístav Aden je už tisíce rokov uzlom obchodu — jeho prirodzený prístav vítal lode z $india$, $egypt_region$ a $east_africa$. Pri náležitom podpore sa môže opäť stať pilierom našej námornej ekonomiky a pýchou Červeného mora." # todo: CHANGED
 sons_of_the_salur_tribe: "Synovia kmeňa Salur" # todo: NEW TRANSLATION
 sons_of_the_salur_tribe_desc: "$KAR$ siahajú svojimi korenmi k Salur, jednému z hlavných oghuzských kmeňov. Známí svojím vedením a statočnosťou, Salurské dedičstvo formuje identitu nášho štátu a nárok na zastupovanie $turkmen_culture$ v $anatolia_region$." # todo: CHANGED
 mehmed_beys_firman: "Firman Meḥmeda beya" # todo: NEW TRANSLATION
 mehmed_beys_firman_desc: "Meḥmed I. vydal dekrét, ktorý vyžadoval používanie turečtiny na súdoch, v dervišských lóžach, sneme a na verejných námestiach. Tento akt odmietol dominanciu $persian_language$ a $arabic_language$ v elitných kruhoch a položil základy pre jedinečnú kultúrnu politiku $turkmen_culture$." # todo: CHANGED
 karamanid_cavalry: "Jazda $KAR$" # todo: CHANGED
 karamanid_cavalry_desc: "Jazda vždy bola základom vojny $turkmen_culture$. Naši jezdci, vychovávaní od mladosti a na odolných anatolských koňoch, udržiavajú hrdé tradície stepiarskeho boja s disciplínou a prudkou silou." # todo: CHANGED
 home_of_the_whirling_dervishes: "Domov víriacich dervišov" # todo: NEW TRANSLATION
 home_of_the_whirling_dervishes_desc: "$konya$, naše duchovné centrum, je domovom nasledovníkov Mevlânâ Jalāl al-Dīn Muḥammad Rūmīho. Ich posvätná prax — #italic sema#! — symbolizuje cestu duše k božskej pravde. Ich prítomnosť prehĺbuje mystické tradície nášho panstva a posilňuje naše sufíjske korene." # todo: CHANGED
 sakya_hegemony: "Hegemónia Sakya" # todo: NEW TRANSLATION
 sakya_hegemony_desc: "Posledné storočie mal školský rád Sakya svetskú autoritu nad $TIB$, pôsobiac ako duchovní a politickí správcovia pod patronátom $MGE_ADJ$. Ich dominancia priniesla obdobie centralizovanej vlády a školského zjednotenia. Hoci ich vláda zoslabla, ich dedičstvo naďalej formuje náš prístup k autorite a poriadku." # todo: CHANGED
 monastic_dominance: "Dominancia kláštorov" # todo: NEW TRANSLATION
 monastic_dominance_desc: "Fúzia duchovnej a svetskej moci definuje našu politickú krajinu. Od najmenšej dediny po síně moci v Sakyi sú kláštorné inštitúcie centrálnou súčasťou každého aspektu života. Ich morálna autorita a organizačná zdatnosť zabezpečujú vernosť, jednotu a kultúrnu odolnosť." # todo: CHANGED
 the_yak: "Jak" # todo: NEW TRANSLATION
 the_yak_desc: "Domestikovaný po stáročia, jak je chrbticou pastevného života $TIB_ADJ$. Poskytuje mäso, mlieko, vlnu, dopravu aj palivo — aj jeho vysušený trus je dôležitým palivom na stromoré pláne. V čase núdze či slávnosti plní maslo z jaka naše lampy a poháre." # todo: CHANGED
 drokpa: "Drokpa" # todo: NEW TRANSLATION
 drokpa_desc: "Nomádi Drokpa často pôsobia ako pastieri a obchodníci, nosiči spájajúci vzdialené osady. Vďaka tradíciám a nenapodobiteľnej znalosťi terénu prechádzajú vysokohorskými trasami medzi $TIB$, Bhutánom, Ladakhom a $NPL$. Ich sezónne karavány nesú $salt$, $wool$ a sušené mäso výmenou za obilniny a výrobky. Tieto siete zlepšujú súdržnosť našich hôr do živej siete obchodu a diplomacie." # todo: CHANGED
 tibetan_monastic_education: "Mníšsky vzdelávací systém" # todo: NEW TRANSLATION
 tibetan_monastic_education_desc: "Naše kláštorné inštitúcie dávno slúžia ako centrá učenia, debát a duchovnej disciplíny. Prostredníctvom prísneho výcviku a štruktúrovaného prístupu k vzdelávaniu si naši klerici udržiavajú vysoký štandard intelektuálnej a morálnej integrity. Tieto základy podporia múdru vládu a kultúrnu prosperitu v našej osvietenej ríši." # todo: CHANGED
 tanye_guanxi: "Tányuè Guānxì" # todo: NEW TRANSLATION
 tanye_guanxi_desc: "Po stáročia náš duchovný vplyv v $CHI$ tvoril základ našich diplomatických vzťahov. Cisárske patrónstvo, výmeny tributov a posvätné rituály ako #italic Tányuè#! zabezpečujú rešpekt aj materiálny prospech." # todo: CHANGED
 great_three: "Tri veľké sídla" # todo: NEW TRANSLATION
 great_three_desc: "Sera, Ganden a Drepung — tieto vysoké kláštorné univerzity tvoria intelektuálne srdce $TIB$. Ich učenci vychovávajú jednu generáciu za druhou mníchov, diplomatov a vládcov. S ich vzostupom sa naše územie stalo nielen baštou viery, ale i kolískou prísneho myslenia a inštitucionálneho pokroku." # todo: CHANGED
 dai_lang: "Autonómne vietské dediny" # todo: NEW TRANSLATION
 dai_lang_desc: "Vietnamské vidiecke oblasti stoja na pevnosti #italic làng#!, autonómnych dedín, ktoré stelesňujú princíp: 'zvyky dediny prevažujú nad zákonmi kráľa.' V krajine drsných hôr a kľukatých riek sa tieto komunity samosprávne riadia, stavajú miestne milície, efektívne vyberajú dane a zachovávajú kráľovskú autoritu na lokálnej úrovni." # todo: NEW TRANSLATION
 nghia_quan: "Nghĩa Quân" # todo: NEW TRANSLATION
 nghia_quan_desc: "V priebehu našej histórie sa #italic Nghĩa Quân#! — 'spravodlivé milície' — povstali na obranu našej krajiny v časoch veľkého nebezpečenstva. Tvorené roľníkmi, učencami a miestnymi vlastencami stáli proti cudzím dobyvateľom i vnútornej tyranii. Hoci sú nepravidelné, ich statočnosť a oddanosť vlasti z nich robí hrozivú silu pri mobilizácii." # todo: CHANGED
 cha_go_tram_huong: "Gỗ Trầm Hương" # todo: NEW TRANSLATION
 cha_go_tram_huong_desc: "Žiadny srdcovník našich domorodých stromov, známy ako agarwood alebo #italic Trầm Hương#!, je cený nielen pre svoju očarujúcu arómu, ale aj pre duchovné a liečivé vlastnosti. Po celom mori šľachta i mnísi túžia po ňom ako o kadidle, parfumoch a obetách. Ochranou našich lesov a zlepšením spôsobov zberu môžeme z tohto vzácneho prírodného daru spraviť jeden z našich najhodnotnejších vývozov." # todo: CHANGED
 my_son_sanctuary: "Mỹ Sơn Sanctuary" # todo: NEW TRANSLATION
 my_son_sanctuary_desc: "V zelených údoliach stredného $CHA$ leží posvätný chrámový komplex Mỹ Sơn, kde králi a kňazi po generácie vykonávali úcty k $shiva_god$, ochrancovi našej ríše. Tieto veže sú vytesané s oddanosťou a zdobené posvätnými symbolmi, spájajúc nás s predkami a božstvom. Pokiaľ vo svätyniach horí kadidlo, duša $CHA$ bude trvať." # todo: CHANGED
 lor_mining_tradition: "Bane $LOR$" # todo: CHANGED
 lor_mining_tradition_desc: "Naše krajiny sú bohaté na rudu a uhlie. Ťažba týchto zdrojov môže z nás urobiť bohatú krajinu a položiť základy pre naše veľké ambície." # todo: CHANGED
 lor_cultural_diversity: "Kraj mnohých kultúr" # todo: NEW TRANSLATION
 lor_cultural_diversity_desc: "Naše územie je domovom mnohých rôznych národov a kultúr. Vytvoriť jednotný štát, ktorý by nimi vládol, nebude ľahké, ale musíme to urobiť. Len potom budeme hodnými nástupcami $LOR_ADJ$ štátu, z ktorého pochádzame." # todo: CHANGED
 lor_three_bishoprics: "Kraj biskupov" # todo: NEW TRANSLATION
 lor_three_bishoprics_desc: "$LOR$ je domovom mnohých biskupov s mocnými podporovateľmi v zahraničí i vnútri Cirkvi. Spolupráca s nimi bude užitočná pri presadzovaní našich záujmov v širšej Cirkvi. Podpora biskupov nám tiež uľahčí pacifikáciu obyvateľstva." # todo: CHANGED
 lor_between_great_powers: "Dedičstvo starých kráľov" # todo: NEW TRANSLATION
 lor_between_great_powers_desc: "Naše krajiny kedysi tvorili dôležitú časť Lotharingie, jedného z franských kráľovstiev. Ak nechceme upadnúť do bezvýznamnosti, musíme si zabezpečiť diplomatickú pozíciu a nadviazať trvalé spojenectvá." # todo: NEW TRANSLATION
 lor_fortified_cities: "Opevnené mestá $LOR$" # todo: CHANGED
 lor_fortified_cities_desc: "Ovládame dôležité priechody na niekoľkých riekach, ktoré musíme brániť za každú cenu, ak chceme zabezpečiť svoju nezávislosť. V tomto smere musíme modernizovať veľké mostné hrady našich miest a postaviť veľké citadely na strategických miestach." # todo: CHANGED
 bos_land_of_many_churches: "Mnoho cirkví $BOS$" # todo: CHANGED
 bos_land_of_many_churches_desc: "$BOS$ je domovom niekoľkých vier. Naša krajina je rozdelená medzi $orthodox_ADJ$ a $catholic_ADJ$ cirkvi, ale je tu tiež domovom $south_slavic_group$ $christian_ADJ$ veriacich, #italic Krstjani#! Oddelení od centrálneho dohľadu budeme musieť podporovať lokálne porozumenie a harmóniu medzi týmito skupinami, aby sme udržali stabilitu." # todo: CHANGED
 bos_cultural_customs: "Stećci $BOS$" # todo: CHANGED
 bos_cultural_customs_desc: "Náš ľud praktizuje jedinečné zvyky, ktoré prekračujú náboženské rozdiely. Výstavba #italic stećci#!, bohato zdobených náhrobných kameňov, je tradícia zdielaná nami všetkými bez ohľadu na vieru. Tieto výrazné pamiatky robia našu krajinu výnimočne bosnianskou." # todo: CHANGED
 bos_katun_communities: "Vlachské katúny" # todo: NEW TRANSLATION
 bos_katun_communities_desc: "Časti nášho obyvateľstva sú organizované do autonómnych pastevno-samosprávnych komunít. Namiesto toho, aby sme ich zmenili na poslušnosť centrálnej vláde, mali by sme s nimi spolupracovať a tak získať viac zdrojov z našich odľahlejších oblastí." # todo: CHANGED
 bos_influence_of_the_stanak: "Stanakové zhromaždenia" # todo: NEW TRANSLATION
 bos_influence_of_the_stanak_desc: "Naša šľachta sa pravidelne stretáva, aby prerokovala najnaliehavejšie otázky krajiny. Tieto zhromaždenia zaisťujú, že naši páni sú zjednotení vo svojich politikách a prejavujú súdržnosť počas zasadnutí parlamentu." # todo: CHANGED
 bos_defiant_terrain: "Nedobytný terén" # todo: NEW TRANSLATION
 bos_defiant_terrain_desc: "$BOS$ je krajina zalesnených kopcov a hôr, pretkaná údolami riek. Tento terén sa prirodzene hodí na spomalenie a vyčerpanie útočiacich armád a mali by sme toho využiť. Zapojenie nepriateľa len vtedy, keď nám to prospieva, a nechanie nepriateľského terénu, aby zjedol ich zásoby a vojská, zachová naše sily." # todo: CHANGED
 bos_kingly_ambitions: "Kráľovské ambície" # todo: NEW TRANSLATION
 bos_kingly_ambitions_desc: "Úsilie a tvrdá práca nášho ľudu si zaslúžia uznanie a ochranu. Zriadime pre seba prestížny titul a tým zabezpečíme uznanie od susedných vládcov, formalizujúc náš status cez diplomatické väzby." # todo: CHANGED
 cir_tribal_elections: "Kmeňové voľby" # todo: NEW TRANSLATION
 cir_tribal_elections_desc: "Zvolíme menovitého vodcu nášho ľudu, ktorý bude pôsobiť ako náš zástupca, ale nebude zasahovať do dohľadu miestnych pánov." # todo: CHANGED
 cir_mercenary_employment: "$CIR_ADJ$ žoldnieri" # todo: CHANGED
 cir_mercenary_employment_desc: "Naše územia boli opakovane napádané cudzími mocnosťami a náš ľud zotročený. Niektorí z týchto otrokov, využití ako vojaci, si v novom živote vybudovali moc a bohatstvo. Trochou presviedčania by sme ich mohli prinútiť vrátiť sa a ochrániť našu krajinu." # todo: CHANGED
 cir_horsemen_of_the_steppe: "Zruční jazdci stepi" # todo: NEW TRANSLATION
 cir_horsemen_of_the_steppe_desc: "Naša poloha na okraji stepi spôsobila mnohé jazdecké vpády do našich domovov. Ak chceme zabezpečiť nezávislosť, budeme musieť povolať veľké vojsko a rozšíriť vplyv nad stepami, zabezpečujúc naše vnútrozemie." # todo: CHANGED
 cir_city_and_fortress: "Opevnené mestá" # todo: NEW TRANSLATION
 cir_city_and_fortress_desc: "Naše osady ležia nechránene a sú ľahkou korisťou pre každého votrelca. Ako tieto osady rastú, môžeme priamo začleniť kopcovitý terén do našich obranných línií a zvýšiť ich ochranu. Ak treba, môžeme dokonca vytvoriť vyvýšený terén potrebný na obranu." # todo: CHANGED
 cir_grand_prince_of_circassia: "Veľké kniežactvo" # todo: NEW TRANSLATION
 cir_grand_prince_of_circassia_desc: "Aby sme zjednotili náš ľud, zvolíme najväčšieho z našich pánov za Veľkého kniežaťa, ktorý bude slúžiť ako inšpiratívny vodca pre naše vojská." # todo: CHANGED
 cir_multireligious_society: "Náboženská koexistencia" # todo: CHANGED
 cir_multireligious_society_desc: "Naše krajiny často navštevujú mnohí $catholic_ADJ$, $muslim_ADJ$ a $orthodox_ADJ$ ľudia, ktorí s nami často obchodujú. Mali by sme podporovať kolektívnu toleranciu medzi všetkými našimi poddanými, aby sme podporili mier a stabilitu." # todo: CHANGED
 seren_taun: "Sérén Taun" # todo: NEW TRANSLATION
 seren_taun_desc: "Slávený po žatve, festival #italic Sérén Taun#! je každoročný vďakyvzdávací obrad oslavujúci poľnohospodársku hojnosť. Označený rituálmi, obetami a hudbou, posilňuje spoločenské väzby našich #italic kampung-kampung#! a pripomína svätý balans medzi ľuďmi, ryžou a prírodou." # todo: CHANGED
 pepper_of_the_parahyangan: "Parahyanganské korenie" # todo: NEW TRANSLATION
 pepper_of_the_parahyangan_desc: "Úrodná sopečná pôda sundanských vysočín je ideálna na pestovanie cennej koreniny — čierneho korenia. Obchodníci z celého sveta hľadajú naše koreninové zrná pre ich silu a arómu. Musíme využiť tento prírodný poklad na rozšírenie nášho vplyvu skrze korenie." # todo: CHANGED
 pan_asian_trade: "Panázijský obchod" # todo: NEW TRANSLATION
 pan_asian_trade_desc: "Sunda leží na križovatke veľkých impérií: $india$, $CHI$ a islamského sveta. Umiestnením sa ako nenahraditeľný uzol v tejto sieti získame prístup k tovarom, myšlienkam a partnerom naprieč $asia$, premeniac naše prístavy na brány prosperity." # todo: CHANGED
 extend_kampung_kampung: "Rozšíriť kampung-kampung" # todo: NEW TRANSLATION
 extend_kampung_kampung_desc: "Základom $SUN_ADJ$ spoločnosti sú každé #italic kampung#!, vidiecke spoločenstvá roztrúsené po krajine. Investovanie do infraštruktúry týchto dedín zabezpečí udržateľný rast, silné miestne vodcovstvo a odolnosť proti hladu a invázii." # todo: CHANGED
 sca_unified_scandinavia: "Zjednotená $SCA$" # todo: CHANGED
 sca_unified_scandinavia_desc: "Spojenie $DAN$, $NOR$, $SWE$ a $FIN$ pod jednou korunou zmenilo sever z bojiska konkurenčných kráľov na centralizovanú mocnosť. S jednotnou administráciou a zvýšenou spoluprácou medzi stavmi môžeme uplatňovať silnejšiu kontrolu nad ríšou." # todo: CHANGED
 sca_legacy_kalmar_union: "Dedičstvo Kalmarskej únie" # todo: NEW TRANSLATION
 sca_legacy_kalmar_union_desc: "Aj keď sa Kalmarská únia rozpadla v konflikte, ustanovila precedens pre zdieľanú severskú suverenitu. Čerpajúc z tohto dedičstva potvrdzujeme našu autoritu a pripomíname poddaným, že jednota prináša silu, nie zotročenie." # todo: NEW TRANSLATION
 sca_sound_toll: "Clá na Øresunde" # todo: NEW TRANSLATION
 sca_sound_toll_desc: "Kontrola nad Øresundom nám udeľuje právo uložiť Poplatok za Sound na všetky cudzie lode prechádzajúce $DAN_ADJ$ prielivmi. Toto starobylé privilegium premieňa geografickú výhodu na hmatateľné bohatstvo a posilňuje našu dominanciu nad severným obchodom." # todo: CHANGED
 norwegian_heritage: "$NOR_ADJ$ námorné dedičstvo" # todo: CHANGED
 norwegian_heritage_desc: "$NOR$ drsné pobrežia a námorné tradície formovali ľud zručný v plavbe, rybolove a navigácii. Dedičstvo $NOR_ADJ$ rybárov a lodiarov poháňa naše námorné snahy a podporuje živobytie našich pobrežných komunít." # todo: CHANGED
 danish_heritage: "$DAN_ADJ$ dedičstvo dokov" # todo: CHANGED
 danish_heritage_desc: "$DAN$ dlhé námorné tradície a majstrovstvo námornej logistiky vyústili do veľkých dokových zariadení, ako tie v $kobenhavn$. Ako $SCA$ nadobúdame tieto silné infraštruktúry a tradície, čo zvyšuje náš diplomatický postoj a námornú pripravenosť." # todo: CHANGED
 swedish_roots: "$SWE_ADJ$ vojenské korene" # todo: CHANGED
 swedish_roots_desc: "Od disciplinovaných karolínskych radov po silné sedliacke voľné držby, vojenská zdatnosť $SWE$ je základným pilierom Škandinávie. Integráciou $SWE_ADJ$ inštitúcií a náborových systémov posilníme mužstvo a silu našej ríše." # todo: CHANGED
 finnish_heritage: "$FIN_ADJ$ pohraničná jazda" # todo: CHANGED
 finnish_heritage_desc: "$FIN_ADJ$ jazda — #italic Hakkapeliitta#! — si získala hrozivú povesť vo vojnách v $europe$. Títo jazdci, vychovaní v divých lesoch a rovinách $finland_area$, prinášajú skúsenosti, prispôsobivosť a húževnatosť do našich línií. Formalizovaním ich úlohy vytvoríme stály elitný zbor v našich armádach." # todo: CHANGED
 symbol_of_catholicism: "Symbol $catholic$" # todo: CHANGED
 symbol_of_catholicism_desc: "$jerusalem$ je najsvätejším mestom v kresťanstve, samotným miestom Kristovho utrpenia a vzkriesenia. Upevnením $catholic_ADJ$ nadvlády nad týmito posvätnými miestami sa stávame duchovným majákom Latinského sveta a pilierom pravej viery." # todo: CHANGED
 protectors_of_jerusalem: "Strážcovia $KOJ$" # todo: CHANGED
 protectors_of_jerusalem_desc: "Stojíme na predných líniách kresťanstva, obkolesení neveriacimi. Je našou svätou povinnosťou ochrániť Sväté mesto a vzbudzovať hrôzu v srdciach pohanov, ktorí by sa ho opovážili ukradnúť." # todo: NEW TRANSLATION
 latin_patriarch: "Latinský patriarchát" # todo: NEW TRANSLATION
 latin_patriarch_desc: "$PAP$ znovu ustanovil latinského patriarchu $KOJ$, kedysi vyhnaného a zabudnutého. Teraz obnovený patriarcha posilní náš vplyv v 4rome$ a upevní našu rolu ako strážcu záujmov Cirkvi na Východe." # todo: CHANGED
 rites_holy_sepulchre: "Rity Svätého hrobu" # todo: CHANGED
 rites_holy_sepulchre_desc: "V Kostole Svätého hrobu sa staroveké latinské rity opäť vykonávajú v plnej nádhere. Tieto slávnostné obrady, vzdávajúce úctu smrti a vzkrieseniu Krista, posilňujú náš božský mandát vládnuť tejto zemi a šíriť učenie našej viery." # todo: CHANGED
 latinate_integration: "Latinská integrácia" # todo: NEW TRANSLATION
 latinate_integration_desc: "Naša ríša je taviacim kotlom šľachtického pôvodu z celého $europe$, horlivých pútnikov a starých levantských rodov. Starostlivým vládnutím prepletieme toto rozmanité dedičstvo do latinskej $christian_ADJ$ spoločnosti, kde viera a kultúra idú ruka v ruke." # todo: CHANGED
 chinese_siege_engineers: "Plánované obliehania" # todo: NEW TRANSLATION
 chinese_siege_engineers_desc: "Naše hrubé, pevné opevnenia predstavujú generácie obranného inžinierstva. Na druhej strane, naše dôkladné porozumenie slabinám opevnení získané pri stavbe nepriestrelných stien nám pomáha vyvinúť obzvlášť účinné obliehacie taktiky a stratégie." # todo: CHANGED
 chi_legitimate_claimant: "Nárok na Mandát" # todo: NEW TRANSLATION
 chi_legitimate_claimant_desc: "Naše začiatky možno boli skromné, ale dokázali sme viesť a inšpirovať lojalitu mnohých poddaných. Teraz sme vnímaní ako hodní náročníci Mandátu neba a Strednej ríše." # todo: CHANGED
 chi_great_rivers_of_china: "Úrodné rieky" # todo: NEW TRANSLATION
 chi_great_rivers_of_china_desc: "Hoci veľké rieky tečúce našimi zemami predstavujú isté riziká pre okolitých osadníkov, sú zároveň neoceniteľným nástrojom pre poľnohospodársku produkciu." # todo: CHANGED
 arabian_horsemanship: "$AIA_ADJ$ jazdecké umenie" # todo: CHANGED
 arabian_horsemanship_desc: "Kone, ktoré chováme, sú v mnohých cudzích krajinách žiadané pre svoju krásu a silu. S naším zameraním na ich chov a export z toho výrazne profitujeme." # todo: CHANGED
 arabian_desert_warfare: "Sila púšte" # todo: NEW TRANSLATION
 arabian_desert_warfare_desc: "Nehostinné púšte $AIA$ posilnili našich bojovníkov, schopných unaviť nepriateľa pred rozhodujúcim úderom." # todo: CHANGED
 arabia_cradle_of_islam: "Kolíska $muslim$" # todo: CHANGED
 arabia_cradle_of_islam_desc: "Naše krajiny hostia niektoré z najsvätejších miest v našej viere. Táto božská blízkosť robí našich ľudí hlboko spätými s vierou a inšpiruje ich k stále väčšiemu veľkodušnému jednaniu." # todo: CHANGED
 arabia_red_sea_trade: "Obchod Červeného mora" # todo: NEW TRANSLATION
 arabia_red_sea_trade_desc: "Po našom pobreží sa nachádza množstvo obchodných staníc, obchodujúcich s cennými tovarmi z našich i cudzych zemí. Je načase, aby sme si nárokovali svoju spravodlivú časť tohto bohatstva." # todo: CHANGED
 indonesia_outer_islands_archipelago: "Indonézske súostrovie" # todo: NEW TRANSLATION
 indonesia_outer_islands_archipelago_desc: "Námorné spojenia prirodzene zohrávajú veľkú úlohu v našej spoločnosti, keďže sme obkolesení vodami. Naša závislosť od námorného obchodu a dopravy robí prechod po moriach pre náš ľud priam samozrejmou." # todo: NEW TRANSLATION
 indonesia_naval_supremacy: "Námorná prevaha" # todo: NEW TRANSLATION
 indonesia_naval_supremacy_desc: "Naša politická relevantnosť v rámci súostrovia takmer výlučne závisí na sile našich námorných síl. Zlepšením lodárskych techník a výcviku posádok zabezpečíme našu dominanciu nad menšími štátmi $indonesia_region$." # todo: CHANGED
 indonesia_trading_hub_of_the_east: "Obchodný uzol Východu" # todo: NEW TRANSLATION
 indonesia_trading_hub_of_the_east_desc: "Nezáleží na pôvode či cieli, každý obchodník v $asia$ nakoniec prejde našimi zemami, prinášajúc cenné tovary a príbehy o svojich cestách." # todo: CHANGED
 indonesia_archipelago_of_many_faiths: "Krajina mnohých ľudí" # todo: NEW TRANSLATION
 indonesia_archipelago_of_many_faiths_desc: "Naše ostrovy sú domovom mnohých rôznych národov, hovoriacich rôznymi jazykmi a veriacich v mnohých bohov. Len ak vytvoríme spoločné porozumenie a toleranciu medzi nimi, zabezpečíme prosperitu krajiny." # todo: NEW TRANSLATION
 italian_universities: "Univerzity polostrova" # todo: NEW TRANSLATION
 italian_universities_desc: "$ITA$ je domovom mnohých veľkých univerzít a učencov. Ak chceme udržať plameň $renaissance$, musíme naďalej podporovať tieto veľké inštitúcie." # todo: CHANGED
 italy_great_families: "Veľké rody $ITA$" # todo: CHANGED
 italy_great_families_desc: "Po založení našej zjednotenej $ITA_ADJ$ ríše sme prijali mnohé veľké šľachtické rody do našej krajiny. Mali by sme využiť ich prestíž a reputáciu na zlepšenie vlastnej, pričom ich schopných členov necháme byť zaneprázdnenými." # todo: CHANGED
 italian_innovativeness: "$ITA_ADJ$ prispôsobivosť" # todo: CHANGED
 italian_innovativeness_desc: "S rozkvetom $renaissance$ prišlo hlbšie pochopenie obrovských krokov, ktoré môže ľudské úsilie dosiahnuť. Ak chceme byť naozaj národom pokroku, musíme sa bez strachu prispôsobiť novým myšlienkam a nikdy nedovoliť, aby inovácia bola brzdená." # todo: CHANGED
 italian_condottieri: "Slávni kapitáni condottieri" # todo: NEW TRANSLATION
 italian_condottieri_desc: "Naša krajina je preslávená produkciou veľkých vojenských myslí, či už slúžia vlastným záujmom alebo sú verní štátu. Mali by sme zabezpečiť, aby títo zruční intelektuáli slúžili predovšetkým nám." # todo: CHANGED
 usa_mayflower_compact: "Zmluva z Mayfloweru" # todo: NEW TRANSLATION
 usa_mayflower_compact_desc: "Spojení spoločným nebezpečenstvom a cieľom, skorí osadníci spísali pakt o samospráve. Aj v divočine našli semeno spoločnosti a kompromisu úrodnú pôdu." # todo: NEW TRANSLATION
 usa_empowered_assemblies: "Zmocnené zhromaždenia" # todo: NEW TRANSLATION
 usa_empowered_assemblies_desc: "Voľené zhromaždenia vznikli na kolóniách a posilnili pozemkových vlastníkov v samospráve. Pokorné počiatky slobody ležia v týchto inštitúciách." # todo: CHANGED
 usa_great_awakening: "Veľké prebudenie" # todo: NEW TRANSLATION
 usa_great_awakening_desc: "Vlna náboženského obnovenia prechádza krajinou, spochybňujúc staré autority a prebúdzať morálne svedomie narastajúceho ľudu." # todo: NEW TRANSLATION
 usa_declaration_of_independence: "Deklarácia nezávislosti" # todo: NEW TRANSLATION
 usa_declaration_of_independence_desc: "#italic Držíme tieto pravdy za samozrejmé, že všetci ľudia sú stvorení rovní.#!\n\nTýmto odvážnym vyhlásením prelámeme reťaze podriadenosti a prijmeme náš spoločný osud!" # todo: CHANGED
 usa_bill_of_rights: "Listina práv" # todo: NEW TRANSLATION
 usa_bill_of_rights_desc: "#italic ...alebo obmedzovať slobodu prejavu, alebo tlače; alebo právo ľudu pokojne sa zhromažďovať a žiadať vládu o nápravu sťažností.#!" # todo: RETRANSLATED ENGLISH
 usa_recognized_sovereignty: "Uznaná suverenita" # todo: NEW TRANSLATION
 usa_recognized_sovereignty_desc: "Zmluvy a diplomacia potvrdili, čo naše zápasy vydobyli. Naše miesto na diplomatickej scéne už nie je spochybňované, ale rešpektované." # todo: CHANGED
 usa_era_good_feelings: "Éra dobrých pocitov" # todo: NEW TRANSLATION
 usa_era_good_feelings_desc: "Po búrkach priniesol mier a jednota vzácny okamih národnej harmónie. Ľud kvitne optimizmom a poriadkom." # todo: CHANGED
 kon_bakongo_confederation: "Konfederácia Bakongo" # todo: NEW TRANSLATION
 kon_bakongo_confederation_desc: "Pred vznikom našej ríše sa ľudia tohto regiónu riadili kmeňovými radami a provinciálnymi alianciami. To, čo teraz voláme $KON$, vzniklo zo storočí prepletených vzťahov, kde lojalita k zemi a rodu prevládala nad lojalitou k hraniciam. Zjednotiť tento patchwork do centralizovanej ríše nebolo ľahké, ale dokázali sme to a držíme to pohromade." # todo: CHANGED
 kon_lineage_lukeni_lua_nimi: "Rod Lukeni lua Nimi" # todo: NEW TRANSLATION
 kon_lineage_lukeni_lua_nimi_desc: "Všetko musí niekde začať, a pre naše kráľovstvo to začalo s Lukeni lua Nimi. Bol viac než dobyvateľ — bol zakladateľom, otcom nášho štátu. Jeho krvná línia vzbudzovala rešpekt, nie len pre svoj pôvod, ale preto, že ľuďom pripomína, kto ako prvý odvážil snívať o zjednotenom $KON$." # todo: NEW TRANSLATION
 kon_european_contact: "Kontakt s $europe$" # todo: CHANGED
 kon_european_contact_desc: "Cudzinci prišli z mora s bradami, knihami a súdami vína. Priniesli so sebou cudzie bohy, cudzie jazyky a celý oceán príležitostí. Naši vyslanci spoznali ich zvyky, ich úmysly a — čo je najdôležitejšie — ako obrátiť ich potrebu spojencov vo svoj prospech." # todo: CHANGED
 kon_cultural_syncreticism: "Kultúrny synkretizmus" # todo: NEW TRANSLATION
 kon_cultural_syncreticism_desc: "Nápor cudzincov a kultúrne výmeny ovplyvnili našu spoločnosť. Napriek tomu sme nezanechali svoje spôsoby. Voláme na bohov po Kikongo menách, hrdo nosíme náboženské insignie a naše obrady znejú bubnami i hymnami. Toto je živý príklad našej jasnosti a bohovia sa zdajú súhlasiť." # todo: CHANGED
 kon_study_european_firearms: "Štúdium európskych palných zbraní" # todo: NEW TRANSLATION
 kon_study_european_firearms_desc: "Musket možno nerobí muža odvážnym, ale určite ho robí hrozivým. Nech sa v $europe$ chvália svojou nadradenosťou; my si kúpiť ich zbrane, zvládneme ich výcvik a čoskoro bude jediné, čo odlíši našich vojakov od ich, farba zástav." # todo: CHANGED
 kon_transatlantic_slave_trade: "Transatlantický obchod s $slaves_goods$" # todo: CHANGED
 kon_transatlantic_slave_trade_desc: "Väzni a pracovníci sú potrební za morom na prevádzku našich mnohých dielní, plantáží a baní. Hoci to nie je ušľachtilé, nikto nemôže poprieť ziskovosť týchto výprav." # todo: CHANGED
 ilk_restore_yam: "Obnoviť Yäm" # todo: NEW TRANSLATION
 ilk_restore_yam_desc: "Yäm, náš starobylý systém reléových staníc a kuriérov, kedysi spájal najvzdialenejšie kúty $MGE_ADJ$ sveta. Obnovením tejto obrovskej siete cez $persia_region$ a ďalej zabezpečíme, že naše rozkazy budú rýchle, naši vyslanci bezpeční a naše panstvo pohotové, tak, ako tomu bolo v zlatých dňoch Chanov." # todo: CHANGED
 ilk_ilkhanate_resurgent: "Obnovené $ILK$" # todo: NEW TRANSLATION
 ilk_ilkhanate_resurgent_desc: "To, čo raz bolo zlomené, teraz znovu povstáva. Naše zástavy znova vlajú nad $persia_region$, budíac úctu i strach v rovnakom pomere. Ako sa šíria správy o našom vzostupe, svet si znovu spomenie, čo znamená byť vládcom pravého $ILKHANATE_LEADER_MALE$." # todo: CHANGED
 ilk_persian_arts_and_architecture: "Perzské umenie a architektúra" # todo: NEW TRANSLATION
 ilk_persian_arts_and_architecture_desc: "Naši predkovia vládli mečom, no ich veľkosť sa merala palácmi, knižnicami a minaretmi. Nasledujme ich príklad a financujme nielen múry a cesty, ale aj mešity, záhrady a školy ako svedectvo veľkoleposti $ilkhanate$." # todo: NEW TRANSLATION
 ilk_descendants_of_genghis_khan: "Potomkovia $genghis_khan_name_no_tooltip$" # todo: NEW TRANSLATION
 ilk_descendants_of_genghis_khan_desc: "Krv $rank_empire_horde_ruler_suffix_male$ tečie v našich žilách. Nech si nikto nepomýli, že naša vláda bola ustanovená na stepi a spečatená dobytím. Naši jazdci zostávajú neprekonateľní a naše prapory nesú nielen meno, ale aj dedičstvo." # todo: NEW TRANSLATION
 ilk_new_roots: "Nové korene" # todo: NEW TRANSLATION
 ilk_new_roots_desc: "Dni čistej stepnej doby sa skončili. Zasiali sme sa do pôdy pokroku a reforiem. Z tejto pôdy vyrastie stabilnejší, sofistikovanejší štát. Hoci naše srdcia stále bijú rytmom otvorených polí, naša budúcnosť leží v trvalých inštitúciách, nie v pominutých nájazdoch." # todo: CHANGED
 hin_sepahi: "Sipâhi" # todo: NEW TRANSLATION
 hin_sepahi_desc: "Zanedbanie dôležitosti pechoty bolo pádom mnohých bystrejúcich dobyvateľov. Musíme zabezpečiť, aby naše jednotky boli vybavené najefektívnejšími palnými zbraňami a precvičené v taktikách, ktoré sa dokážu prispôsobiť každému nepriateľovi." # todo: CHANGED
 hin_united_india: "Zjednotené $india$" # todo: CHANGED
 hin_united_india_desc: "Mnohé národy, kultúry, jazyky a štáty, ktoré tvoria $india$, sa napokon zjednotia pod jednou vlajkou. Len s spoločným pochopením a starostlivo pestovanou jednotou medzi všetkými našimi ľuďmi môžeme smerovať k väčším ambíciám." # todo: CHANGED
 hin_ganga: "Gaṅgā" # todo: NEW TRANSLATION
 hin_ganga_desc: "Mnohí $hindu_ADJ$ veriaci uctievajú rieku Gangu ako bohyňu prinášajúcu očistenie a vykúpenie. Vyzývame pútnikov, aby navštívili jej brehy a kúpali sa v posvätných vodách. Cez Gaṅgā je národ očistený." # todo: CHANGED
 hin_persianate_court: "Perzská dvorová kultúra" # todo: NEW TRANSLATION
 hin_persianate_court_desc: "Cudzie jazyky a šľachtické zvyky už dlhý čas bohato ovplyvňujú dvory $india$. Mali by sme tieto väzby využiť na získanie najspôsobilejších poradcov do našej služby." # todo: CHANGED
 hin_gunpowder_empire: "Impérium strelného prachu" # todo: NEW TRANSLATION
 hin_gunpowder_empire_desc: "Naše majstrovstvo v puzdrovej vojne nám prinieslo slávu a pomohlo založiť veľký štát. Táto dominancia by nebola možná bez podpory výroby palných zbraní pre naše jednotky." # todo: CHANGED
 hin_sufism: "Pritiahnuť súfijských misionárov" # todo: NEW TRANSLATION
 hin_sufism_desc: "Prinápor $muslim_ADJ$ princov po svete súťaží o priťahovanie najmudrejších súfijských učiteľov. Ako naša sláva rástla, čoraz viac súfiov k nám prichádza. Mestá sú zakladané tam, kde sa usadia, často v predtým nehostinných oblastiach, a miestni ľudia sú inšpirovaní konverziou múdrosťou súfiov." # todo: CHANGED
 hin_administration_of_india: "Správa Indie" # todo: NEW TRANSLATION
 hin_administration_of_india_desc: "Správa štátu tak veľkého ako celý subkontinent nie je jednoduchá. Budeme musieť vyvinúť robustný systém administrácie v spolupráci s miestnymi kniežatami, aby sme maximálne využili produkciu a zabezpečili široké zloženie stability." # todo: CHANGED
 hin_indian_empire: "Impérium $india$" # todo: CHANGED
 hin_indian_empire_desc: "Žiadny vládca, či už $muslim_ADJ$, $hindu_ADJ$, $buddhist_ADJ$ alebo $jain_ADJ$, sa nikdy nepodarilo dobyť celý subkontinent. My budeme prví univerzálni vládcovia $india$!" # todo: CHANGED
 hin_rocketry: "Vyvinúť raketovú technológiu" # todo: NEW TRANSLATION
 hin_rocketry_desc: "Rokety s kovovými obalmi ešte neboli široko adaptované pre vojenské použitie, no ich výbušná sila má určite taktické uplatnenie. Mali by sme s touto technológiou experimentovať a testovať ju na bojisku." # todo: NEW TRANSLATION
 hin_industrialization: "Industrializácia $india$" # todo: CHANGED
 hin_industrialization_desc: "Podmienky v našej ekonomike sú ideálne pre rýchly priemyselný rast. S novými technológiami môžeme zabezpečiť lepšie podmienky pre miestnu produkciu, obzvlášť v textilnom priemysle. Zameranie na nové metódy znamená, že náš štát môže zabezpečiť stabilné priemyselné rozširovanie." # todo: CHANGED
 cth_merchant_legacy: "Obchodnícke dedičstvo" # todo: NEW TRANSLATION
 cth_merchant_legacy_desc: "Fénické obchodné flotily preplávali Stredozemie po stáročia. Toto ekonomické dedičstvo znamená, že sme efektívnejší — a krutejší — v obchode. Znovu budeme vládnuť prílivu a odlivu tovarov!" # todo: CHANGED
 cth_breadbasket_of_rome: "Žitnica Ríma" # todo: NEW TRANSLATION
 cth_breadbasket_of_rome_desc: "Storočia dozadu priniesli naše vylepšenia zavlažovania a pestovania olív $CTH$ prezývku 'žriebová oáza Ríma.' Teraz sa opäť obrátime k našim starobylým poľnohospodárskym znalostiam a opäť sa budeme biť s púšťou, aby sme sadili olivové háje, ako kedysi." # todo: CHANGED
 cth_mercenary_army: "Armáda žoldnierov" # todo: NEW TRANSLATION
 cth_mercenary_army_desc: "Naše starobylé kráľovstvo nemalo masívnu populáciu, takže po stáročia sme sa spoliehali na žoldnierov počas vojen. Od obnovenia $CTH$ sme v tejto tradícii pokračovali, aby sme ušetrili našu populáciu od nebezpečenstiev bojiska." # todo: CHANGED
 cth_cothons: "Cothon" # todo: NEW TRANSLATION
 cth_cothons_desc: "Staroveký fénický #italic cothon#! bol technologickým zázrakom, ktorý uľahčoval efektívnu stavbu lodí. Teraz toto veľké dedičstvo slúži ako plán pre celú našu krajinu. Študovaním starodávnych lodárskych techník opäť zažiarime v tejto oblasti a $CTH_ADJ$ námorníctvo čoskoro ovládne Stredozem." # todo: CHANGED
 cth_phoenician_sailors: "Fénickí námorníci" # todo: NEW TRANSLATION
 cth_phoenician_sailors_desc: "Po obnovení nášho starovekého kráľovstva sme začali nadväzovať styky s našimi fénickými bratmi v Líbyi. Výsledkom je stály prísun dobrovoľníkov, ktorí chcú prispieť k obnove starovekého fénického kráľovstva $CTH$. Zdá sa, že teraz môžeme udržať oveľa väčšiu flotilu..." # todo: CHANGED
 cth_legacy_of_hannon: "Dedičstvo Hannona" # todo: NEW TRANSLATION
 cth_legacy_of_hannon_desc: "Hannon Moreplavec bol legendárny staroveký prieskumník, ktorý putoval ďaleko na juh afrického pobrežia. Pôjdeme v jeho šľapajach a uskutočníme výpravy za účelom obnovenia nášho strateného obchodného impéria. Tentokrát naše výpravy pôjdu ešte ďalej, hľadajúc nové obchodné príležitosti po celom svete." # todo: CHANGED
 cth_beyond_the_pillars: "Za stĺpmi" # todo: NEW TRANSLATION
 cth_beyond_the_pillars_desc: "Je čas, aby naše obchodné fabriky prelomili mýtické Stĺpy Herkula. Kombináciou starovekých znalostí kolonizácie s modernými objavmi sa dokážeme osádzať efektívnejšie než mladšie národy, ktoré sú v tom nováčikmi. $CTH_ADJ$ kolónie čoskoro nájdete po celom svete!" # todo: CHANGED
 cth_wine_traders: "Punský obchod s $wine$" # todo: CHANGED
 cth_wine_traders_desc: "V staroveku sme vytvorili obchodný kanál s $wine$ výrobou veľkého množstva nízkokvalitného $wine$ na výmenu a dovážali sme si kvalitné domov. Stavajúc na tejto tradícii plánujeme rozšíriť kapacity našej výroby $wine$ — my #italic budeme#! dominovať obchodu s $wine$ v Stredozemí!" # todo: CHANGED
 cth_punic_global_trade: "Kartáginský globálny obchod" # todo: NEW TRANSLATION
 cth_punic_global_trade_desc: "Storočia naša krajina dominovala stredomorskému obchodu. Teraz, s novými objavmi posledných storočí, sme pripravení dominovať svetu. Čoskoro bude v každom prístave na svete $CTH_ADJ$ obchodná loď!" # todo: CHANGED
 cth_sufet_rule: "Vláda Šūfeṭ" # todo: NEW TRANSLATION
 cth_sufet_rule_desc: "Naše staroveké kráľovstvo viedol volený predseda štátu známy ako #italic Šūfeṭ#!. V tejto novej modernej dobe reorganizujeme našu vládu, čerpajúc zo skúseností antiky a kombinujúc ich s modernými teóriami, aby sme vytvorili silný republikánsky systém, ktorý prekoná každú doterajšiu republiku!" # todo: CHANGED
 network_of_cities: "Sieť miest" # todo: NEW TRANSLATION
 network_of_cities_desc: "Cez jazerá a údolia sa naše mestá spájajú cestami, trhmi a spoločným cieľom, čím posilňujú náš vplyv." # todo: NEW TRANSLATION
 status_by_merit: "Postavenie podľa zásluh" # todo: NEW TRANSLATION
 status_by_merit_desc: "Bojovníci a šľachtici stúpajú vďaka odvaze a službe, čím sa zabezpečí, že autorita patrí tým, ktorí si ju skutočne zaslúžili." # todo: NEW TRANSLATION
 expansion_merchant_guilds: "Rozšírenie obchodných cechov" # todo: NEW TRANSLATION
 expansion_merchant_guilds_desc: "Pochtēcah obchodníci rozširujú svoje trasy ďaleko za hranice našich krajín a obohacujú každý trh verný Mexihcah." # todo: NEW TRANSLATION
 centralized_city_governance: "Centralizované mestské riadenie" # todo: NEW TRANSLATION
 centralized_city_governance_desc: "Reforma našej vlády, s cieľom podporiť expanziu našich novo nadobudnutých mestských území, by mala byť zjednotená pod prísnym dohľadom, čím vznikne usporiadanejšia a spoľahlivejšia správa." # todo: NEW TRANSLATION
 wealth_of_mesoamerica: "Bohatstvo Mesoameriky" # todo: NEW TRANSLATION
 wealth_of_mesoamerica_desc: "Úrodné pôdy, lesy a bane Ānāhuac prinášajú obrovské bohatstvo, ktoré podporuje náš rast a impériálne ambície. Správne využitie týchto zdrojov posilní naše bohatstvo." # todo: NEW TRANSLATION
 study_european_colonizers: "Študovať európskych kolonizátorov" # todo: NEW TRANSLATION
 study_european_colonizers_desc: "Cudzinci nadviazali kontakt s naším ľudom. Ich neznáme lode a zbrane vzbudzujú úžas a strach. Pochopenie ich postupov môže byť kľúčom k nášmu prežitiu." # todo: CHANGED
 new_fire_ceremonies: "Nové ohňové obrady" # todo: NEW TRANSLATION
 new_fire_ceremonies_desc: "Raz za päťdesiatdva rokov je svet obnovený plameňom, ktorý zjednocuje ľudí v viere a kozmickej rovnováhe." # todo: NEW TRANSLATION
 sun_must_rise: "Slnko musí vyjsť" # todo: NEW TRANSLATION
 sun_must_rise_desc: "Cez oddanosť a rituál udržiavame cestu slnka živú, upokojujeme srdcia a posilňujeme ducha nášho ľudu. Zachovanie rovnováhy, ba aj sveta, spočíva na našich pleciach." # todo: NEW TRANSLATION
 krs_kurdish_tribes: "Kmeňová vernosť" # todo: NEW TRANSLATION
 krs_kurdish_tribes_desc: "Uplatnením našej moci nad všetkými kmeňmi $kurdish_culture$ budeme môcť povolať ich skúsených, otužilých bojovníkov na obranu našej krajiny." # todo: NEW TRANSLATION
 krs_legacy_of_the_kurdish_dynasties: "Dedičstvo dynastií $kurdish_culture$" # todo: NEW TRANSLATION
 krs_legacy_of_the_kurdish_dynasties_desc: "Náš ľud založil niekoľko veľkých dynastií, ktoré vládli územiam od $egypt_region$ po Irán. Spojením nášho štátu so slávou minulých vládcov sa staneme zjednocujúcim symbolom pre ľudí $kurdish_culture$ a urobíme naše vládnutie legitímnejším v očiach našich poddaných." # todo: NEW TRANSLATION
 krs_kurdish_quarters: "Prosperujúce štvrte $kurdish_culture$" # todo: NEW TRANSLATION
 krs_kurdish_quarters_desc: "V časoch cudzej vlády mnohí z našich ľudí zakladali v mestách prevažne $kurdish_culture$ štvrte. Hoci tieto oblasti prosperovali aj pod vzdialenými vládcami, teraz môžeme priamo využiť ich bohatstvo a lepšie zaručiť blahobyt našich ľudí v budúcnosti." # todo: NEW TRANSLATION
 krs_kurdish_horses: "Prispôsobivá kavaléria" # todo: NEW TRANSLATION
 krs_kurdish_horses_desc: "Naše domovy sú obkolesené mnohými nádejnými dobyvateľmi, lačnými po podrobení nášho ľudu. Kým naše domáce terény môžu spomaľovať nepriateľské armády, zároveň sťažujú rýchlu reakciu našich vlastných vojsk. Silná kavaléria nám však umožní rýchlo reagovať na akékoľvek hrozby, nech už ich je akokoľvek veľa." # todo: NEW TRANSLATION
 krs_kurdish_mercenaries: "Skúsenosti žoldnierov" # todo: NEW TRANSLATION
 krs_kurdish_mercenaries_desc: "Náš ľud už dlho slúžil ako najatí žoldnieri pre cudzích pánov, získavajúc cenné bojové skúsenosti v ich službách. S naším vlastným štátom teraz nastal čas povolať týchto skúsených bojovníkov pod náš prapor." # todo: NEW TRANSLATION
 krs_kurdish_warrior_poets: "Bojoví básnici" # todo: NEW TRANSLATION
 krs_kurdish_warrior_poets_desc: "Naši vládcovia nemajú byť len zdatní bojovníci; mali by byť tiež vzdelaní v oblasti výtvarného umenia a účinnej správy. Písaním textov a dokumentovaním svojich panovaní naši vodcovia odovzdajú vedomosti a históriu nášho ľudu ďalším generáciám, čím zabezpečia, že sa žiadny cenný poznatok neztratí." # todo: NEW TRANSLATION
 mohe_ancestry: "Pôvod Mohe" # todo: NEW TRANSLATION
 mohe_ancestry_desc: "Náš ľud pochádza z kmeňov Mohe z amurských lesov. Ich tradície poľovania, chovu a odolného pohraničného života formujú našu spoločnosť." # todo: NEW TRANSLATION
 warka_ties: "Väzby s Warka" # todo: NEW TRANSLATION
 warka_ties_desc: "Naše väzby s Warka nám priniesli veľké vedomosti o love a zbere potravy. Vďaka týmto praktikám zabezpečíme, že náš ľud zostane nakŕmený aj počas dlhých zim." # todo: NEW TRANSLATION
 shadow_of_ambition: "Tieň ambícií" # todo: NEW TRANSLATION
 shadow_of_ambition_desc: "Zjednotenie jurchenských kmeňov je len prvý krok v našom ambicióznom vzostupe k moci. Čoskoro naše meno vyvolá strach a rešpekt naprieč celým kontinentom." # todo: NEW TRANSLATION
 niyamniyan: "Niyamniyan" # todo: NEW TRANSLATION
 niyamniyan_desc: "Tradícia Piatich ušľachtilých talentov zahŕňa jazdu, lukostreľbu, vojenské velenie, lojalitu a disciplínu. Tieto aspekty našej vojenskej spoločnosti tvoria chrbticu našej hrdej kultúry." # todo: NEW TRANSLATION
 southern_campaigns: "Južné kampane" # todo: NEW TRANSLATION
 southern_campaigns_desc: "$CHI$ je domovom nesmierneho bohatstva, prestíže a poznania. Pod vládou slabej dynastie padá na naše plecia úloha uchopiť moc a vrátiť blahobyt a nádheru týmto zemiam." # todo: NEW TRANSLATION
 foreign_learning: "Získavanie cudzích poznatkov" # todo: NEW TRANSLATION
 foreign_learning_desc: "Od zahraničných učencov a textov prevezmeme nové administratívne, vojenské a vedecké postupy, čím zrýchlime tempo nášho technologického rozvoja." # todo: NEW TRANSLATION
 melaka_tree: "Melacký strom" # todo: NEW TRANSLATION
 melaka_tree_desc: "Ako hovorí legenda, plachý jeleček hľadal útočisko na mieste, ktoré sa neskôr stalo naším územím. Náš začiatok je pokorný — len rybárska dedinka pod tieňom Melackého stromu. Z týchto koreňov vyrastie ľud, ktorý jedného dňa utvorí celý región." # todo: NEW TRANSLATION
 orang_laut: "Orang Laut" # todo: NEW TRANSLATION
 orang_laut_desc: "Ešte pred naším vzostupom sa Orang Laut potulovali úžinami ako majstri vetra a prílivu. Teraz, učením sa ich spôsobov a zamestnávaním zopár vyvolených, vedieme obchodníkov cez úzke vody a chránime naše pobrežie pred pirátmi. Takáto bdelosť zabezpečí, že všetci, ktorí plavia do $malacca$, dorazia bezpečne." # todo: NEW TRANSLATION
 congregation_of_merchants: "Spoločenstvo obchodníkov" # todo: NEW TRANSLATION
 congregation_of_merchants_desc: "Od $arabia_region$ po Čínu a pobrežia $south_asia$ sa obchodníci zo všetkých brehov zbiehajú do $malacca$. Priťahovaní spravodlivými zákonmi, bezpečnými vodami a rušnými trhmi, vytvoria veľké spoločenstvo, ktoré obohatí naše prístavy a roznesie naše meno po moriach." # todo: NEW TRANSLATION
 connections_with_china: "Spojenia s Čínou" # todo: NEW TRANSLATION
 connections_with_china_desc: "Naši poslovia získali uznanie od najprestížnejších čínskych panovníkov. Medzi nami prúdi tribut a dobrá vôľa, čo nám prináša prestíž, ochranu a privilegované miesto v rozsiahlej sieti ich obchodu." # todo: NEW TRANSLATION
 control_the_malacca_strait: "Ovládnuť Malackú úžinu" # todo: NEW TRANSLATION
 control_the_malacca_strait_desc: "Úzka $inner_malacca_strait$ je chrbticou nášho námorného obchodu. Ovládnutím tejto životne dôležitej úžiny nasmerujeme bohatstvo národov do našich prístavov a upevníme sa ako neprekonateľní strážcovia východo-západného obchodu." # todo: NEW TRANSLATION
 shahbandar: "Systém Šahbandara" # todo: NEW TRANSLATION
 shahbandar_desc: "Aby sme riadili obrovský prílev obchodníkov prichádzajúcich do našich prístavov, vymenujeme Šahbandara ako úrad, ktorý bude dohliadať na colnicu, riešiť spory a organizovať cudzie štvrte. Táto funkcia prinesie poriadok do nášho rušného obchodného centra a posilní našu úlohu ako križovatky morí." # todo: NEW TRANSLATION
 settle_the_islands: "Osídliť ostrovy" # todo: NEW TRANSLATION
 settle_the_islands_desc: "Na roztrúsených ostrovoch našej vlasti ležia nespočetné pobrežia, ktoré čakajú na náš dotyk. Posilnením našej prítomnosti na týchto ostrovoch zabezpečíme bohatstvo našich ľudí: nové obchodné stanice, nové úrody a nové spoločenstvá viazané vlnami, ktoré nás spájajú." # todo: NEW TRANSLATION
 people_of_the_sea: "Ľudia mora" # todo: NEW TRANSLATION
 people_of_the_sea_desc: "Sme ľud formovaný vetrom a prílivom. Od detstva sa učíme zvyky monzúnu, pulz úžín a volanie otvoreného oceánu. Naši námorníci nesú tieto vedomosti do každej cesty a získavajú si slávu naprieč súostrovím za svoju odvahu a majstrovstvo." # todo: NEW TRANSLATION
 expert_hagglers: "Majstri vyjednávania" # todo: NEW TRANSLATION
 expert_hagglers_desc: "Kdekoľvek sa naši obchodníci objavia, či na pobrežiach $south_asia$ alebo na trhoch vzdialenej Číny, tešia sa rešpektu pre ostré jazyky a bystré úsudky. Rovnakou obratnosťou navigujú mora aj obchody a zabezpečujú, že naše transakcie nikdy nebudú znevýhodnené." # todo: NEW TRANSLATION
 malay_merchants_in_every_port: "Malajskí obchodníci v každom prístave" # todo: NEW TRANSLATION
 malay_merchants_in_every_port_desc: "Od bazárov $arabia_region$ po prístavy $east_asia$ sú naši obchodníci známym javom. Ich prítomnosť tvorí rozsiahlu sieť spolupráce, uľahčuje zakladanie našich enkláv v zahraničí a rozširuje náš dosah do každého veľkého obchodného centra sveta." # todo: NEW TRANSLATION
 agreements_sea_nomads: "Dohody s morskými nomádmi" # todo: NEW TRANSLATION
 agreements_sea_nomads_desc: "Kultúra $sama_culture$ a iné moreplavecké národy dlho žili priamo na vode, driemajúc medzi ostrovmi s bezkonkurenčnou zručnosťou. Prostredníctvom zdieľania znalostí alebo dohôd o vzájomnom rešpekte a spoločných príležitostiach zaistíme bezpečný prechod a rýchle opravy." # todo: NEW TRANSLATION
 masters_of_spice: "Majstri korenia" # todo: NEW TRANSLATION
 masters_of_spice_desc: "Obchodovanie s klinčekmi prináša nám a našim ľuďom veľké bohatstvo. Zabezpečením zeme a vôd, z ktorých tieto koreniny prúdia, stojíme v centre obchodu, ktorý prechádza svetom, a žiadny obchodník nemôže ignorovať príťažlivosť týchto tovarov." # todo: NEW TRANSLATION
 sko_fulani_expansion: "Expanzia Sokota" # todo: NEW TRANSLATION
 sko_fulani_expansion_desc: "Príliš dlho ľudia $west_africa$ pracovali pod vládcami, ktorí, hoci sa vyhlasovali za spravodlivých, podľahli synkretizmu. Už viac nie! Naša vlajka bude vždy vlát nad vlajkami pozemských kráľovstiev!" # todo: NEW TRANSLATION
 sko_recruit_the_faithful: "Nábor verných" # todo: NEW TRANSLATION
 sko_recruit_the_faithful_desc: "Každý, kto je pripravený slúžiť pod našimi spravodlivými vodcami, musí byť vítaný bez ohľadu na svoje pôvody." # todo: NEW TRANSLATION
 sko_education_for_all: "Vzdelaní učenci" # todo: NEW TRANSLATION
 sko_education_for_all_desc: "Podporovaním šírenia gramotnosti a učenosti medzi mužmi i ženami môžeme posunúť našu spoločnosť vpred a upevniť náš vplyv nad územiami. Rodina našich vládcov musí mať v týchto snahách zvláštnu úlohu a slúžiť ako vzor na napodobnenie." # todo: NEW TRANSLATION
 sko_religious_court: "Náboženský dvor" # todo: NEW TRANSLATION
 sko_religious_court_desc: "Namiesto ukazovania svetskej pompéznosti našej vlády by sa náš dvor mal sústrediť na duchovné záležitosti. Pozývaním učených náboženských osobností, aby učili v našom hlavnom meste, môžeme prejaviť našu skutočnú oddanosť viere." # todo: NEW TRANSLATION
 sko_recruit_fulani_generals: "Nábor veliteľov $fulbe$" # todo: NEW TRANSLATION
 sko_recruit_fulani_generals_desc: "Ľudia $fulbe$ sú výnimoční vojaci, slúžiaci ako velitelia vo všetkých kútoch $west_africa$. Mali by sme sa etablovať ako trvalý zamestnávateľ pre ich najspôsobilejších veliteľov." # todo: NEW TRANSLATION
 sko_one_people_in_faith: "Zjednotenie vo viere" # todo: NEW TRANSLATION
 sko_one_people_in_faith_desc: "Naše územia sú domovom mnohých ľudí rôznych kultúr a jazykov. Musíme zdôrazniť našu vieru ako zjednocujúcu silu, spájajúcu všetkých pod jedným praporom." # todo: NEW TRANSLATION
 ita_birthplace_of_the_renaissance: "Pokračovanie renesancie" # todo: NEW TRANSLATION
 ita_birthplace_of_the_renaissance_desc: "$italy_region$ zaznamenalo veľký prílev bystrých myslí. Či už ide o putujúcich umelcov, ktorí sem prišli hľadať šťastie, alebo o našich vlastných ľudí inšpirovaných zúčastňovať sa na tomto veľkom znovuzrodení umenia, naše mestá sa zdajú byť prasknuté od talentov. S naším sponzorovaním budeme určite naďalej priťahovať talentovaných ľudí do našej kultúry." # todo: NEW TRANSLATION
 ita_connect_the_interior: "Prepojiť vnútrozemie" # todo: NEW TRANSLATION
 ita_connect_the_interior_desc: "Zatiaľ čo terén našich krajín umožňuje rýchlu dopravu a cestovanie pozdĺž pobrežia, vnútrozemie Apeninského polostrova je na mnohých miestach ťažšie priechodné. Prepojenie nielen vnútorných lokalít, ale aj pobrežia s pobrežím, zabezpečí ľahšie obchodné operácie a zlepší manévrovateľnosť našich vojsk." # todo: NEW TRANSLATION
 ita_increased_recruitment: "Cenný majetok" # todo: NEW TRANSLATION
 ita_increased_recruitment_desc: "$italy_region$ je lákavé vlastníctvo pre mnohých zahraničných vládcov. Ak chceme brániť našu krajinu, musíme rozšíriť nábor pre naše pozemné i námorné sily. Keďže $italy_region$ je zraniteľné voči inváziám cez alpské priechody i pozdĺž nášho rozľahlého pobrežia, musíme zabezpečiť, aby armáda a námorníctvo boli dobre pripravené čeliť každému dobyvateľovi, ktorý by chcel narušiť pokoj polostrova." # todo: NEW TRANSLATION
 ita_influence_over_the_clergy: "Vplyvný klérus" # todo: NEW TRANSLATION
 ita_influence_over_the_clergy_desc: "Vďaka blízkosti k $papacy_reform$ má $italy_region$ dlhú tradíciu mocného a nadaného kléru v službách viery. Nezáleží na tom, kam nás zavedú naše náboženské záležitosti — mali by sme udržiavať dobré vzťahy s naším klérom." # todo: NEW TRANSLATION
 ita_enduring_hardship: "Útrapy vojny" # todo: NEW TRANSLATION
 ita_enduring_hardship_desc: "Zahraničné záujmy v $italy_region$ mnohokrát premenili naše územia na bojisko silnejších krajín. Udržať našich ľudí počas týchto ťažkých čias je náročná úloha. Zriadenie bezpečných miest na útočisko pre našu populáciu počas konfliktu zabezpečí ich podporu aj v tých najzložitejších vojnách." # todo: NEW TRANSLATION
 ita_flourishing_urban_centers: "Kvitnúce mestá" # todo: NEW TRANSLATION
 ita_flourishing_urban_centers_desc: "Naše územia sú požehnané mnohými vysoko urbanizovanými oblasťami. To nám poskytuje nielen veľa príležitostí na výrobu tovarov, ale ich obchodné väzby nám tiež umožňujú odosielať ich na zahraničné trhy pre náš zisk. Odstránenie akýchkoľvek prekážok v rozvoji týchto priemyslov zabezpečí ich pokračujúci úspech." # todo: NEW TRANSLATION
 ita_attractive_migration: "Lákavá krajina" # todo: NEW TRANSLATION
 ita_attractive_migration_desc: "Úrodná, mierna pôda nášho polostrova je obľúbeným miestom, kam ľudia z priľahlých krajín prichádzajú hľadať svoj osud. Zatiaľ čo mnohé z našich miest už spoľahlivo využívajú pracovnú silu sezónnych prisťahovalcov, mali by sme zvýšiť naše úsilie o trvalé usadenie týchto ľudí v našich krajinách." # todo: NEW TRANSLATION
 kol_peace_in_the_city: "Mier v meste" # todo: NEW TRANSLATION
 kol_peace_in_the_city_desc: "Ešte nie tak dávno bolo naše mesto takmer roztrhané bojmi medzi mešťanmi a klérom. Musíme zabezpečiť, aby sa tento konflikt nemohol zopakovať, a aby každý člen nášho dvora a mestského zastupiteľstva spolupracoval na zachovaní Kolína ako centrálneho uzla na Rýne." # todo: NEW TRANSLATION
 kol_school_of_painting: "Kolínska škola maľby" # todo: NEW TRANSLATION
 kol_school_of_painting_desc: "Naše mesto je domovom mnohých schopných maliarov a remeselníkov zručných v prenášaní obrazov do dreva, kameňa a najmä skla. S podporou silne založeného cechu umelcov budú v našej ochrane prosperovať a rozžiaria naše mesto novou slávou." # todo: NEW TRANSLATION
 tri_balance_the_landstande: "Vyvážiť Landstände" # todo: NEW TRANSLATION
 tri_balance_the_landstande_desc: "Naše územie je domovom mnohých mestských oblastí a hradov mnohých ríšskych rytierov. Vyvážiť ich a ich často protichodné záujmy nie je jednoduché. Len ak budú spolupracovať s nami a katedrálnym kapitulom, môžeme zabezpečiť funkčnosť našej vlády." # todo: NEW TRANSLATION
 hes_form_the_militia_army: "Jadro profesionálnej armády" # todo: NEW TRANSLATION
 hes_form_the_militia_army_desc: "Naša strategická poloha v rámci Impéria nás robí atraktívnym odštartovacím bodom pre armády iných pánov vždy, keď vzniknú vonkajšie hrozby. Hostenie cudzích vojsk však poškodzuje naše financie. Aby sme predišli tomuto nákladnému bremenu, musíme postaviť vlastné vojská a dať ich do služby Impéria." # todo: NEW TRANSLATION
 noble_society_baden_palatine: "Spoločnosť s oslom" # todo: NEW TRANSLATION
 noble_society_baden_palatine_desc: "Založená na ochranu rytierovských záujmov v rámci Impéria, #italic Gesellschaft mit dem Esel#! sa zakorenila v krajoch okolo $heidelberg$. Ich špecializácia na správu aj schopnosť sponzorovať turnaje zlepší náš kultúrny status." # todo: NEW TRANSLATION
 noble_society_nassau: "Spoločnosť s levom" # todo: NEW TRANSLATION
 noble_society_nassau_desc: "Založená v ťažkostiach $western_schism$, #italic Löwenbund#! je zviazaná ochranou našich krajín pred heretickými povstaniami. Mali by sme im udeliť oficiálne sponzorovanie a začleniť ich do nášho dvora na podporu našej veci." # todo: NEW TRANSLATION
 noble_society_mainz: "Spoločnosť Benglerov" # todo: NEW TRANSLATION
 noble_society_mainz_desc: " #italic Klüppelgesellschaft#! bola založená skupinou rytierov znepokojených eróziou našej moci v Svätom rímskom impériu. Bolo by múdre ich sponzorovať — sú pripravení bojovať za náš status." # todo: NEW TRANSLATION
 noble_society_franconia: "Spoločnosť Fürspang" # todo: NEW TRANSLATION
 noble_society_franconia_desc: " #italic Gesellschaft mit dem Fürspang#! je rád rytierov vytvorený na obranu ich záujmov a poskytovanie pomoci tým, ktorí ich sponzorujú. Poskytnutie rozsiahlych prostriedkov im nám prinesie výrazne viac politickej sily v našom regióne i v Impériu." # todo: NEW TRANSLATION
 noble_society_tyrol: "Elefantenbund" # todo: NEW TRANSLATION
 noble_society_tyrol_desc: "Naše krajiny sú ohrozené inváziou nepriateľských susedov, ktorí túžia po bohatstve našich údolií. Vytvorenie a financovanie rádu rytierov, pripravených brániť naše územia, nám umožní v prípade potreby čerpať väčšie sily." # todo: NEW TRANSLATION
 noble_society_cologne: "Rád svätého Huberta" # todo: NEW TRANSLATION
 noble_society_cologne_desc: " #italic Hubertusorden#! bude slávnou pripomienkou našej rytierovej sily v boji! Rád bude odmenou pre našich verných rytierov a členovia budú vystavovať našu slávu na obdiv." # todo: NEW TRANSLATION
 saxon_defensioner: "$a_saxon_defensioner$" # todo: NEW TRANSLATION
 saxon_defensioner_desc: "$a_saxon_defensioner_desc$" # todo: NEW TRANSLATION
 prussian_grenadiers: "$a_prussian_grenadiers$" # todo: NEW TRANSLATION
 prussian_grenadiers_desc: "$a_prussian_grenadiers_desc$" # todo: NEW TRANSLATION
 bavarian_jager: "$a_bavarian_jager$" # todo: NEW TRANSLATION
 bavarian_jager_desc: "$a_bavarian_jager_desc$" # todo: NEW TRANSLATION
 hesse_jager: "$a_hesse_jager$" # todo: NEW TRANSLATION

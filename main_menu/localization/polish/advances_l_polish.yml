 age_1_traditions: "Tradície" # todo: NEW TRANSLATION
 age_1_traditions_desc: "Rôzne spoločnosti sa formovali po celom svete tisícky rokov a ich základy možno rámcovať tradíciami takými ako $legalism$, $meritocracy$ alebo $feudalism$." # todo: CHANGED
 age_2_renaissance: "Renesancia" # todo: NEW TRANSLATION
 age_2_renaissance_desc: "Spoločnosti ovplyvnené $mge_pax_mongolica$, $islamic_golden_age$ a $renaissance$ v $europe$ svedčia o vzniku novej éry poznania, umenia a inovácií v dôsledku zvýšených zahraničných interakcií a etablovania nových inštitúcií." # todo: CHANGED
 age_3_discovery: "Objavovanie" # todo: NEW TRANSLATION
 age_3_discovery_desc: "Ako prichádza ranomoderná éra, nové kontinenty sa mapujú, zatiaľ čo feudálna spoločnosť pomaly ustupuje centralizovaným štátom.\nPre podnikavého vodcu je toto ideálny čas postaviť základy impéria s globálnym dosahom..." # todo: CHANGED
 age_4_reformation: "Reformácia" # todo: NEW TRANSLATION
 age_4_reformation_desc: "Od východu po západ, toto je vek náboženskej presvedčenosti, debát a masových hnutí. $protestant$ cirkvi sa zakorenili v $europe$, milenarizmus ovplyvnil Irán a $religious_syncretism$ formuje spoločnosť v $india$." # todo: CHANGED
 age_5_absolutism: "Absolutizmus" # todo: NEW TRANSLATION
 age_5_absolutism_desc: "Keď vlády uchvátia absolútnu moc nad svojimi krajinami, ich úsilie sa premiestňuje od hromadenia moci k budovaniu impérií. Toto je vek štátu; panovníkov a ich armád." # todo: CHANGED
 age_6_revolutions: "Revolúcie" # todo: NEW TRANSLATION
 age_6_revolutions_desc: "Osvietenstvo spochybňujúce práva, autoritu a samotnú povahu sveta viedlo k masovému odmietnutiu starých hierarchií. Ako absolutizmus padá pred revolúciou, tak aj kráľovstvá sú zvrhnuté, aby uvoľnili miesto republikám..." # todo: CHANGED
 adm_AGE: "Administratívne schopnosti" # todo: NEW TRANSLATION
 dip_AGE: "Diplomatické schopnosti" # todo: NEW TRANSLATION
 mil_AGE: "Vojenské schopnosti" # todo: NEW TRANSLATION
 ages_of_eu.1.title: "[GetCurrentAge.GetNameWithNoTooltip]"
 ages_of_eu.1.desc: "Toto je začiatkom [GetCurrentAge.GetName]!\n\n[GetCurrentAge.GetDesc]"
 ages_of_eu.adm: "Administratívne zameranie" # todo: NEW TRANSLATION
 ages_of_eu.dip: "Diplomatické zameranie" # todo: NEW TRANSLATION
 ages_of_eu.mil: "Vojenské zameranie" # todo: NEW TRANSLATION
 feudalism: "Feudalizmus" # todo: NEW TRANSLATION
 feudalism_desc: "Postupne mnohé spoločnosti vyvinuli silnejšie a trvalejšie vládne inštitúcie. Po páde Rímskej ríše sa veľká časť $europe$ postupne vyvinula do feudálneho systému — štruktúry, v ktorej $peasants_estate$ vykonávali prácu na majetkoch vlastníkov, bohatých $nobles_estate$, výmenou za ochranu a právo užívať pôdu.\n\nPodobné paralelné systémy držby zeme a recipročne viazaných povinností sa vytvorili aj inde vo svete, niektoré s koreňmi ešte staršími než európsky feudalizmus." # todo: CHANGED
 legalism: "Legalizmus" # todo: NEW TRANSLATION
 legalism_desc: "Teórie právneho prísneho poriadku (Legalizmu) sú integrálnou súčasťou $CHI_ADJ$ spoločnosti už stovky rokov. Koncept, že prísne zákony, centralizovaná autorita a byrokratická efektivita vedú k stabilnému, prosperujúcemu štátu s mocnou armádou, je hlboko zakorenený v mnohých ideológiách po celom $east_asia$.\n\nAko obchodníci a migranti uľahčovali výmenu myšlienok po svete, Legalizmus prenikol aj do rozsiahlej $muslim_ADJ$ sféry, kde sa stal súčasťou symbiotického vzťahu medzi veriacimi a ne-$muslim_ADJ$ poddanými.\n\nV $europe$ sa Legalizmus zrodil z posledných výkrikov Rímskej ríše. Po jej úpadku boli jej systematické právne kódy adaptované a transformované do fundamentálnej jurisprudencie mnohých národov na kontinente." # todo: CHANGED
 meritocracy: "Meritokracia" # todo: NEW TRANSLATION
 meritocracy_desc: "Ľudia veľkého prestíže a moci často vymenúvajú za vplyvné pozície tých najbližších.\n\nVznik Meritokracie ako inštitúcie a myšlienkového hnutia bol prevažne populárny na dvoroch $CHI$. Tam sám Konfucius podporoval názory, že tí, čo vládnu, by mali byť vyberaní podľa zásluh, nie dedenej pozície. To viedlo k nahradeniu tradičnej $CHI_ADJ$ šľachty aristokraciou založenou čisto na zásluhách.\n\nVývoj tejto inštitúcie spôsobil vlny naprieč hranicami $asia$, ktoré nakoniec dorazili aj do kráľovských dvorov $europe$, aj tých, ktorých šľachta mala pevný úchop nad mechanizmami moci a autority." # todo: CHANGED
 renaissance: "Renesancia" # todo: NEW TRANSLATION
 renaissance_desc: "Najbohatší a najsilnejší občania $ITA_ADJ$ mestských štátov podporujú umelcov a učencov, ktorí vdýchnu nové ideály a estetiku klasických gréckych a rímskych predkov. Ako kultúrne hnutie už Renesancia výrazne ovplyvnila literatúru, umenie, filozofiu a hudbu v našom regióne. Renesančný humanizmus sa stal plne rozvinutou intelektuálnou tradíciou pripravenou preniknúť do všetkých aspektov spoločnosti; skutočný renesančný humanista ovláda politiku, filozofiu, umenie, textovú analýzu, hudbu aj architektúru.\n\nNové ideály pre vládnucich — ako aj tých, ktorým vládnu — sa šíria tak rýchlo, ako to umožňujú tlačiarne.\n\nRenesančné ideály sú teraz pripravené pretvoriť svet podľa týchto sofistikovaných klasických princípov." # todo: CHANGED
 banking: "Bankovníctvo" # todo: NEW TRANSLATION
 banking_desc: "Požičiavanie peňazí existuje od doby, keď sa objavili mince z kovu v Antike. Jeho dostupnosť však silne závisí od dominantného ľudu, kultúry alebo náboženstva daného štátu.\n\nV stredoveku došlo k zmene, podporenej obnoveným rastom dlhodobých obchodných aktivít na eurázijskom kontinente a jeho perifériách. Špecializovaní pôžičkári sa začali organizovať, keď $judaism_ADJ$ komunity začali pôsobiť medzi $christian_ADJ$ a $muslim_ADJ$ svetmi. Boom dopytu po kreditoch, ku ktorému došlo po križiackych výpravách v 12. storočí, povzbudil obchodníkov v $ITA_ADJ$ mestských štátoch vytvoriť väčšie štruktúry pre peňažné operácie, čím vznikli prvé bankové inštitúcie, ako rody Peruzzi a Bardi.\n\nVyvinuli sa ďalšie nástroje, ako menové zmenky a dlhové úpisy, a bankové dynastie ako $medici_dynasty$, $fugger_dynasty$ alebo $welser_dynasty$ čoskoro získali moc podobnú štátom." # todo: CHANGED
 professional_armies: "Profesionálne armády" # todo: NEW TRANSLATION
 professional_armies_desc: "Armády existujú od vynájdenia vojny, pred mnohými tisíckami rokov. Ich forma sa však v priebehu storočí menila a v rôznych kultúrach a obdobiach sa rozvíjali rôzne typy náboru a organizácie.\n\nV neskorom stredoveku sa armády v mnohých spoločnostiach spoliehali na zbroja a pešiakov povolaných sezónne. Niektoré štáty však mali dosť prostriedkov na financovanie stálych armád, obsadených profesionálnymi vojakmi, ktorí boli k dispozícii po celý rok.\n\nTento systém sa rozvíjal aj v $europe$ po vypuknutí storočnej vojny a bol jednou z hlavných zmien podporujúcich vojenskú revolúciu v ranom modernom veku. Zvýšenie počtu a kvality profesionálnych armád, pri hľadaní nových zdrojov príjmov na ich financovanie, sa čoskoro stalo jednou z hlavných výziev pre vládnucich po celom svete." # todo: CHANGED
 new_world: "Nový svet" # todo: NEW TRANSLATION
 new_world_desc: "Objav Nového sveta priniesol novú éru — nielen pre kolonizátorov a kolonizovaných, ale aj pre mnohé národy Starého sveta, pretože koloniálna expanzia viedla k dostupnosti nových surovín a inovácií, a k plnšiemu uvedomeniu si nášho rozsiahleho sveta. Ako sa nové zvieratá, plodiny, drahé kovy a choroby šíria cez $atlantic_ocean_continent$, prvé kroky smerujú k skutočne globálnej ekonomike.\n\nS mapovaním a dokumentovaním cudzích krajín a národov sa myšlienky a náboženské či filozofické debaty čoraz viac farbia tým, čo sme našli v zámorských spoločnostiach. Veľké mysle začínajú spochybňovať to, čo sa kedysi považovalo za pravdu, a od $valladolid$ po Fatehpur Sikri je teraz podstata sveta predmetom diskusií." # todo: CHANGED
 printing_press: "Tlačiarenský lis" # todo: NEW TRANSLATION
 printing_press_desc: "Schopnosť masovo vyrábať písaný text by zrevolucionalizovala šírenie informácií a spoločnosť ako celok. Pionieri ako $VEN_ADJ$ tlačiar Aldus Manutius pomohli podpore $renaissance$ tým, že sprístupnili preklady klasikov. Neskôr Reformácia veľa získala zo schopnosti šíriť kritické publikácie a preklady Svätého Písma.\n\nTeraz, keď tlač zrela ako technika a rozšírila sa po $europe$, stovky tisíc kópií všetkého — od náboženských a politických brožúr po vedecké traktáty — kolujú kontinentom. S rastom tlačiarní sa vládam ťažko darí novú techniku kontrolovať, pretože pomerne ľahké prostriedky výroby umožňujú obchádzanie cenzúry presunom podniku cez hranicu — alebo pritom zmenou mena na titulnej strane." # todo: CHANGED
 pike_and_shot: "Piky a streľba" # todo: CHANGED
 pike_and_shot_desc: "Na konci 15. storočia sa začal vyvíjať nový typ vojny uprostred $ITA_ADJ$ vojen. Generalizácia pikérov v neskorom stredoveku ako alternatívy k ťažkozbrojným jazdcom, ktorí dokázali čeliť nájazdom ťažkej jazdy, bola sprevádzaná vývojom prenosných palných zbraní, najmä arkebúz a mušketov s pojkadlom. Vojaci teraz prijímajú novú formáciu, v ktorej pikéři tvoria štvoricu, zatiaľ čo arkebúziéri sa roztvárajú po stranách a vpredu a hľadajú kryt za alebo vnútri štvorca, ak sa formácia dostane do tesného boja. Tento nový typ formácie, nazývaný Pike and Shot, preferovali $GER_ADJ$ #italic Landsknechts#! a $SPA_ADJ$ #italic Tercios#! a čoskoro ho prevzali aj iné armády, vládnuc takmer dva storočia na európskych bojiskách, až kým ho na začiatku 18. storočia nenahradili líniové pechotné formácie s muškami muškami s bajonetmi." # todo: CHANGED
 confessionalism: "Konfesionalizmus" # todo: NEW TRANSLATION
 confessionalism_desc: "$catholic$ bola dlhú dobu považovaná za jednotný celok, ale príchod rôznych $protestant_ADJ$ vierov ukončil túto jednotnosť. Vzhľadom na množstvo odlišných interpretácií viery už $christian$ nie je jednotný. Kým kedysi bolo každé odklonenie od učení cirkvi ľahko označené za kacírstvo, hranice medzi sektami sa stali menej zreteľné.\n\nPreto sa zvyšuje záujem náboženských aj svetských autorít jasne definovať tvar svojich doktrín, vynucovať svoje pravidlá a pohľady na všetky aspekty viery a života. To im dáva pevnejší úchop nad vierou ich obyvateľstva, ale zároveň zväčšuje diferenciáciu a tým aj nepriateľstvo voči iným formám viery." # todo: CHANGED
 global_trade: "Globálny obchod" # todo: NEW TRANSLATION
 global_trade_desc: "Tovar sa pohyboval cez kontinenty už od antiky. Avšak keď to bolo predtým obmedzené na niekoľko trás a špecifické komodity, ako výrobky z $india$ a $CHI$ putujúce cez $indian_ocean_continent$ a Hodvábnu cestu, obchod sa teraz čoraz viac stáva súčasťou väčšej svetovej siete. Objav Ameriky, zriadenie námorných trás okolo $africa$ a preplávanie $pacific_ocean_continent$ spája lokálne obchodné siete do jednej prepojenej globálnej siete.\n\n$silver$ z $andes_region$ je teraz prepravované cez $europe$ až do $CHHI$ a $india$, $iron$ z $scandinavian_region$ sa predáva v $west_africa$ $ENG_ADJ$ obchodníkmi a ďalší zarábajú rozdistribúciou $cloth$ a korenia obchodníkom z $south_east_asia$. Obchodníci v $india$ dokonca investujú do budúcich európskych obchodných podnikov! Možno je ešte skoro hovoriť o skutočne globálnej ekonomike, ale prvé zrnká sú už zasiate." # todo: CHANGED
 artillery_institution: "Delostrelectvo" # todo: NEW TRANSLATION
 artillery_institution_desc: "Vynález zmesi na výbuch v $CHI$ viedol k vývoju zariadenia, ktoré využíva jej palebnú silu v boji: delostrelectva. Hoci delostrelectvo sa rozšírilo po $europe$ A aj $asia$ už v 13. storočí, jeho bežné použitie ako zbraňového systému sa nerozšírilo až do 15. storočia, keď zlepšenia dĺžky del a zloženia prachu učinili delá dostatočne silné, aby ohrozili kamenné hrady a opevnenia bežné v $europe$. Čoskoro sa delostrelectvo používalo nielen pri obliehaniach, ale aj na bojiskách, keď menšie kalibry boli dostatočne mobilné na rýchle nasadenie a použitie. Jeho konečná evolúcia ako kľúčového systému boja prišla v 18. storočí, obzvlášť po tom, čo Napoleon dokonal jeho využitie v rozhodujúcich bodoch bitiek." # todo: CHANGED
 manufactories: "Manufaktúry" # todo: NEW TRANSLATION
 manufactories_desc: "Hoci niekoľko technologických inovácií v 16. a 17. storočí zvýšilo produkciu niektorých tovarov, ako $iron$ alebo $cloth$, najväčší priemyselný pokrok prišiel vo forme optimalizovanej organizácie. Vytvorením manufaktúr, často mimo mestských hraníc, obchodní kapitalisti obchádzali staré cechové zákony, ktoré brzdili masovú výrobu, a skúmali spôsoby zvýšenia výstupu prostredníctvom organizácie a špecializácie centralizovanej práce. Predchodcovia neskoršej industrializácie dokázali zvýšiť produkciu uľahčením prístupu k surovinám a organizovaním práce v masovom rozsahu, namiesto investícií do drahých nových strojov. To bol obrovský odklon od často prísne regulovaných starých metód a spolu s neskoršími technickými pokrokmi tento nový spôsob výroby zrevolucionalizoval spoločnosť." # todo: CHANGED
 scientific_revolution: "Vedecká revolúcia" # todo: NEW TRANSLATION
 scientific_revolution_desc: "Svet je menší než kedykoľvek predtým. Vzrast globálneho obchodu a rozšírenie tlače priniesli zvýšený tok myšlienok, umožňujúc širšie šírenie poznania. To následne vyústilo v dôkladnejšie spochybňovanie a analýzu reality sveta. To, čo bolo kedysi akceptované ako fakt, je teraz spochybňované; to, čo bolo málo pochopené, je teraz pozorované; a to, čo bolo predpokladané, je testované.\n\nNedávne pokroky v matematikách, fyzike a biológii sú nezanedbateľné, ale skutočná revolúcia je zmena v percepcii a prístupe k vede samotnej. Systematické experimentovanie je pravou vedeckou revolúciou a úplne zmení naše chápanie sveta." # todo: CHANGED
 military_revolution: "Vojenská revolúcia" # todo: NEW TRANSLATION
 military_revolution_desc: "Neustály stav vojen, ktorý zasiahli $europe$ v 16. a 17. storočí, viedol k prudkému nárastu veľkosti armád, nutnému pre rastúcu autoritu súťažiacich absolutistických režimov. Pechota je teraz masovo vyzbrojená muškami s kremeňovým zapaľovaním, čo výrazne zvyšuje ich palebnú silu a výkon v boji nasadením v inovatívnej línii, ktorá nahrádza starý $pike_and_shot$.\n\nNaše vojenské potreby ovplyvňujú schopnosti štátnej správy; tá sa musí rozšíriť, aby zvládla ľudské a finančné zdroje požadované týmto nárastom vojsk. Tento tlak viedol aj k rozvoju zásobovacích reťazcov, ktoré živia armády, a k stredným depám podporujúcim operačné sily. Konečným výsledkom týchto pokrokov bude vlna vojen medzi stále militarizovanejšími krajinami v 18. storočí." # todo: CHANGED
 enlightenment: "Osvietenstvo" # todo: NEW TRANSLATION
 enlightenment_desc: "Racionalizmus a empirizmus získali neuveriteľnú popularitu medzi najväčšími ľuďmi svojej doby. V listoch, publikáciách a kaviarňach intelektuálni velikáni od kráľov až po vedcov debatovali o výhodách tolerancie, pokrokovej vedeckej metodológie a šírení osvietenských ideí medzi ľudstvo. Z univerzít a dvorov osvetlených panovníkov sú vysielané expedície na meranie, katalogizáciu a mapovanie sveta, aby sme lepšie pochopili zákony riadiace všetko okolo nás. Iní myslitelia skúmajú zákony spoločnosti a práva človeka.\n\nObrovské podniky, ako vytvorenie úplnej encyklopédie všetkého poznania alebo kompletného indexu rastlín, zvierat a húb na svete, sú uskutočňované pre väčšie dobro ľudstva. Svetlo rozumu bolo zapálené a mnohí neodpočinia, kým ho nerozšíria do všetkých kútov Zeme." # todo: CHANGED
 industrialization: "Industrializácia" # todo: NEW TRANSLATION
 industrialization_desc: "Úsvit 18. storočia priniesol vznik mnohých nových inštitúcií s rastúcou túžbou ľudstva po pokroku. Pokroky v oblasti výroby a zavedenie komplikovaných strojov zmenia svet na globálnej úrovni. Priemyselná revolúcia priniesla trvalé zmeny — nielen v obchode a podnikaní, ale aj v spoločenskej štruktúre mnohých národov. Vynálezy ako pletací stav a parný stroj posunú schopnosti ľudstva na nové maximá." # todo: CHANGED
 levee_en_masse: "Všeobecná mobilizácia" # todo: NEW TRANSLATION
 levee_en_masse_desc: "Vojna je neustále sa meniacim konceptom skúmaným a zlepšovaným po generácie. Videli sme vzostup mocných impérií, každé so svojimi ambíciami. Aby sme uspokojili potrebu expanzie a poskytli palivo potrebné na naplnenie týchto ambícií, budú sa prijímať nové celoštátne zákony o brannej povinnosti. Vzbúrame armády mladých, dychtivých rekrutov, ktorých veľkosť zanechá nesmazateľnú stopu v histórii." # todo: CHANGED
 local_governor_advance: "$local_governor$" # todo: NEW TRANSLATION
 local_governor_advance_desc: "$local_governor_desc$" # todo: NEW TRANSLATION
 colonies: "Kolónie" # todo: NEW TRANSLATION
 colonies_desc: "Či už poslaním našich ľudí usadiť sa v nových krajinách, uložením našej vlády nad domorodcami v zámoorských držbách, alebo kombináciou oboch, zriadenie kolónie vytvorí oporu pre našu moc, ktorá nám umožní ďalej rozširovať našu kontrolu a hranice v týchto neobsadených územiach." # todo: CHANGED
 feudalism_advance: "Feudalizmus" # todo: NEW TRANSLATION
 feudalism_advance_desc: "Feudalizmus je politický systém založený na službe alebo práci výmenou za držbu a užívanie pôdy. Je to súhrn práv a povinností, ktorými sú členovia spoločenskej štruktúry viazaní." # todo: CHANGED
 horse_riding_advance: "Jazda na koni" # todo: NEW TRANSLATION
 horse_riding_advance_desc: "Domestikácia koní zmenila spôsob, akým sa ľudia pohybujú a prepravujú tovar. Použitie koní v boji poskytuje jazdcom nielen rýchlejší pohyb, ale aj vyššiu pozíciu, z ktorej môžu útočiť na nepriateľov — alebo ich rozdrviť pod váhou svojich úhorov." # todo: CHANGED
 rights_of_man: "Práva človeka" # todo: NEW TRANSLATION
 rights_of_man_desc: "V popredí súčasnej revolučnej myšlienky stojí radikálna predstava rovnosti pre všetkých. Filozofi z rôznych kútov sveta spoločne spísali dokument zvaný „Deklarácia práv človeka a občana“, ktorý vyhlasuje, že tieto práva sú univerzálne a mali by byť vynucované zákonom. Je pravdepodobné, že to bude dostatok paliva na popularizovanie konceptov slobody a demokracie, a bolo by rozumné, aby sme nezaostávali za inými národmi." # todo: CHANGED
 rotherham_plough: "Rotherham Plough" # todo: NEW TRANSLATION
 rotherham_plough_desc: "Základné pluhy používané v $europe$ sa nezmenili od rímskych čias. Vďaka zlepšenému dizajnu teraz môže byť pluh oveľa ľahší, čo znižuje námahu záprahových zvierat a tým zvyšuje ich pracovný výkon." # todo: CHANGED
 modern_bureaucracy: "Moderná byrokracia" # todo: NEW TRANSLATION
 modern_bureaucracy_desc: "Aby sme čo najlepšie využili pôdu a poddaných, musíme zväčšiť, reorganizovať a profesionalizovať našu byrokraciu. Vytvoríme organizácie venované správe špecifických oblastí štátu, čím odstránime potrebu ad hoc riešení.\n\nPoďme konzultovať s našimi univerzitami, ako najefektívnejšie vládnuť a spravovať. Zároveň povzbudíme našu šľachtu, aby slúžila štátu perom namiesto meča." # todo: CHANGED
 separation_of_powers: "Rozdelenie moci" # todo: NEW TRANSLATION
 separation_of_powers_desc: "Vznikol výbušný anonymný traktát o politickej teórii. Napriek snahám potlačiť text sa rýchlo šíri po svete. Analyzuje rôzne formy vlády — monarchie, despotizmy alebo demokracie — a obhajuje prísne oddelenie výkonného, legislatívneho a súdneho orgánu.\n\nToto oddelenie by chránilo ľud a obmedzilo panovnícku moc, čo je pre mnohých našich poddaných lákavá perspektíva. Napriek nešťastným dôsledkom pre autoritu vládcu môžu tieto myšlienky našej krajine priniesť veľký úžitok." # todo: CHANGED
 measuring_the_world: "Meranie sveta" # todo: NEW TRANSLATION
 measuring_the_world_desc: "Nové vedy nám dali množstvo nástrojov na opis a meranie sveta okolo nás. Nemôžeme však poznať všetky zdroje, ktoré by boli k dispozícii, kým dôkladne nepreskúmame celé naše územie pre minerály, nespočítame každého poddaného a neohodnotíme každý podnik. Pošlime našich učených expertov na dôkladný prieskum — najprv našej krajiny, potom celého sveta!" # todo: CHANGED
 the_constitution: "Ústava" # todo: NEW TRANSLATION
 the_constitution_desc: "Vyvinul sa nový filozofický koncept nazývaný konštitucionalizmus, podľa ktorého vláda akceptuje zákonné obmedzenia svojej moci namiesto vládnutia výlučne ľubovôle. Hoci niektorým sa to môže zdať zaujímavé, samozrejme to nie je populárne u panovníkov..." # todo: CHANGED
 absolute_rulership: "Absolútna vláda" # todo: NEW TRANSLATION
 absolute_rulership_desc: "Mnoho ľudí žiada podiel na vláde, ale väčšinou preto, že chcú byť odmenení bez veľkej námahy. Myšlienka absolutizmu nás nedávno zaujala, pretože jej prijatie by nám umožnilo zbaviť sa týchto sebaobetavých parazitov a vládnuť sami..." # todo: CHANGED
 national_sovereignty: "Národná suverenita" # todo: NEW TRANSLATION
 national_sovereignty_desc: "Dlhé vojny v prvej polovici 17. storočia vyústili do medzinárodnej diplomatickej sústavy, kde je nedotknuteľnosť územia základom. Aktérmi na medzinárodnej scéne sú štáty, nie jednotliví vládci či nadnárodné zoskupenia, a žiadny štát nemá právo zasahovať do vnútorných záležitostí iného štátu." # todo: CHANGED
 military_administration: "Vojenská správa" # todo: NEW TRANSLATION
 military_administration_desc: "Rastúce armády 16. storočia si vyžiadali rastúce nároky na národné administratívy. Vytvorením stálej organizácie zodpovednej za stratégiu zásobovania a prevádzku vojenských síl, a vedením väčšieho počtu vojakov v zoznamoch aj počas zimy či mieru, budeme schopní nasadiť veľké armády lacnejšie a efektívnejšie ich podporovať." # todo: CHANGED
 early_modern_administation: "Ranomoderna administrácia" # todo: NEW TRANSLATION
 early_modern_administation_desc: "Postupne sa ukázalo, že centralizovanejšia byrokracia, s administratívnymi orgánmi vedenými vzdelanými úradníkmi zamestnanými priamo štátom, je nevyhnutná na dokončenie ambicióznych projektov rannomoderných vládcov." # todo: CHANGED
 renaissance_thought: "$renaissance$ Myslenie" # todo: CHANGED
 renaissance_thought_desc: "Idey ušľachtilého oligarchického vládnutia nie sú nové — existujú aspoň od rímskych čias. Tento systém zostáva zakotvený v štruktúre mnohých národov a myšlienka naberá znovu na popularite medzi tými, ktorí majú vplyv..." # todo: CHANGED
 medieval_administration: "Stredoveká správa" # todo: NEW TRANSLATION
 medieval_administration_desc: "S vojenskou elitou na čele našej spoločnosti je ďalším krokom vytvoriť gramotnú triedu úradníkov. Tieto role sa zvyčajne obsadzovali z klerikov." # todo: CHANGED
 impulse_warfare: "Manévrová vojna" # todo: NEW TRANSLATION
 impulse_warfare_desc: "Zavedenie ľahkej pechoty prinieslo významnú zmenu v spôsobe boja. Škirmisheri sa nasadzujú v riedkom usporiadaní dopredu, aby rozptýlili a obťažovali nepriateľa pred hlavným útokom pechoty, ktorý je typicky prevedený v rade alebo kolóne." # todo: CHANGED
 line_infantry: "Líniová pechota" # todo: NEW TRANSLATION
 line_infantry_desc: "S vynálezom bajonetov mohol každý mušketier fungovať aj ako píkáč. To umožnilo vyňať píky z výzbroje pechoty a poskytnúť taktické formácie s väčšou palebnou silou." # todo: CHANGED
 gustavian_infantry: "Gustaviánska pechota" # todo: NEW TRANSLATION
 gustavian_infantry_desc: "Gustav II. Adolf, vládca $SWE$, urobil niekoľko inovácií v pechote, ktoré zlepšili jej výkon. Formácie zúžil a spravil obdlžníkové, aby zvýšil počet muškiet na palubu a pripojenie malých dielok ešte zvýšilo ich palebnú silu." # todo: CHANGED
 standardisation_of_calibre: "Štandardizácia kalibrov" # todo: CHANGED
 standardisation_of_calibre_desc: "S rastúcim významom delostrelectva na bojisku sa počet typov palných zbraní zvyšoval. Keďže však každé delo bolo vyrábané osobitne, bolo náročné zabezpečiť zásobovanie. V roku 1544 cisár Karol V. vyhlásil, že budú len päť kalibrov diel, zatiaľ čo kráľ Henrich II. $FRA$ nastavil štandard na šesť." # todo: CHANGED
 maurician_infantry: "Mauriciánska pechota" # todo: NEW TRANSLATION
 maurician_infantry_desc: "Veľkosť a hĺbka $spanish_square$ dávali formácii stabilitu, ale robili ju pomalou a neohrabanou pri manévrovaní. Tiež viedlo k veľkému percentu neaktívnych vojakov počas bitiek. Maurícius z Nassawu, štadtholder $NED$, znížil počet mužov vo formácii, čím ju urobil mobilnejšou a zmenšil jej hĺbku, takže si zachovala rovnakú palebnú silu a šokový efekt." # todo: CHANGED
 spanish_square: "Španielsky štvorec" # todo: NEW TRANSLATION
 spanish_square_desc: "Španielsky štvorec sa organicky vyvinul z formácie $pike_and_shot$. V jadre zostal tradičný pikový štvorcový útvar a v každom rohu mal skupinu arkebúziérov. Tým si udržal odolnosť tradičného pikového štvorca a obohatil ho palebnou silou arkebúzy." # todo: CHANGED
 standardized_pikes: "Štandardizované piky" # todo: NEW TRANSLATION
 standardized_pikes_desc: "Pika je pozoruhodne jednoduchá zbraň na výrobu, ale aby priniesla plný úžitok, celá formácia musí používať zbrane podobnej dĺžky a čepele." # todo: CHANGED
 pike_square: "Pikový štvorec" # todo: NEW TRANSLATION
 pike_square_desc: "V priebehu stredoveku dominancia jazdy bola narušená disciplinovanými pikermi. V bitkách ako Bannockburn alebo Zlaté ostrohy pikéri rozdrvili jazdu. Kombinácia zlepšeného výcviku a disciplíny, spolu s pridaním šermiarov pre blízky boj, priviedla túto formáciu k vrcholu jej efektivity." # todo: CHANGED
 medieval_military: "Stredoveké vojenstvo" # todo: NEW TRANSLATION
 medieval_military_desc: "V posledných storočiach sa pozemné armády profesionalizovali a lepšie organizovali. Lepšie systémy podporujú mix verbovaných a profesionálnych vojakov, ktoré teraz dominujú bojiskám, a pechota pomaly, ale isto získava na sile, pripravená predbehnúť jazdu." # todo: CHANGED
 insurance_companies: "Poisťovne" # todo: NEW TRANSLATION
 insurance_companies_desc: "Ďalšie zníženie rizika priniesol rozvoj poistenia. Zaplatením malej čiastky poisťovnému sprostredkovateľovi sa obchodníci mohli chrániť pred katastrofickými stratami. Toto zníženie investičného rizika viedlo k následnému rozkvetu obchodu." # todo: CHANGED
 the_gold_standard: "Zlatý štandard" # todo: NEW TRANSLATION
 the_gold_standard_desc: "Pretrvávajúci obchodný deficit medzi $europe$ a $CHI$ spôsobil nedostatok striebra nielen v $europe$, ale po celom svete. Prechod zo striebra na zlatú mincu umožní prísun nových mincí do obehu a povzbudí obchod k zvýšeniu obratu." # todo: CHANGED
 joint_stock_companies: "Akciové spoločnosti" # todo: NEW TRANSLATION
 joint_stock_companies_desc: "S rastom obchodu rástlo aj súvisiace riziko. Potrebné bolo vyvinúť nové spôsoby hromadenia kapitálu a riadenia rizika. V akciových spoločnostiach sa bremeno podnikania delí medzi mnohých akcionárov." # todo: CHANGED
 public_punishments: "Verejné tresty" # todo: NEW TRANSLATION
 public_punishments_desc: "Život na mori je plný nebezpečenstiev, a tresty preto musia byť prísne. Ak sa zločin neodradí dôkladne, rýchlo narazíme na problémy. Postupne sa vyvinul systém vysoko verejných trestov a teraz prišiel čas tieto konania formálne upraviť. To výrazne zvýši disciplínu na mori." # todo: CHANGED
 merchants_and_trade: "Obchodníci a obchod" # todo: NEW TRANSLATION
 merchants_and_trade_desc: "Vzorce obchodu boli vážne narušené, pravdepodobne v dôsledku morových epidémií. Teraz sa obchod pomaly začína zotavovať." # todo: NEW TRANSLATION
 naval_ambitions: "Námorné ambície" # todo: NEW TRANSLATION
 naval_ambitions_desc: "S dodatkovým zvýšením morálky námorníctva naši námorníci dobyjú vlny a ovládnu more. Medzitým naši kolonisti dokážu odvážne preskúmať najtemnejšie kúty sveta a zakladať nové osady ďalej od domova než kedykoľvek predtým." # todo: CHANGED
 chartered_companies: "Privilegované spoločnosti" # todo: NEW TRANSLATION
 chartered_companies_desc: "Svet je veľké miesto a na rozvoj globálneho obchodu musíme podstupovať vážne riziká. Našťastie sú v našej krajine obchodníci ochotní to urobiť, väčšinou za pomoci vlastného kapitálu. Udelením úradného listu takýmto spoločnostiam, ktorý im dá osobitné práva vykonávať vládne kompetencie a monopoly v určitých oblastiach, môžeme kontrolovať a podporovať obchodné aktivity od zahraničných obchodných sietí až po naše zámorské kolónie." # todo: CHANGED
 development_of_maritime_law: "Rozvoj námorného práva" # todo: NEW TRANSLATION
 development_of_maritime_law_desc: "Keď viac krajín posiela svojich poddaných alebo občanov do zahraničia a keď žije toľko ľudí tak blízko pri sebe dlhý čas, stáva sa nevyhnutným mať aspoň základné poňatie spoločných práv mora. S dielami ako 'Mare Liberum' alebo neskôr 'De Dominio Maris Dissertatio' boli položené základy medzinárodného práva mora." # todo: CHANGED
 basic_financial_instruments: "Základné finančné nástroje" # todo: NEW TRANSLATION
 basic_financial_instruments_desc: "Zámořský obchod je veľmi rizikový, ale tiež veľmi ziskový. Vývoj finančných nástrojov, ako listy úveru, pomôže znížiť riziko a zvýšiť naše zisky." # todo: CHANGED
 naval_professionalism: "Námorná profesionalizácia" # todo: NEW TRANSLATION
 naval_professionalism_desc: "Až do začiatku 17. storočia boli stály námorné sily pomerne malé a aj výrazné námorné mocnosti si udržiavali len toľko námorníctva, koľko potrebovali bezprostredne. Postupne sa však mnoho štátov začalo presúvať smerom k väčším profesionálnym námorným silám. Ak nechceme, aby nás v námorných záležitostiach prekonali rivali, musíme usilovať o vytvorenie väčšieho stáleho námorníctva s vhodnými administratívnymi štruktúrami na jeho podporu. Mali by sme tiež zabezpečiť, aby námornícka kariéra mohla byť celoživotným povolaním pre našich dôstojníkov." # todo: CHANGED
 superior_ship_design: "Vynikajúci dizajn lodí" # todo: NEW TRANSLATION
 superior_ship_design_desc: "Stavať lode o niečo rýchlejšie než protivník, aj keď je táto rýchlosť malá a bez zásadného vojenského významu, môže dodať posádkam sebadôveru a protivníka odradiť od otvorého stretu." # todo: CHANGED
 patron_of_art: "Patrón umenia" # todo: NEW TRANSLATION
 patron_of_art_desc: "Náš cieľ kultivovať kultúrne sofistikovanú spoločnosť začína tu. Naše umelecké výtvory v budúcnosti budú považované za najúžasnejšie divy tejto éry." # todo: CHANGED
 pragmatism: "Pragmatizmus" # todo: NEW TRANSLATION
 pragmatism_desc: "Príliš veľa krajín necháva, aby ich politiky formoval pohľad iných štátov. To je nerozumné — ak sú žoldnieri vhodnejší pre naše potreby, použijeme ich namiesto investícií do drahej stalé armády." # todo: CHANGED
 knowledge_transfer: "Prenos znalostí" # todo: NEW TRANSLATION
 knowledge_transfer_desc: "Zachovanie skúseností a vedomostí našich veteránov je kľúčové pri výcviku nových rekrutov. Musíme zabezpečiť, aby tí, čo bojovali, odovzdávali svoje skúsenosti stážistom prostredníctvom systému mentorstva." # todo: CHANGED
 organised_recruiting: "Organizovaný nábor" # todo: NEW TRANSLATION
 organised_recruiting_desc: "Kedysi, keď kapitán potreboval doplniť rad regimentu, bol nábor zdĺhavý, pretože mnohí nechceli prijať istú smrť v našej armáde. Aplikáciou rozumu však dokážeme vyvinúť systém, ktorý privedie bojovníkov do uniformy oveľa rýchlejšie." # todo: CHANGED
 optimism: "Optimismus" # todo: NEW TRANSLATION
 optimism_desc: "Víťazstvo sa nezíska len na bojisku, ale aj v salónoch. Rozvoj rozumu pomáha našim ľuďom prekonať dočasné neúspechy a pripraviť sa na nevyhnutné víťazstvo." # todo: CHANGED
 formalized_officer_corps: "Formalizovaný dôstojnícky zbor" # todo: NEW TRANSLATION
 formalized_officer_corps_desc: "Tradične pochádzajú naši dôstojníci zo šľachty, ale nemáme dosť ľudí v tejto vrstve na obsadenie všetkých pozícií. Existuje však mnoho zručných členov nižších vrstiev v našich armádach, ktorí by sa dobre uplatnili — mali by sme zvážiť ich povýšenie na profesionálnych dôstojníkov." # todo: CHANGED
 deus_vult: "Deus Vult" # todo: NEW TRANSLATION
 deus_vult_desc: "Pridaj sa k bojovému výkriku križiackych výprav — 'Boh to chce' — a znič heretikov!" # todo: CHANGED
 missionary_schools: "Misionárske školy" # todo: NEW TRANSLATION
 missionary_schools_desc: "Hoci je veľa ľudí ochotných šíriť pravú vieru, väčšina z nich nakoniec spôsobí viac škody než osohu. Zriadením špecializovaných škôl na riadnu prípravu misionárov zabezpečíme, že budeme mať viac ľudí, ktorí dokážu vieru nielen šíriť, ale robiť to úspešne." # todo: CHANGED
 church_attendance_duty: "Povinná návšteva cirkvi" # todo: NEW TRANSLATION
 church_attendance_duty_desc: "Zavedenie povinnej návštevy kostola zdôrazní dôležitosť našich náboženských hodnôt a minimalizuje náklady na udržiavanie poriadku." # todo: CHANGED
 divine_supremacy: "Božská nadvláda" # todo: NEW TRANSLATION
 divine_supremacy_desc: "Je to náš najvyšší záujem vyhnať zo zeme neznalých, ktorí sužujú naše hranice." # todo: CHANGED
 devoutness: "Zbožnosť" # todo: CHANGED
 devoutness_desc: "Náboženstvo je jedným z najdôležitejších pilierov našej vlády. Veľké verejné prejavy náboženskej oddanosti inšpirujú ľudí, aby nasledovali príklad, a šírenie nábožnosti medzi obyvateľstvom posilní našu moc." # todo: CHANGED
 religious_tradition: "Náboženská tradícia" # todo: NEW TRANSLATION
 religious_tradition_desc: "Sila našej viery a impozantné verejné prejavy zbožnosti a uctievania sú obdivované inými krajinami blízko i ďaleko. To jasne odráža prestíž a slávu nášho kráľovstva." # todo: CHANGED
 ecumenism: "Ekumenizmus" # todo: NEW TRANSLATION
 ecumenism_desc: "Rozhodnúť, ako zaobchádzať s heretikmi v našom kráľovstve, je vždy zložité. Hoci staromódny prístup ohňa a meča vyrieši väčšinu problémov, diplomacia môže tiež uspieť. Podporou dialógu medzi rôznymi sektami dokážeme znížiť nedorozumenia a podporiť mier v krajine." # todo: CHANGED
 advanced_bureaucracy: "Pokročilá byrokracia" # todo: NEW TRANSLATION
 advanced_bureaucracy_desc: "Umožňuje nám zvýšiť daňové príjmy prijatím byrokratickejšieho administratívneho systému riadeného štátnymi úradníkmi." # todo: NEW TRANSLATION
 organised_construction: "Organizovaná výstavba" # todo: NEW TRANSLATION
 organised_construction_desc: "Modernizácia vládnej infraštruktúry je nákladná. Ak však proces zorganizujeme správne, zvládneme ju s nižšími nákladmi." # todo: CHANGED
 smithian_economics: "Smithovská ekonomika" # todo: NEW TRANSLATION
 smithian_economics_desc: "Oponovaním merkantilizmu a obmedzením štátneho vplyvu v ekonomických záležitostiach podporíme slobodný trh, ktorý zvýši našu celkovú výrobnú efektívnosť." # todo: NEW TRANSLATION
 national_bank: "Národná banka" # todo: NEW TRANSLATION
 national_bank_desc: "Zriadením centrálneho orgánu pre finančné záležitosti budeme mať lepšiu kontrolu nad ekonomikou národa." # todo: NEW TRANSLATION
 debt_and_loans: "Dlhy a pôžičky" # todo: NEW TRANSLATION
 debt_and_loans_desc: "Dlhové bremeno je niekedy nevyhnutné. Organizovaný trh dlhov nám umožní dostať pôžičky za nižšie úroky." # todo: CHANGED
 centralized_government: "Centralizovaná vláda" # todo: NEW TRANSLATION
 centralized_government_desc: "Ak centralizujeme štát, bude pre nás ľahšie presadzovať myšlienky a agendu centra nad regiónmi." # todo: CHANGED
 nationalistic_enthusiasm: "Nacionalistický entuziazmus" # todo: NEW TRANSLATION
 nationalistic_enthusiasm_desc: "Zabezpečenie vhodnej podpory pre naše vojská je zásadné pre národnú obranu. S našou vynikajúcou administratívou dokážeme získať značné zľavy na vojenských zásobách." # todo: CHANGED
 additional_colonists: "Dodatoční kolonisti" # todo: NEW TRANSLATION
 additional_colonists_desc: "Nový svet je mnohými spôsobmi prázdny. Ak dáme vedieť ľuďom o neobmedzených príležitostiach, povzbudíme viac ľudí, aby sa usadili tam." # todo: CHANGED
 additional_merchants: "Dodatoční obchodníci" # todo: NEW TRANSLATION
 additional_merchants_desc: "Kolónie sú nám málo platné, ak neposielame bohatstvo domov. Musíme rozšíriť triedu obchodníkov, aby sa to dialo." # todo: CHANGED
 faster_colonists: "Rýchlejší kolonisti" # todo: NEW TRANSLATION
 faster_colonists_desc: "Nemôžeme len poslať kolonistov do Nového sveta a očakávať, že tam okamžite postavia miesto. Najprv je časovo náročné pripraviť expedíciu so všetkým potrebným. Teraz, keď máme skúsenosti, toto môžeme urýchliť." # todo: CHANGED
 additional_diplomats: "Dodatoční diplomati" # todo: NEW TRANSLATION
 additional_diplomats_desc: "Snaha o rozšírenie našej krajiny znamená, že musíme rozšíriť aj náš diplomatický dosah. Musíme zabezpečiť, aby naša diplomatická služba bola primerane obsadená." # todo: NEW TRANSLATION
 improved_shipyards: "Zlepšené lodenice" # todo: NEW TRANSLATION
 improved_shipyards_desc: "Na obranu našich záujmov po celom svete budeme potrebovať silné [navy|e]. Musíme zabezpečiť, aby naše lodenice dokázali vyrábať lode čo najrýchlejšie, aby nahrádzali straty." # todo: CHANGED
 experienced_diplomats: "Skúsení diplomati" # todo: NEW TRANSLATION
 experienced_diplomats_desc: "Niekedy stačí, aby ľudia #italic verili#!, že sme mocní. Tvrdým tréningom našej diplomatickej služby sme zabezpečili, že naše slovo má väčšiu váhu." # todo: CHANGED
 competetive_merchants: "Konkurenční obchodníci" # todo: NEW TRANSLATION
 competetive_merchants_desc: "Aby sme presunuli dôraz obchodu domov, musíme poraziť konkurenciu z iných krajín. Musíme zabezpečiť náš právny systém tak, aby dal našim obchodníkom každú výhodu." # todo: CHANGED
 organised_mercenary_payment: "Organizované platby žoldnierom" # todo: NEW TRANSLATION
 organised_mercenary_payment_desc: "Velitelia žoldiarov sú prefíkaní. Snažia sa vyvolať medzi dvoma veliteľmi bitku o svoje služby. Musíme zefektívniť náš proces platenia žoldnierov, aby sme zabránili takémuto triku a vždy mali výhodnú pozíciu pri rokovaniach." # todo: CHANGED
 benefits_for_mercenaries: "Výhody pre žoldnierov" # todo: NEW TRANSLATION
 benefits_for_mercenaries_desc: "Žoldnieri vždy hľadia najprv na seba, preto musíme zabezpečiť, aby tí, ktorých najímame, zostali verní. Správnou starostlivosťou o naše žoldnierske spoločnosti zostanú dlhšie loajálni a budú vyžadovať menej priamej peňažnej kompenzácie." # todo: CHANGED
 organised_mercenary_recruitment: "Nábor žoldnierov" # todo: NEW TRANSLATION
 organised_mercenary_recruitment_desc: "Peniaze nie sú jediný limit pri nábore žoldnierov. Ďalšou prekážkou je nájsť spoločnosti, ktoré vôbec chcú slúžiť s nami. Preto musíme zabezpečiť, aby náš systém umožňoval pripojiť sa každej ochotnej spoločnosti." # todo: CHANGED
 bookkeeping: "Účtovníctvo" # todo: NEW TRANSLATION
 bookkeeping_desc: "Niekedy je peňazí málo a potrebujeme si požičať. Pôžičkári sa vždy obávajú, či im bude vrátené. Vedením dôkladnej evidencie dokážeme zabezpečiť, že všetci dostanú späť svoje prostriedky, čo nám umožní vyjednávať nižšie úroky." # todo: CHANGED
 legislative_efficiency_idea: "Efektívna administratíva" # todo: NEW TRANSLATION
 legislative_efficiency_idea_desc: "Najdôležitejším faktorom efektívnej vlády je správna rada. Musíme byť čo najinkluzívnejší pri výbere poradcov, aby sme maximalizovali počet rôznych pohľadov, ktoré dostávame." # todo: CHANGED
 resilient_state: "Odolný štát" # todo: NEW TRANSLATION
 resilient_state_desc: "Každý štát čelí obdobiam úpadku. Tieto slabé chvíle posilňujú nespokojných a vylúčených povstalcov. Ak vybudujeme pevné administratívne jadro, ktoré dokáže odolávať týmto otrasom, budeme sa vedieť rýchlejšie zotaviť." # todo: CHANGED
 war_cabinet: "Vojnový kabinet" # todo: NEW TRANSLATION
 war_cabinet_desc: "Vojna je čas, keď je krajina najzraniteľnejšia, a stres z vojny môže vážne podkopať schopnosť vládnuť. Zabezpečením zapojenia kľúčových hráčov administratívy počas vojny sa vyhneme týmto problémom." # todo: CHANGED
 aristocracy: "Aristokracia" # todo: NEW TRANSLATION
 aristocracy_desc: "Aristokracia je kľúčovou súčasťou každej monarchie; šľachta okolo dynastie je to, čo ospravedlňuje panovníka. Koncept kráľovskej krvi nemôže existovať bez konceptu šľachtickej krvi. Aristokracia teda podporuje panovníka, ale očakáva si určité privilégiá výmenou za vernosť, aby sa nikdy nezamieňali s obyčajným ľudom." # todo: CHANGED
 noble_knights: "Šľachtici - rytieri" # todo: NEW TRANSLATION
 noble_knights_desc: "Podpora jazdy vyžaduje ekonomiku, ktorá produkuje veľký počet koní. Ak garantujeme privilegia našej šľachte, budú spokojnejší a urobia veľkú časť práce pri produkcii potrebných koní. Náš dvorný šašo to pomenoval 'služba zaručuje poddaných.'" # todo: CHANGED
 serfdom: "Nevoľníctvo" # todo: NEW TRANSLATION
 serfdom_desc: "Byť pešiakom v armáde nie je žiadaná kariéra vzhľadom na chudobné stravovanie, nízke mzdy a takmer žiadnu zdravotnú starostlivosť. Nábor býva často márny. Ak však zviažeme roľníkov so zemou, vždy budeme vedieť, kde nájsť rekrutov." # todo: CHANGED
 noble_officers: "Šľachtickí dôstojníci" # todo: NEW TRANSLATION
 noble_officers_desc: "Voľba, kto vedie naše vojská, je kľúčová a naši šľachtici chcú mať pri výbere prednosť. Dáme im tak príležitosť dôkazovať statočnosť vlastnou čeľusťou, a my im to umožníme." # todo: CHANGED
 local_nobility: "Miestna šľachta" # todo: NEW TRANSLATION
 local_nobility_desc: "Šľachta vie, že je lepšia než ostatní a bude lojálna len tým, ktoré považuje za hodné. Ak potvrdíme ich privilégiá, budú nám vďační a menej náchylní k pokušnému podplácaniu cudzími mocnosťami." # todo: CHANGED
 international_nobility: "Medzinárodná šľachta" # todo: NEW TRANSLATION
 international_nobility_desc: "Medzinárodné vzťahy sú zložité. Niektorí tvrdia, že obchodníci sú najvhodnejší kvôli skúsenostiam s cudzincami. Títo však prehliadajú rodinné väzby medzi našou šľachtou cez roky. Mali by sme využiť tieto väzby diplomaticky." # todo: CHANGED
 noble_resilience: "Šľachtické väzby" # todo: NEW TRANSLATION
 noble_resilience_desc: "Rôzne žoldnierske skupiny často vedú menší šľachtici. Priatelstvom s aristokraciou môžeme využiť ich kontakty na získanie väčších a početnejších žoldnierskych skupín." # todo: CHANGED
 military_traditions: "Vojenské tradície" # todo: NEW TRANSLATION
 military_traditions_desc: "Povaha vojny sa neustále mení a musíme zabezpečiť, aby vnímanie našich ozbrojených síl rástlo s ňou. Podporou tradície služby medzi šľachtou upevníme predstavu, že vysoké postavenie sa získava slávou na bitevnom poli. Zatiaľ čo statočnosť a bojové schopnosti zostávajú dôležité, skutočná vojenská excelentnosť teraz spočíva v profesionálnej expertíze, nie len v osobnej odvahe." # todo: CHANGED
 tradition_of_payment: "Tradícia platieb" # todo: NEW TRANSLATION
 tradition_of_payment_desc: "Je vždy lákavé meškať s výplatou žoldnierov — veď nikdy neviete, aké neočakávané výdaje môžu prísť. Ale my #italic nebudeme robiť#! to; budeme platiť žoldnierov načas a velitelia si to zapamätajú." # todo: CHANGED
 abolished_serfdom: "Zrušené nevoľníctvo" # todo: NEW TRANSLATION
 abolished_serfdom_desc: "Vieme z antických rímskych zdrojov, že občianska armáda slobodných mužov je ochotnejšia bojovať než nútení vojaci. Mali by sme dať roľníkom relatívnu mieru slobody; potom budú oveľa horlivejšie brániť svoju vlasť — a tie privilégiá." # todo: CHANGED
 bill_of_rights: "Listina práv" # todo: NEW TRANSLATION
 bill_of_rights_desc: "Udelením základných práv občanom znížime pravdepodobnosť povstania roľníkov." # todo: CHANGED
 free_merchants: "Slobodní obchodníci" # todo: NEW TRANSLATION
 free_merchants_desc: "V konzervatívnych spoločnostiach sú obchodníci často opovrhovaní ako menejcenní oproti vlastníkom pôdy. To nie je náš postoj; vieme, že bohatstvo je moc bez ohľadu na svoj pôvod." # todo: CHANGED
 free_subjects: "Slobodní poddaní" # todo: NEW TRANSLATION
 free_subjects_desc: "Aj keď by potrestanie služobníka mohlo byť uspokojivé, nie je to najlepší spôsob, ako zvýšiť jeho pracovitosť. Niektorý prírodný filozof prišiel na myšlienku, že zisk je hlavným motívom práce. Ak nahradíme peňažné dávky naturálnymi platiami, naši roľníci budú viac motivovaní produkovať." # todo: CHANGED
 humanist_tolerance: "Humanistická tolerancia" # todo: NEW TRANSLATION
 humanist_tolerance_desc: "Snahou vytvoriť tolerantnejšiu spoločnosť a riešiť sociálne a náboženské problémy rozumnejšie znížime riziko občianskych nepokojov." # todo: CHANGED
 emancipation: "Emancipácia" # todo: NEW TRANSLATION
 emancipation_desc: "Dlhú dobu sme obmedzovali vlastníctvo pôdy len tým, ktorých sme považovali za dôveryhodných. Ak tieto obmedzenia zrušíme, pozemky by sa mohli konsolidovať, čo vytvorí rezervu sezónnej pracovnej sily vhodnú do armády." # todo: CHANGED
 dynamic_court: "Dynamický dvor" # todo: NEW TRANSLATION
 dynamic_court_desc: "Skutočne inovatívny dvor je taký, kde každý môže vystúpiť do popredia. Musíme sa snažiť, aby staré tradície a predsudky z pôvodu či majetku nebrzdili rozvoj dvora ani neodrádzali talentovaných ľudí slúžiť štátu." # todo: CHANGED
 innovativeness: "Túžba po poznaní" # todo: NEW TRANSLATION
 innovativeness_desc: "Prírodná zvedavosť a túžba pochopiť náš svet sú hnacou silou pokroku. Náš ľud je dychtivý po poznaní a tento zárodok v ich mysli zapáli pokrok pre národ." # todo: CHANGED
 economic_ideas: "Podriadená ekonomika" # todo: NEW TRANSLATION
 economic_ideas_desc: "Ekonomika a bohatstvo krajiny by mali slúžiť vláde, nie naopak. Preto je v záujme štátu hromadiť hlavnú časť zdrojov ako prejav moci a aby lepšie vykonával svoju vôľu. Len tak sa národ môže skutočne rozmnožiť." # todo: CHANGED
 expansionism: "Semeno medzi tŕňami" # todo: NEW TRANSLATION
 expansionism_desc: "Svet je obrovský a nemáme sa uspokojovať so svojou pozíciou, lebo susedia môžu rásť. Stanovíme si ciele na rozšírenie hraníc a posilnenie sa, aby sme neboli pohltení rastúcimi susednými štátmi." # todo: CHANGED
 formal_administration: "Formálna administratíva" # todo: NEW TRANSLATION
 formal_administration_desc: "Správne postupy a dobre fungujúca administratíva vedú ku prosperite; bez efektívnej správy zostanú snahy štátu márne. Formalizujeme a štandardizujeme administratívu, aby vôľa štátu prúdila prirodzene do všetkých kútov krajiny." # todo: CHANGED
 plutocracy: "Moc peňazí" # todo: NEW TRANSLATION
 plutocracy_desc: "Bohatstvo a moc nie sú synonymá, ale sú prepojené: Moc môže robiť bohatým a bohatstvo môže priniesť moc. To vieme dobre, keďže naši najbohatší obyvatelia často sedia v lice moci v krajine." # todo: CHANGED
 rebellion_support: "Tajné kontakty" # todo: NEW TRANSLATION
 rebellion_support_desc: "Sú turbulentné časy a nie každý je spokojný s vládou. Kontaktovaním nespokojných skupín v zahraničí ich môžeme získať pre našu vec a podnecovať povstanie, čo môže byť deštruktívny nástroj na destabilizáciu nepriateľov." # todo: CHANGED
 privateers: "Soukromí korzári" # todo: NEW TRANSLATION
 privateers_desc: "Vojené operácie proti nepriateľskému obchodu sú vrcholom námornej vojny. Podporíme najskúsenejších a najsurovejších morských vlkov, aby zasahovali obchod nepriateľa a rýchlo naplnili naše pokladnice." # todo: CHANGED
 vetting: "Overovanie" # todo: NEW TRANSLATION
 vetting_desc: "Keďže mnohé vládne pozície obsadzujú ambiciózni ľudia, niekedy zistíme, že úradníci sú náchylní na úplatky od cudzích mocností. Jednoduché pozadie kontroly odstráni tých najviac náchylných na korupciu." # todo: CHANGED
 rumourmongering: "Šírenie povestí" # todo: CHANGED
 rumourmongering_desc: "Nepriateľ je zraniteľný na všetkých frontoch. Jedovaté slovo do správneho ucha môže byť rovnako smrteľné ako desaťtisíc vojakov. Musíme byť pripravení praktizovať všetky tie tiene umenia, ktoré nám môžu pomôcť vyhrať..." # todo: CHANGED
 efficient_spies: "Efektívni špióni" # todo: NEW TRANSLATION
 efficient_spies_desc: "Väčšina roľníkov by rada predala vlastnú matku za zlaté, ale existujú i takí s talentom, ktorých vláda môže využiť na...ah, #italic štátnu správu#!. Aj keď je ťažké vybrať tých hodných, skúsenosť nám pomáha rozlíšiť zrno od pliev." # todo: CHANGED
 shady_recruitment: "Sporný nábor" # todo: NEW TRANSLATION
 shady_recruitment_desc: "Naša schopnosť nájsť a naverbovať vynikajúcich agentov z tých najnižších vrstiev vytvorila skvelú zámienku: vôbec to nemôžeme byť #italic my#!, prinútili sme týchto početných darebákov konať v náš prospech! A práve o to ide..." # todo: CHANGED
 destabilising_efforts: "Destabilizačné snahy" # todo: NEW TRANSLATION
 destabilising_efforts_desc: "Naše špionážne schopnosti nám umožňujú zamerať sa na samotnú stabilitu nepriateľov. Máme silu premeniť ich najväčších priateľov na nepriateľov..." # todo: CHANGED
 espionage: "Špionáž" # todo: NEW TRANSLATION
 espionage_desc: "Umožňuje nám trénovať viac špiónov a tým zvýšiť naše šance získať politické a vojenské informácie o nepriateľoch." # todo: NEW TRANSLATION
 foreign_embassies: "Zahraničné veľvyslanectvá" # todo: NEW TRANSLATION
 foreign_embassies_desc: "Diplomacia je jemné umenie, ktoré vyžaduje vyvažovanie potrieb a túžob viacerých subjektov. Udržiavanie veľvyslanectiev v iných krajinách, ktoré nám pravidelne podávajú správy, nám poskytne informácie potrebné na lepšie zváženie diplomatických možností." # todo: CHANGED
 claim_fabrication: "Konštrukcia nárokov" # todo: NEW TRANSLATION
 claim_fabrication_desc: "Je ľahké niečo si prisvojiť; presvedčiť všetkých ostatných, že nárok je oprávnený, je omnoho ťažšie. Rozšírením diplomatickej siete zabezpečíme, že tí, na ktorých záleží, budú vedieť, že sme si nárok uplatnili." # todo: CHANGED
 cabinet: "Kabinet" # todo: NEW TRANSLATION
 cabinet_desc: "Zriadením výkonného rady dokážeme zhromaždiť našich najzručnejších diplomatov." # todo: NEW TRANSLATION
 adaptability: "Prispôsobivosť" # todo: NEW TRANSLATION
 adaptability_desc: "Existuje, čo je naše, a to, čo je súčasťou nášho 'predkovského' dedičstva, ktoré sa nikdy nevzdá. Trocha flexibility pri definovaní týchto 'predkovských' hraníc povedie k tomu, že viac územia bude prijaté ako naše oprávnené vlastníctvo, a ak nastane najhoršie, celý svet uvidí náš boj za jeho obnovu ako oprávnený." # todo: CHANGED
 revolution_and_counter: "Revolúcia a kontrarevolúcia" # todo: NEW TRANSLATION
 revolution_and_counter_desc: "S politikou doby sa polarizácia a radikalizmus zvyšujú, a my možno nemáme inú možnosť než viesť vojnu proti vládam, ktoré nie sú podobné tej našej." # todo: CHANGED
 diplomatic_influence: "Diplomatický vplyv" # todo: NEW TRANSLATION
 diplomatic_influence_desc: "Sústredením sa na diplomaciu dokážeme zväčšiť moc, ktorú máme na svetovej scéne, a získať veľa priateľov a potenciálnych spojencov." # todo: CHANGED
 flexible_negotiation: "Flexibilné rokovanie" # todo: NEW TRANSLATION
 flexible_negotiation_desc: "Počas mierových rokovaní nikdy presne neviete, čo možno získať, preto by sme mali ísť do nich s otvorenými možnosťami." # todo: CHANGED
 agent_training: "Výcvik agentov" # todo: NEW TRANSLATION
 agent_training_desc: "Máme mnoho utajených operácií, ale nedostatok agentov ich uskutočneniu bráni. Zriadenie výcviku pre špiónov zvýši počty operatívnych síl pre nebezpečné misie." # todo: CHANGED
 additional_loyalist_recruitment: "Doplnkový nábor lojalistov" # todo: NEW TRANSLATION
 additional_loyalist_recruitment_desc: "Samozrejme, v našich podriadených krajinách sú tí, ktorí uznávajú naše božské právo vládnuť. Náborom a podporou týchto lojálnych jedincov môžeme posilniť náš dosah v týchto územiach." # todo: CHANGED
 audit_checks: "Auditné kontroly" # todo: NEW TRANSLATION
 audit_checks_desc: "Kým sa snažíme infiltrovať iné štáty, musíme byť ostražití voči jedovatým myšlienkam šíriacim sa v našich vlastných dvoroch. Zhromaždenie audítorskej skupiny na kontrolu ministrov nám pomôže odhaliť skazené prvky." # todo: CHANGED
 grand_army: "Veľká armáda" # todo: NEW TRANSLATION
 grand_army_desc: "Umožňuje nám vytvoriť jednu z najväčších a najsilnejších armád, aké svet kedy videl." # todo: NEW TRANSLATION
 glorious_arms: "Slávne zbrane" # todo: NEW TRANSLATION
 glorious_arms_desc: "Pohľad na našu slávnu a prestížnu armádu rozochveje všetkých protivníkov strachom." # todo: NEW TRANSLATION
 bayonet_leaders: "Velitelia s bajonetmi" # todo: NEW TRANSLATION
 bayonet_leaders_desc: "Muži, ktorí sú dobre vedení, budú nasledovať, takže musíme zabezpečiť, aby naši dôstojníci viedli z prvej línie." # todo: CHANGED
 battlefield_commisions: "Bojiskové povýšenia" # todo: NEW TRANSLATION
 battlefield_commisions_desc: "Umožňuje nám silne sa zamerať na vojenské pokroky a tým zvýšiť tradíciu armády." # todo: NEW TRANSLATION
 improved_foraging: "Zlepšené hľadanie zásob" # todo: NEW TRANSLATION
 improved_foraging_desc: "Tradične sme sa nedokázali efektívne bojovať v krajinách, ktoré neposkytovali jedlo. Naše jednotky sa však zlepšili v získavaní potravy v teréne, čo umožňuje väčším armádam bojovať." # todo: CHANGED
 improved_manuever: "Zlepšené manévrovanie" # todo: NEW TRANSLATION
 improved_manuever_new: "Zlepšený dosah obchvatu" # todo: NEW TRANSLATION
 improved_manuever_desc: "Taktické postavenie je kľúčová zručnosť pre každého veliteľa. Schopnosť manévrovať jednotkami účinne po bojišti nám dá výraznú výhodu." # todo: CHANGED
 engineer_corps: "Korpus inžinierov" # todo: NEW TRANSLATION
 engineer_corps_desc: "Umožní nám zhromaždiť najväčšie technologické mysle našej krajiny a využiť ich nenapodobiteľné služby." # todo: CHANGED
 military_drill: "Vojenský výcvik" # todo: NEW TRANSLATION
 military_drill_desc: "Umožní nám investovať do vojenského výcviku a tým zlepšiť bojové formácie, manipuláciu so zbraňami a morálku našej armády." # todo: CHANGED
 regimental_system: "Plukový systém" # todo: NEW TRANSLATION
 regimental_system_desc: "Zorganizovaním armád do plukov viazaných na konkrétne geografické oblasti im umožníme zakoreňovať sa v miestnych komunitách. Potom potrebujeme zdvihnúť ďalšie batalióny pre tieto pluky; nábor bude rýchlejší vďaka regionálnym väzbám." # todo: CHANGED
 defensive_mentality: "Obranná mentalita" # todo: NEW TRANSLATION
 defensive_mentality_desc: "Sú tí, ktorí si myslia, že útok je najlepšia forma obrany, ale to je pošetilé. Nech nepriatelia prídu k nám; my odpovieme so žiarivým nasadením. Naše jednotky budú brániť svoje domovy vytrvalo a naše pevnosti vydržia obliehania dlhšie." # todo: CHANGED
 superior_firepower: "Prevažná palebná sila" # todo: NEW TRANSLATION
 superior_firepower_desc: "Používanie zhromaždenej palebnej sily na narušenie nepriateľa pred doručením rozhodujúcej rany je jednou z našich silných stránok a zabezpečíme, aby to naši velitelia pochopili." # todo: CHANGED
 supply_trains: "Zásobovacie siete" # todo: NEW TRANSLATION
 supply_trains_desc: "Počas ťaženia je odchodnosť náš najväčší nepriateľ a kľúčom k jeho obmedzeniu je dobre naplánovaná a efektívne riadená logistická sieť schopná poskytovať zásoby." # todo: CHANGED
 national_conscripts: "Národný odvod" # todo: NEW TRANSLATION
 national_conscripts_desc: "Zvyšuje naše vojenské počty tým, že zavádza brannú povinnosť pre oprávnených." # todo: CHANGED
 shrewd_commerce_practice: "Obratný obchod" # todo: NEW TRANSLATION
 shrewd_commerce_practice_desc: "Umožní nám využiť rafinovanejšie obchodné praktiky, dávajúc našim obchodníkom náskok pred konkurenciou." # todo: CHANGED
 free_trade: "Voľný obchod" # todo: NEW TRANSLATION
 free_trade_desc: "Naše vedúce obchodnícke rody chcú zabezpečiť obchodné privilégiá pre seba, ale my s tým nesúhlasíme a preto povolíme rast obchodníckej triedy." # todo: CHANGED
 merchant_adventures: "Obchodné dobrodružstvá" # todo: NEW TRANSLATION
 merchant_adventures_desc: "To nám umožní využiť mnohých obchodníkov túžiacich po sláve a bohatstve, ochotných ponúknuť svoje služby na hľadanie a objavovanie nových obchodných ciest." # todo: CHANGED
 national_trade_policy: "Národná obchodná politika" # todo: NEW TRANSLATION
 national_trade_policy_desc: "Prijatím národnej obchodnej politiky môžeme posilniť naše komerčné postavenie a zvýšiť efektivitu nášho obchodu." # todo: NEW TRANSLATION
 overseas_merchants: "Zámorskí obchodníci" # todo: NEW TRANSLATION
 overseas_merchants_desc: "Aby sme rozšírili obchod, musíme udeliť občianske práva ľuďom žijúcim v zahraničí, ktorí podporujú náš obchod a sú príslušnej spoločenskej vrstvy." # todo: CHANGED
 trade_manipulation: "Manipulácia obchodu" # todo: NEW TRANSLATION
 trade_manipulation_desc: "Na tých kľúčových úzkych miestach, kde sa obchod môže obrátiť jedným či druhým smerom, je kľúčové vytlačiť regionálnu konkurenciu, aby sme rozšírili naše obchodné príjmy." # todo: CHANGED
 fast_negotiations: "Rýchle rokovania" # todo: NEW TRANSLATION
 fast_negotiations_desc: "Niekedy je kľúčom k uzavretiu obchodnej dohody byť najrýchlejší. Musíme zabezpečiť, aby naši obchodníci vždy dokázali úspešne uzavrieť svoje obchody." # todo: CHANGED
 colonial_ventures: "Koloniálne podniky" # todo: NEW TRANSLATION
 colonial_ventures_desc: "Umožní nám posielať viac kolonistov do neznámych krajín." # todo: CHANGED
 quest_for_the_new_world: "Hľadanie Nového sveta" # todo: NEW TRANSLATION
 quest_for_the_new_world_desc: "Umožní nám pridať sa k národom, ktoré sa chystajú preskúmať svet mimo svojich hraníc, alebo sa snažiť oboplávať zemeguľu ako prví, tým, že začneme hľadanie Nového sveta." # todo: CHANGED
 overseas_exploration: "Hľadači šťastia" # todo: CHANGED
 overseas_exploration_desc: "Zakladanie kolónií v diaľavách je pre mnohých jednosmerná cesta. Aj keď vás nezožerú choroby a nepriaznivé podmienky vás neochudobnia, čas plavby späť znamená, že sa s najväčšou pravdepodobnosťou nikdy nevrátite. Aj keď sú tieto skutočnosti odradzujúce, môžeme ľudí povzbudiť predstavou bohatstva čakajúceho v kolóniách." # todo: CHANGED
 land_of_opportunity: "Krajina príležitostí" # todo: NEW TRANSLATION
 land_of_opportunity_desc: "Ak opíšeme naše kolónie a okolie neobsadených území ako miesta, kde si každý môže vybudovať svoje šťastie, rýchlo zvýšime emigráciu do našich zámoorských držieb. To znamená, že krajina vynaloží menej peňazí na motiváciu ľudí tam ísť." # todo: CHANGED
 vice_roys: "Vicekráli" # todo: NEW TRANSLATION
 vice_roys_desc: "Umožní nám zriadiť vicekráľov, čím zlepšíme správu kolónií a zvýšime ich výnosy." # todo: CHANGED
 free_colonies: "Voľné kolónie" # todo: NEW TRANSLATION
 free_colonies_desc: "Len toľko ľudí je ochotných presťahovať sa a rozšíriť naše veľké koloniálne impérium. Avšak sľub pozemku v osobnom vlastníctve povzbudí mnohých hľadať šťastie v zámoří. A výhodou je, že pôdy je dosť pre všetkých!" # todo: CHANGED
 global_empire: "Globálna ríša" # todo: NEW TRANSLATION
 global_empire_desc: "Naša oddanosť koloniálnemu impériu zmenila postoje k práci v koloniálnej administrácii. Už sa to nepovažuje len za úkryt pre hľadačov šťastia, ale za prestížnu kariéru pre najbystrejších a najlepších, čo sa prejavuje efektívnejším výberom daní." # todo: CHANGED
 formal_diplomacy: "Formálna diplomacia" # todo: NEW TRANSLATION
 formal_diplomacy_desc: "V čase, keď moc prestupuje z rúk jednotlivcov do kontroly centralizovanej autority, je múdre budovať mosty a otvárať kanály komunikácie medzi nami a susedmi. Diplomacia je kľúčová, a ešte viac v tvári týchto vzrastajúcich mocností." # todo: CHANGED
 explorer_commisions_advance: "Komisie prieskumníkov" # todo: NEW TRANSLATION
 explorer_commisions_advance_desc: "Za našimi pobrežiami ležia neprebádané krajiny pripravené na obsadenie! Najmeme odvážnych prieskumníkov, aby sa vydali do neznáma a priniesli exotické produkty. Toto je zásadná — a možno veľmi výnosná — príležitosť." # todo: CHANGED
 offensive_army: "Útočná armáda" # todo: NEW TRANSLATION
 offensive_army_desc: "Éra praxe palných zbraní a vojenských inovácií priniesla nový záujem o vedenie vojny. Aby sme rozšírili našu slávu, musíme dôsledne zabezpečiť vysoké štandardy pre naše útočné sily." # todo: CHANGED
 defensive_army: "Obranná armáda" # todo: NEW TRANSLATION
 defensive_army_desc: "Vzostup mnohých mocných štátov okolo nás urýchlil potrebu robustných obranných síl, ktoré udržia našu územnú celistvosť. Znalosť domáceho terénu, skrytých ciest a regionálnych taktik nás prevedie touto turbulentnou dobou." # todo: CHANGED
 national_trade: "Národný obchod" # todo: NEW TRANSLATION
 national_trade_desc: "Odev, vlna a iné žiadané komodity sa dostali po svete. V čase, keď obchod národa dosahuje vzdialené brehy, musíme zabezpečiť, aby naši obchodníci vždy mali výhodu!" # todo: CHANGED
 exploration: "Objaviteľské idey" # todo: NEW TRANSLATION
 exploration_desc: "Naša námorská prevaha nám umožňuje premietať moc ďaleko za naše obzory a nárokovať vzdialené krajiny právom objavu." # todo: CHANGED
 superior_seamanship: "Vynikajúce námorníctvo" # todo: NEW TRANSLATION
 superior_seamanship_desc: "Umožní nám premeniť naše námorníctvo na vrcholnú námornú silu s špičkovými plavidlami a vysoko zručnými kapitánmi a posádkami." # todo: CHANGED
 naval_glory: "Námorná sláva" # todo: NEW TRANSLATION
 naval_glory_desc: "Ohromujúci pohľad na naše slávne námorníctvo rozochveje všetkých protivníkov strachom!" # todo: CHANGED
 grand_navy: "Veľké námorníctvo" # todo: NEW TRANSLATION
 grand_navy_desc: "Umožní nám vytvoriť jedno z najväčších a najsilnejších námorníctiev, aké svet kedy videl." # todo: CHANGED
 sea_hawks: "Morskí jastrabi" # todo: NEW TRANSLATION
 sea_hawks_desc: "Umožní nám silne sa sústrediť na vojenské pokroky a tým zvýšiť našu námornú tradíciu." # todo: CHANGED
 excellent_shipwrights: "Vynikajúci stavbári lodí" # todo: NEW TRANSLATION
 excellent_shipwrights_desc: "Zhromaždením najlepších staviteľov lodí v krajine dokážeme postaviť námorníctvo moderných plavidiel bezkonkurenčného remeselného spracovania a manévrovateľnosti." # todo: CHANGED
 naval_fighting_instruction: "Námorné bojové inštrukcie" # todo: NEW TRANSLATION
 naval_fighting_instruction_desc: "Umožní našim námorným veteránom vyvíjať nové metódy na zvýšenie efektivity pri blokádach." # todo: CHANGED
 press_gangs: "Nátlakový nábor" # todo: NEW TRANSLATION
 press_gangs_desc: "Život na mori je tvrdý a nie každý túži po námornej kariére. Legalizáciou nadania námorníkov bude jednoduchšie obsadiť posádky, čo urýchli proces zaraďovania lodí." # todo: CHANGED
 quality_education: "Dobre vycvičené sily" # todo: CHANGED
 quality_education_desc: "Najkritickejší moment pre armádu nastáva po bitke. Vyhráme či prehráme, vojaci sú najzraniteľnejší, keď sú vyčerpaní. Musíme zabezpečiť, aby naše jednotky boli vysoko vycvičené a dokázali sa rýchlo zotaviť z bojov, inak nás nepriatelia využijú v momentoch slabosti." # todo: CHANGED
 finest_of_horses: "Najlepšie kone" # todo: NEW TRANSLATION
 finest_of_horses_desc: "Ako pevne tieto jednotky stoja na zemi! Ako krásne sa formuje naša jazda! Kvalitné kone s dobre vyškolenými jazdcami sú znakom modernej bojovej sily a naše sú obzvlášť pôsobivé." # todo: CHANGED
 oak_forests_for_ships: "Dubové lesy pre lode" # todo: NEW TRANSLATION
 oak_forests_for_ships_desc: "Čím viac otrpenia naše lode vydržia, tým viac ho môžu spôsobovať. Zabezpečme si zásobu najlepšie vyzretého dubového dreva pre naše vojnové lode." # todo: CHANGED
 private_to_marshal: "Od vojaka k maršalovi" # todo: NEW TRANSLATION
 private_to_marshal_desc: "Každý vojín má maršalovu palicu v sebe — možno nie doslovne — ale tí, čo sa vyznamenajú v boji, budú povýšení a odmenení. Vojaci sú tým motivovaní." # todo: NEW TRANSLATION
 naval_drill: "Námorný výcvik" # todo: NEW TRANSLATION
 naval_drill_desc: "Zmätenie v boji môže urobiť bojovú loď nepoužiteľnou dlhý čas. Dobrá vycvičená posádka sa zotaví oveľa rýchlejšie než bežná." # todo: NEW TRANSLATION
 merchant_marine: "Obchodné námorníctvo" # todo: NEW TRANSLATION
 merchant_marine_desc: "Nech každý obchodný plavidlo hrdinsky nesie náš znak a vie, že naše námorníctvo bude vždy pripravené ho ochrániť, ak bude treba." # todo: CHANGED
 massed_battery: "Hromadná delostrelecká batéria" # todo: NEW TRANSLATION
 massed_battery_desc: "Zhromaždime naše delostrelectvo do jednej veľkej batérie. Jej ničivá sila prerazí nepriateľské línie!" # todo: CHANGED
 benefits_for_horseowners: "Výhody pre majiteľov koní" # todo: NEW TRANSLATION
 benefits_for_horseowners_desc: "Život je lacný, ale kone sú drahé. Ak zavedie systém výhod pre majiteľov koní, budeme mať väčší výber, keď príde čas." # todo: CHANGED
 the_old_and_infirm: "Starí a chorí" # todo: NEW TRANSLATION
 the_old_and_infirm_desc: "Naši veteráni často bývajú hnusní a skorumpovaní, ale to neznamená, že sú na nič. Namiesto toho, aby sme ich nechali chudobných na ulici, môžeme z nich spraviť inštruktorov a štábnych seržantov, aby ich jedinečné schopnosti zostali využité." # todo: CHANGED
 the_young_can_serve: "Mladí môžu slúžiť" # todo: NEW TRANSLATION
 the_young_can_serve_desc: "Kedy je chlapec mužom? Kedy je pripravený zomrieť za krajinu? Niektorí vládci sú opatrní; my sme na druhej strane rovnosť príležitostí v tomto smere." # todo: CHANGED
 enforced_service: "Vynútená služba" # todo: NEW TRANSLATION
 enforced_service_desc: "Dobrovoľníctvo je princíp našej armádnej štruktúry, ale niekedy nie je dosť ochotných. Mali by sme ľudí prinútiť — ehm, #italic povzbudiť#! ich, aby sa zaregistrovali." # todo: CHANGED
 ships_penny: "Loďný poplatok" # todo: NEW TRANSLATION
 ships_penny_desc: "Lode sú drahé na stavbu a údržbu. Zavedením poplatku za loď — malého dane na obchod alebo prístavné aktivity — zabezpečíme, že naša flotila zostane silná bez vyprázdnenia pokladnice." # todo: CHANGED
 standardized_artillery: "Štandardizované delá" # todo: NEW TRANSLATION
 standardized_artillery_desc: "Každý liarnik žiarli na svoje techniky a považuje každú delovú súčiastku za umelecké dielo. Hoci ich egá sú uspokojené, nie je to ideálne pri objednávaní munície. Odteraz budeme trvať na tom, aby všetky delá boli vyrábané podľa našich presných špecifikácií. To zníži náklady a zlepší výrobu." # todo: CHANGED
 mass_army: "Masová armáda" # todo: NEW TRANSLATION
 mass_army_desc: "Doteraz sme boli veľmi selektívni, kto môže slúžiť ako radový vojak. Brali sme len najchudobnejších a najzúfalejších — tých, ktorých nikto nepostráda. Teraz otvoríme rady všetkým, ktorí chcú slúžiť a nemajú významný majetok." # todo: CHANGED
 mercenary_contracts: "Zmluvy so žoldniermi" # todo: NEW TRANSLATION
 mercenary_contracts_desc: "Uzatvorením trvalých zmlúv s niektorými veliteľmi žoldnierov zabezpečíme, že budeme mať prístup k veľkému množstvu žoldnierov, keď ich budeme potrebovať." # todo: CHANGED
 local_traditions: "Miestne tradície" # todo: NEW TRANSLATION
 local_traditions_desc: "Vláda veľkého národa znamená vládnuť rôznym ľuďom s rôznymi zvykmi a tradíciami. Začlenením týchto tradícií do oficiálneho právneho kódexu vytvoríme šťastnejšie a lojálnejšie obyvateľstvo." # todo: CHANGED
 indirect_rule: "Nepriame vládnutie" # todo: NEW TRANSLATION
 indirect_rule_desc: "Niekedy najlepší spôsob, ako prinútiť ľudí robiť, čo chceme, je dať im pocit, že mali voľbu. Systém nepriamych vlád redukuje nepokoje v novo získaných provinciách tým, že im dá ilúziu väčšej mierky samosprávy." # todo: CHANGED
 cultural_ties: "Kultúrne väzby" # todo: NEW TRANSLATION
 cultural_ties_desc: "Rôzne kultúry majú rôzne zvyky a často odolávajú pokusom vládcov ich zmeniť. Môžeme túto slabosť premeniť na výhodu zapojením miestnych vodcov do našej správy a nechať ich vykonávať našu vôľu spôsobom prijateľným pre ich ľud." # todo: CHANGED
 benevolence: "Láskavosť" # todo: NEW TRANSLATION
 benevolence_desc: "Náš národ je baštou tolerancie a osvietenia. Zabezpečením, aby to všetky krajiny vedeli, môžeme podporiť lepšie vzťahy v zahraničí." # todo: NEW TRANSLATION
 establish_cadet_branches: "Zriadiť postranné vetvy" # todo: NEW TRANSLATION
 establish_cadet_branches_desc: "Dedičstvo môže byť zložité. Jasným stanovením rolí a práv pre dynastické cadetvetvy môžeme zabezpečiť stabilnejší rad následníctva." # todo: CHANGED
 tribute_system: "Systém tribútov" # todo: NEW TRANSLATION
 tribute_system_desc: "Posilnite naše príjmy zavedením formalizovaného systému ročných tributov od našich vazalov." # todo: NEW TRANSLATION
 integrated_elites: "Integrované elity" # todo: NEW TRANSLATION
 integrated_elites_desc: "Zapojiť vládnu elitu našich podriadených národov do našej vlády nám výrazne uľahčí proces integrácie ich provincií." # todo: CHANGED
 state_propaganda: "Štátna propaganda" # todo: NEW TRANSLATION
 state_propaganda_desc: "Rovnako ako u človeka, povesť národa je všetko, a zriadenie oficiálnej propagandistickej služby zabezpečí, že naše meno nebude poškvrnené klamstvami nepriateľov." # todo: NEW TRANSLATION
 postal_service: "Poštová služba" # todo: NEW TRANSLATION
 postal_service_desc: "Pri súčasných komunikáciách je ťažké zabezpečiť, aby naše diplomatické depeše dorazili včas. Vytvorenie siete poštových úradov a odpočívadiel kuriérov uľahčí, aby bol náš hlas počuť v odľahlých krajinách." # todo: NEW TRANSLATION
 marcher_lords: "Pohraniční páni" # todo: NEW TRANSLATION
 marcher_lords_desc: "Udelením značnej autonómie vazalom v pohraničných oblastiach umožníme týmto 'pohraničným pánom' postaviť veľké vojenské sily na podporu v našich vojnách." # todo: NEW TRANSLATION
 boarding_parties: "Družstvá na obsadenie lode" # todo: NEW TRANSLATION
 boarding_parties_desc: "Vyškolením námorných dôstojníkov na vedenie obsadzovacích akcií proti nepriateľským lodiam získame výhodu v námorných súbojoch aj proti silnejším nepriateľským [navies|e]." # todo: NEW TRANSLATION
 improved_rams: "Vylepšené tarany" # todo: NEW TRANSLATION
 improved_rams_desc: "Koncept vybavovania vojnových lodí taranmi siaha tisíce rokov dozadu, ale v metalurgii sa odvtedy dosiahli veľké pokroky, ktoré by sme mali využiť na tvorbu pevnejších taranov." # todo: NEW TRANSLATION
 naval_cadets: "Námorní kadeti" # todo: NEW TRANSLATION
 naval_cadets_desc: "Propagáciou námorníctva ako ideálnej kariéry pre druhých alebo tretích synov šľachty vytvoríme profesionálny zbor námorných dôstojníkov na dohľad nad streleckými posádkami." # todo: CHANGED
 copper_bottoms: "Medené spodky" # todo: NEW TRANSLATION
 copper_bottoms_desc: "Drevo je ideálny materiál na stavbu lodí, no má tendenciu sa časom kaziť. Opláštením trupu medenými doskami pod čiarou ponoru znížime tento rozklad, čo im umožní lepšie zvládať dlhé plavby." # todo: NEW TRANSLATION
 escort_ships: "Korvety" # todo: NEW TRANSLATION
 escort_ships_desc: "Korvety sú triedou malých vojnových lodí určených na eskortu priateľských lodí a obťažovanie nepriateľa, spoliehajú sa na rýchlosť a manévrovateľnosť namiesto masívnej palebnej sily." # todo: CHANGED
 national_arsenal: "Národná zbrojnica" # todo: NEW TRANSLATION
 national_arsenal_desc: "Zriadením národnej zbrojnice, kde sa budú stavať a udržiavať naše vojnové lode podľa jednotných štandardov, môžeme postaviť väčšiu flotilu." # todo: NEW TRANSLATION
 garrison_conscription: "Odvod do posádok" # todo: NEW TRANSLATION
 garrison_conscription_desc: "Zavedením brannej povinnosti pre naše garnizóny si zabezpečíme dosť stráží na obranu hraníc." # todo: CHANGED
 expanded_supply_trains: "Rozšírené zásobovacie siete" # todo: NEW TRANSLATION
 expanded_supply_trains_desc: "Investovanie väčších prostriedkov do zásobovacích vlakov umožní armáde operovať dlhšie v nepriateľskom teréne." # todo: CHANGED
 sheltered_ports: "Chránené prístavy" # todo: NEW TRANSLATION
 sheltered_ports_desc: "Bohužiaľ lode sa poškodzujú v bitke a zriedka je možné ich opraviť na mori. Na zmiernenie tohto problému vytvoríme systém prístavov s úkrytmi pozdĺž pobrežia, kde si lode budú môcť opraviť škody." # todo: CHANGED
 diplomatic_corps: "Diplomatický zbor" # todo: NEW TRANSLATION
 diplomatic_corps_desc: "Zriadením profesionálneho diplomatického zboru zabezpečíme, že skúsenosti starších diplomatov budú odovzdávané mladšej generácii." # todo: CHANGED
 civil_servants: "Štátna služba" # todo: NEW TRANSLATION
 civil_servants_desc: "Zriadenie štátnej služby zapálených mladých byrokratov zabezpečí, že sa rýchlo prispôsobíme novým administratívnym pokrokom." # todo: CHANGED
 free_cities: "Slobodné mestá" # todo: NEW TRANSLATION
 free_cities_desc: "Udelením samosprávy našim mestám v otázkach obchodu nám umožní otvoriť nové výnosné obchodné cesty." # todo: NEW TRANSLATION
 preaching_missions: "Misionárske výpravy" # todo: NEW TRANSLATION
 preaching_missions_desc: "Zriadiť misionárske expedície, ktoré zabezpečia, že naše obyvateľstvo bude uctievať jedinú pravú vieru." # todo: CHANGED
 marine_regiments: "Mariňácke pluky" # todo: NEW TRANSLATION
 marine_regiments_desc: "Námorná pechota sú jednotky špecializované na amfibické operácie. Môžu byť použité pri nájazdoch na pobrežie a pri abordážach nepriateľských plavidiel, pričom sú schopné zasiahnuť aj na súši." # todo: CHANGED
 discipline_drills: "Disciplínované cvičenia" # todo: NEW TRANSLATION
 discipline_drills_desc: "Počas boja záleží len na troch veciach: palebnej sile, počte a disciplíne schopnej spojiť oboje. Pravidelné vojenské cvičenia a manévre pozdvihnú naše sily na novú úroveň." # todo: CHANGED
 open_levy_standards: "Otvorené pravidlá verbovania" # todo: NEW TRANSLATION
 open_levy_standards_desc: "Čo robí muža ochotným bojovať a zomrieť za svoju krajinu? Je to viera? Vernosť národu? Alebo túžba chrániť rodinu? Nakoniec na odpovedi nezáleží; každý má povinnosť slúžiť pod naším praporom." # todo: CHANGED
 influence: "Diplomacia nátlaku" # todo: NEW TRANSLATION
 influence_desc: "Ukončenie vojny si vyžaduje rokovania medzi dvoma stranami a niekedy jedna strana odmieta ustúpiť. V takých prípadoch diplomacia tlaku — a jemné pripomenutie ich možnej blížiacej sa porážky — ich motivuje prijať naše štedré podmienky." # todo: CHANGED
 divine_passion: "Božská vášeň" # todo: NEW TRANSLATION
 divine_passion_desc: "Časy sa menia. Viera bývala kedysi najdôležitejšou vecou v našich životoch, ale teraz sa medzi ľudom šíria myšlienky kedysi považované za rúhavé. V takom vyvíjajúcom sa svete nachádza náš klérus útechu v neotrasiteľnej oddanosti našej veci." # todo: CHANGED
 servants_of_god: "Služobníci Boží" # todo: NEW TRANSLATION
 servants_of_god_desc: "Byť súčiastkou tohto nebeského stroja je veľká česť; ľudia nachádzajú hlboký zmysel v slúžení božej vôli. Presvedčenie, že spoločné slúžime božiemu účelu, napína srdcia našich ľudí hromovým aplauzom." # todo: CHANGED
 by_the_grace_of_god: "Po milosti Božej" # todo: NEW TRANSLATION
 by_the_grace_of_god_desc: "Svet bol stvorený ohňom a v ohni všetci skončíme. Náš boh nám daroval plameň života, spaľujúc naše duše a ukazujúc nám pravdu jeho nebezpečenstva. Nech sa nebojíte." # todo: CHANGED
 state_of_clerics: "Postavenie klerikov" # todo: NEW TRANSLATION
 state_of_clerics_desc: "Povaha teokracie tkví v jej blízkosti k božskému. Aby dosiahla túto blízkosť, mnohé úkony vlády vykonáva klérus, spájajúc náboženské obrady s byrokratickými úlohami administrátorov." # todo: CHANGED
 friends_in_high_places: "Priatelia na vysokých miestach" # todo: NEW TRANSLATION
 friends_in_high_places_desc: "Existuje len jedna cesta k nesmrteľnému šťastiu. Poznať božstvo znamená tiež poznať jeho svätých zástupcov na zemi, ktorí nám pomôžu nájsť tú cestu." # todo: CHANGED
 flesh_is_weak: "Telo je slabé" # todo: NEW TRANSLATION
 flesh_is_weak_desc: "Telo môže byť slabé a kaziteľné, ale duša nie. Naše armády sa naučili bojovať ako jedna duša, a tak ich morálka nemôže byť zlomená." # todo: CHANGED
 alpha_and_omega: "Alfa a Omega" # todo: NEW TRANSLATION
 alpha_and_omega_desc: "Naša viera je začiatok a koniec všetkého. Hlas nášho boha bude jediným zvukom, ktorý nepriatelia počujú nad krikom bitky; slová našej viery ich dovedú k pravde." # todo: CHANGED
 conviction_of_sin: "Uvedomenie hriechu" # todo: NEW TRANSLATION
 conviction_of_sin_desc: "Tí, ktorí zhrešili, padnú na kolená pod ťarchou vlastnej zlomyseľnosti! Ich zlé činy ich budú prenasledovať naveky a nebudú spať, kým neodčinia pašerácke nočné mory, ktoré spôsobili." # todo: CHANGED
 martyrs: "Mučeníci" # todo: NEW TRANSLATION
 martyrs_desc: "Mučeník je ten, kto chápe, že zomrieť za vieru je najvyššia česť. Ľudia našej krajiny držia vieru blízko srdca a vždy sú pripravení pridať sa k našej veci. Ak zomrú ako mučeníci, je to pocta, nie tragédia." # todo: CHANGED
 cultural_acceptance_advance: "Kultúrne prijatie" # todo: NEW TRANSLATION
 cultural_acceptance_advance_desc: "Ako absorbujeme iné národy do nášho štátu, cudzie tradície môžu spôsobiť napätie s našimi. Jedným zo spôsobov riešenia je tolerovať týchto cudzincov, akoby boli naši vlastenci, a nesnažiť sa ich vnútorne asimilovať." # todo: CHANGED
 unlock_traditional_galley_advance: "$n_traditional_galley$" # todo: NEW TRANSLATION
 unlock_traditional_galley_advance_desc: "$n_traditional_galley_desc$" # todo: NEW TRANSLATION
 hollander_beater: "Holandský drvič" # todo: NEW TRANSLATION
 hollander_beater_desc: "Storočia mlyny na papier používali mechanické kladivá na rozbíjanie vláknitej buničiny. Využitím miestnych veterných mlynov poháňajúcich horizontálny valec s čepeľami prišli podnikaví remeselníci s efektívnejším riešením: 'Hollander Beater', nádrž s veterným prevodom, ktorý dokáže spracovať toľko buničiny za hodiny, čo staré kladivá za dni." # todo: CHANGED
 faceting: "Fazetovanie" # todo: NEW TRANSLATION
 faceting_desc: "Majstri brúsiči diamantov dosiahli prelom v rezaní brúsením diamantového prachu suspendovaného v oleji na brúsnych doskách. Umožnilo to rezať kamene do nových tvarov s vyšším leskom. Nová technika, nazývaná fasetovanie, produkuje kameň s príjemným geometrickým tvarom a lepšími optickými vlastnosťami. Ako sa nový spôsob a kamene šíria po dvoroch a dielňach, dopyt po šperkoch a drahokamoch prudko narastá." # todo: CHANGED
 maritime_decay_advance_disc: "Zabehnuté trasy" # todo: NEW TRANSLATION
 maritime_decay_advance_disc_desc: "More je neustále preplnené obchodníkmi hľadajúcimi najlepší zisk. To prirodzene vedie k tomu, že niektoré trasy sa stanú pravidelnejšími a frekventovanejšími, pričom najpopulárnejšie vidia stálu premávku plavidiel." # todo: CHANGED
 rgo_logistics_discovery: "Miestne sklady" # todo: NEW TRANSLATION
 rgo_logistics_discovery_desc: "Ak kúpci a remeselníci budú mať prístup k výrobkom lokálne, uľahčí to ich prácu i udrží ceny na primeranej úrovni. Skladiská budú slúžiť ako lokálne distribučné uzly na zásobovanie potrebami." # todo: CHANGED
 port_cost_distance_from_capital_advance: "Skúsení kapitáni" # todo: NEW TRANSLATION
 port_cost_distance_from_capital_advance_desc: "Nie každý námorník je hoden byť kapitánom; len najskúsenejší a najzručnejší ich môžu viesť. Takí skúsení morskí vlci by mali byť schopní bezpečne nájsť cestu späť do prístavu aj v najdivokejšej búrke." # todo: CHANGED
 land_morale_attrition_cost_advance: "Výcvik pochodov" # todo: NEW TRANSLATION
 land_morale_attrition_cost_advance_desc: "Armády často musia kráčať veľké vzdialenosti, aby sa dostali k nepriateľovi. Dlhé pochody sú preto súčasťou vojenského výcviku, zvyknú vojakov na dlhé vzdialenosti a stále prísť sily pripravené do boja." # todo: CHANGED
 land_morale_movement_cost_advance_disc: "Koordinovaný pochod" # todo: NEW TRANSLATION
 land_morale_movement_cost_advance_disc_desc: "Pohybujúca sa armáda je zraniteľná a náchylná k dezorganizácii. Výcvik pochodovania v organizovanom a koordinovanom spôsobe zabezpečí, že vojaci si udržia bojové formácie aj pri útoku počas presunu." # todo: CHANGED
 trade_through_owned_disc_advance: "Obchodné stezky" # todo: NEW TRANSLATION
 trade_through_owned_disc_advance_desc: "Obchodníci sa zriedka zdržiavajú na mieste, vždy hľadajú najziskovejšie obchody. Ich stále presuny sú bežným javom a časom si vyšlapali vlastné cesty, ktoré skrátili cesty do cieľov." # todo: CHANGED
 hire_artist_cost_modifier_advance_disc: "Krajina kultúry" # todo: NEW TRANSLATION
 hire_artist_cost_modifier_advance_disc_desc: "Kultúra a umenie definujú identitu každej krajiny. Pýšne podporovaním kultúrnych úspechov zanecháme trvalý dojem na celý svet." # todo: CHANGED
 rural_rgo_disc_advance: "Rozvíjajúce sa osady" # todo: NEW TRANSLATION
 rural_rgo_disc_advance_desc: "Každé sídlo, nech je akokoľvek malé, bude prosperovať ak je zem úrodná a sú tam ľudia ochotní pracovať. Aj najmenšia dedina sa časom môže stať prosperujúcim a rušným miestom." # todo: CHANGED
 leader_recruit_cost_advance: "Vojenské akadémie" # todo: NEW TRANSLATION
 leader_recruit_cost_advance_desc: "Viesť vojská nie je jednoduchá úloha. Stratégia, taktika, mentálny prehľad — to sú len niektoré zručnosti, ktoré úspešný veliaci potrebuje. Zriadením dôstojníckych škôl zabezpečíme, že viac našich bojovníkov získa dobré vodcovské schopnosti a budeme mať širší výber skúsených veliteľov." # todo: CHANGED
 morale_recovery_rev_dip_choice: "Stanovený oddych" # todo: NEW TRANSLATION
 morale_recovery_rev_dip_choice_desc: "Žiadna armáda nemôže byť v neustálom stave akcie; všetci vojaci potrebujú čas na odpočinok a zotavenie. Zriadením smerníc a postupov pre ich oddych, bez dovolenia lenivosti, udržíme naše vojská v špičkovej kondícii." # todo: CHANGED
 merchant_power_from_maritime_rev_dip_choice: "Obchodné flotily" # todo: NEW TRANSLATION
 merchant_power_from_maritime_rev_dip_choice_desc: "Obchodné lode sa stali bežným javom v našich vodách. Naši obchodníci majú toľko plavidiel, že tvorí prakticky vlastnú flotilu." # todo: CHANGED
 administrative_leadership: "Administratívne vedenie" # todo: NEW TRANSLATION
 administrative_leadership_desc: "Vojenský vodca musí poznať nielen vojenské záležitosti. Logistika, správa zásob, finančné výdavky a podobné témy sú kritické pre úspešnú vojenskú kampaň." # todo: CHANGED
 cultures_capacity_mil_choice: "Multikultúrne ambície" # todo: NEW TRANSLATION
 cultures_capacity_mil_choice_desc: "Rozšírenie krajiny nevyhnutne privedie do ríše iné kultúry. Ak chceme pokračovať v expanzii, musíme byť pripravení stať sa viac multikultúrnymi." # todo: CHANGED
 rgo_logistics_mil_choice: "Zlepšené sklady" # todo: NEW TRANSLATION
 rgo_logistics_mil_choice_desc: "Správne skladové priestory sú nevyhnutné, ak chceme, aby miestne podniky — nieto ešte celá ekonomika — fungovali hladko." # todo: CHANGED
 land_morale_movement_cost_rev_choice_mil: "Neúprosný postup" # todo: NEW TRANSLATION
 land_morale_movement_cost_rev_choice_mil_desc: "Naše armády počas pochodu sú pýchou na pohľad. Ich výcvik a disciplína sa prejavujú pri jednote a vchádzajú do boja nezlomení dlhým pochodom." # todo: CHANGED
 port_cost_distance_from_capital_choice_mil: "Pobrežné hliadky" # todo: NEW TRANSLATION
 port_cost_distance_from_capital_choice_mil_desc: "Udržiavanie pravidelných hliadok pozdĺž všetkých našich pobreží zabezpečí, že administratívna autorita bude cítiť aj v najvzdialenejších regiónoch." # todo: CHANGED
 protected_harbor_advance: "$protected_harbor$" # todo: NEW TRANSLATION
 protected_harbor_advance_desc: "$protected_harbor_desc$" # todo: NEW TRANSLATION
 a_bedouin_cavalry_advance: "$a_bedouin_cavalry$" # todo: NEW TRANSLATION
 a_bedouin_cavalry_advance_desc: "$a_bedouin_cavalry_desc$" # todo: NEW TRANSLATION
 repair_at_sea_aod: "Profesionálne posádky" # todo: NEW TRANSLATION
 repair_at_sea_aod_desc: "Kým najnovšie pokroky v námornom remesle posúvajú hranice plavby, je potrebné, aby posádky na týchto lodiach vedeli plne využiť nové schopnosti. Len výcvik stálych profesionálnych námorníkov im umožní vykonať potrebné úkony na údržbu týchto moderných lodí." # todo: CHANGED
 repair_at_sea: "Opravy pri pobreží" # todo: NEW TRANSLATION
 repair_at_sea_desc: "Lode podnikajú dlhšie plavby než kedykoľvek predtým vďaka technickým pokrokom. To znamená náročnejšie opravy, no prístavy s primeraným vybavením a remeselníkmi nie sú vždy k dispozícii. Naši námorníci sa musia naučiť starať o lode metódou careening — zámerným vyťahovaním plavidla na breh, aby bolo možné vyčistiť a opraviť časti trupu. Toto je jediný spôsob, ako udržať našu flotilu plaviteľnú ďaleko od domovských prístavov." # todo: CHANGED
 repair_at_sea_aorev: "Parlamentný náklon" # todo: NEW TRANSLATION
 repair_at_sea_aorev_desc: "Táto pokročilá forma careeningu sa vykonáva v hlbokých pobrežných vodách. Ťažký náklad sa presunie na jeden bok plavidla, čo spôsobí jeho náklon a umožní posádke pristúpiť k opačnej strane trupu a opraviť ju bez potreby vyplávať na plytčinu a čakať na odliv." # todo: CHANGED
 blast_furnace: "Vysoká pec" # todo: NEW TRANSLATION
 blast_furnace_desc: "Nákladnejšia metóda než tradičná metalurgia, použitie vysokých pecí umožňuje ďalej rafinovať surové železo na liatinové tým, že sa znovu roztaví s rôznym pomerom železa, ocele, vápenca a uhlia. Liatina takto spracovaná na kujné železo vytvára vynikajúci materiál na výrobu zložitých výrobkov, ako sú delá." # todo: CHANGED
 saiger_process_discovery: "Vylepšený Saigerov proces" # todo: NEW TRANSLATION
 saiger_process_discovery_desc: "Zlepšené spracovanie a pracovné metódy umožnia prosperitu našich $silver$ a $lead$ baní." # todo: CHANGED
 slitting_mills: "Mlyny na rezanie tyčí" # todo: NEW TRANSLATION
 slitting_mills_desc: "Nový typ vodných mlynov vyvinutých na štiepanie tyčí $iron$ na prúty. Toto umožňuje efektívnejšiu výrobu $iron$ nástrojov a strojov, keďže odlievači môžu používať prúty vhodnejšie pre ich potreby, čím sa znižuje odpad pri kovaní." # todo: CHANGED
 coke_blast_furnace: "Vysoká pec na koks" # todo: NEW TRANSLATION
 coke_blast_furnace_desc: "Toto je nový typ vysokej pece, ktorá používa koks namiesto dreveného uhlia ako palivo. Je lacnejšia a umožňuje stavbu väčších pecí, hoci koks má nevýhodu v menšej čistote než drevené uhlie, čo je problém, ktorý ešte treba vyriešiť." # todo: CHANGED
 hot_blast_furnace: "Pec s predhriatym vzduchom" # todo: NEW TRANSLATION
 hot_blast_furnace_desc: "Problémy vyvolané koksovými pecami, najmä množstvo nečistôt v konečnej liatine, viedli k vývoju teplovzdušného fúkania. To výrazne znižuje spotrebu koksu, zlepšuje kvalitu $iron$ a umožňuje používanie surového minerálneho uhlia ako paliva, ak je k dispozícii — veľký krok vpred v metalurgii železa." # todo: CHANGED
 new_currency_demands: "Nové požiadavky na meny" # todo: NEW TRANSLATION
 new_currency_demands_desc: "Objav nových krajín tiež zvýšil tok obchodu. To viedlo k nárastu dopytu po minciach; hoci drahé kovové meny z $goods_gold$ a $silver$ zostávajú hlavnou hodnotou, aj menej ušľachtilé kovy ako $copper$ a ich zliatiny nachádzajú širšie použitie a obežnosť." # todo: CHANGED
 powerful_statues: "Impozantné sochy" # todo: NEW TRANSLATION
 powerful_statues_desc: "Prosperujúca krajina je pravým znakom silného vládcu, ale ľudia uveria v silu vládcu len ak sú takto zobrazení. Preto mnoho panovníkov zadáva sochy seba samých, často z kameňa alebo bronzu, aby vystavilo obraz sily a moci každému, kto na ne hľadí. Tieto prejavy ega však nie sú vždy účinné a niekedy vedú len k veľkému presunu materiálov." # todo: CHANGED
 renaissance_sculptures: "$renaissance$ sochy" # todo: NEW TRANSLATION
 renaissance_sculptures_desc: " $renaissance$ priniesla väčší záujem o umenie vo všetkých formách. Zdá sa, že dnes nie je nikto niekým, ak nemá v domácnosti umelecký kus! Sochy sú jednou z najrozšírenejších foriem umeleckého prejavu, čo viedlo k nárastu ťažby kameňa, pretože dopyt po $stone$ medzi umelecky založenými občanmi pozoruhodne vzrástol." # todo: CHANGED
 green_vitriol: "Zelený vitriol" # todo: NEW TRANSLATION
 green_vitriol_desc: "Hoci nie je technicky totožný s $alum$, $green_vitriol$ sa v alchymistických písomnostiach tradične zamieňa s ním a obe tieto látky majú podobné vlastnosti. Preto nie je nezvyčajné použiť jedno ako náhradu za druhé." # todo: CHANGED
 shared_products_procedures: "Zdieľané produkty a postupy" # todo: NEW TRANSLATION
 shared_products_procedures_desc: "Svet sa zmenšil a stretli sme mnoho nových ľudí a neobjaveného územia. Spolu s týmito objavmi prišli nové produkty a spôsoby ich využitia. Aj tie najšpecializovanejšie tovary, ako $alum$, sa dajú v iných krajinách použiť inak." # todo: CHANGED
 ostentatious_clothing: "Okázalé odevy" # todo: NEW TRANSLATION
 ostentatious_clothing_desc: "Je právom a povinnosťou vládnucich vrstiev prezentovať moc prostredníctvom obliekania. Preto nosia čoraz pestrejšie oblečenie a využívajú najnovšie techniky na výrobu sýtych a luxusných farieb a vzorov." # todo: CHANGED
 riches_of_foreign_coasts: "Bohatstvo cudzích pobreží" # todo: NEW TRANSLATION
 riches_of_foreign_coasts_desc: "Vzdialené krajiny nám priniesli mnoho zdrojov, ale nie sú to len krajiny samotné, ktoré sú bohaté. Pobrežia a more sú tiež hojnaté a vedomosti získané od cudzích lovcov perál umožňujú našim ponáľačom dosahovať lepšie úlovky." # todo: CHANGED
 foreign_mining_techniques: "Zahraničné banské techniky" # todo: NEW TRANSLATION
 foreign_mining_techniques_desc: "Drahé kamene sú ľudstvu cenné tisícročia. Kontaktním s cudzími ľuďmi z ďalekých krajín sa môžeme naučiť nielen, ktoré $gems$ si cenia najviac, ale aj techniky, ktorými ich získavajú." # todo: CHANGED
 windmills_advance: "$windmill$" # todo: NEW TRANSLATION
 windmills_advance_desc: "$windmill_desc$" # todo: NEW TRANSLATION
 local_smelters_advance: "$local_smelters$" # todo: NEW TRANSLATION
 local_smelters_advance_desc: "$local_smelters_desc$" # todo: NEW TRANSLATION
 corps_organisation: "Duch jednotky" # todo: NEW TRANSLATION
 corps_organisation_desc: "Tradičné armády sa spoliehali na prísnu disciplínu na udržanie poriadku v radoch. Apelovaním na hrdosť jednotiek však môžeme dosiahnuť ešte vyššie úrovne disciplíny." # todo: CHANGED
 open_sea_exploration: "Prieskum zámoria" # todo: CHANGED
 open_sea_exploration_desc: "Rozsiahle moria nám sľubujú veľké bohatstvo a nové možnosti obchodovania na vzdialených brehoch." # todo: CHANGED
 napoleonic_warfare: "Napoleonské taktiky" # todo: NEW TRANSLATION
 napoleonic_warfare_desc: "Oblehania sú nákladnou a časovo náročnou záležitosťou. Namiesto zamerania sa na každé opevnenie musíme svoju taktiku sústrediť na dosiahnutie rozhodujúcej rany, ktorá vyhrá vojnu." # todo: CHANGED
 march_to_the_sound_of_the_guns_advance: "$march_to_sound_of_guns$" # todo: NEW TRANSLATION
 march_to_the_sound_of_the_guns_advance_desc: "So stabilným rastom armády sa zmenili aj naše logistické potreby. Naši generáli osvojili doktrínu 'pochodovať ku zvuku zbraní' — prikazujúc rozptýleným silám nezávisle sa presúvať k boju, keď počujú streľbu. To umožňuje rýchle posilnenie bez potreby čakať na rozkazy." # todo: CHANGED
 country_unification_advance: "Dohľad nad vazalmi" # todo: NEW TRANSLATION
 country_unification_advance_desc: "Čím skôr začneme integrovať administráciu našich podriadených podľa pravidiel našej vlasti, tým ľahší bude integrácia ostatných záležitostí. Vytvorenie trvalej spojky s našimi podriadenými tento proces výrazne uľahčí." # todo: CHANGED
 renaissance_urbanisation: "$renaissance$ Mestské plánovanie" # todo: CHANGED
 renaissance_urbanisation_desc: "Zahrnutie vyhradených oblastí pre využívanie zdrojov už pri plánovaní umožní našim mestám produkovať viac tovaru než predtým." # todo: CHANGED
 renaissance_city_rights: "Formálne mestské práva" # todo: NEW TRANSLATION
 renaissance_city_rights_desc: "Zriadením, že len náš vládca môže udeľovať mestské práva, centralizujeme kontrolu nad mestským rozvojom a dáme našej administratíve jasný prehľad o stave krajiny." # todo: CHANGED
 absolutism_control_decline_advance: "Absolutistická správa" # todo: NEW TRANSLATION
 absolutism_control_decline_advance_desc: "Absolutistickí panovníci demonštrujú svoju moc nielen na dvore, ale aj prostredníctvom administratívneho aparátu, ktorý sa môže rozťahovať po celej krajine." # todo: CHANGED
 construction_speed_renaissance: "Cech murárov" # todo: NEW TRANSLATION
 construction_speed_renaissance_desc: "Murári sa spoliehajú na širšie združenia, známe ako cechy, aby si vymieňali a uchovávali vedomosti, kde skúsení majstri vyučujú mladších učňov." # todo: CHANGED
 construction_speed_discovery: "Štandardizované dosky a tehly" # todo: NEW TRANSLATION
 construction_speed_discovery_desc: "Štandardizácia výroby dosiek a tehál použitím modernejších techník cieli na uľahčenie stavieb." # todo: CHANGED
 construction_speed_reformation: "Architektonické traktáty" # todo: NEW TRANSLATION
 construction_speed_reformation_desc: "Písanie architektonických traktátov, ktoré často zhromažďujú storočia poznania, umožňuje rýchlejšie učenie a šírenie efektívnych stavebných techník." # todo: CHANGED
 construction_speed_absolutism: "Architektonické inžinierstvo" # todo: NEW TRANSLATION
 construction_speed_absolutism_desc: "Výstavba budov sa časom stala sofistikovanejšou, zahŕňajúc metódy a techniky z rôznych disciplín, všeobecne považované za typ inžinierstva." # todo: NEW TRANSLATION
 construction_speed_revolutions: "Liatinové konštrukcie" # todo: NEW TRANSLATION
 construction_speed_revolutions_desc: "Vývoj pokročilejšej metalurgie kujného a liateho železa umožňuje komplikovanejšie kovové konštrukcie, ako sú stĺpy a piliere, čo urýchľuje stavebnú činnosť." # todo: NEW TRANSLATION
 apothecary_advance: "$apothecary$" # todo: NEW TRANSLATION
 apothecary_advance_desc: "$apothecary_desc$" # todo: NEW TRANSLATION
 unlock_handgonners_advance: "$a_handgonners$" # todo: NEW TRANSLATION
 unlock_handgonners_advance_desc: "$a_handgonners_desc$" # todo: NEW TRANSLATION
 manufactories_advance: "Manufaktúry" # todo: NEW TRANSLATION
 manufactories_advance_desc: "Nedávne technologické pokroky v mechanizácii uľahčili vznik koncentrovaných výrobných zariadení v podobe manufaktúr. Tieto podniky výrazne zvýšili mieru a kvalitu produkcie." # todo: CHANGED
 scientific_revolution_advance: "Vedecká revolúcia" # todo: NEW TRANSLATION
 scientific_revolution_advance_desc: "Nedávny vývoj v matematike, fyzike, astronómii, biológii a chémii nielen spochybnil, ale úplne zmenil náš pohľad na svet. Spoločnosť postupuje rýchlejšie než kedykoľvek a denno-denne vznikajú nové vedecké objavy." # todo: CHANGED
 military_revolution_advance: "Vojenská revolúcia" # todo: NEW TRANSLATION
 military_revolution_advance_desc: "Vojna sa nemení, ale spôsob jej vedenia áno. Nedávny vývoj zbraní ukázal, že staré spôsoby boja sú zastarané a armády prešli paradigmatickou zmenou. Prispôsobiť sa týmto zmenám je jediný spôsob zostať silnou vojenskou mocou." # todo: CHANGED
 power_projection_advance_5: "Absolutistické ambície" # todo: NEW TRANSLATION
 power_projection_advance_5_desc: "Ako sa moc štátu centralizuje, vládcovia po celom svete začínajú túžiť byť absolútnymi suverénmi nad svojím územím. Ako slnko osvetľujúce svet, usilujú sa byť jediným zdrojom autority, ich vôľa sa rozprestiera nevyzvážene po každom kúte domény." # todo: CHANGED
 absolutist_court: "Absolutistický dvor" # todo: NEW TRANSLATION
 absolutist_court_desc: "Autorita sa čoraz viac sústreďuje v osobe vládcu. Dvorní a úradníci teraz slúžia ako predĺženie kráľovskej vôle, nie ako autonómni aktéri. Toto zhustenie moci umožňuje vládcom rýchlejšie a efektívnejšie presadzovať svoje želania." # todo: CHANGED
 government_size_absolutism: "Oddaní podriadení" # todo: NEW TRANSLATION
 government_size_absolutism_desc: "Koncentrácia moci do rúk vládcu mu umožňuje konať priamo, ale stále potrebuje podriadených, ktorí pomáhajú tieto kroky uskutočňovať. Dane podriadeným bez skutočnej moci, no absolútne lojálnym vládcu, umožňujú $crown_estate$ zamestnávať ich viac bez strachu z vnútorných sporov." # todo: CHANGED
 naval_doctrines_advance: "Námorné doktríny" # todo: NEW TRANSLATION
 naval_doctrines_advance_desc: "Námorné bojovanie v posledných rokoch prešlo mnohými zmenami; lode aj flotily sa zväčšili a stali sa špecializovanejšími. V dôsledku toho rôzne krajiny začínajú používať taktiky a doktríny prispôsobené svojim silným stránkam a spôsobu nasadenia floty." # todo: CHANGED
 global_supply_limit_modifier_advance_5: "Plánovanie armádnej logistiky" # todo: NEW TRANSLATION
 global_supply_limit_modifier_advance_5_desc: "Ako ďaleko sa armáda dokáže presunúť, je dôsledok jej logistiky. S primeraným štúdiom a plánovaním dokážu armády vydržať dlhšie a vzdialenejšie kampane." # todo: CHANGED
 rgo_size_advance_absolutism: "Fyziokracia" # todo: NEW TRANSLATION
 rgo_size_advance_absolutism_desc: "Nedávny vývoj ekonomického myslenia presunul zameranie od merkantilistických predstáv, že hodnota spočíva v obchode, k názoru, že hodnota spočíva v produkčnom procese. Výsledkom je stabilný rast produkcie." # todo: CHANGED
 food_advance_absolutism: "Uzavreté polia" # todo: NEW TRANSLATION
 food_advance_absolutism_desc: "Doteraz bolo vlastníctvo a využívanie pôdy relatívne bežné a voľné. Avšak nastáva tendencia presnejšie vyčleniť polia a určovať ich hranice výlučne pre poľnohospodárske využitie. Takto špecifikované využívanie môže výrazne zvýšiť ich produkciu." # todo: CHANGED
 naval_morale_advance_5: "Trvalé flotily" # todo: NEW TRANSLATION
 naval_morale_advance_5_desc: "Globálna expanzia obchodu a komerčných záujmov si vyžaduje stály námorný stav na ochranu národných záujmov. Udržiavanie stálej, nepretržitej flotily umožní lodiam lepšie operovať ako eskadra." # todo: CHANGED
 new_world_advance: "Nový svet" # todo: NEW TRANSLATION
 new_world_advance_desc: "Ako hovorí navigátor Amerigo Vespucci z $FLO_ADJ$, krajiny objavené Kolumbom nie sú Indiou, ale v skutočnosti celý Nový svet neznámy našim prastarým autorom, pripravený na zmapovanie a nárokovanie." # todo: CHANGED
 colonial_charters: "Koloniálne listiny" # todo: NEW TRANSLATION
 colonial_charter_progress_tt_title: "Pokrok koloniálnych listín" # todo: NEW TRANSLATION
 colonial_charters_desc: "Tieto nové dokumenty zabezpečia práva našich krajanov pri osídľovaní divokého Nového sveta. Udeľujú našim kolóniám výlučné právo spravovať tieto novinky a regulujú ich vzťah s materskou krajinou." # todo: CHANGED
 plantation_buildings_advance: "Plantáže" # todo: NEW TRANSLATION
 plantation_buildings_advance_desc: "Mierne podnebie a úrodné pôdy Nového sveta robia kolónie ideálnym miestom pre produkciu veľmi ziskových plodín ako $sugar$ a $tobacco$." # todo: CHANGED
 diplomatic_range_age_1: "Zahraniční vyslanci" # todo: NEW TRANSLATION
 diplomatic_range_age_1_desc: "Diplomacia medzi štátmi bola vždy dôležitá. Avšak umenie diplomatického manévrovania rastie na intenzite a zložitosť, a je bežné posielať našich vyslancov ďalej než inokedy, aby rozšírili zahraničné vzťahy." # todo: CHANGED
 diplomatic_range_age_2: "Diplomatická sieť" # todo: NEW TRANSLATION
 diplomatic_range_age_2_desc: "Udržiavanie etablovanej siete zručných diplomatov nám umožňuje posielať zástupcov do ešte vzdialenejších krajín." # todo: CHANGED
 diplomatic_range_age_3: "Veľvyslanectvá" # todo: NEW TRANSLATION
 diplomatic_range_age_3_desc: "Súčasná medzinárodná situácia si vyžaduje, aby sme zriadili trvalé úrady pre našich diplomatov v susedných krajinách. Je to jediný spôsob, ako zabezpečiť, aby boli naše záujmy chránené v regióne, zatiaľ čo rozvíjame dosah ďalej." # todo: CHANGED
 trade_envoys: "Obchodní vyslanci" # todo: NEW TRANSLATION
 trade_envoys_desc: "S nedávnym nárastom obchodu od a do vzdialených krajín sa naši vyslanci začali pripájať k obchodným expedíciám, aby nadviazali diplomatické kontakty s krajinami, ktoré boli predtým mimo dosahu." # todo: CHANGED
 diplomatic_range_age_5: "Diplomatické misie" # todo: NEW TRANSLATION
 diplomatic_range_age_5_desc: "Komplexnosť modernej politiky už nemôže zvládnuť jeden vyslanec. Aby sme rozšírili vplyv ešte ďalej a chránili záujmy v diaľavách, pošleme do každej krajiny zručný tím expertov diplomatov." # todo: CHANGED
 diplomatic_range_age_6: "Globálne veľvyslanectvá" # todo: NEW TRANSLATION
 diplomatic_range_age_6_desc: "Keď sa každá krajina snaží rozšíriť svoj dosah, svet je prepojený viac než kedykoľvek predtým. Len zriadenie trvalých veľvyslanectiev po celom svete môže túto prepojenosť udržať." # todo: CHANGED
 new_world_crops: "Plodiny Nového sveta" # todo: NEW TRANSLATION
 new_world_crops_desc: "Úrody Nového sveta nám priniesli mnoho pokladov. Jedným z dôležitých objavov sú zvláštne exotické rastliny pestované ako potraviny a koreniny domorodcami týchto krajín. Pestovanie týchto plodín na našich poliach poskytne obyvateľstvu rozmanitosť a novinky v strave." # todo: CHANGED
 rgo_size_advance_discovery: "Pokročilé techniky ťažby" # todo: NEW TRANSLATION
 rgo_size_advance_discovery_desc: "Objav nových minerálov a vynález nových nástrojov priniesol efektívnejšie získavanie zdrojov a zrýchlenie výroby." # todo: CHANGED
 printing_press_advance: "Tlačiarenský lis" # todo: NEW TRANSLATION
 printing_press_advance_desc: "Popularizácia tlače v tomto storočí viedla k širšiemu šíreniu poznania a jednoduchšiemu výmene informácií, zrýchľujúc kopírovanie dôležitých rukopisov." # todo: CHANGED
 gov_reform_discovery_a: "Rané administratívne reformy" # todo: NEW TRANSLATION
 gov_reform_discovery_a_desc: "Náš ľud stojí na prahu novej éry. Aby sme využili vnútorné kapacity, musíme prispôsobiť vládu a rafinovať našu administratívnu doménu." # todo: CHANGED
 government_size_discovery: "Počiatočná administratívna kapacita" # todo: NEW TRANSLATION
 government_size_discovery_desc: "Náš domén sa skladá z mnohých administratívnych sektorov a keď ho rozširujeme, musíme prispôsobiť našu vládu, aby zodpovedala tomuto rastu." # todo: CHANGED
 power_projection_advance_4: "Dominujúci zahraničný vplyv" # todo: NEW TRANSLATION
 power_projection_advance_4_desc: "Naša prítomnosť pri diplomatických stoloch vždy vyžaruje vznešenosť a prestíž. Náš hlas a vplyv budú rezonovať u všetkých, s ktorými sa stretávame." # todo: CHANGED
 regulate_court_procedures: "Regulovať dvorné postupy" # todo: NEW TRANSLATION
 regulate_court_procedures_desc: "Aplikovaním prísneho režimu a rutiny do našich operácií znížime zbytočné výdavky a povedieme šetrný a efektívny dvor." # todo: CHANGED
 pike_and_shot_advance: "Píky a palné zbrane" # todo: NEW TRANSLATION
 pike_and_shot_advance_desc: "Na bojisku sa objavil nový typ vojny: Pikéri tvoria obranný štvorec, zatiaľ čo arkebúziéri sa roztvárajú po stranách a vpredu a ustupujú za alebo do štvorca pri vstupe do blízkeho boja." # todo: CHANGED
 lazaretto_advance: "$lazaretto$" # todo: NEW TRANSLATION
 lazaretto_advance_desc: "$lazaretto_desc$" # todo: NEW TRANSLATION
 pest_house_advance: "$pest_house$" # todo: NEW TRANSLATION
 pest_house_advance_desc: "$pest_house_desc$" # todo: NEW TRANSLATION
 naval_morale_advance_2: "Navigačné techniky" # todo: NEW TRANSLATION
 naval_morale_advance_2_desc: "Naši námorníci si zvykajú na dlhšie cesty, používajúc nový súbor techník a prístrojov, ako suché kompasy, aby zlepšili navigáciu." # todo: CHANGED
 confessionalism_advance: "Konfesionalizmus" # todo: NEW TRANSLATION
 confessionalism_advance_desc: "Existuje množstvo rozličných interpretácií viery a preto sa zvyšuje záujem náboženských a svetských autorít jasne definovať postupy svojich vyznaní a presadzovať svoje pravidlá vo všetkých aspektoch viery a života." # todo: CHANGED
 global_trade_advance: "Globálny obchod" # todo: NEW TRANSLATION
 global_trade_advance_desc: "Tovar sa pohyboval po kontinente už od antiky, ale obchod sa teraz čoraz viac stáva súčasťou väčšej svetovej siete. Možno je ešte skoro hovoriť o skutočne globálnej ekonomike, ale určite prvé semienka sú zasadené." # todo: CHANGED
 artillery_institution_advance: "Obliehacie delá" # todo: NEW TRANSLATION
 artillery_institution_advance_desc: "Vynález prachu v Sòng $CHI$ viedol k vývoju nového zariadenia, ktoré využíva jeho palebnú silu v boji: delostrelectvo. Tieto zbrane ohrozujú kamenné hrady a iné opevnenia." # todo: CHANGED
 gov_reform_reformation_a: "Kníže" # todo: NEW TRANSLATION
 gov_reform_reformation_a_desc: "Súčasné udalosti ukazujú, že vládcovia musia pristupovať k správe štátu systematickejšie, pričom zohľadnia rôzne stavy v krajine a rozličných diplomatických aktérov, ktorí ich obklopujú." # todo: CHANGED
 power_projection_advance_3: "Regionálne ambície" # todo: NEW TRANSLATION
 power_projection_advance_3_desc: "Schopnosť projekcie moci za hranice je kľúčová pre udržanie relevancie na regionálnej scéne. Študovaním stratégií veľmocí minulosti a prítomnosti môžeme zvýšiť prestíž našej krajiny všade a využiť ju na uplatnenie vplyvu." # todo: CHANGED
 confessional_court: "Konfesionálny dvor" # todo: NEW TRANSLATION
 confessional_court_desc: "Výdavky na dvor môžu ľahko zadlžiť aj najbohatšiu krajinu. Aby sme dosiahli rovnováhu medzi luxusom a rozumnými nákladmi, môžeme prijať malé opatrenia na zníženie výdavkov bez straty pompéznosti nášho dvora." # todo: CHANGED
 rgo_size_advance_reformation: "Pradacie kolesá" # todo: NEW TRANSLATION
 rgo_size_advance_reformation_desc: "Ako sa učíme nové a lepšie metódy ťažby zdrojov, naša produkcia prudko vzrastie a obohatí nás!" # todo: CHANGED
 food_advance_reformation: "Trhové poľnohospodárstvo" # todo: NEW TRANSLATION
 food_advance_reformation_desc: "Nové a vylepšené plodiny môžu byť zavedené na zvýšenie poľnohospodárskej produktivity. Či už selekciou existujúcich odrôd alebo dovezením kvalitnejších zahraničných kultivarov, môžeme výrazne zvýšiť produkciu potravín." # todo: CHANGED
 scientific_experimentation: "Vedecké experimentovanie" # todo: NEW TRANSLATION
 scientific_experimentation_desc: "Všetko sa deje z nejakého dôvodu. Pochopením príčin môžeme predvídať, čo očakávať pri podobných situáciách." # todo: CHANGED
 banking_advance: "Bankovníctvo" # todo: NEW TRANSLATION
 banking_advance_desc: "Požičiavanie peňazí je staré ako čas, ale nie je bez rizika. Inštitucionalizovaním týchto praktík môžeme minimalizovať riziká a zabezpečiť, aby sa peniaze požičiavali pod kontrolovanými a spravodlivými podmienkami." # todo: CHANGED
 trade_companies_advance: "Obchodné spoločnosti" # todo: NEW TRANSLATION
 trade_companies_advance_desc: "Je jasné, že peniaze roztočia svet. S neustálym objavovaním žiadaných produktov v diaľavách sú obchodné spoločnosti špecializované na ich distribúciu pripravené získať obrovské zisky." # todo: CHANGED
 naval_morale_advance_3: "Zámorské expedície" # todo: NEW TRANSLATION
 naval_morale_advance_3_desc: "Nedávny nárast dlhodobého zámořského obchodu privykol našich námorníkov byť dlho na mori, čím sú odolnejší voči nepriazni dlhých plavieb." # todo: CHANGED
 road_advance_1: "Sieť ciest" # todo: NEW TRANSLATION
 road_advance_1_desc: "Dôležitosť obchodu rastie a s ňou potreba komplexnejších cestných sietí na uľahčenie pohybu ľudí a tovarov." # todo: CHANGED
 power_projection_advance_2: "Nadnárodné ambície" # todo: NEW TRANSLATION
 power_projection_advance_2_desc: "Hoci staré predstavy o budovaní impérií ešte pretrvávajú v mysliach vládnucich, začali sa formovať nové spôsoby, ako si uplatniť dominanciu nad inými štátmi a národmi." # todo: CHANGED
 renaissance_advance: "Renesancia" # todo: NEW TRANSLATION
 renaissance_advance_desc: "Vlny inovatívneho myslenia a objavov, ktoré prenikajú našu oblasť, musíme využiť, aby sme zostali na čele technologického pokroku." # todo: CHANGED
 professional_armies_advance: "Profesionálne armády" # todo: NEW TRANSLATION
 professional_armies_advance_desc: "Modernizácia armád závisí na udržiavaní náborových a organizačných centier. Musíme sa usilovať o zachovanie jasnej a robustnej vojenskej organizácie, znížiť plytvanie a redundanciu." # todo: CHANGED
 gunpowder_advance: "Strelný prach" # todo: NEW TRANSLATION
 gunpowder_advance_desc: "Použitie strelného prachu na bojisku určite pozitívne ovplyvní naše výkony a umožní nám vynikať v ozbrojených stretiach." # todo: NEW TRANSLATION
 drill_army_advance: "Cvičená armáda" # todo: NEW TRANSLATION
 drill_army_advance_desc: "Už sa nebudeme spoliehať na nevycvicených verbovaných mužov. Ak chceme brániť hranice a poraziť rivalov, musíme viesť pravidelné a organizované cvičenia." # todo: CHANGED
 renaissance_development: "Učené traktáty" # todo: NEW TRANSLATION
 renaissance_development_desc: "Táto éra myslenia, umenia a vedy prinesie nové vlny objavov a vynálezov, čo nám umožní optimalizovať prijímanie cudzích inštitúcií." # todo: CHANGED
 art_school_advance: "Umelecké školy" # todo: NEW TRANSLATION
 art_school_advance_desc: "Odporovanie estetickému remeslu a kultivácia umelcov musia byť náležite podporované zriadením umeleckých škôl. Každá škola bude líhňou pre talentovaných jednotlivcov, ktorí začnú umelecké kariéry a prinesú slávu národu!" # todo: CHANGED
 pound_lock_canals_advance: "Kanály s plavebnými komorami" # todo: NEW TRANSLATION
 pound_lock_canals_advance_desc: "Vyhlbili sme sa do tváre Zeme, aby sme získali prístup k potrave, bohatstvu a lepšej cirkulácii tovaru. Vynález špeciálnych brán, nazývaných 'Mitre Gates', nám pomôže zabezpečiť nevyhnutnosti, aby národ rástol a prosperoval." # todo: CHANGED
 a_renaissance_janissaries_advance: "$a_renaissance_janissaries$" # todo: NEW TRANSLATION
 a_renaissance_janissaries_advance_desc: "$a_renaissance_janissaries_desc$" # todo: NEW TRANSLATION
 a_discovery_janissaries_advance: "$a_discovery_janissaries$" # todo: NEW TRANSLATION
 a_discovery_janissaries_advance_desc: "$a_discovery_janissaries_desc$" # todo: NEW TRANSLATION
 a_reformation_janissaries_advance: "$a_reformation_janissaries$" # todo: NEW TRANSLATION
 a_reformation_janissaries_advance_desc: "$a_reformation_janissaries_desc$" # todo: NEW TRANSLATION
 a_absolutism_janissaries_advance: "$a_absolutism_janissaries$" # todo: NEW TRANSLATION
 a_absolutism_janissaries_advance_desc: "$a_absolutism_janissaries_desc$" # todo: NEW TRANSLATION
 a_revolutions_janissaries_advance: "$a_revolutions_janissaries$" # todo: NEW TRANSLATION
 a_revolutions_janissaries_advance_desc: "$a_revolutions_janissaries_desc$" # todo: NEW TRANSLATION
 nomadic_legacy: "Nomádsky odkaz" # todo: NEW TRANSLATION
 nomadic_legacy_desc: "Náš ľud sa rodí v sedle, slobodný putovať svetom bez potreby zakladať trvalé sídla." # todo: CHANGED
 siberian_frontier: "Sibírska hranica" # todo: NEW TRANSLATION
 siberian_frontier_desc: "Ďaleké pustatiny Sibíri nás volajú. Musíme vyčistiť cestu k jej zamrznutému srdcu a pustiť našich kozákov, aby pre $RUS_ADJ$ ľud uchvátili územie." # todo: CHANGED
 ostrog_advance: "$ostrog$" # todo: NEW TRANSLATION
 ostrog_advance_desc: "$ostrog_desc$" # todo: NEW TRANSLATION
 janissaries_advance: "Janičiari"
 janissaries_advance_desc: "Janičári sú elitné jednotky v našich armádach, vychovávané od detstva a formované prísnou disciplínou." # todo: CHANGED
 slave_raiding_wars: "Nájazdy za otrokmi" # todo: NEW TRANSLATION
 slave_raiding_wars_desc: "Otroci sú základom našej ekonomiky. Útok a lúpež susedov za účelom zajatia obyvateľstva a otročenia je preto životnou krvou našej krajiny." # todo: CHANGED
 trade_caravans: "Obchodné karavány" # todo: NEW TRANSLATION
 trade_caravans_desc: "Výnosné obchodné trasy prechádzajú našimi územiami už od staroveku. Naši ľudia sú zvyknutí na dlhé karavány obchodníkov s tovarom z ďalekých krajín." # todo: CHANGED
 the_sahel_trade: "$sahel_region$ obchod" # todo: CHANGED
 the_sahel_trade_desc: "Karavány obchodujú medzi $sahel_region$ a Stredozemím už stáročia; výhody tohto obchodu výrazne prevyšujú nebezpečenstvo prekračovania horúcich pieskov Sahary." # todo: CHANGED
 rudimentary_coastal_ship_repair: "Provizórne opravy" # todo: NEW TRANSLATION
 rudimentary_coastal_ship_repair_desc: "Je nevyhnutné, že lode sa opotrebúvajú pri plavbe. Náraz vĺn a slaná voda časom poškodzujú trup a laná bez ohľadu na kvalitu stavby. Na zlepšenie stavu sa námorníci naučili vykonávať bežnú údržbu a pri vážnejšom poškodení udržať loď nad vodou až do dosiahnutia bezpečného prístavu." # todo: CHANGED
 religious_icon_power_advance: "Náboženské ikony" # todo: NEW TRANSLATION
 religious_icon_power_advance_desc: "Ikony sú fyzickým zobrazením našej viery, posvätnými predstavami svätých postáv určenými na vzbudenie úžasu a oddanosti u tých, ktorí ich kontemplujú." # todo: NEW TRANSLATION
 scientific_mapping_advance: "Kartografické mapovanie" # todo: NEW TRANSLATION
 scientific_mapping_advance_desc: "Nedávne zlepšenia v geografii a kartografii umožnili presnejšie zobrazenia pevnín a prírodných útvarov, čo sa týka ich relatívnych veľkostí aj presných polôh." # todo: CHANGED
 integrate_area_advance: "Lepšia integrácia" # todo: NEW TRANSLATION
 integrate_area_advance_desc: "Naša administratíva sa zlepšuje, a preto si môžeme dovoliť integráciu väčších úsekov krajiny naraz." # todo: CHANGED
 maritime_advance_age_2: "Obchodné flotily" # todo: NEW TRANSLATION
 maritime_advance_age_2_desc: "S rastúcim obchodom rastie potreba rýchlejšie a efektívnejšie prepravovať väčšie množstvá tovaru. Preto tí, ktorí investujú do námorného obchodu, nešetria nákladmi a budujú väčšie flotily, aké si môžu dovoliť." # todo: CHANGED
 maritime_advance_age_3: "Prieskumné flotily" # todo: NEW TRANSLATION
 maritime_advance_age_3_desc: "Ako sa naše poznanie sveta rozširuje, rastie potreba naučiť sa ešte viac o ňom. Od vzdialených morí na východe po nové pobrežia na západe, dĺžka plavieb sa predĺžila a s ňou aj potreba väčšej flotily." # todo: CHANGED
 maritime_advance_age_4: "Globálne flotily" # todo: NEW TRANSLATION
 maritime_advance_age_4_desc: "S pokrokmi posledného storočia sa zdá, že svet sa zmenšil. Krajiny, ktoré doteraz nemali kontakt, teraz navzájom udržiavajú stálu diplomatickú a obchodnú výmenu. Výsledkom je potreba väčších a lepších flotíl na udržanie týchto zámorských spojení." # todo: CHANGED
 maritime_advance_age_5: "Konvoje" # todo: NEW TRANSLATION
 maritime_advance_age_5_desc: "S rozšírením námorného obchodu a častejším prepravovaním tovarov na dlhšie vzdialenosti narastá potreba udržiavať stabilný tok komerčných plavidiel. Organizovanie obchodných konvojov umožní stabilnejšiu cirkuláciu lodí." # todo: CHANGED
 maritime_advance_age_6: "Ozbrojené konvoje" # todo: NEW TRANSLATION
 maritime_advance_age_6_desc: "Obchodné konvoje sú samozrejme lákavým cieľom pre pirátov. Lode naplnené tovarom a mincami sú korisťou, ktorú málokto nechá prejsť. Preto je životne dôležité vybaviť tieto konvoje obranným arzenálom, ktorý odradí útoky. Doprovod obchodných flotíl frégatami alebo inými ozbrojenými plavidlami zabezpečí ich bezpečnosť." # todo: NEW TRANSLATION
 coastal_trade_routes_advance: "Rozšírenie pobrežného obchodu" # todo: NEW TRANSLATION
 coastal_trade_routes_advance_desc: "Najbezpečnejší spôsob plavby je pozdĺž pobrežia. Pokiaľ nie je nutné prekročiť otvorené more, nie je dôvod odplávať od ochranného pobrežia, pri čom plavba po mori je stále rýchlejšia než cestovanie po súši. Preto udržiavanie konštantného toku lodí pozdĺž našich pobreží uľahčí cirkuláciu tovaru a ľudí." # todo: CHANGED
 exploration_maintenance_advance: "Pevná konštrukcia" # todo: NEW TRANSLATION
 exploration_maintenance_advance_desc: "Kľúčovým faktorom pri stavbe lode je jej schopnosť odolávať nepriaznivému počasiu a neustálemu nárazu vĺn. Rozvoj odolnejších metód stavby zaručí, že naše plavidlá budú môcť plávať dlhšie." # todo: CHANGED
 global_trade_routes_advance: "Zámorské obchodné trasy" # todo: NEW TRANSLATION
 global_trade_routes_advance_desc: "Svet sa zväčšil vďaka mnohým objavom, ale súčasne sa zmenšil s rozšírením medzinárodných obchodných trás. Lode neustále prevážajú tovar a ľudí na a z vzdialených brehov, čo tieto vzdialené miesta zrazu robí bližšími." # todo: CHANGED
 safe_exploration_techniques_advance: "Lekcie prieskumu" # todo: CHANGED
 safe_exploration_techniques_advance_desc: "Vydávať sa do neznáma je vždy desivé, ale dnes už málo miest zostáva skutočne neobjavených. Mnohé miesta ešte nie sú úplne prebádané, ale sú nám známe a máme vedomosti a skúsenosti na ich dosiahnutie. Vďaka poznatkom našich prieskumníkov sa môžeme sebavedomo pustiť do neprebádaného územia." # todo: CHANGED
 imperial_ambitions: "Imperiálne ambície" # todo: NEW TRANSLATION
 imperial_ambitions_desc: "Veľké impériá minulosti sú inšpiráciou pre umelcov a básnikov, stále spomínané s úctou. Ak chceme vyvolať podobný obdiv pre našu krajinu, mali by sme si za cieľ vziať rovnakú veľkoleposť." # todo: CHANGED
 letters_of_marque: "Povolenia na korzárstvo" # todo: NEW TRANSLATION
 letters_of_marque_desc: "Piráti sú hanebným skutkom — zlodeji profitujúci z utrpenia iných! Formálne však poverenie lodí na útok na nepriateľský obchod je iná vec a môže byť veľmi výnosné pre nás." # todo: CHANGED
 sturdy_privateers: "Pevní korzári" # todo: NEW TRANSLATION
 sturdy_privateers_desc: "Rekviem sú vždy v ohni boja. Ak chceme využiť ich potenciál, musíme zabezpečiť, aby ich lode nespadli pri prvej delostreleckej paľbe! Dbajme, aby plavili len najodolnejšie plavidlá; to im aj nám predĺži životnosť." # todo: CHANGED
 rgo_build_time_advance: "$renaissance$ Stavebné metódy" # todo: CHANGED
 rgo_build_time_advance_desc: "Veľké budovy a sochy z minulosti stále stoja hrdé. Neodškriepiteľné, že stavebné techniky použité pri ich vzniku boli sofistikované a dobre rozvinuté. Stále sa máme čo učiť ich štúdiom." # todo: CHANGED
 arts_academy_advance: "$arts_academy$" # todo: NEW TRANSLATION
 arts_academy_advance_desc: "Umenie je životodarným dychom ľudstva a to, čo premieňa svet z fádnej existencie na živé plátno plné zázrakov a možností. Musíme podporovať väčšiu umeleckú zvedavosť medzi naším ľudom." # todo: NEW TRANSLATION
 metallurgy: "Metalurgia" # todo: NEW TRANSLATION
 metallurgy_desc: "Metalurgia, umenie spracovania a práce s kovmi, je jednou z definujúcich schopností vyspelých civilizácií. Kovové nástroje a zbrane sú oveľa lepšie než kamenné, umožňujúc robotníkom a vojakom väčšiu efektivitu." # todo: CHANGED
 supply_depot_advance_age_2_renaissance: "Zásobovacie sklady" # todo: NEW TRANSLATION
 supply_depot_advance_age_2_renaissance_desc: "Žiadna armáda nemôže prežiť bez zásob. Zriadenie trvalých zásobovacích dep pre ozbrojené sily umožní kontinuálne zásobovanie a udržiavanie armád v maximálnej kondícii." # todo: CHANGED
 supply_depot_advance_age_3_discovery: "Vojenské sklady" # todo: NEW TRANSLATION
 supply_depot_advance_age_3_discovery_desc: "Vývoj a nasadenie stálych armád zvýšili dopyt po zbraniach, uniformách a ďalších vojenských potrebách, ktoré by mali byť skladované v blízkosti vojakov." # todo: CHANGED
 supply_depot_advance_age_4_reformation: "Sklady munície" # todo: NEW TRANSLATION
 supply_depot_advance_age_4_reformation_desc: "Generalizované použitie delostrelectva na bojiskách a obliehaniach zvýšilo dopyt po strelive a prášku, zvyšujúc význam skladovacích dep." # todo: CHANGED
 supply_depot_advance_age_5_absolutism: "Predné sklady" # todo: NEW TRANSLATION
 supply_depot_advance_age_5_absolutism_desc: "Armády teraz dokážu preniknúť hlbšie do nepriateľského územia a udržať sa tam dlhšie, čo si vyžaduje stavať a udržiavať predné depá bližšie k nim, prepojené s zadnými zásobovacími líniami." # todo: CHANGED
 supply_depot_advance_age_6_revolutions: "Kampaňové sklady" # todo: NEW TRANSLATION
 supply_depot_advance_age_6_revolutions_desc: "Operácia viacerých armád na dlhších ťaženiach kladie extra tlak na naše zásobovacie systémy, čím sa stávajú dôležitejšími väčšie a rýchlo stavané depá." # todo: CHANGED
 army_country_looting_advance: "Lupičské oddiely" # todo: CHANGED
 army_country_looting_advance_desc: "Lúpeže a drancovanie sú základom obživy našej armády. Kamkoľvek naše vojská prídu, rabujú všetko, čo sa dá." # todo: CHANGED
 minting_income_factor_building: "Kontrola meny" # todo: NEW TRANSLATION
 minting_income_factor_building_desc: "Existuje mnoho druhov meny v obehu, ale tá, ktorá nesie našu pečať, je najviac považovaná za dôveryhodnú." # todo: CHANGED
 artillery_vs_fort_age_5_absolutism: "Obliehacie kanóny" # todo: NEW TRANSLATION
 artillery_vs_fort_age_5_absolutism_desc: "Práca s prachom viedla k vytvoreniu viacerých typov zbraní. Preskúšanie línií pechoty nevyžaduje rovnakú silu ako zrútenie hradieb; preto je pri obliehaniach potrebné nasadiť špecializované delá." # todo: CHANGED
 artists_advance_absolutism: "Umelecké prúdy" # todo: NEW TRANSLATION
 artists_advance_absolutism_desc: "Umenie sa vždy prejavovalo rôznymi spôsobmi, no nedávne pokroky ho rozšírili do množstva foriem, keď umelci skúmajú nové médiá a techniky." # todo: CHANGED
 subject_loyalty_absolutism: "Absolútna lojalita" # todo: NEW TRANSLATION
 subject_loyalty_absolutism_desc: "Nesmieme tolerovať nesúhlas alebo povstanie. Absolútna lojalita sa požaduje od všetkých poddaných, či sú súčasťou jadra občianstva alebo dobitá skupina." # todo: CHANGED
 improve_relation_impact_absolutism: "Stále ministerstvo zahraničných vecí" # todo: NEW TRANSLATION
 improve_relation_impact_absolutism_desc: "Naša rastúca diplomatická služba si vyžaduje zriadenie stálych ministerstiev zahraničia na riadenie a koordináciu vyslancov a ich aktivít." # todo: CHANGED
 hand_cannon_guild_advance: "$hand_cannon_guild$" # todo: NEW TRANSLATION
 hand_cannon_guild_advance_desc: "Primitívne kovové rúry, ktoré boli predchodcami neskorších pokročilejších del. Prvé sa vyvinuli v $CHI$ a rozšírili sa do $KOR$ a $JAP$ v roku 1270." # todo: CHANGED
 subjects_advance: "Podriadené štáty" # todo: NEW TRANSLATION
 subjects_advance_desc: "Udeľovanie podriadeným štátom určitej autonómie v miestnej správe ich udrží od povstaní a zároveň zabezpečí, že aj naďalej prinesú tribut do ríše." # todo: CHANGED
 slave_center_advance: "$slave_center$" # todo: NEW TRANSLATION
 slave_center_advance_desc: "Správne riadenie viazanej práce v našom štáte je kľúčové pre pretrvanie materiálneho blaha našich ľudí." # todo: CHANGED
 war_score_absolutism_advance: "Agresívne požiadavky" # todo: NEW TRANSLATION
 war_score_absolutism_advance_desc: "Moc štátu je priamo spojená s jeho vojenskou kapacitou. Čím početnejší je národ, tým väčšiu armádu môže postaviť. Musíme zaujať agresívny prístup k anektovaniu čo najviac územia v mierových zmluvách, aby sme získali výhodu nad susedmi." # todo: CHANGED
 spy_construction_absolutism: "Rozšíriť globálne špionážne siete" # todo: NEW TRANSLATION
 spy_construction_absolutism_desc: "Ako sa rozširujú rôzne impériá a inštitúcie sveta, budeme potrebovať udržiavať a možno aj zväčšiť našu špionážnu sieť, ak chceme byť o krok pred rivalmi." # todo: CHANGED
 absolutism_agressive_advance: "Štát nadovšetko" # todo: NEW TRANSLATION
 absolutism_agressive_advance_desc: "Ako sa regióny sveta formálne konsolidujú a zdroje sa stávajú obmedzenejšími, má štát právo uplatniť agresívnu politiku na uspokojenie materiálnych potrieb svojich ľudí a rozšíriť svoju moc. A hoci vojna by mala byť posledným aktom diplomacie, je stále diplomatickým ťahom, lebo štát stojí nad morálkou a zákonom." # todo: CHANGED
 relations_absolutism_advance: "Prepojená politika" # todo: NEW TRANSLATION
 relations_absolutism_advance_desc: "Keď sa svet okolo nás mení, musia naše diplomatické snahy držať krok s touto stále rastúcou potrebou bezpečnosti proti zahraničným hrozbám." # todo: NEW TRANSLATION
 correct_box_advance_absolutism: "Flexibilné bojové formácie" # todo: NEW TRANSLATION
 correct_box_advance_absolutism_desc: "Vznikli nové taktiky umožňujúce flexibilnejšie a koordinovanejšie jednotky pechoty, jazdy a delostrelectva na bojisku, zoskupené do brigád." # todo: CHANGED
 anti_piracy_warfare: "Obchodné konvoje" # todo: NEW TRANSLATION
 anti_piracy_warfare_desc: "Nárast bezohľadných zbojníkov v Novom svete — a na námorných cestách vedúcich k nemu — poškodil našich obchodníkov a obchod. Odteraz naše obchodné lode budú tvoriť konvoje s doprovodnou vojnovou loďou a na palube budú mať malú vojenskú jednotku na ďalšie zabezpečenie." # todo: CHANGED
 trade_range_advance_age_3: "Vylepšené obchodné lode" # todo: NEW TRANSLATION
 trade_range_advance_age_3_desc: "Vyvinuli sme väčšie lode, ktoré potrebujú menší počet posádky a môžu cestovať ďalej bez zastávky. To výrazne rozšíri rozsah nášho obchodu." # todo: CHANGED
 trade_range_advance_age_2: "Vzdialené trhy" # todo: NEW TRANSLATION
 trade_range_advance_age_2_desc: "Ako rastie naša ekonomika, objavujú sa nové príležitosti. Kým krátke trasy boli ziskové, dlhé trasy začínajú prinášať viac peňazí. Naše obchodné lode teraz plávajú ďalej za lepšími ponukami." # todo: CHANGED
 overseas_trade: "Zámorský obchod" # todo: NEW TRANSLATION
 overseas_trade_desc: "Správy o objavení vzdialených krajín dorazili do našej krajiny a naši obchodníci sa už pripravujú na rozšírenie obchodných operácií. Tieto nepreskúmané územia sú plné bohatých trhov, akoby zrelé ovocie čakajúce na zozbieranie." # todo: CHANGED
 ship_building_techniques_absolutism: "Mokrý dok" # todo: NEW TRANSLATION
 ship_building_techniques_absolutism_desc: "Vývoj suchého doku alebo plávajúceho doku umožní našim staviteľom lodí konštruovať plavidlá oveľa rýchlejšie než predtým." # todo: CHANGED
 ship_building_techniques_discovery: "Vylepšené stavanie lodí" # todo: CHANGED
 ship_building_techniques_discovery_desc: "Nové stavebné techniky pre naše lode nám pomôžu vyrábať ich rýchlejšie." # todo: NEW TRANSLATION
 spy_construction_discovery: "Zlepšená špionážna organizácia" # todo: NEW TRANSLATION
 spy_construction_discovery_desc: "Najímaním dôveryhodných informátorov a strategickým umiestnením tam, kde sa zdieľajú tajné informácie, môžeme zlepšiť schopnosť zhromažďovať správy o nepriateľoch a ich aktivitách." # todo: CHANGED
 diplomatic_training: "Diplomatický výcvik" # todo: NEW TRANSLATION
 diplomatic_training_desc: "Náš diplomatický repertoár sa zdokonalil a preto sme pridali skvelých diplomatov do nášho sprievodu, aby posilnili naše zahraničné snahy." # todo: CHANGED
 formalized_relations: "Formalizované vzťahy" # todo: NEW TRANSLATION
 formalized_relations_desc: "Nadviazanie formálnych vzťahov so susednými krajinami je kľúčové, ak chceme udržať rovnováhu moci a podporovať naše záujmy." # todo: CHANGED
 artists_advance_discovery: "Umelecké tlače" # todo: NEW TRANSLATION
 artists_advance_discovery_desc: "Rozšírené používanie tlačiarne vytvorilo nové príležitosti pre našich ľudí zdieľať svoje umelecké zručnosti a distribuovať umenie rýchlejšie a široko." # todo: CHANGED
 improved_book_binding: "Vylepšené viazanie kníh" # todo: NEW TRANSLATION
 improved_book_binding_desc: "Rozkvet myšlienok a poznania musí byť zásobovaný stabilným prísunom kníh, ak chceme prosperovať a vzdelávať ľud." # todo: CHANGED
 lumber_improvements_discovery: "Špecializované lesníctvo" # todo: NEW TRANSLATION
 lumber_improvements_discovery_desc: "Vyčlenením časti pôdy na pestovanie a zber silných stromov môžeme zvýšiť kvalitu a množstvo našej produkcie dreva." # todo: CHANGED
 lumber_improvements_reformation: "Vylepšené pílové čepele" # todo: NEW TRANSLATION
 lumber_improvements_reformation_desc: "Vďaka pokroku v výrobe nástrojov sú pílové čepele odolnejšie a menej vyžadujú údržbu. To uľahčí dodávku dostatočného množstva dreva pre ekonomické aktivity." # todo: CHANGED
 lumber_improvements_absolutism: "Píly poháňané vetrom" # todo: NEW TRANSLATION
 lumber_improvements_absolutism_desc: "Zavedením veterných hnacích síl do píl sme schopní spracovať drevo na dosky oveľa rýchlejšie než predtým." # todo: CHANGED
 coal_improvements_absolutism: "Vylepšené koksovanie" # todo: NEW TRANSLATION
 coal_improvements_absolutism_desc: "Zefektívnením procesu rafinácie uhlia môžeme jeho palivové využitie zvýšiť a eliminovať vedľajšie účinky, ktoré by negatívne ovplyvňovali iné priemyselné produkty." # todo: CHANGED
 coal_improvements_revolutions: "Vylepšené úľové pece" # todo: NEW TRANSLATION
 coal_improvements_revolutions_desc: "Na výrobu koksu, dôležitej súčasti spracovania železa, potrebujeme veľa hniezdových pecí. S lepšími stavebnými technikami a použitím tehál dokážeme zvýšiť kvalitu vyrábaného koksu." # todo: CHANGED
 correct_box_advance_discovery: "Poručíci" # todo: NEW TRANSLATION
 correct_box_advance_discovery_desc: "Ako naše profesionálne armády rastú, vymenovaní dôstojníci velia stále väčším formáciám. Aby sme im pomohli, vytvoríme hodnosť poručíka. Títo dôstojníci prenášajú rozkazy z velenia a tiež vedú menšie útvary na bojisku." # todo: CHANGED
 artists_advance_reformations: "Rozvoj svetského umenia" # todo: NEW TRANSLATION
 artists_advance_reformations_desc: "Po reformácii kvitnú nové formy umenia ako púčiky na viniči. Umelcom je ľahšie získať uznanie a nájsť zamestnanie na dvoroch sveta." # todo: CHANGED
 war_score_reformations_advance: "Božské právo dobyť" # todo: NEW TRANSLATION
 war_score_reformations_advance_desc: "Víťazstvo na bojisku je výsledkom viac než len dobrého vykonania taktiky — je to tiež božie zásahy v náš prospech. Preto je naše právo dobyť a pripojiť nové územia, pre ktoré sme preli krv, rozšírením božskej vôle, ktorá podporuje našu nadvládu." # todo: CHANGED
 reformation_subject_opinions_advance: "Ekonomickí páni" # todo: CHANGED
 reformation_subject_opinions_advance_desc: "Zmluvy definujúce senezávislosť iného štátu pokrývajú mnoho rôznych aspektov. Jedným z nich sú domáce obchodné povinnosti podriadeného voči svojmu vrchnému pánovi. Ako sa globálny obchod stáva dôležitejším, rozšírenie týchto povinností rastie na význame." # todo: CHANGED
 spy_construction_reformation: "Pokročilá kryptografia" # todo: NEW TRANSLATION
 spy_construction_reformation_desc: "Ak chceme zhromažďovať spravodajské informácie o našich nepriateľoch, musíme zlepšiť naše zručnosti v lámaní a vytváraní tajných kódov. Ospíme našich protivníkov falošným pocitom bezpečia posielaním správ, ktoré sa zdajú byť obyčajné, no v skutočnosti budú obsahovať skryté, zakódované informácie. Škoda, že naši nepriatelia nebudú dosť šikovní, aby tomu porozumeli!" # todo: CHANGED
 subject_income_reformation_advance: "Prísnejšia finančná kontrola" # todo: CHANGED
 subject_income_reformation_advance_desc: "Finančné povinnosti našich vazalov voči nám sú jasne vymedzené. Sprísnením týchto zmlúv však zabezpečíme včasné platby a zdravší pokladničný stav." # todo: CHANGED
 correct_box_advance_reformation: "Regimentálna organizácia" # todo: NEW TRANSLATION
 correct_box_advance_reformation_desc: "Profesionalizované armády umožnili vznik nového typu jednotky — pluku, ktorý nie je len stálym postom pre vojakov, ale aj užitočnou bojovou formáciou." # todo: CHANGED
 recruitment_improvements_reformation: "Náborové úrady" # todo: NEW TRANSLATION
 recruitment_improvements_reformation_desc: "Aby naša krajina dokázala vytvoriť impozantnú armádu, musíme zlepšiť nábor. Zvýšením času a prostriedkov venovaných náborovým centrám a aktivitám pritiahneme schopných vojakov rýchlejšie." # todo: CHANGED
 mercenaries_reformation_advance: "Zabezpečiť platby žoldnierom" # todo: NEW TRANSLATION
 mercenaries_reformation_advance_desc: "Je všeobecne známe, že žoldnieri nepracujú zadarmo. Sľubom spravodlivého odmenenia a podielu z korisťi si ľahšie zabezpečíme ich lojalitu a zaistíme, že najzrušnejšie družiny budú ochotné bojovať pre nás." # todo: CHANGED
 renaissance_subject_opinions_advance: "Kultúrni vládci" # todo: CHANGED
 renaissance_subject_opinions_advance_desc: "V posledných rokoch naberajú na význame záležitosti kultúry, humanizmu a prírodnej filozofie. Tento kultúrny vplyv sa rozprestiera nielen na náš ľud, ale aj na štáty, ktoré nám zložili hold, čím sa naše postavenie kultúrnych vládcov stáva cenným diplomatickým nástrojom." # todo: CHANGED
 spy_construction_renaissance: "Sieť špiónov" # todo: NEW TRANSLATION
 spy_construction_renaissance_desc: "Špionáž bola už od staroveku cenným nástrojom veľmocí. Tajná služba nám umožňuje lepšie sa informovať o vnútorných i vonkajších hrozbách a sledovať aktivity potenciálne nebezpečných štátov a subjektov. Mongoli boli majstrami tohto umenia, využívali spravodajstvo na prípravu a zabezpečenie úspechu svojich vojenských kampaní." # todo: CHANGED
 recruitment_improvements_renaissance: "Organizovaný nábor" # todo: NEW TRANSLATION
 recruitment_improvements_renaissance_desc: "Rozvoj profesionálnych armád zvýšil naše vojenské schopnosti. Na udržanie tohto stavu bude štát musieť tiež zlepšiť svoju kapacitu pre nábor vojakov." # todo: CHANGED
 correct_box_advance_renaissance: "Dôstojníci s poverením" # todo: NEW TRANSLATION
 correct_box_advance_renaissance_desc: "Vznik profesionálnych armád viedol k vytvoreniu stálych velení — úradov obsadzovaných priamo panovníkom." # todo: CHANGED
 improve_relation_impact_renaissance: "Štedré diplomatické dary" # todo: CHANGED
 improve_relation_impact_renaissance_desc: "Diplomatické dary sa vymieňajú už od staroveku ako prostriedok na zapôsobenie či presvedčenie cudzích vládcov zdôrazňovaním vysokého postavenia a bohatstva darcu. Dary sa pohybovali od vkusných látok cez prekrásne šperky až po úžasné zvieratá ako žirafy či slony." # todo: CHANGED
 late_feudal_relations: "Neskoré feudálne vzťahy" # todo: NEW TRANSLATION
 late_feudal_relations_desc: "Feudalizmus stojí na konceptoch #italic auxilium#! a #italic consilium#! — vojenskej pomoci a poradenstva, ktoré vazali dlžia svojim pánom. Nad týmto vznikla zložitá hierarchia hodností, privilégií a recipročne viazaných povinností." # todo: CHANGED
 artists_advance_revolutions: "Osvietené umenie" # todo: NEW TRANSLATION
 artists_advance_revolutions_desc: "S nástupom Osvietenia sú umenia rozkvitajú v rôznych podobách a na všetkých úrovniach spoločnosti. Nové vydania hudby a literatúry najmä vedú k širokému rozvoju záujmu o tieto odvetvia." # todo: CHANGED
 revolutions_subject_opinions_advance: "Dobrotiví vládci" # todo: CHANGED
 revolutions_subject_opinions_advance_desc: "Oheň revolúcie nie je banálna hrozba. Ak chceme zaručiť vernosť našich poddaných, musíme udušiť akékoľvek povstanie už v zárodku vymenovaním dôveryhodných guvernérov a odstránením príčin nepokojov." # todo: CHANGED
 war_score_revolutions_advance: "Argumenty rozumu" # todo: NEW TRANSLATION
 war_score_revolutions_advance_desc: "Vojny sú vždy škaredé udalosti, prinášajúce utrpenie obom stranám. Zdôraznenie tohto faktu a apelovanie na rozum a logiku protivníka nám určite prinesie významnú výhodu pri rokovaniach o nevyhnutných hrančných zmenách." # todo: CHANGED
 spy_construction_revolutions: "Kontakt s disidentmi" # todo: CHANGED
 spy_construction_revolutions_desc: "Ako sa po svete objavujú nové myšlienky a politické systémy, logicky sa vynárajú aj tí, ktorí protestujú proti starému poriadku. Budeme musieť vyčleniť zdroje na podporu týchto disidentských hlasov v konkurenčných štátoch, aby sme získali cenné informácie a prispeli k ich destabilizácii." # todo: CHANGED
 revolutions_agressive_advance: "Ospravedlniteľné konflikty" # todo: NEW TRANSLATION
 revolutions_agressive_advance_desc: "Medzinárodné diplomatické javisko prosperuje v rovnováhe síl medzi štátmi. Agresívne vojny sú odsudzované a v prípade výhry môžu viesť k formovaniu koalícií proti víťazovi.\nCez šikovné využitie diplomacie a interpretácie ale môžeme urobiť z našich nepriateľov agresorov voči nám, ospravedlniť naše vojenské kroky a výnosy z nich pred verejnosťou." # todo: CHANGED
 subject_income_revolutions_advance: "Platená suverenita" # todo: NEW TRANSLATION
 subject_income_revolutions_advance_desc: "Svet okolo nás prechádza obrovskými zmenami vo všetkých oblastiach. Môžeme túto nestabilitu využiť formalizovaním tributárnych dohôd s našimi podriadenými štátmi výmenou za našu podporu. Suverénna ochrana má totiž svoju cenu." # todo: CHANGED
 artillery_vs_fort_age_6_revolutions: "Pokročilé húfnice" # todo: NEW TRANSLATION
 artillery_vs_fort_age_6_revolutions_desc: "Potreba zbrane, ktorá zaplní medzeru medzi priamej paľby obliehacích diel a nepriamou paľbou moźdiezov, viedla naše velenie k vývoju nových húfnic." # todo: CHANGED
 recruitment_improvements_revolutions: "Rozsiahly nábor" # todo: NEW TRANSLATION
 recruitment_improvements_revolutions_desc: "S potenciálnymi hrozbami vyplývajúcimi z väčšieho geografického rozsahu ako kedykoľvek predtým musíme rozšíriť aj náš vojenský nábor. Ponúkaním pobídok dobrovoľníkom a zároveň odvodom zločincov do služby môžeme rýchlo mobilizovať sily na čelenie akejkoľvek nebezpečenstvu." # todo: CHANGED
 correct_box_advance_revolutions: "Generálny štáb" # todo: NEW TRANSLATION
 correct_box_advance_revolutions_desc: "Rast armád a ich nasadenie v dlhších kampaniach vytvorili potrebu vymenovať poverených dôstojníkov pre plánovanie a logistiku, zameraných na efektívnu koordináciu rôznych zborov na bojisku." # todo: CHANGED
 urbanization: "Urbanizácia" # todo: NEW TRANSLATION
 urbanization_desc: "Nové príležitosti a bezpečie, ktoré ponúka život v rastúcich mestách, priťahujú stále viac ľudí z vidieka do miest, kde sú dychtiví prijať priemyselné práce vytvorené novými modernými továrňami." # todo: CHANGED
 advanced_anti_piracy_warfare: "Zrieknutie sa korzárstva" # todo: NEW TRANSLATION
 advanced_anti_piracy_warfare_desc: "V našej dobe objavov a humanizmu nemá pirátstvo miesto — lupičstvo a násilie na moriach ohrozujú blahobyt všetkých. Čoraz viac krajín sa spája, aby čelili tejto spoločnej hrozbe a zložili jej koniec." # todo: CHANGED
 dip_choice_subject_opinions: "Emisári poddaných" # todo: NEW TRANSLATION
 dip_choice_subject_opinions_desc: "Pokračujúca komunikácia s našimi podriadenými štátmi cez vyhradených emisárov pozitívne ovplyvní naše vzťahy, posilní jadro nášho panstva a zabezpečí lojalitu všetkých krajín pod naším prápormi." # todo: CHANGED
 early_anti_piracy_warfare: "Ligy proti pirátstvu" # todo: NEW TRANSLATION
 early_anti_piracy_warfare_desc: "Rozmáhanie pirátov, banditov a lupiči pozdĺž našich obchodných trás prinútilo kupcov zjednotiť sa a vytvoriť Obchodné ligy, ktoré uľahčujú ochranu lodí počas dlhých plavieb." # todo: CHANGED
 pop_promotion_speed_age_5: "Byrokratické povýšenia" # todo: CHANGED
 pop_promotion_speed_age_5_desc: "Byrokracia sa rozrastá, aby vyhovela potrebám rastúcej administratívy, čo zodpovedajúcim spôsobom zvyšuje našu potrebu vzdelaných úradníkov v štátnej správe." # todo: CHANGED
 army_movement_speed_absolutism: "Polné sklady" # todo: NEW TRANSLATION
 army_movement_speed_absolutism_desc: "Poľné zásobárne nie sú novinkou, no ich používanie sa rozšírilo v dôsledku bezprecedentného rastu moderných armád. Stabilné zásobovanie strelivom uľahčuje pohyb armád a predlžuje ich operačný dosah." # todo: CHANGED
 army_movement_speed_revolutions: "Zmluvy o zásobovaní" # todo: NEW TRANSLATION
 army_movement_speed_revolutions_desc: "Platenie spravodlivých cien za jedlo a zásoby, ktoré naša armáda potrebuje počas presunu, namiesto drancovania, urýchľuje náš pohyb týmto regiónom, pretože sedliaci sami prinesú svoje produkty na zberné miesta, ktoré zriadime." # todo: CHANGED
 regiment_reinforcement_speed_absolutism: "Maršál ubytovania" # todo: NEW TRANSLATION
 regiment_reinforcement_speed_absolutism_desc: "Stále armády sa stali novým štandardom vojny, čo prináša svoje vlastné výzvy. Maršál ubytovania, nová pozícia v našich ozbrojených silách, sa zameria na prekonanie týchto výziev organizovaním logistiky našich stále rastúcich jednotiek." # todo: NEW TRANSLATION
 pop_promotion_speed_age_3: "Šľachta za službu" # todo: NEW TRANSLATION
 pop_promotion_speed_age_3_desc: "Tradične naši aristokrati dosahovali svoj status vojenskou službou panovníkovi. Požiadavky rastúceho štátu však teraz vyžadujú povyšovanie členov nižšej šľachty na vyššie hodnosti, zatiaľ čo ľudia z iných tried, ako obchodníci, sú povyšovaní na šľachtu." # todo: CHANGED
 regiment_reinforcement_speed_discovery: "Raná vojenská logistika" # todo: NEW TRANSLATION
 regiment_reinforcement_speed_discovery_desc: "Logistika je polovicou boja. Ako sa vojaci bijú, ich zbrane a brnenie strácajú odolnosť a môžu sa dokonca zničiť pod nepriateľským náporom. Zriadenie miestnych zásobovacích skladov a použitie ďalších logistických metód nám umožní doplniť výstroj vojakov rekordnou rýchlosťou." # todo: CHANGED
 pop_promotion_speed_age_4: "Konfesionálni kňazi" # todo: CHANGED
 pop_promotion_speed_age_4_desc: "Vek reformácie a konfessionalizmu obnovil záujem o organizované konfesie a rastie dopyt po kňazoch, ktorí ochotne povedú svoje zverené stáda v týchto ťažkých časoch. Títo konfesionálni duchovní robia náboženské úrady atraktívnejšími pre tých, čo hľadajú istotu a duchovné vedenie." # todo: CHANGED
 assault_ability_reformation: "Reformované prielomové výpady" # todo: NEW TRANSLATION
 assault_ability_reformation_desc: "Delegovaním zodpovednosti za obliehania a vpády našim najlepším a najzdruženejším jednotkám prenikneme aj cez najpevnejšie opevnenia, za ktorými sa nepriatelia môžu skrývať." # todo: CHANGED
 regiment_reinforcement_speed_reformation: "Nádržka na strelný prach" # todo: NEW TRANSLATION
 regiment_reinforcement_speed_reformation_desc: "Používanie strelného prachu sa stáva u našich vojakov čoraz rozšírenejším. Strelný prach je však náročný na manipuláciu kvôli svojej citlivosti na počasie a nárazy. Špeciálna fľaša ho ochráni pred živlami, čo nám uľahčí zásobovanie našich žoldnierov." # todo: CHANGED
 pop_promotion_speed_age_2: "Priaznivá sociálna mobilita" # todo: NEW TRANSLATION
 pop_promotion_speed_age_2_desc: "Sen väčšiny roľníkov — únik z chudoby a stúpanie po spoločenskom rebríku — je v našej spoločnosti realitou. Odmeňovaním pracovitosti, precíznosti a správneho stelesnenia našich ideálov nikdy nebudeme mať nedostatok schopných a vplyvných ľudí." # todo: CHANGED
 regiment_reinforcement_speed_renaissance: "Trvalý poľný výcvik" # todo: NEW TRANSLATION
 regiment_reinforcement_speed_renaissance_desc: "Profesionalizácia armád mení spôsob vedenia vojny: teraz sa zakladá na stálych jednotkách slúžiacich dlhé obdobia. Udržať pravidelný prísun vycvičených vojakov do týchto jednotiek je výzva, ale nevyhnutná pre ich optimálny chod." # todo: CHANGED
 pop_promotion_speed_age_6: "Kapitalistická sociálna mobilita" # todo: NEW TRANSLATION
 pop_promotion_speed_age_6_desc: "Expanzia kapitalizmu zrodila novú éru spoločenskej mobility, v ktorej bohatstvo nahrádza tradičné hierarchie ako meradlo spoločenského postavenia. Každý, od magnátov cez úradníkov po priemyselných robotníkov, túži vylepšiť svoj status kúpou." # todo: CHANGED
 regiment_reinforcement_speed_revolutions: "Hromadný výcvik" # todo: NEW TRANSLATION
 regiment_reinforcement_speed_revolutions_desc: "Moderné stojace armády sú väčšie než akékoľvek sily minulosti. Taktiky sa vykonávajú v tisíckach a obete rastú v bezprecedentných počtoch. Naše nové vojenské výcvikové techniky by mali znížiť vysoké straty moderného boja tým, že pripraví stovky vojakov naraz." # todo: CHANGED
 siege_ability_revolutions: "Dôstojníci delostrelectva" # todo: NEW TRANSLATION
 siege_ability_revolutions_desc: "Artinéléria sa stala tak zásadnou pre modernú vojnu, že na bojisku sú teraz nevyhnutní špecializovaní dôstojníci vycvičení v delostreleckej technike a taktickom nasadení." # todo: CHANGED
 assault_ability_revolutions: "Pochod proti paľbe" # todo: NEW TRANSLATION
 assault_ability_revolutions_desc: "Naše armády s odhodlaním vkročia do prúdu delostreleckého ohňa a prachu, vyrezávajúc cestu pre našu pechotu k dobytí nepriateľských pevností. Napriek pokrokom v artilérii a novým fortifikačným technikám ostáva naše umenie útoku na múry neprekonané." # todo: CHANGED
 army_country_movement_speed_advance: "Prieskumné družiny" # todo: NEW TRANSLATION
 army_country_movement_speed_advance_desc: "Využitím jazdcov-prieskumníkov môžeme preveriť terén pred armádami a naplánovať obchádzky ťažkostí. To nám umožní cestovať rýchlejšie než iné armády v tom istom mieste." # todo: CHANGED
 army_country_casus_belli_advance: "Zámienky" # todo: NEW TRANSLATION
 army_country_casus_belli_advance_desc: "Naši profesionálni diplomati a špióni excelujú vo vymýšľaní presvedčivých zámienok, ktoré ospravedlnia takmer akýkoľvek náš krok na medzinárodnej scéne." # todo: CHANGED
 army_country_integration_speed_advance: "Rešpektovať miestnu vládu" # todo: NEW TRANSLATION
 army_country_integration_speed_advance_desc: "Naši ľudia sú bojovní vodcovia, ktorí túžia šíriť svoje dedičstvo do všetkých kútov sveta. Ako prostriedok integrácie a správy nášho stále rastúceho panstva sme sa rozhodli väčšinou rešpektovať spôsob života dobytých lokálov a nezasahovať nadmerne." # todo: CHANGED
 army_country_diplo_range_advance: "Ozbrojení vyslanci" # todo: NEW TRANSLATION
 army_country_diplo_range_advance_desc: "Naša armáda je obávaná široko. Napriek nášmu renomé by sme mali nadviazať diplomatické vzťahy s krajinami, ktoré majú rovnaký cieľ ako my: zničiť spoločných nepriateľov. Posielaním dobre vyzbrojených a eskortovaných vyslancov na zahraničné dvory zabezpečíme, že naša diplomatická pôsobnosť neutrpí pri výbuchoch násilia." # todo: CHANGED
 minting_trade_range_trad_building: "Plánované obchodné expedície" # todo: NEW TRANSLATION
 minting_trade_range_trad_building_desc: "Obchod so zahraničnými krajinami je životodarnou silou našej ríše. Starostlivým plánovaním obchodných trás a hromadením zásob pre každú plavbu môžeme dosiahnuť trhy vzdialenejšie od našich základní." # todo: CHANGED
 minting_trade_range_disc_building: "Rozšírené obchodné sklady" # todo: NEW TRANSLATION
 minting_trade_range_disc_building_desc: "Rastúce nároky medzinárodného obchodu treba zohľadniť pri plánovaní našich obchodných podnikov. Rozšírením našich obchodných skladov môžeme bez rizika dosahovať nové brehy." # todo: CHANGED
 trade_center_building_country_advance: "Empóriá" # todo: NEW TRANSLATION
 trade_center_building_country_advance_desc: "S múdrymi technikami môžeme urobiť kontrolované trhy atraktívnejšími pre zahraničných kupcov, čím zvýšime naše príjmy." # todo: CHANGED
 export_building_country_advance: "Rýchly vývoz" # todo: NEW TRANSLATION
 export_building_country_advance_desc: "Náklady na export hodnotných tovarov z kontrolovaných trhov môžu byť vysoké, čo robí naše produkty menej atraktívnymi. Rýchlejším vykonávaním týchto exportných akcií môžeme urobiť obchod dynamickejším." # todo: CHANGED
 counter_espionage_building_country_advance: "Tajné kódy" # todo: NEW TRANSLATION
 counter_espionage_building_country_advance_desc: "Je všeobecne známe, že naše aktivity priťahujú nechcenú pozornosť. Ak chceme udržať naše plány skryté pred zvedavými pohľadmi, mali by sme šifrovať naše komunikácie." # todo: CHANGED
 medical_school_advance: "Lekárske školy" # todo: NEW TRANSLATION
 medical_school_advance_desc: "Špecializované miesta pre lekárske vzdelávanie — školy, kde sa učia o ľudskom tele, chorobách a ich liečení a prevencii." # todo: CHANGED
 slave_manned_galleys: "Galeje s otrockým osadením" # todo: CHANGED
 slave_manned_galleys_desc: "Masívne flotily galejí pohlcujú obrovské náklady, pretože potrebujú dostatok veslárov. Priradením otrokov tejto úlohe môžeme výrazne znížiť náklady na obsadenie našich námorných síl." # todo: CHANGED
 jesuits_bark: "Jezuitská kôra" # todo: NEW TRANSLATION
 jesuits_bark_desc: "Niektoré domorodé obyvateľstvá Južnej Ameriky používali kôru určitého stromu na liečenie zimnice. Vďaka experimentom jezuitského lekárnika sa ukázalo, že táto kôra je účinná aj pri liečbe malárie a už je známa ako 'Jezuitská kôra'. Rozdávanie jej postihnutému obyvateľstvu výrazne zníži následky choroby." # todo: NEW TRANSLATION
 quinine: "Chinín" # todo: NEW TRANSLATION
 quinine_desc: "Hoci 'Jezuitská kôra' v minulosti účinne liečila maláriu, jej užívanie v podobe sušeného prášku z kôry má veľký priestor na zlepšenie. Izolovaním a extrahovaním skutočnej liečivej zložky z kôry môžeme výrazne zvýšiť účinnosť liečby." # todo: NEW TRANSLATION
 state_efficiency: "Miestna infraštruktúra" # todo: NEW TRANSLATION
 state_efficiency_desc: "Napriek nášmu zameraniu na záležitosti krajiny nesmieme zanedbávať miestnych štátnych zákonodarcov a šerifov." # todo: CHANGED
 efficient_mining: "Efektívne baníctvo" # todo: NEW TRANSLATION
 efficient_mining_desc: "Vydáme nariadenie na zdokonalenie každého aspektu ťažby kovov v našom panstve, v snahe regulovať jej prítomnosť na našich trhoch." # todo: CHANGED
 efficient_construction_plans: "Efektívne stavebné plány" # todo: NEW TRANSLATION
 efficient_construction_plans_desc: "Náš efektívny stavebný plán nám umožňuje dokončiť zložité pracovné príkazy bez polovičných opatrení." # todo: CHANGED
 expanded_infrastructure_network: "Rozšírená infraštruktúrna sieť" # todo: NEW TRANSLATION
 expanded_infrastructure_network_desc: "Národná sieť ciest je kľúčovou súčasťou nášho obchodného a administratívneho úspechu. Preto by sme sa mali starať o jej údržbu a zlepšovanie." # todo: CHANGED
 fort_logistics: "Logistika opevnení" # todo: NEW TRANSLATION
 fort_logistics_desc: "Usporiadaním systému opevnení ako stavebne, tak logisticky môžeme v dlhodobom horizonte ušetriť prostriedky na ich údržbu." # todo: CHANGED
 regulation_bureau: "Úrad pre reguláciu" # todo: NEW TRANSLATION
 regulation_bureau_desc: "Zákonodarný orgán, ktorého jurisdikcia zahŕňa udržiavanie a podporu zákonov súvisiacich s infláciou, ako aj miestnu správu našich provincií." # todo: NEW TRANSLATION
 more_merchants_age_of_trad: "Cechy obchodníkov" # todo: NEW TRANSLATION
 more_merchants_age_of_trad_desc: "Vznik cechov dlhodobo formoval našu ekonomiku. Zatiaľ čo sú bežné medzi remeselníkmi, rovnaké nie je pravda o obchodníkoch. Mali by sme podporiť, aby sa naši obchodníci združovali podobne a zefektívnili naše trhové ambície." # todo: CHANGED
 construction_speed_traditions: "Majstri murári" # todo: NEW TRANSLATION
 construction_speed_traditions_desc: "Naše stavebné snahy by nikdy nemali ustávať a nechávať naše dediny a mestá nečinné. Zamestnaním majstra murára, ktorý bude dohliadať a plánovať naše stavebné práce, môžeme urobiť výrazné zlepšenia pri rozširovaní našej krajiny." # todo: NEW TRANSLATION
 diplomatic_capacity_traditions: "Rozšírené archívy" # todo: NEW TRANSLATION
 diplomatic_capacity_traditions_desc: "Bežné diplomatické snahy vyžadujú papierovanie a podrobnú dokumentáciu našich kontaktov." # todo: NEW TRANSLATION
 rural_rgo_traditions: "Odlesnenie terénu" # todo: CHANGED
 rural_rgo_traditions_desc: "Musíme skrotiť vzdialené časti našej krajiny, aby sme rozšírili naše ekonomické schopnosti. Nielenže poskytneme viac priestoru pre našich ľudí, ale optimalizujeme aj ich prínos krajine." # todo: CHANGED
 matchlock_gun: "Skoré lovecké zbrane" # todo: NEW TRANSLATION
 matchlock_gun_desc: "Zlepšenia zbraní vyrobených našimi puškármi poskytnú aj lovcom lepšie nástroje na získanie kožušín a diviny." # todo: CHANGED
 flintlock_gun: "Vylepšené kresadlové pušky" # todo: NEW TRANSLATION
 flintlock_gun_desc: "S vývojom vylepšených kľúčových zámkov a špeciálnych nábojov na lov budú naši lovci oveľa schopnejší uloviť korisť." # todo: CHANGED
 long_rifle: "Lov s dlhou puškou" # todo: NEW TRANSLATION
 long_rifle_desc: "Špecifické dlhé lovecké pušky poskytnú našim lovcom spoľahlivý nástroj na získavanie potravy a kožiek." # todo: CHANGED

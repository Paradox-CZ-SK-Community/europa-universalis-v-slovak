 increase_control_area_advance: "Rozšíriť kontrolu na veľkú plochu" # todo: NEW TRANSLATION
 increase_control_area_advance_desc: "Ako naša mocná krajina rastie, budeme potrebovať pevný dohľad nad naším obyvateľstvom." # todo: NEW TRANSLATION
 improved_supply_lines: "Zlepšené zásobovacie linky" # todo: NEW TRANSLATION
 improved_supply_lines_desc: "Moderné vojny vyžadujú čoraz viac zdrojov pre naše armády, obzvlášť po rozvoji salvovej streľby a rozšírenom používaní delostrelectva na bojisku." # todo: NEW TRANSLATION
 supply_lines: "Zásobovacie linky" # todo: NEW TRANSLATION
 supply_lines_desc: "Rozvoj profesionálnych armád zmenil spôsob vedenia vojny. Logistika je teraz nevyhnutná a zásobovacie línie sú nevyhnutné na udržanie armád kŕmených a zásobených strelivom." # todo: CHANGED
 improved_logistics: "Zlepšená logistika" # todo: NEW TRANSLATION
 improved_logistics_desc: "Moderné umenie vojny dnes jasne oddeľuje amatérskych dôstojníkov, ktorí rozprávajú o taktikách, od profesionálov, ktorí skutočne študujú logistiku." # todo: CHANGED
 mining_advance: "Ťažba kameňa" # todo: NEW TRANSLATION
 mining_advance_desc: "Ťažba kameňa bola základnou ekonomickou činnosťou od počiatkov ľudstva. Rozšírené používanie kovárstva len zvýšilo význam prieskumu a ťažby rôznych druhov nerastov a kovov pre rozvoj zložitých spoločností." # todo: NEW TRANSLATION
 bronze_working: "Spracovanie bronzu" # todo: NEW TRANSLATION
 bronze_working_desc: "Bronz je zliatina $copper$ a $tin$, objavená a vyvinutá na výrobu odolnejších nástrojov a zbraní; je tvárnejší a ľahšie sa s ním pracuje než s čistou $copper$." # todo: CHANGED
 iron_working: "Práca s $iron$" # todo: CHANGED
 iron_working_desc: "$iron$ je kľúčový materiál pre výrobu rôznych nástrojov a zbraní, čo ho robí životne dôležitým pre dedinských kováčov aj veľké výroby." # todo: CHANGED
 advanced_mining: "Pokročilá ťažba" # todo: NEW TRANSLATION
 advanced_mining_desc: "Vývoj odolnejších a lepších nástrojov umožnil ďalšie rozšírenie baní na nové minerály a kovy." # todo: CHANGED
 fine_metals_mining: "Ťažba vzácnych kovov" # todo: NEW TRANSLATION
 fine_metals_mining_desc: "Objav a vývoj nových kovových zliatin umožnil ťažiť a využívať nové vzácne kovy vo väčšom rozsahu, vďaka čomu je tento proces veľmi ziskový v porovnaní s inými typmi ťažby." # todo: NEW TRANSLATION
 ranching: "Chov dobytka" # todo: NEW TRANSLATION
 ranching_desc: "Chov dobytka umožnil chov veľkých stád koní, čo zase urobilo možné selektovať najlepšie zvieratá pre cestovanie, vojnu a mnohé ďalšie úlohy." # todo: CHANGED
 mining_law_advance: "$mining_law$" # todo: NEW TRANSLATION
 mining_law_advance_desc: "$mining_law_desc$" # todo: NEW TRANSLATION
 fort_limit_1_advance: "Systém kastelánov" # todo: NEW TRANSLATION
 fort_limit_1_advance_desc: "Oficiálni kasteláni sú vymenovaní na správu miestnych pevností a ich posád, čo predstavuje prvý organizovaný rámec pre administráciu a údržbu opevnení." # todo: NEW TRANSLATION
 fort_limit_2_advance: "Pohraniční strážcovia" # todo: NEW TRANSLATION
 fort_limit_2_advance_desc: "Regionálni strážcovia koordinujú viacero hradov pozdĺž pohraničných regiónov, zriaďujú zásobovacie trasy, reťazce hlásení a vzájomnú obranu medzi susednými pevnosťami." # todo: NEW TRANSLATION
 fort_limit_3_advance: "Úrad obrany" # todo: NEW TRANSLATION
 fort_limit_3_advance_desc: "Úrad $crown_estate$ centralizuje dohľad nad opevneniami v rámci formálneho úradu v hlavnom meste, konsolidujúc záznamy, fondy a rozkazy údržby do jednej administratívnej autority." # todo: CHANGED
 fort_limit_4_advance: "Generálni inšpektori" # todo: NEW TRANSLATION
 fort_limit_4_advance_desc: "Profesionálni inšpektori cestujú po kráľovstve, aby hodnotili posádky, zásoby a múry, vynucujúc jednotné normy a zabezpečujúc spoľahlivosť každej opevnenej lokality." # todo: NEW TRANSLATION
 fort_limit_5_advance: "Štandardizované inžinierstvo" # todo: NEW TRANSLATION
 fort_limit_5_advance_desc: "Zavádzajú sa národné normy pre výstavbu a opravy, čo umožňuje efektívne plánovanie, zdieľané návrhy a predvídateľnú údržbu naprieč sieťou pevností." # todo: NEW TRANSLATION
 fort_limit_6_advance: "Topografické prieskumy" # todo: NEW TRANSLATION
 fort_limit_6_advance_desc: "Komplexné mapovanie a logistická integrácia spájajú každú pevnosť do súdržného obranného systému; úspech byrokracie, vedy a štátnej moci pracujúci v súlade." # todo: NEW TRANSLATION
 chancery_advance: "Chancéria" # todo: NEW TRANSLATION
 chancery_advance_desc: "Chancelleria je byrokratický úrad, ktorý stredovekí vládcovia vyvinuli na riadenie svojich domén, keď sa spoločenské zmeny stali komplexnejšími a ťažšie spravovateľnými. Hlavnou úlohou chancérie je písať, posielať a prijímať dokumenty súvisiace so správou týchto domén." # todo: CHANGED
 chancery_records: "Záznamy chancérie" # todo: NEW TRANSLATION
 chancery_records_desc: "Rastúci aparát kancelárií vyžaduje ďalšiu úroveň administrácie, pretože ich byrokracia sa stáva ešte zložitejšou na riadenie. To prichádza v podobe záznamov kancelárie, úradu vytvoreného na uchovávanie všetkých prijatých listov v kancelárii, ako aj kópií všetkých dokumentov vydaných jej písačmi a notármi." # todo: CHANGED
 lieutenancy_advance: "Zástupcovia panovníka" # todo: NEW TRANSLATION
 lieutenancy_advance_desc: "Ako majetok koruny rastie, predĺžené neprítomnosti panovníka v rôznych kráľovstvách oslabujú korunu a napínajú vzťahy s poddanými. Na riešenie tohto problému vzniká pozícia námestníka, ktorý pôsobí ako dočasný zástupca panovníka počas jeho neprítomností. Títo námestníci nie sú len z kráľovskej krvi, ale aj z domáceho okruhu spojeného s kráľovou rodinou." # todo: NEW TRANSLATION
 viceroyalty_advance: "Vicekráľovstvo" # todo: NEW TRANSLATION
 viceroyalty_advance_desc: "Vicekráľovstvo označuje samostatnú a polo-autonómnu územnú jednotku v rámci kráľovstva, charakterizovanú ako monarchický štát spravovaný vymenovaným vicekráľom. Týmto administratívnym útvarom je zverený vicekráľ, ktorého monarcha menoval s dôležitou zodpovednosťou za riadenie a správu určitej krajiny alebo provincie. Zvyčajne sa nachádza oddelene od centrálneho jadra kráľovstva a funguje ako samostatný subjekt s istým stupňom samosprávy, pričom je nakoniec zodpovedný vládnucemu panovníkovi. Úloha vicekráľa zahŕňa široké spektrum povinností, vrátane vykonávania politík, udržiavania poriadku a reprezentácie kráľovej autority v pridelenom regióne." # todo: NEW TRANSLATION
 tolerance_idea: "Myšlienky tolerancie" # todo: NEW TRANSLATION
 tolerance_idea_desc: "Každý človek bol stvorený rovný Stvoriteľovi, a preto chápeme, že ich presvedčenia, aj keď sú nesprávne, môžu byť akceptované ako prostriedok k eventualnému obráteniu k jedinej pravdivej viere." # todo: CHANGED
 empiricism: "Empirizmus" # todo: NEW TRANSLATION
 empiricism_desc: "Veci sú také, aké sú, pretože ich môžeme cítiť, vidieť a celkovo zažiť našimi zmyslami. Práve na základe týchto empirických dôkazov prichádzame na nové myšlienky." # todo: NEW TRANSLATION
 print_culture: "Kultúra tlače" # todo: NEW TRANSLATION
 print_culture_desc: "S vynálezom tlačiarenského lisu sa šírenie poznania nikdy nebolo ľahšie. Nové techniky a pokroky dosiahnu každý kút našej krajiny a posilnia ju." # todo: CHANGED
 religious_unification: "Náboženské zjednotenie" # todo: NEW TRANSLATION
 religious_unification_desc: "Existuje len jedno pravé náboženstvo, a preto je našou povinnosťou zjednotiť všetkých veriacich pod jediným vedením Boha." # todo: NEW TRANSLATION
 humanism: "Humanizmus" # todo: NEW TRANSLATION
 humanism_desc: "Človek je najvyšším výtvorom nášho Pána, a preto je prirodzené umiestniť ho do stredu Stvorenia. Každý aspekt ľudskej prirodzenosti musí byť zachovaný a povýšený, od blahobytu po túžbu po slobodnej vôli a skúmaní." # todo: CHANGED
 merchant_traditions: "Obchodnícke tradície" # todo: NEW TRANSLATION
 merchant_traditions_desc: "Stály tok obchodu je známkou zdravej ekonomiky. Keď sa naši obchodníci zamerajú na udržiavanie obchodného toku, vybudujeme tradíciu a povesť živého obchodu, čo uľahčí priťahovanie zahraničného obchodu do našej krajiny." # todo: CHANGED
 benign_diplomats: "Prívetiví diplomati" # todo: NEW TRANSLATION
 benign_diplomats_desc: "Umenie diplomacie je zložité. Byť dobrý vo slovách nestačí — celková prítomnosť a vystupovanie sú kľúčové pre to, ako sú slová vnímané. Nech naši diplomati pracujú na dobrom dojme a budeme v očiach iných krajín priaznivejší." # todo: CHANGED
 grand_banquets: "Veľké bankety" # todo: NEW TRANSLATION
 grand_banquets_desc: "Žiadna dôležitá vec sa nediskutuje bez sprevádzajúceho jedla, a čím dôležitejšia je záležitosť, tým bohatšia by mala byť hostina. Pravidelné veľké bankety nám umožnia pravidelne a náležite prerokovať všetko, čo treba." # todo: CHANGED
 buffer_states: "Bufrové štáty" # todo: NEW TRANSLATION
 buffer_states_desc: "Nie je nič horšie ako hádka so susedom. Ak chceme vyhnúť sa hraničným napätiam, mať iné štáty ako nárazníkové oblasti medzi nami a potenciálnymi nepriateľmi nám dá priestor na dýchanie." # todo: CHANGED
 camp_followers: "Táboroví sprievodcovia" # todo: NEW TRANSLATION
 camp_followers_desc: "Bojovníci tvoria jadro našich armád, no žiadna armáda sa nemôže skladať len z bojovníkov. Bez sprievodu ľudí transportujúcich jedlo a vybavenie by armáda nemohla efektívne fungovať. Organizovaním a štruktúrovaním týchto sprievodov výrazne zvýšime ich užitočnosť a efektivitu." # todo: CHANGED
 swedish_tradition: "Vždy útočiť" # todo: NEW TRANSLATION
 swedish_tradition_desc: "Formovanie našich pochodujúcich jednotiek do #italic Svinfylking#! a nájazd je dosť na to, aby zlomilo akéhokoľvek protivníka! Jazdectvo nie je nadradené; okrem toho, že sa s koňmi dostaneme na miesto bitky, nemajú na bojisku miesto." # todo: CHANGED
 swedish_heritage: "Voľní roľníci" # todo: NEW TRANSLATION
 swedish_heritage_desc: "$SWE_ADJ$ roľníci vždy významne prispievali k národu; rozdiely medzi šľachticom a slobodným farmárom nikdy neboli veľké." # todo: CHANGED
 kung_och_riksdag: "Kung och Riksdag" # todo: NEW TRANSLATION
 kung_och_riksdag_desc: "$SWE_ADJ$ vládcovia často potrebovali spoluprácu stavov, najmä s tak veľkou roľníckou triedou v porovnaní so šľachtou. Počas vlády Gustáva II. Adolfa však došlo k historickému kompromisu so šľachtou, ktorá verne prisľúbila svoje zdroje v prospech národa výmenou za nové privilégiá." # todo: CHANGED
 swedish_steel: "$SWE_ADJ$ oceľ" # todo: CHANGED
 swedish_steel_desc: "Kým iné armády môžu byť spokojné s divokým výstrelom nepresných salv na nepriateľa, pochodujeme na nich v disciplinovaných radoch, vypálime jednu ranu z blízka a potom ich prebodneme chladnou oceľou." # todo: CHANGED
 hakkapelitta: "Hakkapeliitta" # todo: CHANGED
 hakkapelitta_desc: "$FIN$ je považovaný za chudobný a zaostalý región, ale služba v $SWE_ADJ$ jazde ponúka zručným $FIN_ADJ$ jazdcom veľa príležitostí pre slávu a korisť. Vynikajúce jazdecké zručnosti a kvalitné kone nám umožňujú vychovať nenávidených #italic Hakkapeliitta#! — jazdu tak účinnú v bitke, že naši nepriatelia šepkajú, že ich musí chrániť čarodejníctvo." # todo: CHANGED
 indelningsverket: "Indelningsverket" # todo: NEW TRANSLATION
 indelningsverket_desc: "Systém $SWE_ADJ$ rozdelenia posádok delí roľníctvo do skupín po desiatich na účely náboru. Tento systém uľahčil nájsť ľudí do služby a organizovať ich do jednotiek." # todo: CHANGED
 swedish_absolutism: "$SWE_ADJ$ absolutizmus" # todo: CHANGED
 swedish_absolutism_desc: "Absolutizmus je teória, že jedna osoba má byť zodpovedná, táto osoba je monarcha, a že monarcha bude riadiť vládu bez zásahov Tajnej rady." # todo: CHANGED
 produktplakatet: "Produktplakatet" # todo: NEW TRANSLATION
 produktplakatet_desc: "Nariadenie zakazuje cudzím lodiam priplávajúcim do $SWE$ prinášať tovar z krajín iných než ich vlastných alebo ich kolónií." # todo: CHANGED
 mulltimmer_masugn: "Mulltimmer Masugn" # todo: NEW TRANSLATION
 mulltimmer_masugn_desc: "$SWE_ADJ$ $iron$, cenené pre svoju čistotu a pevnosť, zásobuje nielen naše domáce potreby, ale aj huty a zbrojnice národov po kontinente. #italic Mulltimmer Masugn#! nebola postavená len z kameňa, ale aj z dreva izolovaného pieskom, štrkom a hlinou." # todo: CHANGED
 swedish_royal_post_office: "Kungliga Postverket" # todo: NEW TRANSLATION
 swedish_royal_post_office_desc: " #italic Kungliga Postverket#!, alebo Kráľovská poštová agentúra, bola vytvorená na zlepšenie štátnej administrácie a komunikácie naprieč $SWE$. Zaviedla spoľahlivú sieť kuriérov a staníc a stala sa rozhodujúcou pre našu vojenskú koordináciu, diplomaciu a vládu." # todo: CHANGED
 polhem_machina_nova: "Machina Nova" # todo: NEW TRANSLATION
 polhem_machina_nova_desc: "Christopher Polhem, nazývaný 'otec $SWE_ADJ$ inžinierstva', transformoval $SWE_ADJ$ priemysel svojou #italic Machina Nova#!, inovatívnou sústavou mechanických systémov navrhnutých na zefektívnenie a zvýšenie produkcie. Pomocou zložitých sústav ozubených kolies, vačiek a vodnej energie Polhem vyvinul niekoľko strojov schopných vykonávať úkony, ktoré boli predtým robé ručne, od drvenia rúd v baniach po tkanie látok a píly." # todo: CHANGED
 swedish_copper_coins: "Švédske medené mince" # todo: NEW TRANSLATION
 swedish_copper_coins_desc: "Bohaté zásoby medi v $SWE$, predovšetkým z bane Stora Kopparberget vo Falune, podnietili krajinu používať tento kov ako hlavný materiál na razenie novej národnej meny, #italic daler#!. Táto mena je vydávaná vo forme veľkých medenných platní, nazývaných #italic plåtmynt#!, ktoré môžu vážiť až 20 kilogramov. Niektorí tvrdia, že to nie je príliš praktické a že objem peňazí v obehu by mohol prekročiť zásoby medi, ale to je krátkozraké." # todo: NEW TRANSLATION
 combined_arms_advance_reformation: "Kombinované zbrane" # todo: NEW TRANSLATION
 combined_arms_advance_reformation_desc: "Vojenské umenie sa stáva čoraz komplexnejším v dôsledku rozšírenia stálych armád zložených z vojakov najatých do trvalej služby. Zavedenie nových zbraní, ako sú palné zbrane a dela, podporuje prístup, ktorý vyvažuje a kombinuje ľahú pechotu, ťažkú pechotu, jazdu a delostrelectvo, za podpory pomocných jednotiek." # todo: NEW TRANSLATION
 combined_arms_advance_revolutions: "Pokročilé kombinované zbrane" # todo: NEW TRANSLATION
 combined_arms_advance_revolutions_desc: "Pravidelné používanie kombinovaných zbraní počas niekoľkých storočí viedlo k dominancii tohto typu vojny. Ľahká pechota a jazda majú úlohu oslabovať a dezorganizovať nepriateľské sily, zároveň kryť a chrániť vlastné. Ťažká pechota a jazda nesú hlavnú záťaž boja, usilujúc sa o rozhodujúce šarvátky, ktoré rozbijú nepriateľa, zatiaľ čo delostrelectvo a pomocné sily ich podporujú zozadu na diaľku." # todo: NEW TRANSLATION
 hun_composite_light_cavalry: "Kompozitná ľahká jazda" # todo: NEW TRANSLATION
 hun_composite_light_cavalry_desc: "Tvorená jazdeckými lukostrelcami aj rýchlymi jazdcami, naša ľahká jazda je chrbticou našej vojenskej sily. Naše jazdecké sily opakovane preukázali svoj um a opäť povedú naše sily ku sláve." # todo: CHANGED
 hun_castle_warriors: "Hradní bojovníci" # todo: NEW TRANSLATION
 hun_castle_warriors_desc: "Castle Warriors, jedna z najvybratejších tried v našej spoločnosti, sú povinní poskytovať vojenskú službu svojim miestnym #italic ispáns#! v kráľovských hradných okresoch. Stálci od prvých dní našej krajiny, títo privilégiovaní vlastníci pôdy zastávajú jedinečné postavenie, aktívne chránia svoje panstvo a zároveň si cenia dedičné práva." # todo: CHANGED
 hun_renaissance_knowledge: "Renaissance princ" # todo: CHANGED
 hun_renaissance_knowledge_desc: "Roľníci považujú svojho vládcu za spravodlivého, pretože sú oficiálne chránení pred nadmerným zaťažením a zneužívaním zo strany magnátov. Vládca $HUN$ je pravým $renaissance$ princom — úspešným vojvodcom a administrátorom, vynikajúcim polyglotom a osvieteným patrónom umení." # todo: CHANGED
 hun_bulwark_of_christianity: "Bárda $christian$" # todo: CHANGED
 hun_bulwark_of_christianity_desc: "S rastúcou mocou $turkish_culture$ na juhu je na ľuďoch $HUN$ brániť verné kráľovstvá pred $turkish_culture$ hrozbou. Nech je známe, že neuhneme od tejto svätej povinnosti!" # todo: CHANGED
 hun_found_the_black_army: "Založiť Čiernu armádu" # todo: NEW TRANSLATION
 hun_found_the_black_army_desc: "Inšpirovaní pismi Julia Caesara, $HUN$ udrží zbor profesionálnych vojakov. Títo bojovníci budú tak zúriví, že naši nepriatelia svojim deťom v noci budú šepkať desivé príbehy 'Čiernej armády'!" # todo: CHANGED
 hun_reformed_coinage: "Reforma mincovníctva" # todo: NEW TRANSLATION
 hun_reformed_coinage_desc: "Aby sme zaplatili za našu novú profesionálnu armádu, budeme potrebovať stabilný zdroj príjmov. Reforma meny na štandardizovanie hmotností to výrazne zjednoduší, pretože budeme presne vedieť, koľko majú ľudia platiť." # todo: CHANGED
 hun_curtailed_peasantry: "Obmedziť slobodu roľníkov" # todo: CHANGED
 hun_curtailed_peasantry_desc: "$HUN$ nie je požehnané ochrannými prírodnými hranicami. Divoké pláne, ktoré priviedli našich predkov sem, boli ideálne na nájazdy do Západu, nie na obranu. Aby sa $HUN$ dokázalo brániť, budeme potrebovať zdroje. Najlepším riešením je dovoliť magnátom viac viazať roľníkov k pôde, čím zabezpečíme vyššiu produktivitu." # todo: CHANGED
 hun_strengthened_towns: "Posilniť mestá" # todo: NEW TRANSLATION
 hun_strengthened_towns_desc: "Mestá sú kľúčovým faktorom pri tvorbe bohatstva, ktoré $HUN$ potrebuje na rast a prosperitu. Ak zaistíme, že fungovanie našich miest bude chránené pred mocenskými machináciami šľachty, budú naďalej prinášať obchod, ktorý môžeme zdaňovať." # todo: CHANGED
 hun_hungarian_reformation_intro: "Myšlienky reformácie sa cez $europe$ šírili ako požiar, a preto sa nevyhnutne zavŕtali aj do našich zemí." # todo: CHANGED
 hun_hungarian_reformation: "$HUN_ADJ$ reformácia" # todo: CHANGED
 hun_hungarian_reformation_desc: "$hun_hungarian_reformation_intro$ Naša ríša bola dosť dlho ohrozovaná vonkajšími mocnosťami. Pristúpením k reformácii a odvrhnutím povinnosti poslúchať pápeža ako psík sa aspoň jedného z okov, ktoré nás zväzujú, zbavíme!" # todo: CHANGED
 hun_the_catholic_shield: "Katolický štít" # todo: CHANGED
 hun_the_catholic_shield_desc: "$hun_hungarian_reformation_intro$ Predsa zostáva srdce veriacich silné. Boh a jeho verní sluhovia odolajú tomuto heretickému šialenstvu." # todo: CHANGED
 hun_realm_of_many_religions: "Ríša mnohých náboženstiev" # todo: NEW TRANSLATION
 hun_realm_of_many_religions_desc: "$hun_hungarian_reformation_intro$ Ach, reformácia rozdelila rodiny, premenila priateľov na nepriateľov a ohrozila stabilitu mnohých národov. Naša ríša vie lepšie, než byť obeťou teologických sporov. Sme totiž krajina mnohých vierovyznaní." # todo: CHANGED
 hun_multi_culturalism: "Ríša mnohých kultúr" # todo: NEW TRANSLATION
 hun_multi_culturalism_desc: "Karpatská panva je domovom nielen $HUN_ADJ$ ľudí. $slovak$, $ruthenian$, $cuman_culture$ a $german_carpathian$ ľudia spolu s mnohými inými menšinami nazývajú našu ríšu domovom. Vzhľadom na túto rozmanitosť je prirodzené, že vláda pohotovo absorbuje a adoptuje tieto kultúry do štátu." # todo: CHANGED
 hun_revolutionized_military_tactics: "Revolučné vojenské taktiky" # todo: CHANGED
 hun_revolutionized_military_tactics_desc: "Ako sa vojenská technológia vyvíja, rovnako sa menia bojové taktiky. Pre prežitie nášho štátu je nevyhnutné držať krok s neustále sa meniacej povahy pozemného boja." # todo: CHANGED
 hun_hungarian_unity: "$HUN_ADJ$ jednota" # todo: CHANGED
 hun_hungarian_unity_desc: "Hoci naši poddaní čelili mnohým vonkajším hrozbám, duch a vôľa ľudu $HUN_ADJ$ zostali nezlomené. Zjednotenie sŕdc $HUN_ADJ$ je veľkou inšpiráciou pre našich vlasteneckých vojakov, ktorí budú brániť naše domovy až do posledného muža." # todo: CHANGED
 hun_hungarian_hussars: "$a_hungarian_hussars$" # todo: NEW TRANSLATION
 hun_hungarian_hussars_desc: "$a_hungarian_hussars_desc$" # todo: NEW TRANSLATION
 salic_law_advance: "Salické právo" # todo: NEW TRANSLATION
 salic_law_advance_desc: "Panovanie žien nie je vždy rešpektované — ani dovolené. Preto nie je nezvyčajné, že vlády prijímajú zákony priamo zakazujúce ženám dedičstvo, uprednostňujúc mužských súrodencov alebo bratrancov." # todo: CHANGED
 partition_inheritance_advance: "Delené dedičstvo" # todo: NEW TRANSLATION
 partition_inheritance_advance_desc: "Rivality medzi kráľovskými potomkami nie sú nezvyčajné, keďže každý chce byť jedného dňa vládcom. Aby sa predišlo vnútornému boju, niektorí monarchovia sa rozhodnú rozdeliť svoje územia a tituly medzi všetkých synov, aby každý dostal viac-menej rovnaký diel dedičstva." # todo: CHANGED
 national_assemblies_advance: "Národné zhromaždenia" # todo: NEW TRANSLATION
 national_assemblies_advance_desc: "$national_assemblies_desc$" # todo: NEW TRANSLATION
 enlightenment_advance: "Osvietenstvo" # todo: NEW TRANSLATION
 enlightenment_advance_desc: "Posledné storočie prinieslo rastúcu popularitu racionalizmu a empirizmu medzi najväčšími mysliteľmi doby. Svetlo rozumu bolo zapálené a mnohí neprestanu, kým nedorazí do všetkých kútov zeme." # todo: CHANGED
 distribution_of_power_advance: "$distribution_of_power_law$" # todo: NEW TRANSLATION
 distribution_of_power_advance_desc: "$distribution_of_power_law_desc$" # todo: NEW TRANSLATION
 industrialization_advance: "Industrializácia" # todo: NEW TRANSLATION
 industrialization_advance_desc: "Priemyselná revolúcia priniesla trvalé zmeny — nielen obchodu a podnikania, ale aj sociálnej štruktúry mnohých národov. Vynálezy ako mechanické tkanie a parný stroj posunú schopnosti človeka na nové vrcholy." # todo: CHANGED
 levee_en_masse_advance: "Všeobecná mobilizácia" # todo: NEW TRANSLATION
 levee_en_masse_advance_desc: "Vojna sa neustále vyvíja, študuje sa a zdokonaľuje generácie za generáciami. Aby sme vyhoveli potrebám expanzie a poskytli palivo pre tieto ambície, budú prijaté nové celoštátne zákony o brannej povinnosti. Zjednáme armády mladých, slobodných brancov, ktorých počet zanechá nezmazateľnú stopu v histórii." # todo: CHANGED
 griot_advance: "Griotovia" # todo: CHANGED
 griot_advance_desc: "#italic griots#! sú rozprávači, historici, poradcovia, hudobníci a básnici zároveň. Strážia príbehy a legendy minulých generácií, zmierujú spory a slúžia svojim vládcov a miestnym ľuďom ako rádci." # todo: CHANGED
 west_african_caravan_stop_advance: "Saharský $caravan_stop$" # todo: NEW TRANSLATION
 west_african_caravan_stop_advance_desc: "Obchod medzi subsaharskou $africa$ a $north_africa$ je súčasťou našej identity po stáročia. Cesta cez rozľahlú púšť, i s dlhoročnými skúsenosťami, je stále náročná a nebezpečná. Kľúčom k bezpečnému obchodu je $caravan_stop$ — miesto, kde sa kupci a ich karavány môžu oddýchnuť a osviežiť počas prechodu púšťou." # todo: CHANGED
 sunday_schools_advance: "Nedeľné školy" # todo: NEW TRANSLATION
 sunday_schools_advance_desc: "Vzdelávanie ľudu je dôležitou súčasťou našich náboženských povinností. Mali by sme zriadiť školy úzko späté s liturgickými službami, aby poskytovali základné vzdelanie nášmu zboru." # todo: CHANGED
 res_publica_christiana: "Univerzálna $christian$" # todo: CHANGED
 res_publica_christiana_desc: "Musíme usilovať o dobré vzťahy s našimi spoluviernymi $christian_ADJ$ všetkých denominácií, aj keď niektoré ich praktiky považujeme za herézu." # todo: CHANGED
 roman_orthodoxy: "Rímska ortodoxia" # todo: NEW TRANSLATION
 roman_orthodoxy_desc: "Pravovernosť rímskokatolíckej $catholic_ADJ$ viery a jej doktrín musí zostať nepochybná, aby sa jej autorita upevnila v mysliach našich ľudí." # todo: CHANGED
 marian_devotion: "Oddanosť Panne Márii" # todo: NEW TRANSLATION
 marian_devotion_desc: "Naše oddanie Panne Márii musí zostať centrálnym pilierom našej uctievania." # todo: CHANGED
 crusading_knights: "Zkušenosti z baltského križiackeho ťaženia" # todo: CHANGED
 crusading_knights_desc: "V tejto krajine máme dlhú tradíciu posielať našich najlepších rytierov a aristokratov šíriť pravú vieru pohanom v $baltic_region$ a Stredomorí. Splníme našu $christian_ADJ$ misiu priniesť vieru nesvieteným a zároveň získať skúsených veliteľov pre naše armády." # todo: CHANGED
 catholic_pilgrimages: "$catholic_ADJ$ pútnici" # todo: CHANGED
 catholic_pilgrimages_desc: "Sväté miesta našej viery by mali byť navštívené každým veriacim. Podporovanie pútníc a povyšovanie tých, čo proces prešli, by malo byť prioritou našej správy." # todo: CHANGED
 inquisition_advance: "Inkvizícia" # todo: NEW TRANSLATION
 inquisition_advance_desc: "Inkvizícia vznikla v 12. storočí ako prostriedok boja proti katarom, no jej vplyv rástol v neskorom stredoveku ako hlavný nástroj $catholic_ADJ$ Cirkvi proti šíreniu disidentských doktrín." # todo: CHANGED
 preaching_friars: "Putujúci kazatelia" # todo: CHANGED
 preaching_friars_desc: "Putujúci františkáni a dominikáni vyšli zo stien kláštorov k ľudu a kážu priamo medzi nimi. Podporovaním a verejným chválením ich služby môžeme posilniť náboženské presvedčenie v celej ríši, aj medzi najodľahlejšími roľníkmi." # todo: CHANGED
 devotio_moderna: "Devotio Moderna" # todo: NEW TRANSLATION
 devotio_moderna_desc: " #italic Devotio Moderna#!, alebo moderné devóčne hnutie, rýchlo získava popularitu medzi veriacimi. Mali by sme do nášho dvora implementovať niektoré z ich učených prvkov, aby sme pôsobili obzvlášť zbožne." # todo: CHANGED
 denounce_heretics: "Udávanie heretikov" # todo: CHANGED
 denounce_heretics_desc: "Musíme zaistiť nadradenosť jednej pravdivej viery a odsudzovať všetku kritiku ako najhorkejšiu herézu." # todo: CHANGED
 beguins_and_beghards: "Laické náboženské rády" # todo: NEW TRANSLATION
 beguins_and_beghards_desc: "Mnohí verní sa vydali na život modlitby a dobrých skutkov, ktorý často sprevádza nošenie závoja alebo vstup do kláštora. Nebrali si však formálne sľuby a konajú bez oficiálneho $PAP_ADJ$ schválenia. Napriek tomu by sme mali podporovať tieto ľudové snahy konať dobro." # todo: CHANGED
 conquistador_advance: "Konquistádori" # todo: NEW TRANSLATION
 conquistador_advance_desc: "Objav Nového sveta priťahuje dobrodruhov všetkého druhu k riskantným výpravám s prísľubom neporovnateľného bohatstva, slávy a moci. Tieto expedície sú formalizované dohodami medzi vodcami expedícií a vládou, právne známe ako 'kapitulácie dobytia'." # todo: CHANGED
 grand_display_of_faith: "Veľkolepé prejavy viery" # todo: NEW TRANSLATION
 grand_display_of_faith_desc: "Aby sme vzdali Bohu hold, musíme postaviť veľké monumenty v Jeho mene. Toto nielen ukáže našu oddanosť, ale aj predvedie schopnosti našich sochárov a architektov." # todo: CHANGED
 monastery_productions: "Mníšska skromnosť" # todo: CHANGED
 monastery_productions_desc: "Svätí obyvatelia našich kláštorov sú stĺpom rozumného, šetrného života. Mali by sa naše kňazstvo zamyslieť nad prispôsobením svojho životného štýlu tomu mníškemu, aby vyzerali skromnejšie." # todo: CHANGED
 reform_church_music: "Reformovaná cirkevná hudba" # todo: CHANGED
 reform_church_music_desc: "Musíme prijať navrhované reformy liturgickej hudby. Zriedené, bezduché melódie, ktoré sú v móde, už nie sú uspokojujúcim vyjadrením slávy božej." # todo: CHANGED
 frequent_councils: "Časté koncily" # todo: NEW TRANSLATION
 frequent_councils_desc: "Navrhuje sa, že častejšie konanie náboženských koncilov by zabraňovalo hnilobe teologických sporov. Aj keď nemáme úplnú kontrolu nad kúriou, môžeme aspoň využiť náš vplyv a povzbudzovať pravidelné synody, ktoré riešia relevantné otázky skôr, než prerastú do krízy." # todo: CHANGED
 mendicant_orders: "Žobravé rády" # todo: NEW TRANSLATION
 mendicant_orders_desc: "Rády, ktoré si zobrali sľub chudoby a žijú putovne, priniesli pomoc do mnohých odľahlých častí našej krajiny. Mali by sme podporovať ich snahy bez narušenia ich svätých misií." # todo: CHANGED
 exsurge_domine: "Exsurge Domine" # todo: NEW TRANSLATION
 exsurge_domine_desc: "Aby sme vyhubili zlo herézy, Pán sám povstane a vyčistí ich z našich krajín!" # todo: NEW TRANSLATION
 confutatio_augustana: "Vyvrátiť falošné vyznania" # todo: NEW TRANSLATION
 confutatio_augustana_desc: "V týchto búrlivých časoch musíme jasne definovať ortodoxnú $christian_ADJ$ doktrínu a systematicky vyvracať falošné presvedčenia, ktoré ohrozujú duše našich ľudí." # todo: CHANGED
 roman_catechism: "Rímsky katechizmus" # todo: NEW TRANSLATION
 roman_catechism_desc: "Naše kňazstvo musí prijať oficiálny Rímsky katechizmus ako svoj návod k vyučovaniu. Tento text zlepší vzdelanie kňazov a zaistí, že iba konzistentné, ortodoxné učenia sú odovzdávané veriacim." # todo: CHANGED
 oversea_missions: "Zámorské misie" # todo: NEW TRANSLATION
 oversea_missions_desc: "Náš klérus je pripravený a ochotný šíriť našu vieru do nových zámorských území. S ich príspevkom bude osídľovanie nových krajín jednoduchšie a lacnejšie." # todo: NEW TRANSLATION
 baptism_books: "Knihy krstov" # todo: NEW TRANSLATION
 baptism_books_desc: "Musíme potvrdiť krst ako dôležitý kameň našej viery vedením starostlivých záznamov o tom, kto v populácii bol alebo ešte nebol pokrstený." # todo: CHANGED
 second_scholasticism: "Druhá $scholasticism$" # todo: NEW TRANSLATION
 second_scholasticism_desc: "Budeme musieť oživiť a prepracovať filozofické hnutie stredovekej scholastiky." # todo: NEW TRANSLATION
 catholic_sunday_schools: "$sunday_schools_advance$" # todo: NEW TRANSLATION
 catholic_sunday_schools_desc: "$sunday_schools_advance_desc$" # todo: NEW TRANSLATION
 index_librorum_prohibitorum: "Index zakázaných kníh" # todo: NEW TRANSLATION
 index_librorum_prohibitorum_desc: "Nebezpečné myšlienky reformácie sa budú šíriť ako jedovatý pleseň v mysliach našich poddaných, ak budú mať prístup k textom propagujúcim tieto bludy! Musíme zakázať určité nebezpečné diela a viesť komplexný zoznam kníh, ktoré sú zakázané." # todo: CHANGED
 catholic_cuius_regio_eius_religio: "Cuius Regio, Eius Religio" # todo: NEW TRANSLATION
 catholic_cuius_regio_eius_religio_desc: "#italic Čie panstvo, toho náboženstvo.#! Musíme akceptovať, že iné krajiny nasledujú iné vierovyznania a že to môže byť kľúčovým faktorom v diplomacii." # todo: CHANGED
 embellish_baroque_art: "Podporovať barokové umenie" # todo: CHANGED
 embellish_baroque_art_desc: "Naša viera má dlhú tradíciu sponzorovania a podpory veľkých umeleckých diel. Nádherný nový barokový štýl odráža patos a slávu našej teológie a mal by sa osobitne podporovať." # todo: CHANGED
 national_churches: "Národná cirkev" # todo: NEW TRANSLATION
 national_churches_desc: "Štát musí prevziať väčšiu kontrolu nad Cirkvou v našej krajine. Nemôžeme dovoliť cudzím entitám vyvíjať neprimeraný vplyv na našu cirkevnú správu; Cirkev musí slúžiť najprv našej ríši." # todo: CHANGED
 entrenched_church: "Zakotvená cirkev" # todo: NEW TRANSLATION
 entrenched_church_desc: "Nezáleží na tom, aký národ ovládame, Cirkev poskytuje spôsob, ako dodať ľuďom jednotnú štruktúru." # todo: CHANGED
 catholic_enlightenment: "$catholic_ADJ$ Osvietenstvo" # todo: CHANGED
 catholic_enlightenment_desc: "Aby naša viera odolala útokom Osvietenia, musíme sa prispôsobiť a prezentovať nové perspektívy v rámci Cirkvi." # todo: CHANGED
 divine_church_music: "Božská cirkevná hudba" # todo: NEW TRANSLATION
 divine_church_music_desc: "Mnohí z našich skladateľov vytvorili svoje najväčšie diela vďaka inšpirácii vierou. Aktívne by sme mali hľadať najtalentovanejších umelcov a ihneď ich zamestnať, aby naše kostoly a katedrály nikdy neutrpeli hudobnú menejcennosť." # todo: CHANGED
 continue_missionary_works: "Misionárska činnosť" # todo: NEW TRANSLATION
 continue_missionary_works_desc: "Misie šíriace našu vieru do vzdialených kútov sveta nikdy nemôžu byť považované za dokončené. Musíme sponzorovať viac misií, aby sme ďalej prinášali svetlo $catholic$ tým neosvetleným dušiam." # todo: CHANGED
 protestant_invite_persecuted: "Privítať neprivítaných" # todo: CHANGED
 protestant_invite_persecuted_desc: "Kým my sme našli svetlo pravej viery, mnohí naši bratia trpia pod utláčaním bludných pohanov. Mali by sme ich pozvať usadiť sa v našich krajinách, kde môžu slobodne vyznávať vieru a — čo je dôležitejšie — prispieť do nášho pokladca." # todo: CHANGED
 protestant_administration_tax: "Efektívni vyberači daní" # todo: NEW TRANSLATION
 protestant_administration_tax_desc: "Predtým niesli klerici značnú časť daňového zaťaženia. Aj keď niektoré z týchto štruktúr boli po reformácii rozbité, schopní obyvatelia stále zostávajú a musia pomôcť doplniť chýbajúce cirkevné príjmy." # todo: CHANGED
 confessio_augustana: "Nové vyznanie" # todo: NEW TRANSLATION
 confessio_augustana_desc: "Reformácia nám dáva príležitosť definovať nový vyznanie pre náš ľud a, čo je dôležitejšie, prijať kritiku a podľa nej robiť úpravy." # todo: CHANGED
 devotionalism: "Zbožnosť" # todo: NEW TRANSLATION
 devotionalism_desc: "Musíme oživiť augustínske učenie a uznať, že naše presvedčenia sú postavené na emóciách a horlivosti veriacich." # todo: CHANGED
 protect_the_new_faith: "Štít viery" # todo: NEW TRANSLATION
 protect_the_new_faith_desc: "Naša viera je obkolesená nepriateľmi. Budeme musieť brániť naše práva na vlastnú konfesiou proti $catholic_ADJ$ utláčateľom." # todo: CHANGED
 expulsion_of_heretics: "Vypudenie heretikov" # todo: NEW TRANSLATION
 expulsion_of_heretics_desc: "Nepokojní heretici v našom panstve by mohli ľahko podnietiť vzburu proti vládcom. Bolo by lepšie presunúť ich do našich zámorských kolónií, kde budú menej škodiť." # todo: CHANGED
 repurposed_monasteries: "Pretransformované kláštory" # todo: NEW TRANSLATION
 repurposed_monasteries_desc: "Bývalé cirkevné majetky zabavené štátom počas národného konverzného procesu môžu slúžiť teraz novým spôsobom, napríklad ako centrá výroby alebo administrácie." # todo: CHANGED
 involved_laity: "Zapojení laici" # todo: NEW TRANSLATION
 involved_laity_desc: "Vďaka väčšiemu zapojeniu laikov do každodennej správy našej cirkvi si ľudia našli osobnejší vzťah k viere." # todo: NEW TRANSLATION
 protestant_cuius_regio_eius_religio: "$catholic_cuius_regio_eius_religio$" # todo: NEW TRANSLATION
 protestant_cuius_regio_eius_religio_desc: "$catholic_cuius_regio_eius_religio_desc$" # todo: NEW TRANSLATION
 protestant_painters: "Protestantské umenie" # todo: NEW TRANSLATION
 protestant_painters_desc: "Reformácia dala našim umelcom príležitosť preskúmať nové témy, oslobodené od povinného bohoslužobného motívu. Zamestnávaním viacerých z týchto umelcov získame reputáciu veľkého mecenáša umenia." # todo: CHANGED
 protestant_sunday_schools: "$sunday_schools_advance$" # todo: NEW TRANSLATION
 protestant_sunday_schools_desc: "$sunday_schools_advance_desc$" # todo: NEW TRANSLATION
 protestant_work_ethic: "Pilní pracovníci" # todo: NEW TRANSLATION
 protestant_work_ethic_desc: "Vplyv puritánskych a pietistických kazateľov na reformáciu je nepopierateľný. Ich dôraz na cnosti ako pracovitost a šetrnosť nám pomôže vypestovať pracovité a oddané pracovné sily." # todo: CHANGED
 embrace_romanticism: "Prijať romantizmus" # todo: NEW TRANSLATION
 embrace_romanticism_desc: "Po ére Osvietenia nesmieme zabudnúť na silu emócií a predstavivosti. Prijatie romantizmu, ktorý oslavuje prírodu, folklór a národný charakter, podnieti umelcov vytvárať diela, ktoré dojmu dušu." # todo: CHANGED
 wary_of_heretic_preachers: "Obrana proti heretickým kazateľom" # todo: CHANGED
 wary_of_heretic_preachers_desc: "Budeme musieť byť ostražití voči silám, ktoré sa snažia obrátiť náš ľud alebo ho zviesť späť k predchádzajúcej viere. Verejným označením týchto kazateľov za škodlivých a nepriateľských pripravíme svoj ľud na ich interakcie a ľahšie upevníme náboženskú ortodoxiu." # todo: CHANGED
 protestant_innovation: "Protestantské inovácie" # todo: NEW TRANSLATION
 protestant_innovation_desc: "Od zakladateľských dní našej viery sme zdôrazňovali hodnotu spochybňovania zaužívaných doktrín. Tie isté etiky by sme mali aplikovať aj v iných oblastiach bádania." # todo: CHANGED

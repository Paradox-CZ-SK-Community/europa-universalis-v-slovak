 railroad_advance_desc: "$railroad_desc$" # todo: NEW TRANSLATION
 power_projection_advance_6: "Globálne ambície" # todo: NEW TRANSLATION
 power_projection_advance_6_desc: "Konsolidácia krajín do väčších štátov viedla k vzniku veľmocí, ktoré dominujú rozsiahlym územiam a majú úmysel svoju moc ďalej rozširovať." # todo: CHANGED
 enlightened_court: "Osvietený dvor" # todo: NEW TRANSLATION
 enlightened_court_desc: "Hodnoty Osvietenia sú prítomné v každom modernom dvore a s nimi prichádzajú najinteligentnejší a najučenliví ľudia. Vďaka týmto osvieženým dvoranom dokážeme oveľa viac s menším úsilím." # todo: CHANGED
 government_size_revolutions: "Moderné zastúpenie" # todo: NEW TRANSLATION
 government_size_revolutions_desc: "Zavedením oficiálnych foriem ľudového zastúpenia je vláda schopnejšia než kedykoľvek predtým riešiť dôležité otázky." # todo: CHANGED
 global_supply_limit_modifier_advance_6: "Plánovanie logistiky kampaní" # todo: NEW TRANSLATION
 global_supply_limit_modifier_advance_6_desc: "Plánovanie logistiky vojny je čoraz zložitejšie, keďže rast priemernej veľkosti armády umožňuje nasadzovať niekoľko armád súčasne pre dlhodobé kampane, zahŕňajúce stovky tisíc vojakov na niekoľko rokov." # todo: CHANGED
 rgo_size_advance_revolutions: "Parný stroj" # todo: NEW TRANSLATION
 rgo_size_advance_revolutions_desc: "Parná energia ako pohon stroja bola známa už od dávna, no jej potenciál nebol úplne využitý až donedávna, keď pokrok vo fyzike a matematike umožnil vytvoriť sofistikovanejšie parné stroje, ktoré poháňajú zložitejšie stroje. To zvyšuje produktivitu vo všetkých odvetviach." # todo: CHANGED
 military_tactics_advance_6: "Poľné delostrelectvo" # todo: NEW TRANSLATION
 military_tactics_advance_6_desc: "S delostrelectvom dosť mobilným na sprevádzanie armády na bojisku už jeho vplyv nie je obmedzený len na dosah paľby. Polonezávislé delostrelecké formácie vedené dôstojníkmi môžu byť nasadené tam, kde sú najviac potrebné." # todo: CHANGED
 road_advance_2: "Základné cesty" # todo: NEW TRANSLATION
 road_advance_2_desc: "Postavili sme primitívne cesty, no tie nám rýchlo ukazujú, prečo treba rozvíjať dopravné systémy. Rozšírením cestnej siete budeme schopní ľahšie distribuovať tovar v rámci nášho územia." # todo: CHANGED
 written_alphabet: "Písomná abeceda" # todo: NEW TRANSLATION
 written_alphabet_desc: "Čo je spoločnosť, ak nie súbor jej odkazu? Písmená teda predstavujú prvý krok k storočnému zachovaniu našej kultúry a zároveň základ pre vybudovanie vzdelanej, fungujúcej spoločnosti." # todo: CHANGED
 codified_laws: "Kodifikované zákony" # todo: NEW TRANSLATION
 codified_laws_desc: "Štatúty a predpisy sú chrbtovou kosťou každej fungujúcej spoločnosti. Ak chceme zlepšiť efektivitu a vnútorné schopnosti, súbor robustne kodifikovaných zákonov je nevyhnutný." # todo: CHANGED
 taxation_advance: "Zdanenie" # todo: NEW TRANSLATION
 taxation_advance_desc: "Prevádzka civilizovanej spoločnosti implikuje údržbu centrálnej autority, ktorá musí byť podporovaná menou. Vyberaním daní od našich poddaných a občanov budeme produktívnejší a schopnejší dosiahnuť veľké veci pre náš ľud." # todo: CHANGED
 state_administration_advance: "Štátna správa" # todo: NEW TRANSLATION
 state_administration_advance_desc: "Zdanenie populácie je možné len dovtedy, kým vieme, kto žije kde a aké miestne zvyklosti a zákony sa uplatňujú na jednotlivcov. Musíme zriadiť komplexnú administratívu na správne riadenie ríše." # todo: CHANGED
 agriculture_advance: "Poľnohospodárstvo" # todo: NEW TRANSLATION
 agriculture_advance_desc: "Pôda je štedrá a poskytuje nám bohatú úrodu a zdroje. Aby sme však pokročili a stali sa prosperujúcim národom, musíme sa naučiť formovať a skrotiť pôdu a vyťažiť z nej to najlepšie." # todo: CHANGED
 city_building_advance: "Budovanie miest" # todo: NEW TRANSLATION
 city_building_advance_desc: "Rozvoj našich mestských centier sa stal jadrom národného blahobytu a kameňom urbanizačného hnutia. Systematickou výstavbou infraštruktúry a špecializovaných budov vo mestách podporíme náš hospodársky rast." # todo: CHANGED
 road_building: "Výstavba ciest" # todo: NEW TRANSLATION
 road_building_desc: "Preprava tovaru, vojska a ľudí je životne dôležitá pre prežitie národa. Vybudovaním základnej cestnej siete aspoň prepojíme ľudí a uľahčíme im každodenné činnosti." # todo: CHANGED
 ship_building_advance: "Stavba lodí" # todo: NEW TRANSLATION
 ship_building_advance_desc: "More skrýva mnohé dobrodružstvá, bohatstvo a obchodné — ako aj expanzné — príležitosti." # todo: CHANGED
 mapmaking: "Kartografia" # todo: NEW TRANSLATION
 mapmaking_desc: "Presné zakresľovanie hraníc a orientačných bodov krajiny je viac než umenie — pomáha nám zbierať informácie o iných národoch pre strategické účely. Poznanie presného umiestnenia dôležitých miest nám umožní lepšie koordinovať útoky a získať viac poznatkov o vlastnom území. Ako hovoria starší: vedomosti sú moc." # todo: CHANGED
 standardized_coins: "Štandardizované mince" # todo: NEW TRANSLATION
 standardized_coins_desc: "S narastajúcim bohatstvom vzniká viac mincí. Kým sme dlhé roky žili s rôznymi menami, musia sa stanoviť oficiálne štandardy, aby sme predišli podvodom znižovaním obsahu drahých kovov alebo ostrihaním okrajov mincí." # todo: CHANGED
 humanism_ideas: "Humanizmus" # todo: NEW TRANSLATION
 humanism_ideas_desc: "Pokladajúc človeka za stred všetkého, prijímame povinnosť prenasledovať neznáme a využiť danú inteligenciu na odhaľovanie tajomstiev nášho sveta. Vzdelávaním nášho ľudu zabezpečíme ich slobodu, slobodnú vôľu a zodpovednosť za vlastné skutky. Využijeme starodávne poznanie na ďalší rozvoj ľudstva a poučíme sa rovnako z úspechov ako aj zlyhaní našich predkov." # todo: CHANGED
 legalism_advance: "Legalizmus" # todo: NEW TRANSLATION
 legalism_advance_desc: "Zákony a pravidlá nič neznamenajú, ak nie sú zostavené, štandardizované a sprístupnené každému členovi spoločnosti. Kodifikáciou jasných právnych noriem a ich rovnomerným vynucovaním zabezpečíme, že princípy poriadku a spravodlivosti dosiahnu najvzdialenejšie kúty ríše." # todo: CHANGED
 meritocracy_advance: "Meritokracia" # todo: NEW TRANSLATION
 meritocracy_advance_desc: "Zásluhy nie sú výhradou elitnej vrstvy. Nájdeme ich všade, aj medzi najskromnejšími jednotlivcami. Vytvorením štandardizovaných skúšok, ktoré merajú zásluhy, snahu a všeobecnú schopnosť, dokážeme objaviť skryté intelektuálne perly a primerane ich dosadiť pre dobro národa." # todo: CHANGED
 cathedral_advance: "Katedrála" # todo: NEW TRANSLATION
 cathedral_advance_desc: "Katedrála je jedným z najväčších a najdôležitejších typov $christian_ADJ$ chrámov, kde má biskup #italic cathedra#!, teda sedadlo. Kým kostol môže byť pekný a zdobený, katedrála je majestátna, obrovských rozmerov a vyzdobená najjemnejšími detailami." # todo: CHANGED
 infiltrate_administration: "[infiltrate_administration|e]" # todo: NEW TRANSLATION
 supportrebels: "[support_rebels|e]" # todo: NEW TRANSLATION
 infiltrate_administration_advance: "Infiltrácia administrácie" # todo: NEW TRANSLATION
 infiltrate_administration_advance_desc: "Konflikty s inými štátmi sa nevedú len na bojisku, ale aj v tieňoch. Poznať ďalší ťah nepriateľa je neoceniteľný majetok pri snahách o víťazstvo. Naši špióni sa špecializujú na infiltrovanie štátnych administrácií a predkladajú nám všetky relevantné informácie, ktoré získajú." # todo: CHANGED
 newspapers_advance: "Noviny" # todo: NEW TRANSLATION
 newspapers_advance_desc: "Koncept oznamovania alebo vyvesovania oznámení na verejne čítanie nie je nový. Avšak s rozšírením $printing_press$ rastie dopyt po prístupných informáciách o politike, vojne a hospodárstve. Noviny — periodické vydanie popisujúce aktuálne udalosti — tento dopyt uspokoja." # todo: CHANGED
 feudal_de_jure_law_advance: "$feudal_de_jure_law$" # todo: NEW TRANSLATION
 feudal_de_jure_law_advance_desc: "#italic De jure#! — 'podľa zákona' — opisuje právne uznávané praktiky bez ohľadu na skutočnosť ich uplatňovania. Systémy feudálnej spoločnosti stoja práve na tomto koncepte." # todo: CHANGED
 semi_salic_law_advance: "$semi_salic_law$" # todo: NEW TRANSLATION
 semi_salic_law_advance_desc: "Pod právom $salic_law$ majú dedičstvo po tróne výlučne muži. Táto prax vedie k následníckym krízam, keď mužská línia vymrie a monarchia upadá do chaosu. Aby sme predišli takýmto otrasom, rozšírime práva žien o možnosť nastúpiť na trón, ak neexistuje vhodný mužský dedič." # todo: CHANGED
 republican_foundation_law_advance: "$republican_foundation_law$" # todo: NEW TRANSLATION
 republican_foundation_law_advance_desc: "$republican_foundation_law_desc$" # todo: NEW TRANSLATION
 republican_election_law_advance: "$republican_election_law$" # todo: NEW TRANSLATION
 republican_election_law_advance_desc: "$republican_election_law_desc$" # todo: NEW TRANSLATION
 republican_electorate_law_advance: "$republican_electorate_law$" # todo: NEW TRANSLATION
 republican_electorate_law_advance_desc: "$republican_electorate_law_desc$" # todo: NEW TRANSLATION
 republican_power_law_advance: "$republican_power_law$" # todo: NEW TRANSLATION
 republican_power_law_advance_desc: "$republican_power_law_desc$" # todo: NEW TRANSLATION
 principle_of_administration_law_advance: "Zákon o princípoch správy" # todo: NEW TRANSLATION
 principle_of_administration_law_advance_desc: "Prirodzená evolúcia našej zložitej vlády diktuje prijatie nových zákonov vzťahujúcich sa na administratívu." # todo: CHANGED
 monarchy_reform_traditions_advance: "Tradičné reformy monarchie" # todo: NEW TRANSLATION
 monarchy_reform_traditions_advance_desc: "Autorita nesmie byť zverená len komukoľvek. Koncentrácia moci a vplyvu do rúk panovníka pomôže vytvoriť poriadok a stabilitu po celej ríši." # todo: CHANGED
 republic_reform_traditions_advance: "Tradičné reformy republiky" # todo: NEW TRANSLATION
 republic_reform_traditions_advance_desc: "Rozptyl moci je kľúčovým presvedčením každej zdravej republiky. Silné zákony vynucujúce voľby losovaním zabezpečia stabilitu a znížia korupciu." # todo: CHANGED
 blockade_tactics: "Taktika blokády" # todo: NEW TRANSLATION
 blockade_tactics_desc: "Používanie efektívnych formácií a hliadok v blízkosti nepriateľských prístavov nám uľahčí odrezanie ich zásobovacích liniek a skráti obliehania." # todo: CHANGED
 recovery_efforts: "Obnovné snahy" # todo: NEW TRANSLATION
 recovery_efforts_desc: "Vojna je krutá vytrvalá, ktorá zanecháva len spúšť a skazu. Sústreďovaním úsilia na pomoc našim ľuďom pri návrate k bežnému životu po takom utrpení môžeme urýchliť obnovu v celej ríši." # todo: CHANGED
 naval_initiative_ren: "Taktika rozmiestnenia" # todo: NEW TRANSLATION
 naval_initiative_ren_desc: "Pravda je, že víťazstvo často patrí tomu, kto prvý zaútočí. Náležitým štúdiom a účinným nasadzovaním taktik rozmiestnenia môžeme rýchlo mobilizovať a získať iniciatívu v boji, čo nám pomôže dosiahnuť víťazstvo." # todo: CHANGED
 army_initiative_ren: "Prvý úder" # todo: NEW TRANSLATION
 army_initiative_ren_desc: "Prvok prekvapenia v spojení s prvým úderom často rozhoduje o konečnom víťazovi ozbrojeného konfliktu. Zvýšenie vojenskej iniciatívy je vynikajúci spôsob, ako si udržať konkurenčnú výhodu." # todo: CHANGED
 law_making_renaissance: "Právne preskúmanie" # todo: NEW TRANSLATION
 law_making_renaissance_desc: "Nové časy prinášajú nové situácie a zákony, ktoré platili celé generácie, nemusia byť aplikovateľné v týchto nových kontextoch. Mali by sme poveriť právnych expertov neustálym prehodnocovaním a revidovaním zákonov, aby sme ich prispôsobili súčasným potrebám." # todo: CHANGED
 subject_integration: "Konsolidácia titulov" # todo: NEW TRANSLATION
 subject_integration_desc: "Aj keď môže byť užitočné mať mnoho krajín slúžiacich nám, len zhromaždením ich rôznych titulov pod naším menom budeme vedieť najlepšie využiť ich zdroje. Nakoniec je jasné, že vládca s jediným titulom bude blednúť v porovnaní s nami a naším nádherným súborom imponujúcich titulov." # todo: CHANGED
 rgo_construction_ren: "Úsilie o infraštruktúru" # todo: NEW TRANSLATION
 rgo_construction_ren_desc: "Naša krajina nie je nič bez svojej pôdy a ľudu. Zlepšenie infraštruktúry národa prospeje obyčajným ľuďom rovnako ako nám." # todo: CHANGED
 naval_repair_ren: "Tesnejšie spoje" # todo: NEW TRANSLATION
 naval_repair_ren_desc: "Každý vie, že diera v trupe lode nevyhnutne vedie k jej potopeniu. So zdokonalenými stavebnými technikami môžeme vytvoriť trup s tesnejšie spojenými doskami, čo zníži náchylnosť k úniku vody a uľahčí opravy trupu." # todo: CHANGED
 linked_armies_advance: "Prenos správ" # todo: NEW TRANSLATION
 linked_armies_advance_desc: "Dobrá koordinácia medzi rôznymi jednotkami armády je kľúčová pre jej fungovanie. Mať organizovaný systém na odovzdávanie správ medzi generálmi a dôstojníkmi jednotiek umožní všetkým vojakom pracovať súdržnejšie a rýchlejšie reagovať na situácie." # todo: CHANGED
 regular_levy_training: "Priradený výcvik" # todo: NEW TRANSLATION
 regular_levy_training_desc: "Ľudové oddiely nie sú z definície najlepšie vycvičené, no to neznamená, že im musíme posielať nezáživné zástupy na vojnu. Priradením náležitých inštruktorov z našich najzrušnejších jednotiek im umožníme učiť sa od najlepších, a povinné výcvikové obdobie ich urobí pripravenými — a odhodlanými — bojovať." # todo: CHANGED
 court_accounting: "Dvorové účtovníctvo" # todo: NEW TRANSLATION
 court_accounting_desc: "Dvor je symbolom nášho štátu a jeho prosperita bude predstavovať prosperitu národa. To však neznamená, že dvor môže míňať viac, než si krajina môže dovoliť; musí tu byť riadny dohľad nad výdavkami dvora." # todo: CHANGED
 lead_ore_dressing: "Úprava olovenej rudy" # todo: NEW TRANSLATION
 lead_ore_dressing_desc: "Procesom úpravy sa olovená ruda umýva a drví, aby sa odstránili nečistoty a oddelila ruda od horniny, ílu a iných minerálov." # todo: CHANGED
 bole_smelting: "Bole tavenie" # todo: NEW TRANSLATION
 bole_smelting_desc: "Metóda, pri ktorej sa olovo taví na otvorenom priestranstve pomocou stále silných vetrov na vrchoch kopcov, ktoré vháňajú čerstvý vzduch do taveniny." # todo: CHANGED
 cupola_smelting: "Tavenie v kopuli" # todo: NEW TRANSLATION
 cupola_smelting_desc: "Použitím valcovej pece poskytuje táto metóda lacný a efektívny proces tavenia železa s jedinečnou schopnosťou kontinuálneho tavenia." # todo: CHANGED
 faster_levy_recruitment: "Povinný výcvik so zbraňou" # todo: NEW TRANSLATION
 faster_levy_recruitment_desc: "Všetci muži roľníci sú povinní ovládať kopiju alebo luk a pravidelne cvičiť, aby boli schopní vojaci, keď budú povolaní." # todo: CHANGED
 merchant_power_from_maritime_discovery_advance: "Obchodnícke cechy" # todo: NEW TRANSLATION
 merchant_power_from_maritime_discovery_advance_desc: "Bratrstvá obchodníkov umožňujú našim kupcom organizovať sa, zdieľať informácie o výnosných obchodných trasách a spájať sily pri nákupe a predaji na zahraničných trhoch." # todo: CHANGED
 merchant_power_from_maritime_reformation_advance: "Obchodné spoločnosti" # todo: NEW TRANSLATION
 merchant_power_from_maritime_reformation_advance_desc: "Rozšírenie trhov za morom — s prislúchajúcimi nákladmi a rizikami — si vyžaduje vytvorenie obchodných združení, ktoré zdieľajú bremeno obchodu v týchto nových krajinách." # todo: CHANGED
 merchant_power_from_maritime_absolutism_advance: "Obchodná komora" # todo: NEW TRANSLATION
 merchant_power_from_maritime_absolutism_advance_desc: "S nástupom nových ideí o obchode a ekonomike sa miestne podniky spojili do obchodnej siete, ktorá môže presadzovať ich záujmy a chrániť ich práva proti politickým vplyvom a zahraničiu." # todo: CHANGED
 paper_guild_fiber_pulp_maintenance_advance: "$paper_guild_fiber_pulp_maintenance$" # todo: NEW TRANSLATION
 paper_guild_fiber_pulp_maintenance_advance_desc: "Využitím vláknitých rastlín ako konope alebo morušového papiera sa výroba papiera stane dostupnou po celom svete. Hoci je lacná na výrobu, tento papier postráda kvalitu." # todo: CHANGED
 paper_guild_cloth_maintenance_advance: "$paper_guild_cloth_maintenance$" # todo: NEW TRANSLATION
 paper_guild_cloth_maintenance_advance_desc: "$paper_guild_cloth_maintenance$, vyrobený z bavlny nevhodnej na spracovanie alebo iné použitie, nastavuje nové štandardy kvality a trvácnosti." # todo: CHANGED
 paper_guild_wood_pulp_maintenance_advance: "$paper_guild_wood_pulp_maintenance$" # todo: NEW TRANSLATION
 paper_guild_wood_pulp_maintenance_advance_desc: "Použitím bežne dostupného ihličnatého dreva bude výroba papiera jednoduchšia a lacnejšia než kedykoľvek predtým." # todo: NEW TRANSLATION
 cannon_guild_steel_maintenance_advance: "Oceľové delové hlavne" # todo: NEW TRANSLATION
 cannon_guild_steel_maintenance_advance_desc: "Použitie diel vyrobených z ocele poskytne našej artilérii väčšiu presnosť a dosah bez obetovania mobility." # todo: CHANGED
 firearms_guild_steel_maintenance_advance: "Palné zbrane s oceľovou hlavňou" # todo: NEW TRANSLATION
 firearms_guild_steel_maintenance_advance_desc: "Zavedenie ocele do výroby palných zbraní nám umožní vyrábať spoľahlivejšie zbrane vo väčších množstvách." # todo: CHANGED
 grant_privilege_cost_modifier_renaissance_advance: "Kodifikované privilégiá a povinnosti" # todo: NEW TRANSLATION
 grant_privilege_cost_modifier_renaissance_advance_desc: "Formálnym kodifikovaním spoločenských rolí každého stavu do písomného práva objasníme ich presné privilégiá a povinnosti. Keď sú práva a zodpovednosti jasne definované, každý stav vie, čo mu náleží a čo má poskytovať, a je tak jednoduchšie udeľovať nové privilégiá bez vyvolania rivalít." # todo: CHANGED
 war_no_cb_cost_modifier_renaissance_advance: "Opakujúce sa vojny" # todo: NEW TRANSLATION
 war_no_cb_cost_modifier_renaissance_advance_desc: "Povaha vojny je silne ovplyvnená tým, kto v nej vystupuje. Tí s prevažujúcimi schopnosťami môžu viesť vojnu dlhšie, a preto medzištátne konflikty sú čoraz bežnejšie." # todo: CHANGED
 global_nobles_max_literacy_advance: "Šľachtická literatúra" # todo: NEW TRANSLATION
 global_nobles_max_literacy_advance_desc: "Šľachta postupne mení svoju primárnu funkciu z vojenských bojovníkov na dvoranov v priamej službe panovníka, čo ich vedie dávať väčší význam intelektuálnym záležitostiam než vojenským. To vytvorilo dopyt po pútavej literatúre, ktorá osloví ich aristokratické chute." # todo: CHANGED
 global_burghers_max_literacy_advance: "Obchodnícka literatúra" # todo: CHANGED
 global_burghers_max_literacy_advance_desc: "Členovia našej obchodníckej triedy spoléhajú na svoje zručnosti k obživě, a tieto zručnosti sú vykorenené dôkladným vzdelaním v určitých odboroch. Ich rastúce bohatstvo zvyšuje aj dopyt po literatúre, ktorá rozšíri ich písanú kultúru." # todo: CHANGED
 global_clergy_max_literacy_advance: "Klerikálna literatúra" # todo: NEW TRANSLATION
 global_clergy_max_literacy_advance_desc: "Klerici musia byť písomní vzhľadom na povahu svojej práce, ktorá zahŕňa učenie, interpretáciu a šírenie náboženskej doktríny. Ich duchovné formovanie a celková účinnosť preto silno závisia od prístupu k náboženským textom a výkladom." # todo: CHANGED
 land_morale_recovery_renaissance_advance: "Organizovaný pochod armády" # todo: NEW TRANSLATION
 land_morale_recovery_renaissance_advance_desc: "Správa armád sa stáva čoraz zložitejšou, keď sa menej spoliehajú na ľudové oddiely. Kľúčovým aspektom je zlepšená organizácia armád na pochodoch, čo lepšie pripraví jednotky na prípadný stret." # todo: CHANGED
 merchant_power_from_maritime_renaissance_advance: "Obchodné partnerstvá" # todo: NEW TRANSLATION
 merchant_power_from_maritime_renaissance_advance_desc: "Vzostup dlhodobej obchodnej výmeny prinútil obchodníkov inovovať spôsoby maximalizácie aktivít cez partnerstvá. Najbežnejšie je, že jeden partner investuje peniaze do expedície, kým druhý zabezpečuje cestovanie a obstarávanie tovaru na predaj po návrate." # todo: CHANGED
 merchant_power_from_maritime_revolutions_advance: "Spoločnosti s ručením obmedzeným" # todo: NEW TRANSLATION
 merchant_power_from_maritime_revolutions_advance_desc: "Časté zlyhania privilegovaných spoločností viedli k vzniku nového obchodného modelu: spoločností s ručením obmedzeným, kde ručenie akcionárov je obmedzené na ich počiatočnú investíciu. Táto ochrana pred neobmedzeným dlhom robí takéto partnerstvá menej rizikovými a atraktívnejšími pre investorov." # todo: CHANGED
 send_people_to_colonial_charter_advance: "Nové bohaté krajiny" # todo: NEW TRANSLATION
 send_people_to_colonial_charter_advance_desc: "Nové země znamenajú nové príležitosti — a nové zdroje na vyťaženie. Povzbudzovaním našich ľudí, aby sa usadili za morom a využili bohaté zdroje, získame obrovské výhody." # todo: CHANGED
 send_people_to_the_colonies_advance: "Nové krajiny príležitostí" # todo: NEW TRANSLATION
 send_people_to_the_colonies_advance_desc: "Celý nový svet sa otvára pred nami a naši ľudia snívajú o tom, aký by mohol byť ich život v týchto vzdialených krajinách. Povzbudzujme tieto sny a rozširujme rozprávanie o zlatega slávy v nepreskúmaných územiach, aby naši ľudia radi osídlili tieto kraje pre nás." # todo: CHANGED
 study_institutions_advance: "Zdieľané poznanie" # todo: CHANGED
 study_institutions_advance_desc: "Nie je hanba, že iní vedia to, čo my nie. Avšak nikdy nám neprospeje, ak nič neurobíme pre odstránenie tejto nevedomosti. Aktívnym štúdiom a učením sa z objavov iných môžeme zlepšiť vlastné poznanie sveta." # todo: CHANGED
 reduce_inflations_advance: "Prísna menová kontrola" # todo: NEW TRANSLATION
 reduce_inflations_advance_desc: "Niekto by si mohol myslieť, že ak potrebujeme viac peňazí, stačí raz viac minceť, no to nie je udržateľné ani múdre. Prísnou kontrolou našej mincovne udržíme infláciu na uzde, možno ju aj znížime." # todo: CHANGED
 pop_promote_actions_advance: "Sociálny rebrík" # todo: NEW TRANSLATION
 pop_promote_actions_advance_desc: "Hovorí sa, že chaos je rebrík pre tých, čo hľadajú vyšší status. Pre nás tento rebrík nepramení z chaosu, ale z poriadku, keď systémovo umožňujeme ľuďom zlepšiť svoje spoločenské postavenie cez zásluhy. Nielenže takéto povýšenia povoľujeme, ale aktívne ich podporujeme." # todo: CHANGED
 alleviate_concerns_advance: "Zmierňovanie napätia" # todo: NEW TRANSLATION
 alleviate_concerns_advance_desc: "Žiadna krajina nemá úžitok z neustáleho strachu susedov z jej pohybov. Musíme uplatňovať aktívnu diplomaciu na okamžité zmiernenie akýchkoľvek napätí, aby naši susedia nemali dôvod obávať sa nás." # todo: CHANGED
 counter_espionage_action_advance: "Obmedzený prístup k informáciám" # todo: CHANGED
 counter_espionage_action_advance_desc: "Nemôžeme očakávať dobré výsledky v diplomatickej ani vojenskej oblasti, ak sa naše tajomstvá ľahko prenášajú do rúk cudzích krajín. Musíme pevnejšie kontrolovať tok informácií, aby sme rýchlo zatkli každé možné úniky." # todo: CHANGED
 pacify_population_advance: "Udržať agitátorov na uzde" # todo: NEW TRANSLATION
 pacify_population_advance_desc: "V určitom bode môžu byť ľudia nespokojní s naším vedením — je to takmer nevyhnutné. Tieto mrmlania však nenarastú do vážnych problémov, ak im nedovolíme hniť. Ak aktívne vyhľadáme tých, čo zdvíhajú svoj hlas proti nám, môžeme zadusiť akékoľvek pobúrenie v zárodku, než stihnú zjednotiť ostatných, a tak udržíme obyvateľstvo spokojné. Aspoň čiastočne ak nie úplne." # todo: CHANGED
 nation_state_advance: "Národný štát" # todo: NEW TRANSLATION
 nation_state_advance_desc: "Zjednotenie pod jednou kultúrou a jedným prápom je silná, dojímavá myšlienka. Pestovaním národnej identity zabezpečíme lojalitu našich poddaných a občanov voči našej veci." # todo: CHANGED
 LIV_a_order_knights: "Rytieri Livónskeho rádu" # todo: NEW TRANSLATION
 LIV_a_order_knights_desc: "Náš národ stojí na silných chrbtoch statočných $christian_ADJ$ mužov, ktorí vstúpili do nášho rádu ako rytieri. Ich vojenské schopnosti vykompenzujú naše nízke počty v porovnaní s pohanskými susedmi, rovnako ako aj svetlo a sila našej viery." # todo: CHANGED
 LIV_a_order_knights_2: "Banereti Livónskeho rádu" # todo: NEW TRANSLATION
 LIV_a_order_knights_2_desc: "Rytieri nášho rádu opakovane dokázali svoju odvahu a zručnosť v bitke. Povýšením najspôsobilejších z nich na baneretov zabezpečíme, že naše armády budú vždy vedené tými najlepšími." # todo: NEW TRANSLATION
 wallachian_tradition: "Opevnený národ" # todo: NEW TRANSLATION
 wallachian_tradition_desc: "Naše krajiny sú ohraničené horami a Dunajom, inak sú však pomerne rovné. Bohatá pôda nášho územia sa po prelomení prirodzených bariér stáva diaľnicou pre útočiace armády. Aby sme lepšie ochránili náš ľud, postavíme po celom regióne opevnenia a hrady." # todo: CHANGED
 wallachian_heritage: "História odporu" # todo: NEW TRANSLATION
 wallachian_heritage_desc: "Keďže sme boli v minulosti súčasťou viacerých impérií, náš ľud je odolný bojovník. Každý nepriateľ, ktorý si trúfne napadnúť nás, zaplatí krvou." # todo: CHANGED
 khedivates: "Khediváty" # todo: NEW TRANSLATION
 khedivates_desc: "Veľké impériá sa obyčajne vytvárajú okolo jadrového územia, obklopené vazalskými štátmi s pochybnou lojálnosťou. Mali by sme prijať opatrenia, aby sme tieto štáty udržali pod dohľadom." # todo: CHANGED
 french_tradition: "La Cour de $FRA$" # todo: CHANGED
 french_tradition_desc: "Naše diplomatické manévre sú preslávené svojou komplexnosťou a šikovnosťou a naši zruční vyslanci sú napodobňovaní po celom kontinente. Len blázon by sa teraz uspokojil — ďalej zdokonaľujme diplomaciu opatreniami, ako sú siete informátorov a umenie rokovania. Nech iné krajiny lomcujú starými technikami, kým my budeme pioniermi zajtrajška." # todo: CHANGED
 french_heritage: "Rytierna šľachta" # todo: NEW TRANSLATION
 french_heritage_desc: "Šľachta našej krajiny vždy poskytovala najlepších vojakov pre naše armády. Ich dobre vycvičení bojovníci budú slúžiť národu a porazí našich nepriateľov v mene spravodlivej slávy!" # todo: CHANGED
 french_ambition: "Veľká armáda" # todo: NEW TRANSLATION
 french_ambition_desc: "V porovnaní s našimi protivníkmi je naša potreba vojenských reforiem bolestivo zrejmá. Zavedením moderných výcvikových techník môžeme premeniť naše vojsko na disciplinovanú silu schopnú zničiť každého protivníka v boji." # todo: CHANGED
 english_tradition: "Leví srdcia" # todo: NEW TRANSLATION
 english_tradition_desc: "Statečnosť a disciplína $ENG_ADJ$ peších bola svedkom od štítových stien $northumbria_area$ po temné oblohy $FRA$. Inšpirovaní levím srdcom našich kráľov a stoicizmom obyčajných ľudí, naša pechota bojuje s divokosťou anglosaských bojovníkov predkami." # todo: CHANGED
 english_heritage: "Náš ostrovný domov" # todo: NEW TRANSLATION
 english_heritage_desc: "Náš ostrov nás chráni pred vonkajšími nepriateľmi, ale to nebude stačiť, ak nebudeme chrániť okolitú vodu. Majúc majstrovskú kontrolu nad našimi moriami udržíme pevné panovanie nad tými, čo ohrozujú našu krajinu." # todo: CHANGED
 english_ambition: "Páni vĺn" # todo: NEW TRANSLATION
 english_ambition_desc: "Obrovská námorná prítomnosť je nevyhnutná pre každú krajinu snažiacu sa ovládať vody. Naša flotila bude taká hrozivá, že pobrežia našich nepriateľov budú vždy obkolesené našimi plavidlami." # todo: NEW TRANSLATION
 omani_tradition: "$OMA$ záliv" # todo: NEW TRANSLATION
 omani_tradition_desc: "Naša krajina leží pri rozľahlých a nepriateľských púšťach $arabia_region$, no more na našom východe nám umožňuje ich obchádzať. Práve po mori, nie po zemi, budeme musieť viesť našu diplomaciu, obchod a expanziu." # todo: NEW TRANSLATION
 omani_heritage: "Ovládanie zálivu" # todo: NEW TRANSLATION
 omani_heritage_desc: "Naši námorníci sú zvyknutí plávať ďaleko a široko po moriach, ale kontrola zálivu, ktorý nás obklopuje, umožňuje takéto cesty. Musíme byť vždy pripravení brániť naše vody pred akoukoľvek cudzou hrozbou." # todo: CHANGED
 omani_ambition: "Pozemná izolácia" # todo: NEW TRANSLATION
 omani_ambition_desc: "Aj keď nie sme ostrov, naša krajina je fakticky izolovaná od zvyšku $arabia_region$ kvôli obklopujúcim púšťam. Preto sme sa naučili, aké dôležité je mať prístup k moru a aké užitočné bude, ak túto možnosť odoberieme nepriateľom." # todo: CHANGED
 breton_tradition: "$breton$ poloostrov" # todo: NEW TRANSLATION
 breton_tradition_desc: "Odkedy naši predkovia prišli z $great_britain_region$, naše rozsiahle pobrežné územia bzučia aktivitou. Náš ľud žije pri mori aj pre more a naše prístavy sú stále plné obchodných a rybárskych lodí." # todo: CHANGED
 house_of_parliament_advance: "$house_of_parliament$" # todo: NEW TRANSLATION
 house_of_parliament_advance_desc: "$house_of_parliament_desc$" # todo: NEW TRANSLATION
 lacquerware_guild_advance: "$lacquerware_guild$" # todo: NEW TRANSLATION
 lacquerware_guild_advance_desc: "$lacquerware_guild_desc$" # todo: NEW TRANSLATION
 bur_between_two_realms: "Medzi dvoma ríšami" # todo: NEW TRANSLATION
 bur_between_two_realms_desc: "Môžeme sa považovať za členov tradičných krajín $hre$ aj za súčasť ríše $FRA$. Hoci to môže komplikovať feudálne vzťahy, táto situácia nás vyformovala na zručných diplomatov schopných hrať obidve strany vo svoj prospech." # todo: CHANGED
 bur_knightly_prowess: "Rytierska zručnosť" # todo: NEW TRANSLATION
 bur_knightly_prowess_desc: "Zaujímame prestížnu pozíciu v rámci feudálneho systému $FRA$. Preto je správne, že naše jednotky sú vnímané ako odraz ducha $BUR_ADJ$." # todo: CHANGED
 bur_rich_soil_of_burgundy: "Rozvíjať poľnohospodárstvo" # todo: NEW TRANSLATION
 bur_rich_soil_of_burgundy_desc: "Zeme $BUR$ sú vhodné pre rast rastlín a chov zvierat. Hrozno je obzvlášť prispôsobené miestnym podmienkam. Pri zručnom pestovaní bude ľahké rozvinúť poľnohospodársky priemysel." # todo: CHANGED
 mos_skilled_tax_collectors: "Zberači tribútov" # todo: NEW TRANSLATION
 mos_skilled_tax_collectors_desc: "Naša úloha vyberača tributov pre $GLH_horde$ nám priniesla mnoho rokov skúseností pri zhromažďovaní daní... a pri ponechávaní časti ziskov pre seba." # todo: CHANGED
 mos_dynastic_ties: "Vládnutie cez dynastické väzby" # todo: NEW TRANSLATION
 mos_dynastic_ties_desc: "Zeme $russian_region$ sú od nepamäti vládnuté jednou dynastiou. Mali by sme využiť našu pozíciu medzi rovesníkmi a krvné putá, aby sme prevzali vedúcu úlohu." # todo: CHANGED
 mos_patrol_the_territories: "Organizované verbovanie" # todo: NEW TRANSLATION
 mos_patrol_the_territories_desc: "Správa rozsiahleho územia $russian_region$ nie je ľahká úloha. Mali by sme zriadiť miestne náborové centrá, aby bol odvod ľahšie uskutočniteľný." # todo: CHANGED
 russian_integration: "$russian_group$ tradície" # todo: NEW TRANSLATION
 russian_integration_desc: "Skupina $russian_group$ je rozsiahla a kultúrne rôznorodá. Aby sme ich zjednotili tak, ako kedysi panovníci, mali by sme podporovať spoločnú históriu a vytvoriť nezlomné kultúrne puto medzi rôznymi skupinami." # todo: CHANGED
 russian_resiliance: "$russian_group$ verbovanie" # todo: NEW TRANSLATION
 russian_resiliance_desc: "Invázie $mongolian_group$ v minulosti zanechali v $russian_group$ silnú odhodlanosť odolávať cudzej nadvláde. Môžeme využiť ich horlivosť na posilnenie našich vojsk." # todo: CHANGED
 land_of_the_rus: "Zem Rus'ov" # todo: NEW TRANSLATION
 land_of_the_rus_desc: "Zjednotenie Rusí je bežným cieľom panovníkov $russian_group$ a ambiciózni dobyvatelia to môžu použiť ako ospravedlnenie na vojenské ťaženia." # todo: CHANGED
 russian_legitimization: "Spoločná legitimita" # todo: NEW TRANSLATION
 russian_legitimization_desc: "Ľudia $russian_group$ obývajú a spravujú tieto země stáročia. Je prirodzené, že vládca z $russian_group$ by mal vládnuť svojim ľuďom. Čím viac sa budeme prezentovať ako $russian_group$, tým ľahšie národ prijme naše vedenie." # todo: CHANGED
 nor_seaborn_country: "Morská krajina" # todo: NEW TRANSLATION
 nor_seaborn_country_desc: "Ľudia $NOR_ADJ$ vždy uprednostňovali cestovanie po krajine loďou, kedykoľvek to bolo výhodné. To robí náš ľud zdatnými námorníkmi, pripravenými obsadiť našu flotilu, keď to bude potrebné." # todo: CHANGED
 nor_bounties_of_the_sea: "Hojnosť morí" # todo: CHANGED
 nor_bounties_of_the_sea_desc: "Krajina $NOR_ADJ$ neposkytne nášmu ľudu dosť jedla na udržanie sa. Obrátime sa teda na more, aby nás kŕmilo. Našťastie vody Severného mora nám poskytujú bohaté rybolovné oblasti." # todo: CHANGED
 nor_merchant_tradition: "$NOR_ADJ$ obchodníci" # todo: CHANGED
 nor_merchant_tradition_desc: "Prístavy $NOR$ sú už dlho žiadaným cieľom obchodníkov z celého $europe$. Je načase, aby sme nielen hostili zahraničných obchodníkov, ale aj sami profitovali z obchodov severného $europe$." # todo: CHANGED

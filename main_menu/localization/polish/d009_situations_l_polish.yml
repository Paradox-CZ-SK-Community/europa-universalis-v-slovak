 BFTS_INFLUENCE_BAR_TOOLTIP_TT: "Dvor štátu [GetCountry('GRA').GetName] sa pohybuje po osi od $bfts_axis_min$ ([GetCountry('CAS').GetNameWithNoTooltip]) po $bfts_axis_max$ ([GetCountry('MOR').GetNameWithNoTooltip])" # todo: NEW TRANSLATION

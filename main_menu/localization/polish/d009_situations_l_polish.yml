 cas_appoint_adelantado_mayor: "Vymenovať Adelantado Mayor de la Frontera" # todo: NEW TRANSLATION
 cas_appoint_adelantado_mayor_desc: "Úrad Adelantado Mayor de la Frontera, po prvý raz spomenutý v roku 1253 ako správca území získaných od Maurov, spája tri funkcie v rukách jedného človeka: odvolacieho sudcu južných krajín, kráľovského vykonávateľa nariadení vydaných [GetCountry('CAS').GetGovernment.GetRulerTitle] a stáleho veliteľa každého nájazdu cabalgada, ktorý prekročí hranicu do krajiny [GetCountry('GRA').GetName]. Majetok vymenovaného rozhoduje o tom, ktorý mocenský blok bude na [GetCountry('CAS').GetGovernment.GetCourtTitle] prosperovať, a každá [GetCountry('CAS').GetAdjective] provincia hraničiaca s [GetCountry('GRA').GetNameWithNoTooltip] alebo [GetCountry('MOR').GetName] získa trvalý modifikátor posilnenia posádky, kým bude tento úrad zastávať." # todo: NEW TRANSLATION
 cas_appoint_adelantado_mayor_act: "$cas_appoint_adelantado_mayor$" # todo: NEW TRANSLATION
 cas_appoint_adelantado_mayor_concept: "[Concept('character_interaction','Interakcia postáv')|e]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 cas_appoint_adelantado_mayor_past: "[SCOPE.sCharacter('recipient').GetName] je novým Adelantado Mayor!" # todo: NEW TRANSLATION
 cas_appoint_adelantado_mayor_act_past: "[SCOPE.sCountry('actor').GetName] vymenoval [SCOPE.sCharacter('recipient').GetName] za nového Adelantado Mayor de la Frontera." # todo: NEW TRANSLATION
 cas_appoint_adelantado_mayor_desc_specific: "[SCOPE.sCharacter('recipient').GetName] sa stane novým Adelantado Mayor de la Frontera." # todo: NEW TRANSLATION
 cas_appoint_adelantado_mayor_price: "Cena za vymenovanie Adelantado Mayor" # todo: NEW TRANSLATION
 every_province_murcia_granada_andalusia_adelantado_mayor_tt: "Každá [Concept('province','provincia')|e], ktorú vlastníme v [ShowAreaName('murcia_area')], [ShowAreaName('granada_area')] a [ShowAreaName('andalusia_area')], získa [Concept('modifier','modifikátor')|e] [ShowModifier('guarded_by_adelantado_mayor')], ktorého sila bude závisieť od [Concept('abilities','schopností')|e] postavy [recipient.GetName] počas #G 10#! rokov" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 choose_adelantado_candidate: "Vybrať kandidáta" # todo: NEW TRANSLATION
 scales_with_character_tt: "[Concept('abilities','Schopnosti')|e] postavy [GetCountry('CAS').MakeScope.GetVariable('cas_adelantado_mayor_character').GetCharacter.GetName]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 gra_reduce_castilian_influence: "Znížiť vplyv $CAS_ADJ$" # todo: NEW TRANSLATION
 gra_reduce_castilian_influence_desc: "Mobilizujeme našich kádíov, učencov a rodiny z pohraničia proti dosahu [GetCountry('CAS').GetName] na našom dvore i na našich trhoch. Vytrvalý tlak oslabí moc, ktorú si [GetCountry('CAS').GetAdjectiveWithNoTooltip] vybudovali nad záležitosťami nášho [GetCountry('GRA').GetFlavorRank]." # todo: NEW TRANSLATION
 gra_reduce_moroccan_influence: "Znížiť vplyv $MOR_ADJ$" # todo: NEW TRANSLATION
 gra_reduce_moroccan_influence_desc: "Cez prieliv posielame vyslancov, zlaté dary a tiché varovania, aby sme utlmili vplyv [GetCountry('MOR').GetName] medzi kmeňmi a prístavmi, ktoré vzhliadajú k jeho dvoru. Bez týchto dobrovoľníkov a podpory sa [GetCountry('MOR').GetAdjectiveWithNoTooltip] vplyv nad naším [GetCountry('GRA').GetFlavorRank] oslabí." # todo: NEW TRANSLATION
 gra_construct_alhambra: "Začať rozširovať $alhambra$" # todo: NEW TRANSLATION
 gra_construct_alhambra_desc: "Zvoláme nasridských kamenárov, kaligrafov a #italic rezbárov muqarnas#!, aby položili základy nového krídla kráľovskej citadely nad [GetCountry('GRA').GetGovernment.GetCourtTitle] panovníka [GetCountry('GRA').GetGovernment.GetRulerOrRegent.GetShortNameWithNoTooltip]. Každé rozšírenie upevňuje dynastiu v jej hlavnom meste a pridáva na kopci Sabīka ďalšiu úroveň palácovej nádhery, nádvorí a priestoru pre posádku." # todo: NEW TRANSLATION
 gra_construct_alhambra_max_tt: "[ShowBuildingTypeName('alhambra')] ešte nedosiahla svoju štvrtú úroveň" # todo: NEW TRANSLATION
 gra_construct_alhambra_increment_tt: "Zvyšuje maximálnu úroveň [ShowBuildingTypeName('alhambra')] o #G +1#!" # todo: NEW TRANSLATION
 gra_alhambra_extension_desc: "Rozšírenia [ShowBuildingTypeName('alhambra')] nariadené počas [ShowSituationName('battle_for_the_strait')]" # todo: NEW TRANSLATION
 unlock_upgrade_alhambra_decision_tt: "Odomkne [Concept('decision','rozhodnutie')|e] [ShowDecisionName('expand_the_alhambra')] " # todo: NEW TRANSLATION # todo: CONCEPT CASE
 until_we_cease_our_projection_efforts_tt: "Pokiaľ tento [Concept('modifier','modifikátor')|e] zostáva aktívny" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 adu_proclaim_crown_al_andalus: "Vyhlásiť $crown_of_al_andalus$" # todo: NEW TRANSLATION
 adu_proclaim_crown_al_andalus_desc: "Keďže naša nadvláda nad [ShowContinentName('europe')] je úplná, vyhlasujeme $crown_of_al_andalus$ a zjednocujeme ṭā'ifu v [ShowRegionName('iberia_region')] pod jedinou vládou, čím obnovujeme slávu [ShowLocationName('cordoba')] nielen v mene, ale aj v skutočnosti." # todo: NEW TRANSLATION
 gra_enforce_sovereignty: "Presadiť zvrchovanosť" # todo: NEW TRANSLATION
 gra_enforce_sovereignty_desc: "Náš [GetCountry('GRA').GetFlavorRank] môže pred [GetCountry('CAS').GetName] a [GetCountry('MOR').GetName] vystupovať ako zvrchovaná mocnosť a odmietnuť nároky na suverenitu, ktoré by našu korunu pripútali k jednému z ich dvorov. Takýto vzdor posilní naše postavenie doma, no sťaží každé rokovanie v zahraničí. Túto zástavu môžeme vztýčiť alebo stiahnuť podľa toho, ako nám to naša situácia dovolí." # todo: NEW TRANSLATION
 attract_andalusi_refugees: "Pozvať Mudéjarov" # todo: NEW TRANSLATION
 attract_andalusi_refugees_desc: "Slovo #italic mudajjan#! znamená „ktorému je dovolené zostať“ a kresťanské kráľovstvá z neho vytvorili pomenovanie „Mudéjar“ pre moslimské rodiny, ktoré dobyli, no ponechali na mieste pod svojou vládou. Vysielame vyslancov s ochrannými listinami a prísľubom domova, aby sme prilákali tých, ktorí radšej budú žiť pod našimi zákonmi než pod vládou kresťanského kráľa. Každé privítanie privedie vlnu týchto osadníkov z vybraného kresťanského kráľovstva do jednej z našich provincií." # todo: NEW TRANSLATION
 bfts_attract_andalusi_refugees_tt: "Pozveme utečencov Mudéjarov z [Concept('province','provincie')|e] v [ShowRegionName('iberia_region')], aby sa usadili v našich krajinách" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 attract_refugees_choose_source: "Vybrať provinciu pôvodu" # todo: NEW TRANSLATION
 attract_refugees_choose_destination: "Vybrať cieľovú provinciu" # todo: NEW TRANSLATION
 gra_invite_shadhili_order_effect_tt: "Odomkne akciu [ShowGenericActionName('gra_patronize_shadhili_order')], ktorú možno zapnúť a zvýši náš postup k [ShowSocietyDirectionName('jurisprudence')], mesačnú [Concept('legitimacy','legitimitu')|e] a [Concept('cabinet_efficiency','efektivita kabinetu')|e] na úkor [Concept('tax_efficiency','efektivita výberu daní')|e]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 gra_patronize_shadhili_order: "Podporovať rád Šádhilí" # todo: NEW TRANSLATION
 gra_patronize_shadhili_order_desc: "Rád Šádhilí #italic ṭarīqa#! založený na našom dvore závisí od priazne koruny. Kráľovské dary ich #italic zāwiyám#! a učencom majú dvojaký účinok: posilňujú hlas svätcov v našich radách a odčerpávajú bohatstvo, ktoré by inak mohlo naplniť našu pokladnicu. Podľa potreby môžeme tento mešec otvoriť alebo zatvoriť." # todo: NEW TRANSLATION
 start_patronizing_shadhili_order_tt: "Začneme podporovať rád Šádhilí a uplatnia sa tieto účinky:\n [ShowModifierEffect('patronizing_shadhili_order_modifier')]" # todo: NEW TRANSLATION
 stop_patronizing_shadhili_order_tt: "Ukončíme podporu rádu Šádhilí a odstránia sa tieto účinky: [ShowModifierEffect('patronizing_shadhili_order_modifier')]" # todo: NEW TRANSLATION
 until_we_cease_our_patronship_tt: "$until_we_cease_our_projection_efforts_tt$" # todo: NEW TRANSLATION
 action_active: "[Concept('action','Akcia')|e] je aktívna" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 unlock_patronize_shadhili_order_tt: "Odomkne [Concept('action','akcia')|e] [ShowGenericActionName('gra_patronize_shadhili_order')] v rámci [Concept('situation','situácie')|e] [ShowSituationName('battle_for_the_strait')]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 hire_granadan_jinetes: "Zverbovať jinetes z $GRA_ADJ$" # todo: NEW TRANSLATION
 hire_granadan_jinetes_desc: "Šľachtici [ShowCultureName('andalusi')], muži z pohraničného #italic campo#!, ktorých oštepy a krátke meče formovali jazdectvo všetkých susedných ríš, sú pod tlakom [ShowSituationName('battle_for_the_strait')] nepokojní. Za striebro a prísľub žoldu prilákame do hlavného mesta oddiel jazdcov, ktorí poznajú každú roklinu a strážnu vežu od [ShowLocationName('cordoba')] po [ShowLocationName('almeria')]." # todo: NEW TRANSLATION
 hire_granadan_jinetes_traditional_tt: "V našom [Concept('capital','hlavnom meste')|e] naverbujeme 2 jednotky [ShowUnitDefinitionName('a_granadan_jinetes')]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 hire_granadan_jinetes_modern_tt: "V našom [Concept('capital','hlavnom meste')|e] naverbujeme 2 jednotky [ShowUnitDefinitionName('a_granadan_jinetes_2')]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 cas_demand_muslim_converts: "Požadovať moslimských konvertitov" # todo: NEW TRANSLATION
 cas_demand_muslim_converts_desc: "Prinútime [GetCountry('GRA').GetName], aby nám odovzdala významného [ShowReligionGroupAdjective('muslim')] poddaného, ktorý bude po príchode na náš dvor pokrstený a dostane nové meno podľa [GetCountry('CAS').GetReligion.GetGroup.GetAdjective] tradície. Spolu s ním získame jeho dary aj obmedzenia a vopred nevieme, čo z toho bude kancelária považovať za užitočné." # todo: NEW TRANSLATION
 cas_demand_muslim_converts_select_title: "Vybrať moslimského poddaného" # todo: NEW TRANSLATION
 cas_demand_muslim_converts_no_characters: "@trigger_no! Na granadskom dvore nie sú dostupní žiadni vhodní moslimskí poddaní" # todo: NEW TRANSLATION
 cas_demand_muslim_converts_price_abilities: "Schopnosti postavy" # todo: NEW TRANSLATION
 cas_demand_muslim_converts_effect_tt: "Vybraná [Concept('character','postava')|e] sa presunie na náš dvor, bude pokrstená a prijatá do našich služieb prostredníctvom [Concept('event','udalosti')|e], ktorého výsledok bude závisieť od jej [Concept('abilities','schopností')|e]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 cas_dismantle_fortifications: "Rozobrať opevnenia" # todo: NEW TRANSLATION
 cas_dismantle_fortifications_desc: "Nariadime nášmu [ShowSubjectTypeName('vassal')] z [GetCountry('GRA').GetAdjective] oblasti, aby zbúral opevnenia vo vybranej lokalite. Získaný kameň, drevo a opracované murivo poputujú na sever, na naše iberské trhy, a [GetCountry('GRA').GetFlavorRank] zostane o niečo odkrytejší voči našim posádkam." # todo: NEW TRANSLATION
 cas_dismantle_fortifications_select_title: "Vybrať granadskú lokalitu na vyplienenie" # todo: NEW TRANSLATION
 cas_dismantle_fortifications_no_locations: "@trigger_no! Nie sú dostupné žiadne opevnené granadské lokality" # todo: NEW TRANSLATION
 cas_dismantle_fortifications_effect_tt: "Každá [Concept('building','budova')|e] triedy pevností vo vybranej [Concept('location','lokalite')|e] bude zničená. Získaný tovar poputuje na naše [Concept('markets','trhy')|e] za cenu [Concept('liberty_desire','túžbu po slobode')|e] a trvalého postihu vzťahov s naším poddaným" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 cas_dismantle_fortifications_salvage_tt: "Na našich [Concept('markets','trhov')|e] klesne [Concept('goods_demand','dopyt po tovare')|e] po stavebnom [Concept('goods','tovaroch')|e] na #G 2#! roky vďaka [ShowGoodsDemandName('cas_dismantled_forts_salvage')], čím sa znížia náklady na naše [Concept('buildings','budovy')|e]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 cas_dismantled_forts_salvage: "Získané opevnenia z $GRA_ADJ$" # todo: NEW TRANSLATION
 opinion_dismantled_our_forts: "Rozobrali naše opevnenia" # todo: NEW TRANSLATION
 cas_reduce_granadan_sovereignty: "Znížiť zvrchovanosť $GRA_ADJ$" # todo: NEW TRANSLATION
 cas_reduce_granadan_sovereignty_desc: "Uplatníme voči [GetCountry('GRA').GetName] plnú váhu svojho postavenia a odstránime jednu úroveň ich nezávislých inštitúcií, čím pevnejšie začleníme úradníkov [GetCountry('GRA').GetFlavorRank] do nášho velenia. Naše puto sa tým oslabí a [GetCountry('GRA').GetGovernment.GetCourtTitle] v štáte [GetCountry('GRA').GetNameWithNoTooltip] stratí časť svojho postavenia, ktoré tak skoro nezíska späť.\n\nKeď bude naša kontrola nad prielivom nepopierateľná, tie isté požiadavky zasiahnu hlbšie a budeme ich môcť opakovať oveľa skôr. [GetCountry('GRA').GetGovernment.GetCourtTitle] už vtedy nebude mať iného patróna, na ktorého by sa mohol obrátiť, a jeho protesty budú sotva polovične hlasné." # todo: NEW TRANSLATION
 BFTS_REDUCE_SOVEREIGNTY_REQUIRES_HOLD: "[GetCountry('GRA').GetName] musí byť naším poddaným alebo náš vplyv nad prielivom musí dosiahnuť úroveň #Y Nadvláda#!" # todo: NEW TRANSLATION
 opinion_pressured_our_sovereignty: "Vyvíjali tlak na našu zvrchovanosť" # todo: NEW TRANSLATION
 battle_for_the_strait_sovereignty_consolidated: "Zvrchovanosť nad štátom [GetCountry('GRA').GetName] bola upevnená." # todo: NEW TRANSLATION
 mor_force_tribute: "Vynútiť tribút" # todo: NEW TRANSLATION
 mor_force_tribute_desc: "Prinútime [GetCountry('GRA').GetName] zaradiť sa medzi našich tributárnych poddaných. Mince z [GetCountry('GRA').GetFlavorRank] poputujú na juh cez prieliv a ich zástava sa skloní pred našou v otázkach vojny aj ciel." # todo: NEW TRANSLATION
 cas_force_tribute: "Požadovať parias" # todo: NEW TRANSLATION
 cas_force_tribute_desc: "Obnovíme starý tribút parias a opäť zaradíme [GetCountry('GRA').GetName] na zoznam našich poplatníkov. Zlato z [GetCountry('GRA').GetFlavorRank] poputuje do našej pokladnice na severe a ich dvor sa nám bude zodpovedať v otázkach vojny aj ciel." # todo: NEW TRANSLATION
 mor_invite_granadan_scholars: "Pozvať učencov z $GRA_ADJ$" # todo: NEW TRANSLATION
 mor_invite_granadan_scholars_desc: "Pozveme [ShowEstateTypeName('clergy_estate')] a #italic fuqahā'#! z [ShowCultureName('andalusi')] #italic madras#! na druhej strane prielivu, aby prednášali v našich školách. Školy štátu [GetCountry('GRA').GetName] sú neprekonateľné v oblasti [ShowSocietyDirectionName('jurisprudence')] podľa [GetCountry('GRA').GetReligiousSchool.GetName] a ich učenie ovplyvní zákony aj gramotnosť našej ríše." # todo: NEW TRANSLATION

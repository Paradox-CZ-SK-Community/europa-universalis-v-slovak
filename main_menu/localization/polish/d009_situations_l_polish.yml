l_polish:
 battle_for_the_strait: "Bitka o prieliv" # todo: NEW TRANSLATION
 battle_for_the_strait_info: "Boj o [ShowLocationName('strait_of_gibraltar')] medzi [GetCountry('CAS').GetName], [GetCountry('MOR').GetName] a [GetCountry('GRA').GetName]. Kto ovládne prieliv, bude kontrolovať bránu medzi Atlantikom a Stredozemným morom." # todo: NEW TRANSLATION
 owner_christian_or_castile_tt: "Vlastníkom je buď [ShowReligionGroupAdjective('christian')], alebo [GetCountry('CAS').GetName]" # todo: NEW TRANSLATION
 cas_integrated_granada_lands_tt: "[GetCountry('CAS').GetName] priamo vlastní a má jadro v každej lokalite, ktorú [GetCountry('GRA').GetName] vlastnila na začiatku" # todo: NEW TRANSLATION
 battle_for_the_strait_desc: "Úzke vody medzi [ShowRegionName('iberia_region')] a [ShowContinentName('africa')] tvoria jedno z najstrategickejších úzkych miest na svete. [GetCountry('CAS').GetLongName] hľadí na juh, aby zabezpečila [ShowRegionNameWithNoTooltip('iberia_region')] pod zástavami [ShowReligionGroupAdjective('christian')]. [GetCountry('MOR').GetLongName] hľadí na sever, aby bránila [ShowFormableCountryName('ADU_f')] a udržala priechody pre veriacich otvorené. [GetCountry('GRA').GetLongName], tlačená zo všetkých strán, bojuje o to, aby zostala pánom vlastného pobrežia. Kto zvíťazí, bude držať kľúče od dvoch morí." # todo: NEW TRANSLATION
 battle_for_the_strait_castilian_supremacy: "Prevaha [GetCountry('CAS').GetAdjectiveWithNoTooltip]" # todo: NEW TRANSLATION
 battle_for_the_strait_castilian_supremacy_desc: "$BULLET$[Concept('modifier','Modifikátor')|e] [ShowModifier('crown_of_the_reconquista_modifier')] na #Y 100 rokov#!\n$BULLET$Dodatočný modifikátor pre [Concept('government_reform','reformu vlády')|e] [ShowGovernmentReformName('crown_castile_reform')]\n$BULLET$Prístup k [Concept('decision','rozhodnutiu')|e] [ShowDecisionName('gc_decision')], ktorá spúšťa [Concept('situation','situácia')|e] [ShowSituationName('golden_century')]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 battle_for_the_strait_moroccan_supremacy: "Prevaha [GetCountry('MOR').GetAdjectiveWithNoTooltip]" # todo: NEW TRANSLATION
 battle_for_the_strait_moroccan_supremacy_desc: "$BULLET$[Concept('modifier','Modifikátor')|e] [ShowModifier('protector_of_andalus_modifier')] na #Y 100 rokov#!\n$BULLET$Povýšenie na [ShowCountryRankName('rank_empire')], ak ním ešte nie sme\n$BULLET$Úplná [Concept('core','jadro')|e] [Concept('integration','integrácie')|e] každej [Concept('location','lokalite')|e] v [ShowAreaName('granada_area')], [ShowAreaName('andalusia_area')] a [ShowAreaName('murcia_area')]\n$BULLET$#G 25 %#! postupu [Concept('annexation','anexii')|e] voči každej [ShowSubjectTypeName('taifa')] v procese anexie\n$BULLET$Jednoduchšie založenie štátu [ShowFormableCountryName('ADU_f')]\n$BULLET$Prístup k [Concept('decision','rozhodnutiu')|e] [ShowDecisionName('gc_decision')], ktorá spúšťa [Concept('situation','situácia')|e] [ShowSituationName('golden_century')]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 battle_for_the_strait_granadan_sovereignty_preserved: "Zachovaná granadská zvrchovanosť" # todo: NEW TRANSLATION
 battle_for_the_strait_granadan_sovereignty_preserved_desc: "$BULLET$[Concept('modifier','Modifikátor')|e] [ShowModifier('gra_consolidated_governance_modifier')] na #Y 100 rokov#!\n$BULLET$[ShowCasusBelliName('cb_reconquer_iberia')] na opätovné získanie [ShowRegionName('iberia_region')] za nižšiu cenu\n$BULLET$Úplná [Concept('core','jadro')|e] [Concept('integration','integrácie')|e] každej [Concept('location','lokalite')|e] v [ShowAreaName('granada_area')], [ShowAreaName('andalusia_area')] a [ShowAreaName('murcia_area')]\n$BULLET$#G 25 %#! postupu [Concept('annexation','anexii')|e] voči každej [ShowSubjectTypeName('taifa')] v procese anexie\n$BULLET$Jednoduchšie založenie štátu [ShowFormableCountryName('ADU_f')]\n$BULLET$Prístup k [Concept('decision','rozhodnutiu')|e] [ShowDecisionName('gc_decision')], ktorá spúšťa [Concept('situation','situácia')|e] [ShowSituationName('golden_century')]" # todo: NEW TRANSLATION # todo: CONCEPT CASE

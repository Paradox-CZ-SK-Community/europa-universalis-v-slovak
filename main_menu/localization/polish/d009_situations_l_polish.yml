 demand_conversion_of_granada.title: "Postaviť sa viere $GRA$" # todo: NEW TRANSLATION
 demand_conversion_of_granada.desc: "[GetCountry('GRA').GetName] kľačí pred naším trónom, no z jeho mešít sa stále zvoláva veriacich k modlitbe. Koruna stojí na rázcestí. Môžeme dokončiť, čo začala reconquista, a násilím priviesť [GetCountry('GRA').GetFlavorRank] k našej viere, alebo môžeme [ShowCultureName('andalusi')] ponechať ich obrady a namiesto toho využiť ich remeselnú zručnosť, vzdelanosť a jazdcov." # todo: NEW TRANSLATION
 demand_conversion_of_granada.a: "Obráťme ich na našu vieru. Viere i korune musí vládnuť jediný pán." # todo: NEW TRANSLATION
 demand_conversion_of_granada.b: "Ušetriť ich vieru." # todo: NEW TRANSLATION
 cas_found_the_santa_hermandad_decision.title: "Založiť [ShowGovernmentReformNameWithNoTooltip('cas_santa_hermandad_reform')]" # todo: NEW TRANSLATION
 cas_found_the_santa_hermandad_decision.desc: "Bratstvá v našich mestách už dlho udržiavajú poriadok na cestách, každé pod vlastnou radou a vlastnými richtármi. Jediná [ShowGovernmentReformName('cas_santa_hermandad_reform')], ktorú založia mestá, no bude podliehať Korune, by priniesla kráľovský mier do každej dediny a ukončila zbojníctvo, ktoré šľachta nikdy nechcela zastaviť." # todo: NEW TRANSLATION

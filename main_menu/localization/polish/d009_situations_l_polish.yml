 BFTS_THRESHOLD_CAS_50_TITLE: "Kastílsky vplyv nad $GRA$" # todo: NEW TRANSLATION
 BFTS_THRESHOLD_CAS_50_DESC: "[GetCountry('CAS').GetName] môže [ShowCountryInteractionName('cas_demand_war_entry')] a povolať [GetCountry('GRA').GetName] do svojich vojen proti [GetCountry('MOR').GetName]. Kým bude ich vplyv taký silný, [GetCountry('GRA').GetNameWithNoTooltip] už nemôže ukončiť [Concept('situation','situácia')|e] ako nezávislá mocnosť." # todo: NEW TRANSLATION # todo: CONCEPT CASE

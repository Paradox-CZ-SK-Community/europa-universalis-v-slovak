 claim_andalusi_inheritance: "Uplatniť nárok na dedičstvo $andalusi$" # todo: NEW TRANSLATION
 claim_andalusi_inheritance_desc: "Krajiny [ShowFormableCountryName('ADU_f')] kedysi poslúchali výzvy kalifov a modlili sa vo veľkých mešitách [ShowLocationName('cordoba')]. Kým tieto brehy ovládajú [ShowReligionGroupAdjective('christian')] koruny, nemôžeme poľaviť.\n\nUplatníme si nárok na vyvoleného iberského dediča a naše vojská sú pripravené zasiahnuť, ak sa odmietne podriadiť. Ak zaútočíme teraz, veriaci z [ShowRegionName('iberia_region')] nás budú považovať za oprávnených dedičov strateného dedičstva a naše postavenie v [ShowReligionGroupAdjectiveWithNoTooltip('muslim')] svete tým vzrastie." # todo: NEW TRANSLATION
 claim_andalusi_inheritance_no_target_tt: "Získame [Concept('casus_belli','casus Belli')|e] na znovudobytie [ShowFormableCountryName('ADU_f')] od vyvolenej [ShowReligionGroupAdjective('christian')] iberskej koruny na 5 rokov" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 has_won_bfts_situation_tt: "Musíme vyhrať [Concept('situation','situácia')|e] [ShowSituationName('battle_for_the_strait')]" # todo: NEW TRANSLATION # todo: CONCEPT CASE

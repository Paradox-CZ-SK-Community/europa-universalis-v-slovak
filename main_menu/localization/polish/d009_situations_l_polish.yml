 vassalize_granada: "Urobiť z $GRA$ vazala" # todo: NEW TRANSLATION
 vassalize_granada_desc: "[GetCountry('GRA').GetGovernment.GetCourtTitle] je úplne v našej sfére vplyvu. Už sa neuspokojíme s tribútom a parias a pripútame [GetCountry('GRA').GetFlavorRank] k nášmu trónu ako verného [ShowSubjectTypeName('vassal')]. [GetCountry('GRA').GetGovernment.GetRulerTitle] si ponechá trón iba naoko. Zákony, odvody i razba mincí sa teraz riadia našimi príkazmi." # todo: NEW TRANSLATION

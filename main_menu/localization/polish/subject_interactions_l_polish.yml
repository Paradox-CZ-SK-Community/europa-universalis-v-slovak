l_polish:
 colonial_nation: "Koloniálna krajina" # todo: NEW TRANSLATION
 colonial_nation_desc: "$colonial_nation$ je [Concept('subject','vazal')|e] zameraný na správu [Concept('overseas','zámorie')|e] [Concept('colonies','kolonií')|e] v mene svojho [overlord|e]. Získava zvýšenie [ShowModifierTypeName('global_population_capacity_modifier')] a možnosť využívať [ShowPopTypeName('slaves')] na prácu v [rgo|e], pričom svojmu [overlord|e] poskytuje nárast [Concept('merchant_power','neobchodnú výhodu')|e] a platby v [Concept('manpower','živej sile')|e] a [Concept('sailors','námorníkoch')|e] okrem [Concept('gold','dukátov')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 dominion: "Dominion" # todo: NEW TRANSLATION
 dominion_desc: "A $dominion$ je samosprávny [Concept('subject','vazal')|e] s relatívnou autonómiou, výhradne pre [ShowGovernmentTypeName('monarchy')] toho istého [Concept('religion_group','náboženskej skupiny')|e] ako [Concept('overlord','suzerén')|e]. Okrem toho, aby bolo možné vytvoriť $dominion$, musia byť obe krajiny v [Concept('union','únii')|e] alebo musí byť [Concept('overlord','suzerén')|e] buď $ENG$ alebo $GBR$. $dominion$ trpí zníženou [ShowModifierTypeName('country_cabinet_efficiency')] v porovnaní s bežným [ShowSubjectTypeName('vassal')], ale vyššou [ShowModifierTypeName('legislative_efficiency')]." # todo: CHANGED # todo: CONCEPT CASE
 fiefdom: "Fiefdom" # todo: NEW TRANSLATION
 fiefdom_desc: "A $fiefdom$ je juniorský titul, ktorý je majetkom [Concept('ruler','panovníkom')|e] jeho [overlord|e]. Výhradne pre [ShowGovernmentTypeName('monarchy')] toho istého [Concept('religion_group','náboženskej skupiny')|e] ako [Concept('overlord','suzerén')|e], trpí zníženou [ShowModifierTypeName('country_cabinet_efficiency')] a bude spravovaný priamo [Concept('monarch','monarcha')|e] [Concept('overlord','suzerén')|e]." # todo: CHANGED # todo: CONCEPT CASE
 march: "March" # todo: NEW TRANSLATION
 march_desc: "A $march$ je [Concept('subject','vazal')|e] krajina zameraná na obranu panstva svojho [overlord|e], pôsobiaca ako bariéra medzi ním a vonkajšími hrozbami. $march$ získava väčšiu [ShowModifierTypeName('discipline')] a [ShowModifierTypeName('global_defensive')], zvýšenú [ShowModifierTypeName('fort_maintenance_efficiency')] a zároveň má znížené platobné povinnosti voči svojmu [overlord|e] v porovnaní s bežným [ShowSubjectTypeName('vassal')]." # todo: CHANGED # todo: CONCEPT CASE
 hanseatic_member: "Člen Hanzovej ligy" # todo: NEW TRANSLATION
 hanseatic_member_desc: "The Hanseatic League je konfederácia obchodných miest s obranným a komerčným zameraním, v čele s $HSA$. Ako člen The Hanseatic League si táto [Concept('subject','vazal')|e] krajina užíva zvýšenú [ShowModifierTypeName('selling_efficiency')], [ShowModifierTypeName('loyalty_to_overlord')] a [ShowModifierTypeName('merchant_maintenance_efficiency')]. [Concept('overlord','Suzerén')|e], ktorý môže byť iba $HSA$, získava zvýšenú [ShowModifierTypeName('global_merchant_capacity_modifier')], ako aj platby vo forme [Concept('manpower','živej sile')|e] a [Concept('sailors','námorníci')|e], ale menej [Concept('gold','dukáty')|e] v porovnaní s bežným [ShowSubjectTypeName('vassal')]." # todo: CHANGED # todo: CONCEPT CASE
 state_bank: "Štátna banka" # todo: NEW TRANSLATION
 state_bank_desc: "Táto [Concept('subject','vazal')|e] reprezentuje silné prepojenie medzi subjektom ako spoločnosťou a jej [overlord|e], ktorým môže byť len krajina s [ShowGovernmentReformName('banking_country')] [Concept('government_reform','reformou vlády')|e]. Získavajú zvýšenie [ShowModifierTypeName('diplomatic_reputation')], zatiaľ čo [Concept('overlord','suzerén')|e] dostáva zníženie [ShowModifierTypeName('bank_interest')] a možnosť odčerpať polovicu pokladu $state_bank$ pomocou [ShowCountryInteractionName('siphon_income')] [Concept('country_interaction','interakcie s krajinou')|e] namiesto bežnej sumy." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 secessionists: "Separatisti" # todo: NEW TRANSLATION
 secessionists_desc: "Táto [Concept('subject','vazal')|e] má v mnohých aspektoch správy veľa podobností so svojím [overlord|e] a usiluje sa o politické zjednotenie s ním. Preto ich možno [Concept('annexed','anektované')|e] relatívne ľahko. Získavajú zvýšenie [ShowModifierTypeName('loyalty_to_overlord')] a zvýšenie [ShowModifierTypeName('annexation_speed')]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 trade_company: "Obchodná spoločnosť" # todo: NEW TRANSLATION
 trade_company_desc: "A $trade_company$ je investičný konglomerát zameraný na dosahovanie finančných výhod pre seba a svojho [overlord|e]. Vždy sú [ShowGovernmentTypeName('republic')] a získavajú zvýšenú [ShowModifierTypeName('export_efficiency')], ako aj zvýšené platobné povinnosti voči svojmu [overlord|e] v porovnaní s bežným [ShowSubjectTypeName('vassal')]." # todo: CHANGED
 vassal: "Vasál" # todo: NEW TRANSLATION
 vassal_desc: "Najtypickejší typ [Concept('subject','vazal')|e], $vassal$ spravuje svoje územie v mene svojho [overlord|e], platí vassalské poplatky a zapája sa do vojenských kampaní svojho [overlord|e]. Trpí zníženou [ShowModifierTypeName('country_cabinet_efficiency')], zatiaľ čo [Concept('overlord','suzerén')|e] získava zvýšenú [ShowModifierTypeName('monthly_prestige')], a obe krajiny majú rýchlejšie šírenie [Concept('institutions','inštitúcie')|e]." # todo: CHANGED # todo: CONCEPT CASE
 conquistador: "Konkvistádor" # todo: NEW TRANSLATION
 conquistador_desc: "Konkvistádori sú velitelia súkromnej armády, ktorí podpísali zmluvy so svojimi [Concept('rulers','panovníkmi')|e] na prieskum a dobytie určitých území výmenou za titul guvernéra a podiel na nových krajinách a korisťach. Sú to jedinečné [Concept('subject_types','druhy vazalov')|e], ktoré je možné vytvoriť iba cez [ShowGenericActionName('create_conquistador')] [Concept('action','akciu')|e]. Vždy sú [Concept('army_based','krajina založená na armáde')|e] a získavajú zvýšenie [ShowModifierTypeName('military_tactics')], [ShowModifierTypeName('global_max_control')] a [ShowModifierTypeName('wrong_culture_levy_size')]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 appanage: "Apanáž" # todo: NEW TRANSLATION
 appanage_desc: "Appanages sú typ [Concept('subject','vazal')|e], ktorý predstavuje územia spravované odbočnou vetvou vládnucej dynastie. $appanage$ získa zvýšenú [ShowModifierTypeName('monthly_prestige')] za cenu zníženej [ShowModifierTypeName('country_cabinet_efficiency')], zatiaľ čo [Concept('overlord','suzerén')|e] získa zvýšenú [ShowModifierTypeName('monthly_legitimacy')] za cenu väčšieho [ShowModifierTypeName('stability_decay')] a menšej [ShowModifierTypeName('global_crown_estate_power')]." # todo: CHANGED # todo: CONCEPT CASE
 samanta: "Sāmanta" # todo: NEW TRANSLATION
 samanta_desc: "$samanta$ je [Concept('subject','vazal')|e] špecifický pre krajiny s [ShowAdvanceName('samanta_advance')] [Concept('advance','pokrokom')|e], jedinečný pre krajiny [ShowCultureGroupName('indian_group')]. V mnohom sa podobá bežnému [ShowSubjectTypeName('vassal')], ale má menšie platobné povinnosti a nemôže byť [Concept('annexed','anektované')|e], kým sa jeho väzba s [overlord|e] nestane bližšou, čím sa premení na [ShowSubjectTypeName('maha_samanta')] cez [ShowCountryInteractionName('upgrade_to_maha_samanta')] [Concept('country_interaction','interakciu s krajinou')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 maha_samanta: "Mahā-Sāmanta" # todo: NEW TRANSLATION
 maha_samanta_desc: "Ďalší stupeň [ShowSubjectTypeName('samanta')], $maha_samanta$ platí väčšiu výšku tribútu svojmu [overlord|e] a môže byť [Concept('annexed','anektované')|e] ich [Concept('overlord','suzerén')|e] rýchlejšie než bežný [ShowSubjectTypeName('vassal')]. [Overlord|e] môže tiež zvoliť udelenie dôvernejšej a autonómnejšej úlohy $maha_samanta$, čím ho premení na [ShowSubjectTypeName('pradhana_maha_samanta')] cez [ShowCountryInteractionName('upgrade_to_pradhana_maha_samanta')] [Concept('country_interaction','interakciu s krajinou')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 pradhana_maha_samanta: "Pradhāna-Mahā-Sāmanta" # todo: NEW TRANSLATION
 pradhana_maha_samanta_desc: "Vznešenie [ShowSubjectTypeName('maha_samanta')] a najvernejších zo [Concept('subjects','vazalov')|e]. $pradhana_maha_samanta$ nemôžu byť [Concept('annexed','anektované')|e] a majú vyššiu [ShowModifierTypeName('discipline')], [ShowModifierTypeName('global_defensive')] a zvýšenú [ShowModifierTypeName('fort_maintenance_efficiency')], za cenu zníženej [ShowModifierTypeName('country_cabinet_efficiency')]. Tiež poskytujú vyššie platby [Concept('gold','dukáty')|e], [Concept('manpower','živá sila')|e] a [Concept('sailors','námorníci')|e] svojmu [overlord|e]." # todo: CHANGED # todo: CONCEPT CASE
 tusi: "Tǔsī" # todo: NEW TRANSLATION
 tusi_desc: "Špeciálny typ správy [GetInternationalOrganizationType('middle_kingdom').GetName], sú dediční guvernéri kmeňových území v mene cisárskeho trónu. Nemôžu byť annexed, ale získavajú zvýšenie [ShowModifierTypeName('monthly_towards_sinicized')] a sú nútení používať [Concept('overlord','suzerén')|e]'s [Concept('court_language','jazykom dvora')|e], pričom stoja menej [Concept('diplomatic_capacity','diplomatická kapacita')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 uc_bey: "Uç Bey" # todo: NEW TRANSLATION
 uc_bey_desc: "The $uc_bey$ je [Concept('army_based','krajina založená na armáde')|e], ktorý slúži ako pohraničný pán pod silným vedením $turkic_group$. Majúc za úlohu brániť hranice, viesť nájazdy a rozširovať územia, títo polozezávislí vodcovia velejú verným bojovníkom Ġuzāt, poháňaným náboženským zápalom, lupom a pozemkovými grantmi, čo ich robí kľúčovými pre stabilitu a expanziu hraníc. Môžu byť vytvorení iba prostredníctvom [ShowGenericActionName('create_uc_bey')] [Concept('action','akcie')|e], a získajú [ShowGovernmentReformName('uc_bey_reform')] [Concept('reform','reforma')|e] a [ShowModifierTypeName('always_allow_army_levies')], pričom majú výrazne znížené platobné povinnosti v porovnaní s bežným [ShowSubjectTypeName('vassal')], no stoja viac [Concept('diplomatic_capacity','diplomatická kapacita')|e] a dávajú svojmu suzerénovi viac [ShowModifierTypeName('monthly_towards_decentralization')]." # todo: CHANGED # todo: CONCEPT CASE
 imperial_free_city: "Cisárske slobodné mesto" # todo: NEW TRANSLATION
 imperial_free_city_desc: "$imperial_free_city$ je špeciálny subjekt viazaný na [Concept('hre_emperor','cisára')|e]. Tento stav je aktívny, pokiaľ má subjekt status [ShowSpecialStatusName('free_city')] [GetUniqueInternationalOrganization('hre').GetName]. Nikdy nemôžu byť [Concept('annexed','anektované')|e], nedávajú žiadne výhody svojmu [overlord|e] ani sa k nemu nepridávajú do vojen, ale nestojí to žiadnu [Concept('diplomatic_capacity','diplomatickú kapacitu')|e] a môže byť premenené na [ShowSubjectTypeName('direct_imperial_free_city')] cez [ShowPolicyName('direct_imperial_cities_policy')] [Concept('policy','politiku')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 direct_imperial_free_city: "Priame cisárske slobodné mesto" # todo: NEW TRANSLATION
 direct_imperial_free_city_desc: "$direct_imperial_free_city$ je špeciálny subjekt viazaný na [Concept('hre_emperor','cisára')|e], povolený politikou [ShowPolicyName('direct_imperial_cities_policy')] [Concept('policy','politikou')|e]. Tento stav je aktívny, pokiaľ subjekt stále má status [ShowSpecialStatusName('free_city')] [GetUniqueInternationalOrganization('hre').GetName]. Sú v podstate rovnaké ako bežné [ShowSubjectTypeName('imperial_free_city')], ale ich autonómia je teraz výrazne znížená, a preto ich už možno annexed, rýchlejšie než bežného [ShowSubjectTypeName('vassal')]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 tributary: "Tributár" # todo: NEW TRANSLATION
 tributary_desc: "Tributárna krajina je krajina, ktorá je nútená platiť pravidelný tribut svojmu [overlord|e] vo forme [Concept('gold','dukátom')|e], [Concept('manpower','živej sile')|e] a [Concept('sailors','námorníci')|e], a je exkluzívna pre určité formy vlády. V porovnaní s bežným [ShowSubjectTypeName('vassal')] môžu tributári vyhlasovať vlastné vojny, dokonca medzi sebou, ale automaticky sa nepripoja k vojnám svojho [overlord|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 tributary_join_defensive_wars_always_tt: "Subjekt je napadnutý inou krajinou, ktorá nie je ďalším tributárom pána." # todo: NEW TRANSLATION

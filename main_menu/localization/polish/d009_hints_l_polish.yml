l_polish:
 hint_battle_for_the_strait: "[GetSituationByKey('battle_for_the_strait').GetNameWithNoTooltip] – tipy" # todo: NEW TRANSLATION
 hint_battle_for_the_strait_hint_text: "$hint_battle_for_the_strait_hint_text_1$\n\n$hint_battle_for_the_strait_hint_text_2$\n\n$hint_battle_for_the_strait_hint_text_3$\n\n$hint_battle_for_the_strait_hint_text_4$\n\n$hint_battle_for_the_strait_hint_text_5$" # todo: NEW TRANSLATION
 hint_battle_for_the_strait_hint_text_1: "[GetSituationByKey('battle_for_the_strait').GetName] je [situation_with_icon|e], v ktorej [GetCountry('CAS').GetName] a [GetCountry('MOR').GetName] bojujú o úzke vody medzi [ShowRegionName('iberia_region')] a [ShowRegionName('maghreb_region')], zatiaľ čo [GetCountry('GRA').GetName] sa medzi nimi snaží prežiť. Súboj merajú dva ukazovatele. Vplyv na [GetCountry('GRA').GetNameWithNoTooltip] sa presúva medzi dvoma veľmocami a postupne sa vracia do stredu, zatiaľ čo [Concept('granadan_sovereignty','granadská suverenita')|e] ukazuje, nakoľko slobodne si [GetCountry('GRA').GetNameWithNoTooltip] vládne samo. Ak do [ShowAgeName('age_3_discovery')] nikto nezvíťazí, boj sa skončí patom." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 hint_battle_for_the_strait_hint_text_2: "#T Ako každá mocnosť zvíťazí:#!\n@arrow_bonus_tier_2! [GetCountry('CAS').GetNameWithNoTooltip] musí vytlačiť [GetCountry('MOR').GetNameWithNoTooltip] z [ShowRegionNameWithNoTooltip('iberia_region')] a ovládnuť oblasť [ShowAreaName('granada_area')] priamo alebo prostredníctvom [subjects_with_icon|e]. Potom musí z [GetCountry('GRA').GetNameWithNoTooltip] urobiť svojho [ShowSubjectTypeName('vassal')], pričom vplyv musí byť úplne na jej strane, alebo ho celé dobyť. Nestačí, ak ho bude mať ako [ShowSubjectTypeName('tributary')].\n@arrow_bonus_tier_2! [GetCountry('MOR').GetNameWithNoTooltip] musí ovládať oblasti [ShowAreaName('granada_area')], [ShowAreaName('andalusia_area')] a [ShowAreaName('murcia_area')] priamo alebo prostredníctvom [subjects]. Potom si musí podriadiť [GetCountry('GRA').GetNameWithNoTooltip] ako svojho [ShowSubjectTypeName('vassal')] alebo [ShowSubjectTypeName('taifa')], pričom vplyv musí byť úplne na jej strane, alebo ho celé dobyť.\n@arrow_bonus_tier_2! [GetCountry('GRA').GetNameWithNoTooltip] musí zostať nezávislé a ovládať tie isté tri oblasti. Vplyv musí udržať v rozmedzí #Y 50#! od stredu a svoju [granadan_sovereignty] nad hodnotou #Y 50#!.\n@arrow_bonus_tier_1! Ak [GetCountry('CAS').GetNameWithNoTooltip] alebo [GetCountry('MOR').GetNameWithNoTooltip] padne, boj sa okamžite skončí a víťazstvo si pripíše mocnosť, ktorá ovláda tieto územia." # todo: NEW TRANSLATION
 hint_battle_for_the_strait_hint_text_3: "#T Odporúčané kroky za [GetCountry('CAS').GetNameWithNoTooltip]:#!\n@arrow_bonus_tier_3! Nariaďme nášmu [cabinet_with_icon|e] vykonať akciu [ShowCabinetActionName('cas_pressure_andalusi_court')], ktorá každý mesiac posúva vplyv na našu stranu.\n@arrow_bonus_tier_2! Keď sa vplyv nakloní na našu stranu o #Y 25#!, pomocou akcie [ShowGenericActionName('cas_force_tribute')] si môžeme podriadiť oslabené [GetCountry('GRA').GetNameWithNoTooltip]. Pri hodnote #Y 100#! dokončí naše úsilie akcia [ShowGenericActionName('vassalize_granada')].\n@arrow_bonus_tier_1! Akcie [ShowGenericActionName('cas_reduce_granadan_sovereignty')] a [ShowGenericActionName('cas_dismantle_fortifications')] zabránia tomu, aby sa nám podriadené [GetCountry('GRA').GetNameWithNoTooltip] ešte niekedy postavilo na vlastné nohy." # todo: NEW TRANSLATION
 hint_battle_for_the_strait_hint_text_4: "#T Odporúčané kroky za [GetCountry('MOR').GetNameWithNoTooltip]:#!\n@arrow_bonus_tier_3! Nariaďme nášmu [cabinet] vykonať akciu [ShowCabinetActionName('mor_cultivate_andalusi_influence')] a udržujme v prielive silné [navy_with_icon|e]. Flotily v jeho vodách posúvajú vplyv na stranu svojho vlastníka.\n@arrow_bonus_tier_2! Akcia [ShowGenericActionName('claim_andalusi_inheritance')] nám poskytne [casus_belli_with_icon|e] proti krajine v [ShowRegionNameWithNoTooltip('iberia_region')], čím si otvoríme cestu k trom potrebným oblastiam.\n@arrow_bonus_tier_1! Keď sa vplyv nakloní na našu stranu o #Y 25#!, pomocou akcie [ShowGenericActionName('mor_force_tribute')] si môžeme podriadiť oslabené [GetCountry('GRA').GetNameWithNoTooltip], no k víťazstvu sa počíta iba [ShowSubjectTypeName('vassal')] alebo [ShowSubjectTypeName('taifa')]." # todo: NEW TRANSLATION
 hint_battle_for_the_strait_hint_text_5: "#T Odporúčané kroky za [GetCountry('GRA').GetNameWithNoTooltip]:#!\n@arrow_bonus_tier_3! Pomocou akcií [ShowGenericActionName('gra_reduce_castilian_influence')] a [ShowGenericActionName('gra_reduce_moroccan_influence')] udržujme vplyv blízko stredu a nariaďme nášmu [cabinet] vykonať akciu [ShowCabinetActionName('gra_promote_sovereignty')].\n@arrow_bonus_tier_2! Naša [granadan_sovereignty] rastie, keď zostávame nezávislí a v mieri, a ďalej ju zvyšuje naša [prestige_with_icon|e] a [crown_power_with_icon|e]. Zvyšuje ju aj akcia [ShowGenericActionName('gra_enforce_sovereignty')] a každé rozšírenie budovy [ShowBuildingTypeName('alhambra')].\n@arrow_bonus_tier_1! Každý rok strávený ako [subject_with_icon|e] nás stojí viac [granadan_sovereignty] než ten predchádzajúci a odčerpáva ju aj vojna. Čím viac jej máme nad hodnotou #Y 50#!, tým rýchlejšie klesá, preto sa o ňu treba starať.\n@hint! [disaster_with_icon|e] v [GetCountry('CAS').GetNameWithNoTooltip] alebo [GetCountry('MOR').GetNameWithNoTooltip] nám počas svojho trvania zvyšuje [granadan_sovereignty]." # todo: NEW TRANSLATION
 hint_battle_for_the_strait_diplomatic: "„[GetCountry('GRA').GetName] sa prikláňa k svojim priateľom. Kto mu ponúkne spojenectvo alebo záruku, získa si ho na svoju stranu, a spoločná viera ho pritiahne ešte viac.“" # todo: NEW TRANSLATION
 hint_battle_for_the_strait_administrative: "„Vplyv na [GetCountry('GRA').GetName] sa s každým ďalším mesiacom vracia do stredu. O každý náskok sa treba starať, inak sa vytratí.“" # todo: NEW TRANSLATION
 hint_battle_for_the_strait_military: "„Kto ovláda prieliv, ovláda aj celý boj. Flotily v jeho vodách a posádky v jeho prístavoch doliehajú na [GetCountry('GRA').GetName] rovnako ťaživo ako akákoľvek armáda.“" # todo: NEW TRANSLATION
 hint_golden_century: "[GetSituationByKey('golden_century').GetNameWithNoTooltip] – tipy" # todo: NEW TRANSLATION
 hint_golden_century_hint_text: "$hint_golden_century_hint_text_1$\n\n$hint_golden_century_hint_text_2$" # todo: NEW TRANSLATION
 hint_golden_century_hint_text_1: "[GetSituationByKey('golden_century').GetName] je [situation_with_icon|e], ktorá nasleduje po [GetSituationByKey('battle_for_the_strait').GetName] a víťazovi prináša storočie nadvlády nad Európou a Novým svetom. Víťaz sa stane Kolosom svojej doby, zatiaľ čo jeho rivali a susedia budú s čoraz väčšími obavami sledovať jeho vzostup." # todo: NEW TRANSLATION
 hint_golden_century_hint_text_2: "#T Ako vyhrať zlatý vek:#!\n@arrow_bonus_tier_2! Dosah Kolosa merajú dva ukazovatele. [Concept('gc_european_dominance','Európska dominancia')|e] rastie vďaka víťazstvám v kontinentálnych vojnách a dynastickej a náboženskej prevahe doma, zatiaľ čo [Concept('gc_colonial_dominance','koloniálna dominancia')|e] rastie kolonizáciou, pokladnicovými flotilami a šírením viery v zámorí. Oba ukazovatele rastú po jednotlivých stupňoch a každá dosiahnutá hranica od #Y 25#! do #Y 100#! prináša Kolosovi trvalú odmenu.\n@arrow_bonus_tier_1! Nadvláda prináša nebezpečenstvo. Ukazovateľ [Concept('flashpoint','zlomový bod')|e] stúpa s bremenom dlhov a inflácie, ktoré ešte zvyšuje prekračovanie hraníc vlastnej moci a závisť, ktorú vzbudzuje veľké postavenie. Keď sa naplní, Kolosa zasiahne rozhodujúca udalosť s priaznivým alebo nepriaznivým výsledkom a [GetInternationalOrganizationType('grand_alliance').GetName] sa spojí, aby ho zrazila na kolená. Porážka vo vojne môže znížiť ktorýkoľvek z ukazovateľov o #Y 25#!, a ak Kolos príde o štvrtinu územia, ktoré ovládal na začiatku, jeho zlatý vek sa skončí predčasne." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 hint_golden_century_diplomatic: "„Či stojíme na strane Kolosa, alebo medzi tými, čo sa ho obávajú, spojenectvá formujú túto dobu. Vládnuca mocnosť sa opiera o svojich priateľov, aby udržala koalíciu na uzde, zatiaľ čo tí, ktorí ju chcú pokoriť, sa pripájajú k [GetInternationalOrganizationType('grand_alliance').GetName] a delia sa o náklady na zúčtovanie.“" # todo: NEW TRANSLATION
 hint_golden_century_administrative: "„Zlatý vek sa buduje doma rovnako ako v zahraničí. Starajme sa o našu [control_with_icon|e] a lojalitu našich [subjects_with_icon|e] a nedovoľme, aby sa prehlbovali dlhy a nepokoje, pretože zvyšujú ďalší [Concept('flashpoint','zlomový bod')|e].“" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 hint_golden_century_military: "„Nadvláda sa získava mečom a mečom sa aj stráca. Kolos musí brániť svoje územia, aby prečkal celé storočie, zatiaľ čo jeho nepriatelia musia dobyť štvrtinu jeho územia, aby predčasne ukončili zlatý vek.“" # todo: NEW TRANSLATION

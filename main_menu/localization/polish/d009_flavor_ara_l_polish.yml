l_polish:
 flavor_ara.31.entry: "$flavor_ara.31.title$" # todo: NEW TRANSLATION
 flavor_ara.31.title: "Slabosť v [ShowLocationNameWithNoTooltip('athens')]" # todo: NEW TRANSLATION
 flavor_ara.31.desc: "Napriek nášmu niekdajšiemu vplyvu v [ShowProvinceDefinitionName('attica_province')] je kedysi veľkolepá spoločnosť, ktorá chránila [ShowRegionName('balkan_region')], už len tieňom svojej bývalej slávy a čoraz viac sa nám vymyká spod kontroly. Namiesto toho, aby sme im dovolili ešte viac zoslabnúť a stať sa menej poslušnými, by sme možno mali konečne zasiahnuť a zbaviť ich moci v [ShowLocationName('athens')], čím by sme v oblasti obnovili [ROOT.GetCountry.GetAdjective] poriadok." # todo: NEW TRANSLATION
 flavor_ara.31.a: "„Pripomeňme“ im ich povinnosti." # todo: NEW TRANSLATION
 flavor_ara.31.b: "Politika v [ShowRegionNameWithNoTooltip('balkan_region')] sa nás netýka." # todo: NEW TRANSLATION
 flavor_ara.32.entry: "$flavor_ara.32.title$" # todo: NEW TRANSLATION
 flavor_ara.32.title: "Trón v [ShowLocationNameWithNoTooltip('naples')]" # todo: NEW TRANSLATION
 flavor_ara.32.desc: "Usilujeme sa rozšíriť svoj vplyv v [ShowRegionName('italy_region')] a posilniť náš obchod v Stredozemí; v ceste nám však stojí [GetCountry('NAP').GetLongName], ktoré ovláda mnohé vzácne prístavy, nevyhnutné pre naše plány. Keďže sme si už privlastnili [ShowAreaName('sicily_area')], máme teraz ďalší dôvod zjednotiť ho s jeho severným náprotivkom v [ShowLocationName('naples')]. Možno by to dokonca mohlo znamenať zrod nového [ROOT.GetCountry.GetGovernment.GetCourtTitle] v [ShowRegionNameWithNoTooltip('italy_region')]..." # todo: NEW TRANSLATION
 flavor_ara.32.a: "Koruny musia byť zjednotené." # todo: NEW TRANSLATION
 flavor_ara.32.b: "Nemali by sme vyostrovať situáciu v [ShowRegionNameWithNoTooltip('italy_region')]." # todo: NEW TRANSLATION
 ara_allows_naples_fiefdom_regardless_of_warscore_cost: "Pomocou [ShowCasusBelliName('cb_claim_throne_of_naples')] [casus_belli|e] budeme môcť urobiť z [GetCountry('NAP').GetName] naše [ShowSubjectTypeName('fiefdom')]" # todo: NEW TRANSLATION
 flavor_ara.33.title: "Víťazstvo v [ShowLocationNameWithNoTooltip('naples')]" # todo: NEW TRANSLATION
 flavor_ara.33.desc: "Naše vojská zvíťazili v nedávnom konflikte s vládcami [ShowLocationName('naples')]!\n\nJeho kedysi veľkolepé hradby sa zmenili na ruiny a jeho bývalé mocenské sídlo nám teraz poslúži na ďalšie upevnenie našej vlády nad týmito krajinami. Hoci v južnej časti [ShowRegionName('italy_region')] naďalej pretrvávajú ohniská odporu, nikto sa neodváži spochybniť naše nedávne výboje.\n\nMožno by sme teraz mali obrátiť pozornosť dovnútra a venovať sa záležitostiam [ShowCultureGroupName('italian_group')], predstaviť im naše zvyky, zákony a kultúru." # todo: NEW TRANSLATION
 flavor_ara.33.a: "Toto víťazstvo treba osláviť!" # todo: NEW TRANSLATION
 flavor_ara.35.entry: "$flavor_ara.35.title$" # todo: NEW TRANSLATION
 flavor_ara.35.title: "Naši príbuzní v [ShowAreaNameWithNoTooltip('sicily_area')]" # todo: NEW TRANSLATION
 flavor_ara.35.desc: "Vďaka [ShowCultureName('sicilian')] vešperám, ktoré zaistili trón rodu [target_character.GetDynasty.GetName], náš vplyv v [ShowRegionName('italy_region')] vzrástol. Napriek tomu si [ShowAreaName('sicily_area')] stále zachováva svoju suverenitu a drží sa bokom od našej dynastickej politiky. Namiesto toho, aby sme túto príležitosť premárnili, by sme sa možno mohli spojiť s našimi tamojšími príbuznými, vytvoriť pevnejšie dynastické spojenie a potenciálne naštartovať naše ambície v [ShowRegionNameWithNoTooltip('italy_region')]." # todo: NEW TRANSLATION
 flavor_ara.35.a: "Zjednotíme obe vetvy." # todo: NEW TRANSLATION
 flavor_ara.35.b: "Možno môžeme túto príležitosť využiť na záchranu povesti nášho [ROOT.GetCountry.GetFlavorRank]." # todo: NEW TRANSLATION
 ara_unlock_decision_to_unite_sicily_and_aragon_crowns_tt: "Sprístupní sa nám [Concept('decision','rozhodnutiu')|e] [ShowDecisionName('ara_unite_barcelona_dynasty')], ktorá nám umožní vytvoriť [Concept('union','únia')|e] s krajinou [GetCountry('SIC').GetName], ak s ňou budeme mať dostatočne vysokú [Concept('opinion','názor')|e]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 flavor_ara.36.entry: "Druhý dvor" # todo: NEW TRANSLATION
 flavor_ara.36.title: "Druhý [ROOT.GetCountry.GetGovernment.GetCourtTitle]" # todo: NEW TRANSLATION
 flavor_ara.36.desc: "Prestíž a sláva, ktorou sa [ShowRegionName('italy_region')] teší, je niečo, čo nemôže ignorovať žiadny vládca [ShowContinentName('europe')]. Keďže ovládame [ShowAreaName('sicily_area')] a [ShowLocationName('naples')], [target_character.GetName] začal zvažovať vytvorenie druhého hlavného mesta [ROOT.GetCountry.GetAltAdjective('G')] v bohatých mestách [ShowRegionNameWithNoTooltip('italy_region')]. Umožnilo by nám to ešte lepšie ovládať tamojšiu miestnu šľachtu a zároveň dať mladším členom rodu [target_character.GetDynasty.GetName] príležitosť získať skúsenosti." # todo: NEW TRANSLATION # todo: COUNTRY CASE
 flavor_ara.36.a: "Tento nový [ROOT.GetCountry.GetGovernment.GetCourtTitle] určite prinesie vlnu prosperity." # todo: NEW TRANSLATION
 flavor_ara.36.b: "Nie je potrebné sústrediť sa na [ShowRegionNameWithNoTooltip('italy_region')]." # todo: NEW TRANSLATION
 ara_all_italian_pops_become_satisfied_tt: "Každá [Concept('pop','populácia')|e] zo skupiny [ShowCultureGroupName('italian_group')] získa [ShowNamedValue('pop_satisfaction_severe_bonus')|+=2%] [Concept('pop_satisfaction','spokojnosť populácie')|e]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 flavor_ara.37.entry: "$flavor_ara.37.title$" # todo: NEW TRANSLATION
 flavor_ara.37.title: "Opevňovanie [ShowRegionNameWithNoTooltip('italy_region')]" # todo: NEW TRANSLATION
 flavor_ara.37.desc: "Udržať si vojenskú kontrolu nad [ShowRegionName('italy_region')] si vyžaduje veľa práce.\n\n[ROOT.GetCountry.GetGovernment.GetCourtTitle] v [italian_court.GetName] si všimol slabé miesto na hranici, konkrétne v oblasti [target_location.GetRank.GetName] [target_location.GetName], ktorej [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')] nevenoval zaslúženú pozornosť. Mnohí preto tvrdia, že by sme mali posilniť jej opevnenie a zaistiť bezpečnosť [ShowRegionNameWithNoTooltip('italy_region')], čím by sme otvorili novú éru bezpečia." # todo: NEW TRANSLATION
 flavor_ara.37.a: "Opevníme našu hranicu." # todo: NEW TRANSLATION
 flavor_ara.37.b: "Všetko úsilie by sme mali radšej venovať nášmu hlavnému mestu." # todo: NEW TRANSLATION
 flavor_ara.38.entry: "Palác pre [ShowCultureGroupNameWithNoTooltip('italian_group')] dvor" # todo: NEW TRANSLATION
 flavor_ara.38.title: "Palác pre [ShowCultureGroupNameWithNoTooltip('italian_group')] [ROOT.GetCountry.GetGovernment.GetCourtTitle]" # todo: NEW TRANSLATION
 flavor_ara.38.desc: "Vďaka našej prítomnosti v [ShowRegionName('italy_region')] môžeme tento región spravovať oveľa priamejšie. Zatiaľ čo si však obyvatelia [ROOT.GetCountry.GetCapital.GetName] užívajú luxus, druhý [ROOT.GetCountry.GetGovernment.GetCourtTitle] sa domnieva, že si zaslúži rovnakú pozornosť. Namiesto toho, aby [target_character.GetName] zradil dôveru [ShowCultureGroupName('italian_group')] [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')], rozhodol sa zadať stavbu veľkolepého paláca. Časť nákladov uhradia bohaté kupecké rodiny a časť [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')]. Palác tak bude vyjadrovať našu autoritu nad bohatými mestami na polostrove." # todo: NEW TRANSLATION
 flavor_ara.38.a: "Veľkolepý palác pre veľkolepé mesto [italian_court.GetRank.GetNameWithNoTooltip]." # todo: NEW TRANSLATION
 flavor_ara.38.a.entry: "Veľkolepý palác pre veľkolepé mesto." # todo: NEW TRANSLATION
 flavor_ara.38.b: "Tento projekt by sme mali odložiť." # todo: NEW TRANSLATION
 flavor_ara.39.entry: "$flavor_ara.39.title$" # todo: NEW TRANSLATION
 flavor_ara.39.title: "Zásah v [ShowRegionNameWithNoTooltip('maghreb_region')]" # todo: NEW TRANSLATION
 flavor_ara.39.desc: "Zabezpečenie nášho obchodu si niekedy vyžaduje viac než len pero.\n\nNaši obchodní partneri v krajine [GetCountry('TUN').GetName] sa nám postupom času odcudzili a my sme nezabudli na ich podporu vzbury v [ShowLocationName('ajim')]. Nemali by sme nečinne sedieť a nechať naše nároky postupne vyprchať. Mali by sme radšej vyslať vojenskú výpravu a získať späť tento kedysi dôležitý prístav pre naše [ROOT.GetCountry.GetFlavorRank]." # todo: NEW TRANSLATION
 flavor_ara.39.a: "Vyplávajme do [ShowLocationNameWithNoTooltip('ajim')]." # todo: NEW TRANSLATION
 flavor_ara.42.common_desc: "Naše vzťahy s krajinou [from_country.GetName] prepojili naše panstvá a umožnili jej zasahovať do našej politiky. Využívajúc svoje postavenie krajiny s rovnakým rodom [target_character.GetDynasty.GetName] a zároveň veľmoci v rámci [ShowContinentName('europe')]," # todo: NEW TRANSLATION
 flavor_ara.42.title: "Naši príbuzní" # todo: NEW TRANSLATION
 flavor_ara.42.desc: "$flavor_ara.42.common_desc$ sa teraz usilujú získať náš trón a požadujú, aby bol [target_character2.GetName] degradovaný na obyčajného miestodržiteľa krajiny [ROOT.GetCountry.GetAltAdjective('G')]." # todo: NEW TRANSLATION # todo: COUNTRY CASE
 flavor_ara.42.a: "Podvolíme sa ich vôli." # todo: NEW TRANSLATION
 flavor_ara.42.b: "Prečo by sme mali prenechať trón tým, ktorí si ho ničím nezaslúžili?" # todo: NEW TRANSLATION
 flavor_ara.43.title: "$flavor_ara.42.title$" # todo: NEW TRANSLATION
 flavor_ara.43.desc: "$flavor_ara.42.common_desc$ sa nás teraz usilujú urobiť svojím vazalom a zbaviť [target_character2.GetName] akejkoľvek moci nad krajinou [ROOT.GetCountry.GetAltAdjective('I')]." # todo: NEW TRANSLATION # todo: COUNTRY CASE
 flavor_ara.43.a: "$flavor_ara.42.a$" # todo: NEW TRANSLATION
 flavor_ara.43.b: "$flavor_ara.42.b$" # todo: NEW TRANSLATION
 flavor_ara.1100.entry: "$flavor_ara.1100.title$" # todo: NEW TRANSLATION
 flavor_ara.1100.title: "Správa z krajiny [GetCountry('BOS').GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 flavor_ara.1100.desc: "Veľký [target_character.GetName] z krajiny [GetCountry('BOS').GetName] už dlho zápasí o zachovanie svojej suverenity voči chamtivým susedom. Keďže sa nedokážu ubrániť sami, viacerí [GetCountry('BOS').GetGovernment.GetEstateName('nobles_estate')] sa obrátili na [target_character2.GetName] a [ROOT.GetCountry.GetGovernment.GetCourtTitle] so žiadosťou o ochranu pred prípadnou inváziou. Radšej by sa stali našimi poddanými, než by padli do rúk pohanov, čo môžeme využiť vo svoj prospech." # todo: NEW TRANSLATION
 flavor_ara.1100.a: "Pozrime sa, čo sa dá robiť." # todo: NEW TRANSLATION
 ara_unlock_decision_to_demand_vassalization_of_bosnia_tt: "Sprístupní sa nám [Concept('decision','rozhodnutiu')|e] [ShowDecisionName('ara_vassalize_bosnia')]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 flavor_ara.1101.title: "Diplomati z krajiny [from_country.GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 flavor_ara.1101.desc: "V snahe ochrániť nás pred cudzími hrozbami sa naši [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] obrátili so žiadosťou o pomoc na krajinu [from_country.GetName]. Tá v odpovedi vyslala delegáciu, aby o tejto záležitosti rokovala. Keďže vedia, že by sme si radšej zvolili potupu než smrť, požiadali nás, aby sme sa stali ich poddanými. Ich vojská a [from_country.GetGovernment.GetEstateName('nobles_estate')] nás tak budú môcť chrániť priamo, namiesto toho, aby sa spoliehali na voľné spojenectvo medzi našimi krajinami." # todo: NEW TRANSLATION
 flavor_ara.1101.a: "Podvolíme sa im." # todo: NEW TRANSLATION
 flavor_ara.1101.b: "Nech nás teda postihne smrť, ale nech vedia, že zomrieme slobodní, so zbraňou v ruke!" # todo: NEW TRANSLATION

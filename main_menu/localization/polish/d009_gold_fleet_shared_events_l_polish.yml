l_polish:
 gold_fleet_shared_events.1.title: "Morskí lúpežníci na obzore" # todo: NEW TRANSLATION
 gold_fleet_shared_events.1.desc: "Náveterným smerom sa objavili plachty a bez vlajok sa približujú k flotile. Sú to malé, rýchle plavidlá ostrovných lúpežníkov, stavané tak, aby dokázali plávať proti vetru a uniknúť cez plytčiny, kam ich žiadna galeóna nedokáže nasledovať.\n\nSú tri alebo štyri a vybrali si vhodnú chvíľu. Noc so slabým vetrom roztiahla flotilu a naša zadná loď, naložená pokladom, zaostala za ostatnými o pol ligy." # todo: NEW TRANSLATION
 gold_fleet_shared_events.1.a: "Vyhlásiť bojový poplach a zahnať ich." # todo: NEW TRANSLATION
 gold_fleet_shared_events.1.b: "Podplatiť ich skôr, než sa priblížia." # todo: NEW TRANSLATION
 gold_fleet_shared_events.1.c: "Rozvinúť všetky plachty a pokúsiť sa im uniknúť." # todo: NEW TRANSLATION
 gold_fleet_shared_events.1.d: "Vyslať signál druhej flotile. Spoločne ich dostihneme!" # todo: NEW TRANSLATION
 gold_fleet_shared_events.1.historical_info: "Korzári a piráti sužovali španielske flotily s pokladom počas 16. a 17. storočia. Či už operovali na základe kráľovských listov značky, alebo na vlastnú päsť, naučili sa využívať geografiu Karibiku: plavidlami s malým ponorom preplávali prielivmi medzi ostrovmi a zmocňovali sa lodí, ktoré od konvoja oddelili búrky či nepriaznivý vietor. Strieborný náklad mal takú hodnotu, že aj jeho čiastočné ulúpenie mohlo financovať celú lúpežnú výpravu." # todo: NEW TRANSLATION
 gold_fleet_shared_events.pirate_fight_fail_tt: "Lúpežníci sú príliš rýchli a je ich priveľa — skôr než ich zaženieme, prídeme o polovicu nákladu" # todo: NEW TRANSLATION
 gold_fleet_shared_events.pirate_flee_fail_tt: "Lúpežníci dostihnú flotilu skôr, než sa jej podarí uniknúť — prídeme o štvrtinu nákladu" # todo: NEW TRANSLATION
 gold_fleet_shared_events.2.title: "Nepriateľská eskadra zachytila flotilu" # todo: NEW TRANSLATION
 gold_fleet_shared_events.2.desc: "Výstraha od hliadky prichádza až príliš neskoro. Vojnové lode sa k nám rútia z náveternej strany pod plnými plachtami, hlboko ponorené pod ťarchou diel a mužov a s nepriateľskými vlajkami [ROOT.GetCountry.GetAltAdjective('I')]. Sú to lode línie, dosť rýchle na to, aby pred zotmením dobehli najpomalšiu loď flotily.\n\nVietor nám nedovoľuje pokúsiť sa o útek a podpalubia sú plné ročnej zásoby [ShowGoodsName('silver')] [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')]. [target_leader.GetName] sa musí rozhodnúť, či bude bojovať, rozptýli flotilu alebo sa vzdá a príde o všetko." # todo: NEW TRANSLATION # todo: COUNTRY CASE
 gold_fleet_shared_events.2.a: "Zostaviť bojovú líniu a preraziť." # todo: NEW TRANSLATION
 gold_fleet_shared_events.2.b: "Rozptýliť flotilu. Niektoré lode možno uniknú, iné nie." # todo: NEW TRANSLATION
 gold_fleet_shared_events.2.c: "Otočiť sa a utiecť po vetre; predbehnúť ich alebo prísť o všetko." # todo: NEW TRANSLATION
 gold_fleet_shared_events.2.historical_info: "Najväčšiu hrozbu pre strieborné flotily nepredstavovali osamelí korzári, ale námorné výpravy konkurenčných mocností podporované štátom. Holandský admirál Piet Hein v roku 1628 pri zálive Matanzas na Kube zajal celú flotilu vracajúcu sa domov — jediný prípad v dejinách, keď sa podarilo zmocniť celej španielskej striebornej flotily. Keď do karibských vôd vo veľkom počte vstúpili významné námorné mocnosti, eskortované konvoje, ktoré si poradili s menšími nájazdníkmi, mohli podľahnúť organizovaným flotilovým útokom." # todo: NEW TRANSLATION
 gold_fleet_shared_events.warship_fight_fail_tt: "Nepriateľská eskadra v boji zvíťazí — prídeme o tri štvrtiny nákladu" # todo: NEW TRANSLATION
 gold_fleet_shared_events.warship_flee_fail_tt: "Nepriateľská eskadra dostihne flotilu skôr, než sa jej podarí uniknúť — prídeme o polovicu nákladu" # todo: NEW TRANSLATION
 gold_fleet_shared_events.3.title: "Naše námorníctvo zachytilo flotilu s pokladom" # todo: NEW TRANSLATION
 gold_fleet_shared_events.3.desc: "Z Karibiku prichádzajú správy. Naša eskadra narazila na nepriateľskú flotilu s pokladom a zviedla s ňou boj, pri ktorom rozprášila jej zostavu; nejeden z našich kapitánov sa v boji vyznamenal. Správa sa čoskoro dostane do [ROOT.GetCountry.GetCapital.GetName] a ešte skôr k nepriateľským finančníkom.\n\n[ShowGoodsName('silver')], ktoré prúdi týmito vodami, financuje nepriateľské armády a ich spojenectvá. Každý náklad, ktorý získame, je náklad, ktorý proti nám nebudú môcť použiť." # todo: NEW TRANSLATION # todo: COUNTRY CASE
 gold_fleet_shared_events.3.a: "Naši kapitáni nám dobre poslúžili. Odmeňte ich." # todo: NEW TRANSLATION
 gold_fleet_shared_events.3.historical_info: "Správa o strete s flotilou s pokladom sa mohla šíriť rýchlejšie než samotné lode, prenášaná rýchlymi kuriérskymi plavidlami. Úspešné zachytenie konvoja bolo významnou diplomatickou a finančnou udalosťou: zajatie čo i len časti strieborného konvoja mohlo financovať činnosť eskadry na celé roky, zatiaľ čo jeho nedorazenie otriaslo kráľovskými financiami, úvermi aj schopnosťou viesť vojnu v Európe." # todo: NEW TRANSLATION
 gold_fleet_shared_events.4.title: "Flotila [ROOT.GetCountry.GetDiplomacy.GetOverlord.GetNameWithNoTooltip] nakladá náš náklad" # todo: NEW TRANSLATION
 gold_fleet_shared_events.4.desc: "Do nášho prístavu dorazila flotila [ROOT.GetCountry.GetDiplomacy.GetOverlord.GetName] a jej obchodní zástupcovia už prehľadávajú naše sklady a spisujú, čo im dlhujeme. Bary [ShowGoodsName('silver')], mince, kože a koloniálny tovar — to všetko pod ozbrojeným dozorom vynášajú a nakladajú na palubu, aby to previezli do Španielska.\n\nNaši [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')] si vedú presné účty a vedia na uncu presne, čo dnes opúšťa prístavisko. Zbierali sme to celé mesiace a [ROOT.GetCountry.GetName] pocíti túto stratu až do ďalšej úrody." # todo: NEW TRANSLATION
 gold_fleet_shared_events.4.a: "Dodáme, čo [ROOT.GetCountry.GetDiplomacy.GetOverlord.GetNameWithNoTooltip] žiada, a nič viac." # todo: NEW TRANSLATION
 gold_fleet_shared_events.4.historical_info: "Koloniálne prístavy boli v stave vynútenej obchodnej závislosti od materskej krajiny. Všetok koloniálny obchod musel prebiehať cez schválené kanály a väčšina ziskov zo striebra, koží a farbív pripadla korune a obchodným domom v Seville, nie obchodníkom a kreolskej elite, ktorí ich vyprodukovali. Toto systémové napätie sa počas koloniálnych storočí ešte prehlbovalo." # todo: NEW TRANSLATION
 gold_fleet_shared_events.5.title: "More sa obrátilo proti nám" # todo: NEW TRANSLATION
 gold_fleet_shared_events.5.desc: "Obloha na východe nadobudla farbu modriny a vlnobitie rýchlo silnie. Na flotilu sa rúti mohutná búrka a už jej nedokážeme uniknúť. Vietor v lanoví zavýja, zatiaľ čo [target_leader.GetName] vydáva rozkaz, ktorý rozhodne o tom, koľko lodí sa ešte dožije pokojnej hladiny.\n\nMôžeme zomknúť zostavu a spoločne prečkať búrku, spoliehajúc sa na námornícke umenie a šťastie, alebo lode rozptýliť a odľahčiť ich vyhadzovaním nákladu cez palubu." # todo: NEW TRANSLATION
 gold_fleet_shared_events.5.a: "Zomknúť zostavu a spoločne prečkať búrku." # todo: NEW TRANSLATION
 gold_fleet_shared_events.5.b: "Rozptýliť lode a odľahčiť náklad." # todo: NEW TRANSLATION
 gold_fleet_shared_events.5.c: "Uchýliť sa do bezpečia priateľského prístavu a opraviť lode." # todo: NEW TRANSLATION
 gold_fleet_shared_events.5.unscathed_tt: "Flotila sa udrží pohromade a búrku prečká bez ujmy" # todo: NEW TRANSLATION
 gold_fleet_shared_events.5.lose_fleet_tt: "Búrka pohltí časť flotily a polovica nákladu klesne ku dnu spolu s loďami" # todo: NEW TRANSLATION
 gold_fleet_shared_events.5.lose_all_tt: "Búrka premôže flotilu, ktorá sa stratí aj s celou posádkou; výprava sa tu končí" # todo: NEW TRANSLATION
 gold_fleet_shared_events.5.lose_cargo_tt: "Aby lode zostali na hladine, náklad sa vyhadzuje cez palubu a časť koristi sa stratí" # todo: NEW TRANSLATION
 gold_fleet_shared_events.5.historical_info: "Atlantické hurikány boli najsmrteľnejším nepriateľom flotíl s pokladom a pustošili ich viac než ktorýkoľvek korzár. Flotila Tierra Firme z roku 1622 pri hurikáne neďaleko ostrovov Florida Keys prišla o osem lodí vrátane #italic Nuestra Señora de Atocha#!, ktorej vrak naložený striebrom objavili až o tri a pol storočia neskôr. V roku 1715 zahnal júlový hurikán na floridské pobrežie celú flotilu vracajúcu sa domov a utopilo sa približne tisíc mužov. Velitelia sa začali obávať hurikánovej sezóny viac než nepriateľských plachiet." # todo: NEW TRANSLATION
 gold_fleet_shared_events.6.title: "Horúčka pod palubou" # todo: NEW TRANSLATION
 gold_fleet_shared_events.6.desc: "Horúčava pod palubou je ako živá bytosť a spolu s ňou prišla aj choroba. Muži, ktorí ešte pred týždňom držali hliadku, teraz ležia v tme a potia sa; chirurg môže len počítať mŕtvych a dúfať, že ostatných choroba ušetrí. Zlá voda, stiesnené priestory a tropické podnebie dokázali to, čo nedokázal žiadny korzár.\n\n[target_leader.GetName] sa musí rozhodnúť, ako flotila s horúčkou naloží, skôr než úplne vyčerpá posádky." # todo: NEW TRANSLATION
 gold_fleet_shared_events.6.a: "Zakotviť a vysadiť chorých na breh, kým horúčka neustúpi." # todo: NEW TRANSLATION
 gold_fleet_shared_events.6.b: "Nemôžeme kvôli chorobe zmeškať sezónu. Žeňme posádku ďalej." # todo: NEW TRANSLATION
 gold_fleet_shared_events.6.c: "Zastaviť sa po čerstvú vodu a doplniť posádky zdravými mužmi z brehu." # todo: NEW TRANSLATION
 gold_fleet_shared_events.6.historical_info: "Choroby zabili na palubách lodí #italic Carrera de Indias#! omnoho viac mužov než búrky a nepriateľské útoky dohromady. Dlhé plavby, stojatá voda, slané zásoby a preplnené podpalubia šírili skorbut, úplavicu a týfus, zatiaľ čo tropické karibské prístavy boli ohniskami malárie a ďalších smrteľných horúčok, ktoré dokázali v priebehu niekoľkých týždňov po príchode zdecimovať posádku. Flotile, ktorá sa v Západnej Indii zdržala pridlho, hrozilo, že sa vráti domov s primalým počtom mužov na obsluhu lodí; kapitáni tak zvažovali nebezpečenstvo mora oproti pomalšiemu, no istejšiemu nebezpečenstvu horúčky." # todo: NEW TRANSLATION
 gold_fleet_shared_events.7.title: "Neuvážené reči v krčme" # todo: NEW TRANSLATION
 gold_fleet_shared_events.7.desc: "[target_leader.GetName] sa dozvedá, že jeden z dôstojníkov flotily sa v prístavnej krčme, poriadne posilnený alkoholom, rozhovoril o dátume vyplávania, trase domov a bohatstve v našich podpalubiach. Koloniálny prístav je hniezdom cudzích uší — obchodných zástupcov, pašerákov a mužov, ktorí predajú tajomstvo každému korzárskemu kapitánovi s dostatkom peňazí.\n\nŠkoda už možno vznikla, no to, ako zareagujeme, rozhodne o tom, či sa reči rozšíria ešte ďalej." # todo: NEW TRANSLATION
 gold_fleet_shared_events.7.a: "Predviesť ho pred sťažeň a nechať ho pocítiť hnev [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('crown_estate')]." # todo: NEW TRANSLATION
 gold_fleet_shared_events.7.b: "Zmeniť dátum vyplávania aj zamýšľanú trasu." # todo: NEW TRANSLATION
 gold_fleet_shared_events.7.c: "Vypustiť protichodné fámy a zmiasť ich." # todo: NEW TRANSLATION
 gold_fleet_shared_events.7.rumours_worse_tt: "Falošné fámy len rozvíria ďalšie reči v prístave a správa o skutočnej trase sa rozšíri ešte viac — nebezpečenstvo plavby sa zvýši (#G +1#! úroveň nebezpečenstva)" # todo: NEW TRANSLATION
 gold_fleet_shared_events.7.rumours_better_tt: "Falošné stopy zaberú a každý kapitán číhajúci na nás bude prenasledovať tiene — nebezpečenstvo plavby sa zníži (#R -1#! úroveň nebezpečenstva)" # todo: NEW TRANSLATION
 gold_fleet_shared_events.7.historical_info: "Plavebné poriadky flotíl s pokladom patrili medzi najcennejšie spravodajské informácie v atlantickom svete. Korzári a admirality súperiacich mocností udržiavali siete informátorov v karibských prístavoch aj v Seville a prezradený dátum vyplávania či plánovaná trasa mohli zmeniť nádejnú plavbu na isté zajatie. Španielska koruna prísne strážila podrobnosti o #italic flota#!, no flotila zhromažďujúca sa v preplnenom koloniálnom prístave nikdy nedokázala svoje tajomstvá skutočne utajiť a velitelia dobre poznali nebezpečenstvo neuvážených rečí na brehu." # todo: NEW TRANSLATION
 gold_fleet_shared_events.cargo_loaded_tt: "Poklad tejto sezóny je naložený v podpalubiach flotily" # todo: NEW TRANSLATION
 gold_fleet_shared_events.cargo_gain_tt: "Hodnota nákladu flotily sa zvyšuje" # todo: NEW TRANSLATION
 gold_fleet_shared_events.cargo_loss_tt: "Časť nákladu flotily sa stratí" # todo: NEW TRANSLATION
 gold_fleet_shared_events.danger_up_1_tt: "Nebezpečenstvo plavby sa zvýši (#G +1#! úroveň nebezpečenstva)" # todo: NEW TRANSLATION
 gold_fleet_shared_events.danger_up_2_tt: "Nebezpečenstvo plavby sa zvýši (#G +2#! úrovne nebezpečenstva)" # todo: NEW TRANSLATION
 gold_fleet_shared_events.danger_down_1_tt: "Nebezpečenstvo plavby sa zníži (#R -1#! úroveň nebezpečenstva)" # todo: NEW TRANSLATION
 gold_fleet_shared_events.cargo_damaged_on_return_tt: "Dodaný náklad zohľadňuje straty, ktoré flotila utrpela počas plavby" # todo: NEW TRANSLATION

 flatland_desc: "Rovina je terén bez výraznejších výškových rozdielov, preto nebráni pohybu [Concept('army','armády')|e] ani výstavbe [Concept('building','budov')|e]."
 mountains_desc: "Horský terén leží vo veľkej nadmorskej výške a má strmé svahy s malým počtom úzkych rovín, preto sa v ňom [Concept('armies','armádam')|e] ťažšie postupuje aj bojuje a ťažšie sa aj rozvíja."
 hills_desc: "Kopcovitý terén je členitý, ale svahy nie sú také strmé ani vysoké ako v horách, takže aj postihy sú miernejšie."
 plateau_desc: "Náhorné plošiny sú pomerne rovné oblasti vo veľkej nadmorskej výške, preto majú oproti rovinám určité postihy."
 wetlands_desc: "$wetlands$ sú čiastočne zaplavený terén, zvyčajne v blízkosti rieky, jazera alebo pobrežia."
 ocean_desc: "Otvorené more medzi kontinentmi, po ktorom sa môžu plaviť len tie najlepšie lode."
 deep_ocean_desc: "Otvorené more medzi kontinentmi, po ktorom sa môžu plaviť len tie najlepšie lode, v oblastiach najvzdialenejších od pobrežia."
 coastal_ocean_desc: "Otvorené more medzi kontinentmi, po ktorom sa môžu plaviť len tie najlepšie lode, no v oblastiach bližšie k pobrežiu."
 inland_sea_desc: "Vnútrozemské moria sú moria obklopené pevninou, napríklad Stredozemné alebo Baltské more."
 atoll_desc: "Atoly sú nízke prstencovité ostrovy, ktoré zvyčajne obklopujú lagúnu."
 narrows_desc: "Úžiny sú morské oblasti obklopené pobrežím z viacerých strán, napríklad prielivy alebo moria medzi ostrovmi súostrovia, kde je málo miesta na manévrovanie."
 lakes_desc: "Jazerá sú vnútrozemské vodné plochy spojené s otvoreným morom nanajvýš riekami, preto sa po nich nemôžu plaviť žiadne významnejšie [Concept('ships','lode')|e]."
 high_lakes_desc: "$lakes_desc$"
 plateau_wasteland_desc: "$plateau_desc$"
 mountain_wasteland_desc: "$mountains_desc$"
 hills_wasteland_desc: "$hills_desc$"
 wetlands_wasteland_desc: "$wetlands_desc$"
 dune_wasteland_desc: "$desert_desc$"
 flatland_wasteland_desc: "$flatland_desc$"
 mesa_wasteland_desc: "$desert_desc$"
 ocean_wasteland_desc: "Ide o časť oceánu mimo hlavných prúdov, preto nie je vhodnou trasou pre lode, ktoré by mohli uviaznuť uprostred neho."
 tropical_desc: "$tropical$ predstavuje oblasti s vysokými priemernými teplotami a bez zimy."
 arid_desc: "$arid$ predstavuje oblasť s výrazným nedostatkom dostupnej vody."
 mediterranean_desc: "$mediterranean$ predstavuje oblasti s dokonalým podnebím, kde chce žiť každý."
 continental_desc: "$continental$ predstavuje oblasti s chladnými zimami."
 arctic_desc: "$arctic$ predstavuje oblasti s veľmi chladnými zimami."
 cold_arid_desc: "$cold_arid$ predstavuje oblasť s výrazným nedostatkom dostupnej vody, kde však bývajú zimy."
 oceanic_desc: "$oceanic$ predstavuje oblasti s miernymi zimami, ale vysokou vlhkosťou."
 subtropical_desc: "$subtropical$ predstavuje oblasti s vysokými priemernými teplotami a miernymi zimami."
 hot_semi_arid_desc: "$hot_semi_arid$ označuje horúce trávnaté oblasti a stepi, v ktorých je príliš málo zrážok na spoľahlivé poľnohospodárstvo, ale viac než v skutočnej púšti."
 cold_semi_arid_desc: "$cold_semi_arid$ označuje chladné trávnaté oblasti a stepi so suchými letami a chladnými zimami, v ktorých je viac zrážok než v chladnej púšti."
 subpolar_desc: "$subpolar$ označuje oblasti s dlhými, krutými zimami a krátkymi letami, ako sú boreálne lesy ďalekého severu."
 desert_desc: "Púšte sú neúrodné krajiny s nízkymi zrážkami, kde rastliny a živočíchy takmer nemajú podmienky na život."
 sparse_desc: "Riedka vegetácia označuje rozsiahle rovné plochy s malým počtom stromov alebo úplne bez nich."
 grasslands_desc: "Trávnaté oblasti sú terén, v ktorom prevláda tráva a stromov či kríkov je málo alebo nie sú žiadne."
 farmland_desc: "Poľnohospodárska pôda je terén pretvorený človekom, ktorý slúži na pestovanie plodín alebo ako rozsiahle pastviny."
 woods_desc: "Háje sú terén s redšou vegetáciou ako lesy."
 forest_desc: "Les je terén s hustou vegetáciou."
 jungle_desc: "Džungľa je terén s hustým lesom a spletitou vegetáciou, ktorá sťažuje akúkoľvek činnosť."

l_polish:
 alg_taifa_rais: "Taifa reïsov" # todo: NEW TRANSLATION
 alg_taifa_rais_desc: "Kapitáni korzárskych lodí v Alžíri sa zorganizovali do spoločnosti, ktorá ovláda obchodné a vojenské zázemie prístavu, vyjednáva výkupné, rozdeľuje podiely na koristi a udržiava námornú infraštruktúru, od ktorej závisí prosperita mesta. Uznávame ich spoločnosť za vládnu autoritu alžírskeho námorného hospodárstva a udeľujeme jej prestíž i právne postavenie potrebné na vymáhanie zmlúv so zahraničnými obchodníkmi a nábor posádok z celého Maghrebu. Toto spojenectvo medzi korunou a korzárskou elitou nám poskytuje schopné námorníctvo bez nákladov na udržiavanie kráľovskej flotily." # todo: NEW TRANSLATION
 anr_consell_de_la_terra: "Consell de la Terra" # todo: NEW TRANSLATION
 anr_consell_de_la_terra_desc: "Consell de la Terra je zhromaždenie zastupujúce šesť andorrských farností. Bolo zriadené, aby dohliadalo na záležitosti krajiny a chránilo starobylé práva jej obcí pred zásahmi ktoréhokoľvek z dvoch spolukniežat." # todo: NEW TRANSLATION
 anr_quartos: "Quartons" # todo: NEW TRANSLATION
 anr_quartos_desc: "Šesť andorrských farností sa spravuje prostredníctvom volených rád nazývaných quartons. Tie riadia miestne záležitosti a vysielajú zástupcov do Consell de la Terra. Tento starobylý systém samosprávy obmedzuje priamy vplyv spolukniežat na každodenný život našich obcí." # todo: NEW TRANSLATION
 anr_sindic_general: "Síndic General" # todo: NEW TRANSLATION
 anr_sindic_general_desc: "Síndic General je volený zástupca andorrskej obce, ktorého úlohou je obhajovať spoločné záujmy farností pred oboma spolukniežatami a viesť našu obecnú správu." # todo: NEW TRANSLATION
 basque_cofradias_marineras: "Cofradías Marineras" # todo: NEW TRANSLATION
 basque_cofradias_marineras_desc: "Námornícke bratstvá na baskickom pobreží sú starobylé združenia námorníkov a rybárov, ktorí spájajú svoje zdroje, delia sa o riziko a udržiavajú tradície nášho námorníckeho ľudu. Ich organizované siete odborníkov urýchľujú stavbu plavidiel a zabezpečujú stály prísun skúsených námorníkov." # todo: NEW TRANSLATION
 basque_pase_foral: "Pase Foral" # todo: NEW TRANSLATION
 basque_pase_foral_desc: "Pase Foral je právo baskických inštitúcií preskúmať a pozastaviť každý kráľovský príkaz, ktorý je v rozpore s miestnymi fueros, skôr než nadobudne platnosť v našich krajinách. Kráľa poslúchame, no len pokiaľ to dovoľujú starobylé zákony našej krajiny." # todo: NEW TRANSLATION
 basque_universidad_mercaderes_bilbao: "Universidad de Mercaderes de Bilbao" # todo: NEW TRANSLATION
 basque_universidad_mercaderes_bilbao_desc: "Obchodnícky cech Bilbaa, oficiálne založený ako Universidad de Mercaderes, má právo rozhodovať obchodné spory, stanovovať obchodné normy a regulovať obchod so železiarskym tovarom a vlnou, ktorý prechádza prístavom. Jeho obchodné súdy odbremeňujú korunu od administratívnej záťaže a zároveň prinášajú spoľahlivé daňové príjmy." # todo: NEW TRANSLATION
 bula_de_la_santa_cruzada: "Bula de la Santa Cruzada" # todo: NEW TRANSLATION
 bula_de_la_santa_cruzada_desc: "Pápež udelil našej ríši trvalú bulu krížovej výpravy, ktorá nám umožňuje získavať od veriacich finančné prostriedky na vojnu proti neveriacim a udeľuje osobitné odpustky našim vojakom, ktorí sa chopili zbraní na obranu viery." # todo: NEW TRANSLATION
 cas_letrados: "Letrados" # todo: NEW TRANSLATION
 cas_letrados_desc: "Koruna vymenúva do štátnych rád právnikov a správcov vzdelaných na univerzitách a nahrádza tak nadvládu dedičnej šľachty nad kráľovskou správou profesionálnou byrokratickou vrstvou vernou kráľovskej moci. Letrados prinášajú do vládneho aparátu právne znalosti a kultúru efektívnej správy." # todo: NEW TRANSLATION
 cas_patronato_real: "Patronato Real" # todo: NEW TRANSLATION
 cas_patronato_real_desc: "Koruna má právo vymenúvať biskupov a opátov na všetkých našich zámorských územiach, čím podrobuje cirkev v kolóniách kráľovskej moci. Patronato Real premieňa duchovenstvo na nástroj koloniálnej správy a zdroj kráľovskej prestíže." # todo: NEW TRANSLATION
 cat_capitols_de_cort: "Capítols de Cort" # todo: NEW TRANSLATION
 cat_capitols_de_cort_desc: "Capítols de Cort sú zákonodarné dohody vyjednané medzi korunou a katalánskymi Corts, ktoré zaväzujú ďalších panovníkov rešpektovať práva a slobody stavov. Žiadny kráľovský dekrét nemôže ich ustanovenia zrušiť bez súhlasu ríše." # todo: NEW TRANSLATION
 eastern_amazigh_oasis_charter: "Charta oáz" # todo: NEW TRANSLATION
 eastern_amazigh_oasis_charter_desc: "Oázové oblasti vo východnom Maroku a alžírskom predpolí Sahary spravuje systém obecných vodných práv a zvykového vlastníctva pôdy, ktorý už stáročia umožňuje udržiavať usadlé poľnohospodárstvo v inak vyprahnutej krajine. Formálnym uznaním charty týchto oázových obcí a ich zdedených nárokov na vodné kanály a palmové háje zaručíme produktivitu týchto sídel a právnou istotou držby pôdy pripútame ich obyvateľov k ríši. Táto charta mení nehostinnú púštnu hranicu na fungujúce poľnohospodárske zázemie a rozširuje náš obchodný dosah do saharskej obchodnej siete." # todo: NEW TRANSLATION
 glc_archbishopric_compostela: "Arcibiskupstvo v Compostele" # todo: NEW TRANSLATION
 glc_archbishopric_compostela_desc: "Ako patróni arcibiskupstva v Santiago de Compostela získavame prestíž a príjmy z nekonečného prúdu pútnikov, ktorí putujú po Ceste svätého Jakuba, aby si uctili relikvie apoštola. Naša ríša sa tak upevňuje ako centrum kresťanskej zbožnosti." # todo: NEW TRANSLATION
 glc_foros_de_galicia: "Foros de Galicia" # todo: NEW TRANSLATION
 glc_foros_de_galicia_desc: "#italic Foros#! sú dedičné dlhodobé nájomné zmluvy, vďaka ktorým galícijské roľníctvo drží pôdu, ktorú obrába, natrvalo a platí pevne stanovené dávky namiesto toho, aby čelilo svojvoľným požiadavkám zemepánov. Takáto stabilná držba podporuje investície do pôdy a po celé generácie pripútava roľníkov k ich obciam." # todo: NEW TRANSLATION
 gra_ulema_council: "Rada 'Ulamā'" # todo: NEW TRANSLATION
 gra_ulema_council_desc: "Učenci islamského práva slúžia ako najvyššia poradná rada našej ríše, vykladajú náboženské učenie a dodávajú vláde sultána náboženskú legitimitu. Ich autorita v právnych otázkach zabezpečuje, že správa spravodlivosti zostáva zakorenená v božskom zákone." # todo: NEW TRANSLATION
 gra_visirate: "Úrad vezíra" # todo: NEW TRANSLATION
 gra_visirate_desc: "Úrad vezíra je vysoká poradná funkcia, prostredníctvom ktorej vznešení správcovia vládnu v mene sultána, vnášajú poriadok do štátnych záležitostí a zabezpečujú, aby ríšu viedli schopní ľudia." # todo: NEW TRANSLATION
 gra_volunteers_of_faith: "Dobrovoľníci viery" # todo: NEW TRANSLATION
 gra_volunteers_of_faith_desc: "#italic Mutaṭawwi'a#! sú zbožní dobrovoľníci, ktorí sa v čase vojny proti neveriacim pridávajú k sultánovým vojskám, vedení náboženským presvedčením, nie feudálnou povinnosťou. Rozširujú rady našich armád a ich bojovnosť viac než vynahrádza nedostatok formálneho vojenského výcviku." # todo: NEW TRANSLATION
 gra_volunteers_of_faith_unlocks_mutatawwia_tt: "Umožňuje nám verbovať [ShowUnitDefinitionName('a_mutatawwia')]" # todo: NEW TRANSLATION
 kabyle_tajmaat_pact: "Pakt tajmaat" # todo: NEW TRANSLATION
 kabyle_tajmaat_pact_desc: "#italic Tajmaat#! je zhromaždenie dediny v kabylskej vysočine, obecná inštitúcia, v ktorej sa dospelí muži stretávajú, aby rokovali o miestnej spravodlivosti, rozdeľovaní spoločných zdrojov a reakcii obce na vonkajšie požiadavky. Uznaním #italic tajmaat#! za legitímny zastupiteľský orgán kabylského roľníctva v rámci stavovského systému spolupracujeme s obyvateľmi vysočiny podľa ich vlastných pravidiel, namiesto toho, aby sme sa pokúšali zavádzať správne štruktúry, ktorým by sa bránili. Tento pakt nám zabezpečuje stabilnú správu vysočiny bez nákladov na stále posádky a prostredníctvom vzájomného uznania upevňuje oddanosť Kabylov ríši." # todo: NEW TRANSLATION
 lon_concejos_asturianos: "Astúrske concejos" # todo: NEW TRANSLATION
 lon_concejos_asturianos_desc: "Samosprávne rady astúrskych miest sú starobylou inštitúciou zakorenenou v tradíciách #italic fuero#! horských priesmykov, kde slobodní muži organizovali spoločnú obranu a vykonávali spravodlivosť dávno predtým, než tu získal moc akýkoľvek kráľovský dvor. Ich pretrvávajúca životaschopnosť pripútava naše roľníctvo k ríši miestnou oddanosťou namiesto donucovania." # todo: NEW TRANSLATION
 lon_san_isidoro_patronage: "Patronát San Isidoro" # todo: NEW TRANSLATION
 lon_san_isidoro_patronage_desc: "Naša koruna podporuje Kráľovskú kolegiátnu cirkev San Isidoro v Leóne, duchovné srdce ríše, kráľovské mauzóleum a centrum učenosti, ktorého románske skriptórium po stáročia uchovávalo učenú tradíciu Izidora zo Sevilly." # todo: NEW TRANSLATION
 maghrebi_zawiya_endowment: "Nadácia zāwiye" # todo: NEW TRANSLATION
 maghrebi_zawiya_endowment_desc: "#italic Zāwiya#! je súfijská lóža, ktorá zároveň slúži ako miesto bohoslužieb, škola islamského práva, ubytovňa pre pocestných a centrum miestneho rozhodcovstva na vidieku Maghrebu. Ak týmto lóžam udelíme právne postavenie a zbožné nadácie, rozšírime dosah náboženskej autority na územia, kde neplatí právomoc nijakého guvernéra a kde sa šajch #italic zāwiye#! teší väčšej úcte než vzdialený sultán. Táto investícia do posvätnej krajiny našej ríše nám za zlomok nákladov na priamu správu prinesie podporu ľudu." # todo: NEW TRANSLATION
 masmuda_atlas_pact: "Pakt Masmúdov" # todo: NEW TRANSLATION
 masmuda_atlas_pact_desc: "Kmene Masmúdov z Vysokého Atlasu a Antiatlasu organizujú spoločnú obranu a miestnu správu podľa dedičných kmeňových paktov už od čias almohadského kalifátu, ktorého zakladajúce hnutie sami vytvorili. Uznávame autoritu týchto horských rád a ich právo spravovať priesmyky, čím si zabezpečujeme ich neústupný odpor voči každému nepriateľskému vojsku, ktoré by sa pokúsilo prekonať horské cesty. Tieto obce výmenou za to zostávajú voľne pripútané k ústrednej moci a zároveň si zachovávajú svoju autonómiu aj tradíciu spoločného nosenia zbraní." # todo: NEW TRANSLATION
 mellah_charter: "Charta mallāḥ" # todo: NEW TRANSLATION
 mellah_charter_desc: "#italic Mallāḥ#! je samosprávna židovská štvrť v meste Maghrebu. Sultán ju schválil ako záruku obecnej autonómie Židov a zároveň ako spoľahlivý zdroj daňových príjmov z remesiel a obchodu, v ktorých židovské obce vynikajú. Formálnou chartou upravíme právne postavenie našich židovských poddaných a prilákame zručných remeselníkov, finančníkov a diaľkových obchodníkov, ktorých siete siahajú naprieč Stredozemím i Saharou. Začlenenie #italic mallāḥ#! do mestského hospodárstva prinesie remeselnú výrobu, obchodné úvery a špecializovaný tovar, z ktorých bude profitovať celé mesto." # todo: NEW TRANSLATION
 mll_consolat_de_mar: "Consolat de Mar" # todo: NEW TRANSLATION
 mll_consolat_de_mar_desc: "#italic Consolat de Mar#! je náš námorný súd, oprávnený rozhodovať spory o preprave nákladu, poistení a obchodných partnerstvách podľa kodifikovaného námorného práva, ktoré zaväzuje obchodníkov i kapitánov lodí. Jeho konzulovia, volení zo samotnej obchodníckej obce, posilňujú postavenie našich mešťanov, priťahujú osadníkov do našich prístavných miest a zvyšujú naše obchodné príjmy." # todo: NEW TRANSLATION
 mor_abid_al_bukhari: "'Abīd al-Buḵārī" # todo: NEW TRANSLATION
 mor_abid_al_bukhari_desc: "#italic 'Abīd#! sú zotročení vojaci, ktorých odvádza sultán a ktorí sú formálne zapísaní pod menom al-Buḵārī, aby ich právne fiktívne puto viazalo ku korune, nie k jednotlivému pánovi. Tento zbor sme zorganizovali do stálej profesionálnej armády, ktorá podlieha priamo trónu, čím znižujeme svoju závislosť od rozhádaných kmeňových konfederácií pri získavaní vojakov. Sústreďovanie zbraní v kráľovských rukách predstavuje rozhodujúci krok k vytvoreniu panovníckej armády nezávislej od vojenských odvodov veľkých rodov." # todo: NEW TRANSLATION
 mor_andalusian_refugees: "Andalúzski utečenci" # todo: NEW TRANSLATION
 mor_andalusian_refugees_desc: "Andalúzski a moriskí utečenci, ktorí sa usadili v našich mestách, prinášajú remeselné tradície al-'Andalus: obkladačstvo #italic zillij#!, jemnú keramiku, hodvábnictvo a architektonickú výzdobu, ktorými kedysi vynikali veľké mestá polostrova. Formálnym uznaním obecných inštitúcií týchto utečeneckých obcí a udelením výsad meštianskeho stavu nasmerujeme ich tvorivú energiu do nášho mestského hospodárstva a vďaka vďačnosti i právnej ochrane ich pripútame k trónu. Ich dielenské tradície a obchodné kontakty dodávajú našim mestám produktívny charakter, aký by samotné domáce remeselné tradície nedokázali dosiahnuť tak rýchlo." # todo: NEW TRANSLATION
 mor_gharb_war_tribes: "Vojnové kmene Ḡarbu" # todo: NEW TRANSLATION
 mor_gharb_war_tribes_desc: "Kmene Ḵlūṭ, Sufyān, Ṭlīq a Riyāḥ ovládajú nížiny Ḡarbu, Azġaru a Habṭu za rovnakých podmienok, za akých ich získali ich predkovia: pôdu na obrábanie a slobodu od výbercov daní výmenou za to, že sa chopí zbraní, keď ich sultán povolá. Kupujeme si ich službu, nie poslušnosť, a tento rozdiel si uvedomujú obe strany — s týmito kmeňmi rokujeme, nevládneme im. Dohoda nám prináša početnú silu, pretože výzva doručená do každého stanu štyroch konfederácií dostane do sedla viac mužov než akýkoľvek odvod v mestách." # todo: NEW TRANSLATION
 mor_guich_tribes: "Kmene guich" # todo: NEW TRANSLATION
 mor_guich_tribes_desc: "Keď sme vybudovali Maḵzan a rozšírili jeho moc, možno výmenu pôdy za službu ustanoviť natrvalo namiesto toho, aby sme každú sezónu uzatvárali novú dohodu. Kmene #italic jīš#! — zvyčajne arabského pôvodu, obrábajúce pozemky #italic arḍ al-jayš#! pridelené jednotlivým bojovníkom a oslobodené od daní, pokiaľ títo bojovníci slúžia v jazde — sú najprv vojakmi koruny a až potom roľníkmi. Zbor, ktorý sa živí z vlastných prídelov, stojí pokladnicu len zlomok toho, čo by stáli žoldy, a neodpovedá za svoju vernosť nijakému rodu okrem nášho. Ak poľavíme v centralizačnom úsilí, toto usporiadanie sa rozpadne: tieto kmene slúžia Maḵzanu, ktorý na ne dosiahne." # todo: NEW TRANSLATION
 mor_guich_tribes_makhzan_requirement_tt: "Zriadili sme byrokraciu [ShowBureaucracyTypeName('makhzan_bureaucracy')]" # todo: NEW TRANSLATION
 mor_guich_tribes_unlocks_guich_cavalry_tt: "Umožňuje nám verbovať [ShowUnitDefinitionName('a_guich_cavalry')]" # todo: NEW TRANSLATION
 mor_makhzen_caids: "Maḵzanskí quwwād" # todo: NEW TRANSLATION
 mor_makhzen_caids_desc: "#italic Quwwād#! sú regionálni guvernéri vymenovaní korunou, ktorých sultán vysiela, aby presadzovali ústrednú moc na územiach spravovaných priamo trónom, vyberali dane, vykonávali spravodlivosť a udržiavali poriadok v jeho mene. Formalizáciou vymenúvania a dohľadu nad týmito quwwād rozšírime dosah aparátu Maḵzanu po celej ríši a obmedzíme autonómiu veľkých kmeňových konfederácií, ktoré by inak mohli vládnuť len podľa zvykov. Prepojenie úradníkov vymenovaných korunou s miestnym vplyvom tvorí administratívne jadro marockého štátu." # todo: NEW TRANSLATION
 mor_marabout_patronage: "Patronát maraboutov" # todo: NEW TRANSLATION
 mor_marabout_patronage_desc: "Marabouti sú svätí muži uznávaného duchovného pôvodu, ktorých svätyne sa rozprestierajú po celej marockej krajine a ktorých pomoc obyčajní ľudia vyhľadávajú pri liečení, rozhodovaní sporov a ochrane pred nešťastím. Podporou týchto osobností a ich pridružených #italic zāwiyí#! pripútame decentralizovanú sieť posvätnej autority k Maḵzanu a sultán sa stane uznávaným ochrancom ľudového islamu v Maroku. Tento vzťah nám umožní využívať náboženských sprostredkovateľov schopných upokojiť obce, do ktorých sa nedostane ani guvernér, ani vojsko." # todo: NEW TRANSLATION
 mozabite_communal_pact: "Obecný pakt Mozabitov" # todo: NEW TRANSLATION
 mozabite_communal_pact_desc: "Päť miest mozabitského päťmestia si udržiava obchodnú prosperitu prísnou obecnou disciplínou, ktorú presadzuje rada #italic 'azzāba#! — ibádovská duchovná inštitúcia spájajúca náboženskú autoritu, obchodné rozhodcovstvo a reguláciu obchodu na saharských trasách. Uznaním tejto obecnej samosprávy za formálny prejav autority meštianskeho stavu v Mzabe začleníme obchodnú sieť päťmestia do našej ríše bez toho, aby sme sa pokúšali zavádzať správne štruktúry, ktoré by vyvolali len odpor. Povesť Mozabitov ako prísne poctivých obchodníkov spôsobuje, že ich slovo je na celej Sahare zárukou dôvery." # todo: NEW TRANSLATION
 mudejar_aljamas: "Mudéjarske aljamas" # todo: NEW TRANSLATION
 mudejar_aljamas_desc: "Uznávame právo moslimských obcí spravovať vlastné #italic aljamas#! a umožňujeme im vyznávať svoju vieru, rozhodovať vnútorné spory podľa vlastného práva a pokračovať v obchodovaní a remeselnej výrobe. Ich prínos pre hospodárstvo je pre našu ríšu nevyhnutný a ich oddanosť najlepšie zaistíme ústupkami, nie nátlakom." # todo: NEW TRANSLATION
 nav_buenas_villas: "Buenas Villas" # todo: NEW TRANSLATION
 nav_buenas_villas_desc: "Výsostné mestá ríše — #italic buenas villas#! — získavajú kráľovské výsady zaručujúce slobodu obchodu a samosprávu výmenou za priamu vernosť korune. Ich meštianske rady vyvažujú moc šľachty a poskytujú kráľovskej pokladnici spoľahlivý zdroj príjmov." # todo: NEW TRANSLATION
 nav_mesnadero: "Mesnaderos" # todo: NEW TRANSLATION
 nav_mesnadero_desc: "#italic Mesnaderos#! sú kráľovskí jazdci, vznešení bojovníci viazaní osobnou službou korune a preslávení ničivými útokmi. Ich výsadné postavenie ako kráľovho osobného sprievodu zaručuje neochvejnú vernosť a elitnú vojenskú silu." # todo: NEW TRANSLATION
 nav_mesnadero_unlocks_mesnaderos_tt: "Umožňuje nám verbovať [ShowUnitDefinitionName('a_mesnaderos')]" # todo: NEW TRANSLATION
 nav_palacio_cabo_armeria: "Palacios Cabo de Armería" # todo: NEW TRANSLATION
 nav_palacio_cabo_armeria_desc: "#italic Palacios cabo de armería#! sú dedičné šľachtické rody Navarry, ktorých zbrojné rodové línie sú zapísané v kráľovských registroch. Ich pánom to zaručuje uznané postavenie na dvore a hlas v kráľovskej rade." # todo: NEW TRANSLATION
 spa_grandes_de_espana: "Grandes Španielska" # todo: NEW TRANSLATION
 spa_grandes_de_espana_desc: "Grandes Španielska sú najvyššie postavení šľachtici ríše, ktorým bola udelená mimoriadna výsada zostať pred panovníkom s pokrytou hlavou a miesto v štátnych radách. Ich prestíž a vernosť tvoria základ, na ktorom spočíva moc koruny." # todo: NEW TRANSLATION
 tle_mashwar_court: "Dvor mashwar" # todo: NEW TRANSLATION
 tle_mashwar_court_desc: "#italic Mashwar#! je vnútorný audienčný dvor tlemcenského sultanátu, kde sultán v obradnom prostredí prijíma rady veľmožov a právnikov ríše a prostredníctvom formálneho uznania ich pripútava k trónu. Jeho poradný charakter dodáva zajjánovskému štátu legitimitu založenú na konzultáciách, ktorá ho odlišuje od vlády založenej výlučne na donucovaní, a sultánovým rozhodnutiam prepožičiava váhu spoločného súhlasu šľachty. Formalizujeme rokovania tohto dvora a ustanovíme ho za uznávaný kanál na prerokúvanie politiky a uplatňovanie vplyvu šľachtického stavu v rámci ústavného poriadku." # todo: NEW TRANSLATION
 tuareg_caravan_guild: "Tuarežský karavánový cech" # todo: NEW TRANSLATION
 tuareg_caravan_guild_desc: "Tuarežská konfederácia ovláda transsaharské karavánové trasy, po ktorých putujú zlato, soľ a zotročení ľudia medzi Sahelom a prístavmi Maghrebu. Ich sprievodcovia, pastieri tiav a ozbrojené eskorty sú nenahraditeľnou súčasťou púštneho hospodárstva. Uznaním cechovej štruktúry tuarežských karavánových majstrov a udelením formálneho miesta v meštianskom stave získame spoľahlivý prístup k obchodným informáciám, znalostiam trás a zárukám bezpečného prechodu, bez ktorých sa nijaký saharský obchod nezaobíde. Toto spojenectvo sultánskeho štátu a púštnych obchodníkov začleňuje hlavné saharské komoditné toky do nášho daňového a obchodného systému." # todo: NEW TRANSLATION
 tuareg_imghad_vassalage: "Vazalstvo imghadov" # todo: NEW TRANSLATION
 tuareg_imghad_vassalage_desc: "#italic Imghad#! sú klany vazalskej kasty v tuarežskej konfederácii, ktoré sú dedičnou povinnosťou viazané slúžiť vznešeným rodom #italic imajeghen#! výmenou za ochranu a prístup k transsaharským pastvinám. Formalizovaným uznaním autority týchto klanových hierarchií sultánom pripútame saharskú kmeňovú štruktúru k našej vláde bez toho, aby sme sa pokúšali zaviesť priamu správu nad neovládateľnou púšťou. Tento pakt s #italic imghadmi#! nám za minimálne náklady ústrednej pokladnice zabezpečí odvod disciplinovaných púštnych jazdcov." # todo: NEW TRANSLATION
 tun_hafsid_caliphal_claim: "Hafsidovský nárok na kalifát" # todo: NEW TRANSLATION
 tun_hafsid_caliphal_claim_desc: "Hafsidovskí sultáni odvodzujú svoj nárok na vládu od svojho pôvodu a uznania za nástupcov almohadského kalifátu. Moslimskému svetu sa predstavujú ako právoplatní dedičia univerzálnej autority veliteľa veriacich. Túto kalifskú dôstojnosť upevňujeme obradmi, korešpondenciou so vzdialenými moslimskými vládcami a podporou učencov, ktorí rozvíjajú teologické základy nášho nároku. Táto duchovná autorita pozdvihuje našu prestíž nad úroveň obyčajného regionálneho sultanátu a upevňuje oddanosť našich moslimských poddaných i spojencov." # todo: NEW TRANSLATION
 tun_taifa_of_rais: "Taifa reïsov" # todo: NEW TRANSLATION
 tun_taifa_of_rais_desc: "Tuniská #italic tā'ifa#! reïsov je formálne založená spoločnosť korzárskych kapitánov, ktorej stanovy upravujú vedenie korzárskych operácií, rozdeľovanie podielov na koristi a výkupné za zajatcov z mestských trhov s otrokmi. Uznávame taifu ako právne zriadenú spoločnosť meštianskeho stavu a výmenou za formálne práva v prístave pripútavame najschopnejších námorných podnikateľov ríše k našej veci. Vďaka tomuto usporiadaniu má Tunis jednu z najlepšie organizovaných korzárskych inštitúcií v západnom Stredomorí a spoľahlivý zdroj námorníkov, ktorých možno za vojny povolať do kráľovských služieb." # todo: NEW TRANSLATION
 unlocks_proclaim_pase_foral_tt: "Odomkne [Concept('cabinet_action','akcia kabinetu')|e] [ShowCabinetActionName('proclaim_pase_foral')]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 val_tribunal_de_les_aigues: "Tribunal de les Aigües" # todo: NEW TRANSLATION
 val_tribunal_de_les_aigues_desc: "Vodný súd Valencie je najstarším stále fungujúcim súdom v Európe. Každý štvrtok zasadá pri katedrálnych dverách a rozhoduje spory o zavlažovacie práva medzi roľníkmi z nížiny. Jeho nepísané zvykové rozhodnutia, presadzované spoločným súhlasom, udržiavajú poľnohospodárske srdce ríše produktívne a roľníctvo disciplinované." # todo: NEW TRANSLATION
 zenati_mounted_levy: "Zenatský jazdecký odvod" # todo: NEW TRANSLATION
 zenati_mounted_levy_desc: "Konfederácia Zenatov pozostáva z berberských kmeňov preslávených ľahkou jazdou, ktoré bojujú s krátkym strmeňom a oštepom podľa tradície #italic furūsiyya zanātiyya#!, ktorá ovplyvnila jazdecké umenie na oboch brehoch Stredozemného mora. Týchto jazdcov odvádzame do rýchleho úderného vojska schopného chrániť naše armády, napádať nepriateľské zásobovacie línie a prekonávať veľké vzdialenosti na vysokých náhorných plošinách s minimálnou logistickou podporou. Ich vernosť sultánovi zabezpečuje tradičný systém poplatkov a patronátu, nie formálna vojenská hierarchia." # todo: NEW TRANSLATION

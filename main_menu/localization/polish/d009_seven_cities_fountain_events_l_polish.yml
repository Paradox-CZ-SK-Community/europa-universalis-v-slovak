 seven_cities_fountain.1.title: "Prameň je len prameň" # todo: NEW TRANSLATION
 seven_cities_fountain.1.desc: "Po dvoch týždňoch pochodu dorazila výprava na miesto, ktoré taínski sprievodcovia opisujú ako Fontánu Bimini. Nachádza sa tu prameň na lesnej čistinke; voda je studená, čistá a jemne sírová. Muži sa z neho napijú. Zostanú presne takí starí, ako boli včera. Taínskeho sprievodcu opäť vypočúvajú, tentoraz dôkladnejšie. Prizná sa, že z prameňa nikdy nepil a že bol ešte dieťaťom, keď sa o ňom dozvedel od svojej starej mamy, ktorá bola tiež dieťaťom, keď príbeh počula od svojej starej mamy. [target_leader.GetName] spíše správu a vydá rozkaz na návrat výpravy." # todo: NEW TRANSLATION
 seven_cities_fountain.1.a: "Zrušte výpravu. Žiadna fontána neexistuje, je to len príbeh." # todo: NEW TRANSLATION
 seven_cities_fountain.1.historical_info: "Výprava Ponceho de Leóna na Floridu v roku 1513 sa zvyčajne spája s hľadaním Fontány mladosti, toto spojenie sa však objavilo až po jeho smrti; prvýkrát sa spomína v španielskych kronikách až po jeho úmrtí a neskorší historici ho ustálili, pretože im toto pútavé podanie vyhovovalo. Samotná výprava bola bežnou prieskumnou misiou, ktorú financoval súkromný investor so zámerom zriadiť obchodnú stanicu pre obchod s otrokmi na území, ktoré sa vtedy považovalo za ostrov. Fontána sa začala spájať s menom Ponceho de Leóna, pretože zomrel mladý — mal čosi po päťdesiatke — na zranenie šípom, ktoré utrpel na Floride. Španielski kronikári nasledujúcej generácie tomuto paradoxu neodolali." # todo: NEW TRANSLATION
 seven_cities_fountain.2.title: "Osviežujúci prameň" # todo: NEW TRANSLATION
 seven_cities_fountain.2.desc: "Prameň, ktorý je jadrom legendy, skutočne existuje — v skromnom zmysle, že tu je prameň v háji, ktorého voda je nezvyčajne čistá a jej teplota sa nemení podľa ročného obdobia. Muži hovoria, že po napití sa cítia osviežení; lekár to potvrdzuje. Nikto z nich však nehovorí o omladnutí. Miestny náčelník Timukuov hovorí o prameni ako o liečivom mieste, užitočnom pri horúčke a bolestiach kĺbov. Kronikár si to zaznamená; dvorných lekárov to bude zaujímať. Fontána nie je taká, ako ju vykresľovala legenda. Prameň však jestvuje. [target_leader.GetName] vydá rozkaz postaviť na tomto mieste svätyňu." # todo: NEW TRANSLATION
 seven_cities_fountain.2.a: "Vyhláste prameň za majetok [ROOT.GetCountry.GetNameWithNoTooltip]. Obchod s liečivou vodou by mohol priniesť zisk." # todo: NEW TRANSLATION
 seven_cities_fountain.2.historical_info: "Florida je výnimočne bohatá na artézske pramene, z ktorých mnohé slúžili Timukuom a ďalším pôvodným obyvateľom polostrova ako obradné a liečebné centrá. Európania začali tieto miesta premieňať na liečebné a kúpeľné strediská v 18. storočí a tento trend pretrváva dodnes v podobe kúpeľných miest roztrúsených okolo väčších prameňov. Liečivé účinky pripisované týmto vodám sa v priebehu času menili, no len zriedka zahŕňali samotné omladnutie; táto časť legendy bola vždy výlučne európska." # todo: NEW TRANSLATION
 seven_cities_fountain.3.title: "Skutočná fontána" # todo: NEW TRANSLATION
 seven_cities_fountain.3.desc: "Prameň v srdci krajiny Timukuov zodpovedá opisu v legende, alebo sa mu aspoň natoľko približuje, že kronikár odmieta spísať správu, kým si trikrát neprečíta, čo napísal. Voda je čistá, studená a jemne mineralizovaná. Muži, ktorí sa v nej týždeň kúpu, opisujú presne to, čo podľa legendy opisovať majú: vlasy im už tak nesivejú, chrbty ich tak nebolia a kĺby už nemajú také stuhnuté. Ich rany sa hoja bez komplikácií. Lekár, ktorý má šesťdesiatjeden rokov, hovorí [target_leader.GetName], že sa necítil tak dobre od svojich dvadsiatich piatich. Správa je podpísaná a zapečatená ešte pred západom slnka." # todo: NEW TRANSLATION
 seven_cities_fountain.3.a: "Náš dvor sa to dozvie. Legendárny prameň je náš." # todo: NEW TRANSLATION
 seven_cities_fountain.3.historical_info: "Legenda o vodách, ktoré vracajú mladosť, má v Európe dlhú tradíciu a siaha prinajmenšom až k Herodotovmu opisu prameňa v krajine Etiópčanov. Jeho voda údajne voňala po fialkách a tým, ktorí sa v nej kúpali, zaručovala nezvyčajne dlhý život. Španielske prenesenie tejto legendy na Floridu začiatkom 16. storočia nebolo nezvyčajné tým, že k nemu došlo, ale tým, akú veľkú podporu mu na krátky čas poskytli štátne inštitúcie. Po väčšinu európskych dejín bola fontána skôr literárnym motívom než cieľom štátnych výdavkov." # todo: NEW TRANSLATION

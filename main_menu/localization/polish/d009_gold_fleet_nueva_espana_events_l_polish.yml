l_polish:
 gold_fleet_nueva_espana_events.1.title: "Na ceste do Nového Španielska" # todo: NEW TRANSLATION
 gold_fleet_nueva_espana_events.1.desc_prefix: "Flotila je vystrojená a pripravená v prístave [departure_port.GetName]. Na palube je voda a proviant, ako aj železné nástroje a ortuť, ktoré si kolónie nedokážu zaobstarať samy, a [target_leader.GetName] drží v rukách rozkazy [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')].\n\nPlavba bude dlhá: popri Kanárskych ostrovoch a cez Karibik až k brehom Nového Španielska" # todo: NEW TRANSLATION
 gold_fleet_nueva_espana_events.1.desc_suffix: "čakajú na naplnenie našich podpalubí. Ak máme bezpečne dopraviť domov bohatstvo tejto sezóny, flotila musí vyplávať hneď." # todo: NEW TRANSLATION
 gold_fleet_nueva_espana_events.1.desc: "$gold_fleet_nueva_espana_events.1.desc_prefix$, kde na nás čakajú [ShowGoodsName('silver')] a [ShowGoodsName('dyes')] $gold_fleet_nueva_espana_events.1.desc_suffix$" # todo: NEW TRANSLATION
 gold_fleet_nueva_espana_events.1.desc.rich: "$gold_fleet_nueva_espana_events.1.desc_prefix$. [ShowGoodsName('silver')] z [silver_source.GetName] a [ShowGoodsName('dyes')] z [dye_source.GetName] $gold_fleet_nueva_espana_events.1.desc_suffix$" # todo: NEW TRANSLATION
 gold_fleet_nueva_espana_events.1.a: "Zdvihnite kotvy. Flotila vypláva s ranným prílivom." # todo: NEW TRANSLATION
 gold_fleet_nueva_espana_events.1.historical_info: "#italic Flota de Nueva España#! bola jedným z dvoch konvojov tvoriacich španielsku #italic Carrera de Indias#!. Slúžila miestokráľovstvu Nového Španielska a cez prístav San Juan de Ulúa pri Veracruze zhromažďovala striebro z baní v Zacatecas, Guanajuate a ďalších mexických nálezísk, ako aj cenný tovar vrátane košenilového farbiva z Oaxacy, indiga, vanilky a kakaa. #italic Flota#! zvyčajne vyplávala zo Španielska na jar a vracala sa na jeseň; v Havane sa pripájala ku galeónam Tierra Firme a spoločne preplávali Atlantik. Trasa cez prieliv Mona medzi Hispaniolou a Portorikom bola obvyklou vstupnou cestou do východného Karibiku." # todo: NEW TRANSLATION
 gold_fleet_nueva_espana_events.2.title: "Bohatstvo Nového Španielska" # todo: NEW TRANSLATION
 gold_fleet_nueva_espana_events.2.desc_prefix: "Dorazili sme do [loot_port.GetName] a účtovníci pracujú už celé týždne. [ShowGoodsName('silver')] priviezli na muliciach z" # todo: NEW TRANSLATION
 gold_fleet_nueva_espana_events.2.desc_middle: " a vedľa neho ležia balíky [ShowGoodsName('dyes')]" # todo: NEW TRANSLATION
 gold_fleet_nueva_espana_events.2.desc_suffix: ", ktoré sa v [departure_port.GetName] vymieňajú za rovnakú váhu [ShowGoodsNameWithNoTooltip('silver')].\n\nPosledné [ShowGoodsNameWithNoTooltip('silver')] tejto sezóny je ešte stále na ceste z vnútrozemia. Môžeme počkať na celý konvoj a naplniť každé podpalubie, alebo vziať to, čo už zhromaždili, a vyplávať skôr, než búrková sezóna uzavrie pobrežie." # todo: NEW TRANSLATION
 gold_fleet_nueva_espana_events.2.desc: "$gold_fleet_nueva_espana_events.2.desc_prefix$ vnútrozemských baní$gold_fleet_nueva_espana_events.2.desc_middle$ $gold_fleet_nueva_espana_events.2.desc_suffix$" # todo: NEW TRANSLATION
 gold_fleet_nueva_espana_events.2.desc.rich: "$gold_fleet_nueva_espana_events.2.desc_prefix$ [silver_source.GetName]$gold_fleet_nueva_espana_events.2.desc_middle$ z [dye_source.GetName] $gold_fleet_nueva_espana_events.2.desc_suffix$" # todo: NEW TRANSLATION
 gold_fleet_nueva_espana_events.2.a: "Počkajme na konvoj a naplňme podpalubia [ShowGoodsNameFlat('silver')] a [ShowGoodsNameFlat('dyes')]." # todo: NEW TRANSLATION
 gold_fleet_nueva_espana_events.2.b: "Vezmime len to, čo už zhromaždili." # todo: NEW TRANSLATION
 gold_fleet_nueva_espana_events.2.c: "Sezóna je už príliš nebezpečná. Vyplávajme domov s tým, čo máme." # todo: NEW TRANSLATION
 gold_fleet_nueva_espana_events.2.historical_info: "Veracruz, ktorého kotvisko chránila ostrovná pevnosť San Juan de Ulúa, bol jediným povoleným prístavom pre atlantický obchod Nového Španielska. Mesto ležalo na malarickom piesočnom výbežku vystavenom #italic nortes#!, prudkým severným búrkam, ktoré robili nakladaciu sezónu nebezpečnou. Mexické striebro sa ťažilo najmä vo veľkých banských komplexoch v Zacatecas (objavených v roku 1546) a Guanajuate, odkiaľ ho na muliciach prevážali k pobrežiu a pod ozbrojeným dohľadom nakladali na lode. Košenila, žiarivo šarlátové farbivo vyrábané z hmyzu chovaného na opunciách v Oaxace, bola po striebre jednou z najcennejších komodít Nového sveta. Španielsko si na ňu žiarlivo strážilo monopol a premenila textilný priemysel v Európe." # todo: NEW TRANSLATION
 gold_fleet_nueva_espana_events.3.title: "Stretnutie v prístave [rendezvous_port.GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 gold_fleet_nueva_espana_events.3.desc.together: "Flotila dorazila do [rendezvous_port.GetName], kde galeóny Tierra Firme už kotvia pod ochranou diel pevnosti. Ich podpalubia sú rovnako plné [ShowGoodsName('silver')] ako naše. Odtiaľto obe flotily spoločne preplávajú Atlantik: na sever pozdĺž Golfského prúdu a potom na východ popri pobreží Floridy.\n\nDostali sme správu, že na tejto trase čakajú nepriateľské lode, no taký veľký konvoj je ťažkou korisťou. [target_leader.GetName] musí rozhodnúť, ako spojená flotila odpovie na hrozbu, skôr než vypláva do Španielska." # todo: NEW TRANSLATION
 gold_fleet_nueva_espana_events.3.desc.alone: "Flotila dorazila do [rendezvous_port.GetName] a kotví pod ochranou diel pevnosti. Galeóny Tierra Firme, ktoré by sa k nám mali pripojiť, tu nie sú. Atlantik preplávame sami: na sever pozdĺž Golfského prúdu a potom na východ popri pobreží Floridy.\n\nDostali sme správu, že na tejto trase čakajú nepriateľské lode, a osamelá flotila je lákavým cieľom. [target_leader.GetName] musí rozhodnúť, ako odpovieme na hrozbu, skôr než vyplávame do Španielska." # todo: NEW TRANSLATION
 gold_fleet_nueva_espana_events.3.a: "Najmime ďalšie vojnové lode z posádky v [rendezvous_port.GetNameWithNoTooltip]." # todo: NEW TRANSLATION
 gold_fleet_nueva_espana_events.3.b: "Rýchlosť nám poslúži lepšie než delá. Za úsvitu vyplávame." # todo: NEW TRANSLATION
 gold_fleet_nueva_espana_events.3.c: "Nebezpečenstvo je priveľké. Prezimujme tu a vyplávajme až v budúcej sezóne." # todo: NEW TRANSLATION
 gold_fleet_nueva_espana_events.3.historical_info: "Havana sa stala povinným miestom zhromaždenia vracajúcej sa striebornej flotily po tom, čo Filip II. v roku 1566 ustanovil systém konvojov. Hlboký prírodný prístav a poloha mesta pri Floridskom prielive z neho robili ideálne miesto stretnutia galeón Tierra Firme a Flota de Nueva España pred spoločným preplávaním Atlantiku. Výstavba pevnosti Castillo de los Tres Reyes del Morro od roku 1589 bola priamou odpoveďou na hrozbu zahraničných korzárov. Nálet holandského admirála Pieta Heina v roku 1628, pri ktorom pri zátoke Matanzas zajal celú vracajúcu sa flotilu, zostáva najúchvatnejším úspechom, aký kedy dosiahol nepriateľ španielskeho konvojového systému." # todo: NEW TRANSLATION
 gold_fleet_nueva_espana_events.8.title: "Čakanie na flotilu Tierra Firme" # todo: NEW TRANSLATION
 gold_fleet_nueva_espana_events.8.desc: "Flotila dorazila do [rendezvous_port.GetName], ale galeóny Tierra Firme sa z juhu ešte nevrátili. Rozkazy [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')] sú jasné: flotily s pokladom majú preplávať Atlantik spoločne a sústrediť svoje delá proti korzárom, ktorí sa potulujú po Floridskom prielive.\n\nPreto zakotvíme pod ochranou pevnosti a počkáme na ne. Dúfajme, že neprídu s veľkým oneskorením." # todo: NEW TRANSLATION
 gold_fleet_nueva_espana_events.8.a: "Počkáme na druhú flotilu." # todo: NEW TRANSLATION
 gold_fleet_nueva_espana_events.8.historical_info: "Dva pokladové konvoje #italic Carrera de Indias#! — #italic Flota de Nueva España#! a #italic Galeones de Tierra Firme#! — sa mali spojiť v Havane a spoločne preplávať Atlantik, aby ich spojený sprievod odrazil korzárov i občasné nepriateľské eskadry. Flotily však často meškali a konvoj, ktorý zmeškal svoj sprievod, si musel vybrať medzi prezimovaním v Havane a nebezpečnou samostatnou plavbou." # todo: NEW TRANSLATION
 gold_fleet_nueva_espana_events.9.title: "Flotila stále čaká" # todo: NEW TRANSLATION
 gold_fleet_nueva_espana_events.9.desc: "V [rendezvous_port.GetName] sme na kotve už celé týždne, no galeóny Tierra Firme stále nedorazili. Zásoby sa míňajú, muži sú čoraz nepokojnejší a každý ďalší deň na kotve posúva sezónu ďalej od bezpečného preplávania.\n\n[target_leader.GetName] musí rozhodnúť, či počkáme na stretnutie, alebo riskneme plavbu cez Atlantik bez nich." # todo: NEW TRANSLATION
 gold_fleet_nueva_espana_events.9.a: "Počkajme ešte chvíľu. Spoločná plavba je oveľa bezpečnejšia." # todo: NEW TRANSLATION
 gold_fleet_nueva_espana_events.9.b: "Čakali sme dosť dlho. Vyplávajme do Španielska bez nich." # todo: NEW TRANSLATION
 gold_fleet_nueva_espana_events.9.historical_info: "Osud pokladových flotíl závisel od správneho načasovania. Konvoj, ktorý sa v Havane zdržal príliš dlho, riskoval, že ho zastihne hurikánová sezóna v Karibiku alebo zimné búrky na Atlantiku. Ten, ktorý vyplával priskoro, zase prišiel o ochranu početnej flotily. Velitelia zvažovali nebezpečenstvo plavby v porovnaní s nákladmi na zdržanie a nie každá flotila sa rozhodla čakať na svoj sprievod." # todo: NEW TRANSLATION
 gold_fleet_nueva_espana_events.10.title: "Rozdelenie flotily" # todo: NEW TRANSLATION
 gold_fleet_nueva_espana_events.10.desc: "[target_leader.GetName] dostal správu, že aj [secondary_port.GetName] je nám otvorený a jeho sklady sú plné [ShowGoodsName('goods_gold')] a koží. Mohli by sme odčleniť eskadru, aby zhromaždila aj toto bohatstvo, no znamenalo by to rozdeliť naše sily v nebezpečných vodách.\n\nMôžeme ponechať flotilu v [loot_port.GetNameWithNoTooltip], kým sa oddelená eskadra nevráti, alebo pokračovať do [rendezvous_port.GetNameWithNoTooltip] a počkať na ňu tam." # todo: NEW TRANSLATION
 gold_fleet_nueva_espana_events.10.a: "Zostaňme pohromade. Vezmime si, čo máme, a vyplávajme." # todo: NEW TRANSLATION
 gold_fleet_nueva_espana_events.10.b: "Odčleňme eskadru do [secondary_port.GetNameWithNoTooltip] a počkajme na jej návrat." # todo: NEW TRANSLATION
 gold_fleet_nueva_espana_events.10.c: "Odčleňme eskadru do [secondary_port.GetNameWithNoTooltip]; my pokračujme do [rendezvous_port.GetNameWithNoTooltip]." # todo: NEW TRANSLATION
 gold_fleet_nueva_espana_events.10.historical_info: "Pokladové flotily len zriedka nakladali celý svoj náklad v jednom prístave. Eskadry sa pravidelne odčleňovali, aby v menších prístavoch vyzdvihli striebro, kože a farbivá, a potom sa pred preplávaním Atlantiku znova pripojili ku konvoju. Rozdelením flotily sa zväčšil náklad, no menšie eskadry sa tým vystavovali korzárom, ktorí číhali v priechodoch medzi ostrovmi." # todo: NEW TRANSLATION
 gold_fleet_nueva_espana_events.10.danger_tt: "Rozdelením flotily oslabíte obe eskadry a zvýšite nebezpečenstvo tejto plavby (#G +1#! úroveň nebezpečenstva)" # todo: NEW TRANSLATION
 gold_fleet_nueva_espana_events.10.a.tt: "Flotila zostane pohromade a bude pokračovať bez nákladu z [secondary_port.GetName]." # todo: NEW TRANSLATION
 gold_fleet_nueva_espana_events.together_danger_suffix: "znižuje nebezpečenstvo tejto plavby." # todo: NEW TRANSLATION
 gold_fleet_nueva_espana_events.havana_together_danger_tt: "Spoločná plavba s flotilou Tierra Firme $gold_fleet_nueva_espana_events.together_danger_suffix$" # todo: NEW TRANSLATION
 gold_fleet_nueva_espana_events.awaiting_fleet_tt: "Flotila tu zostane kotviť, kým dorazí flotila Tierra Firme, nech to potrvá akokoľvek dlho" # todo: NEW TRANSLATION
 gold_fleet_nueva_espana_events.hold_longer_tt: "Flotila bude ďalej kotviť a čakať na druhú pokladovú flotilu" # todo: NEW TRANSLATION
 gold_fleet_nueva_espana_events.11.title: "Odčlenená eskadra sa vracia" # todo: NEW TRANSLATION
 gold_fleet_nueva_espana_events.11.desc: "Eskadra vyslaná do [secondary_port.GetName] sa vrátila do [loot_port.GetName] s podpalubiami plnými [ShowGoodsName('goods_gold')] a koží. Flotila je opäť pohromade a vďaka tomu bezpečnejšia." # todo: NEW TRANSLATION
 gold_fleet_nueva_espana_events.11.a: "Naložme náklad na palubu. Flotila vypláva spoločne." # todo: NEW TRANSLATION
 gold_fleet_nueva_espana_events.11.historical_info: "Pokladové flotily len zriedka nakladali celý svoj náklad v jednom prístave. Odčlenené eskadry, ktoré zbierali striebro, kože a farbivá v menších prístavoch, sa mali pred ďalším pokračovaním pripojiť k hlavnému konvoju. Tým sa obnovila početnosť flotily aj jej bezpečnosť na nasledujúcej plavbe." # todo: NEW TRANSLATION
 gold_fleet_nueva_espana_events.12.title: "Odčlenená eskadra sa znovu pripája pri Kube" # todo: NEW TRANSLATION
 gold_fleet_nueva_espana_events.12.desc: "Eskadra odčlenená do [secondary_port.GetName] dobehla flotilu, keď sa blížila k [rendezvous_port.GetNameWithNoTooltip]. Jej podpalubia sú naložené poslednými [ShowGoodsName('goods_gold')] a kožami tejto sezóny." # todo: NEW TRANSLATION
 gold_fleet_nueva_espana_events.12.a: "Naložme náklad na palubu. Flotila vypláva spoločne." # todo: NEW TRANSLATION
 gold_fleet_nueva_espana_events.12.historical_info: "Ak odčlenená eskadra v prístave nečakala, stále mohla dobehnúť hlavný konvoj pred jeho príchodom do Havany, ak jej počasie a vietor dopriali rýchly návrat k flotile." # todo: NEW TRANSLATION
 gold_fleet_nueva_espana_events.15.title: "El Norte" # todo: NEW TRANSLATION
 gold_fleet_nueva_espana_events.15.desc: "Severná obloha potemnela a zošedla, tlak prudko klesá. Nad Záliv sa ženie #italic norte#! — prudký severný víchor, ktorý prichádza bez veľkého varovania a rozbúri krátke, nebezpečné vlny. V týchto plytkých vodách, s meniacimi sa pobrežnými plytčinami blízko po záveternej strane, je to zabijak lodí.\n\n[target_leader.GetName] musí rozhodnúť, ako flotila víchoru čelí, skôr než dorazí." # todo: NEW TRANSLATION
 gold_fleet_nueva_espana_events.15.a: "Vyplávajme na otvorené more a prečkávajme severný víchor tam." # todo: NEW TRANSLATION
 gold_fleet_nueva_espana_events.15.b: "Vyhľadajme úkryt pri pobreží a počkajme, kým víchor ustane." # todo: NEW TRANSLATION
 gold_fleet_nueva_espana_events.15.deep_safe_tt: "Flotila sa s námahou dostane na otvorené more a severný víchor prečká bez úhony" # todo: NEW TRANSLATION
 gold_fleet_nueva_espana_events.15.deep_loss_tt: "Severný víchor rozptýli flotilu a zaženie lode na plytčiny; časť nákladu s nimi klesne ku dnu" # todo: NEW TRANSLATION
 gold_fleet_nueva_espana_events.15.historical_info: "#italic Nortes#! boli studené severné víchrice, ktoré sa od jesene do jari preháňali nad Mexickým zálivom. Líšili sa od letných hurikánov, no muži zapojení do obchodu s Veracrúzom sa ich obávali rovnako. Kotvisko pri San Juan de Ulúa im bolo vystavené a severný víchor mohol pritlačiť flotilu k pobrežiu alebo ju zahnať na plytčiny Campeche Bank. Nakladanie vo Veracruze sa načasúvalo podľa obdobia severných víchrov rovnako ako podľa príchodu striebra. Silná búrka mohla flotilu na záveternej strane pobrežia zničiť, aj keď bola pevnina na dohľad." # todo: NEW TRANSLATION
 gold_fleet_nueva_espana_events.16.title: "Strieborný konvoj mešká" # todo: NEW TRANSLATION
 gold_fleet_nueva_espana_events.16.desc: "Na nábrežie dorazila správa, že veľký mulí konvoj tejto sezóny z [silver_source.GetName] ešte neprišiel. Niekde na dlhej ceste z vnútrozemia ho prepadli — prúty [ShowGoodsName('silver')] ležia rozhádzané po horskom chodníku, pohoničov zahnali a bohatstvo koruny uviazlo stovky kilometrov od mora.\n\nPodpalubia sú zaplnené len napoly a [target_leader.GetName] musí rozhodnúť, či sa flotile oplatí pokúsiť sa získať zvyšok." # todo: NEW TRANSLATION
 gold_fleet_nueva_espana_events.16.a: "Pošlime námornú pechotu do vnútrozemia, aby striebro sprevádzala k pobrežiu." # todo: NEW TRANSLATION
 gold_fleet_nueva_espana_events.16.b: "Nemôžeme čakať. Vyplávajme s tým, čo už máme v podpalubí." # todo: NEW TRANSLATION
 gold_fleet_nueva_espana_events.16.historical_info: "Striebro z veľkých mexických baní — Zacatecasu, Guanajuata a menších severných táborov — sa prevážalo po #italic Camino Real de Tierra Adentro#!, kráľovskej ceste, ktorá sa tiahla stovky kilometrov vyprahnutou a riedko osídlenou krajinou do Mexico City. Odtiaľ ho prevážali na východ do Veracruzu. Po tejto trase po celé generácie útočili na konvoje Čičimekovia zo severnej pohraničnej oblasti a neskôr aj banditi. Preto sa drahý kov prepravoval v strážených konvojoch, ktorých načasovanie určovalo celú nakladaciu sezónu na pobreží. Ak sa konvoj na ceste oneskoril alebo ho vylúpili, flotila mohla zostať kotviť v prístave alebo vyplávať len s polovičným nákladom." # todo: NEW TRANSLATION
 gold_fleet_nueva_espana_events.17.title: "Červotoč v trupe" # todo: NEW TRANSLATION
 gold_fleet_nueva_espana_events.17.desc: "Tesári priniesli [target_leader.GetName] zlé správy: teplé vody Západnej Indie vykonali svoju pomalú prácu a lodné červy sa zavŕtali hlboko do obšívky pod čiarou ponoru. Ak ich nezastavíme, trupy zoslabnú a lode spomalia. Flotila, ktorá nedokáže uniknúť nepriateľovi, bude raz dolapená.\n\nNablízku leží chránený ostrovček, kde by sme mohli lode vykliniť — nakloniť ich na bok, oškrabať zarastené dná, opáliť ich a natrieť smolou. Takáto práca ich však na celé týždne ponechá bezbranné na piesku." # todo: NEW TRANSLATION
 gold_fleet_nueva_espana_events.17.a: "Zastavme sa pri ostrovčeku a poriadne vyklinujme flotilu." # todo: NEW TRANSLATION
 gold_fleet_nueva_espana_events.17.b: "Nemáme čas. Vyplávajme so zarastenými dnami a dúfajme v priaznivý vietor." # todo: NEW TRANSLATION
 gold_fleet_nueva_espana_events.17.historical_info: "V tropických vodách lodný červ #italic Teredo navalis#! — v skutočnosti mäkkýš, nie červ — v priebehu niekoľkých mesiacov prevŕtal nechránené trupy. Bol jednou z najvytrvalejších hrozieb pre každú flotilu operujúcu v Karibiku. Riešením bolo vyklinovanie: loď sa nechala uviaznuť na plytčine alebo sa vytiahla na chránenú pláž, aby sa odhalil trup, z ktorého sa potom oškrabali nánosy, drevo sa opálilo a natrelo lojom a smolou. Práce postupovali pomaly a eskadra počas nich zostávala bezbranná, preto velitelia často riskovali a odkladali ich. Za cenu lodí, ktoré sa plavili ako člny a presakovali každou škárou." # todo: NEW TRANSLATION
 gold_fleet_nueva_espana_events.18.title: "Cudzí votrelci na pobreží" # todo: NEW TRANSLATION
 gold_fleet_nueva_espana_events.18.desc: "Prieskumníci hlásia, že cudzie lode pracujú v lesoch v oblasti [logwood_source.GetName] a pod vlajkou, ktorú nepoznáme, stínajú a odvážajú naše drevo. Na pobreží si vybudovali provizórne tábory, opovážliveli a pašovaný tovar predávajú každej lodi, ktorá pripláva. Usadili sa na území, na ktoré si [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')] nárokuje právo.\n\n[target_leader.GetName] môže vyčleniť výsadok a musí rozhodnúť, čo urobiť s týmito nevítanými hosťami." # todo: NEW TRANSLATION
 gold_fleet_nueva_espana_events.18.a: "Vysadnime mužov, vypáľme tábory a naložme drevo na naše lode." # todo: NEW TRANSLATION
 gold_fleet_nueva_espana_events.18.b: "Nechajme ich tak a kúpme od nich mapy a správy o nepriateľských lodiach." # todo: NEW TRANSLATION
 gold_fleet_nueva_espana_events.18.historical_info: "Riedko osídlené pobrežia Zálivu a zátoky Campeche počas koloniálneho obdobia priťahovali cudzích votrelcov, predovšetkým ťažiarov farbiarskeho dreva — Angličanov, Holanďanov a Francúzov — ktorí rúbali vzácne drevo žiadané v európskom textilnom priemysle. Ďaleko od španielskych posádok títo #italic baymen#! ľahko prechádzali medzi legálnym ťažením, pašovaním a otvoreným pirátstvom. Španielske snahy vyhnať ich boli sporadické a málokedy trvalé. Prechádzajúca flotila mohla tábor rozprášiť, no drevorubači sa vrátili, len čo lode zmizli za obzorom." # todo: NEW TRANSLATION

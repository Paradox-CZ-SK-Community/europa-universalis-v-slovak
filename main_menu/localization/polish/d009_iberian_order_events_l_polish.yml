l_polish:
 d009_iberian_order_events.1.title: "Úrad majstra rádu [target_order.GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 d009_iberian_order_events.1.entry: "Úrad majstra Santiaga" # todo: NEW TRANSLATION
 d009_iberian_order_events.1.desc: "Majster rádu [target_order.GetName] zomrel a bratia sa zišli na kapitule, aby vymenovali jeho nástupcu.\n\nŽiaden iný rád v krajine [ROOT.GetCountry.GetAltAdjective('D')] nie je taký bohatý ani taký nebezpečný. Jeho komtúrstva siahajú od rieky Tajo až po hranice oblasti [ShowAreaName('andalusia_area')], jeho kopije poslúchajú majstra, ktorý sa zodpovedá iba pápežovi, a ten, koho kapitula zvolí, bude ovládať väčšiu časť našej južnej hranice než celý náš stav [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')].\n\n[target_ruler.GetName] nečakal, kým ho o to požiadajú. [target_ruler.GetSheHe|U] už vyrazil do kapituly, so sprievodom za [target_ruler.GetHerHis] chrbtom a s vyhliadnutým kandidátom." # todo: NEW TRANSLATION # todo: COUNTRY CASE
 d009_iberian_order_events.1.a: "Majstra vymenuje [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('crown_estate')]." # todo: NEW TRANSLATION
 d009_iberian_order_events.1.a.entry: "Majstra vymenuje $crown_estate$." # todo: NEW TRANSLATION
 d009_iberian_order_events.1.b: "Nech si bratia z rádu [target_order.GetNameWithNoTooltip] zvolia svojho majstra." # todo: NEW TRANSLATION
 d009_iberian_order_events.1.b.entry: "Nech si bratia zvolia svojho majstra." # todo: NEW TRANSLATION
 d009_iberian_order_events.1.c: "Nech o tom rozhodne pápež." # todo: NEW TRANSLATION
 d009_iberian_order_events.2.title: "Poklad v [ShowLocationNameWithNoTooltip('ucles')]" # todo: NEW TRANSLATION
 d009_iberian_order_events.2.entry: "$d009_iberian_order_events.2.title$" # todo: NEW TRANSLATION
 d009_iberian_order_events.2.desc: "[ShowLocationName('ucles')] je sídlom aj pokladnicou rádu [target_order.GetName]. Za jeho hradbami ležia dve storočia pohraničných poplatkov, odkazov umierajúcich rytierov a príjmov zo sto komtúrstiev, uložených v podobe strieborného riadu, mincí a relikviárov.\n\nNaša pokladnica na tom nie je tak dobre. Žiaden zákon nám nedovoľuje otvoriť tie dvere, keďže bohatstvo rádu patrí [GetUniqueInternationalOrganization('catholic_church').GetName] a bratia nám to hlasno pripomenú. Medzi naším príkazom a pokladnicou však nestojí ani žiadne vojsko." # todo: NEW TRANSLATION
 d009_iberian_order_events.2.a: "Rád zaplatí naše vojny." # todo: NEW TRANSLATION
 d009_iberian_order_events.2.b: "Nedotýkajme sa pokladu a obdarujme kláštor v [ShowLocationNameWithNoTooltip('ucles')]." # todo: NEW TRANSLATION
 d009_iberian_order_events.2.c: "Pošlime audítorov a vyberme podiel [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('crown_estate')]." # todo: NEW TRANSLATION
 d009_iberian_order_events.2.c.entry: "Pošlime audítorov a vyberme podiel $crown_estate$." # todo: NEW TRANSLATION
 d009_iberian_order_events.3.title: "Cesta do [ShowLocationNameWithNoTooltip('santiago_compostela')]" # todo: NEW TRANSLATION
 d009_iberian_order_events.3.entry: "$d009_iberian_order_events.3.title$" # todo: NEW TRANSLATION
 d009_iberian_order_events.3.desc: "Každý rok ich prichádza viac z oblasti [ShowAreaName('flanders_area')] aj zďaleka za Pyrenejami. Putujú na západ cez našu krajinu [ROOT.GetCountry.GetFlavorRank] k svätyni apoštola. Nesú so sebou striebro na cestu, a preto ich okrádajú.\n\nRád [target_order.GetName] vznikol práve na ochranu tejto cesty. Jeho bratia spravujú nemocnice a mosty a jeho majster nám pripomína, vždy keď sme ochotní počúvať, že ochrana cesty stojí viac, než nám cesta vynesie." # todo: NEW TRANSLATION
 d009_iberian_order_events.3.a: "Zaplaťme bratom, aby strážili cestu." # todo: NEW TRANSLATION
 d009_iberian_order_events.3.b: "Nech namiesto toho vyberajú poplatky od pútnikov." # todo: NEW TRANSLATION
 d009_iberian_order_events.3.c: "Darujme im nemocnicu v [ShowLocationNameWithNoTooltip('leon')]." # todo: NEW TRANSLATION
 d009_iberian_order_events.11.title: "Otázka Cîteaux" # todo: NEW TRANSLATION
 d009_iberian_order_events.11.entry: "$d009_iberian_order_events.11.title$" # todo: NEW TRANSLATION
 d009_iberian_order_events.11.desc: "Rád [target_order.GetName] je cisterciánsky kláštor, ktorý náhodou nosí kopije. Jeho regulu určuje Cîteaux v oblasti [ShowAreaName('burgundy_area')], jeho opáti prichádzajú na juh vykonávať vizitácie a jeho bratia sa riadia disciplínou mníchov, ktorí nikdy nevideli Maura.\n\nČoskoro sa má konať ďalšia vizitácia a tentoraz sa majster pýta, či ju musí prijať. Záleží na tom, koho sa spýtate, či sú cudzí opáti napomínajúci mužov, ktorí strážia našu hranicu, zdrojom povestnej disciplíny rádu, alebo urážkou nášho stavu [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')]." # todo: NEW TRANSLATION
 d009_iberian_order_events.11.a: "Opáti z Cîteaux môžu vo vizitáciách pokračovať." # todo: NEW TRANSLATION
 d009_iberian_order_events.11.b: "Rád sa zodpovedá nám, nie oblasti [ShowAreaNameWithNoTooltip('burgundy_area')]." # todo: NEW TRANSLATION
 d009_iberian_order_events.11.c: "Nech sa o tom právnici ešte niekoľko rokov dohadujú." # todo: NEW TRANSLATION
 d009_iberian_order_events.12.title: "Úrad majstra rádu [target_order.GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 d009_iberian_order_events.12.entry: "Úrad majstra Calatravy" # todo: NEW TRANSLATION
 d009_iberian_order_events.12.desc: "Úrad majstra rádu [target_order.GetName] sa uvoľnil a kapitula je už rozdelená. Jedna frakcia má svojho kandidáta, druhá má súpera a obe majú ozbrojených stúpencov na deň jazdy od hradu.\n\n[target_ruler.GetName] si pamätá, čo posledné sporné voľby stáli našu krajinu [ROOT.GetCountry.GetFlavorRank]. Majster rádu [target_order.GetNameWithNoTooltip] velí hradom na celom strednom pohraničí; majster, ktorý nám nie je ničím zaviazaný, ich môže obrátiť proti nám rovnako ľahko, ako ich môže použiť v náš prospech." # todo: NEW TRANSLATION
 d009_iberian_order_events.12.a: "Majstra vymenuje [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('crown_estate')]." # todo: NEW TRANSLATION
 d009_iberian_order_events.12.a.entry: "Majstra vymenuje $crown_estate$." # todo: NEW TRANSLATION
 d009_iberian_order_events.12.b: "Nech si bratia z rádu [target_order.GetNameWithNoTooltip] zvolia svojho majstra." # todo: NEW TRANSLATION
 d009_iberian_order_events.12.b.entry: "Nech si bratia zvolia svojho majstra." # todo: NEW TRANSLATION
 d009_iberian_order_events.12.c: "Nech Cîteaux urovná spor medzi frakciami." # todo: NEW TRANSLATION
 d009_iberian_order_events.13.title: "Roviny Almagro" # todo: NEW TRANSLATION
 d009_iberian_order_events.13.entry: "$d009_iberian_order_events.13.title$" # todo: NEW TRANSLATION
 d009_iberian_order_events.13.desc: "Almagro je najbohatším komtúrstvom rádu [target_order.GetName] a leží priamo na cestách v La Manche. Kým je naša krajina [ROOT.GetCountry.GetFlavorRank] vo vojne, ten, kto ovláda Almagro, má v rukách obilie, náhradné kone aj priechod.\n\nTamojší veliteľ nikomu nič nevyhlásil. Čaká, kým ho niekto požiada, a žiadajú ho už viaceré strany." # todo: NEW TRANSLATION
 d009_iberian_order_events.13.a: "Almagro sa prihlási na stranu [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('crown_estate')]." # todo: NEW TRANSLATION
 d009_iberian_order_events.13.a.entry: "Almagro sa prihlási na stranu $crown_estate$." # todo: NEW TRANSLATION
 d009_iberian_order_events.13.b: "Nech sa komtúrstvo riadi vlastným svedomím." # todo: NEW TRANSLATION
 d009_iberian_order_events.13.c: "Nikomu nedovolíme použiť Almagro." # todo: NEW TRANSLATION
 d009_iberian_order_events.21.title: "Hranica pri [ShowLocationNameWithNoTooltip('alcantara')]" # todo: NEW TRANSLATION
 d009_iberian_order_events.21.entry: "$d009_iberian_order_events.21.title$" # todo: NEW TRANSLATION
 d009_iberian_order_events.21.desc: "Most v [ShowLocationName('alcantara')] je rímsky a práve preto tam rád [target_order.GetName] sídli. Keď [GetCountry('POR').GetName] proti nám pozdvihlo zbrane, tento most je najkratšou cestou do našej krajiny [ROOT.GetCountry.GetFlavorRank] aj do ich krajiny.\n\nMajster píše, že môže udržať priechod, vypáliť protiľahlý breh alebo dohodnúť miestny mier s veliteľmi [GetCountry('POR').GetAdjectiveWithNoTooltip], ktorých pozná už dvadsať rokov. Čaká, kým mu povieme, čo má urobiť." # todo: NEW TRANSLATION
 d009_iberian_order_events.21.a: "Udržme most, nech to stojí čokoľvek." # todo: NEW TRANSLATION
 d009_iberian_order_events.21.b: "Nech podnikajú výpady cez rieku Tajo a ponechajú si korisť." # todo: NEW TRANSLATION
 d009_iberian_order_events.21.c: "Nech na hranici vyjedná prímerie." # todo: NEW TRANSLATION
 d009_iberian_order_events.22.title: "Posledný majster rádu [target_order.GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 d009_iberian_order_events.22.entry: "Posledný majster rádu Alcántara" # todo: NEW TRANSLATION
 d009_iberian_order_events.22.desc: "Majster rádu [target_order.GetName] je starý muž, skôr učenec než vojak, a posledný z jeho rodu, ktorý zastáva tento úrad na základe slobodnej voľby bratov.\n\n[target_ruler.GetName] sa netají tým, čo sa stane, keď zomrie. Otázkou je len to, či stav [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')] počká, alebo starého muža požiada, aby odstúpil už teraz, kým to ešte môže urobiť dôstojne." # todo: NEW TRANSLATION
 d009_iberian_order_events.22.a: "Jeho nástupcu vymenuje už teraz [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('crown_estate')]." # todo: NEW TRANSLATION
 d009_iberian_order_events.22.a.entry: "Jeho nástupcu vymenuje už teraz $crown_estate$." # todo: NEW TRANSLATION
 d009_iberian_order_events.22.b: "Úrad majstra si ponechá až do smrti." # todo: NEW TRANSLATION
 d009_iberian_order_events.22.c: "Nech v čestnom pokoji odíde do svojej knižnice." # todo: NEW TRANSLATION
 d009_iberian_order_events.23.title: "Pokladnica v [ShowLocationNameWithNoTooltip('brozas')]" # todo: NEW TRANSLATION
 d009_iberian_order_events.23.entry: "$d009_iberian_order_events.23.title$" # todo: NEW TRANSLATION
 d009_iberian_order_events.23.desc: "Pokladnicu v [ShowLocationName('brozas')] otvorili a s ňou zmizli aj ročné príjmy z polovice komtúrstiev rádu [target_order.GetName]. Nebolo obliehanie ani vypáčené dvere, a tak sa bratia dozvedeli to, čo počuť najmenej chceli: zlodej je niekto z ich vlastnej domácnosti.\n\nMajster požiadal o našu pomoc, čo samo osebe veľa prezrádza. Nepýtal by sa, keby dokázal zlodejov nájsť sám." # todo: NEW TRANSLATION
 d009_iberian_order_events.23.a: "Pošlime za zlodejmi mužov [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('crown_estate')]." # todo: NEW TRANSLATION
 d009_iberian_order_events.23.a.entry: "Pošlime za zlodejmi mužov $crown_estate$." # todo: NEW TRANSLATION
 d009_iberian_order_events.23.b: "Rád musí znášať vlastné straty." # todo: NEW TRANSLATION
 d009_iberian_order_events.31.title: "Karavely [order_administrator.GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 d009_iberian_order_events.31.entry: "Karavely správcu" # todo: NEW TRANSLATION
 d009_iberian_order_events.31.desc: "[order_administrator.GetName] spravuje rád [target_order.GetName] a [order_administrator.GetSheHe] zistil, čo to znamená: príjmy z každého komtúrstva v našej krajine [ROOT.GetCountry.GetFlavorRank] a nikto, kto by mal právo pýtať sa [order_administrator.GetHerHim], na čo ich míňa.\n\n[order_administrator.GetSheHe|U] ich míňa na lode. Rok čo rok plávajú karavely na juh popri [ShowLocationName('cape_bojador')] a vracajú sa s pieskom, otrokmi a príbehmi, a rok čo rok sa príjmy rádu míňajú na ďalšiu loď. Bratia nám už začali písať." # todo: NEW TRANSLATION
 d009_iberian_order_events.31.a: "Prispejme na plavby aj z pokladnice [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('crown_estate')]." # todo: NEW TRANSLATION
 d009_iberian_order_events.31.a.entry: "Prispejme na plavby aj z pokladnice $crown_estate$." # todo: NEW TRANSLATION
 d009_iberian_order_events.31.b: "Nech si [order_administrator.GetNameWithNoTooltip] vezme, čo si rád môže dovoliť." # todo: NEW TRANSLATION
 d009_iberian_order_events.31.b.entry: "Nech si správca vezme, čo si rád môže dovoliť." # todo: NEW TRANSLATION
 d009_iberian_order_events.31.c: "Príjmy rádu sú určené na obranu hranice, nie na oceán." # todo: NEW TRANSLATION
 d009_iberian_order_events.32.title: "Dedičstvo templárov" # todo: NEW TRANSLATION
 d009_iberian_order_events.32.entry: "$d009_iberian_order_events.32.title$" # todo: NEW TRANSLATION
 d009_iberian_order_events.32.desc: "Rád [target_order.GetName] vznikol preto, že sme kedysi odmietli dovoliť, aby templárske pozemky opustili krajinu [ROOT.GetCountry.GetAltAdjective('A')], a jednoducho sme premenovali mužov, ktorí ich držali. Vždy to bola len právna fikcia a [GetCountry('ARA').GetName] našlo právnika ochotného povedať to nahlas.\n\nNárok sa týka starých templárskych komtúrstiev. Ak ho uznáme, rád príde o majetky, na ktorých bol založený; ak sa mu postavíme, budeme sa o tom desaťročie sporiť pred kúriou." # todo: NEW TRANSLATION # todo: COUNTRY CASE
 d009_iberian_order_events.32.a: "Obhájme dedičstvo pred kúriou." # todo: NEW TRANSLATION
 d009_iberian_order_events.32.b: "Vykúpme nárok [GetCountry('ARA').GetAdjectiveWithNoTooltip]." # todo: NEW TRANSLATION
 d009_iberian_order_events.32.b.entry: "Vykúpme nárok $ARA_ADJ$." # todo: NEW TRANSLATION
 d009_iberian_order_events.33.title: "Kríž na plachtách" # todo: NEW TRANSLATION
 d009_iberian_order_events.33.entry: "$d009_iberian_order_events.33.title$" # todo: NEW TRANSLATION
 d009_iberian_order_events.33.desc: "Každá karavela, ktorá vypláva na juh, nesie na hlavnej plachte kríž rádu [target_order.GetName]. Rád ich zaplatil poriadny počet a začína sa pýtať, čo mu na druhej strane plavby patrí.\n\nKomtúrstvo na oceáne je zvláštny nápad. Kedysi bolo zvláštnym nápadom aj komtúrstvo na maurskom pohraničí." # todo: NEW TRANSLATION
 d009_iberian_order_events.33.a: "Darujme im [ShowLocationNameWithNoTooltip('lagos')] a podiel z plavieb." # todo: NEW TRANSLATION
 d009_iberian_order_events.33.b: "[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('crown_estate')] si vezme svoj podiel z toho, čo financuje." # todo: NEW TRANSLATION
 d009_iberian_order_events.33.b.entry: "$crown_estate$ si vezme svoj podiel z toho, čo financuje." # todo: NEW TRANSLATION
 d009_iberian_order_events.33.c: "Rád sa do zámorského podniku nezapojí." # todo: NEW TRANSLATION
 d009_iberian_order_events.41.title: "Majster rádu [target_order.GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 d009_iberian_order_events.41.entry: "Majster rádu Avis" # todo: NEW TRANSLATION
 d009_iberian_order_events.41.desc: "Trón je prázdny, nárok [ShowCultureName('castilian')] je silný a naši [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] hľadajú vlastného kandidáta, s ktorým by sa dokázali zmieriť.\n\nStále pokukujú po majstrovi rádu [target_order.GetName]. Má krv [ROOT.GetCountry.GetGovernment.GetAdjective] z nesprávnej strany manželského loža, zaviazal sa k celibátu a velí jedinému disciplinovanému jazdectvu v našej krajine [ROOT.GetCountry.GetFlavorRank], ktoré už nie je niekomu prisľúbené. Bratia z rádu by ho nasledovali kamkoľvek, aj na trón." # todo: NEW TRANSLATION
 d009_iberian_order_events.41.a: "Nech rád [target_order.GetNameWithNoTooltip] vytiahne do boja za svojho majstra." # todo: NEW TRANSLATION
 d009_iberian_order_events.41.pretender_tt: "Majster rádu Avis si nárokuje trón" # todo: NEW TRANSLATION
 d009_iberian_order_events.41.a.entry: "Dosadiť majstra rádu na trón." # todo: NEW TRANSLATION
 d009_iberian_order_events.41.b: "Nárok [ShowCultureNameWithNoTooltip('castilian')] je oprávnený." # todo: NEW TRANSLATION
 d009_iberian_order_events.41.c: "Nedovolíme rádu, aby si vyberal našich vládcov." # todo: NEW TRANSLATION
 d009_iberian_order_events.42.title: "Správca rádu [target_order.GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 d009_iberian_order_events.42.entry: "Správca rádu Avis" # todo: NEW TRANSLATION
 d009_iberian_order_events.42.desc: "Úrad majstra rádu [target_order.GetName] sa opäť uvoľnil a [ROOT.GetCountry.GetGovernment.GetCourtTitle] si všimol niečo, čo by si bratia radšej nevšimli: žiaden zákon neprikazuje, aby [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')] čakalo na ich voľbu.\n\n[target_ruler.GetName] má mladšieho príbuzného bez dedičstva a zamestnania a rád má dosť majetkov na to, aby takého muža živil v štýle, aký očakáva. Nebolo by to prvýkrát, čo si princ obliekol rehoľné rúcho, hoci ho nikdy nemienil ctiť." # todo: NEW TRANSLATION
 d009_iberian_order_events.42.a: "Správcu vymenuje [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('crown_estate')]." # todo: NEW TRANSLATION
 d009_iberian_order_events.42.a.entry: "Správcu vymenuje $crown_estate$." # todo: NEW TRANSLATION
 d009_iberian_order_events.42.b: "Nechajme bratom ich voľbu." # todo: NEW TRANSLATION
 d009_iberian_order_events.43.title: "Kolégium v [ShowLocationNameWithNoTooltip('evora')]" # todo: NEW TRANSLATION
 d009_iberian_order_events.43.entry: "$d009_iberian_order_events.43.title$" # todo: NEW TRANSLATION
 d009_iberian_order_events.43.desc: "Predkladá sa nám návrh založiť kolégium v [ShowLocationName('evora')] a rád [target_order.GetName] má príjmy, z ktorých by sa dalo financovať.\n\nRád vznikol, aby strážil hranicu, ktorá už neexistuje. Jeho komtúrstva sú dnes farmami a jeho bratia zemepánmi. Kolégium by dalo rádu nové poslanie, čo je buď štedrý zámer, alebo priznanie, že už stratil zmysel." # todo: NEW TRANSLATION
 d009_iberian_order_events.43.a: "Založme kolégium spoločne z prostriedkov [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('crown_estate')] a rádu." # todo: NEW TRANSLATION
 d009_iberian_order_events.43.a.entry: "Spoločne obdarujte kolégium z prostriedkov $crown_estate$ a rádu." # todo: NEW TRANSLATION
 d009_iberian_order_events.43.b: "Nech rád prispeje tým, čo si môže dovoliť." # todo: NEW TRANSLATION
 d009_iberian_order_events.43.c: "[ShowLocationNameWithNoTooltip('evora')] môže počkať." # todo: NEW TRANSLATION
 d009_iberian_order_events.51.title: "Templárske majetky" # todo: NEW TRANSLATION
 d009_iberian_order_events.51.entry: "$d009_iberian_order_events.51.title$" # todo: NEW TRANSLATION
 d009_iberian_order_events.51.desc: "Templársky rád bol zrušený, jeho bratia rozohnaní a jeho hrady v Maestrate zostali prázdne, bez zákonného držiteľa. [target_order.GetName] vznikol práve preto, aby tieto hrady neodišli z nášho [ROOT.GetCountry.GetFlavorRank].\n\n[GetCountry('KNI').GetName|U] nám napísali, aby nám pripomenuli, že koncil pridelil majetok templárov ich rádu všade v [ShowReligionAdjective('catholic')] svete. [GetCountry('KNI').GetNameWithNoTooltip|U] sídlia v [GetCountry('KNI').GetCapital.GetNameWithNoTooltip]. Hrady sa nachádzajú v oblasti [ShowAreaName('valencia_area')]." # todo: NEW TRANSLATION
 d009_iberian_order_events.51.a: "[target_order.GetNameWithNoTooltip] zdedí všetko." # todo: NEW TRANSLATION
 d009_iberian_order_events.51.a.entry: "Montesa zdedí všetko." # todo: NEW TRANSLATION
 d009_iberian_order_events.51.b: "Podeľme sa o to s [GetCountry('KNI').GetNameWithNoTooltip]." # todo: NEW TRANSLATION
 d009_iberian_order_events.51.b.entry: "Podeľme sa o to s $KNI$." # todo: NEW TRANSLATION
 d009_iberian_order_events.52.title: "Veľmajstrovstvo rádu [target_order.GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 d009_iberian_order_events.52.entry: "Veľmajstrovstvo Montesy" # todo: NEW TRANSLATION
 d009_iberian_order_events.52.desc: "[target_order.GetName] je posledný vojenský rád v našom [ROOT.GetCountry.GetFlavorRank], ktorý si stále volí vlastného veľmajstra. Veľmajstrovstvá [ShowCultureName('castilian')] prešli pred niekoľkými generáciami pod správu [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')] a [target_order.GetNameWithNoTooltip] pokračoval, akoby si to nikto nevšimol.\n\n[target_ruler.GetName] si to všimol. Požiadali sme o pápežskú bulu a tá príde; jedinou otázkou je, či prevezmeme veľmajstrovstvo hneď, alebo necháme bratov, aby si ešte raz zvolili veľmajstra." # todo: NEW TRANSLATION
 d009_iberian_order_events.52.a: "Veľmajstra vymenuje [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('crown_estate')]." # todo: NEW TRANSLATION
 d009_iberian_order_events.52.a.entry: "Veľmajstra vymenuje $crown_estate$." # todo: NEW TRANSLATION
 d009_iberian_order_events.52.b: "Dovoľme bratom ešte jednu voľbu." # todo: NEW TRANSLATION
 d009_iberian_order_events.53.title: "Barbarské pobrežie" # todo: NEW TRANSLATION
 d009_iberian_order_events.53.entry: "$d009_iberian_order_events.53.title$" # todo: NEW TRANSLATION
 d009_iberian_order_events.53.desc: "Galéry priplávajú v lete, odvliekajú rybárov z pláží medzi [ShowLocationName('peniscola')] a [ShowLocationName('valencia')] a zmiznú skôr, než za nimi stihneme vyslať čokoľvek. [target_order.GetName] stráži toto pobrežie a dediny začali adresovať svoje petície rádu namiesto nám, čo je samo osebe varovným signálom.\n\nVeľmajster chce veže: celý reťazec veží, obsadených počas celého leta a zaplatených niekým iným." # todo: NEW TRANSLATION
 d009_iberian_order_events.53.a: "Postavme veže a zaplaťme stráž." # todo: NEW TRANSLATION
 d009_iberian_order_events.53.b: "Nech si vystačia s tým, čo majú." # todo: NEW TRANSLATION
 d009_iberian_order_events.53.c: "O pobrežie sa musí postarať samo." # todo: NEW TRANSLATION
 d009_iberian_order_events.61.title: "Rády a [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('crown_estate')]" # todo: NEW TRANSLATION
 d009_iberian_order_events.61.entry: "Rády a $crown_estate$" # todo: NEW TRANSLATION
 d009_iberian_order_events.61.desc: "Vojenských rádov v [ROOT.GetCountry.GetAltAdjective('L')] sa nikdy nikto oficiálne nepýtal, na čo vlastne slúžia.\n\nVlastnia hrady, poberajú renty a poslúchajú veľmajstrov, ktorí poslúchajú pápeža. Dvesto rokov nikto neskúmal, aké je ich postavenie voči [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')]. [target_ruler.GetName] nie je vládcom ako [target_ruler.GetHerHis] predchodcovia a nechal si predložiť účtovné knihy." # todo: NEW TRANSLATION # todo: COUNTRY CASE
 d009_iberian_order_events.61.desc_council: "[ShowBureaucracyTypeName('spa_council_of_military_orders_bureaucracy')] zasadá už nejaký čas a jeho úradníci vypracovali niečo, čo za vlády žiadneho predchádzajúceho panovníka neexistovalo: úplný súpis majetku rádov.\n\nČíta sa to nepríjemne. Veľmajstri sú naši menovanci a hrady sa spravujú v našom mene, no renty stále plynú tam, kam plynuli vždy, a bratia stále považujú [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')] za patróna, nie za pána. Ukazuje sa, že správa nie je to isté ako poslušnosť." # todo: NEW TRANSLATION
 d009_iberian_order_events.61.a: "Potvrďme im všetko, čo vlastnia." # todo: NEW TRANSLATION
 d009_iberian_order_events.61.b: "Ich renty budú v prvom rade slúžiť nášmu [ROOT.GetCountry.GetFlavorRank]." # todo: NEW TRANSLATION
 d009_iberian_order_events.61.b.entry: "Ich renty budú v prvom rade slúžiť ríši." # todo: NEW TRANSLATION
 d009_iberian_order_events.63.title: "Správa rádov" # todo: NEW TRANSLATION
 d009_iberian_order_events.63.entry: "$d009_iberian_order_events.63.title$" # todo: NEW TRANSLATION
 d009_iberian_order_events.63.desc: "Všetko sa dialo potichu, jedno veľmajstrovstvo po druhom, každé s vlastnou bulou a vlastnými dôvodmi. Až teraz ich kancelária položila vedľa seba a uvedomila si, čo sa vlastne vybudovalo.\n\nVeľké rády nášho [ROOT.GetCountry.GetFlavorRank] vlastnia hrady na hraniciach, výnosy zo stoviek komend a najlepšiu ťažkú jazdu v [ShowReligionAdjective('catholic')] svete. Poslúchajú mužov, ktorých vymenoval [target_ruler.GetName]. [ROOT.GetCountry.GetName] nikdy predtým nedržalo v jednej ruke toľko meča [GetUniqueInternationalOrganization('catholic_church').GetName].\n\nZostáva rozhodnúť, či ide o inštitúciu, alebo iba o zvyk." # todo: NEW TRANSLATION
 d009_iberian_order_events.63.a: "Spravujme ich prostredníctvom jednej rady." # todo: NEW TRANSLATION
 d009_iberian_order_events.63.b: "Ponechajme každé veľmajstrovstvo v rodine." # todo: NEW TRANSLATION
 d009_order_recent_service_tt: "Bude si to 5 rokov pamätať ako $zeal_recent_service$, čím zvýši svoju cieľovú hodnotu [Concept('zeal','horlivosť')|e]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 d009_order_recent_pilgrimage_tt: "Bude si to 5 rokov pamätať ako $zeal_recent_pilgrimage$, čím zvýši svoju cieľovú hodnotu [Concept('zeal','horlivosť')|e]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 d009_orders_recent_service_all_tt: "Každý $iberian_military_order_type$ v našej krajine si to bude 5 rokov pamätať ako $zeal_recent_service$, čím zvýši svoju cieľovú hodnotu [Concept('zeal','horlivosť')|e]" # todo: NEW TRANSLATION # todo: CONCEPT CASE

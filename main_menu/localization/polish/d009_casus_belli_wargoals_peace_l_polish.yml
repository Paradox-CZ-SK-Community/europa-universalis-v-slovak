l_polish:
 cb_partition: "Rozdelenie" # todo: NEW TRANSLATION
 cb_partition_desc: "Naša nadvláda nad [ShowContinentName('europe')] je nespochybniteľná a prerastené ríše, ktoré sa nám vzpierajú, nemajú na krajiny, ktoré držia, nijaký nárok. Rozbijeme našich nepriateľov a obnovíme nároky všetkých utláčaných národov na ich vlastnú pôdu." # todo: NEW TRANSLATION
 cb_restore_ummayad_caliphate: "Obnovenie hraníc Umajjovského kalifátu" # todo: NEW TRANSLATION
 cb_restore_ummayad_caliphate_desc: "Umajjovci kedysi vládli celému al-'Andalusu z $cordoba.arabic_language$ — ich dvoru, ktorého veľkoleposť a učenosť im závidel celý svet. Táto sláva je dnes rozbitá a ich krajiny rozdelené medzi bezvýznamných emírov, ktorí si taký veľkolepý odkaz nezaslúžia. Zjednotíme veriacich pod jediným kalifom a nad $cordoba.arabic_language$ opäť vztýčime zástavu Umajjovcov." # todo: NEW TRANSLATION
 war_goal_restore_ummayad_caliphate: "$cb_restore_ummayad_caliphate$" # todo: NEW TRANSLATION
 war_goal_restore_ummayad_caliphate_desc: "[Concept('war_goal','Vojnový cieľ')|e] je znovu získať územia niekdajšieho kalifátu. Účastníci získajú viac [Concept('war_score','vojnové skóre')|e] za víťazstvá v bitkách. Získanie viac než $THRESHOLD|Y%$ [Concept('war_score','vojnové skóre')|e] z vyhraných bitiek nám prinesie postupné navyšovanie [Concept('war_score','vojnové skóre')|e]. V mierovej zmluve si môžeme nárokovať iba [Concept('locations','lokality')|e] ležiace v historických hraniciach Umajjovského kalifátu." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 RESTORE_UMMAYAD_CALIPHATE_WAR_NAME: "$NUM$$ORDER$. vojna za obnovenie Umajjovského kalifátu proti krajine $SECONDNAME$" # todo: NEW TRANSLATION
 cb_reconquer_iberia: "Znovudobytie $iberia_region$" # todo: NEW TRANSLATION
 cb_reconquer_iberia_desc: "Ríša, ktorá sa kedysi týčila nad oblasťou [ShowRegionName('iberia_region')], padla, jej moc je zlomená a jej krajiny sú zrelé na zabratie. Tí, ktorí stáli v koalícii proti nej, si teraz môžu polostrov rozdeliť a zmocniť sa toho, čo padlý kolos už nedokáže udržať, za nižšiu cenu." # todo: NEW TRANSLATION
 war_goal_reconquer_iberia: "$generic_war_goal_superiority$" # todo: NEW TRANSLATION
 war_goal_reconquer_iberia_desc: "$generic_war_goal_superiority_desc$" # todo: NEW TRANSLATION
 PARTITION_WAR_NAME: "$NUM$$ORDER$. rozdelenie krajiny $SECONDNAME$" # todo: NEW TRANSLATION
 war_goal_partition_superiority: "$generic_war_goal_superiority$" # todo: NEW TRANSLATION
 war_goal_partition_superiority_desc: "$generic_war_goal_superiority_desc$" # todo: NEW TRANSLATION
 peace_partition: "Rozdelenie" # todo: NEW TRANSLATION
 peace_partition_desc: "Porazeného nepriateľa rozčleníme a nezávislosť obnovíme každému národu, ktorý má na jeho území stále nárok." # todo: NEW TRANSLATION
 peace_partition_entry: "Rozdeliť krajinu [TARGET_COUNTRY.GetAltAdjectiveWithFlag('A')]" # todo: NEW TRANSLATION # todo: COUNTRY CASE
 peace_partition_entry_short: "Rozdeliť krajinu [TARGET_COUNTRY.GetAltAdjectiveWithFlagWithNoTooltip('A')]" # todo: NEW TRANSLATION # todo: COUNTRY CASE
 peace_partition_tt: "Oslobodiť každý národ, ktorý má na území porazenej krajiny svoje pôvodné provincie" # todo: NEW TRANSLATION
 cb_grand_alliance: "Veľká aliancia" # todo: NEW TRANSLATION
 cb_grand_alliance_desc: "Mocnosti sveta, v obave pred nekontrolovaným vzostupom jedinej ríše, sa spoja, aby ju pokorili a obnovili rovnováhu." # todo: NEW TRANSLATION
 war_goal_grand_alliance_superiority: "$generic_war_goal_superiority$" # todo: NEW TRANSLATION
 war_goal_grand_alliance_superiority_desc: "$generic_war_goal_superiority_desc$" # todo: NEW TRANSLATION
 GRAND_ALLIANCE_WAR_NAME: "Veľká aliancia proti krajine $SECONDNAME$" # todo: NEW TRANSLATION
 AI_CURB_DOMINANCE: "Nadvládu kolosu treba obmedziť" # todo: NEW TRANSLATION
 pt_curb_european_dominance: "Obmedziť európsku nadvládu" # todo: NEW TRANSLATION
 pt_curb_european_dominance_desc: "Prevaha, ktorú náš nepriateľ získal v oblasti [ShowContinentName('europe')], bude zlomená. Podľa podmienok tohto mieru bude ich nadvláda odstránená a rovnováha kontinentu obnovená." # todo: NEW TRANSLATION
 pt_curb_european_dominance_entry: "Obmedziť európsku nadvládu" # todo: NEW TRANSLATION
 pt_curb_european_dominance_entry_short: "Obmedziť európsku nadvládu" # todo: NEW TRANSLATION
 pt_curb_european_dominance_tt: "Zníži [Concept('gc_european_dominance','európska dominancia')|e] porazeného kolosu o #Y 25#!" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 pt_curb_colonial_dominance: "Obmedziť koloniálnu nadvládu" # todo: NEW TRANSLATION
 pt_curb_colonial_dominance_desc: "Bohatstvo, ktoré náš nepriateľ získal za oceánom, nehovoriac o jeho obrovskom dosahu, bude obmedzené. Podľa podmienok tohto mieru bude ich koloniálna nadvláda odstránená a ich moc nad Novým svetom oslabená." # todo: NEW TRANSLATION
 pt_curb_colonial_dominance_entry: "Obmedziť koloniálnu nadvládu" # todo: NEW TRANSLATION
 pt_curb_colonial_dominance_entry_short: "Obmedziť koloniálnu nadvládu" # todo: NEW TRANSLATION
 pt_curb_colonial_dominance_tt: "Zníži [Concept('gc_colonial_dominance','koloniálna dominancia')|e] porazeného kolosu o #Y 25#!" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 cb_free_the_mudejar: "Oslobodiť mudéjarov" # todo: NEW TRANSLATION
 cb_free_the_mudejar_desc: "Naši [ShowReligionAdjective('sunni')] bratia v oblasti [ShowRegionName('iberia_region')] sú nútení praktizovať #italic taqíju#!. Nesmieme dovoliť, aby [ShowReligionGroupAdjective('christian')] diabol naďalej utláčal náš ľud." # todo: NEW TRANSLATION
 cb_claim_throne_of_naples: "Nárokovať si trón krajiny $naples$" # todo: NEW TRANSLATION
 cb_claim_throne_of_naples_desc: "Nedovolíme, aby krajina $naples$ zostala rozdelená." # todo: NEW TRANSLATION
 claim_throne_of_naples: "Únia s krajinou [GetCountry('NAP').GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 claim_throne_of_naples_entry: "Nárokovať si trón krajiny [GetCountry('NAP').GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 claim_throne_of_naples_entry_short: "$claim_throne_of_naples_entry$" # todo: NEW TRANSLATION
 claim_throne_of_naples_desc: "Naša kontrola nad časťou územia [GetCountry('NAP').GetLongName] nám poskytuje dostatočné dôvody na vyhlásenie vojny a zabratie zvyšku." # todo: NEW TRANSLATION
 war_goal_take_province_free_the_mudejar: "$generic_war_goal_take_province$" # todo: NEW TRANSLATION
 war_goal_take_province_free_the_mudejar_desc: "$generic_war_goal_take_province_desc$" # todo: NEW TRANSLATION
 cb_demand_andalusi_submission: "Požadovať podrobenie krajiny [GetCountry('GRA').GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 cb_demand_andalusi_submission_desc: "Vládcovia krajiny [GetCountry('GRA').GetName] si kúpili nezávislosť tým, že nás poštvali proti nášmu sokovi, a na túto dohodu si zvykli. Ich armády sa nám už nevyrovnajú. Nech uznajú, kto vládne nad [ShowLocationName('strait_of_gibraltar')], a zaplatia za mier, ktorý si užívajú." # todo: NEW TRANSLATION
 war_goal_demand_andalusi_submission: "$generic_war_goal_superiority$" # todo: NEW TRANSLATION
 war_goal_demand_andalusi_submission_desc: "$generic_war_goal_superiority_desc$\n\nV mierovej zmluve stojí zabratie [Concept('locations','lokality')|e] #R dvakrát#! viac [Concept('war_score','vojnové skóre')|e] než zvyčajne, zatiaľ čo donútenie krajiny [GetCountry('GRA').GetName] k podrobeniu stojí iba #G štvrtinu#! tejto ceny. Táto vojna sa vedie s cieľom dostať ich vládcov pod našu moc, nie rozdeliť si ich krajiny." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 DEMAND_ANDALUSI_SUBMISSION_WAR_NAME: "$NUM$$ORDER$. vojna za podrobenie krajiny $SECONDNAME$" # todo: NEW TRANSLATION
 peace_andalusi_submission: "Vynútiť podrobenie krajiny [GetCountry('GRA').GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 peace_andalusi_submission_desc: "Vládcovia krajiny [GetCountry('GRA').GetName] sa vzdajú nezávislosti a zaujmú miesto pod našou zástavou. Stanú sa našou [ShowSubjectTypeName('taifa')], ak vyznávajú rovnakú vieru ako my, a naším [ShowSubjectTypeName('tributary')], ak nie." # todo: NEW TRANSLATION
 peace_andalusi_submission_entry: "$peace_andalusi_submission$" # todo: NEW TRANSLATION
 peace_andalusi_submission_entry_short: "$peace_andalusi_submission$" # todo: NEW TRANSLATION

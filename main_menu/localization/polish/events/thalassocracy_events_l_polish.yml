 thalassocracy_events.1.title: "Plody našej práce" # todo: NEW TRANSLATION
 thalassocracy_events.1.desc_success: "Rýchle rozšírenie nášho námorníctva bolo ohromujúcim úspechom! Množstvo nových a modernizovaných lodí s posádkami skúsených námorníkov iste naháňa strach našim súperom a nepriateľom. Zlí piráti ani flotily pod nepriateľskými zástavami už nebudú brániť našej nadvláde nad vlnami. Keďže naše námorné trasy sú zabezpečené, bude pre nás oveľa jednoduchšie spravovať vzdialené pobrežia a šíriť svoju moc naprieč morami." # todo: NEW TRANSLATION
 thalassocracy_events.1.desc_failure: "Po rokoch náročných debát o financovaní nášho námorníctva sa teraz budeme musieť vzdať svojich snov o vládnutí prostredníctvom morí. Bez silného námorníctva, ktoré by podporilo naše nároky na talasokraciu, nedokážeme brániť svoje vody pred súpermi ani korzármi." # todo: NEW TRANSLATION
 thalassocracy_events.1.a: "Naša námorná ríša bude prekvitať!" # todo: NEW TRANSLATION

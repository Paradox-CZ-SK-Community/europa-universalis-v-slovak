l_polish:
 d009_late_minorities.1.title: "Sabbatejské mesiášske hnutie" # todo: NEW TRANSLATION
 d009_late_minorities.1.entry: "$d009_late_minorities.1.title$" # todo: NEW TRANSLATION
 d009_late_minorities.1.desc: "Mystik menom [target_character.GetName] sa v [ShowLocationName('smyrna')] vyhlásil [target_character.GetHerselfHimself] za dlho očakávaného Mesiáša a táto správa rozdúchala medzi našimi [ShowReligionAdjective('judaism')] poddanými také nadšenie, aké nedokáže utlmiť ani opatrnosť rabínov. Celé [ShowCultureName('sephardi')] zbory opúšťajú svoje remeslá a pripravujú sa na návrat na Sion, ktorý naši úradníci nevedia ani potvrdiť, ani vyvrátiť. Zatiaľ nie je jasné, či ide o sezónnu horúčku, alebo či toto hnutie natrvalo pretvorí komunitu, a náš [ROOT.GetCountry.GetGovernment.GetCourtTitle] sa nevie zhodnúť, či je vôbec na nás zasahovať." # todo: NEW TRANSLATION
 d009_late_minorities.1.a: "Nechajme hnutie voľne sa rozvíjať." # todo: NEW TRANSLATION
 d009_late_minorities.1.b: "Potlačme toto nadšenie." # todo: NEW TRANSLATION
 d009_late_minorities.1.b.tt: "Naši [ShowReligionAdjectiveWithNoTooltip('judaism')] poddaní začínajú pre zásah zatrpknúť" # todo: NEW TRANSLATION
 d009_late_minorities.1.historical_info: "Sabbatai Zevi, narodený v Smyrne v roku 1626, sa v roku 1665 vyhlásil za židovského Mesiáša, čím vyvolal vlnu mesiášskeho nadšenia, ktorá zachvátila židovské komunity od Amsterdamu po Jemen vrátane veľkej časti sefardskej diaspóry. Osmanské úrady ho napokon v roku 1666 zatkli a dali mu na výber medzi konverziou na islam a popravou." # todo: NEW TRANSLATION
 variable_d009_sabbatean_movement_allowed_tt: "Sabbatejské hnutie sa smelo šíriť a Sabbatai Zevi je stále nažive" # todo: NEW TRANSLATION
 d009_late_minorities.2.title: "Sabbataiho odpadlíctvo" # todo: NEW TRANSLATION
 d009_late_minorities.2.entry: "$d009_late_minorities.2.title$" # todo: NEW TRANSLATION
 d009_late_minorities.2.desc: "Náš [ROOT.GetCountry.GetGovernment.GetCourtTitle] sa dozvedel, že [target_character.GetName], ktorý je v zajatí [ROOT.GetCountry.GetGovernment.GetRulerTitle], konvertoval na [ShowReligionGroupName('muslim')], aby unikol poprave. V očiach [target_character.GetHerHis] najhorlivejších nasledovníkov ide o zradu, hoci malá skupina trvá na tom, že [target_character.GetHerHis] vonkajšia konverzia zakrýva pravdu, ktorú dokážu vnímať len veriaci. Zvyšky hnutia sa teraz štiepia medzi zúfalstvo, tiché odpadlíctvo a tvrdohlavú vieru, že cesta Mesiáša bola jednoducho zložitejšia, než si ktokoľvek spočiatku myslel." # todo: NEW TRANSLATION
 d009_late_minorities.2.a: "Prinúťme veriacich, aby nasledovali [target_character.GetHerHis] príklad." # todo: NEW TRANSLATION
 d009_late_minorities.2.a.entry: "Prinúťme veriacich, aby nasledovali príklad Sabbataia Zeviho." # todo: NEW TRANSLATION
 d009_late_minorities.2.a.tt: "Našich zbožných [ShowReligionAdjective('judaism')] poddaných znepokojujú vynútené konverzie" # todo: NEW TRANSLATION
 d009_late_minorities.2.b: "Nechajme hnutie potichu rozplynúť." # todo: NEW TRANSLATION
 d009_late_minorities.2.historical_info: "Osmanské úrady, ktoré zatkli Sabbataia Zeviho, mu dali na výber medzi popravou a konverziou na islam. V roku 1666 si vybral druhú možnosť a prijal meno Mehmed Efendi. Malá skupina nasledovníkov v Solúne a inde navonok nasledovala jeho príklad, pričom tajne naďalej praktizovala synkretickú podobu židovských obradov. Známi sa stali ako Dönme. Väčšina veriacich zo širšieho hnutia sa však jednoducho vrátila k bežnému židovskému životu, rozčarovaná, no bez konverzie." # todo: NEW TRANSLATION
 d009_late_minorities.3.title: "#italic Haskala#!, [ShowReligionAdjectiveWithNoTooltip('judaism')] osvietenstvo" # todo: NEW TRANSLATION
 d009_late_minorities.3.entry: "$d009_late_minorities.3.title$" # todo: NEW TRANSLATION
 d009_late_minorities.3.desc: "Do [ShowLocationName('amsterdam')] dorazili správy o novom hnutí, ktoré sa šíri medzi [ShowReligionAdjective('judaism')] komunitami v nemeckých krajinách a vyzýva Židov, aby odložili izoláciu geta a osvojili si jazyk, odev i vzdelanosť širšieho sveta, ktorý ich obklopuje. Naši [ShowReligionAdjectiveWithNoTooltip('judaism')] obchodníci a učenci diskutujú, či by takáto otvorenosť túto komunitu obohatila, alebo by ju len úplne rozpustila v okolitej [ShowReligionGroupAdjective('christian')] populácii." # todo: NEW TRANSLATION
 d009_late_minorities.3.a: "Podporujme svetské vzdelávanie a občiansku integráciu." # todo: NEW TRANSLATION
 d009_late_minorities.3.b: "Zachovajme tradičné hranice komunity." # todo: NEW TRANSLATION
 d009_late_minorities.3.historical_info: "Filozofické spisy Mosesa Mendelssohna v Berlíne od 70. rokov 18. storočia podnietili vznik hnutia #italic Haskala#!, čiže židovského osvietenstva, ktoré povzbudzovalo židovské komunity po celej Európe, aby sa popri náboženskom štúdiu venovali aj svetskej filozofii, literatúre a občianskemu životu. Amsterdamské sefardské a aškenázske komunity patrili medzi prvé mimo nemeckých krajín, ktoré o jeho myšlienkach vážne diskutovali, keďže mesto už vtedy malo na židovské intelektuálne prostredie nezvyčajne otvorený pohľad." # todo: NEW TRANSLATION
 d009_late_minorities.4.title: "Napoleonov #italic Sanhedrin#!" # todo: NEW TRANSLATION
 d009_late_minorities.4.entry: "$d009_late_minorities.4.title$" # todo: NEW TRANSLATION
 d009_late_minorities.4.desc: "[target_character.GetName] zvolal rabínov a významných laikov z celého [ROOT.GetCountry.GetAltAdjective('G')] aj zo zahraničia na Veľký #italic Sanhedrin#!, ktorý má raz a navždy rozhodnúť, či možno [ShowReligionAdjective('judaism')] právo zladiť s povinnosťami občana tejto republiky. Náš [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')] vidí príležitosť konečne naplno začleniť tieto komunity do občianskeho života, zatiaľ čo náš [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] v tom vidí štát, ktorý zasahuje do záležitostí, do ktorých mu nič nie je." # todo: NEW TRANSLATION # todo: COUNTRY CASE
 d009_late_minorities.4.a: "Zaručme úplné občianske oslobodenie." # todo: NEW TRANSLATION
 d009_late_minorities.4.b: "Zachovajme staré obmedzenia." # todo: NEW TRANSLATION
 d009_late_minorities.4.historical_info: "Napoleon zvolal v roku 1806 Zhromaždenie židovských významných osobností a v roku 1807 Veľký #italic Sanhedrin#!, aby rozhodli, či je židovské právo zlučiteľné s francúzskym občianstvom. Napokon dospeli k záveru, že áno, pokiaľ židovské komunity uznajú právomoc štátu v občianskych záležitostiach, ako sú manželstvo a požičiavanie peňazí. Toto rozhodnutie znamenalo významný krok k právnemu oslobodeniu Židov v celej napoleonskej Európe, hoci úplná rovnosť zostávala v praxi sporná a neúplná ešte celé desaťročia." # todo: NEW TRANSLATION
 variable_our_napoleon_tt: "Objavil sa dobyvateľský generál podobný Napoleonovi" # todo: NEW TRANSLATION
 variable_d009_jewish_emancipation_tt: "Židia [GetCountry('FRA').GetCulture.GetAdjective] získali právne oslobodenie" # todo: NEW TRANSLATION
 d009_late_minorities.5.title: "[GetCountry('MOR').GetAdjectiveWithNoTooltip] [GetCountry('MOR').Custom('GetRulerOrRegentTitle')] a oslobodení Židia" # todo: NEW TRANSLATION
 d009_late_minorities.5.entry: "$d009_late_minorities.5.title$" # todo: NEW TRANSLATION
 d009_late_minorities.5.desc: "Správy od [ROOT.GetCountry.GetAdjective] obchodníkov vracajúcich sa z [GetCountry('FRA').GetName] opisujú nový poriadok, ktorý tam nastupuje: s [ShowReligionAdjective('judaism')] poddanými sa pred zákonom zaobchádza rovnako ako s ktorýmkoľvek iným občanom. Správa sa dostala aj na dvor [ROOT.GetCountry.GetGovernment.GetRulerTitle], [ROOT.GetCountry.GetGovernment.GetCourtTitle], a nejednému z našich ministrov napadlo, či by podobné zaobchádzanie mal očakávať aj mellah v [ROOT.GetCountry.GetFlavorRank], alebo či takéto myšlienky patria do Európy a nikam inam." # todo: NEW TRANSLATION
 d009_late_minorities.5.a: "Uznajme ich rovnoprávne postavenie." # todo: NEW TRANSLATION
 d009_late_minorities.5.b: "Zachovajme staré obmedzenia pre dhimmi." # todo: NEW TRANSLATION
 d009_late_minorities.5.historical_info: "Správy o oslobodení francúzskych Židov sa po roku 1807 dostali do Maroka prostredníctvom európskych diplomatických a obchodných kanálov. Na marockom dvore následne prebehli nerozhodné diskusie o právnom postavení vlastných židovských poddaných. V tomto období však k žiadnej formálnej zmene nedošlo a tradičný systém dhimmi, ktorým sa riadili marocké židovské komunity, zostal v zásade nedotknutý až do čias francúzskeho protektorátu v 20. storočí." # todo: NEW TRANSLATION
 d009_late_minorities.6.title: "Spomienka na al-'Andalus" # todo: NEW TRANSLATION
 d009_late_minorities.6.entry: "$d009_late_minorities.6.title$" # todo: NEW TRANSLATION
 d009_late_minorities.6.desc: "Medzi vyhnaneckými komunitami z [ShowRegionName('iberia_region')], ktoré sa usadili v našej ríši, stále kolujú verše a piesne pripomínajúce al-'Andalus, raj, ktorý ich predkovia kedysi nazývali domovom a ktorý stratili. Znejú na [ROOT.GetCountry.GetGovernment.GetCourtTitle] aj pri súkromných stretnutiach a dnes ich udržiava pri živote skôr poézia než živá pamäť. Niektorí z nás by chceli túto spomienku podporiť ako dôkaz pohostinnosti našej ríše; iní by radšej nechali staré krivdy voči [ShowRegionNameWithNoTooltip('iberia_region')] pokojne upadnúť do zabudnutia, skôr než prerastú do niečoho ostrejšieho." # todo: NEW TRANSLATION
 d009_late_minorities.6.a: "Zadajme dielo oslavujúce toto dedičstvo." # todo: NEW TRANSLATION
 d009_late_minorities.6.b: "Považujme to za neškodnú nostalgiu." # todo: NEW TRANSLATION
 d009_late_minorities.6.historical_info: "Predstava al-'Andalus ako strateného raja hlboko zakorenila v pamäti sefardských aj andalúzskych moslimov v celom Maghrebe. Dlho po tom, čo zhasla každá reálna nádej na návrat, ju romantizovali v poézii, hudbe a neskôr aj v architektúre. V 18. a 19. storočí sa táto nostalgia stala samostatnou literárnou a umeleckou tradíciou, rovnako ako skutočnou politickou spomienkou; neskôr sa na ňu odvolávali veľmi odlišné hnutia s veľmi odlišnými cieľmi." # todo: NEW TRANSLATION

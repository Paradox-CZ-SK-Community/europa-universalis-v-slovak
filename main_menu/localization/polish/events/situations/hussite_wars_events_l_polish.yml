 demand_clergy_donations_hw_action_desc: "$demand_donation_key$ duchovenstva." # todo: NEW TRANSLATION
 demand_burgher_donations_hw_action: "Požiadať meštianstvo o dary" # todo: NEW TRANSLATION
 demand_burgher_donations_hw_action_desc: "$demand_donation_key$ meštianstva." # todo: NEW TRANSLATION
 prepare_defenses_hw_action: "Pripraviť obranu" # todo: NEW TRANSLATION
 prepare_defenses_hw_action_desc: "Hordy [ShowReligionName('catholic')] čoskoro prebehnú našimi územiami vo svojom šialenom úsilí o náboženskú nadvládu. Bolo by múdre zabezpečiť, aby každá provincia bola chránená pevnými opevneniami." # todo: NEW TRANSLATION
 align_with_moderates_help_hw_action: "Spojiť sa s umiernenými" # todo: NEW TRANSLATION
 align_with_moderates_help_hw_action_desc: "Cesta diplomacie a tolerancie určite pritiahne súcitnejší pohľad na našu vec, dokonca aj od krajín, ktoré sa klaňajú [ShowReligionName('catholic')]." # todo: NEW TRANSLATION
 align_with_radicals_help_hw_action: "Spojiť sa s radikálmi" # todo: NEW TRANSLATION
 align_with_radicals_help_hw_action_desc: "Sme sami proti moru heretikov, ich čeľuste hlodajú hladne na okrajoch nášho územia. Ľudia sa musia pripraviť a prijať politiku nulovej tolerancie a horlivosti voči našim nepriateľom." # todo: NEW TRANSLATION
 join_the_imperial_side_hw_action: "Pridajte sa na stranu [GetUniqueInternationalOrganization('hre').GetLeaderCountry.GetLongNameWithNoTooltip]" # todo: NEW TRANSLATION
 join_the_imperial_side_hw_action_desc: "Našou povinnosťou je pridať sa k [GetUniqueInternationalOrganization('hre').GetLeaderCountry.GetLongName] v ich boji vyhladiť kacírstvo z povrchu [ShowContinentName('europe')]!" # todo: NEW TRANSLATION
 join_the_hussite_side_hw_action: "Postaviť sa na stranu [GetCountry('BOH').GetLongNameWithNoTooltip]" # todo: NEW TRANSLATION
 join_the_hussite_side_hw_action_desc: "Nemali by sme nečinne stáť, kým [GetUniqueInternationalOrganization('hre').GetLeaderCountry.GetLongName] páchajú hrozné krutosti na menej šťastných. Musíme preto brániť [GetCountry('BOH').GetLongName] a zastaviť nerozumné [GetUniqueInternationalOrganization('hre').GetLeaderCountry.GetAdjectiveWithNoTooltip] križiacke výpravy!" # todo: CHANGED
 hw_province_gains_hw_heretic_conversions_modifier_tt: "Určená [Concept('province','provincia')|e] získa [ShowModifier('hw_heretic_conversions_modifier')] na #Y 10#! rokov" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 prepare_defenses_hw_action_tt: "Každé [Concept('location','lokalita')|e] v určenej [Concept('province','provincii')|e] získa [ShowModifier('hw_prepared_defenses_modifier')] na #Y 15#! rokov a ak je to možné, v [Concept('province_capital','hlavnom meste provincie')|e] bude postavený [ShowBuildingTypeName('castle')] za #G -90%#! z počiatočnej ceny" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 countries_less_likely_to_join_against_us_tt: "Naši susední [Concept('countries','krajiny')|e] budú #G menej pravdepodobní#!, že sa pripoja k vojne proti nám, pokiaľ bude aktívny [ShowModifier('promoted_moderates_modifier')]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 countries_more_likely_to_join_against_us_tt: "Naši susední [Concept('countries','krajiny')|e] budú #R viac pravdepodobní#!, že sa pripoja k vojne proti nám, pokiaľ bude aktívny [ShowModifier('promoted_radicals_modifier')]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 catholic_victory_tt: "[ShowReligionAdjectiveWithNoTooltip('catholic')] víťazstvo" # todo: NEW TRANSLATION
 hussite_victory_tt: "[ShowReligionAdjectiveWithNoTooltip('hussite')] víťazstvo" # todo: NEW TRANSLATION
 reignite_the_fires_of_crusade_tt: "Vztahy medzi [GetCountry('BOH').GetLongNameWithNoTooltip] a [ShowReligionAdjectiveWithNoTooltip('catholic')] [Concept('countries','krajinou')|e] sa zhoršia a mnohí sa k nám časom môžu pridať." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 income_depends_on_estate_power_tt: "Získané [Concept('gold','dukáty')|e] bude do veľkej miery závisieť od [Concept('estate_power','sily stavu')|e] tohto [Concept('estate','stavu')|e]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 join_current_war_against_emperor_tt: "Pridáme sa k prebiehajúcej [Concept('war','vojne')|e] [GetCountry('BOH').GetLongName] proti [GetUniqueInternationalOrganization('hre').GetLeaderCountry.GetLongName]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 join_current_war_against_bohemia_tt: "Pridáme sa k prebiehajúcej [Concept('war','vojne')|e] [GetUniqueInternationalOrganization('hre').GetLeaderCountry.GetLongName] proti [GetCountry('BOH').GetLongName]" # todo: CHANGED # todo: CONCEPT CASE
 hussite_wars.1.desc.generic: "Rozhnevané davy vedené [jan_zelivsky_scope.GetName] zaplavili ulice [target_boh_capital_scope.GetName], žiadajúc rozšírenie práv a oslobodenie niekoľkých [ShowReligionAdjective('hussite')] väzňov radou mesta." # todo: NEW TRANSLATION
 hussite_wars.1.desc: "$hussite_wars.1.desc.generic$ Bohužiaľ, sudca a jeho sprievod odmietli požiadavky protestujúcich, čo vyústilo do vypuknutia násilia v začarovanom kruhu, kde reformy stagnujú a narastajú davové povstania. Možno je načase, aby sme tento cyklus prerušili..." # todo: CHANGED
 hussite_wars.1.desc.other_heresy: "$hussite_wars.1.desc.generic$ Rada, ktorá je prevažne [ROOT.GetCountry.GetReligion.GetAdjective], je viac než sympatická voči svojim [ShowReligionAdjectiveWithNoTooltip('hussite')] bratom, ale [ShowReligionAdjective('catholic')] agenti sa snažia podkopať a sabotovať ich snahy. Nezáleží na tom, či sa rozhodneme zostať verní našej viere alebo podporiť [ShowReligionNameWithNoTooltip('hussite')], isté je jedno: [ShowReligionAdjectiveWithNoTooltip('catholic')] svet nás vníma ako heretickú hrozbu, ktorú treba zničiť..." # todo: NEW TRANSLATION
 hussite_wars.1.a: "Smrť [GetUniqueInternationalOrganization('catholic_church').GetLeaderTitle]!" # todo: NEW TRANSLATION
 hussite_wars.1.b: "Nemôžeme si dovoliť oddeliť sa od [ShowReligionNameWithNoTooltip('catholic')]..." # todo: NEW TRANSLATION
 end_hussite_wars_situation_tt: "Situácia [ShowSituationName('hussite_wars')] nenastane, pokiaľ sa neobrátime na [ShowReligionName('hussite')]" # todo: CHANGED
 boh_every_neighboring_country_tt: "Každá [Concept('country','krajina')|e], ktorá s nami nie je v aliancii a susedí s nami alebo s ktorýmkoľvek z našich [Concept('subjects','vazalov')|e], stratí [ShowBiasValue('violated_congress_of_visegrad_modifier')|+=0] [Concept('opinion','názor')|e] voči nám" # todo: CHANGED # todo: CONCEPT CASE
 hussite_rebellion_tooltip: "Každý [Concept('pop','populácia')|e], ktorý nasleduje [ShowReligionName('hussite')], zhromaždí svoju silu a podporí [hussite_rebel_scope.GetName]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 every_neighbor_of_bohemia_gets_hussite_wars.3_tt: "Udalosť '#Y Zbožné vyzvanie k zbraniam#!' sa stane pre každú [ShowReligionAdjective('catholic')] susednú krajinu, ktorá nie je spojencom [target_country.GetName]" # todo: NEW TRANSLATION
 hussite_wars.6_happens_for_catholic_champion_scope_tt: "Udalosť '#Y Meč [ShowReligionName('catholic')]#!' sa stane pre [catholic_champion_scope.GetName]" # todo: NEW TRANSLATION
 hussite_wars.3.title: "Zbožné vyzvanie k zbraniam" # todo: NEW TRANSLATION
 hussite_wars.3.desc: "V snahe vyhubiť kacírstvo vzal [GetUniqueInternationalOrganization('hre').GetLeaderTitle] do rúk zbrane proti ľudu [target_country.GetName], so súhlasom [ShowReligionName('catholic')]. [war_leader_scope.GetGovernment.GetRulerOrRegent.GetSheHe|U] požaduje, aby sme vykonali našu [ShowReligionAdjective('catholic')] povinnosť a chopili sa zbraní proti tomuto ohavnému kacírstvu. Čokoľvek sa rozhodneme, musíme byť opatrní, aby sme si nevytvorili mocných nepriateľov pri márnom pátraní po pobožnej sláve." # todo: CHANGED
 hussite_wars.3.a: "Do zbraní!" # todo: NEW TRANSLATION
 hussite_wars.3.b: "Neponáhľajme sa do akcie." # todo: NEW TRANSLATION
 hussite_wars.4.title.hussite_victory: "[ShowReligionAdjectiveWithNoTooltip('hussite')] Víťazstvo v [ShowSituationNameWithNoTooltip('hussite_wars')]" # todo: NEW TRANSLATION
 hussite_wars.4.title.catholic_victory: "[ShowReligionAdjectiveWithNoTooltip('catholic')] Víťazstvo v [ShowSituationNameWithNoTooltip('hussite_wars')]" # todo: NEW TRANSLATION
 hussite_wars.4.a.desc: "Náš boj o rovnaké zaobchádzanie a uznanie od [ShowReligionAdjective('catholic')] autorít sa zúročil. Obrana nášho ľudu a viery bola úspešná a teraz si nárokujeme miesto za európskym stolom ako rovnocenní." # todo: NEW TRANSLATION
 hussite_wars.4.b.desc: "Chuť porážky nám zostáva horká na jazyku, keď sme boli nútení uznať nadradenú autoritu [ShowReligionAdjective('catholic')] Cirkvi. Mali sme sen, ktorý sme považovali za spravodlivý, ale pred tvárou korupcie a zla sme zlyhali — žiaľ, nebolo to nám súdené..." # todo: NEW TRANSLATION
 hussite_wars.4.c.desc: "Naša križiacka výprava proti kacírstvu bola korunovaná božským úspechom. Plamene [ShowReligionName('hussite')] boli uhasené v [GetCountry('BOH').GetName] a spravodlivá autorita [ShowReligionName('catholic')] bola obnovená naprieč vernými krajinami. Nech svet vidí, že rozhodnosť Cirkvi je nezlomná." # todo: CHANGED
 hussite_wars.4.d.desc: "Napriek spravodlivosti našej veci zvíťazili nasledovníci [ShowReligionName('hussite')] v [target_capital.GetNameWithNoTooltip]. [GetCountry('BOH').GetName] z tohto konfliktu vystupuje posilnená, ich kacírska viera je uznaná všetkými. Musíme prijať tento horký mier a hľadať inú cestu, ako obnoviť jednotu [ShowReligionName('catholic')]." # todo: CHANGED
 hussite_wars.4.e.desc: "Tieň porážky padá na našu [ShowReligionAdjectiveWithNoTooltip('hussite')] vec. Napriek tomu, že sme stáli po boku našich bratov v [GetCountry('BOH').GetName], sily [ShowReligionName('catholic')] zvíťazili a starý poriadok bol obnovený. Napriek tomu naša viera pretrváva a myšlienky, za ktoré sme bojovali, nemožno tak ľahko umlčať." # todo: CHANGED
 hussite_wars.4.g.desc: "Plamene hnutia [ShowReligionName('hussite')] sa nakoniec zmenili na iné reformované vyznanie. Boj, ktorý sa začal kvôli kalichu, priviedol [GetCountry('BOH').GetName] na cestu, ktorú nikto nepredvídal, a [ShowSituationNameWithNoTooltip('hussite_wars')] sa teraz blížia k svojmu záveru." # todo: NEW TRANSLATION
 hussite_wars.4.a: "Naša pravá viera je víťazná!" # todo: NEW TRANSLATION
 hussite_wars.4.b: "Všetko je dovolené, v viere i vo vojne..." # todo: NEW TRANSLATION
 hussite_wars.4.c: "Cirkev zvíťazila!" # todo: NEW TRANSLATION
 hussite_wars.4.d: "Herezia pretrváva..." # todo: NEW TRANSLATION
 hussite_wars.4.e: "Naša viera pretrváva aj v porážke." # todo: NEW TRANSLATION
 hussite_wars.4.f: "Spoločne za víťazstvo!" # todo: NEW TRANSLATION
 hussite_wars.4.g: "Tak končí táto kapitola." # todo: NEW TRANSLATION
 hussite_wars.5.title: "Jednoočný [target_character.GetLastNameWithNoTooltip]" # todo: NEW TRANSLATION
 hussite_wars.5.entry: "Jednoočný Žižka" # todo: NEW TRANSLATION
 hussite_wars.5.desc: "Jeden z našich najvýznamnejších vodcov na bojisku, [target_character.GetName], má dlhú históriu služby nášmu ľudu v týchto skúšobných časoch. V tábore sa hovorí, že [target_character.GetHerHim] prišiel o oko následkom šípu protivníckeho vojaka. Podľa očitých svedkov, namiesto ústupu alebo kapitulácie, [target_character.GetSheHe] šíp jednoducho vybral a pokračoval v boji.\n\nNapriek zraneniam sa [target_character.GetSheHe] stal obávaným veliteľom a teraz si praje povýšenie a viesť viac vojska k veľkým víťazstvám. Ak chceme zasadiť našim nepriateľom hrozný úder, mali by sme vážne zvážiť vyhlásenie [target_character.GetHerHim] za národného hrdinu, emblém nášho odporu proti [ShowReligionName('catholic')]." # todo: NEW TRANSLATION
 hussite_wars.5.a: "Veľký hrdina v našej hodine potreby." # todo: NEW TRANSLATION
 hussite_wars.5.historical_info: "Tiež známy ako Jan Žižka z Trocnova a Kalicha, bol významný vojenský vodca v 15. storočí, oslavovaný ako jedna z najvýznamnejších postáv husitského hnutia. Viedol husitov k mnohým víťazstvám použitím inovatívnych vojenských taktik, vrátane použitia bojových vozov pre mobilnú obranu. Jeho strategické génius a charizmatické vedenie boli kľúčové pre ich úspechy proti viacerým križiackym výpravám vyhláseným Katolíckou cirkvou." # todo: NEW TRANSLATION
 hussite_wars.6.title: "Meč [ShowReligionNameWithNoTooltip('catholic')]" # todo: NEW TRANSLATION
 hussite_wars.6.desc: "V ťažkých časoch, keď je naša viera ohrozená vonkajšími kacírmi, spočíva na našich pleciach bremeno viesť obnovenú križiacku výpravu proti tým, ktorí chcú ublížiť našim zbožným ľuďom.\n\nPreto nás [GetUniqueInternationalOrganization('hre').GetLeaderTitle] — požehnaný autoritou [ShowReligionName('catholic')] — vyzval, aby sme sa pripojili k [target_ruler1.GetHerHim] v križiackej výprave proti [GetCountry('BOH').GetLongName]." # todo: CHANGED
 hussite_wars.6.a: "Zničíme týchto heretikov!" # todo: NEW TRANSLATION
 hussite_wars.6.b: "Nie sme služobníkmi [GetUniqueInternationalOrganization('hre').GetLeaderTitle]!" # todo: CHANGED
 hussite_wars.7.title: "Útrapy [ShowReligionAdjectiveWithNoTooltip('hussite')] veriacich" # todo: NEW TRANSLATION
 hussite_wars.7.desc: "Zbitý posol prišiel do nášho dvora. Priniesol správu o križiackej výprave [GetUniqueInternationalOrganization('hre').GetLeaderTitle] proti [GetCountry('BOH').GetName], podporenej autoritou [ShowReligionName('catholic')]. Príbehy o brutalite, vypálenej zemi a neúnavnom boji zaplavili ulice, keď sa vojaci i roľníci bijú jeden proti druhému.\n\nPosol ospevuje puto, ktoré naše dva národy spája — puto bratstva — a žiada, aby sme prišli na pomoc jeho zkrvavenému ľudu. [GetCountry('BOH').GetNameWithNoTooltip] žiada o pomoc!" # todo: CHANGED
 hussite_wars.7.a: "A [GetCountry('POL').GetNameWithNoTooltip] odpovie. Zmobilizujte jazdcov!" # todo: NEW TRANSLATION
 hussite_wars.7.b: "To nie je múdre..." # todo: NEW TRANSLATION
 teutons_hussite_wars_tt: "Udalosť '#Y Zbožné vyzvanie k zbraniam#!' sa stane pre [GetCountry('TEU').GetLongName]" # todo: NEW TRANSLATION
 hussite_wars.8.title: "Spoločný nepriateľ" # todo: NEW TRANSLATION
 hussite_wars.8.desc: "Naši krajania sú v zúfalstve. Keď heretické armády búrajú naše brány, mnohé staré horké rivality medzi významnými osobami boli odložené bokom, keď sa zjednocujeme proti chamtivosti a krátkozrakosti našich nepriateľov. Sila našej vôle a zbožnosti zabezpečí, že prekonáme túto zradnú prekážku, porazíme tých, ktorí chcú ublížiť našim ľuďom a našej viere, pričom vyjdeme víťazne a znovu nadobudneme našu starú slávu a zaslúžený rešpekt." # todo: NEW TRANSLATION
 hussite_wars.8.a: "Bojujte ďalej, synovia a dcéry [GetCountry('BOH').GetNameWithNoTooltip]!" # todo: NEW TRANSLATION
 boh_clergy_donation_tt: "Tento dar od [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] má za cieľ pozdvihnúť morálku nášho ľudu" # todo: NEW TRANSLATION
 hussite_wars.8.b: "Zintenzívnime šírenie našich učení proti [ShowReligionNameWithNoTooltip('catholic')]." # todo: NEW TRANSLATION
 hussite_wars.8.c: "Obráťme sa na [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')] v týchto ťažkých časoch..." # todo: NEW TRANSLATION
 hussite_wars.9.title: "Obnovená krížová výprava proti [ShowReligionNameWithNoTooltip('hussite')]" # todo: NEW TRANSLATION
 hussite_wars.9.desc: "Mor známy ako [ShowReligionName('hussite')] je urážkou nášho váženého a zbožného sveta, nebezpečná skaza ohrozujúca jednotu viery a božského poriadku. Ich heretické učenia siaju rozkoly a znesväcujú sväté doktríny, ktoré [ShowReligionName('catholic')] po generácie zachovával. Takéto vzdorovanie nemožno tolerovať. Je našou posvätnou povinnosťou zhromaždiť armády [ShowReligionNameWithNoTooltip('catholic')] bez odkladu, vyraziť s neochvejnou pevnosťou, aby sme vyhubili túto herézu skôr, než sa ďalej rozšíri. Eradikáciou ich vplyvu zachováme čistotu našich presvedčení a obnovíme božskú harmóniu v zemiach pod našou posvätnou ochranou." # todo: NEW TRANSLATION
 hussite_wars.9.a: "K vojne!" # todo: NEW TRANSLATION
 hussite_wars.9.b: "Môžeme si zatiaľ počkať." # todo: NEW TRANSLATION
 explain_situation_peace_treaty_tt: "Počas tejto [Concept('war','vojny')|e] môžeme prostredníctvom #italic Force Convert#! a [ShowPeaceTreatyTypeName('supress_hussite_faith')] [Concept('peace_treaties','mierové dohody')|e] zlikvidovať [ShowReligionName('hussite')] a ukončiť [ShowSituationName('hussite_wars')]" # todo: CHANGED # todo: CONCEPT CASE
 hussite_wars.10.title: "[ShowSituationNameWithNoTooltip('hussite_wars')]" # todo: NEW TRANSLATION
 hussite_wars.10.desc: "Vzostup [ShowReligionName('hussite')] vytlačil [target_country.GetName] na okraj spoločnosti [ShowReligionAdjective('catholic')] sveta, keď balansuje na pokraji. Poprava [GetCharacter('boh_jan_hus').GetName] nesklamala nesúhlas, skôr ho posilnila. Kacírski kazatelia teraz zjednocujú [GetCountry('BOH').GetGovernment.GetEstateName('peasants_estate')] a [GetCountry('BOH').GetGovernment.GetEstateName('nobles_estate')] rovnako, volajúc po novej Cirkvi oslobodenej od autority [target_location1.GetName].\n\n[GetCountry('BOH').GetFlavorRank] sa rúti do nepokojov, zatiaľ čo [target_location2.GetName] horí reformátorským zápalom. Pre členov [GetUniqueInternationalOrganization('hre').GetName] to nie je len obyčajné povstanie. Je to kacírstvo s armádami, povstanie s cieľom. Ak [target_country.GetNameWithNoTooltip] zvíťazí, infekcia sa môže rozšíriť za jeho hranice a ohroziť samotnú jednotu [ShowReligionGroupName('christian')]." # todo: CHANGED
 hussite_wars.10.a: "Do zbraní, ľudia viery!" # todo: NEW TRANSLATION
 hussite_wars.10.historical_info: "Husitské vojny (1419–1434) boli sériou náboženských a občianskych konfliktov v Čechách vyvolaných upálením Jana Husa, českého reformátora, ktorý kritizoval Katolícku cirkev. Jeho nasledovníci, známi ako husiti, požadovali reformy vrátane prijímania pod oboma spôsobmi pre všetkých a národnej Cirkvi nezávislej od Ríma. Vojny postavili radikálne husitské frakcie proti katolíckym lojalistom a križiackym armádam vyslaným Svätým rímskym cisárom a pápežom. Napriek početnej nevýhode husiti používali inovatívne taktiky a vnútornú jednotu, aby opakovane porážali svojich nepriateľov, nútiac Cirkev nakoniec rokovať a udeliť obmedzené ústupky." # todo: NEW TRANSLATION
 hussite_wars.10.b: "Očistíme ich od kacírstva!" # todo: NEW TRANSLATION
 hussite_wars.10.c: "Ich zúčtovanie môže počkať..." # todo: NEW TRANSLATION
 hussite_rebellion: "Husitské povstanie"" # todo: NEW TRANSLATION
 hussite_wars.11.title: "[ShowSituationNameWithNoTooltip('hussite_wars')]" # todo: NEW TRANSLATION
 hussite_wars.11.desc: "Od kazateľníc v [target_boh_capital_scope.GetName] až po najvzdialenejšie dedinské kaplnky sa rozšírilo slovo: [GetUniqueInternationalOrganization('hre').GetLeaderTitle] nás vyhlásil za nebezpečných kacírnikov, ktorých treba potlačiť alebo násilne obrátiť. Plameň [ShowReligionName('hussite')], ktorý sme zapálili, je teraz zároveň svetlom i terčom. Kým krížové armády zhromažďujú sily za našimi hranicami, náš ľud očakáva silu od nás. Zvolili sme si našu vieru nad autoritu [ShowReligionName('catholic')] a teraz sa musíme pripraviť ju brániť." # todo: NEW TRANSLATION
 hussite_wars.11.a: "Bojujeme za našu vieru a náš ľud!" # todo: NEW TRANSLATION
 hussite_wars_11_tt: "[ShowSituationName('hussite_wars')] [Concept('situation','Situácia')|e] sa začala" # todo: NEW TRANSLATION # todo: CONCEPT CASE

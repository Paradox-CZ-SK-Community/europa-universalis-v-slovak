l_polish:
 battle_for_the_strait_events.1.title: "Bitka o prieliv" # todo: NEW TRANSLATION
 battle_for_the_strait_events.1.desc_cas: "Pariasy z [target_gra_country.GetName] prichádzajú zo severu podľa plánu. Spolu s nimi aj vyslanci, ktorých sťažnosti sú také dlhé, že by unavili komorníka nášho [target_cas_country.GetGovernment.GetCourtTitle]. No južne od pohoria Sierra Morena trón stále stojí a reconquista, ktorá sa začala pri Covadonge, sa ešte neskončila, kým [target_gra_ruler.GetName] zasadá na dvore v [ShowBuildingTypeName('alhambra')].\n\nPosledná etapa nebude dielom jediného ťaženia. Biskupi túžia po križiackej výprave už dve generácie. Veľké rody chcú, praktickejšie vzaté, príležitosť získať dobyté územia, ktoré po nej pripadnú víťazom. Našou úlohou je udržať obe strany dosť dlho v jednom šíku, aby sa trón v [target_gra_country.GetNameWithNoTooltip] napokon zrútil." # todo: NEW TRANSLATION
 bfts_intro_tt: "Sprístupní mechaniku #Y $influence_over_granada$#! s #Y 4#! prahmi, ktoré udeľujú bonusy jednej či druhej strane" # todo: NEW TRANSLATION
 battle_for_the_strait_events.1.desc_mor: "Na druhej strane prielivu [target_cas_country.GetGovernment.GetRulerTitle] krajiny [target_cas_country.GetName] postupne pritláča [target_gra_country.GetName] k múru, jednu platbu parias za druhou. Listy z [target_gra_country.GetGovernment.GetCourtTitle] teraz prichádzajú každý mesiac, niekedy aj každý týždeň. Žiadajú zlato, ale v skutočnosti potrebujú, aby náš [target_mor_country.GetGovernment.GetRulerTitle] preniesol vojnu k jej zdroju.\n\nTáto úloha presahuje vládu jediného panovníka. [target_mor_country.GetGovernment.GetEstateName('clergy_estate')] našich miest presadzujú #italic džihád#! už od straty posledného almohadského kalifa. Ak prenecháme vojnu svojim dedičom, prenecháme ju aj hrobom, ktoré tu budú dlho po nás." # todo: NEW TRANSLATION
 battle_for_the_strait_events.1.desc_gra: "Sme medzi dvoma kladivami a obe sa usmievajú. Zo severu [target_cas_country.GetGovernment.GetRulerTitle] krajiny [target_cas_country.GetName] rok čo rok vyberá pariasy a čaká, kým viera v [target_gra_country.GetName] sama nepovolí. [target_mor_country.GetGovernment.GetRulerTitle] krajiny [target_mor_country.GetName] posiela cez prieliv ponuky zahalené do rečí o #italic džiháde#! a cena napísaná pod každým darom je vždy rovnaká: napokon sa mu vzdáme nášho trónu.\n\nTakto padá #italic ṭā'ifa#!. Nie naraz, nie pod náporom jediného vojska, ale postupne, keď [target_gra_country.GetGovernment.GetCourtTitle] stráca vôľu odmietať. Vydržali sme dlhšie než väčšina. Našou úlohou v nasledujúcich rokoch je prežiť trpezlivosť jedného suseda aj ctižiadostivosť druhého a postarať sa, aby sa záznamy o [target_gra_country.GetNameWithNoTooltip] dočkali dlhšieho pokračovania než záznamy o každej #italic ṭā'ife#!, ktorá sa podvolila." # todo: NEW TRANSLATION
 bfts_explain_granadan_sovereignty_tt: "Sprístupní [Concept('granadan_sovereignty','granadská suverenita')|e] cez panel [Concept('situation','situácia')|e]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 battle_for_the_strait_events.1.desc_christian: "Dozvedáme sa, že [target_cas_country.GetName] obracia všetok svoj [target_cas_country.GetFlavorRank] aparát proti [target_gra_country.GetName], poslednému [ShowReligionGroupAdjective('muslim')] trónu na polostrove. Takýto tlak namierený na juh sme naposledy zažili počas ťažení Fernanda III.\n\nDôsledky presiahnu naše hranice. Víťazstvo [target_cas_country.GetAdjectiveWithNoTooltip] ukončí reconquistu za podmienok stanovených v [ShowLocationName('toledo')] a južné provincie pripadnú pod jednu korunu. Ak [target_mor_country.GetGovernment.GetRulerTitle] krajiny [target_mor_country.GetName] odpovie spoza prielivu naozaj vážne, môžu sa [ShowReligionGroupAdjectiveWithNoTooltip('muslim')] galéry po prvýkrát za celé storočie vrátiť do našich námorných trás. Nech už to dopadne akokoľvek, mapa [ShowRegionName('iberia_region')], ktorá z toho vzíde, nebude taká, akú poznáme." # todo: NEW TRANSLATION
 battle_for_the_strait_events.1.desc_muslim: "[target_mor_country.GetGovernment.GetRulerTitle] krajiny [target_mor_country.GetName] obrátil [target_mor_ruler.GetHisHer] zrak na sever. [target_gra_country.GetName], posledný [ShowReligionGroupAdjective('muslim')] trón v [ShowFormableCountryName('ADU_f')], dusí pariasami, jednou za druhou, [target_cas_country.GetGovernment.GetRulerTitle] krajiny [target_cas_country.GetName] a piatkové kázne po celom [ShowRegionName('maghreb_region')] hovoria o tejto veci.\n\nNech už máme akékoľvek hranice, tento zápas sa nás týka. Ak [target_mor_country.GetNameWithNoTooltip] pozdvihne trón v [target_gra_country.GetNameWithNoTooltip], #italic khuṭba#! môže byť za našich životov čítaná v mene nášho [ROOT.GetCountry.GetGovernment.GetRulerTitle] až na severe, v [ShowLocationNameWithNoTooltip('cordoba')]. Ak sa [target_cas_country.GetAdjectiveWithNoTooltip] [target_cas_country.GetGovernment.GetRulerTitle] podarí podrobiť [target_gra_country.GetFlavorRank] pod [target_cas_ruler.GetHisHer] kríž, posledná opora [ShowFormableCountryNameWithNoTooltip('ADU_f')] zanikne a kapitola, ktorá sa začala za čias Ṭāriqa ibn Zijāda, sa skončí v našej generácii." # todo: NEW TRANSLATION
 battle_for_the_strait_events.1.option_cas: "[ShowRegionNameWithNoTooltip('iberia_region')] bude podliehať [ShowReligionGroupAdjectiveWithNoTooltip('christian')] korune." # todo: NEW TRANSLATION
 battle_for_the_strait_events.1.option_mor: "[ShowFormableCountryNameWithNoTooltip('ADU_f')] sa vráti kalifátu." # todo: NEW TRANSLATION
 battle_for_the_strait_events.1.option_gra: "Prežijeme ctižiadostivosť oboch." # todo: NEW TRANSLATION
 battle_for_the_strait_events.1.option_christian: "Osud [ShowRegionNameWithNoTooltip('iberia_region')] je spätý s týmto zápasom." # todo: NEW TRANSLATION
 battle_for_the_strait_events.1.option_muslim: "Osud [ShowFormableCountryNameWithNoTooltip('ADU_f')] závisí od tohto zápasu." # todo: NEW TRANSLATION
 battle_for_the_strait_events.2.title: "Reconquista je vyhratá" # todo: NEW TRANSLATION
 battle_for_the_strait_events.2.desc: "V [ShowLocationName('granada')] zaznie posledná piatková modlitba bez odpovedajúceho zvonenia. Už o hodinu zameriavajú východnú stenu budovy, aby tam vybudovali apsidu. Náš [target_ruler.GetName] sa dožil diela, ktoré začali astúrski králi. Reconquista sa skončila.\n\nTakýto koniec rozdeľuje kroniky. Od tohto roku sa bude iberský čas merať ako #italic pred Granadou#! a #italic po nej#!. Naša koruna drží dátum, ktorý toto účtovanie uzatvára, a táto pocta si ako jediná nevyžaduje vysvetlenie." # todo: NEW TRANSLATION
 battle_for_the_strait_events.2.a: "Nad prielivom sa týči kríž." # todo: NEW TRANSLATION
 battle_for_the_strait_events.3.title: "[ShowFormableCountryNameWithNoTooltip('ADU_f')] sa vracia k veriacim" # todo: NEW TRANSLATION
 battle_for_the_strait_events.3.desc: "Volanie [ShowFormableCountryName('ADU_f')] našlo odpoveď. Tlak krajiny [target_cas_country.GetName] na [GetCountry('GRA').GetFlavorRank] povolil a pariasy zhromažďované po generácie sa vyplácajú v plnej výške. Náš [target_ruler.GetName] je uznaným ochrancom posledného [ShowReligionGroupAdjective('muslim')] trónu na polostrove a [target_ruler.GetHisHer] meno zaznieva v piatkových modlitbách po celom [ShowRegionName('maghreb_region')] až po samotnú [ShowLocationName('granada')].\n\nPod našou korunou sa znovu vyhlasuje marinidský kalifát. #italic Bay'ah#! [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] vyhlásila náš rod za patróna [ShowFormableCountryNameWithNoTooltip('ADU_f')], čo so sebou prináša nielen titul, ale aj záväzok: nemoslimské komunity, ktoré teraz žijú pod našou ochranou, sú zverencami nášho trónu a našu vládu budú posudzovať podľa toho, ako sa im darí. Dielo, ktoré veľkí Almohadovia zanechali nedokončené, pokračuje pod našou rukou." # todo: NEW TRANSLATION
 battle_for_the_strait_events.3.a: "Naša zástava veje na oboch stranách prielivu." # todo: NEW TRANSLATION
 bfts_andalus_formation_eased_tt: "Teraz môžeme vytvoriť [ShowFormableCountryNameWithNoTooltip('ADU_f')], aj keď ovládame #G menej#! území v oblasti [ShowRegionNameWithNoTooltip('iberia_region')]" # todo: NEW TRANSLATION
 battle_for_the_strait_events.4.title: "Trón [GetCountry('GRA').GetNameWithNoTooltip] pretrval" # todo: NEW TRANSLATION
 battle_for_the_strait_events.4.desc: "[target_cas_country.GetAdjective] koruna nám prestala posielať požiadavky. Po tom, čo sa minuloročnej letnej flotile nepodarilo vyplávať z prístavov krajiny [target_mor_country.GetAdjective], sa o ďalší nábor vojska nik nepokúsil. Trón v [target_gra_country.GetCapital.GetName] stále zastáva ten istý panovník ako na začiatku. Náš [target_ruler.GetName] dosiahol niečo, čo nikto na našom [target_gra_country.GetGovernment.GetCourtTitle] nepovažoval za možné už dve generácie: prečkal celý zápas.\n\nToto je ťažší koniec. Dobytie uzatvára kapitolu čisto, no vytrvalosť len necháva knihu otvorenú. Naši nástupcovia si z toho odnesú nie víťazstvo, ale húževnatosť. Záznamy dosvedčia, že [target_gra_country.GetName] bol emirátom, ktorý odmietol padnúť podľa plánu." # todo: NEW TRANSLATION
 battle_for_the_strait_events.4.a: "Granada zostáva slobodná." # todo: NEW TRANSLATION
 bfts_reconquest_cb_unlocked_tt: "Teraz môžeme vyrobiť zámienku [ShowCasusBelliName('cb_reconquer_iberia')] na opätovné získanie území v oblasti [ShowRegionName('iberia_region')] za nižšiu cenu" # todo: NEW TRANSLATION
 bfts_iberia_fully_integrated_tt: "Každé [Concept('location','lokalita')|e], ktoré ovládame v oblastiach [ShowAreaName('granada_area')], [ShowAreaName('andalusia_area')] a [ShowAreaName('murcia_area')], získa status [Concept('integration','integrácia')|e] [Concept('core','jadra')|e]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 bfts_taifa_annexation_boosted_tt: "Každý [ShowSubjectTypeName('taifa')], ktorý práve anektujeme, získa #G 25 %#! pokroku v [Concept('annexation','anexii')|e]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 battle_for_the_strait_events.5.title: "Situácia $battle_for_the_strait$ sa končí" # todo: NEW TRANSLATION
 battle_for_the_strait_events.5.desc_cas: "Roky plynuli. Z nášho [target_cas_country.GetGovernment.GetCourtTitle] odchádzali a prichádzali celé generácie vyslancov a už dvakrát dorazili vozy s pariasmi neskoro a naložené len spolovice, s ospravedlneniami, ktoré používajú tie isté frázy ako pred generáciou. Náš [target_ruler.GetName] už neuvidí [ShowLocationName('granada')] pod naším krížom.\n\nVybudovali sme mohutný stroj pre vojnu, ktorú sme nedokončili. Pohraničné pevnosti padli. Mnohí z [ShowCultureName('andalusi')], ktorých sme prijali do kancelárie, majú teraz vlastných vnukov za písacími stolmi. Ani biskupi, ani veľké rody sa nevzdali. Chcú križiacku výpravu alebo nové pozemkové granty. Úprimne povedané, väčšina chce oboje. Čas na ukončenie sa minul a dedičom zanechávame nedokončený spor a stále rozdelený polostrov." # todo: NEW TRANSLATION
 battle_for_the_strait_events.5.desc_mor: "Začína sa nová doba a volanie spoza prielivu je rovnaké, aké poznali naši starí otcovia: je to len volanie. Naše flotily sa už tucetkrát vrátili domov bez preliatia krvi. [target_mor_country.GetGovernment.GetEstateName('clergy_estate')], ktorí každý piatok dve generácie presadzovali #italic džihád#!, sú už príliš starí na hádky. Náš [target_ruler.GetName] nebude tým, kto prenesie zástavu na druhý breh.\n\nNeporazila nás [target_cas_country.GetAdjective] koruna. Reconquista nie je o nič bližšie k svojmu koncu než obnovenie almohadskej vlády k svojmu znovuzrodeniu. Skúsili sme na prieliv všetky spôsoby, ktoré sa už raz osvedčili, a väčšina z nich naozaj fungovala. Figúrky sa pohli. Šachovnica sa nezlomila. To, čo začali naši predkovia za vlády veľkých Almohadov, prechádza na našich nástupcov a k svojmu zavŕšeniu sa nepriblížilo." # todo: NEW TRANSLATION
 battle_for_the_strait_events.5.desc_gra: "Uplynuli dve doby a [target_gra_country.GetGovernment.GetRulerTitle] krajiny [target_gra_country.GetName] stále sedí na tróne. Podľa toho, ktorú kroniku čítame, ide o to najmenšie možné víťazstvo alebo o najväčší možný zázrak. Náš [target_ruler.GetName] neurobil to, čoho sa [target_cas_country.GetName] obával, ani to, v čo dúfal [target_mor_country.GetName], ale iba to, čo bolo nevyhnutné.\n\nTo, čo sme vybudovali, aby sme prežili, malo vždy pretrvať dlhšie než ktorékoľvek z kladív. [ShowBuildingTypeName('alhambra')] sa rozrastala počas každého obdobia zápasu a #italic jinetes#! stále sedia v sedle. Hranie dvoch patrónov proti sebe ich oboch vyčerpalo skôr, než vyčerpalo nás. Zápas sme neukončili. Prečkali sme ho. Nasledujúca doba preverí, na čo sme čakali." # todo: NEW TRANSLATION
 battle_for_the_strait_events.5.option_cas: "Dielo prenecháme tým, ktorí prídu po nás." # todo: NEW TRANSLATION
 battle_for_the_strait_events.5.option_mor: "Volanie sa časom ozve znova." # todo: NEW TRANSLATION
 battle_for_the_strait_events.5.option_gra: "Vytrváme." # todo: NEW TRANSLATION
 battle_for_the_strait_concludes_tt: "Ukončí [ShowSituationName('battle_for_the_strait')]" # todo: NEW TRANSLATION
 enable_extra_modifier_crown_castile_reform_tt: "Posilní našu [Concept('government_reform','reformu vlády')|e] [ShowGovernmentReformName('crown_castile_reform')]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 bfts_dominate_iberia_golden_century_tt: "Sprístupní $gc_decision.title$ [Concept('decision','rozhodnutie')|e], ktorá aktivuje [Concept('situation','situácia')|e] [ShowSituationName('golden_century')]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 battle_for_the_strait_events.21.title: "[ShowCultureNameWithNoTooltip('andalusi')] sa vracajú domov" # todo: NEW TRANSLATION
 battle_for_the_strait_events.21.desc: "Správy sa k mudéjarským rodinám v oblasti [ShowRegionName('iberia_region')] dostávajú po obchodných cestách a prostredníctvom rodinných zväzkov. Náš [ROOT.GetCountry.GetFlavorRank] ponúka útočisko tým, ktorí chcú žiť pod našimi zákonmi. Z [target_province_origin.GetName], kde rodiny [ShowCultureName('andalusi')] prežili generáciu pod [ShowReligionGroupAdjective('christian')] vládou, sa na hraniciach zhromažďujú karavány.\n\nPrichádzajú s modlitebnými knihami, kľúčmi od domov, ktoré už možno nikdy neuvidia, a odporúčacími listami pre obchodníkov na našich trhoch. O niekoľko mesiacov sa usadia v [target_province_destination.GetName] a obnovia tam život, ktorý prerušila reconquista." # todo: NEW TRANSLATION
 battle_for_the_strait_events.21.a: "Privítajme ich." # todo: NEW TRANSLATION
 battle_for_the_strait_events.21.historical_info: "Pojem #italic mudajjan#! („ten, komu je dovolené zostať“) dal kastílskym a aragónskym kanceláriám slovo „mudéjar“ pre moslimské komunity, ktoré zostali na svojom mieste po veľkých výbojoch v trinástom storočí. Od rieky Tajo až po Ebro celé mestá roľníkov, remeselníkov a učencov obrábali staré polia a modlievali sa v starých mešitách aj po tom, čo nad dverami katedrál zaviali kríže.\n\nIch postavenie bolo vždy neisté. Opakované vyháňanie, zdrvujúce dane a neustály tlak na nútené obrátenie na vieru hnali ďalšie a ďalšie vlny na juh, k poslednej andalúskej ríši, kde ich nasridskí emirovia vítali pôdou a prísľubom života pod islamským právom. Každý príchod prehlboval kultúrnu pamäť Granady na stratené #italic taifas#! a posilňoval nárok kráľovstva byť dedičom al-'Andalus." # todo: NEW TRANSLATION
 battle_for_the_strait_events.22.title: "Prichádza šádhilíjský rád" # todo: NEW TRANSLATION
 battle_for_the_strait_events.22.desc: "Do nášho [ROOT.GetCountry.GetGovernment.GetCourtTitle] prichádza delegácia šádhilíjskych šajchov. Z veľkých #italic zawij#! v [ShowLocationName('sale')] a [ShowLocationName('tetouan')] ich vyslali s odporúčacími listami od dvora [GetCountry('MOR').GetGovernment.GetRulerTitle] z rodu [GetCountry('MOR').GetGovernment.GetRulerOrRegent.GetDynasty.GetName]. Sú to vzdelaní učenci, nie púštni mystici; muži znalí práva a diela #italic Hikam#! od Ibn Ata Allaha, ktorým je rovnako príjemne pri stoloch obchodníkov ako pri bránach palácov.\n\nPrinášajú návrh. Ak im poskytneme záštitu, založia v našom [ROOT.GetCountry.GetFlavorRank] #italic zawiju#! a dajú nám k dispozícii svoju sieť na druhej strane prielivu. Ich prítomnosť na našom [ROOT.GetCountry.GetGovernment.GetCourtTitle] posunie rovnováhu hlasov smerom k právnej škole [ROOT.GetCountry.GetReligiousSchool.GetName] v oblasti [ShowSocietyDirectionName('jurisprudence')]. Svätecká autorita, ktorú prinášajú, je jednou z mála mien, ktoré ešte môžeme použiť a ktorým sa [ShowReligionGroupAdjective('christian')] kráľovstvá nedokážu vyrovnať. Rozhodnutie, či, kedy a ako ich financovať, zostane na nás." # todo: NEW TRANSLATION # todo: COUNTRY CASE
 battle_for_the_strait_events.22.a: "Privítajme ich na našom [ROOT.GetCountry.GetGovernment.GetCourtTitle]." # todo: NEW TRANSLATION
 battle_for_the_strait_events.22.a.entry: "Privítajme ich na našom dvore." # todo: NEW TRANSLATION
 battle_for_the_strait_events.22.entry: "$battle_for_the_strait_events.22.title$" # todo: NEW TRANSLATION
 dmc_arrival_intro: "[converted_character.GetName] prichádza na náš [ROOT.GetCountry.GetGovernment.GetCourtTitle], keď nám ho [GetCountry('GRA').GetName] vydalo pod ťarchou našich požiadaviek. Pred kapitulou našej katedrály je pokrstený a [converted_character.GetHerHis] nové [ShowReligionGroupAdjective('christian')] meno sa zapisuje do zoznamov našich služobníkov." # todo: NEW TRANSLATION
 battle_for_the_strait_events.30.title: "Konvertita na našom [actor.GetGovernment.GetCourtTitle]" # todo: NEW TRANSLATION
 battle_for_the_strait_events.30.desc_centralization: "$dmc_arrival_intro$\n\n[converted_character.GetNameWithNoTooltip] sa osvedčuje ako užitočný služobník v kancelárii. Jeho opis toho, ako úrady [GetCountry('GRA').GetAdjectiveWithNoTooltip] spravujú dane a tribúty, sa dostáva k našim ministrom a koruna tak získava väčší vplyv na veľké rody, ktoré by sa takýmto opatreniam samy nepodvolili." # todo: NEW TRANSLATION
 battle_for_the_strait_events.30.desc_innovative: "$dmc_arrival_intro$\n\n[converted_character.GetNameWithNoTooltip] má v [converted_character.GetHerHis] sedlových brašnách listy, traktáty a výpočtové tabuľky – dedičstvo knižníc v [ShowLocationName('cordoba')]. Naši učenci vďaka tomu objavujú nové oblasti výskumu, ktoré im boli kedysi pre jazyk neprístupné." # todo: NEW TRANSLATION
 battle_for_the_strait_events.30.desc_estate_nobles: "$dmc_arrival_intro$\n\nRodový pôvod [converted_character.GetNameWithNoTooltip] získava [converted_character.GetHerHis] miesto medzi [actor.GetGovernment.GetEstateName('nobles_estate')], ktorých starší vítajú nový rod spojený s ich záujmami obrátením na vieru." # todo: NEW TRANSLATION
 battle_for_the_strait_events.30.desc_estate_clergy: "$dmc_arrival_intro$\n\n[converted_character.GetNameWithNoTooltip] vstupuje do radov [actor.GetGovernment.GetEstateName('clergy_estate')] ako vzdelaný hlas; [converted_character.GetHerHis] znalosť #italic šarí'y#! dodáva debatám v katedrálnej kapitule nečakanú váhu." # todo: NEW TRANSLATION
 battle_for_the_strait_events.30.desc_estate_burghers: "$dmc_arrival_intro$\n\n[converted_character.GetNameWithNoTooltip] vstupuje medzi [actor.GetGovernment.GetEstateName('burghers_estate')] našich obchodných miest, kde sa pred novým konvertitom, ktorý pozná južné cesty do [ShowRegionName('maghreb_region')], otvárajú účtovné knihy aj sklady." # todo: NEW TRANSLATION
 battle_for_the_strait_events.30.desc_estate_peasants: "$dmc_arrival_intro$\n\nNa našom [ROOT.GetCountry.GetGovernment.GetCourtTitle] niet miesta pre postavenie, ktoré [converted_character.GetSheHe] zastával na juh od hranice, a [converted_character.GetNameWithNoTooltip] sa usádza medzi [actor.GetGovernment.GetEstateName('peasants_estate')] v srdci našej krajiny." # todo: NEW TRANSLATION
 battle_for_the_strait_events.30.desc_child_tutor: "$dmc_arrival_intro$\n\n[ROOT.GetCountry.GetGovernment.GetCourtTitle] ustanovuje [converted_character.GetNameWithNoTooltip] za vychovávateľa nášho dediča [actor.GetGovernment.GetHeir.GetName]. Učenie [converted_character.GetHerHis] bývalých pánov v [GetCountry('GRA').GetNameWithNoTooltip] sa odovzdáva [ShowReligionGroupAdjective('christian')] dieťaťu, ktoré od učiteľa znalého všetkých troch odborov preberá astronómiu, účtovníctvo aj umenie vládnuť." # todo: NEW TRANSLATION
 battle_for_the_strait_events.30.desc_administrators: "$dmc_arrival_intro$\n\n[converted_character.GetNameWithNoTooltip] získava miesto v našej kancelárii a [converted_character.GetHerHis] znalosť účtovných kníh v [ShowCultureGroupName('arabic_group')] jazykoch a obchodných trás v oblasti [ShowRegionName('maghreb_region')] sa dostáva k našim obchodníkom. Mestské rody nachádzajú na druhej strane prielivu nových obchodných partnerov aj nových dlžníkov." # todo: NEW TRANSLATION
 battle_for_the_strait_events.30.a: "Získali sme pre vieru užitočnú dušu." # todo: NEW TRANSLATION
 battle_for_the_strait_events.31.title: "[actor.GetNameWithNoTooltip] vnucuje krajine [GetCountry('GRA').GetNameWithNoTooltip] vazalstvo" # todo: NEW TRANSLATION
 battle_for_the_strait_events.31.desc: "Je rozhodnuté. Podriadili sme si [GetCountry('GRA').GetName] ako vazala a teraz, keď pečate zaschli, už žiadny protest z ich strany nedokáže zrušiť podpísanú listinu.\n\nNa druhej strane prielivu je význam celkom jasný. [GetCountry('GRA').GetFlavorRank] si už neurčuje vlastný smer a predstavitelia krajiny [GetCountry('GRA').GetNameWithNoTooltip] sa musia naučiť kľačať tam, kde kedysi vládli. Niektorí prijmú toto puto a budú nám verne slúžiť, iní budú potajomky dúfať, že sa raz oslobodia. Tak či onak, zápas o prieliv sa výrazne naklonil v náš prospech a my hodláme túto výhodu využiť." # todo: NEW TRANSLATION
 battle_for_the_strait_events.31.a: "Tak je spečatené." # todo: NEW TRANSLATION
 battle_for_the_strait_events.32.title: "[GetCountry('MOR').GetNameWithNoTooltip] vynucuje od [GetCountry('GRA').GetNameWithNoTooltip] tribút" # todo: NEW TRANSLATION
 battle_for_the_strait_events.32.desc: "Úspešne sme prinútili [GetCountry('GRA').GetName] platiť tribút a podmienky sú dohodnuté skôr, než ich diplomati stihnú protestovať. Pokladnice [GetCountry('GRA').GetFlavorRank] sú otvorené našim inšpektorom a bremeno dávky dolieha na obe strany prielivu.\n\n[GetCountry('GRA').GetGovernment.GetEstateName('nobles_estate')] krajiny [GetCountry('GRA').GetNameWithNoTooltip] počítajú zlato, ktoré k nám každú sezónu odpláva na juh, a mlčky zvažujú jeho cenu. Či [GetCountry('GRA').GetFlavorRank] zostane v našej sfére vplyvu, alebo strhne jarmo, dlhý zápas o prieliv sa teraz blíži k rozuzleniu." # todo: NEW TRANSLATION
 battle_for_the_strait_events.32.a: "Nech sa spočítajú pokladnice." # todo: NEW TRANSLATION
 battle_for_the_strait_events.61.title: "[GetCountry('CAS').GetNameWithNoTooltip] obnovuje pariasy od [GetCountry('GRA').GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 battle_for_the_strait_events.61.desc: "Tribút sa obnovil bez jediného taseného meča. Naši vyslanci presadili svoje požiadavky v [GetCountry('GRA').GetName], kým neboli podmienky podpísané, a staré pariasy sú opäť zapísané v záznamoch [GetCountry('GRA').GetFlavorRank].\n\nKaždú sezónu poputuje zlato do našej pokladnice na severe a s ním aj tiché vedomie, že [GetCountry('GRA').GetFlavorRank] si udržiava trón len vďaka našej zhovievavosti. [GetCountry('GRA').GetGovernment.GetEstateName('nobles_estate')] krajiny [GetCountry('GRA').GetNameWithNoTooltip] počítajú sumu a mlčia. Či toto bremeno unesú, alebo ho zo seba strasú, zápas o prieliv sa blíži ku koncu." # todo: NEW TRANSLATION
 battle_for_the_strait_events.61.a: "Nech sa pripravia účtovné záznamy." # todo: NEW TRANSLATION
 battle_for_the_strait_events.40.title: "Vnucujú nám putá" # todo: NEW TRANSLATION
 battle_for_the_strait_events.40.desc_cas: "Nešťastným osudom žijeme pod zástavou krajiny [target_cas_country.GetName] a v nemilosti [target_cas_ruler_regent.GetName]. Nedávne udalosti a pohraničné konflikty viedli [target_cas_country.GetFlavorRank] k tomu, že od nás žiada nové záruky nášho postavenia, ktoré budú verejne zaznamenané. Ich vyslanci hovoria o priateľstve, no mince a ústupky, ktoré očakávajú, rozprávajú iný príbeh. Podvoliť sa znamená vzdať sa ďalšieho kúska nášho postavenia, odmietnuť znamená riskovať, že ich jazdci znovu prejdú našimi poľami." # todo: NEW TRANSLATION
 battle_for_the_strait_events.40.desc_mor: "Nešťastným osudom na nás [target_mor_country.GetFlavorRank] hľadí ako na menejcenného spojenca. Listy od [target_mor_ruler_regent.GetName] z krajiny [target_mor_country.GetName] hovoria o bratstve vo viere, no žiadajú to isté ako náš druhý sused: záruky našej podriadenosti, zamaskované ako prirodzený poriadok medzi silnými a slabými. Ich flotily a zlato nás už v minulosti chránili a nedovolia nám na to zabudnúť. Ak prijmeme ich podmienky, ešte viac upadneme do ich tieňa. Ak ich odmietneme, zostane nám otázka, či nabudúce dorazí flotila vôbec ako priateľ." # todo: NEW TRANSLATION
 battle_for_the_strait_events.40.a: "Poskytnime záruky na úkor našej zvrchovanosti..." # todo: NEW TRANSLATION
 battle_for_the_strait_events.40.b: "Podplaťme ich diplomatov." # todo: NEW TRANSLATION
 battle_for_the_strait_events.40.c: "Ich prázdne vyhrážky padajú na hluché uši!" # todo: NEW TRANSLATION
 battle_for_the_strait_events.41.title: "Ctižiadostivosť [target_character_1.GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 battle_for_the_strait_events.41.desc: "[target_character_1.GetName] už nejaký čas uplatňuje na našom [ROOT.GetCountry.GetGovernment.GetCourtTitle] nevídaný vplyv. Nedávne udalosti vložili do [target_character_1.GetHerHis] rúk ešte väčšiu moc a dokonca aj [target_character_2.GetName] sa obáva, že stratí vplyv. Takéto ambície môžu vzklíčiť aj v tých najbystrejších a najláskavejších mysliach a služobníka, ktorý získal takúto moc, nemožno len tak odstaviť. Ak [target_character_1.GetShortNameWithNoTooltip] nezakročíme, môže napokon vládnuť všetkým okrem mena. Ak ho však budeme držať na uzde príliš prísne, riskujeme, že sa zo schopného ministra stane zatrpknutý nepriateľ." # todo: NEW TRANSLATION
 battle_for_the_strait_events.41.a: "[target_character_1.GetSheHe|U] odvádza dobrú prácu!" # todo: NEW TRANSLATION
 battle_for_the_strait_events.41.b: "[target_character_1.GetShortNameWithNoTooltip], ste prepustený!" # todo: NEW TRANSLATION
 battle_for_the_strait_events.42.title: "Obchodný ruch" # todo: NEW TRANSLATION
 battle_for_the_strait_events.42.desc: "Krajina [target_country.GetName] je už celé stáročia dôležitou zastávkou pre obchodníkov cestujúcich z pobrežia oblasti [ShowRegionName('italy_region')] až na trhy v oblasti [ShowRegionName('sahel_region')]. V poslednom čase sa obchodu darí a naše účtovné knihy zaznamenávajú slušný prílev mincí! [ShowGoodsName('silk')], [ShowGoodsName('sugar')] a [ShowGoodsName('fruit')] prechádzajú našimi skladmi rýchlejšie, než ich úradníci stíhajú počítať, a každá frakcia na našom [ROOT.GetCountry.GetGovernment.GetCourtTitle] má vlastnú predstavu o tom, kam by mal prebytok smerovať. Teraz sa musíme rozhodnúť, na čo ho najlepšie vynaložiť." # todo: NEW TRANSLATION
 battle_for_the_strait_events.42.a: "Investujme prebytočné mince do infraštruktúry." # todo: NEW TRANSLATION
 battle_for_the_strait_events.42.b: "Podporujme umelcov a vedu." # todo: NEW TRANSLATION
 battle_for_the_strait_events.42.c: "Rozdajme peniaze ľudu." # todo: NEW TRANSLATION
 battle_for_the_strait_events.42.d: "Rozšírme pokladnicu." # todo: NEW TRANSLATION
 battle_for_the_strait_events.42.e: "Využime mince na šírenie nášho lesku a zvrchovanosti!" # todo: NEW TRANSLATION
 battle_for_the_strait_events.43.title: "Náš vplyv nad [target_gra_country.GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 battle_for_the_strait_events.43.desc: "Prebiehajúci zápas na druhej strane prielivu vrhol [target_gra_country.GetName] do víru prudkých a krutých bojov. Málo útechy nám prináša skutočnosť, že [target_gra_country.GetFlavorRank] je bohatý a plný vzdelaných ľudí, pretože práve preto je ešte väčšou korisťou. Naši rivali si získavajú priazeň jeho [target_gra_country.GetGovernment.GetRulerTitle] zlatom a lichotivými slovami, aj keď ich vojská už pochodujú. Trón, ktorý sa prikloní na nesprávnu stranu, nám môže na celú generáciu uzavrieť prieliv. Musíme teraz presadiť svoj vplyv, aj za cenu dobrých vzťahov, inak riskujeme, že sa dostane ešte hlbšie do rúk našich nepriateľov." # todo: NEW TRANSLATION
 battle_for_the_strait_events.43.a: "Musíme ukázať svoju silu." # todo: NEW TRANSLATION
 battle_for_the_strait_events.43.b: "Nerozvírime hladinu." # todo: NEW TRANSLATION
 battle_for_the_strait_events.44.title: "Zrod polyhistora" # todo: NEW TRANSLATION
 battle_for_the_strait_events.44.desc: "Je všeobecne známe, že [target_gra_country.GetLongName] je domovom veľkých učencov a osvietených myslí. Najnovším príkladom nie je nik iný než [target_polymath.GetName], duchovný učenec, ktorého meno sa šíri od [target_location.GetName] až po náš [ROOT.GetCountry.GetGovernment.GetCourtTitle]. Takáto myseľ má väčšiu cenu než akákoľvek pevnosť. Svoje schopnosti však [target_polymath.GetHerHis] ponúka nášmu [target_root_country.GetFlavorRank] iba pod jednou podmienkou: musíme uznať [target_gra_country.GetNameWithNoTooltip] za svojho zvrchovaného rovnocenného partnera..." # todo: NEW TRANSLATION
 battle_for_the_strait_events.44.a: "[target_polymath.GetSheHe|U] za tú diplomaciu stojí!" # todo: NEW TRANSLATION
 battle_for_the_strait_events.44.b: "Uplatnime náš politický vplyv!" # todo: NEW TRANSLATION
 battle_for_the_strait_events.44.c: "Spoľahneme sa na nadradené mysle [target_root_country.GetAdjectiveWithNoTooltip]!" # todo: NEW TRANSLATION
 target_polymath_resides_in_target_gra_country: "[target_polymath.GetName] bude naďalej udržiavať [target_polymath.GetHerHis] bydlisko v [target_location.GetName]" # todo: NEW TRANSLATION
 battle_for_the_strait_events.45.title: "Náboženské zaujímavosti" # todo: NEW TRANSLATION
 battle_for_the_strait_events.45.desc: "Aké nádherné sú [ShowReligionGroupAdjective('christian')] obrady, ich obrazové motívy a pestré kňazské rúcha. Aký význam sa skrýva za ich veršami a textami a za hlbším chápaním ich predstavy o božskom?\n\nTakéto otázky zamestnávajú myseľ [target_root_ruler.GetName]. [target_root_ruler.GetSheHe|U] začal/a v súkromí prijímať zahraničných duchovných a dlho do noci sa zaoberať ich knihami. V celom [target_root_country.GetFlavorRank] sa na to pozerá s nevôľou a [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] začali šepkať o tom, kam by takáto zvedavosť mohla viesť." # todo: NEW TRANSLATION
 battle_for_the_strait_events.45.a: "Zvedavosť je len jedným z prejavov ľudskosti!" # todo: NEW TRANSLATION
 battle_for_the_strait_events.45.b: "Odveďme jeho pozornosť k iným záležitostiam!" # todo: NEW TRANSLATION
 battle_for_the_strait_events.46.title: "Vedecké bádanie" # todo: NEW TRANSLATION
 battle_for_the_strait_events.46.desc: "[target_character.GetName] už od detstva prejavuje nadanie pre vedu. Tvary kvetov, včely, farby a rôzne prírodné javy sú len niektoré z tém, ktoré sa [target_character.GetSheHe] snaží rozlúštiť. Vďaka tomuto sklonu je [ROOT.GetCountry.GetGovernment.GetRulerTitle] prirodzeným patrónom #italic madras#! a knižníc a neúnavne hľadá poznanie medzi ich policami. Astronómovia a lekári len zriedka našli takého ochotného patróna, no každá hodina venovaná ich práci je hodinou odobratou vládnutiu." # todo: NEW TRANSLATION
 battle_for_the_strait_events.46.a: "Podporme inštitúciu v [target_university_location.GetNameWithNoTooltip]!" # todo: NEW TRANSLATION
 battle_for_the_strait_events.46.b: "Sväté texty!" # todo: NEW TRANSLATION
 battle_for_the_strait_events.46.c: "[target_character.GetShortNameWithNoTooltip] už nie je dieťa!" # todo: NEW TRANSLATION
 ruler_will_study_tt: "[target_character.GetShortName] sa bude študovať..." # todo: NEW TRANSLATION
 target_character_studies_admin: "...správu" # todo: NEW TRANSLATION
 target_character_studies_diplomacy: "...diplomaciu" # todo: NEW TRANSLATION
 target_character_studies_war: "...vojnu" # todo: NEW TRANSLATION
 battle_for_the_strait_events.47.title: "Vplyv postavy [target_character_1.GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 battle_for_the_strait_events.47.desc_a: "Napriek búrlivému a neistému postaveniu nášho [ROOT.GetCountry.GetFlavorRank] sú nedávne rozhodnutia a počínanie postavy [target_character_1.GetName] žiarivým príkladom našej prezieravej politiky a prísľubom, že naša zvrchovanosť je rešpektovaná. Kým iní vidia trón obkľúčený a pripravený padnúť, [target_character_1.GetShortNameWithNoTooltip] ukázal pevnú ruku a chýry o tom sa šíria medzi priateľmi aj súpermi. Tak dobre vedená vláda je sama osebe dôkazom, že nám nikto nemôže rozkazovať." # todo: NEW TRANSLATION
 battle_for_the_strait_events.47.desc_b: "Človek by si myslel, že služba vo vláde je postavením spájaným so spravodlivosťou a cťou a že služba ľudu by mala byť najvyšším poslaním takého prestížneho úradu, aký zastáva [target_character_1.GetName].\nSkutočnosť je však úplne opačná! [target_character_1.GetShortNameWithNoTooltip] je tŕňom v oku postavy [target_character_2.GetName] a často vynakladá [target_character_1.GetHerHis] úsilie, aby obohatil [target_character_1.GetHerselfHimself] na náš úkor. Úrady sa predávajú, protislužby vymieňajú a prosebníci, ktorí nemajú čím zaplatiť, čakajú pred dverami. Nemôžeme si dovoliť ministra, ktorý si plní [target_character_1.GetHerHis] vlastné vrecká skôr než štátnu pokladnicu." # todo: NEW TRANSLATION
 battle_for_the_strait_events.47.a: "Žiarivý príklad!" # todo: NEW TRANSLATION
 battle_for_the_strait_events.47.b: "Len červ, čo sa plazí po hromade..." # todo: NEW TRANSLATION
 battle_for_the_strait_events.50.entry: "Poučný príbeh o Abú Abdalláhovi ibn al-Hakímovi al-Rundím" # todo: NEW TRANSLATION
 battle_for_the_strait_events.50.title: "Poučný príbeh o postave [target_dead_guy.GetShortNameWithNoTooltip]" # todo: NEW TRANSLATION
 battle_for_the_strait_events.50.desc: "Kronikári stále rozprávajú o [target_dead_guy.GetName], [ROOT.GetCountry.Custom('GetHeadOfCabinetName')], ktorý kedysi držal v rukách dve štátne pečate a vládol našim predkom takmer vo všetkom, hoci nie menom, až kým sa proti nemu nevzbúrilo mesto. Rozvášnený dav vtrhol do jeho paláca, zrazil ho k zemi a zohavil jeho telo tak, že si ho nikdy nenašiel žiaden hrob. Ten istý tieň teraz dolieha na náš vlastný [ROOT.GetCountry.GetGovernment.GetCourtTitle]. [target_character.GetName] sústredil vládne úrady do jediných rúk a [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] šomrú, že nijaký služobník by nemal stáť tak blízko trónu. Môžeme sa oprieť o [target_character.GetShortNameWithNoTooltip] a poriadok, ktorý jeho pevná ruka prináša, alebo rozbiť radu skôr, než sa naučí vládnuť bez nás." # todo: NEW TRANSLATION
 battle_for_the_strait_events.50.a: "Potrebujeme viac mužov, ako je [target_character.GetShortNameWithNoTooltip]." # todo: NEW TRANSLATION
 battle_for_the_strait_events.50.a.entry: "Potrebujeme viac mužov, ako je on." # todo: NEW TRANSLATION
 battle_for_the_strait_events.50.b: "Dav? Šialenec? Radšej nie." # todo: NEW TRANSLATION
 battle_for_the_strait_events.50.c: "Necháme veci tak, ako sú." # todo: NEW TRANSLATION
 status_quo_preserved_tt: "#italic Súčasný stav zostane zachovaný#!" # todo: NEW TRANSLATION
 battle_for_the_strait_events.50.historical_info: "Abú Abdalláh ibn al-Hakím al-Rundí, narodený v Ronde v roku 1261, postupoval v nasridskej kancelárii, až sa stal najmocnejším vezírom sultána Muhammada III. Od roku 1303 zastával vzácny titul #italic dhū al-wizāratayn#!, pán dvoch vezírskych úradov. Vyjednal Córdobskú zmluvu, v roku 1306 riadil obsadenie Ceuty a ku koncu vlády ho všeobecne považovali za skutočného vládcu emirátu.\n\nJeho moc však netrvala. Počas palácového prevratu v marci 1309 ho veliteľ Atiq ibn al-Mawl zrazil k zemi a jeho telo odhodili a stratilo sa. Jeho vzostup a pád sa stali výstrahou pred nebezpečenstvom, ktoré predstavuje minister mocnejší než jeho kráľ." # todo: NEW TRANSLATION
 battle_for_the_strait_events.51.entry: "$battle_for_the_strait_events.51.title$" # todo: NEW TRANSLATION
 battle_for_the_strait_events.51.title: "Dom vzdelanosti" # todo: NEW TRANSLATION
 battle_for_the_strait_events.51.desc: "Naši učenci už dlho žiadajú, aby [target_location.GetName] dostalo dôstojnú školu, [ShowBuildingTypeName('great_madrasa')], kde by sa pod jednou strechou vyučovalo právo, ako je to vo veľkých mestách východu. [target_character.GetName] má prostriedky na jej výstavbu pri veľkej mešite, kde sa už zhromažďujú veriaci. Takáto nadácia by prilákala študentov a právnikov spoza prielivu a spojila vzdelanosť našich miest so službou [ROOT.GetCountry.GetGovernment.GetRulerTitle]." # todo: NEW TRANSLATION
 battle_for_the_strait_events.51.a: "Založiť [ShowBuildingTypeNameWithNoTooltip('great_madrasa')] pri veľkej mešite." # todo: NEW TRANSLATION
 battle_for_the_strait_events.51.b: "Štátna pokladnica to teraz neutiahne." # todo: NEW TRANSLATION
 battle_for_the_strait_events.51.historical_info: "V roku 1349 založil sultán Júsuf I. Granadskú medresu, #italic Madrasa Yusufiyya#!, pri veľkej mešite na mieste, kde dnes stojí katedrála. Vyučovalo sa v nej právo podľa #italic málikovskej#! školy a bola najvýznamnejšou školou emirátu, porovnateľnou so staršími školami vo Féze a Káhire.\n\nZ jej priestorov vyšli mnohí právnici a pisári, ktorí pracovali v nasridskej kancelárii. Zachovala sa iba jej modlitebňa, jediný zvyšok niekdajšieho intelektuálneho srdca kráľovstva." # todo: NEW TRANSLATION
 wont_have_another_chance_to_build_tt: "#italic Ďalšiu príležitosť získať tieto výhody už nedostaneme#!" # todo: NEW TRANSLATION
 battle_for_the_strait_events.52.entry: "$battle_for_the_strait_events.52.title$" # todo: NEW TRANSLATION
 battle_for_the_strait_events.52.title: "Sieň vyslancov" # todo: NEW TRANSLATION
 battle_for_the_strait_events.52.desc: "Vnútri veľkej #italic qalahurry#! nášho paláca by [target_character.GetName] dal postaviť trónnu sieň hodnú prijatia kráľovských vyslancov. Jej cédrový strop má byť vyrezávaný do podoby siedmich nebies, s tisíckami dielikov nad trónom, aby každé vyslanectvo pochopilo poriadok, ktorému sa podriaďuje. Takáto sieň by o [target_location.GetName] vypovedala jasnejšie než akýkoľvek list, no jej výstavba by nebola lacná." # todo: NEW TRANSLATION
 battle_for_the_strait_events.52.a: "Postaviť sieň a umiestniť pod ňu náš trón." # todo: NEW TRANSLATION
 battle_for_the_strait_events.52.b: "Naši vyslanci sa bez nej zaobídu." # todo: NEW TRANSLATION
 battle_for_the_strait_events.52.historical_info: "Sieň vyslancov, trónna sála paláca Comares, bola postavená za Júsufa I. v polovici 14. storočia a dodnes je najväčšou miestnosťou Alhambry. Z jej trónu prijímali nasridskí sultáni zahraničné vyslanectvá s okázalou slávnostnosťou.\n\nJej kupolový cédrový strop, zostavený z tisícok do seba zapadajúcich dielikov, znázorňuje sedem nebies islamskej kozmológie a trón je umiestnený priamo pod božským vrcholom. V dreve a štuku tak hlásal, že emir vládne podľa samotného nebeského poriadku." # todo: NEW TRANSLATION
 battle_for_the_strait_events.53.entry: "$battle_for_the_strait_events.53.title$" # todo: NEW TRANSLATION
 battle_for_the_strait_events.53.title: "Nový karavanseraj" # todo: NEW TRANSLATION
 battle_for_the_strait_events.53.desc: "Obchodníci, ktorí zapĺňajú naše trhy, potrebujú riadny [ShowBuildingTypeName('funduq')], opevnený hostinec, kde možno bezpečne uskladniť tovar a ubytovať obchodníkov pod ochranou stráží. [target_character.GetName] preň vyčlenil pozemok pri trhu s [ShowGoodsName('silk')] v [target_location.GetName]. Najviac sa oň zasadili obchodníci zo skupiny [ShowCultureGroupName('italian_group')], pretože zabezpečujú väčšinu nášho obchodu a bezpečné sklady pre ich tovar znamenajú aj isté príjmy z cla." # todo: NEW TRANSLATION
 battle_for_the_strait_events.53.a: "Postaviť ho a nechať obchod prúdiť cez naše brány." # todo: NEW TRANSLATION
 battle_for_the_strait_events.53.historical_info: "#italic al-Funduq al-Jadida#!, Kastílčanom známy ako Corral del Carbón, je jediným nasridským karavanserajom, ktorý sa v Ibérii zachoval. Spomína sa už začiatkom 14. storočia a patril manželkám nasridských sultánov. Slúžil ako sýpka a ubytovňa pre obchodníkov pri #italic alcaiceríi#!, ohradenom granadskom trhu s hodvábom.\n\nVeľká časť tohto obchodu bola v cudzích rukách. Granadskému obchodu dominovali janovskí obchodníci a bankári, ktorých lákal hodváb a zlato zo saharských obchodných ciest. Jeden z mestských trhov bol známy jednoducho ako Janovská alhóndiga." # todo: NEW TRANSLATION
 battle_for_the_strait_events.54.entry: "$battle_for_the_strait_events.54.title$" # todo: NEW TRANSLATION
 battle_for_the_strait_events.54.title: "Pojednanie o nákaze" # todo: NEW TRANSLATION
 battle_for_the_strait_events.54.desc: "[target_character.GetName], najvzdelanejšia hlava v našich službách, nám predkladá pojednanie, aké naši lekári ešte nevideli. V rozpore s ustáleným názorom doby [target_character.GetShortNameWithNoTooltip] tvrdí, že veľká úmrtnosť sa prenáša z chorých na zdravých, šíri sa odevmi, nádobami a na preplnených lodiach a že mesto sa môže chrániť izoláciou a starostlivosťou. Duchovní to označia za opovážlivosť voči vôli nebies, no tieto rady nás môžu uchrániť pred ďalšou pohromou." # todo: NEW TRANSLATION
 battle_for_the_strait_events.54.a: "Podporiť dielo a riadiť sa jeho radami." # todo: NEW TRANSLATION
 battle_for_the_strait_events.54.b: "Niet sa čoho báť, je to len obyčajný kašeľ!" # todo: NEW TRANSLATION
 hospitals_benefit_tt: "Ak máme nejaké [ShowBuildingTypeName('hospital')] [Concept('buildings','budov')|e], ich domovské [Concept('locations','lokality')|e] získajú výhodu v podobe [Concept('modifier','modifikátore')|e] [ShowModifier('contagion_practices_modifier')]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 battle_for_the_strait_events.54.historical_info: "Granadský vezír a polyhistor Ibn al-Chatíb napísal okolo roku 1362 dielo #italic Muqni'at al-Sa'il#!, pojednanie o veľkej morovej epidémii, ktorá pred desiatimi rokmi zachvátila Stredomorie. Tvrdil v ňom, že choroba sa šíri nákazou, čo dokazujú skúsenosti s oblečením, nádobami a zamorenými prístavmi, a že jej šírenie možno zastaviť izoláciou.\n\nJeho tvrdenia odporovali prevládajúcej náuke, podľa ktorej pripustiť nákazu znamenalo poprieť, že choroby zosiela Boh. Jeho rukopis sa zachoval v knižnici El Escorialu a predstavuje vzácny hlas zo stredoveku v prospech toho, čo neskoršie veky nazvali karanténou." # todo: NEW TRANSLATION
 battle_for_the_strait_events.55.entry: "Vyslanectvo do Káhiry" # todo: NEW TRANSLATION
 battle_for_the_strait_events.55.title: "Vyslanectvo do mesta [target_location.GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 battle_for_the_strait_events.55.desc: "Pod silným tlakom na vlastných hraniciach sa [target_gra_ruler.GetName] obracia na východ, k jedinému trónu, ktorý ešte môže zvolať vojsko v mene viery. V meste [target_location.GetName] sídli [target_mam_country.GetGovernment.GetRulerTitle] krajiny [target_mam_country.GetName], strážca svätých miest a hostiteľ kalifa, najmocnejší vládca [ShowReligionName('sunni')]. Vyslať posolstvo naprieč celým morom je riskantné a nákladné; odpoveďou môžu byť vojaci, zlato alebo len modlitby. No o pomoc, o ktorú nepožiadame, sa nikdy nedočkáme." # todo: NEW TRANSLATION
 battle_for_the_strait_events.55.a: "Vyslať posla cez more do mesta [target_location.GetNameWithNoTooltip]." # todo: NEW TRANSLATION
 battle_for_the_strait_events.55.a.entry: "Vyslať posla cez more do Káhiry." # todo: NEW TRANSLATION
 battle_for_the_strait_events.55.b: "Zjednotíme veriacich a ubránime sa sami." # todo: NEW TRANSLATION
 battle_for_the_strait_events.55.historical_info: "Keď Kastília v polovici 14. storočia tlačila na Granadu, nasridský dvor vysielal posolstvá cez Stredozemné more do Káhiry, sídla mamlúckeho sultanátu, strážcov Mekky a Mediny a hostiteľov tieňového abbásovského kalifa. Boli prirodzeným adresátom každej prosby vyslovenej v mene sunnitského islamu.\n\nMamlúci, zviazaní vlastnými hranicami a vzdialení cez oceán, neposlali žiadne vojsko. Odpovedali modlitbami za víťazstvo a srdečnými slovami bratstva. Ibn al-Chatíb zachoval túto korešpondenciu medzi Granadou a Káhirou vo svojej zbierke listov #italic Rayḥānat al-Kuttāb#!." # todo: NEW TRANSLATION
 battle_for_the_strait_events.56.title: "Prosba zo západu" # todo: NEW TRANSLATION
 battle_for_the_strait_events.56.desc: "Vyslanectvo z krajiny [target_gra_country.GetName], unavené dlhou cestou, dorazilo na náš [ROOT.GetCountry.GetGovernment.GetCourtTitle]. Hovoria v mene posledného [ShowReligionGroupAdjective('muslim')] trónu na ďalekom západe, ktorý zvierajú [ShowReligionGroupAdjectiveWithNoTooltip('christian')] koruny, a pýtajú sa, akú pomoc pošle strážca svätých miest. Od ich vojny nás delí oceán a naše vlastné hranice nikdy nezostanú dlho pokojné. Veriaci nás však pozorujú a na to, ako odpovieme [target_gra_ruler.GetName], sa tak skoro nezabudne." # todo: NEW TRANSLATION
 battle_for_the_strait_events.56.a: "Zaviazať sa k ich veci ako bratia vo viere." # todo: NEW TRANSLATION
 battle_for_the_strait_events.56.b: "Poslať toľko mužov a peňazí, koľko si môžeme dovoliť, a nič viac." # todo: NEW TRANSLATION
 battle_for_the_strait_events.56.c: "Ponúknuť im modlitby a ponechať naše vojská doma." # todo: NEW TRANSLATION
 gra_gets_nothing_tt: "Diplomati z krajiny [target_gra_country.GetName] sa vrátia domov s myšlienkami, modlitbami a želaniami" # todo: NEW TRANSLATION
 may_give_alliance_military_eco_or_no_help: "[target_mam_country.GetLongName] nám môže, ale nemusí poskytnúť pomoc" # todo: NEW TRANSLATION
 alliance_better_chance_at_good_results_tt: "Naše existujúce [Concept('alliance','aliancia')|e] naznačuje, že je väčšia šanca, že vypočujú našu prosbu" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 battle_for_the_strait_events.60.title: "Meč a kríž" # todo: NEW TRANSLATION
 battle_for_the_strait_events.60.entry: "$battle_for_the_strait_events.60.title$" # todo: NEW TRANSLATION
 battle_for_the_strait_events.60.desc: "Vojna o prieliv sa vlečie a [target_ruler.GetName] sa obracia na bratov-rytierov vojenských rádov, ktorých komendy sú roztrúsené pozdĺž hranice práve na tento účel. Povolanie všetkých ich síl by na vojnu [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')] minulo ich trpezlivosť i peniaze, hoci by to rozdúchalo ich bojovnú horlivosť. Menšia žiadosť by stála menej ich priazne. Alebo ich [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('crown_estate')] môže nechať na pokoji a viesť túto vojnu len vlastnými silami." # todo: NEW TRANSLATION
 battle_for_the_strait_events.60.a: "Povolávať rády do boja v plnej sile." # todo: NEW TRANSLATION
 battle_for_the_strait_events.60.b: "Požiadať len o symbolický príspevok." # todo: NEW TRANSLATION
 battle_for_the_strait_events.60.c: "Nechať rády na ich územiach a panstvách." # todo: NEW TRANSLATION
 battle_for_the_strait_events.6.title: "Hranica zanikla" # todo: NEW TRANSLATION
 battle_for_the_strait_events.6.entry: "$battle_for_the_strait_events.6.title$" # todo: NEW TRANSLATION
 battle_for_the_strait_events.6.desc: "Vojna sa skončila a v [ShowRegionName('iberia_region')] už niet Maur, s ktorým by sa dalo bojovať.\n\nNa túto situáciu nikto nepomyslel. Naše vojenské rády držia hrady pozdĺž hranice, ktorá už neexistuje, strážia priesmyky v krajinách, ktoré teraz patria nám, a poberajú príjmy z provincií, ktoré sme im zverili na obranu. Sú to naši najlepší vojaci a od tohto roku sú to vojaci bez vojny.\n\nVeľmajstri si to uvedomili skôr než my. Už nám píšu a pýtajú sa, čo máme v úmysle." # todo: NEW TRANSLATION
 battle_for_the_strait_events.6.a: "Poveriť ich službou [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('crown_estate')]." # todo: NEW TRANSLATION
 battle_for_the_strait_events.6.b: "Poslať ich za more." # todo: NEW TRANSLATION
 battle_for_the_strait_events.6.c: "Nechať ich, nech si nájdu vlastné poslanie." # todo: NEW TRANSLATION
 bfts_orders_sent_overseas_tt: "Neskoršie udalosti si zapamätajú, že sme naše [Concept('religious_orders','rehoľné rády')|e] poslali za more" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 bfts_orders_given_new_purpose_tt: "Každý $iberian_military_order_type$ v našej krajine natrvalo získa zameranie $zeal_imperial_purpose$, čím sa zvýši jeho cieľová [Concept('zeal','horlivosť')|e]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 battle_for_the_strait_events.8.title: "Bratia, ktorí sa nevrátili" # todo: NEW TRANSLATION
 battle_for_the_strait_events.8.entry: "$battle_for_the_strait_events.8.title$" # todo: NEW TRANSLATION
 battle_for_the_strait_events.8.desc: "Oddiel [target_order.GetName] uviazol v členitom teréne proti presile, ktorá mala výhodu postavenia aj počtu. Nezlomil sa, kým z neho takmer nič nezostalo.\n\nPreživší sú v rukách nepriateľa a za ich prepustenie žiada výkupné. Je vysoké, pretože nepriateľ presne vie, koho zajal: nie odvedencov, ale bratov, ktorí zložili rehoľné sľuby v ráde, ktorý svojich mužov nikdy nenechal napospas osudu.\n\nVeľmajster nás o peniaze nepožiadal. Dával si pozor, aby o ne nepožiadal. A práve to je tá prosba." # todo: NEW TRANSLATION
 battle_for_the_strait_events.8.a: "Zaplatiť výkupné. Nenecháme ich napospas osudu." # todo: NEW TRANSLATION
 battle_for_the_strait_events.8.b: "Zložili sľuby s vedomím rizika." # todo: NEW TRANSLATION
 battle_for_the_strait_events.8.c: "Výkupné nezaplatíme, no môžu verbovať z našich odvedencov." # todo: NEW TRANSLATION
 bfts_orders_left_to_decline_tt: "Každý $iberian_military_order_type$ v našej krajine si zachová zníženú cieľovú [Concept('zeal','horlivosť')|e] o hodnotu $zeal_no_heathen_threat$" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 cas_retaliate_with_raids_tt: "[target_cas_country.GetName] môže podniknúť odvetné nájazdy na [Concept('locations','lokality')|e], ktoré vlastníme v dosahu krajiny [target_cas_country.GetAdjectiveWithNoTooltip], a tým poškodiť našu [Concept('prosperity','prosperitu')|e]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 mor_retaliate_with_raids_tt: "[target_mor_country.GetName] môže podniknúť odvetné nájazdy na [Concept('locations','lokality')|e], ktoré vlastníme v dosahu krajiny [target_mor_country.GetAdjectiveWithNoTooltip], a tým poškodiť našu [Concept('prosperity','prosperitu')|e]" # todo: NEW TRANSLATION # todo: CONCEPT CASE

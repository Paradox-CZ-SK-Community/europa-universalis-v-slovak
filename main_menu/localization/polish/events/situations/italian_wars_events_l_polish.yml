l_polish:
 italian_wars.1.title: "The $italian_group$ vojny" # todo: CHANGED
 italian_wars.1.desc.a: "Temné ruky za zatvorenými dverami a nekonečné intriky iných veľmocí okolo [ShowRegionName('italy_region')] viedli k bezprecedentnému diplomatickému rozvratu. V dôsledku toho je naša pozícia na polostrove a náš vplyv naň spochybňované. V tejto hodine nebezpečenstva nesmieme zaváhať. Víťazstvo v [ShowRegionNameWithNoTooltip('italy_region')] nám iste zaistí miesto medzi veľmocami!" # todo: NEW TRANSLATION
 italian_wars.1.desc.b: "V [ShowRegionName('italy_region')] vypukla vojna. Zástavy cudzích dobyvateľov sa zbiehajú, aby zmocnili sa veľkého bohatstva, ktoré leží na našom polostrove. Nikdy predtým sa náš región nedostal do takého mocenského zápasu, keď veľmoci obkolesujú našu vlasť ako hladné supy. Je čas, aby náš ľud uchopil meč a štít a bránil našu slobodu, inak sa staneme obeťou expanzívnych tendencií cudzincov..." # todo: NEW TRANSLATION
 italian_wars.1.a: "Kocky sú hodené." # todo: NEW TRANSLATION
 italian_wars.1.b: "Spojte sa s [GetUniqueInternationalOrganization('foreign_league_hre').GetLeaderCountry.GetNameWithNoTooltip]!" # todo: NEW TRANSLATION
 italian_wars_explanation_tooltip1: "Počas tohto obdobia budú štáty v [ShowRegionNameWithNoTooltip('italy_region')] schopné brániť sa pripojením sa k #italic $italian_group$ Lige#!.\n" # todo: CHANGED
 italian_wars_explanation_tooltip2: "Cudzie krajiny môžu vytvoriť vlastné #italic Foreign Leagues# v snahe rozšíriť svoj vplyv v regióne.\n" # todo: NEW TRANSLATION
 italian_wars_explanation_tooltip3: "[rivals|e] a [enemies|e] vodcov #italic Foreign League#! sa môžu zapojiť, aby pomohli #italic $italian_group$ Ligám#! vojenskou intervenciou alebo pomocou peňazí a vojakov\n" # todo: CHANGED
 italian_wars_explanation_tooltip4: "Lídri každej ligy získajú prístup k [ShowPeaceTreatyTypeName('dissolve_league_peace_deal')] [peace_treaty|e]" # todo: RETRANSLATED ENGLISH
 iw_italian_league_merc_efficiency_tt: "Ako člen #italic $italian_group$ Ligy#! sa náš [ShowModifierTypeName('mercenary_maintenance_efficiency')] odvíja od toho, koľko z [ShowRegionNameWithNoTooltip('italy_region')] naša Liga ovláda. Pri maximálnom dosahu (#Y 301#! miest) to poskytuje až #G +33%#! [ShowModifierTypeNameWithNoTooltip('mercenary_maintenance_efficiency')]." # todo: NEW TRANSLATION
 italian_wars.1.historical_info: "Vojny $italian_group$ (1494–1559) boli sériou násilných konfliktov o nadvládu nad Talianskom, ktoré sa hlavne viedli medzi Francúzskom a Španielskom, pričom do tohto stretu veľmocí bola zapojená značná časť Európy. Začali, keď Karol VIII. Francúzsky v roku 1494 vtrhol do Talianska a dobyl Neapol, no Maximilián I. Habsburský a Izabela Kastílska a Ferdinand Aragonský, katolícki králi Španielska, sa rýchlo ponáhľali na pomoc pápežovi, aby ho vyhnali. Kráľ Francúzska potom v roku 1499 opäť obsadil Miláno, Janov a Neapol, ale Španielsko ich v roku 1503 z Neapola vyhnalo späť a upevnilo tak kontrolu nad južným Talianskom, a pápež Július II. utvoril alianciu, aby vytlačil Francúzov zo severného Talianska. O niekoľko rokov neskôr František I. Francúzsky obnovil francúzske nároky na Miláno, ktoré bolo dobyté v roku 1515, ale v roku 1525 utrpel rozhodujúcu porážku pri Pávii proti cisárovi Karolovi V., ktorý bol zároveň španielskym kráľom Karolom I., a bol zajatý. František I. bol prepustený po tom, čo sa formálne vzdal všetkých francúzskych nárokov v Taliansku, ale potom sa spojil s Anglickom, pápežom, Benátkami a Florenciou, čo vyústilo do vypálenia Ríma nemeckými landsknechtmi Karola V. v roku 1527, k mieru s pápežom a k cisárskej korunovácii Karola V. v Bologni v roku 1529. Vojny nakoniec skončili v roku 1559 mierom v Cateau-Cambrésis, pričom španielski Habsburgovci zostali dominantnou mocnosťou v Taliansku na 150 rokov." # todo: CHANGED
 italian_wars.20.title: "Cena kondotiéra" # todo: NEW TRANSLATION
 italian_wars.20.desc.a: "[target_character.GetName], kapitán [target_merc.GetName], zastavil postup a poslal oznámenie požadujúce prejednanie podmienok zmluvy [target_character.GetHerHis]. Kampaň sa natiahla ďaleko za rámec pôvodnej dohody a [target_character.GetShortNameWithNoTooltip] nebude kráčať ani jediný deň bez ďalšieho odplatu.\n\nMôžeme požiadavke vyhovieť a ponechať [target_merc.GetNameWithNoTooltip] v našej službe, alebo odmietnuť a riskovať, že [target_character.GetShortNameWithNoTooltip] vezme spoločnosť preč ešte pred rozhodnutím kampane." # todo: NEW TRANSLATION
 italian_wars.20.desc.b: "[target_merc.GetName] sa stala neposednou a ich zástupcovia prišli do tábora požadovať prejednanie pôvodných podmienok zmluvy. Keďže nejde o jedného kapitána, rokovanie prebieha za spoločnosť ako celok a ich páka je značná, kým kampaň zostáva nerozhodnutá.\n\nMusíme rozhodnúť, ako reagovať skôr, než [target_merc.GetNameWithNoTooltip] stratí trpezlivosť úplne." # todo: NEW TRANSLATION
 italian_wars.20.desc.c: "[target_merc.GetName] poslala oznámenie požadujúce prejednanie svojej zmluvy. Kampaň trvá omnoho dlhšie, než očakávali, a bez ďalšej odmeny sa ich oddanosť našej veci stáva neistou.\n\nMusíme zvážiť náklady splnenia ich požiadaviek proti riziku straty ich služby." # todo: NEW TRANSLATION
 italian_wars.20.a: "Splníme ich požiadavky." # todo: NEW TRANSLATION
 italian_wars.20.b: "Odmietame. Zmluva platí." # todo: NEW TRANSLATION
 italian_wars.20.c: "[ROOT.GetCountry.GetGovernment.GetRulerOrRegent.GetShortNameWithNoTooltip] bude osobne viesť tieto rokovania." # todo: NEW TRANSLATION
 mercs_among_the_ranks_of_target_merc_are_reigned_in_tt: "Spoločnosť akceptuje nové podmienky a bez ďalších incidentov obnovuje zmluvu" # todo: NEW TRANSLATION
 mercs_extract_coin_and_supplies_from_the_land_tt: "Žoldnieri získavajú mince a zásoby z okolitých krajín na naše náklady" # todo: NEW TRANSLATION
 target_province_loses_prosperity_extreme_penalty_tt: "Každé [location|e] v [target_province.GetName] stratí [ShowNamedValue('prosperity_extreme_penalty')|+=2%] [prosperity|e]" # todo: NEW TRANSLATION
 italian_wars.21.title: "Veteráni skúsení bojom" # todo: NEW TRANSLATION
 italian_wars.21.desc: "Veteráni [target_army.GetName], otužení neúprosnými kampaňami konfliktu $italian_group$, sa vrátili do tábora pri [target_location.GetName] nesúc znaky ťažko vybojovaných stretnutí. Ich dôstojníci hovoria o mužoch premenených ohňom, ktorých inštinkty a disciplína boli prebrúsené omnoho ďalej než len samotným výcvikom.\n\nAko sa rozhodneme oceniť ich skúsenosti, to formuje charakter našich síl na roky dopredu." # todo: NEW TRANSLATION
 italian_wars.21.a: "Nechajme ich pokope. Ich puto je ich sila." # todo: NEW TRANSLATION
 italian_wars.21.b: "Ich odvaha formovala dušu nášho národa." # todo: NEW TRANSLATION
 italian_wars.21.c: "[ROOT.GetCountry.GetGovernment.GetRulerOrRegent.GetShortNameWithNoTooltip] bude dohliadať na cvičenia týchto veteránov." # todo: NEW TRANSLATION
 italian_wars.22.title: "Problém dezertérov" # todo: NEW TRANSLATION
 italian_wars.22.desc: "Predĺžený boj v [ShowRegionName('italy_region')] veľmi zaťažil tých, ktorí ho nesú. K nášmu [ROOT.GetCountry.GetGovernment.GetCourtTitle] dorazili správy o vojakoch opúšťajúcich svoje posty v rastúcom počte, poháňaní vyčerpaním a pochybnosťami o príčine, za ktorú majú bojovať. Hlasy medzi stavmi začali otvárane oznamovať svoj nesúhlas a nálada v našom kráľovstve sa posunula smerom k niečomu nebezpečne blízkemu vzdoru.\n\nMusíme rozhodnúť, ako na toto nepokojné obdobie odpovedať skôr, než sa to ďalej rozšíri. Môžeme dezertérov odsúdiť a urobiť z nich príklad tým, ktorí zlyhajú, pripomínajúc všetkým slúžiacim, že povinnosť nepozná ústup. Alebo môžeme držať líniu silou vôle, prijímajúc náklady pokračujúcej angažovanosti a požadovať to isté od našich okolo nás." # todo: NEW TRANSLATION
 italian_wars.22.a: "Zbabelci a zradcovia, všetci do jedného." # todo: NEW TRANSLATION
 italian_wars.22.b: "Ani krok späť. Držíme pevne." # todo: NEW TRANSLATION
 italian_wars.23.title: "Zradný generál" # todo: NEW TRANSLATION
 italian_wars.23.desc: "[target_character2.GetName], veliteľ [target_army.GetName], učinil znepokojujúce návrhy voči zahraničným mocnostiam. Dostali sa k nám správy, že [target_character2.GetShortNameWithNoTooltip] môže prikyvovať prísľubom našich nepriateľov, a jeho správanie na pochodnej trati príliš nepomáha rozptýliť naše podozrenia.\n\n[target_character1.GetName] musí konať, skôr než sa táto zradu rozvinie do otvorenej defekcie." # todo: NEW TRANSLATION
 italian_wars.23.a: "Preč s ním, zradca!" # todo: NEW TRANSLATION
 italian_wars.23.b: "[target_character2.GetHerHis|U] lojalita má cenu. Zaplatíme ju." # todo: NEW TRANSLATION
 italian_wars.23.c: "[ROOT.GetCountry.GetGovernment.GetRulerOrRegent.GetShortNameWithNoTooltip] postaví [target_character2.GetShortNameWithNoTooltip] na [target_character2.GetHerHis] miesto." # todo: NEW TRANSLATION
 target_character2_wont_attempt_to_flee_for_10_years_tt: "[target_character2.GetShortNameWithNoTooltip] sa nebude snažiť utiecť počas #Y 10#! rokov" # todo: NEW TRANSLATION
 italian_wars.24.title: "Rozkol medzi spojencami" # todo: NEW TRANSLATION
 italian_wars.24.desc: "V rámci [target_io.GetNameWithNoTooltip] vyvrcholiť napätie medzi naším [ROOT.GetCountry.GetGovernment.GetCourtTitle] a [target_country.GetName]. To, čo začalo ako drobný spor, sa rozšírilo do otvoreného rozkolu a [target_country.GetName] teraz otvorene spochybňuje naše odhodlanie k spoločnej veci Ligy.\n\nRozdelené spojenectvo neprospeje nikomu okrem zahraničných mocností, ktoré sledujú každý náš krok. Môžeme sa pokúsiť napraviť tento priepasť starostlivou diplomaciou, alebo pevne stáť a nechať následky dopadnúť kam ich majú patriť. Tak či onak, musíme konať skôr, než sa tento rozkol rozšíri ďalej medzi rady [target_io.GetNameWithNoTooltip]." # todo: NEW TRANSLATION
 italian_wars.24.a: "Podáme im olivovú vetvu." # todo: NEW TRANSLATION
 italian_wars.24.b: "Ich sťažnosti nás netýkajú." # todo: NEW TRANSLATION
 ruler_or_regent_skillful_diplomacy_saves_the_day: "Šikovná a diplomatická povaha [ROOT.GetCountry.GetGovernment.GetRulerOrRegent.GetShortName] zmiernila situáciu" # todo: NEW TRANSLATION
 italian_wars.25.title: "Bratsvo zbraní" # todo: NEW TRANSLATION
 italian_wars.25.desc: "Uprostred zápasu, ktorý zmáha [target_io.GetName], náš [ROOT.GetCountry.GetGovernment.GetCourtTitle] a [target_country.GetName] našli neočakávanú spoločnú reč. Zdieľané strádanie a spoločný nepriateľ urobili to, čo roky diplomacie samy nedokázali, zväzujúc naše dva národy spôsobom, ktorý presahuje obyčajné spojenectvo.\n\nTento rastúci súzvuk je vzácny v časoch vojny a nesmie byť premrhaný. Môžeme túto dohodu formalizovať a posilniť väzby medzi našimi dvorami, alebo si zachovať vlastné plány a venovať sa naliehavejším záležitostiam. Voľba ovplyvní, ako nás bude [target_country.GetNameWithNoTooltip] vnímať v nasledujúcich rokoch." # todo: NEW TRANSLATION
 italian_wars.25.a: "Posilníme tieto väzby." # todo: NEW TRANSLATION
 italian_wars.25.b: "Máme naliehavejšie záležitosti." # todo: NEW TRANSLATION
 good_relations_will_help_keep_em_in_league_tt: "Dobré vzťahy medzi našimi [countries|e] môžu pomôcť udržať ich v našej lige" # todo: NEW TRANSLATION
 italian_wars.26.title: "Urážka bez odpovede" # todo: NEW TRANSLATION
 italian_wars.26.desc: "[target_character.GetName] z [target_country.GetName] spôsobil značné urazenie pred zhromaždenými zástupcami oboch Líg. Ich slová spochybnili naše vedenie [our_io.GetName] a náš postavenie medzi mocnosťami [ShowRegionNameWithNoTooltip('italy_region')], a takéto obvinenie sa len tak ľahko neodstráni.\n\nNeodpovedať by len posilnilo [target_character.GetShortNameWithNoTooltip] a vyvolalo ďalšiu považnosť zo strany iných. Môžeme tlačiť na riešenie a požadovať zúčtovanie, hoci tým riskujeme eskaláciu, na ktorú ani jedna Liga nemusí byť pripravená. Alternatívou je prehryznúť urážku teraz a čakať na vhodnejší čas." # todo: NEW TRANSLATION
 italian_wars.26.a: "Nenecháme si túto urážku." # todo: NEW TRANSLATION
 italian_wars.26.b: "Zúčtovanie príde, ale nie dnes." # todo: NEW TRANSLATION
 italian_wars.27.title: "Lekcie vojny" # todo: NEW TRANSLATION
 italian_wars.27.desc: "Neustále kampane po [ShowRegionName('italy_region')] priniesli viac než krv a skazu. Naši dôstojníci a učenci sa vrátili s ťažko nadobudnutými poznatkami, vykovanými v kotli otvoreného boja a prevzatými z metód našich protivníkov. Nové myšlienky zakorenili v našom [ROOT.GetCountry.GetGovernment.GetCourtTitle] a teraz je otázkou, ako ich najlepšie využiť.\n\nMôžeme sa zaväzovať k trvalému štúdiu toho, čo nás vojny naučili, investujúc do zdokonalenia našej remeselnej doktríny. Alternatívne môžeme tieto poznatky použiť okamžite v teréne, nasmerujúc ich tam, kde môžu priniesť hmatateľné výsledky pre naše armády a naše krajiny." # todo: NEW TRANSLATION
 italian_wars.27.a: "Prehĺbme to, čo sme sa naučili." # todo: NEW TRANSLATION
 italian_wars.27.b: "Naše armády potrebujú výsledky, nie teóriu." # todo: NEW TRANSLATION
 italian_wars.28.title: "Inžinier z [target_location.GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 italian_wars.28.desc: "Inžinier s významnou reputáciou dorazil do nášho [ROOT.GetCountry.GetGovernment.GetCourtTitle], nesúc listiny odporúčania a detailné návrhy nových obliehacích konštrukcií. [new_character.GetName], pochádzajúci z [target_location.GetName], je jedným z niekoľkých brilantných umov pritiahnutých do divadla $italian_group$, kde vojny posunuli vojenské inžinierstvo na nové hranice. [new_character.GetHerHis|U] vedomosti, ak sa uplatnia, by mohli dať našim silám rozhodujúcu výhodu pri prerážaní nepriateľských múrov.\n\n[ new_character.GetHerHis|U] služby nie sú lacné a [new_character.GetSheHe] to otvorene priznáva. Napriek tomu sa len zriedka naskytnú takéto príležitosti počas života v angažovaných kampaniach." # todo: NEW TRANSLATION
 italian_wars.28.a: "Zaplaťte [new_character.GetHerHis] odmenu. Dobrý inžinier stojí za každú mincu." # todo: NEW TRANSLATION
 italian_wars.28.b: "Teraz si to nemôžeme dovoliť. Odošlite [new_character.GetHerHim]." # todo: NEW TRANSLATION
 iw28_no_engineer_for_years_tt: "Keď inžinier odíde, v týchto kruhoch sa to rozšíri a môže uplynúť nejaký čas, kým nás vyhľadá ďalší kalibru [new_character.GetHerHis]" # todo: NEW TRANSLATION
 engineer_boosts_short_term_research_tt: "Metódy inžiniera otvárajú nové smery výskumu pre našich učencov, prinášajúc okamžité pokroky v našom bádani" # todo: NEW TRANSLATION
 engineer_boosts_literacy_efforts_tt: "Kontakt s technickými spismi a nákresmi inžiniera povzbudzuje širší záujem o učenie medzi našimi vzdelanými vrstvami" # todo: NEW TRANSLATION
 italian_wars.4.title: "Pozvanie do ligy" # todo: NEW TRANSLATION
 italian_wars.4.desc: "Napätie v našom regióne rastie a realita vojny sa pre náš ľud stáva príliš krutou. Ako reakciu na nápor teroru spôsobeného zahraničnými votrelcami sa [actor.GetName] rozhodol založiť [target_io.GetName]. Následne nám poslali pozvanie, ktoré má najvyšší diplomatický význam..." # todo: NEW TRANSLATION
 italian_wars.4.a: "Prijímame!" # todo: NEW TRANSLATION
 italian_wars.4.b: "Nemôžeme riskovať našu neutralitu." # todo: NEW TRANSLATION
 italian_wars.4.c: "Sme verní [target_country.GetNameWithNoTooltip]!" # todo: NEW TRANSLATION
 italian_wars.9.title: "Pomoc od [actor.GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 italian_wars.9.desc: "Posol od [actor.GetName] dorazil na náš dvor s oznámením o ich pomoci v prebiehajúcej obrannéj vojne. Zrejme ich znepokojuje rovnováha síl, a preto sú ochotní nám pomôcť." # todo: NEW TRANSLATION
 italian_wars.9.a: "Pre teraz stojíme proti spoločnému nepriateľovi..." # todo: NEW TRANSLATION
 italian_wars.10.title: "Vyváženie síl" # todo: NEW TRANSLATION
 italian_wars.10.desc: "Prebiehajúca vojna, ktorá sužuje krajiny [target.GetName], ohrozuje rovnováhu síl v [ShowRegionName('italy_region')]. Nemôžeme dovoliť, aby si ďalšia Liga vytvorila pevnosť v regióne na náš úkor. Preto sme sa rozhodli poslať pomoc [target.GetLongNameWithNoTooltip], aby sme posilnili ich snahu brániť svoje územia pred našimi protivníkmi." # todo: NEW TRANSLATION
 italian_wars.10.a: "Pošleme im mužov do armád." # todo: NEW TRANSLATION
 italian_wars.10.b: "Dostanú cenné zlato." # todo: NEW TRANSLATION
 italian_wars.11.title: "Bod bez návratu" # todo: NEW TRANSLATION
 italian_wars.11.desc: "Napätie zmietaní [ShowRegionName('italy_region')] dosiahlo bod zlomu. Posledné prímeria, ktoré držali rozhnevané Ligy od seba, sú teraz zrušené, odhodené v horúčave okamihu. [target_character.GetName] a vodcovia nepriateľskej Ligy sa vzdali všetkých predstierania mieru. Scéna je pripravená na otvorenú a úplnú vojnu." # todo: NEW TRANSLATION
 italian_wars.11.a: "Nemôže byť žiadny kompromis, žiadna kapitulácia." # todo: NEW TRANSLATION
 all_leaders_of_leagues_annul_all_truces_tt: "Každý líder Ligy [international_organization_leader|e] zrušil svoje prímeria s krajinami v [ShowRegionName('italy_region')] ako aj navzájom" # todo: NEW TRANSLATION
 as_long_as_90_tension_foreign_leaders_can_call_in_league_members_offensively_tt: "Pokým [situation_tension|e] zostáva na úrovni #Y 90#! alebo vyššej, zahraniční vodcovia Ligy môžu povolať svojich [members|e], aby sa pripojili do útočných vojen proti akýmkoľvek [country|e] v [ShowRegionName('italy_region')]" # todo: NEW TRANSLATION
 italian_wars.100.title: "Koniec vojen $italian_group$" # todo: CHANGED
 italian_wars.100.desc: "Dekády zápasov a neustálych bojov o ochranu nášho regiónu skončili pod vedením našej mocnej Ligy. Tieň cudzích dobyvateľov už viac neohrozuje naše hranice a náš ľud sa pozerá do budúcnosti s nádejou na prosperitu!" # todo: NEW TRANSLATION
 italian_wars.100.a: "Fortius quo fidelius!" # todo: NEW TRANSLATION
 italian_wars.100.b: "Naša suverenita je nepochybná!" # todo: NEW TRANSLATION
 demand_vassalization_from_members_tt: "Ako víťazný líder Ligy požiadame ostatných členov o vazalizáciu" # todo: NEW TRANSLATION
 league_locations_owned_desc: "Lokality vlastnené našou ligou" # todo: NEW TRANSLATION
 iw_send_aid_tt: "Rozhodneme sa pomôcť vybranému [country|e] formou [manpower|e] alebo [gold|e]." # todo: NEW TRANSLATION
 italian_wars.200.desc: "Dlho očakávaný záver vojen $italian_group$ nastal. Rozpustením všetkých cudzích líg, ktoré sa snažili podrobiť naše krajiny, sa na našom polostrove opäť vrátili pokoj a prosperita. Otvorila sa cesta k nášmu vzostupu ako skutočných vládcov [ShowRegionName('italy_region')]." # todo: CHANGED
 italian_wars.200.a: "Éra [target_country.GetNameWithNoTooltip] práve začína!" # todo: NEW TRANSLATION
 italian_wars.200.desc_foreign: "Napriek tomu, že naše armády postupovali hlboko do [ShowRegionName('italy_region')], $italian_group$ Ligy odolali a odrazili naše sily. Naše ambície na polostrove zostali nenaplnené a musíme prijať túto horkú porážku." # todo: NEW TRANSLATION
 italian_wars.200.b: "Nezabudneme na túto potupu." # todo: NEW TRANSLATION
 italian_wars.300.title: "Víťazstvo [target_io.GetNameWithNoTooltip] v [ShowRegionNameWithNoTooltip('italy_region')]" # todo: NEW TRANSLATION
 italian_wars.300.desc: "Napriek tuhému a neústupnému odporu počas desaťročí je [ShowRegionName('italy_region')] teraz pevne a do veľkej miery v našich rukách. Tí, ktorí sa snažili zasahovať do našich plánov, sa teraz skrývajú za vysokými múrmi a utekajú pred pochodom našich veľkých vojsk. Dnes nastáva nová éra regiónu a naše nepochybniteľné nároky naň!" # todo: NEW TRANSLATION
 italian_wars.300.a: "Nech žije [target_character.GetNameWithNoTooltip]!" # todo: NEW TRANSLATION
 italian_wars.301.desc: "Vojny $italian_group$ sa uzavreli horkým koncom. Zahraničná mocnosť si uplatnila nadvládu nad [ShowRegionName('italy_region')]. Napriek našim snahám sme tomuto výsledku nemohli zabrániť — teraz sa musíme prispôsobiť novému poriadku, ktorý sa ujal polostrova." # todo: NEW TRANSLATION
 italian_wars.301.a: "Musíme prijať túto porážku." # todo: NEW TRANSLATION
 italian_wars.400.title: "[ShowCultureGroupNameWithNoTooltip('italian_group')] patová situácia" # todo: NEW TRANSLATION
 italian_wars.400.desc: "Napriek našim najlepším snahám ovplyvniť priebeh situácie [ShowSituationName('italian_wars')] sa zdá, že štáty v nej, ako aj cudzí votrelci, zlyhali pri zjednotení regiónu alebo pri výraznom presadení svojho vplyvu..." # todo: NEW TRANSLATION
 italian_wars.400.a: "Vojna — na čo je dobrá?" # todo: NEW TRANSLATION

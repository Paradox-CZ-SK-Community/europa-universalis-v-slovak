l_polish:
 western_schism.1.title: "Rozkol v katolíckej cirkvi" # todo: NEW TRANSLATION
 western_schism.1.desc: "Rozkol postihol [ShowReligionName('catholic')] a vrhol $curia$ do malicherného frakcionárstva!\n\nPo smrti posledného [GetInternationalOrganization('catholic_church').GetLeaderTitle] sa frakcia kardinálov zo [ShowCultureGroupName('italian_group')] snaží získať Svätú stolicu späť, keďže je už dlho pod kontrolou [ShowCultureGroupName('french_group')], zatiaľ čo frakcia [ShowCultureGroupNameWithNoTooltip('french_group')] ju odmieta odovzdať.\n\nAni jedna strana neustúpi a [GetInternationalOrganization('catholic_church').GetName] zostáva bez svojich pastierov. Kým sa rozdelenie nevyrieši, veriaci musia sami rozhodnúť, kto skutočne hovorí v mene božej vôle." # todo: CHANGED (predtym: Rozkol postihol [ShowReligionName('catholic')] a vrhol $curia$ do malicherného frakcionárstva!\n\nAj keď bola Cirkev už )
 western_schism.1.a: "Toto nie je dobré." # todo: CHANGED
 western_schism.3.title: "[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('clergy_estate')] nespokojní s rozkolom" # todo: NEW TRANSLATION
 western_schism.3.desc: "Stále sme si nevybrali stranu v rozkole medzi [target_schism_pope_cardinal.GetName] a [target_schism_opponent_cardinal.GetName]. Naši kardináli nás naliehavo žiadajú, aby sme oficiálne rozhodli, koho podporiť." # todo: NEW TRANSLATION
 western_schism.3.a: "Toto rozhodnutie môže ešte počkať..." # todo: NEW TRANSLATION
 western_schism.4.title: "[jan_hus.GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 western_schism.4.desc: "V srdci [ROOT.GetCountry.GetCapital.GetArea.GetAltAdjective('L')] sa rozhorieva plameň náboženského nesúhlasu, podnecovaný mocnými vetrami zmien. [jan_hus.GetName], charizmatický [ShowCultureName('czech')] kňaz a učenec, sa postavil proti vnímanej korupcii [GetInternationalOrganization('catholic_church').GetName]. [jan_hus.GetHerHis|U] slová nachádzajú odozvu u obyčajných ľudí a nový náboženský smer, [ShowReligionAdjective('hussite')], začína klíčiť.\n\n[jan_hus.GetNameWithNoTooltip] káže proti prepychu a nadbytku [GetInternationalOrganization('catholic_church').GetNameWithNoTooltip], volajúc po návrate k jednoduchosti a čistote raného kresťanstva. [jan_hus.GetHerHis|U] nasledovníci, známi ako [ShowReligionAdjectiveWithNoTooltip('hussite')], prijímajú [jan_hus.GetHerHis] učenie a ich horlivosť deň čo deň rastie. Ustanovený poriadok sa trasie, lebo slová [jan_hus.GetLastNameWithNoTooltip] spochybňujú autoritu [GetInternationalOrganization('catholic_church').GetNameWithNoTooltip] a [GetInternationalOrganization('hre').GetName]." # todo: NEW TRANSLATION # todo: COUNTRY CASE
 western_schism.4.historical_info: "Jan Hus, známy aj ako Johannes Hus, bol teológ a filozof, ktorý sa stal jedným z prvých reformátorov katolicizmu. Bol inšpiráciou pre husitské hnutie, predchodcu luteranizmu. Narodil sa chudobným rodičom, no bol vychovaný na kňaza v snahe uniknúť chudobe. Ako kňaz sa postavil proti mnohým aspektom katolíckej cirkvi v Čechách. Keď bol zvolený pápež Alexander V, vydal pápežskú bulu na jeho exkomunikáciu a počas koncilu v Konstancii, keď Západný rozkol skončil, Jan Hus prišiel prezentovať svoje názory na roztržky s cirkvou, no bol okamžite zatknutý a uväznený. Odmietol svoje názory odvolať a 6. júla 1415 bol upálený na hranici za kacírstvo. Jeho nasledovníci založili nové náboženstvo a počas nasledujúcich desaťročí čelili piatim križiackym výpravám. Husitská viera pretrvala v Čechách takmer dve storočia." # todo: NEW TRANSLATION
 western_schism.4.a: "Má zaujímavé učenie..." # todo: NEW TRANSLATION
 western_schism.5.title: "Erozia viery" # todo: NEW TRANSLATION
 western_schism.5.desc: "Zmätenie spôsobené konfliktom medzi [target_schism_pope_cardinal.GetName] a [target_schism_opponent_cardinal.GetName] vážne narušilo stabilitu nášho [ROOT.GetCountry.GetFlavorRank]. Neistota ohľadom obsadenia Svätej stolice šíri pochybnosti o riadnom cirkevnom slávení a pomaly eroduje vieru ľudu." # todo: NEW TRANSLATION
 western_schism.5.a: "Budeme sa modliť za rýchle ukončenie ich sporov." # todo: NEW TRANSLATION
 western_schism.5.b: "Možno by náš ľud mal preskúmať niektoré alternatívy." # todo: NEW TRANSLATION
 western_schism.6.title: "Strety medzi [opponent_support_location.GetNameWithNoTooltip] a [pope_support_location.GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 western_schism.6.desc: "Ľudia z [opponent_support_location.GetName], horliví stúpenci [target_schism_opponent_cardinal.GetName], sa nedávno dostali do konfliktu s [pope_support_location.GetName], zanietenými nasledovníkmi [target_schism_pope_cardinal.GetName]. Obe frakcie teraz požiadali [target_ruler.GetName], aby zaujal jasné stanovisko na ich strane." # todo: NEW TRANSLATION
 western_schism.6.a: "[opponent_support_location.GetNameWithNoTooltip] má jednoznačne pravdu." # todo: NEW TRANSLATION
 western_schism.6.b: "Podporiť ľudí z [pope_support_location.GetNameWithNoTooltip]." # todo: NEW TRANSLATION
 western_schism.6.c: "Nech si medzi sebou vyriešia tieto malicherné spory." # todo: NEW TRANSLATION
 western_schism_resolution_impact_positive.tt: "Zvolená strana získa určitú podporu v $western_schism$" # todo: NEW TRANSLATION
 western_schism_resolution_impact_negative.tt: "Zvolená strana stratí určitú podporu v $western_schism$" # todo: NEW TRANSLATION
 western_schism.7.title: "Rozkvitajúci obchod v [ShowRegionNameWithNoTooltip('italy_region')]" # todo: NEW TRANSLATION
 western_schism.7.desc: "Vďaka úsiliu [target_schism_pope_cardinal.GetName] v [ShowRegionName('italy_region')] obchod s regiónom prospieva. Naši [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')] sú s týmto stavom veľmi spokojní a vítajú zabezpečené záujmy v regióne." # todo: NEW TRANSLATION
 western_schism.7.a: "[ROOT.GetCountry.Custom('common_string_positive')]" # todo: NEW TRANSLATION
 italian_trade: "Väzby na [ShowRegionNameWithNoTooltip('italy_region')]" # todo: NEW TRANSLATION
 western_schism_8_10_common_string: "Naša pozícia v [GetSituationByKey('western_schism').GetName] vyvolala v častiach našej krajiny verejné pobúrenie. Ľudia z [target_location.GetName] sa začali ozbrojovať a žiadajú, aby sme podporili frakciu" # todo: NEW TRANSLATION
 western_schism.8.title: "Verejná podpora pre [target_schism_opponent_cardinal.GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 western_schism.8.desc: "$western_schism_8_10_common_string$ [target_schism_opponent_cardinal.GetName] namiesto toho." # todo: NEW TRANSLATION
 western_schism.8.a: "Nevzdáme sa takých malicherných požiadaviek." # todo: NEW TRANSLATION
 western_schism.8.b: "[target_schism_opponent_cardinal.GetNameWithNoTooltip] môže byť predsa len pre nás najlepšia voľba." # todo: NEW TRANSLATION
 western_schism.9.title: "[target_schism_opponent_cardinal.GetNameWithNoTooltip] odmeňuje lojalitu" # todo: NEW TRANSLATION
 western_schism.9.desc: "[target_schism_opponent_cardinal.GetName], jediný pravý [GetInternationalOrganization('catholic_church').GetLeaderTitle], odmenil našu lojalitu špeciálnym grantom, ktorý nám umožňuje väčšie práva v rámci [GetInternationalOrganization('catholic_church').GetName]." # todo: NEW TRANSLATION
 western_schism.9.a: "[ROOT.GetCountry.Custom('common_string_positive')]" # todo: NEW TRANSLATION
 western_schism.10.title: "Verejná podpora pre [target_schism_pope_cardinal.GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 western_schism.10.desc: "$western_schism_8_10_common_string$ [target_schism_pope_cardinal.GetName] namiesto toho." # todo: NEW TRANSLATION
 western_schism.10.a: "Nech sa pokúsia." # todo: NEW TRANSLATION
 western_schism.10.b: "Majú silný argument." # todo: NEW TRANSLATION
 western_schism_11_12_common_string: "v prebiehajúcom boji o vedenie [GetInternationalOrganization('catholic_church').GetName], [target_country.GetName] vychválil náš ľud! Chvália odolnosť [ROOT.GetCountry.GetName] a silnú vieru, ktorú prejavujeme v tak nestabilných časoch.\n\nHoci ich lichotivé slová sú zjavnou lestou za účelom získať našu podporu, môže nám to stále priniesť osoh, nech už otvorene vyjadríme podporu pre" # todo: NEW TRANSLATION
 western_schism_11_12_common_string_2: "alebo použiť túto pochvalu pre našu vlastnú agendu v rámci [GetInternationalOrganization('catholic_church').GetNameWithNoTooltip]." # todo: NEW TRANSLATION
 western_schism.11.title: "[target_country.GetNameWithNoTooltip] chváli naše presvedčenie" # todo: NEW TRANSLATION
 western_schism.11.desc: "Silný stoupenec [target_schism_pope_cardinal.GetName], $western_schism_11_12_common_string$ [target_schism_pope_cardinal.GetNameWithNoTooltip], $western_schism_11_12_common_string_2$" # todo: NEW TRANSLATION
 western_schism.11.a: "[target_schism_pope_cardinal.GetNameWithNoTooltip] je náš [GetInternationalOrganization('catholic_church').GetLeaderTitle]!" # todo: NEW TRANSLATION
 western_schism.11.b: "Využiť túto pochvalu v rámci cirkvi." # todo: NEW TRANSLATION
 western_schism.12.desc: "Silný stoupenec [target_schism_opponent_cardinal.GetName], $western_schism_11_12_common_string$ [target_schism_opponent_cardinal.GetNameWithNoTooltip], $western_schism_11_12_common_string_2$" # todo: NEW TRANSLATION
 western_schism.12.a: "[target_schism_opponent_cardinal.GetNameWithNoTooltip] je náš [GetInternationalOrganization('catholic_church').GetLeaderTitle]!" # todo: NEW TRANSLATION
 western_schism_13_14_common_string: "a v opozícii voči zvyšku stavov. Toto vnútorné rozdelenie, spôsobené rozkolom vo vnútri samotnej [GetInternationalOrganization('catholic_church').GetName], hrozí rozštiepením našej krajiny na viacero frakcií, ak nebudeme konať opatrne." # todo: NEW TRANSLATION
 western_schism.13.title: "Proti všetkým očakávaniam" # todo: NEW TRANSLATION
 western_schism.13.desc: "[target_estate.GetName], zložený z ľudí bohabojných k [ROOT.GetCountry.GetReligion.GetGodName], sa ocitol v podpore [target_schism_pope_cardinal.GetName] $western_schism_13_14_common_string$" # todo: NEW TRANSLATION
 western_schism.13.a: "Postavte sa na stranu [target_estate.GetNameWithNoTooltip]." # todo: NEW TRANSLATION
 western_schism.13.b: "Budeme stáť s väčšinou." # todo: NEW TRANSLATION
 western_schism.14.desc: "[target_estate.GetName], zložený z ľudí bohabojných k [ROOT.GetCountry.GetReligion.GetGodName], sa ocitol v podpore [target_schism_opponent_cardinal.GetName] $western_schism_13_14_common_string$" # todo: NEW TRANSLATION
 western_schism.15.title: "Putujúci kazateľ" # todo: NEW TRANSLATION
 western_schism.15.desc: "Erozia našej viery spôsobená [ShowSituationName('western_schism')] hlboko zasiahla dôveru obyvateľov [unrest_location_scope.GetName]. Do tohto vakua dôvery a stability prišiel [target_character.GetName] so [target_character.GetHerHis] kázňami herézy a obvineniami z korupcie. Hoci [target_character.GetSheHe] tvrdí, že je skutočný [ROOT.GetCountry.GetReligion.GetAdjective], [target_character.GetHerHis] prednášky povzbudili niektorých v [unrest_location_scope.GetNameWithNoTooltip] obrátiť sa k nebezpečným ideám, a možno budeme musieť konať rýchlo, aby sa táto heréza nerozšírila ďalej." # todo: CHANGED
 western_schism.15.a: "[target_character.GetHerHis|U] nápady neznejú až tak zle." # todo: NEW TRANSLATION
 western_schism.15.b: "Nemôžeme dovoliť, aby [target_character.GetNameWithNoTooltip] pokračoval." # todo: NEW TRANSLATION
 western_schism.1000.title: "The Price of #italic Oboedientia#!" # todo: NEW TRANSLATION
 western_schism_action_event_tt: "Požiadať jedného z kandidátov, aby nám finančne pomohol." # todo: NEW TRANSLATION
 western_schism.1001.desc: "[target.GetName] odmenil našu lojalitu spôsobom hodným dôležitého a prestížneho [ROOT.GetCountry.GetFlavorRank] ako sme my. S našou podporou všetci určite prijmú [target.GetNameWithNoTooltip] za pravého [GetInternationalOrganization('catholic_church').GetLeaderTitle]." # todo: NEW TRANSLATION
 western_schism.1001.a: "[ROOT.GetCountry.Custom('common_string_positive')]" # todo: NEW TRANSLATION
 western_schism.1002.desc: "[target.GetName] pohŕdal našou podporou a odmietol nás patrične rešpektovať. Túto hanebnú urážku nemožno nechať tak a mali by sme vážne prehodnotiť naše spojenectvá, pretože jasne nie sme oceňovaní." # todo: NEW TRANSLATION
 western_schism.1002.a: "[ROOT.GetCountry.Custom('common_string_negative')]" # todo: NEW TRANSLATION
 western_schism.1100.title: "Falošná podpora [target_country.GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 western_schism.1100.desc: "Naše vzťahy s [target_country.GetName] sú napäté a počas [ShowSituationName('western_schism')] sa to ešte zhoršilo. Hoci náš vplyv v rámci [GetInternationalOrganization('catholic_church').GetName] nie je nekonečný, môžeme ho využiť na to, aby sme naklonili váhy na našu stranu." # todo: NEW TRANSLATION
 western_schism.1100.a: "Získame vplyv, ktorý si zaslúžime!" # todo: NEW TRANSLATION
 western_schism.1100.b: "Mali by sme sa snažiť nezvyšovať nepriateľstvá." # todo: NEW TRANSLATION
 western_schism.1101.title: "Závažná urážka" # todo: NEW TRANSLATION
 western_schism.1101.desc: "Morálne skorumpovaní diplomati z [origin_country.GetName] pracovali na znížení nášho vplyvu v [GetInternationalOrganization('catholic_church').GetName]. Túto urážku nemožno nechať bez odozvy a mali by sme to považovať za dôvod ukázať im ich miesto." # todo: NEW TRANSLATION
 western_schism.1101.a: "[ROOT.GetCountry.Custom('common_string_we_must_do_something')]" # todo: NEW TRANSLATION
 western_schism.1200.title: "[target_country.GetNameWithNoTooltip] vzbudzuje podozrenie" # todo: NEW TRANSLATION
 western_schism.1200.desc: "Prebiehajúci [ShowSituationName('western_schism')] spôsobil nestabilitu v rámci [GetInternationalOrganization('catholic_church').GetName] a existencia falošného [GetInternationalOrganization('catholic_church').GetLeaderTitle] priniesla medzi veriacimi neistotu. Nedávno [target_ruler.GetName] z [target_country.GetLongName] upútal našu pozornosť diplomatickým incidentom, ktorý naznačuje, že [target_ruler.GetHerHis] oddanosť patrí pretendentovi, nie nám. Mali by sme poslať delegáciu, aby preverila [target_ruler.GetHerHis] úmysly a uistila sa, že [target_ruler.GetSheHe] je na správnej ceste." # todo: NEW TRANSLATION
 western_schism.1200.a: "Poslať delegáciu do [target_country.GetNameWithNoTooltip]." # todo: NEW TRANSLATION
 western_schism.1200.b: "Máme dôležitejšie veci na práci." # todo: NEW TRANSLATION
 western_schism.1201.title: "Pápežská delegácia" # todo: NEW TRANSLATION
 western_schism.1201.desc: "Diplomat [target_schism_pope_cardinal.GetName] dorazil do nášho [ROOT.GetCountry.GetGovernment.GetCourtTitle]. Hoci ešte nie sme istí, aký je jeho oficiálny účel, pravdepodobne chce, aby ho považovali za oficiálnu delegáciu [GetInternationalOrganization('catholic_church').GetLeaderTitle] a preverili naše vlastné spojenectvá v rámci [ShowSituationName('western_schism')]. Hoci ich nemôžeme priamo odmietnuť, stále budeme môcť bez pochýb preukázať naše oddanosti." # todo: NEW TRANSLATION
 western_schism.1201.a: "Samozrejme, [target_schism_pope_cardinal.GetNameWithNoTooltip] je pravý [GetInternationalOrganization('catholic_church').GetLeaderTitle]" # todo: NEW TRANSLATION
 western_schism.1201.b: "Sme lojálni [target_schism_opponent_cardinal.GetNameWithNoTooltip]." # todo: NEW TRANSLATION
 western_schism.1300.title: "Výzva na koncil" # todo: NEW TRANSLATION
 western_schism.1300.desc: "Vďaka našej súčasnej výhodnej pozícii v Kúrii sme získali dostatočnú podporu na zvolanie koncilu v [target_location.GetName]. Hoci legitimita koncilu bude iste z mnohých v rámci [GetInternationalOrganization('catholic_church').GetName] spochybňovaná, naši podporovatelia ho vezmú na vedomie, čím preukážeme našu moc a podporu väčšiny kardinálov. Aj keď nemôžeme okamžite ukončiť [ShowSituationName('western_schism')], dokážeme autoritu nášho [GetInternationalOrganization('catholic_church').GetLeaderTitle] a urobíme dôležitý krok k vyriešeniu konfliktu v náš prospech." # todo: NEW TRANSLATION
 western_schism.1300.a: "[ROOT.GetCountry.Custom('common_string_positive')]" # todo: NEW TRANSLATION
 western_schism.1300.a.tt: "Každý člen viery [THIS.GetReligion.GetName] zmení svoj názor na [ROOT.GetCountry.GetAltAdjective('A')] o [ShowBiasValue('schism_called_council')|+=0]" # todo: NEW TRANSLATION # todo: COUNTRY CASE
 western_schism.1301.title: "Koncil v [target_location.GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 western_schism.1301.desc: "Diplomati [council_country.GetName] dorazili do nášho [ROOT.GetCountry.GetGovernment.GetCourtTitle] a zvolávajú zástupcov nášho [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] na koncil v [target_location.GetName]. Hoci legitimita koncilu je už spochybňovaná ich oponentmi, môže to byť dôležitý míľnik pri riešení [ShowSituationName('western_schism')]." # todo: NEW TRANSLATION
 western_schism.1301.a: "Zúčastnime sa koncilu na podporu." # todo: NEW TRANSLATION
 western_schism.1301.b: "Musíme uznať autoritu koncilu." # todo: NEW TRANSLATION
 western_schism.1301.c: "Odmietame drzosť týchto pretendentov." # todo: NEW TRANSLATION
 western_schism.2000.title: "Katolícka cirkev opäť zjednotená!" # todo: NEW TRANSLATION
 western_schism.2000.desc: "Po koncile sa Cirkev opäť zjednotila vďaka snahám [winner_country.GetName], pod novou autoritou. [GetInternationalOrganization('catholic_church').GetName] zostáva celá a neporušená, no autorita [GetInternationalOrganization('catholic_church').GetLeaderTitle] sa v tomto období podstatne oslabila. Dúfajme, že to našu vieru nepoškodilo navždy. Nech nový [GetInternationalOrganization('catholic_church').GetLeaderTitle] preukáže svoju spôsobilosť." # todo: CHANGED
 western_schism.2000.title.unresolved: "Schizma pomaly vyhasína" # todo: NEW TRANSLATION
 western_schism.2000.desc.unresolved: "Nepodarilo sa zvolať koncil, ktorý by spor vyriešil, a súperiace nároky pre nedostatok podpory vyhasli. [ShowSituationName('western_schism')] sa končí bez toho, aby bol niektorý z kandidátov uznaný za legitímneho [GetInternationalOrganization('catholic_church').GetLeaderTitle], a autorita úradu [GetInternationalOrganization('catholic_church').GetName] je značne oslabená. Dúfajme, že naša viera tým neutrpela nenapraviteľnú škodu." # todo: NEW TRANSLATION
 western_schism.2000.a: "[ROOT.GetCountry.Custom('common_string_positive')]" # todo: NEW TRANSLATION
 western_schism.2100.title: "Nový [GetInternationalOrganization('catholic_church').GetLeaderTitle] pre Cirkev" # todo: NEW TRANSLATION
 western_schism.2100.desc.common: "Vďaka našim opakovaným snahám vyriešiť [ShowSituationName('western_schism')] počas koncilu sa ukázalo, že náš kandidát je skutočne legitimný [GetInternationalOrganization('catholic_church').GetLeaderTitle]. Hoci niektorí stále lpia na heretickom pretendentovi, získali sme ohromujúcu väčšinu podpory na vyhlásenie [ShowSituationName('western_schism')] za ukončený." # todo: NEW TRANSLATION
 western_schism.2100.desc.a: "$western_schism.2100.desc.common$\n\nSpolu s podporou, ktorú sme získali, bude jednoduché vybrať vhodného kandidáta z našich vlastných radov a vrátiť pápežskú autoritu do večného mesta [ShowLocationName('rome')]." # todo: NEW TRANSLATION
 western_schism.2100.desc.b: "$western_schism.2100.desc.common$\n\nVďaka nášmu vplyvu v kúrii budeme schopní udržať zavedený zvyk pápežstva v [ShowLocationName('avignon')]." # todo: NEW TRANSLATION
 western_schism.2100.a: "[ROOT.GetCountry.Custom('common_string_positive')]" # todo: NEW TRANSLATION
 western_schism.20.title: "Dvaja biskupi, jedno sídlo" # todo: NEW TRANSLATION
 western_schism.20.desc: "V našej krajine sa uvoľnilo biskupské sídlo a sotva vychladlo, už si naň robili nárok dvaja muži: jeden s pečaťou Ríma, druhý s pečaťou vzdoropápeža. Obaja na seba uvalili #R exkomunikáciu#! a obaja žiadajú, aby sme ich uznali. Diecéza je zatiaľ bez vedenia, jej kňazi zmätení a veriaci sa pýtajú [ROOT.GetCountry.GetGovernment.GetRuler.GetName], ktorého pastiera majú poslúchať." # todo: NEW TRANSLATION
 western_schism.20.a: "Sídlo patrí rímskemu kandidátovi." # todo: NEW TRANSLATION
 western_schism.20.b: "Sídlo patrí druhému kandidátovi." # todo: NEW TRANSLATION
 western_schism.20.c: "Nech sa hádajú, príjmy budú naše." # todo: NEW TRANSLATION
 western_schism.21.title: "Odopretie poslušnosti" # todo: NEW TRANSLATION
 western_schism.21.desc: "Naši právnici a učenci naliehajú na [ROOT.GetCountry.GetGovernment.GetRuler.GetAltAdjective('A')] s odvážnou radou: kým tiaru nosia dvaja muži, nedlžíme poslušnosť #Y ani jednému#! z nich a mali by sme ju odoprieť obom, kým sa kresťanstvo opäť nesjednotí. [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] sú zhrození; pokladníci koruny, oslobodení od pápežských poplatkov, sa potichu radujú." # todo: NEW TRANSLATION # todo: COUNTRY CASE
 western_schism.21.a: "Neuznáme nijakého pápeža, kým sa Cirkev opäť nesjednotí." # todo: NEW TRANSLATION
 western_schism.21.b: "Zostávame vernými synmi Cirkvi." # todo: NEW TRANSLATION
 western_schism.22.title: "Súperiaci vyberači annát" # todo: NEW TRANSLATION
 western_schism.22.desc: "V priebehu jedného týždňa dorazili dvaja pápežskí výbercovia daní. Každý z nich má listiny od svojho pána a žiada #Y annáty#! zo všetkých cirkevných obročí v našej krajine: príjmy za prvý rok z každého cirkevného menovania, ktoré vraj patria jedinému pravému pápežovi. Na našom dvore sa na seba pozerajú s odporom, no obaja zároveň hladne pokukujú po našej pokladnici." # todo: NEW TRANSLATION
 western_schism.22.a: "Rím dostane, čo mu patrí." # todo: NEW TRANSLATION
 western_schism.22.b: "Zaplaťme mužovi druhého kandidáta." # todo: NEW TRANSLATION
 western_schism.22.c: "Pošlime oboch preč a peniaze zostanú tu." # todo: NEW TRANSLATION
 western_schism.23.title: "Vyhlásenie jubilejného roka" # todo: NEW TRANSLATION
 western_schism.23.desc: "Jeden zo súperiacich pápežov vyhlásil #Y jubilejný rok#! a sľúbil úplné odpustenie hriechov každému pútnikovi, ktorý príde uctiť hroby apoštolov. Jeho sok celé podujatie odsúdil ako podvod na veriacich a nehanebnú snahu získať peniaze od pútnikov. Naši ľudia si už balia pútnické palice a žiadajú nás o požehnanie na cestu." # todo: NEW TRANSLATION
 western_schism.23.a: "Nech veriaci putujú a nebo im žehná." # todo: NEW TRANSLATION
 western_schism.23.b: "Podvod vydávaný za milosť. Zakážme ho." # todo: NEW TRANSLATION
 western_schism.24.title: "Predavači odpustkov" # todo: NEW TRANSLATION
 western_schism.24.desc: "Naše trhoviská zaplavili predavači odpustkov. Ponúkajú listiny s pečaťou jedného či druhého pápeža a každý prisahá, že len jeho pergamen otvára nebeské brány. Prostý ľud vyprázdňuje mešce a odchádza domov znepokojený, hundrajúc, že spásu vydražili a že Cirkev s dvoma hlavami sa sotva dokáže zhodnúť, ktorý kľúč pasuje do zámky." # todo: NEW TRANSLATION
 western_schism.24.a: "Povoľme im to a vezmime si podiel zo zisku." # todo: NEW TRANSLATION
 western_schism.24.b: "Vyžeňme týchto šarlatánov z našich ulíc." # todo: NEW TRANSLATION
 western_schism.25.title: "Kazateľ posledných dní" # todo: NEW TRANSLATION
 western_schism.25.desc: "Na cestách našej krajiny sa potuluje vychudnutá postava v kajúcnom rúchu. [apocalyptic_preacher.GetName] zhromažďuje davy v každej dedine a volá, že Cirkev s dvoma hlavami je znamením konca dní, o ktorom sa prorokovalo, a že len #Y bičovanie#! dokáže očistiť skazené duchovenstvo. Roľníci plačú a bosí nasledujú [apocalyptic_preacher.GetHerHis|l]; [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] sa na to pozerajú s čoraz väčším znepokojením." # todo: NEW TRANSLATION
 western_schism.25.a: "Nech káže. V takýchto časoch ľudia potrebujú nádej." # todo: NEW TRANSLATION
 western_schism.25.a.tt: "#Y [apocalyptic_preacher.GetName]#! bude môcť kázať. Jeho hnutie môže prerásť naše možnosti." # todo: NEW TRANSLATION
 western_schism.25.b: "Umlčme toho šialenca, skôr než nás všetkých zatratí." # todo: NEW TRANSLATION
 western_schism.26.title: "Flagelanti sa radikalizujú" # todo: NEW TRANSLATION
 western_schism.26.desc: "To, čo sa začalo ako pokánie, sa zvrhlo na vzburu. Nasledovníci [apocalyptic_preacher.GetName] sa teraz v našich uliciach bičujú do krvi a vykrikujú, že každý kňaz slúži Antikristovi a každý pápež je podvodník. Hnutie už neposlúcha naše rozkazy a cesty sa hemžia divokými zrakmi a bičmi." # todo: NEW TRANSLATION
 western_schism.26.a: "Rozdrvme ich, nech to stojí akokoľvek veľa krvi." # todo: NEW TRANSLATION
 western_schism.26.b: "Obráťme ich hnev proti falošnému pápežovi." # todo: NEW TRANSLATION
 western_schism.27.title: "Kardinál váha" # todo: NEW TRANSLATION
 western_schism.27.desc: "Jeden z našich kardinálov sa stal terčom tajného úsilia konkurenčnej kúrie, ktorá mu ponúka biskupské sídlo bohatšie než všetky, ktorými môžeme disponovať. Zatiaľ sa nepriklonil na nijakú stranu, no jeho listy sú čoraz vyhýbavejšie a zdá sa, že jeho vernosť má svoju cenu. [ROOT.GetCountry.GetGovernment.GetRuler.GetAltAdjective('A')] musí rozhodnúť, či sa ju oplatí zaplatiť." # todo: NEW TRANSLATION # todo: COUNTRY CASE
 western_schism.27.a: "Vykúpme jeho svedomie skôr, než ho predá." # todo: NEW TRANSLATION
 western_schism.27.b: "Nech odíde. Kúpený človek nemá nijakú cenu." # todo: NEW TRANSLATION
 western_schism.28.title: "List svätice" # todo: NEW TRANSLATION
 western_schism.28.desc: "Zbožná žena, ktorú si po celej krajine vážia pre jej vízie, poslala nášmu dvoru plamenný list. Nalieta [ROOT.GetCountry.GetGovernment.GetRuler.GetName], aby neochvejne stál za právoplatným rímskym pápežom a podporil jeho vec hlasmi našich kardinálov. Zbožní si list podávajú z ruky do ruky a [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] čakajú, či na jej výzvu odpovieme." # todo: NEW TRANSLATION
 western_schism.28.a: "Svätica hovorí pravdu. Nech nás počuje celé kresťanstvo." # todo: NEW TRANSLATION
 western_schism.28.b: "Nedovolíme, aby nám vládli vízie nejakej ženy." # todo: NEW TRANSLATION
 western_schism.29.title: "Štedrosť kúrie" # todo: NEW TRANSLATION
 western_schism.29.desc: "Náš vyvolený pápež, ktorý si chce udržať našich kardinálov na svojej strane, zahrnul náš dvor darmi: relikviami v pozlátených relikviároch, štedrými dišpenzmi a kopou peňazí, ktorá by zatočila hlavou každému. Jeho listy prekypujú vďačnosťou aj očakávaniami. Prijať dary znamená ešte väčšmi sa zaviazať jeho poslušnosti; odmietnuť ich znamená nazvať celý ten obchod priamo pred ním #R svätokupectvom#!." # todo: NEW TRANSLATION
 western_schism.29.a: "S vďakou ich prijmime a upevnime naše puto." # todo: NEW TRANSLATION
 western_schism.29.b: "Je to svätokupectvo. Nič z toho neprijmeme." # todo: NEW TRANSLATION
 western_schism.30.title: "Spor učencov" # todo: NEW TRANSLATION
 western_schism.30.desc: "Učenci teologickej fakulty našej univerzity sa rozdelili na dva tábory v otázke, ktorá je rovnako nebezpečná ako závažná: môže #Y všeobecný koncil#! súdiť pápeža a zosadiť ho v záujme Cirkvi? Mladší učenci to považujú za jediný liek na schizmu; starší v tom vidia cestu do záhuby. Obe strany sa obracajú na [ROOT.GetCountry.GetGovernment.GetRuler.GetAltAdjective('A')], aby spor rozhodol." # todo: NEW TRANSLATION # todo: COUNTRY CASE
 western_schism.30.a: "Koncil môže súdiť aj pápeža. Nech sa to vie." # todo: NEW TRANSLATION
 western_schism.30.b: "Je to heréza. Odsúďme ju z každej kazateľnice." # todo: NEW TRANSLATION
 western_schism.31.title: "Koho majú naši kardináli nasledovať?" # todo: NEW TRANSLATION
 western_schism.31.desc: "Naši kardináli osedlávajú mulice, aby sa vydali na konzistórium. Pred odchodom čakajú na slovo od [ROOT.GetCountry.GetGovernment.GetRuler.GetAltAdjective('G')]: ktorej poslušnosti majú prepožičať váhu našich červených klobúkov? Každým dňom, čo schizma trvá, rastie tlak a aj mlčanie začína vyzerať ako rozhodnutie." # todo: NEW TRANSLATION # todo: COUNTRY CASE
 western_schism.31.a: "Za Rím a mesto samotného apoštola." # todo: NEW TRANSLATION
 western_schism.31.b: "Za druhého kandidáta a reformu Cirkvi." # todo: NEW TRANSLATION
 western_schism.31.c: "Nech každý nasleduje svoje svedomie." # todo: NEW TRANSLATION
 western_schism.32.title: "Prázdna rímska pokladnica" # todo: NEW TRANSLATION
 western_schism.32.desc: "Pokladnica svätého Petra je prázdna. Našim kardinálom neplatia a tí šomrú po chodbách, zatiaľ čo v Avignone sa konkurenčná kúria vystatuje desiatkami z polovice kresťanstva, hodvábom a hostinami. [ROOT.GetCountry.GetGovernment.GetRuler.GetAltAdjective('I')] sa obáva, že ak Rím nedokáže platiť svojim služobníkom, dlho si ich neudrží." # todo: NEW TRANSLATION # todo: COUNTRY CASE
 western_schism.32.a: "Predajme úrady. Rím nesmie žobrať." # todo: NEW TRANSLATION
 western_schism.32.b: "Požiadajme verné kniežatá o finančnú pomoc." # todo: NEW TRANSLATION
 western_schism.33.title: "Rímsky dav" # todo: NEW TRANSLATION
 western_schism.33.desc: "Rímsky ľud zaplnil ulice a jeho rev otriasa oknami paláca: pápežstvo #Y musí zostať v talianskych rukách#!, kričia, a beda kardinálovi, ktorý by ho chcel znovu odviezť do Francúzska. Dav otvorene hrozí kúrii a [ROOT.GetCountry.GetGovernment.GetRuler.GetName] si musí vybrať medzi jeho zúrivosťou a dôstojnosťou Cirkvi." # todo: NEW TRANSLATION
 western_schism.33.a: "Podriaďme sa vôli rímskeho ľudu." # todo: NEW TRANSLATION
 western_schism.33.b: "Vyčistime ulice a obnovme poriadok." # todo: NEW TRANSLATION
 western_schism.34.title: "Vzájomná exkomunikácia" # todo: NEW TRANSLATION
 western_schism.34.desc: "Z oboch kúrií dorazila správa naraz: každý pápež slávnostne #R exkomunikoval#! toho druhého a s ním každé knieža, kňaza i sedliaka, ktorý by nasledoval nesprávneho pastiera. Naši ľudia sa s hrôzou prežehnávajú a šepkajú, že nech sa obrátia na ktorúkoľvek stranu, budú zatratení, a že sviatosti teraz možno nemajú v polovici kresťanstva nijakú hodnotu." # todo: NEW TRANSLATION
 western_schism.34.a: "Upokojme ich veľkolepým obradom viery." # todo: NEW TRANSLATION
 western_schism.34.b: "Strach je páka. Využime ho a zmocnime sa cirkevného zlata." # todo: NEW TRANSLATION
 western_schism.35.title: "Relikvia pochybnej pravosti" # todo: NEW TRANSLATION
 western_schism.35.desc: "Kláštor v našej krajine odhalil relikviu, ktorá má podľa jeho tvrdenia požehnať pápeža, ak je právoplatným Kristovým námestníkom. K jej bránam už prúdia pútnici. Súperiaci duchovní kričia o #R falzifikáte#! a žiadajú, aby ju spálili. [ROOT.GetCountry.GetGovernment.GetRuler.GetName] musí rozhodnúť, či sa tento zázrak stane zástavou našej viery, alebo dovolíme chladnokrvným učencom, aby ho rozobrali na kusy." # todo: NEW TRANSLATION
 western_schism.35.a: "Dar z nebies. Uctime ho pred všetkými." # todo: NEW TRANSLATION
 western_schism.35.b: "Nech vzdelanci dôkladne preskúmajú tento „zázrak“." # todo: NEW TRANSLATION
 western_schism.36.title: "Žoldnieri pre kúriu" # todo: NEW TRANSLATION
 western_schism.36.desc: "Pod pečaťou nášho vyvoleného pápeža dorazil zúfalý list: prosí o zbrane, mužov a peniaze, aby silou ocele vydobyl Pápežský štát z rúk uzurpátora, keďže slová ani hlasy mu nepomohli. Oddiel ostrieľaných kopijníkov je pripravený vyraziť, ak [ROOT.GetCountry.GetGovernment.GetRuler.GetName] otvorí pokladnicu a zaplatí im." # todo: NEW TRANSLATION
 western_schism.36.a: "Pošlime oddiel. Náš pápež dostane svojich vojakov." # todo: NEW TRANSLATION
 western_schism.36.b: "Máme vlastné vojny. Nech počká." # todo: NEW TRANSLATION
 western_schism.37.title: "Neutrálny panovník" # todo: NEW TRANSLATION
 western_schism.37.desc: "Naši najprefíkanejší radcovia sa k nám nakláňajú a radia nám využiť situáciu: neprikloniť sa ani k jednému pápežovi, hovoria, ale ponúkať svoju vernosť obom a nechať ich, nech sa predháňajú v zlate a výsadách. Takto by sme mohli slušne naplniť pokladnicu, no zbožní varujú, že panovníka, ktorému nikto neverí, nikto ani nemiluje." # todo: NEW TRANSLATION
 western_schism.37.a: "Sľúbme všetko, nezaviažme sa nikomu a profitujme z oboch strán." # todo: NEW TRANSLATION
 western_schism.37.b: "Nie sme nijakí nerozhodní. Vyhlásme podporu nášmu pápežovi." # todo: NEW TRANSLATION
 western_schism.38.title: "Chýry o všeobecnom koncile" # todo: NEW TRANSLATION
 western_schism.38.desc: "Kresťanstvom sa šíri odvážna chýra: kardináli z #Y oboch#! táborov, unavení pohoršením, by vraj mohli zvolať veľký koncil, aby súdil súperiacich pápežov a zosadil ich oboch naraz. Pre niektorých je to jediná cesta k mieru; pre iných čistá heréza, veď kto sa môže postaviť nad Kristovho námestníka? Na [ROOT.GetCountry.GetGovernment.GetRuler.GetAltAdjective('A')] sa nalieha, aby sa priklonil na jednu stranu, ešte než sa koncil vôbec zvolá." # todo: NEW TRANSLATION # todo: COUNTRY CASE
 western_schism.38.a: "Koncil môže byť našou jedinou cestou k mieru. Podporíme ho." # todo: NEW TRANSLATION
 western_schism.38.b: "Nijaký koncil nestojí nad Kristovým námestníkom. Odsúďme ho." # todo: NEW TRANSLATION
 western_schism.39.title: "Tretí kandidát" # todo: NEW TRANSLATION
 western_schism.39.desc: "Neuveriteľné sa stalo skutočnosťou. Koncil kardinálov vyhlásil oboch pápežov za zosadených a #Y zvolil tretieho#!, aby schizmu ukončil. Kresťanstvo má teraz troch otcov a ani jednu hlavu. Ani jeden z bývalých pápežov sa nechce vzdať svojho trónu a každý európsky dvor si musí nanovo položiť otázku, kde teraz sídli pravá Kristova Cirkev." # todo: NEW TRANSLATION
 western_schism.39.a: "Koncil prehovoril. Uznávame jeho pápeža." # todo: NEW TRANSLATION
 western_schism.39.b: "Zostávame verní pápežovi, ktorého sme vždy uznávali." # todo: NEW TRANSLATION
 western_schism.2200.desc: "S konečným úsilmom sme našli jednoduché, no elegantné riešenie problémov vyvolaných [ShowSituationName('western_schism')]. Nútením oboch strán, aby sa vzdali nároku na Svätú stolicu a vynútením novej voľby, môžeme opäť ustanoviť legitimného [GetInternationalOrganization('catholic_church').GetLeaderTitle] a sústrediť sa na zhojenie rán spôsobených týmto obdobím sporov. Nový [GetInternationalOrganization('catholic_church').GetLeaderTitle] bude určite výborný v tejto úlohe, zjednotí rozhádaných kňazov a potvrdí pravú doktrínu viery.„" # todo: NEW TRANSLATION

l_polish:
 movements.10.title: "Latinitas" # todo: NEW TRANSLATION
 movements.10.desc: "Na oslavu návratu do veľkého Rímskeho impéria sa verní občania [target_location.GetName], hovoriaci [ShowLanguageFamilyName('romance_language_family')], opäť nadchli pre idey jazyka [ShowLanguageName('latin_language')] a starovekej kultúry [ShowCultureName('roman_culture')].\n\nTíto noví Rímani usilujú o obnovenie slávy Rímskeho impéria. Sú hrdí na svoje dedičstvo a dychtia šíriť svoju kultúru a vplyv po celom svete." # todo: NEW TRANSLATION
 movements.10.a: "[ROOT.GetCountry.Custom('common_string_positive')]" # todo: NEW TRANSLATION
 movements.10.b: "Aj my sme [ShowCultureNameWithNoTooltip('roman_culture')]!" # todo: NEW TRANSLATION
 movements.10.tt: "[ShowMovementDefinitionName('roman_culture_movement')] sa objaví v [target_location.GetName]" # todo: NEW TRANSLATION
 movements.20.title: "Emanácia Jedného" # todo: NEW TRANSLATION
 movements.20.desc: "Okruh učencov a filozofov z [ShowMovementDefinitionName('hellenism_religion_movement')] začal učiť, že najvyššia pravda neleží v písme, ale v rozume: všetko bytie prúdi z Jedného, cez emanácie božského intelektu, až do nášho materiálneho sveta.\n\nOpierajúc sa o Platóna, Plotína a Prokla, títo myslitelia obozretne poukazujú na paralely s [ShowReligionGroupName('christian')]. To Jedno, hovoria, nie je až tak odlišné od Boha: večné, nad všetkými predikciami, zdroj všetkého bytia.\n\nAvšak [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] sú ostražití a odsudzujú to ako podlé [ShowReligionAdjective('hellenism_religion')] pohanstvo.\n\nDovolíme tomuto filozofickému obrodeniu rozkvitnúť, alebo prejdeme k jeho potlačeniu?" # todo: NEW TRANSLATION
 movements.20.a: "Hľadanie Jedného vedie k pravde." # todo: NEW TRANSLATION
 movements.20.b: "Táto filozofia zvádza duše na scestie." # todo: NEW TRANSLATION
 movements.20.tt: "[ShowMovementDefinitionName('hellenism_religion_movement')] sa šíri v [ROOT.GetCountry.GetCapital.GetName]" # todo: NEW TRANSLATION

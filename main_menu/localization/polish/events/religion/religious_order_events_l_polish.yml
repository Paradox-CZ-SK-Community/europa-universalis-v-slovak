l_polish:
 religious_orders.1.title: "Zbožný odkaz" # todo: NEW TRANSLATION
 religious_orders.1.desc: "Zomrel bohatý mecenáš a v závete odkázal malé imanie rádu [target_order.GetName]. Bratia už hovoria o nových strechách pre svoje kláštory a o chlebe pre chudobných pri ich bránach. Podľa zvyku im takéto dary patria, no takáto veľká suma málokedy unikne pozornosti [target_character.GetName]." # todo: NEW TRANSLATION
 religious_orders.1.a: "Nech si to bratia ponechajú." # todo: NEW TRANSLATION
 religious_orders.1.b: "Zabavme to pre pokladnicu." # todo: NEW TRANSLATION
 religious_orders.2.title: "Rád [target_order.GetNameWithNoTooltip] hľadá nové pôsobisko" # todo: NEW TRANSLATION
 religious_orders.2.desc: "Rád [target_order.GetName] prerástol svojich niekoľko kláštorov a bratia nás žiadajú o priestor na rozšírenie. Vyhliadli si [target_location.GetName], kde by postavili nový kláštor a získavali novicov z okolitej vidieckej oblasti. Pozemok môžeme darovať alebo si ho ponechať a oni čakajú na naše rozhodnutie." # todo: NEW TRANSLATION
 religious_orders.2.a: "Darujme im pozemok." # todo: NEW TRANSLATION
 religious_orders.2.b: "Radšej obdarujme miestny stav [GetEstateNameWithNoTooltip('clergy_estate')]." # todo: NEW TRANSLATION
 religious_orders.2.c: "Odmietnime ich." # todo: NEW TRANSLATION
 locals_embrace_the_order_desc: "Ľudia si bratov okamžite obľúbia a zakrátko sa zdá, akoby nový kláštor stál medzi nimi odjakživa" # todo: NEW TRANSLATION
 order_works_to_bolster_local_wealth_desc: "Bratia sa pustia do odvodňovania polí a opráv ciest a kraj vďaka ich práci zbohatne" # todo: NEW TRANSLATION
 order_projects_central_authority_desc: "Keď sa rád usadil v [target_location.GetName], rozkazy [target_character.GetName] teraz platia o niečo ďalej než predtým" # todo: NEW TRANSLATION
 order_appreciates_new_holding_desc: "Bratia prijmú dar s vďakou a v kláštoroch rádu sa s úctou hovorí o priazni [target_character.GetName]" # todo: NEW TRANSLATION
 religious_orders.3.title: "Rád [target_order.GetNameWithNoTooltip] roznecuje vieru" # todo: NEW TRANSLATION
 religious_orders.3.desc: "Rád [target_order.GetName] rozdúchal v krajine náboženskú horlivosť a bratia sú hrdí na zápal, ktorý podnietili. Niektorí by túto horlivosť radi obrátili na mestá, v ktorých sa naša viera ešte neujala, aby získali duše, na ktoré farári nikdy nedosiahli. Iní len hundrú, že takáto nálada sa málokedy dlho drží na uzde, najmä voči bohatým členom cechov." # todo: NEW TRANSLATION
 religious_orders.3.a: "Požehnajme túto horlivosť." # todo: NEW TRANSLATION
 religious_orders.3.b: "Žiadajme príspevok od stavu [GetEstateNameWithNoTooltip('burghers_estate')]." # todo: NEW TRANSLATION
 religious_orders.3.c: "Pošlime bratov kázať tam, kde je viera najslabšia." # todo: NEW TRANSLATION
 religious_orders.4.title: "Škandál v kláštore" # todo: NEW TRANSLATION
 religious_orders.4.desc: "Dozvedeli sme sa, že niektorí bratia z rádu [target_order.GetName] žijú v rozpore so svojimi sľubmi a chýry sa už šíria za múry kláštora. Rádová kapitula sa obracia na nás skôr, než škandál napácha skutočné škody." # todo: NEW TRANSLATION
 religious_orders.4.a: "Potrestajme vinníkov." # todo: NEW TRANSLATION
 religious_orders.4.b: "Vyriešme to potichu." # todo: NEW TRANSLATION
 scandal_kept_quiet_desc: "Záležitosť sa ututlala, hoci na mene rádu zostala drobná škvrna" # todo: NEW TRANSLATION
 scandal_breaks_open_desc: "Mlčanie dlho nevydrží a bratia vinia [target_character.GetName] za škandál, ktorý vyšiel najavo" # todo: NEW TRANSLATION
 religious_orders.5.title: "Mecenáš sa odvracia" # todo: NEW TRANSLATION
 religious_orders.5.desc: "Významný rod zo stavu [GetEstateName('nobles_estate')] už dlho podporuje rád [target_order.GetName], no teraz jeho pokladnica vyschla. Bratia to pocítia okamžite a prichádzajú pred [target_character.GetName] v nádeji, že [target_character.GetSheHe] nedopustí, aby ich práca ustala." # todo: NEW TRANSLATION
 religious_orders.5.a: "Doplňme chýbajúcu sumu z pokladnice." # todo: NEW TRANSLATION
 religious_orders.5.b: "Nech si vystačia s málom." # todo: NEW TRANSLATION
 religious_orders.5.c: "Požadujme, aby stav [GetEstateNameWithNoTooltip('nobles_estate')] našiel nového mecenáša." # todo: NEW TRANSLATION
 new_patron_steps_forward_desc: "Podporu prevezme súperiaci rod a pokladnica rádu sa opäť naplní" # todo: NEW TRANSLATION
 no_patron_steps_forward_desc: "Nový mecenáš sa nenájde a bratia prijmú naše zasahovanie s nevôľou" # todo: NEW TRANSLATION
 treasury_gift_entrenches_order_desc: "Rád dar dobre využije a jeho vplyv v našich krajinách sa tým ešte upevní" # todo: NEW TRANSLATION
 treasury_gift_earns_gratitude_desc: "Bratia prijmú peniaze ako prejav priazne a ich náklonnosť k [target_character.GetName] sa prehĺbi" # todo: NEW TRANSLATION
 religious_orders.6.title: "Prázdny noviciát" # todo: NEW TRANSLATION
 religious_orders.6.desc_martial: "K rádu [target_order.GetName] prichádza len málo mladých mužov, ktorí by sa chopili meča a kríža. Jeho komendy sú spoly prázdne a skúsení bratia sa nahlas pýtajú, kto bude strážiť hranice, keď tu už nebudú." # todo: NEW TRANSLATION
 religious_orders.6.desc_monastic: "K bránam rádu [target_order.GetName] každoročne klope čoraz menej novicov. Chórne lavice sú počas matutína prázdne a starnúci bratia sa obávajú, kto bude po ich odchode dodržiavať modlitbové hodiny." # todo: NEW TRANSLATION
 religious_orders.6.a: "Otvorme brány každému, kto chce slúžiť." # todo: NEW TRANSLATION
 religious_orders.6.b: "Trvajme na prísnych sľuboch." # todo: NEW TRANSLATION
 religious_orders.6.c: "Financujme nábor." # todo: NEW TRANSLATION
 order_abandons_a_house_desc: "Keďže ho nemá kto naplniť novicmi, rád potichu opustí jeden zo svojich kláštorov" # todo: NEW TRANSLATION
 order_withers_for_want_of_novices_desc: "Rád sa drží svojich zásad, no pre nedostatok novej krvi slabne jeho sila aj horlivosť" # todo: NEW TRANSLATION
 religious_orders.101.title: "Šampión rádu" # todo: NEW TRANSLATION
 religious_orders.101.desc: "Medzi bratmi rádu [target_order.GetName] jazdí rytier, ktorého už pohraničné dediny ospevujú v piesňach. Jeho predstavení, pamätajúc na to, odkiaľ pramení ich obživa, ponúkli meč [target_character.GetName] do našich služieb na tak dlho, ako ho budú naše vojny potrebovať." # todo: NEW TRANSLATION
 religious_orders.101.a: "Zverme mu velenie hodné piesní." # todo: NEW TRANSLATION
 religious_orders.101.b: "Jeho miesto je na hraniciach." # todo: NEW TRANSLATION
 religious_orders.102.title: "Meče za hranicami" # todo: NEW TRANSLATION
 religious_orders.102.desc: "Bratia z rádu [target_order.GetName] vtrhli bez povolenia do krajiny [target_country.GetName] a vrátili sa s ukradnutým dobytkom. Nie sme vo vojne. Vyslanci nášho suseda sú už na ceste a neprichádzajú sa modliť." # todo: NEW TRANSLATION
 religious_orders.102.a: "Odškodnime ich a pokarhajme rád." # todo: NEW TRANSLATION
 religious_orders.102.b: "Čo sa vezme neverníkovi, to je dobre vzaté." # todo: NEW TRANSLATION
 religious_orders.103.title: "Kameň na kameni" # todo: NEW TRANSLATION
 religious_orders.103.desc: "Od správcov rádu [target_order.GetName] prišiel list, napísaný vojenským štýlom: múry ich sídla v [target_location.GetName] sú staršie než hranica, ktorú strážia, a malta je lacnejšia než smútok. Žiadajú málo a žiadajú to bez okolkov." # todo: NEW TRANSLATION
 religious_orders.103.a: "Zaplaťme za pevné kamenné múry." # todo: NEW TRANSLATION
 religious_orders.103.b: "Múry počkajú; nech podnikajú širšie hliadky." # todo: NEW TRANSLATION
 religious_orders.104.title: "Signálne ohne zostali temné" # todo: NEW TRANSLATION
 religious_orders.104.desc_captives: "Keď sa v [target_location.GetName] rozoznel poplach, nájazdníci už odchádzali a neodchádzali naprázdno. Dedinských obyvateľov zviazali a odviedli na predaj na trhoch, ktoré nikdy neuvidíme. Strážne ohne rádu [target_order.GetName] horeli celú noc, no nikoho nevarovali. Správcovia pritom prisahali, že presne tomuto zabránia." # todo: NEW TRANSLATION
 religious_orders.104.desc_herds: "Pastviny v okolí [target_location.GetName] boli za jedinú noc vyplienené a v kraji nezostalo ani jediné kopyto či roh. Stratu pocítia sýpky dávno pred koncom roka. Správcovia rádu [target_order.GetName] sa stále dookola pýtajú, ako mohli signálne ohne zostať temné." # todo: NEW TRANSLATION
 religious_orders.104.desc_plate: "Nájazdníci v noci prekĺzli popri strážnych ohňoch rádu [target_order.GetName] a ráno zostali z kostola v [target_location.GetName] len holé kamenné múry. Jeho striebro a relikvie odniesli vo vreciach na konských chrbtoch. Bratia nám nedokážu pozrieť do očí." # todo: NEW TRANSLATION
 religious_orders.104.a: "Zmierme sa so stratou." # todo: NEW TRANSLATION
 religious_orders.104.b: "Pošlime bratov za nájazdníkmi." # todo: NEW TRANSLATION
 wardens_spoils_recovered_desc: "Bratia jazdia bez odpočinku a dostihnú nájazdníkov pri brode. Vrátia sa so všetkým okrem ospravedlnenia a ich príbeh už pri rozprávaní narastá" # todo: NEW TRANSLATION
 wardens_trail_cold_desc: "Bratia vyrazia, no nájdu len konské stopy a vychladnutý popol. Strata zostáva a s ňou aj hanba" # todo: NEW TRANSLATION
 religious_orders.105.title: "Atrament a pergamen" # todo: NEW TRANSLATION
 religious_orders.105.desc: "Bratia z rádu [target_order.GetName] vedú najprehľadnejšie účtovné knihy v našich krajinách a dobre o tom vedia. Ich predstavení nám ponúkli pisárov, ktorí ovládajú [ROOT.GetCountry.GetLiturgicalLanguage.GetName] bezchybne a počítajú neúprosne. Na oplátku žiadajú len tichú miestnosť a skromné štipendium." # todo: NEW TRANSLATION
 religious_orders.105.a: "Poverme ich daňovými záznamami." # todo: NEW TRANSLATION
 religious_orders.105.b: "Poverme ich štátnou korešpondenciou." # todo: NEW TRANSLATION
 religious_orders.106.title: "Zlomená pečať" # todo: NEW TRANSLATION
 religious_orders.106.desc: "List pod našou tajnou pečaťou predniesli v kapitule rádu [target_order.GetName] tri dni predtým, než jeho adresát porušil vosk. Bratia, ktorí slúžia v našej kancelárii, na nič nezabúdajú. Teraz sa zdá, že si to ani nenechávajú pre seba." # todo: NEW TRANSLATION
 religious_orders.106.a: "Zakážme im vstup do kancelárie." # todo: NEW TRANSLATION
 religious_orders.106.b: "Podstrčme im falošnú účtovnú knihu." # todo: NEW TRANSLATION
 religious_orders.106.c: "Mlčky to pretrpme." # todo: NEW TRANSLATION
 confidants_ruse_swallowed_desc: "Falošné čísla sa šíria presne tak, ako sme dúfali, a sledujeme každú ruku, cez ktorú prejdú" # todo: NEW TRANSLATION
 confidants_ruse_discovered_desc: "Bystrý brat odhalí vymyslené čísla do týždňa a rád neodpúšťa, keď z neho niekto robí hlupáka" # todo: NEW TRANSLATION
 religious_orders.107.title: "Návrat z mora" # todo: NEW TRANSLATION
 religious_orders.107.desc_crews: "Galéra rádu [target_order.GetName], s palubami preplnenými námorníkmi zachránenými z vraku na vonkajších plytčinách, sa doplazila do prístavu a takmer sa potápala. Preživší prisahajú, že bratia veslovali aj v počasí, ktorému by sa nepostavil žiaden platený kapitán, a hlasno to rozprávajú v každej krčme na nábreží." # todo: NEW TRANSLATION
 religious_orders.107.desc_charts: "Galéra rádu [target_order.GetName] sa vrátila z dlhej eskortnej plavby a jej kapitán vystupuje na breh s vlastnoručne opravenými lodnými príručkami: sú v nich zakreslené hĺbky a kotviská, o ktorých naši piloti nikdy nevedeli, a sú zreteľne vyznačené pre každého, kto vie čítať." # todo: NEW TRANSLATION
 religious_orders.107.desc_relic: "Na pobrežie sa zišla takmer polovica ľudí, aby sledovali, ako do prístavu vpláva galéra rádu [target_order.GetName] pod všetkými svojimi zástavami. Bratia prinášajú na breh relikviu kúpenú v ďalekom prístave a dav na nábreží sa tlačí, aby ju zazrel." # todo: NEW TRANSLATION
 religious_orders.107.a: "Privítajme ich s poctami." # todo: NEW TRANSLATION
 religious_orders.107.b: "Rád sa postará o svojich." # todo: NEW TRANSLATION
 religious_orders.108.title: "Stratená aj s celou posádkou" # todo: NEW TRANSLATION
 religious_orders.108.desc: "Najlepšia galéra rádu [target_order.GetName] sa počas zimnej víchrice rozbila o plytčinu na dohľad od prístavu a všetkým na očiach, no mimo dosahu akejkoľvek pomoci. Bratia na palube sa utopili spolu s pilotmi, ktorých roky cvičili. Pozdĺž pobrežia znejú zvony rádu a niet koho pochovať." # todo: NEW TRANSLATION
 religious_orders.108.a: "Obnovme ich eskadru na naše náklady." # todo: NEW TRANSLATION
 religious_orders.108.b: "More dáva a more berie." # todo: NEW TRANSLATION
 religious_orders.109.title: "Modlitby neustali" # todo: NEW TRANSLATION
 religious_orders.109.desc: "Bratia z rádu [target_order.GetName] dodržiavajú modlitbové hodiny bez jedinej vynechanej noci už dlhšie, než si väčšina žijúcich pamätá. Matutínum v mraze a vešpery v čase horúčok, modlitba ukladaná na modlitbu ako kamene v múre. Ľudia začali nahlas hovoriť, že [ROOT.GetCountry.GetFlavorRank] stojí len preto, že bratia kľačia." # todo: NEW TRANSLATION
 religious_orders.109.a: "Vyhlásme deň vďakyvzdania." # todo: NEW TRANSLATION
 religious_orders.109.b: "Pošlime si po požehnanie opáta." # todo: NEW TRANSLATION
 religious_orders.110.title: "Hlas z cely" # todo: NEW TRANSLATION
 religious_orders.110.desc: "Pustovník z rádu [target_order.GetName], ktorý je už dvadsať rokov zamurovaný vo svojej cele, začal cez úzke okienko vykrikovať, že nad nami visí oheň a mor ako vytasený meč. Pútnici šíria jeho slová z farnosti do farnosti rýchlejšie, než by ich dokázal rozniesť ktorýkoľvek posol, a pri každom prerozprávaní znejú o čosi horšie." # todo: NEW TRANSLATION
 religious_orders.110.a: "Prikážme opátovi, aby ho umlčal." # todo: NEW TRANSLATION
 religious_orders.110.b: "Nech vykrikuje svoje varovanie." # todo: NEW TRANSLATION
 doom_talk_fades_desc: "Krajina na čas zatají dych. Potom sa urodí dobrá úroda, obloha nespadne a proroctvo potichu zomrie od hanby" # todo: NEW TRANSLATION
 dread_takes_hold_desc: "Strach zapustí korene. Polia zostávajú napoly obrobené, zatiaľ čo kajúcnici putujú po cestách, a kaplnky rádu ešte nikdy neboli také plné" # todo: NEW TRANSLATION
 religious_orders.111.title: "Starobylý kódex z temnôt" # todo: NEW TRANSLATION
 religious_orders.111.desc: "Bratia z rádu [target_order.GetName] v [target_location.GetName] pri opätovnom viazaní červotočom poškodeného žaltára našli pod doskami ukrytý starobylý text: kódex odpísaný pred stáročiami, za ktorým trúchlili všetci učenci, ktorí ho kedy hľadali. Knihovník odvtedy nespal a z jeho listu nám vyplýva, že ani spať neplánuje." # todo: NEW TRANSLATION
 religious_orders.111.a: "Dajme zhotoviť kópie pre našich ľudí." # todo: NEW TRANSLATION
 religious_orders.111.b: "Nech zostane v ich knižnici." # todo: NEW TRANSLATION
 religious_orders.112.title: "Požiar v pisárni" # todo: NEW TRANSLATION
 religious_orders.112.desc_chronicles: "Zvyšok sviečky a prievan, a pisáreň rádu [target_order.GetName] v [target_location.GetName] bola do matutína preč. Kroniky činov, ktoré bratia rok čo rok uchovávali od čias starších než živá pamäť, zhoreli spolu s policami, na ktorých ležali. Nech sme urobili čokoľvek, teraz je oveľa menej dôkazov, že sme to naozaj urobili." # todo: NEW TRANSLATION
 religious_orders.112.desc_psalters: "Pisáreň rádu [target_order.GetName] v [target_location.GetName] zhorela pred úsvitom až po zárubne a s ňou aj veľké chórové knihy. Žaltáre a antifonáre, zdobené po celé generácie, boli pýchou kláštora. Teraz sa budú obrady spievať spamäti a pamäť zrádza." # todo: NEW TRANSLATION
 religious_orders.112.desc_charters: "Oheň v noci pohltil pisáreň rádu [target_order.GetName] v [target_location.GetName] a s ňou aj listiny a vlastnícke dokumenty k polovici kraja. O každej hranici, ktorú bratia kedy vyznačili na pergamene, sa teraz dá pochybovať a v takýchto veciach bývajú názory málokedy skromné." # todo: NEW TRANSLATION
 religious_orders.112.a: "Obnovte ho, regál aj písací stôl." # todo: NEW TRANSLATION
 religious_orders.112.b: "Popol učí pokore." # todo: NEW TRANSLATION
 religious_orders.113.title: "Polia z mokradí" # todo: NEW TRANSLATION
 religious_orders.113.desc: "Bratia z [target_order.GetName] strávili tri zimy odvodňovaním močarísk pod svojím hospodárskym dvorom v [target_location.GetName] a túto jar voda konečne ustúpila. Tam, kde hniezdili volavky, je teraz čierna zem — viac jej, než ktokoľvek čakal — a s prvým suchým týždňom sa vynorila otázka, čí pluh ju zorá." # todo: NEW TRANSLATION
 religious_orders.113.a: "Nech sa hospodárske dvory rozrastajú." # todo: NEW TRANSLATION
 religious_orders.113.b: "Usaďme na nových brázdach našich ľudí." # todo: NEW TRANSLATION
 religious_orders.114.title: "Mor v maštaliach" # todo: NEW TRANSLATION
 religious_orders.114.desc: "V maštaliach [target_order.GetName] neďaleko [target_location.GetName] vypukol mor dobytka. Zvieratá stoja a trasú sa so sklonenými hlavami, zatiaľ čo dobytkári sa medzi sebou hádajú, a bratia sa nás priamo pýtajú, či majú siahnuť po noži, alebo po litániách." # todo: NEW TRANSLATION
 religious_orders.114.a: "Pozabíjajte ich a spáľte." # todo: NEW TRANSLATION
 religious_orders.114.b: "Dôverujme modlitbe a čistej slame." # todo: NEW TRANSLATION
 murrain_passes_over_desc: "Choroba do mesiaca vyhasne. Bratia, ktorí nikdy nepochybovali, že sa tak stane, sú natoľko láskaví, že to nehovoria príliš nahlas" # todo: NEW TRANSLATION
 murrain_spreads_desc: "Mor dobytka sa z maštalí rádu rozšíri do každého stáda v kraji a litánie jeho šírenie nijako nespomalia" # todo: NEW TRANSLATION
 religious_orders.115.title: "Hromobitie na trhovisku" # todo: NEW TRANSLATION
 religious_orders.115.desc: "Fráter z [target_order.GetName] začal kázať na trhovisku v [target_location.GetName] práve v čase, keď úžerníci rozkladajú svoje stoly. Nikoho nemenoval — ani nemusel. Chudobní zapĺňajú námestie, aby ho počúvali, a veritelia v poslednom čase prichádzajú neskoro a odchádzajú skoro." # todo: NEW TRANSLATION
 religious_orders.115.a: "Nech hromží." # todo: NEW TRANSLATION
 religious_orders.115.b: "Poraďme mu, aby kázal miernejšie." # todo: NEW TRANSLATION
 religious_orders.116.title: "Kazateľnica sa obracia" # todo: NEW TRANSLATION
 religious_orders.116.desc: "Ten istý dar, ktorý dokáže zaplniť námestie, môže rovnako ľahko pošramotiť povesť. Fráter z [target_order.GetName] obrátil svoje kázne proti nám v [target_location.GetName]: z kazateľnice vymenúva naše dane a hriechy jeden po druhom, zatiaľ čo dav nahlas počíta." # todo: NEW TRANSLATION
 religious_orders.116.a: "Odpovedzme mu milosrdenstvom." # todo: NEW TRANSLATION
 religious_orders.116.b: "Strhnime ho z kazateľnice." # todo: NEW TRANSLATION
 friar_recants_desc: "Vo väzbe z neho oheň vyprchá a pred svedkami odvolá svoje slová. Rádu zostane iba hanba" # todo: NEW TRANSLATION
 martyr_of_the_square_desc: "Odchádza do cely so spevom na perách a námestie na to nezabudne. Bratia o ňom už hovoria ako o mučeníkovi a mesto hovorí spolu s nimi" # todo: NEW TRANSLATION
 religious_orders.117.title: "Koleso pre odložené deti" # todo: NEW TRANSLATION
 religious_orders.117.desc: "Bratia z [target_order.GetName] zabudovali do steny svojho domu v [target_location.GetName] otáčavé koleso, na ktoré možno odložiť dieťa bez mena a bez otázok ho prijať. Koleso sa otáča častejšie, než si mesto chce priznať, a kolísky rádu sú plné." # todo: NEW TRANSLATION
 religious_orders.117.a: "Vzdajme chválu ich dobročinnosti." # todo: NEW TRANSLATION
 religious_orders.117.b: "Nech sa o deti postarajú farnosti." # todo: NEW TRANSLATION
 religious_orders.118.title: "Preplnený hospic" # todo: NEW TRANSLATION
 religious_orders.118.desc: "Horúčka prišla s pocestnými a hospic [target_order.GetName] v [target_location.GetName] otvoril svoje brány, ako mu káže rehoľná regula. Chorí ležia po dvoch na lôžku a tiež pozdĺž kláštornej chodby. Mestskí lekári nazývajú toto miesto lampou zapálenou pre nočné motýle." # todo: NEW TRANSLATION
 religious_orders.118.a: "Zabarikádujte dvere hospicu." # todo: NEW TRANSLATION
 religious_orders.118.b: "Dobročinnosť sa nezľakne." # todo: NEW TRANSLATION
 hospice_spared_desc: "Horúčka vyhorí pri múroch hospicu, akoby to bolo vopred dohodnuté. Bratia pochovajú svojich niekoľkých mŕtvych a poznamenajú, že rehoľná regula sa osvedčila" # todo: NEW TRANSLATION
 hospice_fever_spreads_desc: "To, čo sa zhromaždilo v hospici, v ňom nezostane. Horúčka odchádza spolu s uzdravenými i smútiacimi a kraj ochorieva ulicu po ulici" # todo: NEW TRANSLATION
 religious_orders.119.title: "Rozhrešenie pre pohraničie" # todo: NEW TRANSLATION
 religious_orders.119.desc: "Vojna sa skončila, no jej účet ešte nie je vyrovnaný. Spovedníci z [target_order.GetName] požiadali o povolenie prejsť najviac postihnuté kraje, vypočuť si, čo muži nepovedia ani svojim susedom, a dať rozhrešenie za to, na čo nedokážu zabudnúť." # todo: NEW TRANSLATION
 religious_orders.119.a: "Pošlime ich medzi ľudí." # todo: NEW TRANSLATION
 religious_orders.119.b: "Ich prvou povinnosťou sú mocní." # todo: NEW TRANSLATION
 religious_orders.120.title: "Rozhrešenie na predaj" # todo: NEW TRANSLATION
 religious_orders.120.desc_noble: "Jeden z bratov z [target_order.GetName] potajomky ponúka šľachtickému rodu z [GetEstateName('nobles_estate')] rozhrešenie za hriechy, ktoré ešte ani nestihol spáchať, a za rozhrešeniami sa pravidelne hrnie záplava darov. Kapitula sa červená od hanby. Dotknutý rod však nie." # todo: NEW TRANSLATION
 religious_orders.120.desc_merchant: "Brat z [target_order.GetName] predáva obchodným domom čisté svedomie a rozhrešenie oceňuje podľa účtovnej knihy ako každý iný tovar. Pre [GetEstateName('burghers_estate')] nie je spravodlivo zaplatená cena vôbec hriechom — a práve v tom spočíva podstata problému." # todo: NEW TRANSLATION
 religious_orders.120.desc_prelate: "Medzi spovedníkmi z [target_order.GetName] je jeden, ktorého pokánia sú tým miernejšie, čím vznešenejší sú hriešnici; všetci jeho kajúcnici sú pritom spolubratmi z cirkvi, ktorým dáva rozhrešenie za hriechy, ktoré farnosti poznajú naspamäť. [GetEstateName('clergy_estate')] by boli radšej, keby sme sa na to príliš nevypytovali." # todo: NEW TRANSLATION
 religious_orders.120.a: "Požadujme, aby nám ho rád vydal." # todo: NEW TRANSLATION
 religious_orders.120.b: "To, čo sa vyspovedá, patrí Bohu." # todo: NEW TRANSLATION
 religious_orders.201.title: "Po Cabalgada" # todo: NEW TRANSLATION
 religious_orders.201.desc: "Bratia sa vracajú z nájazdu s korisťou a zajatcami a komtúrstvo nevie, ako túto udalosť osláviť." # todo: NEW TRANSLATION
 religious_orders.201.a: "Vystavme korisť na obdiv a rozdúchajme horlivosť rádu pre pohraničie." # todo: NEW TRANSLATION
 religious_orders.201.b: "Potichu použime zisk na obranu hraníc." # todo: NEW TRANSLATION
 religious_orders.202.title: "Oporný bod medzi neveriacimi" # todo: NEW TRANSLATION
 religious_orders.202.desc: "Naši vojaci vyrvali [ro_conquest_location.GetName] z rúk neveriacich a bratia z [ro_conquest_order.GetName] už rozmýšľajú, čo s ním. Tam, kde sa naša viera ešte neujala, by chceli na novej hranici založiť komtúrstvo — modlitebný dom spojený s mečom — a žiadajú nás o povolenie na jeho výstavbu." # todo: NEW TRANSLATION
 religious_orders.202.a: "Nech si postavia svoje komtúrstvo." # todo: NEW TRANSLATION
 religious_orders.202.b: "Pohraničie pre nich zatiaľ nie je vhodné miesto." # todo: NEW TRANSLATION

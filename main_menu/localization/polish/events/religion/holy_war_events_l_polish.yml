l_polish:
 holy_war.1.title: "Výzva do svätej vojny" # todo: NEW TRANSLATION
 holy_war.1.desc: "Do nášho dvora zavítali kazatelia, ich hlasy zachrípnuté horlivosťou, a vyzývajú každého pravého veriaceho, aby sa chopil zbraní proti [preach_io.GetTarget.GetName]. Pohľady veriacich sa upierajú na nás. Vyslyšíme výzvu?" # todo: NEW TRANSLATION
 holy_war.1.a: "Chopíme sa tejto úlohy!" # todo: NEW TRANSLATION
 holy_war.1.b: "Teraz nie." # todo: NEW TRANSLATION
 holy_war.2.title: "Zbierka na svätú vojnu" # todo: NEW TRANSLATION
 holy_war.2.desc: "Od [levy_leader.GetLongName], vodcu [levy_io.GetName], prichádzajú vyslanci so slávnostnou prosbou. Svätá vojna proti [levy_io.GetTarget.GetName] pohlcuje peniaze rovnako rýchlo, ako prelieva krv, a ako bratia vo viere sme vyzvaní, aby sme naplnili jej vojnovú pokladnicu. Otvoríme pre túto vec svoje pokladnice?" # todo: NEW TRANSLATION
 holy_war.2.a: "Prispejeme skromnou sumou." # todo: NEW TRANSLATION
 holy_war.2.b: "Prispejeme štedro." # todo: NEW TRANSLATION
 holy_war.2.c: "Radšej sa sami pridáme k tejto veci." # todo: NEW TRANSLATION
 holy_war.2.d: "Za vojnu niekoho iného platiť nebudeme." # todo: NEW TRANSLATION
 holy_war.2.d.tt: "Každý člen [levy_io.GetName] získa názor #R [ROOT.GetCountry.GetBiasConfig('opinion_shirked_holy_war').GetNameWithTooltip]#! na nás" # todo: NEW TRANSLATION
 holy_war.3.title: "Naši ľudia konvertovali" # todo: NEW TRANSLATION
 holy_war.3.desc: "V krajinách, ktoré nám nepriateľ odňal, prechádza jeho duchovenstvo od dediny k dedine a núti našich ľudí zrieknuť sa viery svojich otcov, inak za to trpieť. Správy o každej konverzii dorazia až na náš dvor a na túto pohanu nezabudneme." # todo: NEW TRANSLATION
 holy_war.3.a: "Za toto zaplatia." # todo: NEW TRANSLATION
 holy_war.3.a.tt: "Proti núteným konverziám nepodnikneme nič" # todo: NEW TRANSLATION
 holy_war.4.title: "Výčitka od veriacich" # todo: NEW TRANSLATION
 holy_war.4.desc: "Vodca svätej vojny nás obviňuje, že sa vyhýbame svojej svätej povinnosti, a hrozí nám vážnymi následkami, ak nepreukážeme svoju oddanosť. Ako odpovieme?" # todo: NEW TRANSLATION
 holy_war.4.a: "Prisaháme, že zdvojnásobíme svoje úsilie." # todo: NEW TRANSLATION
 holy_war.4.a.tt: "Vodca svätej vojny nám dáva #G 2 roky#! na to, aby sme sa osvedčili. Ak sa dovtedy zvýši naša účasť v svätej vojne, veriaci budú spokojní; ak nie, aj tak nás pokarhajú." # todo: NEW TRANSLATION
 holy_war.4.b: "Nikomu sa nezodpovedáme." # todo: NEW TRANSLATION
 holy_war.6.title: "Veriaci sú spokojní" # todo: NEW TRANSLATION
 holy_war.6.desc: "Správa o našej obnovenej horlivosti pre svätú vojnu sa rozšírila široko-ďaleko a vodcovia veriacich teraz vyslovujú naše meno s úctou. Tam, kde kedysi vládli pochybnosti, teraz máme ich priazeň." # todo: NEW TRANSLATION
 holy_war.6.a: "#italic Deus vult#!." # todo: NEW TRANSLATION
 holy_war.6.a.muslim: "#italic Allāhu akbar#!." # todo: NEW TRANSLATION
 holy_war.20.title: "Veriaci sú nespokojní" # todo: NEW TRANSLATION
 holy_war.20.desc: "Čas, ktorý nám bol poskytnutý na splnenie našich sľubov, uplynul a my sme neurobili nič, čím by sme ich poctili. Vodcovia svätej vojny nezabudli na naše sľuby ani na to, že sme ich nedodržali, a teraz na nás doľahlo pokarhanie, ktorým nám hrozili." # todo: NEW TRANSLATION
 holy_war.20.a: "Musíme zniesť ich súd." # todo: NEW TRANSLATION
 holy_war.7.title: "Naša výzva bola vyslyšaná" # todo: NEW TRANSLATION
 holy_war.7.desc: "[preach_target.GetName] vyslyšali naše kázanie a pridali sa k svätej vojne, pričom jej prisľúbili svoje meče i bohatstvo. Za vieru sa dvíha ďalší meč a naše vojsko rastie." # todo: NEW TRANSLATION
 holy_war.7.a: "Veriaci sa zhromažďujú." # todo: NEW TRANSLATION
 holy_war.8.title: "Naša výzva bola odmietnutá" # todo: NEW TRANSLATION
 holy_war.8.desc: "[preach_target.GetName] nevenovali nášmu kázaniu pozornosť, odpovedali chladne a zavreli pred nami brány. K svätej vojne sa nepridajú. Veriaci na túto urážku nezabudnú." # todo: NEW TRANSLATION
 holy_war.8.a: "Nech je po ich." # todo: NEW TRANSLATION
 holy_war.8.a.tt: "Odmietli našu ponuku" # todo: NEW TRANSLATION
 holy_war.9.title: "Ponuka kardinálskeho sídla" # todo: NEW TRANSLATION
 holy_war.9.desc: "[cardinal_offerer.GetName], vodca [cardinal_io.GetName], nám ponúka, že jedného z našich prelátov povýši na kardinála, ak sa chopíme kríža. Sídlo by sa nachádzalo v našej vlastnej ríši. Takáto priazeň by nás pripútala k svätej veci. Prijmeme?" # todo: NEW TRANSLATION
 holy_war.9.a: "Prijímame túto poctu a pridáme sa ku križiackej výprave." # todo: NEW TRANSLATION
 holy_war.9.a.no_seat_tt: "V každej osade našej ríše už sídli kardinál, preto sa nám namiesto toho dostane vyššej prestíže" # todo: NEW TRANSLATION
 holy_war.9.b: "Ponuku odmietame." # todo: NEW TRANSLATION
 holy_war.10.title: "Ponuka uznania" # todo: NEW TRANSLATION
 holy_war.10.desc: "[recognition_offerer.GetName], vodca [recognition_io.GetName], nám ponúka uznanie nášho postavenia medzi veriacimi a udelenie náboženskej autority a legitimity, ak sa pridáme k svätej vojne proti neveriacim. Prijmeme?" # todo: NEW TRANSLATION
 holy_war.10.a: "Prijímame a pridáme sa k džihádu." # todo: NEW TRANSLATION
 holy_war.10.b: "Ponuku odmietame." # todo: NEW TRANSLATION
 holy_war.17.title: "Zázračné uzdravenie" # todo: NEW TRANSLATION
 holy_war.17.desc: "Obyčajný vojak, ktorého táboroví lekári už považovali za mŕtveho, vstal z lôžka zdravý a v plnej sile. Mnohí už tvrdia, že je to dielo nebies. Počas horúčky ho však navštívili zvláštne a znepokojivé sny, vízie, ktoré podľa vlastných slov predpovedali budúcnosť. Muži si o nich šepkajú s obavami. Ako s tým naložíme?" # todo: NEW TRANSLATION
 holy_war.17.a: "Vyhlásme jeho uzdravenie za zázrak a povzbuďme vojsko!" # todo: NEW TRANSLATION
 holy_war.17.a.muslim: "$holy_war.17.a$" # todo: NEW TRANSLATION
 holy_war.17.a.tt: "Zvýši náboženskú horlivosť svätej vojny o #G 5#!" # todo: NEW TRANSLATION
 holy_war.17.b: "Utajme to, kým sa nerozšíri strach." # todo: NEW TRANSLATION
 holy_war.18.title: "Horlivosť v tábore ochabuje" # todo: NEW TRANSLATION
 holy_war.18.desc: "Dlhé čakanie kruto dolieha na vojsko. Modlitby, ktoré kedysi zneli horlivo, teraz muži odriekajú len zo zvyku, pre maličkosti strácajú trpezlivosť a staré spory sa každú noc znova rozhorievajú pri táborových ohňoch. Nadšenie, ktoré veriacich pôvodne priviedlo k tejto veci, vychladlo na sivý popol. Ak sa ich duch čoskoro znovu nerozhorí, celé ťaženie môže vyjsť nazmar skôr, než padne jediný úder. Čo treba urobiť?" # todo: NEW TRANSLATION
 holy_war.18.a: "Usporiadajme pre vojsko veľkú kázeň a hostinu." # todo: NEW TRANSLATION
 holy_war.18.a.tt: "Zvýši náboženskú horlivosť svätej vojny o #G 8#!" # todo: NEW TRANSLATION
 holy_war.18.b: "Veriaci si musia nájsť oheň sami." # todo: NEW TRANSLATION
 holy_war.18.b.tt: "Zníži náboženskú horlivosť svätej vojny o #R 5#! a posunie jej prípravy späť o #R 5#!" # todo: NEW TRANSLATION
 holy_war.19.title: "Fanatický kazateľ" # todo: NEW TRANSLATION
 holy_war.19.desc: "Na okraji tábora sa objavil kazateľ s divokým pohľadom, v obnosenom pútnickom rúchu a s hlasom zachrípnutým po dňoch neúnavného kázania. Jeho ohnivé slová priťahujú čoraz väčší zástup chudobných a zbožných, robotníkov i bezzemkov, ktorí sa všetci dožadujú, aby mohli ešte dnes vyraziť do boja za vieru. Je fanatický až za hranicu rozumu a úplne neovládateľný; nikto z našich pánov nad ním nemá moc. Ako s týmto buričom naložíme?" # todo: NEW TRANSLATION
 holy_war.19.a: "Nechajme mu voľnú ruku pri zhromažďovaní veriacich." # todo: NEW TRANSLATION
 holy_war.19.a.tt: "Zvýši náboženskú horlivosť svätej vojny o #G 5#!" # todo: NEW TRANSLATION
 holy_war.19.b: "Skroťme ho skôr, než vyvolá nepokoje." # todo: NEW TRANSLATION
 holy_war.21.title: "Spor o korisť" # todo: NEW TRANSLATION
 holy_war.21.desc: "Mesto sotva padlo a naši vojaci sa už pobili s mužmi spojeneckého vojska o rozdelenie koristi. V úzkych uliciach vytasili nože, stany popadali a staré krivdy medzi oboma tábormi vyústili do otvorenej bitky. Ak spor rýchlo nevyriešime, môže otráviť celé ťaženie a poštvať bratov proti sebe, kým nepriateľ stále vzdoruje. Ako to vyriešime?" # todo: NEW TRANSLATION
 holy_war.21.a: "Nech si naši muži vezmú, čo si zaslúžili." # todo: NEW TRANSLATION
 holy_war.21.a.tt: "Zníži náboženskú horlivosť svätej vojny o #R 5#!" # todo: NEW TRANSLATION
 holy_war.21.b: "Zadržme ich v záujme spoločnej veci." # todo: NEW TRANSLATION
 holy_war.21.b.tt: "Zvýši náboženskú horlivosť svätej vojny o #G 5#!" # todo: NEW TRANSLATION
 holy_war.22.title: "Choroba vo vojsku" # todo: NEW TRANSLATION
 holy_war.22.desc: "Preplnenými obliehacími líniami sa šíri vysilujúca horúčka a každé sivé ráno odnášajú z ďalších stanov mužov v bezvedomí. Táboroví lekári ich púšťajú žilou, podávajú im preháňadlá a modlia sa nad nimi, no nič chorobu nezastaví. Zápach umierajúcich ťaží celý tábor. S každým ďalším dňom vojsko stráca silu, ktorú si tak ďaleko od domova a pred stále nezdolanými hradbami nemôže dovoliť stratiť. Ako sa postavíme tejto pohrome?" # todo: NEW TRANSLATION
 holy_war.22.a: "Pokračujme v ťažení, nech to stojí čokoľvek." # todo: NEW TRANSLATION
 holy_war.22.b: "Nechajme vojsko odpočívať, kým choroba nepominie." # todo: NEW TRANSLATION
 holy_war.22.b.tt: "Zníži náboženskú horlivosť svätej vojny o #R 5#!" # todo: NEW TRANSLATION
 holy_war.23.title: "Padol šampión" # todo: NEW TRANSLATION
 holy_war.23.desc: "Počas obliehania [sieged_location.GetName] padol [fallen_champion.GetName] v prudkých bojoch. Na hradbách ho skolili po hrdinských činoch, o ktorých sa bude spievať ešte celé generácie. Vojsko smúti za šampiónom, ktorého milovali obyčajní vojaci i hrdí páni. No aj v žiali sa mužom rozhorieva krv a mnohí teraz prosia o česť pomstiť padlého nepriateľovi. Ako si uctíme jeho smrť?" # todo: NEW TRANSLATION
 holy_war.23.a: "Vyhlásme ho za mučeníka viery!" # todo: NEW TRANSLATION
 holy_war.23.a.tt: "Zvýši náboženskú horlivosť svätej vojny o #G 10#!" # todo: NEW TRANSLATION
 holy_war.23.b: "Uctíme si ho v tichosti a dôstojne." # todo: NEW TRANSLATION
 holy_war.23.b.tt: "Zvýši náboženskú horlivosť svätej vojny o #G 3#!" # todo: NEW TRANSLATION
 holy_war.24.title: "Falošní veriaci v radoch vojska" # todo: NEW TRANSLATION
 holy_war.24.desc: "Táborom sa šíria nepríjemné šepoty, že sa medzi veriacich vkradli kacíri a falošní veriaci. Ich modlitby sú prázdnou výsmešnou napodobeninou a ich oddanosť je veľmi pochybná. Najzbožnejší z vojska žiadajú, aby sme ich odhalili a vyhnali skôr, než otrávia celú armádu. Rozvážnejší však tvrdia, že meč v mužovej ruke je stále mečom, nech už v jeho srdci drieme akékoľvek vyznanie. Ako na toto obvinenie odpovieme?" # todo: NEW TRANSLATION
 holy_war.24.a: "Vyčistime vojsko od falošných veriacich." # todo: NEW TRANSLATION
 holy_war.24.a.tt: "Zvýši náboženskú horlivosť svätej vojny o #G 8#!" # todo: NEW TRANSLATION
 holy_war.24.b: "Privrime oči. Potrebujeme každý meč." # todo: NEW TRANSLATION
 holy_war.24.b.tt: "Zníži náboženskú horlivosť svätej vojny o #R 5#!" # todo: NEW TRANSLATION
 holy_war.25.title: "Zbožný odkaz" # todo: NEW TRANSLATION
 holy_war.25.desc: "Bohatý magnát našej ríše, ktorý nedávno odišiel na večnosť, odkázal vo svojom poslednom závete veľkú sumu na svätú vojnu. Jeho vykonávatelia závetu nám zverili toto bohatstvo — zapečatené truhlice plné mincí, ktoré môžeme použiť podľa vlastného uváženia. Duchovenstvo, velitelia i chudobní si už naň robia nárok. Kam toto bohatstvo poputuje?" # todo: NEW TRANSLATION
 holy_war.25.a: "Použime ho na financovanie vlastnej vojny." # todo: NEW TRANSLATION
 holy_war.25.b: "Venujme ho do pokladnice svätej vojny." # todo: NEW TRANSLATION
 holy_war.25.b.tt: "Zvýši náboženskú horlivosť svätej vojny o #G 3#!" # todo: NEW TRANSLATION
 holy_war.25.c: "Rozdajme ho veriacim ako almužnu." # todo: NEW TRANSLATION
 holy_war.25.c.tt: "Zvýši náboženskú horlivosť svätej vojny o #G 3#!" # todo: NEW TRANSLATION
 holy_war.27.title: "Podplatený odpadlík" # todo: NEW TRANSLATION
 holy_war.27.desc: "Naše striebro potichu vykonalo svoju prácu. [desertion_member.GetName] prijali úplatok a opustili svoju vec. Stiahli svoje zástavy a pod zámienkami, ktorým nikto neverí, sa plížili domov. Ich odchod oslabil našich nepriateľov. Zlato nám opäť prinieslo to, čo nedokázal ani meč, ani kázeň, a jedného nepríjemného nepriateľa potichu odstránilo z hry. Možno je to poučenie o skutočnej cene oddanosti." # todo: NEW TRANSLATION
 holy_war.27.a: "Chamtivosť uspeje tam, kde meč zlyhá." # todo: NEW TRANSLATION
 holy_war.27.a.tt: "[desertion_member.GetName] prijali úplatok a opustili [desertion_io.GetName]" # todo: NEW TRANSLATION
 holy_war.28.title: "Naše striebro odmietli" # todo: NEW TRANSLATION
 holy_war.28.desc: "[desertion_member.GetName] našu tajnú ponuku rozhodne odmietli a vyhnali nášho vyslanca zo svojho dvora. Prisahali, že budú neochvejne pokračovať vo vojne a naše mince ich nepokúšajú. Ešte horšie je, že sa o našom pokuse môže rozšíriť správa. Ak prenikne na verejnosť, pošpiní naše meno ako meno podplácateľov a podvodníkov. Z celej akcie nám zostalo len riziko." # todo: NEW TRANSLATION
 holy_war.28.a: "Nech je po ich." # todo: NEW TRANSLATION
 holy_war.28.a.tt: "Odmietli úplatok" # todo: NEW TRANSLATION
 holy_war.29.title: "Pápežský legát" # todo: NEW TRANSLATION
 holy_war.29.desc: "Jeho Svätosť vyslala [papal_legate.GetName] — bojovníka a preláta, ktorý je rovnako zbehlý vo vojnovom umení ako v cirkevných záležitostiach — aby viedol naše vojsko a udelil našej [holy_war.GetName] plné požehnanie Ríma. Takýto muž by mohol zdokonaliť naše vojská a ešte tesnejšie nás spojiť so Svätou stolicou, hoci sa zodpovedá najprv pápežovi a až potom nám. Prijmeme ho do svojich služieb?" # todo: NEW TRANSLATION
 holy_war.29.a: "Privítajme legáta pod našimi zástavami." # todo: NEW TRANSLATION
 holy_war.29.a.tt: "Zvyšuje náboženský zápal [Concept('crusade','križiacka výprava')|e] o #G 5#!" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 holy_war.29.b: "Pošlime ho späť do Ríma s našou vďakou." # todo: NEW TRANSLATION
 holy_war.30.title: "Predavači odpustkov v tábore" # todo: NEW TRANSLATION
 holy_war.30.desc: "Skupina predavačov odpustkov sa zniesla na tábor ako supy na čerstvú korisť. Ponúkajú odpustky a sväté talizmany každému vojakovi, ktorý je ochotný sa rozlúčiť s peniazmi. Ich zárobky rastú rovnako rýchlo ako reptanie zbožných, ktorí celé toto obchodovanie označujú za škandál, ktorý vrhá hanbu na naše ťaženie. No peniaze sú peniaze a nijakú svätú vojnu ešte nikto nevyhral iba modlitbami. Čo s nimi urobíme?" # todo: NEW TRANSLATION
 holy_war.30.a: "Nech ich zárobky naplnia vojnovú pokladnicu." # todo: NEW TRANSLATION
 holy_war.30.a.tt: "Znižuje náboženský zápal [Concept('crusade','križiacka výprava')|e] o #R 3#!" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 holy_war.30.b: "Potajomky presmerujme peniaze do našej pokladnice." # todo: NEW TRANSLATION
 holy_war.30.b.tt: "Znižuje náboženský zápal [Concept('crusade','križiacka výprava')|e] o #R 5#!" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 holy_war.30.c: "Vyžeňme týchto kramárov z tábora." # todo: NEW TRANSLATION
 holy_war.30.c.tt: "Zvyšuje náboženský zápal [Concept('crusade','križiacka výprava')|e] o #G 5#!" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 holy_war.31.title: "Relikvie svätca" # todo: NEW TRANSLATION
 holy_war.31.desc: "Do našich rúk sa dostali kosti uctievaného svätca. Na náš dvor ich priniesla skupina vďačných mníchov, ktorí ich strážili počas dlhej a nebezpečnej cesty. Takéto relikvie sú pokladom, ktorý nemožno vyvážiť zlatom, pretože kamkoľvek ich napokon uložíme, zhromaždia sa tam tisíce veriacich, aby sa prišli pomodliť a obdivovať ich. Kde uložíme tieto sväté pozostatky?" # todo: NEW TRANSLATION
 holy_war.31.a: "Uložme ich do svätyne v našom hlavnom meste." # todo: NEW TRANSLATION
 holy_war.31.b: "Nech ich nesú pred vojskom do bitky." # todo: NEW TRANSLATION
 holy_war.31.b.tt: "Zvyšuje náboženský zápal [Concept('crusade','križiacka výprava')|e] o #G 8#!" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 holy_war.32.title: "Prísaha križiaka" # todo: NEW TRANSLATION
 holy_war.32.desc: "Pred celým zhromaždeným dvorom si [ROOT.GetCountry.GetGovernment.GetRuler.GetAltAdjective('D')] pokľakol pri oltári a zložil veľkolepú prísahu: osobne vziať kríž, viesť veriacich do samého srdca svätej vojny a zdieľať všetky útrapy i nebezpečenstvá ťaženia po boku aj toho najbiednejšieho pešiaka. Je to odvážny a nebezpečný sľub a celá ríša teraz čaká na naše slovo. Necháme túto prísahu platiť?" # todo: NEW TRANSLATION # todo: COUNTRY CASE
 holy_war.32.a: "Nech [ROOT.GetCountry.GetGovernment.GetRuler.GetNameWithNoTooltip] osobne vedie vojsko." # todo: NEW TRANSLATION
 holy_war.32.a.tt: "Zvyšuje náboženský zápal [Concept('crusade','križiacka výprava')|e] o #G 5#!" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 holy_war.32.b: "Ríši lepšie poslúži, keď [ROOT.GetCountry.GetGovernment.GetRuler.GetNameWithNoTooltip] zostane na tróne." # todo: NEW TRANSLATION
 holy_war.33.title: "Kresťanstvo berie na seba kríž" # todo: NEW TRANSLATION
 holy_war.33.desc: "Ríšou sa prehnala mohutná vlna náboženského zápalu a muži všetkých spoločenských vrstiev sa dožadujú, aby si mohli prišiť na tuniky kríž a vyraziť do boja za vieru. Pyšní rytieri a zemepáni súperia o slávu v predvoji, zatiaľ čo prostý ľud na dedinách berie do rúk všetky zbrane, ktoré dokáže nájsť. Koho horlivosť najlepšie využijeme?" # todo: NEW TRANSLATION
 holy_war.33.a: "Povolajme pod zástavy rytierov a šľachticov." # todo: NEW TRANSLATION
 holy_war.33.b: "Zostavme veľké vojsko z prostého ľudu." # todo: NEW TRANSLATION
 holy_war.34.title: "Sufijský šajch" # todo: NEW TRANSLATION
 holy_war.34.desc: "Do nášho tábora prišiel uctievaný sufijský šajch [sufi_shaykh.GetName], ktorého zbožnosť a učenosť sú známe v celom moslimskom svete. V pätách mu kráča skupina oddaných učeníkov. Jeho kázne pri večerných ohňoch rozpaľujú srdcia gházíov a muži, ktorí ešte včera kráčali unavení, teraz so žiariacimi očami hovoria o mučeníctve. Ako tohto svätého muža prijmeme?" # todo: NEW TRANSLATION
 holy_war.34.a: "Prijmime šajcha na náš dvor." # todo: NEW TRANSLATION
 holy_war.34.a.tt: "Zvyšuje náboženský zápal [Concept('jihad','$jihad$')|e] o #G 5#!" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 holy_war.34.b: "Držme si tohto potulného mystika od tela." # todo: NEW TRANSLATION
 holy_war.34.b.tt: "Znižuje náboženský zápal [Concept('jihad','$jihad$')|e] o #R 3#!" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 holy_war.35.title: "Gházíovia žiadajú svoj podiel" # todo: NEW TRANSLATION
 holy_war.35.desc: "Dobrovoľní bojovníci, ktorí sa hrnuli odpovedať na výzvu, teraz naliehavo žiadajú korisť, ktorú im sľúbili. Tlačia sa pred naším stanom, hlasno sa dožadujú svojho a trpezlivosť im dochádza. Bojovali za vieru, hovoria, ale aj za svoje ženy a deti. Prázdne ruky však znamenajú prázdne rady v ďalšej ťažkej bitke. Ako odpovieme na ich požiadavku?" # todo: NEW TRANSLATION
 holy_war.35.a: "Dajme gházíom ich podiel z koristi." # todo: NEW TRANSLATION
 holy_war.35.a.tt: "Zvyšuje náboženský zápal [Concept('jihad','$jihad$')|e] o #G 5#!" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 holy_war.35.b: "Korisť patrí vojnovému úsiliu, nie chamtivcom." # todo: NEW TRANSLATION
 holy_war.35.b.tt: "Znižuje náboženský zápal [Concept('jihad','$jihad$')|e] o #R 3#!" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 holy_war.36.title: "Právnikova fatva" # todo: NEW TRANSLATION
 holy_war.36.desc: "Vážený právnik, ktorého slovo má váhu od jedného konca #italic ummy#! po druhý, vydal #italic fatvu#!, v ktorej vyhlasuje svätú vojnu za posvätnú povinnosť každého veriaceho schopného nosiť zbraň. Takéto rozhodnutie, odpísané stovkami rúk a šírené od mešity k mešite, by mohlo vznietiť celý islamský svet pre našu vec. Rozšírime ho všade?" # todo: NEW TRANSLATION
 holy_war.36.a: "Rozšírme toto rozhodnutie do všetkých kútov." # todo: NEW TRANSLATION
 holy_war.36.a.tt: "Zvyšuje náboženský zápal [Concept('jihad','$jihad$')|e] o #G 8#!" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 holy_war.36.b: "Prijmime ho s tichou vďakou." # todo: NEW TRANSLATION
 holy_war.36.b.tt: "Zvyšuje náboženský zápal [Concept('jihad','$jihad$')|e] o #G 3#!" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 holy_war.37.title: "Dobrovoľníci z celej ummy" # todo: NEW TRANSLATION
 holy_war.37.desc: "Správy o svätej vojne sa rozšírili ďaleko za naše hranice a teraz na zhromaždisko prichádzajú skupiny gházíov dobrovoľníkov zo vzdialených moslimských krajín. S boľavými nohami, pokrytí prachom a plní odhodlania žiadajú len miesto v šíku a príležitosť udrieť na nepriateľa. Je pravda, že je to veľa hladných krkov, no aj množstvo ochotných mečov. Prijmeme ich?" # todo: NEW TRANSLATION
 holy_war.37.a: "Privítajme dobrovoľníkov na zhromaždisku." # todo: NEW TRANSLATION
 holy_war.37.a.tt: "Zvyšuje náboženský zápal [Concept('jihad','$jihad$')|e] o #G 3#!" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 holy_war.37.b: "Nemôžeme živiť každého potulného horlivca." # todo: NEW TRANSLATION
 holy_war.38.title: "Posvätná zástava" # todo: NEW TRANSLATION
 holy_war.38.desc: "Do našej opatery zverili starobylú vojnovú zástavu, o ktorej sa vraví, že v prvých dňoch viery viala nad víťazstvami prvých veriacich. Hoci je látka vyblednutá a rozstrapkaná, už len pohľad na ňu napĺňa veriacich spravodlivým hnevom a muži prisahajú, že ju budú nasledovať do akéhokoľvek nebezpečenstva bez zaváhania. Čo urobíme s touto vzácnou relikviou?" # todo: NEW TRANSLATION
 holy_war.38.a: "Pozdvihnime ju vysoko nad naše vojsko." # todo: NEW TRANSLATION
 holy_war.38.a.tt: "Zvyšuje náboženský zápal [Concept('jihad','$jihad$')|e] o #G 5#!" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 holy_war.38.b: "Strážme ju ako poklad, ktorým je." # todo: NEW TRANSLATION
 sacred_war_banner: "Posvätná zástava" # todo: NEW TRANSLATION
 sacred_war_banner_desc: "Vojnová zástava z vyblednutej a rozstrapkanej látky, o ktorej sa vraví, že viala nad víťazstvami prvých veriacich. Teraz ju strážia ako posvätný poklad ríše a vynášajú ju v tie najsvätejšie dni, aby naplnila veriacich spravodlivým hnevom." # todo: NEW TRANSLATION
 holy_war.39.title: "Kardinálska hodnosť prijatá" # todo: NEW TRANSLATION
 holy_war.39.desc: "[cardinal_candidate.GetName] prijal našu ponuku kardinálskej hodnosti a vzal na seba kríž, čím sa pripojil k [cardinal_io.GetName]. Nech medzi nimi povstane nový knieža Cirkvi." # todo: NEW TRANSLATION
 holy_war.39.a: "Deo gratias!" # todo: NEW TRANSLATION
 holy_war.40.title: "Kardinálska hodnosť odmietnutá" # todo: NEW TRANSLATION
 holy_war.40.desc: "[cardinal_candidate.GetName] odmietol našu ponuku kardinálskej hodnosti a nepripojí sa k [cardinal_io.GetName]. Česť ponúkneme niekomu inému." # todo: NEW TRANSLATION
 holy_war.40.a: "Nech je tak." # todo: NEW TRANSLATION
 holy_war.41.title: "Naše uznanie prijaté" # todo: NEW TRANSLATION
 holy_war.41.desc: "[recognition_candidate.GetName] prijal našu ponuku uznania a pripojil sa k [recognition_io.GetName], aby po boku veriacich pozdvihol meč proti neveriacim." # todo: NEW TRANSLATION
 holy_war.41.a: "Boh je veľký!" # todo: NEW TRANSLATION
 holy_war.42.title: "Naše uznanie odmietnuté" # todo: NEW TRANSLATION
 holy_war.42.desc: "[recognition_candidate.GetName] odmietol našu ponuku uznania a nepripojí sa k [recognition_io.GetName]. Veriaci si zapamätajú, kto sa držal bokom." # todo: NEW TRANSLATION
 holy_war.42.a: "Nech je tak." # todo: NEW TRANSLATION

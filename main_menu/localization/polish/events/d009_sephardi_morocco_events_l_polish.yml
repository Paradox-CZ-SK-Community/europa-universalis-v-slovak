l_polish:
 d009_sephardi_morocco.1.title: "Príchod #italic Megorashim#!" # todo: NEW TRANSLATION
 d009_sephardi_morocco.1.entry: "$d009_sephardi_morocco.1.title$" # todo: NEW TRANSLATION
 d009_sephardi_morocco.1.desc: "Utečenci z [origin_country.GetNameWithNoTooltip] už celé mesiace prichádzajú do našich atlantických prístavov. Nazývajú sa #italic Megorashim#!, teda vyhnanci, a žiadajú len o štvrť, kde by sa mohli usadiť, a synagógu, kde by sa mohli modliť. [ShowLocationName('fez')] už má svoju starú, usadenú [ShowReligionAdjective('judaism')] komunitu, Toshavimov, ktorí si nie sú celkom istí, či sa chcú deliť o svoje mesto, súdy alebo zvyky s novoprišelcami, ktorí hovoria iným jazykom a dodržiavajú iné obrady." # todo: NEW TRANSLATION
 d009_sephardi_morocco.1.a: "Privítajme ich v [ShowLocationNameWithNoTooltip('fez')]." # todo: NEW TRANSLATION
 d009_sephardi_morocco.1.b: "Obmedzme ich pobyt výlučne na [ShowLocationNameWithNoTooltip('tetouan')]." # todo: NEW TRANSLATION
 d009_sephardi_morocco.1.historical_info: "Alhamberský dekrét a jeho portugalský náprotivok vyhnali do Maghrebu desaťtisíce sefardských Židov. Tí, ktorí dorazili do Maroka, sa nazývali #italic Megorashim#!, čo v hebrejčine znamená vyhnanci, aby sa odlíšili od #italic Toshavim#!, pôvodných marockých židovských komunít, ktoré tam žili už dávno pred rokom 1492. Obe skupiny sa usadili najmä vo Feze a Tetouane a po celé generácie si zachovávali vlastnú identitu a často aj oddelené právne zvyklosti." # todo: NEW TRANSLATION
 d009_sephardi_morocco.2.title: "#italic Megorashim#! proti #italic Toshavim#!" # todo: NEW TRANSLATION
 d009_sephardi_morocco.2.entry: "$d009_sephardi_morocco.2.title$" # todo: NEW TRANSLATION
 d009_sephardi_morocco.2.desc: "Dva [ShowReligionAdjective('judaism')] súdy v [ShowLocationName('fez')] sa napokon otvorene dostali do konfliktu. Rabíni #italic Megorashim#! trvajú na tom, že ich [GetCountry('CAS').GetAdjectiveWithNoTooltip] právne zvyklosti, zdokonaľované po stáročia v krajine [GetCountry('CAS').GetNameWithNoTooltip], sú pre obchod a zmluvy jednoducho vhodnejšie než starší obrad #italic Toshavim#!. #italic Toshavim#! s tým, pochopiteľne, nesúhlasia a obe komunity sa obrátili na nás, aby sme spor urovnali, alebo aspoň prestali predstierať, že sa vyrieši sám." # todo: NEW TRANSLATION
 d009_sephardi_morocco.2.a: "Zaveďme #italic Takkanot#! z [ShowLocationNameWithNoTooltip('fez')]." # todo: NEW TRANSLATION
 d009_sephardi_morocco.2.b: "Podporujme obrad #italic Toshavim#!." # todo: NEW TRANSLATION
 d009_sephardi_morocco.2.c: "Trvajme na spolužití." # todo: NEW TRANSLATION
 d009_sephardi_morocco.2.historical_info: "Skutočné #italic Takkanot de Fes#! boli súborom komunitných nariadení, ktoré začali vydávať rabíni #italic Megorashim#! v roku 1494. Postupne tak ustanovili právne zvyklosti ovplyvnené Kastíliou za prevládajúci obrad vo Feze. #italic Toshavim#! jednoducho nezmizli: obe komunity si po celé generácie väčšinou zachovávali oddelené synagógy, súdy a cintoríny. Trvalo vyše storočia, kým sa rozdiely medzi nimi zotreli a splynuli do jednej židovskej komunity vo Feze." # todo: NEW TRANSLATION
 d009_sephardi_morocco.3.title: "Mesto vyhnancov" # todo: NEW TRANSLATION
 d009_sephardi_morocco.3.entry: "$d009_sephardi_morocco.3.title$" # todo: NEW TRANSLATION
 d009_sephardi_morocco.3.desc: "[ShowLocationName('tetouan')] ležalo desaťročia v ruinách, kým ho spoločne neobnovili [ShowCultureName('andalusi')] a [ShowCultureName('sephardi')] vyhnanci z [ShowRegionName('iberia_region')], a ich odkaz dosiaľ nevybledol. Jeho ulice, remeslá i reč nesú nezameniteľnú príchuť [ShowRegionNameWithNoTooltip('iberia_region')], akú inde na tomto pobreží nájdeme len zriedka. Je len na nás, či budeme túto identitu ďalej rozvíjať, alebo budeme [ShowLocationNameWithNoTooltip('tetouan')] jednoducho považovať za ďalší prístav pod našou vládou." # todo: NEW TRANSLATION
 d009_sephardi_morocco.3.a: "Podporujme [ShowCultureNameWithNoTooltip('sephardi')] charakter [ShowLocationNameWithNoTooltip('tetouan')]." # todo: NEW TRANSLATION
 d009_sephardi_morocco.3.b: "Považujme ho za obyčajné mesto." # todo: NEW TRANSLATION
 d009_sephardi_morocco.3.historical_info: "Tetouan zničili kastílske vojská v 15. storočí a zostalo zväčša opustené, kým sa v ňom okolo vyhnania v roku 1492 neusadili andalúzski moslimskí a sefardskí židovskí utečenci. V meste sa vyvinula #italic Haketia#!, osobitý židovsko-španielsky dialekt, a po celé nasledujúce stáročia patrilo k mestám v Maroku, na ktorých bol iberský vplyv najzreteľnejší. Túto podobu si zachovala najmä jeho židovská komunita až do modernej doby." # todo: NEW TRANSLATION
 d009_sephardi_morocco.4.title: "Židia na dvore Sa'díovcov" # todo: NEW TRANSLATION
 d009_sephardi_morocco.4.entry: "$d009_sephardi_morocco.4.title$" # todo: NEW TRANSLATION
 d009_sephardi_morocco.4.desc: "[target_character.GetName], [ShowReligionAdjective('judaism')] lekár a vzdelanec s rozsiahlymi vedomosťami, prišiel do [ShowLocationName('marrakesh')] a uchádza sa o miesto na [ROOT.GetCountry.GetGovernment.GetCourtTitle]. Predchodcovia nášho [ROOT.GetCountry.GetGovernment.GetRulerTitle] sa pri stykoch s [ShowReligionGroupAdjective('christian')] mocnosťami Atlantiku už dlho spoliehali na [ShowReligionAdjectiveWithNoTooltip('judaism')] finančníkov a sprostredkovateľov. Niet zjavného dôvodu, aby sme od tejto praxe teraz upustili, hoci nie všetci ministri na [ROOT.GetCountry.GetGovernment.GetCourtTitle] s tým súhlasia." # todo: NEW TRANSLATION
 d009_sephardi_morocco.4.a: "Vymenujme [target_character.GetHimHer] na [ROOT.GetCountry.GetGovernment.GetCourtTitle]." # todo: NEW TRANSLATION
 d009_sephardi_morocco.4.a.entry: "Vymenujme ho na dvore." # todo: NEW TRANSLATION
 d009_sephardi_morocco.4.b: "Spoliehajme sa výlučne na [ShowReligionGroupAdjectiveWithNoTooltip('muslim')] obchodníkov." # todo: NEW TRANSLATION
 d009_sephardi_morocco.4.historical_info: "Sultáni dynastie Sa'díovcov, najmä Aḥmad al-Manṣūr, sa pri správe obchodu a rokovaniach s Anglickom, Holandskom a ďalšími atlantickými mocnosťami vo veľkej miere opierali o židovských dvoranov, finančníkov a diplomatických sprostredkovateľov. Tieto vzťahy čiastočne stáli na obchode s cukrom a liadkom, ktorý financoval štát Sa'díovcov." # todo: NEW TRANSLATION
 d009_sephardi_morocco.5.title: "Výkup zajatcov" # todo: NEW TRANSLATION
 d009_sephardi_morocco.5.entry: "$d009_sephardi_morocco.5.title$" # todo: NEW TRANSLATION
 d009_sephardi_morocco.5.desc: "S [GetCountry('POR').GetNameWithNoTooltip] sme uzavreli mier, no po ňom zostalo v rukách [ROOT.GetCountry.GetAltAdjective('L')] množstvo [GetCountry('POR').GetAdjectiveWithNoTooltip] zajatcov. Naši [ShowReligionAdjective('judaism')] obchodníci, ktorí udržiavajú obchodné kontakty na druhej strane prielivu, aké len máloktorý náš úradník dokáže vyrovnať, ponúkli, že sprostredkujú ich výkupné. Je to bezpochyby výnosná záležitosť, ktorú by sme zverili mužom, ktorých lojalitu niektorí na [ROOT.GetCountry.GetGovernment.GetCourtTitle] stále potichu spochybňujú." # todo: NEW TRANSLATION # todo: COUNTRY CASE
 d009_sephardi_morocco.5.a: "Povoľme výkupné cez [ShowReligionAdjectiveWithNoTooltip('judaism')] sprostredkovateľov." # todo: NEW TRANSLATION
 d009_sephardi_morocco.5.b: "Využime výlučne [ShowReligionGroupAdjectiveWithNoTooltip('muslim')] sprostredkovateľov." # todo: NEW TRANSLATION
 d009_sephardi_morocco.5.historical_info: "Po víťazstve Sa'díovcov nad portugalským vojskom pri bitke pri El-Qaṣr al-Kabir (Alcácer-Quibir) v roku 1578 zohrali židovskí obchodníci v Maroku zdokumentovanú úlohu pri sprostredkovaní výkupného za zajatých portugalských šľachticov a vojakov, ktorí sa vracali na Iberský polostrov. Bola to výnosná a diplomaticky citlivá záležitosť, keďže mali obchodné siete na oboch stranách prielivu." # todo: NEW TRANSLATION
 d009_morocco_has_jewish_pops_tt: "V našich krajinách žije [Concept('pops','populácie')|e] vyznávajúcich [ShowReligionAdjectiveWithNoTooltip('judaism')]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 d009_sephardi_morocco.6.title: "Mallāḥ v [ShowLocationNameWithNoTooltip('meknes')]" # todo: NEW TRANSLATION
 d009_sephardi_morocco.6.entry: "$d009_sephardi_morocco.6.title$" # todo: NEW TRANSLATION
 d009_sephardi_morocco.6.desc: "[target_character.GetName], uznávaný finančník, navrhuje, aby náš [ROOT.GetCountry.GetGovernment.GetRulerTitle] v samotnom [ShowLocationName('meknes')] oficiálne zriadil riadnu [ShowReligionAdjective('judaism')] štvrť, ktorá by mala vlastnú listinu práv, trhové privilégiá i súdy. Ak sa [ShowLocationNameWithNoTooltip('meknes')] stane miestom, kde sa [ShowReligionAdjectiveWithNoTooltip('judaism')] obchodníci budú chcieť usadiť, [target_character.GetSheHe] tvrdí, že sa nám to mnohonásobne vráti už len na daniach a obchode." # todo: NEW TRANSLATION
 d009_sephardi_morocco.6.a: "Udeľme jej listinu práv." # todo: NEW TRANSLATION
 d009_sephardi_morocco.6.b: "Vylúčme Židov z [ShowLocationNameWithNoTooltip('meknes')]." # todo: NEW TRANSLATION
 d009_sephardi_morocco.6.historical_info: "Sultán Moulay Ismail si zvolil Meknes za svoje cisárske hlavné mesto a podobne ako ostatní vládcovia dynastie Alaouitovcov sa pri správe štátnej pokladnice a atlantického obchodu spoliehal na židovských finančníkov. Najznámejší z nich bol Joseph Maimaran, ktorého si marocká židovská tradícia pamätá ako významnú postavu pri správe financií na dvore v Meknese. V rámci budovania mesta na cisárske hlavné mesto tu vznikla oficiálna židovská štvrť, čiže mallāḥ." # todo: NEW TRANSLATION
 d009_sephardi_morocco.7.title: "Samuel Pallache, diplomatický korzár" # todo: NEW TRANSLATION
 d009_sephardi_morocco.7.entry: "$d009_sephardi_morocco.7.title$" # todo: NEW TRANSLATION
 d009_sephardi_morocco.7.desc: "[target_character.GetName] vedie zvláštny dvojitý život: jeden deň v našom mene rokuje s [GetCountry('HOL').GetNameWithNoTooltip] o obchodných výsadách, na druhý velí korzárskym lodiam, ktoré napádajú španielske a [GetCountry('POR').GetAdjectiveWithNoTooltip] plavidlá, hoci sme na to nikdy nepodpísali žiadne poverenie. [target_character.GetSheHe] tvrdí, že obe činnosti slúžia tomu istému cieľu, a ťažko možno poprieť, že [target_character.GetHerHis] výsledky sú pre našu pokladnicu viac než výborné." # todo: NEW TRANSLATION
 d009_sephardi_morocco.7.a: "Oficiálne ho poverme touto úlohou." # todo: NEW TRANSLATION
 d009_sephardi_morocco.7.b: "Nechajme toto usporiadanie neoficiálne." # todo: NEW TRANSLATION
 d009_sephardi_morocco.7.historical_info: "Samuel Pallache bol skutočný marocký židovský diplomat, ktorý začiatkom 17. storočia slúžil na dvore Sa'díovcov ako vyslanec v Holandsku a pomáhal vyjednať jednu z prvých marockých zmlúv s európskou atlantickou mocnosťou. Zároveň mal listy s poverením, ktoré mu umožňovali ako korzárovi napádať španielske lode. Toto spojenie štátnictva a pirátstva pohoršilo nejednu európsku kráľovskú dvoranu, ktorú navštívil." # todo: NEW TRANSLATION
 d009_sephardi_morocco.8.title: "[ShowLocationNameWithNoTooltip('tangier')] pod vládou [ROOT.GetCountry.GetAdjectiveWithNoTooltip]" # todo: NEW TRANSLATION
 d009_sephardi_morocco.8.entry: "Tangier pod novou vládou" # todo: NEW TRANSLATION
 d009_sephardi_morocco.8.desc: "Nech sa [ShowLocationName('tangier')] dostal do rúk našej koruny akokoľvek, teraz sa nečakane ocitáme vo vláde nad usadenou [ShowReligionAdjective('judaism')] komunitou, jedinou, ktorá žije kdekoľvek pod našou zástavou. Pre kráľovstvo, ktoré po celé generácie uzatváralo svoje vlastné pobrežie pred [ShowReligionAdjectiveWithNoTooltip('judaism')] osídľovaním, je to nepríjemná situácia. Naša rada sa pritom nezhodne, či by sa v dôsledku toho malo niečo zmeniť, a ak áno, čo." # todo: NEW TRANSLATION
 d009_sephardi_morocco.8.a: "Tolerujme komunitu." # todo: NEW TRANSLATION
 d009_sephardi_morocco.8.b: "Uvalme prísne obmedzenia." # todo: NEW TRANSLATION
 d009_sephardi_morocco.8.b.tt: "[ShowReligionAdjectiveWithNoTooltip('judaism')] komunita v [ShowLocationNameWithNoTooltip('tangier')] bude s našou vládou hlboko nespokojná" # todo: NEW TRANSLATION
 d009_sephardi_morocco.8.historical_info: "Tangier pripadol v roku 1661 anglickej korune ako súčasť vena Kataríny z Braganzy pri jej sobáši s Karolom II. Spolu s mestom získala aj malú usadenú židovskú komunitu — v tom čase jedinú židovskú komunitu žijúcu kdekoľvek pod anglickou vládou, keďže Židia boli z Anglicka oficiálne vyhnaní už v roku 1290 a späť ich prijali až v roku 1656." # todo: NEW TRANSLATION
 d009_sephardi_morocco.9.title: "[ShowLocationNameWithNoTooltip('mogador')], sultánovi obchodníci" # todo: NEW TRANSLATION
 d009_sephardi_morocco.9.entry: "$d009_sephardi_morocco.9.title$" # todo: NEW TRANSLATION
 d009_sephardi_morocco.9.desc: "Náš [ROOT.GetCountry.GetGovernment.GetRulerTitle] dal vybudovať úplne nový prístav v [ShowLocationName('mogador')], naplánovaný od základov na opustenom úseku pobrežia, a navrhuje udeliť vybranej hŕstke [ShowReligionAdjective('judaism')] obchodných domov faktický monopol na atlantický obchod výmenou za ich lojalitu a kapitál. Všetci obchodníci, ktorí zostali mimo tejto dohody, už dali jasne najavo, čo si o nej myslia." # todo: NEW TRANSLATION
 d009_sephardi_morocco.9.a: "Udeľme im monopol." # todo: NEW TRANSLATION
 d009_sephardi_morocco.9.b: "Rozdeľme obchod medzi všetkých obchodníkov." # todo: NEW TRANSLATION
 d009_sephardi_morocco.9.historical_info: "Sultán Mohammed III. založil Mogador v 60. rokoch 18. storočia ako zámerne plánovaný prístav a vybranej skupine židovských obchodných rodín, známych ako #italic Tujjar as-Sultān#! (sultánovi obchodníci), udelil výsadné postavenie a daňové úľavy na správu atlantického a európskeho obchodu. Vďaka tejto dohode sa Mogador stal jednou z najprosperujúcejších židovských obchodných komunít v novodobej histórii Maroka." # todo: NEW TRANSLATION
 d009_sephardi_morocco.10.title: "Mallāḥ v [ShowLocationNameWithNoTooltip('fez')]" # todo: NEW TRANSLATION
 d009_sephardi_morocco.10.entry: "$d009_sephardi_morocco.10.title$" # todo: NEW TRANSLATION
 d009_sephardi_morocco.10.desc: "Naši [ShowReligionAdjective('judaism')] poddaní v [ShowLocationName('fez')] žili celé generácie roztrúsení po [ShowLocationNameWithNoTooltip('fez')] ako každá iná komunita. Ministri nášho [ROOT.GetCountry.GetGovernment.GetRulerTitle] teraz navrhujú, aby sme im oficiálne zriadili jedinú opevnenú štvrť s vlastnou listinou práv, trhom a bránami. Jej zástancovia to nazývajú ochranou, kritici čímsi oveľa menej šľachetným." # todo: NEW TRANSLATION
 d009_sephardi_morocco.10.a: "Zriaďme Mallāḥ." # todo: NEW TRANSLATION
 d009_sephardi_morocco.10.a.tt: "[ShowReligionAdjectiveWithNoTooltip('judaism')] komunita v [ShowLocationNameWithNoTooltip('fez')] bude obmedzená na jedinú opevnenú štvrť" # todo: NEW TRANSLATION
 d009_sephardi_morocco.10.b: "Dovoľme im žiť slobodne." # todo: NEW TRANSLATION
 d009_sephardi_morocco.10.historical_info: "Mallāḥ vo Feze, založený v roku 1438, bol prvou účelovo vybudovanou židovskou štvrťou v Maroku a v nasledujúcich storočiach sa stal vzorom pre podobné mallāḥ v celej krajine. Pramene sa rozchádzajú v názore, či vznikol predovšetkým ako ochranné opatrenie, ktorým sa židovská komunita presťahovala ďalej od nepokojnej posádky citadely, alebo ako forma segregácie. V praxi pravdepodobne išlo o oboje." # todo: NEW TRANSLATION

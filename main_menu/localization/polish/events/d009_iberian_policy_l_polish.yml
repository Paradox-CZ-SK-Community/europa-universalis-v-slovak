 d009_iberian_policy.1.title: "Štatút [ShowLocationNameWithNoTooltip('toledo')]" # todo: NEW TRANSLATION
 d009_iberian_policy.1.entry: "Štatút Toleda" # todo: NEW TRANSLATION
 d009_iberian_policy.1.desc: "Debata o [ShowLawName('limpieza_de_sangre_law')] dospela v [ShowLocationName('toledo')] do bodu varu. Mnohí predstavitelia [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] požadujú, aby najvyššie hodnosti a benefíciá boli vyhradené výlučne starým kresťanom a aby boli vylúčení všetci potomkovia tých, ktorí konvertovali z [ShowReligionName('judaism')] a [ShowReligionGroupName('muslim')]. Táto záležitosť vyvoláva veľké rozpory, keďže mnohí predstavitelia univerzít a rádov návrh odsudzujú ako nespravodlivý, a tak bol [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')] vyzvaný, aby zasiahol a spor vyriešil." # todo: NEW TRANSLATION
 d009_iberian_policy.1.a: "Slúžiť [ROOT.GetCountry.GetReligion.GetGodName] a [ROOT.GetCountry.GetFlavorRank] smú len tie najčistejšie rody!" # todo: NEW TRANSLATION
 d009_iberian_policy.1.b: "Uplatňovať ho obozretne a zdržanlivo." # todo: NEW TRANSLATION
 d009_iberian_policy.1.c: "Pokúsiť sa nájsť rovnováhu medzi oboma frakciami." # todo: NEW TRANSLATION
 d009_iberian_policy.1.historical_info: "V roku 1546 novozvolený toledský arcibiskup Juan Martínez Silíceo inicioval prijatie nového štatútu o čistote krvi v reakcii na vymenovanie konvertitu. Silíceovi sa podarilo presvedčiť pápeža, aby toto vymenovanie zrušil, a napriek protestom mnohých arcidiakonov, mestských rádov a predstaviteľov univerzít kráľ Filip jeho štatút o čistote krvi schválil. Neskôr sa stal štandardným vzorom pre podobné zákony prijaté v celom Španielsku." # todo: NEW TRANSLATION

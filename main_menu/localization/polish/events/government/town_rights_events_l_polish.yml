l_polish:
 town_rights_events.1.title: "Hlavný prístav [target_location.GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 town_rights_events.1.desc: "Naša starostlivosť o rozvoj [target_location.GetName] spôsobila, že [target_location.GetRank.GetName] priťahuje lukratívne obchodné príležitosti. Úradníci zodpovední za [target_province.GetName] sa na nás obrátili so žiadosťou o usmernenie, ako najlepšie využiť toto novo nadobudnuté bohatstvo." # todo: NEW TRANSLATION
 town_rights_events.1.a: "Nech z toho profituje celá provincia!" # todo: NEW TRANSLATION
 town_rights_events.1.b: "Zvýšte rozvoj prístavu." # todo: NEW TRANSLATION
 town_rights_events.1.c: "Rozdeľte bohatstvo po celom mieste!" # todo: NEW TRANSLATION
 every_location_in_province_dev_and_prosperity_tt: "Každé [location|e] v [target_province.GetName] získa [ShowNamedValue('development_weak_bonus')|+] [development|e] a [ShowNamedValue('prosperity_mild_bonus')|+=2%] [prosperity|e]" # todo: NEW TRANSLATION
 town_rights_events.2.title: "Obchodná stagnácia v [target_location.GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 town_rights_events.2.desc: "Napriek našim snahám o rozvoj [target_location.GetRank.GetName] v [target_location.GetName] sa nám zdá, že námorní obchodníci sa vyhýbajú obchodovaniu tu, ku nášmu zármutku. Dúfajme, že táto stagnácia je len dočasná a nie začiatkom zostupnej špirály." # todo: NEW TRANSLATION
 town_rights_events.2.a: "Pre [target_character.GetShortNameWithNoTooltip] to nie je problém!" # todo: NEW TRANSLATION
 town_rights_events.2.b: "Bohužiaľ, taká je povaha neziskového podnikania." # todo: NEW TRANSLATION
 town_rights_events.2.c: "Táto záležitosť je pod našu dôstojnosť." # todo: NEW TRANSLATION
 administrative_expertise_of_ruler_mitigates_situation_tt: "Administratívne [abilities|e] [target_character.GetName] môžu túto situáciu ľahko zmierniť" # todo: NEW TRANSLATION
 town_rights_events.3.title: "Bohaté sýpky v [target_location.GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 town_rights_events.3.desc: "Roľníci a pracovníci v [target_province.GetName] hlásia, že [target_location.GetRank.GetName] v [target_location.GetName] zažíva nárast v kvalite a množstve vyrábaných a skladovaných potravín. Takéto pozitívne vyhliadky treba ihneď využiť." # todo: NEW TRANSLATION
 town_rights_events.3.a: "Nech z toho ťaží celá provincia [target_province.GetNameWithNoTooltip]!" # todo: NEW TRANSLATION
 town_rights_events.3.b: "Predajme to skôr, než sa pokazí." # todo: NEW TRANSLATION
 town_rights_events.3.c: "Rozdeľte to medzi obyvateľov v [target_location.GetNameWithNoTooltip]." # todo: NEW TRANSLATION
 every_location_gains_mild_prosperity: "Každé [location|e] v [target_province.GetName] získa [ShowNamedValue('prosperity_mild_bonus')|+=2%] [prosperity|e]" # todo: NEW TRANSLATION
 every_pop_in_target_location_mild_satisfaction_tt: "Naše [pops|e] v [target_location.GetName] získajú [ShowNamedValue('pop_satisfaction_mild_bonus')|+=2%] [pop_satisfaction|e]" # todo: NEW TRANSLATION
 income_gained_depends_on_crown_estate_power_tt: "Získané [gold|e] veľmi závisia od našej [crown_power|e]" # todo: NEW TRANSLATION
 town_rights_events.4.title: "Sýpky v [target_location.GetNameWithNoTooltip] sú na pokraji vyčerpania" # todo: NEW TRANSLATION
 town_rights_events.4.desc: "Prišli zlé správy zo sýpky [target_location.GetRank.GetName] v [target_location.GetName]. Skaze, zlé hospodárenie alebo nešťastná zmena ročného obdobia zrazili zásoby na minimum práve v čase, keď boli najviac potrebné. Obyvatelia [target_province.GetName] teraz hľadajú u nás úľavu, aby sa nedostatok nerozšíril po vidieku." # todo: NEW TRANSLATION
 town_rights_events.4.a: "Otvoríme pokladnicu a nakŕmime ich." # todo: NEW TRANSLATION
 town_rights_events.4.b: "Ľudia budú musieť znášať nedostatok." # todo: NEW TRANSLATION
 town_rights_events.4.c: "Treba viac úsilia, skôr než to prerastie do hladomoru." # todo: NEW TRANSLATION
 every_pop_in_target_location_mild_satisfaction_malus_tt: "Každý [pop|e] v [target_location.GetName] stratí [ShowNamedValue('pop_satisfaction_mild_penalty')|+=2%] [pop_satisfaction|e]" # todo: NEW TRANSLATION
 relief_effort_tt: "Pomocné opatrenia zmierňujú závažnosť hladomoru" # todo: NEW TRANSLATION
 town_rights_events.5.title: "Nové metódy výroby nástrojov v [target_location.GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 town_rights_events.5.desc: "Dielne v [target_location.GetName] sa stali centrom experimentovania a technického zdokonaľovania. Mnohí remeselníci hlásia, že vylepšené metódy a lepšie náradie zvyšujú výstup i kvalitu práce. Otázka pred nami je, či tieto zisky majú slúžiť inovácii, miestnemu blahobytu, alebo širšiemu trhu." # todo: NEW TRANSLATION
 town_rights_events.5.a: "Podporte tieto nové techniky." # todo: NEW TRANSLATION
 town_rights_events.5.b: "Nech si z týchto výhod ťaží priamo [target_location.GetNameWithNoTooltip]." # todo: NEW TRANSLATION
 town_rights_events.5.c: "Zaplavme trh novými nástrojmi." # todo: NEW TRANSLATION
 town_rights_events.6.title: "Nekvalitné nástroje z [target_location.GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 town_rights_events.6.desc: "Vlna sťažností sa začala šíriť po tovare vyrábanom pod právami dielní v [target_location.GetName]. Rukoväte sa lámu, čepele rýchlo tupia a spojenia zlyhávajú pod zaťažením. Či už je tento pokles kvality spôsobený zbesilou výrobou alebo chamtivosťou, dôvera v miestnu produkciu zjavne utrpela. Miestne sťažnosti začínajú poškodzovať dobré meno [target_location.GetRank.GetName]!" # todo: NEW TRANSLATION
 town_rights_events.6.a: "Môžeme sprostredkovať riešenie a zachovať dielne." # todo: NEW TRANSLATION
 town_rights_events.6.b: "Táto nedbanlivosť musí byť vyriešená miestne." # todo: NEW TRANSLATION
 town_rights_events.6.c: "Táto hanba sa odráža na [ROOT.GetCountry.GetFlavorRank]." # todo: NEW TRANSLATION
 our_innovative_nature_finds_compromise_tt: "Náš priekopnícky prístup, či už vďaka silnému [ShowSocietyDirectionName('innovative')] sklonom [societal_values|e] alebo príslušnému [trait|e] [target_character.GetName], nám tentokrát pomáha nájsť uskutočniteľný kompromis" # todo: NEW TRANSLATION
 town_rights_events.7.title: "Klenotníci v [target_location.GetNameWithNoTooltip] zdokonaľujú svoje umenie" # todo: NEW TRANSLATION
 town_rights_events.7.desc: "Klenotníci pracujúci pod privilégiami [ROOT.GetCountry.GetGovernment.GetAdjective|U] v [target_location.GetName] ďalej zdokonaľujú svoje remeslo. Rôzne nové metódy robia ich ozdoby jasnejšími než predtým, čo priťahuje obdiv miestnych i cestujúcich obchodníkov. Tento úspech je veľkým krokom k nášmu vzostupu." # todo: NEW TRANSLATION
 town_rights_events.7.a: "Nech tieto techniky pozdvihnú celú provinciu." # todo: NEW TRANSLATION
 town_rights_events.7.b: "Urobte z [target_location.GetNameWithNoTooltip] slávu svojho majstrovstva." # todo: NEW TRANSLATION
 town_rights_events.7.c: "Pôsobivá prehliadka dobre poslúži [ROOT.GetCountry.GetFlavorRank]." # todo: NEW TRANSLATION
 nobles_appreciate_jewellery_displays: "#italic [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] obdivujú tieto nádherné expozície#!" # todo: NEW TRANSLATION
 jewellery_display_reinforces_authority: "#italic Nech táto zbierka posilní našu vládu#!" # todo: NEW TRANSLATION
 town_rights_events.8.title: "Veľký požiar v [target_location.GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 town_rights_events.8.desc: "Zasiahol žiaľ [target_location.GetName]. Plamene preskakujú zo domu na dom a klenotnícka štvrť je teraz čierna od dymu a chaosu. Ak horiaci požiar nezastavíme a rýchlo nezorganizujeme pomoc, škody sa môžu rozšíriť aj za hranice [target_location.GetRank.GetName]." # todo: NEW TRANSLATION
 town_rights_events.8.a: "[target_character.GetShortNameWithNoTooltip] sa osobne postará o odškodnenie obetí." # todo: NEW TRANSLATION
 town_rights_events.8.b: "Oheň všetko pohlcuje!" # todo: NEW TRANSLATION
 town_rights_events.8.c: "Pošlite pomoc a zabráňte najhoršiemu." # todo: NEW TRANSLATION
 nature_of_target_character_assists_the_locals: "Povaha [target_character.GetName] pomáha upokojiť a podporiť miestnych." # todo: NEW TRANSLATION
 chance_the_fire_spreads_neighboring_locations_tt: "Existuje vysoká pravdepodobnosť, že účinky požiaru sa rozšíria do susedných [locations|e]" # todo: NEW TRANSLATION
 relief_effort_prevents_spread_of_fire_tt: "Pomocné opatrenia zabránia ďalšiemu šíreniu požiaru" # todo: NEW TRANSLATION
 town_rights_events.9.title: "Nárast stavby lodí v [target_location.GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 town_rights_events.9.desc: "Lodenice a drevárske závody spojené s námornými právami v [target_location.GetName] sú rušnejšie než kedykoľvek. Teraz pracujú dechtárne nonstop a každý námorník i obchodník hovorí o expanzii. Obchod je na vzostupe! Tento náhly oduch môže formovať nielen [target_location.GetRank.GetName], ale aj naše širšie priority ako [ROOT.GetCountry.GetFlavorRank]." # todo: NEW TRANSLATION
 town_rights_events.9.a: "Nech tento impulz rozšíri naše námorné ambície." # todo: NEW TRANSLATION
 town_rights_events.9.b: "Posilnite námorný obchod v [target_location.GetNameWithNoTooltip]." # todo: NEW TRANSLATION
 town_rights_events.9.c: "Pripomienka, že naša budúcnosť leží na mori." # todo: NEW TRANSLATION
 town_rights_events.10.title: "Nedostatky a nepokoje v [target_location.GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 town_rights_events.10.desc: "Požiadavky stavby lodí okolo [target_location.GetName] vyľudnili okolité lesy a znepokojili tých, ktorí sú od nich závislí. Miestni nariekajú, protesty a nechuť rastú proti kedysi kvetúcemu odvetviu. Tento prechodný blahobyt teraz hrozí rozsievaním neporiadku po celom [target_location.GetRank.GetName]." # todo: NEW TRANSLATION
 town_rights_events.10.a: "Odvolajte práva a upokojte ľud." # todo: NEW TRANSLATION
 town_rights_events.10.b: "Odškodnite straty a udržujte výrobu." # todo: NEW TRANSLATION
 town_rights_events.10.c: "Miestni musia niesť bremeno." # todo: NEW TRANSLATION
 cooldown_10_years: "Toto [town_rights|e] nemožno znova násilne odobrať po dobu #v 10 years#!" # todo: NEW TRANSLATION
 laborers_and_peasants_happy_tt: "[Laborers|E] a [peasants|e] v [target_location.GetName] získajú [ShowNamedValue('pop_satisfaction_weak_bonus')|+=2%] [pop_satisfaction|e]" # todo: NEW TRANSLATION
 town_rights_events.11.title: "Móda v [target_location.GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 town_rights_events.11.desc: "Krajčíri, farbiari a obchodníci s látkami v [target_location.GetName] nastavili nové štandardy v obliekaní! Dobre ušité modely mnohých obyvateľov sa stali izbovým predmetom klebiet! Každá nová kolekcia sa stáva základom štýlu a módy v celom [ROOT.GetCountry.GetFlavorRank]. Ich látky a strihy sa teraz napodobňujú aj mimo [target_province.GetName], a meno [target_location.GetRank.GetName] sa v slušných kruhoch čoraz častejšie vyslovuje s obdivom. Koniec koncov, ľudia sa budú dívať. Nech to stojí za to!" # todo: NEW TRANSLATION
 town_rights_events.11.a: "[target_character.GetShortNameWithNoTooltip] vyzerá priam famózne!" # todo: NEW TRANSLATION
 town_rights_events.11.b: "Jeho sláva nám prinesie prestíž." # todo: NEW TRANSLATION
 town_rights_events.11.c: "Jeho prepracovanosť pozdvihne dôstojnosť nášho [ROOT.GetCountry.GetGovernment.GetAdjective] sídla." # todo: NEW TRANSLATION
 town_rights_events.12.title: "Textilné monopoly si v [target_location.GetNameWithNoTooltip] upevňujú nadvládu" # todo: NEW TRANSLATION
 town_rights_events.12.desc: "Privilégiá udelené v [target_location.GetName] umožnili niekoľkým mocným záujmom dominovať miestnej textilnej výrobe. Menší výrobcovia sa sťažujú na vylúčenie, ceny sa manipulujú a medzi tými, ktorí sú vytlačení z obchodu, rastie nevôľa. Bohatstvo zostáva, ale v čoraz menších rukách..." # todo: NEW TRANSLATION
 town_rights_events.12.a: "[target_character.GetShortNameWithNoTooltip] #italic JE#! textilný priemysel!" # todo: NEW TRANSLATION
 town_rights_events.12.b: "Monopol má svoje využitie." # todo: NEW TRANSLATION
 town_rights_events.12.c: "Nech sa miestne záujmy hádajú medzi sebou." # todo: NEW TRANSLATION
 ruler_regent_finds_good_middle_ground_tt: "[target_character.GetName] nájde rozumnú strednú cestu medzi ziskom a nevôľou vďaka svojej autorite" # todo: NEW TRANSLATION
 local_textile_barons_are_unhappy_tt: "#italic [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] zapojení v textilnom priemysle môžu byť nespokojní s touto nestabilitou#!" # todo: NEW TRANSLATION
 destabilization_spreads_across_the_country: "#italic Spor sa vymyká a prehlbuje nestabilitu po celom [ROOT.GetCountry.GetFlavorRank]#!" # todo: NEW TRANSLATION
 town_rights_events.13.title: "Vynikajúce zbrane z [target_location.GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 town_rights_events.13.desc: "[ShowGoodsName('weaponry')] kované pod privilégiom [ROOT.GetCountry.GetGovernment.GetAdjective|U] v [target_location.GetName] získali chválu miestnych veliteľov. Ich vyváženosť, odolnosť a spracovanie údajne prekračujú bežný štandard a vojaci ich teraz hľadajú s nezvyčajnou horlivosťou. Takáto dokonalosť môže byť len výsledkom našej nadčasovej tradície a pozornosti k detailu." # todo: NEW TRANSLATION
 town_rights_events.13.a: "Nastavte to za štandard pre naše armády." # todo: NEW TRANSLATION
 town_rights_events.13.b: "Využite to na posilnenie náboru v provincii." # todo: NEW TRANSLATION
 town_rights_events.13.c: "Nech sa naši dôstojníci poučia z takej kvality." # todo: NEW TRANSLATION
 town_rights_events.14.title: "[ShowGoodsNameWithNoTooltip('weaponry')] z [target_location.GetNameWithNoTooltip] vyvolávajú nepokoje" # todo: NEW TRANSLATION
 town_rights_events.14.desc: "Rozšírenie zbraní v okolí [target_location.GetName] prinieslo neželaný vedľajší efekt. Viac [ShowGoodsName('weaponry')] sa dostáva do bezohľadných rúk, posilňuje zločincov a zvyšuje miestne napätie. Privilégium, ktoré malo posilniť [ROOT.GetCountry.GetFlavorRank], teraz hrozí, že ho rozvráti. Ach, aký žalostný a znepokojujúci obraz!" # todo: NEW TRANSLATION
 town_rights_events.14.a: "[target_character.GetShortNameWithNoTooltip] obnoví poriadok." # todo: NEW TRANSLATION
 town_rights_events.14.b: "Potlačte nepokoj tam, kde vznikol." # todo: NEW TRANSLATION
 town_rights_events.14.c: "To nie je nič, čo by trochu surovej sily nezvládlo." # todo: NEW TRANSLATION
 kind_martial_nature_of_ruler_helps_tt: "Vojenská disciplína a povaha [target_character.GetName] pomáhajú zvládnuť nepokoj" # todo: NEW TRANSLATION
 town_rights_events.15.title: "Maják učenia v [target_location.GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 town_rights_events.15.desc: "Učeníci a obchodníci s knihami premenili [target_location.GetName] na miesto zhromažďovania učenia. Texty sa z dielní [target_location.GetRank.GetName] šíria ďalej a rýchlejšie a výmena myšlienok začína obohacovať provinciu ďaleko za rámec jednoduchého obchodu. Bez ohľadu na to, ako sa rozhodneme toto osvietenie nasmerovať, príležitosť je zrejmá." # todo: NEW TRANSLATION
 town_rights_events.15.a: "Nech poznanie urýchli náš pokrok." # todo: NEW TRANSLATION
 town_rights_events.15.b: "Urobte z toho skutočné centrum učenia." # todo: NEW TRANSLATION
 town_rights_events.15.c: "Zabezpečte, aby [target_character.GetShortNameWithNoTooltip] mal z týchto kníh úžitok." # todo: NEW TRANSLATION
 town_rights_events.16.title: "Kontroverzné texty z [target_location.GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 town_rights_events.16.desc: "Nie všetky knihy šíria múdrosť bez následkov. Isté texty, ktoré sa teraz šíria cez [target_location.GetName], rozvírili spor medzi učencami i bežnými čitateľmi. Niektorí chvália ich odvážnosť, iní ich odsudzujú ako nebezpečné a znepokojujúce. To, čo bolo vytlačené pre zisk, môže ešte preveriť našu autoritu!" # todo: NEW TRANSLATION
 town_rights_events.16.a: "Náš [ROOT.GetCountry.GetFlavorRank] je nad takou malichernou kritikou." # todo: NEW TRANSLATION
 town_rights_events.16.b: "Takéto texty budú znepokojovať každého gramotného čitateľa." # todo: NEW TRANSLATION
 town_rights_events.16.c: "Potlačte to a akceptujte náklady." # todo: NEW TRANSLATION
 pops_in_target_province_mild_penalty_according_to_literacy_tt: "[pops|e] v [target_province.GetName] stratí [pop_satisfaction|e] v pomere k ich [literacy|e]" # todo: NEW TRANSLATION
 town_rights_events.17.title: "Slávne remeselníctvo v [target_location.GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 town_rights_events.17.desc: "Remeselníci z [target_location.GetName] si vybudovali reputáciu vynikajúcej kvality, ktorá siaha ďaleko za hranice provincie. Ich výrobky sú chválené nielen ako užitočné, ale aj ako objekty hodené obdivu. Takáto povesť sa odráža na celom [ROOT.GetCountry.GetFlavorRank], ak sa rozhodneme ju kultivovať." # todo: NEW TRANSLATION
 town_rights_events.17.a: "Nech ich vynikajúca kvalita je predmetom [ROOT.GetCountry.GetGovernment.GetAdjective] politiky." # todo: NEW TRANSLATION
 town_rights_events.17.b: "Zachovajte tieto štandardy lokálne." # todo: NEW TRANSLATION
 town_rights_events.17.c: "Ich samotná sláva nás poctí." # todo: NEW TRANSLATION
 town_rights_events.18.title: "Majstri z [target_location.GetNameWithNoTooltip] starnú" # todo: NEW TRANSLATION
 town_rights_events.18.desc: "Mnohí z najuznávanejších remeselníkov v [target_location.GetName] kladú náradie bokom. Len málo učňov vlastní ich zručnosť a ešte menej z nich má ich reputáciu. Pokiaľ nepritiahnete talenty zvonku alebo neprijmete straty, [target_location.GetRank.GetName] čoskoro pocíti absenciu týchto skúsených rúk." # todo: NEW TRANSLATION
 town_rights_events.18.a: "Vynaložte potrebné prostriedky na prilákanie prisťahovalcov." # todo: NEW TRANSLATION
 town_rights_events.18.b: "Naša pokladnica zatiaľ unesie toto bremeno." # todo: NEW TRANSLATION
 town_rights_events.18.c: "Provincia musí znášať úpadok." # todo: NEW TRANSLATION
 town_rights_events.19.title: "Zavedené pivovarské štandardy v [target_location.GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 town_rights_events.19.desc: "Pivovarníci z [target_location.GetName] sa dohodli na prísnejších postupoch pri výrobe, skladovaní a predaji nápojov. Krčmy chvália lepšiu konzistenciu, obchodníci vítajú spoľahlivosť a reputácia [target_location.GetRank.GetName] rastie. Skromné remeslo sa môže stať užitočným nástrojom prosperity a poriadku." # todo: NEW TRANSLATION
 town_rights_events.19.a: "Nech tieto štandardy formujú pivovarníctvo v celom [ROOT.GetCountry.GetFlavorRank]." # todo: NEW TRANSLATION
 town_rights_events.19.b: "Podporte miestný rozkvet v [target_location.GetNameWithNoTooltip]." # todo: NEW TRANSLATION
 town_rights_events.19.c: "Naši [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('burghers_estate')] ocenia tento úspech." # todo: NEW TRANSLATION
 town_rights_events.20.title: "Obilie presmerované na varenie piva v [target_location.GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 town_rights_events.20.desc: "To, čo napĺňa poháre, neprázdni sýpky. V [target_location.GetName] sa príliš veľa obilia teraz využíva na varenie piva a obavy sa šíria, že bežné potreby sú obetované pre súkromný zisk. Problém nie je len v obchode, ale aj v prioritách. Miestni sa sťažujú na prázdne sklady, obviňujúc z toho sprisahanie na zvýšenie ziskov miestnych pivovarov na úkor roľníkov." # todo: NEW TRANSLATION
 town_rights_events.20.a: "Odškodnite nedostatok skôr, než sa zhorší." # todo: NEW TRANSLATION
 town_rights_events.20.b: "Ľudia sa budú sťažovať, ale obchod bude pokračovať." # todo: NEW TRANSLATION
 town_rights_events.20.c: "Toto zlé hospodárenie poškodzuje [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('burghers_estate')] aj náš [ROOT.GetCountry.GetFlavorRank]." # todo: NEW TRANSLATION
 town_rights_events.21.title: "Nové [ShowGoodsNameWithNoTooltip('masonry')] techniky v [target_location.GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 town_rights_events.21.desc: "Stavači a kamenári v [target_location.GetName] zaviedli vylepšené metódy kvalitnej [ShowGoodsName('masonry')]. Ich snahy sľubujú pevnejšie stavby, rýchlejšiu výstavbu a viditeľnú premenu okolia provincie [target_province.GetName]. Takéto pokroky môžu znamenať novú éru lepšej architektúry v celom [ROOT.GetCountry.GetFlavorRank], s [target_location.GetNameWithNoTooltip] na čele." # todo: NEW TRANSLATION

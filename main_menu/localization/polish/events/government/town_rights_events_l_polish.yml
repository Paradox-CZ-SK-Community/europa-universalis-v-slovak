 town_rights_events.22.title: "Ťažba kameňa zaťažuje [target_location.GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 town_rights_events.22.desc: "Ten istý [ShowGoodsName('stone')], ktorý buduje múry a trhy, sa získava len ťažkou prácou. Okolo [target_location.GetName] sa ťažba kameňa stáva čoraz namáhavejšou a robotníci pritlačení do tejto driny sú vyčerpaní a nespokojní. Produktivita pokračuje, ale ľudské náklady sú stále ťažšie ignorovať a hrozia zastavením celého miestneho podniku!" # todo: NEW TRANSLATION

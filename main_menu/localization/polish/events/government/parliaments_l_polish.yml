l_polish:
 parliaments.1.title: "[target_city.GetRank.GetNameWithNoTooltip] žiada sídlo v [ROOT.GetCountry.GetGovernment.GetParliament.GetName]"
 parliaments.1.desc: "[target_city.GetRank.GetName] v [target_city.GetName] zbohatlo a rozkvitlo a tamojší obyvatelia sú sklamaní, že nebolo vybrané ako sídlo súčasného [ROOT.GetCountry.GetGovernment.GetParliament.GetName]. Zástupcovia [target_city.GetNameWithNoTooltip] požadujú kompenzáciu a záruku, ktorá zabezpečí ich záujmy do budúcnosti. Vyhrážajú sa, že ak ich požiadavky nebudú splnené, odídu."
 parliaments.1.a: "Uspokojte ich!"
 parliaments.1.b: "Odmietnite ich!"
 parliaments.2.title: "Zhnité mestské časti"
 parliaments.2.desc: "Vďaka svojmu významnému postaveniu v [ROOT.GetCountry.GetGovernment.GetParliament.GetName] sa [target_location.GetName] môže chváliť tým, že má nemalý vplyv na politiku našej krajiny. Obyvatelia [envious.GetName] sa však cítia byť v [ROOT.GetCountry.GetGovernment.GetParliament.GetName] nedostatočne zastúpení. Ľudia z [envious.GetNameWithNoTooltip] si želajú vlastný [ShowBuildingTypeName('urban_parliament_seat')] so všetkými právami, ktoré s ním súvisia. Hoci táto požiadavka sama o sebe pôsobí rozumne, znamenala by aj odobratie mandátu [target_location.GetNameWithNoTooltip], čo by naši [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] určite považovali za vážnu urážku."
 parliaments.2.a: "Spravodlivé alebo nie, to kreslo patrí [target_location.GetNameWithNoTooltip]!"
 parliaments.2.b: "Musíme kreslo prerozdeliť."
 parliaments.3.desc_generic: "Okrem toho, že je dôležitým členom [ROOT.GetCountry.GetGovernment.GetParliament.GetName], je [target_location.GetName] aj centrom viacerých vplyvných obchodných spoločností zainteresovaných v zámorskom obchode."
 parliaments.3.title: "Hospodárska sila [target_location.GetNameWithNoTooltip]"
 parliaments.3.desc: "$parliaments.3.desc_generic$ Zdá sa, že mnohé z týchto spoločností sa rozhodli, že by nezískali nič z realizácie aktuálne prerokovávaného návrhu, a preto vyvíjajú tlak na svojich členov [ROOT.GetCountry.GetGovernment.GetParliament.GetName], aby návrh oslabil."
 parliaments.3.a: "[ROOT.GetCountry.Custom('common_string_negative')]"
 parliaments.3.b: "Ak chcú peniaze, nech ich dostanú."
 parliaments.4.title: "Kúpenie hlasov"
 parliaments.4.desc: "Členovia [ROOT.GetCountry.GetGovernment.GetParliament.GetName] z hnilých volebných obvodov v [target_location.GetName] sa rozhodli postaviť proti nášmu návrhu v [ROOT.GetCountry.GetGovernment.GetParliament.GetName]. Zdá sa, že vlastníka pôdy, ktorý túto oblasť ovláda, niekto presvedčil, že návrh nie je v jeho najlepšom záujme."
 parliaments.4.a: "Smola!"
 parliaments.4.b: "Musíme teda podplatiť vlastníka."
 parliaments.5.title: "Víťazstvo [target_location.GetNameWithNoTooltip] v debate"
 parliaments.5.desc: "Vplyvná [ShowBuildingTypeName('university')] v [target_location.GetName] dokázala presvedčiť členov [ROOT.GetCountry.GetGovernment.GetParliament.GetName] v [ROOT.GetCountry.GetName], aby podporili zvýšenie financovania pre [ShowBuildingTypeNameWithNoTooltip('university')]."
 parliaments.5.a: "[ROOT.GetCountry.Custom('common_string_positive')]"
 parliaments.5.b: "Mali by sa sústrediť výlučne na výskum."
 parliaments.6.desc: "$parliaments.3.desc_generic$ Zdá sa, že mnohé z týchto spoločností sa rozhodli, že by profitovali z realizácie aktuálne prerokovávanej návrhovej politiky, a preto vyvíjajú tlak na svojich členov [ROOT.GetCountry.GetGovernment.GetParliament.GetName], aby ju presadili."
 parliaments.6.a: "[ROOT.GetCountry.Custom('common_string_positive')]"
 parliaments.7.title: "Vojenská podpora v [target_location.GetNameWithNoTooltip]"
 parliaments.7.desc: "Armáda je v mnohých ohľadoch najvplyvnejšou vnútornou silou v [target_location.GetName] a členovia [ROOT.GetCountry.GetGovernment.GetParliament.GetName], ktorí pochádzajú z tejto organizácie a sú jej lojálni, boli presvedčení, aby hlasovali v prospech aktuálne prejednávanej návrhovej politiky."
 parliaments.7.a: "[ROOT.GetCountry.Custom('common_string_positive')]"
 parliaments.7.b: "Ich podpora sama o sebe nám stačí."
 parliaments.8.title: "Vplyv [target_location.GetNameWithNoTooltip]"
 parliaments.8.desc: "Aktuálna debata v [ROOT.GetCountry.GetGovernment.GetParliament.GetName] o tom, ako najlepšie chrániť domácu produkciu, pritiahla pozornosť mnohých v [target_location.GetName]. Táto dôležitá frakcia v [ROOT.GetCountry.GetGovernment.GetParliament.GetName] sa rozhodla podporiť nás v nádeji, že navrhovaná politika prinesie jej oblasti úžitok."
 parliaments.8.a: "[ROOT.GetCountry.Custom('common_string_positive')]"
 parliaments.8.b: "Mali by sme investovať do [target_location.GetNameWithNoTooltip] bez ohľadu na výsledok."
 parliaments.9.title: "Sila [target_location.GetNameWithNoTooltip]"
 parliaments.9.desc: "Ako sídlo nášho hlavného mesta má [target_location.GetName] veľký potenciál profitovať z aktuálne navrhovaných reforiem. Našťastie si to uvedomilo dosť ľudí na to, aby ich zástupca teraz hlasoval v náš prospech."
 parliaments.9.a: "[ROOT.GetCountry.Custom('common_string_positive')]"
 parliaments.10.title: "[target_location.GetNameWithNoTooltip] mení postoj v debate!"
 parliaments.10.desc: "Zdá sa, že členovia [ROOT.GetCountry.GetGovernment.GetParliament.GetName] z [target_location.GetName] si napokon uvedomili, aké prospešné by pre nich bolo prijatie aktuálne prerokovávaného návrhu. Ich podpora našej veci je veľmi vítaná."
 parliaments.10.desc_b: "Zdá sa, že členovia [ROOT.GetCountry.GetGovernment.GetParliament.GetName] z [target_location.GetName] si uvedomili, aké škodlivé by pre nich bolo prijatie aktuálne prerokovávaného návrhu. Ich podpora našej opozícii má veľkú hodnotu."
 parliaments.10.a: "[ROOT.GetCountry.Custom('common_string_positive')]"
 parliaments.11.desc: "Zdá sa, že členovia [ROOT.GetCountry.GetGovernment.GetParliament.GetName] z [target_location.GetName], hoci ešte nedávno pevne stáli na našej strane, úplne zmenili svoj postoj k aktuálne prerokovávanej otázke. Nemôžeme vedieť, ako presne k tomu došlo, no je jasné, že sa už na ich hlas nemôžeme spoliehať."
 parliaments.11.a: "Možno ich premohla chamtivosť..."
 parliaments.12.title: "Žiadna podpora sedliakom"
 parliaments.12.desc: "Hoci povoľujeme, aby [ROOT.GetCountry.GetGovernment.GetEstateName('peasants_estate')] predkladali petície nášmu [ROOT.GetCountry.GetGovernment.GetParliament.GetName], toto právo im nezaručuje rovnaký vplyv, aký majú v tejto inštitúcii ostatné stavy. Počas nedávnej rozpravy sa ukázalo, že obyčajní ľudia v [ROOT.GetCountry.GetName] si neužívajú rovnaké privilégiá ako dominantná vyššia vrstva, ktorá sa navyše stavia proti návrhu od [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('peasants_estate')]."
 parliaments.12.a: "[ROOT.GetCountry.Custom('common_string_negative')]"
 parliaments.12.b: "Aká hrozná nespravodlivosť!"
 parliaments.13.title: "[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('peasants_estate')] dominuje debate"
 parliaments.13.desc: "Odhodlaná kampaň členov [ROOT.GetCountry.GetGovernment.GetEstateName('peasants_estate')] presvedčila [ROOT.GetCountry.GetGovernment.GetParliament.GetName], aby sa priklonil k aktuálne prerokovávanej otázke. Napriek ich nižšiemu spoločenskému statusu je ich hlas v štátnych diskusiách prijímaný ako rovnocenný."
 parliaments.13.a: "[ROOT.GetCountry.Custom('common_string_positive')]"
 parliaments.13.b: "Požiadavky ľudu budú vypočuté."
 parliaments.14.desc_common: "Členovia [ROOT.GetCountry.GetGovernment.GetParliament.GetName] z [target_location.GetName] zastávajú vplyvné postavenie v rámci [ROOT.GetCountry.GetGovernment.GetParliament.GetName], keďže reprezentujú jedno z našich hospodárskych centier."
 parliaments.14.title: "[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('burghers_estate')] v [target_location.GetNameWithNoTooltip]"
 parliaments.14.desc: "$parliaments.14.desc_common$ Ich bohatstvo má v [ROOT.GetCountry.GetGovernment.GetParliament.GetName] veľkú váhu, no našťastie pre nás, prerokovávaný návrh im v prípade schválenia prospeje, takže svoje peniaze míňajú na získavanie podpory, nie na jej marenie."
 parliaments.14.a: "[ROOT.GetCountry.Custom('common_string_positive')]"
 parliaments.15.title: "Bremeno [target_location.GetNameWithNoTooltip]"
 parliaments.15.desc: "Mnohí v [target_location.GetName] sú veľmi sklamaní z návrhu zvýšiť náš dôraz na námornú infraštruktúru. Majú pocit, že ich región už teraz významne prispieva k ozbrojeným silám našej krajiny a namiesto ďalších výdavkov na námorníctvo skôr očakávali, že [ROOT.GetCountry.GetGovernment.GetParliament.GetName] schváli viac prostriedkov priamo pre ich potreby."
 parliaments.15.a: "[ROOT.GetCountry.Custom('common_string_negative')]"
 parliaments.15.a.tt: "Naše [Concept('pops','populácie')|e] v [target_location.GetName] stratia [ShowNamedValue('pop_satisfaction_weak_penalty')|+=2%] [Concept('pop_satisfaction','spokojnosť populácie')|e]" # todo: CONCEPT CASE
 parliaments.16.title: "Námorná dominancia v [target_location.GetNameWithNoTooltip]"
 parliaments.16.desc: "Dominancia námorníctva v [target_location.GetName] spôsobila, že návrh zvýšiť výdavky na armádu bol v tejto oblasti prijatý veľmi chladne. Hoci spočiatku boli k návrhu naklonení, členovia [ROOT.GetCountry.GetGovernment.GetParliament.GetName] z tohto regiónu teraz nevidia inú možnosť než hlasovať proti nemu."
 parliaments.16.a: "[ROOT.GetCountry.Custom('common_string_negative')]"
 parliaments.17.desc_common: "Ľudia v [target_location.GetName] zvyčajne vyznávajú inú vieru než my a členovia [ROOT.GetCountry.GetGovernment.GetParliament.GetName], ktorí sú zodpovední za [target_location.GetNameWithNoTooltip], boli obvinení z toho, že uprednostňujú ich záujmy pred záujmami našej viery."
 parliaments.17.title: "Viera [target_location.GetNameWithNoTooltip]"
 parliaments.17.desc_tolerance: "$parliaments.17.desc_common$ Tieto obvinenia však obvykle vyvolávajú len smiech u ostatných členov [ROOT.GetCountry.GetGovernment.GetParliament.GetName], keďže nie je ničím nezvyčajným, že si ceníme aj tých, ktorí vyznávajú inú vieru než štátnu."
 parliaments.17.desc_intolerance: "$parliaments.17.desc_common$ Takéto drastické obvinenia poškodili povesť [target_location.GetNameWithNoTooltip] a oslabili podporu aktuálne prerokovaného návrhu v [ROOT.GetCountry.GetGovernment.GetParliament.GetName]."
 parliaments.17.a: "Bola to vôľa [ROOT.GetCountry.GetReligion.GetGodName]."
 parliaments.18.title: "Očakávania [target_location.GetNameWithNoTooltip]"
 parliaments.18.desc: "Členovia [ROOT.GetCountry.GetGovernment.GetParliament.GetName] z [target_location.GetName] sú prekvapivo naklonení nášmu návrhu v prebiehajúcej parlamentnej debate. Zdá sa, že univerzita v [target_location.GetNameWithNoTooltip] verí, že bude zapojená do počítania a merania, ktoré sú súčasťou navrhovanej politiky, a učenci sú nadšení príležitosťou podieľať sa na zhromažďovaní nových surových údajov o našej krajine."
 parliaments.18.a: "[ROOT.GetCountry.Custom('common_string_ok')]"
 parliaments.19.title: "Nekompetentnosť [target_character.GetNameWithNoTooltip]"
 parliaments.19.desc: "Keďže súčasná debata v [ROOT.GetCountry.GetGovernment.GetParliament.GetName] sa sústreďuje na zloženie nášho [ROOT.GetCountry.GetGovernment.GetCabinetTitle], na povrch vyplávala vážna chyba, ktorej sa dopustil [target_character.GetName]. Počas [target_character.GetHerHis] pôsobenia sa [target_character.GetHerHis] schopnosti očividne rýchlo zhoršili a možno budeme musieť zvážiť úplnú náhradu [target_character.GetHerHim]."
 parliaments.19.a: "[ROOT.GetCountry.Custom('common_string_negative')]"
 parliaments.20.title: "Život v [ROOT.GetCountry.GetCapital.GetNameWithNoTooltip]"
 parliaments.20.desc: "Ako zástupcovia oblastí, ktoré sú niekedy dosť vzdialené od [ROOT.GetCountry.GetCapital.GetName], mnohí členovia [ROOT.GetCountry.GetGovernment.GetParliament.GetName] často zisťujú, že život v [ROOT.GetCountry.GetCapital.GetNameWithNoTooltip] počas ich návštev je veľmi odlišný od toho, na čo sú zvyknutí. Niektorým pripadá stiesnený a špinavý a mnohí si zjavne vydýchnu, keď sa môžu vrátiť domov.\n\nTento rok bol pre citlivé povahy našich členov [ROOT.GetCountry.GetGovernment.GetParliament.GetName] ešte náročnejší než zvyčajne. Horúce mesiace boli neobyčajne horúce, daždivé mesiace neobyčajne daždivé a studené mesiace neobyčajne studené. Mnoho členov [ROOT.GetCountry.GetGovernment.GetParliament.GetName] sa teraz rozhodlo, že už toho majú dosť, a požiadali nás o pomoc so spríjemnením ich pobytu."
 parliaments.20.a: "Musíme urobiť, čo môžeme."
 parliaments.20.b: "Budú to musieť znášať ako my ostatní."
 parliaments.21.title: "Členovia [ROOT.GetCountry.GetGovernment.GetParliament.GetName] v škandále"
 parliaments.21.desc: "Počas aktuálnej debaty vypukol v [ROOT.GetCountry.GetCapital.GetName] menší škandál. Zdá sa, že namiesto osobnej účasti na zasadnutiach niektorí členovia [ROOT.GetCountry.GetGovernment.GetParliament.GetName] vyrušovali verejný poriadok a obťažovali svojich spoluobčanov. Pobúrenie je veľké, ako medzi ich kolegami, tak aj v uliciach, a tento incident bude pravdepodobne vrhať tieň na budúce parlamenty ešte roky."
 parliaments.21.a: "$common_string_let_it_slide$"
 parliaments.21.b: "Zatknite členov [ROOT.GetCountry.GetGovernment.GetParliament.GetName]."
 parliaments.22.title: "Neprítomnosť"
 parliaments.22.desc: "Vzhľadom na veľký vplyv tejto inštitúcie na politiku našej krajiny by sa dalo predpokladať, že všetci členovia [ROOT.GetCountry.GetGovernment.GetParliament.GetName] sa parlamentných zasadnutí zúčastňujú s veľkým nadšením, aby naplno využili moc, ktorá im bola zverená. Skutočnosť je však úplne iná. V ktoromkoľvek [ROOT.GetCountry.GetGovernment.GetParliament.GetName] sa nájdu takí, ktorí sa neukážu nikdy — či už preto, že si stále užívajú svoje vidiecke statky, alebo sa rozhodli venovať radovánkam hlavného mesta. Tento problém v poslednom čase narastá a obávame sa, že zahraniční diplomati sa nám za chrbtom posmievajú. Môžeme pokutovať tých, ktorí chýbajú počas debát, aby sme zvýšili účasť, no títo členovia [ROOT.GetCountry.GetGovernment.GetParliament.GetName] to určite neprijmú s nadšením."
 parliaments.22.a: "Pokutovať najhorších previnilcov."
 parliaments.22.b: "[ROOT.GetCountry.Custom('common_string_nothing_we_can_do')]"
 parliaments.23.title: "Požiadavky na zastúpenie"
 parliaments.23.desc: "V mestách [ROOT.GetCountry.GetName] sa začalo šíriť množstvo nepriateľských pamfletov. Anonymní, no mimoriadne kritickí autori tvrdia, že naša vláda je autokratická a nespravuje krajinu so zreteľom na situáciu všetkých [ROOT.GetCountry.GetAdjectiveWithNoTooltip] ľudí, spolu s ďalšími podobne absurdnými obvineniami. Požadujú písanú ústavu a parlament, v ktorom budú zastúpené všetky časti našej krajiny."
 parliaments.23.a: "Zakázať publikácie."
 parliaments.23.b: "Urobte neurčité sľuby reforiem."
 parliaments.24.title: "Finančná pomoc"
 parliaments.24.desc: "Zdá sa, že zlé finančné pomery našej vlády a naše zúfalé hľadanie akýchkoľvek zdrojov sa stali verejne známymi. Hoci to iste poškodí našu povesť doma aj v zahraničí, prinieslo to aj určité výhody — viacerí členovia [ROOT.GetCountry.GetGovernment.GetParliament.GetName], zastupujúci [target_location.GetName], nás oslovili s ponukou pomoci. Ich cena je však vyššie zastúpenie vo vláde a tiež formalizované kanály, ktorými ich bude môcť štát v budúcnosti žiadať o podporu."
 parliaments.24.a: "Udeľte im väčšie zastúpenie."
 parliaments.24.b: "Odmietnite ich peniaze."
 parliaments.24.c: "Sľúbte, že ich názory zvážime."
 parliaments.25.desc: "$parliaments.14.desc_common$ Ich bohatstvo má v [ROOT.GetCountry.GetGovernment.GetParliament.GetName] veľký vplyv a, žiaľ, ho využívajú na lobovanie proti našim súčasným snahám."
 parliaments.25.a: "[ROOT.GetCountry.Custom('common_string_negative')]"
 parliaments.27.title: "Parlamentné tradície"
 parliaments.27.desc: "Jedna z ťažších stránok práce parlamentára nesúvisí ani tak s rozpravami v [ROOT.GetCountry.GetCapital.GetName], ako skôr s tým, ako tieto debaty a kompromisy správne „predať“ ľuďom doma. Napriek tomu bude mať miestny člen [ROOT.GetCountry.GetGovernment.GetParliament.GetName] spravidla oveľa jednoduchšie vysvetliť nový daňový zákon než výberca vyslaný centrálnou vládou v menej reprezentatívnych systémoch.\n\nZdá sa, že členovia [ROOT.GetCountry.GetGovernment.GetParliament.GetName] vo všeobecnosti — a najmä tí z [target_location.GetName] — sa stali takými zručnými v obhajovaní politík, že sme zaznamenali nárast podpory centrálnej vlády ako celku."
 parliaments.27.a: "Konečne nám rozumejú!"
 parliaments.26.title: "Zhovievavé [ROOT.GetCountry.GetGovernment.GetParliament.GetName]"
 parliaments.26.desc: "Členovia nášho [ROOT.GetCountry.GetGovernment.GetParliament.GetName] boli v poslednom čase mimoriadne ústretoví. Vďaka ich lojalistickým sklonom by sme ich mohli ľahko nakloniť na našu stranu alebo z ich regiónov získať dodatočné zdroje."
 parliaments.26.a: "Najdôležitejšie je využiť ich lojalitu."
 parliaments.26.b: "Potrebujeme tvrdú menu!"
 parliaments.28.title: "Kolízia autorít"
 parliaments.28.desc: "V [ROOT.GetCountry.GetCapital.GetName] sa objavil zriedkavý a neočakávaný jav: [ROOT.GetCountry.GetGovernment.GetEstateName('peasants_estate')], [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')] a ďalší členovia stredných a nižších vrstiev si zvolali vlastný provizórny [ROOT.GetCountry.GetGovernment.GetParliament.GetName]. Spojení v nespokojnosti presadzujú debatu o [target_debate.GetName] a požadujú zmeny, ktoré priamo spochybňujú vôľu [target_character.GetName]. Mnohí z nich, poháňaní frustráciou z vládnucej vrstvy, sa rozhodli, že už nedokážu znášať status quo a ozývajú sa napriek silnej opozícii zo strany [target_character.GetShortNameWithNoTooltip]."
 parliaments.28.a: "Naši disciplinári stratili účinok!"
 parliaments.29.title: "The [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] majú v rukách všetky karty" # todo: NEW TRANSLATION
 parliaments.29.desc: "The [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')] predložili formálnu sťažnosť pred [ROOT.GetCountry.GetGovernment.GetParliament.GetName], a ťažko ich obviňovať z oprávnenosti. The [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] držia rozhodujúcu časť moci, vytláčajú obchodníkov, ktorí vytvárajú takú veľkú časť bohatstva [ROOT.GetCountry.GetName]. Ak to necháme bez kontroly, táto nerovnováha prerastie do otvoreného znechutenia. Musíme sa rozhodnúť, či lojalita k našim najstarším spojencom stojí za cenu odcudzenia tých, ktorí napĺňajú našu pokladnicu." # todo: NEW TRANSLATION
 parliaments.29.a: "The [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] have served us well." # todo: NEW TRANSLATION
 parliaments.29.b: "The merchants deserve a fair hearing." # todo: NEW TRANSLATION
 parliaments.30.title: "Otázka viery v [ROOT.GetCountry.GetGovernment.GetParliament.GetName]" # todo: NEW TRANSLATION
 parliaments.30.desc: "Diskutovať o cestách a daniach je fajn, no naši [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] nám pripomínajú, že nie celé [ROOT.GetCountry.GetName] uctieva pravú vieru. Keď je tak veľa duší ešte mimo jej svetla, ako sa môže [ROOT.GetCountry.GetGovernment.GetParliament.GetName] zaoberať menšími záležitosťami? Ich argument znie presvedčivo, možno nepríjemne presvedčivo. Musíme sa rozhodnúť, či necháme duchovný zápal viesť túto schôdzu, alebo obmedzíme ambície kléru." # todo: NEW TRANSLATION
 parliaments.30.a: "Viera si žiada našu plnú pozornosť." # todo: NEW TRANSLATION
 parliaments.30.b: "Duchovné záležitosti môžu počkať." # todo: NEW TRANSLATION
 parliaments.31.title: "Hlas bezprávnych" # todo: NEW TRANSLATION
 parliaments.31.desc: "Na [ROOT.GetCountry.GetGovernment.GetParliament.GetName] dorazila hrubá kôpka petícií, každá plná sťažností najutláčanejších poddaných [ROOT.GetCountry.GetName]. [ROOT.GetCountry.GetGovernment.GetEstateName('peasants_estate')] majú pramálo moci, no ich nespokojnosť rastie nebezpečne nahlas. Ak tieto volania odmietneme, riskujeme, že sa dusená nevôle zmení na niečo oveľa škaredšie. Ak budeme počúvať, môžeme povzbudiť tých, ktorí by roľníkov využili ako politickú zbraň." # todo: NEW TRANSLATION
 parliaments.31.a: "Ich utrpenie si zaslúži uznanie." # todo: NEW TRANSLATION
 parliaments.31.b: "Musí sa zachovať poriadok." # todo: NEW TRANSLATION
 parliaments.32.title: "Kláštorné trhy" # todo: NEW TRANSLATION
 parliaments.32.desc: "The [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')] sú rozhorčení. Kláštorné dielne a cirkevné obchodné domy podrezávajú ich ceny všade, pritom majú značnú výhodu v tom, že sú oslobodené od daní, ktoré musia platiť poctiví obchodníci. The [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] v tom samozrejme nevidia žiadnu nespravodlivosť. Obe frakcie žiadajú vypočutie a nemôžeme vyhovieť obom. Tento spor sa sám nevyrieši." # todo: NEW TRANSLATION
 parliaments.32.a: "The [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')] have a point." # todo: NEW TRANSLATION
 parliaments.32.b: "The [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] serve a higher purpose." # todo: NEW TRANSLATION
 parliaments.32.c: "Nebudeme uprednostňovať nikoho." # todo: NEW TRANSLATION
 parliaments.33.title: "Kam zmizli všetky peniaze?" # todo: NEW TRANSLATION
 parliaments.33.desc: "The [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] a [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')] sa spojili v [ROOT.GetCountry.GetGovernment.GetParliament.GetName], aby položili otázku, na ktorú by sme najradšej neodpovedali. Ako sa nám podarilo nahromadiť toľko dlhov? Naše výdavky boli skutočne značné a veritelia strácajú trpezlivosť. Môžeme sa tomuto búraniu postaviť pevnou odpoveďou, alebo sľúbiť veci, ktoré sa nám bude ťažko dodržiavať. Ani jedna odpoveď nie je príjemná." # todo: NEW TRANSLATION
 parliaments.33.a: "Our expenditures serve [ROOT.GetCountry.GetName]'s glory." # todo: NEW TRANSLATION
 parliaments.33.b: "Utiahneme opasok." # todo: NEW TRANSLATION
 parliaments.34.title: "Právo poslať zástupcu" # todo: NEW TRANSLATION
 parliaments.34.desc: "Nie každý člen [ROOT.GetCountry.GetGovernment.GetParliament.GetName] môže byť vždy osobne prítomný — vojny, choroby a značné vzdialenosti medzi statkami [ROOT.GetCountry.GetName] to zaručujú. [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] požiadali, aby ich neprítomní členovia mohli posielať zástupcov s plným právom hlasovať. Z ich perspektívy je to rozumné. Koruna to vidí inak. Parlament zástupcov sa nedá tak ľahko pritlačiť alebo presvedčiť ako sála plná skutočných ľudí. Musíme sa rozhodnúť, aký typ inštitúcie chceme, aby [ROOT.GetCountry.GetGovernment.GetParliament.GetName] bol." # todo: NEW TRANSLATION
 parliaments.34.a: "Chýbajúci páni môžu poslať zástupcov." # todo: NEW TRANSLATION
 parliaments.34.b: "Všetky hlasy musia byť odovzdané osobne." # todo: NEW TRANSLATION
 parliaments.35.title: "Vzácna zhoda" # todo: NEW TRANSLATION
 parliaments.35.desc: "Niečo nezvyčajné sa stalo v [ROOT.GetCountry.GetGovernment.GetParliament.GetName]. [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] a [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')] našli spoločnú vec, na ktorej sa skutočne zhodujú, a priniesli ju k nám jedným hlasom. Takéto momenty jednoty sú príliš zriedkavé na to, aby sme ich premárnili. Bolo by rozumné ich prijať, i keď si vždy treba klásť otázku, čo od toho každá strana očakáva ako protihodnotu." # todo: NEW TRANSLATION
 parliaments.35.a: "Jednota prospieva [ROOT.GetCountry.GetName]." # todo: NEW TRANSLATION
 parliaments.35.b: "Ich jednota nás znepokojuje." # todo: NEW TRANSLATION
 parliaments.36.title: "Cena tejto vojny" # todo: NEW TRANSLATION
 parliaments.36.desc: "The [ROOT.GetCountry.GetGovernment.GetParliament.GetName] je vyčerpaný. Petície od rodín vojakov, od skrachovaných obchodníkov, od kňazov, ktorí museli požehnávať príliš veľa hrobov, sa hromadia rýchlejšie než víťazstvá. Aj tí, ktorí na začiatku hlasno povzbudzovali vyhlásenie vojny, teraz blednú pri pohľade na účty. Môžeme ich opäť povzbudiť sľubom eventualneho víťazstva, alebo prizneme daň, ktorú vojna požiadala. Tak či onak, nemôžeme náladu v tých komorách už dlhšie ignorovať." # todo: NEW TRANSLATION
 parliaments.36.a: "Víťazstvo ospravedlní každú obetu." # todo: NEW TRANSLATION
 parliaments.36.b: "Počujeme utrpenie nášho ľudu." # todo: NEW TRANSLATION
 parliaments.37.title: "[ROOT.GetCountry.GetGovernment.GetParliament.GetName] volá do zbraní" # todo: NEW TRANSLATION
 parliaments.37.desc: "The [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] jasne vyjadrili svoju pozíciu. Nepriateľ nebude čakať a ani armády [ROOT.GetCountry.GetName] nemôžu. Žiadajú, aby [ROOT.GetCountry.GetGovernment.GetParliament.GetName] okamžite autorizoval núdzové odvody. Či už súhlasíme s ich naliehavosťou, battlefield zriedka býva trpezlivé miesto. Musíme sa rozhodnúť, do akej miery predĺžime tento výzvu k zbraniam a ktorých synov nútime odpovedať." # todo: NEW TRANSLATION
 parliaments.37.a: "Povoliť núdzové odvody." # todo: NEW TRANSLATION
 parliaments.37.b: "Nebudeme nariaďovať povinné odvody." # todo: NEW TRANSLATION
 parliaments.38.title: "Tí, ktorí sa vrátili domov" # todo: NEW TRANSLATION
 parliaments.38.desc: "Bojovali pod našimi farbami, krvácal pri našich hraniciach a teraz sú doma, z veľkej časti zabudnutí. Veteráni z našej poslednej kampane požiadali [ROOT.GetCountry.GetGovernment.GetParliament.GetName] o nejaké uznanie ich služby, či už pôdou, peniazmi alebo aspoň slovným uznaním od ich vládcov. Náklady na ich poctenie sú skromné. Náklady na ignorovanie by mohli byť oveľa vyššie." # todo: NEW TRANSLATION
 parliaments.38.a: "Udelíme im pôdu." # todo: NEW TRANSLATION
 parliaments.38.b: "Vyplatíme im vojenskú odmenu." # todo: NEW TRANSLATION
 parliaments.38.c: "Služili. To je dostatočná odmena." # todo: NEW TRANSLATION
 parliaments.39.title: "Vlci na okraji mapy" # todo: NEW TRANSLATION
 parliaments.39.desc: "Naši susedia neboli v svojich úmysloch subtílni. The [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] priniesli do [ROOT.GetCountry.GetGovernment.GetParliament.GetName] správy o provokáciách pozdĺž našich hraníc — prehliadnuté diplomatické gestá, pohyby vojska, obyčajné divadlo, ktoré predchádza niečomu menej divadelnému. Môžeme teraz financovať obranu, kým ešte máme luxus času, alebo môžeme vyhľadať diplomatické riešenie skôr, než meče opustia pošvy." # todo: NEW TRANSLATION
 parliaments.39.a: "Opevniť naše hranice." # todo: NEW TRANSLATION
 parliaments.39.b: "Najprv poslať diplomatov." # todo: NEW TRANSLATION
 parliaments.40.title: "Hlad nepočká na parlament" # todo: NEW TRANSLATION
 parliaments.40.desc: "Petície sú napísané jednoduchým jazykom — tým, ktorý sa používa, keď dôjde trpezlivosť s milými frázami. Sklady sú prázdne. Deti sú hladné. [ROOT.GetCountry.GetGovernment.GetEstateName('peasants_estate')] to predniesli pred [ROOT.GetCountry.GetGovernment.GetParliament.GetName] nie preto, že veria v krásne reči, ale preto, že nemajú kam ísť. Nemôžeme to debatovať do bezvedomia. Niečo sa musí urobiť a rýchlo." # todo: NEW TRANSLATION
 parliaments.40.a: "Okamžite kúpiť zásoby obilia." # todo: NEW TRANSLATION
 parliaments.40.b: "Otvoríme naše trhy pre zahraničné obilie." # todo: NEW TRANSLATION
 parliaments.40.c: "Nech trhy samy upravia situáciu." # todo: NEW TRANSLATION
 parliaments.41.title: "Minca má každý mesiac menšiu hodnotu" # todo: NEW TRANSLATION
 parliaments.41.desc: "Naši [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')] sú znepokojení a tentoraz nepreháňajú. Ceny rastú tempom, ktoré prevyšuje každé rozumné vysvetlenie, a hodnota toho, čo preteká naším pokladnicou, deň čo deň klesá. Ak to neodchytíme, môže to zničiť práve obchodné vrstvy, ktoré držia [ROOT.GetCountry.GetName] solventné. Potrebujeme rozhodný zásah, hoci jeho forma poteší niekoho a iných rozzúri." # todo: NEW TRANSLATION
 parliaments.41.a: "Zaviesť úsporné opatrenia." # todo: NEW TRANSLATION
 parliaments.41.b: "Uložiť vinu tam, kde patrí." # todo: NEW TRANSLATION
 parliaments.41.c: "Najprv splatiť naše dlhy." # todo: NEW TRANSLATION
 parliaments.42.title: "Dve mestá, jeden trh" # todo: NEW TRANSLATION
 parliaments.42.desc: "Obidve mestá poslali svojich zástupcov do [ROOT.GetCountry.GetGovernment.GetParliament.GetName] a obidve sa sporia s obdivuhodnou silou a značným hlukom. Otázka, kto bude držať dominantnú obchodnú listinu v [ROOT.GetCountry.GetName], sa úprimne nevyrieši sama. Môžeme jednej ríši udeliť výnimočné privilégium, alebo môžeme otvoriť trh a nechať konkurenciu urobiť to, čo parlamenty len zriedka dokážu — vyriešiť problém samy." # todo: NEW TRANSLATION
 parliaments.42.a: "Jeden obchodný štatút, jeden dominantný trh." # todo: NEW TRANSLATION
 parliaments.42.b: "Nech ich súťaž bude slobodná." # todo: NEW TRANSLATION
 parliaments.43.title: "Bremeno dlhov [ROOT.GetCountry.GetName]" # todo: NEW TRANSLATION
 parliaments.43.desc: "Kniha účtov nie je príjemný dokument na prezeranie. Dlhujeme viac, než by sme radi priznali, a naši veritelia nie sú trpezlivý druh. [ROOT.GetCountry.GetGovernment.GetParliament.GetName] zvolal núdzové zasadnutie, aby sa tým zaoberal, hoci 'zaoberať sa' je štedré slovo pre tri divoko nekompatibilné návrhy, ktoré sa momentálne kričia po celej miestnosti. Musíme si vybrať jeden a žiť s následkami." # todo: NEW TRANSLATION
 parliaments.43.a: "Reštrukturalizovať dlhy." # todo: NEW TRANSLATION
 parliaments.43.b: "Zvýšiť dane, aby sme to pokryli." # todo: NEW TRANSLATION
 parliaments.43.c: "Predať, čo musí byť predané." # todo: NEW TRANSLATION
 parliaments.44.title: "Tentokrát dobré správy" # todo: NEW TRANSLATION
 parliaments.44.desc: "Tentoraz sa [ROOT.GetCountry.GetGovernment.GetParliament.GetName] zišiel s niečím príjemným na rozhovor. Kráľovstvo je stabilné, pokladnica neplače a náš ľud sa nepripustil k ničomu katastrofálnemu. Objavili sa viaceré návrhy, ako najlepšie využiť túto vzácnu šťastenu, a na zmenu sú debaty takmer slušné. Nezmeškajme túto chvíľu." # todo: NEW TRANSLATION
 parliaments.44.a: "Budovať pre budúcnosť." # todo: NEW TRANSLATION
 parliaments.44.b: "Podeliť sa o bohatstvo s našimi poddanými." # todo: NEW TRANSLATION
 parliaments.44.c: "Pripraviť sa na vojnu, ktorá nevyhnutne príde." # todo: NEW TRANSLATION
 parliaments.45.title: "Kacíctvo v sieňach moci" # todo: NEW TRANSLATION
 parliaments.45.desc: "Nové náboženské myšlienky, ktoré sa šíria po [ShowContinentName('europe')], dorazili na lavice nášho vlastného [ROOT.GetCountry.GetGovernment.GetParliament.GetName], a [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] to neberú pokojne. Reformné letáky kolujú, hlasy sa zdvíhajú v hneve a pri minulotýždňovom zasadnutí sa len tesne predišlo bitke. Musíme zaujať postoj, skôr než sa to z teologickej debaty zmení na niečo oveľa nebezpečnejšie." # todo: NEW TRANSLATION
 parliaments.45.a: "Parlament bude stáť pri pravej viere." # todo: NEW TRANSLATION
 parliaments.45.b: "Parlament vypočuje všetky hlasy." # todo: NEW TRANSLATION
 parliaments.46.title: "Kto si prisvojí zásluhy?" # todo: NEW TRANSLATION
 parliaments.46.desc: "The [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] aj [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] trvajú na tom, že budú zapamätaní ako veľkí patrónovia tejto éry. Ich hádka o tom, čia štedrosť urobila viac pre umenie [ROOT.GetCountry.GetName], je treba priznať, do istej miery zábavná, až kým si človek nespomenie, že úplne zablokovala bežné záležitosti [ROOT.GetCountry.GetGovernment.GetParliament.GetName] za posledné dve zasadnutia. Niekto musí byť vyhlásený za víťaza." # todo: NEW TRANSLATION
 parliaments.46.a: "The [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] poháňali našu kultúrnu renesanciu." # todo: NEW TRANSLATION
 parliaments.46.b: "The [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] boli skutočnými patrónmi." # todo: NEW TRANSLATION
 parliaments.46.c: "Obom prislúcha rovnocenné uznanie." # todo: NEW TRANSLATION
 parliaments.47.title: "Nebezpečné slová v nebezpečných časoch" # todo: NEW TRANSLATION
 parliaments.47.desc: "Odkedy kníhtlač prišla do [ROOT.GetCountry.GetName], [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] sa sťažujú na letáky. [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')] ich rozširujú. Obe tábory prišli do [ROOT.GetCountry.GetGovernment.GetParliament.GetName] s veľmi silnými názormi na to, ktorú verziu udalostí treba šíriť slobodne. Jedna strana to nazýva osvietením. Druhá to nazýva vzburou. Budeme si musieť vybrať, ktoré slovo preferujeme." # todo: NEW TRANSLATION
 parliaments.47.a: "Obmedziť škodlivé publikácie." # todo: NEW TRANSLATION
 parliaments.47.b: "Tlač musí byť slobodná." # todo: NEW TRANSLATION
 parliaments.48.title: "Božie lány a roľníkov pluh" # todo: NEW TRANSLATION
 parliaments.48.desc: "Spor, ktorý dusí naše vidieky celé generácie, konečne dorazil do [ROOT.GetCountry.GetGovernment.GetParliament.GetName] v celej svojej neohrabanej zložitosti. Kláštorné pozemky tlačia na roľnícke polia a otázka, kto čo môže obrábať, vyrástla z miestnej sťažnosti na zásadnú záležitosť. [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] si nárokujú božské právo. [ROOT.GetCountry.GetGovernment.GetEstateName('peasants_estate')] sa odvolávajú na tradíciu. Ani jeden argument nie je úplne nesprávny, čo robí túto záležitosť takou ťažkou." # todo: NEW TRANSLATION
 parliaments.48.a: "Práva kláštorov sú posvätné." # todo: NEW TRANSLATION
 parliaments.48.b: "Vrátiť sporné pozemky roľníkom." # todo: NEW TRANSLATION
 parliaments.49.title: "Hlas z nových území" # todo: NEW TRANSLATION
 parliaments.49.desc: "Zástupcovia z nedávno získaných území prišli žiadať [ROOT.GetCountry.GetGovernment.GetParliament.GetName] o práva a zastúpenie. Hovoria bez povýšenosti, no s tichou odhodlanosťou, ktorá aspoň čiastočne zaujme pozornosť. Otázka, či ich začleniť do stroja [ROOT.GetCountry.GetAdjectiveWithNoTooltip] vlády alebo ich žiadosť odmietnuť, ovplyvní, ako naši noví poddaní budú vnímať svojich vládcov desiatky rokov." # todo: NEW TRANSLATION
 parliaments.49.a: "Dajme im hlas v našom [ROOT.GetCountry.GetGovernment.GetParliament.GetName]." # todo: NEW TRANSLATION
 parliaments.49.b: "Sú poddaní, nie účastníci." # todo: NEW TRANSLATION
 parliaments.50.title: "Kráľovstvo v rámci kráľovstva" # todo: NEW TRANSLATION
 parliaments.50.desc: "Veľkí páni našich provinčných statkov prišli do [ROOT.GetCountry.GetGovernment.GetParliament.GetName] so starou požiadavkou zabalenou v novom jazyku. Nazývajú to 'miestnou správou.' Čo majú na mysli, samozrejme, je, že chcú, aby sme ich nechali viesť vlastné záležitosti bez zásahov z hlavného mesta, čo je zdvorilý spôsob, ako nás požiadať, aby sme menej vládli svojej vlastnej krajine. Je to lákavá predstava, ak nad tým príliš nepremýšľate." # todo: NEW TRANSLATION
 parliaments.50.a: "Udelíme im miestne súdy." # todo: NEW TRANSLATION
 parliaments.50.b: "Koruna vládne nad celým [ROOT.GetCountry.GetName]." # todo: NEW TRANSLATION
 parliaments.51.title: "Neporiadok na okrajoch" # todo: NEW TRANSLATION
 parliaments.51.desc: "Správa bola predložená [ROOT.GetCountry.GetGovernment.GetParliament.GetName], ktorá sa zle číta. V niektorých kútoch [ROOT.GetCountry.GetName] sa zákon krajiny javí skôr ako návrh než pravidlo. Miestni úradníci sú buď neprítomní, neschopní, alebo jednoducho početne prekonaní. [ROOT.GetCountry.GetGovernment.GetEstateName('peasants_estate')] boli najhlasnejší vo svojich sťažnostiach, čo zvyčajne spoľahlivo znamená, že problém je reálny. Nemožno dovoliť, aby sa to zanedbalo." # todo: NEW TRANSLATION
 parliaments.51.a: "Poslať správcov na obnovenie poriadku." # todo: NEW TRANSLATION
 parliaments.51.b: "Namiesto toho poslať vojakov." # todo: NEW TRANSLATION
 parliaments.52.title: "Dva národy, jeden [ROOT.GetCountry.GetGovernment.GetParliament.GetName]" # todo: NEW TRANSLATION
 parliaments.52.desc: "Pripojenie nových území prinieslo pod [ROOT.GetCountry.GetAdjectiveWithNoTooltip] vládu nové ľudy a do komory [ROOT.GetCountry.GetGovernment.GetParliament.GetName]. [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] vidia v asimilácii príležitosť; [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')] vidia obchodné partnerstvá v koexistencii. Žiadna pozícia nie je nesebecká, ale aspoň sú obidve konzistentné. Musíme sa rozhodnúť, ktorú víziu [ROOT.GetCountry.GetName] chceme vybudovať." # todo: NEW TRANSLATION
 parliaments.52.a: "Jedno [ROOT.GetCountry.GetNameWithNoTooltip], jedna kultúra." # todo: NEW TRANSLATION
 parliaments.52.b: "Rozdiely nás posilňujú." # todo: NEW TRANSLATION
 parliaments.53.title: "Otázka [target_character.GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 parliaments.53.desc: "Výsledky zvyčajne nestačia na uspokojenie [ROOT.GetCountry.GetGovernment.GetParliament.GetName]. [target_character.GetName] ich dosiahol. Správy sú merateľné, zlepšenia reálne a parlament si to všimol. A to je problém. Keď sa minister stane takýmto efektívnym, objavujú sa otázky o tom, ako bola práca vykonaná. Aké očakávania boli potichu obídené? Čie záujmy boli potichu uspokojené? [ROOT.GetCountry.GetGovernment.GetParliament.GetName] požiadal o úplné zúčtovanie a musíme sa rozhodnúť, koľko dohľadu [target_character.GetName] skutočne dostane." # todo: NEW TRANSLATION
 parliaments.53.a: "Ich výsledky hovoria samy za seba." # todo: NEW TRANSLATION
 parliaments.53.b: "Nech parlament preskúma účty." # todo: NEW TRANSLATION
 parliaments.54.title: "Dvaja ministri, dve agendy" # todo: NEW TRANSLATION
 parliaments.54.desc: "Kabinet sa stal bojiskom a [ROOT.GetCountry.GetGovernment.GetParliament.GetName] si to všimol. [target_character.GetName] a [rival_character.GetName] strávili celé toto zasadnutie snažiac sa podkopať jeden druhého, každý dúfajúc, že druhý bude obvinený z neúspechu, ktorý ani z jedného neprizná. Ich rivalita nebaví nikoho okrem nich samých a tých, čo si vsádzajú. Musíme to vyriešiť." # todo: NEW TRANSLATION
 parliaments.54.a: "Podporiť [target_character.GetName]." # todo: NEW TRANSLATION
 parliaments.54.b: "Podporiť [rival_character.GetName]." # todo: NEW TRANSLATION
 parliaments.54.c: "Prepustiť oboch." # todo: NEW TRANSLATION
 parliaments.55.title: "Špinavé ruky v čistých sieňach" # todo: NEW TRANSLATION
 parliaments.55.desc: "Niekto v [ROOT.GetCountry.GetGovernment.GetParliament.GetName] obvinil [target_character.GetName] z korupcie a obvinenie obsahuje dostatok detailov na to, aby sa nedalo úplne ignorovať. Či je obvinenie pravdivé alebo len politická zbraň, závisí veľmi od toho, koho sa pýtate, a kto sa pýta má značný vplyv na to, ako odpoveď dopadne. Musíme sa rozhodnúť, či záležitosť prešetríme alebo ju pochováme s naším dôstojným znechutením." # todo: NEW TRANSLATION
 parliaments.55.a: "Vyšetriť obvinenia." # todo: NEW TRANSLATION
 parliaments.55.b: "To je len politické divadlo." # todo: NEW TRANSLATION
 parliaments.56.title: "Procedurálny spor obrovskej nudnosti" # todo: NEW TRANSLATION
 parliaments.56.desc: "The [ROOT.GetCountry.GetGovernment.GetParliament.GetName] sa zastavil. Spor o hlasovacie postupy — či rozhodovať hlasom alebo menovaním, či zástupcovia môžu zdržovať hlasovanie, či bol poradie rečníkov správne určené — spotreboval tri celé zasadnutia, ktoré mohli byť venované skutočnému vládnutiu. Kdekoľvek je správna odpoveď. Len si prajeme, aby ju nemusel poskytovať náš dvor." # todo: NEW TRANSLATION
 parliaments.56.a: "Vydajte rozhodnutie z trónu." # todo: NEW TRANSLATION
 parliaments.56.b: "Nech parlament vyrieši svoj zmätok." # todo: NEW TRANSLATION
 parliaments.57.title: "Prázdne lavice, plné sťažností" # todo: NEW TRANSLATION
 parliaments.57.desc: "Jedno z našich najsilnejších stavov dosiahlo koniec trpezlivosti. Ich spokojnosť so súčasným smerovaním [ROOT.GetCountry.GetGovernment.GetParliament.GetName] je, mierne povedané, extrémne nízka a dali najavo, že ďalšia účasť nie je istá, pokiaľ sa niečo nezmení. Či ide o skutočnú hrozbu alebo o vyjednávaciu taktiku, ťažko povedať. Isté je, že parlament s výraznou absenciou robí veľmi nepresvedčivé rozhodnutia." # todo: NEW TRANSLATION
 parliaments.57.a: "Urobme ústupky skôr, než odídu." # todo: NEW TRANSLATION
 parliaments.57.b: "Nech sa pokúsia." # todo: NEW TRANSLATION
 parliaments.58.title: "[ROOT.GetCountry.GetGovernment.GetParliament.GetName] presadzuje svoje nároky" # todo: NEW TRANSLATION
 parliaments.58.desc: "Ústavné zhromaždenie si nesadne iba a nebude vďačné za svoju existenciu. Naše sa rozhodlo, že prišiel čas ísť ďalej — vyčleniť práva, ktoré doteraz boli skôr naznačené než písomne stanovené, vytvoriť precedensy, ktoré by bolo ťažké zvrátiť. Nie sú neprávom presvedčení, že takýto dokument by objasnil správu [ROOT.GetCountry.GetName]. Nie sú ani neprávom presvedčení, že by to trvale obmedzilo autoritu koruny. Musíme sa rozhodnúť, koľko moci sme ochotní písomne odovzdať, lebo písaná moc má tendenciu zostať odovzdaná." # todo: NEW TRANSLATION
 parliaments.58.a: "Udelíme chartu." # todo: NEW TRANSLATION
 parliaments.58.b: "Autorita koruny sa nedá vymenovať." # todo: NEW TRANSLATION

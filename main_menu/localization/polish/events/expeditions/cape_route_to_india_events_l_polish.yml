l_polish:
 cape_route_to_india_events.1.title: "Flotila vypláva" # todo: NEW TRANSLATION
 cape_route_to_india_events.1.desc: "Naše vody už celú generáciu nevideli takúto flotilu. Štyri lode, sto sedemdesiat mužov, zásoby [ShowGoodsName('salt')], [ShowGoodsName('fish')] a tvrdých suchárov na celé roky — a rozkazy od [ROOT.GetCountry.GetGovernment.GetRulerOrRegent.GetName] [ROOT.GetCountry.GetGovernment.GetRulerOrRegent.GetHerselfHimself], aby našli námornú cestu do $india$. Kňazi žehnajú lodným trupom. Dav sa tlačí až k brehu. Niektorí plačú.\n\n[target_leader.GetName] stojí na prove, keď lode prekonajú plytčinu a vyplávajú na otvorený [ShowContinentName('atlantic_ocean_continent')]. Za [target_leader.GetHerHim] sa prístav zmenšuje na bielu škvrnu na zelenom svahu. Pred [target_leader.GetHerHim] sa oceán rozprestiera bez hraníc na všetky strany. [target_leader.GetSheHe|U] si všetko vypočítal. [target_leader.GetSheHe|U] vie, čo si táto plavba vyžaduje. Či to bude stačiť, závisí ako vždy od [ROOT.GetCountry.GetReligion.GetGodName]." # todo: NEW TRANSLATION # todo: COUNTRY CASE
 cape_route_to_india_events.1.a: "Ak [ROOT.GetCountry.GetReligion.GetGodName|U] dá, vrátime sa s podpalubím plným korenia." # todo: NEW TRANSLATION
 cape_route_to_india_events.1.b: "Pomodlime sa — a potom vyplávajme plnou rýchlosťou." # todo: NEW TRANSLATION
 cape_route_to_india_events.1.historical_info: "Portugalská výprava s cieľom nájsť námornú cestu do $india$ zavŕšila takmer storočie postupného prieskumu smerom na juh pozdĺž afrického pobrežia. Bartolomeu Dias oboplával Mys Dobrej nádeje v roku 1488 a dokázal, že táto cesta je možná. Plavbou Vasca da Gamu v rokoch 1497 – 1499 bola úloha splnená; výprava sa vrátila s takým množstvom korenia a ďalších vzácnych korenín, že zaplatilo šesťdesiatnásobok jej nákladov. Plavba zásadne zmenila svetový obchod s korením a prelomila benátsky a osmanský monopol na pozemné obchodné cesty." # todo: NEW TRANSLATION
 cape_route_to_india_events.2.title: "Ostrovy [ShowProvinceDefinitionNameWithNoTooltip('cape_verde_province')]" # todo: NEW TRANSLATION
 cape_route_to_india_events.2.desc: "Desať sopečných ostrovov, ktoré sa týčia z plochého a pustého mora: to je súostrovie [ShowProvinceDefinitionName('cape_verde_province')]. Flotila vedela, že ich má očakávať, no aj tak prinášajú úľavu — po týždňoch na otvorenom oceáne konečne pevná zem. Guvernérovo sídlo v [ShowLocationName('santiago')] je skromná stavba z obieleného kameňa. Prístavom sa nesie vôňa soli a sušených rýb a vo vzduchu slabo cítiť lišajník orchil, zoškrabávaný zo skál na výrobu farbiva.\n\n[target_leader.GetName] zvažuje možnosti. [ROOT.GetCountry.GetName] drží tieto ostrovy už desaťročia, no „drží“ je veľkorysé slovo — malá posádka, zopár osadníkov a zásobovacia loď raz do roka. Ak má táto cesta niečo znamenať pre budúcnosť [ROOT.GetCountry.GetNameWithNoTooltip], ostrovy musia byť viac než len zastávkou na odpočinok." # todo: NEW TRANSLATION
 cape_route_to_india_events.2.a: "Investujme sem a rozšírme základňu, ktorá stráži našu južnú cestu." # todo: NEW TRANSLATION
 cape_route_to_india_events.2.b: "Doplňme zásoby, naberme čerstvú vodu a pokračujme v plavbe." # todo: NEW TRANSLATION
 cape_route_to_india_events.2.c: "Plavme ďalej — takto na začiatku si nemôžeme dovoliť zdržiavať sa." # todo: NEW TRANSLATION
 cape_route_to_india_events.2.d: "Vráťme sa domov." # todo: NEW TRANSLATION
 cape_route_to_india_events.2.historical_info: "Ostrovy Kapverdy objavili portugalskí moreplavci okolo roku 1456 a od roku 1462 na nich prebiehalo trvalé osídľovanie. Vďaka polohe v Atlantiku, kde zachytávali severovýchodné pasáty, sa stali dôležitou zastávkou na cestách do Južnej Ameriky a okolo Afriky. Ich strategický význam výrazne vzrástol po tom, čo plavba Vasca da Gamu potvrdila existenciu cesty do Indického oceána. V šestnástom storočí sa stali významným uzlom atlantického obchodu s otrokmi." # todo: NEW TRANSLATION
 cape_route_to_india_events.3.title: "Ostrov [ShowLocationNameWithNoTooltip('sao_tome')]" # todo: NEW TRANSLATION
 cape_route_to_india_events.3.desc_common: "Horúčavu cítiť skôr, než sa ukáže pobrežie: vlhká, dusivá stena, ktorá sa na palubu navalí hneď, ako flotila prekročí rovník. Muži lapajú po dychu v ovzduší, ktoré nikdy nevychladne. [ShowLocationName('sao_tome')] sa z rannej hmly vynára ako tmavozelená koruna. Dva vrcholy ukrývajúce sa v oblakoch a vodopády stekajúce cez les taký hustý, že na jeho dno neprenikne ani lúč svetla." # todo: NEW TRANSLATION
 cape_route_to_india_events.3.desc: "$cape_route_to_india_events.3.desc_common$\n\nNa západnom pobreží sa krčí malá osada. Miestni osadníci vravia, že pôda je tu mimoriadne úrodná. Vyrastie v nej čokoľvek. Človek by na tomto ostrove mohol zbohatnúť na cukre, keby mal dosť pracovných síl." # todo: NEW TRANSLATION
 cape_route_to_india_events.3.desc.uninhabited: "$cape_route_to_india_events.3.desc_common$\n\nZ nijakého pobrežia nestúpa dym. V nijakej zátoke nečaká loďka. Ostrov je celkom neobývaný — člny flotily sa dotknú tejto pláže ako prvé. No tam, kde sa dá vyrúbať džungľa, je pôda čierna, hlboká a nesmierne úrodná. Človek by na takomto ostrove mohol zbohatnúť na cukre, keby mal dosť pracovných síl — a keby ho rovníkové horúčky nezahubili skôr." # todo: NEW TRANSLATION
 cape_route_to_india_events.3.desc.foreign: "$cape_route_to_india_events.3.desc_common$\n\nNa západnom pobreží sa už krčí osada pod cudzou vlajkou — móla, kaplnka a prvé čerstvo založené trstinové polia osadníkov [rival_owner.GetAdjective], ktorí sa na tento úrodný ostrov dostali skôr než [ROOT.GetCountry.GetName]. Pôda je rovnako úrodná, ako sľubovali chýry, no už si na ňu niekto robí nárok. Čokoľvek chceme od [ShowLocationNameWithNoTooltip('sao_tome')], musíme teraz získať násilím alebo vyjednávaním od [rival_owner.GetNameWithNoTooltip]." # todo: NEW TRANSLATION
 cape_route_to_india_events.3.a: "Zriaďme obchodnú stanicu; tento ostrov za to stojí." # todo: NEW TRANSLATION
 cape_route_to_india_events.3.a.owned: "Investujme do ostrova ešte viac — [ShowLocationNameWithNoTooltip('sao_tome')] už vlajkuje pod našou zástavou." # todo: NEW TRANSLATION
 cape_route_to_india_events.3.b: "Vztýčme #italic padrão#! a vyhlásme ostrov za majetok Koruny." # todo: NEW TRANSLATION
 cape_route_to_india_events.3.c: "Naberme čerstvú vodu a plavme na juh." # todo: NEW TRANSLATION
 cape_route_to_india_events.3.d: "Vráťme sa domov." # todo: NEW TRANSLATION
 cape_route_to_india_events.3.historical_info: "São Tomé bolo pri príchode portugalských moreplavcov okolo roku 1470 neobývané. Jeho rovníkové podnebie sa ukázalo pre európskych osadníkov ako zhubné — úmrtnosť na choroby bola vysoká — no pestovaniu cukrovej trstiny mimoriadne prospievalo. V 20. rokoch 16. storočia bolo São Tomé najväčším producentom cukru na svete; na plantážach pracovali takmer výlučne zotročení Afričania. Neskôr sa ostrov stal významným prekladiskom atlantického obchodu s otrokmi a túto úlohu plnil vyše dvesto rokov." # todo: NEW TRANSLATION
 cape_route_to_india_events.4.title: "Ústie veľkej rieky" # todo: NEW TRANSLATION
 cape_route_to_india_events.4.desc: "Oceán tu hnedne. Flotila si to všímala už celý deň — z juhu sa do mora rozlieva čajovohnedá farba hustá od nánosov. Potom uvidia príčinu: rieku širšiu než ktorákoľvek v krajine [ROOT.GetCountry.GetAltAdjective('D')], širšiu než akú kedy ktorýkoľvek z týchto mužov videl. Do [ShowContinentName('atlantic_ocean_continent')] sa vlieva hnedý prúd, ktorý farbí more na kilometre všetkými smermi.\n\nZ mangrovového porastu vyplávajú kanoe vydlabané z kmeňov. Sú obrovské — každá je vytesaná z jediného kmeňa, meria tridsať stôp a vesluje v nej tucet mužov v dokonalej súhre. Muži stojaci na prove nie sú ozbrojení. Pokojne a zvedavo pozorujú flotilu, ako ľudia, ktorí sa nikdy nebáli cudzincov." # todo: NEW TRANSLATION # todo: COUNTRY CASE
 cape_route_to_india_events.4.a: "Požiadajme o audienciu u [target_owner.Custom('GetRulerOrRegentTitle')] tejto krajiny." # todo: NEW TRANSLATION
 cape_route_to_india_events.4.b: "Obchodujme za [ShowGoodsNameWithNoTooltip('ivory')], [ShowGoodsNameWithNoTooltip('copper')] a čokoľvek ďalšie, čo ponúknu." # todo: NEW TRANSLATION
 cape_route_to_india_events.4.c: "Zmapujme ústie rieky a pokračujme na juh; nemôžeme strácať čas." # todo: NEW TRANSLATION
 cape_route_to_india_events.4.d: "Vráťme sa domov." # todo: NEW TRANSLATION
 cape_route_to_india_events.4.historical_info: "Kráľovstvo Kongo patrilo k najvyspelejším politickým útvarom subsaharskej Afriky a ovládalo územia na veľkej časti dnešného Konga, Angoly a Gabonu. ManiKongo (kráľ) vládol prostredníctvom hierarchickej byrokracie a udržiaval vyspelý systém správy provincií. Portugalskí misionári nadviazali s kráľovstvom kontakt v 80. rokoch 15. storočia. Začal sa tým vzťah, ktorý zásadne zmenil život oboch strán — a napokon im priniesol katastrofu. Kráľovstvo prijalo kresťanstvo v 90. rokoch 15. storočia a ManiKongo prijal meno João I." # todo: NEW TRANSLATION
 cape_route_to_india_events.5.title: "Zátoka [ShowLocationNameWithNoTooltip('luanda')]" # todo: NEW TRANSLATION
 cape_route_to_india_events.5.desc: "Všetci dôstojníci výpravy ju spoznajú hneď, ako ju zbadajú. Námorníci na celom africkom pobreží nevideli takýto prístav: dlhú, oblúkovitú zátoku chránenú pred juhozápadom prirodzenou piesočnou kosou, s hlbokou vodou blízko brehu a nízkym výbežkom, z ktorého sa otvára výhľad na všetky strany. Miestni rybári ju volajú Loanda — ploché miesto.\n\n[target_leader.GetName] kráča v popoludňajšom svetle po celej dĺžke piesočnej kosy; na jednej strane má zátoku, na druhej otvorený [ShowContinentName('atlantic_ocean_continent')]. [target_leader.GetSheHe|U] už premýšľa o hradbách. O čerstvej vode. O počte lodí, ktoré by tu umiestnená posádka mohla chrániť — alebo zachytávať. Mesto vybudované na tomto mieste by mohlo ovládnuť celý južný atlantický obchod." # todo: NEW TRANSLATION
 cape_route_to_india_events.5.desc.owned: "Flotila vpláva do zátoky, ktorej hodnotu netreba nikomu vysvetľovať: [ShowLocationName('luanda')] už veje pod farbami [ROOT.GetCountry.GetAltAdjective('I')] a jej dlhá piesočná kosa poskytuje úkryt lodiam verne slúžiacim našej Korune.\n\n[target_leader.GetName] kráča v popoludňajšom svetle po celej dĺžke kosy; na jednej strane má zátoku, na druhej otvorený [ShowContinentName('atlantic_ocean_continent')] — nepremýšľa o tom, či toto miesto obsadiť, ale o tom, koľko ďalšieho by nám ešte mohlo priniesť. Ešte silnejšie mesto by odtiaľto mohlo ovládnuť celý južný atlantický obchod." # todo: NEW TRANSLATION # todo: COUNTRY CASE
 cape_route_to_india_events.5.a: "Vybudujme tu významnú [ShowBuildingTypeNameWithNoTooltip('por_feitoria')] — nič sa jej nevyrovná." # todo: NEW TRANSLATION
 cape_route_to_india_events.5.a.owned: "Rozšírme naše veľké obchodné stredisko v [ShowLocationNameWithNoTooltip('luanda')] — na tomto pobreží nemá páru." # todo: NEW TRANSLATION
 cape_route_to_india_events.5.b: "Zriaďme skromnú obchodnú stanicu a zásobovací sklad." # todo: NEW TRANSLATION
 cape_route_to_india_events.5.b.owned: "Rozšírme obchodnú stanicu a zásobovací sklad, ktoré tu už máme." # todo: NEW TRANSLATION
 cape_route_to_india_events.5.c: "Poznačme si jej polohu do máp a pokračujme na juh." # todo: NEW TRANSLATION
 cape_route_to_india_events.5.d: "Vráťme sa domov." # todo: NEW TRANSLATION
 cape_route_to_india_events.5.historical_info: "Luanda sa v roku 1575 formálne stala portugalskou kolóniou pod vedením Paula Diasa de Novaisa, čím sa zaradila medzi najstaršie európske osady v subsaharskej Afrike. Vďaka prirodzenému prístavu bola vyše štyri storočia hlavným prístavom portugalskej Angoly. Od šestnásteho storočia sa Luanda stala hlavným miestom odchodu otrokov z južnej Afriky cez Atlantik; milióny zotročených ľudí odtiaľ prevážali do Brazílie a Karibiku." # todo: NEW TRANSLATION
 cape_route_to_india_events.6.title: "Púštne pobrežie" # todo: NEW TRANSLATION
 cape_route_to_india_events.6.desc: "Púšť tu siaha až k moru. Červené duny sa dvíhajú priamo z príboja a vietor z ich hrebeňov odnáša piesok do vzduchu. Niet tu stromov. Nikde nevidno sladkú vodu. Pobrežie na severe — muži ho už nazývajú [ShowLocationName('skeleton_coast')], podľa veľrybích kostí, ktoré sa bielia na pláži — nejaví na stovky míľ na žiadnu stranu známky ľudského osídlenia.\n\nA predsa je zátoka pokojná. Chráni flotilu pred najhoršími vlnami a ponúka jej možnosť opraviť poškodený sťažeň a doplniť vodu z poloslaného prameňa v dunách. Na výbežku nad ňou navigátor pomocou prístrojov meria výšku Slnka a robí si poznámky. Mys je podľa neho odtiaľto vzdialený najviac týždeň plavby na juh. Niektorí muži sa prežehnávajú." # todo: NEW TRANSLATION
 cape_route_to_india_events.6.a: "Povzbuďme mužov: mys je konečne na dosah. Vpred!" # todo: NEW TRANSLATION
 cape_route_to_india_events.6.b: "Tieto prúdy a vetry nám čosi prezrádzajú; dovoľte mi ich prečítať." # todo: NEW TRANSLATION
 cape_route_to_india_events.6.c: "Nech si muži oddýchnu; na búrky, ktoré nás čakajú, budú potrebovať sily." # todo: NEW TRANSLATION
 cape_route_to_india_events.6.d: "Vráťme sa domov — toto pobrežie je príliš pusté na to, aby sme pokračovali." # todo: NEW TRANSLATION
 cape_route_to_india_events.6.historical_info: "Namíbijské pobrežie poznali portugalskí námorníci ako #italic Costa dos Esqueletos#! (Pobrežie kostier), pre množstvo veľrybích a tuleňových kostí, ako aj vrakov lodí, ktoré sem na záveterné pobrežie zahnali silné juhozápadné vetry. Zátoka Walvis, ktorú Holanďania nazvali #italic Walvischbaai#! (Zátoka veľrýb), bola jedným z mála chránených kotvísk na tomto inak nehostinnom pobreží. Bartolomeu Dias sa tu zastavil v roku 1488 počas svojej plavby na juh." # todo: NEW TRANSLATION
 cape_route_to_india_events.7.title: "Mys búrok" # todo: NEW TRANSLATION
 cape_route_to_india_events.7.desc: "Nič z toho, čo zažili počas troch mesiacov plavby, ich na toto nepripravilo. Búrka prichádza bez varovania od juhozápadu a ženie pred sebou štyridsaťstopové vlny. Vedúca loď zmizne v priehlbine medzi vlnami a tridsať sekúnd sa neukáže. Lode prichádzajú o výstroj. Mužov zhadzuje z ráhnov. [target_leader.GetName] sa oboma rukami drží zábradlia na korme a hľadí na chaos okolo [target_leader.GetHerHim]. Kdesi v kakofónii vetra a burácajúcej vody [target_leader.GetSheHe] pochopí, že sa dostali na druhú stranu. Mys — veľký južný výbežok afrického kontinentu, koniec známeho sveta — zostal za nimi.\n\nCesta do $india$ je otvorená." # todo: NEW TRANSLATION
 cape_route_to_india_events.7.a: "Pomenujme ho Mys Dobrej nádeje a bez meškania sa plavme na východ!" # todo: NEW TRANSLATION
 cape_route_to_india_events.7.b: "Ukryme sa v závetrí výbežku, kým búrka neprejde." # todo: NEW TRANSLATION
 cape_route_to_india_events.7.d: "Už sme vykonali dosť; mys sme oboplávali. Obráťme sa domov." # todo: NEW TRANSLATION
 cape_route_to_india_events.7.historical_info: "Bartolomeu Dias oboplával mys ako prvý v roku 1488 a pomenoval ho #italic Cabo das Tormentas#! (Mys búrok). Podľa portugalských prameňov ho kráľ João II. premenoval na #italic Cabo da Boa Esperança#! (Mys Dobrej nádeje), aby povzbudil ďalšie výpravy, tento príbeh však môže byť vymyslený. Mys nie je najjužnejším bodom Afriky — toto prvenstvo patrí Mysu Agulhas, vzdialenému asi dvesto kilometrov na východ — označuje však miesto, kde sa stretávajú Atlantický a Indický oceán, a vstupnú bránu na východ." # todo: NEW TRANSLATION
 cape_route_to_india_events.8.title: "Zátoka pastierov" # todo: NEW TRANSLATION
 cape_route_to_india_events.8.desc: "Zátoka je pokojná a krásna, pred juhozápadným vetrom ju chráni nízky výbežok. Pobrežie lemujú mliečniky, ktoré poskytujú vítaný tieň. A na svahu nad plážou sa pasie dobytok. Tučné a zdravé zvieratá v obrovských stádach opatrujú vysokí ľudia, ozdobení okrovou farbou a sklenenými korálikmi, ktorí od bezpečnej vzdialenosti pozorujú flotilu už od jej zakotvenia.\n\nNiektorým mužom sa pri pohľade na čerstvé mäso tisnú slzy do očí. Už celé týždne sa živia solenými rybami a tvrdými suchármi. Napokon jeden z pastierov zíde k vode a čaká, kým sa kapitán flotily nalodí na čln a privesluje k nemu. Nasleduje výmena, pri ktorej sa použijú prstene z [ShowGoodsName('copper')], sušené ryby a množstvo trpezlivých gest. Do večera sú v podpalubí tri kusy dobytka. Pre každého muža na flotile je bučanie najkrajším zvukom, aký kedy počul." # todo: NEW TRANSLATION
 cape_route_to_india_events.8.a: "Vymeňme za dobytok [ShowGoodsNameWithNoTooltip('copper')] a [ShowGoodsNameWithNoTooltip('cloth')] a vztýčme #italic padrão#!." # todo: NEW TRANSLATION
 cape_route_to_india_events.8.a.morale_tt: "Morálka posádok výrazne stúpne (#G +10#! Morálka posádky)" # todo: NEW TRANSLATION
 cape_route_to_india_events.8.b: "Vztýčme #italic padrão#! a vyhlásme túto zem za majetok [ROOT.GetCountry.GetNameWithNoTooltip]." # todo: NEW TRANSLATION
 cape_route_to_india_events.8.b.morale_tt: "Morálka posádok mierne stúpne (#G +8#! Morálka posádky)" # todo: NEW TRANSLATION
 cape_route_to_india_events.8.c: "Nechajme mužov odpočinúť si a zotaviť sa, kým sa vydáme na sever." # todo: NEW TRANSLATION
 cape_route_to_india_events.8.c.morale_tt: "Morálka posádok výrazne stúpne (#G +10#! Morálka posádky)" # todo: NEW TRANSLATION
 cape_route_to_india_events.8.d: "Vráťme sa domov." # todo: NEW TRANSLATION
 cape_route_to_india_events.8.historical_info: "Zátoku Mossel poznali portugalskí námorníci ako #italic Bahia dos Vaqueiros#! (Zátoka pastierov) a neskôr ako #italic Aguada de São Brás#! (Napájadlo svätého Blažeja). Bartolomeu Dias tu v roku 1488 vztýčil kamenné #italic padrão#! a Vasco da Gama v roku 1497 nasledoval jeho príklad. Domorodí Khoikhoiovia spočiatku s oboma výpravami ochotne obchodovali, neskôr sa však stali nepriateľskými — na mužov Vasca da Gamu hádzali kamene, keď sa pokúsili nabrať čerstvú vodu bez primeranej odmeny." # todo: NEW TRANSLATION
 cape_route_to_india_events.9.title: "Zlatý prístav [ShowLocationNameWithNoTooltip('sofala')]" # todo: NEW TRANSLATION
 cape_route_to_india_events.9.desc: "Prístav v [ShowLocationName('sofala')] je plný dhowov. Nie sú to malé rybárske člny, na aké si flotila zvykla pri južnom pobreží; sú to zaoceánske plavidlá z [ShowRegionName('arabia_region')] a [ShowRegionName('persia_region')], hlboko ponorené pod nákladom [ShowGoodsName('ivory')], ebenového dreva a [ShowGoodsName('cloth')]. Obchodníci na nábreží obchodujú v [ShowLanguageName('arabic_language')] a v jazyku [location.GetDominantCulture.GetLanguage.GetName], ktorý nedokáže zaradiť žiaden tlmočník flotily. Za balíky indickej bavlny si podávajú drobné štipky zlatého prachu.\n\nArabskí obchodníci, ktorí tomuto prístavu vládnu už celé stáročia, sledujú príchod flotily [ROOT.GetCountry.GetAdjective] spoza prístreškov svojich skladov. Ich výraz je nečitateľný, no reč tela hovorí jasne: príchod cudzincov so železnými kanónmi a krížmi namaľovanými na plachtách nie je vítanou novinkou. Kapitán flotily si všíma najväčšie sklady, polohu kotvísk pre dhowy aj hĺbku vody pri vstupe do zátoky." # todo: NEW TRANSLATION
 cape_route_to_india_events.9.a: "Vybudujme významnú [ShowBuildingTypeNameWithNoTooltip('por_feitoria')]; toto zlato obohatí [ROOT.GetCountry.GetNameWithNoTooltip]." # todo: NEW TRANSLATION
 cape_route_to_india_events.9.a.owned: "Investujme do našej stanice v [ShowLocationNameWithNoTooltip('sofala')] — toto zlato zbohatí [ROOT.GetCountry.GetNameWithNoTooltip]." # todo: NEW TRANSLATION
 cape_route_to_india_events.9.b: "Obchodujme za zlatý prach a zistime, čo sa nachádza vo vnútrozemí." # todo: NEW TRANSLATION
 cape_route_to_india_events.9.c: "Získajme informácie a pokračujme — čas je vzácny." # todo: NEW TRANSLATION
 cape_route_to_india_events.9.d: "Vráťme sa domov." # todo: NEW TRANSLATION
 cape_route_to_india_events.9.historical_info: "Sofala bola najjužnejším významným prístavom svahilského obchodného systému a ovládala prístup do zlatonosného kráľovstva #italic Mutapa#! (Veľké Zimbabwe) na náhornej plošine na západe. Arabskí obchodníci tu pôsobili prinajmenšom od desiateho storočia. Portugalci sa Sofaly zmocnili v roku 1505, zničili arabskú obchodnú sieť a pokúsili sa presmerovať obchod so zlatom cez vlastné kanály — s rôznym úspechom, keďže veľká časť obchodu sa jednoducho presunula do vnútrozemia, mimo ich dosahu." # todo: NEW TRANSLATION
 cape_route_to_india_events.10.title: "Ostrov [ShowLocationNameWithNoTooltip('mozambique')]" # todo: NEW TRANSLATION
 cape_route_to_india_events.10.desc: "Malý ostrov, dlhý nanajvýš tri kilometre, od pevniny ho oddeľuje úzky prieliv, ktorý je však dostatočne hlboký pre zaoceánske lode. Na ostrove stojí kamenná obchodná stanica so zelenou vlajkou a prístav je preplnený dhowmi zo všetkých kútov [ShowContinentName('indian_ocean_continent')]. Z vnútrozemia sem prúdi [ShowGoodsName('ivory')] a ebenové drevo, z pevniny privádzajú zotročených mužov a ženy, z juhu prichádza [ShowGoodsName('copper')] a z $india$ a $china$ zas [ShowGoodsName('cloth')] a [ShowGoodsName('porcelain')] — všetko sa tu vymieňa v obchodnej sieti, ktorá funguje už šesť storočí.\n\n[target_ruler_country.Custom('GetRulerOrRegentTitle')] je bohatý a podozrievavý. Obchodníci [ShowCultureGroupName('arabian_group')], ktorí sem dorazili pred flotilou, [target_ruler.GetHimHer] varovali, že cudzinci sú piráti [ROOT.GetCountry.GetReligion.GetAdjective], ktorí ničia všetko, čo nedokážu ukradnúť. [target_ruler.GetHeShe|U] prijíma vyslanca flotily s opatrnou zdvorilosťou, obklopený ozbrojenými strážcami, a kladie množstvo otázok o výzbroji. Vlastné postavenie [target_ruler.GetHerHis|U] uprostred prístavu lemovaného delami by [ROOT.GetCountry.GetAdjective] nenazvali práve pohodlným." # todo: NEW TRANSLATION
 cape_route_to_india_events.10.a: "Podplaťme [target_ruler_country.Custom('GetRulerOrRegentTitle')] tovarom a kúpme si právo na výstavbu." # todo: NEW TRANSLATION
 cape_route_to_india_events.10.b: "Dohodnime si obchodné práva prostredníctvom diplomacie a darov." # todo: NEW TRANSLATION
 cape_route_to_india_events.10.c: "Preplaťme obchodníkov [ShowCultureGroupNameWithNoTooltip('arabian_group')] a získajme si [target_ruler_country.Custom('GetRulerOrRegentTitle')]." # todo: NEW TRANSLATION
 cape_route_to_india_events.10.d: "Zatiaľ uznajme nárok [target_ruler_country.Custom('GetRulerOrRegentTitle')] a pokračujme na sever." # todo: NEW TRANSLATION
 cape_route_to_india_events.10.f: "Vztýčme #italic São Jorge padrão#!." # todo: NEW TRANSLATION
 cape_route_to_india_events.10.e: "Vráťme sa domov." # todo: NEW TRANSLATION
 cape_route_to_india_events.10.historical_info: "Ostrov Mozambik sa stal najdôležitejšou portugalskou základňou vo východnej Afrike; Portugalci ju oficiálne založili v roku 1507. Pevnosť São Sebastião, postavená v šestnástom storočí, je jedným z najstarších zachovaných európskych opevnení v subsaharskej Afrike. Ostrov bol vyše dvesto rokov správnym centrom portugalskej východnej Afriky a zastávkou na ceste do $india$. Jeho dobytie prakticky zničilo arabskú kontrolu nad obchodnou sieťou severného svahilského pobrežia." # todo: NEW TRANSLATION
 cape_route_to_india_events.11.title: "Pasca v [ShowLocationNameWithNoTooltip('mombasa')]" # todo: NEW TRANSLATION
 cape_route_to_india_events.11.desc: "Vstupný kanál do [ShowLocationName('mombasa')] je úzky, široký nanajvýš dve káblové dĺžky, a na oboch stranách sa týči vyvýšený terén. Keď ním flotila prechádza, muži začínajú tušiť, že čosi nie je v poriadku — pri nábreží sa ponevierajú muži s prehnane nenúteným výrazom, aký mávajú ťažko ozbrojení ľudia, ktorým prikázali tváriť sa neozbrojene; dhow kotví na nezvyčajnom mieste, odkiaľ by zablokoval výjazd z kanála, a vyslanec [target_ruler_country.Custom('GetRulerOrRegentTitle')] nastupuje na vlajkovú loď s okázalým obradom, darmi a priveľkým množstvom otázok o počte ozbrojených mužov na palube.\n\nV tú noc sa do kapitánovej kajuty vkradne tlmočník pracujúci pre flotilu. Ešte pred návratom na breh sa vyslanec [target_ruler_country.Custom('GetRulerOrRegentTitle')] rozprával so svojimi spoločníkmi v jazyku [location.GetDominantCulture.GetLanguage.GetName], ktorému muž rozumie. Slová boli jednoznačné: flotila nesmie opustiť [ShowLocationNameWithNoTooltip('mombasa')]." # todo: NEW TRANSLATION
 cape_route_to_india_events.11.a: "Odíďme ešte pred svitaním; takéto prijatie nestojí za riziko." # todo: NEW TRANSLATION
 cape_route_to_india_events.11.b: "Zostaňme a pokúsme sa obchodovať napriek zjavnému napätiu." # todo: NEW TRANSLATION
 cape_route_to_india_events.11.c: "Ak chystajú zradu, zasiahneme prví; pripravme mužov." # todo: NEW TRANSLATION
 cape_route_to_india_events.11.d: "Vráťme sa domov — nebudeme tu riskovať flotilu." # todo: NEW TRANSLATION
 cape_route_to_india_events.11.historical_info: "V apríli 1498 takmer prepadli Vasca da Gamu v Mombase. Podľa portugalských záznamov sa miestni lodivodi, ktorých poskytol sultán, pokúsili naviesť flotilu na piesočnú lavicu. Da Gama ustúpil skôr, než sa pasca stihla zaklapnúť. V nasledujúcich desaťročiach sa Portugalci do Mombasy opakovane vracali a ostreľovali ju i plienili. Pevnosť Jesus, postavená v roku 1593, napokon zabezpečila portugalskú kontrolu nad prístavom — mesto však v roku 1698 po dlhom obliehaní dobyli Ománci." # todo: NEW TRANSLATION
 cape_route_to_india_events.12.title: "Priateľský [target_ruler_country.Custom('GetRulerOrRegentTitle')|U]" # todo: NEW TRANSLATION
 cape_route_to_india_events.12.desc: "Na [ShowLocationName('malindi')] je všetko iné než na miestach, ktoré flotila navštívila predtým. [target_ruler.GetName], [target_ruler_country.Custom('GetRulerOrRegentTitle')], prichádza do prístavu [target_ruler.GetHerselfHimself], odetý v bielo-zelenej hodvábnej látke. Sprevádzajú ho hudobníci, ktorí hrajú na nástroji vydávajúcom hudbu, akú ešte nikto z [ROOT.GetCountry.GetAdjective] nepočul. [target_ruler.GetSheHe|U] sa o flotile dozvedel od [target_ruler.GetHerHis] kontaktov na juhu a očakával jej príchod.\n\n[target_ruler.GetSheHe|U] má dar cennejší než slonovina: v službách [target_ruler.GetHerHis] [target_ruler.GetSheHe] je muž, ktorý sa dvanásťkrát plavil do Kalikatu. Muž, ktorý pozná každý prúd, každý útes a každú zmenu vetra medzi týmto miestom a pobrežím Malabaru. Vie, kedy juhozápadný monzún preženie loď cez [ShowContinentName('indian_ocean_continent')] za tri týždne, a kedy tú istú loď do dvadsiatich štyroch hodín zahubí. Ako vysvetľuje [target_ruler.GetNameWithNoTooltip], pilotovo meno sa len ťažko vyslovuje v európskom jazyku. No [target_ruler.GetHerHis] vedomosti takým problémom nie sú a cenou za ne je priateľstvo." # todo: NEW TRANSLATION
 cape_route_to_india_events.12.a: "S radosťou prijmime pilota [target_ruler.GetNameWithNoTooltip] aj [target_ruler.GetHerHis] priateľstvo." # todo: NEW TRANSLATION
 cape_route_to_india_events.12.b: "Ponúknime [target_ruler_country.Custom('GetRulerOrRegentTitle')] dary, stálu prítomnosť a ochranu." # todo: NEW TRANSLATION
 cape_route_to_india_events.12.c: "Pred plavbou sa pomodlime; priviedol nás sem [ROOT.GetCountry.GetReligion.GetGodName|U]." # todo: NEW TRANSLATION
 cape_route_to_india_events.12.e: "Pred veľkou plavbou vztýčme #italic Espírito Santo padrão#!." # todo: NEW TRANSLATION
 cape_route_to_india_events.12.d: "Vráťme sa domov; Kalikat je príliš ďaleko a plavba priveľmi nebezpečná." # todo: NEW TRANSLATION
 cape_route_to_india_events.12.historical_info: "Sultán Malindi bol dlhoročným rivalom Mombasy, a preto Portugalcov, ktorí prichádzali ako možná protiváha jeho nepriateľom, prijal priaznivo. Lodivod Indického oceána, ktorého poskytol Vascovi da Gamovi — v portugalských prameňoch sa o ňom hovorí ako o Malemovi Canacovi — je už stáročia predmetom sporov medzi historikmi. Niektorí ho stotožňujú s Ahmadom ibn Mádžidom, najväčším arabským moreplavcom pätnásteho storočia a autorom viacerých diel o plavbe po Indickom oceáne. Iní tvrdia, že toto stotožnenie je nesprávne a že išlo o gudžarátskeho obchodníka. Jeho totožnosť zostáva neznáma." # todo: NEW TRANSLATION
 cape_route_to_india_events.13.title: "Kalikát — brána ku koreniu" # todo: NEW TRANSLATION
 cape_route_to_india_events.13.desc: "[ShowLocationName('kozhikode')] je väčší než hlavné mesto [ROOT.GetCountry.GetCapital.GetName]. V prístave je viac lodí, než koľko dokážu dôstojníci flotily spočítať — plavidlá z [ShowRegionName('arabia_region')], [ShowRegionName('persia_region')], [ShowAreaName('gujarat_area')], [ShowRegionName('bengal_region')], $china$, [ShowLocationName('malacca')] a [ShowAreaName('java_area')]. Magnetická príťažlivosť [ShowGoodsName('pepper')], škorice, kardamómu a [ShowGoodsName('cloves')] spojila celý prepojený svet a všetko jeho bohatstvo prúdi týmto prístavom. Flotila spúšťa kotvy na rejdisku, ktorý je už preplnený dhowmi, zatiaľ čo ju obchodníci [ShowCultureGroupName('arabian_group')] na nábreží uprene pozorujú.\n\nUž dva mesiace presviedčajú [target_ruler_country.Custom('GetRulerOrRegentTitle')] — vládcu Kalikatu, ktorý vládne spoza okázalých obradných múrov — že títo novoprišelci sú piráti zo studeného severu, nie obchodníci. [target_ruler_country.Custom('GetRulerOrRegentTitle')|U] súhlasil, že prijme kapitána flotily, no [target_ruler.GetHerHis] [target_ruler_country.GetGovernment.GetCourtTitle|l] je ostražitý a [target_ruler.GetHerHis] obchodníci nervózni. Vzduchom sa šíri vôňa čierneho [ShowGoodsNameWithNoTooltip('pepper')] a slaného mora, ktoré zažilo tisíc rokov obchodu. Všetko, pre čo sa táto výprava vydala na cestu, závisí od toho, čo zaznie v nasledujúcej hodine." # todo: NEW TRANSLATION
 cape_route_to_india_events.13.a: "Predložme [target_ruler_country.Custom('GetRulerOrRegentTitle')] náš tovar a požiadajme o obchodnú stanicu." # todo: NEW TRANSLATION
 cape_route_to_india_events.13.b: "Navrhnime zmluvu: pevne stanovené clá, bezpečné kotvisko a ochranu." # todo: NEW TRANSLATION
 cape_route_to_india_events.13.c: "Nazvime obchodníkov [ShowCultureGroupNameWithNoTooltip('arabian_group')] klamármi; prinúťme [target_ruler_country.Custom('GetRulerOrRegentTitle')] vybrať si." # todo: NEW TRANSLATION
 cape_route_to_india_events.13.d: "Náš lodivod pozná tento [target_ruler_country.GetGovernment.GetCourtTitle|l]; jeho rady nám pomôžu pri rozhovore." # todo: NEW TRANSLATION
 cape_route_to_india_events.13.e: "Vztyčme #italic padrão São Gabriel#!, nech ho všetci vidia." # todo: NEW TRANSLATION
 cape_route_to_india_events.13.historical_info: "Kozhikode (Európanom známe ako Kalikut) bolo najdôležitejším prístavom obchodu s korením v Indickom oceáne. Vládol mu #italic Sāmūtiri#! (Zamorin, čiže Pán mora), ktorý obratne udržiaval rovnováhu medzi arabskými obchodníkmi, čo ovládali obchod, súperiacimi indickými štátmi a neskôr prichádzajúcimi Európanmi. Vasco da Gama bol pri svojej prvej návšteve v roku 1498 prijatý rozpačito: jeho dary sa považovali za nedostatočné a arabským obchodníkom sa podarilo naštrbiť vzťahy na dvore. Odplával s malým a neuspokojivým nákladom. Až počas ďalších plavieb, pod hrozbou portugalských diel, sa podarilo vynútiť významnejšie obchodné dohody." # todo: NEW TRANSLATION
 cape_route_to_india_events.14.title: "Zlaté pobrežie" # todo: NEW TRANSLATION
 cape_route_to_india_events.14.desc: "Les sa začína deň chôdze od pobrežia a chodník medzi pobrežím a lesom je dobre vyšliapaný. Karavány prichádzajú na pláž dva- až trikrát do týždňa: nosiči nesú kožené mešce so zlatým prachom, vyplaveným zo štrku vnútrozemských riek, kde králi [ShowCultureName('akan')]ov ovládajú miesta, na ktorých sa ryžuje zlato, a svoj prebytok predávajú prostredníctvom siete wangarských obchodníkov, ktorá siaha štyri storočia do minulosti.\n\n[ROOT.GetCountry.GetAdjective] už o tomto mieste počuli. Každý kapitán [ShowCultureGroupName('arabian_group')], ktorý obchodoval na týchto brehoch, hovoril o trhoch Zlatého pobrežia ako o najvýnosnejšom úseku pobrežia Guinejského zálivu. Tunajší ľudia už videli cudzie lode. Neboja sa. Zvažujú, koľko by mohli noví prichádzajúci stáť." # todo: NEW TRANSLATION
 cape_route_to_india_events.14.a: "Postavme São Jorge da Mina; [ShowCultureNameWithNoTooltip('akan')]ovia budú predávať tomu, kto ho ovláda." # todo: NEW TRANSLATION
 cape_route_to_india_events.14.a.owned: "Posilnime São Jorge da Mina — [ShowCultureNameWithNoTooltip('akan')]ovia už predávajú prostredníctvom nás." # todo: NEW TRANSLATION
 cape_route_to_india_events.14.b: "Vyjednávajme o zajatcoch, ktorých [ShowCultureNameWithNoTooltip('akan')]ovia získavajú ako vojnovú korisť." # todo: NEW TRANSLATION
 cape_route_to_india_events.14.c: "Zaútočme na osadu skôr, než wangarskí obchodníci odídu." # todo: NEW TRANSLATION
 cape_route_to_india_events.14.d: "Zaznamenajme objem obchodu a pokračujme na juh. Nie je čas zdržiavať sa." # todo: NEW TRANSLATION
 cape_route_to_india_events.14.e: "Vráťme sa domov. Už samotné zlato ospravedlňuje túto plavbu." # todo: NEW TRANSLATION
 cape_route_to_india_events.14.historical_info: "Portugalci postavili São Jorge da Mina (hrad Elmina) na Zlatom pobreží v roku 1482. Kameň vyťažili na neďalekom výbežku a vopred narezané drevo naložili v Portugalsku na lode určené na tento účel. Pevnosť vybudovali za niekoľko týždňov, sčasti po dohode s miestnym náčelníkom menom Caramansa a sčasti vďaka prekvapivému útoku. Pôvodne mala ovládnuť obchod so zlatom s lesnými kráľovstvami Akanov. V priebehu niekoľkých desaťročí sa stala hlavným uzlom atlantického obchodu s otrokmi: prijímala zajatcov z vojen vo vnútrozemí a posielala ich na západ, na cukrové plantáže na São Tomé a neskôr v Brazílii. Historik Walter Rodney odhadoval, že obchod na Zlatom pobreží prinášal Portugalsku ročne niekoľko stotisíc zlatých cruzadov, kým obchod s otrokmi nevytlačil zlato na pozícii hlavnej komodity." # todo: NEW TRANSLATION
 cape_route_to_india_events.15.title: "Ostrov Fernãa do Póa" # todo: NEW TRANSLATION
 cape_route_to_india_events.15.desc: "Z Guinejského zálivu sa dvíha ostrov: sopečný vrchol, z ktorého sa valia oblaky, a hustá džungľa siahajúca až k vode. Obyvatelia ostrova, [ShowCultureName('bubi_culture')], ešte nikdy nevideli Európanov. Sledujú z okraja lesa, ako flotila spúšťa kotvy v prirodzenej zátoke a na vodu sa spúšťa čln.\n\nObjaviteľ, po ktorom ostrov dostal meno, tadiaľto preplával pred jednou generáciou a približne ho zakreslil do máp. Lodivod flotily má tú mapu. Nezachytáva však, či sa oplatí na ostrove zastaviť." # todo: NEW TRANSLATION
 cape_route_to_india_events.15.desc.owned: "Ostrov sa dvíha z mora ako predtým — sopečný vrchol ukrytý v oblakoch, džungľa tiesniaca sa až k vode — no nad kotviskom už veje naša vlajka a člny, ktoré vyplávali v ústrety flotile, sú naše.\n\n[target_leader.GetName] nemusí premýšľať, či sa oplatí na ostrove zastaviť. Otázkou teraz je iba to, čo ešte možno získať z oporného bodu, ktorý tu [ROOT.GetCountry.GetNameWithNoTooltip] už má, a to priamo na obchodnej trase v [ShowAreaNameWithNoTooltip('gulf_of_guinea_area')]." # todo: NEW TRANSLATION
 cape_route_to_india_events.15.a: "Založme obchodnú stanicu; ostrov ovláda obchod v [ShowAreaNameWithNoTooltip('gulf_of_guinea_area')]." # todo: NEW TRANSLATION
 cape_route_to_india_events.15.a.owned: "Posilnime našu stanicu — ostrov už tvorí oporu nášho obchodu v [ShowAreaNameWithNoTooltip('gulf_of_guinea_area')]." # todo: NEW TRANSLATION
 cape_route_to_india_events.15.b: "Vztyčme #italic padrão#!, zmapujme ostrov a vyhlásme ho za svoj." # todo: NEW TRANSLATION
 cape_route_to_india_events.15.c: "Očistime a utesnime trupy, doplňme sudy a nazbierajme na ostrove zásoby." # todo: NEW TRANSLATION
 cape_route_to_india_events.15.c.tt: "Trupy sa očistia a utesnia smolou, takže lodné červy nebudú počas tejto plavby flotilu trápiť" # todo: NEW TRANSLATION
 cape_route_to_india_events.15.d: "Vráťme sa domov. Už samotný [ShowAreaNameWithNoTooltip('gulf_of_guinea_area')] je dostatočným dôvodom." # todo: NEW TRANSLATION
 cape_route_to_india_events.15.historical_info: "Fernando Po (dnešná Bioko) dosiahol okolo roku 1472 portugalský objaviteľ Fernão do Pó, prvý Európan, ktorý ostrov zazrel. Domorodí Bubiovia tam žili po stáročia v izolácii; z pevniny sa naň presťahovali už dávno. Portugalci ostrov využívali ako zastávku, no nedokázali tam založiť trvalú osadu, čiastočne pre tropické choroby a čiastočne pre odpor Bubiov voči kontaktu. V nasledujúcich storočiach ostrov opakovane menil majiteľov. Zmluvou z El Parda v roku 1778 ho Portugalsko odstúpilo Španielsku výmenou za územné ústupky v Južnej Amerike a napokon sa stal súčasťou dnešnej Rovníkovej Guiney." # todo: NEW TRANSLATION
 cape_route_to_india_events.16.title: "Mesto sultána mora" # todo: NEW TRANSLATION
 cape_route_to_india_events.16.desc: "[ShowLocationName('mogadishu')] je väčšie, než sme čakali. Prístav je plný lodí dhow z [ShowRegionName('arabia_region')] a $india$, ktorých podpalubia sú naplnené [ShowGoodsName('cloth')], [ShowGoodsName('copper')] a [ShowGoodsName('porcelain')]. [ShowLocationNameWithNoTooltip('mogadishu')] ovláda [target_owner.GetName] a jeho [target_owner.Custom('GetRulerOrRegentTitle')], ktorý riadi obchod medzi vnútrozemím [ShowCultureName('somali_culture')] a širším svetom oceánov. Obchodníci na nábreží si naše lode premeriavajú skúmavým pohľadom. Nie sme prvými cudzincami, ktorí sem priplávali s nezvyčajnými plachtami a tovarom, no možno sme prvými, čo prišli z takej diaľky na západ." # todo: NEW TRANSLATION
 cape_route_to_india_events.16.a: "Obchodujme s obchodníkmi [ShowCultureNameWithNoTooltip('somali_culture')]. Každý kontakt sa počíta." # todo: NEW TRANSLATION
 cape_route_to_india_events.16.b: "Pozorujme, zaznamenávajme a plávajme na sever. Hľadáme $india$, nie toto miesto." # todo: NEW TRANSLATION
 cape_route_to_india_events.16.c: "Vráťme sa. Trasa je neznáma a zásoby nám nevystačia." # todo: NEW TRANSLATION
 cape_route_to_india_events.16.historical_info: "Mogadišo bolo jedným z najstarších a najbohatších miest na východoafrickom pobreží a jeho obchodná história siaha stáročia pred príchod Portugalcov. Arabskí zemepisci ho zaznamenali ako významný prístav už v deviatom storočí. V čase da Gamovej plavby mu vládol sultanát a bolo súčasťou obchodnej siete svahilského pobrežia, ktorá spájala africké vnútrozemie s Arábiou, Perziou a Indickým subkontinentom. Portugalské rozhodnutie obísť alebo si podmaniť tieto svahilské mestské štáty v snahe vytvoriť vlastný obchodný monopol ich priviedlo do priameho konfliktu s už existujúcim a dobre fungujúcim obchodným systémom." # todo: NEW TRANSLATION
 cape_route_to_india_events.17.title: "Ibádíjský prístav" # todo: NEW TRANSLATION
 cape_route_to_india_events.17.desc: "[ShowLocationName('masqat')] sa týči nad červenými útesmi a vôňa mora je tu iná — suchšia, ostrejšia, s chuťou prachu a [ShowGoodsName('salt')]. Prístav patrí k najlepším na [ShowProvinceDefinitionName('arabian_sea_province')], je dosť hlboký aj pre veľké lode a chránený pred juhozápadným monzúnom. Obchodníci [ShowCultureName('omani_culture')] sa plavia do $india$ už tisíc rokov. Muži na nábreží poznajú trasy, vetry aj správny čas. Vedia, kedy vyplávať a kedy čakať. Pozerajú sa na nás a premýšľajú, čo chceme." # todo: NEW TRANSLATION
 cape_route_to_india_events.17.a: "Vyhľadajme [ShowCultureNameWithNoTooltip('omani_culture')]ské úrady a ohlásme svoj príchod." # todo: NEW TRANSLATION
 cape_route_to_india_events.17.b: "Zaplaťme [ShowCultureGroupNameWithNoTooltip('arabian_group')]ským navigátorom za mapy ciest do $india$." # todo: NEW TRANSLATION
 cape_route_to_india_events.17.c: "Doplňme zásoby a odplávajme. Námorníci [ShowCultureNameWithNoTooltip('omani_culture')] nie sú naši priatelia." # todo: NEW TRANSLATION
 cape_route_to_india_events.17.d: "Vráťme sa. Plavba do $india$ presahuje naše možnosti." # todo: NEW TRANSLATION
 cape_route_to_india_events.17.historical_info: "Masqaṭ (Maskat) bol významným prístavom ibádíjského imámátu Omán, jednej z hlavných námorných mocností západného Indického oceánu. Ománski námorníci patrili k najzručnejším navigátorom na svete a dobre poznali monzúnové vetry, ktoré určovali dĺžku plavby medzi Arábiou a Indickým subkontinentom. Príchod Portugalcov ohrozil postavenie Ománu ako sprostredkovateľa obchodu s korením a vzťahy medzi Portugalskom a Ománom zostali po väčšinu šestnásteho storočia nepriateľské. Vyvrcholilo to opakovanými vojnami o kontrolu nad Perzským zálivom a východoafrickými prístavmi. Omán napokon v sedemnástom storočí vyhnal Portugalcov z veľkej časti ich východoafrickej siete." # todo: NEW TRANSLATION
 cape_route_to_india_events.18.title: "Portugalci postavili [ShowBuildingTypeNameWithNoTooltip('por_feitoria')]" # todo: NEW TRANSLATION
 cape_route_to_india_events.18.desc: "Ich lode dorazili bez varovania, zakotvili na vonkajšom kotvisku a namierili delá na prístav. Ich požiadavka bola formálne zdvorilá, no v skutočnosti nekompromisná. Chceli postaviť obchodnú stanicu. Zaplatili by malé nájomné. Rešpektovali by miestne zákony. Nepovedali však — a ani nemuseli — čo by sa stalo, keby sme odmietli. Drevo už mali vyrúbané a naložené v podpalubí. Stanica vyrástla za niekoľko dní. Teraz na nej veje zástava [por_feitoria_builder.GetAdjective], tam, kde predtým viala naša." # todo: NEW TRANSLATION
 cape_route_to_india_events.18.a: "Nemáme na výber; ich delá prevážia naše protesty." # todo: NEW TRANSLATION
 cape_route_to_india_events.18.b: "Pošlime protest a žiadajme, aby rešpektovali našu suverenitu." # todo: NEW TRANSLATION
 cape_route_to_india_events.18.historical_info: "Portugalský systém feitorias bol jedným z prvých príkladov európskeho obchodného imperializmu v Ázii a Afrike. Vďaka opevneným obchodným staniciam v existujúcich prístavoch sa Portugalsko mohlo zapojiť do obchodných sietí bez nákladného územného dobývania. Miestni vládcovia, ktorí s tým súhlasili, získali prístup k portugalskému tovaru a námornej ochrane pred súpermi; tých, ktorí odmietli, čakal delostrelecký útok. Tento systém premenil Indický oceán z pomerne otvoreného obchodného priestoru na oblasť pod portugalskou námornou nadvládou a obchodným monopolom Casa da Índia." # todo: NEW TRANSLATION
 cape_route_to_india_events.provisioned_25_tt: "Flotila má plné zásoby a jej posádky lepšie zvládnu dlhé úseky plavby pred sebou (#G +25#! zásob)" # todo: NEW TRANSLATION

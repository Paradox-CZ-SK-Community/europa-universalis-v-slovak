 cape_route_to_india_events.ship_lost_tt: "Jedna loď sa stratila a výprava je menšia (#R -1#! lode)" # todo: NEW TRANSLATION
 cape_route_to_india_events.cargo_loaded_tt: "Podpalubia sú naložené [ShowGoodsName('pepper')] — čím bohatšie budú návraty z plavby, tým väčší náklad sa dostane domov" # todo: NEW TRANSLATION
 cape_route_to_india_events.cargo_spent_tt: "Podpalubia sú prázdnejšie — náklad použitý na získanie tejto priazne sa na konci cesty nepredá (#R -20#! nákladu)" # todo: NEW TRANSLATION
 cape_route_to_india_events.pilot_gained_tt: "Flotilu teraz vedie skúsený lodivod, ktorý nám lepšie poradí pri rokovaní s vládcom Kalikutu" # todo: NEW TRANSLATION
 cape_route_to_india_events.19.title: "Morská choroba" # todo: NEW TRANSLATION
 cape_route_to_india_events.19.desc: "Začína sa to, ako vždy, ďasnami. Zmäknú, potom začnú krvácať a napokon sa zuby v lôžkach uvoľnia. Staré rany, ktoré sa zahojili pred rokmi, sa znovu otvoria, akoby ich práve rozrezali. Muži sú najprv malátni, potom sa zadýchavajú a napokon už nedokážu vstať z hojdacích sietí. Lodný chirurg nemá liek — nik ho nemá. Sudy so solenou rybou a červivými suchármi, ktoré udržali flotilu pri živote na dlhých prázdnych úsekoch, proti tomu nič nezmôžu. Každého svitania sa číta menný zoznam a každého svitania je menej hlasov, ktoré sa ozvú. Telo za telom hádžu cez palubu, zabalené vo vlastných hojdacích sieťach, zatiaľ čo míle k najbližšiemu priateľskému pobrežiu sa nemilosrdne ťahajú." # todo: NEW TRANSLATION
 cape_route_to_india_events.19.a: "Rozdeľme posledné ovocie a ponáhľajme sa k pevnine." # todo: NEW TRANSLATION
 cape_route_to_india_events.19.b: "Nedá sa nič robiť. Pochovajme mŕtvych a modlime sa za ostatných." # todo: NEW TRANSLATION
 cape_route_to_india_events.19.b.tt: "Mnohí členovia posádky neprežijú — výnosy z plavby sa zmenšia" # todo: NEW TRANSLATION
 cape_route_to_india_events.19.historical_info: "Skorbut spôsobený nedostatkom vitamínu C bol najčastejšou príčinou úmrtí námorníkov v období diaľkových plavieb. Počas prvej plavby Vasca da Gamu do $india$ zomrelo odhadom deväťdesiattri zo sto štyridsiatich ôsmich mužov; väčšinu z nich zabil skorbut na dlhých úsekoch bez čerstvých potravín. Skutočnú príčinu sa podarilo spoľahlivo pochopiť až o dve a pol storočia neskôr. Námorníci a lekári vedeli len toľko, že čerstvé potraviny — najmä citrusové ovocie — akosi držia chorobu na uzde. Túto vedomosť opakovane získavali a zabúdali." # todo: NEW TRANSLATION
 cape_route_to_india_events.20.title: "Južná víchrica" # todo: NEW TRANSLATION
 cape_route_to_india_events.20.desc: "Barometer varoval, keby ho niekto vedel čítať: od juhozápadu sa z jasnej oblohy dvíhal dlhý, mohutný príboj. Potom sa obloha zatiahla. Vietor sa oprel do plachiet, stále silnejší, trhal vrcholky vĺn a striekajúcu penu rozfúkaval po hladine. Vlny dorástli do výšky, ktorú nik na palube nedokázal opísať — sivozelené steny pruhované penou zdvíhali lode kormou napred k letiacim oblakom, potom ich spúšťali do priehlbín, kde vietor náhle, desivo utíchol. Kdesi v mútnej tme ostatné lode strieľali z diel, aby udržali smer; výstrely takmer okamžite pohltil hukot. Teraz už niet kurzu, ktorý by sme si mohli zvoliť — plaviť sa dá iba tam, kam dovolí more." # todo: NEW TRANSLATION
 cape_route_to_india_events.20.a: "Spusťme plachty a držme sa proti vetru. Dôverujme lodiam." # todo: NEW TRANSLATION
 cape_route_to_india_events.20.b: "Plavme sa pred búrkou s minimom plachiet a modlime sa, aby nás vlna nezaplavila zozadu." # todo: NEW TRANSLATION
 cape_route_to_india_events.20.b.win_tt: "Risk sa vyplatil — flotila unikla najhoršej časti búrky" # todo: NEW TRANSLATION
 cape_route_to_india_events.20.b.lose_tt: "More si s flotilou urobilo, čo chcelo" # todo: NEW TRANSLATION
 cape_route_to_india_events.20.historical_info: "Vody pri južnej Afrike, kde sa teplý Agulhaský prúd stretáva so studenými vlnami Atlantiku prichádzajúcimi z Južného oceánu, patria k najnebezpečnejším na svete. Dodnes sú tam zaznamenané obrovské vlny schopné potopiť veľkú loď. Pre malé lode z obdobia objavov — karaky a karavely s výtlakom niekoľkých stoviek ton — predstavovala búrka v južnom Atlantiku smrteľnú hrozbu. Priechod okolo Mysu si svoj skorý názov, Mys búrok, vyslúžil právom." # todo: NEW TRANSLATION
 cape_route_to_india_events.21.title: "More bez vetra" # todo: NEW TRANSLATION
 cape_route_to_india_events.21.desc: "Na poludnie vietor ustane a už sa nevráti. Plachty bezvládne visia na sťažňoch a bez úžitku plieskajú v rytme dlhých vĺn. Na druhý deň sa more zmení na sklo, na obrovské oslepujúce zrkadlo tiahnúce sa až k horizontu, ktorý sa chveje v horúčave. Smola v škárach paluby sa topí. Voda v sudoch sa mení na teplú, zelenú a odpornú tekutinu. Neostáva nič, iba čakať — čakať, sledovať slnko, počúvať vŕzganie dreva a snažiť sa nemyslieť na to, koľko zásob zjedia muži, ktorí nikam neplávajú. Námorníci si potichu rozprávajú o lodiach nájdených po rokoch, ako sa bezcieľne plavia, s posádkami dávno mŕtvymi od smädu, hoci vietor, ktorý nikdy nechytili, bol na dohľad." # todo: NEW TRANSLATION
 cape_route_to_india_events.21.a: "Počkajme na vietor. Nedá sa robiť nič iné." # todo: NEW TRANSLATION
 cape_route_to_india_events.21.b: "Spusťme člny a ťahajme loď; čokoľvek je lepšie než toto bezvetrie." # todo: NEW TRANSLATION
 cape_route_to_india_events.21.historical_info: "Rovníkové bezvetrie — doldrums čiže intertropická zóna konvergencie — bolo známou hrozbou pri plavbách cez Atlantik na južnú pologuľu a späť. Plachetnica tam mohla uviaznuť na celé dni či týždne a míňať zásoby i vodu bez toho, aby sa čo i len pohla. Práve preto, aby sa portugalskí moreplavci vyhli tejto oblasti bezvetria a nepriaznivých vetrov, vyvinuli #italic volta do mar#! — veľký oblúk na západ do Atlantiku, takmer až k Brazílii, kde zachytili priaznivé vetry smerom na juh a potom sa obrátili na východ k Mysu." # todo: NEW TRANSLATION
 cape_route_to_india_events.22.title: "Červotoč v trupe" # todo: NEW TRANSLATION
 cape_route_to_india_events.22.desc: "Tesár ho objaví pri bežnej kontrole dna: vrták sa vracia mäkký a keď skúma obloženie pod čiarou ponoru, jeho nástroj sa zaborí do dreva, ktoré by malo byť tvrdé ako železo. Lodný červotoč. V teplých tropických vodách sa to hemží týmito tvormi a odvtedy, čo flotila prekročila rovník, si prevŕtavajú trupy — tisíce bledých chodbičiek ako plásty zvnútra rozožierajú drevo, neviditeľné, až kým sa doska neprelomí alebo čerpadlá prestanú stíhať. Ak sa o takú loď nik nepostará, jedného dňa sa jednoducho rozíde vo švíkoch a potopí sa aj s celou posádkou. Tesárova tvár povie [target_leader.GetName] všetko ešte skôr, než prehovorí." # todo: NEW TRANSLATION
 cape_route_to_india_events.22.a: "Vyklopme lode na bok a vypáľme červotoča z dreva." # todo: NEW TRANSLATION
 cape_route_to_india_events.22.a.tt: "Vyklopenie lodí stojí čas i peniaze, no zachráni flotilu" # todo: NEW TRANSLATION
 cape_route_to_india_events.22.b: "Z najhoršieho trupu vyložme zásoby a drevo a potom ho opustime." # todo: NEW TRANSLATION
 cape_route_to_india_events.22.c: "Zamierme do priateľského prístavu a riadne ju opravme." # todo: NEW TRANSLATION
 cape_route_to_india_events.22.c.tt: "Dôkladná oprava v bezpečnom prístave pozdvihne náladu vo flotile" # todo: NEW TRANSLATION
 cape_route_to_india_events.22.historical_info: "Lodný červotoč #italic Teredo navalis#! — v skutočnosti nejde o červa, ale o druh morskej mušle — bol postrachom drevených lodí v teplých vodách a nechránený trup dokázal zničiť v priebehu jedinej sezóny. Jeho pustošenie viedlo k storočiam protiopatrení: trupy sa obkladali olovom, natierali smolou a lojom alebo sa oplášťovali dvojitou vrstvou s obetovanou vonkajšou doskou. Problém bol na trase do $india$ taký vážny, že Portugalci napokon na svojich základniach v Indickom oceáne vybudovali špeciálne zariadenia na vyklápanie, čistenie a opravu trupov medzi plavbami." # todo: NEW TRANSLATION
 cape_route_to_india_events.24.title: "Vzbura" # todo: NEW TRANSLATION
 cape_route_to_india_events.24.desc: "Prichádzalo to celé týždne — v tlmených rozhovoroch, ktoré utíchli vždy, keď sa priblížil dôstojník, v neochote poslúchať rozkazy aj v pohľadoch. Teraz to prepuklo naplno. Na prednej palube sa zhŕklo niekoľko mužov; jeden zviera v pästi lodný hrot a za nimi stojí zástup ďalších, ktorí sa ešte nerozhodli, na ktorú stranu sa pridajú. Ich požiadavky sú požiadavkami vystrašených mužov, ktorí veria, že ich vedú na smrť: obrátiť sa späť, zamieriť do prístavu [ROOT.GetCountry.GetReligion.GetAdjective] alebo urobiť čokoľvek, len nepokračovať do oceánu, ktorý už pohltil toľkých ich druhov. [target_leader.GetName] stojí sám pri priečke na korme. To, čo [target_leader.GetSheHe] urobí v nasledujúcej minúte, rozhodne, či plavba vôbec bude pokračovať." # todo: NEW TRANSLATION
 cape_route_to_india_events.24.a: "Vysadíme vodcov vzbury na breh a zbabelcov necháme odísť." # todo: NEW TRANSLATION
 cape_route_to_india_events.24.b: "Privítajme ich chladnou oceľou. Loď nie je demokracia." # todo: NEW TRANSLATION
 cape_route_to_india_events.24.fight_win_tt: "Dôstojníci zvíťazili a poriadok je obnovený" # todo: NEW TRANSLATION
 cape_route_to_india_events.24.fight_lose_tt: "Boj bol krvavý a flotila zaň zaplatila" # todo: NEW TRANSLATION
 cape_route_to_india_events.24.c: "Porozprávajme im o $india$, o bohatstve a sláve, ktoré nás čakajú." # todo: NEW TRANSLATION
 cape_route_to_india_events.24.rouse_tt: "Slová [target_leader.GetNameWithNoTooltip] znovu rozdúchali odhodlanie posádky" # todo: NEW TRANSLATION
 cape_route_to_india_events.25.title: "Prázdne pobrežie" # todo: NEW TRANSLATION
 cape_route_to_india_events.25.desc: "Nízke zelené pobrežie sa na záveternej strane vynára z oparu — bez dymu, bez plachiet, bez známok ľudskej prítomnosti, len les siahajúci až k príboju a za ním prísľub čerstvej vody a akejkoľvek zveri, ktorú by krajina mohla skrývať. Na mapách tu nič nie je. Územie si nik nenárokuje, je neznáme a môže skrývať čokoľvek: pramene s pitnou vodou a ľahký lov, ale aj horúčku či nepriateľský ľud, ktorý nás nepozorovane sleduje z okraja lesa. Zásoby vody v sudoch sa však míňajú, muži majú prepadnuté oči a pobrežie je napokon pobrežie." # todo: NEW TRANSLATION
 cape_route_to_india_events.25.a: "Pošlite člny na breh po vodu a všetko, čo nám zem ponúkne." # todo: NEW TRANSLATION
 cape_route_to_india_events.25.b: "Na tomto pobreží je to priveľké riziko. Zaznačte ho a plavte ďalej." # todo: NEW TRANSLATION
 cape_route_to_india_events.26.title: "Pobrežie ochotné obchodovať" # todo: NEW TRANSLATION
 cape_route_to_india_events.26.desc: "Toto pobrežie je obývané a jeho ľudia nie sú nepriateľskí. Keď sa flotila približuje, od brehu vyplávajú kanoe — spočiatku opatrne, potom smelšie. Ponúkajú ryby a ovocie a ukazujú na pláž, kde sa rýchlo schádza akýsi trh. Tí, čo ovládajú tento úsek pobrežia, nemajú so cudzincami žiadny spor a pohľad na [ShowGoodsName('iron')] a [ShowGoodsName('cloth')] vo flotile v nich očividne prebudil záujem o obchod. Je to presne taká príležitosť, akých nám dlhé plavby otvoreným morom ponúkajú len zriedka: miesto, kde možno doplniť zásoby v sudoch, kúpiť čerstvé jedlo a nechať mužov vykročiť na pevnú zem medzi ľudí, ktorí im nechcú ublížiť." # todo: NEW TRANSLATION
 cape_route_to_india_events.26.a: "Vymeňte [ShowGoodsNameWithNoTooltip('iron')] a [ShowGoodsNameWithNoTooltip('cloth')] za všetky čerstvé zásoby." # todo: NEW TRANSLATION
 cape_route_to_india_events.26.b: "Nemôžeme strácať dni. Doplňte len vodu a pokračujte." # todo: NEW TRANSLATION
 cape_route_to_india_events.27.title: "Stratení bez jediného preživšieho" # todo: NEW TRANSLATION
 cape_route_to_india_events.27.desc: "Posledná loď je preč. Či ju pohltilo more, choroba, zúfalstvo mužov alebo nepriateľské pobrežie, doma sa to už nik s istotou nedozvie — len to, že flotila, ktorá vyplávala s takými poctami, sa nevráti. Žiadne podpalubia plné [ShowGoodsName('pepper')]. Žiadny triumfálny návrat domov. Žiadne mapy námornej cesty do $india$. Niekde na tom nesmiernom oblúku oceánu, medzi africkým pobrežím a bohatstvom Východu, sa výprava jednoducho skončila a more sa nad ňou zavrelo, akoby nikdy neexistovala. V Lisabone budú rodiny čakať mesiace a potom roky, kým to pochopia." # todo: NEW TRANSLATION
 cape_route_to_india_events.27.a: "Nech ich prijme [ROOT.GetCountry.GetReligion.GetGodName]. Nepokúsime sa o to znova tak skoro." # todo: NEW TRANSLATION
 cape_route_to_india_events.27.historical_info: "Námorná cesta do $india$ bola otvorená za strašlivú cenu ľudských životov. Aj úspešné plavby pravidelne prichádzali o polovicu posádky a časť lodí; neúspešné zmizli úplne a jediným záznamom o nich zostalo, že sa flotila nevrátila. Z lodí, ktoré sa v nasledujúcom storočí vydali na #italic Carreira da Índia#!, sa značná časť úplne stratila — stroskotali pri africkom pobreží, potopili sa v búrkach južného oceánu alebo o nich jednoducho nikto viac nepočul. Do Lisabonu možno prúdilo nesmierne bohatstvo, no zaplatili zaň utopení a horúčkami skošení muži v rozsahu, na ktorý by sa nemalo zabúdať." # todo: NEW TRANSLATION
 cape_route_to_india_events.28.title: "Pristátie pri [ShowProvinceDefinitionNameWithNoTooltip('cape_verde_province')]" # todo: NEW TRANSLATION
 cape_route_to_india_events.28.desc.empty: "Z ľahostajného mora sa dvíha desať kužeľov čiernej sopečnej horniny a na žiadnom z nich nežije ani duša. Žiadny dym, žiadne plachty, žiadna zástava — len morské vtáky, vietor a niekoľko brakických prameňov medzi popolom. Staré mapy tieto ostrovy pomenovali, no neusadila sa na nich žiadna koruna. Ležia priamo na vodách, cez ktoré musí viesť naša cesta, a [target_leader.GetName] si ich cenu uvedomuje rovnako jasne, ako [target_leader.GetSheHe] pozná [target_leader.GetHerHis] vlastné meno: kto ovláda [ShowProvinceDefinitionName('cape_verde_province')], drží bránu k [ShowContinentName('atlantic_ocean_continent')]. A práve teraz ich neovláda nik." # todo: NEW TRANSLATION
 cape_route_to_india_events.28.desc.foreign: "Nad kotviskom pri [ShowLocationName('santiago')] veje zástava [rival_owner.GetAdjective]. [rival_owner.GetName] dorazil na tieto ostrovy pred nami a zapustil tu korene — má tu posádku, delovú batériu a prístavného správcu, ktorý vesluje k nám, aby sa zdvorilým, no zároveň nevľúdnym tónom spýtal, čo tu pohľadávame. Ostrovy ležia priamo na vodách, cez ktoré musí viesť naša cesta; v rukách [rival_owner.GetAdjectiveWithNoTooltip] sú nožom priloženým ku krku každej plavby na juh. [target_leader.GetName] z paluby skúma opevnenia, mlčí a veľa premýšľa." # todo: NEW TRANSLATION
 cape_route_to_india_events.28.a: "Nárokujte si ostrovy a postavte [ShowBuildingTypeNameWithNoTooltip('por_feitoria')], nad ktorou bude viať naša zástava." # todo: NEW TRANSLATION
 cape_route_to_india_events.28.b: "Vyrazte na breh po vodu a nazbierajte, čo ostrovy ponúkajú." # todo: NEW TRANSLATION
 cape_route_to_india_events.28.c: "Tieto ostrovy nám nepatria. Plavte ďalej na juh." # todo: NEW TRANSLATION
 cape_route_to_india_events.28.d: "Vráťte sa domov." # todo: NEW TRANSLATION
 cape_route_to_india_events.28.historical_info: "Ostrovy Cabo Verde zazreli portugalskí moreplavci okolo roku 1456 a osídľovať sa začali od roku 1462; predtým boli úplne neobývané. Ich poloha uprostred Atlantiku, kde zachytávajú severovýchodné pasáty, z nich urobila nevyhnutnú zastávku na plavbách okolo Afriky aj do Ameriky. Mocnosť, ktorá ovládala Cabo Verde, mala v rukách úzke hrdlo každej južnej trasy; nie náhodou sa Portugalsko rozhodlo ostrovy osídliť a opevniť, keď sa jeho námorné ambície rozrastali." # todo: NEW TRANSLATION
 cape_route_to_india_events.29.title: "Kamenný stĺp" # todo: NEW TRANSLATION
 cape_route_to_india_events.29.desc.rafael: "Flotila zakotvila pri ústí širokej, kalnej rieky, ktorú piloti už nazývajú [ShowLocationNameWithNoTooltip('quelimane')] — Riekou dobrých znamení. Tu muži konečne našli to, čo preplávali pol sveta, aby uvideli: miestne plavidlá s výstrojom v štýle [ShowCultureGroupName('arabian_group')], obchodníkov, ktorí poznajú slovo „$india$“ a pri jeho vyslovení ukazujú na východ. Veľká plavba sa blíži ku koncu. V podpalubí ležia opracované vápencové stĺpy privezené z domova práve na tento účel, každý zakončený krížom a kráľovským erbom. Tesár sa pýta, či má jeden vyniesť na breh. Jeho vztýčením vytesáme do kameňa svoj nárok a počas práce kamenárov doplníme čerstvú vodu a drevo — flotilu to však zdrží o dni, ktoré si možno nemôže dovoliť." # todo: NEW TRANSLATION
 cape_route_to_india_events.29.desc.maria: "Pri pobreží ležia nízke ostrovčeky, zelené a bohaté na vodu, chránené pred vlnobitím — taký kus zeme si unavená flotila cení viac než zlato. $india$ je už blízko; malabárske pobrežie leží niekoľko dní plavby na juh. V podpalubí čaká ďalší vápencový stĺp, opracovaný a popísaný ešte pred začiatkom plavby, pripravený vyhlásiť, že lode našej koruny dorazili do týchto vôd ako prvé. Jeho vztýčením tu zanecháme znamenie, ktoré pretrvá všetkých mužov na palube — no obrad a s ním spojené vyťahovanie lodí na plytčinu a dopĺňanie zásob vody zdrží flotilu, kým sa nezmení ročné obdobie." # todo: NEW TRANSLATION
 cape_route_to_india_events.29.desc: "Toto pobrežie stojí za to označiť. V podpalubí leží jeden z opracovaných vápencových stĺpov privezených z domova — zakončený krížom a kráľovským erbom — určený na vztýčenie na výbežku, aby vyhlásil, že tadiaľto naše lode preplávali ako prvé. Jeho vztýčenie je slávnostnou, no zdĺhavou záležitosťou; flotila musí zostať na kotve, kým kamenári osadia stĺp." # todo: NEW TRANSLATION
 cape_route_to_india_events.29.a: "Vztýčte #italic padrão#! — nech kameň a kríž označia našu cestu." # todo: NEW TRANSLATION
 cape_route_to_india_events.29.b: "Na obrady niet času — doplňte vodu, nazbierajte zásoby a pokračujte." # todo: NEW TRANSLATION
 cape_route_to_india_events.29.historical_info: "#italic Padrão#! bol kamenný stĺp zakončený krížom a portugalským erbom. Na lode sa nakladal vopred vyrobený a vztýčoval sa na novoodhalených pobrežiach, aby si Portugalci nárokovali zásluhy za objavenie a územnú zvrchovanosť. Podľa humanistu Damiãa de Góisa vztýčila flotila Vasca da Gamu na plavbe do $india$ päť takýchto stĺpov: #italic São Rafael#! pri Rieke dobrých znamení, #italic São Jorge#! v Mozambiku, #italic Espírito Santo#! v Malindi, #italic Santa Maria#! na ostrovčekoch a #italic São Gabriel#! v Kalikate. Stĺpy nahradili pominuteľné drevené kríže z predchádzajúcich plavieb a mali pretrvať; viaceré stáli ešte celé stáročia." # todo: NEW TRANSLATION
 cape_route_to_india_events.30.title: "Výprava odvolaná" # todo: NEW TRANSLATION
 cape_route_to_india_events.30.desc: "Rozkaz zaznie a na tejto lodi mu nikto neodporuje — na niektorých tvárach sa zračí úľava, na iných sklamanie. Loď obracia. Za nimi sa vzďaľuje neznáme pobrežie; pred nimi leží dlhá, dobre známa cesta domov. Žiadne mapy $india$, žiadne podpalubia plné [ShowGoodsName('pepper')], žiadne miesto v historických záznamoch o tom, kto ako prvý objavil námornú cestu na východ. Lode sú však celé, posádky žijú a domovský prístav je istotou, nie nádejou.\n\n[target_leader.GetName] ešte dlho sleduje obzor za kormou, potom obráti [target_leader.GetHerHis] pozornosť na úlohy, ktoré [target_leader.GetHerHim] na tejto plavbe ešte čakajú." # todo: NEW TRANSLATION
 cape_route_to_india_events.30.a: "Nech je po našom. Vrátime sa s tým málom, čo sme sa dozvedeli." # todo: NEW TRANSLATION
 cape_route_to_india_events.30.historical_info: "Nie každá portugalská výprava pozdĺž afrického pobrežia pokračovala až k svojmu konečnému cieľu. Kapitáni pravidelne zvažovali riziká neznámej plavby v porovnaní s loďami a mužmi, ktorých už zhromaždili, a bezpečný návrat s čiastočným záznamom o novom pobreží sa často považoval za múdrejšie rozhodnutie. Takéto plavby postupne dopĺňali mapy, aj keď nedosiahli $india$, a práve nahromadené poznatky z generácie čiastkových plavieb napokon umožnili Vascovi da Gamovi dokončiť celú cestu." # todo: NEW TRANSLATION
 cape_route_to_india_events.31.title: "Portugalci stavajú svoju [ShowBuildingTypeNameWithNoTooltip('por_feitoria')]" # todo: NEW TRANSLATION
 cape_route_to_india_events.31.desc: "Ich kapitán prišiel na breh s darmi, nie s delostrelcami, a po troch dňoch rokovaní sa dohodli na podmienkach: pozemok pri vode pre ich [ShowBuildingTypeName('por_feitoria')], nájomné odvádzané do našej pokladnice, naše vlastné súdy, ktoré rozhodnú prípadné spory medzi ich mužmi a našimi, a ich flotila, ktorá bude tento prístav chrániť pred našimi súpermi. Drevo vytiahli z podpalubia už narezané na mieru a základňu postavili za niekoľko dní.\n\nVedľa nášho erbu na nej veje erb [por_feitoria_builder.GetName] a v kotvisku pod ňou je rušnejšie než za poslednú generáciu. Naši vnuci možno raz budú túto dohodu preklínať, no dnešné účty sú jasné: máme pušný prach, látky a priateľa s delami; oni majú sklad a mólo." # todo: NEW TRANSLATION
 cape_route_to_india_events.31.a: "Dodržme podmienky; náš dvor bude na cudzie zbrane hundrať." # todo: NEW TRANSLATION
 cape_route_to_india_events.31.b: "Spíšme dohodu a pevne stanovme nájomné aj práva oboch korún." # todo: NEW TRANSLATION
 cape_route_to_india_events.31.historical_info: "Nie každá feitoria vznikla pod hrozbou bombardovania. Sultán Malindi, ktorý bol dlhodobo v spore s Mombasou, privítal flotilu Vasca da Gamu ako užitočnú protiváhu a poskytol jej pilota, ktorý ju previedol cez more do Kalikatu. Malindi zostalo po desaťročia portugalským spojencom na svahilskom pobreží a hostilo najprv portugalskú obchodnú stanicu a neskôr pevnosť. Vládcovia, ktorí sa dohodli včas, získali prístup k portugalskému tovaru a námornej ochrane pred vlastnými nepriateľmi; viacerí túto dohodu využili na vyriešenie svojich dávnych sporov. Takéto dohody bývali málokedy rovnocenné, no tam, kde sa uzatvárali dobrovoľne, platili omnoho dlhšie než tie vynútené silou." # todo: NEW TRANSLATION

l_polish:
 pilgrimage_expedition_events.1.title: "[current_location.GetNameWithNoTooltip], sväté mesto" # todo: NEW TRANSLATION
 pilgrimage_expedition_events.1.desc: "Po mesiacoch únavnej cesty stojí [target_ruler.GetName] konečne pred hradbami [current_location.GetName], mestom Ukrižovania, mestom Vzkriesenia, najsvätejšou pôdou v celom kresťanskom svete. Vo vzduchu sa vznáša prach tisícov pútnikov a mieša sa s kadidlom, ktoré sa šíri zo stoviek kaplniek.\n\nV samom srdci toho všetkého stojí Chrám Božieho hrobu, postavený priamo nad skalou Golgoty. [target_ruler.GetSheHe|U] putoval ďaleko, aby zažil túto chvíľu. Dlhá cesta, otlačené nohy, prebdené noci — to všetko zmizne, keď sa otvoria veľké dvere a [target_ruler.GetHimHer] ovanie vôňa svätého oleja a starého kameňa." # todo: NEW TRANSLATION
 pilgrimage_expedition_events.1.a: "Pokľakneme pred Božím hrobom." # todo: NEW TRANSLATION
 pilgrimage_expedition_events.1.b: "Dáme postaviť kaplnku v mene krajiny [ROOT.GetCountry.GetAltAdjectiveWithNoTooltip('G')]." # todo: NEW TRANSLATION # todo: COUNTRY CASE
 pilgrimage_expedition_events.1.historical_info: "Jeruzalem priťahoval kresťanských pútnikov už od 4. storočia, keď cisár Konštantín dal na mieste Kristovho pohrebu a zmŕtvychvstania postaviť Chrám Božieho hrobu. Počas križiackych výprav mesto opakovane menilo majiteľov: prvá križiacka výprava ho dobyla v roku 1099, v roku 1187 ho stratil Saladin a v roku 1229 ho zmluvou nakrátko získal späť Fridrich II., kým napokon nepadlo pod nadvládu Mamlúkov. Hoci kresťania mesto stratili, sväté miesta zostali pútnikom prístupné vďaka diplomatickým dohodám, a Jeruzalem sa tak stal najvýznamnejším cieľom katolíckej zbožnosti v celom stredovekom svete." # todo: NEW TRANSLATION
 pilgrimage_expedition_events.2.title: "Večné mesto" # todo: NEW TRANSLATION
 pilgrimage_expedition_events.2.desc: "[current_location.GetName] sa pomaly vynára z roviny a jeho kupoly a veže zachytávajú popoludňajšie svetlo, zatiaľ čo sprievod [target_ruler.GetName] prechádza cez posledný most ponad Tiber. [current_location.GetRank.GetName] je rozľahlé a starobylé, jeho ulice sa hemžia pútnikmi z každého kúta kresťanského sveta, ktorých sem všetkých priťahuje ten istý neviditeľný prúd.\n\nNa vrchole Vatikánskeho pahorku sa proti oblohe týči Bazilika svätého Petra. Tu sídli zástupca Krista, živá autorita cirkvi na zemi. [target_ruler.GetNameWithNoTooltip] žasne, že sa ocitol v samom centre [ShowReligionAdjective('catholic')] duchovného života." # todo: NEW TRANSLATION
 pilgrimage_expedition_events.2.a: "Pokorne uznajme božskú autoritu." # todo: NEW TRANSLATION
 pilgrimage_expedition_events.2.b: "Prispejme darom hodným nášho [ROOT.GetCountry.GetGovernment.GetRulerTitle]." # todo: NEW TRANSLATION
 pilgrimage_expedition_events.2.c: "Prejavili sme úctu. Náš ľud nás potrebuje doma." # todo: NEW TRANSLATION
 pilgrimage_expedition_events.2.d: "$pilgrimage_resupply_light$" # todo: NEW TRANSLATION
 pilgrimage_expedition_events.2.e: "$pilgrimage_resupply_heavy$" # todo: NEW TRANSLATION
 pilgrimage_expedition_events.2.historical_info: "Rím sa stal sídlom kresťanskej autority už v prvých storočiach cirkvi, a to vďaka mučeníckej smrti apoštola Petra, ktorého hrob leží pod veľkou bazilikou nesúcou jeho meno. Pápežstvo sa rozvinulo na svetskú i duchovnú moc a priťahovalo vládcov a pútnikov z celej Európy, ktorí hľadali rozhrešenie, legitimitu a požehnanie Petrovho nástupcu. Jubilejné roky, ktoré sa začali v roku 1300 za pápeža Bonifáca VIII., prilákali státisíce pútnikov a upevnili postavenie Ríma ako najvýznamnejšieho cieľa katolíckych pútí." # todo: NEW TRANSLATION
 pilgrimage_expedition_events.3.title: "Koniec cesty Camino" # todo: NEW TRANSLATION
 pilgrimage_expedition_events.3.desc: "Posledné míle #italic Camino de Santiago#! sú najpreplnenejšie. Zo všetkých ciest a údolí sa prúdy pútnikov zbiehajú k veľkej katedrále v [current_location.GetName]. Ich palice sú vyhladené používaním a plášte pokrýva prach z päťsto míľ cesty. Niektorí plačú. Niektorí kráčali stovky míľ bosí.\n\n[target_ruler.GetName] ide na čele [target_ruler.GetHerHis] sprievodu, no keď sa v diaľke objavia veže katedrály, zosadne z koňa. Zdá sa správne prejsť posledný úsek pešo. Vetrom sa nesie mohutný chorál pútnikov: #italic Ultreia! Ultreia!#!, a akoby mu odpovedali aj kamene na ceste." # todo: NEW TRANSLATION
 pilgrimage_expedition_events.3.a: "Poďakujme pri hrobe svätého Jakuba." # todo: NEW TRANSLATION
 pilgrimage_expedition_events.3.b: "Vyhlásme to za znamenie Božej priazne našej vláde." # todo: NEW TRANSLATION
 pilgrimage_expedition_events.3.c: "Veľkolepý deň. No stále musíme vládnuť nášmu [ROOT.GetCountry.GetFlavorRank]." # todo: NEW TRANSLATION
 pilgrimage_expedition_events.3.d: "$pilgrimage_resupply_light$" # todo: NEW TRANSLATION
 pilgrimage_expedition_events.3.e: "$pilgrimage_resupply_heavy$" # todo: NEW TRANSLATION
 pilgrimage_expedition_events.3.historical_info: "Kult apoštola svätého Jakuba v Santiagu de Compostela vznikol v 9. storočí, keď sa v Galícii našli ostatky považované za Jakubove a astúrsky kráľ Alfons II. ich uložil do svätyne. Pútnická cesta, #italic Camino de Santiago#!, sa stala jednou z troch veľkých pútnických trás stredovekého kresťanstva, popri Ríme a Jeruzaleme. V 12. storočí lemovali cestu nemocnice, kláštory a kostoly a putovali po nej pútnici zo všetkých európskych krajín. Po príchode do Santiaga získal pútnik potvrdenie Compostela a úplné odpustky." # todo: NEW TRANSLATION
 pilgrimage_expedition_events.4.title: "Svätyňa Troch kráľov" # todo: NEW TRANSLATION
 pilgrimage_expedition_events.4.desc: "[current_location.GetName] je [current_location.GetRank.GetName] plné žeriavov a lešenia. Na veľkej katedrále sa pracuje už takmer dve storočia. Jej nedokončené veže každým rokom rastú vyššie, no hotová nebude ešte ani za života mnohých budúcich generácií. Aj nedokončená je však nesmierna; vraví sa, že je najväčšou na svete.\n\nV južnej priečnej lodi, za oltárom žiariacim zlatom a svetlom sviec, stojí Svätyňa Troch kráľov: zlatá relikviárová schránka s kosťami mudrcov, ktorí nasledovali hviezdu do Betlehema. [target_ruler.GetName] o nej počúva už od detstva. Nič však nemohlo pripraviť [target_ruler.GetHimHer] na túto chvíľu." # todo: NEW TRANSLATION
 pilgrimage_expedition_events.4.a: "Pokľaknime a uctime si Svätyňu Troch kráľov." # todo: NEW TRANSLATION
 pilgrimage_expedition_events.4.b: "Štedro prispejme na stavbu katedrály." # todo: NEW TRANSLATION
 pilgrimage_expedition_events.4.c: "Pomodlíme sa a potom sa vydáme na cestu." # todo: NEW TRANSLATION
 pilgrimage_expedition_events.4.d: "$pilgrimage_resupply_light$" # todo: NEW TRANSLATION
 pilgrimage_expedition_events.4.e: "$pilgrimage_resupply_heavy$" # todo: NEW TRANSLATION
 pilgrimage_expedition_events.4.historical_info: "Svätyňa Troch kráľov v Kolíne nad Rýnom je najväčším relikviárom západného sveta a údajne v nej spočívajú kosti biblických mudrcov. Relikvie získal cisár Svätej ríše rímskej Fridrich Barbarossa po dobytí Milána v roku 1164 a daroval ich kolínskemu arcibiskupovi Rainaldovi z Dasselu. Ich príchod premenil Kolín nad Rýnom na jedno z najvýznamnejších pútnických miest severnej Európy a podnietil stavbu veľkej gotickej katedrály, ktorá sa začala v roku 1248 a dokončená bola až v roku 1880. Spojenie mudrcov s kráľovskou mocou a sviatkom Zjavenia Pána dodávalo ich kultu osobitný význam pre svetských vládcov hľadajúcich božské uznanie." # todo: NEW TRANSLATION
 pilgrimage_expedition_events.5.title: "Panna Mária z [current_location.GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 pilgrimage_expedition_events.5.desc: "Hovorí sa, že okná v [current_location.GetName] nemožno opísať, treba ich vidieť. [target_ruler.GetName] stojí v hlavnej lodi a chápe prečo. Katedrálu napĺňa modré svetlo, ktoré preniklo tisíckami farebných skiel a premenilo sa na niečo, čo už celkom nepatrí tomuto svetu. V meniacich sa škvrnách dopadá na kamennú podlahu, na tváre kľačiacich pútnikov i na starobylú relikviu v zlatej schránke za hlavným oltárom.\n\n#italic Sancta Camisa#!, závoj Panny Márie, ktorý údajne nosila pri Zvestovaní, sem priťahuje veriacich už od čias Karola Veľkého. [target_ruler.GetNameWithNoTooltip] zostane stáť celkom nehybne a nečakane ho/ju to dojme." # todo: NEW TRANSLATION
 pilgrimage_expedition_events.5.a: "Uctime si #italic Sancta Camisa#! a pomodlime sa k Panne Márii." # todo: NEW TRANSLATION
 pilgrimage_expedition_events.5.b: "Krása tohto miesta si zaslúži rozjímanie." # todo: NEW TRANSLATION
 pilgrimage_expedition_events.5.c: "Nádherná katedrála. Náš ľud nás potrebuje doma." # todo: NEW TRANSLATION
 pilgrimage_expedition_events.5.d: "$pilgrimage_resupply_light$" # todo: NEW TRANSLATION
 pilgrimage_expedition_events.5.e: "$pilgrimage_resupply_heavy$" # todo: NEW TRANSLATION
 pilgrimage_expedition_events.5.historical_info: "Katedrála Notre-Dame de Chartres je jedným z najlepších príkladov francúzskej gotickej architektúry a pútnickým miestom je už od raného stredoveku. Jej hlavnou relikviou je #italic Sancta Camisa#!, kus látky, ktorý sa považuje za tuniku, ktorú mala Panna Mária na sebe pri Zvestovaní. Katedrále ju daroval Karol Veľký a prežila ničivý požiar z roku 1194, ktorý zničil staršiu románsku stavbu. Katedrálu okolo relikvie obnovili mimoriadne rýchlo. Jej západné rozetové okno a lancetové okná z obdobia okolo roku 1220 patria k najznámejším stredovekým vitrážam na svete. Vďaka #italic Sancta Camisa#! sa Chartres stalo jedným z najvýznamnejších mariánskych pútnických miest v Európe." # todo: NEW TRANSLATION
 pilgrimage_expedition_events.6.title: "Svätyňa mučeníka" # todo: NEW TRANSLATION
 pilgrimage_expedition_events.6.desc: "[current_location.GetName] leží v plytkom údolí na zelenom vidieku [ShowCultureName('english')] a jeho katedrálne veže vidno už z diaľky. [current_location.GetRank.GetName] je preplnené pútnikmi; ubytovne nestačia a ľudia sa tlačia aj v stodolách a na dvoroch. Cesty sú plné ľudí hovoriacich tuctom jazykov, všetci smerujú na to isté miesto.\n\nSvätyňa svätého Tomáša Becketa sa nachádza v Kaplnke Najsvätejšej Trojice za hlavným oltárom. Kedysi bola najhonosnejšie vyzdobenou svätyňou v [ShowScriptedGeographyName('england_geography')]: zdobili ju drahokamy, zlato a votívne dary najrôznejšieho druhu. [target_ruler.GetName] sa pred ňou zastaví. Tu zabili muža, ktorý vzdoroval kráľovi. A práve tento vzdor sa stal svätosťou. Či už sa na to pozrieme akokoľvek, je v tom poučenie." # todo: NEW TRANSLATION
 pilgrimage_expedition_events.6.a: "Zapáľme sviecu a pomodlime sa pri Becketovej svätyni." # todo: NEW TRANSLATION
 pilgrimage_expedition_events.6.b: "Objednajme omšu za duše veriacich." # todo: NEW TRANSLATION
 pilgrimage_expedition_events.6.c: "Svätý už mal dosť vládcov vzdávajúcich mu úctu. Vrátime sa domov." # todo: NEW TRANSLATION
 pilgrimage_expedition_events.6.d: "$pilgrimage_resupply_light$" # todo: NEW TRANSLATION
 pilgrimage_expedition_events.6.e: "$pilgrimage_resupply_heavy$" # todo: NEW TRANSLATION
 pilgrimage_expedition_events.6.historical_info: "Tomáša Becketa, canterburského arcibiskupa, zavraždili v jeho vlastnej katedrále rytieri konajúci na základe nepriamo vyjadreného želania anglického kráľa Henricha II. 29. decembra 1170. Jeho smrť otriasla kresťanským svetom a už v roku 1173, necelé tri roky po nej, ho vyhlásili za svätého. Henrich II. musel pri Becketovom hrobe verejne konať pokánie a Becketova svätyňa sa rýchlo stala najnavštevovanejším pútnickým miestom v Anglicku. Do dejín ju zvečnili Canterburské poviedky Geoffreyho Chaucera. #italic The Canterbury Tales#!. Svätyňu počas dvoch storočí zdobili nevšedné zbierky drahokamov a zlata, ktoré darovali veriaci. Patril k nim aj francúzsky kráľovský rubín, veľký drahokam darovaný kráľom Ľudovítom VII. Henrich VIII. nariadil svätyňu v roku 1538 zničiť a jej poklady skonfiškovať." # todo: NEW TRANSLATION
 pilgrimage_expedition_events.7.title: "Sídlo svätého Patrika" # todo: NEW TRANSLATION
 pilgrimage_expedition_events.7.desc: "[current_location.GetName] leží na nízkom pahorku na severe [ShowRegionName('ireland_region')] a jeho dvojicu katedrál vidno z okolitých polí. Nie je to veľkolepé mesto — nie [ShowLocationName('rome')], ani [ShowLocationName('jerusalem')] — no jeho starobylosť mu dodáva tichú autoritu. Je to najstaršia [ShowReligionGroupAdjective('christian')] obec v [ShowRegionNameWithNoTooltip('ireland_region')], sídlo, ktoré založil sám svätý Patrik, keď prišiel obrátiť ostrov na kresťanstvo.\n\n[target_ruler.GetName] prichádza skoro ráno, keď sa na pahorkoch ešte drží hmla. Katedrálny kanonik víta [target_ruler.GetHimHer] pri bráne a vedie [target_ruler.GetHimHer] na miesto, kde sa vraj modlieval Patrik. Pokora tohto miesta je nečakaná a akosi príhodná." # todo: NEW TRANSLATION
 pilgrimage_expedition_events.7.a: "Zúčastnime sa omše v Katedrále svätého Patrika." # todo: NEW TRANSLATION
 pilgrimage_expedition_events.7.b: "Zanechajme dar pri svätyni svätého Patrika." # todo: NEW TRANSLATION
 pilgrimage_expedition_events.7.c: "Navštívili sme toto miesto s úctou. Je čas vrátiť sa." # todo: NEW TRANSLATION
 pilgrimage_expedition_events.7.d: "$pilgrimage_resupply_light$" # todo: NEW TRANSLATION
 pilgrimage_expedition_events.7.e: "$pilgrimage_resupply_heavy$" # todo: NEW TRANSLATION
 pilgrimage_expedition_events.7.historical_info: "Armagh sa tradične považuje za cirkevné hlavné mesto Írska, čo odvodzuje od svojho spojenia so svätým Patrikom, ktorý tam údajne okolo roku 445 n. l. založil svoj hlavný kostol. Armaghské biskupstvo sa stalo sídlom írskeho prímasa a o toto postavenie súperili katolícka a protestantská katedrála, ktoré dodnes stoja na dvoch pahorkoch mesta. S blížiacou sa reformáciou spočíval význam Armaghu rovnako v jeho symbolickej váhe — bol to kostol apoštola, ktorý obrátil Írsko na kresťanstvo — ako aj v politickej moci. Vďaka tomu sem prichádzali vládcovia, ktorí chceli prejaviť zbožnosť alebo solidaritu s írskou cirkvou." # todo: NEW TRANSLATION
 pilgrimage_expedition_events.8.title: "Svätyňa na ceste" # todo: NEW TRANSLATION
 pilgrimage_expedition_events.8.desc: "[target_ruler.GetName] prichádza do [current_location.GetName], ďalšej zastávky na dlhej pútnickej ceste. Nech už sem pútnikov pôvodne prilákala akákoľvek relikvia či spomienka na svätosť, láka ich sem aj naďalej, z generácie na generáciu, hoci väčšina pocestných už dávno zabudla na podrobnosti.\n\n[target_ruler.GetSheHe|U] sa zastaví medzi ostatnými pocestnými, unavenými a zaprášenými ako [target_ruler.GetHerHis] vlastný sprievod, a poďakuje za to, že až sem ich cesta prebehla bezpečne." # todo: NEW TRANSLATION
 pilgrimage_expedition_events.8.a: "Poďakujme za bezpečnú cestu." # todo: NEW TRANSLATION
 pilgrimage_expedition_events.8.b: "Zanechajme dar pre pútnikov, ktorí prídu po nás." # todo: NEW TRANSLATION
 pilgrimage_expedition_events.8.c: "Toto sväté miesto už máme za sebou. Je čas vydať sa domov." # todo: NEW TRANSLATION
 pilgrimage_expedition_events.8.d: "$pilgrimage_resupply_light$" # todo: NEW TRANSLATION
 pilgrimage_expedition_events.8.e: "$pilgrimage_resupply_heavy$" # todo: NEW TRANSLATION
 pilgrimage_expedition_events.9.title: "Púť sa končí žiaľom" # todo: NEW TRANSLATION
 pilgrimage_expedition_events.9.desc: "[target_leader.GetName] zomrel na ceste a púť sa tak nedokončí. Správa o tejto strate sa do krajiny [ROOT.GetCountry.GetAltAdjective('G')] dostane pomaly; domov ju prinesú družiníci, ktorí zostali po boku [target_leader.GetHerHis] až do poslednej chvíle." # todo: NEW TRANSLATION # todo: COUNTRY CASE
 pilgrimage_expedition_events.9.a: "Budeme smútiť nad našou stratou." # todo: NEW TRANSLATION
 pilgrimage_expedition_events.17.title: "Opustená púť" # todo: NEW TRANSLATION
 pilgrimage_expedition_events.17.desc: "[target_leader.GetName] sa vydáva na cestu späť s nesplneným sľubom. Púť sa skončila predčasne, ešte pred dosiahnutím cieľa. Správa o porušenom sľube dorazí do krajiny [ROOT.GetCountry.GetAltAdjective('G')] skôr než [target_leader.GetHimHer] a [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] si na to spomenie ešte dlho po tom, čo [ROOT.GetCountry.GetGovernment.GetCourtTitle] pôjde ďalej." # todo: NEW TRANSLATION # todo: COUNTRY CASE
 pilgrimage_expedition_events.17.a: "Vrátime sa zahanbení, náš sľub Bohu zostal nesplnený." # todo: NEW TRANSLATION
 pilgrimage_expedition_events.10.title: "Chudobný muž z Assisi" # todo: NEW TRANSLATION
 pilgrimage_expedition_events.10.desc: "[target_ruler.GetName] vystupuje na posledný svah k [current_location.GetName]. Pred [target_ruler.GetHimHer] sa týči veľká bazilika s dvoma úrovňami z bledého kameňa, vybudovaná priamo do svahu a postavená neuveriteľne rýchlo po smrti muža, ktorého si uctieva — žobráka, ktorý nič nevlastnil a dnes má jeden z najhonosnejších kostolov v Taliansku.\n\nV dolnom kostole, v krypte vytesanej do živej skaly, spočíva sám František z Assisi. [target_ruler.GetSheHe|U] kľačí pred hrobom muža, ktorý sa vzdal hodvábu a zlata v prospech povrazu okolo pása a bosých nôh, muža, ktorý údajne kázal vtákom a skrotil vlka. [target_ruler.GetHimHer] neuniká rozpor medzi svätcovou chudobou a nádherou, ktorú postavili na jeho pamiatku." # todo: NEW TRANSLATION
 pilgrimage_expedition_events.10.a: "Pokorne pokľaknime, ako by to urobil sám František." # todo: NEW TRANSLATION
 pilgrimage_expedition_events.10.b: "V duchu svätca rozdávajme almužnu chudobným vonku." # todo: NEW TRANSLATION
 pilgrimage_expedition_events.10.c: "Prejavili sme úctu. Je čas vrátiť sa." # todo: NEW TRANSLATION
 pilgrimage_expedition_events.10.d: "$pilgrimage_resupply_light$" # todo: NEW TRANSLATION
 pilgrimage_expedition_events.10.e: "$pilgrimage_resupply_heavy$" # todo: NEW TRANSLATION
 pilgrimage_expedition_events.10.historical_info: "František z Assisi (1181/2 – 1226) sa vzdal rodinného bohatstva, aby žil v chudobe, a založil františkánsky rád na zásadách pokory, putovného kázania a služby chudobným a chorým. Pápež Gregor IX. ho svätorečil v roku 1228, iba dva roky po jeho smrti, čo bolo jedno z najrýchlejších svätorečení v stredovekých dejinách. V tom istom roku sa začalo stavať Baziliku svätého Františka a do roku 1253 bola z veľkej časti hotová. Jej dolný a horný kostol neskôr vyzdobili freskami pripisovanými Cimabuemu a Giottovi. Napriek tomu, že svätec odmietal hmotné bohatstvo, Assisi sa stalo jedným z veľkých pútnických miest katolíckej Európy a priťahovalo panovníkov aj obyčajných pútnikov." # todo: NEW TRANSLATION
 pilgrimage_expedition_events.11.title: "Svätý námorníkov" # todo: NEW TRANSLATION
 pilgrimage_expedition_events.11.desc: "[current_location.GetName] vonia morom dávno predtým, než [target_ruler.GetName] dorazí k jeho hradbám. Toto prístavné [current_location.GetRank.GetName] vzniklo okolo jediného veľkého pokladu. Pod románskymi oblúkmi baziliky leží hrob Mikuláša z Myry, ktorého sem pred viac ako sto rokmi priviezli miestni námorníci z rozpadajúcich sa kostolov kresťanského Východu, ktorý ich už nedokázal ochrániť.\n\nRaz do roka hrob otvoria a z okolia svätcových kostí odoberú číru tekutinu, #italic mannu#!, o ktorej veriaci — [ShowReligionAdjective('catholic')] i [ShowReligionAdjective('orthodox')] — veria, že má liečivú moc. [target_ruler.GetName] dostane ukázať jej fľaštičku a zarazí ho/ju myšlienka, že nijaká iná svätyňa na tejto púti nie je rovnako uctievaná oboma vetvami kresťanstva." # todo: NEW TRANSLATION
 pilgrimage_expedition_events.11.a: "Uctime si hrob a prijmime fľaštičku manny." # todo: NEW TRANSLATION
 pilgrimage_expedition_events.11.b: "Objednajme omšu za námorníkov, ktorí priviezli svätca domov." # todo: NEW TRANSLATION
 pilgrimage_expedition_events.11.c: "Svätý nám požehnal. Teraz sa vrátime domov." # todo: NEW TRANSLATION
 pilgrimage_expedition_events.11.d: "$pilgrimage_resupply_light$" # todo: NEW TRANSLATION
 pilgrimage_expedition_events.11.e: "$pilgrimage_resupply_heavy$" # todo: NEW TRANSLATION
 pilgrimage_expedition_events.11.historical_info: "V roku 1087 vyplávalo šesťdesiatdva námorníkov z Bari do lykijskej Myry, ktorej hrozilo dobytie Seldžukmi, a odniesli odtiaľ kosti svätého Mikuláša skôr, než sa stratili alebo boli zničené. Relikvie dorazili do Bari 9. mája 1087; tento deň sa dodnes slávi ako sviatok Prenesenia ostatkov. Na ich uloženie postavili Baziliku svätého Mikuláša, ktorej kryptu vysvätil pápež Urban II. v roku 1089. Od príchodu relikvií sa okolo kostí stále tvorí číra tekutina, ktorú veriaci nazývajú #italic manna#! a ktorú každoročne odoberá arcibiskup z Bari. Mikuláš bol patrónom námorníkov, kupcov a detí a patril k niekoľkým svätcom, ktorých rovnako oddane uctievali katolíci aj pravoslávni. Vďaka nemu sa Bari stalo pútnickým miestom, aké v Taliansku nemalo obdoby." # todo: NEW TRANSLATION
 pilgrimage_expedition_events.12.title: "Vysvätenie anjelmi" # todo: NEW TRANSLATION
 pilgrimage_expedition_events.12.desc: "Benediktínske opátstvo v [current_location.GetName] leží na okraji temného lesa v pahorkatine [ShowCultureGroupName('swiss_group')]. Jeho mnísi v čiernych habitoch sú nasledovníkmi pustovníka, ktorého na tomto mieste pred mnohými generáciami zavraždili zbojníci. [target_ruler.GetName] počúva tento príbeh od detstva: kaplnku tu nevysvätil biskup, ale sám Kristus, ktorý v predvečer jej posvätenia zostúpil s chórom anjelov a svätcov.\n\nV Kaplnke Panny Márie stojí predmet onoho prvého, sporného vysvätenia: malá soška Panny Márie, ktorej tvár stáročia dym zo sviec sfarbili načierno. Pútnici z nemecky hovoriacich krajín pred ňou kľačia v neprerušenej rade, ktorá siaha tak ďaleko do minulosti, že si to [target_ruler.GetNameWithNoTooltip] ani nedokáže predstaviť." # todo: NEW TRANSLATION
 pilgrimage_expedition_events.12.a: "V tichej oddanosti pokľaknime pred Čiernou Madonou." # todo: NEW TRANSLATION
 pilgrimage_expedition_events.12.b: "Podporíme vychýrenú kláštornú knižnicu a skriptórium." # todo: NEW TRANSLATION
 pilgrimage_expedition_events.12.c: "V týchto temných lesoch sme videli dosť. Pokračujme." # todo: NEW TRANSLATION
 pilgrimage_expedition_events.12.d: "$pilgrimage_resupply_light$" # todo: NEW TRANSLATION
 pilgrimage_expedition_events.12.e: "$pilgrimage_resupply_heavy$" # todo: NEW TRANSLATION
 pilgrimage_expedition_events.12.historical_info: "Počiatky Einsiedelnu siahajú k pustovníkovi Meinradovi, ktorý sa usadil v tomto lese a v roku 861 ho zavraždili zbojníci. V roku 934 tu mních Eberhard založil kláštor. Podľa pretrvávajúcej legendy vysvätil kaplnku zázračne sám Kristus v noci 14. septembra 948; toto tvrdenie neskôr potvrdil pápež Lev VIII. Čierna Madona v opátstve je už stáročia predmetom pútnickej úcty a Einsiedeln sa vďaka nej stal jednou z najnavštevovanejších mariánskych svätýň v nemecky hovoriacom svete." # todo: NEW TRANSLATION
 pilgrimage_expedition_events.13.title: "Jasný vrch" # todo: NEW TRANSLATION
 pilgrimage_expedition_events.13.desc: "#italic Jasna Góra#!, Jasný vrch, sa týči nad rovinou už dávno predtým, než [target_ruler.GetName] dorazí k bránam kláštora. Jeho biele múry zachytávajú svetlo spôsobom, ktorý pavlíni, čo ho postavili, iste zamýšľali. Vo vnútri, za stenou zo strieborných votívnych darov a horiacich sviec, visí tmavá ikona Panny Márie, vďaka ktorej sa toto skromné [ShowCultureGroupName('polish_group')] [current_location.GetRank.GetName] stalo cieľom pútnikov zo severu.\n\n[target_ruler.GetName] si zblízka prezerá tvár Madony a vidí ich: dve rovnobežné jazvy na jej pravom líci, staré rany, ktoré sa nepodarilo celkom zakryť žiadnou obnovou. Kedysi ju zasiahol úder nájazdníckeho meča. Mnísi, ktorí ju potom premaľovali, však znova a znova videli, ako sa rezy objavujú cez čerstvú farbu, až sa napokon vzdali snahy zakryť to, čo sa stalo." # todo: NEW TRANSLATION
 pilgrimage_expedition_events.13.a: "Uctime si ikonu a jej nezahojené rany." # todo: NEW TRANSLATION
 pilgrimage_expedition_events.13.b: "Prisľúbme zlato na opevnenie, aby ju už nikto nevyraboval." # todo: NEW TRANSLATION
 pilgrimage_expedition_events.13.c: "Jasný vrch sme si prezreli. Vráťme sa domov." # todo: NEW TRANSLATION
 pilgrimage_expedition_events.13.d: "$pilgrimage_resupply_light$" # todo: NEW TRANSLATION
 pilgrimage_expedition_events.13.e: "$pilgrimage_resupply_heavy$" # todo: NEW TRANSLATION
 pilgrimage_expedition_events.13.historical_info: "Pavlínsky kláštor na Jasnej Góre založil v roku 1382 opolský vojvoda Vladislav, ktorý so sebou priniesol ikonu Panny Márie s dieťaťom v byzantskom štýle, už v tom čase uctievanú ako zázračnú. Na Veľkú noc roku 1430 vtrhla do kláštora skupina husitských nájazdníkov z Čiech, Moravy a Sliezska. Ikonu rozbili na kusy a šabľou dvakrát sekli Pannu Máriu do tváre. Reštaurátori na kráľovskom dvore Vladislava Jagelovského v Krakove panel opravili, no jazvy sa znovu objavili cez každú novú vrstvu farby, a napokon ich na obraze natrvalo a zámerne ponechali. Panna Mária Čenstochovská sa stala najvýznamnejšou mariánskou svätyňou v Poľsku a jej jazvami poznačenú tvár po stáročia kopírovali na ikony v celom regióne." # todo: NEW TRANSLATION
 pilgrimage_expedition_events.14.title: "Sídlo svätého Štefana" # todo: NEW TRANSLATION
 pilgrimage_expedition_events.14.desc: "[current_location.GetName] leží na ohybe Dunaja a z jeho katedrálneho pahorku sa otvára výhľad na rieku, ktorá kedysi označovala hranicu kresťanskej Európy. Tu, v kaplnke, ktorú odvtedy mnohokrát prestavali, sa Štefan Uhorský narodil, bol pokrstený a v zimný deň na prelome tisícročí korunovaný za prvého kresťanského kráľa svojho ľudu.\n\n[target_ruler.GetName] prijíma arcibiskup z [current_location.GetNameWithNoTooltip], uhorský prímas a nástupca v sídle, ktoré založil sám Štefan. Arcibiskup rozpráva o mladom kráľovi, ktorý si zvolil krst namiesto starých bohov, ktorý postavil tento kostol skôr než svoj palác a ktorého svätorečili už niekoľko desaťročí po jeho smrti — pretože pochopil, že kresťanská koruna musí spočívať na kresťanskej cirkvi." # todo: NEW TRANSLATION
 pilgrimage_expedition_events.14.a: "V tichej modlitbe vzdaj úctu odkazu svätého Štefana." # todo: NEW TRANSLATION
 pilgrimage_expedition_events.14.b: "Dlho sa raď s uhorským arcibiskupom-primasom." # todo: NEW TRANSLATION
 pilgrimage_expedition_events.14.c: "Návšteva hodná kresťanského vládcu. Čas vyraziť." # todo: NEW TRANSLATION
 pilgrimage_expedition_events.14.d: "$pilgrimage_resupply_light$" # todo: NEW TRANSLATION
 pilgrimage_expedition_events.14.e: "$pilgrimage_resupply_heavy$" # todo: NEW TRANSLATION
 pilgrimage_expedition_events.14.historical_info: "Štefan I. Uhorský sa narodil okolo roku 975 v Ostrihome a tam ho korunovali, keď sa blížili Vianoce roku 1000. Táto udalosť znamenala formálny vznik kresťanského Uhorského kráľovstva. Štefan v roku 1001 založil Ostrihomské arcibiskupstvo, najstaršie v krajine, a jeho arcibiskupi odvtedy zastávajú hodnosť uhorského prímasa. Ostrihom slúžil ako politické a náboženské hlavné mesto kráľovstva až do polovice 13. storočia a Štefanova kanonizácia v roku 1083 spečatila miesto mesta ako duchovného srdca uhorského kresťanstva." # todo: NEW TRANSLATION
 pilgrimage_expedition_events.15.title: "Chorvátsky Nazaret" # todo: NEW TRANSLATION
 pilgrimage_expedition_events.15.desc: "Na kopci nad [current_location.GetName], s výhľadom na záliv, stojí skromný františkánsky kostol postavený okolo prázdneho miesta, na ktorom podľa miestnych pútnikov kedysi stávalo niečo neobyčajné. Tri roky tu vraj stál samotný dom Svätej rodiny, celý prenesený z Nazareta anjelmi, keď sa Svätá zem stala príliš nebezpečnou na to, aby ho ochránila, a potom pokračoval vo svojej zázračnej ceste do talianskeho Loreta.\n\n[target_ruler.GetName] ukážu obraz, ktorý pápež poslal, aby [current_location.GetRank.GetName] potešil po odchode domu: Pannu Máriu dojčiacu Ježiška, údajne dielo samotného svätého Lukáša. Už celé generácie priťahuje pútnikov na tento svah. Je svätyňou niečoho, čo už tu nie je, a predsa tu akosi stále je." # todo: NEW TRANSLATION
 pilgrimage_expedition_events.15.a: "Ucti obraz Trsatskej Matky Božej." # todo: NEW TRANSLATION
 pilgrimage_expedition_events.15.b: "Objednaj omšu za bezpečnú plavbu v [current_location.GetRank.GetNameWithNoTooltip], ktorého život závisí od mora." # todo: NEW TRANSLATION
 pilgrimage_expedition_events.15.c: "Dom odišiel do Loreta. Aj my sa musíme vydať na cestu domov." # todo: NEW TRANSLATION
 pilgrimage_expedition_events.15.d: "$pilgrimage_resupply_light$" # todo: NEW TRANSLATION
 pilgrimage_expedition_events.15.e: "$pilgrimage_resupply_heavy$" # todo: NEW TRANSLATION
 pilgrimage_expedition_events.15.historical_info: "Podľa tradície anjeli 10. mája 1291 preniesli Svätý dom nazaretský, domov Panny Márie, na kopec Trsat nad Rijekou. Zostal tam tri roky, než 10. decembra 1294 pokračoval do talianskeho Loreta. Nikola I. Frankopan dal na tomto mieste postaviť prvý kostol, aby označil miesto, kde dom stál. V roku 1367 poslal pápež Urban V. svätyni obraz Panny Márie s Dieťaťom, tradične pripisovaný svätému Lukášovi, ako útechu po odchode domu. Františkánski mnísi strážia svätyňu od nasledujúceho storočia. Legenda mestu vyniesla trvalú prezývku: Chorvátsky Nazaret." # todo: NEW TRANSLATION
 pilgrimage_expedition_events.16.title: "Kráľ mučeník" # todo: NEW TRANSLATION
 pilgrimage_expedition_events.16.desc: "Katedrála v [current_location.GetName] sa črtá na severnej oblohe, strohá a sivá. Stojí nad piesčinou, kde otvorili kráľov hrob o čosi viac než rok po jeho smrti a s úžasom zistili, že jeho telo sa nerozložilo. Vraj mu v tmavej zemi naďalej rástli vlasy a nechty a z rakvy sa šírila sladká vôňa tam, kde mal byť cítiť zápach smrti.\n\n[target_ruler.GetName] stojí pred svätyňou Olava Haraldssona, kedysi vikingského vojvodcu, ktorý padol v boji pri pokuse násilím vnútiť kresťanstvo kráľovstvu, ktoré ho nechcelo. Za svätého ho vyhlásili do roka po jeho smrti, a to na základe všeobecného súhlasu; nijakého vzdialeného pápeža na to nebolo treba. [target_ruler.GetNameWithNoTooltip] uvažuje, že je to zvláštny druh svätosti: nezískaná nežnou zbožnosťou, ale mečom a smrťou za vec, ktorá sa ako spravodlivá javila až s odstupom." # todo: NEW TRANSLATION
 pilgrimage_expedition_events.16.a: "Ucti neporušeného kráľa v jeho svätyni." # todo: NEW TRANSLATION
 pilgrimage_expedition_events.16.b: "Olavovo ponaučenie: viera šírená mečom je stále viera." # todo: NEW TRANSLATION
 pilgrimage_expedition_events.16.c: "Chladné a sväté miesto. Vráťme sa domov." # todo: NEW TRANSLATION
 pilgrimage_expedition_events.16.d: "$pilgrimage_resupply_light$" # todo: NEW TRANSLATION
 pilgrimage_expedition_events.16.e: "$pilgrimage_resupply_heavy$" # todo: NEW TRANSLATION
 pilgrimage_expedition_events.16.historical_info: "Olav Haraldsson, kráľ Nórska, zahynul 29. júla 1030 v bitke pri Stiklestade, keď sa pokúšal získať späť trón a dokončiť christianizáciu svojho kráľovstva silou zbraní. Keď 3. augusta 1031, rok a päť dní po jeho smrti, otvorili jeho hrob, biskup Grimkell zistil, že telo zdanlivo nepodlieha rozkladu, a len na základe tohto nálezu vyhlásil Olava za svätého. Túto miestnu kanonizáciu neskôr v roku 1164 potvrdil pápež Alexander III. Nad jeho svätyňou postavili katedrálu v Nidarose, ktorá sa stala najvýznamnejším pútnickým miestom severu. Veriaci k nej prúdili zo Škandinávie i zo vzdialenejších krajín po sieti ciest, po ktorých sa dodnes chodí ako po Cestách svätého Olava." # todo: NEW TRANSLATION
 pilgrimage_expedition_events.18.title: "Horský priesmyk" # todo: NEW TRANSLATION
 pilgrimage_expedition_events.18.desc: "Cesta stúpa do pustej krajiny bičovanej vetrom a zužuje sa na chodník vedúci po úbočí hory. [target_ruler.GetName] sa zastaví na rázcestí: jedna cesta vedie okľukou a obchádza najhoršie stúpanie, druhá je priama, no miestni pastieri vravia, že nepripravení ju nie vždy prežijú.\n\n[target_ruler.GetSheHe|U] zvažuje horu a kalendár. Každý deň strávený hľadaním ľahšej cesty je dňom, o ktorý sa družina nepriblíži k cieľu." # todo: NEW TRANSLATION
 pilgrimage_expedition_events.18.a: "Najmi miestnych sprievodcov, ktorí poznajú každé bezpečné miesto na stúpanie." # todo: NEW TRANSLATION
 pilgrimage_expedition_events.18.b: "Pokračuj bez nich a dôveruj viere i pevnému kroku." # todo: NEW TRANSLATION
 pilgrimage_expedition_events.18.c: "Vráť sa a obíď pohorie dlhšou cestou." # todo: NEW TRANSLATION
 pilgrimage_expedition_events.18.d: "Pošli zaostávajúcich dolu z hory samých." # todo: NEW TRANSLATION
 pilgrimage_expedition_events.19.title: "Búrka na mori" # todo: NEW TRANSLATION
 pilgrimage_expedition_events.19.desc: "Obloha nad loďou bez varovania potemnie a do hodiny sa posádka musí brániť vlnám, ktoré sa prelievajú cez zábradlie. [target_ruler.GetName] narazí do sťažňa, kým sa zachytí, a paluba sa pod nohami [target_ruler.GetHimHer] zmieta, akoby bola živá.\n\nPútnici pod palubou sa držia všetkého, čo je pevne prichytené, a naraz sa modlia v tucte nárečí. Nezostáva im veľa možností, kým sa more nerozhodne, že si s nimi už skončilo." # todo: NEW TRANSLATION
 pilgrimage_expedition_events.19.a: "Prečkaj búrku pod palubou a dúfaj, že loď vydrží." # todo: NEW TRANSLATION
 pilgrimage_expedition_events.19.b: "Zhromaždi družinu na palube a modlite sa počas búrky." # todo: NEW TRANSLATION
 pilgrimage_expedition_events.19.c: "Odľahči loď tým, že časť družiny posadíš do člnov." # todo: NEW TRANSLATION
 pilgrimage_expedition_events.19.afloat_tt: "Posádke sa podarí udržať loď na hladine" # todo: NEW TRANSLATION
 pilgrimage_expedition_events.19.off_course_tt: "Búrka značne vychýli loď z kurzu" # todo: NEW TRANSLATION
 pilgrimage_expedition_events.19.faith_protects_tt: "Naša viera nás ochráni pred búrkou" # todo: NEW TRANSLATION
 pilgrimage_expedition_events.19.piety_lacking_tt: "Naša zbožnosť sa ukáže ako nedostatočná proti búrke" # todo: NEW TRANSLATION
 pilgrimage_expedition_events.20.title: "Prechod cez rieku" # todo: NEW TRANSLATION
 pilgrimage_expedition_events.20.desc: "Cesta sa náhle končí pri rieke, ktorá po nedávnych dažďoch tečie vysoko a kalno. Brod, ktorý tu mal byť, je pod hladinou prúdu dosť silného na to, aby zrazil koňa z nôh. Na opačnom brehu čaká prievozník. S prevozom sa neponáhľa, kým neuvidí poriadnu mincu.\n\n[target_ruler.GetName] si prezerá vodu a potom prievozníka. Ani jeden dnes nevyzerá zvlášť dôveryhodne." # todo: NEW TRANSLATION
 pilgrimage_expedition_events.20.a: "Zaplať prievozníkovi za bezpečný prechod." # todo: NEW TRANSLATION
 pilgrimage_expedition_events.20.b: "Prebroď sa priamo cez rieku a ušetri na mýte." # todo: NEW TRANSLATION
 pilgrimage_expedition_events.20.c: "Pošli časť družiny, aby si našla vlastný priechod." # todo: NEW TRANSLATION
 pilgrimage_expedition_events.21.title: "Horúčka v močiaroch" # todo: NEW TRANSLATION
 pilgrimage_expedition_events.21.desc: "Cesta sa na dlhé míle ponára do plytkej stojatej vody a vzduch hustne pachom hniloby a dotieravého hmyzu. V priebehu niekoľkých dní sa kašeľ medzi členmi družiny mení na horúčku a nejedného pútnika treba niesť, namiesto toho, aby kráčal.\n\n[target_ruler.GetName] sleduje, ako družina s každou míľou v tejto krajine redne a tichne, a premýšľa, koľkí sa prihlásili na púť namiesto toho, aby sa vydali na cestu za morom." # todo: NEW TRANSLATION
 pilgrimage_expedition_events.21.a: "Ponáhľaj sa vpred a nechaj močiare za sebou." # todo: NEW TRANSLATION
 pilgrimage_expedition_events.21.b: "Zastav a nechaj chorých zotaviť sa, než budete pokračovať." # todo: NEW TRANSLATION
 pilgrimage_expedition_events.22.title: "Zima uzavrie cestu" # todo: NEW TRANSLATION
 pilgrimage_expedition_events.22.desc: "Snehové záveje vyššie než človek uzavreli priesmyk pred vami a miestni obyvatelia hovoria priamo, že tadiaľto nik neprejde až do jari. [target_ruler.GetName] nepočítal so stratou celej sezóny pre nepriazeň počasia, no hora sa cestovných plánov nepýta.\n\nNeďaleko je mesto s dostatkom miesta pre družinu, ak [target_ruler.GetHerHis] mešec utiahne náklady na ubytovanie. Alebo sú tu sprievodcovia, ktorí za odmenu tvrdia, že poznajú cestu aj cez takúto zimu." # todo: NEW TRANSLATION
 pilgrimage_expedition_events.22.a: "Prečkaj zimu v neďalekom meste." # todo: NEW TRANSLATION
 pilgrimage_expedition_events.22.b: "Zaplať sprievodcom a vozom, aby vás previedli." # todo: NEW TRANSLATION
 pilgrimage_expedition_events.23.title: "Pohostinnosť pána" # todo: NEW TRANSLATION
 pilgrimage_expedition_events.23.desc: "Správa o blížiacej sa púti sa šíri rýchlejšie než samotná družina a keď [target_ruler.GetName] dorazí na ďalšiu križovatku, miestny pán mu osobne vyjde v ústrety a pozve ho, aby pred pokračovaním odpočinul pri jeho stole. Ponúkaná pohostinnosť je štedrá a očividne má byť videná a zapamätaná.\n\n[target_ruler.GetSheHe|U] rozpozná, o čo ide: prijatie s náležitou gracióznosťou prinesie zbožnosť aj prestíž." # todo: NEW TRANSLATION
 pilgrimage_expedition_events.23.a: "Vďačne prijmi pohostinnosť." # todo: NEW TRANSLATION
 pilgrimage_expedition_events.23.a.host_opinion_tt: "[host_lord.GetName] získa +20 [Concept('opinion','názor')|E] o nás" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 pilgrimage_expedition_events.23.b: "Odmietni zdržanie a radšej sa pomodli v súkromí." # todo: NEW TRANSLATION
 pilgrimage_expedition_events.24.title: "Mýto od nepriateľského pána" # todo: NEW TRANSLATION
 pilgrimage_expedition_events.24.desc: "Cesta vpred vedie krajinami pána, ktorý považuje [ROOT.GetCountry.GetName] za svojho nepriateľa. Jeho muži čakajú na hranici pri mýtnej bráne a žiadajú poplatok. [target_ruler.GetName] dúfal, že prejde bez povšimnutia. Pohľad na píkami zatarasenú cestu túto nádej rýchlo rozplynie.\n\nVýberca mýta vysloví sumu, ktorá je skôr urážkou než ponukou, a čaká, koľko si [target_ruler.GetHerHis] hrdosť cení." # todo: NEW TRANSLATION
 pilgrimage_expedition_events.24.a: "Zaplať požadované mýto." # todo: NEW TRANSLATION
 pilgrimage_expedition_events.24.b: "Prebojuj si cestu s družinou, ktorú máme." # todo: NEW TRANSLATION
 pilgrimage_expedition_events.24.c: "Odboč a nájdi si dlhšiu cestu, ktorá obíde jeho krajiny." # todo: NEW TRANSLATION
 pilgrimage_expedition_events.25.title: "Iná viera" # todo: NEW TRANSLATION
 pilgrimage_expedition_events.25.desc: "Cesta vedie popri svätyni posvätnej pre veriacich [current_location.GetDominantReligion.GetAdjective], ktorej ikony a obrady sú nám neznáme. [target_ruler.GetName] pozoruje miestnych veriacich pri modlitbách. Ich zvyky ho zaujímajú, no voči novým pocestným sú trochu obozretní.\n\nPútnici odjakživa radi diskutujú o viere s každým, kto je ochotný počúvať. [target_ruler.GetSheHe|U] zvažuje, či sa dnes tomu oddá." # todo: NEW TRANSLATION
 pilgrimage_expedition_events.25.a: "Prediskutuj s miestnymi prednosti pravej viery." # todo: NEW TRANSLATION
 pilgrimage_expedition_events.25.b: "Nedráždi spiaceho psa a potichu pokračuj ďalej." # todo: NEW TRANSLATION
 pilgrimage_expedition_events.26.title: "Lúpežníci na ceste" # todo: NEW TRANSLATION
 pilgrimage_expedition_events.26.desc: "Na istom úseku pohltí cestu divočina a nijaký pánov rozkaz tu nezaručuje bezpečnosť. Skôr než družina stihne zareagovať, spoza stromov sa vynoria ozbrojené, otrhané postavy, ktoré očividne dobre poznajú prepadávanie pocestných. [target_ruler.GetName] ich rýchlo spočíta. Je ich dosť na to, aby predstavovali hrozbu, no príliš málo na to, aby tvorili vojsko.\n\nIch vodca vykročí vpred a vysloví cenu za bezpečný prechod. Z jeho tónu je jasné, čo sa stane, ak ju odmietnete." # todo: NEW TRANSLATION
 pilgrimage_expedition_events.26.a: "Vyplať ich a maj to za sebou." # todo: NEW TRANSLATION
 pilgrimage_expedition_events.26.b: "Postav sa im a bojuj za česť púte." # todo: NEW TRANSLATION
 pilgrimage_expedition_events.26.c: "Kúp si bezpečný prechod tým, že lúpežníkom prenecháš časť družiny." # todo: NEW TRANSLATION
 pilgrimage_expedition_events.27.title: "K púti sa pridajú ďalší pútnici" # todo: NEW TRANSLATION
 pilgrimage_expedition_events.27.desc: "Správa o kráľovskej púti na cestách sa šíri dopredu a keď [target_ruler.GetName] dorazí na ďalšiu križovatku, čaká tam už zhromaždený otrhaný zástup obyčajných pútnikov. Dúfajú, že zvyšok cesty prejdú pod ochranou družiny vládcu.\n\nSú medzi nimi rodiny aj starci, ktorí idú pešo a sami by už ďaleko nedošli. [target_ruler.GetSheHe|U] nemôže živiť celú družinu donekonečna, no odmietnuť ich znamená nechať ich, aby si poradili sami." # todo: NEW TRANSLATION
 pilgrimage_expedition_events.27.a: "Privítaj ich v družine." # todo: NEW TRANSLATION
 pilgrimage_expedition_events.27.b: "Pošli ich preč, aby ste nestrácali tempo." # todo: NEW TRANSLATION
 pilgrimage_expedition_events.29.title: "Korzári pri pobreží" # todo: NEW TRANSLATION
 pilgrimage_expedition_events.29.desc: "Nízky, tmavý trup pretne obzor a veslá sa zalesknú na slnku. Loď sa približuje rýchlejšie, než by sa patrilo na poctivého obchodníka. [target_ruler.GetName] spozná siluetu korzárskej lode ešte skôr, než na ňu upozorní hliadka. V dosahu niet prístavu, pobrežia ani pomoci.\n\n[target_ruler.GetSheHe|U] zhromažďuje na palube bojovníkov, ktorých sa družine podarí dať dokopy, a zvažuje, či ich bude dosť, alebo či majú zásoby na lodi väčšiu cenu než boj." # todo: NEW TRANSLATION
 pilgrimage_expedition_events.29.a: "Zdvihni zbrane a odraz ich." # todo: NEW TRANSLATION
 pilgrimage_expedition_events.29.b: "Odovzdaj zásoby z lode a dúfaj, že im to bude stačiť." # todo: NEW TRANSLATION
 pilgrimage_expedition_events.29.c: "Vykúp bezpečie lode časťou našej družiny." # todo: NEW TRANSLATION
 pilgrimage_expedition_events.30.title: "Zajatí za výkupné" # todo: NEW TRANSLATION
 pilgrimage_expedition_events.30.desc: "Cesta preriedila družinu a [target_ruler.GetName] sa stal ľahkým cieľom. Niekto si to všimol. Ozbrojenci obkľúčia družinu skôr, než sa stihne zorganizovať poriadna stráž. Ich vodca pokojne oznámi cenu za vládcovu slobodu, ako keby obchodník hovoril o cene chleba.\n\n[target_ruler.GetSheHe|U] má len málo mužov, na ktorých sa môže obrátiť, a ešte menej dobrých možností." # todo: NEW TRANSLATION
 pilgrimage_expedition_events.30.a: "Zaplať požadované výkupné." # todo: NEW TRANSLATION
 pilgrimage_expedition_events.30.b: "Pokús sa uniknúť pod rúškom noci." # todo: NEW TRANSLATION
 pilgrimage_expedition_events.28.title: "Prázdne zásobárne" # todo: NEW TRANSLATION
 pilgrimage_expedition_events.28.desc: "Zásoby družiny sa minuli kdesi za posledným mestom, ktoré si zaslúži toto meno, a žalúdky sprievodu sú rovnako prázdne ako vrecia, v ktorých kedysi nosili chlieb. [target_ruler.GetName] nikdy predtým neviedol vojsko a je to poznať: hladu nezáleží na tom, aká svätá je cesta pred nami.\n\nKrajina je našťastie ochotná niečo ponúknuť: polia, sady a dedinský trh na dosah, ak je [target_ruler.GetHerHis] družina ochotná obetovať čas, mince alebo hrdosť, aby to využila." # todo: NEW TRANSLATION
 pilgrimage_expedition_events.28.a: "Pošli družinu po jedlo do okolitej krajiny." # todo: NEW TRANSLATION
 pilgrimage_expedition_events.28.b: "Kúp všetko jedlo, ktoré sa dá nájsť, za akúkoľvek cenu." # todo: NEW TRANSLATION
 pilgrimage_expedition_events.28.c: "Nedá sa nič robiť. Vrátime sa." # todo: NEW TRANSLATION
 pilgrimage_resupply_light: "Zaplať miestnym za čerstvé kone, jedlo a najatých pomocníkov." # todo: NEW TRANSLATION
 pilgrimage_resupply_heavy: "Nešetri na nákladoch a doplň zásoby aj posilni družinu." # todo: NEW TRANSLATION

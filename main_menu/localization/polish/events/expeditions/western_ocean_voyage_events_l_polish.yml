 western_ocean_voyage_events.1.title: "Plavíme sa na západ" # todo: NEW TRANSLATION
 western_ocean_voyage_events.1.desc: "Lode sa v prístave ponárajú nízko, zásobené na plavbu, na ktorú nás nepripravil nijaký námorný plán. [target_leader.GetName] celé mesiace na [ROOT.GetCountry.GetGovernment.GetCourtTitle] obhajuje [target_leader.GetHisHer] názor, že oceán na západe je užší, než tvrdia učenci, a že Indie sú na dosah odhodlanej flotile.\n\nUčení muži tomu stále neveria. Námorníci sú znepokojení. Vietor je však priaznivý, príliv sa obracia a nezostáva nič iné, len odviazať laná." # todo: NEW TRANSLATION
 western_ocean_voyage_events.1.a: "Vyzbrojme štvrtú loď na cestu do neznáma." # todo: NEW TRANSLATION
 western_ocean_voyage_events.1.b: "Plávajme ďalej, nech už oceán ukrýva čokoľvek. Nájdeme to prví." # todo: NEW TRANSLATION
 western_ocean_voyage_events.1.c: "Nech sú našou mapou vetry." # todo: NEW TRANSLATION
 western_ocean_voyage_events.1.columbus: "Je to tritisíc míľ. Ani o míľu viac." # todo: NEW TRANSLATION
 western_ocean_voyage_events.1.historical_info: "O možnosti dosiahnuť Áziu plavbou na západ diskutovali európski učenci celé desaťročia predtým, než sa o takú plavbu niekto pokúsil. Hlavnou prekážkou nebol tvar Zeme, o ktorej vzdelaní ľudia vedeli, že je guľatá, ale jej veľkosť. Väčšina učencov správne odhadovala, že oceán je na preplávanie priveľký. Výpravy, ktoré dokázali opak, tak neurobili vyvrátením tohto odhadu, ale tým, že im do cesty vstúpilo niečo nečakané." # todo: NEW TRANSLATION
 western_ocean_voyage_events.2.title: "Na okraji zmapovaného sveta" # todo: NEW TRANSLATION
 western_ocean_voyage_events.2.desc: "Šťastné ostrovy, ako ich nazývali starovekí, ležia na samom okraji každej mapy, ktorú máme v [ShowLocationName('northern_fuerteventura_coast')]. Za nimi nemá oceán nijaké mená, nie sú zaznamenané jeho hĺbky ani zakreslené pobrežia. Miestni rybári hovoria, že občas pred búrkou vidia vtáky prilietajúce zo západu, čo [target_leader.GetName] považuje za znamenie, že za obzorom leží pevnina. Posádka v tom vidí znamenie búrok.\n\nDopĺňame čerstvú vodu, solené mäso a sucháre. Pri západe slnka muži sledujú, ako more zlatistie a potom tmavne." # todo: NEW TRANSLATION
 western_ocean_voyage_events.2.a: "Nakúpme čerstvé zásoby a vyplávajme do týždňa." # todo: NEW TRANSLATION
 western_ocean_voyage_events.2.b: "Použime zásoby z našej ostrovnej posádky." # todo: NEW TRANSLATION
 western_ocean_voyage_events.2.c: "Pošlime na breh člny po vodu a kozy." # todo: NEW TRANSLATION
 western_ocean_voyage_events.2.c.calm_tt: "Výsadok sa vráti bez problémov" # todo: NEW TRANSLATION
 western_ocean_voyage_events.2.c.clash_tt: "Výsadok sa dostane do konfliktu s ostrovanmi" # todo: NEW TRANSLATION
 western_ocean_voyage_events.2.d: "Kúpme karavelu od ostrovných staviteľov lodí." # todo: NEW TRANSLATION
 western_ocean_voyage_events.2.e: "Doplňme vodu na lodiach a pokračujme s tým, čo máme." # todo: NEW TRANSLATION
 western_ocean_voyage_events.2.f: "Muži nie sú pripravení. Vraciame sa." # todo: NEW TRANSLATION
 western_ocean_voyage_events.2.historical_info: "Kanárske ostrovy slúžili ako bežný východiskový bod atlantických plavieb do neznáma, keďže ležali na okraji zmapovaných vôd Atlantiku a odtiaľ spoľahlivé pasáty fúkali na juhozápad smerom ku Karibiku. Ich strategický význam bol natoľko zrejmý, že o nadvládu nad ostrovmi súperili Portugalsko a Kastília počas veľkej časti pätnásteho storočia." # todo: NEW TRANSLATION
 western_ocean_voyage_events.3.title: "Zašli sme dosť ďaleko" # todo: NEW TRANSLATION
 western_ocean_voyage_events.3.desc: "Chlieb začína plesnivieť. Zo sudov s vodou sa šíri zápach. Traja muži dostali horúčku. Dnes ráno prichádza k [target_leader.GetName] delegácia s jednoduchým odkazom: plavili sa na západ už dosť dlho, videli iba otvorené more a hodlajú sa znovu plaviť na východ, či s tým [target_leader.GetNameWithNoTooltip] súhlasí, alebo nie.\n\nNa žiadnej strane nie je pevnina. Všade je len prázdnota a vietor za chrbtom, ktorý ich sem dovial, no ďalej naspäť ich neodveje." # todo: NEW TRANSLATION
 western_ocean_voyage_events.3.a: "Sľúbme im ešte tri dni a podiel na všetkom, čo nájdeme." # todo: NEW TRANSLATION
 western_ocean_voyage_events.3.b: "Muži majú pravdu. Vraciame sa." # todo: NEW TRANSLATION
 western_ocean_voyage_events.3.columbus: "Ukáž posádke sfalšovaný lodný denník." # todo: NEW TRANSLATION
 western_ocean_voyage_events.3.columbus.tt: "[target_leader.GetNameWithNoTooltip] upokojí posádku sfalšovaným lodným denníkom, takže morálka posádok neklesne" # todo: NEW TRANSLATION
 western_ocean_voyage_events.3.historical_info: "Záznamy z plavby v roku 1492 opisujú skutočnú morálnu krízu, ktorá nastala približne mesiac po vyplávaní cez Atlantik. Posádka sa vyhrážala vzburou a žiadala Kolumba, aby zamieril domov. To, ako sa kríza vyriešila — či sľubom, že pevninu uvidia do troch dní, pozorovaním plávajúcej vegetácie alebo jednoducho Kolumbovou silou osobnosti — je dodnes predmetom sporov. Pevninu zazreli nasledujúce ráno." # todo: NEW TRANSLATION
 western_ocean_voyage_events.4.title: "Zem!" # todo: NEW TRANSLATION
 western_ocean_voyage_events.4.desc: "Krátko pred úsvitom sa z vranieho hniezda ozve výkrik. Potom ďalší, hlasnejší. Vzápätí kričí každý muž na palube.\n\nNa obzore sa črtá tvar. Najprv nízky, sotva viac než stmavnutie oblohy, no ako sa rozvidnieva, stáva sa neprehliadnuteľným: stromy, pobrežie, zelené kopce týčiace sa nad pokojnou vodou. More okolo lodí mení farbu z tmavomodrej na zelenú a potom na bledotyrkysovú. Nad hlavami krúžia zvláštne vtáky. Popri trupe plávajú konáre s neznámymi listami.\n\n[target_leader.GetName] stojí na prove a dlho nepovie ani slovo.\n\nKeď člny dorazia k brehu, ostrovania sa už zhromaždili, aby ich pozorovali. Niektorí majú v nose viditeľne zastrčené malé zlaté ozdoby. Keď sa ich gestami, viac než slovami, pýtajú, odkiaľ zlato pochádza, ukazujú do vnútrozemia a niektorí aj na juh, k vrchom, ktoré posádka odtiaľto nevidí." # todo: NEW TRANSLATION
 western_ocean_voyage_events.4.a: "Vztýčme zástavu. Nech je toto miesto čokoľvek, patrí nám." # todo: NEW TRANSLATION
 western_ocean_voyage_events.4.b: "To nezodpovedá nijakému opisu Indie. Zatiaľ si nič nenárokujme." # todo: NEW TRANSLATION
 western_ocean_voyage_events.4.columbus: "Vztýčte zástavu. Toto sú Indie!" # todo: NEW TRANSLATION
 western_ocean_voyage_events.4.historical_info: "Prvý kontakt medzi Európanmi a obyvateľmi Ameriky sa odohral v Karibiku v roku 1492. Tainovia z Bahám, ktorí svoj ostrov nazývali #italic Guanahani#!, privítali prichádzajúce lode z brehu. V priebehu jednej generácie zabila väčšinu obyvateľov karibských ostrovov epidemická choroba, s ktorou Tainovia predtým neprišli do styku. Dlhodobé dôsledky tejto plavby zmenili ekológiu, hospodárstvo a obyvateľstvo všetkých kontinentov na Zemi." # todo: NEW TRANSLATION
 western_ocean_voyage_events.5.title: "Ostrov siedmich miest" # todo: NEW TRANSLATION
 western_ocean_voyage_events.5.desc: "Niekde za polovicou plavby, keď je vietor stály a lode dobre postupujú, predkladajú kormidelníci [target_leader.GetName] starú mapu. Nakreslili ju muži, ktorí sa po tomto oceáne nikdy neplavili, a zobrazuje na nej ďaleko na západ od [ShowAreaName('azores_area')] veľký ostrov: Antilliu, opevnenú a posiatu siedmimi mestami. Údajne ju založili biskupi, ktorí utiekli z [ShowRegionName('iberia_region')], keď ho obsadili umajjovské vojská.\n\nNikto na palube tento ostrov nevidel a nikto ani nečaká, že ho uvidí. Mapa je však stará, jej tvorcovia neboli hlupáci a tu, kde na obzore nie je nič, má stará povesť väčšiu cenu než v prístave." # todo: NEW TRANSLATION
 western_ocean_voyage_events.5.a: "Nastavme podľa nej kurz, keby mali staré mapy pravdu." # todo: NEW TRANSLATION
 western_ocean_voyage_events.5.b: "Mapy námorníkov sú plné ostrovov, ktoré nikdy neexistovali." # todo: NEW TRANSLATION
 western_ocean_voyage_events.5.historical_info: "Antillia, Ostrov siedmich miest, sa objavovala na portugalských a janovských mapách už od roku 1424. Zobrazovali na nich veľký ostrov západne od Azorov. Podľa legendy utieklo v roku 714 počas umajjovského dobytia zo severnej Afriky sedem vizigótskych biskupov a založili na ostrove v západnom oceáne sedem miest. Legenda prežila aj vek objavovania, ktorý ju mal údajne vyvrátiť: keď sa Francisco Vázquez de Coronado o desaťročia neskôr vydal hľadať sedem zlatých miest na juhozápade Ameriky, pomenoval svoj cieľ podľa tejto staršej, čisto európskej povesti." # todo: NEW TRANSLATION
 western_ocean_voyage_events.6.title: "Odkiaľ pochádza zlato" # todo: NEW TRANSLATION
 western_ocean_voyage_events.6.desc: "Tlmočníci sa nezhodnú na jedinom slove. Jeden trvá na tom, že ostrovania pomenúvajú miesto. Ďalší tvrdí, že pomenúvajú ľud. Tretí hovorí, že gesto smerom na juh a gesto do vnútrozemia sú dve odlišné odpovede na dve odlišné otázky, ktoré nikto nedokáže správne preložiť.\n\nIstý je len smer: do vnútrozemia a odtiaľ ďalej na juh, k horám a riekam, ktoré nikto z posádky nevidel. [target_leader.GetName] napriek tomu nechá pilotov zaznačiť to do mapy — napoly ako povesť a napoly ako odhad, pre prípad, že by niekto niekedy potreboval vedieť, kde hľadať." # todo: NEW TRANSLATION
 western_ocean_voyage_events.6.a: "Zapíšme to tak, ako to je, aj s rozpormi." # todo: NEW TRANSLATION
 western_ocean_voyage_events.6.b: "Zaznamenajme len to, na čom sa všetci zhodujú: vnútrozemie a zlato." # todo: NEW TRANSLATION
 western_ocean_voyage_events.6.historical_info: "Prvé opisy stretnutí v Karibiku hovoria, že Tainovia nosili malé zlaté ozdoby, opracované zo zlata, ktoré sa v takom množstve, aké by si novoprišelci všimli, na miestach nenachádzalo. Keď sa gestami pýtali, odkiaľ pochádza, ostrovania opakovane ukazovali do vnútrozemia a podľa niektorých záznamov aj na krajiny ležiace ďalej na juh a západ. Práve tieto sprostredkované a nesprávne preložené pokyny, viac než akýkoľvek potvrdený nález, ovplyvnili, kam sa nasledujúce generácie objaviteľov vydali hľadať zlato v Amerike." # todo: NEW TRANSLATION
 western_ocean_voyage_events.7.title: "Čítame správy na [ROOT.GetCountry.GetGovernment.GetCourtTitle]" # todo: NEW TRANSLATION
 western_ocean_voyage_events.7.desc: "Lode napokon vplávajú do prístavu, pokryté soľou a ošľahané, a už o niekoľko dní čítame správu [target_leader.GetName] nahlas na [ROOT.GetCountry.GetGovernment.GetCourtTitle]. Ostrovy, plavba, zvláštne vtáky a ešte zvláštnejšie ovocie, zlato, ktoré nosili ľudia, čo o nás nikdy nepočuli až do chvíle, keď sme dorazili.\n\nNiektorí pochybujú o väčšine toho, čo sa hovorí, no napriek tomu všetko zapisujeme. Na západných okrajoch máp, kde predtým nič nebolo zakreslené, sa začínajú objavovať nové prvky." # todo: NEW TRANSLATION
 western_ocean_voyage_events.7.desc.later: "Lode napokon vplávajú do prístavu, pokryté soľou a ošľahané, a už o niekoľko dní čítame správu [target_leader.GetName] nahlas na [ROOT.GetCountry.GetGovernment.GetCourtTitle]. K týmto ostrovom sa pred nami dostali námorníci inej koruny a ich správy už dávno kolujú na všetkých dvoroch.\n\nNaša flotila však preplávala ten istý oceán a vrátila sa domov, čo nie je maličkosť. Naši piloti už poznajú západné vetry z vlastnej skúsenosti a nijaká cudzia mapa ich to nenaučí." # todo: NEW TRANSLATION
 western_ocean_voyage_events.7.a: "Nech správa zostane tak, ako bola zapísaná." # todo: NEW TRANSLATION
 western_ocean_voyage_events.7.historical_info: "Písomné a ústne správy z vracajúcich sa výprav čítali na kráľovských dvoroch po celej západnej Európe už niekoľko mesiacov po každom vylodení a ich preklady sa následne široko šírili. Tieto správy, skreslené prekladom aj ambíciami rozprávačov, opisovali bohatstvo vnútrozemia, ktoré dosiaľ nijaký Európan nevidel na vlastné oči. Práve tieto sprostredkované svedectvá, viac než akýkoľvek potvrdený objav, posielali ďalšie generácie objaviteľov hlbšie do vnútrozemia a ďalej na juh, aby našli zdroje toho, čo prví novoprišelci iba zahliadli." # todo: NEW TRANSLATION
 western_ocean_voyage_events.8.title: "Vzbura na otvorenom mori" # todo: NEW TRANSLATION
 western_ocean_voyage_events.8.desc: "Začína sa to šomraním pri striedaní hliadky a končí vytasenými nožmi na hlavnej palube. Posádka jednej z našich lodí zavrela svojich dôstojníkov pod palubu a posiela cez vodu odkaz: za úsvitu zamieria domov a nalodia sa na každú loď, ktorá sa ich pokúsi zastaviť.\n\n[target_leader.GetName] stojí pri zábradlí a zvažuje vzdialenosť medzi oboma trupmi. Za [target_leader.GetHerHim] sledujú verné posádky, čo [target_leader.GetSheHe] urobí." # todo: NEW TRANSLATION
 western_ocean_voyage_events.8.a: "Nech vzbúrenci odplávajú domov na svojej lodi." # todo: NEW TRANSLATION
 western_ocean_voyage_events.8.b: "Prepadnime ich. Na mori sa nevyjednáva." # todo: NEW TRANSLATION
 western_ocean_voyage_events.8.fight_win_tt: "Dôstojníci zvíťazia a obnovia poriadok" # todo: NEW TRANSLATION
 western_ocean_voyage_events.8.fight_lose_tt: "Boj je krvavý a flotila zaň zaplatí" # todo: NEW TRANSLATION
 western_ocean_voyage_events.8.c: "Porozprávajme im o Indii a zlate, ktoré tam čaká." # todo: NEW TRANSLATION
 western_ocean_voyage_events.8.rouse_tt: "Slová [target_leader.GetNameWithNoTooltip] znovu rozdúchajú odhodlanie posádky" # todo: NEW TRANSLATION
 western_ocean_voyage_events.9.title: "Horúčka pod palubou" # todo: NEW TRANSLATION
 western_ocean_voyage_events.9.desc: "Voda v sudoch zozelenela a solené mäso sa hemží červami. Najprv ochorie niekoľko mužov a uložia sa do hojdacích sietí, potom ich je tucet a napokon ich je toľko, že dôstojníci sotva dokážu obsadiť hliadky. Chirurg ich púšťal krvou a podával im preháňadlá, no viac už urobiť nemôže.\n\nZdraví sa pozrú na chorých a potom na prázdny obzor. Nahlas však nepovedia, na čo všetci myslia." # todo: NEW TRANSLATION
 western_ocean_voyage_events.9.a: "Zmenšime plachty a starajme sa o chorých, kým horúčka neustúpi." # todo: NEW TRANSLATION
 western_ocean_voyage_events.9.b: "Nemôžeme strácať dni. Pochovajme mŕtvych a plávajme ďalej." # todo: NEW TRANSLATION
 western_ocean_voyage_events.9.historical_info: "Dlhé zaoceánske plavby v pätnástom storočí obmedzovali menej navigačné schopnosti než zásoby, ktoré loď dokázala prevážať. Voda uložená v drevených sudoch sa po niekoľkých týždňoch skazila, solené potraviny sa v horúčave znehodnotili a posádky natlačené v malých trupoch si medzi sebou šírili horúčky a úplavicu. Kapitáni plaviaci sa na otvorený Atlantik dopĺňali zásoby v poslednom prístave, kde mohli, často na Kanárskych či Kapverdských ostrovoch, pretože po ich opustení už nebolo kde načerpať ďalšie." # todo: NEW TRANSLATION
 western_ocean_voyage_events.10.title: "Návrat skôr, než dosiahneme okraj" # todo: NEW TRANSLATION
 western_ocean_voyage_events.10.desc: "Flotila sa vracia do prístavu oveľa skôr, než ktokoľvek očakával, jej nákladné priestory sú stále napoly plné a posádky zostali pohromade. Nenašli pevninu, iba otvorené vody a vietor, ktorý im nedovolil zabudnúť, ako ďaleko sú od domova.\n\nNa dvore sa o plavbe hovorí potichu, ak sa o nej vôbec hovorí. Piloti si však viedli lodné denníky a naše mapy západných vôd teraz siahajú o čosi ďalej než predtým." # todo: NEW TRANSLATION
 western_ocean_voyage_events.10.a: "Oceán tu bude aj nabudúce." # todo: NEW TRANSLATION
 western_ocean_voyage_events.11.title: "Už o nich nikto nepočul" # todo: NEW TRANSLATION
 western_ocean_voyage_events.11.desc: "Od flotily, ktorá sa plavila na západ, celé mesiace neprichádzajú nijaké správy. Potom uplynie rok. Obchodníci, ktorí do výpravy investovali, odpíšu svoje podiely a rodiny námorníkov prestanú čakať pri prístavnom múre.\n\nČi sa lode potopili v búrke, došla im na otvorenom oceáne voda, alebo jednoducho plávali ďalej, až kým sa všetko neskončilo, sa už nikto nikdy nedozvie. Zostala nám iba posledná správa, ktorú flotila poslala domov predtým, než sa vydala za hranice zmapovaného sveta." # todo: NEW TRANSLATION
 western_ocean_voyage_events.11.a: "More si ich vzalo. Modlime sa za ich duše." # todo: NEW TRANSLATION
 western_ocean_voyage_events.11.historical_info: "Plavby do neznáma cez Atlantik sa často končili bez stopy. Janovskí bratia Ugolino a Vadino Vivaldiovci sa v roku 1291 vydali na západ cez Gibraltársky prieliv v snahe nájsť námornú cestu do Indie a už o nich nikto nepočul. O dve storočia neskôr zmizli pri samostatných plavbách do severozápadného Atlantiku v rokoch 1501 a 1502 portugalskí bratia Gaspar a Miguel Corte-Realovci." # todo: NEW TRANSLATION
 western_ocean_voyage_events.13.title: "More plávajúcich rias" # todo: NEW TRANSLATION
 western_ocean_voyage_events.13.desc: "Už niekoľko dní sa lode plavia cez plávajúce žltozelené lúky z morských rias, ktoré miestami pôsobia tak husto, akoby zadržiavali trupy. Starí námorníci prisahajú, že to znamená plytčiny pred nami a že flotila nabehne na plytčinu pri nejakom ponorenom pobreží skôr, než ho ktokoľvek zbadá.\n\n[target_leader.GetName] prikazuje pripraviť olovnicu. Muži sledujú vodu a čakajú, čo im prezradí." # todo: NEW TRANSLATION
 western_ocean_voyage_events.13.a: "Zastavme a zmerajme hĺbku." # todo: NEW TRANSLATION
 western_ocean_voyage_events.13.b: "Riasy nie sú útesy. Držme kurz a plávajme ďalej." # todo: NEW TRANSLATION
 western_ocean_voyage_events.13.c: "Náš kormidelník považuje riasy za znak prúdu, nie plytčiny." # todo: NEW TRANSLATION
 western_ocean_voyage_events.13.historical_info: "Sargasové more, oblasť severného Atlantiku pokrytá plávajúcimi vrstvami hnedých rias, leží na trase z Kanárskych ostrovov do Karibiku. Kolumbova flotila doň vplávala v septembri 1492. Jej posádky sa obávali, že riasy označujú skryté plytčiny alebo že lode uväznia, no meranie olovnicou neodhalilo dno a flotila preplávala bez ujmy." # todo: NEW TRANSLATION
 western_ocean_voyage_events.14.title: "Znaky blížiacej sa pevniny" # todo: NEW TRANSLATION
 western_ocean_voyage_events.14.desc: "Pozorovateľ zbadá okolo provy plávať vyrezávanú palicu a potom zelenú vetvu s listami a bobuľami. Za súmraku prelietavajú nad hlavami kŕdle vtákov, všetky rovnakým smerom, na juhozápad.\n\nZatiaľ to nikto nepovie nahlas. Muži, ktorí pred niekoľkými dňami hrozili návratom, sa však teraz pri každej výmene hliadky tlačia k zábradliu a hľadia na obzor." # todo: NEW TRANSLATION
 western_ocean_voyage_events.14.a: "Nasledujme vtáky. Pevnina nemôže byť ďaleko." # todo: NEW TRANSLATION
 western_ocean_voyage_events.14.b: "Zapíšme to do lodného denníka a držme kurz." # todo: NEW TRANSLATION
 western_ocean_voyage_events.14.historical_info: "V dňoch pred vylodením v októbri 1492 Kolumbov lodný denník zaznamenáva vyrezávanú palicu, konár s bobuľami, trstinu a veľké kŕdle vtákov letiace na juhozápad. Sedemnásteho októbra zmenil kurz, aby ich nasledoval, a o päť dní neskôr flotila dorazila na Bahamy." # todo: NEW TRANSLATION
 western_ocean_voyage_events.15.c: "Náš kormidelník pozná tieto oblohy. Zamierte do pokojných vôd." # todo: NEW TRANSLATION
 western_ocean_voyage_events.16.c: "Náš kormidelník vie, kde sa vietor vracia. Choďte ho nájsť." # todo: NEW TRANSLATION

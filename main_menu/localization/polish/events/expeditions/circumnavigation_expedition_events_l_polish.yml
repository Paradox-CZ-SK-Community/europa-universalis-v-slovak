l_polish:
 circumnavigation_expedition_events.1.title: "Veľký zámer" # todo: NEW TRANSLATION
 circumnavigation_expedition_events.1.desc: "Päť lodí. Dvestosedemdesiat mužov. Zásoby na rok a trasa, ktorou sa dosiaľ nevydal žiaden kormidelník. [target_leader.GetName] pokojne hovorí o ostrovoch, kde sa to len tak hemží klinčekmi, a o západnej ceste na Ostrovy korenia. Prístavný majster [target_leader.GetHimHer] neverí. Kormidelníci si nie sú istí. No lode sú zásobené, vietor je priaznivý a poverovacia listina nesie kráľovskú pečať.\n\nPred nami je všetko, čo sa dosiaľ neobjavilo na žiadnej mape." # todo: NEW TRANSLATION
 circumnavigation_expedition_events.1.magellan: "Nastavte kurz na Kanárske ostrovy. Ak Boh dá, nájdeme Západné more." # todo: NEW TRANSLATION
 circumnavigation_expedition_events.1.a: "Plavme sa ku Kanárskym ostrovom. Čo leží za nimi, to objavíme." # todo: NEW TRANSLATION
 circumnavigation_expedition_events.1.historical_info: "V septembri 1519 vyplával Ferdinand Magellan zo Sanlúcar de Barrameda na základe zmluvy so španielskou korunou, aby našiel západnú cestu na Ostrovy korenia. Výpravu tvorilo päť lodí: #italic Trinidad#!, #italic San Antonio#!, #italic Concepción#!, #italic Victoria#! a #italic Santiago#!. Magellan bol portugalský moreplavec, ktorý pred prechodom do služieb španielskej koruny a po tom, čo kráľ Manuel I. odmietol zvýšiť jeho plat, plával do Indie a na Moluky v portugalských službách. Táto plavba sa stala prvým oboplávaním Zeme, hoci Magellan sa jej zavŕšenia nedožil." # todo: NEW TRANSLATION
 circumnavigation_expedition_events.2.title: "Posledné známe pobrežie" # todo: NEW TRANSLATION
 circumnavigation_expedition_events.2.desc: "[current_location.GetName] sa vynára z mora v plochých hnedých terasách — skalné pevnosti pod oblohou, ktorá je stále rovnaká ako nad [departure_port.GetName]. Kormidelníci naposledy merajú hĺbku. Muži pijú čerstvú vodu zo železných sudov a opravujú výstroj rozstrapkanú atlantickým príbojom. Za posledným výbežkom sa mapy končia.\n\nNiektorí muži sa modlia. Pár z nich píše listy, ktoré nemajú ako odoslať. [target_leader.GetName] kráča po palube, akoby meral niečo, čo sa zmerať nedá. To, čo naložíme teraz, musí vydržať cez oceán aj ďalej." # todo: NEW TRANSLATION
 circumnavigation_expedition_events.2.a: "Doplňte plné zásoby. Možno tadiaľto už nepôjdeme." # todo: NEW TRANSLATION
 circumnavigation_expedition_events.2.b: "Odplávajme hneď, kým mužom ešte nechýba odvaha." # todo: NEW TRANSLATION
 circumnavigation_expedition_events.2.c: "Trasa je príliš neistá. Vráťme sa do prístavu." # todo: NEW TRANSLATION
 circumnavigation_expedition_events.2.historical_info: "Kanárske ostrovy — v tom čase pod kastílskou nadvládou — slúžili počas éry objavovania ako bežná zastávka na doplnenie zásob pre iberské výpravy cez Atlantik. Magellanova flotila sa zastavila na Tenerife, aby doplnila čerstvé zásoby pred dlhou plavbou cez Atlantik k pobrežiu Južnej Ameriky. Kastília kolonizovala ostrovy začiatkom 15. storočia a slúžili ako zásobovacia základňa aj ako východiskový bod plavieb do neznámych vôd. To, ako dôkladne tu flotila doplnila zásoby, mohlo rozhodnúť, či jej posádky prežijú nadchádzajúce prázdne míle." # todo: NEW TRANSLATION
 circumnavigation_expedition_events.3.title: "Okraj Nového sveta" # todo: NEW TRANSLATION
 circumnavigation_expedition_events.3.desc: "Po týždňoch plavby otvoreným [ShowContinentName('atlantic_ocean_continent')] sa na západnom obzore črtá nízka zelená línia — pobrežie Nového sveta. V lese škriekajú papagáje a zo stoviek riek tečie sladká voda. Od brehu sa odrážajú kanoe s zvedavými a nebojácnymi veslármi, ktorí ponúkajú drevo, vodu a zvláštne ovocie. Unavená flotila by tu našla všetko, čo potrebuje — no ročné obdobie sa mení a južný priechod sa stále nepodarilo nájsť.\n\n[target_leader.GetName] zvažuje pohodlie pobrežia oproti míľam, ktoré ešte treba preplávať." # todo: NEW TRANSLATION
 circumnavigation_expedition_events.3.a: "Vysadnite na breh po drevo, vodu a ovocie; obchodujte s miestnymi." # todo: NEW TRANSLATION
 circumnavigation_expedition_events.3.b: "Pobrežie počká. Plavme sa na juh, kým nám praje ročné obdobie." # todo: NEW TRANSLATION
 circumnavigation_expedition_events.3.historical_info: "Magellanova flotila dorazila k brazílskemu pobrežiu koncom roka 1519. Vylodila sa neďaleko Cabo de Santo Agostinho a potom pokračovala na juh. Brazília pripadla podľa Tordesillaského dohovoru do portugalskej sféry vplyvu, takže flotila v španielskych službách sa na tomto pobreží nemohla zdržiavať otvorene. Pobrežní Tupíovia však ochotne obchodovali a hojnosť krajiny bola vítanou úľavou po preplávaní Atlantiku." # todo: NEW TRANSLATION
 circumnavigation_expedition_events.4.title: "Veľká zátoka" # todo: NEW TRANSLATION
 circumnavigation_expedition_events.4.desc: "Flotila vpláva do zátoky takej rozľahlej a chránenej, že sa zdá byť darom — lemujú ju zelené hory a jej vody sa striebristo lesknú od rýb. Ľudia z pobrežia prichádzajú v húfoch a vymieňajú hydinu, ovocie a ryby za rybárske háčiky a nože; ponúkajú viac, než sa zmestí do nákladných priestorov. Po dlhej plavbe cez Atlantik je to raj a muži by odtiaľ najradšej nikdy neodišli.\n\nRaj však plavbe príliš neprospieva. [target_leader.GetName] musí rozhodnúť, ako dlho sa tu flotila môže zdržať." # todo: NEW TRANSLATION
 circumnavigation_expedition_events.4.a: "Doprajme posádkam odpočinok a naplno doplňme zásoby; hojnosť sa už nemusí zopakovať." # todo: NEW TRANSLATION
 circumnavigation_expedition_events.4.b: "Vymeňme za zásoby, koľko sa dá, a do týždňa odplávajme." # todo: NEW TRANSLATION
 circumnavigation_expedition_events.4.c: "Neprišli sme sem hodovať. Odplávajme bez obchodovania." # todo: NEW TRANSLATION
 circumnavigation_expedition_events.4.historical_info: "Veľká zátoka, v ktorej neskôr vyrástlo Rio de Janeiro, poskytla Magellanovej flotile najbohatšie doplnenie zásob počas celej plavby. Jej chránené vody sa hemžili rybami a pobrežní Tupíovia vymenili ohromné množstvo zásob za drobnosti a železné nástroje. Dôkladné doplnenie zásob tu posilnilo posádky pred plavbou do chladných šírok a hľadaním prielivu; flotila, ktorá sa ponáhľala ďalej, za svoju náhlivosť na juhu zaplatila." # todo: NEW TRANSLATION
 circumnavigation_expedition_events.5.title: "Strieborné ústie" # todo: NEW TRANSLATION
 circumnavigation_expedition_events.5.desc: "Kormidelníci vedeli, že musí existovať priechod. Žiadna pevnina nemôže pokračovať donekonečna. Ústie je však také široké, že zťažňa nevidno na jeho druhý breh, a voda, hoci je brakická, nesie ešte štyridsať líg do mora hnedé nánosy. Na dva týždne vysielajú člny proti prúdu rieky.\n\nVrátia sa so správami o sumcoch, plytčine a o tom, že tadiaľto do iného oceánu cesta nevedie. Niekde južnejšie čaká skutočný priechod — ak vôbec existuje." # todo: NEW TRANSLATION
 circumnavigation_expedition_events.5.a: "Dôkladne preskúmajme ústie; možno sa oplatí ho poznať." # todo: NEW TRANSLATION
 circumnavigation_expedition_events.5.b: "Nemáme čas na rieky, ktoré nikam nevedú. Plavme sa na juh." # todo: NEW TRANSLATION
 circumnavigation_expedition_events.5.press_tt: "Flotila bez otáľania pokračuje na juh a hľadá priechod, ktorý musí ležať niekde nižšie" # todo: NEW TRANSLATION
 circumnavigation_expedition_events.5.c: "Tieto šírky sú neznesiteľné. Vráťme sa domov." # todo: NEW TRANSLATION
 circumnavigation_expedition_events.5.historical_info: "Río de la Plata — „Striebornú rieku“ — preskúmal v roku 1516 španielsky moreplavec Juan Díaz de Solís, ktorého krátko po vylodení zabili domorodí obyvatelia. Magellanova výprava preskúmala ústie v januári 1520, pretože sa mylne domnievala, že by mohlo ísť o západný priechod. Tento omyl ich stál niekoľko týždňov, no priniesol prvý podrobný španielsky prieskum oblasti Río de la Plata. Rieka dostala meno podľa striebra, s ktorým tu obchodovali národy Čarrúa a Guaraní, hoci bájne strieborné hory hlbšie vo vnútrozemí sa hľadali márne." # todo: NEW TRANSLATION
 circumnavigation_expedition_events.6.title: "Priechod na konci sveta" # todo: NEW TRANSLATION
 circumnavigation_expedition_events.6.desc: "Priechod je chladný, úzky a vražedný. Na oboch stranách sa strmo dvíhajú steny čiernej skaly a kanál sa kľukatí, až kormidelníci už nevedia povedať, ktorým smerom je západ. Skutočným nepriateľom je vietor: ženie sa dolu zo zasnežených plání a bez varovania mení smer. V náhlych bielych víchriciach sa opiera do lanoví, tlačí lode späť a na celé dni ich pritláča ku skalám.\n\n[target_leader.GetName] mlčky stojí na prove vlajkovej lode, zatiaľ čo sa steny približujú. Kormidelníci tvrdia, že priechod je splavný. Muži si nie sú istí, či kormidelníci neprišli o rozum. Niekde pred nami, ak sa mapám ešte dá veriť, leží oceán taký obrovský, že zatiaľ nemá meno." # todo: NEW TRANSLATION
 circumnavigation_expedition_events.6.a: "Pretlačme lode cez priechod. Samotný vietor nás už nezastaví." # todo: NEW TRANSLATION
 circumnavigation_expedition_events.6.b: "Prezime tu. S odpočinutými posádkami bude priechod milosrdnejší." # todo: NEW TRANSLATION
 circumnavigation_expedition_events.6.c: "Žiadna trasa nestojí za toto. Obráťme flotilu." # todo: NEW TRANSLATION
 circumnavigation_expedition_events.6.historical_info: "Magellanov prieliv, ktorým sa plavili v novembri 1520, je 570-kilometrový priechod na samom juhu Južnej Ameriky. Lemuje ho ostrov Ohňová zem, pomenovaný podľa strážnych ohňov miestnych obyvateľov. Preplávanie trvalo 38 dní. Počas priblíženia Magellan potlačil vzburu v prístave San Julián: jedného kapitána dal popraviť a druhého vysadil na opustenom pobreží. Tretia loď, #italic San Antonio#!, dezertovala a vrátila sa do Španielska. Zostávajúce tri lode — #italic Trinidad#!, #italic Concepción#! a #italic Victoria#! — vplávali 28. novembra 1520 do vôd, ktoré Magellan nazval #italic Mar Pacífico#!. Tak ich pomenoval pre zdanlivý pokoj po hrôzach prielivu." # todo: NEW TRANSLATION
 circumnavigation_expedition_events.7.title: "More, ktoré nazvali Tichým" # todo: NEW TRANSLATION
 circumnavigation_expedition_events.7.desc: "Posledný čierny výbežok prielivu mizne za kormou a pred flotilou sa otvára nekonečný oceán. [target_leader.GetName] ho pre pokojné vody nazve #italic Mar Pacífico#! — pokoj, ktorý sa zmení na prekliatie. Týždeň strieda týždeň a neobjaví sa ani jeden ostrov. Voda v sudoch žltne a kazí sa; sucháre sa menia na prach a červy; muži obhrýzajú volskú kožu zmäkčenú vo vode a za potkana platia pol dukáta.\n\nKormidelníci nevedia povedať, aké široké je toto more, lebo ho ešte nikto nepreplával. Nech sa mu [target_leader.GetName] postaví akokoľvek, niektorí z tých, čo vyplávali, sa druhého brehu nedožijú." # todo: NEW TRANSLATION
 circumnavigation_expedition_events.7.a: "Rozdeľme zásoby a držme sa stabilného, opatrného kurzu." # todo: NEW TRANSLATION
 circumnavigation_expedition_events.7.endured_tt: "Posádka prežije plavbu; flotila dorazí k vzdialenému pobrežiu stále bojaschopná" # todo: NEW TRANSLATION
 circumnavigation_expedition_events.7.scurvy_tt: "Skorbut a hlad si vyžiadajú veľkú daň; flotila sa vlečie ďalej s preriedenými posádkami" # todo: NEW TRANSLATION
 circumnavigation_expedition_events.7.b: "Napnite všetky plachty. Čím skôr zazrieme pevninu, tým menej mužov zomrie." # todo: NEW TRANSLATION
 circumnavigation_expedition_events.7.fast_tt: "Rýchla plavba ušetrí posádku najhoršieho umierania a pevninu zazrieme včas" # todo: NEW TRANSLATION
 circumnavigation_expedition_events.7.lost_tt: "More sa ukáže širšie, než ktokoľvek tušil. Posledné zásoby sa minú a celá výprava s posádkami zahynie" # todo: NEW TRANSLATION
 circumnavigation_expedition_events.7.c: "Plavme sa na sever k údajným ostrovom a modlime sa za čerstvú vodu." # todo: NEW TRANSLATION
 circumnavigation_expedition_events.7.islands_tt: "Skupinka ostrovov poskytne vodu a čerstvé jedlo; plavbu prežijeme takmer bez strát" # todo: NEW TRANSLATION
 circumnavigation_expedition_events.7.empty_sea_tt: "Aj severné vody sa ukážu rovnako prázdne; pátranie nás stojí drahocenný čas a ďalšie životy" # todo: NEW TRANSLATION
 circumnavigation_expedition_events.7.historical_info: "Magellanova plavba cez Tichý oceán trvala približne deväťdesiatdeväť dní bez jediného doplnenia zásob — flotila sa prehnala najprázdnejšou časťou najväčšieho oceánu na Zemi a takmer nikde nezazrela pevninu. Na skorbut zomrelo asi devätnásť mužov; tí, čo prežili, jedli piliny, kožené obloženie výstroja namáčané v morskej vode a potkany predávané za premrštené ceny. Prvýkrát pristáli na ostrove Guam v Mariánach v marci 1521. Španieli ich nazvali #italic Islas de los Ladrones#! — „Ostrovy zlodejov“ — pretože Čamorovia odniesli jednu z lodných báriek, čo vyvolalo trestnú výpravu. Plavbu Tichým oceánom na východ, späť domov, nedokázali námorníci zopakovať, kým Andrés de Urdaneta v roku 1565 nenašiel severnú spiatočnú trasu, #italic tornaviaje#!, ktorá otvorila cestu stáročnému obchodu manilských galeón." # todo: NEW TRANSLATION
 circumnavigation_expedition_events.8.title: "Prvá pevnina po dvoch mesiacoch" # todo: NEW TRANSLATION
 circumnavigation_expedition_events.8.desc: "Flotila už viac než šesťdesiat dní nevidela nič okrem vody. Potom sa ozve výkrik z koša: pevnina! Nádej sa šíri loďami ako požiar — až kým sa člny nepriblížia. Tá „pevnina“ je nízky prstenec koralov a paliem, bičovaný príbojom, bez dna, na ktorom by sa dala spustiť kotva, a bez známky pitnej vody. Nad ním krúžia vtáky; na stromoch niet ničoho, čo by mohol zjesť hladujúci človek.\n\nOstrov ponúka len krutú nádej. [target_leader.GetName] musí rozhodnúť, či sa tu zdržíme a budeme pátrať, alebo poplavíme ďalej." # todo: NEW TRANSLATION
 circumnavigation_expedition_events.8.a: "Spusťte člny; prehľadajte útes, či nenájdete vodu alebo jedlo." # todo: NEW TRANSLATION
 circumnavigation_expedition_events.8.barren_tt: "Útes nám namiesto úľavy poskytne len výsmech suchej zeme a stratíme ďalšie dni" # todo: NEW TRANSLATION
 circumnavigation_expedition_events.8.relief_tt: "Nazbierame trochu dažďovej vody a niekoľko morských vtákov — drobnú úľavu od hladu" # todo: NEW TRANSLATION
 circumnavigation_expedition_events.8.b: "Niet tu ničoho a nemáme sa kde ukotviť. Plavme sa ďalej." # todo: NEW TRANSLATION
 circumnavigation_expedition_events.8.historical_info: "24. januára 1521 flotila zazrela prvú pevninu v Tichom oceáne: malý neobývaný atol, ktorý nazvala San Pablo, pravdepodobne dnešný Puka-Puka v súostroví Tuamotu. Pigafetta zaznamenal, že dva ostrovy, ktoré počas plavby našli, „nemali vhodné miesto na kotvenie, pretože tam nebolo dno“, a že na nich „boli iba vtáky a stromy“. Hladujúca posádka nemohla pristáť, a tak z nich nič nezískala. Magellan túto dvojicu ostrovov nazval #italic Islas Infortunadas#! — Nešťastné ostrovy." # todo: NEW TRANSLATION
 circumnavigation_expedition_events.9.title: "Ostrov žralokov" # todo: NEW TRANSLATION
 circumnavigation_expedition_events.9.desc: "Z mora sa vynára druhý ostrov a je rovnako pustý ako prvý — koraly a kroviská obkolesené príbojom, bez bezpečného kotviska. Jediným životom v jeho vodách sú žraloky, ktoré sa v takom množstve sivé kĺžu pod trupmi, že sa námorníci žehnajú. Niet tu miesta na pristátie, vody ani jedla — len to isté prázdne more a nádej mužov, ktorá každým dňom slabne.\n\n[target_leader.GetName] musí rozhodnúť, ako flotila zvládne zúfalstvo." # todo: NEW TRANSLATION
 circumnavigation_expedition_events.9.a: "Znova spusťme člny a skúsme sa cez príboj dostať na breh." # todo: NEW TRANSLATION
 circumnavigation_expedition_events.9.a.tt: "Člny sa vrátia s prázdnymi rukami, no posádky videli, že sme sa o to pokúsili, a morálka klesne len mierne (#R -3#! morálka posádky)" # todo: NEW TRANSLATION
 circumnavigation_expedition_events.9.b: "Pomenujme ho Ostrov žralokov a mlčky sa plavme ďalej." # todo: NEW TRANSLATION
 circumnavigation_expedition_events.9.historical_info: "Druhý z Nešťastných ostrovov, zazretý 21. februára 1521, dostal meno #italic Tiburones#! — Žraloky — podľa množstva žralokov, ktoré Pigafetta zaznamenal v jeho vodách. Pravdepodobne išlo o ostrov Caroline alebo Flint. Ani tu nebolo dno vhodné na kotvenie, ani úľava. Týždne medzi týmito dvoma ostrovmi boli najhoršou časťou plavby: skorbut si neúprosne vyberal svoju daň a posádky prežívali jedením kože, pilín a potkanov. Žraloky nelovili; nedokázali sa dostať ani na breh." # todo: NEW TRANSLATION
 circumnavigation_expedition_events.10.title: "Ostrovy zlodejov" # todo: NEW TRANSLATION
 circumnavigation_expedition_events.10.desc: "Na samom pokraji síl zbadá hliadka zelené hory — konečne skutočnú pevninu s vodou, ovocím a rybami. K flotile sa hrnú kanoe s plavákmi, ktorých posádky sú rýchle a nebojácne. Vyšplhajú sa na paluby a odnášajú všetko, čo nie je priviazané. Pre nich je nechránená vec voľne dostupná; vyhladovaným posádkam to pripadá ako lúpež.\n\nTieto ostrovy môžu výpravu zachrániť, ak z nich [target_leader.GetName] dokáže vymôcť zásoby." # todo: NEW TRANSLATION
 circumnavigation_expedition_events.10.a: "Poctivo vymeňme za všetko jedlo a vodu, čo unesiemе." # todo: NEW TRANSLATION
 circumnavigation_expedition_events.10.b: "Vysadme ozbrojených mužov, aby získali bárku späť a vzali, čo potrebujeme." # todo: NEW TRANSLATION
 circumnavigation_expedition_events.10.c: "Zoberme z kanoí, čo sa dá, a hneď vyplávajme na otvorené more." # todo: NEW TRANSLATION
 circumnavigation_expedition_events.10.historical_info: "Flotila dorazila 6. marca 1521 na Guam v Mariánach, prvú pevninu od preplávania prielivu. Magellan ostrovy nazval #italic Islas de los Ladrones#! — Ostrovy zlodejov — pretože Čamorovia, ktorí nepoznali súkromné vlastníctvo, odniesli lodný čln. Na odvetu vysadil asi štyridsať ozbrojených mužov, ktorí vypálili domy a zabili niekoľkých ostrovanov, aby čln získali späť. Nech už zastávka prebehla akokoľvek, umierajúce posádky tu po viac než troch mesiacoch dostali prvé čerstvé jedlo a vodu. Bola to záchrana." # todo: NEW TRANSLATION
 circumnavigation_expedition_events.11.title: "Krv a viera na Cebu" # todo: NEW TRANSLATION
 circumnavigation_expedition_events.11.desc: "Ostrovy výpravu zachránili. Po útrapách plavby dopĺňajú posádky [target_leader.GetName] vodu, ovocie a čerstvé mäso a na Cebu ich rádža prijíma hostinou. Krvou spečatia dohodu: jeho ľud prijme [ROOT.GetCountry.GetReligion.GetName] a na oplátku poslúžia cudzie zbrane jeho korune. Za jediný deň sa pod tropickým slnkom obráti na vieru stovky ľudí.\n\nPotom prichádza cena spojenectva. Na ostrove Mactan, za úzkym prielivom, vzdorovitý náčelník odmieta [ROOT.GetCountry.GetReligion.GetGodName] aj nového vládcu — a náš spojenec očakáva, že ho pokoríme. Získať si priateľa na týchto ostrovoch znamená zdediť aj jeho nepriateľov." # todo: NEW TRANSLATION
 circumnavigation_expedition_events.11.a: "Podporíme nášho spojenca. Nech Mactan spozná našu silu." # todo: NEW TRANSLATION
 circumnavigation_expedition_events.11.mactan_triumph_tt: "Ukážka sily ohromí ostrovy a nepriatelia nášho spojenca sa pokoria" # todo: NEW TRANSLATION
 circumnavigation_expedition_events.11.mactan_disaster_tt: "Útok na plytčinách stroskotá; padnú statoční muži a flotila tým zoslabne" # todo: NEW TRANSLATION
 circumnavigation_expedition_events.11.b: "Vezmime si, čo nám ostrovy ponúkajú, a odplávajme; toto nie je náš boj." # todo: NEW TRANSLATION
 circumnavigation_expedition_events.11.c: "Vztyčme kráľovskú zástavu. Nech koruna zaznamená tento objav." # todo: NEW TRANSLATION
 circumnavigation_expedition_events.11.historical_info: "Magellan dorazil na Filipínske súostrovie v marci 1521 a nazval ho Súostrovím svätého Lazára. Filipíny umožnili prvý dlhší kontakt s obyvateľmi západného Tichomoria a poskytli zásoby, ktoré zachránili hladujúcu flotilu. Magellan uzavrel krvavú dohodu s cebuánskym rádžom Humabonom, obrátil ho na kresťanstvo spolu s niekoľkými tisíckami jeho poddaných. Spojenectvo sa ukázalo ako osudné: 27. apríla 1521 Magellan zahynul v bitke pri Mactane, keď v mene svojho nového spojenca viedol neuvážený útok cez útesy proti náčelníkovi Lapulapuovi. Velenie napokon prevzal Juan Sebastián Elcano a preživší — ktorých už bolo príliš málo na obsluhu troch lodí — spálili pri Bohole loď #italic Concepción#!." # todo: NEW TRANSLATION
 circumnavigation_expedition_events.12.title: "Ostrovy korenia" # todo: NEW TRANSLATION
 circumnavigation_expedition_events.12.desc: "Moluky. Miesto na každej mape, kam sa z východu dosiaľ nedostala žiadna iberská loď. Vôňa prichádza k lodiam ešte skôr, než sa ostrovy ukážu — klinčeky, bohaté a prenikavé, ktorých vôňu nesie ten istý vietor, čo ich previedol cez dva oceány.\n\n[target_leader.GetName] stojí na palube, zatiaľ čo kormidelníci hlásia hĺbku, a dlho mlčí. Nákladné priestory sú takmer prázdne. Posádka je len tieňom toho, čím bývala. No dorazili sem a sultánove člny už veslujú v ústrety." # todo: NEW TRANSLATION
 circumnavigation_expedition_events.12.a: "Naplňme nákladné priestory [ShowGoodsNameWithNoTooltip('cloves')]; kvôli tomu sme preplávali celý svet." # todo: NEW TRANSLATION
 circumnavigation_expedition_events.12.cloves_loaded_tt: "Zostávajúce nákladné priestory naplnia [ShowGoodsName('cloves')], ktoré sa po návrate flotily predajú na trhu [ROOT.GetCountry.GetCapital.GetMarket.GetName]. Flotila, ktorá neporušená prepláva Tichý oceán, prinesie domov oveľa cennejší náklad" # todo: NEW TRANSLATION # todo: COUNTRY CASE
 circumnavigation_expedition_events.12.b: "Uzavrime so sultánom zmluvu. Spojenectvo je cennejšie než náklad." # todo: NEW TRANSLATION
 circumnavigation_expedition_events.12.treaty_cargo_tt: "So sultánom sa uzavrie zmluva a naloží sa časť [ShowGoodsName('cloves')] — náklad bude menší, no priateľstvo na Ostrovoch korenia ho pretrvá" # todo: NEW TRANSLATION
 circumnavigation_expedition_events.12.historical_info: "Moluky — pôvodné „Ostrovy korenia“ — boli zdrojom klinčekov, muškátového orieška a muškátového kvetu, vďaka ktorým bol obchod s Východom taký výnosný. Elcanove lode dorazili v novembri 1521 na Tidore, ktorého sultán bol súperom sultána z Ternate, ležiaceho v portugalskej sfére vplyvu. Lode #italic Victoria#! a #italic Trinidad#! naložili klinčeky. Loď #italic Trinidad#! sa potom pokúsila plaviť na východ cez Tichý oceán, no vietor jej v tom zabránil a zmocnili sa jej Portugalci. Na západ pokračovala už len loď #italic Victoria#! pod Elcanovým velením. Keď v septembri 1522 konečne dorazila do Sanlúcar de Barrameda s osemnástimi preživšími a nákladom klinčekov, tento jediný náklad korenia zaplatil celú trojročnú výpravu a ešte priniesol zisk." # todo: NEW TRANSLATION
 circumnavigation_expedition_events.13.title: "Plavba okolo Mysu" # todo: NEW TRANSLATION
 circumnavigation_expedition_events.13.desc: "Mys je presne taký, ako varovali staré námornícke príbehy — stena sivých vôd a vetra, ktorý zaobchádza s loďami ako s lístím. Zostávajúca posádka sa nesťažuje. Už preplávali priechod, ktorý mal byť neprekonateľný, oceán bez mena a súostrovie, ktoré takmer pohltilo flotilu. Mys Dobrej nádeje je už len ďalšou prekážkou.\n\nKeď vlajková loď obopláva výbežok a vietor zoslabne, [target_leader.GetName] sa pozrie na východ a potom na západ. Plavili sa už po všetkých oceánoch sveta." # todo: NEW TRANSLATION
 circumnavigation_expedition_events.13.a: "Poďakujme Bohu. Nech sa stane čokoľvek, budú si nás pamätať." # todo: NEW TRANSLATION
 circumnavigation_expedition_events.13.b: "Žiadne obrady. Plavme sa na sever. Ešte nie sme doma." # todo: NEW TRANSLATION
 circumnavigation_expedition_events.13.historical_info: "Loď #italic Victoria#! oboplávala v máji 1522 pod Elcanovým velením Mys Dobrej nádeje a prekonala tak poslednú veľkú zemepisnú prekážku na ceste späť do Španielska. Portugalci ovládali trasu okolo mysu aj prístavy, kde sa dali doplniť zásoby. Elcano sa im vyhol pre nejasný právny status výpravy, keďže Španielsko a Portugalsko sa podľa Tordesillaského dohovoru sporili o zvrchovanosť nad Molukami. Loď bola v zlom stave a prepúšťala vodu; osemnásťčlenná posádka, zmenšená z pôvodných 270 mužov, bola na pokraji vyčerpania. Do Sanlúcar de Barrameda dorazili 6. septembra 1522 a necelé tri roky po vyplávaní dokončili prvé oboplávanie Zeme." # todo: NEW TRANSLATION
 circumnavigation_expedition_events.14.title: "Priateľské pobrežie" # todo: NEW TRANSLATION
 circumnavigation_expedition_events.14.desc: "Ostrovy pred nami sa pýšia vlastnými farbami [ROOT.GetCountry.GetAltAdjective('I')]. Po rokoch za hranicami všetkých máp flotila konečne pristála na priateľskej pôde — v prístave, kde možno loď utesniť, naplniť sudy a nakŕmiť vychudnutú posádku bez strachu či klamstiev. Guvernérovi ľudia prichádzajú na nábrežie obzerať si vychudnutých, otrhaných mužov, ktorí tvrdia, že oboplávali svet.\n\nDomovské vody sú už blízko. [target_leader.GetName] musí rozhodnúť len to, ako dlho si odpočinieme." # todo: NEW TRANSLATION # todo: COUNTRY CASE
 circumnavigation_expedition_events.14.a: "Dajme loď do poriadku: utesnime škáry, naplňme sudy a nakŕmme mužov." # todo: NEW TRANSLATION
 circumnavigation_expedition_events.14.b: "Zastavme sa len nakrátko. Muži si poriadne oddýchnu až doma." # todo: NEW TRANSLATION
 circumnavigation_expedition_events.14.historical_info: "Za Magellanových čias patrili Kapverdské ostrovy Portugalsku a španielska flotila by sa tam neodvážila otvorene dopĺňať zásoby. Krajina, ktorá by však sama ovládala tieto atlantické ostrovy, by v nich našla neoceniteľnú poslednú zastávku pred cestou domov — chránené miesto na vytiahnutie lode na plytčinu, doplnenie vody a zásob po najdlhšej plavbe, o akú sa kedy niekto pokúsil." # todo: NEW TRANSLATION
 circumnavigation_expedition_events.15.title: "Zúčtovanie" # todo: NEW TRANSLATION
 circumnavigation_expedition_events.15.desc: "Posledná loď prepúšťa vodu všetkými škárami a posádka hladuje, no jediný prístav v dosahu sa pýši farbami konkurenčnej koruny. [target_leader.GetName] nariadi vplávať doň pod falošnou zámienkou — že sa vracajú z Ameriky, nie zo zakázaného východu. Keď sa však muži na brehu spýtajú, aký je deň, dostanú nesprávnu odpoveď: pri oboplávaní sveta flotila niekde stratila vo svojom počítaní jeden deň a tento rozdiel môže všetko prezradiť.\n\nAk klamstvo obstojí, zásoby sú na dosah." # todo: NEW TRANSLATION
 circumnavigation_expedition_events.15.a: "Držme sa príbehu. Rýchlo nakúpme, kým sa nezačnú vypytovať." # todo: NEW TRANSLATION
 circumnavigation_expedition_events.15.ruse_ok_tt: "Príbeh obstojí; zásoby sa nakúpia a loď odpláva skôr, než otázky pritvrdnú" # todo: NEW TRANSLATION
 circumnavigation_expedition_events.15.ruse_failed_tt: "Klamstvo sa prezradí pre chýbajúci deň a časť pobrežnej skupiny zajmú skôr, než loď stihne uniknúť" # todo: NEW TRANSLATION
 circumnavigation_expedition_events.15.b: "Neriskujme prístav súpera. Plavme domov hladní, ako sme." # todo: NEW TRANSLATION
 circumnavigation_expedition_events.15.historical_info: "V júli 1522 zakotvila loď #italic Victoria#! v portugalskom prístave Santiago na Kapverdských ostrovoch. Tvrdila, že sa vracia z Ameriky, aby zatajila plavbu cez východ nárokovaný Portugalskom. Klamstvo obstálo, až kým podozrenie nevzbudil jednodňový rozdiel v lodnom denníku — prvý praktický dôkaz toho, čo oboplávanie zemegule urobí s kalendárom. Portugalci zajali trinásť členov posádky. Ostatní odrezali kotviace lano a utiekli; do Španielska dorazili len s osemnástimi mužmi na palube." # todo: NEW TRANSLATION
 circumnavigation_expedition_events.16.title: "Pusté kotvisko" # todo: NEW TRANSLATION
 circumnavigation_expedition_events.16.desc: "Ostrovy sú neobývané — suché, vetrom ošľahané kopy skál a krovín — no je to pevnina s chránenými vodami a prameňmi medzi kameňmi. A čo je ešte lepšie, po svahoch sa voľne potulujú kozy, ktoré tu zanechala nejaká skoršia loď, a námorníkom sa zbiehajú sliny pri predstave čerstvého mäsa po takom dlhom čase, keď jedli len skazené jedlo a červy.\n\nKotvisko nás nestojí nič okrem času a práve ten si loď na ceste domov môže dovoliť ušetriť. [target_leader.GetName] vydáva rozkaz." # todo: NEW TRANSLATION
 circumnavigation_expedition_events.16.a: "Vyslať lovcov na breh po kozy a naplniť sudy pri prameňoch." # todo: NEW TRANSLATION
 circumnavigation_expedition_events.16.b: "Doplniť vodu na lodi a pokračovať. Domov už nie je ďaleko." # todo: NEW TRANSLATION
 circumnavigation_expedition_events.16.historical_info: "Lode, ktoré tadiaľ plávali, často vysádzali na neobývaných ostrovoch v Atlantiku kozy a prasatá. Tie sa rozmnožili do divých stád a z holých skál sa tak stali neplánované zásobárne potravín pre neskorších moreplavcov. Neosídlený, no vodou zásobený ostrov na ceste domov ponúkal unavenej výprave čerstvé mäso a čistú vodu za cenu niekoľkodňového zdržania — drobnú, no skutočnú úľavu na dosah domova." # todo: NEW TRANSLATION
 circumnavigation_expedition_events.17.title: "Žiadna loď sa nevrátila" # todo: NEW TRANSLATION
 circumnavigation_expedition_events.17.desc: "V [capital_location.GetName] plynie jedno ročné obdobie za druhým a o flotile niet ani chýru, až napokon vyhasne aj posledná nádej. Výprava sa už domov nevráti. Niekde za hranicami známeho sveta — pohltilo ju more príliš rozľahlé na preplávanie, alebo ju zdecimovalo natoľko, že nezostalo dosť lodí a mužov na pokračovanie — lode aj ich posádky zmizli. Z flotily, ktorá vyplávala oboplávať svet, sa nevrátilo nič okrem ticha a mien mŕtvych.\n\nSen prežije mužov, ktorí sa za ním vydali. Iná vláda a iná posádka možno raz dokončia, čo táto začala." # todo: NEW TRANSLATION
 circumnavigation_expedition_events.17.a: "Nezabudneme na nich." # todo: NEW TRANSLATION
 circumnavigation_expedition_events.17.end_tt: "Výprava sa stratila a jej plavba sa tu končí" # todo: NEW TRANSLATION
 circumnavigation_expedition_events.17.historical_info: "Zo siedmich lodí, ktoré sa v roku 1525 vydali pod velením Garcíu Jofreho de Loaísa zopakovať Magellanovu trasu, sa k Molukám napokon dostala iba jedna ťažko poškodená loď a hŕstka preživších. Nik z nich sa však nevrátil východnou cestou. Úplná strata výpravy bola v tej dobe reálnym nebezpečenstvom: oboplávanie sveta si vyžadovalo roky na mori bez nádeje na doplnenie zásob a flotilu pohltenú Tichým oceánom možno už nikdy nikto nenašiel." # todo: NEW TRANSLATION
 circumnavigation_expedition_events.18.title: "Vzbura" # todo: NEW TRANSLATION
 circumnavigation_expedition_events.18.desc: "Začína sa to tak, ako sa to vždy začína: zamrmlaným slovom počas nočnej hliadky, skupinkou mužov, ktorá stíchne, keď okolo prejde dôstojník, a kapitánom, ktorý sa už [target_leader.GetName] nedokáže pozrieť do očí. Zásob je málo, muži sú premrznutí a vystrašení a prihlásili sa na plavbu do Indie, nie na cestu na koniec sveta. Teraz nespokojnosť nadobudla konkrétnu podobu — jeden z kapitánov otvorene odmietol rozkaz a jeho posádka stojí za ním, žiadajúc, aby sa flotila obrátila domov.\n\n[target_leader.GetName] má možno deň na to, aby zabránil vzbure rozšíriť sa na ostatné lode. Rozhodnúť sa treba hneď." # todo: NEW TRANSLATION
 circumnavigation_expedition_events.18.a: "Nech sa nespokojenci vrátia. My pokračujeme bez nich." # todo: NEW TRANSLATION
 circumnavigation_expedition_events.18.b: "Potlačme vzburu silou. Vodcovia sa budú zodpovedať." # todo: NEW TRANSLATION
 circumnavigation_expedition_events.18.fight_win_tt: "Vzbura je potlačená a jej vodcovia slúžia ostatným za výstrahu. Poriadok je obnovený, no zúčtovanie stálo flotilu čas" # todo: NEW TRANSLATION
 circumnavigation_expedition_events.18.fight_lose_tt: "Potláčanie prerastie do otvoreného boja a dopadne zle: v chaose sa stratí loď, kým sa podarí obnoviť poriadok, a flotila navyše stratí čas" # todo: NEW TRANSLATION
 circumnavigation_expedition_events.18.c: "Pripomeňme im, čo ich čaká za obzorom." # todo: NEW TRANSLATION
 circumnavigation_expedition_events.18.rouse_tt: "[target_leader.GetName] prechádza po palubách a prihovára sa posádkam tak, ako to nedokáže žiaden obyčajný veliteľ. Vzbura sa sama od seba rozplynie a morálka mužov stúpne ešte vyššie než predtým" # todo: NEW TRANSLATION
 circumnavigation_expedition_events.19.title: "Naše vlastné pobrežie" # todo: NEW TRANSLATION
 circumnavigation_expedition_events.19.desc: "Po týždňoch plavby otvoreným [ShowContinentName('atlantic_ocean_continent')] sa na západnom obzore črtá nízky zelený pás — a nad malým prístavným mestečkom veje naša vlajka. Kolónia [ROOT.GetCountry.GetName], založená na tomto vzdialenom pobreží, otvára sklady lodiam koruny. Medzi krajanmi sú k dispozícii čerstvá voda, ovocie, solené mäso aj drevo na opravy, a to všetko zadarmo.\n\n[target_leader.GetName] môže pred obrátením na juh, do neznáma, doplniť všetko, čo flotila unesie." # todo: NEW TRANSLATION
 circumnavigation_expedition_events.19.a: "Doprajme si odpočinok a doplňme všetky zásoby. Takáto spriatelená pôda je vzácna." # todo: NEW TRANSLATION
 circumnavigation_expedition_events.19.b: "Krátka, vďačná zastávka a potom na juh. Sezóna nepočká." # todo: NEW TRANSLATION
 circumnavigation_expedition_events.19.historical_info: "Severovýchodné pobrežie Brazílie — Pernambuco, Paraíba a Rio Grande — patrilo k najstarším a najbohatším oblastiam iberského osídlenia v Novom svete. Jeho pobrežie lemovalo brazílske drevo a čoskoro aj cukrová trstina. Koruna, ktorá ovládala tieto prístavy, mohla na vlastnej pôde doplniť flotile vodu a zásoby pred dlhou plavbou do južných šírok — výsadu, ktorú Magellan pri plavbe vodami nárokovanými rivalom nikdy nemal." # todo: NEW TRANSLATION
 circumnavigation_expedition_events.20.title: "Pobrežie rivala" # todo: NEW TRANSLATION
 circumnavigation_expedition_events.20.desc: "Po týždňoch plavby otvoreným [ShowContinentName('atlantic_ocean_continent')] sa na západnom obzore črtá nízky zelený pás — no nad prístavom veje vlajka [rival_crown.GetName]. Toto pobrežie patrí ich kolónii a flotila v našich službách nemá na jej móla žiadny zákonný nárok. Sklady sú však plné, obchodníci ochotní obchodovať za dobrú cenu a muži túžia po čomkoľvek, čo nie sú červivé sucháre.\n\n[target_leader.GetName] sa musí rozhodnúť, či zakotví pod delami rivala, alebo zamieri na juh." # todo: NEW TRANSLATION
 circumnavigation_expedition_events.20.a: "Opatrne obchodujme s kolóniou [rival_crown.GetNameWithNoTooltip] a získajme zásoby." # todo: NEW TRANSLATION
 circumnavigation_expedition_events.20.b: "Držme sa ďaleko od prístavu rivala. Pokračujme na juh." # todo: NEW TRANSLATION
 circumnavigation_expedition_events.20.historical_info: "Podľa zmluvy z Tordesillas pripadlo brazílske pobrežie portugalskej polovici sveta a flotila v kastílskych službách si na jeho prístavy nemohla robiť nárok. V praxi sa však hladná posádka a ochotný koloniálny obchodník mohli potichu dohodnúť na zásobách. Zakotviť v prístave súperiacej koruny však vždy znamenalo riskovať zabavenie lode, vydieranie alebo konfiškáciu každého plavidla, ktoré nedokázalo preukázať oprávnenie tam byť." # todo: NEW TRANSLATION
 circumnavigation_expedition_events.21.title: "Kurdžavka na palube" # todo: NEW TRANSLATION
 circumnavigation_expedition_events.21.desc: "Napokon dorazila choroba, ktorá prenasleduje každú dlhú plavbu. Ďasná černejú a krvácajú, staré jazvy sa samy od seba otvárajú, zuby sa kývajú v čeľustiach a muži, ktorí boli ešte pred mesiacom zdraví, už nedokážu vstať z paluby. Chirurg nemá iný liek než odpočinok a čerstvé jedlo, no obojeho je žalostne málo.\n\n[target_leader.GetName] musí zvážiť, ako veľmi možno žmýkať umierajúcu posádku." # todo: NEW TRANSLATION
 circumnavigation_expedition_events.21.a: "Rozdeľme čerstvé zásoby a odpočívajme, kým to najhoršie neprejde." # todo: NEW TRANSLATION
 circumnavigation_expedition_events.21.b: "Nemôžeme strácať čas. Pokračujme; silní vydržia." # todo: NEW TRANSLATION
 circumnavigation_expedition_events.21.b.tt: "Plavba pokračuje a chorí sú ponechaní napospas osudu. Mnohí vzdialené pobrežie neuvidia a preživších bude príliš málo na to, aby sa domov vrátila celá flotila" # todo: NEW TRANSLATION
 circumnavigation_expedition_events.22.title: "Búrka" # todo: NEW TRANSLATION
 circumnavigation_expedition_events.22.desc: "Obloha nadobúda farbu modriny a more sa dvíha do sivých hôr. Vietor trhá lanovím a lode sa namáhajú v priehlbinách takých hlbokých, že by pohltili vežu. Zelené vlny sa prelievajú cez paluby a kormidelníci už nedokážu rozoznať jednu loď od druhej.\n\n[target_leader.GetName] sa musí rozhodnúť, či búrke čeliť, alebo pred ňou utekať a dúfať, že flotila zostane pohromade." # todo: NEW TRANSLATION
 circumnavigation_expedition_events.22.a: "Zastavme loď proti vetru, stiahnime plachty a prečkajme búrku." # todo: NEW TRANSLATION
 circumnavigation_expedition_events.22.b: "Utekajme pred vetrom a získajme čo najväčšiu rýchlosť." # todo: NEW TRANSLATION
 circumnavigation_expedition_events.22.b.win_tt: "Flotila prepláva najhoršou časťou búrky a vyviazne roztrúsená a otrasená, ale celá" # todo: NEW TRANSLATION
 circumnavigation_expedition_events.22.b.lose_tt: "Riskantný plán zlyhá, flotilu rozmetá v tme a na úsvite možno jedna loď neodpovie" # todo: NEW TRANSLATION
 circumnavigation_expedition_events.23.title: "Červotoč v trupe" # todo: NEW TRANSLATION
 circumnavigation_expedition_events.23.desc: "V týchto teplých vodách sa šášeň lodný zavŕtava do obšívky rýchlejšie, než ju dokážu tesári zaplátať, až sú trámy deravé ako plást. Čerpadlá pracujú nepretržite, no voda v podpalubí stále stúpa. Takýto poškodený trup nemôže bezpečne preplávať oceán bez dôkladnej opravy — loď treba vytiahnuť na pláž, opáliť nánosy z jej dna a znova utesniť škáry.\n\n[target_leader.GetName] sa musí rozhodnúť, ako udržať flotilu na hladine." # todo: NEW TRANSLATION
 circumnavigation_expedition_events.23.a: "Vytiahnime loď na opustenú pláž a opravme ju, ako najlepšie vieme." # todo: NEW TRANSLATION
 circumnavigation_expedition_events.23.a.tt: "Flotila vytiahne lode na opustenom pobreží a urobí, čo sa dá; práca je pomalá a nákladná, no trupy ešte chvíľu vydržia" # todo: NEW TRANSLATION
 circumnavigation_expedition_events.23.b: "Opusťme najhorší trup a jeho posádku rozdeľme medzi ostatné lode." # todo: NEW TRANSLATION
 circumnavigation_expedition_events.23.c: "Zamierme do neďalekého spriateleného prístavu a opravme loď tam." # todo: NEW TRANSLATION
 circumnavigation_expedition_events.23.c.tt: "Flotila zakotví v neďalekom spriatelenom prístave a bezpečne loď opraví — oveľa spoľahlivejšie než na opustenej pláži; posádky si navyše príjemne oddýchnu" # todo: NEW TRANSLATION
 circumnavigation_expedition_events.24.title: "Bezvetrie" # todo: NEW TRANSLATION
 circumnavigation_expedition_events.24.desc: "Vietor úplne ustane. Plachty bezvládne visia na stožiaroch, more pod bielou a nemilosrdnou oblohou je pokojné ako sklo a lode nehybne stoja deň za dňom, zatiaľ čo voda v sudoch sa kazí a jedlo sa míňa. Muži najprv mrzuto hundrú, potom sa začnú báť a šomrú, že flotila odplávala za hranice svetových vetrov a už ich nikdy nepocíti.\n\n[target_leader.GetName] môže len čakať — alebo prikázať veslovať." # todo: NEW TRANSLATION
 circumnavigation_expedition_events.24.a: "Čakajme na návrat vetra, nech to trvá akokoľvek dlho." # todo: NEW TRANSLATION
 circumnavigation_expedition_events.24.b: "Na vodu s člnmi a vlečme lode vlastnými silami." # todo: NEW TRANSLATION
 circumnavigation_expedition_events.25.title: "Príliš málo mužov" # todo: NEW TRANSLATION
 circumnavigation_expedition_events.25.desc: "Toľkí zomreli alebo bezvládne ležia pod palubou, že už niet dosť schopných mužov na obsluhu všetkých lodí. Nedá sa nič robiť: jednu loď zbavia všetkého užitočného, jej hŕstku schopných preživších rozdelia medzi ostatné a prázdny trup nechajú napospas moru. Flotila sa tak plaví s menším počtom lodí — aspoň však tie zostávajúce možno riadne obsluhovať." # todo: NEW TRANSLATION
 circumnavigation_expedition_events.25.a: "Iná možnosť nebola. Rozdeľme jej posádku medzi ostatné lode." # todo: NEW TRANSLATION
 circumnavigation_expedition_events.26.title: "Loď sa potopila" # todo: NEW TRANSLATION
 circumnavigation_expedition_events.26.desc: "Keď sa búrka konečne utíši a flotila sa opäť zhromaždí, jedna loď chýba. Nik nevie, či ju zahnalo na záveterné pobrežie, či sa v tme roztvorili jej škáry a potopila sa, alebo ju jednoducho odnieslo za obzor. Už sa nepripojí. More si ju vzalo aj so všetkými dušami na palube." # todo: NEW TRANSLATION
 circumnavigation_expedition_events.26.a: "Pomodlime sa za mŕtvych a pokračujme v plavbe." # todo: NEW TRANSLATION
 circumnavigation_expedition_events.27.title: "Opustené pobrežie" # todo: NEW TRANSLATION
 circumnavigation_expedition_events.27.desc: "Zásoby v podpalubí sa míňajú, no neďaleko leží nízke zelené pobrežie — podľa hliadok neobývané, bez dymu z ohnísk a bez kanoe na vode. Zo skál steká v tucte prúdov čerstvá voda, plytčiny sa hemžia vodným vtáctvom a lesy sľubujú ovocie, drevo aj zver každému, kto sa odváži vystúpiť na breh a vziať si ich.\n\nZozbierať dostatok zásob potrvá niekoľko dní, ktoré si flotila sotva môže dovoliť stratiť, no prázdne žalúdky stoja ešte viac. [target_leader.GetName] vydáva rozkaz." # todo: NEW TRANSLATION
 circumnavigation_expedition_events.27.a: "Vystúpme na breh. Naplňme sudy a nazbierajme drevo, ovocie i zverinu." # todo: NEW TRANSLATION
 circumnavigation_expedition_events.27.b: "Na zháňanie zásob niet času. Pokračujme, hoci hladní." # todo: NEW TRANSLATION
 circumnavigation_expedition_events.28.title: "Obchod s pobrežím" # todo: NEW TRANSLATION
 circumnavigation_expedition_events.28.desc.christian: "Zásoby v podpalubí sa míňajú, no neďaleko na pobreží leží kresťanské [trade_shore.GetRank.GetName] — zvony kostolov doliehajú cez vodu a nad prístavom sa týči kríž. Obyvatelia vyplávajú na člnoch obzrieť si cudzincov; sú ostražití, no ochotní rokovať. Tam, kde je spoločná viera, možno nájsť aj spoločný jazyk na vyjednávanie. Za mince a obchodný tovar možno získať obilie, solené mäso, ovocie aj čerstvú vodu.\n\nNiekoľko dní strávených na kotve by opäť naplnilo podpalubie. [target_leader.GetName] zvažuje, či sa zdržanie vyplatí napriek ubúdajúcim zásobám." # todo: NEW TRANSLATION
 circumnavigation_expedition_events.28.desc.muslim: "Zásoby v podpalubí sa míňajú, no neďaleko na pobreží leží moslimský [trade_shore.GetRank.GetName] — ponad vodu sa nesie volanie k modlitbe a pri brehu kotvia džunky. Ich obchodníci vyplávajú v ústrety flotile, rozvážni a nebojácni, veď sú to ľudia, ktorí obchodovali na všetkých moriach sveta. Za dobrú cenu a vhodný tovar možno získať ryžu, datle, solené ryby aj sladkú vodu.\n\nNiekoľko dní strávených na kotve by opäť naplnilo podpalubie. [target_leader.GetName] zvažuje, či sa zdržanie vyplatí napriek ubúdajúcim zásobám." # todo: NEW TRANSLATION
 circumnavigation_expedition_events.28.desc.pagan: "Zásoby v podpalubí sa míňajú, no neďaleko na pobreží leží [trade_shore.GetRank.GetName]. Jeho obyvatelia uctievajú bohov, ktorých mená kapláni flotily nikdy nepočuli. Opatrne priplávajú na kanoe a ponúkajú korene, ovocie, ryby a tekvice naplnené čerstvou vodou. Zaujímajú ich železné predmety, látky a drobnosti, ktoré im cudzinci ponúkajú výmenou. Ani jedna strana neovláda jazyk tej druhej, no na hlad a obchod netreba slová.\n\nNiekoľko dní obchodovania by opäť naplnilo podpalubie. [target_leader.GetName] zvažuje, či sa zdržanie vyplatí napriek ubúdajúcim zásobám." # todo: NEW TRANSLATION
 circumnavigation_expedition_events.28.a: "Zakotvime a nakúpme toľko zásob, koľko flotila unesie." # todo: NEW TRANSLATION
 circumnavigation_expedition_events.28.b: "Na obchodovanie nemáme čas. Pokračujme, hoci hladní." # todo: NEW TRANSLATION
 circumnavigation_expedition_events.provisioned_tt: "Flotila je plne zásobená a jej posádky budú nadchádzajúci veľký prechod znášať lepšie (#G +30#! zásob)" # todo: NEW TRANSLATION

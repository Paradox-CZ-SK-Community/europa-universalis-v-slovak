l_polish:
 expedition_succession_events.new_leader_tt: "[target_leader.GetName] preberá velenie nad výpravou" # todo: NEW TRANSLATION
 expedition_succession_events.morale_down_tt: "Strata veliteľa podlomí morálku posádky (#R -20#! morálka posádky)" # todo: NEW TRANSLATION
 expedition_succession_events.1.title: "Nový kormidelník" # todo: NEW TRANSLATION
 expedition_succession_events.1.desc: "Do [ROOT.GetCountry.GetCapital.GetAltAdjective('G')] dorazí správa, že veliteľ výpravy zomrel. Našťastie je medzi dôstojníkmi, ktorí zostali na palube, muž dostatočne vzdelaný a odvážny na to, aby sa vyznal v námorných mapách a udržal posádku pohromade. Ostatní sa naňho po tejto strate už aj tak spoliehajú.\n\nPosádka ho potvrdí vo velení a výprava pokračuje pod jeho vedením." # todo: NEW TRANSLATION # todo: COUNTRY CASE
 expedition_succession_events.1.a: "Nech sa tak stane. Plavba pokračuje." # todo: NEW TRANSLATION
 expedition_succession_events.2.title: "Nový veliteľ flotily" # todo: NEW TRANSLATION
 expedition_succession_events.2.desc: "Do [ROOT.GetCountry.GetCapital.GetAltAdjective('G')] dorazí správa, že admirál flotily zomrel. Flotila nemôže plávať týmito vodami bez veliteľa, no našťastie je jeden z jej dôstojníkov dostatočne skúsený a schopný, aby ostatní uznávali jeho slovo za zákon. Už sa ujal velenia na kapitánskom mostíku.\n\nDôstojníci ho potvrdia ako nového veliteľa flotily a plavba pokračuje pod jeho velením." # todo: NEW TRANSLATION # todo: COUNTRY CASE
 expedition_succession_events.2.a: "Nech sa tak stane. Flotila pokračuje v plavbe." # todo: NEW TRANSLATION
 expedition_succession_events.generic_new_leader_tt: "[target.GetName] preberá velenie nad výpravou" # todo: NEW TRANSLATION
 expedition_succession_events.3.title: "Velenie prechádza na ďalšieho" # todo: NEW TRANSLATION
 expedition_succession_events.3.desc: "Správa, ktorú domov priniesla posledná vracajúca sa loď, oznamuje, že [former_leader.GetName], ktorý viedol výpravu, zomrel v teréne. Skupina nečakala na pokyny; kým list zapečatili, tí, čo prežili, už medzi sebou rozhodli, ako to ľudia ďaleko od akéhokoľvek dvora zvyknú robiť.\n\n[target.GetName] prevzal velenie a výprava pokračuje." # todo: NEW TRANSLATION
 expedition_succession_events.3.a: "Dielo je väčšie než ktorýkoľvek človek." # todo: NEW TRANSLATION

 pacific_crossing_cargo_loaded_effect: "Naloží sa náklad [ShowGoodsName('silk')], [ShowGoodsName('porcelain')] a korenín, ktorý sa predá po návrate flotily domov." # todo: NEW TRANSLATION
 pacific_crossing_events.1.title: "Cesta domov" # todo: NEW TRANSLATION
 pacific_crossing_events.1.desc: "Úlohou nie je iba dostať sa do [ShowContinentName('asia')] — lode tam už doplávali, unášané na západ pasátmi ako lístok na prúde. Úlohou je vrátiť sa. Kolónia na vzdialenom pobreží tohto oceánu nemá cenu, ak k nej flotila dokáže doplávať, no nikdy sa nevráti; celý podnik závisí od nájdenia spoľahlivej cesty domov, po ktorej môže loď plávať rok čo rok, s [ShowGoodsName('silver')] na ceste tam a [ShowGoodsName('silk')] na ceste späť.\n\nVietor na cestu na západ je známy a stály. Čo leží ďalej a či oceán vôbec poskytne flotile cestu späť, to nedokáže povedať žiadna mapa v tomto prístave. Piloti si sú istí iba jednou vecou: cesta tam nebude cestou domov." # todo: NEW TRANSLATION
 pacific_crossing_events.1.a: "Vybavme väčšiu flotilu, pridajme loď na prieskum." # todo: NEW TRANSLATION
 pacific_crossing_events.1.a.tt: "Vybavili sme ďalšiu loď a pridali ju k flotile (#G +1#! Lode)" # todo: NEW TRANSLATION
 pacific_crossing_events.1.b: "Zabezpečme zásoby na plavbu; so zvyškom nech nám pomôže šťastena." # todo: NEW TRANSLATION
 pacific_crossing_events.1.c: "[target_leader.GetNameWithNoTooltip] zakreslí každý vietor a prúd, ktorým preplávame." # todo: NEW TRANSLATION
 pacific_crossing_events.1.historical_info: "Návrat na východ — #italic tornaviaje#! — bol veľkým nevyriešeným problémom raného Tichomoria. Álvara de Saavedru, ktorý vyplával z Nového Španielska, v rokoch 1528 a 1529 dvakrát zahnali pasáty späť a pri pokuse zahynul; výprava Ruya Lópeza de Villalobosa v roku 1542 takisto dorazila do Ázie, ale cestu domov nenašla. Spoľahlivú spiatočnú trasu objavili až v roku 1565. Dovtedy mohla flotila doplávať do Ázie, no nikdy odtiaľ nemohla priviezť svoj náklad späť." # todo: NEW TRANSLATION
 pacific_crossing_events.2.title: "Ostrovy zlodejov" # todo: NEW TRANSLATION
 pacific_crossing_events.2.desc: "Týždne samého mora a oblohy sa končia, keď vyhliadka zvolá: zem na dohľade — nízky zelený ostrov lemovaný bielym príbojom. Skôr než flotila stihne zakotviť, ženú sa k nej kanoe — štíhle plavidlá s výložníkmi a trojuholníkovými plachtami, preskakujúce z vlny na vlnu tak rýchlo, že piloti len stoja a neveriacky hľadia. Ostrovania sa so smiechom a bez strachu vyštverajú na paluby a odnesú všetko, čo nie je priviazané. Pre nich nie je krádežou vziať si, čo leží bez majiteľa; pre mužov vyhladovaných po mesiaci na mori je to provokácia.\n\nNo je tu sladká voda, ovocie aj ryby — stačí si ich vziať, tak či onak." # todo: NEW TRANSLATION
 pacific_crossing_events.2.a: "Vymeňme korálky, [ShowGoodsNameWithNoTooltip('cloth')] a [ShowGoodsNameWithNoTooltip('iron')] za vodu a ovocie." # todo: NEW TRANSLATION
 pacific_crossing_events.2.b: "Vezmime si násilím, čo lode potrebujú. Nemáme času nazvyš." # todo: NEW TRANSLATION
 pacific_crossing_events.2.fight_win_tt: "Ostrovania sa pred zbraňami lodí rozutekajú a posádka si naberie vody a ovocia, koľko len chce" # todo: NEW TRANSLATION
 pacific_crossing_events.2.fight_lose_tt: "Ostrovania sa bránia urputnejšie, než sme čakali, a posádku zaženú späť k člnom s prázdnymi rukami" # todo: NEW TRANSLATION
 pacific_crossing_events.2.c: "Na vodu zabudnime — zaznamenajme si ich rýchle trupy a plachty." # todo: NEW TRANSLATION
 pacific_crossing_events.2.historical_info: "Dňa 6. marca 1521, po viac ako troch mesiacoch bez toho, aby zazreli pevninu, dorazili preživší z flotily Ferdinanda Magellana na Guam. Čamorovia vyplávali v rýchlych proách s výložníkmi, ktoré kronikár Antonio Pigafetta obdivoval ako rýchlejšie než čokoľvek, na čom sa plavili Španieli. Keď ostrovania vzali jednu z lodných lodiek, Magellan nazval súostrovie #italic Islas de los Ladrones#! — Ostrovy zlodejov — a pred pokračovaním na Filipíny sa vylodil v sile, aby doplnil zásoby." # todo: NEW TRANSLATION
 pacific_crossing_events.3.title: "Štyridsať dní ničoho" # todo: NEW TRANSLATION
 pacific_crossing_events.3.desc: "Žiadna zem, žiadne vtáky, dokonca ani steblo morskej riasy plávajúce na hladine. Posádka je na mori už celé týždne a pilotova sebadôvera s každým ďalším dňom slabne. Mužom krvácajú ďasná a kývajú sa im zuby; jeden prisahá, že sa mu znovu otvorila stará rana, ktorá sa zahojila pred rokmi. Sudy s vodou sú takmer prázdne a v suchároch je viac červíkov než múky. Vietor je priaznivý, stály a chladný, no nesie ich čoraz hlbšie do oceánu, ktorý nejaví známky toho, že by sa niekedy skončil.\n\nKapitán si zachováva pokojný výraz aj vyrovnaný hlas, značí dni do mapy a nehovorí ničomu, čomu sám neverí." # todo: NEW TRANSLATION
 pacific_crossing_events.3.a: "Znížme prídel. Vydržíme, čo bude treba." # todo: NEW TRANSLATION
 pacific_crossing_events.3.b: "Kurz je správny. Zem je pred nami — držme sa kurzu." # todo: NEW TRANSLATION
 pacific_crossing_events.3.c: "Udržme mužov na uzde, kapitánovo slovo je zákon!" # todo: NEW TRANSLATION
 pacific_crossing_events.4.title: "Zem za západným morom" # todo: NEW TRANSLATION
 pacific_crossing_events.4.desc: "Dlho po opustení Ostrovov zlodejov zazrie vyhliadka cez ranný opar zelené kopce. Keď flotila vpláva do veľkej zátoky, je jasné, že toto pobrežie nie je opustené. Osada s nabielenými múrmi a strechami z palmového lístia sa rozprestiera na svahu nad vodou. Kanoe s výložníkmi sa vydávajú k lodiam, s mužmi v pestrých látkach, ktorí nepôsobia znepokojene.\n\nNajvznešenejší z nich má na hrdle zlato, hovorí jazykom [location.GetDominantCulture.GetLanguage.GetName], ktorému žiaden z pilotov nerozumie, a nenútene ukazuje na pobrežie — ako človek, ktorý často obchoduje s cudzincami. Tieto ostrovy majú svoj vlastný svet — a už teraz cez ne prúdi [ShowGoodsName('silk')] a [ShowGoodsName('porcelain')] zo vzdialenej Katai." # todo: NEW TRANSLATION
 pacific_crossing_events.4.desc.owned: "Dlho po opustení Ostrovov zlodejov zazrie vyhliadka cez ranný opar zelené kopce — a potom nad osadou na svahu celkom zreteľne zavlajú naše vlastné zástavy. Flotila nenarazila na neznáme pobrežie, ale vplávala do nášho prístavu: [pacific_colony.GetName], majetku našej koruny, ktorého prístaviská a sklady už pracujú.\n\nLode im vyplávajú v ústrety s krajanmi na palube, prekvapenými, že flotila priplávala z prázdneho oceánu na východe. Posádky tu môžu bezpečne nabrať vodu a zásoby a naložiť [ShowGoodsName('silk')] a [ShowGoodsName('porcelain')], ktoré čínski obchodníci privážajú do našich prístavov." # todo: NEW TRANSLATION
 pacific_crossing_events.4.desc.hostile: "Dlho po opustení Ostrovov zlodejov zazrie vyhliadka cez ranný opar zelené kopce — a potom zástavu, ktorá nie je naša, vejúcu nad palisádou na brehu. Na tieto ostrovy dorazila ako prvá iná mocnosť. Keď flotila vpláva do zátoky, [pacific_rival_shore.GetName] na ňu namieri delá z hradieb a ozbrojené člny vyrazia k lodiam, aby sa dožadovali vysvetlenia ich príchodu.\n\nToto územie teraz patrí [pacific_rival.GetName] a prijatie bude prinajlepšom obozretné. Hodváb a porcelán z Katai stále prúdia cez súostrovie — ale cez ruky rivala, nie voľne k nám." # todo: NEW TRANSLATION
 pacific_crossing_events.4.a: "Začnime obchodovať s [ShowGoodsNameFlat('silk')] a [ShowGoodsNameFlat('porcelain')], ktoré tadiaľto prúdia." # todo: NEW TRANSLATION
 pacific_crossing_events.4.b: "Vyplienime osadu — vodu a zásoby si vezmeme násilím." # todo: NEW TRANSLATION
 pacific_crossing_events.4.b.raid_win_tt: "Dedina sa vyľudní a posádky vyrabujú zásoby jedla a vody" # todo: NEW TRANSLATION
 pacific_crossing_events.4.b.raid_lose_tt: "Dedinské obyvateľstvo bojuje za svoje domovy a zaženie nájazdníkov späť k člnom s prázdnymi rukami a krvavými ranami" # todo: NEW TRANSLATION
 pacific_crossing_events.4.d: "Naložme sezónny tovar z vlastných skladov." # todo: NEW TRANSLATION
 pacific_crossing_events.4.e: "Doprajme posádkam odpočinok a opravme lode v našom prístave." # todo: NEW TRANSLATION
 pacific_crossing_events.4.f: "Obchodujme opatrne so zástupcami rivala a pod dohľadom jeho diel." # todo: NEW TRANSLATION
 pacific_crossing_events.4.g: "Vynúťme si prístup do prístavu a zbraňami si vezmime, čo potrebujeme." # todo: NEW TRANSLATION
 pacific_crossing_events.4.h: "Držme sa ďaleko od ich diel a pokračujme v plavbe." # todo: NEW TRANSLATION
 pacific_crossing_events.4.raid_win_tt: "Základňa padne útokom a jej zásoby odvezieme; posádky oslavujú víťazstvo" # todo: NEW TRANSLATION
 pacific_crossing_events.4.raid_lose_tt: "Útok odrazia s ťažkými stratami a poškodenú loď musíme opustiť" # todo: NEW TRANSLATION
 pacific_crossing_events.4.historical_info: "Ruy López de Villalobos pri plavbe z Nového Španielska v roku 1542 nazval súostrovie #italic Las Islas Filipinas#! po dedičovi španielskeho trónu, budúcom Filipovi II. Trvalá španielska prítomnosť sa začala až v roku 1565, keď Miguel López de Legazpi založil prvú osadu na Cebu; v roku 1571 dobyl Manilu od rádžu Sulajmana a urobil z nej hlavné mesto Španielskej východnej Indie a západný koniec obchodu s galeónami." # todo: NEW TRANSLATION
 pacific_crossing_events.5.title: "Ostrov klinčekov" # todo: NEW TRANSLATION
 pacific_crossing_events.5.desc: "Vôňa dorazí k flotile skôr než samotný ostrov — sladká, ťažká a ostrá vôňa korenia vo vetre. Osamelý sopečný vrchol s oblakom nad sebou, zelený až po okraj vody. Prístav je plný malajských a jávskych proí a palác [target_owner.Custom('GetRulerOrRegentTitle')] z [target_owner.GetName] je jasne viditeľný z kotviska.\n\nKaždý obchodník v [ShowLocationName('lisbon')] a [ShowLocationName('sevilla')] platí za túto vôňu celé imanie, hoci vôbec netuší, odkiaľ pochádza. Nikto z tejto flotily ešte nikdy nestál tak blízko jej zdroja — na svahoch nad zátokou rastú stromy obsypané nezrelými [ShowGoodsName('cloves')], pričom jediný náklad z nich má väčšiu cenu než celá plavba. Nákladné priestory sa tu môžu naplniť. Zostáva už len priviezť náklad domov." # todo: NEW TRANSLATION
 pacific_crossing_events.5.desc_known: "Vôňa dorazí k flotile skôr než samotný ostrov — sladká, ťažká a ostrá vôňa korenia vo vetre. Osamelý sopečný vrchol s oblakom nad sebou, zelený až po okraj vody. Prístav je plný malajských a jávskych proí a palác [target_owner.Custom('GetRulerOrRegentTitle')] z [target_owner.GetName] je jasne viditeľný z kotviska.\n\nKaždý obchodník v [ShowLocationName('lisbon')] a [ShowLocationName('sevilla')] pozná túto vôňu z druhej ruky a platí za ňu celé imanie. Nikto z tejto flotily ešte nikdy nestál tak blízko jej zdroja — na svahoch nad zátokou rastú stromy obsypané nezrelými [ShowGoodsName('cloves')], pričom jediný náklad z nich má väčšiu cenu než celá plavba. Nákladné priestory sa tu môžu naplniť. Zostáva už len priviezť náklad domov." # todo: NEW TRANSLATION
 pacific_crossing_events.5.desc.no_owner: "Vôňa dorazí k flotile skôr než samotný ostrov: sladká, ťažká a ostrá vôňa korenia vo vetre. Osamelý sopečný vrchol s oblakom nad sebou, zelený až po okraj vody. Prístav je plný malajských a jávskych proí, no žiadna zástava ani palác neoznačuje, kto si nárokuje toto pobrežie.\n\nKaždý obchodník v [ShowLocationName('lisbon')] a [ShowLocationName('sevilla')] platí za túto vôňu celé imanie, hoci vôbec netuší, odkiaľ pochádza. Nikto z tejto flotily ešte nikdy nestál tak blízko jej zdroja: na svahoch nad zátokou rastú stromy obsypané nezrelými [ShowGoodsName('cloves')], pričom jediný náklad z nich má väčšiu cenu než celá plavba. Nákladné priestory sa tu môžu naplniť. Zostáva už len priviezť náklad domov." # todo: NEW TRANSLATION
 pacific_crossing_events.5.desc.driven_back: "Ostrovy korenia sa znovu vynárajú nad prove — ten istý zelený vrchol, to isté preplnené kotvisko — a s nimi prichádza trpké vedomie, že flotilu zahnali naspäť až tam, odkiaľ vyplávala, pričom cestu domov stále nenašla. Pasáty nenechali lodiam na výber a zahnali ich späť k týmto brehom.\n\nKotvenie tu už má pochmúrnu rutinu. Ostrovy opäť poskytnú vodu a jedlo; chorých môžu vylodiť, posádky si oddýchnuť a nákladné priestory doplniť tým, čo lode ešte unesú. Každý muž na palube však vie, čo ich čaká — flotila sa musí znovu pripraviť a vyplávať na more, aby sa pokúsila nájsť cestu domov. Ďalších pokusov už veľa nezostáva." # todo: NEW TRANSLATION
 pacific_crossing_events.5.a: "Naplňme nákladný priestor [ShowGoodsNameWithNoTooltip('cloves')] — naložme každý posledný sud." # todo: NEW TRANSLATION
 pacific_crossing_events.5.b: "Zásobme lode na dlhú plavbu domov." # todo: NEW TRANSLATION
 pacific_crossing_events.5.c: "Nechajme posádky odpočinúť si a zotaviť sa na brehu." # todo: NEW TRANSLATION
 pacific_crossing_events.5.d: "Zanechajme pátranie — domov sa plavme dlhou cestou okolo Mysu." # todo: NEW TRANSLATION
 pacific_crossing_events.5.historical_info: "Portugalskí moreplavci dorazili na Moluky v roku 1512, kde sa Francisco Serrão stal radcom sultána z Ternate. Magellanove lode, ktoré prežili, naložili klinčeky u konkurenčného sultána z Tidore v roku 1521. Spor medzi Španielskom a Portugalskom o ostrovy vyriešila Zaragozská zmluva z roku 1529. Cisár Karol V., ktorému chýbali peniaze, v nej predal španielsky nárok na Moluky Portugalsku za 350 000 dukátov." # todo: NEW TRANSLATION
 pacific_crossing_events.6.title: "Cesta domov" # todo: NEW TRANSLATION
 pacific_crossing_events.6.desc: "Nákladné priestory sú plné a ľahšia polovica plavby je za nami. Teraz musí flotila urobiť jedinú vec, ktorú jej nedokáže ukázať žiadna mapa na palube: nájsť cestu späť cez oceán, ktorý práve preplávala. Vietor, ktorý lode tak jemne niesol na západ, im teraz pri návrate fúka priamo do tváre a každý pilot pri stole vie, čo to znamená.\n\nDôstojníci flotily vysedávajú dlho do noci nad mapami, no piloti sa tentoraz nevedia zhodnúť. Každý presadzuje svoj kurz a má dôvod obávať sa ostatných; za hranicou známeho mora nikto z nich nevie zaručiť, kam ktorá cesta vedie — zostávajú iba dohady a odvaha staviť na ne. Rozhodnutie prináleží samotnému kapitánovi a každá duša na palube bude žiť alebo zomrieť podľa kurzu, ktorý určí." # todo: NEW TRANSLATION
 pacific_crossing_events.6.desc.driven_back: "Dôstojníci flotily sa opäť zišli a nálada pri stole je čoraz horšia. Zvolili si kurz, ale oceán ich zahnal späť; flotila sa sem s námahou dostala iba preto, aby si odniesla toto ponaučenie. Zostávajúce trasy sú stále iba predmetom sporov — nie sú o nič lepšie overené než predtým a teraz na ne môžeme riskovať menej lodí a slabšie posádky.\n\nPiloti už prestali zvyšovať hlas. Každý muž sklonený nad mapou vie, že tento oceán sa nedá znovu a znovu vzdorovať bez následkov. Z týchto vôd treba opäť vyplávať a možností na výber už veľa nezostáva." # todo: NEW TRANSLATION
 pacific_crossing_events.6.a: "Severnou trasou: plavme sa popri ázijskom pobreží a potom na východ." # todo: NEW TRANSLATION
 pacific_crossing_events.6.a.tt: "Vydajte sa na sever popri pobreží [ShowRegionName('japan_region')] a ďalej; potom nech západné vetry vo vysokých zemepisných šírkach prenesú flotilu až do [ShowContinentName('america')] a domov" # todo: NEW TRANSLATION
 pacific_crossing_events.6.b: "Strednou cestou — plavme sa na východ proti pasátom." # todo: NEW TRANSLATION
 pacific_crossing_events.6.b.tt: "Vydajte sa priamo na východ proti pasátom a preplávajte popri starých ostrovoch. Vietor zahnal späť každú flotilu, ktorá sa o to pokúsila — pripravte sa, že vás zaženie až na Ostrovy korenia" # todo: NEW TRANSLATION
 pacific_crossing_events.6.c: "Vzdialenou južnou trasou — obrovským oblúkom, dlhou, no otvorenou cestou." # todo: NEW TRANSLATION
 pacific_crossing_events.6.c.tt: "Vydajte sa ďaleko na juh a potom na východ cez južný oceán posiaty ostrovmi. Tadiaľto možno vedie cesta — je však nesmierne dlhá a zásoby flotily nemusia vydržať až do konca" # todo: NEW TRANSLATION
 pacific_crossing_events.6.historical_info: "Každý pokus plaviť sa z Ázie na východ popri trópoch zlyhal. #italic Trinidad#! Gonzala Gómeza de Espinosu sa v roku 1522 pokúsila vrátiť do Nového Španielska, ale zahnali ju späť a zajali Portugalci; Álvaro de Saavedra zlyhal dvakrát, v rokoch 1528 a 1529. V roku 1565 sa to podarilo augustiniánskemu mníchovi Andrésovi de Urdanetovi, ktorý sa plavil ďaleko na sever — približne do štyridsiatej rovnobežky — aby zachytil Kurošio a západné vetry. Potom sa na nich plavil cez severný Pacifik ku Kalifornii a ďalej na juh do Acapulca. Jeho trasa slúžila manilským galeónam nasledujúce dve a pol storočia." # todo: NEW TRANSLATION
 pacific_crossing_events.7.title: "Mar Pacífico" # todo: NEW TRANSLATION
 pacific_crossing_events.7.desc: "Vietor ustane. Plachty bezvládne visia, more je hladké ako sklo až po všetky obzory a lode nehybne stoja pod bielou, spaľujúcou oblohou. Práve pre takéto bezvetrie dostal oceán meno „pokojné more“ — jeho pokoj však už neraz vyhladoval posádky.\n\nVoda v sudoch sa ohrieva a kazí. Každý deň bez vetra znamená, že sa minul denný prídel bez toho, aby sme urazili čo i len kúsok cesty, a muži si to uvedomujú. Sledujú prázdne lanoví a obzor; už dvakrát zvolali „zem na dohľad“ pri páse oblakov, ktorý sa vzápätí rozplynul. Na lodi bez vetra zriedka zostávajú nečinné ruky dlho nečinnými." # todo: NEW TRANSLATION
 pacific_crossing_events.7.a: "Počkajme a šetrime každou kvapkou i omrvinkou. Vietor sa vráti." # todo: NEW TRANSLATION
 pacific_crossing_events.7.b: "Spusťme člny — ťahajme lode, kým sa nevráti vietor." # todo: NEW TRANSLATION
 pacific_crossing_events.7.c: "Prúd vĺn smeruje na juhovýchod — nechajme sa ním unášať za vetrom." # todo: NEW TRANSLATION
 pacific_crossing_events.8.title: "Návrat galeóny" # todo: NEW TRANSLATION
 pacific_crossing_events.8.desc: "Prenajatá galeóna sa vrátila domov. Po mesiacoch na mori, počas ktorých preplávala dlhým severným oblúkom, vpláva do prístavu nízko ponorená vo vode a ťažká nákladom — bohatstvo z [ShowContinentName('asia')] preplávalo celý oceán a bezpečne dorazilo na breh. Ešte skôr, než spustí kotvu, zaplnia prístavné móla agenti a kupci. Trasa funguje a podnik prináša zisk; budúci rok vypláva ďalšia galeóna a rok po ňom znovu." # todo: NEW TRANSLATION
 pacific_crossing_events.8.a: "Majetok bezpečne dorazil na breh." # todo: NEW TRANSLATION
 pacific_crossing_events.8.historical_info: "Manilská galeóna sa plavila na trase Acapulco – Manila takmer každý rok od roku 1565 až do roku 1815; išlo o jednu z najdlhšie fungujúcich lodných liniek v dejinách. Na západ prepravovala americké striebro a na východ čínsky hodváb, porcelán a korenie; náklad jedinej galeóny mohol jej investorom vyniesť celé imanie. Tento obchod spojil striebro z Ameriky s čínskymi trhmi a premenil Tichý oceán na cestu globálneho obchodu." # todo: NEW TRANSLATION
 pacific_crossing_events.9.title: "Známe pobrežie" # todo: NEW TRANSLATION
 pacific_crossing_events.9.desc: "Dlhá cesta na sever do studených sivých vôd a potom nekonečný oblúk na východ cez prázdny oceán sa končia, keď ho vyhliadka konečne zazrie: vysoké, zalesnené pobrežie s výbežkami, ktoré sa tiahnu na juh pod hradbou hmly. Toto nie je časť [ShowContinentName('asia')] ani žiaden ostrov — je to samotné západné pobrežie [ShowContinentName('america')]. Flotila vyplávala z [ShowContinentName('pacific_ocean_continent')] na blízku stranu sveta a stačí už len plaviť sa na juh popri pobreží, ktoré poznajú mapy, aby dosiahla spriatelený prístav.\n\nCesta domov je nájdená. Zostáva už len doplávať jej posledný úsek." # todo: NEW TRANSLATION
 pacific_crossing_events.9.a: "Plavme sa na juh a domov popri pobreží, ktoré poznáme." # todo: NEW TRANSLATION
 pacific_crossing_events.9.b: "Najprv zakotvime, naberme vodu a odpočiňme si — muži si to zaslúžia." # todo: NEW TRANSLATION
 pacific_crossing_events.9.historical_info: "Andrés de Urdaneta doplával pri spiatočnej ceste v roku 1565 k americkému pobrežiu Kalifornie neďaleko mysu Mendocino, po približne štyroch mesiacoch na otvorenom severnom Pacifiku. Odtiaľ sa #italic San Pedro#! plavila na juh a 8. októbra 1565 dorazila do Acapulca, čím potvrdila existenciu trasy. Severná obchádzka sa stala štandardnou cestou domov pre manilské galeóny." # todo: NEW TRANSLATION
 pacific_crossing_events.10.title: "More sa dvíha" # todo: NEW TRANSLATION
 pacific_crossing_events.10.desc: "Obloha nadobudne farbu modriny a vietor sa priháňa ako stena. Do hodiny bojuje flotila o holý život — vlny sa dvíhajú vyššie než hlavná rahna, cez strednú časť lodí sa valí zelená voda a plátno sa trhá s rachotom ako výstrely z diel. Lode sa namáhavo preklápajú a v šere jedna po druhej strácajú z dohľadu ostatné. Piloti nemôžu robiť nič, len sa držať a odpočítavať hodiny.\n\nNa rozhodovanie niet času: stiahnuť plachty a prečkať búrku tam, kde sa lode práve nachádzajú, alebo sa nechať unášať pred ňou do tmy a dúfať, že trupy vydržia." # todo: NEW TRANSLATION
 pacific_crossing_events.10.a: "Zastavte a prečkajte búrku so stiahnutými plachtami." # todo: NEW TRANSLATION
 pacific_crossing_events.10.b: "Plavte po vetre a modlite sa, nech trup vydrží." # todo: NEW TRANSLATION
 pacific_crossing_events.10.weathered_tt: "Flotila prekoná búrku ošľahaná, ale celá" # todo: NEW TRANSLATION
 pacific_crossing_events.10.foundered_tt: "Loď sa potopí a všetci na palube zahynú" # todo: NEW TRANSLATION
 pacific_crossing_events.11.title: "Nezrelé drevo" # todo: NEW TRANSLATION
 pacific_crossing_events.11.desc: "Lode boli narýchlo postavené v nových lodeniciach na americkom pobreží Tichého oceánu z dreva, ktoré nemalo čas vyschnúť, a stavali ich tesári, ktorí nikdy predtým nestavali lode na oceán, ako je tento. Teraz si more vyberá svoju daň. Uprostred lode sa doska oddeľuje od spoja; tesnenie povoľuje; pod palubou muži stoja v stúpajúcej vode a čerpadlá deň čo deň neúnavne klopú, no hladina neklesá. Tesárova tvár hovorí za všetko.\n\nTakto to ďalej nejde a najbližšia súš je vzdialená na pol oceánu." # todo: NEW TRANSLATION
 pacific_crossing_events.11.a: "Nakloňte najhoršie poškodené lode a poriadne ich opravte." # todo: NEW TRANSLATION
 pacific_crossing_events.11.b: "Striedajte mužov pri čerpadlách a pokračujte za každú cenu." # todo: NEW TRANSLATION
 pacific_crossing_events.11.c: "Opustite poškodený trup a jeho posádku natlačte na ostatné lode." # todo: NEW TRANSLATION
 pacific_crossing_events.12.title: "Dar z mora" # todo: NEW TRANSLATION
 pacific_crossing_events.12.desc: "Začína sa to delfínmi — veľkým húfom, ktorý pred sebou ženie niečo k lodiam. Potom akoby vzplanulo samo more: na hladinu sa vyvalí obrovské húf rýb, celé akre sa striebristo blyštia a varia okolo trupov, obkolesené krúžiacimi delfínmi, až ich množstvo takmer zakrýva vodu.\n\nPosádka nepotrebuje rozkaz. Člny idú cez bok, za nimi laná a siete a muži sa nakláňajú cez zábradlie a po hrstiach vyťahujú ryby na paluby, ktoré sa čoskoro zaplnia úlovkom a sú celé klzké. Po týždňoch suchárov a soleného mäsa je to hostina, nečakaný zisk a milosrdenstvo v jednom." # todo: NEW TRANSLATION
 pacific_crossing_events.12.a: "Spustite všetky člny a siete — vytiahnite, čo len unesiete." # todo: NEW TRANSLATION
 pacific_crossing_events.12.b: "Rýchlo niečo ulovte a potom sa vráťte na kurz." # todo: NEW TRANSLATION
 pacific_crossing_events.13.title: "Pokazené zásoby" # todo: NEW TRANSLATION
 pacific_crossing_events.13.desc: "Správca prichádza za kapitánom s klobúkom v rukách. V podpalubí sa otvorili celé rady sudov a ukázalo sa, že sú zničené — solené mäso bolo nesprávne naložené, sucháre zabalené vlhké a voda v sudoch, ktoré neboli poriadne vysušené, skazila. Zásoby naložené narýchlo a ešte vlhké zapečatené v prístavoch odplávania zhnili v tropickej horúčave. To, čo malo posádku živiť celé týždne, je teraz páchnuca, červami prelezlá strata.\n\nTu niet nijakého trhu ani druhej šance — len pokazené zásoby a hladní muži." # todo: NEW TRANSLATION
 pacific_crossing_events.13.a: "Vyhoďte pokazené zásoby cez palubu a zmierte sa so stratou." # todo: NEW TRANSLATION
 pacific_crossing_events.13.b: "Rozdeľte ich bez ohľadu na všetko — muži zjedia, čo je." # todo: NEW TRANSLATION
 pacific_crossing_events.17.title: "Stratení v mori" # todo: NEW TRANSLATION
 pacific_crossing_events.17.desc: "Keď napokon dorazia správy, sú len útržkovité — meno, dátum, posledný známy kurz. Flotila, ktorá vyplávala hľadať cestu domov, ju nikdy nenašla. Či lode pohltila búrka, zahnala ich na neznámy útes alebo sa len plavili, kým sa neminula voda a s ňou aj muži, to sa už nikto s istotou nedozvie. Oceán si ich ponechal.\n\nCesta domov zostáva neobjavená. Kdesi tam vonku stále fúka vietor nesprávnym smerom." # todo: NEW TRANSLATION
 pacific_crossing_events.17.a: "Nie sú poslední, ktorých nám ten oceán vezme." # todo: NEW TRANSLATION
 pacific_crossing_events.17.end_tt: "Výprava je stratená a jej plavba sa tu končí" # todo: NEW TRANSLATION
 pacific_crossing_events.17.historical_info: "Východný oceán si vyžiadal mnoho obetí spomedzi tých, ktorí sa ho pokúsili prekonať. Veliteľ výpravy García Jofre de Loaísa a moreplavec Juan Sebastián Elcano, ktorý oboplával svet, zomreli na mori počas plavby cez Tichý oceán v roku 1526; Álvaro de Saavedra zahynul uprostred oceánu v roku 1529, keď sa pokúšal o návrat; a Ferdinand Magellan bol zabitý na ostrove Mactan v roku 1521. Z približne 270 mužov, ktorí sa vydali zo Španielska s Magellanom, sa na lodi #italic Victoria#! vrátilo iba osemnásť." # todo: NEW TRANSLATION
 pacific_crossing_events.18.title: "Posádka sa búri" # todo: NEW TRANSLATION
 pacific_crossing_events.18.desc: "Muži toho majú dosť. Skromné prídelové dávky, nekonečný oceán a kurz, za ktorý sa môžu zaručiť iba lodivodi — to všetko podlomilo poslušnosť posádky. Na korme sa zhŕklo niekoľko zamračených a ozbrojených námorníkov a jasne predložili svoju požiadavku: otočte flotilu, alebo to urobia sami. Dôstojníkov je málo a mužov veľa, pričom muškety nemajú v rukách iba jedni.\n\nNech sa teraz rozhodne čokoľvek, flotila za to zaplatí niečím, čo sa nedá ľahko nahradiť." # todo: NEW TRANSLATION
 pacific_crossing_events.18.desc.last_ship: "Muži toho majú dosť. Z flotily zostala jediná loď a na jej preplnenej, páchnucej palube sa dôstojník nemá kam skryť. Vodcovia vzbury prichádzajú na kormu spolu a tentoraz sa nepýtajú — hovoria kapitánovi krutú pravdu o ich situácii: niet inej lode, na ktorú by mohli utiecť, niet námornej pechoty, ktorú by mohli povolať, a všade navôkol je nekonečný oceán. Otočte sa domov, hovoria, alebo vás doň hodíme.\n\nLodivodi stíchli. Kapitán stojí sám pri zábradlí, s morom za chrbtom, a musí odpovedať." # todo: NEW TRANSLATION
 pacific_crossing_events.18.a: "Ustúpte — nechajte vodcov vzbury vziať si loď a vrátiť sa." # todo: NEW TRANSLATION
 pacific_crossing_events.18.b: "Potlačte vzburu silou. Vodcovia nech visia a plavte ďalej." # todo: NEW TRANSLATION
 pacific_crossing_events.18.c: "Pripomeňte im, čo ich čaká doma a kto ich tam vedie." # todo: NEW TRANSLATION
 pacific_crossing_events.18.fight_win_tt: "Vzbura je potlačená a poriadok obnovený (#G +5#! morálka posádky)" # todo: NEW TRANSLATION
 pacific_crossing_events.18.fight_lose_tt: "Boje sa zvrhnú na krviprelievanie a v zmätku príde flotila o loď" # todo: NEW TRANSLATION
 pacific_crossing_events.18.overboard_tt: "Vzbúrenci premôžu dôstojníkov a hodia [target_leader.GetName]a do mora. Plavba sa tu končí" # todo: NEW TRANSLATION
 pacific_crossing_events.19.title: "Opäť Ostrovy zlodejov" # todo: NEW TRANSLATION
 pacific_crossing_events.19.desc: "Flotila sa prebíja na východ proti vetru, no nedokáže si udržať žiadny postup. Napokon sa na prove znovu objavia nízke zelené ostrovy [ShowLocationName('guahan')] — tie isté brehy, ktoré zanechala za sebou po preplávaní oceánu. Proy sa ako predtým kĺžu k lodiam, obozretné a zvedavé, a ich posádky pozorujú cudzincov vracajúcich sa z prázdneho oceánu bez toho, aby niečo dosiahli. Nech sa tu prvý raz stalo čokoľvek, ostrovania si to pamätajú." # todo: NEW TRANSLATION
 pacific_crossing_events.19.desc.friendly: "Flotila sa prebíja na východ proti vetru, no nedokáže si udržať žiadny postup. Napokon sa na prove znovu objavia nízke zelené ostrovy [ShowLocationName('guahan')]. Tentoraz sa proy približujú bez strachu — ostrovania si pamätajú férové zaobchádzanie a medzi nimi sú tváre, ktoré posádky matne spoznávajú. Ponúkajú sa obchodné tovary, vymieňajú sa gestá a prísľub vody a čerstvého jedla je celkom jasný.\n\nFlotila oboje veľmi potrebuje. Zdá sa, že stará dobrá vôľa má v týchto končinách väčšiu cenu než akákoľvek mapa." # todo: NEW TRANSLATION
 pacific_crossing_events.19.desc.hostile: "Flotila sa prebíja na východ proti vetru, no nedokáže si udržať žiadny postup. Napokon sa na prove znovu objavia nízke zelené ostrovy [ShowLocationName('guahan')]. Teraz však priplávalo množstvo pro, z ktorých sa neozýva smiech — ostrovania na nájazd nezabudli a čakali na túto chvíľu. Pozdĺž pobrežia sa ježia oštepy a na kotvisku, kde predtým rozdávali vodu bez okolkov, ju teraz nebude ľahké získať.\n\nFlotila vodu a jedlo potrebuje tak či tak a muži vedia, že si ich budú musieť vziať od ľudí, ktorí sú na nich pripravení." # todo: NEW TRANSLATION
 pacific_crossing_events.19.a: "Znovu obchodujte s ľuďmi, ktorí si nás pamätajú v dobrom." # todo: NEW TRANSLATION
 pacific_crossing_events.19.b: "Vezmite si, čo potrebujeme, skôr než sa stihnú zhromaždiť." # todo: NEW TRANSLATION
 pacific_crossing_events.19.b.win_tt: "Výsadok získa jedlo a vodu skôr, než sa ostrovania stihnú zorganizovať" # todo: NEW TRANSLATION
 pacific_crossing_events.19.b.lose_tt: "Ostrovania sú tentoraz pripravení; nájazdníkov odrazia a spôsobia im straty" # todo: NEW TRANSLATION
 pacific_crossing_events.19.c: "Bez boja naberte, koľko vody sa dá, a pokračujte." # todo: NEW TRANSLATION
 pacific_crossing_events.19.historical_info: "Mariány sa stali pravidelnou zastávkou na doplnenie vody pre lode plaviace sa cez Tichý oceán a vzťahy s Čamorami v priebehu stáročí galeónovej trasy kolísali medzi obozretným obchodom a otvoreným násilím. Flotila, ktorá sa k ostrovanom správala dobre, mohla dúfať v zásoby; tá, ktorá tak nerobila, často našla tie isté brehy uzavreté alebo musela o každý sud vody bojovať." # todo: NEW TRANSLATION
 pacific_crossing_events.20.title: "Nehostinný breh" # todo: NEW TRANSLATION
 pacific_crossing_events.20.desc: "Z nekonečného južného mora sa vynára ďalší ostrov — strmý, zelený a lemovaný útesmi. Je obývaný: zo stromov stúpa dym a z pláže už vyplávajú kanoe preplnené postavami, ktoré majú pomaľované telá a nesú oštepy. Z druhej strany vody k nám dolieha mohutný krik, ktorý môže byť privítaním alebo varovaním. Nikto na palube nevie, čo z toho.\n\nLodivodi toto miesto nikdy nezmapovali a nevedia pomenovať ľudí, ktorí ho ovládajú. Sudy s vodou sú však takmer prázdne a muži hladní, takže obývaný ostrov znamená jedlo — ak sa k nemu dá dostať. To, či tento breh flotilu nakŕmi alebo sa proti nej obráti, závisí od toho, ako sa zahrá nasledujúca hodina." # todo: NEW TRANSLATION
 pacific_crossing_events.20.a: "Držte sa od ostrova ďaleko — tu sa nechceme biť." # todo: NEW TRANSLATION
 pacific_crossing_events.20.b: "Priplávajte bližšie a obchodujte — ponúknite [ShowGoodsNameWithNoTooltip('iron')] a [ShowGoodsNameWithNoTooltip('cloth')] a dúfajte." # todo: NEW TRANSLATION
 pacific_crossing_events.20.trade_ok_tt: "Ostrovania sklopia oštepy a ochotne vymieňajú tovar; člny sa vracajú naložené jedlom a vodou" # todo: NEW TRANSLATION
 pacific_crossing_events.20.trade_ambush_tt: "Vyjednávanie je pasca — kanoe obkľúčia člny a flotila sa musí prebiť do bezpečia za cenu krviprelievania" # todo: NEW TRANSLATION
 pacific_crossing_events.20.c: "Vysadte ozbrojených mužov a vezmite si, čo ostrov ponúka." # todo: NEW TRANSLATION
 pacific_crossing_events.20.raid_win_tt: "Výsadok zaženie ostrovanov do lesa a odnesie ich zásoby" # todo: NEW TRANSLATION
 pacific_crossing_events.20.raid_lose_tt: "Ostrovania bojujú za svoje domovy zúrivo; nájazdníkov pobijú a zaženú späť k člnom" # todo: NEW TRANSLATION
 pacific_crossing_events.21.title: "Zahnaní späť" # todo: NEW TRANSLATION
 pacific_crossing_events.21.desc: "Týždeň čo týždeň sa flotila škriabe na východ a týždeň čo týždeň more zmieta všetko, čo sme získali. Pasát nikdy nepoľavuje ani nemení smer; fúka priamo proti provám ako stena a prúd pod hladinou tečie rovnakým smerom. V noci nesie lode na západ rýchlejšie, než sa cez deň dokážu posunúť na východ. Lodivodi robia merania, porovnávajú ich a stíchnu — čiara na mape sa prestala posúvať dopredu a začala sa vracať späť.\n\nNedá sa s tým nič robiť — nie je to plavba, ale beh na mieste, a každý deň nás stojí vodu a životy bez akéhokoľvek zisku. Zostáva iba trpká možnosť: obrátiť sa, plaviť sa po vetre, ktorý ich porazil, a zaviesť flotilu späť na Ostrovy korenia, kde bude môcť znovu premýšľať." # todo: NEW TRANSLATION
 pacific_crossing_events.21.a: "Toto more sa nedá zdolať." # todo: NEW TRANSLATION
 pacific_crossing_events.22.title: "Žiadosť posádky" # todo: NEW TRANSLATION
 pacific_crossing_events.22.desc: "Zásoby sa každým dňom míňajú rýchlejšie, než pribúdajú míle. Vody je málo a je skazená, sucháre sa rozpadli na prach a každé ráno pribúdajú ďalší chorí. Skupina starších námorníkov prichádza na kormu — ešte sa nebúria, no ich presvedčenie je neochvejné ako počty sudov, ktoré si vedia spočítať. Prepočítali zásoby na celú plavbu a výsledok im nevychádza. Otočte sa, hovoria, kým je v podpalubí dosť zásob na cestu k známemu pobrežiu. Ak budete pokračovať, pochováte flotilu v tomto oceáne.\n\nIch argumenty dávajú zmysel, nech je akokoľvek nepríjemné ich počúvať." # todo: NEW TRANSLATION
 pacific_crossing_events.22.a: "Vypočujte ich a otočte flotilu späť k Ostrovom korenia." # todo: NEW TRANSLATION
 pacific_crossing_events.22.b: "Odmietnite ich. Zašli sme príliš ďaleko, aby sme sa teraz vracali." # todo: NEW TRANSLATION
 pacific_crossing_events.23.title: "Krv na palube" # todo: NEW TRANSLATION
 pacific_crossing_events.23.desc: "Hádka, ktorá sa začala v deň, keď bola žiadosť odmietnutá, nikdy naozaj neutíchla a dnes prerástla do bitky. Lodník verný plavbe si vymieňa urážky so skupinkou mužov, ktorí stále živia odpor za odmietnutie obrátiť sa; urážky prerastú do strkaníc a tie do bitky, ktorá sa rýchlo šíri po palube. Už sa tasí nejedna čepeľ.\n\n[target_leader.GetName] prichádza na miesto a zisťuje, že hliadka sa už pustila do boja pre spor, ktorý v skutočnosti nikdy nebol o lodníkovi." # todo: NEW TRANSLATION
 pacific_crossing_events.23.a: "Zasiahnite a rozdeľte ich." # todo: NEW TRANSLATION
 pacific_crossing_events.23.b: "Hoďte vodcu vzbury cez palubu a skoncujte s tým." # todo: NEW TRANSLATION
 pacific_crossing_events.23.c: "Vypočujte ich a otočte flotilu späť k Ostrovom korenia." # todo: NEW TRANSLATION
 pacific_crossing_events.23.break_up_win_tt: "Bitku sa podarí ukončiť skôr, než dôjde k skutočnému krviprelievaniu" # todo: NEW TRANSLATION
 pacific_crossing_events.23.break_up_lose_tt: "Bitka sa zvrhne na krviprelievanie skôr, než sa podarí obnoviť poriadok" # todo: NEW TRANSLATION
 pacific_crossing_events.23.overboard_tt: "Vodcu vzbury chytia a bez okolkov hodia do mora. Posádka to sleduje v chladnom tichu" # todo: NEW TRANSLATION
 pacific_crossing_events.24.title: "Požiar na mori" # todo: NEW TRANSLATION
 pacific_crossing_events.24.desc: "Zo zadnej časti flotily sa ozve výkrik: jedna z ostatných lodí horí. Ďalšia hádka o návrate domov skončila v zmätku prevrhnutím lampáša a oheň už šľahá po takeláži rýchlejšie, než sa dajú naplniť vedrá. Vietor nesie iskry smerom k zvyšku flotily.\n\n[target_leader.GetName] sa musí rýchlo rozhodnúť, či sa priblíži a pomôže s hasením, alebo sa bude držať ďalej a nechá horiacu loď napospas osudu." # todo: NEW TRANSLATION
 pacific_crossing_events.24.a: "Pristavte svoju loď a pomôžte s hasením." # todo: NEW TRANSLATION
 pacific_crossing_events.24.b: "Držte sa ďalej a nechajte ich hasiť osamote." # todo: NEW TRANSLATION
 pacific_crossing_events.24.saved_tt: "Posily zaženú plamene skôr, než sa stihnú rozšíriť" # todo: NEW TRANSLATION
 pacific_crossing_events.24.caught_fire_tt: "Iskry preskočia na vašu loď a tá tiež vzplanie" # todo: NEW TRANSLATION
 pacific_crossing_events.24.distance_tt: "Druhá loď zhorí až po čiaru ponoru, zatiaľ čo flotila to sleduje z bezpečnej vzdialenosti" # todo: NEW TRANSLATION
 pacific_crossing_events.25.title: "Vzbura na palube" # todo: NEW TRANSLATION
 pacific_crossing_events.25.desc: "[target_leader.GetName] dostáva signál z jednej z ostatných lodí: tamojšia posádka povstala proti dôstojníkom a tá istá hádka o návrate sa zmenila na otvorenú vzburu. Verní muži sa zabarikádovali pod palubou, zatiaľ čo vzbúrenci sa dohadujú, čo ďalej. Na rozhodnutie, či zasiahnuť, je málo času.\n\nČln spustený na vodu môže ešte zvrátiť situáciu na palube druhej lode, alebo vzbúrencom len ponúkne ďalšiu korisť." # todo: NEW TRANSLATION
 pacific_crossing_events.25.a: "Prejdite na loď a podporte vernú posádku." # todo: NEW TRANSLATION
 pacific_crossing_events.25.b: "Držte sa ďalej a nechajte ich, nech si to vyriešia sami." # todo: NEW TRANSLATION
 pacific_crossing_events.25.c: "Vypočujte ich a otočte flotilu späť k Ostrovom korenia." # todo: NEW TRANSLATION
 pacific_crossing_events.25.loyal_win_tt: "Vernosť zvíťazí a na palube sa obnoví poriadok" # todo: NEW TRANSLATION
 pacific_crossing_events.25.loyal_lose_tt: "Vzbúrenci premôžu výsadok a zmocnia sa lode" # todo: NEW TRANSLATION
 pacific_crossing_events.25.distance_tt: "Vzbúrenci odplávajú s loďou skôr, než sa dá čokoľvek podniknúť" # todo: NEW TRANSLATION
 pacific_crossing_events.26.title: "Opätovná žiadosť" # todo: NEW TRANSLATION
 pacific_crossing_events.26.desc: "Delegácia sa vracia, tentoraz pokojnejšia, no rovnako odhodlaná. Nevyhrážajú sa ani nezvyšujú hlas; jednoducho zopakujú rovnaké počty ako predtým, len sú o čosi pochmúrnejšie po všetkých dňoch, ktoré uplynuli od posledného odmietnutia. Niekoľko drobných ústupkov by mohlo priniesť pokoj v podpalubí, ak je [target_leader.GetName] ochotný ich urobiť.\n\nAlebo môže odpoveď znieť rovnako ako naposledy a žiadosť sa môže vrátiť do podpalubia bez výsledku." # todo: NEW TRANSLATION
 pacific_crossing_events.26.a: "Vypočujte ich a urobte niekoľko drobných ústupkov." # todo: NEW TRANSLATION
 pacific_crossing_events.26.b: "Znovu ich odbite a pokračujte v plavbe." # todo: NEW TRANSLATION
 pacific_crossing_events.27.title: "Sabotáž v noci" # todo: NEW TRANSLATION
 pacific_crossing_events.27.desc: "V noci niekto zasiahol do zásob: sud s vodou rozbil a jednu cievku lanovia prerezal napoly. Maličkosti, no ich zámer je jasný. Ten, kto chce ukončiť túto plavbu, sa rozhodol, že slová už nestačia. [target_leader.GetName] môže nariadiť dôkladné pátranie po vinníkovi alebo jednoducho zdvojnásobiť hliadky a pokračovať bez vyšetrovania.\n\nTak či onak, posolstvo bolo pochopené." # todo: NEW TRANSLATION
 pacific_crossing_events.27.a: "Vyšetrite to a nájdite vinníka." # todo: NEW TRANSLATION
 pacific_crossing_events.27.b: "Zdvojnásobte hliadky a pokračujte bez odpovedí." # todo: NEW TRANSLATION
 pacific_crossing_events.27.culprit_found_tt: "Vinníka nájdu a pred celou posádkou z neho urobia odstrašujúci príklad" # todo: NEW TRANSLATION
 pacific_crossing_events.27.culprit_free_tt: "Pátranie nič neprinesie a sabotér udrie znova skôr, než sa vyšetrovanie ukončí" # todo: NEW TRANSLATION
 pacific_crossing_events.27.no_investigation_tt: "Hliadky sú zdvojnásobené, ale škody na zásobách už vznikli" # todo: NEW TRANSLATION

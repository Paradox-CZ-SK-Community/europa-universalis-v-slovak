 grand_tour_events.1.title: "Veľká cesta" # todo: NEW TRANSLATION
 grand_tour_events.1.desc: "[ROOT.GetCountry.GetGovernment.GetCourtTitle] je zhromaždený, truhlice sú zbalené a sprievod sa vydáva na cestu na juh. Čaká nás [ShowRegionName('italy_region')]: krajina starovekých ruín, učenosti [ShowInstitutionName('renaissance')] a dvorov, ktorých politické umenie robí zo severu nedospelý kraj. Čokoľvek sa tam náš [ROOT.GetCountry.GetGovernment.GetHeirTitle] naučí, bude formovať túto ríšu po celé pokolenie. Jedinou otázkou je, aké vzdelanie chceme poskytnúť [target_leader.GetHerHim]." # todo: NEW TRANSLATION
 grand_tour_events.1.a: "Jeho dvory naučia [target_leader.GetHerHim] to, čo knihy nedokážu." # todo: NEW TRANSLATION
 grand_tour_events.1.party: "Minúť peniaze na poslednú noc radovánok pred cestou." # todo: NEW TRANSLATION
 grand_tour_events.2.desc.geography_intro: "[target_location.GetName] je [target_location.GetRank.GetName], ktoré sa zámerne vzpiera geografii: stojí na bahne, pláva na obchode a spravuje ho rada kupeckých rodín, ktoré prežili každú dynastiu v [ShowContinentName('europe')]." # todo: NEW TRANSLATION
 grand_tour_events.2.desc.ducal_palace: "Zatiaľ čo honosný vojvodský palác sa ružovo týči nad lagúnou a všetkým na obdiv vystavuje svoju vycibrenosť a luxus." # todo: NEW TRANSLATION
 grand_tour_events.2.desc.heir_arrival: "Náš [ROOT.GetCountry.GetGovernment.GetHeirTitle] dorazil azda do najkozmopolitnejšieho [target_location.GetRank.GetNameWithNoTooltip] v [ShowContinentNameWithNoTooltip('europe')], kde sa na trhoch hovorí všetkými jazykmi Stredozemného mora a za správnu cenu možno kúpiť každý druh informácií." # todo: NEW TRANSLATION
 grand_tour_events.2.title: "[target_location.GetNameWithNoTooltip], Serenissima" # todo: NEW TRANSLATION
 grand_tour_events.2.desc: "$grand_tour_events.2.desc.geography_intro$ [ShowBuildingTypeName('venetian_arsenal')], rozprestierajúci sa vo východnej štvrti, dokáže položiť kýl vojnovej lode a dokončiť ju za jediný pracovný deň. $grand_tour_events.2.desc.ducal_palace$\n\n$grand_tour_events.2.desc.heir_arrival$" # todo: NEW TRANSLATION
 grand_tour_events.2.desc.no_arsenal: "$grand_tour_events.2.desc.geography_intro$ Východnú štvrť lemujú obyčajné lodenice, ktoré stavajú obchodné lode a vojnové galéry obvyklým pomalým tempom každého prístavu v [ShowContinentNameWithNoTooltip('europe')]. $grand_tour_events.2.desc.ducal_palace$\n\n$grand_tour_events.2.desc.heir_arrival$" # todo: NEW TRANSLATION
 grand_tour_events.2.knowledge: "Študovať námorné inžinierstvo v [ShowBuildingTypeNameWithNoTooltip('venetian_arsenal')]." # todo: NEW TRANSLATION
 grand_tour_events.2.experience: "Navštíviť lodenice, v ktorých sa stavajú vojnové galéry [target_location.GetNameWithNoTooltip]." # todo: NEW TRANSLATION
 grand_tour_events.2.connections: "Zúčastniť sa na recepcii, ktorú usporiadal [court_host.GetNameWithNoTooltip]." # todo: NEW TRANSLATION
 grand_tour_events.2.party: "Vymeniť účtovné knihy za noc medzi veselými návštevníkmi kanálov." # todo: NEW TRANSLATION
 grand_tour_events.2.historical_info: "Počas týždňa Nanebovstúpenia Pána v roku 1645 navštívil anglický džentlmen John Evelyn, ktorý práve podnikal svoju vlastnú dlhšiu cestu po Francúzsku a Taliansku, predstavenie opery #italic Ercole in Lidia#! v jednom z verejných divadiel v Benátkach. Vo svojom denníku obdivuje scénu, ktorá sa zmenila trinásťkrát, a vyzdvihuje sopranistku Annu Renziovú, hoci za ešte lepšieho považoval kastráta a janovského basistu označil za „neporovnateľného“. Medzi maľovanými perspektívami a lietajúcimi strojmi nás predstavenie „držalo očami i ušami až do druhej ráno“. Nasledujúcu jar opustil Benátky s truhlicami plnými kníh, grafík a nádobiek so slávnou mestskou treškou." # todo: NEW TRANSLATION
 grand_tour_events.3.title: "[target_location.GetNameWithNoTooltip], [target_location.GetRank.GetNameWithNoTooltip] [ShowInstitutionNameWithNoTooltip('renaissance')]" # todo: NEW TRANSLATION
 grand_tour_events.3.desc: "[target_location.GetName] je menšie, než naznačuje jeho povesť, a podivnejšie. [target_location.GetRank.GetName] prekypuje novými myšlienkami: filozofi v ňom vidia znovuzrodenie antiky, kupci výhodný obchod a maliari spôsob, akým svetlo dopadá na omietku. Náš [ROOT.GetCountry.GetGovernment.GetHeirTitle] prichádza a zisťuje, že dvor dnes večer prijme zahraničných hostí, ak [target_leader.GetSheHe] nebude príliš unavený z cesty.\n\nSamostatne prišla aj pozvánka do kláštornej knižnice, kde v tichosti čaká najpozoruhodnejšia zbierka rukopisov v [ShowCultureName('greek_culture')] v celom západnom kresťanstve." # todo: NEW TRANSLATION
 grand_tour_events.3.knowledge: "Získať odporúčanie k učencom v kláštore." # todo: NEW TRANSLATION
 grand_tour_events.3.experience: "Navštíviť dielne [ShowGoodsNameWithNoTooltip('wool')] a zlatníkov na Ponte Vecchio." # todo: NEW TRANSLATION
 grand_tour_events.3.connections: "Naučiť sa umeniu mecenášstva na dvore [court_host.GetNameWithNoTooltip]." # todo: NEW TRANSLATION
 grand_tour_events.3.party: "Odložiť rukopisy a venovať sa hazardu pri herných stoloch v [target_location.GetNameWithNoTooltip]." # todo: NEW TRANSLATION
 grand_tour_events.3.historical_info: "Na jeseň roku 1764 navštívil chorľavý škótsky románopisec Tobias Smollett galériu Uffizi a pred sochou Venuše Medicejskej, ktorú všetci ostatní účastníci veľkej cesty chválili ako samozrejmosť, napísal: „Nemôžem sa ubrániť dojmu, že Venušina tvár nie je vôbec krásna a jej postoj je nemotorný a nepatričný.“ Laurence Sterne neskôr tento výbuch zvečnil: jeho fiktívny Yorick sa pred rímskym Panteónom pustí do „Smelfungusa“ a sťažuje sa, že „sa oboril na bohyňu a zaobchádzal s ňou horšie než s obyčajnou pobehlicou, hoci mu na to nedala najmenší dôvod“. Ich spor o jedinú mramorovú Venušu prežil oboch." # todo: NEW TRANSLATION
 grand_tour_events.4.title: "[target_location.GetNameWithNoTooltip], Večné mesto" # todo: NEW TRANSLATION
 grand_tour_events.4.desc: "[target_location.GetName] existuje v dvoch časoch naraz. Fórum leží odkryté pod zimnou trávou a jeho stĺpy stoja v zvláštnych uhloch uprostred pastvín; mramor z neho ťažili všetci stavitelia, ktorí ho za uplynulých tisíc rokov potrebovali. Nad tým všetkým sa týči kostol, ktorý má slúžiť ako sídlo celého kresťanstva, a čnie nad srdcom moderného [target_location.GetRank.GetName].\n\n[target_leader.GetName] môže tráviť [target_leader.GetHisHer] čas medzi ruinami alebo medzi živými. Pápežský dvor je starobylý, obradný a spojený s každým [ShowReligionAdjective('catholic')] trónom v [ShowContinentName('europe')]." # todo: NEW TRANSLATION
 grand_tour_events.4.knowledge: "Preskúmať rukopisy a humanistov vo Vatikánskej knižnici." # todo: NEW TRANSLATION
 grand_tour_events.4.experience: "Prechádzať sa medzi starovekými ruinami a merať pamiatky." # todo: NEW TRANSLATION
 grand_tour_events.4.connections: "$grand_tour_events.seek_audience$" # todo: NEW TRANSLATION
 grand_tour_events.4.party: "Opustiť ruiny a stráviť noc vo vinárňach v [target_location.GetNameWithNoTooltip]." # todo: NEW TRANSLATION
 grand_tour_events.4.historical_info: "15. októbra 1764 sedel anglický džentlmen Edward Gibbon, ktorý práve dokončoval svoju vlastnú veľkú cestu po Taliansku, uprostred ruín na Kapitole a premýšľal, zatiaľ čo bosí mnísi spievali vešpery v tom, čo považoval za starý Jupiterov chrám. Neskôr vo svojich pamätiach napísal, že práve tam, medzi rozbitými stĺpmi a doznievajúcim večerným spevom, „mi prvýkrát zišla na um myšlienka napísať o úpadku a páde mesta“. Myšlienka, ktorú si odniesol z jediného rímskeho večera, sa počas nasledujúcich dvadsiatich rokov štúdia v Anglicku rozrástla na dielo #italic Dejiny úpadku a pádu Rímskej ríše#!." # todo: NEW TRANSLATION
 grand_tour_events.5.title: "[target_location.GetNameWithNoTooltip], [target_country.GetLongNameWithNoTooltip]" # todo: NEW TRANSLATION
 grand_tour_events.5.desc: "[target_location.GetName] je najjužnejším bodom cesty a najstarším z veľkých dvorov [ShowCultureGroupName('italian_group')], [target_location.GetRank.GetName] s miliónom obyvateľov, rozprestierajúce sa v tieni Vezuvu. Jeho dejiny sa vrstvili jedna na druhú: [ShowCultureName('greek_culture')], [ShowCultureName('roman_culture')], [ShowCultureName('norman')] a ešte novší vládcovia; každé dobytie je viditeľné v architektúre, ak človek vie, kam sa pozerať. [target_country.GetGovernment.GetAdjective] [target_country.GetGovernment.GetCourtTitle] prijíma návštevníkov s obradnosťou, pri ktorej dvory severnej [ShowContinentName('europe')] pôsobia provizórne.\n\nNáš [ROOT.GetCountry.GetGovernment.GetHeirTitle] už videl [ShowLocationName('venice')], [ShowLocationName('florence')] a [ShowLocationName('rome')]. Toto je posledná lekcia." # todo: NEW TRANSLATION
 grand_tour_events.5.knowledge: "Stráviť posledné týždne v knižniciach a medzi ruinami." # todo: NEW TRANSLATION
 grand_tour_events.5.experience: "Pridať sa k vykopávkam, ktoré odkrývajú zasypané Herculaneum." # todo: NEW TRANSLATION
 grand_tour_events.5.connections: "Stráviť posledné týždne na dvore [court_host.GetNameWithNoTooltip]." # todo: NEW TRANSLATION
 grand_tour_events.5.party: "Vymeniť lekcie za poslednú noc v krčmách v [target_location.GetNameWithNoTooltip]." # todo: NEW TRANSLATION
 grand_tour_events.5.historical_info: "V januári 1786 vystúpila Hester Piozziová na Vezuv, priviazaná lanom k sprievodcovi Bartolomeovi, „kyklopovi Vezuvu“, a cestou si odpočinula pri pustovníkovej cele. Pustovník, Francúz, ju zrazu spoznal: „Vari som vás už niekedy nevidel, pani? Ale áno, iste som vás videl a aj som vás česal, keď som bol kaderníkom v Londýne.“ Keď zistila, že štvorročný chlapec z jej sprievodu už dosiahol okraj krátera, zahanbila sa a pokračovala ďalej, aby na vlastné oči uzrela dymiaci vrchol. Celé stretnutie zaznamenala vo svojich vydaných cestovných listoch." # todo: NEW TRANSLATION
 grand_tour_events.6.title: "[target_location.GetNameWithNoTooltip], mesto starovekej arény" # todo: NEW TRANSLATION
 grand_tour_events.6.desc: "[target_location.GetName] sa rozprestiera v zákrute rieky a jeho [target_location.GetRank.GetName] vyrástlo v dlhom tieni amfiteátra, staršieho než ktorýkoľvek dvor v [ShowRegionName('italy_region')]. Rímska aréna dodnes stojí takmer neporušená a jej kamenné stupne sa týčia nad strechami. Konajú sa v nej trhy a jarmoky a počas vzácnych slávnostných dní aj niečo, čo sa podobá hrám, na ktoré bola postavená.\n\nNachádzajú sa tu prednáškové sály aj ruiny a dvor túžiaci prijať návštevníckeho [ROOT.GetCountry.GetGovernment.GetHeirTitle]." # todo: NEW TRANSLATION
 grand_tour_events.6.knowledge: "Študovať rímske ruiny a staroveké stavebné umenie arény." # todo: NEW TRANSLATION
 grand_tour_events.6.experience: "Navštíviť lomy na [ShowGoodsNameWithNoTooltip('marble')] a obchodné trasy na rieke Adige." # todo: NEW TRANSLATION
 grand_tour_events.6.connections: "Navštíviť [court_host.GetNameWithNoTooltip] a popredné rody [target_location.GetRank.GetNameWithNoTooltip]." # todo: NEW TRANSLATION
 grand_tour_events.6.party: "Vynechať amfiteáter a stráviť noc v krčmách pod ním." # todo: NEW TRANSLATION
 grand_tour_events.6.historical_info: "Keď Hester Piozziová v apríli 1785 dorazila do Verony, pri pohľade na zachovaný rímsky amfiteáter pocítila, ako sa jej srdce „citeľne rozšírilo“, a neskôr mesto nazvala „najveselšie vyzerajúcim mestom, v akom som kedy žila“. Sprievodca, ktorý jej ukazoval starožitnosti Filharmonickej akadémie, ju uisťoval, že slávne arundelské mramory v Anglicku už dávno zničil uhoľný dym, až kým nespoznala doslovnú citáciu z príručky #italic Verona illustrata#!, ktorú sa naučil naspamäť. Vo svojom vydanom cestopise označila tento podvod za „malafede a veľmi smiešny predsudok“." # todo: NEW TRANSLATION
 grand_tour_events.7.title: "[target_location.GetNameWithNoTooltip], ideálne mesto" # todo: NEW TRANSLATION
 grand_tour_events.7.desc: "[target_location.GetName] nepôsobí ako náhoda, pretože ňou nie je. Široké, rovné ulice pretínajú [target_location.GetRank.GetName] v usporiadaní, ktoré by žiadne stredoveké mesto nevytvorilo náhodou. Zámerne bolo navrhnuté tak, aby sa v ňom nielen žilo, ale aj aby sa obdivovalo. Vojvodské divadlo, tlačiarne aj básnici zdržiavajúci sa na dvore slúžia tej istej ambícii: ukázať toto malé [target_location.GetRank.GetNameWithNoTooltip] ako budúcnosť mestského plánovania.\n\nNáš [ROOT.GetCountry.GetGovernment.GetHeirTitle] nachádza dvor, ktorý sa zaujíma o poéziu rovnako ako o štátnictvo." # todo: NEW TRANSLATION
 grand_tour_events.7.knowledge: "Čítať rytierske romány uložené vo vojvodskej knižnici." # todo: NEW TRANSLATION
 grand_tour_events.7.experience: "Prehliadnuť si vojvodskú zbrojnicu a plavebné komory [target_location.GetRank.GetNameWithNoTooltip]." # todo: NEW TRANSLATION
 grand_tour_events.7.connections: "Zúčastniť sa predstavenia na dvore [court_host.GetNameWithNoTooltip]." # todo: NEW TRANSLATION
 grand_tour_events.7.party: "Nechať vojvodské verše bokom a vyraziť za zábavnejším večerom." # todo: NEW TRANSLATION
 grand_tour_events.7.historical_info: "V apríli 1817 navštívil lord Byron, ktorý vtedy cestoval po Taliansku, nemocnicu Sant'Anna vo Ferrare. Ukázali mu stiesnenú celu, v ktorej mal byť básnik Torquato Tasso v 80. rokoch 16. storočia väznený pre šialenstvo na príkaz vojvodu Alfonsa II. d'Esteho. Byrona táto pamiatka dojala viac než neďaleký Ariostov pomník a na druhý deň zložil „Tassov žalospev“, dramatický monológ vyjadrujúci básnikovo zúfalstvo. Táto návšteva sa stala jednou z najslávnejších púti Grand Tour v období romantizmu a navždy vryla do predstavivosti cestovateľov zašlú slávu ferrarského dvora rodu Este." # todo: NEW TRANSLATION
 grand_tour_events.8.title: "[target_location.GetNameWithNoTooltip], mesto vzdelancov" # todo: NEW TRANSLATION
 grand_tour_events.8.desc: "[target_location.GetName] vyučuje právo a umenie argumentácie dlhšie než ktorékoľvek iné miesto v kresťanskom svete a [target_location.GetRank.GetName] dáva svoje vzdelanie hrdo najavo: pod arkádami sa tiesnia študenti zo všetkých krajín a prednáškové sály sú staršie než väčšina okolitých kostolov. Hostujúci [ROOT.GetCountry.GetGovernment.GetHeirTitle] by tu mohol stráviť celý život a stále by neprečítal všetko, čo právni učenci napísali.\n\nAk nás však politika zaujíma viac než právna veda, môžeme navštíviť aj dvor." # todo: NEW TRANSLATION
 grand_tour_events.8.knowledge: "Zúčastniť sa na prednáške o občianskom práve na univerzite." # todo: NEW TRANSLATION
 grand_tour_events.8.experience: "Prehliadnuť si hodvábne tkáčovne, vďaka ktorým sa preslávila priadza z [target_location.GetNameWithNoTooltip]." # todo: NEW TRANSLATION
 grand_tour_events.8.connections: "$grand_tour_events.seek_audience$" # todo: NEW TRANSLATION
 grand_tour_events.8.party: "Vynechať prednášku a popíjať víno so študentmi." # todo: NEW TRANSLATION
 grand_tour_events.8.historical_info: "V roku 1739 strávil Charles de Brosses, francúzsky sudca na cestách po Taliansku, večer v Bologni u Laury Bassiovej, ktorá bola už vtedy prvou ženou v Európe zastávajúcou univerzitnú katedru. Zišli sa tam miestni učenci, aby diskutovali o novej vede elektriny. De Brosses neskôr spomínal, ako musel oprášiť svoju hrdzavú školskú latinčinu, aby pred zhromaždenou spoločnosťou diskutoval o magnetizme a „podivuhodnej príťažlivosti elektrifikovaných telies“. Tento večer opísal vo svojich #italic Lettres familières écrites d'Italie#! a Bassiovej salón sa stal jednou z najnavštevovanejších zastávok cestovateľov Grand Tour, ktorí prechádzali mestom." # todo: NEW TRANSLATION
 grand_tour_events.9.title: "[target_location.GetNameWithNoTooltip], mesto Palio" # todo: NEW TRANSLATION
 grand_tour_events.9.desc: "[target_location.GetName] sa rozprestiera na troch hrebeňoch okolo námestia v tvare mušle a jeho pruhovaná katedrála je viditeľná z každej ulice, ktorá k nemu stúpa. [target_location.GetRank.GetName] zbohatlo na [ShowGoodsName('wool')] a bankovníctve, kým ho nezatienila [ShowLocationName('florence')]. Toto zatienenie mu nikdy celkom neodpustilo a rivalita dodnes zafarbí každú rozhovoru na dvore.\n\nNáš [ROOT.GetCountry.GetGovernment.GetHeirTitle] prichádza práve včas, aby si pozrel konské dostihy, ktoré dvakrát ročne zaplnia námestie — aj s vlajkami." # todo: NEW TRANSLATION
 grand_tour_events.9.knowledge: "Zúčastniť sa na prednáške o kánonickom práve na univerzite." # todo: NEW TRANSLATION
 grand_tour_events.9.experience: "Preštudovať si fresky a slávne bankové knihy [target_location.GetRank.GetNameWithNoTooltip]." # todo: NEW TRANSLATION
 grand_tour_events.9.connections: "Sledovať dostihy z lodžie [court_host.GetNameWithNoTooltip]." # todo: NEW TRANSLATION
 grand_tour_events.9.party: "Vymeniť fresky za herné stoly na Campo." # todo: NEW TRANSLATION
 grand_tour_events.9.historical_info: "Na jeseň 1764 si spisovateľ Tobias Smollett prerušil cestu z Florencie do Ríma nocľahom v Siene a vo svojich neskôr vydaných #italic Travels through France and Italy#! sa posťažoval, že ho „ubytovali v nevyhovujúcom dome, ktorý páchol ako latrína“ a „na večeru sa mu ušlo biedne pohostenie“. Uznal, že mesto je „veľké a dobre postavené“, a poznamenal, že Sienčania „si zakladajú na svojej zdvorilosti a čistote svojho nárečia“ — až natoľko, že sa tam zahraniční návštevníci ubytúvali iba preto, aby sa naučili správnu taliansku výslovnosť. Smollettov opis sa stal jednou z najznámejších anglických sťažností na pohostinnosť počas Grand Tour v Toskánsku." # todo: NEW TRANSLATION
 grand_tour_events.10.title: "[target_location.GetNameWithNoTooltip], mesto šikmej veže" # todo: NEW TRANSLATION
 grand_tour_events.10.desc: "[target_location.GetName] postavilo zvonicu, ktorá sa nedokázala udržať rovno, no namiesto toho, aby ju zbúrali, jednoducho pokračovali vo výstavbe. [target_location.GetRank.GetName] považuje jej náklon skôr za dôvod na hrdosť než za hanbu. Kedysi bola námornou mocnosťou, ktorá súperila s [ShowLocationName('genoa')] a [ShowLocationName('venice')]. Jej galéry sú už preč, no univerzita a katedrálne námestie zostali.\n\nHostujúci [ROOT.GetCountry.GetGovernment.GetHeirTitle] tu môže študovať alebo sa prejsť po prístave, ktorý kedysi býval dôležitý." # todo: NEW TRANSLATION
 grand_tour_events.10.knowledge: "Zúčastniť sa na prednáškach na univerzite pri katedrálnom námestí." # todo: NEW TRANSLATION
 grand_tour_events.10.experience: "Navštíviť starý arzenál a dielne garbiarov pozdĺž rieky Arno." # todo: NEW TRANSLATION
 grand_tour_events.10.connections: "Predstaviť sa [court_host.GetNameWithNoTooltip]." # todo: NEW TRANSLATION
 grand_tour_events.10.party: "Vynechať prednášku a stráviť večer v prístavných krčmách." # todo: NEW TRANSLATION
 grand_tour_events.10.historical_info: "Koncom roka 1821 sa Percy a Mary Shelleyovci usadili v Pise a presvedčili lorda Byrona, aby sa k nim pridal. Ubytovali ho v paláci Lanfranchi na nábreží Lungarno. Spolu s Edwardom a Jane Williamsovcami a neskôr aj Edwardom Trelawnym vytvorili kruh, ktorý sa neskôr preslávil ako „pisanský kruh“. Byron prišiel s celým sprievodom koní, psov a opíc a skupina strávila zimu plánovaním literárneho časopisu #italic The Liberal#!. Leigh Hunt napokon dorazil do Talianska nasledujúce leto, len niekoľko dní predtým, ako sa Shelley v júli utopil pri toskánskom pobreží. Spoločnosť, ktorú Shelley v Pise vytvoril, sa v priebehu niekoľkých mesiacov rozpadla a mestu zostalo miesto medzi najpamätnejšími zastávkami romantizmu." # todo: NEW TRANSLATION
 grand_tour_events.11.title: "[target_location.GetNameWithNoTooltip], mesto svätého Františka" # todo: NEW TRANSLATION
 grand_tour_events.11.desc: "[target_location.GetName] sa šplhá po zelenom svahu okolo baziliky, postavenej na uloženie kostí muža, ktorý sa tu narodil — mnícha, ktorý nevlastnil nič, no zanechal [target_location.GetRank.GetName] jedno z najväčších pútnických miest západného sveta. Freskami pokryté steny vo vnútri priťahujú maliarov aj pútnikov v rovnakom počte.\n\nNáš [ROOT.GetCountry.GetGovernment.GetHeirTitle] môže stráviť návštevu obdivovaním fresiek alebo v spoločnosti bratov, ktorí dodnes žijú podľa rehole." # todo: NEW TRANSLATION
 grand_tour_events.11.knowledge: "Študovať fresky a život svätca." # todo: NEW TRANSLATION
 grand_tour_events.11.experience: "Prehliadnuť si dielne, v ktorých sa vyrábajú zbožné relikvie a odznaky." # todo: NEW TRANSLATION
 grand_tour_events.11.connections: "Stretnúť sa s [court_host.GetNameWithNoTooltip] a mestskými predstaviteľmi." # todo: NEW TRANSLATION
 grand_tour_events.11.party: "Nechať spoločnosť bratov bokom a vyraziť za zábavnejším večerom v meste." # todo: NEW TRANSLATION
 grand_tour_events.11.historical_info: "Večer 26. októbra 1786 dorazil Johann Wolfgang von Goethe do Assisi a podľa vlastného opisu v diele #italic Italian Journey#! sa odvrátil od „obrovskej masy kostolov navŕšených na sebe ako babylonská veža“, v ktorých spočívali pozostatky svätého Františka, a pútnické miesto otvorene zavrhol. Namiesto toho vystúpil k rímskemu chrámu Minervy na námestí starého mesta a nazval ho „prvou úplnou pamiatkou staroveku, akú som kedy videl“. Goethovo pohŕdnutie najslávnejšou svätyňou Assisi v prospech pohanského chrámu sa stalo jedným z najprekvapivejších osobných súdov, ktoré sa zachovali z obdobia Grand Tour." # todo: NEW TRANSLATION
 grand_tour_events.12.title: "[target_location.GetNameWithNoTooltip], etruské mesto" # todo: NEW TRANSLATION
 grand_tour_events.12.desc: "[target_location.GetName] leží vysoko na kopci za hradbami, ktoré Etruskovia postavili dávno predtým, než Rím začal čokoľvek znamenať. [target_location.GetRank.GetName] dodnes každý deň prechádza ich bránami bez toho, aby tomu venovalo druhú myšlienku. Jeho maliari sa nedávno preslávili po celom [ShowRegionName('italy_region')] a univerzita má plné prednáškové sály.\n\nNáš [ROOT.GetCountry.GetGovernment.GetHeirTitle] môže podľa chuti študovať staré hradby alebo nové obrazy." # todo: NEW TRANSLATION
 grand_tour_events.12.knowledge: "Študovať na univerzite a prejsť sa po starých etruských hradbách." # todo: NEW TRANSLATION
 grand_tour_events.12.experience: "Navštíviť dielne hrnčiarov preslávených majolikou." # todo: NEW TRANSLATION
 grand_tour_events.12.connections: "Požiadať o uvedenie na dvor [court_host.GetNameWithNoTooltip]." # todo: NEW TRANSLATION
 grand_tour_events.12.party: "Vynechať staré hradby a stráviť večer v študentských krčmách." # todo: NEW TRANSLATION
 grand_tour_events.12.historical_info: "Začiatkom roka 1765 cestoval spisovateľ Tobias Smollett z Ríma späť smerom k Florencii, keď jeho koč začal strmo stúpať do Perugie. Vyčerpané kone sa pod ťarchou koča začali šmýkať dozadu a ťahať ho k okraju priepasti. Okoloidúci podložil pod jedno koleso veľký kameň práve včas, aby zastavil šmyk a zachránil celú spoločnosť pred tým, aby sa podľa Smollettových slov rozbila na kusy. Keďže v ten deň neboli k dispozícii náhradné kone, Smollett a jeho rodina museli v meste prenocovať. Pred pokračovaním cesty do Florencie si prezreli jeho kostoly a obrazy rodáka Pietra Perugina." # todo: NEW TRANSLATION
 grand_tour_events.13.title: "[target_location.GetNameWithNoTooltip], mesto na Dunaji" # todo: NEW TRANSLATION
 grand_tour_events.13.desc: "[target_location.GetName] stráži riečny priechod, kde sa stretávajú cesty z [ShowRegionName('italy_region')], z [ShowRegionName('balkan_region')] a z území [ShowLanguageName('german_language')]. [target_location.GetRank.GetName] zbohatlo na vyberaní mýta. V jeho strede sa týči vojvodský Hofburg, sídlo dvora, ktorý sa považuje za viac než len regionálnu mocnosť.\n\nNáš [ROOT.GetCountry.GetGovernment.GetHeirTitle] konečne prekročil Alpy; cesty odtiaľto vedú ľahšie." # todo: NEW TRANSLATION
 grand_tour_events.13.knowledge: "Navštíviť katedrálne školy a stretnúť sa s mestskými učencami." # todo: NEW TRANSLATION
 grand_tour_events.13.experience: "Prehliadnuť si arzenál a prístaviská lodníkov pozdĺž Dunaja." # todo: NEW TRANSLATION
 grand_tour_events.13.connections: "Predstaviť sa [court_host.GetNameWithNoTooltip] v Hofburgu." # todo: NEW TRANSLATION
 grand_tour_events.13.party: "Vymeniť katedrálne školy za večer pri Dunaji." # todo: NEW TRANSLATION
 grand_tour_events.13.historical_info: "V roku 1775 navštívil lekár John Moore Viedeň ako spoločník mladého vojvodu z Hamiltonu. Dvojicu prijali na súkromnej audiencii cisár Jozef II. a potom aj samotná cisárovná Mária Terézia v Schönbrunne. Moore poznamenal, že povestná strnulosť dvora sa vytratila, keď si štátny kancelár, knieža Kaunitz, všimol Mooreovho štrnásťročného syna, ktorý cestoval s ich skupinou, a trval na tom, aby ho prijali aj cisár s cisárovnou. Moore zaznamenal aj starú dvorskú príhodu o epidémii kiahní, ktorá postihla habsburskú rodinu pred ôsmimi rokmi: keď sa jedna z cisárovniných dcér dozvedela, že sa nakazila, okamžite si vyžiadala zrkadlo a veselo sa rozlúčila s krásou, ktorú choroba mala zničiť." # todo: NEW TRANSLATION
 grand_tour_events.14.title: "[target_location.GetNameWithNoTooltip], zlaté mesto" # todo: NEW TRANSLATION
 grand_tour_events.14.desc: "[target_location.GetName] sa rozkladá na oboch brehoch Vltavy a kamenný most spája staré mesto s hradným vrchom. [target_location.GetRank.GetName] sa nesie ako hlavné mesto ríše. Univerzita na vrchu priťahuje študentov zo všetkých kútov území [ShowLanguageName('german_language')] aj zďaleka.\n\nNáš [ROOT.GetCountry.GetGovernment.GetHeirTitle] nachádza mesto, ktoré svoju dôležitosť meria v storočiach, nie v ročných obdobiach." # todo: NEW TRANSLATION
 grand_tour_events.14.knowledge: "Zúčastniť sa na prednáškach na univerzite na vrchu." # todo: NEW TRANSLATION
 grand_tour_events.14.experience: "Prehliadnuť si sklárne a zlatníkov v Zlatej uličke." # todo: NEW TRANSLATION
 grand_tour_events.14.connections: "$grand_tour_events.seek_castle_audience$" # todo: NEW TRANSLATION
 grand_tour_events.14.party: "Opustiť univerzitu a stráviť večer v krčmách pri rieke." # todo: NEW TRANSLATION
 grand_tour_events.14.historical_info: "Lekár John Moore cestoval v roku 1775 po Čechách ako spoločník mladého vojvodu z Hamiltonu. Keď sa s ním prechádzal pražskou ulicou, okoloidúci kňaz z jedného z mestských seminárov začul ich rozhovor a vyhlásil: „Uisťujem vás, že aj ja som Ír.“ Keď sa ho opýtali, ako tak rýchlo spoznal ich národnosť, odpovedal, že to zistil hneď, ako ich počul hovoriť po anglicky. Po zvyšok návštevy im robil sprievodcu a ukázal im okno kancelárie, z ktorého v roku 1618 vyhodili dvoch šľachticov a ich tajomníka. Moore túto udalosť sarkasticky odporučil štátnikom na celom svete." # todo: NEW TRANSLATION
 grand_tour_events.15.title: "[target_location.GetNameWithNoTooltip], mesto mníchov" # todo: NEW TRANSLATION
 grand_tour_events.15.desc: "[target_location.GetName] vďačí za svoje meno mníchom, ktorých osada tu stála ešte predtým, než vojvodovia vedľa nej vybudovali trh a mincovňu. [target_location.GetRank.GetName] sa odvtedy značne rozrástlo. Vojvodský dvor Wittelsbachovcov udržiava [target_location.GetRank.GetNameWithNoTooltip] v lepšom poriadku než väčšinu miest a miestni pivovarníci dbajú na jeho zásobovanie.\n\nNáš [ROOT.GetCountry.GetGovernment.GetHeirTitle] tu nájde vzdelancov aj dobre spravovaný dvor." # todo: NEW TRANSLATION
 grand_tour_events.15.knowledge: "Navštíviť katedrálne školy a stretnúť sa s mestskými kronikármi." # todo: NEW TRANSLATION
 grand_tour_events.15.experience: "Prehliadnuť si vojvodskú zbrojnicu a sklady obchodu so [ShowGoodsNameWithNoTooltip('salt')]." # todo: NEW TRANSLATION
 grand_tour_events.15.connections: "Predstaviť sa na vojvodskom dvore [court_host.GetNameWithNoTooltip]." # todo: NEW TRANSLATION
 grand_tour_events.15.party: "Odložiť kroniky a stráviť večer medzi pivovarníkmi." # todo: NEW TRANSLATION
 grand_tour_events.15.historical_info: "V roku 1786 prechádzala spisovateľka Hester Lynch Piozziová so svojím manželom Mníchovom počas ich dlhej svadobnej cesty po Európe. Dorazili na úsvite po nočnom prechode cez Alpy z Innsbrucku a zastavili sa, aby si prezreli obrazáreň kurfirsta a kabinet kuriozít. Medzi predmetmi, ktoré jej ukázal miestny zberateľ, bol minuciózne vypracovaný obraz Panny Márie s dieťaťom, vytvorený z čohosi podobného spradeným pavučinám. Bol taký jemný, že jeho postavy nebolo možné rozoznať voľným okom a zviditeľnili sa až pod mikroskopom. Piozziová opísala tento výtvor s úžasom a obdivovala veľkú námahu vynaloženú na také jemné a nepraktické dielo." # todo: NEW TRANSLATION
 grand_tour_events.16.title: "[target_location.GetNameWithNoTooltip], mesto na Seine" # todo: NEW TRANSLATION
 grand_tour_events.16.desc: "[target_location.GetName] sa rozkladá na oboch brehoch rieky okolo ostrova, na ktorom sa týči veľká katedrála. [target_location.GetRank.GetName] je väčšie než takmer každé iné miesto, ktoré náš [ROOT.GetCountry.GetGovernment.GetHeirTitle] na tejto ceste dosiaľ videl. Univerzitná štvrť na ľavom brehu učí teológiu a právo viac študentov, než má väčšina miest obyvateľov.\n\nKráľovský dvor prijíma návštevníkov s takou formálnosťou, že o svojom vlastnom význame nenecháva najmenšie pochybnosti." # todo: NEW TRANSLATION
 grand_tour_events.16.knowledge: "Zúčastniť sa na disputáciách na univerzite na ľavom brehu." # todo: NEW TRANSLATION
 grand_tour_events.16.experience: "Navštíviť kníhviazačov a tlačiarne v blízkosti univerzity." # todo: NEW TRANSLATION
 grand_tour_events.16.connections: "$grand_tour_events.seek_audience$" # todo: NEW TRANSLATION
 grand_tour_events.16.party: "Vynechať disputácie a vyraziť do krčiem na ľavom brehu." # todo: NEW TRANSLATION
 grand_tour_events.16.historical_info: "Počas pobytu v Paríži v októbri 1763 pozoroval spisovateľ Tobias Smollett, ako sa na ceste do Choisy zastavil nájomný koč a vystúpilo z neho päť či šesť ozbrojených mužov. Každý sa ukryl za iným stromom. Smollett očakával, že ide o zbojníkov alebo strážnikov prenasledujúcich zločinca, a spýtal sa sluhu, kto sú. Dozvedel sa však, že sú to páni z mesta, ktorí si vyrazili na celodenný lov zajacov a strieľajú spoza úkrytov na každú zver, ktorá prejde okolo. Smollettovi pripadala celá scéna groteskná a sucho poznamenal, že aspoň účinne vyprázdňuje pole od zajacov." # todo: NEW TRANSLATION
 grand_tour_events.17.title: "[target_location.GetNameWithNoTooltip], mesto jarmokov" # todo: NEW TRANSLATION
 grand_tour_events.17.desc: "[target_location.GetName] leží na sútoku dvoch riek a [target_location.GetRank.GetName] z neho vyťažilo bohatstvo: na kráľovské jarmoky sa sem schádzajú obchodníci z [ShowRegionName('italy_region')], z území [ShowCultureGroupName('german_group')] aj z Flámska. Ulice sa vtedy zaplnia väčším množstvom [ShowGoodsName('silk')] a [ShowGoodsName('dyes')], než dokážu pojať sklady. Miestne tlačiarenské lisy pracujú takmer rovnako rýchlo, ako tkáčske stavy tkajú.\n\nNáš [ROOT.GetCountry.GetGovernment.GetHeirTitle] prichádza do mesta, ktoré žije obchodom, nie okázalými obradmi." # todo: NEW TRANSLATION
 grand_tour_events.17.knowledge: "Vyhľadať humanistických básnikov, ktorí sa schádzajú pri tlačiarňach." # todo: NEW TRANSLATION
 grand_tour_events.17.experience: "Navštíviť tlačiarne a pozrieť si účtovné knihy obchodníkov." # todo: NEW TRANSLATION
 grand_tour_events.17.connections: "Navštíviť [court_host.GetNameWithNoTooltip] a popredných obchodníkov [target_location.GetRank.GetNameWithNoTooltip]." # todo: NEW TRANSLATION
 grand_tour_events.17.party: "Odložiť účtovné knihy a stráviť večer medzi hodovníkmi." # todo: NEW TRANSLATION
 grand_tour_events.17.historical_info: "V októbri 1763 dorazil spisovateľ Tobias Smollett do Lyonu na ceste na juh do Talianska a svoju návštevu opísal v listoch neskôr vydaných pod názvom #italic Travels through France and Italy#!. Odporučili mu ubytovňu, ktorá sa ukázala byť plná, a tak ho zaviedli do krčmy, kde za tri ošarpané izby žiadali dvanásť livrov denne a za jedlo ďalších tridsaťdva. Pobúrený takým zdieraním bez slova odišiel a zamieril rovno do konkurenčného hostinca. Smollettov opis lyonských predražujúcich hostinských sa stal jednou z najcitovanejších pasáží jeho knihy a obľúbenou sťažnosťou anglických cestovateľov na ceste do Talianska." # todo: NEW TRANSLATION
 grand_tour_events.18.title: "[target_location.GetNameWithNoTooltip], mesto na rázcestí" # todo: NEW TRANSLATION
 grand_tour_events.18.desc: "[target_location.GetName] dostalo meno podľa ciest, ktoré sa tu križujú, a [target_location.GetRank.GetName] dodnes slúži rovnakému účelu. Rozprestiera sa na oboch brehoch rieky, ktorá oddeľuje územia hovoriace [ShowLanguageName('french_language')] od tých, kde sa hovorí [ShowLanguageName('german_language')]. Veža jeho katedrály sa týči vyššie než čokoľvek, čo náš [ROOT.GetCountry.GetGovernment.GetHeirTitle] počas celej cesty videl. Je to jediná veža, ku ktorej nikdy nepribudla plánovaná druhá.\n\nSlobodné mesto sa spravuje samo a jeho tlačiari začínajú byť rovnako dôležití ako obchodníci." # todo: NEW TRANSLATION
 grand_tour_events.18.knowledge: "Zúčastniť sa na prednáške v Gymnáziu Johannesa Sturma." # todo: NEW TRANSLATION
 grand_tour_events.18.experience: "Vystúpiť na vežu katedrály a navštíviť tlačiarenské dielne." # todo: NEW TRANSLATION
 grand_tour_events.18.connections: "Stretnúť sa s [court_host.GetNameWithNoTooltip] a mestskou radou." # todo: NEW TRANSLATION
 grand_tour_events.18.party: "Opustiť tlačiarne a stráviť večer pod vežou." # todo: NEW TRANSLATION
 grand_tour_events.18.historical_info: "Začiatkom 70. rokov 18. storočia vystúpil škótsky lekár John Moore, ktorý cestoval po kontinente ako spoločník vojvodu z Hamiltonu, na 466-stopovú vežu štrasburskej katedrály. Návštevu opísal v diele #italic A View of Society and Manners in France, Switzerland, and Germany#!. Opisuje, ako čakal s davom na nelegitímneho syna Ľudovíta XV., ktorý mal prísť na omšu, no keď odbilo poludnie a šľachtic stále neprišiel, veriaci sa rozišli bez toho, aby ho vypočuli. Potom si vypočul vášnivú kázeň o tyranii vášní. Moore spomenul aj veľký katedrálny roh, na ktorý sa každú noc trúbilo na pamiatku sprisahania, z ktorého miestni sprievodcovia stále obviňovali masaker spred štyroch storočí." # todo: NEW TRANSLATION
 grand_tour_events.19.title: "[target_location.GetNameWithNoTooltip], brána Stredozemia" # todo: NEW TRANSLATION
 grand_tour_events.19.desc: "[target_location.GetName] je prístavom už od čias pred vznikom Ríma. Založili ho [ShowCultureName('greek_culture')] námorníci, ktorí uvideli prístav a už neodišli. [target_location.GetRank.GetName] dodnes v každej štvrti vonia soľou a dechtom. Jeho nábrežie sa hemží galérami z polovice Stredozemia a na trhoch sa predáva tovar, ktorý sa nikdy nedostane do vnútrozemia [GetCountry('FRA').GetName].\n\nNáš [ROOT.GetCountry.GetGovernment.GetHeirTitle] zisťuje, že skutočným vládcom [target_location.GetRank.GetNameWithNoTooltip] je samotné more." # todo: NEW TRANSLATION
 grand_tour_events.19.knowledge: "Preštudovať si nápisy pripomínajúce [ShowCultureNameWithNoTooltip('greek_culture')] zakladateľov [target_location.GetRank.GetNameWithNoTooltip]." # todo: NEW TRANSLATION
 grand_tour_events.19.experience: "Navštíviť prístav a porozprávať sa so stredomorskými námorníkmi." # todo: NEW TRANSLATION
 grand_tour_events.19.connections: "Navštíviť [court_host.GetNameWithNoTooltip]." # todo: NEW TRANSLATION
 grand_tour_events.19.party: "Vymeniť klebety za večer v krčmách pri dokoch." # todo: NEW TRANSLATION
 grand_tour_events.19.historical_info: "V máji 1765 dorazil spisovateľ Tobias Smollett do Marseille počas spiatočnej cesty cez Provensalsko a prístavné mesto opísal v listoch neskôr vydaných pod názvom #italic Travels through France and Italy#!. Pri prechádzke po prístavnom nábreží pozoroval galejníkov, ktorých koruna prenajímala na prácu v malých prenajatých stánkoch. Mali jednu nohu pripútanú reťazou, no podľa jeho slov sa im darilo dobre a veselo pracovali ako obuvníci, striebrotepci či kníhkupci. Smollett považoval Marseille za vznešené a prekvitajúce mesto, hoci sa sťažoval, že mu hostinskí účtovali štyri livry za osobu za každé jedlo." # todo: NEW TRANSLATION
 grand_tour_events.20.title: "[target_location.GetNameWithNoTooltip], mesto Augusta" # todo: NEW TRANSLATION
 grand_tour_events.20.desc: "[target_location.GetName] nesie meno cisára, ktorý ho založil, a [target_location.GetRank.GetName] odvtedy neprestalo rásť. Miestne bankové domy spravujú sumy, pri ktorých niektoré kráľovské pokladnice vyzerajú skromne. Cisársky snem sa tu schádza tak často, že si [target_location.GetRank.GetNameWithNoTooltip] zvyklo hostiť kniežatá.\n\nNáš [ROOT.GetCountry.GetGovernment.GetHeirTitle] prichádza do mesta, kde sa o peniazoch hovorí rovnako otvorene ako o pôvode." # todo: NEW TRANSLATION
 grand_tour_events.20.knowledge: "Preskúmať mestské starožitnosti a humanistické rukopisy." # todo: NEW TRANSLATION
 grand_tour_events.20.experience: "Preštudovať si účtovné knihy veľkých bankových domov." # todo: NEW TRANSLATION
 grand_tour_events.20.connections: "Zúčastniť sa na recepcii, ktorú usporiada [court_host.GetNameWithNoTooltip]." # todo: NEW TRANSLATION
 grand_tour_events.20.party: "Odložiť účtovné knihy a vyraziť k herným stolom." # todo: NEW TRANSLATION
 grand_tour_events.20.historical_info: "Ráno 15. júla 1772 dorazil anglický historik hudby Charles Burney do Augsburgu po celonočnej ceste a zamieril rovno do katedrály. Vypočul si tam nemeckú kázeň a omšu, ktorú pri príležitosti sviatku spievali dva zbory. Speváci sa mu páčili, no organistove harmónie mu pripadali také surové a pritiahnuté za vlasy, že namiesto potešenia trápili ucho. Prekvapilo ho aj hrubé trúbenie a bubnovanie počas pozdvihovania hostie, zvyk, s ktorým sa stretol iba v Antverpách. Keď zistil, že kantorovi, pre ktorého mal odporúčacie listy, niet v meste, Burney, ktorý zbieral materiál na svoje dejiny hudby, dlho nezostal." # todo: NEW TRANSLATION
 grand_tour_events.21.title: "[target_location.GetNameWithNoTooltip], katedrálne mesto" # todo: NEW TRANSLATION
 grand_tour_events.21.desc: "[target_location.GetName] stavia svoju katedrálu dlhšie, než si ktokoľvek žijúci dokáže spomenúť. Nad [target_location.GetRank.GetName] sa týči nedokončená veža a na jej vrchole stále stojí žeriav, ktorý tam murári zanechali. Rýn prepravuje popri tomto [target_location.GetRank.GetNameWithNoTooltip] viac tovaru než takmer kdekoľvek inde na územiach [ShowLanguageName('german_language')] a jeho arcibiskup vládne rovnako ako ktorékoľvek knieža.\n\nNáš [ROOT.GetCountry.GetGovernment.GetHeirTitle] prichádza do mesta, ktoré meria trpezlivosť v storočiach." # todo: NEW TRANSLATION
 grand_tour_events.21.knowledge: "Navštíviť stavbu katedrály a učencov miestnej univerzity." # todo: NEW TRANSLATION
 grand_tour_events.21.experience: "Prehliadnuť si zlievarne, v ktorých odlievajú zvony pre kostoly v Porýní." # todo: NEW TRANSLATION
 grand_tour_events.21.connections: "$grand_tour_events.seek_audience$" # todo: NEW TRANSLATION
 grand_tour_events.21.party: "Vynechať na jednu noc práce na katedrále a vyraziť na breh Rýna." # todo: NEW TRANSLATION
 grand_tour_events.21.historical_info: "V septembri 1794 dorazila spisovateľka Ann Radcliffeová do Kolína nad Rýnom, keď so svojím manželom cestovala po Porýní. O tejto výprave píše vo svojom vydanom cestopise #italic Cesta podniknutá v lete roku 1794#!. Zistila, že mesto je preplnené utečencami utekajúcimi pred francúzskymi vojskami postupujúcimi na Liège a Maastricht, a jeho ulice zapĺňajú nemocničné vozy prevážajúce ranených a umierajúcich. Všetky hostince boli plné; ostatní cestovatelia spali v kočoch, na biliardových stoloch a leňoškách, keďže izby neboli voľné. Radcliffeová neskôr napísala, že táto scéna ju o skutočnej cene vojny poučila viac než ktorákoľvek bitka, o ktorej čítala." # todo: NEW TRANSLATION
 grand_tour_events.22.title: "[target_location.GetNameWithNoTooltip], mesto Barcino" # todo: NEW TRANSLATION
 grand_tour_events.22.desc: "[target_location.GetName] odvodzuje svoje hradby od rímskej kolónie, ktorá tu kedysi stála, a [target_location.GetRank.GetName] sa odvtedy rozrástlo na najrušnejší prístav na tomto pobreží. Jeho prístav je plný galér, ktoré obchodujú s [ShowGoodsName('wool')], korením a [ShowGoodsName('dyes')] po celom západnom Stredomorí. Jeho námorný zákonník si prezerajú aj kapitáni, ktorí do mesta nikdy nevkročili.\n\nNáš [ROOT.GetCountry.GetGovernment.GetHeirTitle] už takmer dokončil dlhú cestu domov." # todo: NEW TRANSLATION
 grand_tour_events.22.knowledge: "Zúčastniť sa prednášky o zákonoch katalánskych #italic Corts#!." # todo: NEW TRANSLATION
 grand_tour_events.22.experience: "Preštudovať námorný zákonník v obchodníckej burze." # todo: NEW TRANSLATION
 grand_tour_events.22.connections: "Predstaviť sa na dvore [court_host.GetNameWithNoTooltip]." # todo: NEW TRANSLATION
 grand_tour_events.22.party: "Vymeniť námorný zákonník za prístavné krčmy." # todo: NEW TRANSLATION
 grand_tour_events.22.historical_info: "Koncom októbra 1775 dorazil anglický antikvár Henry Swinburne do Barcelony tesne predtým, než sa na noc zavreli mestské brány. Túto príhodu opísal vo svojom diele #italic Cesty po Španielsku v rokoch 1775 a 1776#!. Po tom, čo vzdal úctu miestodržiteľovi, navštívil divadlo a najprv hundral, že „na tomto javisku si trón zriadila Nuda“, no o niekoľko dní si ho získalo živé predstavenie #italic El Cid Campeador#! v starošpanielskych kostýmoch. Prezrel si aj citadelu a poznamenal, že jej nízko položené, vlhké a komármi zamorené miesto vybrali skôr preto, aby zastrašovalo mesto pod ňou, než kvôli zdraviu." # todo: NEW TRANSLATION
 grand_tour_events.23.title: "[target_location.GetNameWithNoTooltip], mesto kráľov" # todo: NEW TRANSLATION
 grand_tour_events.23.desc: "[target_location.GetName] korunuje svoj vrch hradom, v ktorom sa králi stávajú kráľmi a nachádzajú svoj posledný odpočinok, a [target_location.GetRank.GetName] pristupuje k obom obradom s rovnakou vážnosťou. Jeho univerzita, staršia než väčšina univerzít v krajinách [ShowLanguageName('german_language')], vyučuje astronómiu a právo študentov z celého regiónu. Obchod s [ShowGoodsName('amber')] a [ShowGoodsName('salt')] udržiava jeho trhy rušné po celý rok.\n\nNáš [ROOT.GetCountry.GetGovernment.GetHeirTitle] nachádza poslednú veľkú zastávku pred návratom domov." # todo: NEW TRANSLATION
 grand_tour_events.23.knowledge: "$grand_tour_events.attend_university_lectures$" # todo: NEW TRANSLATION
 grand_tour_events.23.experience: "Navštíviť Súkennú tržnicu, kde obchodníci predávajú svoj tovar." # todo: NEW TRANSLATION
 grand_tour_events.23.connections: "$grand_tour_events.seek_castle_audience$" # todo: NEW TRANSLATION
 grand_tour_events.23.party: "Opustiť prednáškovú sálu a stráviť noc neďaleko hradu." # todo: NEW TRANSLATION
 grand_tour_events.23.historical_info: "Dňa 25. júla 1778 prešiel William Coxe, vychovávateľ mladého lorda Herberta, ktorý ho sprevádzal na dlhej veľkej ceste po severnej a východnej Európe, cez Vislu do Krakova. Staré poľské hlavné mesto našiel poznačené delami a kartáčovými strelami z nedávnych obliehaní a jeho honosné domy boli v ruinách. Navštívil univerzitu založenú Kazimírom Veľkým, kde mu knihovník ukázal tureckú knihu, ktorá sama osebe nemala veľkú hodnotu, no cenili si ju ako kuriozitu. Získali ju ako korisť v bitke pri Chocimi a kráľ Ján Sobieski ju daroval univerzite na pamiatku víťazstva, ktoré zachránilo Poľsko a vynieslo ho na jeho trón." # todo: NEW TRANSLATION
 grand_tour_events.24.title: "Kam ďalej?" # todo: NEW TRANSLATION
 grand_tour_events.24.desc: "Z [target_location.GetName] vedie niekoľko ciest. [target_leader.GetName] sa musí rozhodnúť, kadiaľ bude cesta pokračovať: hlbšie do oblasti [ShowRegionName('italy_region')], alebo domov." # todo: NEW TRANSLATION
 grand_tour_events.24.a: "Zájsť do [ShowLocationNameWithNoTooltip('verona')]." # todo: NEW TRANSLATION
 grand_tour_events.24.b: "Namiesto toho zamieriť do [ShowLocationNameWithNoTooltip('ferrara')]." # todo: NEW TRANSLATION
 grand_tour_events.24.c: "Odbočiť do [ShowLocationNameWithNoTooltip('bologna')]." # todo: NEW TRANSLATION
 grand_tour_events.24.d: "Pokračovať do [ShowLocationNameWithNoTooltip('florence')]." # todo: NEW TRANSLATION
 grand_tour_events.24.e: "Prerušiť cestu v [ShowLocationNameWithNoTooltip('siena')]." # todo: NEW TRANSLATION
 grand_tour_events.24.f: "Najprv sa zastaviť v [ShowLocationNameWithNoTooltip('pisa')]." # todo: NEW TRANSLATION
 grand_tour_events.24.g: "Odbočiť smerom na [ShowLocationNameWithNoTooltip('assisi')]." # todo: NEW TRANSLATION
 grand_tour_events.24.h: "Namiesto toho zamieriť do [ShowLocationNameWithNoTooltip('perugia')]." # todo: NEW TRANSLATION
 grand_tour_events.24.i: "Pokračovať do [ShowLocationNameWithNoTooltip('rome')]." # todo: NEW TRANSLATION
 grand_tour_events.24.j: "Pokračovať do [ShowLocationNameWithNoTooltip('naples')]." # todo: NEW TRANSLATION
 grand_tour_events.24.k: "Cesta už stačila. Vrátiť sa domov." # todo: NEW TRANSLATION
 grand_tour_events.25.title: "Cesta domov" # todo: NEW TRANSLATION
 grand_tour_events.25.desc: "Cesta sa konečne obracia domov. Namiesto toho, aby [target_leader.GetName] prešiel celú južnú trasu znova, musí si vybrať miesto, kde preruší cestu pred jej posledným úsekom: zastávku na odpočinok pre kone a možno aj na prijatie na ďalšom dvore pred návratom." # todo: NEW TRANSLATION
 grand_tour_events.25.desc.second: "Jedna zastávka nestačí na to, aby sa dala nazvať návratom domov. Kým cesta napokon nepovedie späť do [ROOT.GetCountry.GetCapital.GetName], [target_leader.GetName] si vyberie ešte jedno mesto, kde preruší cestu: posledný dvor, poslednú zaujímavosť, a až potom sa cesta skutočne skončí." # todo: NEW TRANSLATION # todo: COUNTRY CASE
 grand_tour_events.25.a: "Prerušiť cestu vo [ShowLocationNameWithNoTooltip('vienna')]." # todo: NEW TRANSLATION
 grand_tour_events.25.b: "Oddýchnuť si s koňmi v [ShowLocationNameWithNoTooltip('prague')]." # todo: NEW TRANSLATION
 grand_tour_events.25.c: "Vydať sa domov cez [ShowLocationNameWithNoTooltip('munich')]." # todo: NEW TRANSLATION
 grand_tour_events.25.d: "Zastaviť sa v [ShowLocationNameWithNoTooltip('paris')] pred posledným úsekom." # todo: NEW TRANSLATION
 grand_tour_events.25.e: "Cestou domov prejsť cez [ShowLocationNameWithNoTooltip('lyon')]." # todo: NEW TRANSLATION
 grand_tour_events.25.f: "Pred cestou do vnútrozemia sa preplaviť do [ShowLocationNameWithNoTooltip('london')]." # todo: NEW TRANSLATION
 grand_tour_events.25.g: "Najprv prerušiť cestu v [ShowLocationNameWithNoTooltip('strasbourg')]." # todo: NEW TRANSLATION
 grand_tour_events.25.h: "Viesť cestu cez [ShowLocationNameWithNoTooltip('marseille')]." # todo: NEW TRANSLATION
 grand_tour_events.25.i: "Pred posledným úsekom zamieriť do [ShowLocationNameWithNoTooltip('augsburg')]." # todo: NEW TRANSLATION
 grand_tour_events.25.k: "Na chvíľu si oddýchnuť v [ShowLocationNameWithNoTooltip('cologne')]." # todo: NEW TRANSLATION
 grand_tour_events.25.l: "Plaviť sa domov cez [ShowLocationNameWithNoTooltip('barcelona')]." # todo: NEW TRANSLATION
 grand_tour_events.25.n: "Prerušiť cestu v [ShowLocationNameWithNoTooltip('orleans')]." # todo: NEW TRANSLATION
 grand_tour_events.25.o: "Pred posledným úsekom cesty domov prejsť cez [ShowLocationNameWithNoTooltip('krakow')]." # todo: NEW TRANSLATION
 grand_tour_events.25.p: "Dosť bolo zdržovania. Zamieriť priamo domov." # todo: NEW TRANSLATION
 grand_tour_events.26.title: "[target_location.GetNameWithNoTooltip], mesto na Temži" # todo: NEW TRANSLATION
 grand_tour_events.26.desc: "[target_location.GetName] sa rozprestiera pozdĺž rieky za hradbami, ktoré tu ako prví postavili Rimania, a [target_location.GetRank.GetName] ich odvtedy dávno prerástlo. Most je lemovaný domami a obchodmi. Obchod s [ShowGoodsName('wool')] plní sklady a parlament zasadá tak často, že si [target_location.GetRank.GetNameWithNoTooltip] zvyklo hostiť záležitosti celej ríše.\n\nNáš [ROOT.GetCountry.GetGovernment.GetHeirTitle] nachádza dvor, ktorého ambície sa vyrovnajú ktorémukoľvek na kontinente." # todo: NEW TRANSLATION
 grand_tour_events.26.knowledge: "Zúčastniť sa prednášky o zvykovom práve v Inns of Court." # todo: NEW TRANSLATION
 grand_tour_events.26.experience: "Navštíviť obchodníkov s [ShowGoodsNameWithNoTooltip('wool')] a cechové siene mesta." # todo: NEW TRANSLATION
 grand_tour_events.26.connections: "$grand_tour_events.seek_audience$" # todo: NEW TRANSLATION
 grand_tour_events.26.party: "Nechať cechové siene bokom a stráviť noc v krčmách mesta [target_location.GetNameWithNoTooltip]." # todo: NEW TRANSLATION
 grand_tour_events.26.historical_info: "V roku 1765 strávil francúzsky sudca a literát Pierre-Jean Grosley takmer rok v Londýne, kde zbieral materiál na knihu, neskôr preloženú pod názvom #italic Výlet do Londýna#!. Spomedzi svojich postrehov zaznamenal, ako jeden štátny minister strávil pri hernom stole nepretržitých dvadsaťštyri hodín. Po celý čas sa posilňoval iba studeným hovädzím mäsom vloženým medzi dva krajce opečeného chleba. „Toto nové jedlo,“ napísal Grosley, „sa počas môjho pobytu v Londýne stalo veľmi obľúbeným.“ Neskôr ho začali nazývať menom jeho vynálezcu. Táto anekdota, či už prikrášlená, alebo nie, sa stala najcitovanejšou vetou jeho Výletu." # todo: NEW TRANSLATION
 grand_tour_events.27.title: "[target_location.GetNameWithNoTooltip], mesto na Loire" # todo: NEW TRANSLATION
 grand_tour_events.27.desc: "[target_location.GetName] leží na mieste, kde sa Loire stáča na sever a potom sa znovu obracia k moru. [target_location.GetRank.GetName] už dlho ťaží z lodnej dopravy na rieke. Jeho univerzita vyučuje právo tak prísne ako univerzita v [ShowLocationName('bologna')] a jeho hradby odolali obliehaniam, ktoré iné mestá neprežili.\n\nNáš [ROOT.GetCountry.GetGovernment.GetHeirTitle] tu nachádza učencov aj vojakov, ktorí majú čo rozprávať." # todo: NEW TRANSLATION
 grand_tour_events.27.knowledge: "$grand_tour_events.attend_university_lectures$" # todo: NEW TRANSLATION
 grand_tour_events.27.experience: "Navštíviť vínne pivnice a cech lodníkov na Loire." # todo: NEW TRANSLATION
 grand_tour_events.27.connections: "$grand_tour_events.seek_audience$" # todo: NEW TRANSLATION
 grand_tour_events.27.party: "Vynechať prednášky o práve a vyraziť do krčiem pri rieke." # todo: NEW TRANSLATION
 grand_tour_events.27.historical_info: "V apríli 1644 prerušil mladý diarista John Evelyn svoju plavbu po Loire v Orléanse. Bola to jedna z prvých zdokumentovaných veľkých ciest. Navštívil starobylú univerzitu, ktorej študenti sa stále delili na štyri historické „národy“ — francúzsky, normandský, pikardský a hornonemecký, každý s vlastnými funkcionármi. Využíval aj dve mestské verejné knižnice a poznamenal, že učenec si mohol požičať knihu do svojho príbytku, keď tam nechal podpísaný lístok. Takáto ústretovosť mu pripadala pozoruhodná. Navštívil aj kolegiátny kostol sv. Kríža, kedysi honosný, no stále viditeľne poznačený nedávnymi občianskymi vojnami." # todo: NEW TRANSLATION
 grand_tour_events.28.title: "Príležitosť na vzdelávanie" # todo: NEW TRANSLATION
 grand_tour_events.28.desc.university: "Družina sa dozvie, že [target_leader.GetName] by mohol získať miesto medzi študentmi univerzity v meste [target_location.GetName]: čakala by ho účasť na prednáškach a dišputách, ako aj spoločnosť učencov, na ktorých sa bude spomínať ešte dlho po tom, čo sa na túto cestu zabudne." # todo: NEW TRANSLATION
 grand_tour_events.28.desc.scholar: "Družina sa dozvie o učencovi v meste [target_location.GetName], ktorého povesť priťahuje študentov z celého kontinentu. Za odmenu a s vhodným žiakom by sa ho možno dalo presvedčiť, aby sa na čas ujal [target_leader.GetName]." # todo: NEW TRANSLATION
 grand_tour_events.28.a: "$grand_tour_events.opportunity_accept$" # todo: NEW TRANSLATION
 grand_tour_events.28.b: "$grand_tour_events.opportunity_commit$" # todo: NEW TRANSLATION
 grand_tour_events.28.c: "$grand_tour_events.opportunity_decline$" # todo: NEW TRANSLATION
 grand_tour_events.29.title: "Prednášky sa končia" # todo: NEW TRANSLATION
 grand_tour_events.29.desc: "Mesiace štúdia sa chýlia ku koncu a [target_leader.GetName] sa musí rozhodnúť, čo sa v meste [target_location.GetName] skutočne naučil. $grand_tour_events.worth_the_delay$" # todo: NEW TRANSLATION
 grand_tour_events.29.a: "$grand_tour_events.reflect_and_continue$" # todo: NEW TRANSLATION
 grand_tour_events.30.title: "Príležitosť v poli" # todo: NEW TRANSLATION
 grand_tour_events.30.desc: "Náš [ROOT.GetCountry.GetGovernment.GetHeirTitle] sa dozvie, že [target_country.GetLongName] je vo vojne a jeho dôstojnícky zbor je ochotný prijať návštevníkov so správnymi odporúčaniami. [target_leader.GetName] by nemal skutočné velenie ani zodpovednosť za to, čo sa stane vojakom, no mohol by jazdiť po boku skúsených dôstojníkov, na vlastné oči sledovať vojenské ťaženie a dozvedieť sa to, čo žiadna kniha o stratégii nedokáže celkom vystihnúť." # todo: NEW TRANSLATION
 grand_tour_events.30.a: "$grand_tour_events.opportunity_accept$" # todo: NEW TRANSLATION
 grand_tour_events.30.b: "$grand_tour_events.opportunity_commit$" # todo: NEW TRANSLATION
 grand_tour_events.30.c: "$grand_tour_events.opportunity_decline$" # todo: NEW TRANSLATION
 grand_tour_events.31.title: "Vojenské ťaženie sa končí" # todo: NEW TRANSLATION
 grand_tour_events.31.desc: "Vojenská sezóna sa chýli ku koncu a [target_leader.GetName] sa musí rozhodnúť, čo sa skutočne naučil od dôstojníkov v [target_location.GetName]. $grand_tour_events.worth_the_delay$" # todo: NEW TRANSLATION
 grand_tour_events.31.a: "$grand_tour_events.reflect_and_continue$" # todo: NEW TRANSLATION
 grand_tour_events.32.title: "Príležitosť nadviazať známosti" # todo: NEW TRANSLATION
 grand_tour_events.32.desc: "[target_leader.GetName] sa dozvie o pozvaní na sezónny pobyt na dvore štátu [target_country.GetLongName]: izby v paláci, voľný vstup na každú recepciu a predstavenie všetkým dvoranom a zahraničným diplomatom, ktorých stojí za to poznať." # todo: NEW TRANSLATION
 grand_tour_events.32.desc.no_owner: "[target_leader.GetName] sa dozvie o pozvaní na sezónny pobyt v domácnosti poprednej rodiny z mesta [target_location.GetName]: zoznámenie sa so všetkými významnými ľuďmi, ktorých stojí za to poznať, a trvalé pozvanie k ich stolu." # todo: NEW TRANSLATION
 grand_tour_events.32.a: "$grand_tour_events.opportunity_accept$" # todo: NEW TRANSLATION
 grand_tour_events.32.b: "$grand_tour_events.opportunity_commit$" # todo: NEW TRANSLATION
 grand_tour_events.32.c: "$grand_tour_events.opportunity_decline$" # todo: NEW TRANSLATION
 grand_tour_events.33.title: "Sezóna na dvore sa končí" # todo: NEW TRANSLATION
 grand_tour_events.33.desc: "Sezóna na dvore sa chýli ku koncu a [target_leader.GetName] sa musí rozhodnúť, čo mu skutočne priniesli známosti nadviazané v meste [target_location.GetName]. $grand_tour_events.worth_the_delay$" # todo: NEW TRANSLATION
 grand_tour_events.33.a: "Zamyslieť sa nad tým, čo sme získali, a pokračovať v ceste." # todo: NEW TRANSLATION
 grand_tour_events.34.title: "Príležitosť na šermiarsky výcvik" # todo: NEW TRANSLATION
 grand_tour_events.34.desc: "Náš [ROOT.GetCountry.GetGovernment.GetHeirTitle] sa dozvie, že v meste [target_location.GetName] pôsobí vychýrený šermiarsky majster, ktorý je ochotný vziať si na sezónu nádejného žiaka. [target_leader.GetName] by sa nezúčastnil žiadneho vážneho súboja ani neriešil skutočný spor, no mohol by sa naučiť pohyby nôh, načasovanie a osobitnú odvahu, ktoré žiadna príručka šermu nedokáže celkom vystihnúť." # todo: NEW TRANSLATION
 grand_tour_events.34.a: "$grand_tour_events.opportunity_accept$" # todo: NEW TRANSLATION
 grand_tour_events.34.b: "$grand_tour_events.opportunity_commit$" # todo: NEW TRANSLATION
 grand_tour_events.34.c: "$grand_tour_events.opportunity_decline$" # todo: NEW TRANSLATION
 grand_tour_events.35.title: "Lekcie sa končia" # todo: NEW TRANSLATION
 grand_tour_events.35.desc: "Sezóna lekcií sa chýli ku koncu a [target_leader.GetName] sa musí rozhodnúť, čo sa skutočne naučil zo zápasov v meste [target_location.GetName]. $grand_tour_events.worth_the_delay$" # todo: NEW TRANSLATION
 grand_tour_events.35.a: "$grand_tour_events.reflect_and_continue$" # todo: NEW TRANSLATION
 grand_tour_events.36.title: "List z domova" # todo: NEW TRANSLATION
 grand_tour_events.36.desc: "List z krajiny [ROOT.GetCountry.GetAltAdjective('G')] konečne dostihne výpravu. [ROOT.GetCountry.GetGovernment.GetRuler.GetName] v ňom posiela vrúcne slová: dvor hovorí o [target_leader.GetName] v dobrom a priaznivo hodnotí aj to, ako [target_leader.GetHerHim] podáva správy o [target_leader.GetHerHis] pobyte v cudzine. Už sa o tom hovorilo pri nejednej večeri doma." # todo: NEW TRANSLATION # todo: COUNTRY CASE
 grand_tour_events.36.a: "Osláviť to menšou slávnosťou." # todo: NEW TRANSLATION
 grand_tour_events.36.b: "Na starý domáci dvor nemáme čas." # todo: NEW TRANSLATION
 grand_tour_events.37.title: "Miestny obdivovateľ" # todo: NEW TRANSLATION
 grand_tour_events.37.desc: "[gt_admirer.GetName], mladý miestny šľachtic očividne očarený postavením a urodzeným pôvodom [target_leader.GetHerHis], vyhľadal [target_leader.GetHerHim] a túži byť [target_leader.GetHerHis] nápomocný počas návštevy mesta [target_location.GetName]." # todo: NEW TRANSLATION
 grand_tour_events.37.a: "Nech [target_leader.GetHerHim] predstavia tým správnym ľuďom." # todo: NEW TRANSLATION
 grand_tour_events.37.b: "Prijmi [gt_admirer.GetHerHis] dar v podobe krásneho oblečenia, vhodného na cestu." # todo: NEW TRANSLATION
 grand_tour_events.37.c: "Prijmi [gt_admirer.GetHerHis] pozvanie a ubytuj sa v [gt_admirer.GetHerHis] vlastnom dome." # todo: NEW TRANSLATION
 grand_tour_events.38.title: "Užitočné zoznámenie" # todo: NEW TRANSLATION
 grand_tour_events.38.desc: "Na večeri posadia [target_leader.GetName] vedľa [gt_secretary.GetName], nenápadného mladíka, ktorý o sebe veľa nehovorí. Až náhodná poznámka prezradí, že je tajomníkom kardinála [target_cardinal.GetName]. Naznačí, že by sa [target_leader.GetNameWithNoTooltip] mohol stretnúť so samotným kardinálom, ak dnes večer urobí správny dojem." # todo: NEW TRANSLATION
 grand_tour_events.38.a: "Usiluj sa o toto zoznámenie a riskuj, že zanecháš nepríjemný dojem." # todo: NEW TRANSLATION
 grand_tour_events.38.b: "Naliehaj, nech to zariadi, a na rozpaky nehľaď." # todo: NEW TRANSLATION
 grand_tour_events.38.c: "Uži si večer a nechaj to tak." # todo: NEW TRANSLATION
 grand_tour_events.39.title: "Chvíľa poznania" # todo: NEW TRANSLATION
 grand_tour_events.39.desc: "Uprostred disputácie v [target_location.GetName] zaznie argument [target_leader.GetName], ktorý zrazu pôsobí ako prenikavý záblesk geniality. Zhromaždení učenci stíchnu a potom súhlasne prikývnu." # todo: NEW TRANSLATION
 grand_tour_events.39.a: "Pokračuj a riskuj výsmech, ak sa mýliš." # todo: NEW TRANSLATION
 grand_tour_events.39.b: "Zájdi až na hranicu možností a na výsmech nehľaď." # todo: NEW TRANSLATION
 grand_tour_events.39.c: "Dnes to bolo celkom vydarené. Nechaj to tak." # todo: NEW TRANSLATION
 grand_tour_events.40.title: "Ukážka zručnosti" # todo: NEW TRANSLATION
 grand_tour_events.40.desc: "Počas súboja v šermiarskej škole v [target_location.GetName] nájde [target_leader.GetName] príležitosť, ktorú ho nenaučil využiť nijaký inštruktor. Na chvíľu všetci v miestnosti sledujú, čo s ňou [target_leader.GetSheHe] urobí." # todo: NEW TRANSLATION
 grand_tour_events.40.a: "Zaútoč a riskuj nepríjemný pád." # todo: NEW TRANSLATION
 grand_tour_events.40.b: "Vynúť si výmenu úderov a na zranenie nehľaď." # todo: NEW TRANSLATION
 grand_tour_events.40.c: "Ukáž, čo v tebe je, a nechaj to tak." # todo: NEW TRANSLATION
 grand_tour_events.40.injury_tt: "[target_leader.GetName] nepekne spadne a zostane ležať, ošetrujúc si modriny aj ranenú pýchu" # todo: NEW TRANSLATION
 grand_tour_events.41.title: "Záchvat choroby" # todo: NEW TRANSLATION
 grand_tour_events.41.desc: "[target_leader.GetName] postihne silná úplavica, ktorú podľa lekárov zrejme spôsobila miestna voda. Ubezpečujú sprievod, že nejde o nič život ohrozujúce, no je to dosť nepríjemné na to, aby [target_leader.GetHerHim] na niekoľko dní pripútalo na lôžko. A ich služby nie sú lacné." # todo: NEW TRANSLATION
 grand_tour_events.41.a: "Zavolaj lekára." # todo: NEW TRANSLATION
 grand_tour_events.41.b: "Zavolaj najlepšieho dostupného lekára." # todo: NEW TRANSLATION
 grand_tour_events.41.c: "Nechaj chorobu, nech sama odznie." # todo: NEW TRANSLATION
 grand_tour_events.42.title: "Túžba po domove" # todo: NEW TRANSLATION
 grand_tour_events.42.desc: "Novota pobytu sa vytratila a [target_leader.GetName] [target_leader.GetHerHis] myšlienky sa zatúlajú domov, predovšetkým k [target_parent.GetName]. Na [target_leader.GetHerHis] sústredení to nepridá." # todo: NEW TRANSLATION
 grand_tour_events.42.a: "Napíš [target_parent.GetHerHim] domov a prilož drobný dar." # todo: NEW TRANSLATION
 grand_tour_events.42.b: "Daj namaľovať portrét a pošli ho [target_parent.GetHerHim]." # todo: NEW TRANSLATION
 grand_tour_events.42.c: "Ukonči cestu a vráť sa domov k [target_parent.GetHerHim]." # todo: NEW TRANSLATION
 grand_tour_events.43.title: "Drahá chyba" # todo: NEW TRANSLATION
 grand_tour_events.43.desc: "Až dodatočne vyjde najavo, že [target_leader.GetName] včera večer na recepcii pozdravil miestneho magistráta skôr, než mal. Porušenie protokolu si všimli všetci v miestnosti okrem sprievodu. Hostiteľ na to zrejme nezabudne bez nejakého ospravedlňujúceho gesta, no nešikovný pokus by mohol situáciu ešte zhoršiť." # todo: NEW TRANSLATION
 grand_tour_events.43.a: "Ponúkni drobný dar na ospravedlnenie a riskuj, že nezaberie." # todo: NEW TRANSLATION
 grand_tour_events.43.b: "Ospravedlň sa veľkolepým gestom." # todo: NEW TRANSLATION
 grand_tour_events.43.c: "Nechaj to tak." # todo: NEW TRANSLATION
 grand_tour_events.44.title: "Zkorumpovaná stráž" # todo: NEW TRANSLATION
 grand_tour_events.44.desc: "Po zotmení sa na [target_leader.GetName] v uličke vrhnú muži v uniformách mestskej stráže. Viac než zákon, ktorý majú chrániť, ich zaujíma mešec cudzinca." # todo: NEW TRANSLATION
 grand_tour_events.44.a: "Ráno udať strážnikov magistrátovi." # todo: NEW TRANSLATION
 grand_tour_events.44.b: "Vyzvať strážnikov v uličke na súboj." # todo: NEW TRANSLATION
 grand_tour_events.44.c: "Utekať na ulicu a volať o pomoc." # todo: NEW TRANSLATION
 grand_tour_events.44.d: "Odovzdať mešec a odísť." # todo: NEW TRANSLATION
 grand_tour_events.45.title: "Spolucestujúci" # todo: NEW TRANSLATION
 grand_tour_events.45.desc: "V dave rušného hostinca sa náš [ROOT.GetCountry.GetGovernment.GetHeirTitle] dá do reči s [gt_friend.GetName], ďalším mladým šľachticom z domova, ktorý putuje po podobných miestach z podobných dôvodov. Okamžite si padnú do oka a vymieňajú si príbehy o svojej krajine aj cestách, až kým ich cesty opäť nerozdelia a každý sa nevydá do iného mesta." # todo: NEW TRANSLATION
 grand_tour_events.45.a: "Začiatok krásneho priateľstva." # todo: NEW TRANSLATION
 grand_tour_events.45.b: "Popraj mu všetko dobré a drž sa vlastnej spoločnosti." # todo: NEW TRANSLATION
 grand_tour_events.friendship_up_1_tt: "Priateľstvo s [gt_friend.GetName] sa prehĺbi (#G +1#! Priateľstvo)" # todo: NEW TRANSLATION
 grand_tour_events.friendship_up_2_tt: "Priateľstvo s [gt_friend.GetName] sa výrazne prehĺbi (#G +2#! Priateľstvo)" # todo: NEW TRANSLATION
 grand_tour_events.friendship_down_1_tt: "Priateľstvo s [gt_friend.GetName] ochladne (#R -1#! Priateľstvo)" # todo: NEW TRANSLATION
 grand_tour_events.friend_joins_court_tt: "[gt_friend.GetName], priateľ, ktorého náš dedič stretol na cestách, je ochotný nasledovať [heir.GetHerHim] domov a vstúpiť do nášho dvora" # todo: NEW TRANSLATION
 grand_tour_events.friend_reunion_intro: "Náhodou pricestoval do [target_location.GetName] aj [gt_friend.GetName]. Cesty oboch priateľov sa po čase opäť skrížili a rozhovor pokračuje, akoby sa nikdy neprerušil." # todo: NEW TRANSLATION
 grand_tour_events.46.title: "Priateľ v núdzi" # todo: NEW TRANSLATION
 grand_tour_events.46.desc: "$grand_tour_events.friend_reunion_intro$ [gt_friend.GetHerHis|U] mešec je, ako [gt_friend.GetSheHe] priznáva, prázdny po sérii nešťastných prehier v kartách. [gt_friend.GetSheHe] sa zjavne zahanbený pýta, či by sme mu mohli nejako pomôcť, kým sa z dlhu nestane škandál." # todo: NEW TRANSLATION
 grand_tour_events.46.a: "Potichu splatiť [gt_friend.GetHerHis] dlh z vlastného mešca." # todo: NEW TRANSLATION
 grand_tour_events.46.b: "Napísať našim známostiam a požiadať ich, aby [gt_friend.GetHerHim] poskytli úver." # todo: NEW TRANSLATION
 grand_tour_events.46.c: "Popriať [gt_friend.GetHerHim] šťastie a nechať [gt_friend.GetHerHim], nech si nájde [gt_friend.GetHerHis] vlastnú cestu von." # todo: NEW TRANSLATION
 grand_tour_events.47.title: "Spoločný objav" # todo: NEW TRANSLATION
 grand_tour_events.47.desc: "$grand_tour_events.friend_reunion_intro$ Keď si rozprávajú, čo sa každý z nich naučil od posledného stretnutia, [gt_friend.GetNameWithNoTooltip] prizná, že nerozumie prednáške o texte, ktorý je nám z vlastného štúdia už jasný, a požiada o pomoc s jeho pochopením." # todo: NEW TRANSLATION
 grand_tour_events.47.a: "Sadnúť si a vysvetliť mu to na základe toho, čo už vieme." # todo: NEW TRANSLATION
 grand_tour_events.47.b: "Namiesto toho najať učiteľa, ktorý [gt_friend.GetHerHim] to vysvetlí." # todo: NEW TRANSLATION
 grand_tour_events.47.c: "Povedať [gt_friend.GetHerHim], že je to jednoduché, a nechať [gt_friend.GetHerHim], nech si s tým poradí." # todo: NEW TRANSLATION
 grand_tour_events.48.title: "Slovo v správnom uchu" # todo: NEW TRANSLATION
 grand_tour_events.48.desc: "$grand_tour_events.friend_reunion_intro$ [gt_friend.GetNameWithNoTooltip] sa dozvedel o súkromnom salóne v [target_location.GetNameWithNoTooltip], kde sa stretávajú vážené rodiny z [target_location.GetRank.GetName], no nikoho tam nepozná, kto by otvoril dvere [gt_friend.GetHerHim]. [target_leader.GetName] má vďaka známostiam nadviazaným na cestách oveľa lepšie možnosti." # todo: NEW TRANSLATION
 grand_tour_events.48.a: "Poslať našej známosti odkaz a zaručiť sa za [gt_friend.GetHerHim]." # todo: NEW TRANSLATION
 grand_tour_events.48.b: "Radšej zaplatiť [gt_friend.GetHerHis] vstup na menej významné stretnutie." # todo: NEW TRANSLATION
 grand_tour_events.48.c: "Povedať [gt_friend.GetHerHim], nech si nájde [gt_friend.GetHerHis] vlastný spôsob, ako sa dostať dnu." # todo: NEW TRANSLATION
 grand_tour_events.49.title: "Hrozba násilia" # todo: NEW TRANSLATION
 grand_tour_events.49.desc: "$grand_tour_events.friend_reunion_intro$ Stretnutie sa rýchlo zvrtne: [gt_friend.GetNameWithNoTooltip] si znepriatelil miestneho úžerníka, ktorý teraz stojí pri ich stole v hostinci s dvoma najatými bitkármi. Sľubuje, že rozbije viac než len nábytok, ak sa dlh ešte dnes večer nesplatí." # todo: NEW TRANSLATION
 grand_tour_events.49.a: "Zasiahnuť osobne; vieme si s takými mužmi poradiť." # todo: NEW TRANSLATION
 grand_tour_events.49.b: "Jednoducho splatiť dlh tomu, komu sa dlhuje, a tým to uzavrieť." # todo: NEW TRANSLATION
 grand_tour_events.49.c: "Nechať [gt_friend.GetHerHim], nech následkom čelí sám." # todo: NEW TRANSLATION
 grand_tour_events.50.title: "Menšia choroba" # todo: NEW TRANSLATION
 grand_tour_events.50.desc: "[target_leader.GetName] sa dozvie, že do [target_location.GetName] pricestoval aj [gt_friend.GetName] a leží v miestnom hostinci s horúčkou a zimnicou, ktorú si privodil na cestách. Hostinský zamrmle, že mladík mal pri platení za izbu prázdny mešec a už dvakrát odmietol miestneho lekára, aby ušetril za jeho služby." # todo: NEW TRANSLATION
 grand_tour_events.50.a: "Zaplatiť lekára napriek [gt_friend.GetHerHis] námietkam." # todo: NEW TRANSLATION
 grand_tour_events.50.b: "Ošetriť [gt_friend.GetHerHim] sami a využiť vlastné skúsenosti z ciest." # todo: NEW TRANSLATION
 grand_tour_events.50.c: "Navštíviť [gt_friend.GetHerHim] a popriať [gt_friend.GetHerHim] skoré uzdravenie." # todo: NEW TRANSLATION
 grand_tour_events.50.d: "Radšej sa k nemu nepribližovať." # todo: NEW TRANSLATION

l_polish:
 mining_survey_events.1.title: "Prieskumná komisia" # todo: NEW TRANSLATION
 mining_survey_events.1.desc: "Na nádvorí čaká skupina prieskumníkov. Ich mulice majú naložené krompáče, vrtáky a naolejovanú drevenú truhlicu s téglikmi, váhami a kyselinami skúšača rúd. Na rok sa vydajú do našich horských krajov, budú skúmať korytá potokov, či v nich nenájdu ryžoviskové zlato, prebíjať sa kremenitými žilami a vypytovať sa pastierov, v ktorých dolinách sa v panvici objaví zlatistý lesk. Kopce už kedysi vydali svoje bohatstvo, často národom, na ktoré sme celkom zabudli. Niet dôvodu myslieť si, že v nich už nič nezostalo." # todo: NEW TRANSLATION
 mining_survey_events.1.a: "Nešetrite výdavkami. Pošlite skúsených skúšačov a zlato na vzorky." # todo: NEW TRANSLATION
 mining_survey_events.1.b: "Postačí skromná odmena. Miestni náčelníci poskytnú sprievodcov aj prístrešie." # todo: NEW TRANSLATION
 mining_survey_events.1.historical_info: "Systematické vyhľadávanie nerastov sa praktizovalo naprieč stredovekou a ranonovovekou Európou, najznámejšie v Krušných horách v Sasku a Čechách, kde objavenie strieborných žíl v dvanástom storočí viedlo k rozmachu banských miest Freiberg, Jáchymov a Schneeberg. Dielo Georga Agricolu #italic De re metallica#! (1556) sa stalo základnou učebnicou tohto remesla. Podrobne opisovalo používanie prútikov na hľadanie rúd, skúšanie vzoriek v malých téglikoch aj právne zvyklosti upravujúce privlastňovanie banských nálezísk." # todo: NEW TRANSLATION
 mining_survey_events.10.title: "Žila [ShowGoodsNameWithNoTooltip('iron')]" # todo: NEW TRANSLATION
 mining_survey_events.10.desc: "Prieskumníci narazili na žilu vysokokvalitnej [ShowGoodsName('iron')] rudy, ktorá sa tiahne hlboko do hory. Skala je tam, kde ju odhalili krompáče, pretkaná čiernymi a červenými pásmi. Náčelník najbližšej dediny vraví, že jeho starý otec hovoril o dávnych banských dielach kdesi na svahu nad ňou; nové šachty možno iba znovu otvárajú to, čo sa stratilo. Ak sa nález potvrdí, vyhne a huty po prúde budú mať na celé pokolenie dostatok práce." # todo: NEW TRANSLATION
 mining_survey_events.10.a: "Oznámte nález. Nech [ROOT.GetCountry.GetFlavorRank] vie, čo máme." # todo: NEW TRANSLATION
 mining_survey_events.10.b: "Rozvíjajte ťažbu potichu. Konkurenčné huty sa o tom zatiaľ nemusia dozvedieť." # todo: NEW TRANSLATION
 mining_survey_events.10.historical_info: "Ťažba železa v predmodernej Európe sa sústreďovala na malé povrchové bane a plytké šachty, ktoré sledovali viditeľné výchozy rudy. V blízkosti bane sa v nízkych peciach ruda premieňala na kujné železo. Vysoká pec, zavedená v neskorom stredoveku, umožnila vyrábať liatinu v oveľa väčšom množstve a významné železiarske oblasti Švédska, Štajerska a Baskicka na nej založili svoj ranonovoveký rozkvet." # todo: NEW TRANSLATION
 mining_survey_events.11.title: "Ložisko [ShowGoodsNameWithNoTooltip('copper')]" # todo: NEW TRANSLATION
 mining_survey_events.11.desc: "Prieskumníci sledovali zelenkastý pás skaly po svahu a našli jeho zdroj: žilu [ShowGoodsName('copper')], ktorá sa tiahne skalnou stenou, vystavená poveternostným vplyvom a pripravená na otvorenie. Skúšač rozbil vzorku na prenosnej nákove, vložil ju do téglika a oznámil, že kov je čistý a výťažnosť dobrá. Z miest na juhu už povolávajú tavičov." # todo: NEW TRANSLATION
 mining_survey_events.11.a: "Rozvíjajte ťažbu otvorene. Nech sa [ROOT.GetCountry.GetFlavorRank] dozvie o našej [ShowGoodsNameWithNoTooltip('copper')]." # todo: NEW TRANSLATION
 mining_survey_events.11.b: "Rozvíjajte ťažbu potichu. Mosadzníci zaplatia viac, ak sa o tom nebude hovoriť." # todo: NEW TRANSLATION
 mining_survey_events.11.historical_info: "Ťažba medi sa v predindustriálnej Európe sústreďovala do niekoľkých známych oblastí: Falunu vo Švédsku, svahov Krušných hôr, saského Mansfeldu a Tirolských Álp. Kov bol nevyhnutný na výrobu bronzových diel, obkladanie lodí aj mosadzných predmetov. Výnosná medená baňa mohla obohatiť korunu, ktorej patrila, aj kupecké rody, ktoré financovali jej rozvoj. Bankárska dynastia Fuggerovcov získala význam čiastočne vďaka kontrole nad tirolskou meďou." # todo: NEW TRANSLATION
 mining_survey_events.12.title: "Ložisko [ShowGoodsNameWithNoTooltip('tin')] v kopcoch" # todo: NEW TRANSLATION
 mining_survey_events.12.desc: "Prieskumníci sledovali tmavé zrnká kasiteritu v koryte potoka až na svah a našli ložisko tam, kde vychádza na povrch. Hornina s obsahom [ShowGoodsName('tin')] sa tiahne pozdĺž kremennej žily v hrubom a čistom páse. Baníci už stavajú drevené šachty a na úpätí kopca budujú úpravňu rudy. Bronzolejárni, cínolejári aj výrobcovia plechového riadu budú mať na celé pokolenie dostatok materiálu." # todo: NEW TRANSLATION
 mining_survey_events.12.a: "Oznámte nález. Nové ložisko [ShowGoodsNameWithNoTooltip('tin')] je vecou štátu." # todo: NEW TRANSLATION
 mining_survey_events.12.b: "Zachovajte mlčanlivosť. Získajme kontrolu nad obchodom s bronzom skôr než súperi." # todo: NEW TRANSLATION
 mining_survey_events.12.historical_info: "Cín bol v predmodernom svete strategickým kovom, nevyhnutným na výrobu bronzových diel aj cínového riadu. Jeho zásoby sa sústreďovali v niekoľkých známych oblastiach: v Cornwalle, Krušných horách a častiach Čiech. Kornské banícke oblasti Stannaries mali od stredoveku osobitné právne postavenie, vlastné súdy a parlament. Obchod s kornským cínom zásoboval výrobu mosadze a bronzu naprieč atlantickou Európou." # todo: NEW TRANSLATION
 mining_survey_events.13.title: "Galenit vo vápenci" # todo: NEW TRANSLATION
 mining_survey_events.13.desc: "V kopcovitej krajine odkryli žilu galenitu. Jeho tmavé kryštály sa trblietajú striebrom, čo sľubuje užitočný vedľajší produkt pri tavení. [ShowGoodsName('lead')] z tejto žily poslúži na pokrývanie kostolov, výrobu potrubia aj odlievanie guliek, zatiaľ čo podiel [ShowGoodsName('silver')] pomôže financovať rozvoj bane. Vedúci bane hlási čistú pracovnú stenu a stály prúd vzduchu v novej šachte." # todo: NEW TRANSLATION
 mining_survey_events.13.a: "Oznámte nález. [ShowGoodsNameWithNoTooltip('lead')] je vecou verejného záujmu." # todo: NEW TRANSLATION
 mining_survey_events.13.b: "Potichu zazmluvnite dodávky pre prachárne a tlačiarov." # todo: NEW TRANSLATION
 mining_survey_events.13.historical_info: "Olovo a striebro sa v predmodernej Európe takmer vždy ťažili spoločne. Ruda galenitu poskytovala oba kovy pomocou kupelácie, procesu vynájdeného v staroveku a zdokonaľovaného počas stredoveku. Dôležitými oblasťami ťažby olova a striebra boli anglické pohorie Mendip, saské pohorie Harz aj španielska Sierra Morena. Vyťažené olovo ovplyvnilo všetko od striech katedrál cez tlačiarenské písmo až po vodovodné potrubia v mestách." # todo: NEW TRANSLATION
 mining_survey_events.14.title: "[ShowGoodsNameWithNoTooltip('silver')] v skale" # todo: NEW TRANSLATION
 mining_survey_events.14.desc: "Prieskumníci narazili na [ShowGoodsName('silver')], žilu dosť širokú na to, aby sa do nej dalo zahnať krompáčom, a dosť čistú na to, aby sa leskla už po vyťažení zo skaly. Tégliky skúšača sú ešte horúce po skúšobnom tavení. Šachta je vystužená drevom a prvé vozíky rudy už ťahajú na povrch vŕzgajúcim rumpálom. Mincovni nebude po celé toto pokolenie chýbať drahý kov a dvory v [ShowContinentName('europe')] sa o náleze dozvedia ešte do roka." # todo: NEW TRANSLATION
 mining_survey_events.14.a: "Oznámte to [ROOT.GetCountry.GetFlavorRank]. Baňa na [ShowGoodsNameWithNoTooltip('silver')] je triumfom." # todo: NEW TRANSLATION
 mining_survey_events.14.b: "Zachovajte mlčanlivosť. Cudzie oči upreté na naše [ShowGoodsNameWithNoTooltip('silver')] prinesú problémy." # todo: NEW TRANSLATION
 mining_survey_events.14.historical_info: "Ťažba striebra zmenila európske hospodárstvo v neskorom stredoveku a ranom novoveku. Objavenie veľkých strieborných žíl v tirolskom Schwaze a českom Jáchymove koncom 15. storočia a následný nález v Potosí v Andách v roku 1545 zaplavili Európu drahým kovom a podporili veľkú infláciu 16. storočia. Výnosná strieborná baňa bola strategickým majetkom porovnateľným s flotilou či pevnosťou." # todo: NEW TRANSLATION
 mining_survey_events.15.title: "Žltý kov" # todo: NEW TRANSLATION
 mining_survey_events.15.desc: "Prieskumníci narazili na [ShowGoodsName('goods_gold')]. Na skalnej stene sa vyníma kremenná žila popretkávaná hrubými nitkami kovu, ktorú odhalil zimný zosuv skál a pôdy. Kov sa leskne vo svetle lámp a od svojho vzniku zostal nedotknutý. Náčelník dediny ponúka, že prenajme baňu [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')] za to, čo nazýva spravodlivým podielom. Skúšač odporúča ponuku prijať, no za určitých podmienok." # todo: NEW TRANSLATION
 mining_survey_events.15.a: "Oznámte nález. Nech sa o ňom dozvedia naši nepriatelia." # todo: NEW TRANSLATION
 mining_survey_events.15.b: "Rozvíjajte ťažbu potichu. [ShowGoodsNameWithNoTooltip('goods_gold')] priťahuje neželaných návštevníkov." # todo: NEW TRANSLATION
 mining_survey_events.15.historical_info: "Prírodné ložiská zlata boli v predmodernej Európe zriedkavé a rýchlo sa vyčerpali. Stredoveké zlaté bane v Kremnici na Slovensku a vo Vránči vo Valašsku boli významnými miestnymi zdrojmi, no väčšina európskeho zlata pochádzala z ryžovania v riekach, ako boli Rýn a Tajo, alebo zo získavania striebornej zložky olovnato-strieborných rúd. Objavenie akéhokoľvek väčšieho množstva prírodného zlata bolo mimoriadnym ziskom, na ktorý si koruna vždy nárokovala." # todo: NEW TRANSLATION
 mining_survey_events.16.title: "Čierny kameň horí jasným plameňom" # todo: NEW TRANSLATION
 mining_survey_events.16.desc: "Kopce tu pretína hrubá žila [ShowGoodsName('coal')], ktorá na dvoch miestach vychádza na povrch, kde erózia potoka odkryla horninové vrstvy. Žilu možno sledovať a [ShowGoodsNameWithNoTooltip('coal')] horí čisto. Miestni kováči už vymieňajú drevo do svojich vyhní za toto palivo. Vďaka tejto žile budú mať vyhne, soľné panvy aj sklárne palivo bez ďalšieho odlesňovania krajiny." # todo: NEW TRANSLATION
 mining_survey_events.16.a: "Rozvíjajte ťažbu na základe [ROOT.GetCountry.GetGovernment.GetAdjective]ho povolenia. Oznámte to [ROOT.GetCountry.GetFlavorRank]." # todo: NEW TRANSLATION
 mining_survey_events.16.b: "Prenajmite bane železiarom za pravidelný podiel." # todo: NEW TRANSLATION
 mining_survey_events.16.historical_info: "Uhlie sa v Európe v malom ťažilo od stredoveku, predovšetkým vo Walese, v uhoľnej panve pri Newcastle a v okolí Liège. Skutočný rozmach nastal až počas ranonovovekej palivovej krízy, keď sa lesy klčovali, aby vznikla nová orná pôda. V 17. storočí sa z Newcastle do Londýna prepravovali po mori tisíce ton uhlia a bez neho by železiarstvo neprežilo stratu dreveného uhlia." # todo: NEW TRANSLATION
 mining_survey_events.17.title: "Dobrá [ShowGoodsNameWithNoTooltip('stone')] na opracovanie" # todo: NEW TRANSLATION
 mining_survey_events.17.desc: "V kopcoch otvorili nový kameňolom. [ShowGoodsName('stone')] sa štiepi čisto pozdĺž vrstiev a po vystavení vzduchu tvrdne. Na obhliadku vzorky priviedli majstra kamenára zo stavby katedrály. Vyhlásil, že sa hodí na kvádre, jemné rezbárske práce aj nosné murivo. Z kameňa z tohto lomu budú po celé pokolenie stavať katedrály a hradby v okruhu stoviek míľ." # todo: NEW TRANSLATION
 mining_survey_events.17.a: "Prevezmite lom pod [ROOT.GetCountry.GetGovernment.GetAdjective] kontrolu. [ShowGoodsNameWithNoTooltip('stone')] má strategický význam." # todo: NEW TRANSLATION
 mining_survey_events.17.b: "Prenajmite kameňolom cechu kamenárov za pravidelný nájom." # todo: NEW TRANSLATION
 mining_survey_events.17.historical_info: "Stavebný kameň bol v predindustriálnej Európe komoditou s pomalým obratom, no veľkou hodnotou, pretože jeho cenu určovali predovšetkým náklady na dopravu. Výnosný kameňolom v dosahu jednodňovej cesty od veľkého mesta či staveniska predstavoval dlhodobý majetok. Veľké stredoveké stavby katedrál v Remeši, Salisbury a Kolíne mali vlastné lomy, ktoré po celé generácie dodávali potrebný kameň." # todo: NEW TRANSLATION
 mining_survey_events.18.title: "[ShowGoodsNameWithNoTooltip('marble')] v údolí" # todo: NEW TRANSLATION
 mining_survey_events.18.desc: "V chránenej doline našli žilkovaný [ShowGoodsName('marble')] najvyššej kvality. Majster kamenár odrezal vzorku, ktorú možno vyleštiť do hlbokého, priesvitného lesku. Miestni sochári už žiadajú prednostné právo na odber. Z tohto kameňolomu budú po celé pokolenie čerpať dielne aj v ďalekých hlavných mestách a rezbári oltárnych obrazov i náhrobných pomníkov budú ďakovať šťastene." # todo: NEW TRANSLATION
 mining_survey_events.18.a: "Oznámte to. Veľký kameňolom na [ShowGoodsNameWithNoTooltip('marble')] je národným pokladom." # todo: NEW TRANSLATION
 mining_survey_events.18.b: "Potichu vyhraďte [ShowGoodsNameWithNoTooltip('marble')] na [ROOT.GetCountry.GetGovernment.GetAdjective] použitie." # todo: NEW TRANSLATION
 mining_survey_events.18.historical_info: "Mramor na jemné sochárstvo a architektúru sa v stredovekej a renesančnej Európe ťažil v niekoľkých slávnych lomoch: v toskánskej Carrare, na gréckych ostrovoch Paros a Pentelikon aj v Saint-Béat v Pyrenejach. Objavenie nového výnosného ložiska mramoru vhodného na sochárstvo bolo významnou udalosťou pre umelcov, ktorí si objednávali vzorky a osobne cestovali, aby nález preskúmali." # todo: NEW TRANSLATION
 mining_survey_events.19.title: "Kamene, ktoré zachytávajú svetlo" # todo: NEW TRANSLATION
 mining_survey_events.19.desc: "Prieskumníci našli v koryte potoka štrky s obsahom [ShowGoodsName('gems')] a vystopovali ich až k bohatšiemu ložisku na svahu nad ním. Tam je pegmatitová hornina pretkaná kryštálmi. Zástupca brusičov drahokamov, ktorého priviedli z hlavného mesta, rozdeľuje hromadu surových kameňov podľa farby a čírosti a hlási, že podiel vhodný na brúsenie je výnimočný. Dvorným klenotníkom nebude po celé toto pokolenie chýbať drahokamov." # todo: NEW TRANSLATION
 mining_survey_events.19.a: "Oznámte nález. Baňa na [ShowGoodsNameWithNoTooltip('gems')] je div, ktorým sa oplatí chváliť." # todo: NEW TRANSLATION
 mining_survey_events.19.b: "Potichu ponechajte [ShowGoodsNameWithNoTooltip('gems')] v [ROOT.GetCountry.GetGovernment.GetAdjective] pokladnici." # todo: NEW TRANSLATION
 mining_survey_events.19.historical_info: "Ťažba drahokamov v Európe bola v porovnaní s veľkými náleziskami v Indii a Barme iba okrajovou záležitosťou. Miestne zdroje granátov, berylov, ametystov a topásov sa však ťažili v českých horách, škótskych Cairngorms a častiach Pyrenejí. Brusičské dielne v Idar-Obersteine v Porýní sa stali centrom brúsenia miestne vyťažených kameňov a výnosný nález mohol ich remeselníkov zamestnať na celé roky." # todo: NEW TRANSLATION
 mining_survey_events.20.title: "Rumelka v kopcoch" # todo: NEW TRANSLATION
 mining_survey_events.20.desc: "Vo vysočine otvorili ložisko rumelky. Jej žiarivá červená ruda neomylne svedčí o prítomnosti [ShowGoodsName('mercury')] v hornine. Retortu a chladič už stavajú v bezpečnej vzdialenosti od bane, pretože je známe, že výpary pri pražení uvoľňujú zuby a zatemňujú rozum. Alchymisti, skúšači rúd aj pozlacovači budú z tejto bane čerpať celé pokolenie a za taký vzácny a užitočný kov si môžeme pýtať, koľko len chceme." # todo: NEW TRANSLATION
 mining_survey_events.20.a: "Rozvíjajte baňu otvorene. [ShowGoodsNameWithNoTooltip('mercury')] je strategickou surovinou." # todo: NEW TRANSLATION
 mining_survey_events.20.b: "Rozvíjajte ťažbu potichu. Monopol na [ShowGoodsNameWithNoTooltip('mercury')] je mocná vec." # todo: NEW TRANSLATION
 mining_survey_events.20.historical_info: "Ortuť, jediný kov, ktorý je pri izbovej teplote kvapalný, bola nevyhnutná pri amalgamácii, ktorá sa v 16. storočí stala hlavnou metódou spracovania amerického striebra. Dve najväčšie európske ložiská boli baňa Almadén v Kastílii a Idrija v Kraňsku. Španielska koruna udržiavala baňu Almadén pod prísnym kráľovským monopolom a ortuť sa pod námorným sprievodom prevážala na galeónach do Mexika a Peru." # todo: NEW TRANSLATION
 mining_survey_events.21.title: "Soľný prameň" # todo: NEW TRANSLATION
 mining_survey_events.21.desc: "Vo vysočine otvorili nové ložisko kamennej [ShowGoodsName('salt')] a tam, kde vrstvy pretínajú dno údolia, vyvierajú slané pramene. Soľníci už pracujú a miestni roľníci posielajú dobytok piť k slaným výverom. Obchod so soleným mäsom aj jedálenské stoly budú bohatšie a ak sa rozhodneme zaviesť daň z gabely, samotný tento nález pokryje celoročné výdavky [ROOT.GetCountry.GetGovernment.GetAdjective]ho dvora." # todo: NEW TRANSLATION
 mining_survey_events.21.a: "Rozvíjajte ťažbu [ShowGoodsNameWithNoTooltip('salt')] na základe [ROOT.GetCountry.GetGovernment.GetAdjective]ho povolenia." # todo: NEW TRANSLATION
 mining_survey_events.21.b: "Prenajmite prevádzku obchodníkom so soľou za pravidelný podiel." # todo: NEW TRANSLATION
 mining_survey_events.21.historical_info: "Soľ bola v predmodernej Európe strategickou surovinou, nevyhnutnou na konzervovanie potravín a významným zdrojom štátnych príjmov vďaka rôznym daniam a monopolom. Najznámejšou z nich bola francúzska gabela. Veľké soľné bane vo Wieliczke v Poľsku, Hallstatte v Rakúsku a Cardone v Katalánsku fungovali po celé stáročia a priniesli bohatstvo rodinám i korunám, ktorým patrili." # todo: NEW TRANSLATION
 mining_survey_events.22.title: "Objavené bridlice s obsahom [ShowGoodsNameWithNoTooltip('alum')]" # todo: NEW TRANSLATION
 mining_survey_events.22.desc: "Prieskumníci našli v kopcovitej krajine bridlice s obsahom [ShowGoodsName('alum')]. Hornina zvetráva na soľ, za ktorú farbiari zaplatia akúkoľvek cenu. Skúšobná retorta vyrobila z prvých vzoriek čistý biely [ShowGoodsNameWithNoTooltip('alum')] a zástupcovia obchodníkov s látkami sa už vypytujú na dlhodobé zmluvy. Textilný priemysel dlho čakal na zdroj bližší než pápežský monopol v Tolfi." # todo: NEW TRANSLATION
 mining_survey_events.22.a: "Oznámte nález. [ShowGoodsNameWithNoTooltip('alum')] je triumfom remeselnej zručnosti [ROOT.GetCountry.GetFlavorRank]." # todo: NEW TRANSLATION
 mining_survey_events.22.b: "Rozvíjajte ťažbu potichu. Pápežský monopol na [ShowGoodsNameWithNoTooltip('alum')] sa o tom nemusí dozvedieť." # todo: NEW TRANSLATION
 mining_survey_events.22.historical_info: "Kamenec, nevyhnutný prostriedok na fixáciu farbív na látke, bol strategickou surovinou pre textilný priemysel počas celého stredoveku i raného novoveku. Objavenie veľkých ložísk kamenca v Tolfi v Pápežskom štáte v roku 1462 vytvorilo vatikánsky monopol, ktorý trval viac než storočie, kým sa neotvorili nové zdroje v Anglicku, Švédsku a Holandsku. Každý štát, ktorý si dokázal zabezpečiť vlastný kamenec, oslobodil svoj textilný priemysel od nepríjemnej závislosti od cudziny." # todo: NEW TRANSLATION
 mining_survey_events.23.title: "[ShowGoodsNameWithNoTooltip('saltpeter')] v údolí" # todo: NEW TRANSLATION
 mining_survey_events.23.desc: "[ShowGoodsName('saltpeter')] získali z pôdy v chránenom údolí. Po jarnom topení snehu sa na skalnej stene objavili biele kryštály. Majster prachár, ktorého priviedli z arzenálu, preskúmal surový liadok a vyhlásil ho za vhodný na spracovanie na pušný prach najvyššej kvality. Prachárňam nebude po celé toto pokolenie chýbať liadok a delostrelectvo [ROOT.GetCountry.GetFlavorRank] bude konečne zodpovedať jeho ambíciám." # todo: NEW TRANSLATION
 mining_survey_events.23.a: "Zaveďte [ROOT.GetCountry.GetGovernment.GetAdjective] monopol na ťažbu. [ShowGoodsNameWithNoTooltip('saltpeter')] znamená vojnu." # todo: NEW TRANSLATION
 mining_survey_events.23.b: "Nechajte ložisko rozvíjať obchodníkov s pušným prachom výmenou za prednostný odber." # todo: NEW TRANSLATION
 mining_survey_events.23.historical_info: "Liadok, hlavná zložka pušného prachu, sa v predmodernej Európe získaval z chránenej pôdy, dlhodobo hnojenej maštaľným hnojom a trusom, alebo sa za vysokú cenu dovážal z Indie a Levanty. Štátna kontrola nad jeho výrobou bola strategickou záležitosťou. V Anglicku pôsobili vyberači liadku, ktorí mali zákonné právo kopať pod stajňami a holubníkmi, a Francúzsko udržiavalo kráľovský monopol #italic Régie des Poudres#! až do 19. storočia." # todo: NEW TRANSLATION
 mining_survey_events.30.title: "Zával v skúšobnej bani" # todo: NEW TRANSLATION
 mining_survey_events.30.desc: "V prieskumnej bani na [ShowGoodsName('iron')] došlo k nešťastiu. Skúšobná šachta sa v noci zrútila, keď pomaly sadala uvoľnená bridlica nad rudným pásmom a vytrhla drevené výstuže. Dvaja členovia prieskumnej skupiny zostali zasypaní; tretieho, učňa skúšača, vytiahli so zlomenou nohou a odhodlaním už nikdy nevstúpiť do šachty. Vedúci bane vraví, že [ShowGoodsNameWithNoTooltip('iron')] tam je, no dostať sa k nemu znamená vyraziť novú štôlňu cez tvrdšiu horninu, čo bude stáť nemalé peniaze." # todo: NEW TRANSLATION
 mining_survey_events.30.a: "Stiahnite skupinu. Nie každé nálezisko stojí za to, aby sme preň pochovávali ľudí." # todo: NEW TRANSLATION
 mining_survey_events.30.historical_info: "Zrútenia stropov a zlyhania šácht boli stálym pracovným nebezpečenstvom v predmodernej baníctve. Drevené výstuže vo vlhkých baniach hnili, uvoľnené vrstvy nad rudným pásmom sa bez varovania zosúvali a pri tradičnej metóde pilierovej ťažby zostávali po vyťažení rudy čoraz väčšie nepodopreté priestory. Kaplnky, pohrebné cechy a fondy pre vdovy po baníkoch boli stálou súčasťou každého európskeho banského revíru." # todo: NEW TRANSLATION
 mining_survey_events.31.title: "Jedovatý dym z bane" # todo: NEW TRANSLATION
 mining_survey_events.31.desc: "V prieskumnej bani na [ShowGoodsName('copper')] sa nachádza ruda nečakaného zloženia. Prvá pražiaca halda, zriadená na odstránenie sulfidov pred tavením, vypúšťa štipľavý žltý dym, ktorý vyhnal robotníkov zo svahu a spálil trávu na pol míle po smere vetra. Miestni roľníci podali oficiálnu sťažnosť. Hutník vraví, že môže postaviť riadne pražiace pece na zachytávanie výparov, no bude to stáť zlato a čas, s ktorými sme nerátali." # todo: NEW TRANSLATION
 mining_survey_events.31.a: "Zanechajte prieskum. Miestni sa nemýlia, vzduch je škodlivý." # todo: NEW TRANSLATION
 mining_survey_events.31.historical_info: "Pri tavení sulfidických medených rúd sa uvoľňovalo veľké množstvo oxidu siričitého, ktorý poškodzoval úrodu, dobytok aj pľúca obyvateľov v okolí. Švédsky medený revír Falun bol známy dymom, ktorý vraj premieňal okolité polia na neúrodnú pustatinu v okruhu mnohých míľ. Podobne ničivé bolo aj veľké údolie na tavenie medi v dolnom Harzi. Súdne žaloby proti baníckym prevádzkam za škody spôsobené dymom boli bežné už od stredoveku." # todo: NEW TRANSLATION
 mining_survey_events.32.title: "Koryto potoka vyschlo" # todo: NEW TRANSLATION
 mining_survey_events.32.desc: "Prieskum ložiska [ShowGoodsName('tin')] spočiatku sľuboval veľa: náplavový kasiterit sa dal v pracovateľnom množstve premývať z koryta potoka a odvážať na vozoch. Zdroj náplavu sa však nepodarilo nájsť a ťažká ruda z koryta už zmizla. V jamách vykopaných vyššie na svahu sa našla iba jalová hornina. Skupine došli zjavné miesta na kopanie a ťažko sa dá ospravedlniť cena za hlbšie šachty bez akýchkoľvek náznakov nálezu." # todo: NEW TRANSLATION
 mining_survey_events.32.a: "Zanechajte prieskum. Náplavové ložisko bolo iba krátkym zábleskom." # todo: NEW TRANSLATION
 mining_survey_events.32.historical_info: "Ryžovanie cínu v náplavoch potokov a riek bolo pôvodným spôsobom ťažby cínu v Cornwalle a pretrvalo až do raného novoveku. Keď sa ľahko dostupné štrky vyťažili, baníci museli systematickým prieskumom okolitých kopcov vystopovať náplav späť k jeho zdroju. Mnohé sľubné potoky neviedli k ničomu viac než k chudobnej rozptýlenej žile, ktorej podzemná ťažba sa nevyplatila." # todo: NEW TRANSLATION
 mining_survey_events.33.title: "Robotníci ochoreli" # todo: NEW TRANSLATION
 mining_survey_events.33.desc: "Z prieskumnej bane na [ShowGoodsName('lead')] pochádza ruda. Od robotníkov zas prichádzajú sťažnosti. Muži po zmene majú ďasná sfarbené dosiva, opuchnuté kĺby a pohybujú sa spomalene. Táborový lekár to nazýva kolikou olovičiarov. Dvaja zomreli a ďalší štyria sú príliš chorí na to, aby zostúpili do šachty. Vedúci bane vraví, že v práci možno pokračovať, ak najeme náhradníkov a prijmeme straty, no miestny náčelník sa naliehavo pýta, kto bude ďalší." # todo: NEW TRANSLATION
 mining_survey_events.33.a: "Zatvorte baňu. Neprišli sme pochovávať slobodných mužov [ROOT.GetCountry.GetFlavorRank]." # todo: NEW TRANSLATION
 mining_survey_events.33.historical_info: "Otrava olovom, v staroveku známa ako #italic colica plumbica#!, bola dobre známou chorobou baníkov, hutníkov, sklárov a hrnčiarov pracujúcich s olovom. Základné dielo pracovného lekárstva, #italic De morbis artificum diatriba#! Bernardina Ramazziniho (1700), jej venovalo rozsiahlu kapitolu. Bežné spôsoby liečby, ako púšťanie žilou, preháňadlá a pitie mlieka, neúčinkovali. Jedinou skutočnou prevenciou bolo obmedzenie vystavenia olovu, na čo však vlastníci baní nemali veľkú ekonomickú motiváciu." # todo: NEW TRANSLATION
 mining_survey_events.34.title: "Žila sa stráca" # todo: NEW TRANSLATION
 mining_survey_events.34.desc: "Žila [ShowGoodsName('silver')] bola v mieste prvého výkopu široká a prvé vozíky rudy obsahovali vyše tridsať mariek [ShowGoodsNameWithNoTooltip('silver')] na cent. O desať metrov ďalej po sklone sa však žila prudko zúžila, ruda zoslabla a jej ťažba už sotva pokryje náklady na vynášanie horniny na povrch. Geologický termín znie #italic vyklinovanie#!. Výraz baníkov je o čosi menej slušný. Ďalšie [ShowGoodsNameWithNoTooltip('silver')] sa možno nachádza pozdĺž zlomu, no nájsť ho bude znamenať nákladné prieskumné šachty bez akýchkoľvek indícií." # todo: NEW TRANSLATION
 mining_survey_events.34.a: "Stiahnite sa. Zúžená žila je zavretými dverami." # todo: NEW TRANSLATION
 mining_survey_events.34.historical_info: "Strieborné žily mali povestne premenlivú hrúbku. Na niektorých miestach sa rozširovali na rudné telesá hrubé niekoľko stôp, inde sa zužovali na jalové žilky. Nepredvídateľnosť žilnej geológie robila z ťažby striebra hazardnú hru založenú na skúsenostiach. Vzostup a úpadok stredovekých banských miest, ako boli Jáchymov, Schwaz a Jihlava, pravidelne sprevádzalo objavenie a vyčerpanie konkrétnych žíl." # todo: NEW TRANSLATION
 mining_survey_events.35.title: "Nie všetko, čo sa blyští, je zlato" # todo: NEW TRANSLATION
 mining_survey_events.35.desc: "Prieskum ložiska [ShowGoodsName('goods_gold')] priniesol sklamanie. Žiarivé kovové šupinky v kremeni nie sú [ShowGoodsNameWithNoTooltip('goods_gold')], ale pyrit, sulfid železa, ktorý mýli prieskumníkov už od úsvitu metalurgie. Prvá skúška skúšača redukciou v tégliku nevytvorila žltú kvapku [ShowGoodsNameWithNoTooltip('goods_gold')], ale iba tenkú červenú sírnatú vrstvu a kúsok surového železa. Náčelník miestnej dediny sa očividne vôbec nečuduje; počul staré príbehy svojho starého otca o #italic Narrengold#! na tomto svahu a čakal, či naši učenci spoznajú rozdiel." # todo: NEW TRANSLATION
 mining_survey_events.35.a: "Zbaľte sa a odíďte. Mačacie zlato, najstarší trik prieskumníkov." # todo: NEW TRANSLATION
 mining_survey_events.35.historical_info: "Pyrit, sulfid železa, ktorý sa v hornine blyští mosadznou žltou farbou a v nemeckých banských oblastiach si vyslúžil ľudový názov #italic Narrengold#! (mačacie zlato), mýli hľadačov zlata odvtedy, čo ľudia začali pátrať po pravom kove. Rozlišovacie skúšky boli bežnou praxou každého schopného skúšača: kujnosť pod kladivom (pyrit sa rozbije, zlato sa sploští), merná hmotnosť (zlato je devätnásťkrát hustejšie než voda, pyrit iba päťkrát) a správanie pri skúške ohňom (zlato prežije, pyrit sa vypraží na síru a oxid železitý)." # todo: NEW TRANSLATION
 mining_survey_events.36.title: "Výbušný plyn v žile" # todo: NEW TRANSLATION
 mining_survey_events.36.desc: "Žila [ShowGoodsName('coal')] je hrubá a čistá. Je však aj plná banského plynu. Bažinný plyn, ktorý sa hromadí v každej hlbokej [ShowGoodsNameWithNoTooltip('coal')] bani, sa vznietil od kahanca jedného z rubáčov. Následný výbuch troch mužov na mieste zabil a ďalších šiestich popálil tak vážne, že už nebudú môcť pracovať. Vedúci bane hovorí, že žilu možno dobývať, ale iba pri neustálom vetraní vetracou šachtou a pecou, čo si vyžiada značné investície ešte predtým, než sa vyťaží akékoľvek [ShowGoodsNameWithNoTooltip('coal')]." # todo: NEW TRANSLATION
 mining_survey_events.36.a: "Zatvorte baňu. Zatiaľ nie sme vybavení na boj s banským plynom." # todo: NEW TRANSLATION
 mining_survey_events.36.historical_info: "Banský plyn, metán hromadiaci sa v uhoľných baniach, ktorý sa vznieti od každého plameňa a exploduje, bol postrachom a častou príčinou smrti baníkov v predindustriálnej ére. Bežným opatrením bolo systematické vetranie pomocou dvojice šácht s pecou pri ústí výdušnej šachty, ktorá ťahala vzduch cez banské diela. Davyho bezpečnostná lampa, ktorá umožňovala svietiť bez vznietenia plynu, bola vynájdená až v roku 1815. Dovtedy sa každá hlboká uhoľná žila dobývala s vedomím, že môže kedykoľvek dôjsť ku katastrofe." # todo: NEW TRANSLATION
 mining_survey_events.37.title: "Lom zaplavila voda" # todo: NEW TRANSLATION
 mining_survey_events.37.desc: "[ShowGoodsName('stone')] je vynikajúci, ale lom sa nedarí udržať suchý. Prvá šachta, vyhĺbená dvanásť stôp do vrstvy horniny, sa cez noc plní vodou z prameňa, s ktorým kamenári nerátali, a spodná vrstva [ShowGoodsNameWithNoTooltip('stone')] je teraz pod tromi stopami studenej vody. Majster kamenár hovorí, že v lome možno pracovať, ak sa do údolia pod ním vyrazí odvodňovacia štôlňa, no jej vybudovanie predstavuje celý rok kamenárskej práce a rozpočet s tým nepočítal." # todo: NEW TRANSLATION
 mining_survey_events.37.a: "Opustite lom. Zaplavený lom je zatvorený lom." # todo: NEW TRANSLATION
 mining_survey_events.37.historical_info: "Odvodňovanie lomov bolo v predindustriálnom kamenárstve stálym technickým problémom a mnohé inak výnosné lomy sa opúšťali, keď pracovisko kleslo pod miestnu hladinu podzemnej vody. Bežným riešením boli odvodňovacie štôlne vyrazené vodorovne smerom k nižšie položenej oblasti (takzvané #italic Stollen#! v nemeckej baníckej tradícii), vodné kolesá poháňajúce čerpadlá s reťazou vedier a od 17. storočia postupné zavádzanie parných čerpacích strojov." # todo: NEW TRANSLATION
 mining_survey_events.38.title: "Blok sa rozpadol" # todo: NEW TRANSLATION
 mining_survey_events.38.desc: "[ShowGoodsName('marble')] spočiatku vyzeral na pracovnej stene neporušene. O dva dni neskôr, keď sa prvý obrovský blok konečne oddelil od podložia a spustili ho na drevené valce, praskol pozdĺž neviditeľnej trhliny a pod váhou vlastného zostupu sa rozlomil na šesť bezcenných kusov. Majster kamenár obíde vyradený blok, poklepe naň kladivom a vysloví to, čo už celý tím vie: [ShowGoodsNameWithNoTooltip('marble')] v tejto rokline pretínajú vnútorné trhliny, ktoré pri prehliadke pracovnej steny nebolo možné odhaliť." # todo: NEW TRANSLATION
 mining_survey_events.38.a: "Zatvorte lom. Popraskaný [ShowGoodsNameWithNoTooltip('marble')] sa hodí už len na cestný štrk." # todo: NEW TRANSLATION
 mining_survey_events.38.historical_info: "Mramorové bloky určené na sochy a honosné architektonické diela museli byť bez vnútorných kazov. Objavenie skrytých trhlín (#italic peli#! v slangu talianskych kamenárov) bolo stálym postrachom tohto remesla. Majstri sochári osobne navštevovali lomy a kontrolovali hrubé bloky ešte pred objednávkou, pričom cena významnej sochárskej zákazky počítala s veľkou rezervou na bloky, ktoré sa po dodaní ukázali ako chybné." # todo: NEW TRANSLATION
 mining_survey_events.39.title: "Sklo, nie kryštály" # todo: NEW TRANSLATION
 mining_survey_events.39.desc: "Štrky s obsahom [ShowGoodsName('gems')] boli nezvyčajne bohaté. Podozrivo bohaté. Kráľovský brusič drahokamov, ktorého pod dozorom priviezli z hlavného mesta, skúma nález pri silnom svetle lampy, váži každý kameň v dlani, poškriabe ho úlomkom korundu a vysloví nevyhnutný verdikt: väčšina nálezov je falošná, olovnaté sklo dômyselne vybrúsené a zvetrané tak, aby pripomínalo surové kryštály. Niekto podhodil do riečneho koryta falošné nálezy. Vedúci bane dnes ráno nápadne chýba v tábore." # todo: NEW TRANSLATION
 mining_survey_events.39.a: "Zbaľte sa. Celý prieskum bol podvod." # todo: NEW TRANSLATION
 mining_survey_events.39.historical_info: "Podhadzovanie nálezov, teda vkladanie pravého rúdneho materiálu či opracovaných drahokamov na prieskumné miesto s cieľom prilákať investície, bolo odnepamäti bežným podvodom na banských hraniciach. Vedúci bane, ktorý podhadzoval nálezy vo vlastnej bani, miestny sprievodca, ktorý rozhádzal niekoľko ukrytých vzoriek pozdĺž vybraného riečneho koryta, aj neprítomný podnikateľ, ktorý dal starostlivo naaranžovať nález, boli stálicami dejín európskeho aj amerického baníctva. Typickú zostavu dopĺňal skorumpovaný skúšač rúd, ktorý podvod potvrdil." # todo: NEW TRANSLATION
 mining_survey_events.40.title: "Šialenstvo z [ShowGoodsNameWithNoTooltip('mercury')]" # todo: NEW TRANSLATION
 mining_survey_events.40.desc: "V bani na [ShowGoodsName('mercury')] sa získava kov. Zároveň sa v nej rodia šialenci. Robotníci pri destilačnej peci sa začali nekontrolovateľne triasť; učeň poverený miešaním skondenzovanej [ShowGoodsNameWithNoTooltip('mercury')] prišiel o zuby a hybnosť dvoch prstov na pravej ruke; a hlavný hutník, ktorý poznal riziká lepšie než ktokoľvek iný, upadol do podráždenej roztržitosti, ktorú táborový lekár nazýva #italic klobučníckym šialenstvom#! a vyhlasuje za nevyliečiteľnú. [ShowGoodsNameWithNoTooltip('mercury')] tu je. Muži, ktorí by ho získali, nie." # todo: NEW TRANSLATION
 mining_survey_events.40.a: "Zatvorte baňu. Žiadny kov za toto nestojí." # todo: NEW TRANSLATION
 mining_survey_events.40.historical_info: "Otrava ortuťou, prejavujúca sa trasom, vypadávaním zubov a postupným zhoršovaním duševného zdravia, bola dobre známou chorobou z povolania baníkov ťažiarov rumelky, pracovníkov pri destilačných peciach a spracovateľov striebra pomocou amalgámu. Baňa Almadén v Kastílii, hlavný európsky zdroj ortuti, bola sčasti prevádzkovaná väzenskou pracovnou silou práve z tohto dôvodu. Anglické slovné spojenie #italic mad as a hatter#! uchovalo spomienku na toto povolanie: výrobcov plstených klobúkov otravovala ortuť používaná pri ich remesle." # todo: NEW TRANSLATION
 mining_survey_events.41.title: "Zdroj soľanky vyschol" # todo: NEW TRANSLATION
 mining_survey_events.41.desc: "Prieskum ložiska [ShowGoodsName('salt')] sa začal sľubne. Prameň soľanky bol výdatný, kotly vyrábali bielu [ShowGoodsNameWithNoTooltip('salt')] najvyššej kvality a obchodníci so soľou už vyjednávali o dlhodobých zmluvách. Potom, po suchom lete a chladnejšej než obvyklej zime, prameň zoslabol na tenký pramienok a napokon vyschol. Geológ vyslaný na prieskum uvádza, že podzemným zdrojom bola konečná zásoba uväznenej soľanky, nie obnovujúci sa prítok, a že ložisko je v podstate vyčerpané." # todo: NEW TRANSLATION
 mining_survey_events.41.a: "Odíďte. Vyschnutý prameň znamená koniec [ShowGoodsNameWithNoTooltip('salt')]-ných diel." # todo: NEW TRANSLATION
 mining_survey_events.41.historical_info: "Pramene soľanky a ložiská kamennej soli mali veľmi odlišné geologické vlastnosti aj hospodársky potenciál. Niektoré zdroje soľanky, ako tie v Halle v Sasku či Salins-les-Bains v Jure, prúdili celé stáročia a umožnili vznik významných miest; iné boli v podstate fosílnymi zásobami, ktoré sa pri intenzívnej ťažbe vyčerpali v priebehu jednej generácie. Kamenná soľ ťažená napríklad vo Wieliczke a Cardone bola spoľahlivejším, no kapitálovo náročnejším zdrojom." # todo: NEW TRANSLATION
 mining_survey_events.42.title: "Bridlice sú neúrodné" # todo: NEW TRANSLATION
 mining_survey_events.42.desc: "Bridlicový výchoz vyzeral na povrchu sľubne. Hornina zvetrala na soľ, ktorá pri skúške vyšla čistá a biela. Pod povrchom sú však bridlice neúrodné: hrubé, tmavé a úplne bez pyritových žíl s obsahom [ShowGoodsName('alum')], ktoré povrchové vzorky zdanlivo sľubovali. Chemik skúša lúhovanie kyselinou, potom praženie a napokon dlhé zvetrávanie na halde, no výsledkom je takmer nič. Robotníci, ktorých priviezli z textilných miest za veľké náklady, sedia nečinne, zatiaľ čo inžinier skúša jeden postup za druhým." # todo: NEW TRANSLATION
 mining_survey_events.42.a: "Zatvorte prevádzku. Táto chémia tu [ShowGoodsNameWithNoTooltip('alum')] nevydá." # todo: NEW TRANSLATION
 mining_survey_events.42.historical_info: "Výroba kamenca z pyritových bridlíc si vyžadovala presne správne minerálne zloženie: železný pyrit na dodanie síranových iónov, hlinitú bridlicu ako zdroj hliníka a dlhé zvetrávanie, ktoré umožnilo ich rozpustenie. Povrchové vzorky mohli ľahko zavádzať, pretože na výchoze už prirodzené zvetrávanie vykonalo svoju prácu; hornina pod povrchom bola často bezcenná. Bridlicové bane na kamenec v Yorkshire na pobreží Severného mora celé desaťročia vynakladali značné prostriedky na bridlice, ktoré napokon nič nepriniesli." # todo: NEW TRANSLATION
 mining_survey_events.43.title: "Pôda nič nevydá" # todo: NEW TRANSLATION
 mining_survey_events.43.desc: "Údolie malo byť bohaté na [ShowGoodsName('saltpeter')]. Miestni roľníci hovorili, že ich starí otcovia každú jar zbierali biely výkvet zo skalnej steny. Prieskumníci teraz vykopali, vylúhovali a odparili pôdu z tucta miest na dne údolia, no získali takmer nič cenné. Majster prachár po prezretí skromného výťažku usudzuje, že staré ložiská [ShowGoodsNameWithNoTooltip('saltpeter')] zrejme vyťažili už tí roľníci, o ktorých rozprávali ich starí otcovia. V údolí už niet [ShowGoodsNameWithNoTooltip('saltpeter')]." # todo: NEW TRANSLATION
 mining_survey_events.43.a: "Opustite údolie. Pôda je vyčerpaná; [ShowGoodsNameWithNoTooltip('saltpeter')] tu niet." # todo: NEW TRANSLATION
 mining_survey_events.43.historical_info: "Pôdy s obsahom liadku neboli nevyčerpateľné. Prirodzený proces tvorby liadku vo vlhkej, hnojenej pôde trval roky a intenzívna ťažba ho ľahko vyčerpala. Nemecká tradícia #italic Salpetersieder#! preto zahŕňala systematické zakladanie umelých #italic Salpeterplantagen#!, kde sa celé roky hromadil a udržiaval hnoj, vápno a popol, aby sa dosiahol stabilný výťažok liadku. Prechod od hľadania liadku k jeho výrobe bol významným krokom v racionalizácii predindustriálnej výroby pušného prachu." # todo: NEW TRANSLATION

l_polish:
 cartographic_survey_events.1.title: "Komisia pre mapovanie" # todo: NEW TRANSLATION
 cartographic_survey_events.1.desc: "Rozkaz bol vydaný. Malá flotila dvoch či troch plavidiel s kartografmi, správcami prístrojov a vybraným kapitánom sa vydá pozdĺž celého nášho pobrežia a vráti sa s mapami, ktoré poslúžia aj v budúcom storočí. Väčšina toho, čo vieme o vlastnom pobreží, pochádza od miestnych lodivodov a z klebiet obchodníkov. Po tejto výprave budeme mať mapy, ktoré na papieri zachytia všetky prístavy [ROOT.GetCountry.Custom('GetRulerOrRegentTitle')], nástrahy pre moreplavcov aj zátoky pašerákov. Otázkou zostáva iba to, aké vybavenie na túto cestu zaobstarať." # todo: NEW TRANSLATION
 cartographic_survey_events.1.a: "Zaobstarať najlepšie mosadzné prístroje a najať kartografov." # todo: NEW TRANSLATION
 cartographic_survey_events.1.b: "Postačia bežní kartografi. Netreba rozhadzovať." # todo: NEW TRANSLATION
 cartographic_survey_events.1.historical_info: "Systematické mapovanie pobrežia sa naplno rozbehlo v šestnástom storočí, keď rastúci objem námorného obchodu urobil z presných máp záležitosť štátneho záujmu. #italic Casa de Contratación#! v Seville aj portugalský #italic Armazém da Guiné e Índia#! zamestnávali oficiálnych kartografov, ktorých úlohou bolo vytvárať a aktualizovať námorné mapy. V sedemnástom storočí ich nasledovali aj holandské admirality." # todo: NEW TRANSLATION
 cartographic_survey_events.10.title: "Zmapované rybárske oblasti" # todo: NEW TRANSLATION
 cartographic_survey_events.10.desc: "Prieskumná loď tri týždne spolupracovala s miestnymi rybármi v okolí [target_location.GetName]. Merala hĺbku na rozsiahlych rybárskych loviskách, značila trasy sezónnych ťahov a zaznamenávala prúdy, ktoré odnášajú lode domov skôr, než sa zmení počasie. Kartografi vyhotovili pracovnú mapu s údajmi o hĺbke, zložení dna a obvyklých obdobiach rybolovu. Miestny lodivod poznamenal, že na týchto loviskách strávil celý život, no nikdy ich nevidel takto jasne zakreslené." # todo: NEW TRANSLATION
 cartographic_survey_events.10.a: "Rozšíriť mapu medzi rybárske dediny, nech poslúži obchodu." # todo: NEW TRANSLATION
 cartographic_survey_events.10.historical_info: "Rybolov v predmodernom období sa opieral o ústne vedomosti odovzdávané v rybárskych rodinách a cechoch. Prechod k mapovaniu rybárskych lovísk, na ktorých boli zakreslené plytčiny, hĺbkové vrstevnice a zaznamenané sezónne zvyklosti, prebiehal pomaly. V sedemnástom a osemnástom storočí ho urýchlil rozvoj štátom podporovanej hydrografie." # todo: NEW TRANSLATION
 cartographic_survey_events.11.title: "Pobrežné lesy zakreslené" # todo: NEW TRANSLATION
 cartographic_survey_events.11.desc: "Kartografi sa spolu s lesníkmi a majstrami lodnými tesármi vydali do pobrežných lesov v [target_location.GetName]. Označili najlepšie porasty borovíc na sťažne a dubov na stavbu lodí, zakreslili potoky, po ktorých možno splavovať kláty na pláže určené na nakladanie, a zaznamenali obdobia, keď sa drevo najlepšie píli. Lodný architekt, ktorého privolali z lodenice, aby prezrel najsľubnejší porast, ho vyhlásil za vhodný na kýlové trámy a prvotriedne kostry lodí." # todo: NEW TRANSLATION
 cartographic_survey_events.11.a: "Vyhlásiť najlepšie porasty za [ROOT.GetCountry.GetGovernment.GetAdjective] námorné drevo." # todo: NEW TRANSLATION
 cartographic_survey_events.11.historical_info: "Námorné drevo, najmä dub potrebný na stavbu trupov lodí línie a vysoké borovice na sťažne, bolo v dobe plachetníc strategickou surovinou. Anglické, francúzske i holandské koruny si nechávali mapovať pobrežné lesy a najlepšie porasty si vyhradzovali ako korunný majetok. Ťažbu, sušenie a prepravu dreva pritom prísne regulovali." # todo: NEW TRANSLATION
 cartographic_survey_events.12.title: "Zmapované soľné panvy" # todo: NEW TRANSLATION
 cartographic_survey_events.12.desc: "Prieskumná loď zaznamenala každú [ShowGoodsName('salt')]nú panvu, soľný prameň a plytčinu pozdĺž pobrežia oblasti [target_location.GetName]. Spočítali sa kotly, zaznamenali obvyklé pracovné obdobia a s miestnymi obchodníkmi s [ShowGoodsNameWithNoTooltip('salt')] sa viedli rozhovory o cenách, dopyte a trasách, ktorými sa [ShowGoodsNameWithNoTooltip('salt')] prepravuje do vnútrozemia. Výsledná mapa odhaľuje pobrežné hospodárstvo, ktorému [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')] dosiaľ sotva rozumel a z ktorého by sa dalo výdatne profitovať, keby sa naň rozšírila daň z [ShowGoodsNameWithNoTooltip('salt')]." # todo: NEW TRANSLATION
 cartographic_survey_events.12.a: "Poslať mapu úradníkom pre [ShowGoodsNameWithNoTooltip('salt')], aby obchod zorganizovali." # todo: NEW TRANSLATION
 cartographic_survey_events.12.historical_info: "Pobrežná výroba soli odparovaním slnečným teplom sa praktizovala už od staroveku v Stredomorí a na atlantickom pobreží Francúzska, Portugalska a Pyrenejského polostrova. Záliv Bourgneuf, ostrov Île de Ré a soľné močiare polostrova Setúbal boli najväčšími priemyselnými oblasťami výroby soli v predmodernej Európe. Zásobovali treskové rybolovy v severnom Atlantiku aj obchod so soleným mäsom na celom kontinente." # todo: NEW TRANSLATION
 cartographic_survey_events.13.title: "Objavené perlové loviská" # todo: NEW TRANSLATION
 cartographic_survey_events.13.desc: "Prieskumníci v spolupráci s potápačskými rodinami, ktoré tieto vody zbierajú už celé generácie, našli a zmapovali miestne [ShowGoodsName('pearls')]né loviská v [target_location.GetName]. Na mape sú zaznamenané hĺbky, obdobia zberu, obvyklé hranice medzi súperiacimi potápačskými komunitami aj trasy, ktorými sa úlovok dostáva k brusičom v mestách. Kamenár, ktorého privolali, aby prezrel vzorku z tohtoročného úlovku, vyhlásil, že perly majú nezvyčajný lesk." # todo: NEW TRANSLATION
 cartographic_survey_events.13.a: "[ShowGoodsNameWithNoTooltip('pearls')] tejto kvality musia podliehať regulácii [ROOT.GetCountry.GetGovernment.GetAdjective]." # todo: NEW TRANSLATION
 cartographic_survey_events.13.historical_info: "Európsky lov perál bol v porovnaní s veľkými loviskami v Perzskom zálive a na Srí Lanke skromný, no v Hebridách, vo Visle a pri pobreží Bretónska a Walesu sa nachádzali sladkovodné aj morské perly obchodnej kvality. Škótska koruna si od stredoveku udržiavala kráľovský monopol na zber perál z niektorých riečnych systémov a benátsky senát reguloval ich zber v Jadrane." # todo: NEW TRANSLATION
 cartographic_survey_events.14.title: "Zmapované pobrežné vinice" # todo: NEW TRANSLATION
 cartographic_survey_events.14.desc: "Kartografi sa s vinohradníkmi vydali do pobrežných pahorkatín v [target_location.GetName]. Zaznamenali najlepšie svahy na pestovanie hrozna, prevládajúce vetry, ktoré úrodu dozrievajú alebo ničia, aj pláže na nakladanie sudov na vývoz. Obchodníci s [ShowGoodsName('wine')], zvyčajne tajnostkárski, nečakane ochotne pomáhali, keď pochopili, že lepšie mapy umožnia lepšie načasovať vývoz." # todo: NEW TRANSLATION
 cartographic_survey_events.14.a: "Poslať mapu prepravcom [ShowGoodsNameWithNoTooltip('wine')], aby lepšie načasovali vývoz." # todo: NEW TRANSLATION
 cartographic_survey_events.14.historical_info: "Námorný obchod s vínom bol hospodárskou oporou oblastí ako údolie Garonny, Douro, ostrovy v Egejskom mori a dalmátske pobrežie. Od toho, kedy sa víno zozbieralo, kedy ho bolo možné vypraviť a aká kvalitná bola prístavná infraštruktúra, záviselo, či sa úroda dostane na trh v dobrom stave. Mapovanie pobrežia známeho vínom preto malo veľký obchodný význam. Významní vývozcovia vína z Bordeaux a Porta si po stáročia udržiavali vlastné súkromné zbierky máp." # todo: NEW TRANSLATION
 cartographic_survey_events.15.title: "Zmapované pobrežie farbív" # todo: NEW TRANSLATION
 cartographic_survey_events.15.desc: "Prieskumníci zmapovali pobrežie v [target_location.GetName], kde sa vyrábajú farbivá: náleziská ostraniek, z ktorých sa získava tyrský purpur, duby červené na útesoch, indigové polia vo vnútrozemských nížinách či miestne rastliny a lastúry, z ktorých sa získava farba, za ktorú obchodníci s [ShowGoodsName('cloth')] platia. Mapa zaznamenáva obdobia zberu, obvyklé zberné oblasti a trasy, ktorými sa [ShowGoodsName('dyes')] dostávajú do textilných miest." # todo: NEW TRANSLATION
 cartographic_survey_events.15.a: "Poslať mapu obchodníkom s [ShowGoodsNameWithNoTooltip('cloth')] aj dedinám." # todo: NEW TRANSLATION
 cartographic_survey_events.15.historical_info: "Pred vynálezom syntetických farbív boli prírodné farbivá strategickou surovinou počas celého stredoveku aj raného novoveku. Tyrský purpur z lastúr ostraniek, červené farbivo z červcov na duboch, indigo z indigovníka a modré farbivo z listov farbovníka mali každý svoje vlastné oblasti výroby. Obchod s látkami závisel od spoľahlivosti dodávateľských reťazcov, ktoré viedli od zberných oblastí až po textilné mestá." # todo: NEW TRANSLATION
 cartographic_survey_events.16.title: "Zmapované pobrežie s [ShowGoodsNameWithNoTooltip('amber')]om" # todo: NEW TRANSLATION
 cartographic_survey_events.16.desc: "Prieskumníci zmapovali pláže v [target_location.GetName], na ktoré po búrkach vyplavuje [ShowGoodsName('amber')]. Určili úseky pobrežia vhodné na zber, obdobia, keď príboj prináša živicu na breh, aj miestne zvyklosti, podľa ktorých sa úlovok rozdeľuje. Brusiči [ShowGoodsNameWithNoTooltip('amber')]u v mestách, ktorí vždy platili najviac za kamene najvyššej čistoty, zaplatia ešte viac, keď budú vedieť, ktoré pláže prinášajú akú kvalitu." # todo: NEW TRANSLATION
 cartographic_survey_events.16.a: "Vyhradiť najlepšie úseky pobrežia pre [ROOT.GetCountry.GetGovernment.GetAdjective]." # todo: NEW TRANSLATION
 cartographic_survey_events.16.historical_info: "Pobrežie Baltického mora bohaté na jantár, od Sambijského polostrova po východné Pomoransko, bolo od staroveku hlavným zdrojom jantáru pre európskych remeselníkov. Rád nemeckých rytierov preslávilo prísne vymáhanie monopolu na jeho zber a kruté tresty za nepovolený zber. Jantárové cesty spájali pobrežie Baltického mora s dielňami v Čechách, Taliansku a Konštantínopole viac než tisíc rokov." # todo: NEW TRANSLATION
 cartographic_survey_events.20.title: "Chránený prístav" # todo: NEW TRANSLATION
 cartographic_survey_events.20.desc: "Prieskumná loď oboplávala nízky výbežok v [target_location.GetName] a zakotvila v chránenej zátoke, ktorú miestni rybári využívali po celé generácie, no na žiadnej doterajšej mape sa nenachádzala. Hĺbka je rovnomerne štyri siahy a dno piesočnaté. Útesy na vonkajšej strane neškodne lámu prevládajúce vetry a miestny lodivod hlási, že lode s bežným ponorom tu môžu bezpečne kotviť za každého počasia. Po presnom zameraní hĺbky a vytýčení vodiacich línií bude môcť prístav využívať aj väčšie plavidlo." # todo: NEW TRANSLATION
 cartographic_survey_events.20.a: "Vytýčiť vodiace línie a riadne zmapovať prístav." # todo: NEW TRANSLATION
 cartographic_survey_events.20.historical_info: "Miestni rybári často poznali chránené kotviská, ktoré sa nenachádzali na žiadnej oficiálnej mape. Tieto vedomosti sa odovzdávali z generácie na generáciu ako praktické lodivodstvo, nie ako písomné záznamy. Štátne hydrografické prieskumy sa snažili takýchto lodivodov vypočúvať a doplnenie dovtedy nezakresleného prístavu do oficiálnych plavebných pokynov bolo bežným výsledkom prieskumu pobrežia v predmodernom období." # todo: NEW TRANSLATION
 cartographic_survey_events.21.title: "Prieplav cez útes" # todo: NEW TRANSLATION
 cartographic_survey_events.21.desc: "Kartografi dva týždne premeriavali olovnicou pobrežný útes v [target_location.GetName], ktorý sa vždy považoval za nepriechodný. Našli prieplav: v najužšom mieste je široký tridsať stôp, pri odlive má hĺbku štyri siahy a za každého počasia sa ním dá preplávať, ak sa na výbežku za ním správne rozmiestnia vymedzovacie tyče. Ukázalo sa, že miestny lodivod o tomto prieplave vedel už tridsať rokov, no nikomu o ňom nepovedal. Za jeho vyznačenie si účtuje malý poplatok." # todo: NEW TRANSLATION
 cartographic_survey_events.21.a: "Vyznačiť vodiace tyče. Prieplav zakresliť do mapy." # todo: NEW TRANSLATION
 cartographic_survey_events.21.historical_info: "Pobrežné útesy ukrývajúce splavné prieplavy boli v predmodernej lodnej doprave častým javom. Štandardným spôsobom ich vyznačenia bolo použitie vymedzovacích tyčí: loď sa k prieplavu približovala tak, aby sa dva výrazné pobrežné orientačné body nachádzali presne v jednej línii. Miestni lodivodi si často takéto orientačné body strážili ako tajomstvo svojho remesla." # todo: NEW TRANSLATION
 cartographic_survey_events.22.title: "Dlhodobo využívaná zátoka" # todo: NEW TRANSLATION
 cartographic_survey_events.22.desc: "Prieskumníci objavili v [target_location.GetName] chránenú zátoku, vzdialenú niekoľko míľ od najbližšieho oficiálneho prístavu. Na dne je čerstvá stopa po kotve, na skalách nad plážou vidno staré ryhy po sudoch a miestne deti, keď sa ich pýtali, nedokázali celkom zatajiť úškrn. Zátoka sa už roky využíva na nepovolený obchod. Teraz, keď je jej existencia zaznamenaná v oficiálnych záznamoch, možno ju využívať na zákonné účely, alebo na nej aspoň vyberať clo." # todo: NEW TRANSLATION
 cartographic_survey_events.22.a: "Zaznamenať zátoku a zriadiť tam malú colnicu." # todo: NEW TRANSLATION
 cartographic_survey_events.22.historical_info: "Pašerácke zátoky patrili k európskemu pobrežiu od staroveku až do začiatku priemyselného obdobia. Zriadenie pobrežnej stráže a colných hliadok a systematické mapovanie podozrivých miest na vylodenie postupne vytlačili nepovolený obchod do menších a odľahlejších zátok. Až železnica, telegraf a parné hliadkové lode však skutočne sťažili pašovanie vo veľkom." # todo: NEW TRANSLATION
 cartographic_survey_events.30.title: "Búrka rozohnala prieskumníkov" # todo: NEW TRANSLATION
 cartographic_survey_events.30.desc: "Na tretí deň prieskumu sa strhla búrka a zahnala prieskumnú loď k pobrežiu, kde dve chladné noci vzdorovala príboju. Člny vyslané po kartografov z pracovísk sa roztratili. Keď vietor konečne utíchol a loď sa opäť dostala na vodu, prieskumná sezóna bola stratená, prístroje premočené a dvaja lodní tesári spočinuli v dunách nad plážou. Pobrežie oblasti [target_location.GetName] zostáva rovnako nezmapované ako predtým." # todo: NEW TRANSLATION
 cartographic_survey_events.30.a: "Pokračovať ďalej. Sezóna sa už nedá zachrániť." # todo: NEW TRANSLATION
 cartographic_survey_events.30.historical_info: "Náhle búrky boli pri prieskume pobrežia na malých plavidlách ustavičným pracovným rizikom. Beaufortova stupnica, jednotný systém varovania pred búrkami a systematická predpoveď počasia sa objavili až v devätnástom storočí. Dovtedy mala prieskumná loď, ktorá sa pri silnejúcom vetre ocitla pri pobreží, medzi sebou a katastrofou iba olovnicu, kotvu a nervy lodného kapitána." # todo: NEW TRANSLATION
 cartographic_survey_events.31.title: "Uviaznutie na nezmapovanej plytčine" # todo: NEW TRANSLATION
 cartographic_survey_events.31.desc: "Prieskumná loď narazila v [target_location.GetName] na plytčinu, ktorú žiadna existujúca mapa nezaznamenala. Dno sa prudko zdvihlo pod kýlom takmer v tej istej chvíli, keď olovnica ukázala štyri siahy. Trup bol prerazený pred priečkou a tesár ho opravuje olovenými plátmi a kesónom, zatiaľ čo loď leží naklonená na pláži. Kartografi si rozložili prístroje na piesku a pokračovali v práci, no prieskum tohto úseku pobrežia sa skončil." # todo: NEW TRANSLATION
 cartographic_survey_events.31.a: "Opraviť loď. Aspoň plytčina je už na našej mape." # todo: NEW TRANSLATION
 cartographic_survey_events.31.historical_info: "Nabehnutie na nezmapovanú plytčinu bolo pri prieskume v predmodernom období bežnou pohromou. Lode, ktoré stroskotali, často priniesli presnejšie hydrografické údaje než opatrní prieskumníci, ktorí sa bezpečne plavili pozdĺž toho istého pobrežia. V mnohých plavebných pokynoch sa plytčiny označovali podľa lodí, ktoré ich objavili stroskotaním. Poloha dosiaľ neznámeho útesu sa často doplnila do mapy strohou poznámkou, že tam v určitom roku narazila pomenovaná loď." # todo: NEW TRANSLATION
 cartographic_survey_events.32.title: "Nepriateľská loď" # todo: NEW TRANSLATION
 cartographic_survey_events.32.desc: "Z hmly sa náhle vynorilo neoznačené plavidlo s latinskou plachtou, zjavne ozbrojené, a zamierilo k prieskumnej lodi kotviacej v [target_location.GetName]. Naša posádka pracovala na brehu s prístrojmi, no musela prieskum opustiť, nastúpiť do člnov a vrátiť sa na loď s napoly vyplnenými zápisníkmi. Neznáme plavidlo ich pol dňa prenasledovalo, potom zmenilo kurz smerom k prístavu, ktorý naznačoval nepriateľské úmysly, a prieskum tohto úseku pobrežia zanechalo v troskách. Kartografov už nikto nepresvedčí, aby sa vrátili." # todo: NEW TRANSLATION
 cartographic_survey_events.32.a: "Pokračovať ďalej. Pobrežie strážené nepriateľskými očami nám mapu nevydá." # todo: NEW TRANSLATION
 cartographic_survey_events.32.historical_info: "Prieskum pobrežia bol politicky citlivý, pretože presné mapy cudzích brehov boli nevyhnutným predpokladom námorných operácií proti nim. Prieskumné lode v sporných vodách pravidelne sledovali ozbrojené plavidlá miestnej mocnosti. Niekedy ich zadržiavali, inokedy sa ich iba snažili odradiť. Hydrografické prieskumy španielskeho a egejského pobrežia, ktoré v sedemnástom a osemnástom storočí vykonávala anglická admirality, boli takýmto nátlakom opakovane prerušené. Posádky prieskumných lodí sa cvičili v tom, aby pri prvom náznaku nalodenia hodili najdôležitejšie poznámky cez palubu." # todo: NEW TRANSLATION
 cartographic_survey_events.33.title: "Hmla zastavila prieskum" # todo: NEW TRANSLATION
 cartographic_survey_events.33.desc: "Na druhý deň ráno sa zniesla hmla a tri týždne sa nerozplynula. Kartografi nemohli zamerať pobrežné orientačné body, skryté za stenou oblakov, a tak trávili čas hraním kociek a sťažovaním sa na chlad. Zásoby sa míňali; [target_leader.GetName] usúdil, že ďalšie čakanie by bolo plytvaním zásobami, a prieskum pobrežia oblasti [target_location.GetName] ukončil. Mapa zostala napoly zakreslená a namerané hĺbky neoverené. Hmla sa, prirodzene, rozplynula hneď na druhý deň po vyplávaní lode." # todo: NEW TRANSLATION
 cartographic_survey_events.33.a: "Zmieriť sa so stratenou sezónou a pokračovať ďalej." # todo: NEW TRANSLATION
 cartographic_survey_events.33.historical_info: "Pobrežná hmla bola ustavičným nepriateľom prieskumníkov v predmodernom období. Štandardná hydrografická metóda si vyžadovala dobrú viditeľnosť pevných orientačných bodov na brehu z miest, kde sa na mori vykonával prieskum. Pri dlhotrvajúcej hmle bola celá táto práca nemožná. Prieskumné výpravy do hmlistých oblastí, ako sú Newfoundland, Severné more a severozápadné pobrežie Tichého oceánu, často strávili čakaním na jasné počasie viac času než samotným mapovaním." # todo: NEW TRANSLATION

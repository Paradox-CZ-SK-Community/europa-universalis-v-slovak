l_polish:
 grand_embassy.1.title: "Príprava delegácie" # todo: NEW TRANSLATION
 grand_embassy.1.desc: "Pred odchodom delegácie musíme rozhodnúť, akú bude mať podobu. Vládca, ktorého vodia po hostinách a strážených komnatách, uvidí len to, čo mu hostiteľ chce ukázať; dielne, suché doky a cvičiská zostanú pre vzácnych hostí zatvorené. [figurehead.GetName] bude cestovať ako verejná tvár delegácie, zatiaľ čo [target_ruler.GetName] sa bude pohybovať medzi sprievodom bez toho, aby vzbudzoval pozornosť. Ako ďaleko zájdeme, aby to tak aj zostalo?" # todo: NEW TRANSLATION
 grand_embassy.1.a: "Pripravme delegáciu ako každú inú." # todo: NEW TRANSLATION
 grand_embassy.1.a.tt: "Bežné prípravy, bežné utajenie (Utajenosť: 55)" # todo: NEW TRANSLATION
 grand_embassy.1.b: "Urobme všetko pre zachovanie tajomstva." # todo: NEW TRANSLATION
 grand_embassy.1.b.tt: "Zvýšená opatrnosť zaistí skutočnú anonymitu (Utajenosť: 75)" # todo: NEW TRANSLATION
 grand_embassy.1.c: "Vyslať falošné delegácie." # todo: NEW TRANSLATION
 grand_embassy.1.c.tt: "Falošné delegácie znejasnia stopu (Utajenosť: 95)" # todo: NEW TRANSLATION
 grand_embassy.2.title: "Predstavenie delegácie v [embassy_country.GetCapital.GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 grand_embassy.2.desc.port: "Delegácia dorazila do [embassy_country.GetCapital.GetName]. Prišli sme sem kvôli prístupu: k suchým dokom a arzenálom, v ktorých [embassy_country.GetName] buduje flotily, čo mu zabezpečujú prevahu na mori. To, ako sa predstavíme na dvore [embassy_country.GetGovernment.GetCourtTitle], rozhodne o tom, koľko z toho nám skutočne ukážu." # todo: NEW TRANSLATION
 grand_embassy.2.desc.inland: "Delegácia dorazila do [embassy_country.GetCapital.GetName]. Prišli sme sem kvôli prístupu: do dielní a na cvičiská, kde remeselníci a cvičitelia z [embassy_country.GetName] už pretvorili obchod aj armádu. To, ako sa predstavíme na dvore [embassy_country.GetGovernment.GetCourtTitle], rozhodne o tom, koľko z toho nám skutočne ukážu." # todo: NEW TRANSLATION
 grand_embassy.2.a: "Nech hovorí [figurehead.GetShortNameWithNoTooltip]; [target_ruler.GetShortNameWithNoTooltip] zostane medzi sprievodom." # todo: NEW TRANSLATION
 grand_embassy.2.a_no_figurehead: "Nech [target_ruler.GetShortNameWithNoTooltip] zostane medzi sprievodom." # todo: NEW TRANSLATION
 grand_embassy.2.b: "Predstavme [target_ruler.GetShortNameWithNoTooltip] otvorene, takého, aký [target_ruler.GetHerHim] naozaj je." # todo: NEW TRANSLATION
 grand_embassy.2.c: "Vyhnime sa dvoru [embassy_country.GetGovernment.GetCourtTitle]. Neprišli sme sem, aby nás bolo vidieť." # todo: NEW TRANSLATION
 grand_embassy.3.title: "Delegácia na dvore" # todo: NEW TRANSLATION
 grand_embassy.3.desc.unaware: "Na dvor [ROOT.GetCountry.GetGovernment.GetCourtTitle] dorazila delegácia z krajiny [from.GetName]. Podľa vlastných slov sú to obyčajní cestovatelia, túžiaci zistiť, ako si [ROOT.GetCountry.GetAltAdjective('D')] počína. Pustíme ich do našich dielní a inštitúcií, alebo ich pošleme preč?" # todo: NEW TRANSLATION # todo: COUNTRY CASE
 grand_embassy.3.desc.aware: "Dvoru [ROOT.GetCountry.GetGovernment.GetCourtTitle] sa potichu podarilo zistiť, kto v skutočnosti cestuje s touto delegáciou. Odhalenie [target_ruler.GetName] by všetkých zúčastnených priviedlo do rozpakov, no pohostiť vládcu, ktorý sa chce poučiť z divov [ROOT.GetCountry.GetAltAdjective('G')], hoci aj v prestrojení, je veľkou poctou. Zdá sa, že diskrétnosť má dve strany." # todo: NEW TRANSLATION # todo: COUNTRY CASE
 grand_embassy.3.a: "Umožnite im prístup." # todo: NEW TRANSLATION
 grand_embassy.3.b: "Naše divy môže obdivovať každý." # todo: NEW TRANSLATION
 grand_embassy.3.c: "Nedovolíme cudzincom spoznať naše tajomstvá." # todo: NEW TRANSLATION
 grand_embassy.3.d: "Umožnite im prístup, ale diskrétne." # todo: NEW TRANSLATION
 grand_embassy.3.e: "Takýmto vzácnym hosťom možno naše divy ukázať bez obmedzení." # todo: NEW TRANSLATION
 grand_embassy.3.f: "[target_ruler.GetShortNameWithNoTooltip], poznáme vás a nie ste tu vítaný." # todo: NEW TRANSLATION
 grand_embassy.4.title: "Predĺžené uvítanie" # todo: NEW TRANSLATION
 grand_embassy.4.desc: "Keďže sa už vie, kto cestuje s delegáciou, dvor [embassy_country.GetGovernment.GetCourtTitle] v krajine [embassy_country.GetName] vám poslal pozvanie: zostaňte ešte chvíľu a pozrite si viac z toho, čo sa tu dá vidieť." # todo: NEW TRANSLATION
 grand_embassy.4.a: "S vďakou prijmime pozvanie." # todo: NEW TRANSLATION
 grand_embassy.4.b: "Poprosme o ešte dlhší pobyt." # todo: NEW TRANSLATION
 grand_embassy.6.title: "Pozvanie, ktoré nemožno odmietnuť" # todo: NEW TRANSLATION
 grand_embassy.6.desc: "Do [embassy_country.GetCapital.GetName] dorazila správa o tom, kto sa v skutočnosti skrýva medzi členmi delegácie. Dvor [embassy_country.GetGovernment.GetCourtTitle] stratil trpezlivosť s pretvárkou a teraz predvoláva [target_ruler.GetName], aby sa dostavil nie ako hosť, ktorý môže odmietnuť, ale ako vládca, ktorým [target_ruler.GetSheHe] je. Už niet kam uhnúť: postavte sa pred dvor alebo sa teraz vráťte." # todo: NEW TRANSLATION
 grand_embassy.6.a: "Postavme sa pred dvor." # todo: NEW TRANSLATION
 grand_embassy.6.b: "Zrušme vyslanectvo." # todo: NEW TRANSLATION
 grand_embassy.7.title: "Ponaučenia sa minuli" # todo: NEW TRANSLATION
 grand_embassy.7.desc: "Delegácia vyčerpala všetky možnosti v krajine [embassy_country.GetName] a teraz musí buď pokračovať na ďalší dvor, alebo sa vrátiť domov a využiť nadobudnuté poznatky." # todo: NEW TRANSLATION
 grand_embassy.7.a: "Vráťme sa domov." # todo: NEW TRANSLATION
 grand_embassy.7.b: "Pokračujme do krajiny [target_1.GetNameWithNoTooltip]." # todo: NEW TRANSLATION
 grand_embassy.7.c: "Namiesto toho zamierme do krajiny [target_2.GetNameWithNoTooltip]." # todo: NEW TRANSLATION
 grand_embassy.7.d: "Zamerajme sa na krajinu [target_3.GetNameWithNoTooltip]." # todo: NEW TRANSLATION
 grand_embassy.7.e: "Navštíviť môžeme aj krajinu [target_4.GetNameWithNoTooltip]." # todo: NEW TRANSLATION
 grand_embassy.7.f: "Nasmerujme delegáciu do krajiny [target_5.GetNameWithNoTooltip]." # todo: NEW TRANSLATION
 grand_embassy.5.title: "Vyslanectvo odmietli" # todo: NEW TRANSLATION
 grand_embassy.5.desc: "Do [ROOT.GetCountry.GetCapital.GetAltAdjective('G')] dorazila správa, že dvor [embassy_country.GetGovernment.GetCourtTitle] v [embassy_country.GetCapital.GetName] odmietol prijať [target_ruler.GetName] a delegáciu. Kronikár nepovažuje za vhodné zaznamenať žiadny dôvod. Odmietnutie znižuje vážnosť vyslanectva, no samotné vyslanectvo sa ešte neskončilo." # todo: NEW TRANSLATION # todo: COUNTRY CASE
 grand_embassy.5.a: "Vráťme sa domov." # todo: NEW TRANSLATION
 grand_embassy.5.b: "Zachráňme, čo sa dá, v krajine [target_1.GetNameWithNoTooltip]." # todo: NEW TRANSLATION
 grand_embassy.5.c: "Skúsme nájsť srdečnejšie prijatie v krajine [target_2.GetNameWithNoTooltip]." # todo: NEW TRANSLATION
 grand_embassy.5.d: "Krajina [target_3.GetNameWithNoTooltip] by mohla byť pohostinnejšia." # todo: NEW TRANSLATION
 grand_embassy.5.e: "Skúsme šťastie radšej v krajine [target_4.GetNameWithNoTooltip]." # todo: NEW TRANSLATION
 grand_embassy.5.f: "Stále môžeme navštíviť krajinu [target_5.GetNameWithNoTooltip]." # todo: NEW TRANSLATION
 grand_embassy.discretion_down_4_tt: "Záblesk spoznania (#R -4#! Utajenosť)" # todo: NEW TRANSLATION
 grand_embassy.discretion_down_5_tt: "Menej miest, kde sa skryť (#R -5#! Utajenosť)" # todo: NEW TRANSLATION
 grand_embassy.discretion_down_10_tt: "Dvor začína byť podozrievavý (#R -10#! Utajenosť)" # todo: NEW TRANSLATION
 grand_embassy.discretion_down_20_tt: "Priveľa priazne priťahuje priveľa pohľadov (#R -20#! Utajenosť)" # todo: NEW TRANSLATION
 grand_embassy.discretion_down_30_tt: "Prestrojenie je odhalené (#R -30#! Utajenosť)" # todo: NEW TRANSLATION
 grand_embassy.discretion_up_10_tt: "Zostali sme nepovšimnutí (#G +10#! Utajenosť)" # todo: NEW TRANSLATION
 grand_embassy.discretion_set_0_tt: "Pretvárka sa skončila (Utajenosť: 0)" # todo: NEW TRANSLATION
 grand_embassy.modernization_up_0to10_tt: "Ponaučenie má väčší účinok, keď ho nik nevidí (#G +0 to +10#! Modernizácia)" # todo: NEW TRANSLATION
 grand_embassy.opportunities_set_1_tt: "Cudzincovi ukážu len málo (Príležitosti: 1)" # todo: NEW TRANSLATION
 grand_embassy.opportunities_set_2_tt: "Niektoré dvere sa otvoria tak či tak (Príležitosti: 2)" # todo: NEW TRANSLATION
 grand_embassy.opportunities_set_3_tt: "Všetky dvere sú nám otvorené (Príležitosti: 3)" # todo: NEW TRANSLATION
 grand_embassy.opportunities_set_4_tt: "Nič nám nezostane utajené (Príležitosti: 4)" # todo: NEW TRANSLATION
 grand_embassy.opportunities_up_1_tt: "Pozvanie otvára ďalšie dvere (#G +1#! Príležitosti)" # todo: NEW TRANSLATION
 grand_embassy.opportunities_up_2_tt: "Vytrvalosť, hoci aj nedôstojná, otvára ďalšie dve dvere (#G +2#! Príležitosti)" # todo: NEW TRANSLATION
 grand_embassy.opportunities_down_1_tt: "Deň sa minul (#R -1#! Príležitosti)" # todo: NEW TRANSLATION
 received_grand_embassy: "Prijatá veľká delegácia" # todo: NEW TRANSLATION
 rejected_grand_embassy: "Odmietnutá veľká delegácia" # todo: NEW TRANSLATION
 humiliated_grand_embassy: "Ponížené veľké vyslanectvo" # todo: NEW TRANSLATION
 grand_embassy.8.title: "Problémy doma" # todo: NEW TRANSLATION
 grand_embassy.8.desc: "K delegácii dorazila správa, že doma vypukli nepokoje. Keďže [target_ruler.GetName] je stále v zahraničí, [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] a [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')] chcú vedieť, prečo ich [ROOT.GetCountry.GetGovernment.GetRulerTitle] nikde nevedia nájsť. Ak teraz cestu predčasne ukončíme, vrátime sa domov s prázdnymi rukami. Ak budeme pokračovať, ešte nejaký čas budeme vládnuť v neprítomnosti." # todo: NEW TRANSLATION
 grand_embassy.8.a: "Musíme sa ihneď vrátiť domov." # todo: NEW TRANSLATION
 grand_embassy.8.b: "Poznatky, ktoré ešte môžeme získať, stoja za tú cenu." # todo: NEW TRANSLATION
 grand_embassy.modernization_up_5_tt: "Ponaučenie malo dobrý účinok (#G +5#! Modernizácia)" # todo: NEW TRANSLATION
 grand_embassy.modernization_up_15_tt: "Ponaučenie sme si plne osvojili (#G +15#! Modernizácia)" # todo: NEW TRANSLATION
 grand_embassy.discretion_up_20_tt: "Za peniaze sa dá kúpiť veľa zabudnutia (#G +20#! Utajenosť)" # todo: NEW TRANSLATION
 grand_embassy.9.title: "Účtovná komora" # todo: NEW TRANSLATION
 grand_embassy.9.desc: "V krajine [embassy_country.GetName] nás správca účtov prevedie účtovnými knihami a daňovými súpismi, ktoré udržiavajú štátnu pokladnicu v chode. Prsty zašpinené atramentom sa bez váhania kĺžu po jednotlivých stĺpcoch a súčty zdanlivo nikdy neklamú. Správca zapisuje každú sumu dvakrát, raz ako pohľadávku a raz ako úhradu, aby ani jediná minca neunikla pozornosti, a ešte pred koncom týždňa porovnáva súčty s prístavnými záznamami. Je toho ešte veľa, čo sa možno naučiť, ak je niekto ochotný zaplatiť za správcov čas a trpezlivo si osvojiť celý postup." # todo: NEW TRANSLATION
 grand_embassy.9.a: "Všímajme si túto metódu." # todo: NEW TRANSLATION
 grand_embassy.9.b: "Zaplaťme za štúdium celých registrov." # todo: NEW TRANSLATION
 grand_embassy.9.c: "Zaplaťme za prístup ku všetkým účtovným knihám a zostaňme, kým sa ich nenaučíme viesť." # todo: NEW TRANSLATION
 grand_embassy.10.title: "Tvorcovia almanachov" # todo: NEW TRANSLATION
 grand_embassy.10.desc: "Skupina pisárov v [embassy_country.GetCapital.GetName] začala počítať všetko: narodenia, úrodu, lode v prístave, ba dokonca aj cenu chleba z týždňa na týždeň. Ich účtovné knihy zapĺňajú celé police; každý stĺpec je označený dátumom a porovnaný s predchádzajúcim, až napokon samotné čísla začnú rozprávať príbeh, aký by nijaký kronikár nedokázal zaznamenať. Ich almanachy vraj zobrazujú krajinu pravdivejšie než akákoľvek kronika a podľa vzorcov, ktoré si všímajú len oni, predpovedajú hladomor aj hojnosť. Za poplatok vysvetlia svoje postupy každému, kto má dosť trpezlivosti presedieť pri výpočtoch." # todo: NEW TRANSLATION
 grand_embassy.10.a: "Všímajme si ich postupy." # todo: NEW TRANSLATION
 grand_embassy.10.b: "Zaplaťme za podrobný výklad ich remesla." # todo: NEW TRANSLATION
 grand_embassy.10.c: "Zaplaťme za úplný prieskum a zostaňme, kým si ho neosvojíme." # todo: NEW TRANSLATION
 grand_embassy.11.title: "Móda na dvore" # todo: NEW TRANSLATION
 grand_embassy.11.desc: "Strih kabáta, úprava parochne, správna hĺbka úklonu: dvorania z [embassy_country.GetName] skúmajú tieto veci rovnako dôkladne ako akúkoľvek zmluvu a zle odhadnutý lem môže stáť povesť, ktorej náprava trvá celé roky. Každý záhyb a každé pierko nesú význam, ktorý nezasvätení nedokážu rozlúštiť, a delegácia nevhodne oblečená je delegáciou, ktorú si nikto skutočne nevšimne. Dvoran nám diskrétne ponúka vysvetliť, čo sa nosí a prečo, komu sa treba ukloniť ako prvému a ako hlboko." # todo: NEW TRANSLATION
 grand_embassy.11.a: "Pozorujme a zapamätajme si." # todo: NEW TRANSLATION
 grand_embassy.11.b: "Zaplaťme dvoranovi za podrobnejšie poučenie." # todo: NEW TRANSLATION
 grand_embassy.11.c: "Zaplaťme za úplné poučenie a zostaňme, kým si ho neosvojíme." # todo: NEW TRANSLATION
 grand_embassy.12.title: "Salón ideí" # todo: NEW TRANSLATION
 grand_embassy.12.desc: "V meštianskom dome neďaleko paláca sa väčšinu večerov schádzajú obchodníci, učenci a znudení šľachtici, aby pri káve diskutovali o témach, o ktorých sa kedysi nehovorilo: o daniach, viere a náležitých hraniciach moci koruny. Debaty sa naťahujú do noci a s dohorievajúcimi sviečkami silnejú; nikomu zrejme neprekáža, kto počúva, pokiaľ má aj on čo povedať. Pozvanie pridať sa k nim, hoci aj ako cudzinec, sa dá vybaviť — stačí dobrá káva a odvážne názory." # todo: NEW TRANSLATION
 grand_embassy.12.a: "Sadnime si potichu a počúvajme." # todo: NEW TRANSLATION
 grand_embassy.12.b: "Zaplaťme si vstup do ich kruhu." # todo: NEW TRANSLATION
 grand_embassy.12.c: "Zaplaťme si plný prístup a zostaňme, kým si to neosvojíme." # todo: NEW TRANSLATION
 grand_embassy.13.title: "Zlievarenská hala" # todo: NEW TRANSLATION
 grand_embassy.13.desc: "Zlievarne v [embassy_country.GetName] odlievajú delá takými postupmi, za ktorých poznanie by naši zbrojári draho zaplatili: zloženie zliatiny, tvar formy, načasovanie chladenia. Od otvorov pecí sála vlna horúčavy a robotníci sa pohybujú okolo roztaveného kovu s nacvičeným pokojom, ktorý svedčí o dlhoročnom zvyku, nielen o zručnosti. Majster zlievarne, spotený a očividne hrdý na svoju prácu, je ochotný za poplatok vysvetliť viac a zdá sa, že ho nič nepoteší tak ako publikum, ktoré skutočne rozumie tomu, na čo sa pozerá." # todo: NEW TRANSLATION
 grand_embassy.13.a: "Pozorujme odlievanie." # todo: NEW TRANSLATION
 grand_embassy.13.b: "Zaplaťme majstrovi zlievarne za vysvetlenie remesla." # todo: NEW TRANSLATION
 grand_embassy.13.c: "Zaplaťme majstrovi plnú sumu a zostaňme, kým si remeslo neosvojíme." # todo: NEW TRANSLATION
 grand_embassy.14.title: "Cvičisko" # todo: NEW TRANSLATION
 grand_embassy.14.desc: "Na cvičisku za [embassy_country.GetCapital.GetName] sa jednotky preskupujú a nabíjajú zbrane v súlade, rýchlejšie než ktorýkoľvek náš odvod, pričom čižmy udierajú do udupanej zeme v rytme, ktorý akoby nikdy nezakolísal. Dôstojníci vydávajú rozkazy, na ktoré rady odpovedajú ešte skôr, než ich stihnú dopovedať, a celá formácia sa obracia ako jedno telo, nie ako sto samostatných mužov. Seržant, ktorého naša pozornosť potešila, nám ponúka podrobne predviesť celý výcvik od prvého povelu až po poslednú salvu." # todo: NEW TRANSLATION
 grand_embassy.14.a: "Sledovať cvičenie." # todo: NEW TRANSLATION
 grand_embassy.14.b: "Zaplatiť seržantovi za bližší pohľad." # todo: NEW TRANSLATION
 grand_embassy.14.c: "Zaplatiť seržantovi štedro a zostať, aby sme si cvičenie osvojili." # todo: NEW TRANSLATION
 grand_embassy.15.title: "Slovo do správneho ucha" # todo: NEW TRANSLATION
 grand_embassy.15.desc: "Komorník, ktorý vybavuje naše audiencie, nám potichu dáva najavo, že dar do správnych rúk dokáže otvoriť nejedny dvere a že isté mená na istých zoznamoch sa akosi pozabudnú, keď zmenia majiteľa nejaké mince. Spomenie to takmer mimochodom, ako keď človek poznamená niečo o počasí, a čaká, či pochopíme, čo tým myslí. Je to drobnosť, na každom dvore celkom bežná, hoci cena zvyčajne rastie podľa toho, o čo žiadame." # todo: NEW TRANSLATION
 grand_embassy.15.a: "Ponúknuť obvyklý dar." # todo: NEW TRANSLATION
 grand_embassy.15.b: "Ponúknuť oveľa štedrejší dar." # todo: NEW TRANSLATION
 grand_embassy.16.title: "Diskrétny sprostredkovateľ" # todo: NEW TRANSLATION
 grand_embassy.16.desc: "Sprostredkovateľ, ktorý sa živí uľahčovaním cesty zahraničným návštevníkom, nám ponúka svoje služby a tvrdí, že má známosti v každej strážnici a na každej colnici medzi nami a hranicami. Hovorí opatrne a v náznakoch, nikdy presne nepovie, kto mu je zaviazaný, iba že takí ľudia existujú. Za poplatok môže zariadiť, aby sa menej vypytovali, kam delegácia chodí a prečo, a aby odpovede v prípade naliehania zneli uspokojivo neurčito." # todo: NEW TRANSLATION
 grand_embassy.16.a: "Najmúť sprostredkovateľa." # todo: NEW TRANSLATION
 grand_embassy.16.b: "Najmúť sprostredkovateľa a zaplatiť aj za jeho mlčanie." # todo: NEW TRANSLATION
 grand_embassy.17.title: "Ukecaný jazyk" # todo: NEW TRANSLATION
 grand_embassy.17.desc: "Jeden z členov nášho sprievodu, ktorý sa v krčme poriadne opil a chcel zapôsobiť na skupinku cudzincov, povedal viac, než mal, o tom, kto v skutočnosti vedie túto delegáciu. Ráno si na to ani nespomína, no krčmár áno, rovnako ako každý, kto popíjal pri vedľajšom stole. Chýr sa už šíri medzi služobníctvom a s potešením, aké si zaslúžia len tajomstvá, ktoré sa nedajú udržať pod pokrievkou." # todo: NEW TRANSLATION
 grand_embassy.17.a: "Teraz sa už nedá nič robiť." # todo: NEW TRANSLATION
 grand_embassy.17.b: "Zaplatíme, aby chýr utíchol." # todo: NEW TRANSLATION
 grand_embassy.18.title: "Spoznali ho na ulici" # todo: NEW TRANSLATION
 grand_embassy.18.desc: "Obchodník, ktorý pred rokmi obchodoval v [ROOT.GetCountry.GetAltAdjective('L')] za šťastnejších okolností, míňa delegáciu na ulici a zrazu zastane. O chvíľu dlhšie, než je vhodné, hľadí na tvár [target_ruler.GetName], potom sa bez slova ponáhľa ďalej. Výraz, ktorý sa mu mihne po tvári, si nemožno pomýliť: nejde o bezcieľnu zvedavosť, ale o náhle, prekvapené poznanie. Presne vie, koho videl, a či si to nechá pre seba, je celkom mimo našej moci." # todo: NEW TRANSLATION # todo: COUNTRY CASE
 grand_embassy.18.a: "Dúfať, že si to nechá pre seba." # todo: NEW TRANSLATION
 grand_embassy.18.b: "Dať ho nájsť a zaplatiť za jeho mlčanie." # todo: NEW TRANSLATION
 grand_embassy.19.title: "Zvedavý hostinský" # todo: NEW TRANSLATION
 grand_embassy.19.desc: "Hostinský, ktorý ubytoval delegáciu, má priveľa otázok a každú kladie s nacvičenou nenútenosťou muža, ktorý už tuší, že na odpovediach záleží: prečo taký vznešený sprievod cestuje tak nenápadne, prečo sú mince vždy poruke a nikdy ich netreba počítať dvakrát, prečo sa mu pri otázke na účel cesty nikto z družiny nepozrie priamo do očí. Zatiaľ nič netuší, iba ho to zaujíma. V mysli obracia drobné zvláštnosti, akoby si prezeral mincu, či nie je orezaná. To však nemusí trvať dlho." # todo: NEW TRANSLATION
 grand_embassy.19.a: "Odpovedať čo najmenej." # todo: NEW TRANSLATION
 grand_embassy.19.b: "Dobre mu zaplatiť, aby sa prestal vypytovať." # todo: NEW TRANSLATION
 grand_embassy.20.title: "Zadržaný list" # todo: NEW TRANSLATION
 grand_embassy.20.desc: "List určený domov, v ktorom sa priamo spomína [target_ruler.GetName] a podrobnejšie, než by si opatrnosť kedy dovolila, opisuje skutočný účel delegácie, sa stratil medzi kuriérom a loďou. Neprišla žiadna žiadosť o výkupné, žiadne obvinenie, ani najmenší náznak, kam sa podel. Svojím spôsobom je to znepokojivejšie, než keby sa niečo z toho stalo. Nevieme, kde skončil, kto ho čítal ani čo má v úmysle urobiť s tým, čo sa dozvedel." # todo: NEW TRANSLATION
 grand_embassy.20.a: "Už ho nemožno privolať späť." # todo: NEW TRANSLATION
 grand_embassy.20.b: "Štedro zaplatiť, aby ho našli a spálili." # todo: NEW TRANSLATION
 grand_embassy.21.title: "Hostina na našu počesť" # todo: NEW TRANSLATION
 grand_embassy.21.desc: "[embassy_country.GetGovernment.GetCourtTitle] usporiadal na počesť delegácie hostinu s prípitkami, poctami a prejavmi, ktoré by zaplnili celý deň. Každý ďalší chod je honosnejší než ten predchádzajúci, akoby medzi sebou súťažili kuchyne. Každé jedlo treba pochváliť, na každý prípitok odpovedať vlastným a každého zdĺhavého hodnostára vypočuť až do konca, nech má čo povedať akokoľvek málo. Odmietnuť by bola urážka; účasť znamená stráviť celý deň obradmi a plnými taniermi." # todo: NEW TRANSLATION
 grand_embassy.21.a: "Pretrpieť to." # todo: NEW TRANSLATION
 grand_embassy.21.b: "Nenápadne sa vytratiť a pozrieť si niečo užitočnejšie." # todo: NEW TRANSLATION
 grand_embassy.22.title: "Pridelený sprievodca" # todo: NEW TRANSLATION
 grand_embassy.22.desc: "[embassy_country.GetGovernment.GetCourtTitle] pridelil delegácii úradníka, ktorý ju má sprevádzať na každom kroku: je prívetivý, neúnavný a odhodlaný ukazovať nám iba záhrady a galérie, nech už o čokoľvek iné požiadame akokoľvek zdvorilo. Na každú otázku má pripravenú odpoveď a na každé ticho odbočku, pričom rozhovor zakaždým stočí späť k fontánam a freskám, len čo sa priblíži k niečomu užitočnému. Do dielní sa však nedostaneme, nech žiadame akokoľvek." # todo: NEW TRANSLATION
 grand_embassy.22.a: "Ísť tam, kam nás vedú." # todo: NEW TRANSLATION
 grand_embassy.22.b: "Ako významní návštevníci trvať na tom, že chceme vidieť viac." # todo: NEW TRANSLATION
 grand_embassy.23.title: "Dlhá audiencia" # todo: NEW TRANSLATION
 grand_embassy.23.desc: "Audiencia s bezvýznamným úradníkom sa vlečie celé hodiny: vymieňame si komplimenty, obdivujeme dary, nehovoríme nič podstatné a stále opakujeme tých istých pár zdvorilostných fráz v trochu inom poradí, až stratia všetok význam. Neponáhľa sa a pozornosť zahraničných návštevníkov si vychutnáva oveľa viac než obsah čohokoľvek, o čom by sa dalo hovoriť. Kým sa audiencia konečne skončí, deň, ktorý sa dal využiť na niečo užitočnejšie, je dávno preč." # todo: NEW TRANSLATION
 grand_embassy.23.a: "Zdvorilo to vydržať." # todo: NEW TRANSLATION
 grand_embassy.23.b: "Ukončiť audienciu predčasne, nech si autorita trhne." # todo: NEW TRANSLATION
 grand_embassy.24.title: "Súcitný správca" # todo: NEW TRANSLATION
 grand_embassy.24.desc: "Správca, ktorý vedie každodenné záznamy domácnosti, opatrne naznačí — spôsobom muža, ktorý to už niekedy robil — že za primeranú odmenu by sa niekoľko mien jednoducho nemuselo zapísať. Nepýta si to priamo; nechá hovoriť ticho a s nacvičenou trpezlivosťou čaká, kým ho prerušíme." # todo: NEW TRANSLATION
 grand_embassy.24.a: "Zaplatiť správcovi za miernejší záznam." # todo: NEW TRANSLATION
 grand_embassy.24.b: "Zaplatiť správcovi, aby záznam úplne stratil." # todo: NEW TRANSLATION
 grand_embassy.25.title: "Falošná stopa" # todo: NEW TRANSLATION
 grand_embassy.25.desc: "Súperná delegácia z menšieho dvora, ktorá dorazila takmer v rovnakom čase ako my, priťahuje oveľa viac klebiet, pretože je hlučná, netaktná a celkovo sa o nej ľahšie rozpráva. Trocha mincí rozdaných správnym sluhom by mohla zaistiť, aby to tak zostalo a aby sa všetky zvedavé jazyky zamerali na ich príchody a odchody namiesto našich." # todo: NEW TRANSLATION
 grand_embassy.25.a: "Rozdať trochu mincí." # todo: NEW TRANSLATION
 grand_embassy.25.b: "Rozdať poriadnu kopu mincí." # todo: NEW TRANSLATION
 grand_embassy.26.title: "Mlčanlivý sprievodca" # todo: NEW TRANSLATION
 grand_embassy.26.desc: "Miestny sprievodca, ktorý vie, ktorým uliciam a dverám sa vyhnúť zvedavým očiam a v ktorú hodinu stráž prižmúri oči, ponúka, že bude nepozorovane sprevádzať delegáciu na jej cestách. Nepýta sa, prečo je taká opatrnosť potrebná, iba koľko nám stojí." # todo: NEW TRANSLATION
 grand_embassy.26.a: "Najať sprievodcu." # todo: NEW TRANSLATION
 grand_embassy.26.b: "Najať sprievodcu a priplatiť si aj za mimoriadnu opatrnosť." # todo: NEW TRANSLATION

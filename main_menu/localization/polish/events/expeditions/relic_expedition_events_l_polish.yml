l_polish:
 relic_expedition_events.1.title: "Honba za relikviou" # todo: NEW TRANSLATION
 relic_expedition_events.1.desc: "Biskupi požiadali a [ROOT.GetCountry.Custom('GetRulerOrRegentTitle')] súhlasil. Obchodník, ktorý sa vrátil z Levanty, to rozpráva takto: damaský kupec sa to dozvedel od vlastného otca — keď padli križiacke kráľovstvá, veľa toho, čo Frankovia uchovávali vo svojich kostoloch, odviezli a zakopali, namiesto toho, aby to spálili. Zakopané veci sa dajú vykopať. Dajú sa aj kúpiť, ak človek nájde správnu domácnosť v správnom týždni a nezjednáva tam, kde by ho mohli začuť.\n\nNikto nepovie, o ktorú relikviu ide ani kde sa nachádza. Podobné príbehy sú lacné v každom prístave na tom pobreží. Tento sa dostal k správnym ušiam." # todo: NEW TRANSLATION
 relic_expedition_events.1.a: "Dobre ich vystrojte: dary, tlmočník, mních a mešec." # todo: NEW TRANSLATION
 relic_expedition_events.1.b: "Jediný agent a nenápadný mešec. Menej očí, menšie riziko." # todo: NEW TRANSLATION
 relic_expedition_events.1.historical_info: "Pravý kríž niesli do bitky pri Hattíne v júli 1187 a zmocnilo sa ho Saladinovo vojsko. Richard Levie srdce, byzantský cisár aj gruzínska kráľovná sa ho pokúsili vykúpiť, no všetci neuspeli; posledná dôveryhodná správa ho umiestňuje do Damasku, odkiaľ sa potom úplne vytráca zo záznamov. Sväté kopije, nájdené v Antiochii v roku 1098, zmizlo rovnako nenápadne, keď sa Prvá križiacka výprava vydala ďalej. Strata ani jednej z nich nebola nikdy objasnená, a práve preto ich pátrači neprestávali hľadať." # todo: NEW TRANSLATION
 relic_expedition_events.2.title: "Príchod" # todo: NEW TRANSLATION
 relic_expedition_events.2.desc_jerusalem_first: "Výprava dorazila do [ShowLocationName('jerusalem')] a stojí pred Chrámom Božieho hrobu. [location_scope.GetOwner.GetAdjective] posádka si skupinu obzrie a stratí o ňu záujem. Cudzinci sem každú sezónu prichádzajú kvôli tej istej hrobke a tým istým príbehom. Niekde za nimi sa skrýva stopa, ktorú stojí za to sledovať. Nájsť ju však bude zdĺhavé a nákladné a bude záležať najmä na tom, komu sa rozhodnú veriť." # todo: NEW TRANSLATION
 relic_expedition_events.2.desc_jerusalem_repeat: "Opäť v [ShowLocationNameWithNoTooltip('jerusalem')]. Kanonici Chrámu Božieho hrobu už [target_leader.GetName] poznajú a posádka sa už ani neobťažuje zdvihnúť zrak." # todo: NEW TRANSLATION
 relic_expedition_events.2.desc_acre_first: "Výprava dorazila do [ShowLocationName('acre')], hlavného mesta križiackeho kráľovstva, kým ho v roku 1291 nezískali Mamlúci. Katedrála ešte ako-tak stojí, hoci namiesto strechy má nebo, a celé štvrte neboli od vyplienenia nikdy obnovené. Zatiaľ nikoho nenapadlo prehrabávať sa v troskách." # todo: NEW TRANSLATION
 relic_expedition_events.2.desc_acre_repeat: "Opäť v [ShowLocationNameWithNoTooltip('acre')]. [target_leader.GetName] vie, ktoré uličky sa oplatí prejsť druhýkrát." # todo: NEW TRANSLATION
 relic_expedition_events.2.desc_antioch_first: "Výprava dorazila do [ShowLocationName('antioch')], sídla zaniknutého križiackeho kniežatstva a mesta, kde v bezútešnom lete roku 1098 vykopali z podlahy kostola $relic_holy_lance_found$. Nikto na Západe dodnes nevyriešil, kam sa kopija podela po tom, čo vojsko pokračovalo na juh do [ShowLocationNameWithNoTooltip('jerusalem')]. Nie je to jediná vec, po ktorej sa v tomto meste zľahla zem." # todo: NEW TRANSLATION
 relic_expedition_events.2.desc_antioch_repeat: "[target_leader.GetName] je opäť v [ShowLocationNameWithNoTooltip('antioch')], stále pátra po stratenej kopiji a na každú otázku stále dostáva tri rôzne odpovede." # todo: NEW TRANSLATION
 relic_expedition_events.2.desc_damascus_first: "Výprava dorazila do [ShowLocationName('damascus')], veľkého [location_scope.GetOwner.GetAdjective] hlavného mesta [ShowProvinceDefinitionName('shaam_province')] a posledného miesta, kde po Hattíne dôveryhodne zaznamenali $relic_true_cross_found$. Či sa táto konkrétna relikvia stále nachádza tu, je iná otázka. Takéto veľké mesto za stáročia prijalo množstvo pokladov, no len veľmi málo ich vydalo späť." # todo: NEW TRANSLATION
 relic_expedition_events.2.desc_damascus_repeat: "Opäť v [ShowLocationNameWithNoTooltip('damascus')]. [target_leader.GetName] už zistil, kto v tomto [location_scope.GetRank.GetNameWithNoTooltip] rád rozpráva a koľko to stojí." # todo: NEW TRANSLATION
 relic_expedition_events.2.desc_tripoli_first: "Výprava dorazila do [ShowLocationName('tripoli_syria')], križiackeho grófstva až do jeho pádu v roku 1289. V prístave je stále rušno, no kaplnka v starej citadele je už dlhšie než si ktokoľvek pamätá bez vysvätenia a nikto ju ani nevypratal." # todo: NEW TRANSLATION
 relic_expedition_events.2.desc_tripoli_repeat: "Opäť v [ShowLocationNameWithNoTooltip('tripoli_syria')]. Prístavní obchodníci už [target_leader.GetName] poznajú od videnia." # todo: NEW TRANSLATION
 relic_expedition_events.2.desc_tyre_first: "Výprava dorazila do [ShowLocationName('sur')], [location_scope.GetRank.GetName] takého starého, že evanjeliá zaznamenávajú Kristov prechod jeho územím, a jednej z posledných pevninských bášt, ktoré križiaci držali pred rokom 1291. Jeho arcibiskupstvo uchovávalo záznamy celé dve storočia. To, čo sa z nich zachovalo, je roztrúsené po tucte súkromných domov a nijakí dvaja majitelia sa nezhodnú na tom, čo vlastne vlastnia." # todo: NEW TRANSLATION
 relic_expedition_events.2.desc_tyre_repeat: "Opäť v [ShowLocationNameWithNoTooltip('sur')]. [target_leader.GetName] už prečítal väčšinu toho, čo po sebe staré arcibiskupstvo zanechalo." # todo: NEW TRANSLATION
 relic_expedition_events.2.desc_jaffa_first: "Výprava dorazila do [ShowLocationName('jaffa')], kam kedysi prichádzali lode plné pútnikov a kde vraj apoštol Peter vzkriesil vdovu Tabitu. Prístavom prechádzali v oboch smeroch pútnici celé dve storočia. Nie všetci sa však zasa vydali na cestu." # todo: NEW TRANSLATION
 relic_expedition_events.2.desc_jaffa_repeat: "Opäť v [ShowLocationNameWithNoTooltip('jaffa')]. Prístavná štvrť si už zvykla na otázky [target_leader.GetName]." # todo: NEW TRANSLATION
 relic_expedition_events.2.desc_hebron_first: "Výprava dorazila do [ShowLocationName('hebron')] a k Jaskyni patriarchov, kde vraj ležia pochovaní Abrahám, Izák aj Jakob. Je posvätná pre veriacich [ShowReligionGroupAdjective('israelite_group')], [ShowReligionGroupAdjective('christian')] aj [ShowReligionGroupAdjective('muslim')] vierovyznania. Tri náboženstvá po stáročia túto svätyňu zveľaďovali aj z nej odnášali. Niečo malé, odložené v nesprávnom storočí, by tu mohlo navždy zostať nepovšimnuté." # todo: NEW TRANSLATION
 relic_expedition_events.2.desc_hebron_repeat: "Opäť v [ShowLocationNameWithNoTooltip('hebron')]. [target_leader.GetName] už predtým prešiel priestory svätyne a vie, kde sa prechádzať tak, aby ho nik nevidel." # todo: NEW TRANSLATION
 relic_expedition_events.2.desc_sidon_first: "Výprava dorazila do [ShowLocationName('sidon')], ďalšieho mesta, ktoré podľa evanjelií navštívil Kristus, a križiackeho panstva až do pádu kráľovstva. Stará franská štvrť bola odvtedy dvakrát znovu osídlená. Súčasní obyvatelia netušia, čo sa skrýva v ich vlastných pivniciach." # todo: NEW TRANSLATION
 relic_expedition_events.2.desc_sidon_repeat: "Opäť v [ShowLocationNameWithNoTooltip('sidon')]. [target_leader.GetName] má zoznam franských domov, ktoré sa oplatí navštíviť ešte raz." # todo: NEW TRANSLATION
 relic_expedition_events.2.desc_karak_first: "Výprava dorazila do [ShowLocationName('karak')], púštneho hradu, ktorý Reynald de Châtillon držal ako pán Oultrejourdainu. Reynald celé roky prepadával pútnické karavány a vraj tu ukryl korisť v očakávaní obliehania, o ktorom vedel, že ho Saladin privedie. Každá rodina v meste pod hradom rozpráva tento príbeh inak." # todo: NEW TRANSLATION
 relic_expedition_events.2.desc_karak_repeat: "Opäť pri [ShowLocationNameWithNoTooltip('karak')]. [target_leader.GetName] už raz počul legendy o hrade a od zhovorčivých ľudí dokonca dvakrát." # todo: NEW TRANSLATION
 relic_expedition_events.2.desc_gaza_first: "Výprava dorazila do [ShowLocationName('gaza')], starobylého mesta, ktoré kedysi malo templársku posádku a leží na púštnej ceste na juh k [ShowRegionName('egypt_region')]. Rád bol zrušený a jeho bratia sa pred celé generácie rozutekali po kresťanskom svete. Nie všetko, čo tu uchovávali, odišlo spolu s nimi." # todo: NEW TRANSLATION
 relic_expedition_events.2.desc_gaza_repeat: "Opäť v [ShowLocationNameWithNoTooltip('gaza')]. [target_leader.GetName] sa už porozprával s väčšinou rodín, ktoré žijú na miestach, kde kedysi bývali templári." # todo: NEW TRANSLATION
 relic_expedition_events.2.desc_famagusta_first: "Výprava dorazila do [ShowLocationName('famagusta')], veľkého prístavu [location_scope.GetOwner.GetAdjective] [location_scope.GetOwner.GetFlavorRank] na [ShowProvinceDefinitionName('cyprus_province')]. Po páde [ShowLocationNameWithNoTooltip('acre')] v roku 1291 sem vo veľkom počte utiekli latinské rodiny a mnohé z nich si z pevniny odniesli viac než len svoje tituly." # todo: NEW TRANSLATION
 relic_expedition_events.2.desc_famagusta_repeat: "Opäť v [ShowLocationNameWithNoTooltip('famagusta')]. V Katedrále svätého Mikuláša už [target_leader.GetName] poznajú." # todo: NEW TRANSLATION
 relic_expedition_events.2.desc_nicosia_first: "Výprava dorazila do [ShowLocationName('nicosia_cyp')], sídla moci na [ShowProvinceDefinitionName('cyprus_province')]. [location_scope.GetOwner.GetAdjective] [location_scope.GetOwner.GetGovernment.GetCourtTitle] uchováva rozsiahly archív o tom, čo si so sebou priniesla vyhnaná pevninská šľachta, a ešte rozsiahlejší o tom, čo neskôr založila." # todo: NEW TRANSLATION
 relic_expedition_events.2.desc_nicosia_repeat: "Opäť v [ShowLocationNameWithNoTooltip('nicosia_cyp')]. [location_scope.GetOwner.GetAdjective] archivári sa už prestali vypytovať, prečo sa [target_leader.GetName] stále vracia." # todo: NEW TRANSLATION
 relic_expedition_events.2.desc_rhodes_first: "Výprava dorazila na [ShowLocationName('rodos')], územie [location_scope.GetOwner.GetAdjective]. Tunajší rád považuje pád [ShowLocationNameWithNoTooltip('acre')] za súčasť vlastnej histórie a uchovával zoznamy všetkých komend opustených na pevnine. V žiadnom inom meste v týchto vodách neotvoria takéto záznamy katolíckej pátracej skupine." # todo: NEW TRANSLATION
 relic_expedition_events.2.desc_rhodes_repeat: "Opäť na [ShowLocationNameWithNoTooltip('rodos')]. [location_scope.GetOwner.GetAdjective] archivári vítajú [target_leader.GetName] ako známu otravu." # todo: NEW TRANSLATION
 relic_expedition_events.2.desc_fallback: "Ďalšia zastávka, ďalšie predstavovanie. [target_leader.GetName] začína odznova a čaká, či sa objaví niečo, čo stojí za prenasledovanie." # todo: NEW TRANSLATION
 relic_expedition_events.2.a: "Vypytujte sa. Pútnici a vojaci sa rozhovoria, ak ich pohostíme [ShowGoodsNameWithNoTooltip('wine')]." # todo: NEW TRANSLATION
 relic_expedition_events.2.b: "Konečne sme zachytili stopu relikvie." # todo: NEW TRANSLATION
 relic_expedition_events.2.c: "Najmite tu ďalších členov družiny. Dobrá ochranka nie je lacná." # todo: NEW TRANSLATION
 relic_expedition_events.2.d: "Podplaťte dvorného úradníka, aby nám sprístupnil miestny archív." # todo: NEW TRANSLATION
 relic_expedition_events.2.e: "Vyhľadajte učenca. Vzdelaná myseľ sa v povestiach vyzná lepšie." # todo: NEW TRANSLATION
 relic_expedition_events.2.f: "Nasledujte sľubnú stopu smerom k [relic_hunt_new_lead.GetNameWithNoTooltip]." # todo: NEW TRANSLATION
 relic_expedition_events.2.g: "Ukončite pátranie a vráťte sa." # todo: NEW TRANSLATION
 relic_expedition_events.3.title: "Pátranie pokračuje" # todo: NEW TRANSLATION
 relic_expedition_events.3.desc_jerusalem: "[target_leader.GetName] sa pred úsvitom vracia k Chrámu Božieho hrobu, skôr než dorazia davy pútnikov. Zostáva prezrieť ďalšiu kryptu pri svetle sviečok, odpísať ďalší zvetraný nápis a nájsť ďalšieho kanonika, ktorý sa za primeranú odmenu rozhovorí." # todo: NEW TRANSLATION
 relic_expedition_events.3.desc_acre: "Prehľadávajú duté steny a obracajú zrútené murivo tam, kde ho celé generácie nikto nenarušil. [ShowLocationNameWithNoTooltip('acre')] je rozsiahly [relic_hunt_loc.GetRank.GetName], v ktorom zostalo len veľmi málo ľudí, a jedna skupina ho môže preskúmať len sčasti." # todo: NEW TRANSLATION
 relic_expedition_events.3.desc_antioch: "[target_leader.GetName] sleduje líniu zaniknutých hradieb a porovnáva to, čo ešte stojí, s pútnickými správami o mieste, kde našli kopiju. Tieto správy si navzájom odporujú a nezhodujú sa ani s terénom." # todo: NEW TRANSLATION
 relic_expedition_events.3.desc_damascus: "[target_leader.GetName] si postupne získava dôveru obchodníkov a peňazomencov, trh za trhom. Povesti sa takýmto veľkým mestom šíria pomaly, ale predsa sa šíria, a vždy prichádzajú s pripojenou cenou." # todo: NEW TRANSLATION
 relic_expedition_events.3.desc_tripoli: "Kaplnku v citadele rozoberajú dlaždicu po dlaždici a omietku zoškrabujú všade tam, kde stena znie duto. Len samotná kaplnka dá prácu na celé týždne." # todo: NEW TRANSLATION
 relic_expedition_events.3.desc_tyre: "[target_leader.GetName] prechádza zachované záznamy arcibiskupstva v [ShowLocationNameWithNoTooltip('sur')], vedľa seba kladie vodou poškodené účtovné knihy a napoly čitateľné listiny a pátra po zápise, ktorý nezapadá medzi ostatné." # todo: NEW TRANSLATION
 relic_expedition_events.3.desc_jaffa: "[target_leader.GetName] trávi dni v prístave [ShowLocationNameWithNoTooltip('jaffa')], kupuje prístavným robotníkom a lodníkom nápoje a vypytuje sa, ktoré sklady prijímali náklad pútnikov pred odchodom Frankov." # todo: NEW TRANSLATION
 relic_expedition_events.3.desc_hebron: "Svätyňu skúmajú pomaly a dôkladne, výklenok po výklenku, pričom dbajú, aby neurazili žiadne z troch náboženstiev, ktoré ju spravujú. [target_leader.GetName] si zaznamenáva každý zapečatený priechod, no nahlas sa naň nevypytuje." # todo: NEW TRANSLATION
 relic_expedition_events.3.desc_sidon: "[target_leader.GetName] prechádza jeden znovu osídlený dom za druhým v starej franskej štvrti, klope na dvere a vypytuje sa na pivnice a podkrovia, ktoré nikto neotvoril odvtedy, čo utiekli poslední kresťanskí obyvatelia." # todo: NEW TRANSLATION
 relic_expedition_events.3.desc_karak: "[target_leader.GetName] s lampášom v ruke prechádza klenby a cisterny v [ShowLocationNameWithNoTooltip('karak')], porovnáva poklad Reynaldа de Châtillon, ako ho opisujú rozprávači, s tým, čo múry skutočne ukrývajú." # todo: NEW TRANSLATION
 relic_expedition_events.3.desc_gaza: "[target_leader.GetName] ďalej pátra po majetku zrušeného rádu v [ShowLocationNameWithNoTooltip('gaza')], vypytuje sa susedov, ktoré sklady templári zamykali a kto po nich získal kľúče." # todo: NEW TRANSLATION
 relic_expedition_events.3.desc_famagusta: "V [ShowLocationNameWithNoTooltip('famagusta')] prehľadávajú truhlicu za truhlicou v domácnostiach vyhnaných pevninských rodín a spisujú, čo si odniesli z [ShowLocationNameWithNoTooltip('acre')] a na čo sa odvtedy potichu zabudlo." # todo: NEW TRANSLATION
 relic_expedition_events.3.desc_nicosia: "[target_leader.GetName] prechádza archív [relic_hunt_loc.GetOwner.GetAdjective] [relic_hunt_loc.GetOwner.GetGovernment.GetCourtTitle] v [ShowLocationNameWithNoTooltip('nicosia_cyp')] a porovnáva súpisy s dedičskými záznamami, aby našiel zmienku o relikvii, na ktorú sa nikto nespýtal." # todo: NEW TRANSLATION
 relic_expedition_events.3.desc_rhodes: "[target_leader.GetName] nalieha na [relic_hunt_loc.GetOwner.GetAdjective] archivárov na [ShowLocationNameWithNoTooltip('rodos')], aby mu ukázali zväzky, ktoré sami neponúkli, a porovnáva ich zoznamy s tým, čo starší bratia hovoria o veciach odnesených z [ShowLocationNameWithNoTooltip('acre')]." # todo: NEW TRANSLATION
 relic_expedition_events.3.desc_fallback: "[target_leader.GetName] pokračuje v pátraní, postupne preveruje každú drobnú stopu a potom ju opúšťa." # todo: NEW TRANSLATION
 relic_expedition_events.3.a: "Vypytujte sa ďalej. Niekto tu vie viac, než hovorí." # todo: NEW TRANSLATION
 relic_expedition_events.3.b: "Konečne máme samotnú stopu. Našli sme ju." # todo: NEW TRANSLATION
 relic_expedition_events.3.c: "Najmite ďalších členov družiny, kým sme tu." # todo: NEW TRANSLATION
 relic_expedition_events.3.d: "Podplaťte ďalšieho úradníka. Toto mesto vedie lepšie záznamy." # todo: NEW TRANSLATION
 relic_expedition_events.3.e: "Pred odchodom sa poraďte s miestnym učencom." # todo: NEW TRANSLATION
 relic_expedition_events.3.f: "Nová stopa ukazuje inam. Nasledujte ju smerom k [relic_hunt_new_lead.GetNameWithNoTooltip]." # todo: NEW TRANSLATION
 relic_expedition_events.3.g: "Ukončite pátranie a vráťte sa." # todo: NEW TRANSLATION
 relic_expedition_events.4.title: "Stopa vychladla" # todo: NEW TRANSLATION
 relic_expedition_events.4.desc: "Všetky stopy, po ktorých [target_leader.GetName] pátral, nikam neviedli. Tlmočníkom došli krčmy, podplatení úradníci už nemajú čo ponúknuť a mešec sa každý týždeň, ktorý skupina nečinne strávi v cudzej krajine, stenčuje. Korune prichádza správa: zaplatiť za ďalšie pátranie alebo ho ukončiť." # todo: NEW TRANSLATION
 relic_expedition_events.4.a: "Pošlite potrebné peniaze." # todo: NEW TRANSLATION
 relic_expedition_events.4.b: "Dosť. Zavolajte výpravu späť." # todo: NEW TRANSLATION
 relic_expedition_events.5.title: "Ochranka je preč" # todo: NEW TRANSLATION
 relic_expedition_events.5.desc: "Ochranka [target_leader.GetName] je preč. Muži mizli po dvoch či troch — zabili ich banditi, skolila ich horúčka alebo potichu dezertovali, pretože za nekonečné pátranie dostávali príliš málo. Bez ozbrojených mužov, ktorí by podporili žiadosť, sa nikto neodváži naliehať na pána či opáta, aby vydal relikviu, ktorej sa nechce vzdať.\n\nHonba sa tu končí." # todo: NEW TRANSLATION
 relic_expedition_events.5.a: "Misia bez nich nemôže pokračovať." # todo: NEW TRANSLATION
 relic_expedition_events.6.title: "Ochotný predajca" # todo: NEW TRANSLATION
 relic_expedition_events.6.desc_true_cross: "Miestny obchodník si dáva pozor, kto by ho mohol začuť, a tvrdí, že vlastní úlomok samotného $relic_true_cross_found$, dreva strateného pri Hattíne, ktorý sa dedí z generácie na generáciu. Mená tých, cez ktorých ruky prešiel, prezradiť odmieta. Cenu však povie." # todo: NEW TRANSLATION
 relic_expedition_events.6.desc_holy_lance: "Rodina zosnulého vojaka uchováva hrot kopije od čias služby svojho pradedka a trvá na tom, že ide o $relic_holy_lance_found$, nález z roku 1098. Radšej by zaň dostali peniaze." # todo: NEW TRANSLATION
 relic_expedition_events.6.desc_holy_shroud: "Obchodník rozvinie ľanové plátno so slabým obrazom ukrižovaného muža. Nevysvetlí, kde sa po všetky tie stáročia nachádzalo, no aj tak zaň žiada poriadnu sumu." # todo: NEW TRANSLATION
 relic_expedition_events.6.desc_holy_nail: "Vdova po kováčovi prinesie železný klinec sčernetý vekom. Rodina jej manžela vždy prisahala, že ide o jeden z klincov z Ukrižovania. Predala by ho." # todo: NEW TRANSLATION
 relic_expedition_events.6.desc_true_cross_fragment: "Chudobný a takmer zabudnutý kláštor uchováva v jednoduchej relikviárii úlomok dreva, označený len ako kúsok $relic_true_cross_found$. Opát sa ho potichu vzdá, ak predaj pomôže opraviť strechu." # todo: NEW TRANSLATION
 relic_expedition_events.6.desc_saint_bones: "Farár ponúka malú schránku s kosťami a menom svätca, ktoré je napísané vyblednutou latinčinou. Platbu by označil za dar cirkvi." # todo: NEW TRANSLATION
 relic_expedition_events.6.desc_baptist_head: "Miestny kostol uctieva to, čo označuje za hlavu Jána Krstiteľa. Toto tvrdenie sa nikdy nedostalo ďaleko za hranice farnosti a duchovní sú ochotní rokovať o jej odovzdaní." # todo: NEW TRANSLATION
 relic_expedition_events.6.desc_virgin_milk: "Malá svätyňa uchováva zapečatenú fľaštičku s bielym kriedovým povlakom, ktorý sa už celé generácie uctieva ako mlieko Panny Márie. Správca ju predá aj so striebornou relikviáriou." # todo: NEW TRANSLATION
 relic_expedition_events.6.desc_holy_thorn: "Drobný šľachtický rod vlastní jediný tŕň v skromnej relikviárii. Podľa ich slov ho dostal jeden z predkov z Tŕňovej koruny. Boli by radšej, keby predaj zostal nepovšimnutý." # todo: NEW TRANSLATION
 relic_expedition_events.6.desc_holy_chalice: "Obchodník vraví, že aj tak mu nikto neuverí, a potom ponúkne obyčajný kamenný pohár, o ktorom tvrdí, že je pravým kalichom Poslednej večere — nech si inde nárokujú čokoľvek. Jeho cena nie je nízka." # todo: NEW TRANSLATION
 relic_expedition_events.6.desc_titulus_crucis: "Miestna legenda hovorí, že keď drevo Kríža odviezli na západ, tabuľa s nápisom, ktorá nad ním visela, zostala a ukryli ju. Jedna rodina tvrdí, že zdedila práve takúto tabuľu, a predala by ju." # todo: NEW TRANSLATION
 relic_expedition_events.6.a: "Zjednávajte. Cena je vysoká, ale dá sa znížiť." # todo: NEW TRANSLATION
 relic_expedition_events.6.b: "Zaplaťte požadovanú sumu. Niektoré veci za to stoja." # todo: NEW TRANSLATION
 relic_expedition_events.6.c: "Nech za nás prehovorí početná družina." # todo: NEW TRANSLATION
 relic_expedition_events.7.title: "Uzavretie obchodu" # todo: NEW TRANSLATION
 relic_expedition_events.7.desc: "Dohodli sa na podmienkach a relikviáriu zabalili do látky. [target_leader.GetName] už len musí rozhodnúť, nakoľko predajcovmu príbehu uverí." # todo: NEW TRANSLATION
 relic_expedition_events.7.a: "Zaplaťte a odvezte relikviu domov." # todo: NEW TRANSLATION
 relic_expedition_events.7.b: "Niečo tu nesedí. Odíďte." # todo: NEW TRANSLATION
 relic_expedition_events.8.title: "Ochotný komplic" # todo: NEW TRANSLATION
 relic_expedition_events.8.desc_true_cross: "Sluha v domácnosti miestneho hodnostára, roztrpčený pre niečo, čo nechce vysvetliť, spomenie, že jeho pán uchováva zabalený úlomok tmavého dreva, ktorý nazýva $relic_true_cross_found$. Medzi ostatnými pokladmi si ho nikto nevšíma. Za odmenu nám sluha pomôže zmocniť sa ho." # todo: NEW TRANSLATION
 relic_expedition_events.8.desc_holy_lance: "Vojak posádky, ktorému dlhujú ročný žold, sa preriekne, že v zbrojnici leží starý hrot kopije, ktorý už nikto nepamätá v súpise. Starší muži ho stále nazývajú $relic_holy_lance_found$. Dokáže nás dostať dnu." # todo: NEW TRANSLATION
 relic_expedition_events.8.desc_holy_shroud: "Vrátnik kláštora, ktorý sa nedávno ostro pohádal s opátom, tvrdí, že mnísi uchovávajú zložené plátno s vyobrazením, zamknuté pred všetkými okrem najstarších bratov. Nechá jedny dvere odomknuté." # todo: NEW TRANSLATION
 relic_expedition_events.8.desc_holy_nail: "Zadlžený pokladník prizná, že v bočnej klenbe leží neevidovaný starý železný klinec, uctievaný ako jeden z klincov z Ukrižovania. Má od neho jediný kľúč." # todo: NEW TRANSLATION
 relic_expedition_events.8.desc_true_cross_fragment: "Novic nespokojný so svojím povolaním ponúka, že nechá otvorenú okenicu kaplnky, kde jeho kláštor uchováva úlomok $relic_true_cross_found$." # todo: NEW TRANSLATION
 relic_expedition_events.8.desc_saint_bones: "Hrobár, ktorému za celý život práce platili primálo, vie, kde farnosť uchováva schránku s kosťami svätca a kedy si popoludní kostolník ľahne." # todo: NEW TRANSLATION
 relic_expedition_events.8.desc_baptist_head: "Nižší kanonik, ktorého príliš často obišli pri povýšení, ponúka, že nás zavedie k relikviárii, ktorú starší duchovní uctievajú ako hlavu Jána Krstiteľa." # todo: NEW TRANSLATION
 relic_expedition_events.8.desc_virgin_milk: "Správca svätyne, potichu zúrivý po desaťročiach biedneho platu, nechá v ním zvolenú noc odomknutú vitrínu s relikviáriou." # todo: NEW TRANSLATION
 relic_expedition_events.8.desc_holy_thorn: "Správca, ktorého kedysi prepustili a neskôr z milosti znovu prijali do služby, presne vie, kde rodina uchováva relikviár s jediným tŕňom z Koruny." # todo: NEW TRANSLATION
 relic_expedition_events.8.desc_holy_chalice: "Kostolník katedrály nemá nič dobré na srdci o kapitule, ktorej roky slúžil, a ponúka nám pomoc pri krádeži obyčajného kamenného kalicha, ktorý vraj v súkromí nazývajú skutočným kalichom Poslednej večere." # todo: NEW TRANSLATION
 relic_expedition_events.8.desc_titulus_crucis: "Rodina, ktorá udržiava pri živote starú, napoly uveriteľnú legendu, navrhuje niečo celkom iné: pomôže nám získať späť to, o čom tvrdia, že je skutočnou tabuľkou s nápisom z kríža, od príbuzného, ktorý im ju odmieta predať." # todo: NEW TRANSLATION
 relic_expedition_events.8.a: "Diskrétnosť niečo stojí." # todo: NEW TRANSLATION
 relic_expedition_events.8.d: "Zlato netreba. [target_leader.GetHerHis|U] vlastné čaro si získa ich pomoc." # todo: NEW TRANSLATION
 relic_expedition_events.8.b: "Pôjdeme bez nich. Menej platených znamená menej jazykov." # todo: NEW TRANSLATION
 relic_expedition_events.8.c: "Spoločníkov nepotrebujeme. Naša družina si ju jednoducho vezme." # todo: NEW TRANSLATION
 relic_expedition_events.9.title: "Krádež" # todo: NEW TRANSLATION
 relic_expedition_events.9.desc: "Zatiaľ všetko ide podľa plánu. Ten, kto mal držať stráž, spí, je preč alebo dostal zaplatené, aby sa pozeral inam, a dvere, ktoré mal komplic nechať otvorené, sú odomknuté. [target_leader.GetName] čaká v tme na výkrik, ktorý by znamenal opak." # todo: NEW TRANSLATION
 relic_expedition_events.9.a: "Je to hotové. Relikvia je naša a nikto o tom nevie." # todo: NEW TRANSLATION
 relic_expedition_events.9.b: "Niekto sa prebúdza. Výkriky, dupot nôh. Ústup!" # todo: NEW TRANSLATION
 relic_expedition_events.10.title: "Učencove pokyny" # todo: NEW TRANSLATION
 relic_expedition_events.10.desc_true_cross: "Putovný učenec, ktorý prečítal všetky kroniky o Hattíne, na základe troch takmer náhodne sa zhodujúcich záznamov určil úsek zeme, kde vraj ustupujúci rytieri zakopali úlomok $relic_true_cross_found$, aby ho nestratili v prospech Saladína. Ponúka svoje poznámky, ošúchané mapy aj seba." # todo: NEW TRANSLATION
 relic_expedition_events.10.desc_holy_lance: "Učenec zaoberajúci sa prvou križiackou výpravou verí, že na základe vlastného záznamu [GetCharacter('koj_petrus_bartholomaeus').GetName] našiel pivnicu, v ktorej sa v roku 1098 objavilo $relic_holy_lance_found$. Tvrdí, že všetko, čo ležalo vedľa nej, sa nikdy nepodarilo úplne získať. Súperiaci klerici vtedy túto myšlienku označili za výmysel, no nikto z nich ju nevyvrátil." # todo: NEW TRANSLATION
 relic_expedition_events.10.desc_holy_shroud: "Starý starožitník napoly verí povesti, ktorú nevie poriadne doložiť: mnísi utekajúci pred nájazdom zamurovali do krypty plátno nesúce obraz, o čom sa nezmieňuje žiadna kronika. Takmer oslepol a túži po poslednom objave. Sám nás na miesto zavedie." # todo: NEW TRANSLATION
 relic_expedition_events.10.desc_holy_nail: "Učenec zaoberajúci sa relikviami ukazuje na napoly zrútenú kaplnku, kde podľa miestnej tradície kňaz na úteku zakopal klinec z Ukrižovania pred príchodom vojakov." # todo: NEW TRANSLATION
 relic_expedition_events.10.desc_true_cross_fragment: "Tri generácie kláštorných účtovných kníh, prečítané od začiatku do konca, priviedli učenca k pustovni, ktorú narýchlo opustili. Posledný pustovník vraj pred útekom o život ukryl pod podlahou kaplnky úlomok $relic_true_cross_found$." # todo: NEW TRANSLATION
 relic_expedition_events.10.desc_saint_bones: "Miestny životopisec svätých, ktorý čerpal z rozpadajúcich sa farských matrík, určil neoznačený hrob na okraji starého cintorína: patrí menej významnému svätcovi, ktorého kosti ukryli, aby nepadli do rúk nepriateľského vojska." # todo: NEW TRANSLATION
 relic_expedition_events.10.desc_baptist_head: "Učenec na základe útržkovitej kroniky z kláštorného archívu tvrdí, že relikviár uctievaný ako hlava Jána Krstiteľa skončil pod podlahou kaplnky počas starého obliehania a kaplnka sa naň zrútila." # todo: NEW TRANSLATION
 relic_expedition_events.10.desc_virgin_milk: "Učenec odkazuje na denník pútnika, ktorý sa nikomu inému neunúvalo čítať, a ukazuje na zamurovanú niku v opustenej svätyni. Jej správcovia tam vraj ukryli ampulku Mlieka Panny Márie, namiesto toho, aby ju odovzdali lúpežníkom." # todo: NEW TRANSLATION
 relic_expedition_events.10.desc_holy_thorn: "Učenec prečítal súkromnú korešpondenciu vymretého rodu a vystopoval tŕň zo samotnej Koruny až do ich krypty, ktorá je zapečatená od moru, čo vyhubil celú domácnosť." # todo: NEW TRANSLATION
 relic_expedition_events.10.desc_holy_chalice: "Koluje tu jedna vetva legiend o grále, ktorá nemá nič spoločné so známymi nárokmi [ShowLocationName('genoa')] a [ShowLocationName('valencia')]. Učenec, ktorý ju skúma, verí, že obyčajný kamenný kalich leží pod kaplnkou zničenou počas starého obliehania. Jej zhromaždenie sa rozpŕchlo dávno predtým, než kohokoľvek napadlo kopať." # todo: NEW TRANSLATION
 relic_expedition_events.10.desc_titulus_crucis: "Podľa miestnej tradície sa tabuľka s nápisom z kríža na západ nikdy nedostala. Učenec, ktorý túto tradíciu berie vážne, sa domnieva, že ju zamurovali do tunajšej kaplnky počas posledného ústupu križiakov, a ponúka pomoc pri hľadaní múru." # todo: NEW TRANSLATION
 relic_expedition_events.10.a: "Najmite miestnych robotníkov. Viac rúk znamená väčšiu šancu na úspech." # todo: NEW TRANSLATION
 relic_expedition_events.10.b: "Nech kopú vlastní muži výpravy. Menej otázok." # todo: NEW TRANSLATION
 relic_expedition_events.10.c: "Cudzincov platiť netreba. Môže kopať naša družina." # todo: NEW TRANSLATION
 relic_expedition_events.11.title: "Vykopávky" # todo: NEW TRANSLATION
 relic_expedition_events.11.desc: "Pôda je tvrdá a kopanie postupuje pomaly. [target_leader.GetName] teraz nezostáva nič iné, len čakať a zistiť, či učenec vie čítať mapu." # todo: NEW TRANSLATION
 relic_expedition_events.11.a: "Lopaty narazili na niečo. Presne tam, kde učenec vravel." # todo: NEW TRANSLATION
 relic_expedition_events.11.b: "Len hlina a sutiny. Miesto už vyprázdnili." # todo: NEW TRANSLATION
 relic_expedition_events.clues_up_1_tt: "Stopa je čoraz teplejšia (#G +1#! indícia)" # todo: NEW TRANSLATION
 relic_expedition_events.clues_down_1_tt: "Stopa chladne (#R -1#! indícia)" # todo: NEW TRANSLATION

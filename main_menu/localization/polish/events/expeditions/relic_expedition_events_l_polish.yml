 relic_expedition_events.relic_recovered_true_cross_fragment_tt: "Získa $relic_true_cross_fragment_found_1$ a vydá sa na cestu domov" # todo: NEW TRANSLATION
 relic_expedition_events.relic_recovered_saint_bones_tt: "Získa $relic_regional_saint_bones_found_1$ a vydá sa na cestu domov" # todo: NEW TRANSLATION
 relic_expedition_events.relic_recovered_baptist_head_tt: "Získa $relic_baptist_head_found_1$ a vydá sa na cestu domov" # todo: NEW TRANSLATION

 relic_expedition_events.relic_recovered_holy_chalice_tt: "Získa $relic_holy_chalice_found_1$ a vydá sa na cestu domov" # todo: NEW TRANSLATION
 relic_expedition_events.relic_recovered_titulus_crucis_tt: "Získa $relic_titulus_crucis_found_1$ a vydá sa na cestu domov" # todo: NEW TRANSLATION
 relic_expedition_announce_true_cross_tt: "Každý katolícky vládca sa dozvie, že sa našlo $relic_true_cross_found$" # todo: NEW TRANSLATION
 relic_expedition_announce_holy_lance_tt: "Každý katolícky vládca sa dozvie, že sa našlo $relic_holy_lance_found$" # todo: NEW TRANSLATION
 relic_expedition_announce_holy_shroud_tt: "Každý katolícky vládca sa dozvie, že sa našlo $relic_holy_shroud_found$" # todo: NEW TRANSLATION
 relic_expedition_events.12.title: "Súperiaci hľadači pokladov" # todo: NEW TRANSLATION
 relic_expedition_events.12.desc: "Hostinský, ktorý rád dostane zaplatené dvakrát, prináša [target_leader.GetName] správu: agenti súperiacej mocnosti sedeli v tých istých izbách, kupovali nápoje tým istým prístavným robotníkom a vypytovali sa na tú istú povesť, ktorá nás sem priviedla. Vylodili sa týždeň pred nami a odvtedy so svojimi peniazmi nezaobchádzali opatrne. V tomto meste má mlčanie aj spolupráca svoju cenu a stopu si udrží ten, kto ju zaplatí ako prvý." # todo: NEW TRANSLATION
 relic_expedition_events.12.a: "Ponúknime viac než oni. Koruna dorovná akúkoľvek sumu." # todo: NEW TRANSLATION
 relic_expedition_events.12.b: "Nech si idú po tomto poklade. Do jari sa objavia ďalšie." # todo: NEW TRANSLATION
 relic_expedition_events.12.c: "Počkajme na nich v úžine a skoncujme s tým." # todo: NEW TRANSLATION
 relic_expedition_events.13.title: "Dielňa falšovateľa" # todo: NEW TRANSLATION
 relic_expedition_events.13.desc: "Remeselníka prichytia, ako predáva dôverčivému pútnikovi svätcov prstový článok, ktorý toho rána vyrezal z baraniny a zafarbil čajom. Keď sa ho pýtajú, koho ďalšieho oklamal, namiesto toho prisahá, že vie o niečom pravom, na čo narazil, keď zbieral staré drevo a ešte staršie železo do dielne. Pomenuje štvrť, ale ulicu prezradí až po tom, čo uvidí peniaze. Slovo falšovateľa má presne takú hodnotu, akú má slovo falšovateľa." # todo: NEW TRANSLATION
 relic_expedition_events.13.a: "Zaplaťme mu za to, čo tvrdí, ale iba raz." # todo: NEW TRANSLATION
 relic_expedition_events.13.b: "Nech ho družina pritlačí. Strach je lacnejší než striebro." # todo: NEW TRANSLATION
 relic_expedition_events.13.forger_honest_tt: "Tentoraz peniaze kúpia niečo pravé a falšovateľov príbeh sedí" # todo: NEW TRANSLATION
 relic_expedition_events.13.forger_cheated_tt: "V štvrti, ktorú označil, sú len klebety; falšovateľ dostal zaplatené dvakrát za tú istú lož" # todo: NEW TRANSLATION
 relic_expedition_events.13.threats_work_tt: "Strach z neho dostane to, čo striebro nedokázalo, a falšovateľ prezradí niečo skutočné" # todo: NEW TRANSLATION
 relic_expedition_events.13.threats_fail_tt: "Vykrikuje len ďalšie výhovorky; hrozby družiny priniesli iba obité hánky" # todo: NEW TRANSLATION
 relic_expedition_events.14.title: "Piesočná búrka na ceste" # todo: NEW TRANSLATION
 relic_expedition_events.14.desc: "Okolo poludnia sa na obzore zdvihne stena okrového prachu a za hodinu pohltí cestu. Ťavy si kľaknú a odmietajú vstať, piesok sa dostáva do každého záhybu látky i každého mecha na vodu a sprievodca priznáva, že už nevidí kamenné mohyly označujúce cestu. [target_leader.GetName] sa môže naslepo vydať ďalej alebo stratiť niekoľko dní čakaním, kým búrka prejde." # todo: NEW TRANSLATION
 relic_expedition_events.14.a: "Prejdime cez ňu. Cesta predsa nemôže byť ďaleko." # todo: NEW TRANSLATION
 relic_expedition_events.14.b: "Zaťažme stany, utáborme sa a počkajme, kým sa preženie." # todo: NEW TRANSLATION
 relic_expedition_events.15.title: "Útočí horúčka" # todo: NEW TRANSLATION
 relic_expedition_events.15.desc_land: "Horúčka prišla s nosičmi vody a bez varovania kosí mužov po dvoch či troch: za úsvitu bolí hlava, na poludnie prichádza triaška a na druhé ráno už je plytký hrob. Dvaja lekári výpravy už nestíhajú pomáhať všetkým, ktorí ich žiadajú o pomoc, a zdraví začali spávať ďaleko od chorých. [target_leader.GetName] musí rozhodnúť, koľko koruna vynaloží na jej zvládnutie." # todo: NEW TRANSLATION
 relic_expedition_events.15.desc_sea: "Horúčka prišla na palubu s poslednou vodou nabratou v prístave a bez varovania kosí mužov po dvoch či troch: za úsvitu bolí hlava, na poludnie prichádza triaška a na druhé ráno už telo prehodia cez zábradlie. Dvaja lekári výpravy už v stiesnenom podpalubí nestíhajú pomáhať všetkým, ktorí ich žiadajú o pomoc, a zdraví začali spávať čo najďalej od chorých, ako im paluba dovolí. [target_leader.GetName] musí rozhodnúť, koľko koruna vynaloží na jej zvládnutie." # todo: NEW TRANSLATION
 relic_expedition_events.15.a: "Nešetrite na liečbe chorých a ich izolácii." # todo: NEW TRANSLATION
 relic_expedition_events.15.b: "Nechajme horúčku voľne plynúť. Skôr či neskôr ustúpi." # todo: NEW TRANSLATION
 relic_expedition_events.16.title: "Púštni banditi žiadajú výpalné" # todo: NEW TRANSLATION
 relic_expedition_events.16.desc: "Na ceste, ktorá sa zvažuje medzi dvoma hrebeňmi, stoja ozbrojenci. Je ich priveľa a sú príliš dobre zorganizovaní na obyčajných lúpežníkov. Ich vodca vyjde na koni pred rad, oznámi sumu za bezpečný prechod a dá jasne najavo, že už zvážil, koľko by ho stála druhá možnosť." # todo: NEW TRANSLATION
 relic_expedition_events.16.a: "Zaplaťme mýto a odíďme, kým si to nerozmyslí." # todo: NEW TRANSLATION
 relic_expedition_events.16.b: "Prebojujme sa cez nich. Neprišli sme až sem, aby nás okradli." # todo: NEW TRANSLATION
 relic_expedition_events.16.c: "Nech za nás hovoria naše počty. S takým množstvom sa málokto háda." # todo: NEW TRANSLATION
 relic_expedition_events.17.title: "Pútnikova povesť" # todo: NEW TRANSLATION
 relic_expedition_events.17.desc: "Karavána pútnikov strávi noc v tom istom zájazdnom hostinci a pri ohni sa, ako vždy, stočí reč na relikvie. Jeden z nich, syn obchodníka s vlnou z ďalekého vnútrozemia, zopakuje príbeh, ktorý si matne pamätá od strýka, mŕtveho už dvadsať rokov: mnísi vynášajú z horiaceho domu nejaký zväzok, noc na pobrežnej ceste a pohreb, ktorý nik nemal vidieť. Dom nevie pomenovať. Cestou si je čudne istý." # todo: NEW TRANSLATION
 relic_expedition_events.17.a: "Kúpme mu ďalší pohár a vypytujme sa na každý detail." # todo: NEW TRANSLATION
 relic_expedition_events.17.b: "Len ďalší príbeh z tisícich. Za úsvitu pokračujeme." # todo: NEW TRANSLATION
 relic_expedition_events.17.tale_confirmed_tt: "Minca mu rozviaže jazyk a prezradí detail, o ktorý sa zrejme nemal podeliť" # todo: NEW TRANSLATION
 relic_expedition_events.17.tale_fades_tt: "Ďalší pohár nepomôže; s každým opakovaním sa detaily len viac rozmazávajú" # todo: NEW TRANSLATION
 relic_expedition_events.18.title: "Dochádzajú peniaze" # todo: NEW TRANSLATION
 relic_expedition_events.18.desc: "Slabý mesiac na zmenárenskom trhu a náhle opatrní úžerníci, ktorí už nechcú požičiavať cudzincom, zanechali pokladnicu výpravy omnoho prázdnejšiu, než sme čakali. Družina mešká s výplatou už dva týždne, pohoniči mulíc chcú zaplatiť mincami, ktorým dôverujú, a nie našimi, a správa o nezaplatenej družine sa šíri týmito mestami rýchlejšie než naše otázky." # todo: NEW TRANSLATION
 relic_expedition_events.18.a: "Rýchlo pokryme schodok z vlastnej pokladnice koruny." # todo: NEW TRANSLATION
 relic_expedition_events.18.b: "Výplaty ešte chvíľu odložme. Aj tak nemajú kam ísť." # todo: NEW TRANSLATION
 relic_expedition_events.19.title: "Miestne úrady si všímajú našu výpravu" # todo: NEW TRANSLATION
 relic_expedition_events.19.desc_muslim: "Miestny #italic qāḍī#! sa dopočul, že sa cudzinci vypytujú na franské poklady a na to, ktoré domácnosti si čo nechali, keď padli kráľovstvá. Jeho tajomník navštívi [target_leader.GetName] s čajom, komplimentmi a odkazom, ktorý sa pod zdvorilými slovami skrýva len ledva: takéto pátranie ide oveľa hladšie s vedomím jeho pána a s primeraným príspevkom na údržbu mešity." # todo: NEW TRANSLATION
 relic_expedition_events.19.desc_christian: "Miestny [relic_hunt_current_loc.GetOwner.GetGovernment.GetEstateName('clergy_estate')] si všimol, že sa zahraničná družina až priveľmi vypytuje na relikvie, o ktorých si myslí, že patria do starostlivosti cirkvi a nikoho iného. Arcidiakon prijme [target_leader.GetName] so všetkou zdvorilosťou, dlho hovorí o hriechu lakomstva a dá celkom jasne najavo, že za jeho ďalšiu priazeň treba položiť dar na oltár." # todo: NEW TRANSLATION
 relic_expedition_events.19.desc_fallback: "Správy o otázkach výpravy sa dostali k ušiam, ktoré bolo lepšie nechať v nevedomosti. Po zotmení príde do hostinca muž, ktorého nik nepredstavuje, bez pozvania si sadne a dlho vysvetľuje, koľko problémov si môže zahraničná skupina v takomto meste narobiť. Varovanie je pokojné, dokonale zdvorilé a úplne jasné." # todo: NEW TRANSLATION
 relic_expedition_events.19.a: "Preukážme potrebnú úctu pred tými správnymi ľuďmi." # todo: NEW TRANSLATION
 relic_expedition_events.19.b: "Nevšímajme si varovanie a pokračujme v práci. Času je aj tak málo." # todo: NEW TRANSLATION
 relic_expedition_events.20.title: "Nájdenie Pravého kríža" # todo: NEW TRANSLATION
 relic_expedition_events.20.desc: "Na dvoroch kresťanského sveta sa šíri správa, že [relic_finder.GetLongName] našiel $relic_true_cross_found$, ktoré sa stratilo po katastrofe pri Hattíne, a teraz ho uchováva vo vlastnej pokladnici. Každá katedrálna kapitula bude chcieť vlastné vysvetlenie, ako ho našli, a máloktorá sa zhodne na jeho pravosti." # todo: NEW TRANSLATION
 relic_expedition_events.20.a: "Správy sa v kresťanskom svete šíria rýchlo." # todo: NEW TRANSLATION
 relic_expedition_events.21.title: "Svätá kopija sa znovu objavila" # todo: NEW TRANSLATION
 relic_expedition_events.21.desc: "Medzi veriacimi sa šíri správa, že [relic_finder.GetLongName] našiel $relic_holy_lance_found$, ktoré sa stratilo po tom, čo prvá križiacka výprava opustila [ShowLocationName('antioch')]. Viac než jeden pútnický itinerár sa na základe toho zmení." # todo: NEW TRANSLATION
 relic_expedition_events.21.a: "Ďalšia relikvia si našla cestu domov." # todo: NEW TRANSLATION
 relic_expedition_events.22.title: "Nájdenie Svätého plátna" # todo: NEW TRANSLATION
 relic_expedition_events.22.desc: "Katolíckou Európou sa šíria správy, že [relic_finder.GetLongName] vlastní $relic_holy_shroud_found$, plátno, o ktorom sa už dlho hovorí, no nikdy sa ho nepodarilo nájsť. Skeptici o tom budú pochybovať, ako vždy. Veriaci sa tam aj tak vydajú." # todo: NEW TRANSLATION
 relic_expedition_events.22.a: "Nech pútnici posúdia sami." # todo: NEW TRANSLATION

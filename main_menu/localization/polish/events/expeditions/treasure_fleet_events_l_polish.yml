l_polish:
 treasure_fleet_events.1.title: "Vek pokladných výprav" # todo: NEW TRANSLATION
 treasure_fleet_events.1.entry: "$treasure_fleet_events.1.title$" # todo: NEW TRANSLATION
 treasure_fleet_events.1.desc: "Posledné desaťročia prosperity nám priniesli dostatok voľného zlata a zdrojov, ktoré môžeme vynaložiť na naše diplomatické úsilie. Mohli by sme tieto prostriedky využiť na ďalšie posilnenie už aj tak silného postavenia [GetInternationalOrganization('middle_kingdom').GetName] v očiach sveta, a rozhodne by sme tak mali urobiť. Pošleme teda námorné výpravy naložené tými najvzácnejšími darmi, aké si [ROOT.GetCountry.GetAltAdjective('D')] môže dovoliť, aby sme presvedčili ďalšie národy, nech sa pridajú k našej sieti [ShowSubjectTypeName('tributary')]." # todo: NEW TRANSLATION # todo: COUNTRY CASE
 treasure_fleet_events.1.a: "Tak teda vyplávame!" # todo: NEW TRANSLATION
 treasure_fleet_events.1.zheng_he_owned_tt: "Zhèng Hé musí byť momentálne v našich službách" # todo: NEW TRANSLATION
 chi_able_to_send_treasure_voyages: "[ROOT.GetCountry.GetName] bude môcť použiť [ShowGenericActionName('start_a_treasure_voyage')] [Concept('action','akcia')|e] na vydanie svojho [Concept('gold','dukátov')|e], aby získal viac národov do svojej siete [ShowSubjectTypeName('tributary')]. To bude možné len dovtedy, kým budú vodcami [Concept('international_organization_leader_short','lídrom')|e] [GetInternationalOrganizationType('middle_kingdom').GetName]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 treasure_fleet_events.2.title: "Koniec jednej éry" # todo: NEW TRANSLATION
 treasure_fleet_events.2.desc: "Štát [ROOT.GetCountry.GetName] dnes hodnotí úspechy pokladných výprav a nevidí v nich nič iné než márnotratné míňanie prostriedkov, ktoré prinieslo len trochu prestíže. Najlepšie by bolo, keby historici na tieto činy jednoducho zabudli." # todo: NEW TRANSLATION
 treasure_fleet_events.2.a: "Čo sa dá robiť." # todo: NEW TRANSLATION
 chi_unable_to_send_treasure_voyages: "[ROOT.GetCountry.GetName] už nebude môcť používať [ShowGenericActionName('start_a_treasure_voyage')]." # todo: NEW TRANSLATION
 treasure_fleet_events.3.title: "Začiatok výpravy" # todo: NEW TRANSLATION
 treasure_fleet_events.3.desc: "Po týždňoch príprav je naša veľkolepá flotila konečne pripravená vyplávať do oblasti [target_area.GetName]. Nevieme, aké dobrodružstvá či nešťastia čakajú $expedition_leader_name$ a $expedition_leader_name_herhis$ družinu, no keďže im [ROOT.GetCountry.GetGovernment.GetRulerOrRegent.GetAltAdjective('D')] zveril takúto zodpovednosť, sme si istí, že nesklamú.\n\nPodľa plánu flotila vypláva na úsvite z prístavu [start_location.GetName] a môže trvať celé roky, kým sa vráti na naše brehy. Lúčime sa s nimi!" # todo: NEW TRANSLATION # todo: COUNTRY CASE
 treasure_fleet_events.3.a: "Veľa šťastia!" # todo: NEW TRANSLATION
 chinese_treasure_expeditions_send_tooltip: "$expedition_name_treasure_voyage$ sa vydáva do oblasti [ROOT.GetVariable('chinese_treasure_target_location').GetLocation.GetName] pod vedením [character_expedition_leader_target.GetName].\nFlotila vezie náklad v hodnote #g [ROOT.GetVariable('chinese_treasure_voyage_cargo').GetValue|2]#! [Concept('gold','dukátom')|e], určený na darovanie [Concept('countries','krajiny')|e], ktoré navštívi" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 treasure_fleet_events.4.title: "Správy z výpravy $expedition_name_treasure_voyage$" # todo: NEW TRANSLATION
 treasure_fleet_events.4.desc: "Do jedného z južných prístavov vplávala džunka so správami z výpravy $expedition_name_treasure_voyage$. Flotila pod vedením $expedition_leader_name$ dorazila do prístavu [port_location.GetName] v krajine [port_country.GetName] a [port_country.GetGovernment.GetCourtTitle] ju náležite prijal. Naši vyslanci si vymenili obchodný tovar a odovzdali [port_country.Custom('GetRulerOrRegentTitle')] obvyklé dary. Kronikár flotily uvádza, že vietor aj ročné obdobie sú pre ďalšiu časť cesty priaznivé. Kapitán poznamenáva, že [ROOT.GetCountry.GetGovernment.GetCourtTitle] zatiaľ nemá dôvod očakávať zlé správy." # todo: NEW TRANSLATION
 treasure_fleet_events.4.a: "Nech je vietor aj naďalej priaznivý." # todo: NEW TRANSLATION
 treasure_fleet_events.5.title: "Príchod [expedition_initiator.GetAdjectiveWithNoTooltip] výpravy $expedition_name_treasure_voyage$" # todo: NEW TRANSLATION
 treasure_fleet_events.5.desc: "Obyvatelia [target_stop.GetName], sídla s hodnosťou [target_stop.GetRank.GetName], sa na úsvite dočkali hrôzostrašného, no zároveň úchvatného pohľadu. Celý obzor nad oblasťou [coastal_sea_tile.GetName] pokrývali lode nikoho iného než [GetInternationalOrganization('middle_kingdom').GetName], [expedition_initiator.GetLongName]. Veliteľ flotily, $expedition_leader_name$, bezodkladne vystúpil v našom prístave a požiadal o povolenie doplniť zásoby v [target_stop.GetNameWithNoTooltip]. To, čo nasledovalo, bolo naozaj nezvyčajné: [expedition_initiator.GetAdjectiveWithNoTooltip] námorníci nadviazali kontakt s miestnymi úradníkmi, zasypali ich darmi a požiadali o audienciu u [ROOT.GetCountry.GetGovernment.GetRulerTitle]." # todo: NEW TRANSLATION
 treasure_fleet_events.5.a: "Prijmite ich na [ROOT.GetCountry.GetGovernment.GetCourtTitle]!" # todo: NEW TRANSLATION
 treasure_fleet_events.5.a.entry: "Prijmite ich na dvore!" # todo: NEW TRANSLATION
 treasure_fleet_events.6.title: "Audiencia u [ROOT.GetCountry.GetGovernment.GetRulerTitle]" # todo: NEW TRANSLATION
 treasure_fleet_events.6.desc: "$expedition_leader_name$ a $expedition_leader_name_herhis$ sprievod konečne nadviazali kontakt s naším dobrotivým [ROOT.GetCountry.GetGovernment.GetRulerTitle]. Ich mohutná flotila a záplava darov na nás všetkých urobili veľký dojem, a preto nás ich ponuka vzťahu typu [ShowSubjectTypeName('tributary')] pod vládou [expedition_initiator.GetAdjective] natoľko zaskočila. Možno by nám podriadenosť takému mocnému štátu priniesla viac úžitku, než sa na prvý pohľad zdá." # todo: NEW TRANSLATION
 treasure_fleet_events.6.a: "Priateľstvo má svoju cenu." # todo: NEW TRANSLATION
 treasure_fleet_events.6.b: "Nič také neprichádza do úvahy!" # todo: NEW TRANSLATION
 chinese_expedition_resolution_tt: "Počas nasledujúcich mesiacov zostane čínska $expedition_name_treasure_voyage$ v našom prístave [target_stop.GetName]. Dostaneme [Concept('events','udalosti')|e], ktoré nám umožnia s nimi interagovať a to zmení ich názor na nás. V závislosti od hodnotenia na konci pobytu dostaneme rôzne výsledky:\n\nPoslušní (#y 67#! - #y 100#!):\n[ShowScriptedEffectForScope('chi_expedition_resolution_very_positive', ROOT.GetCountry.MakeScope.Self)]\nPriazniví (#y 33#! - #y 66#!):\n[ShowScriptedEffectForScope('chi_expedition_resolution_positive', ROOT.GetCountry.MakeScope.Self)]\nNevšímaví (#y -32#! - #y 32#!):\n$NOTHING_HAPPENS_EFFECT$\nNeúctiví (#y -66#! - #y -33#!):\n[ShowScriptedEffectForScope('chi_expedition_resolution_negative', ROOT.GetCountry.MakeScope.Self)]\nArogantní (#y -100#! - #y -67#!):\n[ShowScriptedEffectForScope('chi_expedition_resolution_very_negative', ROOT.GetCountry.MakeScope.Self)]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 treasure_fleet_events.7.title: "Vhodné dary" # todo: NEW TRANSLATION
 treasure_fleet_events.7.desc_shared: "Pokladná flotila krajiny [expedition_initiator.GetName] dokončila svoju misiu v krajine [ROOT.GetCountry.GetAltAdjective('D')] a teraz dopĺňa zásoby. Očakáva sa, že v priebehu niekoľkých mesiacov odíde. Bolo by zvykom ponúknuť jej to najlepšie, čo náš [ROOT.GetCountry.GetFlavorRank] môže poskytnúť, ako prejav vďaky" # todo: NEW TRANSLATION # todo: COUNTRY CASE
 treasure_fleet_events.7.desc: "$treasure_fleet_events.7.desc_shared$ a ako potvrdenie nášho vzťahu typu [ShowSubjectTypeName('tributary')]." # todo: NEW TRANSLATION
 treasure_fleet_events.7.desc_no_tributary: "$treasure_fleet_events.7.desc_shared$ za jej návštevu." # todo: NEW TRANSLATION
 treasure_fleet_events.7.a: "Ukážme im svoju štedrosť." # todo: NEW TRANSLATION
 treasure_fleet_events.7.gift: "Darujme im našu špecialitu." # todo: NEW TRANSLATION
 treasure_fleet_events.7.b: "Nemôžeme si to dovoliť..." # todo: NEW TRANSLATION
 treasure_fleet_events.8.title: "Výprava odpláva" # todo: NEW TRANSLATION
 treasure_fleet_events.8.desc: "Konečne pokladná flotila [expedition_initiator.GetAdjective] opustila [target_stop.GetName]. Prejavili sme jej veľkú pohostinnosť a dúfame, že jej cesta bude požehnaná." # todo: NEW TRANSLATION
 treasure_fleet_events.8.a: "Zbohom!" # todo: NEW TRANSLATION
 chi_fleet_will_depart: "Výprava [expedition_initiator.GetAdjective] odpláva z krajiny [ROOT.GetCountry.GetAltAdjective('G')]" # todo: NEW TRANSLATION # todo: COUNTRY CASE
 chinese_expedition_opinion: "Dôvera vo výpravu za pokladmi" # todo: NEW TRANSLATION
 based_on_expedition_opinion: "Na základe hodnoty $chinese_expedition_opinion$ (momentálne [ROOT.GetVariable('chinese_expedition_opinion').GetValue]) nastane toto:" # todo: NEW TRANSLATION
 treasure_fleet_events.9.title: "Návrat výpravy $expedition_name_treasure_voyage$" # todo: NEW TRANSLATION
 treasure_fleet_events.9.desc: "Naša flotila, ktorú sme pred rokmi vyslali do oblasti [ROOT.GetVariable('chinese_treasure_target_location').GetLocation.GetName], sa konečne vrátila a priviezla množstvo vyslancov a darov, ktoré počas dlhej cesty získala. $expedition_leader_name$ teraz smeruje s bohatstvom a zahraničnými zástupcami do nášho hlavného mesta." # todo: NEW TRANSLATION
 treasure_fleet_events.9.a: "[ROOT.GetCountry.Custom('common_string_positive')]" # todo: NEW TRANSLATION
 treasure_fleet_events.9.a.entry: "$common_string_brilliant$" # todo: NEW TRANSLATION
 treasure_fleet_events.10.title: "Audiencia u [ROOT.GetCountry.GetGovernment.GetRulerTitle]" # todo: NEW TRANSLATION
 treasure_fleet_events.10.desc: "$expedition_leader_name$ sa konečne vrátil do [ROOT.GetCountry.GetCapital.GetAltAdjective('G')], kde ho privítali s veľkými oslavami a jasotom. Vo svojej delegácii priviedol mnohých vyslancov z navštívených krajín, ktorí sú pripravení prisahať vernosť [ROOT.GetCountry.GetGovernment.GetRulerTitle]. Ich rozhodnutie prísť sem nás veľmi teší." # todo: NEW TRANSLATION # todo: COUNTRY CASE
 treasure_fleet_events.10.a: "[ROOT.GetCountry.Custom('common_string_positive')]" # todo: NEW TRANSLATION
 treasure_fleet_events.10.a.entry: "$common_string_brilliant$" # todo: NEW TRANSLATION
 treasure_fleet_events.11.title: "Koniec výpravy" # todo: NEW TRANSLATION
 treasure_fleet_events.11.desc: "Výprava $expedition_name_treasure_voyage$ sa konečne skončila. Zhodnoťme, či sa nám táto investícia vyplatila, a zvážme, či v budúcnosti nevyslať ďalšiu. Takéto výpravy sú totiž nákladné." # todo: NEW TRANSLATION
 treasure_fleet_events.11.a: "Potrebujeme viac takýchto misií." # todo: NEW TRANSLATION
 chi_we_will_gift_cloves: "Darujeme krajine [expedition_initiator.GetName] [ShowGoodsName('cloves')]" # todo: NEW TRANSLATION
 chi_we_will_gift_giraffe: "Darujeme krajine [expedition_initiator.GetName] žirafu" # todo: NEW TRANSLATION
 chi_we_will_gift_persian_blue: "Darujeme krajine [expedition_initiator.GetName] miestne [ShowGoodsName('dyes')]" # todo: NEW TRANSLATION
 treasure_fleet_events.12.title: "Exotické zviera" # todo: NEW TRANSLATION
 treasure_fleet_events.12.desc: "Naša výprava $expedition_name_treasure_voyage$ priviezla na [ROOT.GetCountry.GetGovernment.GetCourtTitle] [ROOT.GetCountry.GetGovernment.GetRulerTitle] naozaj výnimočné a úžasné zviera! Je to mohutná šelma s dlhým krkom a tmavými škvrnami, ktorú v zahraničí nazývajú žirafou. Naši dvorania však toto zviera stotožnili s legendárnym [ShowCultureGroupName('chinese_group')] #italic qílín#!, ktorý predznamenáva zlatý vek pod vládou slávneho panovníka. Mohli by sme tejto povesti uveriť a posilniť si prestíž, zároveň by sme však na seba kládli vyššie nároky." # todo: NEW TRANSLATION
 treasure_fleet_events.12.a: "Je to bájny #italic qílín#!!" # todo: NEW TRANSLATION
 treasure_fleet_events.12.b: "Naozaj nádherné zviera." # todo: NEW TRANSLATION
 treasure_fleet_events.13.title: "Farba zázrakov" # todo: NEW TRANSLATION
 treasure_fleet_events.13.desc: "Naša veľkolepá výprava priviezla z oblasti [ShowSubContinentName('middle_east')] exotické farbivo. Táto intenzívna modrá farba sa ukázala ako dokonalá surovina na výrobu našej preslávenej [ShowGoodsName('pottery')]. Priviezli sme dostatok [ShowGoodsName('dyes')], aby sme ich mohli využiť vo výrobe." # todo: NEW TRANSLATION
 treasure_fleet_events.13.a: "[ROOT.GetCountry.Custom('common_string_positive')]" # todo: NEW TRANSLATION
 treasure_fleet_events.13.a.entry: "$common_string_brilliant$" # todo: NEW TRANSLATION
 treasure_fleet_events.14.title: "Chuť, na ktorú nezabudneme" # todo: NEW TRANSLATION
 treasure_fleet_events.14.desc: "Hoci je oblasť [ShowRegionName('indonesia_region')] známa svojím korením, naša výprava $expedition_name_treasure_voyage$ navštívila miesto, kde sa vo veľkom pestuje výnimočné [ShowGoodsName('cloves')] – oblasť [ShowAreaName('moluccas_area')]. Miestni nás pohostinne privítali a vzdali nám hold množstvom tohto úžasného korenia. [ROOT.GetCountry.GetGovernment.GetCourtTitle] aj [ROOT.GetCountry.GetGovernment.GetRulerTitle] si na ňom budú pochutnávať ešte celé mesiace." # todo: NEW TRANSLATION
 treasure_fleet_events.14.a: "[ROOT.GetCountry.Custom('common_string_positive')]" # todo: NEW TRANSLATION
 treasure_fleet_events.14.a.entry: "$common_string_brilliant$" # todo: NEW TRANSLATION
 treasure_fleet_events.15.title: "Nájdený zbabelý utečenec" # todo: NEW TRANSLATION
 treasure_fleet_events.15.desc: "Počas výpravy $expedition_name_treasure_voyage$ sa $expedition_leader_name$ a $expedition_leader_name_herhis$ verní námorníci vypátrali významného disidenta menom [extradited_character.GetName]. [extradited_character.GetShortNameWithNoTooltip] pred dávnou dobou utiekol z krajiny [ROOT.GetCountry.GetAltAdjective('G')], aby unikol spravodlivému trestu. Naša výprava však [extradited_character.GetHerHim] nielen našla, ale [extradited_character.GetHerHim] aj vyrvala z rúk [extradited_character.GetHerHis] ochrancov v krajine [asylum_country.GetName] a priviedla [extradited_character.GetHerHim] späť do $china$, aby bol spravodlivo potrestaný." # todo: NEW TRANSLATION # todo: COUNTRY CASE
 treasure_fleet_events.15.a: "Uškrťte tohto bezvýznamného zločinca!" # todo: NEW TRANSLATION
 treasure_fleet_events.15.b: "Nechajte [extradited_character.GetHerHim] sťať." # todo: NEW TRANSLATION
 treasure_fleet_events.15.b.entry: "Nechajte ho sťať." # todo: NEW TRANSLATION
 treasure_fleet_events.15.c: "Vykonajte #italic língchí#!, pomalé rozrezávanie." # todo: NEW TRANSLATION
 treasure_fleet_events.15.d: "Odpusťte disidentovi, [extradited_character.GetHerHis] schopnosti by sa nám mohli hodiť." # todo: NEW TRANSLATION
 treasure_fleet_events.15.d.entry: "Odpusťte disidentovi, jeho schopnosti by sa nám mohli hodiť." # todo: NEW TRANSLATION
 treasure_fleet_events.16.title: "Poprava [executed_character.GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 treasure_fleet_events.16.desc: "[executed_character.GetName] utiekol z oblasti [executed_character.GetBirthLocation.GetArea.GetName]. Jeho rodina sa po zavedení [ShowPolicyName('haijin_policy')] obrátila k pirátstvu. Po [executed_character.GetHerHis] úteku sa [executed_character.GetShortNameWithNoTooltip] stal pirátskym náčelníkom v krajine [loser_country.GetName] a následne zvádzal boje proti $expedition_leader_name$ pri pobreží [loser_country.GetFlavorRank]. Teraz nastal čas urobiť z [executed_character.GetNameWithNoTooltip] odstrašujúci príklad." # todo: NEW TRANSLATION
 treasure_fleet_events.16.a: "Spravodlivosti bolo učinené zadosť." # todo: NEW TRANSLATION
 treasure_fleet_events.17.title: "Vzdorovitý panovník" # todo: NEW TRANSLATION
 treasure_fleet_events.17.desc: "Počas našej výpravy $expedition_name_treasure_voyage$ sa $expedition_leader_name$ a $expedition_leader_name_herhis$ veľkolepá flotila zmocnili významného zajatca – [loser_character.GetName], bývalého [loser_country.GetGovernment.GetRulerTitle] krajiny [loser_country.GetLongName]. Zrada a neúcta krajiny [loser_country.GetNameWithNoTooltip] však viedli k jej rýchlej porážke, počas ktorej [loser_character.GetSheHe] bol [loser_character.GetHerHim] zajatý." # todo: NEW TRANSLATION
 treasure_fleet_events.17.a: "Urobte z [loser_character.GetHerHim] odstrašujúci príklad." # todo: NEW TRANSLATION
 treasure_fleet_events.17.a.entry: "Urobte z neho odstrašujúci príklad." # todo: NEW TRANSLATION
 treasure_fleet_events.17.b: "Prejavte milosrdný prístup." # todo: NEW TRANSLATION
 treasure_fleet_events.18.title: "Osud krajiny [loser_country.GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 treasure_fleet_events.18.desc: "Bláznivý panovník krajiny [loser_country.GetName] sa vzoprel vôli [GetInternationalOrganization('middle_kingdom').GetName], ktorú zastupoval $expedition_leader_name$ a $expedition_leader_name_herhis$ výprava. Po krutom konflikte bola krajina [loser_country.GetLongNameWithNoTooltip] porazená a dosadili sme dočasného [loser_country.GetGovernment.GetRulerTitle], kým sa rozhodneme, čo s ňou urobíme." # todo: NEW TRANSLATION
 treasure_fleet_events.18.a: "Pošlite [target_character_for_viceroyalty.GetNameWithNoTooltip], nech vládne ako náš miestokráľ." # todo: NEW TRANSLATION
 treasure_fleet_events.18.a.entry: "Pošlite ho vládnuť ako náš miestokráľ." # todo: NEW TRANSLATION
 treasure_fleet_events.18.b: "Miestna bábka môže zostať." # todo: NEW TRANSLATION
 treasure_fleet_events.19.title: "Miestokráľ z krajiny [expedition_initiator.GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 treasure_fleet_events.19.desc: "Dostali sme správy z [GetInternationalOrganization('middle_kingdom').GetName]. Rozhodli, že nášmu štátu bude vládnuť ich miestokráľ [target_character_for_viceroyalty.GetName], ktorý nás bude v dohľadnej budúcnosti spravovať v rámci vzťahu typu [ShowSubjectTypeName('tributary')]. Taký je náš osud: vládnu nám víťazi vojny, naši nepriatelia." # todo: NEW TRANSLATION
 treasure_fleet_events.19.a: "Časom toto jarmo zhodíme." # todo: NEW TRANSLATION
 treasure_fleet_events.20.title: "Dary z ďalekých krajov" # todo: NEW TRANSLATION
 treasure_fleet_events.20.desc: "Naši námorníci počas výpravy dostali množstvo miestnych výrobkov a tovaru, ktoré teraz priviezli do $china$. Pre nás nemajú veľkú peňažnú hodnotu, no stavajú [GetInternationalOrganization('middle_kingdom').GetName] do priaznivého svetla a nepochybne nám na dlhé roky zvýšia prestíž." # todo: NEW TRANSLATION
 treasure_fleet_events.20.a: "Nečakali sme nič menšie." # todo: NEW TRANSLATION
 treasure_fleet_events.21.title: "Smrť [target.GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 treasure_fleet_events.21.desc: "Dozvedeli sme sa, že veliteľ našej výpravy $expedition_name_treasure_voyage$, $expedition_leader_name$, zahynul počas $expedition_leader_name_herhis$ cesty. Druhý veliteľ, [new_leader.GetName], prevzal velenie a bude musieť viesť výpravu sám." # todo: NEW TRANSLATION
 treasure_fleet_events.21.a: "Nech to nie je zlé znamenie pre to, čo nás čaká." # todo: NEW TRANSLATION
 chi_new_expedition_leader: "[new_leader.GetName] je teraz veliteľom našej výpravy $expedition_name_treasure_voyage$" # todo: NEW TRANSLATION
 treasure_fleet_events.22.title: "Dochádzajú nám prostriedky" # todo: NEW TRANSLATION
 treasure_fleet_events.22.desc: "Dostali sme správu, že výprave $expedition_name_treasure_voyage$ došli dary, ktorými by mohla viesť diplomaciu. Bez vhodných darov flotila po zvyšok plavby vynechá ďalšie zdvorilostné návštevy zahraničných prístavov. Nabudúce by sme mali našim výpravám poskytnúť primeranejšie prostriedky." # todo: NEW TRANSLATION
 treasure_fleet_events.22.a: "To je trápne." # todo: NEW TRANSLATION
 chi_expedition_is_returning_to_china: "Výprave $expedition_name_treasure_voyage$ došli dary a po zvyšok cesty už nebude navštevovať zahraničné prístavy" # todo: NEW TRANSLATION
 show_current_chinese_expedition_amount: "[COUNTRY.MakeScope.GetVariable('chinese_expedition_opinion').GetValue]" # todo: NEW TRANSLATION
 change_amount_of_treasure_voyage_tt: "Množstvo nákladu, ktoré preváža $expedition_name_treasure_voyage$, sa zvýši o $VALUE|+$" # todo: NEW TRANSLATION
 change_amount_of_treasure_voyage_tt_neg: "Množstvo nákladu, ktoré preváža $expedition_name_treasure_voyage$, sa zníži o $VALUE|-$" # todo: NEW TRANSLATION
 change_opinion_of_expedition: "Obľúbenosť $chinese_expedition_opinion$ u nás sa zvýši o $VALUE|0Y$. (Momentálne: $show_current_chinese_expedition_amount$)" # todo: NEW TRANSLATION
 change_opinion_of_expedition_neg: "Obľúbenosť $chinese_expedition_opinion$ u nás sa zníži o $VALUE|0Y$. (Momentálne: $show_current_chinese_expedition_amount$)" # todo: NEW TRANSLATION
 give_gold_to_expedition: "$VALUE|2Y$ bude darovaných $expedition_name_treasure_voyage$." # todo: NEW TRANSLATION
 chi_gift_received_count: "Dostali sme [ROOT.GetVariable('gifts_received').GetValue|2+=] v [Concept('gold','dukátoch')|e], ktoré sa prevádza na:" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 treasure_fleet_events.23.title: "Pokladová flotila zastihnutá búrkou" # todo: NEW TRANSLATION
 treasure_fleet_events.23.desc: "Na svojej plavbe narazila naša najväčšia pokladová flotila na nanajvýš nebezpečného protivníka: mocné sily prírody v podobe mohutnej búrky, ktorá zaskočila aj našich najskúsenejších námorníkov. Počas tejto pohromy sme prišli o mnoho lodí, a tak aj o mnohé dary a tovar." # todo: NEW TRANSLATION
 treasure_fleet_events.23.a: "[ROOT.GetCountry.Custom('common_string_nothing_we_can_do')]" # todo: NEW TRANSLATION
 treasure_fleet_events.23.a.entry: "$common_string_nothing_we_can_do_about_it$" # todo: NEW TRANSLATION
 treasure_fleet_events.24.title: "Zrážka s pirátskou flotilou" # todo: NEW TRANSLATION
 treasure_fleet_events.24.desc: "Keď sa naša slávna $expedition_name_treasure_voyage$ pod bedlivým dohľadom $expedition_leader_name$ plavila cez [target_location.GetTopography.GetName] v oblasti [target_location.GetName], narazila na odpornú bandu pirátov. Naši statoční vojaci sa, samozrejme, nezľakli a bez meškania sa pustili do rozhodujúcej bitky, v ktorej nepriateľskú zberbu úplne porazili a zajali jej vodcov. Takéto stretnutie si však vyžiadalo straty na životoch aj lodiach a našu veľkolepú flotilu pripravilo o mnohé zdroje." # todo: NEW TRANSLATION
 treasure_fleet_events.24.a: "Tým si získame uznanie." # todo: NEW TRANSLATION
 treasure_fleet_events.25.title: "Plachta v diaľke" # todo: NEW TRANSLATION
 treasure_fleet_events.25.desc: "Pozorovatelia hlásia plachtu na obzore: obchodnú flotilu bohato naloženú nákladom, ktorá sa plaví tými istými vodami ako my. $expedition_leader_name$ prikáže našim kapitánom, aby ju pokojne pozdravili, a čoskoro sa rozprúdi čulý obchod: balíky [ShowGoodsName('silk')] a jemný [ShowGoodsName('porcelain')] vymeníme za korenie, drahokamy a vzácnosti z južných morí.\n\nLodné priestory $expedition_name_treasure_voyage$ sú teraz plnšie než predtým." # todo: NEW TRANSLATION
 treasure_fleet_events.25.a: "Priaznivý vietor a výhodný obchod." # todo: NEW TRANSLATION
 treasure_fleet_events.30.title: "Hostina na dvore" # todo: NEW TRANSLATION
 treasure_fleet_events.30.desc: "Kým flotila kotví pri brehoch [target_stop.GetName], tunajší dvor usporiada veľkolepú hostinu na počesť $expedition_name_treasure_voyage$. Pred $expedition_leader_name$ a kapitánov predložia hudobníkov, tanečníkov a stovku rozličných jedál. Tí odovzdajú obvyklé dary a porozprávajú o veľkoleposti [GetInternationalOrganization('middle_kingdom').GetName].\n\nSprávy o skvelom správaní flotily v cudzine sa určite donesú až domov." # todo: NEW TRANSLATION
 treasure_fleet_events.30.a: "Nech sú svedkami našej veľkoleposti." # todo: NEW TRANSLATION
 treasure_fleet_events.31.title: "Zaujímavosti pre [ROOT.GetCountry.GetGovernment.GetRulerTitle]" # todo: NEW TRANSLATION
 treasure_fleet_events.31.desc: "Trhy v [target_stop.GetName] prekypujú zázrakmi, aké v našich krajoch nepoznáme: vtákmi v klietkach nevídaných farieb, podivnými zvieratami, voňavým drevom a drahokamami vybrúsenými podľa cudzích zvykov. Obchodníci z $expedition_name_treasure_voyage$ by mohli naplniť celé podpalubie kuriozitami, ktoré by potešili [ROOT.GetCountry.GetGovernment.GetRulerTitle], no museli by na to použiť časť zlata vyhradeného na dary.\n\nOtvoríme pokladnice?" # todo: NEW TRANSLATION
 treasure_fleet_events.31.a: "Kúpme to najlepšie, čo trh ponúka." # todo: NEW TRANSLATION
 treasure_fleet_events.31.b: "Naše zlato sa lepšie hodí na tribút." # todo: NEW TRANSLATION
 treasure_fleet_events.26.title: "Skúška velenia" # todo: NEW TRANSLATION
 treasure_fleet_events.26.desc: "Otvorené more a nepresné mapy vyvolali medzi dôstojníkmi $expedition_name_treasure_voyage$ spor. Niektorí naliehajú na $expedition_leader_name$, aby zvolil obozretnú trasu, iní presadzujú rýchlejší, no riskantnejší priechod. Všetci hľadia na admirála a spôsob, akým teraz $expedition_leader_name_herhis$ preukáže svoje veliteľské schopnosti, sa zapíše do pamäti." # todo: NEW TRANSLATION
 treasure_fleet_events.26.a: "Zvoľme obozretnú a usporiadanú trasu." # todo: NEW TRANSLATION
 treasure_fleet_events.26.b: "Odvážme sa na rýchlejší priechod." # todo: NEW TRANSLATION
 treasure_fleet_events.27.title: "Zázrak z hlbín" # todo: NEW TRANSLATION
 treasure_fleet_events.27.desc: "Celý deň a noc sa flotila plaví v sprievode obrovského tvora, ktorého chrbát rozráža vlny ako pohyblivý ostrov. Kronikári z $expedition_name_treasure_voyage$ zapĺňajú svoje zvitky opisom tohto výjavu a námorníci ho považujú za mimoriadne priaznivé znamenie. Keď flotila dorazí domov, o tomto zázraku sa bude rozprávať v každej čajovni." # todo: NEW TRANSLATION
 treasure_fleet_events.27.a: "Zázrak, ktorý ohromí dvor." # todo: NEW TRANSLATION
 treasure_fleet_events.28.title: "Znamenie na nebesiach" # todo: NEW TRANSLATION
 treasure_fleet_events.28.desc: "Astronómovia flotily zaznamenajú na nočnej oblohe zvláštne svetlo a skúmajú svoje mapy, aby odhalili jeho význam. Nech je jeho skutočná podstata akákoľvek, námorníci čítajú v nebesiach posolstvo z výšin a na paluby $expedition_name_treasure_voyage$ padne slávnostné ticho." # todo: NEW TRANSLATION
 treasure_fleet_events.28.a: "Dbajme na to, čo nám nebesá predpovedajú." # todo: NEW TRANSLATION
 treasure_fleet_events.29.title: "Bezvetrie" # todo: NEW TRANSLATION
 treasure_fleet_events.29.desc: "Vietor úplne ustane a mohutné lode $expedition_name_treasure_voyage$ nehybne stoja na hladkom mori. Plachty deň čo deň bezvládne visia a $expedition_leader_name$ s dôstojníkmi nemôžu robiť nič iné, len čakať a sledovať obzor, či sa neobjaví aspoň závan vetra. Plavba sa tým predĺži." # todo: NEW TRANSLATION
 treasure_fleet_events.29.a: "Počkajme, kým sa vietor vráti." # todo: NEW TRANSLATION
 treasure_fleet_events.32.title: "Požiar v dokoch" # todo: NEW TRANSLATION
 treasure_fleet_events.32.desc: "V preplnených skladoch v [target_stop.GetName], kde bola uložená časť tovaru flotily, vypukne požiar. Námorníci z $expedition_name_treasure_voyage$ sa zapoja do podávania vedier, no plamene predtým stihnú pohltiť debny s [ShowGoodsName('silk')] a [ShowGoodsName('porcelain')] určenými ako dary." # todo: NEW TRANSLATION
 treasure_fleet_events.32.a: "Drahá noc." # todo: NEW TRANSLATION
 treasure_fleet_events.33.title: "Miestny lodivod" # todo: NEW TRANSLATION
 treasure_fleet_events.33.desc: "Skúsený námorník z [target_stop.GetName], ktorý pozná útesy a prúdy v týchto vodách, ponúka, že bude $expedition_name_treasure_voyage$ viesť na ďalšom úseku plavby. $expedition_leader_name$ zvažuje, či zverí kurz flotily do rúk cudzinca." # todo: NEW TRANSLATION
 treasure_fleet_events.33.a: "Privítajme jeho pomoc na palube." # todo: NEW TRANSLATION
 treasure_fleet_events.33.b: "Naši vlastní navigátori si poradia." # todo: NEW TRANSLATION
 treasure_fleet_events.34.title: "Dar pre admirála" # todo: NEW TRANSLATION
 treasure_fleet_events.34.desc: "Keď sa flotila v [target_stop.GetName] chystá zdvihnúť kotvy, miestny dvor daruje $expedition_leader_name$ vzácny dar na rozlúčku. Je to prejav úcty voči [GetInternationalOrganization('middle_kingdom').GetName], ktorý si odnesie domov a odovzdá [ROOT.GetCountry.GetGovernment.GetRulerTitle]." # todo: NEW TRANSLATION
 treasure_fleet_events.34.a: "Dôstojný prírastok k tribútu." # todo: NEW TRANSLATION
 treasure_fleet_events.35.title: "Hľadanie tlmočníka" # todo: NEW TRANSLATION
 treasure_fleet_events.35.desc: "Zástupcovia $expedition_name_chinese_expedition$ sú tak ďaleko od domova a len ťažko s nami dokážu účinne komunikovať. Napriek tomu sa chystajú plaviť ďalej a čoskoro sa stretnú s ľuďmi mnohých kultúr, s ktorými sa dosiaľ nikdy nestýkali. Aby mohli pokračovať v plavbe, požiadali nás o miestneho tlmočníka." # todo: NEW TRANSLATION
 treasure_fleet_events.35.a: "Okamžite nájdime tlmočníka!" # todo: NEW TRANSLATION
 treasure_fleet_events.35.b: "To je ich problém, nie náš." # todo: NEW TRANSLATION
 treasure_fleet_events.36.title: "Zdieľanie máp" # todo: NEW TRANSLATION
 treasure_fleet_events.36.desc: "$expedition_name_treasure_voyage$ nás požiadala o mapy miestnych vodných ciest. Nemáme povinnosť jej vyhovieť, no splnenie tejto žiadosti by považovali za prejav dobrej vôle. $expedition_leader_name$ aj ďalšie elity [ShowCultureGroupName('chinese_group')], ktoré sa momentálne zdržiavajú v $expedition_location_name$, by si to veľmi vážili." # todo: NEW TRANSLATION
 treasure_fleet_events.36.a: "Podeľme sa o to, čo máme." # todo: NEW TRANSLATION
 treasure_fleet_events.36.b: "Nemáme žiadne mapy, o ktoré by sme sa mohli podeliť." # todo: NEW TRANSLATION
 treasure_fleet_events.37.title: "Vydieračské ceny" # todo: NEW TRANSLATION
 treasure_fleet_events.37.desc: "Keďže námorníci z $expedition_name_treasure_voyage$ nepoznajú tunajšie pomery, miestni [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')] zriadili trhy v blízkosti prístavu $expedition_location_name$. Na týchto trhoch predávajú návštevníkom miestny tovar, v čom však tkvie problém: naši chamtivejší obchodníci sa rozhodli využiť zúfalú situáciu námorníkov a vyhnať ceny do závratných výšok. Na niektorých miestach vystúpili ceny tak vysoko, že sa na ulici strhla ozbrojená potýčka, čo vyvolalo nepokoje v oblasti [fleet_loc.GetRank.GetName]." # todo: NEW TRANSLATION
 treasure_fleet_events.37.a: "Potrestajme [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('burghers_estate')]!" # todo: NEW TRANSLATION
 treasure_fleet_events.37.a.entry: "Potrestajme $burghers_estate$!" # todo: NEW TRANSLATION
 treasure_fleet_events.37.b: "Vyvoďme zodpovednosť od námorníkov." # todo: NEW TRANSLATION
 treasure_fleet_events.38.title: "Pocit poníženia" # todo: NEW TRANSLATION
 treasure_fleet_events.38.desc: "Naši [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] sú veľmi rozhorčení pozornosťou, ktorú venujeme $expedition_name_treasure_voyage$. Považujú [ShowCultureGroupName('chinese_group')] za arogantných votrelcov, ktorí si nezaslúžia pohostinnosť ani výsady, aké sme im počas pobytu poskytli. [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')] preto žiadajú, aby sme im niektoré výsady odňali a ukázali im, že nie sú na vlastnej pôde." # todo: NEW TRANSLATION
 treasure_fleet_events.38.a: "Vyhovejme požiadavkám [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')]." # todo: NEW TRANSLATION
 treasure_fleet_events.38.a.entry: "Vyhovejme požiadavkám $nobles_estate$." # todo: NEW TRANSLATION
 treasure_fleet_events.38.b: "Nemôžeme riskovať, že urazíme [ShowCultureGroupNameWithNoTooltip('chinese_group')]." # todo: NEW TRANSLATION
 treasure_fleet_events.39.title: "Náboženské faux pas" # todo: NEW TRANSLATION
 treasure_fleet_events.39.desc: "Námorníci z $expedition_name_chinese_expedition$, nezvyknutí na naše [ROOT.GetCountry.GetReligion.GetAdjective] zvyky, sa dopustili rúhavého činu proti našej viere. To pobúrilo [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')], ktorí požadujú, aby vodca výpravy $expedition_leader_name$ predstúpil a ospravedlnil sa za takúto neúctu." # todo: NEW TRANSLATION
 treasure_fleet_events.39.a: "Požadujme od $expedition_leader_name_tooltipless$ ospravedlnenie." # todo: NEW TRANSLATION
 treasure_fleet_events.39.b: "Prehliadnime toto faux pas." # todo: NEW TRANSLATION
 treasure_fleet_events.40.title: "Žiadosť o vydanie" # todo: NEW TRANSLATION
 treasure_fleet_events.40.desc: "$expedition_name_treasure_voyage$ označila jedného z našich dvoranov, [target_escapee.GetName], za utečenca, ktorý ušiel z [expedition_initiator.GetName]. Elity [ShowCultureGroupName('chinese_group')] z výpravy na čele s $expedition_leader_name$ žiadajú, aby sme im [target_escapee.GetShortNameWithNoTooltip] vydali a poslali späť do [GetInternationalOrganization('middle_kingdom').GetName], kde ho [target_escapee.GetSheHe] môžu postaviť pred súd." # todo: NEW TRANSLATION
 treasure_fleet_events.40.a: "Vyhovejme ich žiadosti." # todo: NEW TRANSLATION
 treasure_fleet_events.40.b: "To je nehoráznosť!" # todo: NEW TRANSLATION
 treasure_fleet_events.41.title: "Spoločné vojenské cvičenia" # todo: NEW TRANSLATION
 treasure_fleet_events.41.desc: "Počas svojho dlhšieho pobytu ponúkol $expedition_leader_name$, vodca $expedition_name_chinese_expedition$, že sa ich vojská zúčastnia na spoločných vojenských cvičeniach s našimi silami. Takéto cvičenia by prospeli obom stranám a svedčili by o hlbokej vzájomnej dôvere. Spoločný výcvik s cudzími vojakmi však môže prinášať isté riziká, preto musíme postupovať obozretne. Najbližšou armádou pri $expedition_location_name$ je [target_unit.GetName], ktorá bude cvičiť spoločne s [ShowCultureGroupNameWithNoTooltip('chinese_group')]." # todo: NEW TRANSLATION
 treasure_fleet_events.41.a: "Prijmime tento návrh." # todo: NEW TRANSLATION
 treasure_fleet_events.41.b: "Vždy môžeme odmietnuť." # todo: NEW TRANSLATION
 treasure_fleet_events.42.title: "Ponuka pomoci od [ShowCultureGroupNameWithNoTooltip('chinese_group')]" # todo: NEW TRANSLATION
 treasure_fleet_events.42.desc: "Keď [ShowCultureGroupNameWithNoTooltip('chinese_group')] $expedition_name_treasure_voyage$ dorazila do $expedition_location_name$, nečakala, že nájde [ROOT.GetCountry.GetLongName] uprostred krvavej vojny. A predsa je to tak. [expedition_initiator.GetLongName] si však našich nepriateľov vo vojne veľmi neváži, a preto by nám boli ochotní pomôcť v našom konflikte." # todo: NEW TRANSLATION
 treasure_fleet_events.42.a: "Prijmeme akúkoľvek pomoc." # todo: NEW TRANSLATION
 treasure_fleet_events.42.b: "Je to náš boj, nie ich." # todo: NEW TRANSLATION
 treasure_fleet_events.43.title: "[ShowCultureGroupNameWithNoTooltip('chinese_group')] pokladoví moreplavci pomáhajú krajine [from.GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 treasure_fleet_events.43.desc: "Naši špehovia nás informujú o početnej $expedition_name_treasure_voyage$ vedenej $expedition_leader_name$, ktorú vyslal [expedition_initiator.GetLongName]. Po príchode do nepriateľského prístavu $expedition_location_name$ sa rozhodli zapojiť do boja a podporiť nášho protivníka, krajinu [from.GetName], v jej vojne proti nám!" # todo: NEW TRANSLATION
 treasure_fleet_events.43.a: "[ShowCultureGroupNameWithNoTooltip('chinese_group')] im nikdy neodpustíme!" # todo: NEW TRANSLATION
 treasure_fleet_events.44.title: "Žiadosť o výstavbu mešity" # todo: NEW TRANSLATION
 treasure_fleet_events.44.desc: "Vodca $expedition_name_chinese_expedition$, istý námorník menom $expedition_leader_name$, je zároveň oddaným vyznávačom [target_religion.GetName]. Keďže mnohí z $expedition_leader_name_herhis$ flotily vyznávajú tú istú vieru, požiadali o povolenie postaviť mešitu na podporu miestnej komunity [target_religion.GetAdjectiveWithNoTooltip]." # todo: NEW TRANSLATION
 treasure_fleet_events.44.a: "Povoľme výstavbu." # todo: NEW TRANSLATION
 treasure_fleet_events.44.b: "Varujme ich pred takýmto zasahovaním." # todo: NEW TRANSLATION
 treasure_fleet_events.45.title: "[ShowCultureGroupNameWithNoTooltip('chinese_group')] diaspóra v oblasti $expedition_location_name_tooltipless$" # todo: NEW TRANSLATION
 treasure_fleet_events.45.desc: "V oblasti $expedition_location_name$ žije početná [ShowCultureGroupName('chinese_group')] diaspóra, ktorá sa tu rozrastala celé desaťročia. Pôvodne sem prišli ako [ShowCultureGroupNameWithNoTooltip('chinese_group')] obchodníci, vzali si za manželky miestne ženy a usadili sa tu. Prispôsobili sa novému prostrediu a zohrávajú v našej spoločnosti kľúčovú úlohu. Po príchode $expedition_name_treasure_voyage$ z [expedition_initiator.GetName] sa $expedition_leader_name$ rozhodol túto diaspóru podporiť." # todo: NEW TRANSLATION
 treasure_fleet_events.45.a: "Podporujme to." # todo: NEW TRANSLATION
 treasure_fleet_events.45.b: "Zastavme ich!" # todo: NEW TRANSLATION
 treasure_fleet_events.46.title: "Vojaci sa usádzajú" # todo: NEW TRANSLATION
 treasure_fleet_events.46.desc: "Niekoľko vojakov z $expedition_name_chinese_expedition$ prepustili zo služby a dovolili im usadiť sa v oblasti $expedition_location_name$. Oženili sa s miestnymi ženami a ich kontakty by sa nám mohli z dlhodobého hľadiska hodiť." # todo: NEW TRANSLATION
 treasure_fleet_events.46.a: "[ROOT.GetCountry.Custom('common_string_ok')]" # todo: NEW TRANSLATION
 treasure_fleet_events.46.a.entry: "$common_string_alright$" # todo: NEW TRANSLATION
 treasure_fleet_events.47.title: "Zásah $expedition_name_treasure_voyage$" # todo: NEW TRANSLATION
 treasure_fleet_events.47.desc: "Keď $expedition_name_chinese_expedition$ dorazila do oblasti $expedition_location_name$, našla našu krajinu [ROOT.GetCountry.GetFlavorRank] uprostred krvavej občianskej vojny. Takéto okolnosti by zvyčajne mnohých návštevníkov odradili, no $expedition_leader_name$ a $expedition_leader_name_herhis$ $expedition_name_treasure_voyage$ sa priklonili k [ROOT.GetCountry.GetAdjective] strane a ponúkajú nám vojenskú podporu v mene [GetInternationalOrganization('middle_kingdom').GetName]." # todo: NEW TRANSLATION
 treasure_fleet_events.47.a: "Prijmeme všetku pomoc, ktorú môžeme dostať." # todo: NEW TRANSLATION
 treasure_fleet_events.47.b: "Ich pomoc nepotrebujeme." # todo: NEW TRANSLATION
 treasure_fleet_events.48.title: "$treasure_fleet_events.47.title$" # todo: NEW TRANSLATION
 treasure_fleet_events.48.desc: "Podlý $expedition_name_chinese_expedition$ sa rozhodol zvoliť si stranu v našej [target_war.GetName]. Napriek múdrosti svojho vodcu, $expedition_leader_name$, si však vybral nesprávne a rozhodol sa podporiť [country_at_war_with.GetName] namiesto toho, aby pomohol krajine [ROOT.GetCountry.GetAltAdjective('D')]. Rozdrvíme ich na bojisku." # todo: NEW TRANSLATION # todo: COUNTRY CASE
 treasure_fleet_events.48.a: "Na toto nezabudneme!" # todo: NEW TRANSLATION
 treasure_fleet_events.49.title: "Pohŕdanie [ShowCultureGroupNameWithNoTooltip('chinese_group')]" # todo: NEW TRANSLATION
 treasure_fleet_events.49.desc: "Vzťahy medzi krajinou [ROOT.GetCountry.GetAltAdjective('I')] a našimi návštevníkmi, výpravou $expedition_name_treasure_voyage$, klesli na bezprecedentnú úroveň. V uplynulých dňoch došlo k mnohým stretom medzi našou posádkou a cudzími námorníkmi, no naši návštevníci s nami napriek tomu formálne udržiavali vzťahy, hoci vlažné. Nedávne udalosti však tieto väzby ešte viac narušili a $expedition_leader_name$ práve odsúdil [ROOT.GetCountry.GetLongNameWithNoTooltip] a jeho hodnoty. Výprava $expedition_name_chinese_expedition$ sa chystá opustiť $expedition_location_name$, skôr než napätie ďalej vzrastie." # todo: NEW TRANSLATION # todo: COUNTRY CASE
 treasure_fleet_events.49.a: "Musíme napraviť naše vzťahy." # todo: NEW TRANSLATION
 treasure_fleet_events.49.b: "Konečne je po nich!" # todo: NEW TRANSLATION
 chinese_interregnum: "[THIS.GetCountry.GetName] bude umiestnená do interregna [ShowCultureGroupName('chinese_group')]." # todo: NEW TRANSLATION
 treasure_fleet_events.50.title: "Bojechtivá žiadosť" # todo: NEW TRANSLATION
 treasure_fleet_events.50.desc: "Vodca výpravy $expedition_name_treasure_voyage$, $expedition_leader_name_herselfhimself$ $expedition_leader_name$, nám predložil vážnu žiadosť a žiada vojenský zásah proti krajine [target_country.GetName]. Podľa našich informácií sa [target_country.GetAdjectiveWithNoTooltip] [target_country.GetFlavorRank] z nejakého dôvodu stal terčom [ShowCultureGroupName('chinese_group')] a vodcovia výpravy nás vyzývajú, aby sme vykonali trest Nebies nad vzdorovitým [target_country.GetGovernment.GetRulerTitle]." # todo: NEW TRANSLATION
 treasure_fleet_events.50.a: "Budeme sa riadiť ich odporúčaním." # todo: NEW TRANSLATION
 treasure_fleet_events.50.b: "Nemôžu očakávať, že to urobíme." # todo: NEW TRANSLATION
 treasure_fleet_events.51.title: "Nedostatočná kvalita tribútu" # todo: NEW TRANSLATION
 treasure_fleet_events.51.desc: "Hoci to verejne nepovedali, vieme, že elity výpravy $expedition_name_treasure_voyage$ nie sú spokojné s kvalitou našich darov. Tušili sme to už počas ich audiencie u [ROOT.GetCountry.GetGovernment.GetRulerTitle], no teraz to potvrdili správy našich špehov, ktorí si vypočuli ich rozhovory." # todo: NEW TRANSLATION
 treasure_fleet_events.51.a: "Odškodnite ich." # todo: NEW TRANSLATION
 treasure_fleet_events.51.b: "Nič nepodnikneme, kým nás s tým sami nekonfrontujú." # todo: NEW TRANSLATION
 treasure_fleet_events.52.title: "Škandál na [ROOT.GetCountry.GetGovernment.GetCourtTitle]" # todo: NEW TRANSLATION
 treasure_fleet_events.52.desc: "Počas audiencie u [ROOT.GetCountry.GetGovernment.GetRulerTitle] vyriekol člen [ROOT.GetCountry.GetGovernment.GetCourtTitle] tie najodpornejšie slová o našich návštevníkoch z [ShowCultureGroupName('chinese_group')], čím ich hlboko urazil. Ak niečo nepodnikneme, výprava $expedition_name_treasure_voyage$ môže tento incident oznámiť [expedition_initiator.GetGovernment.GetRulerTitle]." # todo: NEW TRANSLATION
 treasure_fleet_events.52.a: "Úprimne sa ospravedlňte." # todo: NEW TRANSLATION
 treasure_fleet_events.52.b: "Obdarujte ich darmi na ospravedlnenie." # todo: NEW TRANSLATION
 treasure_fleet_events.52.c: "Kto sme, aby sme trestali vlastných?" # todo: NEW TRANSLATION
 treasure_fleet_events.53.title: "Vrelé prijatie" # todo: NEW TRANSLATION
 treasure_fleet_events.53.desc: "Elity, ktoré vedú výpravu $expedition_name_treasure_voyage$, sú veľmi spokojné s našou pohostinnosťou a rôznymi výsadami, ktoré sme im udelili. Okrem očakávanej výmeny tribútu sme im dovolili opraviť ich lode a pomohli sme im s tým. Možno to nedávajú najavo, no vieme, že sa im u nás dostalo veľmi dobrého zaobchádzania." # todo: NEW TRANSLATION
 treasure_fleet_events.53.a: "Pohostinnosť je kľúčová!" # todo: NEW TRANSLATION
 treasure_fleet_events.53.b: "Nedovoľme im, aby si to zle vysvetlili." # todo: NEW TRANSLATION
 treasure_fleet_events.54.title: "Urážka našich vyslancov" # todo: NEW TRANSLATION
 treasure_fleet_events.54.desc: "[ROOT.GetCountry.GetGovernment.GetCourtTitle] sa dozvedá, že na dvore [insulting_court.GetName] sa s vyslancami výpravy $expedition_name_treasure_voyage$ nezaobchádzalo s úctou, akú si zaslúži [GetInternationalOrganization('middle_kingdom').GetName], ale s otvoreným pohŕdaním — a [insulting_court.GetGovernment.GetRulerTitle] túto urážku nechal bez odozvy.\n\n$expedition_leader_name$ čaká na naše rozhodnutie. Odpovieme na také pohŕdanie, alebo sme príliš vznešení na to, aby sme si ho všímali?" # todo: NEW TRANSLATION
 treasure_fleet_events.54.a: "Také pohŕdanie nemôžeme strpieť." # todo: NEW TRANSLATION
 treasure_fleet_events.54.b: "Sme príliš vznešení na to, aby sme si ho všímali." # todo: NEW TRANSLATION
 treasure_fleet_events.54.a.tt: "Susedné [Concept('nations','národy')|e], ktoré výprava $expedition_name_treasure_voyage$ navštívi neskôr, dostanú možnosť vyhlásiť [Concept('war','vojna')|e] krajine [insulting_court.GetName] s našou podporou" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 treasure_fleet_events.55.title: "Zapletení do zahraničných záležitostí" # todo: NEW TRANSLATION
 treasure_fleet_events.55.desc: "Správy doručené na [ROOT.GetCountry.GetGovernment.GetCourtTitle] prinášajú nečakané novinky. Ďaleko od domova podporil $expedition_leader_name$ vojskom a pokladmi výpravy $expedition_name_treasure_voyage$ vládcu krajiny [country_at_war_with.GetName], ríše, ktorú práve zmieta vojna o nástupníctvo.\n\nNiektorí na [ROOT.GetCountry.GetGovernment.GetCourtTitle] žasnú, kam až siaha moc [GetInternationalOrganization('middle_kingdom').GetName]. Iní šomrú, že spory vzdialených ríš nie sú našou starosťou." # todo: NEW TRANSLATION
 treasure_fleet_events.55.a: "Nech svet vidí, kam až siaha naša moc." # todo: NEW TRANSLATION
 treasure_fleet_events.55.b: "Vzdialené vojny sa nás netýkajú." # todo: NEW TRANSLATION
 treasure_fleet_events.56.title: "Meč vytasený v cudzine" # todo: NEW TRANSLATION
 treasure_fleet_events.56.desc: "Z výpravy $expedition_name_treasure_voyage$ prichádzajú správy, že $expedition_leader_name$ poskytol cisárskych vojakov na podporu vojny hostiteľského dvora. Krajina [target_country.GetName], ktorej vojská čelili našim mužom, teraz považuje [GetInternationalOrganization('middle_kingdom').GetName] za svojho nepriateľa.\n\n[ROOT.GetCountry.GetGovernment.GetCourtTitle] je rozdelený. Pre niektorých je to dôkaz, že moc trónu siaha až na druhý koniec sveta. Pre iných je to zbytočné nepriateľstvo, ktoré sme si vyslúžili vo vojne, ktorá nikdy nebola našou." # todo: NEW TRANSLATION
 treasure_fleet_events.56.a: "Nech sa naučia báť sa nášho dosahu." # todo: NEW TRANSLATION
 treasure_fleet_events.56.b: "Takéto nepriateľstvo nám tak ďaleko od domova príliš neprospieva." # todo: NEW TRANSLATION
 treasure_fleet_events.57.title: "Pohŕdavé odmietnutie" # todo: NEW TRANSLATION
 treasure_fleet_events.57.desc: "Na [ROOT.GetCountry.GetGovernment.GetCourtTitle] dorazili zlé správy. Na dvore [contemptuous_court.GetName] sa s vyslancami výpravy $expedition_name_treasure_voyage$ zaobchádzalo s takým otvoreným pohŕdaním, že $expedition_leader_name$ zdvihol kotvy a opustil ich vody. Zvyčajné zdvorilosti nám hodili späť do tváre.\n\nKronikár flotily zapísal [contemptuous_court.GetNameWithNoTooltip] do zoznamu tých, ktorí ukrivdili [GetInternationalOrganization('middle_kingdom').GetName]. Máme si túto urážku zapamätať, alebo ju odpustiť?" # todo: NEW TRANSLATION
 treasure_fleet_events.57.a: "Na túto urážku nezabudneme." # todo: NEW TRANSLATION
 treasure_fleet_events.57.b: "Sme príliš vznešení na to, aby sme prechovávali takú zášť." # todo: NEW TRANSLATION
 treasure_fleet_events.57.a.tt: "Susedný dvor, ktorý výprava $expedition_name_treasure_voyage$ navštívi neskôr, môžeme vyzvať, aby vyhlásil [Concept('war','vojna')|e] krajine [contemptuous_court.GetName]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 treasure_fleet_events.58.title: "Urážka pomstená" # todo: NEW TRANSLATION
 treasure_fleet_events.58.desc: "Na [ROOT.GetCountry.GetGovernment.GetCourtTitle] dorazila správa o víťazstve. Dvor [avenging_court.GetName], povzbudený prítomnosťou výpravy $expedition_name_treasure_voyage$, pozdvihol zbrane proti krajine [target_country.GetName], tej istej ríši, ktorá kedysi pohŕdala našimi vyslancami.\n\nZdá sa, že na prejavenie nevole Nebies netreba cisársku armádu. Moc [GetInternationalOrganization('middle_kingdom').GetName] siaha aj do vojen vzdialených kráľov." # todo: NEW TRANSLATION
 treasure_fleet_events.58.a: "Nech si všetci, ktorí nami pohŕdajú, dajú pozor." # todo: NEW TRANSLATION
 treasure_fleet_events.59.title: "Súrodenci za morom" # todo: NEW TRANSLATION
 treasure_fleet_events.59.desc: "Na [ROOT.GetCountry.GetGovernment.GetCourtTitle] dorazili správy o prosperujúcej komunite našich krajanov v ďalekom prístave [diaspora_port.GetName]. Obchodníci a námorníci, ktorí sa tam usadili pred generáciami, si vzali miestne ženy a zbohatli. Teraz $expedition_leader_name$ podal týmto vzdialeným príbuzným pomocnú ruku v mene výpravy $expedition_name_treasure_voyage$.\n\nNiektorí na [ROOT.GetCountry.GetGovernment.GetCourtTitle] sa pýšia, že krv [GetInternationalOrganization('middle_kingdom').GetName] koluje v každom prístave južných morí. Iní sa mračia na poddaných, ktorí si chcú vytvoriť domov tak ďaleko od hrobov svojich predkov." # todo: NEW TRANSLATION
 treasure_fleet_events.59.a: "Nech naši krajania v cudzine hrdo šíria naše meno." # todo: NEW TRANSLATION
 treasure_fleet_events.59.b: "Ich miesto je doma, medzi ich predkami." # todo: NEW TRANSLATION
 treasure_fleet_events.60.title: "Prešľap vyslanca" # todo: NEW TRANSLATION
 treasure_fleet_events.60.desc: "Na [ROOT.GetCountry.GetGovernment.GetCourtTitle] dorazila správa o nepríjemnom incidente na dvore [offended_court.GetName]. $expedition_leader_name$, ktorý nepozná obrady cudzej viery, spôsobil vážnu urážku a [offended_court.GetGovernment.GetRulerTitle] teraz žiada, aby sa náš vyslanec napravil.\n\n[ROOT.GetCountry.GetGovernment.GetCourtTitle] je rozdelený. Niektorí tvrdia, že vyslanci [GetInternationalOrganization('middle_kingdom').GetName] nemusia prejavovať úctu cudzím oltárom. Iní sa obávajú, že takáto ľahostajnosť poškvrní naše meno v každom ďalšom prístave." # todo: NEW TRANSLATION
 treasure_fleet_events.60.a: "Naši vyslanci sa nemusia zodpovedať nijakému cudziemu oltáru." # todo: NEW TRANSLATION
 treasure_fleet_events.60.b: "Admirál sa musí napraviť." # todo: NEW TRANSLATION

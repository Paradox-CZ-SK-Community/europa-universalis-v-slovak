l_polish:
 hajj_caravan_events.1.title: "Cesta do [ShowLocationNameWithNoTooltip('mecca')]" # todo: NEW TRANSLATION
 hajj_caravan_events.1.desc: "Karavána je zhromaždená, modlitby odriekané a začína sa dlhá cesta do [ShowAreaName('hedjaz_area')]. Ulice lemujú davy, ktoré nás prišli vyprevadiť — dôkaz, že tento rod stále dodržiava povinnosti viery. [ShowLocationName('mecca')] je vzdialená celé mesiace cesty cez púšte a otvorené vody, ktoré trestajú nepripravených." # todo: NEW TRANSLATION
 hajj_caravan_events.1.a: "Náš [ROOT.GetCountry.GetGovernment.GetRulerTitle] sa vydá na cestu ako vládca aj služobník [ROOT.GetCountry.GetReligion.GetGodName]." # todo: NEW TRANSLATION
 hajj_caravan_events.1.b: "Zásobme karavánu a zverbujme jej sprievod." # todo: NEW TRANSLATION
 hajj_caravan_events.1.c: "Zásobme a zabezpečme karavánu a ponesme pred sebou #italic maḥmal#!." # todo: NEW TRANSLATION
 hajj_caravan_events.1.historical_info: "Abbásovský kalif Hārūn ar-Rašīd podnikol počas svojej vlády (786 – 809) deväť pútnických ciest z Bagdadu, pričom časť cesty prešiel aj pešo, aby preukázal svoju zbožnosť. Jeho oddanosť sa na stáročia stala vzorom, ktorý sa zbožní vládcovia snažili napodobniť." # todo: NEW TRANSLATION
 hajj_caravan_events.display_wealth: "Nesme #italic maḥmal#! otvorene, aby všetci mohli obdivovať bohatstvo nášho [ROOT.GetCountry.GetFlavorRank]." # todo: NEW TRANSLATION
 hajj_caravan_events.guards_up_tt: "Ochranný sprievod karavány sa posilňuje (#G +25#! Ochranný sprievod)" # todo: NEW TRANSLATION
 hajj_caravan_events.guards_down_15_tt: "Ochranný sprievod karavány slabne (#R -15#! Ochranný sprievod)" # todo: NEW TRANSLATION
 hajj_caravan_events.guards_down_20_tt: "Ochranný sprievod karavány slabne (#R -20#! Ochranný sprievod)" # todo: NEW TRANSLATION
 hajj_caravan_events.splendor_up_15_tt: "Nádhera karavány rastie (#G +15#! Nádhera)" # todo: NEW TRANSLATION
 hajj_caravan_events.splendor_up_20_tt: "Nádhera karavány rastie (#G +20#! Nádhera)" # todo: NEW TRANSLATION
 hajj_caravan_events.splendor_up_30_tt: "Nádhera karavány rastie (#G +30#! Nádhera)" # todo: NEW TRANSLATION
 hajj_caravan_events.splendor_down_10_tt: "Nádhera karavány upadá (#R -10#! Nádhera)" # todo: NEW TRANSLATION
 hajj_caravan_events.splendor_down_15_tt: "Nádhera karavány upadá (#R -15#! Nádhera)" # todo: NEW TRANSLATION
 hajj_caravan_events.splendor_down_20_tt: "Nádhera karavány upadá (#R -20#! Nádhera)" # todo: NEW TRANSLATION
 hajj_caravan_events.splendor_down_25_tt: "Nádhera karavány upadá (#R -25#! Nádhera)" # todo: NEW TRANSLATION
 hajj_caravan_events.weakened_tt: "Karavána, nútená pokračovať bez odpočinku, je oslabená pred skúškami, ktoré ju ešte čakajú" # todo: NEW TRANSLATION
 hajj_caravan_events.recovered_tt: "Po odpočinku a napojení karavána striasla únavu" # todo: NEW TRANSLATION
 hajj_caravan_events.mahmal_lost_tt: "Maḥmal sa stratil v búrke" # todo: NEW TRANSLATION
 hajj_caravan_events.mahmal_gained_tt: "Karavána teraz nesie maḥmal, čo umožňuje cestou predvádzať bohatstvo zahraničným hostiteľom, no môžu nám ho vziať nájazdníci alebo zničiť búrky" # todo: NEW TRANSLATION
 hajj_caravan_events.2.title: "Brána [ShowLocationNameWithNoTooltip('mecca')]" # todo: NEW TRANSLATION
 hajj_caravan_events.2.desc: "[ShowLocationName('jeddah')]. Starobylý prístav [jeddah_location.GetRank.GetName|l] vonia [ShowGoodsName('salt')], [ShowGoodsName('incense')] a potom desaťtisícov pútnikov, ktorí sem pred nami dorazili po mori. Obchodníci ponúkajú zásoby za dvojnásobné ceny a učenci sa sporia o správnom poradí obradov. [ShowLocationName('mecca')] je už blízko, menej než tri dni cesty po súši, no karavána je unavená a zásoby sa míňajú. Môžeme pokračovať priamo, alebo tu na deň zastaviť, odpočinúť si a doplniť zásoby." # todo: NEW TRANSLATION
 hajj_caravan_events.2.a: "Odpočinieme si tu a do svätého mesta vstúpime oddýchnutí." # todo: NEW TRANSLATION
 hajj_caravan_events.2.b: "Zašli sme priďaleko na to, aby sme sa teraz zastavili. Pokračujme do [ShowLocationNameWithNoTooltip('mecca')]." # todo: NEW TRANSLATION
 hajj_caravan_events.2.c: "$hajj_caravan_events.display_wealth$" # todo: NEW TRANSLATION
 hajj_caravan_events.2.historical_info: "Kalif 'Uṯmān ibn 'Affān, tretí z rāšidúnskych kalifov, v roku 646 určil Džiddu za oficiálny prístav pre pútnikov prichádzajúcich po mori. Túto úlohu plní pri púťach Ḥajj dodnes." # todo: NEW TRANSLATION
 hajj_caravan_events.3.title: "Ka'ba" # todo: NEW TRANSLATION
 hajj_caravan_events.3.desc: "Pred nami sa otvára Veľká mešita a v jej srdci stojí Ka'ba, zahalená do čierneho rúcha a starodávna, staršia než ľudská pamäť. Okolo nej sa v pokojných kruhoch pohybujú tisíce veriacich v bielych rúchach, pochádzajúcich zo všetkých krajín, kde znie výzva k modlitbe. Tu sa sultán oblieka rovnako ako pastier. Cesta sa skončila. Teraz záleží na tom, akými pútnikmi budeme. To, čo tu ponúkneme, bude ešte celé pokolenie rezonovať na trhoch, v mešitách a na dvoroch moslimského sveta." # todo: NEW TRANSLATION
 hajj_caravan_events.3.a: "Rozdajme zlato štedro. Nech tu žiadny pútnik nehladuje." # todo: NEW TRANSLATION
 hajj_caravan_events.3.b: "Venujme dary mešitám a učencom, ktorí sa starajú o sväté mesto." # todo: NEW TRANSLATION
 hajj_caravan_events.3.c: "Obrady vykonajme potichu. Je to medzi nami a [ROOT.GetCountry.GetReligion.GetGodName]." # todo: NEW TRANSLATION
 hajj_caravan_events.3.d: "Náš [ShowBureaucracyTypeNameWithNoTooltip('diwan_al_hajj_bureaucracy')] už všetko zabezpečil." # todo: NEW TRANSLATION
 hajj_caravan_events.3.e: "Nešetrieme na výdavkoch. Ozdobme karavánu zlatom a hodvábom." # todo: NEW TRANSLATION
 hajj_caravan_events.3.historical_info: "Najslávnejšiu kráľovskú púť Ḥajj v dejinách podnikol v roku 1324 Mansa Mūsā I. z Mali. Cestoval so sprievodom šesťdesiattisíc ľudí a niesol so sebou toľko zlata, že ho mohol na každej zastávke rozdávať. Jeho púť spôsobila desaťročný prepad cien zlata v celej severnej Afrike a na Blízkom východe. Jeho návštevu na dvore egyptského sultána podrobne zaznamenali arabskí kronikári, ktorí opísali jeho mimoriadnu štedrosť aj hospodársky rozvrat, ktorý spôsobila." # todo: NEW TRANSLATION
 hajj_caravan_events.4.title: "Mesto tisícich minaretov" # todo: NEW TRANSLATION
 hajj_caravan_events.4.desc: "[ShowLocationName('cairo')] je rozľahlá a starobylá a len čo prejdeme severnou bránou, pohltí našu karavánu — hlukom, korením, činenou kožou a pečeným mäsom. Nad strechami sa týči veľká mešita al-Azhar, ktorej učenci patria k najlepším v [ROOT.GetCountry.GetReligion.GetGroup.GetAdjective] svete. Náš vládca by sa u nich mohol zdržať a študovať, alebo len doplniť zásoby a pokračovať smerom k [ShowLocationName('mecca')]." # todo: NEW TRANSLATION
 hajj_caravan_events.4.a: "Využime príležitosť a posaďme sa medzi učencov al-Azharu." # todo: NEW TRANSLATION
 hajj_caravan_events.4.b: "Prišli sme kvôli [ShowLocationNameWithNoTooltip('mecca')], nie kvôli [ShowLocationNameWithNoTooltip('cairo')]. Doplňme zásoby a vyrazme." # todo: NEW TRANSLATION
 hajj_caravan_events.4.c: "$hajj_caravan_events.display_wealth$" # todo: NEW TRANSLATION
 hajj_caravan_events.4.historical_info: "Historik a učenec Ibn Ḵaldūn sa v roku 1382 usadil v Káhire, kde vyučoval na al-Azhare a pôsobil ako hlavný mālikovský sudca mesta. Jeho povesť lákala vládcov a učencov z celého moslimského sveta, ktorí si chceli vypočuť jeho prednášky alebo požiadať ho o radu." # todo: NEW TRANSLATION
 hajj_caravan_events.5.title: "Staré hlavné mesto" # todo: NEW TRANSLATION
 hajj_caravan_events.5.desc: "[ShowLocationName('baghdad')] bol kedysi najväčším mestom sveta a hlavným mestom kalifátu, ktorý sa rozprestieral od [ShowContinentName('atlantic_ocean_continent')] až po [ShowSubContinentName('central_asia')], kým ho Mongoli nevypálili do tla. Dnes je tu pokojnejšie — menšie trhy, menej horliví učenci — no svätyne jeho svätých zosnulých stále priťahujú pútnikov z celého východu. Náš vládca by im tu mohol vzdať úctu, než sa vydá na juh do [ShowAreaName('hedjaz_area')]." # todo: NEW TRANSLATION
 hajj_caravan_events.5.a: "Navštívme svätyne a vyhľadajme tamojších učencov." # todo: NEW TRANSLATION
 hajj_caravan_events.5.b: "Vzdajme úctu a potom pokračujme v ceste." # todo: NEW TRANSLATION
 hajj_caravan_events.5.c: "$hajj_caravan_events.display_wealth$" # todo: NEW TRANSLATION
 hajj_caravan_events.5.historical_info: "Zubayda bint Ja'far, manželka abbásovského kalifa Hārūna ar-Rašída, po tom, čo sama zakúsila útrapy tejto cesty, financovala výstavbu pútnickej cesty Darb Zubayda. Tá viedla z okolia Bagdadu až do Mekky a lemovali ju studne, cisterny a odpočívadlá." # todo: NEW TRANSLATION
 hajj_caravan_events.6.title: "Zastávka v Damasku" # todo: NEW TRANSLATION
 hajj_caravan_events.6.desc: "Za sadmi sa pred nami objavujú hradby [ShowLocationName('damascus')], jedného z najstarších dosiaľ obývaných miest. Jeho Veľká mešita je známa v celom moslimskom svete. Modlitba pod jej kupolou a rozhovory s právnikmi, ktorí zapĺňajú jej nádvoria, by nás stáli dni, ktoré si možno nemôžeme dovoliť. Karavána by sa mohla len napiť, doplniť zásoby a odísť hneď ráno." # todo: NEW TRANSLATION
 hajj_caravan_events.6.a: "Zostaňme chvíľu medzi mešitami a právnikmi." # todo: NEW TRANSLATION
 hajj_caravan_events.6.b: "Napojme zvieratá a za úsvitu odíďme." # todo: NEW TRANSLATION
 hajj_caravan_events.6.c: "$hajj_caravan_events.display_wealth$" # todo: NEW TRANSLATION
 hajj_caravan_events.6.historical_info: "V 50. rokoch 16. storočia dal osmanský sultán Sulejman Nádherný v Damasku postaviť komplex Takiyya as-Sulaymāniyya — mešitu, ubytovňu a vývarovňu určenú na ubytovanie a zásobovanie tisícov pútnikov, ktorí sa tam každoročne zhromažďovali pred odchodom karavány Ḥajj do Mekky." # todo: NEW TRANSLATION
 hajj_caravan_events.7.title: "Ḥājjī" # todo: NEW TRANSLATION
 hajj_caravan_events.7.desc: "Karavána sa vracia domov, jej zásoby sa stenčili a jej pútnici sa zmenili. Správa už predbehla ťavy a davy sa zhromažďujú, aby privítali vládcu, ktorý stanul pred Ka'bou a vrátil sa, aby o tom mohol rozprávať. Od tohto dňa náš vládca nesie titul Ḥājjī — zaslúžil si ho, nik mu ho neudelil, a zostane mu navždy." # todo: NEW TRANSLATION
 hajj_caravan_events.7.a: "Nech sa o tom vie: z [ShowLocationNameWithNoTooltip('mecca')] a späť, z milosti [ROOT.GetCountry.GetReligion.GetGodName]." # todo: NEW TRANSLATION
 hajj_caravan_events.7.historical_info: "Askia Muḥammad Ture zo Songhajského cisárstva podnikol púť Ḥajj v rokoch 1496 – 1497 so sprievodom stoviek ľudí a bohatstvom v zlate, ktoré cestou rozdával ako almužnu. V Káhire mu abbásovský uchádzač o kalifát udelil titul kalifa Sudánu a domov sa vrátil ako al-Ḥājj, pričom jeho autoritu nad západoafrickým islamom potvrdila samotná púť." # todo: NEW TRANSLATION
 hajj_caravan_events.8.title: "Smrť na ceste do [ShowLocationNameWithNoTooltip('mecca')]" # todo: NEW TRANSLATION
 hajj_caravan_events.8.desc: "Karavánu zastihne správa, že náš vládca zomrel cestou, ďaleko od domova a ešte ďalej od Ka'by. Bez vládcu na čele nemôže karavána pokračovať ako predtým. Rozpadá sa: časť pútnikov sa obracia späť, zatiaľ čo ostatní pokračujú sami, aby dokončili obrady, kvôli ktorým sa vydali na cestu." # todo: NEW TRANSLATION
 hajj_caravan_events.8.a: "Nech sa [ROOT.GetCountry.GetReligion.GetGodName] zmiluje nad jeho dušou." # todo: NEW TRANSLATION
 hajj_caravan_events.hire_escorts: "Najmime na ďalšiu cestu viac stráží." # todo: NEW TRANSLATION
 hajj_caravan_events.adorn: "Ozdobme karavánu zástavami a hodvábom a počkajme." # todo: NEW TRANSLATION
 hajj_caravan_events.2.d: "$hajj_caravan_events.adorn$" # todo: NEW TRANSLATION
 hajj_caravan_events.4.e: "$hajj_caravan_events.adorn$" # todo: NEW TRANSLATION
 hajj_caravan_events.5.e: "$hajj_caravan_events.adorn$" # todo: NEW TRANSLATION
 hajj_caravan_events.6.e: "$hajj_caravan_events.adorn$" # todo: NEW TRANSLATION
 hajj_caravan_events.4.d: "$hajj_caravan_events.hire_escorts$" # todo: NEW TRANSLATION
 hajj_caravan_events.5.d: "$hajj_caravan_events.hire_escorts$" # todo: NEW TRANSLATION
 hajj_caravan_events.6.d: "$hajj_caravan_events.hire_escorts$" # todo: NEW TRANSLATION
 hajj_caravan_events.9.title: "Nájazdníci na ceste" # todo: NEW TRANSLATION
 hajj_caravan_events.9.desc: "Z chvejúceho sa horúceho vzduchu sa vynoria jazdci z púšte s kopijami vztýčenými a obkľúčia kolónu. Sledovali nás, ako prechádzame ich pieskami, a usúdili, že karavána stojí za ulúpenie. Naše stráže sa zomknú, no boj na otvorenej púšti nikdy nemá istý výsledok." # todo: NEW TRANSLATION
 hajj_caravan_events.9.a: "Zaplaťme výpalné. Striebro je lacnejšie než krv." # todo: NEW TRANSLATION
 hajj_caravan_events.9.b: "Nech si stráže zaslúžia svoju mzdu." # todo: NEW TRANSLATION
 hajj_caravan_events.9.b.chance_tt: "Naše stráže nemusia nájazdníkov odraziť a namiesto [Concept('prestige','prestíže')|e] prídeme o stráže a nádheru" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 hajj_caravan_events.9.c: "Toto sú pútnici putujúci do [ShowLocationNameWithNoTooltip('mecca')] pod ochranou [ROOT.GetCountry.GetReligion.GetGodName]." # todo: NEW TRANSLATION
 hajj_caravan_events.9.c.chance_tt: "Táto výzva nemusí nájazdníkov odradiť a namiesto [Concept('prestige','prestíže')|e] a [Concept('legitimacy','legitimita')|e] prídeme o stráže a nádheru" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 hajj_caravan_events.10.title: "Vyschnuté studne" # todo: NEW TRANSLATION
 hajj_caravan_events.10.desc: "Studne pred nami sú prázdne — na dne popraskané blato, voda do poslednej kvapky vyčerpaná karavánou, ktorá tadiaľ prešla pred niekoľkými dňami. Mechy na ťavách už takmer nič nevážia, zvieratá od smädu kvília a slnko stúpa vyššie bez štipky milosrdenstva. Sprievodcovia si mrmlú o tom, ako ďaleko je najbližší prameň." # todo: NEW TRANSLATION
 hajj_caravan_events.10.a: "Radšej pomaly než mŕtvi. Zamierme k vzdialenejšej studni." # todo: NEW TRANSLATION
 hajj_caravan_events.10.b: "Vystačíme si s ďalšou vodou. Pokračujme." # todo: NEW TRANSLATION
 hajj_caravan_events.11.title: "Simoom" # todo: NEW TRANSLATION
 hajj_caravan_events.11.desc: "Obzor nadobudne hrdzavú farbu a vietor sa rozkvíli. Na kolónu sa valí stena piesku a o chvíľu niet cesty, oblohy ani jazdca pred nami — iba štipľavá tma." # todo: NEW TRANSLATION
 hajj_caravan_events.11.a: "Zložte batožinu, zakryte si tváre. Počkáme, kým to prejde." # todo: NEW TRANSLATION
 hajj_caravan_events.11.b: "Spojme kolónu lanami a pretlačme sa cez búrku." # todo: NEW TRANSLATION
 hajj_caravan_events.12.title: "Horúčka v karaváne" # todo: NEW TRANSLATION
 hajj_caravan_events.12.desc: "Začne sa to niekoľkými prípadmi, no do rána je choroba v každom stane: horúčka, ktorá v priebehu niekoľkých dní zlomí aj tých najsilnejších. Na ceste, kde sú pútnici natlačení jeden na druhého, sa jej nedá vyhnúť." # todo: NEW TRANSLATION
 hajj_caravan_events.12.a: "Zastavíme. Žiadny pútnik nezomrie opustený." # todo: NEW TRANSLATION
 hajj_caravan_events.12.b: "Obdobie púte nebude čakať na chorých." # todo: NEW TRANSLATION
 hajj_caravan_events.13.title: "Cena [toll_owner.GetGovernment.GetRulerTitle]" # todo: NEW TRANSLATION
 hajj_caravan_events.13.desc: "Cesta pred nami vedie cez územie miestneho pána a jeho jazdci ju zatarasili. Sedia na koňoch s kopijami opretými o zem a nikam sa neponáhľajú. Jeho posol k nám prichádza s úsmevom: treba zaplatiť za vodu, za prechod aj za samotný piesok pod nohami. Karavána sa nepohne, kým nezaplatíme. Pútnici za nami čakajú v horúčave a sledujú, čoho je ich vládca schopný." # todo: NEW TRANSLATION
 hajj_caravan_events.13.a: "Zaplaťme mu a majme to z krku." # todo: NEW TRANSLATION
 hajj_caravan_events.13.b: "Nič mu nedlhujeme. Obíďme jeho studne." # todo: NEW TRANSLATION
 hajj_caravan_events.13.c: "Nech [toll_owner.GetGovernment.GetRulerTitle] uvidí našu karavánu a prehodnotí mýto." # todo: NEW TRANSLATION
 hajj_caravan_events.14.title: "Zelená oáza" # todo: NEW TRANSLATION
 hajj_caravan_events.14.desc: "Pred nami sa z piesku dvíhajú palmy, pod nimi vyviera prameň a okolo neho žijú ľudia, ktorí vychádzajú privítať pútnikov s datľami a chladnou vodou. Poskytnúť útočisko tým, ktorí putujú do svätého mesta, je samo osebe skutkom zbožnosti — a ponúkajú ho zadarmo." # todo: NEW TRANSLATION
 hajj_caravan_events.14.a: "Doprajme si odpočinok a pred pokračovaním karavánu poriadne napojme." # todo: NEW TRANSLATION
 hajj_caravan_events.14.b: "Podeľme sa o zásoby s chudobnými v oáze." # todo: NEW TRANSLATION
 hajj_caravan_events.14.c: "Poďakujme im a pokračujme v ceste." # todo: NEW TRANSLATION
 hajj_caravan_events.15.title: "Učenci na ceste" # todo: NEW TRANSLATION
 hajj_caravan_events.15.desc: "Ku karaváne sa pridá skupina putujúcich učencov, ktorí tiež mieria do svätého mesta a ich sedlové brašne sú plné kníh. Pri večerných ohňoch dlho do noci rozprávajú o práve a svätých písmach." # todo: NEW TRANSLATION
 hajj_caravan_events.15.a: "Posaď sa medzi nich a počúvaj." # todo: NEW TRANSLATION
 hajj_caravan_events.15.b: "Odpovedaj na každý ich argument." # todo: NEW TRANSLATION
 hajj_caravan_events.16.title: "Sezóna sa skončila" # todo: NEW TRANSLATION
 hajj_caravan_events.16.desc: "Prichádzame príliš neskoro. Rok sa obrátil a s ním nám unikla aj chvíľa státia na 'Arafáte — hodiny medzi poludním a západom slnka, keď mali všetci pútnici tejto sezóny stáť spolu na tejto pláni pod Vrchom milosrdenstva, modliť sa a prosiť o odpustenie. Podľa výroku Proroka nie je hadždž ničím viac ani menej než týmto jediným popoludním; ak ho zmeškáš, nijaký obrad vykonaný potom už púť nedokončí. Karaváne neostáva nič iné, než sa rozísť a vrátiť domov. Budúci rok sa cesta bude musieť začať odznova." # todo: NEW TRANSLATION
 hajj_caravan_events.16.a: "Príliš dlho sme otáľali. Treba to podniknúť znova." # todo: NEW TRANSLATION
 hajj_caravan_events.17.title: "Búrka" # todo: NEW TRANSLATION
 hajj_caravan_events.17.desc: "Obloha černie a more sa dvíha do sivých vodných kopcov. Loď sa zmieta, lanovovie kvíli a jediná zle zasiahnutá vlna by mohla preraziť trup alebo stiahnuť plavidlo ku dnu aj so všetkými dušami na palube." # todo: NEW TRANSLATION
 hajj_caravan_events.17.a: "Držte sa. Stavitelia túto loď dobre postavili." # todo: NEW TRANSLATION
 hajj_caravan_events.17.b: "Nechajme vietor, nech nás ženie, a plávajme s ním." # todo: NEW TRANSLATION
 hajj_caravan_events.18.title: "Bezvetrie" # todo: NEW TRANSLATION
 hajj_caravan_events.18.desc: "Vietor úplne utíchne. Plachty bezvládne visia, more je hladké ako tepaný kov a loď nehybne stojí pod nemilosrdným slnkom. Vody ubúda a s každým bezveterným dňom sa míňa aj trpezlivosť." # todo: NEW TRANSLATION
 hajj_caravan_events.18.a: "Počkajme. Vietor sa vždy vráti." # todo: NEW TRANSLATION
 hajj_caravan_events.18.b: "Na vodu s člnmi. Nebudeme tu sedieť a hniť." # todo: NEW TRANSLATION
 hajj_caravan_events.19.title: "Horúčka pod palubou" # todo: NEW TRANSLATION
 hajj_caravan_events.19.desc: "Tesným, zatuchnutým vzduchom pod palubou sa šíri choroba a za niekoľko dní je chorých viac než zdravých. Na lodi treba stále pracovať a každým úsvitom je na to menej rúk." # todo: NEW TRANSLATION
 hajj_caravan_events.19.a: "Zamierte k pobrežiu. Posádka potrebuje čistú vodu." # todo: NEW TRANSLATION
 hajj_caravan_events.19.b: "Držme sa kurzu a dôverujme posádke, že to zvládne." # todo: NEW TRANSLATION
 hajj_caravan_events.20.title: "Korzári" # todo: NEW TRANSLATION
 hajj_caravan_events.20.desc: "K flotile sa rúti nízka, rýchla galéra a v jej závese ďalšie dve, veslá sa im blýskajú na slnku. Bez vlajok, bez výzvy — iba záblesky čepelí pozdĺž ich bokov a dunenie bubna, ktoré sa nesie ponad vodu. Korzári — a pútnikov si vyhliadli ako korisť. Pozorovatelia vyhlasujú poplach, zatiaľ čo veriaci pod palubou zvierajú svoje uzlíky a modlitby." # todo: NEW TRANSLATION
 hajj_caravan_events.20.a: "Zaplaťme za voľný priechod a nech odídu." # todo: NEW TRANSLATION
 hajj_caravan_events.20.b: "Vyprázdnite paluby. Prebijeme sa cez nich." # todo: NEW TRANSLATION
 hajj_caravan_events.20.b.chance_tt: "Naši strážcovia možno nedokážu odraziť korzárov, čo nás bude stáť strážcov a lesk namiesto [Concept('prestige','prestíže')|e]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 hajj_caravan_events.21.title: "Útes" # todo: NEW TRANSLATION
 hajj_caravan_events.21.desc: "Trupom sa roztrasie drásavý náraz a paluba sa pod nohami nakloní — nevyznačený útes, ktorého koralové zuby drú drevo pod čiarou ponoru. Do nákladného priestoru už klokotom vteká morská voda a posádka sa vrhá k čerpadlám. Trup je prerazený a loď sa potápa, no ešte nie je stratená; najbližšia pevnina je iba nízkou zelenou škvrnou na obzore." # todo: NEW TRANSLATION
 hajj_caravan_events.21.a: "Vytiahnime flotilu na breh a poriadne ju opravme." # todo: NEW TRANSLATION
 hajj_caravan_events.21.b: "Nechajme na jej záchranu časť posádky. Ostatní poplávajú ďalej." # todo: NEW TRANSLATION
 hajj_caravan_events.22.title: "Obchodná loď na mori" # todo: NEW TRANSLATION
 hajj_caravan_events.22.desc: "Z obchodnej lode na nás volajú ponad vodu. Jej paluby sú naložené balíkmi hodvábu a jemných látok zo vzdialených prístavov. Kapitán bude obchodovať za obchodnícku cenu, no až po zdĺhavom a neunáhlenom vyjednávaní." # todo: NEW TRANSLATION
 hajj_caravan_events.22.a: "Kúpme najjemnejšie látky na palube." # todo: NEW TRANSLATION
 hajj_caravan_events.22.b: "Nemáme čas na zjednávanie. Dajte im znamenie, nech pokračujú." # todo: NEW TRANSLATION

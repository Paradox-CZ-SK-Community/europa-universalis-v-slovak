l_polish:
 d009_convivencia.1.title: "Tri komunity" # todo: NEW TRANSLATION
 d009_convivencia.1.entry: "$d009_convivencia.1.title$" # todo: NEW TRANSLATION
 d009_convivencia.1.desc: "V našich mestách odbíjajú kostolné zvony, znie volanie muezzína a zapaľujú sa sabatové sviece v rovnakých hodinách na tých istých uliciach, a tak je to už celé generácie. Mudéjarski remeselníci, [ShowReligionAdjective('judaism')] úžerníci a lekári a [ShowReligionGroupAdjective('christian')] mešťania zdieľajú trhy, dielne i nádvoria a často sa púšťajú do prudkých sporov. Všetko drží pohromade len krehká #italic convivencia#!, ktorá tu bola ešte pred našimi starými otcami a prežila vojny, mor i meniace sa nálady kráľov pred nami. Radcovia na nás každý deň naliehajú, aby sme pritvrdili; aljamy rovnako dôrazne žiadajú opak. Ako prísne má koruna dohliadať na podmienky, za ktorých môžu tieto tri komunity žiť vedľa seba?" # todo: NEW TRANSLATION
 d009_convivencia.1.a: "Nech sa aljamy spravujú samy." # todo: NEW TRANSLATION
 d009_convivencia.1.a.tt: "[ShowReligionGroupAdjective('muslim')] a [ShowReligionAdjectiveWithNoTooltip('judaism')] komunity v [target_location.GetName] sa pod našou vládou cítia bezpečnejšie" # todo: NEW TRANSLATION
 d009_convivencia.1.b: "Uprednostnime našich [ShowReligionGroupAdjectiveWithNoTooltip('christian')] poddaných." # todo: NEW TRANSLATION
 d009_convivencia.1.b.tt: "[ShowReligionGroupAdjective('muslim')] a [ShowReligionAdjectiveWithNoTooltip('judaism')] komunity v [target_location.GetName] sa pod našou vládou cítia neisto" # todo: NEW TRANSLATION
 d009_convivencia.1.historical_info: "#italic Convivencia#!, teda spolužitie, je výraz, ktorým historici označujú stáročia, keď kresťania, moslimovia a Židia žili vedľa seba na stredovekom Pyrenejskom polostrove a tešili sa rôznej miere tolerancie, najmä v mestách ako Toledo, Sevilla a Zaragoza. Nikdy nešlo o úplnú rovnosť: nekresťania platili osobitné dane a čelili skutočným obmedzeniam. Napriek tomu sa vďaka tomu rozvinula kultúrna a intelektuálna výmena, ktorá okrem iného priniesla slávne toledské prekladateľské školy." # todo: NEW TRANSLATION
 d009_convivencia.2.title: "Synagóga Tránsito" # todo: NEW TRANSLATION
 d009_convivencia.2.entry: "$d009_convivencia.2.title$" # todo: NEW TRANSLATION
 d009_convivencia.2.desc: "[target_character.GetName], náš pokladník a najbližší dôverník spomedzi aljamy, chce postaviť novú synagógu v [ShowReligionAdjective('judaism')] štvrti v srdci [ShowLocationName('toledo')]. Jej steny majú zdobiť Dávidove žalmy vedľa heraldických znakov [ROOT.GetCountry.GetAltAdjectiveWithNoTooltip('G')] a stropy majú byť pozlátené v štýle, ktorý podľa [target_character.GetSheHe] predčí všetko, čo katedrálna kapitula za poslednú generáciu objednala. Bola by jedným z najkrajších svätostánkov, aké kedy [ShowReligionAdjectiveWithNoTooltip('judaism')] ruky na našej pôde postavili, a pomníkom [target_character.GetHerHis] vzostupu aj [target_character.GetHerHis] viery. Pre tých, čo vedia čítať medzi riadkami, by bola zároveň veľmi verejným dôkazom, ako ďaleko [target_character.GetHerHis] rady [target_character.GetHimHer] doviedli až k nášmu [ROOT.GetCountry.GetGovernment.GetCourtTitle]." # todo: NEW TRANSLATION # todo: COUNTRY CASE
 d009_convivencia.2.a: "Dovoľme [target_character.GetHimHer] stavať a privítajme [target_character.GetHimHer] na našom [ROOT.GetCountry.GetGovernment.GetCourtTitle]." # todo: NEW TRANSLATION
 d009_convivencia.2.a.entry: "Dovoľme Samuelovi ha-Levimu Abulafiovi stavať a privítajme ho na našom dvore." # todo: NEW TRANSLATION
 d009_convivencia.2.b: "Odmietnime; taká nádhera vzbudí závisť a podozrenie." # todo: NEW TRANSLATION
 d009_convivencia.2.b.tt: "[ShowReligionAdjectiveWithNoTooltip('judaism')] komunita v [ShowLocationNameWithNoTooltip('toledo')] cíti chladný postoj koruny" # todo: NEW TRANSLATION
 d009_convivencia.2.historical_info: "Synagógu El Tránsito v Tolede postavili okolo roku 1356 pre pokladníka kastílskeho kráľa Pedra I. Samuela ha-Leviho Abulafiu. Dodnes je jedným z najkrajších zachovaných príkladov mudéjarskej synagogálnej architektúry; na jej stenách sú vytesané hebrejské žalmy vedľa kráľovských znakov Kastílie. Ha-Leviho pozoruhodný vzostup na dvore sa skončil nešťastne: neskôr ho zatkli a na kráľov rozkaz umučili na smrť, obvineného zo sprenevery. Je to pripomienka, aké neisté mohlo byť postavenie aj tých najdôveryhodnejších židovských dvoranov." # todo: NEW TRANSLATION
 d009_convivencia_2_judaism_population_tt: "Toledo má židovské obyvateľstvo" # todo: NEW TRANSLATION
 d009_convivencia.3.title: "Hasdai Crescas a otázka viery" # todo: NEW TRANSLATION
 d009_convivencia.3.entry: "$d009_convivencia.3.title$" # todo: NEW TRANSLATION
 d009_convivencia.3.desc: "[target_character.GetName], rabín a [ShowArtistTypeName('philosopher')] značnej povesti medzi [target_character.GetHerHis] vlastným ľudom a nemalej známosti medzi našimi, žiada o audienciu na našom [ROOT.GetCountry.GetGovernment.GetCourtTitle]. [target_character.GetSheHe|U] chce pred nami obhájiť, že rozum a zjavenie si nemusia protirečiť, že filozofi, ktorých si naši učenci tak cenia, nikdy neboli k [ShowReligionGroupAdjective('christian')] učeniu takí naklonení, ako predstierajú, a že dišputy, do ktorých [target_character.GetHerHis] ľud pravidelne nútia, stoja na prevzatej aristotelovskej logike, ktorá sa na otázky viery ani nehodí. Nech si o tejto záležitosti myslí čokoľvek náš [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] — a má toho veľa čo povedať — vzdelanosť [target_character.GetShortNameWithNoTooltip] je nepochybná a vraj je nepríjemne ťažké [target_character.GetHerHis] argumenty vyvrátiť." # todo: NEW TRANSLATION
 d009_convivencia.3.a: "Prijmime [target_character.GetHimHer] a vypočujme si [target_character.GetHerHis] argumenty." # todo: NEW TRANSLATION
 d009_convivencia.3.a.entry: "Prijmime Hasdaia Crescasa a vypočujme si jeho argumenty." # todo: NEW TRANSLATION
 d009_convivencia.3.a.tt: "[ShowReligionAdjective('judaism')] komunity v ríši povzbudí toto gesto" # todo: NEW TRANSLATION
 d009_convivencia.3.b: "Odmietnime [target_character.GetHimHer]." # todo: NEW TRANSLATION
 d009_convivencia.3.b.entry: "Odmietnime Hasdaia Crescasa." # todo: NEW TRANSLATION
 d009_convivencia.3.historical_info: "Hasdai Crescas bol významný rabín a filozof aragónskeho židovstva, pôsobiaci najmä v Barcelone a Zaragoze. Jeho hlavné dielo, #italic Or Adonai#! (Svetlo Pánovo), dôsledne kritizovalo nadvládu aristotelovskej filozofie nad židovskou teológiou. Tvrdil, že vieru a božiu vôľu nemožno úplne podriadiť aristotelovskej logike. Zažil ničivé pogromy roku 1391, pri ktorých zahynul aj jeho vlastný syn, a mnohé z jeho neskorších spisov priamo reagujú na túto katastrofu." # todo: NEW TRANSLATION
 d009_convivencia_3_judaism_population_tt: "V ríši žije židovské obyvateľstvo" # todo: NEW TRANSLATION
 d009_convivencia.4.title: "Mudéjarski remeselníci" # todo: NEW TRANSLATION
 d009_convivencia.4.entry: "$d009_convivencia.4.title$" # todo: NEW TRANSLATION
 d009_convivencia.4.desc: "Odkedy si naši mudéjarski poddaní zabezpečili právo spravovať vlastnú aljamu — samosprávnu komunitu s vlastnými trhmi, súdmi a remeslami, chránenú listinou a výsadami — ich stavitelia, obkladači a štukatéri odvážnejšie ukazujú, čo dokážu ich ruky. Spájajú podkovovité oblúky a vyrezávané štuky s tvarmi, ktoré obľubujú naši kamenári. Ak im zveríme výstavbu krídla paláca alebo záhradného pavilónu, kameň a štuka dosvedčia, že listina, ktorú sme im udelili, nebola prázdnym gestom. Nie každý biskup či barón sa na to bude pozerať rovnako a náš [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] si len zriedka nechá ujsť príležitosť hundrať." # todo: NEW TRANSLATION
 d009_convivencia.4.a: "Objednajme si krídlo paláca v mudéjarskom štýle." # todo: NEW TRANSLATION
 d009_convivencia.4.b: "Zadávajme zákazky len [ShowReligionGroupAdjectiveWithNoTooltip('christian')] remeselníkom." # todo: NEW TRANSLATION
 d009_convivencia.4.historical_info: "Mudéjarské umenie a architektúra — štýl vytváraný moslimskými remeselníkmi pod kresťanskou nadvládou, ktorý spájal podkovovité oblúky, geometrické kachličky a vyrezávané štuky s gotickými a románskymi formami — prekvital v Kastílii a Aragónsku práve preto, že si ho kresťanskí panovníci aktívne objednávali. Alcázar v Seville, ktorý v 60. rokoch 14. storočia nechal postaviť kráľ Pedro I. prevažne mudéjarskými remeselníkmi z Granady a Toleda, je dodnes najslávnejším príkladom takejto kráľovskej podpory." # todo: NEW TRANSLATION
 d009_convivencia.5.title: "[ShowReligionAdjectiveWithNoTooltip('judaism')] finančníci a koruna" # todo: NEW TRANSLATION
 d009_convivencia.5.entry: "$d009_convivencia.5.title$" # todo: NEW TRANSLATION
 d009_convivencia.5.desc: "Pokladnica [ROOT.GetCountry.GetName] býva prázdnejšia, než by sme si chceli priznať. Vojny, stavebné projekty a údržba poriadneho [ROOT.GetCountry.GetGovernment.GetCourtTitle] si žiadajú viac, než dokážu včas pokryť bežné daňové príjmy.\n\nPeňažníci a vyberači daní z aljamy nám ochotne poskytnú úver, ktorý naši [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] pre cirkevné právo a obyčajnú pýchu poskytujú len zriedka. Nech už kazateľnica hovorí čokoľvek, ich podmienky bývajú v [ROOT.GetCountry.GetAltAdjectiveWithNoTooltip('L')] zvyčajne najvýhodnejšie.\n\nNáš [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] neustále hundre na úžeru a neprimeraný vplyv na našom [ROOT.GetCountry.GetGovernment.GetCourtTitle], a nie celkom bezdôvodne. Lenže mince z aljamy majú rovnakú hodnotu ako mince z hociktorej [ShowReligionGroupAdjective('christian')] mešca." # todo: NEW TRANSLATION # todo: COUNTRY CASE
 d009_convivencia.5.a: "Získajme od [ShowReligionAdjectiveWithNoTooltip('judaism')] finančníkov peniaze do pokladnice." # todo: NEW TRANSLATION
 d009_convivencia.5.b: "Obmedzme ich požičiavanie peňazí a uspokojme [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('clergy_estate')]." # todo: NEW TRANSLATION
 d009_convivencia.5.b.entry: "Obmedzme ich požičiavanie peňazí a uspokojme duchovenstvo." # todo: NEW TRANSLATION
 d009_convivencia.5.historical_info: "Židovskí finančníci, vyberači daní a dvorní lekári boli v kresťanských dvoroch na Pyrenejskom polostrove počas celého stredoveku bežným javom. Cirkevné právo totiž kresťanom zakazovalo úžeru, a tak veľkú časť úverového trhu ovládali židovskí veritelia. Osobnosti ako Yehuda de la Cavalleria, ktorý v 13. storočí spravoval kráľovské financie aragónskych kráľov, získali na dvore skutočný vplyv. Ich význam z nich však zároveň robil terč nevôle vždy, keď stúpli dane alebo sa vojny skončili neúspechom." # todo: NEW TRANSLATION
 d009_convivencia.6.title: "Spor pred súdmi aljamy" # todo: NEW TRANSLATION
 d009_convivencia.6.entry: "$d009_convivencia.6.title$" # todo: NEW TRANSLATION
 d009_convivencia.6.desc: "Uplynuli roky odvtedy, čo sme rozhodli, ako prísne má koruna dohliadať na súdy aljamy, a konečne sa k nám dostal spor, ktorý ukáže, či sa táto politika osvedčí v praxi. [ShowReligionGroupAdjective('christian')] obchodník s vlnou a [ShowReligionGroupAdjective('muslim')] garbiar sa nevedia dohodnúť na nevydarenej zmluve. Vlastný sudca aljamy už medzi nimi vyniesol rozsudok podľa zákonov starších než naši starí otcovia. Obchodník sa teraz odvoláva priamo na nás a žiada, aby kráľovská spravodlivosť zvrátila rozsudok, ktorému sa nikdy ani nechcel podriadiť." # todo: NEW TRANSLATION
 d009_convivencia.6.a: "Potvrďme rozsudok súdu aljamy." # todo: NEW TRANSLATION
 d009_convivencia.6.a.tt: "[ShowReligionGroupAdjectiveWithNoTooltip('muslim')] a [ShowReligionAdjective('judaism')] komunity berú tento rozsudok ako dôkaz, že slovu koruny možno dôverovať" # todo: NEW TRANSLATION
 d009_convivencia.6.b: "Zrušme rozsudok a preveďme spor pod kráľovské právo." # todo: NEW TRANSLATION
 d009_convivencia.6.b.tt: "[ShowReligionGroupAdjectiveWithNoTooltip('muslim')] a [ShowReligionAdjective('judaism')] komunity vidia, ako súdy aljamy potichu prichádzajú o svoju právomoc" # todo: NEW TRANSLATION
 d009_convivencia.6.historical_info: "Aljamy, samosprávne moslimské a židovské komunity kresťanského Pyrenejského polostrova, mali spravidla súdnu autonómiu vrátane vlastných súdov, ktoré pri vnútorných sporoch uplatňovali moslimské alebo židovské právo na základe listín udelených korunou. Tento spor je vymyslený, no napätie, ktoré znázorňuje, bolo trvalé: kráľovská a aljamová spravodlivosť sa neľahko prekrývali a ochota panovníkov ponechať posledné slovo komunálnym súdom sa v jednotlivých kráľovstvách i storočiach výrazne líšila." # todo: NEW TRANSLATION
 d009_convivencia.7.title: "[ShowReligionAdjectiveWithNoTooltip('judaism')] vezír pre [ROOT.GetCountry.GetAltAdjectiveWithNoTooltip('A')]" # todo: NEW TRANSLATION # todo: COUNTRY CASE
 d009_convivencia.7.entry: "Židovský vezír" # todo: NEW TRANSLATION
 d009_convivencia.7.desc: "Spomedzi [ShowReligionAdjective('judaism')] rodín usadených za hradbami [ShowLocationName('granada')] si [target_character.GetName] osvojil správu tribútov, daní a zmlúv a očividne sa cíti dobre v spoločnosti [ShowReligionGroupAdjective('christian')] aj [ShowReligionGroupAdjective('muslim')] vyslancov. To všetko v tomto roku nejedného raz upútalo pozornosť nášho [ROOT.GetCountry.GetGovernment.GetRulerTitle].\n\nVymenovaním [target_character.GetHimHer] do vysokého úradu by sa [ShowReligionAdjectiveWithNoTooltip('judaism')] ruky pevne chopili riadenia [ShowReligionGroupAdjectiveWithNoTooltip('muslim')] [ROOT.GetCountry.GetGovernment.GetCourtTitle]. Takéto usporiadanie má v dlhej histórii al-Andalusu skutočné precedensy už od umajjovských kalifov, no zbožnejší členovia nášho [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] ani širšie obyvateľstvo ho neprijmú mlčky, nech už by [target_character.GetSheHe] pokladnici akokoľvek dobre poslúžil." # todo: NEW TRANSLATION
 d009_convivencia.7.a: "Vymenujme [target_character.GetHimHer] za vezíra." # todo: NEW TRANSLATION
 d009_convivencia.7.a.entry: "Vymenujme ho za vezíra." # todo: NEW TRANSLATION
 d009_convivencia.7.b: "Dajme prednosť [ShowReligionGroupAdjectiveWithNoTooltip('muslim')] kandidátovi pred [target_character.GetHimHer]." # todo: NEW TRANSLATION
 d009_convivencia.7.b.entry: "Dajme prednosť moslimskému kandidátovi." # todo: NEW TRANSLATION
 d009_convivencia.7.historical_info: "Najznámejším skutočným príkladom židovského vezíra v moslimskej Ibérii je Samuel ibn Naghrilla, ktorý sa v 11. storočí stal vezírom granadského taifa kráľovstva. Po ňom nastúpil jeho syn Jozef, ktorý zastával rovnaký úrad až do chvíle, keď ho roku 1066 zabili počas masakry granadskej židovskej komunity. Nasridský emirát, ktorý od 13. storočia vládol Granade, zdedil dvorskú kultúru, v ktorej takéto menovania, hoci vždy vyvolávali spory, mali historické opodstatnenie." # todo: NEW TRANSLATION
 d009_convivencia_7_judaism_population_tt: "V ríši žije židovské obyvateľstvo" # todo: NEW TRANSLATION

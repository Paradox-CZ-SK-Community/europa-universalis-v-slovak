l_polish:
 d009_sephardi_catastrophe.1.title: "Kázanie Fernanda Martíneza" # todo: NEW TRANSLATION
 d009_sephardi_catastrophe.1.entry: "$d009_sephardi_catastrophe.1.title$" # todo: NEW TRANSLATION
 d009_sephardi_catastrophe.1.desc: "Arcidiakon menom [target_character.GetName] už roky káže v mestách v oblasti [ShowAreaName('andalusia_area')]. Každá jeho kázeň je poburujúcejšia než tá predchádzajúca a tento rok sa davy, ktoré [target_character.GetSheHe] podnecuje, už neuspokoja iba s počúvaním. Pred [ShowReligionAdjective('judaism')] štvrťami našich miest sa zhromažďujú davy ozbrojené viac než len slovami a náš [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] ani neskrýva, na ktorej strane stojí. Čokoľvek sa v uliciach odohrá počas nasledujúcich týždňov, nezostane obmedzené len na ne." # todo: NEW TRANSLATION
 d009_sephardi_catastrophe.1.a: "Pošlite stráž potlačiť davy." # todo: NEW TRANSLATION
 d009_sephardi_catastrophe.1.b: "Dovoľte davom konať, ale len v rozumných medziach." # todo: NEW TRANSLATION
 d009_sephardi_catastrophe.1.c: "Požehnajte zo strany koruny ich cieľ." # todo: NEW TRANSLATION
 d009_sephardi_catastrophe.1.historical_info: "Fernando Martínez, arcidiakon z Éciji, celé roky kázal proti židovskej obci v Seville napriek opakovaným kráľovským príkazom, aby s tým prestal. Keď v júni 1391 napokon podnietil dav, násilie si vyžiadalo tisíce obetí a v priebehu niekoľkých týždňov sa rozšírilo do Córdoby, Toleda, Valencie, Barcelony i ďalej. Išlo o najničivejšiu vlnu protižidovského násilia v stredovekej Ibérii a o začiatok masových konverzií, z ktorých neskôr vzišla komunita konvertitov, na ktorú sa o storočie neskôr zamerala inkvizícia." # todo: NEW TRANSLATION
 d009_sephardi_catastrophe.2.title: "Pogromy sa šíria" # todo: NEW TRANSLATION
 d009_sephardi_catastrophe.2.entry: "$d009_sephardi_catastrophe.2.title$" # todo: NEW TRANSLATION
 d009_sephardi_catastrophe.2.desc: "Správy o besnení, ktoré sa prvý raz rozpútalo v oblasti [ShowAreaName('andalusia_area')], tam nezostali. V mestách po celej ríši sa šíria tie isté chýry, znejú tie isté kázne a pred štvrťami [ShowReligionAdjective('judaism')], ktoré ešte prednedávnom nič podobné nezažili, sa zhromažďujú tie isté davy. Akýkoľvek pokoj tu ešte panoval, už sa rozpadá a žiaden príkaz z nášho dvora nestihne včas doraziť do každej ulice." # todo: NEW TRANSLATION
 d009_sephardi_catastrophe.2.a: "Teraz už môžeme len nečinne prizerať." # todo: NEW TRANSLATION
 d009_sephardi_catastrophe.2.historical_info: "Pogromy z roku 1391 sa počas leta šírili zo Sevilly závratnou rýchlosťou a v priebehu niekoľkých týždňov zasiahli Córdobu, Toledo, Valenciu, Palmu aj Barcelonu. Miestni kazatelia a davy v jednotlivých mestách vnímali nepokoje v Seville skôr ako povolenie než ako varovanie. Dobové odhady naznačujú, že len v tom roku boli zabité alebo násilne obrátené na inú vieru desaťtisíce Židov, čo natrvalo zmenilo demografickú a náboženskú mapu Ibérie." # todo: NEW TRANSLATION
 d009_sephardi_catastrophe.3.title: "Dišputa v [ShowLocationNameWithNoTooltip('tortosa')]" # todo: NEW TRANSLATION
 d009_sephardi_catastrophe.3.entry: "$d009_sephardi_catastrophe.3.title$" # todo: NEW TRANSLATION
 d009_sephardi_catastrophe.3.desc: "Na priamu žiadosť pápeža museli rabíni z krajiny [ROOT.GetCountry.GetAltAdjective('G')] mesiac čo mesiac vysedávať na verejnej dišpute v meste [ShowLocationName('tortosa')]. Pred zástupom učencov [ShowReligionGroupAdjective('christian')] odpovedajú na otázky o svojej viere bod po bode a čelí im aj konvertita z [ShowReligionAdjective('judaism')], ktorý túži dokázať, že jeho bývalá obec sa mýli. Mnohí túto skúšku nevydržali s neotraseným presvedčením a nejedna aljama teraz prišla o svojho rabína, ktorý prešiel na druhú stranu." # todo: NEW TRANSLATION # todo: COUNTRY CASE
 d009_sephardi_catastrophe.3.a: "Nech dišputa pokračuje." # todo: NEW TRANSLATION
 d009_sephardi_catastrophe.3.b: "Chráňme našich rabínov pred najhorším." # todo: NEW TRANSLATION
 d009_sephardi_catastrophe.3.b.tt: "Obec [ShowReligionAdjective('judaism')] v meste [ShowLocationNameWithNoTooltip('tortosa')] nachádza v tomto geste určitú útechu" # todo: NEW TRANSLATION
 d009_sephardi_catastrophe.3.historical_info: "Dišputu v Tortose (1413 – 1414) zvolal protipápež Benedikt XIII. a trvala vyše šesťdesiat zasadnutí. Rabínov z celého Aragónska nútili viesť biblické debaty s Jerónimom de Santa Fe, bývalým židovským lekárom, ktorý konvertoval na kresťanstvo a tvrdil, že samotný Talmud dokazuje, že Ježiš je mesiáš. Po dišpute nasledovala vlna konverzií a protižidovských zákonov v celej aragónskej korune." # todo: NEW TRANSLATION
 d009_sephardi_catastrophe.4.title: "Nový cieľ inkvizície" # todo: NEW TRANSLATION
 d009_sephardi_catastrophe.4.entry: "$d009_sephardi_catastrophe.4.title$" # todo: NEW TRANSLATION
 d009_sephardi_catastrophe.4.desc: "Tribunál zriadený na vykorenenie herézy sa dosiaľ zaoberal záležitosťami, ktoré mali k aljamám ďaleko. To sa však mení. Do rady nášho [ROOT.GetCountry.GetGovernment.GetRulerTitle] denne prenikajú chýry o domácnostiach Nových [ShowReligionGroupAdjective('christian')] v našich mestách, ktorých obyvatelia sa na verejnosti žehnajú krížom a za zatiahnutými okenicami zapaľujú sviece. Inkvizítori tribunálu túžia získať poverenie, aby mohli dôkladnejšie skúmať, čo tieto domácnosti robia, keď sa ulica vonku ponorí do ticha." # todo: NEW TRANSLATION
 d009_sephardi_catastrophe.4.a: "Zamerajte činnosť tribunálu na konvertitov." # todo: NEW TRANSLATION
 d009_sephardi_catastrophe.4.b: "Nech sa tribunál naďalej venuje len heréze." # todo: NEW TRANSLATION
 d009_sephardi_catastrophe.4.historical_info: "Španielska inkvizícia bola zriadená pápežskou bulou v roku 1478 s konkrétnym cieľom vyšetrovať konvertitov podozrivých z tajného praktizovania judaizmu. Na rozdiel od skorších stredovekých inkvizícií sa jej pôvodné poslanie takmer výlučne týkalo kontroly obráteného obyvateľstva, nie boja proti heréze medzi kresťanmi od narodenia. Tomás de Torquemada, jej najznámejší prvý veľký inkvizítor, v 80. rokoch 15. storočia dohliadal na výrazné rozšírenie práve tohto druhu vyšetrovania." # todo: NEW TRANSLATION
 variable_iberian_union_active_tt: "Ibérska únia je založená" # todo: NEW TRANSLATION
 d009_sephardi_catastrophe.5.title: "Vyhnanie z krajiny [ROOT.GetCountry.GetAltAdjectiveWithNoTooltip('G')]" # todo: NEW TRANSLATION # todo: COUNTRY CASE
 d009_sephardi_catastrophe.5.entry: "Vyhnanie" # todo: NEW TRANSLATION
 d009_sephardi_catastrophe.5.desc: "Každý okolitý trón, ktorý ešte toleroval obec [ShowReligionAdjective('judaism')], sa v posledných rokoch rozhodol s touto toleranciou skoncovať a tlak, aby sme urobili to isté, už nemožno ďalej ignorovať. Nech už malo staré usporiadanie akékoľvek výhody, už si nemôžeme dovoliť byť jedinou ibérskou korunou, ktorá stále dovolí ľudu [ShowReligionAdjective('judaism')] nazývať krajinu [ROOT.GetCountry.GetAltAdjective('A')] svojím domovom." # todo: NEW TRANSLATION # todo: COUNTRY CASE
 d009_sephardi_catastrophe.5.a: "Vydajte edikt o vyhnaní." # todo: NEW TRANSLATION
 d009_sephardi_catastrophe.5.historical_info: "Navarra vyhnala svoje židovské obyvateľstvo v roku 1498, niekoľko rokov po Kastílii a Aragónsku (1492) a približne v rovnakom čase ako Portugalsko (1497). Stalo sa tak najmä pod tlakom Ferdinanda a Izabely, keď sa Navarra dostala pod ich vplyv. Išlo o jedno z posledných nezávislých vyhnaní v Ibérii a uzavrelo takmer všetky možnosti, ako sa mohli židovské obce vyhnané zo Španielska a Portugalska presťahovať inam na polostrove namiesto toho, aby ho museli úplne opustiť." # todo: NEW TRANSLATION
 d009_sephardi_catastrophe.6.title: "Masaker v [ShowLocationNameWithNoTooltip('lisbon')]" # todo: NEW TRANSLATION
 d009_sephardi_catastrophe.6.entry: "$d009_sephardi_catastrophe.6.title$" # todo: NEW TRANSLATION
 d009_sephardi_catastrophe.6.desc: "Dav v našom vlastnom hlavnom meste, do šialenstva vybičovaný potulnými mníchmi, ktorí kážu, že mor sužujúci [ShowLocationName('lisbon')] je Božím trestom za Nových kresťanov žijúcich v meste, premenil ulice mesta [ShowLocationNameWithNoTooltip('lisbon')] na jatky. Na námestiach a vo vchodoch ležia stovky mŕtvych konvertitov, mužov, žien i detí, a náš [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] je potichu rozdelený v otázke, či vraždenie odsúdiť, alebo ho požehnať." # todo: NEW TRANSLATION
 d009_sephardi_catastrophe.6.a: "Pošlite stráž potlačiť výtržníkov." # todo: NEW TRANSLATION
 d009_sephardi_catastrophe.6.b: "Nech sa hnev mesta sám vybúri." # todo: NEW TRANSLATION
 d009_sephardi_catastrophe.6.historical_info: "Lisabonský masaker z apríla 1506 sa začal, keď dominikánski mnísi obvinili Nových kresťanov zo sucha a moru, ktoré v tom čase sužovali mesto. Trval tri dni, kým napokon nezasiahli kráľovské vojská. Odhady počtu obetí sa pohybujú od necelých dvetisíc až po vyše tritisíc. Masaker natoľko znepokojil kráľa Manuela I., že následne vydal edikty, ktorými Nových kresťanov formálne chránil pred ďalším násilím davov, hoci podozrievavosť voči nim nikdy celkom nevymizla." # todo: NEW TRANSLATION
 d009_sephardi_catastrophe.7.title: "Inkvizícia [ROOT.GetCountry.GetAdjectiveWithNoTooltip] sa obracia proti konvertitom" # todo: NEW TRANSLATION
 d009_sephardi_catastrophe.7.entry: "Inkvizícia sa obracia proti konvertitom" # todo: NEW TRANSLATION
 d009_sephardi_catastrophe.7.desc: "Tribunál zriadený na základe našej politiky [ShowPolicyName('local_courts')] sa prvé roky zaoberal bežnými otázkami náuky. Jeho inkvizítori však čoraz netrpezlivejšie sledujú, ako domácnosti Nových [ShowReligionGroupAdjective('christian')] v mestách [ShowLocationName('lisbon')], [ShowLocationName('porto')] a [ShowLocationName('evora')] zostávajú celé generácie bez vyšetrovania. Stačí, ak tribunál požiada o poverenie preskúmať ich súkromné náboženské obrady, a inkvizítori dali jasne najavo, že oň žiadajú." # todo: NEW TRANSLATION
 d009_sephardi_catastrophe.7.a: "Poverte tribunál vyšetrovaním konvertitov." # todo: NEW TRANSLATION
 d009_sephardi_catastrophe.7.b: "Obmedzte tribunál na prípady otvorenej herézy." # todo: NEW TRANSLATION
 d009_sephardi_catastrophe.7.historical_info: "Portugalská inkvizícia bola oficiálne zriadená v roku 1536, desaťročia po španielskej, a spočiatku postupovala voči konvertitom opatrne, pretože sa obávala hospodárskych škôd, ktoré by ďalšie prenasledovanie mohlo spôsobiť. Táto opatrnosť však netrvala dlho. V polovici 16. storočia portugalské tribunály v Lisabone, Coimbre a Évore vo veľkom stíhali Nových kresťanov podozrivých z tajného praktizovania judaizmu, čo vyvolalo ďalšie vlny emigrácie do Amsterdamu, Talianska a Osmanskej ríše." # todo: NEW TRANSLATION
 d009_sephardi_catastrophe.8.title: "Auto-da-fé" # todo: NEW TRANSLATION
 d009_sephardi_catastrophe.8.entry: "$d009_sephardi_catastrophe.8.title$" # todo: NEW TRANSLATION
 d009_sephardi_catastrophe.8.desc: "Na verejnom námestí sa konalo ďalšie auto-da-fé. Kajúcnici v žltých sanbenitách pochodovali pred davom, ktorý už túto podívanú očakáva rovnako ako ktorýkoľvek sviatok. Či tento obrad vykoreňuje skutočnú herézu, alebo len zastrašuje domácnosti, ktoré sa svojej starej viery vzdali už pred generáciami, to sa v dave pýta len málokto." # todo: NEW TRANSLATION
 d009_sephardi_catastrophe.8.a: "Nech tribunál pokračuje vo svojej práci." # todo: NEW TRANSLATION
 d009_sephardi_catastrophe.8.historical_info: "Auto-da-fé, po portugalsky a španielsky „akt viery“, bol verejným obradom inkvizície, pri ktorom vynášala rozsudky. Odsúdení kajúcnici, často oblečení do žltého rúcha sanbenito, ktoré označovalo ich vinu, pochodovali pred davom a potom dostali trest, od pokánia až po upálenie. Tieto udalosti priťahovali obrovské množstvo divákov a po stáročia boli pevnou súčasťou ibérskeho mestského života, v ktorom sa náboženský obrad prelínal s verejnou podívanou." # todo: NEW TRANSLATION
 d009_sephardi_catastrophe.9.title: "Úniková sieť marranov" # todo: NEW TRANSLATION
 d009_sephardi_catastrophe.9.entry: "$d009_sephardi_catastrophe.9.title$" # todo: NEW TRANSLATION
 d009_sephardi_catastrophe.9.desc: "Tribunál sa dozvedel o sieti obchodníkov a námorníkov spomedzi Nových [ShowReligionGroupAdjective('christian')], ktorí potajme zabezpečujú odchod do cudziny rodinám, ktoré už nedokážu znášať život v podozrení. Ich lode odplávajú z prístavu pod zámienkou bežného obchodu. Nie každej rodine, ktorá chce odísť, sa podarí nájsť miesto na palube, no niektorým áno. A žiaden príkaz z nášho [ROOT.GetCountry.GetGovernment.GetCourtTitle] nedokáže zastihnúť každú loď skôr, než prepláva cez prístavný prieliv." # todo: NEW TRANSLATION
 d009_sephardi_catastrophe.9.a: "Nemožno zastaviť každú loď, ktorá opustí prístav." # todo: NEW TRANSLATION
 d009_sephardi_catastrophe.9.historical_info: "Konvertiti si po nútených konverziách po celé generácie vytvárali siete na emigráciu. Rodiny zvyčajne putovali cez Bordeaux, Antverpy alebo Ferraru a odtiaľ pokračovali do bezpečnejších útočísk, ako bola Osmanská ríša alebo neskôr Amsterdam. Tieto siete sa vo veľkej miere opierali o rodinné a obchodné väzby medzi obchodníkmi, ktorí už sami emigrovali. Portugalská koruna sa ich opakovane pokúšala úplne zrušiť, no neúspešne, pretože tie isté obchodné siete boli často nevyhnutné aj pre jej vlastný zámorský obchod." # todo: NEW TRANSLATION

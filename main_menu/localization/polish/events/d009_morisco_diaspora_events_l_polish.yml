l_polish:
 d009_morisco_diaspora.1.title: "Príchod Moriskov" # todo: NEW TRANSLATION
 d009_morisco_diaspora.1.entry: "$d009_morisco_diaspora.1.title$" # todo: NEW TRANSLATION
 d009_morisco_diaspora.1.desc: "Utečenci, ktorí si hovoria Moriskovia — rodiny vyznávajúce [ShowReligionGroupAdjective('muslim')], vyhnané z krajín, ktoré ich predkovia po stáročia nazývali domovom — sa začali usádzať v [target_location.GetName]. Prinášajú si so sebou zvyky, remeslá a jazyk z [ShowRegionName('iberia_region')], ktorý z nás videl len málokto. Niektorí z našich úradníkov vítajú príchod zručných pracovníkov a kapitálu, ktorý majú k dispozícii; iní v nich vidia cudzincov, ktorých oddanosť domovine ovládanej [ShowReligionGroupAdjectiveWithNoTooltip('christian')], z ktorej len nedávno utiekli, nemožno úplne dôverovať." # todo: NEW TRANSLATION
 d009_morisco_diaspora.1.a: "Prijmime ich s otvorenou náručou." # todo: NEW TRANSLATION
 d009_morisco_diaspora.1.b: "Obmedzme ich na túto štvrť." # todo: NEW TRANSLATION
 d009_morisco_diaspora.1.historical_info: "Po vyhláške o vyhnaní z rokov 1609 – 1614 opustilo Španielsko odhadom 300 000 Moriskov a zamierilo do Maghrebu, pričom sa usadili najmä v Tetouane, Salé, Tunise a Alžíri. Mnohí si po celé generácie zachovali andalúzsky jazyk, odev aj kuchyňu, zatiaľ čo iní splynuli so širšími moslimskými spoločnosťami, ktoré ich prijali." # todo: NEW TRANSLATION
 variable_d009_morisco_community_ever_tt: "V Alžíri niekedy žila moriskovská komunita" # todo: NEW TRANSLATION
 d009_morisco_diaspora.2.title: "Republika Rabat-Salé" # todo: NEW TRANSLATION
 d009_morisco_diaspora.2.entry: "$d009_morisco_diaspora.2.title$" # todo: NEW TRANSLATION
 d009_morisco_diaspora.2.desc: "Moriskovská komunita v [ShowLocationName('sale')] sa stala dosť odvážnou na to, aby sa spravovala sama, hoci to tak oficiálne nenazýva. Jej korzárski kapitáni sa zodpovedajú vlastnej rade, ktorú si sami zvolili, a nie guvernérovi, ktorého by sme vymenovali. Náš dvor už nemôže ďalej odkladať rozhodnutie, či oficiálne uznáme to, čo sa už v praxi stalo, alebo znovu dostaneme [ShowLocationNameWithNoTooltip('sale')] pod prísnejší dohľad." # todo: NEW TRANSLATION
 d009_morisco_diaspora.2.a: "Udeľme im autonómiu." # todo: NEW TRANSLATION
 d009_morisco_diaspora.2.b: "Začleňme ich do kráľovského loďstva." # todo: NEW TRANSLATION
 d009_morisco_diaspora.2.historical_info: "Republika Salé (nazývaná aj Republika Bou Regreg) vznikla okolo roku 1627 ako polonezávislý korzársky štát, ktorému vládli moriskovskí utečenci a ich potomkovia. Jeho korzári podnikali nájazdy pri pobreží Ibérie a na atlantických obchodných trasách, zväčša mimo priamej kontroly ktoréhokoľvek sultána. Neskôr v 17. storočí sa republika podriadila marockej vláde dynastie Alawitov, hoci jej pirátsky charakter pretrval celé generácie." # todo: NEW TRANSLATION
 d009_morisco_diaspora.3.title: "Andalúzska štvrť v [ShowLocationNameWithNoTooltip('tunis')]" # todo: NEW TRANSLATION
 d009_morisco_diaspora.3.entry: "$d009_morisco_diaspora.3.title$" # todo: NEW TRANSLATION
 d009_morisco_diaspora.3.desc: "Moriskovia, ktorí sa usadili v [ShowLocationName('tunis')], si vybudovali vlastnú osobitú štvrť. Jej architektúra, záhrady a remeslá jasne pochádzajú z [ShowRegionNameWithNoTooltip('iberia_region')], hoci od ich odchodu z [ShowRegionNameWithNoTooltip('iberia_region')] uplynuli celé generácie. Je len na nás, či túto svojbytnosť podporíme ako znak kozmopolitného charakteru mesta, alebo ju nenápadne začleníme do širšej populácie." # todo: NEW TRANSLATION
 d009_morisco_diaspora.3.a: "Podporujme zachovanie ich kultúry." # todo: NEW TRANSLATION
 d009_morisco_diaspora.3.b: "Podporujme asimiláciu." # todo: NEW TRANSLATION
 d009_morisco_diaspora.3.historical_info: "Moriskovia, ktorí sa po vyhnaní zo Španielska usadili v Tunise, vytvorili osobitú štvrť, dodnes známu pod rôznymi podobami názvu #italic Zuqāq al-'Andalus#!. Po celé stáročia si zachovávali andalúzsku architektúru, kuchyňu aj andalúzsku hudobnú tradíciu známu ako #italic ma'luf#!." # todo: NEW TRANSLATION
 d009_morisco_diaspora.4.title: "Hudba [ShowCultureNameWithNoTooltip('andalusi')] pretrváva" # todo: NEW TRANSLATION
 d009_morisco_diaspora.4.entry: "$d009_morisco_diaspora.4.title$" # todo: NEW TRANSLATION
 d009_morisco_diaspora.4.desc: "Hudobníci z moriskovskej komunity naďalej hrajú a vyučujú zložitú dvorskú hudbu, ktorú ich predkovia kedysi hrávali v palácoch [ShowRegionName('iberia_region')]. Odovzdávajú si ju učitelia a žiaci v neprerušenej tradícii siahajúcej až do čias pred vyhnaním. Dvorskí básnici aj cestovatelia si ju začali všímať ako jeden z najvýraznejších kultúrnych pokladov tejto ríše." # todo: NEW TRANSLATION
 d009_morisco_diaspora.4.a: "Uznajme túto tradíciu." # todo: NEW TRANSLATION
 d009_morisco_diaspora.4.historical_info: "Andalúzska hudobná tradícia #italic nuba#!, ktorá vznikla na dvoroch al-'Andalus a do severnej Afriky ju priniesli celé generácie vyhnancov, pretrvala a vyvinula sa do osobitých regionálnych hudobných štýlov, ktoré sa v Maghrebe hrajú dodnes. Najmä v Tetouane, Tunise a Alžíri si každé mesto zachovalo vlastnú školu tejto tradície." # todo: NEW TRANSLATION
 d009_morisco_diaspora.5.title: "Moriskovskí korzári z [ShowLocationNameWithNoTooltip('algiers')]" # todo: NEW TRANSLATION
 d009_morisco_diaspora.5.entry: "$d009_morisco_diaspora.5.title$" # todo: NEW TRANSLATION
 d009_morisco_diaspora.5.desc: "Moriskovskí utečenci, ktorí kedysi lovili ryby a obrábali pôdu na pobreží [ShowRegionName('iberia_region')], teraz tejto ríši ponúkajú niečo oveľa užitočnejšie než svoje pôvodné remeslá: dôkladnú znalosť miestnych prístavov, morských prúdov a pobrežnej obrany, ktorú naši korzárski kapitáni vôbec nemajú. Stojí za dôkladné zváženie, či tieto znalosti využijeme na mori, alebo tieto rodiny ponecháme pri bezpečnejších remeslách, ktoré už ovládajú." # todo: NEW TRANSLATION
 d009_morisco_diaspora.5.a: "Najmime ich ako lodivodov." # todo: NEW TRANSLATION
 d009_morisco_diaspora.5.b: "Nechajme ich pri remeslách." # todo: NEW TRANSLATION
 d009_morisco_diaspora.5.historical_info: "Moriskovia, ktorí dôverne poznali pobrežnú geografiu Ibérie, si alžírski korzári v 17. storočí veľmi cenili. Slúžili ako lodivodi aj nájazdníci a ich znalosť španielskych prístavov a morských prúdov dávala miestnym korzárskym flotilám výraznú operačnú výhodu nad ich kresťanskými cieľmi." # todo: NEW TRANSLATION
 d009_morisco_diaspora.6.title: "Dve generácie po vyhnaní" # todo: NEW TRANSLATION
 d009_morisco_diaspora.6.entry: "$d009_morisco_diaspora.6.title$" # todo: NEW TRANSLATION
 d009_morisco_diaspora.6.desc: "Deti a vnúčatá prvých moriskovských vyhnancov vyrástli s vedomím, že ich domovom je táto krajina a nijaká iná. Niektorí z nich už poznajú [ShowRegionName('iberia_region')] len z príbehov, ktoré zdedili a ktoré sú dnes skôr legendami než spomienkami; iní si stále pripomínajú výročie vyhnania svojich starých rodičov, akoby sa udialo včera. Je na nás, či túto generáciu povzbudíme, aby sa považovala za plnoprávnych poddaných, alebo budeme naďalej ctiť to, čo ju odlišuje. Toto rozhodnutie ovplyvní, ako si túto komunitu budú pamätať." # todo: NEW TRANSLATION
 d009_morisco_diaspora.6.a: "Podporujme úplnú integráciu." # todo: NEW TRANSLATION
 d009_morisco_diaspora.6.b: "Podporujme zachovanie ich spomienok." # todo: NEW TRANSLATION
 d009_morisco_diaspora.6.historical_info: "V polovici až na konci 17. storočia sa deti a vnúčatá moriskovských vyhnancov čoraz viac začleňovali do širšej populácie Maghrebu. V mestách ako Tetouan a Tunis však až do 18. storočia a neskôr pretrvali osobité zvyky, priezviská aj doznievajúca andalúzska identita." # todo: NEW TRANSLATION
 d009_morisco_diaspora.7.title: "Kľúče od [ShowLocationNameWithNoTooltip('granada')]" # todo: NEW TRANSLATION
 d009_morisco_diaspora.7.entry: "$d009_morisco_diaspora.7.title$" # todo: NEW TRANSLATION
 d009_morisco_diaspora.7.desc: "Niektoré moriskovské rodiny si dodnes uchovávajú kľúče a listiny k domom, ktoré ich predkovia kedysi vlastnili v [ShowLocationName('granada')] a inde v [ShowRegionName('iberia_region')]. Tieto predmety nemajú nijaké praktické využitie, no celé generácie si ich odovzdávajú ako prísľub návratu, akokoľvek nepravdepodobného — návratu, ktorý je každým ďalším rokom menej možný." # todo: NEW TRANSLATION
 d009_morisco_diaspora.7.a: "Zamyslime sa nad tým, čo sme stratili." # todo: NEW TRANSLATION
 d009_morisco_diaspora.7.historical_info: "Moriskovské a osobitne sefardské rodiny v Maghrebe a osmanských diaspórnych komunitách si podľa dobre zdokumentovanej tradície uchovávali kľúče od svojich domovov v Ibérii. Symbolizovali tak trvalý, zväčša len symbolický nárok na domovinu, ktorá sa s každou ďalšou generáciou vzďaľovala." # todo: NEW TRANSLATION
 d009_morisco_diaspora.8.title: "[ROOT.GetCountry.GetAdjectiveWithNoTooltip] Alžír a dedičstvo [ShowCultureNameWithNoTooltip('andalusi')]" # todo: NEW TRANSLATION
 d009_morisco_diaspora.8.entry: "Alžír a andalúzske dedičstvo" # todo: NEW TRANSLATION
 d009_morisco_diaspora.8.desc: "Naši inžinieri a správcovia v [ShowLocationName('algiers')] sa čoraz viac zaujímajú o štvrte a architektúru [ShowCultureName('andalusi')], ktoré tu zanechali celé generácie moriskovských osadníkov. Diskutujú o tom, či si toto dedičstvo zaslúži starostlivú ochranu, alebo či by malo ustúpiť modernejšiemu a dôslednejšie [ROOT.GetCountry.GetAdjective] plánovanému mestu." # todo: NEW TRANSLATION
 d009_morisco_diaspora.8.a: "Zachovajme toto dedičstvo." # todo: NEW TRANSLATION
 d009_morisco_diaspora.8.b: "Nahraďme ho moderným plánovaním." # todo: NEW TRANSLATION
 d009_morisco_diaspora.8.historical_info: "Francúzski koloniálni správcovia, ktorí po roku 1830 prevzali kontrolu nad Alžírom, mali k moriskovskému a osmanskému dedičstvu mesta zmiešaný vzťah. Niektorí úradníci a vedci sa usilovali zdokumentovať a zachovať architektúru ovplyvnenú Andalúziou, zatiaľ čo iní dohliadali na jej búranie v prospech francúzskeho urbanistického plánovania. Týkalo sa to najmä starej osmanskej citadely známej ako Kasba." # todo: NEW TRANSLATION
 d009_morisco_diaspora.9.title: "Dve komunity, jedna cesta do [ROOT.GetCountry.GetAltAdjectiveWithNoTooltip('G')]" # todo: NEW TRANSLATION # todo: COUNTRY CASE
 d009_morisco_diaspora.9.entry: "Dve komunity, jedna cesta" # todo: NEW TRANSLATION
 d009_morisco_diaspora.9.desc: "V priebehu jedinej generácie sa táto ríša stala domovom dvoch národov, ktoré z rovnakého pobrežia vyhnala tá istá pohroma: [ShowCultureName('sephardi')] vyhnancov, ktorí utekali pred Alhamberským dekrétom, a moriskovských utečencov, ktorí unikli nútenému obráteniu na inú vieru alebo ešte horšiemu osudu. Niektorí na našom dvore by chceli každú komunitu usadiť vo vlastnej štvrti s vlastnou listinou a zvykmi; iní tvrdia, že spoločné vyhnanstvo si zaslúži spoločné prijatie, pod jednou strechou, nie pod dvoma." # todo: NEW TRANSLATION
 d009_morisco_diaspora.9.a: "Zriaďme oddelené štvrte." # todo: NEW TRANSLATION
 d009_morisco_diaspora.9.b: "Dovoľme im usadiť sa spoločne." # todo: NEW TRANSLATION
 d009_morisco_diaspora.9.historical_info: "Maroko počas 15. aj 17. storočia prijímalo z Ibérie vyhnaných Židov i moslimov. V mestách ako Tetouan a Fez tieto dve komunity často žili v tesnej blízkosti a spájalo ich spoločné dedičstvo obyvateľov Ibérie, hoci si zachovávali vlastné náboženské a právne inštitúcie." # todo: NEW TRANSLATION
 d009_morisco_diaspora_9_sephardi_population_tt: "Ríša má sefardské obyvateľstvo" # todo: NEW TRANSLATION
 d009_morisco_diaspora_9_morisco_community_tt: "Ríša má usadenú moriskovskú komunitu" # todo: NEW TRANSLATION
 d009_morisco_diaspora.10.title: "Mesto, ktoré si pamätá" # todo: NEW TRANSLATION
 d009_morisco_diaspora.10.entry: "$d009_morisco_diaspora.10.title$" # todo: NEW TRANSLATION
 d009_morisco_diaspora.10.desc: "[ShowLocationName('tetouan')] nesie stopy dvoch vyhnaných národov: rodín [ShowCultureName('sephardi')] aj moriskovských utečencov. Obe skupiny dodnes hovoria nárečiami španielčiny, ktorú si priniesli ich starí rodičia, a svoje deti stále pomenúvajú po mestách v [ShowRegionName('iberia_region')], ktoré už ani jedna z komunít nikdy neuvidí. Len máloktoré mesto nesie vo svojich uliciach, dvoroch a kuchyniach toľko spomienok." # todo: NEW TRANSLATION
 d009_morisco_diaspora.10.a: "Buďme hrdí na živú pamäť tohto mesta." # todo: NEW TRANSLATION
 d009_morisco_diaspora.10.historical_info: "Tetouan obnovili a znovu osídlili najmä sefardskí a andalúzski moslimskí vyhnanci po tom, čo ich vyhnali z Ibérie. Mesto si preto zachovalo svoj jedinečný charakter ovplyvnený Ibériou vrátane nárečí #italic Haketia#! a marockej arabčiny, v ktorých dodnes pretrvávajú stopy španielčiny, a to až do 20. storočia." # todo: NEW TRANSLATION

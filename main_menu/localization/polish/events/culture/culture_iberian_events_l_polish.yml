l_polish:
 iberian_culture.1.title: "Piesne reconquisty" # todo: NEW TRANSLATION
 iberian_culture.1.desc: "Naše strety s neveriacimi inšpirovali trubadúrov aj prostý ľud, aby skladali piesne oslavujúce odvahu našich vojakov, ktorí bojujú za víťazstvo [ShowReligionGroupAdjective('christian')|U] veci. Keď sa tieto piesne rozšíria po [ROOT.GetCountry.GetFlavorRank], môžu nám poslúžiť ako užitočný nástroj — povzbudiť našich vojakov v boji a možno presvedčiť ďalších mužov, aby vstúpili do našich radov." # todo: NEW TRANSLATION
 iberian_culture.1.a: "Nech znejú na bojisku!" # todo: NEW TRANSLATION
 iberian_culture.1.b: "Nech povzbudia ďalších k vstupu do našich radov!" # todo: NEW TRANSLATION
 iberian_culture.2.title: "Hrdina reconquisty" # todo: NEW TRANSLATION
 iberian_culture.2.desc: "Medzi mnohými odvážnymi dušami, ktoré bojovali vo vojne proti [GetCountry('GRA').GetName], vyniká [new_general.GetName], ktorý sa vyznamenal [new_general.GetHerselfHimself] odvahou a vojenským umením. [new_general.GetHerHis|U] povesť ho teraz predchádza [new_general.GetHerHim] po celej [ROOT.GetCountry.GetFlavorRank] a mnohí tvrdia, že takýto talent by si zaslúžil velenie zodpovedajúce [new_general.GetHerHis] zásluhám." # todo: NEW TRANSLATION
 iberian_culture.2.a: "[new_general.GetSheHe|U] bude veliť našim armádam." # todo: NEW TRANSLATION
 iberian_culture.2.b: "Jeho [new_general.GetHerHis] schopnosti využijeme inde." # todo: NEW TRANSLATION
 iberian_culture.3.title: "Osídľovanie juhu" # todo: NEW TRANSLATION
 iberian_culture.3.desc: "Keďže [ShowAreaName('granada_area')] bola konečne oslobodená spod [ShowReligionGroupAdjective('muslim')] nadvlády, mnohé rodiny začali hľadieť na tieto kraje ako na príležitosť. Nedávno sme dostali správy o ľuďoch z [origin_province.GetName], ktorých lákajú prísľuby opustených pozemkov a možnosti začať nový život v [target_province.GetName]." # todo: NEW TRANSLATION
 iberian_culture.3.a: "Povoľte im presídlenie." # todo: NEW TRANSLATION
 iberian_culture.3.b: "Pokúste sa obmedziť počet osadníkov." # todo: NEW TRANSLATION
 iberian_culture.4.title: "Zázrak Panny Márie" # todo: NEW TRANSLATION
 iberian_culture.4.desc: "Rozšírili sa správy o zázraku, ktorý sa údajne odohral v [target_location.GetName]. Podľa miestnych svedectiev sa na svahu s výhľadom na osadu zjavila požehnaná Panna Mária. Hoci sú niektorí voči zázraku skeptickí, aj tak prilákal pútnikov zblízka i zďaleka. Ulice sú teraz preplnené cestovateľmi, z ktorých miestni obyvatelia usilovne ťažia. Do miestnej pokladnice prúdili početné dary a o tom, ako s týmto novonadobudnutým bohatstvom naložiť, sa vedú búrlivé spory." # todo: NEW TRANSLATION
 iberian_culture.4.a: "Znovu investujte peniaze v okolí." # todo: NEW TRANSLATION
 iberian_culture.4.b: "Odovzdajte dary [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')]." # todo: NEW TRANSLATION
 iberian_culture.4.c: "Rozdajte almužny chudobným." # todo: NEW TRANSLATION
 iberian_culture.4.d: "Na tieto dary bude dohliadať [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')]." # todo: NEW TRANSLATION
 iberian_culture.5.title: "Návrat zo severných morí" # todo: NEW TRANSLATION
 iberian_culture.5.desc: "[ShowCultureName('basque')] veľrybári sa vrátili z ďalšej výpravy do vzdialených severných morí. Prekonali nebezpečné búrky a vody, ktoré väčšina námorníkov nepozná, a domov priniesli cenný náklad aj množstvo praktických poznatkov. Členovia [ROOT.GetCountry.GetGovernment.GetCourtTitle] teraz diskutujú o tom, ako tieto skúsenosti využiť." # todo: NEW TRANSLATION
 iberian_culture.5.a: "Každá plavba by sa mala poučiť z tej predošlej." # todo: NEW TRANSLATION
 iberian_culture.5.b: "Oceán ponúka nekonečné možnosti." # todo: NEW TRANSLATION
 iberian_culture.6.title: "Zručný mudéjarský umelec" # todo: NEW TRANSLATION
 iberian_culture.6.desc: "Dozvedeli sme sa, že [target_character.GetName], zručný umelec [ShowReligionGroupAdjective('muslim')], si získava uznanie po celej [ROOT.GetCountry.GetFlavorRank]. Členovia [ROOT.GetCountry.GetGovernment.GetCourtTitle] navrhujú pozvať [target_character.GetHimHer] do našich služieb, hoci mnohí z [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] namietajú proti tomu, aby sa mudéjarovi dostalo takej pocty." # todo: NEW TRANSLATION
 iberian_culture.6.a: "Talent neurčuje viera." # todo: NEW TRANSLATION
 iberian_culture.6.b: "Takéto pocty patria [ShowReligionGroupAdjective('christian')|U] poddaným." # todo: NEW TRANSLATION
 iberian_culture.7.title: "Spor na trhovisku" # todo: NEW TRANSLATION
 iberian_culture.7.desc: "V [target_location.GetName] vypuklo napätie, keď sa obchodníci [ShowReligionAdjective('sunni')] a [ShowReligionAdjective('catholic')] navzájom obvinili, že miestni úradníci a cechy s nimi zaobchádzajú nespravodlivo. [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')] bol požiadaný, aby zasiahol a spor urovnal." # todo: NEW TRANSLATION
 iberian_culture.7.a: "Spravodlivosť musí zvíťaziť." # todo: NEW TRANSLATION
 iberian_culture.7.a.tt1: "Všetky [ShowReligionAdjective('sunni')] [Concept('pops','populácie')|e] v [target_location.GetName] získajú [ShowNamedValue('pop_satisfaction_mild_bonus')|+=2%] [Concept('pop_satisfaction','spokojnosť populácie')|e]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 iberian_culture.7.a.tt2: "Všetky [ShowReligionAdjective('catholic')] [Concept('pops','populácie')|e] v [target_location.GetName] stratia [ShowNamedValue('pop_satisfaction_mild_penalty')|+=2%] [Concept('pop_satisfaction','spokojnosť populácie')|e]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 iberian_culture.7.b: "Musíme chrániť svojich." # todo: NEW TRANSLATION
 iberian_culture.7.b.tt1: "Všetky [ShowReligionAdjective('sunni')] [Concept('pops','populácie')|e] v [target_location.GetName] stratia [ShowNamedValue('pop_satisfaction_mild_penalty')|+=2%] [Concept('pop_satisfaction','spokojnosť populácie')|e]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 iberian_culture.7.b.tt2: "Všetky [ShowReligionAdjective('catholic')] [Concept('pops','populácie')|e] v [target_location.GetName] získajú [ShowNamedValue('pop_satisfaction_mild_bonus')|+=2%] [Concept('pop_satisfaction','spokojnosť populácie')|e]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 iberian_culture.7.c: "Nech si to vyriešia sami." # todo: NEW TRANSLATION
 iberian_culture.8.title: "Spor o mudéjarské tradície" # todo: NEW TRANSLATION
 iberian_culture.8.desc: "V [target_location.GetName] sa miestni obyvatelia [ShowReligionAdjective('sunni')] opäť zhromaždili, aby oslávili jeden zo svojich tradičných sviatkov, zvyk, ktorý pretrváva už po celé generácie. Hoci mnohí považujú oslavy za neškodnú súčasť každodenného života, predstavitelia [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] na nás naliehajú, aby sme ich zakázali, pretože takéto verejné prejavy podkopávajú [ShowReligionAdjective('catholic')] charakter [ROOT.GetCountry.GetFlavorRank]." # todo: NEW TRANSLATION
 iberian_culture.8.a: "Nech oslavy pokračujú." # todo: NEW TRANSLATION
 iberian_culture.8.a.tt: "Všetky [ShowReligionAdjective('sunni')] [Concept('pops','populácie')|e] v [target_location.GetName] získajú [ShowNamedValue('pop_satisfaction_mild_bonus')|+=2%] [Concept('pop_satisfaction','spokojnosť populácie')|e]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 iberian_culture.8.b: "Ukončite oslavy." # todo: NEW TRANSLATION
 iberian_culture.8.b.tt: "Všetky [ShowReligionAdjective('sunni')] [Concept('pops','populácie')|e] v [target_location.GetName] stratia [ShowNamedValue('pop_satisfaction_severe_penalty')|+=2%] [Concept('pop_satisfaction','spokojnosť populácie')|e]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 iberian_culture.9.title: "Prosperujúca mudéjarská štvrť" # todo: NEW TRANSLATION
 iberian_culture.9.desc: "Mudéjarská štvrť v [target_location.GetName] prekvitá a priťahuje mnohých remeselníkov a obchodníkov, ktorých usilovnosť priniesla osade novú prosperitu. Hoci jej rastúce bohatstvo prospieva miestnemu hospodárstvu, niektorí miestni elitári sa začali obávať, že vplyv tejto komunity by jedného dňa mohol konkurovať ich vlastnému." # todo: NEW TRANSLATION
 iberian_culture.9.a: "Prosperita prospieva všetkým." # todo: NEW TRANSLATION
 iberian_culture.9.b: "Zabavte časť ich bohatstva, aby sme obmedzili ich vplyv." # todo: NEW TRANSLATION
 iberian_culture.9.b.tt: "Všetky [ShowReligionAdjective('sunni')] [Concept('pops','populácie')|e] v [target_location.GetName] stratia [ShowNamedValue('pop_satisfaction_severe_penalty')|+=2%] [Concept('pop_satisfaction','spokojnosť populácie')|e]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 iberian_culture.10.title: "Slávni mudéjarski lekári" # todo: NEW TRANSLATION
 iberian_culture.10.desc: "Mudéjarski lekári si v poslednom čase získavajú všeobecné uznanie po celej [ROOT.GetCountry.GetFlavorRank] a mnohí príslušníci [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] sa čoraz viac spoliehajú na ich odbornosť. Niektorí naši poradcovia teraz navrhujú, aby boli oficiálne vymenovaní za lekárov [ROOT.GetCountry.GetGovernment.GetCourtTitle]; vplyvní členovia [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] však tento návrh rozhodne odmietajú." # todo: NEW TRANSLATION
 iberian_culture.10.a: "Schopnosti sú dôležitejšie než vierovyznanie." # todo: NEW TRANSLATION
 iberian_culture.10.b: "Namiesto toho vymenujte lekára [ShowReligionGroupAdjectiveWithNoTooltip('christian')|U]." # todo: NEW TRANSLATION
 iberian_culture.11.title: "Konverzovia podozriví" # todo: NEW TRANSLATION
 iberian_culture.11.desc: "Do [ROOT.GetCountry.GetGovernment.GetCourtTitle] dorazila správa, že [target_character.GetName], zručný obchodník, ktorého rodina v minulosti prestúpila z [ShowReligionName('judaism')], bol obvinený z toho, že naďalej tajne praktizuje obrady svojej bývalej viery. Správa hovorí o dodržiavaní zakázaných modlitieb a tajných zhromaždeniach, iní však tvrdia, že tieto obvinenia pramenia zo závisti a sporov o dlhy." # todo: NEW TRANSLATION
 iberian_culture.11.a: "Naše náboženské súdy musia tieto herézy vyšetriť." # todo: NEW TRANSLATION
 iberian_culture.11.b: "Sú to ohováračské obvinenia!" # todo: NEW TRANSLATION
 iberian_culture.12.title: "[ShowCultureNameWithNoTooltip('sephardi')] Obvinení sefardskí obchodníci" # todo: NEW TRANSLATION
 iberian_culture.12.desc: "Niekoľko významných [ShowCultureName('sephardi')] obchodníkov z [target_location.GetName] bolo obvinených z hromadenia bohatstva nečestnými praktikami, napríklad využívaním daňových medzier, úžerníckym požičiavaním alebo manipuláciou cien vo svoj prospech. Hoci tieto obvinenia vzniesli ich obchodní rivali a nemôžeme s istotou vedieť, či sú pravdivé, musíme konať skôr, než sa konflikt ešte viac vyostrí." # todo: NEW TRANSLATION
 iberian_culture.12.a: "Skonfiškujte ich majetok." # todo: NEW TRANSLATION
 iberian_culture.12.a.tt: "Všetky [ShowCultureName('sephardi')] [ShowPopTypeName('burghers')] [Concept('pops','populácie')|e] v [target_location.GetName] stratia [ShowNamedValue('pop_satisfaction_severe_penalty')|+=2%] [Concept('pop_satisfaction','spokojnosť populácie')|e]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 iberian_culture.12.b: "Nemôžeme konať bez dôkazov." # todo: NEW TRANSLATION
 iberian_culture.12.b.tt: "Všetky [ShowPopTypeName('burghers')] [Concept('pops','populácie')|e] v [target_location.GetName], ktoré nie sú [ShowCultureName('sephardi')], stratia [ShowNamedValue('pop_satisfaction_severe_penalty')|+=2%] [Concept('pop_satisfaction','spokojnosť populácie')|e]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 iberian_culture.13.title: "Boj s horúčavou a morom" # todo: NEW TRANSLATION
 iberian_culture.13.desc: "V južných krajoch našej [ROOT.GetCountry.GetFlavorRank] si ľudia osvojili zvyk bieliť svoje domy haseným vápnom, aby ich ochránili pred horúčavou ostrého slnka. Verí sa tiež, že to pomáha predchádzať šíreniu chorôb. Obyvatelia [target_location.GetName] sa v poslednom čase potýkajú s nedostatkom haseného vápna a obrátili sa na [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')] so žiadosťou o pomoc pri ochrane svojich domovov." # todo: NEW TRANSLATION
 iberian_culture.13.a: "Zaistite im dostatok haseného vápna." # todo: NEW TRANSLATION
 iberian_culture.13.a.tt: "Všetky [Concept('pops','populácie')|e] v [target_location.GetName] získajú [ShowNamedValue('pop_satisfaction_mild_bonus')|+=2%] [Concept('pop_satisfaction','spokojnosť populácie')|e]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 iberian_culture.13.b: "Nemôžeme si dovoliť minúť ani mincu." # todo: NEW TRANSLATION
 iberian_culture.13.b.tt: "Všetky [Concept('pops','populácie')|e] v [target_location.GetName] stratia [ShowNamedValue('pop_satisfaction_severe_penalty')|+=2%] [Concept('pop_satisfaction','spokojnosť populácie')|e]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 iberian_culture.14.title: "Spor o Cañadas Reales" # todo: NEW TRANSLATION
 iberian_culture.14.desc: "So zmenou ročných období sa milióny oviec ženú po Cañadas Reales, historických kráľovských pastierskych cestách, ktoré križujú našu krajinu. Obyvatelia [target_location.GetName] však odmietajú dovoliť pastierom prechádzať cez svoju osadu, pretože sa obávajú, že zvieratá pošliapu ich polia." # todo: NEW TRANSLATION
 iberian_culture.14.a: "Potvrďte starodávne právo pastierov na prechod." # todo: NEW TRANSLATION
 iberian_culture.14.a.tt: "Všetky [ShowPopTypeName('peasants')] [Concept('pops','populácie')|e] v [target_location.GetName] stratia [ShowNamedValue('pop_satisfaction_severe_penalty')|+=2%] [Concept('pop_satisfaction','spokojnosť populácie')|e]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 iberian_culture.14.b: "Rozhodnite spor v prospech miestnych obyvateľov." # todo: NEW TRANSLATION
 iberian_culture.15.title: "Stret na Vodnom tribunáli" # todo: NEW TRANSLATION
 iberian_culture.15.desc: "Tradičný Vodný tribunál nedávno riešil spor medzi [target_location_1.GetName] a [target_location_2.GetName]. Pod spaľujúcim letným slnkom nemá kraj dostatok vody na to, aby zavlažil všetky polia v oboch osadách, a preto sa ich obyvatelia sporia o práva na jej rozdeľovanie." # todo: NEW TRANSLATION
 iberian_culture.15.a: "Prednosť musí dostať [target_location_1.GetNameWithNoTooltip]." # todo: NEW TRANSLATION
 iberian_culture.15.b: "Polia v [target_location_2.GetNameWithNoTooltip] sú dôležitejšie." # todo: NEW TRANSLATION
 iberian_culture.15.c: "Voda sa rozdelí rovnomerne." # todo: NEW TRANSLATION
 iberian_culture.16.title: "Ochrana fueros" # todo: NEW TRANSLATION
 iberian_culture.16.desc: "Miestni sudcovia fyzicky zabránili nášmu výbercovi daní, ktorého sme vyslali do [target_location.GetName], vstúpiť do mesta. Miestne elity sa odvolávajú na svoje starodávne #italic fueros#!, právne výsady, ktoré im zaručujú úplnú imunitu voči daniam [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')], pokiaľ ich výslovne neschváli ich vlastné zhromaždenie." # todo: NEW TRANSLATION
 iberian_culture.16.a: "Rešpektujte výsady." # todo: NEW TRANSLATION
 iberian_culture.16.b: "Potreby štátu sú prvoradé!" # todo: NEW TRANSLATION
 iberian_culture.17.title: "Banditi v pohorí Sierra" # todo: NEW TRANSLATION
 iberian_culture.17.desc: "Do [ROOT.GetCountry.GetGovernment.GetCourtTitle] dorazili správy, že ozbrojení zbojníci ovládli ťažko priechodné horské priesmyky v okolí [target_location.GetName]. Neustále plienia karavány a zásielky, čím vážne dusia obchod v celom kraji. Ak ich nezastavíme, k zbojníctvu sa môže pridať ešte viac ľudí." # todo: NEW TRANSLATION
 iberian_culture.17.a: "Nemáme mužov nazvyš." # todo: NEW TRANSLATION
 iberian_culture.17.b: "Zorganizujte výpravu, ktorá ich vyženie." # todo: NEW TRANSLATION
 iberian_culture.18.title: "Mudéjarské umenie" # todo: NEW TRANSLATION
 iberian_culture.18.desc: "Obyvatelia [ShowRegionName('iberia_region')] už po stáročia obdivujú [ShowReligionGroupAdjective('muslim')] architektonický štýl, ktorý prevládal v časoch al-'Andalus. Mnohí architekti začali do románskych a gotických stavieb začleňovať rôzne prvky mudéjarského umenia, či už geometrické ornamenty, alebo ozdobné štukové práce. [target_artist.GetName], ktorý slúži [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')], nedávno požiadal trón o povolenie použiť tento štýl pri kráľovských zákazkách." # todo: NEW TRANSLATION
 iberian_culture.18.a: "Schváľte jeho prácu." # todo: NEW TRANSLATION
 iberian_culture.18.b: "[ShowReligionGroupAdjectiveWithNoTooltip('muslim')] umenie sa nesmie spájať s trónom." # todo: NEW TRANSLATION
 iberian_culture.19.title: "Hispánska gotika" # todo: NEW TRANSLATION
 iberian_culture.19.desc: "Stavitelia z celej [ROOT.GetCountry.GetFlavorRank] začali rozvíjať architektonický štýl, aký nemá v kresťanskom svete obdobu. Inšpirovaní vysokými katedrálami západných krajín a pevnými stavebnými tradíciami našich vlastných krajov vytvorili pamiatky, ktoré hlásajú slávu Boha aj veľkosť [ROOT.GetCountry.GetName]. Tento štýl, ktorý sa začal nazývať hispánskou gotikou, by mohol zanechať stopu v krajine na celé stáročia, ak sa ho rozhodneme podporiť." # todo: NEW TRANSLATION
 iberian_culture.19.a: "Nech naša sláva prehovára cez kameň!" # todo: NEW TRANSLATION
 iberian_culture.19.b: "Naše zdroje sa dajú využiť lepšie." # todo: NEW TRANSLATION
 iberian_culture.20.title: "Protorrenacimiento" # todo: NEW TRANSLATION
 iberian_culture.20.desc: "Nové umelecké myšlienky známe ako [ShowInstitutionNameWithNoTooltip('renaissance')] sa z [ShowRegionName('italy_region')] začali dostávať do našej [ROOT.GetCountry.GetFlavorRank] a mnohí naši architekti a maliari na ne reagujú spájaním týchto vplyvov s domácimi tradíciami. Mnohí si teraz objednávajú diela inšpirované týmto vznikajúcim štýlom a ak ho podporíme, toto nové umelecké hnutie by mohlo priniesť vek prosperity a inovácií." # todo: NEW TRANSLATION
 iberian_culture.20.a: "Prijmime túto novú tradíciu." # todo: NEW TRANSLATION
 iberian_culture.20.b: "Zachovajme naše staré tradície." # todo: NEW TRANSLATION
 iberian_culture.21.title: "Konverzia nových kresťanov" # todo: NEW TRANSLATION
 iberian_culture.21.desc: "Značný počet obyvateľov [ShowReligionAdjective('judaism')] v [target_location.GetName] sa rozhodol dobrovoľne prijať krst a vieru [ShowReligionName('catholic')]. Mnohí oslavujú týchto konvertitov ako dôkaz úspechu Cirkvi, iní však pochybujú o ich úprimnosti a nazývajú ich novými kresťanmi, aby ich odlíšili od tých, ktorých rodiny vyznávajú túto vieru už po celé generácie." # todo: NEW TRANSLATION
 iberian_culture.21.a: "Privítajme ich vo viere." # todo: NEW TRANSLATION
 iberian_culture.21.b: "Prinúťme ďalších, aby konvertovali." # todo: NEW TRANSLATION
 iberian_culture.21.b.tt: "Všetky [ShowReligionAdjective('judaism')] [Concept('pops','populácie')|e] v [target_location.GetName] stratia [ShowNamedValue('pop_satisfaction_mild_penalty')|+=2%] [Concept('pop_satisfaction','spokojnosť populácie')|e]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 iberian_culture.22.title: "Beh býkov" # todo: NEW TRANSLATION
 iberian_culture.22.desc: "Obyvatelia [ShowLocationName('cuellar')], osady, o ktorej sa verí, že sa v nej koná najstarší beh býkov v [ShowRegionName('iberia_region')], majú problém financovať svoju každoročnú slávnosť. Požiadali o finančné prostriedky [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')] a sľúbili, že ak im poskytneme dotáciu, slávnosť zasvätia [target_ruler.GetName] namiesto Panny Márie Ružencovej, svojej patrónky, ktorú slávnosť zvyčajne oslavuje." # todo: NEW TRANSLATION
 iberian_culture.22.a: "Musíme im pomôcť!" # todo: NEW TRANSLATION
 iberian_culture.22.b: "Túto barbarskú slávnosť nemôžeme podporiť!" # todo: NEW TRANSLATION
 iberian_culture.22.b.tt: "Všetky [Concept('pops','populácie')|e] v [ShowLocationName('cuellar')] stratia [ShowNamedValue('pop_satisfaction_severe_penalty')|+=2%] [Concept('pop_satisfaction','spokojnosť populácie')|e]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 iberian_culture.23.title: "Kult alumbradov" # todo: NEW TRANSLATION
 iberian_culture.23.desc: "K [ROOT.GetCountry.GetGovernment.GetCourtTitle] a cirkevnej hierarchii začali prichádzať znepokojivé správy o zvláštnom mystickom bratstve, ktoré potichu získava členov po celom [ROOT.GetCountry.GetFlavorRank]. Jeho členovia sa nazývajú osvietenci a tvrdia, že skutočne veriaci môžu prijať božské osvietenie priamo od Ducha Svätého, takže kňazi, sviatosti, púte a dokonca aj svätá omša sú zbytočné. Zástupcovia [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] sa obávajú, že ich učenie pripomína protestantské herézy, a žiadajú začatie vyšetrovania." # todo: NEW TRANSLATION
 iberian_culture.23.a: "Zakročme proti osvietencom." # todo: NEW TRANSLATION
 iberian_culture.23.b: "Nie za každou fámou sa skrýva heretik." # todo: NEW TRANSLATION
 iberian_culture.23.b.tt: "Ak kult necháme bez dozoru, jeho vplyv sa môže ďalej šíriť" # todo: NEW TRANSLATION
 iberian_culture.24.title: "Maska padá" # todo: NEW TRANSLATION
 iberian_culture.24.desc: "Naša neochota vyšetrovať fámy o osvietencoch sa ukázala ako chyba. Vplyv kultu v [target_province.GetName] výrazne vzrástol a jeho členovia sa otvorene priznali k [ShowReligionAdjective('lutheran')] heréze. [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] teraz obviňuje [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')], že ignoroval varovania a žiadosti o vyšetrovanie. Tvrdí, že rozhodný zásah by tomuto prepuknutiu herézy zabránil." # todo: NEW TRANSLATION
 iberian_culture.24.a: "Nemôžeme prenasledovať každého odporcu." # todo: NEW TRANSLATION
 iberian_culture.24.a.tt: "15 % všetkých [ShowReligionAdjective('catholic')] [Concept('pops','populácie')|e] v [target_province.GetName] prestúpi na [ShowReligionName('lutheran')]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 iberian_culture.24.a.tt2: "Všetky [ShowReligionAdjective('catholic')] [Concept('pops','populácie')|e] v [target_province.GetName] stratia [ShowNamedValue('pop_satisfaction_severe_penalty')|+=2%] [Concept('pop_satisfaction','spokojnosť populácie')|e]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 iberian_culture.24.b: "Mali pravdu a musíme konať obozretne." # todo: NEW TRANSLATION
 iberian_culture.24.b.tt: "5 % všetkých [ShowReligionAdjective('catholic')] [Concept('pops','populácie')|e] v [target_province.GetName] prestúpi na [ShowReligionName('lutheran')]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 iberian_culture.24.b.tt2: "Všetky [Concept('pops','populácie')|e] v [target_province.GetName] stratia [ShowNamedValue('pop_satisfaction_mild_penalty')|+=2%] [Concept('pop_satisfaction','spokojnosť populácie')|e]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 iberian_culture.25.title: "Zachovanie [ShowBuildingTypeNameWithNoTooltip('irrigation_systems')]" # todo: NEW TRANSLATION
 iberian_culture.25.desc: "Za vlády [ShowReligionGroupAdjective('muslim')] nad [ShowAreaName('granada_area')] vznikli dômyselné [ShowBuildingTypeName('irrigation_systems')], ktoré privádzajú vzácnu vodu zo Sierra Nevady na polia a do sadov úrodných údolí. Boje o tento región tieto systémy, od ktorých miestni obyvatelia už dlho závisia pri obžive, značne poškodili." # todo: NEW TRANSLATION
 iberian_culture.25.a: "Podporíme ich obnovu." # todo: NEW TRANSLATION
 iberian_culture.25.b: "Túto investíciu si nemôžeme dovoliť." # todo: NEW TRANSLATION
 iberian_culture.26.title: "Cesta do Santiaga" # todo: NEW TRANSLATION
 iberian_culture.26.desc: "Každý rok sa tisíce pútnikov vydávajú na dlhú cestu do [ShowLocationName('santiago_compostela')]. Ich putovanie prinieslo prosperitu nespočetným osadám, no cesta je stále náročná, pretože mnohé cesty a mosty pozdĺž nej schátrali. Obyvatelia [target_location.GetName] požiadali [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')], aby zlepšil cesty vedúce do Compostely. Tvrdia, že by to podporilo zbožnosť a zároveň posilnilo obchod v celom [ROOT.GetCountry.GetFlavorRank]." # todo: NEW TRANSLATION
 iberian_culture.26.a: "Na pútnikoch nešetrite." # todo: NEW TRANSLATION
 iberian_culture.26.b: "Momentálne máme dôležitejšie priority." # todo: NEW TRANSLATION
 iberian_culture.27.title: "Vyblednutá tradícia" # todo: NEW TRANSLATION
 iberian_culture.27.desc: "Už celé generácie spievajú trubadúri z [ShowAreaName('galicia_area')] svoje tradičné #italic cantigas#! v [ShowDialectName('galician_dialect')], prestížnom literárnom jazyku, ktorého vplyv siahal ďaleko za hranice [ShowAreaNameWithNoTooltip('galicia_area')]. Keďže však tento jazyk nie je úradným jazykom [ROOT.GetCountry.GetGovernment.GetCourtTitle] v [ROOT.GetCountry.GetAltAdjective('L')], táto tradícia pomaly upadá." # todo: NEW TRANSLATION # todo: COUNTRY CASE
 iberian_culture.27.a: "Podporíme zachovanie tejto tradície." # todo: NEW TRANSLATION
 iberian_culture.27.b: "Posilnime používanie nášho jazyka." # todo: NEW TRANSLATION
 iberian_culture.28.title: "Rybárske bratstvá" # todo: NEW TRANSLATION
 iberian_culture.28.desc: "Rybári z [target_location.GetName] sa združili do cechu, ktorý nazývajú Rybárske bratstvo. Jeho cieľom je údajne regulovať rybolov, uchovávať námorné znalosti a chrániť záujmy tých, ktorí sa vydávajú na nebezpečné vody. Bratstvo je tiež pilierom miestnej komunity, ktorý jej v ťažkých časoch pomáha odolávať nepriazni tým, že poskytuje pomoc svojim členom a ich rodinám." # todo: NEW TRANSLATION
 iberian_culture.28.a: "Posilnime ich cech." # todo: NEW TRANSLATION
 iberian_culture.28.b: "Ich odborné znalosti potrebujeme pre námorníctvo." # todo: NEW TRANSLATION
 iberian_culture.29.title: "Rozkvet valencijského [ShowGoodsNameWithNoTooltip('silk')]" # todo: NEW TRANSLATION
 iberian_culture.29.desc: "Tkáči z [ShowLocationName('valencia')] sa preslávili jemnými látkami z [ShowGoodsName('silk')], ktorými obdivujú ľudia v celej [ShowContinentName('europe')]. Bohatstvo, ktoré prinieslo toto prekvitajúce odvetvie, naplnilo pokladnice obchodníkov aj [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')], no [ROOT.GetCountry.GetGovernment.GetCourtTitle] sa nevie zhodnúť na tom, ako toto bohatstvo využiť." # todo: NEW TRANSLATION
 iberian_culture.29.a: "Investujme ho do miestneho priemyslu." # todo: NEW TRANSLATION
 iberian_culture.29.b: "Toto bohatstvo musí slúžiť [ROOT.GetCountry.GetFlavorRank]." # todo: NEW TRANSLATION
 iberian_culture.30.title: "Vinice v Rioji" # todo: NEW TRANSLATION
 iberian_culture.30.desc: "Voňavé vinice v úrodných údoliach rieky Ebro prosperujú už celé generácie. Táto oblasť produkuje vína výnimočnej kvality, čo upútalo pozornosť našich [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')]. Tí teraz vidia príležitosť vytvoriť významné odvetvie rozšírením viníc po celom [ROOT.GetCountry.GetFlavorRank], no [ROOT.GetCountry.GetGovernment.GetEstateName('peasants_estate')] protestujú, že by to mohlo narušiť miestne zvyky, ktoré po stáročia usmerňovali výrobu vína." # todo: NEW TRANSLATION
 iberian_culture.30.a: "Rozšírme naše vinice." # todo: NEW TRANSLATION
 iberian_culture.30.b: "Chráňme naše vinárske tradície." # todo: NEW TRANSLATION

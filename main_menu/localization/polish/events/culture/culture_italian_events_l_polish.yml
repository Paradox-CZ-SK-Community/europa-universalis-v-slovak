l_polish:
 italian_renaissance_culture.1.title: "Zpochybnenie $FLO_ADJ$ [ShowGoodsNameWithNoTooltip('wool')]" # todo: NEW TRANSLATION
 italian_renaissance_culture.1.desc: "Kým obchodné cechy v [ShowLocationName('florence')] dlhodobo dominovali obchodu s [ShowGoodsName('wool')] v [ShowRegionName('italy_region')], nedávne rozšírenie [ROOT.GetCountry.GetAdjective] výroby [ShowGoodsNameWithNoTooltip('wool')] viedlo k rastúcej dôvere medzi [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')], že [ROOT.GetCountry.GetNameWithNoTooltip] možno bude schopné spochybniť monopol $FLO_ADJ$ obchodníkov nad trhmi.\n\nAk [ROOT.GetCountry.GetGovernment.GetCourtTitle] poskytne primeranú finančnú podporu, niektorí v rámci [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('burghers_estate')] ponúkli založenie nových obchodných cechov na posilnenie rastúceho [ROOT.GetCountry.GetAdjectiveWithNoTooltip] priemyslu [ShowGoodsNameWithNoTooltip('wool')]. Iní v [ROOT.GetCountry.GetGovernment.GetCourtTitle] však uprednostňujú ponechať [ROOT.GetCountry.GetGovernment.GetEstateName('peasants_estate')] autonómnymi vo výrobe [ShowGoodsNameWithNoTooltip('wool')]." # todo: NEW TRANSLATION
 italian_renaissance_culture.1.a: "Zveriť založenie [ShowGoodsNameWithNoTooltip('wool')] cechov [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('burghers_estate')]." # todo: NEW TRANSLATION
 italian_renaissance_culture.1.b: "Udržať autonómiu [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('peasants_estate')] vo výrobe [ShowGoodsNameWithNoTooltip('wool')]." # todo: NEW TRANSLATION
 ita_culture_rival_wool_guild_locations.tt: "Všetky [ShowGoodsNameWithNoTooltip('wool')] [locations|e], ktoré vlastníme v [ShowRegionName('italy_region')], dostanú [ShowModifier('italian_culture_rival_wool_trade')] na 60 rokov a budú rozšírené o #G +1.00#!, ak ešte nie sú na maximálnej úrovni" # todo: NEW TRANSLATION
 italian_renaissance_culture.2.title: "Vyprazdňovanie vidieka" # todo: NEW TRANSLATION
 italian_renaissance_culture.2.desc: "Odkedy cez naše krajiny prešiel [ShowSituationName('black_death')], mnohé vidiecke oblasti v [ROOT.GetCountry.GetName] sú silne odľudnené. Hoci [target_location.GetName] bol tiež ťažko zasiahnutý [ShowSituationNameWithNoTooltip('black_death')], mnohí preživší chcú migrovať tam v nádeji získať prístup k dôležitým zdrojom, ktoré sú teraz v dôsledku moru nedostupné.\n\nZatiaľ čo niektorí v [ROOT.GetCountry.GetGovernment.GetCourtTitle] vidia v tom príležitosť na ďalšiu urbanizáciu a obnovu [target_location.GetNameWithNoTooltip], povoliť [ROOT.GetCountry.GetGovernment.GetEstateName('peasants_estate')] opustiť mnohé z týchto kľúčových vidieckych oblastí po celom [ROOT.GetCountry.GetNameWithNoTooltip] môže mať vážne následky." # todo: NEW TRANSLATION
 italian_renaissance_culture.2.a: "Ďalšie podporiť presun do [target_location.GetNameWithNoTooltip]." # todo: NEW TRANSLATION
 italian_renaissance_culture.2.b: "Rozmiestniť pomoc na vidiek, aby sa spomalila migrácia." # todo: NEW TRANSLATION
 italian_renaissance_culture.3.title: "Znovunájdenie starovekého [ShowCultureNameWithNoTooltip('greek_culture')] myslenia" # todo: NEW TRANSLATION
 italian_renaissance_culture.3.desc: "Odkedy sa ideály [ShowAgeName('age_2_renaissance')] rozšírili po [ShowRegionName('italy_region')], rastie záujem o získavanie a preklad starovekej [ShowCultureName('greek_culture')] literatúry medzi vedcami [ShowCultureGroupName('italian_group')]. Snahou etablovať [ROOT.GetCountry.GetNameWithNoTooltip] ako jeden z najvýznamnejších štátov v [ShowRegionNameWithNoTooltip('italy_region')], mnohí radcovia v [ROOT.GetCountry.GetGovernment.GetCourtTitle] naliehajú na [target_character.GetName], aby podporil znovunájdenie týchto starobylých diel." # todo: NEW TRANSLATION
 italian_renaissance_culture.3.a: "Podporiť znovunájdenie týchto umení!" # todo: NEW TRANSLATION
 italian_renaissance_culture.3.b: "Poskytnúť plný štátny patronát." # todo: NEW TRANSLATION
 italian_renaissance_culture.3.c: "Držať sa našich tradícií." # todo: NEW TRANSLATION
 encourage_humanist_thought_for_rewards_tt: "Podpora prechodu k [ShowSocietyDirectionName('humanist')] ďalej otvára možnosť, aby sa [ROOT.GetCountry.GetCapital.GetName] stalo významným centrom [ShowSocietyDirectionNameWithNoTooltip('humanist')] myslenia" # todo: NEW TRANSLATION
 italian_renaissance_culture.4.title: "[target_location.GetNameWithNoTooltip], centrum humanizmu" # todo: NEW TRANSLATION
 italian_renaissance_culture.4.desc: "Odkedy ideály [ShowAgeName('age_2_renaissance')] prešli cez [ShowRegionName('italy_region')], došlo k znovunájdeniu starovekej [ShowCultureName('greek_culture')] literatúry, preloženej z rôznych rukopisov získaných z $BYZ_ADJ$ záznamov. Znovunájdenie týchto textov viedlo k dramatickému posunu medzi mnohými filozofmi v [ShowRegionNameWithNoTooltip('italy_region')], inšpirujúc nový prístup k humanizmu. Keďže tieto snahy sú do veľkej miery podporované [ROOT.GetCountry.GetAdjective] [ROOT.GetCountry.GetGovernment.GetCourtTitle], [target_location.GetName] sa premenil na jedno z popredných center [ShowSocietyDirectionName('humanist')] štúdií v [ShowRegionNameWithNoTooltip('italy_region')], pričom mnohí učenci nadobudli sídlo v [target_location.GetRank.GetName]. Ako sa ideály [ShowAgeName('age_2_renaissance')] naďalej šíria, [target_location.GetNameWithNoTooltip] bezpochyby zostane dôležitou silou za nimi." # todo: NEW TRANSLATION
 italian_renaissance_culture.4.a: "[target_location.GetNameWithNoTooltip] sa stane majákom [ShowSocietyDirectionNameWithNoTooltip('humanist')] myslenia v [ShowRegionNameWithNoTooltip('italy_region')]." # todo: NEW TRANSLATION
 italian_renaissance_culture.4.b: "Obmedziť rastúce šírenie [ShowSocietyDirectionNameWithNoTooltip('humanist')] myslenia." # todo: NEW TRANSLATION
 italian_renaissance_culture.5.title: "Vznikajúci umelec priláka [ROOT.GetCountry.GetGovernment.GetCourtTitle]" # todo: NEW TRANSLATION
 italian_renaissance_culture.5.desc: "S nástupom [ShowAgeName('age_2_renaissance')] sa v [ShowRegionName('italy_region')] objavilo mnoho pozoruhodných nových umelcov, niektorí v [ROOT.GetCountry.GetGovernment.GetCourtTitle] si všimli [target_artist.GetName], ktorý si získal vážnu pozornosť v [ROOT.GetCountry.GetCapital.GetName]. Niektorí blízki radcovia [target_character.GetName] naliehajú, aby [target_character.GetHimHer] patronoval [target_artist.GetNameWithNoTooltip], lebo časom by [target_artist.GetHeShe] mohol vyrásť na jedného z najtalentovanejších umelcov v [ShowRegionNameWithNoTooltip('italy_region')]." # todo: NEW TRANSLATION
 italian_renaissance_culture.5.a: "Zamestnať [target_artist.GetHimHer] pre [ROOT.GetCountry.GetGovernment.GetCourtTitle]!" # todo: NEW TRANSLATION
 italian_renaissance_culture.5.b: "Nevyžadujeme [target_artist.GetHisHer] služby." # todo: NEW TRANSLATION
 italian_renaissance_culture.6.title: "Šírenie [ShowSocietyDirectionNameWithNoTooltip('humanist')] ideí z [target_location.GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 italian_renaissance_culture.6.desc: "Výnimoční učenci z [target_location.GetNameWithNoTooltip], ktorý vyznávajú [ShowSocietyDirectionName('humanist')] idey, sa usadili v [ROOT.GetCountry.GetCapital.GetName], snažiac sa šíriť novo preloženú starovekú [ShowCultureName('greek_culture')] literatúru medzi miestne obyvateľstvo. Zatiaľ čo niektorí v [ROOT.GetCountry.GetGovernment.GetCourtTitle] sa o preložené texty zaujímajú, iní naliehajú, aby sa [ShowSocietyDirectionNameWithNoTooltip('humanist')] idey obmedzili, aby sa predišlo možnej nestabilite." # todo: NEW TRANSLATION
 italian_renaissance_culture.6.a: "Povoliť učcom šíriť preloženú literatúru." # todo: NEW TRANSLATION
 italian_renaissance_culture.6.b: "Obmedziť šírenie preloženej literatúry." # todo: NEW TRANSLATION
 italian_renaissance_culture.7.title: "Patronát v nových umeniach" # todo: NEW TRANSLATION
 italian_renaissance_culture.7.desc: "Po [ShowSituationName('black_death')] sa obchodné podmienky pre mnohých [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')] ukázali byť nákladné, s ťažkosťami pri transporte tovaru na dlhšie vzdialenosti a zvýšeným dopytom po základných potrebách. Avšak rozmach [ShowAgeName('age_2_renaissance')] viedol mnohých v [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('burghers_estate')] k patronovaniu nových umení namiesto čisto obchodnej činnosti.\n\nKeď sa umelecký patronát ukazuje byť hodnotnou investíciou pre [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('burghers_estate')], niektorí naliehajú na [ROOT.GetCountry.GetGovernment.GetCourtTitle], aby ďalej podporil rast týchto nových umení." # todo: NEW TRANSLATION
 italian_renaissance_culture.7.a: "Patronovať rast týchto nových umení." # todo: NEW TRANSLATION
 italian_renaissance_culture.7.b: "Namiesto toho priradiť príjmy do štátnej pokladnice" # todo: NEW TRANSLATION
 italian_renaissance_culture.8.title: "Popredný condottiero v [ROOT.GetCountry.GetCapital.GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 italian_renaissance_culture.8.desc: "Na [ROOT.GetCountry.GetGovernment.GetCourtTitle] dorazila správa, že prominentný condottiero [target_character_2.GetNameWithNoTooltip] prichádza do [ROOT.GetCountry.GetCapital.GetName]. Po dosiahnutí niekoľkých vojenských víťazstiev jeho príchod vyvolal diskusie v [ROOT.GetCountry.GetGovernment.GetCourtTitle] o získaní jeho služby, zatiaľ čo je v [ROOT.GetCountry.GetCapital.GetName], pretože jeho bojové schopnosti môžu byť rozhodujúce, ak by sa konflikt dotkol [ROOT.GetCountry.GetName]." # todo: NEW TRANSLATION
 italian_renaissance_culture.8.a: "Zamestnať [target_character_2.GetNameWithNoTooltip] na zaistenie bezpečnosti [ROOT.GetCountry.GetNameWithNoTooltip]." # todo: NEW TRANSLATION
 italian_renaissance_culture.8.b: "Nevyžadujeme [target_character_2.GetHisHer] odborné znalosti v boji." # todo: NEW TRANSLATION
 italian_renaissance_culture.9.title: "Rastúci vplyv [ROOT.GetCountry.GetNameWithNoTooltip] pritahuje condottieri" # todo: NEW TRANSLATION
 italian_renaissance_culture.9.desc: "S rozšírením [ROOT.GetCountry.GetAdjective] vplyvu v [ShowRegionName('italy_region')] sa mnohé condottieri žoldnierske spoločnosti obrátili na [ROOT.GetCountry.GetGovernment.GetCourtTitle] v nádeji na získanie zamestnania. Zatiaľ čo niektorí v [ROOT.GetCountry.GetGovernment.GetCourtTitle] podporujú ich nábor, pretože rozširovanie [ROOT.GetCountry.GetNameWithNoTooltip] zvyšuje náklady na zbrojenie armády, iní sa obávajú, že títo condottieri konajú z číreho oportunizmu a snažia sa stať nepostrádateľnými tým, že podporujú nadmernú závislosť na svojich vojakov." # todo: NEW TRANSLATION
 italian_renaissance_culture.9.a: "Usilovať o priazeň a zamestnať týchto condottieri žoldnierov." # todo: NEW TRANSLATION
 italian_renaissance_culture.9.b: "Nemôžeme riskovať, že budeme povinní týmto spoločnostiam." # todo: NEW TRANSLATION
 italian_renaissance_culture.10.title: "[condottieri_company.GetNameWithNoTooltip] požaduje vyššiu platbu" # todo: NEW TRANSLATION
 italian_renaissance_culture.10.desc: "Prominentní condottieri [condottieri_company.GetName] poslali formálnu požiadavku [ROOT.GetCountry.GetAdjective] [ROOT.GetCountry.GetGovernment.GetCourtTitle] na zvýšenie odmien, lebo veria, že štát ich nedostatočne odmeňuje za ich talenty.\n\nHoci je nepravdepodobné, že by [condottieri_company.GetNameWithNoTooltip] otvorene zradili svoju zmluvu s [ROOT.GetCountry.GetNameWithNoTooltip], odmietnutie ich požiadaviek ich môže urobiť menej spoľahlivými." # todo: NEW TRANSLATION
 italian_renaissance_culture.10.a: "Uspokojiť požiadavky [condottieri_company.GetNameWithNoTooltip]." # todo: NEW TRANSLATION
 italian_renaissance_culture.10.b: "Odmietnuť pridelenie ďalších platieb [condottieri_company.GetNameWithNoTooltip]." # todo: NEW TRANSLATION
 italian_renaissance_culture.11.title: "Šírenie $FLO_ADJ$ kultúry" # todo: NEW TRANSLATION
 italian_renaissance_culture.11.desc: "Hoci je [ROOT.GetCountry.GetCapital.GetName] vplyvným [ROOT.GetCountry.GetCapital.GetRank.GetName], nie je žiadnym tajomstvom, že zaostáva za slávnym [ShowLocationName('florence')], ktoré sa stalo dominantným [ShowLocationRankName('city')] v [ShowRegionNameWithNoTooltip('italy_region')].\n\nS cieľom posilniť prestíž [ROOT.GetCountry.GetCapital.GetNameWithNoTooltip] navrhli niektorí členovia [ROOT.GetCountry.GetGovernment.GetCourtTitle], aby sme prevzali aspekty novej kultúrnej architektúry v [ShowLocationNameWithNoTooltip('florence')]." # todo: NEW TRANSLATION
 italian_renaissance_culture.11.a: "Prevziať aspekty $FLO_ADJ$ kultúry." # todo: NEW TRANSLATION
 italian_renaissance_culture.11.b: "Chrániť odlišnú kultúru [ROOT.GetCountry.GetCapital.GetNameWithNoTooltip]." # todo: NEW TRANSLATION
 italian_renaissance_culture.12.title: "Oživenie [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('peasants_estate')]" # todo: NEW TRANSLATION
 italian_renaissance_culture.12.desc: "Hoci všetky spoločenské triedy v [ROOT.GetCountry.GetName] boli zasiahnuté [ShowSituationName('black_death')], nijaká nebola zdevastovaná viac ako [ROOT.GetCountry.GetGovernment.GetEstateName('peasants_estate')]. Kým roky po tom priniesli mnohých v [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')] k investovaniu do umenia [ShowAgeName('age_2_renaissance')], čo viedlo k kultúrnemu znovuzrodeniu [ROOT.GetCountry.GetAdjectiveWithNoTooltip] elity, mnohí z [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('peasants_estate')] zostali značne zasiahnutí následkami [ShowSituationNameWithNoTooltip('black_death')].\n\nAby sme pomohli oživiť ťažko zasiahnuté [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('peasants_estate')], niektoré súcitné hlasy v [ROOT.GetCountry.GetGovernment.GetCourtTitle] navrhujú znížiť náš patronát umenia v prospech presunutia prostriedkov na ich obnovenie." # todo: NEW TRANSLATION
 italian_renaissance_culture.12.a: "Náš patronát umení bude pokračovať nerušene." # todo: NEW TRANSLATION
 italian_renaissance_culture.12.b: "Presunúť prostriedky na pomoc oslabenému [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('peasants_estate')]." # todo: NEW TRANSLATION
 italian_renaissance_culture.13.title: "[target_artist.GetNameWithNoTooltip] prekladá staroveký [ShowCultureNameWithNoTooltip('greek_culture')] rukopis" # todo: NEW TRANSLATION
 italian_renaissance_culture.13.desc: "Dokončený preklad starovekého rukopisu [ShowCultureName('greek_culture')] od [target_artist.GetName] pritiahlo pozornosť učencov po celom [ROOT.GetCountry.GetName], mnohí sa tešia, že sa k prekladu dostanú. Niektorí však vidia príležitosť posilniť [ROOT.GetCountry.GetAdjectiveWithNoTooltip] prestíž a naliehajú na [target_character.GetName], aby podporil rozšírenie prekladu po celom [ShowContinentName('europe')]." # todo: NEW TRANSLATION
 italian_renaissance_culture.13.a: "Chváliť [target_artist.GetNameWithNoTooltip] za [target_artist.GetHisHer] prácu na preklade!" # todo: NEW TRANSLATION
 italian_renaissance_culture.13.b: "Šíriť [target_artist.GetHisHer] dielo široko a ďaleko!" # todo: NEW TRANSLATION
 italian_renaissance_culture.13.c: "Udržať ho obmedzené len pre členov [ROOT.GetCountry.GetGovernment.GetCourtTitle]." # todo: NEW TRANSLATION
 italian_renaissance_culture.14.title: "Schopnosti [target_artist.GetNameWithNoTooltip] zapôsobia na [ROOT.GetCountry.GetGovernment.GetCourtTitle]" # todo: NEW TRANSLATION
 italian_renaissance_culture.14.desc: "Odkedy získal patronát [ROOT.GetCountry.GetGovernment.GetCourtTitle], [target_artist.GetName] sa ukázal byť cenným prínosom pre [target_character.GetName], pričom jeho schopnosti si získali uznanie vo vysokých kruhoch. Od vysokopostavených členov [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] až po vplyvných [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')], prítomnosť [target_artist.GetNameWithNoTooltip] mala citeľný vplyv a výrazne posilnila vplyv [target_character.GetNameWithNoTooltip]." # todo: NEW TRANSLATION
 italian_renaissance_culture.14.a: "[target_artist.GetHisHer|U] diela významne obohatili [ROOT.GetCountry.GetGovernment.GetCourtTitle]!" # todo: NEW TRANSLATION
 italian_renaissance_culture.15.title: "[ShowArtistTypeName('architect')] rastúcej povesti" # todo: NEW TRANSLATION
 italian_renaissance_culture.15.desc: "Po dokončení niekoľkých architektonických projektov v [ROOT.GetCountry.GetCapital.GetName], [target_artist.GetName] zvýšil svoju povesť v celom [ROOT.GetCountry.GetName] a už pritiahol patronát mnohých významných rodín medzi [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')]. Niektorí v [ROOT.GetCountry.GetGovernment.GetCourtTitle] navrhujú zamestnať [target_artist.GetHimHer], pretože by mohol byť rozhodujúcim katalyzátorom pri plánovaní architektonického znovuzrodenia [ROOT.GetCountry.GetCapital.GetNameWithNoTooltip] použitím klasických techník." # todo: NEW TRANSLATION
 italian_renaissance_culture.15.a: "Ponúknime [target_artist.GetHimHer] štátny patronát." # todo: NEW TRANSLATION
 italian_renaissance_culture.15.b: "Nemáme záujem realizovať architektonické projekty." # todo: NEW TRANSLATION
 italian_renaissance_culture.16.title: "[target_artist.GetNameWithNoTooltip] žiada o ďalšie zdroje [ROOT.GetCountry.GetGovernment.GetCourtTitle]" # todo: NEW TRANSLATION
 italian_renaissance_culture.16.desc: "Počas práce na diele inšpirovanom klasickým umením [target_artist.GetName] požiadal [ROOT.GetCountry.GetGovernment.GetCourtTitle] o dodatočné zdroje. Vyjadril, že projekt je náročnejší, než očakával, a sľubuje, že dodatočné financovanie projektu bude stáť za náklady a prinesie kultúrnu povesť [ROOT.GetCountry.GetGovernment.GetCourtTitle]." # todo: NEW TRANSLATION
 italian_renaissance_culture.16.a: "Dodať [target_artist.GetHimHer] potrebné dodatočné zdroje." # todo: NEW TRANSLATION
 italian_renaissance_culture.16.b: "Nemôžeme si to dovoliť." # todo: NEW TRANSLATION
 italian_renaissance_culture.17.title: "Nespokojný [target_rival_artist.GetArtistType.GetNameWithNoTooltip] v [target_rival.GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 italian_renaissance_culture.17.desc: "Hoci je [target_rival_artist.GetName] zamestnaný u nášho rivala [target_rival.GetName], jeho práce si získali renomé v celom [ShowRegionName('italy_region')]. Nedávno sa však rozšírili klebety, že [target_rival_artist.GetHeShe] je nespokojný s patronátom, ktorý mu poskytuje [target_rival.GetNameWithNoTooltip].\n\nVidieť príležitosť oslabiť vplyv [target_rival.GetNameWithNoTooltip] a zabezpečiť služby renomovaného [target_rival_artist.GetArtistType.GetName], niektorí v [ROOT.GetCountry.GetGovernment.GetCourtTitle] navrhujú dohodu v zákulisí, aby sme získali [target_rival_artist.GetNameWithNoTooltip] do nášho dvora." # todo: NEW TRANSLATION
 italian_renaissance_culture.17.a: "Rýchlo konať a zamestnať [target_rival_artist.GetNameWithNoTooltip]!" # todo: NEW TRANSLATION
 italian_renaissance_culture.17.b: "Nedovolíme si zamestnávať umelcov s väzbami na [target_rival.GetNameWithNoTooltip]." # todo: NEW TRANSLATION
 italian_renaissance_culture.18.title: "[target_artist.GetNameWithNoTooltip] a umenie olejomaľby" # todo: NEW TRANSLATION
 italian_renaissance_culture.18.desc: "Hoci $FLA_ADJ$ umelci vytvorili jedinečné olejomaľby, technika bola dlho obmedzená na Nizozemské provincie. Avšak [target_artist.GetName] sa nedávno vrátil z nížiny do [ROOT.GetCountry.GetCapital.GetName], dúfajúc, že vybuduje odlišnú [ShowCultureGroupName('italian_group')] tradíciu olejomaľby.\n\nZáujem podporiť [target_artist.GetHimHer] rozvíjať túto tradíciu v [ShowRegionName('italy_region')], mnohí v [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] naliehajú na [target_character.GetName], aby [target_artist.GetHimHer] poskytol patronát." # todo: NEW TRANSLATION
 italian_renaissance_culture.18.a: "[target_artist.GetHisHer|U] odlišná forma umenia si zaslúži patronát!" # todo: NEW TRANSLATION
 italian_renaissance_culture.18.b: "Nemáme záujem o [target_artist.GetHisHer] štýl maľby." # todo: NEW TRANSLATION
 italian_renaissance_culture.19.title: "[target_artist.GetNameWithNoTooltip] z [ShowLocationNameWithNoTooltip('florence')]" # todo: NEW TRANSLATION
 italian_renaissance_culture.19.desc: "Po získaní regionálneho uznania za svoje diela v [ShowLocationName('florence')] prišiel [target_artist.GetName] do [ROOT.GetCountry.GetCapital.GetName], aby prijal niektoré komisie pre členov [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]. Avšak jeho prítomnosť v [ROOT.GetCountry.GetCapital.GetNameWithNoTooltip] upútala pozornosť [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')], ktorí prejavili veľký záujem o jeho práce a požiadali [ROOT.GetCountry.GetGovernment.GetCourtTitle], aby ho najal s nádejou, že predĺžia jeho pobyt v [ROOT.GetCountry.GetCapital.GetNameWithNoTooltip].\n\nKeďže ide o prominentného [ShowArtistTypeName('philosopher')] z [ShowLocationNameWithNoTooltip('florence')], [target_artist.GetNameWithNoTooltip] bude očakávať prostriedky nad rámec toho, čo [ROOT.GetCountry.GetGovernment.GetCourtTitle] bežne poskytuje." # todo: NEW TRANSLATION
 italian_renaissance_culture.19.a: "Drahé, ale [target_artist.GetHisHer] skúsenosti budú vítané." # todo: NEW TRANSLATION
 italian_renaissance_culture.19.b: "[target_artist.GetShortNameWithNoTooltip] je pre [ROOT.GetCountry.GetGovernment.GetCourtTitle] príliš drahý." # todo: NEW TRANSLATION
 italian_renaissance_culture.20.title: "[target_country.GetLongNameWithNoTooltip] žiada o [target_artist.GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 italian_renaissance_culture.20.desc: "Ako [target_artist.GetName] naberá renomé za hranicami [ShowRegionName('italy_region')], dvor [target_country.GetGovernment.GetCourtTitle] [target_country.GetLongName] sa obrátil na [ROOT.GetCountry.GetName] s cieľom zabezpečiť služby [target_artist.GetNameWithNoTooltip]. Ohúrený príbehmi o [target_artist.GetNameWithNoTooltip] je [target_country.GetAdjectiveWithNoTooltip] [target_country.GetGovernment.GetCourtTitle] ochotný zaplatiť značnú sumu, ak [ROOT.GetCountry.GetNameWithNoTooltip] súhlasí, že [target_artist.GetNameWithNoTooltip] prevezme pobyt v [target_country.GetNameWithNoTooltip]." # todo: NEW TRANSLATION
 italian_renaissance_culture.20.a: "Prijať [target_country.GetAdjectiveWithNoTooltip] mince výmenou za [target_artist.GetShortNameWithNoTooltip]." # todo: NEW TRANSLATION
 italian_renaissance_culture.20.b: "Zachováme výhradný patronát [target_artist.GetShortNameWithNoTooltip]." # todo: NEW TRANSLATION
 italian_renaissance_culture.21.title: "Patronát umenia z [ShowAgeNameWithNoTooltip('age_2_renaissance')] príliš drahý" # todo: NEW TRANSLATION
 italian_renaissance_culture.21.desc: "Hoci [ROOT.GetCountry.GetName] poskytoval rozsiahly patronát novým umeniam [ShowAgeName('age_2_renaissance')], tento patronát sa časom ukázal byť škodlivý pre štát. [ROOT.GetCountry.GetAdjectiveWithNoTooltip] pokladnica teraz hrozí finančnou krízou, ak neprijmeme opatrenia, hoci niektorí v [ROOT.GetCountry.GetGovernment.GetCourtTitle] stále veria, že pokračujúci patronát sa v dlhodobom horizonte vyplatí." # todo: NEW TRANSLATION
 italian_renaissance_culture.21.a: "Znížiť štátny patronát umenia na zachovanie pokladnice." # todo: NEW TRANSLATION
 italian_renaissance_culture.21.b: "Musíme pokračovať v našom patronáte umenia!" # todo: NEW TRANSLATION
 italian_renaissance_culture.22.title: "[target_location.GetNameWithNoTooltip], centrum umenia a kultúry [ShowAgeNameWithNoTooltip('age_2_renaissance')]" # todo: NEW TRANSLATION
 italian_renaissance_culture.22.desc: "Hoci to bolo značné finančné bremeno pre [ROOT.GetCountry.GetLongName], [target_location.GetName] sa stal jedným z kľúčových centier umenia [ShowAgeName('age_2_renaissance')] v [ShowRegionName('italy_region')], ba aj v celom [ShowContinentName('europe')]. Významní umelci a učenci z celej [ShowContinentNameWithNoTooltip('europe')] túžia navštíviť [target_location.GetRank.GetName], pričom mnohí šíria príbehy o tom, ako [target_location.GetNameWithNoTooltip] bola touto dobou premenená." # todo: NEW TRANSLATION
 italian_renaissance_culture.22.a: "[target_location.GetNameWithNoTooltip] bude žiariť ako centrum umenia a kultúry v nasledujúcich storočiach!" # todo: NEW TRANSLATION
 italian_renaissance_culture.22.b: "Využiť novonadobudnutú významnosť [target_location.GetNameWithNoTooltip] na posilnenie našej prestíže" # todo: NEW TRANSLATION
 italian_renaissance_culture.23.title: "[ShowWorkOfArtNameWithNoTooltip('boccaccio_on_the_fates_of_famous_men')]" # todo: NEW TRANSLATION
 italian_renaissance_culture.23.desc: "[target_artist.GetName], jedna z popredných postáv [ShowAgeName('age_2_renaissance')], dokončil ďalšie impozantné dielo. S názvom [ShowWorkOfArtName('boccaccio_on_the_fates_of_famous_men')] pokrýva mnohé významné osobnosti z biblických a klasických období, ako aj kľúčové postavy z uplynulého storočia. Pôvabná zbierka — ak by sa [ROOT.GetCountry.GetGovernment.GetCourtTitle] rozhodol ju predať, dielo [target_artist.GetLastNameWithNoTooltip] by pravdepodobne dosiahlo značnú sumu." # todo: NEW TRANSLATION
 italian_renaissance_culture.23.a: "Ohromujúca zbierka historických postáv." # todo: NEW TRANSLATION
 italian_renaissance_culture.23.b: "Ponúknuť [target_artist.GetHisHer] dielo [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('burghers_estate')] za vysokú cenu." # todo: NEW TRANSLATION
 italian_renaissance_culture.24.title: "[ShowWorkOfArtNameWithNoTooltip('boccaccio_the_decameron')]" # todo: NEW TRANSLATION
 italian_renaissance_culture.24.desc: "Po zhliadnutí hrôz [ShowSituationName('black_death')] bol [target_artist.GetName] inšpirovaný k napísaniu [ShowWorkOfArtName('boccaccio_the_decameron')], čo prilákalo značný záujem zo strany [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] v [ROOT.GetCountry.GetName]. Dej sa odohráva v [ShowLocationName('florence')] a sleduje desať $FLO_ADJ$ jedincov, ktorí odchádzajú na vidiek, aby unikli moru. Niektorí v [ROOT.GetCountry.GetGovernment.GetCourtTitle] sa domnievajú, že by sme mali usilovať o široké šírenie diela [target_artist.GetLastNameWithNoTooltip]." # todo: NEW TRANSLATION
 italian_renaissance_culture.24.a: "Pútavá zbierka príbehov! Mali by sme šíriť [target_artist.GetHisHer] dielo." # todo: NEW TRANSLATION
 italian_renaissance_culture.24.b: "Ponúknuť vlastníctvo diela [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')]." # todo: NEW TRANSLATION
 italian_renaissance_culture.25.title: "[ShowWorkOfArtNameWithNoTooltip('boccaccio_concerning_famous_women')]" # todo: NEW TRANSLATION
 italian_renaissance_culture.25.desc: "Podobne ako [target_artist.GetHisHer] predchádzajúce dielo [ShowWorkOfArtName('boccaccio_on_the_fates_of_famous_men')], [target_artist.GetName] vydal ďalší zväzok o slávnych postavách z histórie, tentoraz zameraný na významné ženy. Veľká časť [ROOT.GetCountry.GetGovernment.GetCourtTitle] je prekvapená záujmom, ktorý [target_artist.GetLastNameWithNoTooltip] venoval týmto postavám, ale rovnako ako mnohé z [target_artist.GetHisHer] predchádzajúcich diel, [ShowWorkOfArtName('boccaccio_concerning_famous_women')] by určite bolo cenné, ak by naše financie došli." # todo: NEW TRANSLATION
 italian_renaissance_culture.25.a: "Zostane ceneným dielom v rámci [ROOT.GetCountry.GetGovernment.GetCourtTitle]." # todo: NEW TRANSLATION
 italian_renaissance_culture.25.b: "Usporiadať aukciu [ROOT.GetCountry.GetGovernment.GetCourtTitle] na predaj [ShowWorkOfArtTypeNameWithNoTooltip('chronicle')]." # todo: NEW TRANSLATION
 italian_renaissance_culture.26.title: "Vzostup [target_character_2.GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 italian_renaissance_culture.26.desc: "Po dlhodobom pôsobení v [ShowLocationName('florence')] sa [target_character_2.GetName] ukázal byť schopnou osobnosťou a šíriteľom [ShowAgeName('age_2_renaissance')] [ShowSocietyDirectionName('humanist')] myslenia. Keďže [target_character_2.GetNameWithNoTooltip] získal chválu a uznanie členov [ROOT.GetCountry.GetGovernment.GetCourtTitle], niektorí navrhujú, aby [target_character.GetName] udelil [target_character_2.GetNameWithNoTooltip] zvláštnu pozíciu v [ROOT.GetCountry.GetGovernment.GetCabinetTitle]." # todo: NEW TRANSLATION
 italian_renaissance_culture.26.a: "Dať [target_character_2.GetHimHer] miesto v [ROOT.GetCountry.GetGovernment.GetCourtTitle]." # todo: NEW TRANSLATION
 italian_renaissance_culture.26.b: "[target_character_2.GetHeShe] by bol dobrým [ROOT.GetCountry.GetGovernment.GetCabinetMemberTitle] v [ROOT.GetCountry.GetGovernment.GetCabinetTitle]." # todo: NEW TRANSLATION
 italian_renaissance_culture.26.c: "Nedávať [target_character_2.GetHimHer] žiadne zvláštne privilégiá." # todo: NEW TRANSLATION
 italian_renaissance_culture.27.title: "[target_artist.GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 italian_renaissance_culture.27.desc: "Hoci si [target_artist.GetHeShe] v posledných rokoch získal uznanie v [ShowRegionName('italy_region')], jeho pobyt v [ROOT.GetCountry.GetCapital.GetName] priniesol obdiv v celom [ROOT.GetCountry.GetCapital.GetRank.GetName], pričom bohatšie vrstvy obyvateľstva prijali jeho sekulárne vyučovanie. Niektorí z [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] sa sťažujú na jeho metódy vyučovania, iní však naliehajú na [target_character.GetName], aby ponúkol [target_artist.GetNameWithNoTooltip] plné bývanie v [ROOT.GetCountry.GetName]." # todo: NEW TRANSLATION
 italian_renaissance_culture.27.a: "Zamestnať [target_artist.GetHimHer]!" # todo: NEW TRANSLATION
 italian_renaissance_culture.27.b: "[target_artist.GetHisHer|U] myšlienky sú príliš radikálne." # todo: NEW TRANSLATION
 italian_renaissance_culture.28.title: "Založenie Casa Gioiosa" # todo: NEW TRANSLATION
 italian_renaissance_culture.28.desc: "Odkedy získal plné bydlisko v [ROOT.GetCountry.GetName], [target_artist.GetName] priniesol svoje učenie mnohým v [target_location.GetName]. V dôsledku jeho renomé a vplyvu v [target_location.GetNameWithNoTooltip] teraz [target_artist.GetNameWithNoTooltip] žiada finančnú pomoc od [ROOT.GetCountry.GetGovernment.GetCourtTitle] na založenie novej školy, #italic Casa Gioiosa#!.\n\nAj keď by to bol nákladný podnik, nová [ShowBuildingTypeNameWithNoTooltip('art_school')] v [target_location.GetNameWithNoTooltip] by zvýšila [ROOT.GetCountry.GetAdjectiveWithNoTooltip] prestíž v celom [ShowRegionName('italy_region')]." # todo: NEW TRANSLATION
 italian_renaissance_culture.28.a: "Zadať financovanie založenia [ShowBuildingTypeNameWithNoTooltip('art_school')]!" # todo: NEW TRANSLATION
 italian_renaissance_culture.28.b: "Navrhovať namiesto toho založenie Casa Gioiosa ako novej [ShowBuildingTypeNameWithNoTooltip('university')]." # todo: NEW TRANSLATION
 italian_renaissance_culture.28.c: "Nemáme prostriedky na tento projekt." # todo: NEW TRANSLATION
 italian_renaissance_culture.29.title: "[target_artist.GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 italian_renaissance_culture.29.desc: "Výnimočný žiak [target_artist_2.GetName], [target_artist.GetName] si vybudoval reputáciu jedného z popredných učencov v [ShowRegionName('italy_region')] a je obzvlášť zručný v prekladaní starovekých [ShowCultureName('greek_culture')] rukopisov. Teraz, keď prišiel do [ROOT.GetCountry.GetCapital.GetName], prejavil záujem o získanie patronátu [ROOT.GetCountry.GetAdjective] [ROOT.GetCountry.GetGovernment.GetCourtTitle] na pokračovanie v práci na nedávno objavených rukopisoch [ShowCultureNameWithNoTooltip('greek_culture')]." # todo: NEW TRANSLATION
 italian_renaissance_culture.29.a: "Zamestnať [target_artist.GetHimHer]!" # todo: NEW TRANSLATION
 italian_renaissance_culture.29.b: "Nechceme patronovať [target_artist.GetHisHer] prácu!" # todo: NEW TRANSLATION
 italian_renaissance_culture.30.title: "[target_artist.GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 italian_renaissance_culture.30.desc: "Hoci šírenie olejomaľby v [ShowRegionName('italy_region')] je stále v plienkach, [ShowArtistTypeName('painter')] [target_artist.GetName] sa ukázal byť jedným z najzručnejších praktikov; mnohé jeho maľby už sú cennosťou rôznych dvorov [ShowCultureGroupName('italian_group')].\n\nMnohí z [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] a [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')] naliehajú na [target_character.GetName], aby poskytol patronát a vyzdobil [ROOT.GetCountry.GetGovernment.GetCourtTitle] jeho jedinečnými maľbami." # todo: NEW TRANSLATION
 italian_renaissance_culture.30.a: "[target_artist.GetHisHer|U] maľby by posilnili prestíž [ROOT.GetCountry.GetGovernment.GetCourtTitle]." # todo: NEW TRANSLATION
 italian_renaissance_culture.30.b: "Nemôžeme si dovoliť patronovať [target_artist.GetHimHer]." # todo: NEW TRANSLATION

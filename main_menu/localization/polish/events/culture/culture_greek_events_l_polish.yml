l_polish:
 culture_greek.1.title: "Spor s [target_character.GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 culture_greek.1.desc: "Napriek tomu, že náš postoj ako hrdého [ROOT.GetCountry.GetReligion.GetAdjective] národa je pre mnohých susedov jasný, zdá sa, že v rámci nášho patriarchátu existujú vnútorné problémy.\n\n[target_character.GetName] si všimol zanedbávanie [target_character2.GetName] pokiaľ ide o [target_character2.GetHerHis] náboženské povinnosti. [target_character.GetSheHe|U] uvádza zlé zaobchádzanie s [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')], nevhodné správanie počas náboženských obradov a všeobecný nedostatok úcty k [ROOT.GetCountry.GetReligion.GetAdjectiveWithNoTooltip] náboženskej kultúre nášho národa.\n\nAj keď mnohí považujú tieto tvrdenia za prehnané, ľudia si stále dobre uvedomujú zanedbanie [target_character2.GetNameWithNoTooltip] a to, ako [target_character2.GetSheHe] považuje [target_character2.GetHerselfHimself] za nadradeného akejkoľvek náboženskej inštitúcii. To viedlo niektorých našich [ROOT.GetCountry.GetReligion.GetAdjectiveWithNoTooltip] občanov k tomu, že [target_character2.GetHerHim] považujú za nelegitímneho a nehodného titulu [ROOT.GetCountry.GetGovernment.GetRulerTitle]." # todo: NEW TRANSLATION
 culture_greek.1.a: "Tí [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('clergy_estate')] nevedia, o čom hovoria!" # todo: NEW TRANSLATION
 culture_greek.1.b: "Možno by sme mali [target_character2.GetNameWithNoTooltip] viac obmedziť." # todo: NEW TRANSLATION
 culture_greek.1.c: "Nikto nebude spochybňovať legitimitu [target_character2.GetNameWithNoTooltip]!" # todo: NEW TRANSLATION
 culture_greek.1.d: "Reč ich určite upokojí." # todo: NEW TRANSLATION
 culture_greek.2.title: "Patriarcha žehná [target_character2.GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 culture_greek.2.desc: "Elegancia a poriadok [ROOT.GetCountry.GetName] zaujali [target_character.GetName] prístupom [target_character2.GetName] k vláde. Pri prvom príchode do [target_capital.GetName] bol [target_character.GetSheHe] ohromený tým, koľko pozornosti venovali zachovaniu náboženských pilierov [ROOT.GetCountry.GetReligion.GetName]. Kláštory sú dobre udržiavané a ozdobené všetkými bohatstvami, ktoré dokázal zhromaždiť [ROOT.GetCountry.GetGovernment.GetGovernmentType.GetName]; občania obdivujú mramorové kandylakia pozdĺž ciest, spomínajúc príbehy o stratených blízkych alebo zázrakoch, ktoré im pomohli prežiť chvíle krízy.\n\nV [ROOT.GetCountry.GetGovernment.GetCourtTitle] mnohí členovia recitujú Bibliu a nájsť ich možno pri modlitbe pred ikonami samotného Mesiáša. Vzduchom sa šíri vôňa kadidla, keď [target_character.GetNameWithNoTooltip] prichádza do komnaty, kde [target_character2.GetNameWithNoTooltip] diskutuje politiku." # todo: NEW TRANSLATION
 culture_greek.2.a: "Požehnanie patriarchy je zaručené." # todo: NEW TRANSLATION
 culture_greek.2.b: "Požehnanie nestačí. Musíme vynaložiť viac úsilia v [target_capital.GetNameWithNoTooltip]." # todo: NEW TRANSLATION
 culture_greek.3.title: "Reformácia v [target_country.GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 culture_greek.3.desc: "S príchodom vlny Reformácie, ktorá sa šíri po [ShowContinentName('europe')], sa ľudia ako [target_character.GetName] začali zaujímať o nadviazanie diplomatických vzťahov s reformátormi ako [target_country.GetName], ktorí stoja proti pápežskej inštitúcii.\n\nPo diskusii je nám jasné, že máme spoločného nepriateľa: Aj oni sa chcú zbaviť skorumpovaných zvykov [papal_capital.GetName] a získať späť autonómiu [target_country.GetGovernment.GetEstateName('crown_estate')]. Napriek tomu existujú rozdiely, ktoré náš [ROOT.GetCountry.GetGovernment.GetCourtTitle] nemôže tolerovať; stopy, ktoré [ShowReligionName('catholic')] zanechala na ich územiach." # todo: NEW TRANSLATION
 culture_greek.3.a: "Nepriateľ môjho nepriateľa je môj priateľ." # todo: NEW TRANSLATION
 culture_greek.3.b: "Nepotrebujeme pomoc heretikov." # todo: NEW TRANSLATION
 culture_greek.3.c: "[target_character2.GetShortNameWithNoTooltip] nás urobil hlupákmi!" # todo: NEW TRANSLATION
 culture_greek.4.title: "Otázka '[ShowCultureNameWithNoTooltip('greek_culture')]'" # todo: NEW TRANSLATION
 culture_greek.4.desc: "Vzostup absolutizmu a koncept štátu a jeho ľudu formujú zmýšľanie našej súčasnej populácie. Predtým by sa takéto veci verejne nepreberali, keďže náboženstvo primárne formovalo kultúru. Ale teraz, s veľkými mysliteľmi pochádzajúcimi z nižších vrstiev, mnohí v našich vzdelávacích inštitúciách kládli jednu otázku: Čo je [ShowCultureNameWithNoTooltip('greek_culture')]?\n\nNiektorí tvrdia, že diglosia prítomná v jazyku [ROOT.GetCountry.GetName] uchováva rozdelenie, kde byrokrati a [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] sú v takmer každom smere oddelení od [ROOT.GetCountry.GetGovernment.GetEstateName('peasants_estate')] kvôli úplne odlišným spôsobom správania a hovoreniu inými dialektmi.\n\nTáto situácia pomaly radikalizovala mnohých, ktorí volajú po zmene na zjednotenie tohto rozdelenia a skutočné zjednotenie národa." # todo: NEW TRANSLATION
 culture_greek.4.a: "Pomaly, ale isto môžeme zjednotiť ľud." # todo: NEW TRANSLATION
 culture_greek.4.b: "Uskutočnenie takýchto zmien by destabilizovalo našu súčasnú mocenskú štruktúru." # todo: NEW TRANSLATION
 culture_greek.4.c: "Neexistujú kultúrne rozdiely, len rôzne varianty tej istej kultúry." # todo: NEW TRANSLATION
 greek_culture_greek_peasants_will_gain_satisfaction: "Všetky [ShowCultureGroupName('greek_group')] [culture|e] [pops|e] v non-[rural_locations|e], ktoré sú buď [ShowPopTypeName('peasants')] alebo [ShowPopTypeName('laborers')], získajú [ShowNamedValue('pop_satisfaction_mild_bonus')|+=2%] [pop_satisfaction|e]" # todo: NEW TRANSLATION
 culture_greek.5.title: "Vzostup [target_character.GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 culture_greek.5.desc: "Dosiahnuv veľa víťazstiev, napríklad v [victory_location1.GetName] alebo [victory_location2.GetName], si ľudia začali vážiť [target_character.GetHerHim] ako brilantného stratega, ktorý poráža nepriateľov [ROOT.GetCountry.GetName] mečom, prelievajúc ich krv v mene Pána a [target_character2.GetName].\n\nPo rozhovoroch s mnohými vplyvnými členmi [ROOT.GetCountry.GetGovernment.GetCourtTitle] sa zdá, že aj oni [target_character.GetHerHim] rešpektujú a zaujímajú sa o [target_character.GetHerHis] rozprávania o bitke pri [victory_location3.GetName] — poslednom príbehu, o ktorom všetci hovoria. [target_character2.GetNameWithNoTooltip] sa cíti touto slávou ohrozený, pretože [target_character2.GetSheHe] cíti, že vplyv [ROOT.GetCountry.GetGovernment.GetCourtTitle] sa presúva k tomuto strategovi. Možno by sa to však dalo využiť na ďalšie posilnenie vládnutia rodu [target_character2.GetDynasty.GetName] nad [ROOT.GetCountry.GetNameWithNoTooltip]." # todo: NEW TRANSLATION
 culture_greek.5.a: "Oslávme takýchto hrdinov." # todo: NEW TRANSLATION
 culture_greek.5.b: "Mali by sme obmedziť vplyv [target_character.GetShortNameWithNoTooltip]." # todo: NEW TRANSLATION
 culture_greek.5.c: "Držme [target_character.GetHerHim] #italic just#! dostatočne blízko pri nás, ale čo najďalej od politiky." # todo: NEW TRANSLATION
 greek_culture_strategos_will_never_be_able_to_influence_politics: "Tým, že odoprieme [target_character.GetName] schopnosť ovplyvňovať [courtiers|e], zabezpečíme, že [target_character.GetSheHe] v budúcnosti nespustí prevrat proti nám" # todo: NEW TRANSLATION
 greek_culture_strategos_will_never_get_the_opportunity_to_coup: "[target_character.GetName] nikdy nedostane príležitosť ovplyvňovať [courtiers|e], čo znamená, že [target_character.GetSheHe] nikdy nebude môcť spustiť prevrat proti nám" # todo: NEW TRANSLATION
 culture_greek.6.title: "Strategos ľudu" # todo: NEW TRANSLATION
 culture_greek.6.desc: "Keď slávny strategos [target_character.GetName] prechádza ulicami [target_capital.GetName] so svojou osobnou gardou [target_character.GetHerHis], zhromažďujú sa davy, aby na vlastné oči videli túto strategickú myseľ.\n\n[ROOT.GetCountry.GetGovernment.GetEstateName('peasants_estate')], [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')] a [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] spoločne zdvihnú svoje hlasy v zjednocujúcom chorále, volajúc [target_character.GetHerHis] meno, '[target_character.GetShortNameWithNoTooltip]!'. Niektoré tichšie hlasy v dave tiež zamrmľajú, že [target_character.GetSheHe] by bol menej skorumpovaný vládca, ktorý by skutočne počúval ľud. Klebety o týchto rečiach dorazili až do [ROOT.GetCountry.GetGovernment.GetCourtTitle], čo je známkou vážnosti, ktorú táto osobnosť nadobudla." # todo: NEW TRANSLATION
 culture_greek.6.a: "Tento strategos si zaslúži úctu, aj od [target_character.GetHerHis] protivníkov." # todo: NEW TRANSLATION
 culture_greek.6.b: "Skúste stíšiť dav, kým niekto nezíska nápady." # todo: NEW TRANSLATION
 greek_culture_all_capital_pops_gain_pop_satisfaction: "Všetky [pops|e] v [target_capital.GetName] získajú [ShowNamedValue('pop_satisfaction_mild_bonus')|+=2%] [pop_satisfaction|e]" # todo: NEW TRANSLATION
 greek_culture_prevent_coup_for_two_year: "Ak [target_character.GetName] plánoval prevrat, [target_character.GetHerHis] snahy budú na #y 2#! rokov zadržané" # todo: NEW TRANSLATION
 culture_greek.7.title: "Prevrat [target_character.GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 culture_greek.7.desc: "Po mesiacoch intríg, získavania podpory, znižovania vplyvu oponentov a zhromažďovania vojska je [target_character.GetName] teraz v pozícii zosadiť [target_character2.GetName].\n\nPresvedčený, že [target_character.GetHerselfHimself] je oprávnený vládca [ROOT.GetCountry.GetName] a oveľa zhovievavejší aj schopnejší vládca, stojí [target_character.GetSheHe] teraz pred [ROOT.GetCountry.GetCapital.GetName] a žiada, aby [target_character2.GetShortName] abdikoval na trón [ROOT.GetCountry.GetNameWithNoTooltip]." # todo: NEW TRANSLATION
 culture_greek.7.a: "Potrebujeme nové vedenie, aby nás zbavilo dekadencie." # todo: NEW TRANSLATION
 culture_greek.7.b: "[target_character2.GetShortNameWithNoTooltip] sa len tak nevzdá trónu!" # todo: NEW TRANSLATION
 culture_greek.7.c: "Čo vie [target_character.GetShortNameWithNoTooltip] o legitimite?" # todo: NEW TRANSLATION
 culture_greek.7.d: "Vyhoňte [target_character.GetHerHim] za pokus nás zvrhnúť." # todo: NEW TRANSLATION
 greek_culture_weaker_due_to_righteous_trait: "[rebels|e] budú oveľa slabší." # todo: NEW TRANSLATION
 culture_greek.8.title: "Špióni v [target_location.GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 culture_greek.8.desc: "Stráže [target_location.GetName] nedávno objavili skupinu špiónov, ktorí sa snažili preniknúť k najväčším tajomstvám [ROOT.GetCountry.GetName] — tajomstvám ako grécky oheň a ďalšie technologické pokroky, ktoré by chceli získať pre svoje kráľovstvo.\n\nAj keď nevyzradili, pre koho pracujú, povedali nám, že sú tu nasadení už mesiace a prechádzajú od hostinca k hostincu a od kostola ku kostolu, snažiac sa nájsť akékoľvek stopy, kde by mohli vykopať naše tajomstvá. Možno by títo špióni mali lepšie využitie než hniť v našich žalároch, očakávajúc, že ich pán zistí, čo sa stalo. Možno by nám mohli slúžiť." # todo: NEW TRANSLATION
 culture_greek.8.a: "Títo špióni sú užitočnejší pre náš [ROOT.GetCountry.GetGovernment.GetCourtTitle]." # todo: NEW TRANSLATION
 culture_greek.8.b: "Nech hnijú a odhaľme akékoľvek ďalšie siete špiónov infiltrované v [target_location.GetNameWithNoTooltip]!" # todo: NEW TRANSLATION
 culture_greek.8.c: "Možno nám môžu pomôcť nájsť iné siete špiónov ukrývajúce sa v našom [target_location.GetRank.GetNameWithNoTooltip]." # todo: NEW TRANSLATION
 every_country_with_spy_network_on_us_will_lose_25_network: "Každý známy [country|e], ktorý má [spy_network|e] aspoň #Y 15#! v našom [target_location.GetRank.GetNameWithNoTooltip], stratí #R -25#! [spy_network|e]" # todo: NEW TRANSLATION
 culture_greek.9.title: "Chrysobulla [target_location.GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 culture_greek.9.desc: "Vplyv [ShowCultureGroupName('italian_group')] v [target_location.GetRank.GetName] [target_location.GetName] začal dominovať miestnemu obchodu. Jediní obchodníci, s ktorými ľudia chcú obchodovať, sú tí, ktorí majú svoje sídlo späť v [ShowRegionName('italy_region')], čo vedie k tomu, že nám veľká časť našich bohatstiev uniká z rúk, pretože nedokážeme tieto zdroje primerane využívať. Tieto praktiky však majú aj určité výhody, hlavne možnosť pre štát predávať svoje bohatstvá, hoci nie za ideálne ceny. Takéto transakcie však môžu viesť k oslabení autority, ktorú drží [target_character.GetName], a k zvýšenej závislosti na týchto [ShowCultureGroupNameWithNoTooltip('italian_group')] obchodníkoch." # todo: NEW TRANSLATION
 culture_greek.9.a: "Nech si užívajú viac privilégií, pokiaľ nám to prinesie bohatstvo." # todo: NEW TRANSLATION
 culture_greek.9.b: "Ak chcú zbaviť [target_location.GetRank.GetNameWithNoTooltip] jeho bohatstva, musia zaplatiť dodatočný poplatok." # todo: NEW TRANSLATION
 culture_greek.9.c: "Dajme im niektoré privilégiá — také, ktoré neprinesú skutočné výhody." # todo: NEW TRANSLATION
 culture_greek.9.d: "Ak máme vypracovať zákony na ich ochranu, musíme to robiť efektívne." # todo: NEW TRANSLATION
 all_italian_pops_become_happier: "Všetky [ShowCultureGroupName('italian_group')] [ShowPopTypeName('burghers')] [pops|e] získajú [ShowNamedValue('pop_satisfaction_mild_bonus')|+=2%] [pop_satisfaction|e]" # todo: NEW TRANSLATION
 all_italian_pops_become_angrier: "Všetky [ShowCultureGroupName('italian_group')] [ShowPopTypeName('burghers')] [pops|e] stratia [ShowNamedValue('pop_satisfaction_mild_penalty')|+=2%] [pop_satisfaction|e]" # todo: NEW TRANSLATION
 culture_greek.10.title: "Nová generácia v [target_location.GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 culture_greek.10.desc: "Súčasné byrokracie sú zakorenené a korupcia rastie medzi tými, ktorí ich riadia, takže sa objavuje mnoho významných mladých študentov, ktorí chcú túto korupciu odstrániť nahradením zastaraných metód starej gardy progresívnejšími. Jedným z týchto nových ľudí je [target_character.GetName], člen [target_estate.GetName], ktorý sa narodil v [target_location2.GetName] v obyčajnej rodine, ale v priebehu rokov prejavil schopnosť zlepšiť našu byrokraciu pomocou radikálnych metód. Tieto nové metódy sľubujú preformovanie súčasnej rigidnej byrokratickej štruktúry na niečo, čo prospeje štátu a jeho ľuďom.\n\nAj keď by to určite zlepšilo efektívnosť našej správy, mnohí v etablovaných pozíciách sa obávajú, že budú odvolaní, a bojujú proti tejto novej generácii potláčaním ich hlasov a dokonca úplatkami niektorých jednotlivcov, aby ich 'umlčali'." # todo: NEW TRANSLATION
 culture_greek.10.a: "Títo mladí muži sú budúcnosťou." # todo: NEW TRANSLATION
 culture_greek.10.b: "Na takúto záležitosť stojíme pri starej garde." # todo: NEW TRANSLATION
 culture_greek.11.title: "Cudzia fráza" # todo: NEW TRANSLATION
 culture_greek.11.desc: "Hoci vplyv rímskeho jazyka slabol v [ROOT.GetCountry.GetGovernment.GetCourtTitle] Východu, snažili sme sa udržať identitu ako hrdí [ShowCultureGroupName('greek_group')] ľudia. Napriek tomu niektorí [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] vedia recitovať frázy z [ShowLanguageName('latin_language')].\n\n'Pro bono', hovorí [target_character.GetName] dvoranom. Všetci sú zmätení, kým [target_character.GetSheHe] nevysvetlí pôvod a význam. Niektorí sú úplne konzervatívni a vysmievajú sa [target_character.GetHerHim] za používanie takéhoto cudzieho jazyka, zatiaľ čo iní sú zvedaví a chcú sa o [ShowLanguageNameWithNoTooltip('latin_language')] dozvedieť viac. S takými ľuďmi v [ROOT.GetCountry.GetGovernment.GetCourtTitle] sa šepká o prijatí tohto štýlu reči a jeho začlenení do administrácie. Návrat k starým rímskym tradíciám, istým spôsobom, pokus udržať spôsoby Ríma v [ROOT.GetCountry.GetNameWithNoTooltip]." # todo: NEW TRANSLATION
 culture_greek.11.a: "Nie je dôvod opustiť náš [ShowCultureNameWithNoTooltip('greek_culture')] charakter." # todo: NEW TRANSLATION
 culture_greek.11.b: "Reč [ShowLanguageName('latin_language')] by sa mala podporovať." # todo: NEW TRANSLATION
 culture_greek.11.c: "[ROOT.GetCountry.GetGovernment.GetCourtTitle] by mal rešpektovať všetky jazyky." # todo: NEW TRANSLATION
 culture_greek.12.title: "Náznak korupcie" # todo: NEW TRANSLATION
 culture_greek.12.desc: "Hoci mnoho dôležitých pozícií v [ROOT.GetCountry.GetName] obsadzujú schopní muži, niektoré súčiastky systému sa zdajú podpriemerné.\n\nNedávna kontrola našej správy priniesla celkom zaujímavý výsledok: Chýry hovoria, že [target_character.GetName] dával pracovné miesta príbuzným, priateľom a dokonca ľuďom, ktorí ho môžu obohatiť. Keď sa táto správa dostala do [ROOT.GetCountry.GetGovernment.GetCourtTitle], a čo je dôležitejšie k [target_character2.GetName], niektorí ju rýchlo odmietli ako len rivalitu medzi inšpektormi a [target_character.GetNameWithNoTooltip].\n\nMožno je potrebný priamejší zásah, aby sme ukázali tým, ktorí považujú našu správu za spôsob zvyšovania svojho bohatstva, že za každý čin sú následky." # todo: NEW TRANSLATION
 culture_greek.12.a: "Ak vykynožíme každého skorumpovaného člena, nebudeme mať žiadnych členov." # todo: NEW TRANSLATION
 culture_greek.12.b: "[target_character.GetShortNameWithNoTooltip] urobil rozhodnutie a znáša následky." # todo: NEW TRANSLATION
 culture_greek.12.c: "Všetka korupcia bude vyčistená!" # todo: NEW TRANSLATION
 culture_greek.12.d: "Možno... dajú sa urobiť dohody." # todo: NEW TRANSLATION
 culture_greek.13.title: "Zlyhávajúca Kephalē" # todo: NEW TRANSLATION
 culture_greek.13.desc: "Kephalē [target_area.GetName] zažíva pokles odvtedy, čo bola zriadená. Jej guvernér, ktorý sídli v [target_location.GetName], nesplnil očakávania, ale toto zlyhanie bolo tiež mnohými v našej byrokracii ignorované. To umožnilo miestnym vyhýbať sa platení daní a niektorí šľachtici prevzali pozemky v oblasti, zneužívajúc roľníkov a ich potenciálne bohatstvo. Keď tieto správy dorazili do [ROOT.GetCountry.GetGovernment.GetCourtTitle] [target_character.GetName], ako supy na hnijúcom mäse, mnohí navrhli nahradiť guvernéra buď sebou alebo príbuzným, tvrdúc, že by lepšie udržiavali bezpečnosť regiónu. Hoci takéto kroky sa zdajú drastické, nemusí byť zlé zmeniť vedenie. Ale možno je to naša vina, že sme zanedbali miestne vedenie a mali by sme im poslať viac prostriedkov, aby pomohli udržať v šachu neukáznene [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')] a vynucovať poslušnosť hrdých sedliakov." # todo: NEW TRANSLATION
 culture_greek.13.a: "Nahraďme guvernéra niekým iným." # todo: NEW TRANSLATION
 culture_greek.13.b: "Zanedbanie umožnilo zlyhanie [target_area.GetNameWithNoTooltip]. Poskytnime im podporu." # todo: NEW TRANSLATION
 culture_greek.13.c: "Len čas môže zahojit túto ranu. Nie je potrebné nové vedenie." # todo: NEW TRANSLATION
 all_pops_in_kephale_area_lose_satisfaction: "Všetky [pops|e] v [target_area.GetName] stratia [ShowNamedValue('pop_satisfaction_mild_penalty')|+=2%] [pop_satisfaction|e]" # todo: NEW TRANSLATION
 gain_extra_control_in_the_area: "Každé [location|e], ktoré vlastníme v [target_area.GetName], získa [ShowNamedValue('control_mild_bonus')|+=2%] [control|e] a [modifier|e] [ShowModifier('increased_kephale_support')] na #Y 10#! rokov" # todo: NEW TRANSLATION
 lose_extra_control_in_the_area: "Každé [location|e], ktoré vlastníme v [target_area.GetName], stratí [ShowNamedValue('control_mild_penalty')|+=2%] [control|e]" # todo: NEW TRANSLATION
 culture_greek.14.title: "Nenarodený v purpúre" # todo: NEW TRANSLATION
 culture_greek.14.desc: "Hoci [target_character.GetName] si nárokuje trón [ROOT.GetCountry.GetName] pre [target_character.GetHerselfHimself], chýba mu prestíž. Keďže [target_character.GetNameWithNoTooltip] nebol/a narodený v purpúre, mnohí veria, že tento nedostatok povesti oslabuje [ROOT.GetCountry.GetGovernment.GetCourtTitle]. Už kolujú klebety o nedostatku dôstojnosti u tohto [target_character.GetWomanMan], ktorý nesie črty dobyvateľa skôr než panovníka. Niektorí dokonca uvažujú o plánoch \"preformovať\" administráciu spôsobom, ktorý by mnohým blízkym [target_character.GetNameWithNoTooltip] pripadal luxusný." # todo: NEW TRANSLATION
 culture_greek.14.a: "Mali by sme minúť peniaze na zlepšenie postavenia [target_character.GetNameWithNoTooltip]." # todo: NEW TRANSLATION
 culture_greek.14.b: "Kedy prestíž sama udržiavala ríšu?" # todo: NEW TRANSLATION
 culture_greek.14.c: "Ak chcú poznať dôstojnosť, zažijú ju." # todo: NEW TRANSLATION
 culture_greek.15.title: "$STATIC_MODIFIER_NAME_despot_modifier$ v spore" # todo: NEW TRANSLATION
 culture_greek.15.desc: "Hoci rodina [target_character.GetDynasty.GetName] bola vždy jednotná vo svojom cieli spravovať [ROOT.GetCountry.GetName], objavili sa spory o tom, ako by sa to malo riadiť. [target_character.GetName] a [target_character2.GetName] sa pohádali o tom, ako by mal fungovať [ROOT.GetCountry.GetGovernment.GetCourtTitle] vo vzťahu k rodine. [target_character.GetShortNameWithNoTooltip] uprednostňuje, aby bol bližšie k našej vláde, kde môžeme ľahšie kontrolovať každé podriadené. [target_character2.GetShortNameWithNoTooltip] argumentuje opakom, že povolenie autonómie pre našich poddaných môže viesť k väčšej ríši, kde môžeme udržať malé plochy vplyvu na obrovskom území." # todo: NEW TRANSLATION
 culture_greek.15.a: "Mali by uprednostniť názory [target_character.GetShortNameWithNoTooltip]." # todo: NEW TRANSLATION
 culture_greek.15.b: "Sľuby [target_character2.GetShortNameWithNoTooltip] sa zdajú lákavé..." # todo: NEW TRANSLATION
 culture_greek.15.c: "Pripomeňme im, kto vládne [ROOT.GetCountry.GetNameWithNoTooltip]." # todo: NEW TRANSLATION
 culture_greek.15.d: "Možno by sa obaja mohli učiť od [ROOT.GetCountry.GetGovernment.GetRuler.GetShortNameWithNoTooltip]." # todo: NEW TRANSLATION
 culture_greek.16.title: "[target_character.GetNameWithNoTooltip] hovorí v [ROOT.GetCountry.GetGovernment.GetCourtTitle]" # todo: NEW TRANSLATION
 culture_greek.16.desc: "Správy o činoch [target_character.GetName] sa šíria po [ROOT.GetCountry.GetName] a [ROOT.GetCountry.GetCapital.GetName]. Mnohí dvorania chcú vidieť legendu, ktorá sa zapísala do histórie nášho národa, a poslali odkaz [target_character.GetHerHim], aby ho povolali do [ROOT.GetCountry.GetGovernment.GetCourtTitle] a dali mu šancu podeliť sa s ostatnými vplyvnými členmi.\n\nNiektorí z [target_character.GetHerHis] rivalov nie sú s týmto nápadom príliš nadšení a niektorí veria, že to [target_character.GetHerHim] dá nápady, z ktorých niektoré môžu viesť k tomu, že [target_character.GetHerHim] si bude priať zosadiť [target_character2.GetName] a nárokovať si [ROOT.GetCountry.GetNameWithNoTooltip] pre [target_character.GetHerselfHimself]." # todo: NEW TRANSLATION
 culture_greek.16.a: "Kto sme, aby sme [target_character.GetWomanMan] odopreli právo vystúpiť v [ROOT.GetCountry.GetGovernment.GetCourtTitle]?" # todo: NEW TRANSLATION
 culture_greek.16.b: "Šanca v [ROOT.GetCountry.GetGovernment.GetCourtTitle]? Nedovolíme to." # todo: NEW TRANSLATION
 culture_greek.17.title: "Rozšírenie obchodu v [target_location.GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 culture_greek.17.desc: "Naša námorná odbornosť umožnila rozvoj nových prístavov a obchodných ciest v [ROOT.GetCountry.GetName]. Jedným z týchto nových skladových miest je [target_location.GetName], [target_location.GetRank.GetName], kam prúdili mnohí z [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')], pretože im boli udelené privilégiá na posilnenie ich pozícií.\n\nNová infraštruktúra vytvorená miestnymi prilákala stále viac ľudí z celého [ROOT.GetCountry.GetNameWithNoTooltip], čo zvýšilo potrebu trhov, lodí a bývania. Tieto požiadavky sa dostali do uší [target_character.GetName], ktorý zvolal [ROOT.GetCountry.GetGovernment.GetCourtTitle], aby určili, ako túto situáciu riešiť." # todo: NEW TRANSLATION
 culture_greek.17.a: "Podporme obchod v [target_location.GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 culture_greek.17.b: "Pomôžeme im, ak sú ochotní byť nám dlžní." # todo: NEW TRANSLATION
 culture_greek.17.c: "Namiesto toho by sme mali zdieľať náklady." # todo: NEW TRANSLATION
 culture_greek.18.title: "Nedbalosť $a_akritai$ v [target_location.GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 culture_greek.18.desc: "Velitelia pohraničnej [target_location.GetRank.GetName] [target_location.GetName] zanedbali svoje povinnosti ako strážci hraníc, keď uvoľnili denný výcvik, a preto sú náchylní na nájazdy a invázie od našich nepriateľov.\n\nNedávna kontrola nám poskytla viac informácií: Ich veliteľ sa javí ako produkt nepotizmu, zdedil si pozíciu cez rodinu namiesto zásluh. Vojaci si tiež užívajú prostriedky, ktoré im [ROOT.GetCountry.GetName] poskytlo, pijú a chvália sa skutkami, ktoré nezodpovedajú ich skutočnej spôsobilosti. Namiesto toho, aby sme túto situáciu prijali a riskovali prelomenie hranice [target_area.GetName], musíme v týchto $a_akritai$ vynútiť disciplínu. Možno by mal byť v tejto veci aktívnejší [target_character.GetName]." # todo: NEW TRANSLATION
 culture_greek.18.a: "Nemáme na to voľné prostriedky." # todo: NEW TRANSLATION
 culture_greek.18.b: "Ochrana hraníc je ich povinnosť a bude im to pripomenuté." # todo: NEW TRANSLATION
 all_pop_in_location_lose_satisfaction: "Všetky [pops|e] v [target_location.GetName] stratia [ShowNamedValue('pop_satisfaction_mild_penalty')|+=2%] [pop_satisfaction|e]" # todo: NEW TRANSLATION
 culture_greek.19.title: "Príbehy $a_akritai$ v [target_location.GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 culture_greek.19.desc: "Hoci mnohé príbehy o $a_akritai$ sú zveličené, aby rozšírili povesť [ROOT.GetCountry.GetName] ďaleko a široko, existujú aj neozdobené príbehy tých v [target_location.GetName], ktorí strážia hranicu v [target_area.GetName]. Ich bdelosť zabezpečila, že nepriatelia sú udržiavaní na uzde a meno [target_character.GetName] si v týchto krajinách získava rešpekt. Niektorí ľudia majú pochybnosti o legitimite týchto $a_akritai$, ale v [ROOT.GetCountry.GetGovernment.GetCourtTitle] sú aj takí, ktorí im chcú viac pomôcť a posilniť legendu, ktorú sa snažia vybudovať, aj keby to bolo len v prospech [ROOT.GetCountry.GetNameWithNoTooltip]. Možno aj [target_character.GetNameWithNoTooltip] môže poskytnúť istú pomoc a vytvoriť miestnu legendu pre obyvateľov [target_location.GetNameWithNoTooltip]." # todo: NEW TRANSLATION
 culture_greek.19.a: "Ak sa skutky $a_akritai$ s týmto rozšíria, budeme podporovať ich príbehy." # todo: NEW TRANSLATION
 culture_greek.19.b: "Služba sama o sebe stačí, aby sa stala príbehom na veky." # todo: NEW TRANSLATION
 culture_greek.20.title: "$a_akritai$ v [target_location.GetNameWithNoTooltip] žiadajú o pomoc" # todo: NEW TRANSLATION
 culture_greek.20.desc: "Keďže [ROOT.GetCountry.GetName] je rozľahlé [ROOT.GetCountry.GetFlavorRank], vždy sa v niektorých oblastiach objaví nedbanlivosť. Hoci zvyčajne nejde o úmyselné zanedbanie, zanecháva to horkú príchuť u miestnych. Táto nedbanlivosť spôsobila, že sa obyvatelia [target_area.GetName] cítia ohrození, pretože hranica nie je tak bezpečná, ako by chceli. Požiadali miestnu posádku v [target_location.GetName], aby zvýšili úsilie a obozretnosť, ale aby skutočne odolali nájazdu alebo invázii, budú potrebovať aj podporu [ROOT.GetCountry.GetGovernment.GetCourtTitle].\n\nIch poslovia dorazili do [target_capital.GetName], žiadajúc audiencia u [target_character.GetName]. Požadovali, aby sme im poslali peniaze na rozšírenie opevnenia v [target_location.GetNameWithNoTooltip], ako aj viac mužov buď na stálú posádku, alebo aby slúžili ako inštruktori pre vojakov pri denných cvičeniach." # todo: NEW TRANSLATION
 culture_greek.20.a: "Zabezpečíme, aby bol každý kút chránený." # todo: NEW TRANSLATION
 culture_greek.20.b: "Nie sme schopní uvoľniť tieto prostriedky." # todo: NEW TRANSLATION
 culture_greek.21.title: "Pokles stredomorského obchodu v [target_location.GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 culture_greek.21.desc: "Objavenie Nového sveta viedlo k vytvoreniu nových obchodných ciest. Mnohé z nich prispievajú k zníženiu významu stredomorského obchodu, ktorý sme sa pokúšali využiť. Mnohí medzi [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')] sú už odborní na more a neochotní vzdať sa svojich súčasných námorných sietí. Namiesto toho veria, že im nepomôže zmena tradícií, ale financovanie od [ROOT.GetCountry.GetGovernment.GetCourtTitle] a stála podpora ich preferovaných obchodných centier.\n\nJedným z týchto centier, ktoré žiada o pomoc, je [target_location.GetRank.GetName] [target_location.GetName], ktorý trpí kvôli globálnemu posunu obchodných trás. Žiadajú, aby sme im poskytli financie, ktoré umožnia ich obchodníkom dovážať nové tovary, vytvoriť viac obchodov a potenciálne oživiť význam, ktorý [target_location.GetNameWithNoTooltip] kedysi mal." # todo: NEW TRANSLATION
 culture_greek.21.a: "Poskytnime im tieto prostriedky." # todo: NEW TRANSLATION
 culture_greek.21.b: "Ak chcú byť úspešnými obchodníkmi, mali by sa naučiť lepšie nakladať s tým, čo už majú." # todo: NEW TRANSLATION
 culture_greek.21.c: "Nie je to nič, čo by šikovnosť nedokázala vyriešiť." # todo: NEW TRANSLATION
 burghers_in_location_lose_satisfaction: "Všetky [ShowPopTypeName('burghers')] [pops|e] v [target_location.GetName] stratia [ShowNamedValue('pop_satisfaction_extreme_penalty')|+=2%] [pop_satisfaction|e]" # todo: NEW TRANSLATION
 burghers_in_location_gains_satisfaction: "Všetky [ShowPopTypeName('burghers')] [pops|e] v [target_location.GetName] získajú [ShowNamedValue('pop_satisfaction_extreme_bonus')|+=2%] [pop_satisfaction|e]" # todo: NEW TRANSLATION
 culture_greek.22.title: "Sviatok Theotokos v [target_location.GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 culture_greek.22.desc: "Narodenie Ježiša je považované za monumentálnu udalosť pre každého zbožného [ShowReligionAdjective('orthodox')] veriac, a z tohto dôvodu mnohí konajú slávnosti na počesť Jeho matky, Márie, ktorá je často nazývaná #italic Theotokos#!, Matka Božia.\n\nŽiadni nie sú v týchto oslavách tak horliví ako ľudia z [target_location.GetName]. Organizujú sviatok v [target_location.GetRank.GetName] a okolí, dúfajúc, že si skutočne oddýchnu celý deň a rozšíria svoju radosť všetkým, ktorí sa k nim chcú pridať. Niektorí členovia [ROOT.GetCountry.GetGovernment.GetCourtTitle] už cestujú tam, aby sledovali, ako sa to odohrá, hoci tí duchovnejší z nich tiež chcú tento svätý deň obohatiť pre ľud." # todo: NEW TRANSLATION
 culture_greek.22.a: "Skutočne veľká príležitosť." # todo: NEW TRANSLATION
 culture_greek.22.b: "Budeme oslavovať spolu s nimi." # todo: NEW TRANSLATION
 culture_greek.22.c: "Aj keď s nimi nesúhlasíme v viere, aspoň ju môžeme rešpektovať." # todo: NEW TRANSLATION
 culture_greek.22.d: "Žiadne [ShowReligionAdjectiveWithNoTooltip('orthodox')] tradície sa nebudú šíriť v [target_location.GetNameWithNoTooltip]." # todo: NEW TRANSLATION
 all_pops_in_location_gain_satisfaction: "Všetky [pops|e] získajú [ShowNamedValue('pop_satisfaction_extreme_bonus')|+=2%] [pop_satisfaction|e]" # todo: NEW TRANSLATION
 all_orthodox_pops_in_location_lose_satisfaction: "Všetky [ShowReligionAdjective('orthodox')] [pops|e] stratia [ShowNamedValue('pop_satisfaction_extreme_penalty')|+=2%] [pop_satisfaction|e]" # todo: NEW TRANSLATION
 culture_greek.23.title: "Vplyv [target_location.GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 culture_greek.23.desc: "Vplyv, ktorý [target_location.GetName] má v [ROOT.GetCountry.GetName], je čoraz zrejmejší pre všetkých, najmä pre úradníkov sídliacich v [target_capital.GetName]. Zaujímajú sa, ako sa tento [target_location.GetRank.GetName] v [target_area.GetName] dostal do popredia, hlavne vďaka patronátu [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')] a rôznych jednotlivcov z [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]. Menší byrokrati a bohatí členovia [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')] rovnako využívajú príležitosti, ktoré im tento [target_location.GetRank.GetNameWithNoTooltip] poskytuje, a miestni [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')] si tam užívajú život v luxuse.\n\nHoci všetko toto urobilo niektorých ľudí šťastnými, vyvolalo to aj nárast vplyvu regiónu, čo oslabuje moc tých v [target_capital.GetName] a inde a narúša rovnováhu moci celej krajiny." # todo: NEW TRANSLATION
 culture_greek.23.a: "Prečo trestať miesto za to, že priťahuje nových ľudí a nové bohatstvo?" # todo: NEW TRANSLATION
 culture_greek.23.b: "Ostatné mestá majú oprávnené obavy. Možno by sme mali obmedziť rast [target_location.GetNameWithNoTooltip]." # todo: NEW TRANSLATION
 all_pops_with_influential_polis_modifier_lose_satisfaction: "Všetky [pops|e] v [locations|e] s [ShowModifier('greek_culture_influential_polis')] [modifier|e] stratia [ShowNamedValue('pop_satisfaction_extreme_penalty')|+=2%] [pop_satisfaction|e]" # todo: NEW TRANSLATION
 all_pops_in_location_lose_satisfaction: "Všetky [pops|e] v [target_location.GetName] stratia [ShowNamedValue('pop_satisfaction_extreme_penalty')|+=2%] [pop_satisfaction|e]" # todo: NEW TRANSLATION
 culture_greek.24.title: "Nároky Rhōmaîoi" # todo: NEW TRANSLATION
 culture_greek.24.desc: "Vplyvy Rímskej ríše stále pretrvávajú na územiach [ROOT.GetCountry.GetName]. Hoci titul $BYZ$ nie je tým, o ktorý sa môžeme nárokovať, ľudia sa stále stotožňujú so starou ríšou a tvrdia, že [target_character.GetName] by mal sledovať agresívnejšiu agendu na získanie častí Rímskej ríše. Namiesto toho, aby sme si iba znovu nárokovali jej územia, niektorí populisti v [ROOT.GetCountry.GetGovernment.GetCourtTitle] veria, že by sme sa mali začať vystatovať ako cisári z legiend. Aj [target_capital.GetName] by mal odzrkadľovať tento štýl a používať estetiku, ktorá by nám poskytla potrebnú legitimitu a prestíž na silnejšie nároky na naše staré územia." # todo: NEW TRANSLATION
 culture_greek.24.a: "Títo 'Rhōmaîoi' môžu zabudnúť na svoje fantázie." # todo: NEW TRANSLATION
 culture_greek.24.b: "Takéto kroky by mohli byť prospešné; možno ich môžeme zaviesť." # todo: NEW TRANSLATION
 culture_greek.25.title: "Štipendium [ShowLocationNameWithNoTooltip('mystras')]" # todo: NEW TRANSLATION
 culture_greek.25.desc: "Slávny mystraský spôsob filozofie sa šíri svojím vplyvom cez [ShowRegionName('balkan_region')], [ShowAreaName('west_anatolia_area')] a [ShowRegionName('italy_region')].\n\nMnohé miesta, chudobné aj bohaté, navštívili učenci. Jedným z týchto miest je [target_location.GetName], nachádzajúce sa v [target_area.GetName]. Menší učenci, ktorí vyrazili preskúmať okolité krajiny, tam urobili zastávku a zdieľali svoje filozofické, kultúrne a rečnícke myšlienky s ľuďmi. Mnohí miestni o takéto myšlienky prejavili záujem, najmä vzdelanejší jednotlivci, ktorí chcú rozšíriť svoje obzory. Tieto učenia pritiahli pozornosť [ROOT.GetCountry.GetAdjective] [ROOT.GetCountry.GetGovernment.GetCourtTitle], ktorý má na tieto veci extrémnejšie názory. Niektorí chcú potlačiť akékoľvek myšlienky a učenia, ktoré sa môžu javiť nebezpečné, najmä tie, ktoré by mohli ohroziť identitu [ROOT.GetCountry.GetNameWithNoTooltip], zatiaľ čo niektorí nižšieho postavenia chcú dovoliť rozšírenie týchto myšlienok, pretože poskytujú veľké možnosti pre vzdelanie nášho ľudu." # todo: NEW TRANSLATION
 culture_greek.25.a: "Ich učenia nie sú nebezpečné. Nech šíria svoje poznanie." # todo: NEW TRANSLATION
 culture_greek.25.b: "Prečo by sme riskovali, že [target_location.GetNameWithNoTooltip] vytvorí nejaké radikálne myšlienky?" # todo: NEW TRANSLATION
 event_will_only_fire_for_locations_within_mystras_scholarship_geography: "Tento [event|e] sa môže spustiť iba pre [locations|e] v rámci [ShowScriptedGeographyName('mystras_scholarship_geography')]" # todo: NEW TRANSLATION
 culture_greek.26.title: "Nová [ROOT.GetCountry.GetAdjectiveWithNoTooltip] rétorika" # todo: NEW TRANSLATION
 culture_greek.26.desc: "Počas rímskej éry vzniklo nespočetné množstvo diel, všetky napísané v [ShowLanguageName('latin_language')], jazyku, ktorý sú niektorí ľudia v [ROOT.GetCountry.GetName] neochotní učiť sa. To viedlo našich intelektuálnych učencov k tomu, aby ich prekladali do [ROOT.GetCountry.GetCommonLanguage.GetName], bežného jazyka, ktorým hovorí obyčajný občan.\n\nElita si toho všimla a cíti sa ohrozená myšlienkou, že nižšie vrstvy by mohli mať prístup k rovnakým textom, ktoré [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] študovali a zdokonaľovali po celé roky. Preto v [ROOT.GetCountry.GetGovernment.GetCourtTitle] hovoria o zákaze takýchto prekladaných diel v celej [ROOT.GetCountry.GetFlavorRank], aby zachovali integritu a prestíž elity." # todo: NEW TRANSLATION
 culture_greek.26.a: "Bežný ľud má tiež právo sa učiť." # todo: NEW TRANSLATION
 culture_greek.26.b: "Čokoľvek, aby sme zachovali nadradenosť [ROOT.GetCountry.GetAdjectiveWithNoTooltip] elity." # todo: NEW TRANSLATION
 culture_greek.27.title: "[target_character.GetNameWithNoTooltip] žiada triumf" # todo: NEW TRANSLATION
 culture_greek.27.desc: "[target_character.GetName] sa vrátil z ďalšieho veľkolepého víťazstva, prechádzajúc ulicami [target_capital.GetName] s davom, ktorý ho oslavuje, a obklopený početnou ochrankou jeho najvernejších vojakov, ktorí ho chránia pred akýmkoľvek nebezpečenstvom.\n\nPo príchode do [ROOT.GetCountry.GetGovernment.GetCourtTitle] požiadal o audience, ktorá mu bola neochotne udelená. Či už priateľ alebo nepriateľ, [target_character.GetSheHe] ignoroval všetkých ostatných dvoranov a hľadel priamo na [target_character2.GetName], zatiaľ čo žiadal, aby sa pre neho usporiadal staromódny triumf. [target_character.GetSheHe|U] trvá na tom, že všetci musia poznať [target_character.GetHerHis] skutky, aby sa posilnila morálka a zasiala strach v tých, ktorí by sa opovážili vojensky postaviť proti [ROOT.GetCountry.GetName]." # todo: NEW TRANSLATION
 culture_greek.27.a: "Triumf? Aké hlučné. Odmietame tieto požiadavky." # todo: NEW TRANSLATION
 culture_greek.27.b: "Ak je to pre slávu [ROOT.GetCountry.GetNameWithNoTooltip], radi ho usporiadame." # todo: NEW TRANSLATION
 greek_culture_strategos_will_not_use_triumph_for_popularity: "Nepovolením triumfu pre [target_character.GetName] [target_character.GetSheHe] nezíska žiadny pokrok v plánovaných pokusoch o prevrat" # todo: NEW TRANSLATION
 greek_culture_progress_coup_attempt_if_strategos_is_disloyal: "Usporiadaním triumfu pre [target_character.GetName] bude [target_character.GetSheHe] schopný využiť svoju popularitu na zrýchlenie akýchkoľvek pokusov o prevrat" # todo: NEW TRANSLATION
 culture_greek.28.title: "Útek učencov" # todo: NEW TRANSLATION
 culture_greek.28.desc_common: "Nestabilita v [ROOT.GetCountry.GetName] prinútila mnohých vzdelaných ľudí hľadať lepší život ďaleko od nášho znepokojeného [ROOT.GetCountry.GetFlavorRank]." # todo: NEW TRANSLATION
 culture_greek.28.desc.a: "$culture_greek.28.desc_common$\n\n Túžia žiť stabilnejší život, život, ktorý im umožní rozvíjať svoje myšlienky v filozofii, práve a náboženstve; život, ktorý im nebude v okamihu vziať vojna, hladomor či smrť. Preto mnohí s nostalgicky spomínajú na [target_country.GetName], prestížnejší a stabilnejší [target_country.GetFlavorRank], ktorý im môže poskytnúť pohodlie, po ktorom túžia. Mnohí už začali migrovať do [target_destination.GetName], čo znepokojuje sofistikovanejších členov nášho [ROOT.GetCountry.GetGovernment.GetCourtTitle]. Veria, že takéto migrácie sú ranou na prestíži [ROOT.GetCountry.GetNameWithNoTooltip], pretože ukazujú našu neschopnosť chrániť tých, ktorí nedokážu pretrvať v čase krízy, ale sú napriek tomu cennými členmi spoločnosti." # todo: NEW TRANSLATION
 culture_greek.28.desc.b: "$culture_greek.28.desc_common$\n\n Aj keď nie sú vhodné pôdy na takýto útek, hovoria o slávach vzdialených ríš, o ktorých čítali: ako obyčajní ľudia v [scholar_country.1.GetName] žijú v luxuse, na rozdiel od života tu; ako vládcovia [scholar_country2.GetName] nemajú kruto zaobchádzať so svojimi poddanými, ale rešpektujú ich práva; a ako v [scholar_country3.GetName] nie je tradícia tým, čo všetko udržiava, ale inovácie.\n\nAj keď sú najprv neškodné, tieto hlasy sa rozšírili do každého kúta nášho [ROOT.GetCountry.GetFlavorRank], vytvárajúc občianske nepokoje, čo hlboko znepokojuje náš [ROOT.GetCountry.GetGovernment.GetCourtTitle]." # todo: NEW TRANSLATION
 culture_greek.28.a: "[ROOT.GetCountry.Custom('common_string_nothing_we_can_do')]" # todo: NEW TRANSLATION
 culture_greek.28.b: "Zastavme ich, kým ďalší neskúsia odísť." # todo: NEW TRANSLATION
 culture_greek.28.c: "Ich slová spôsobujú ešte väčšiu nestabilitu." # todo: NEW TRANSLATION
 culture_greek.28.d: "Možno môžeme vložiť nejaké prostriedky na zabránenie ďalších nepokojov." # todo: NEW TRANSLATION
 greek_culture_migration_largely_prevented: "Väčšina [migration|e] bude zmiernená" # todo: NEW TRANSLATION
 culture_greek.29.title: "[ShowBuildingTypeNameWithNoTooltip('orthodox_monastery')] žiada o pomoc" # todo: NEW TRANSLATION
 culture_greek.29.desc: "Ľudia v [target_location.GetName] sú oddaní nasledovníci [ROOT.GetCountry.GetReligion.GetName], modlia sa k [ROOT.GetCountry.GetReligion.GetGodName] každý deň. Avšak kvôli nedostatku podpory od [ROOT.GetCountry.GetName] a jeho vlády miestny [ShowBuildingTypeName('orthodox_monastery')] v [target_location.GetRank.GetName] veľmi potrebuje nové ozdoby, aby primerane odrážal svoj svätý status. Z tohto dôvodu kňazi tam poslali odkaz nášmu [ROOT.GetCountry.GetGovernment.GetCourtTitle], vyzývajúc [target_character.GetName], aby poslal peniaze na dôstojné vyzdobenie exteriéru i interiéru tohto posvätného miesta. Udelenej služby takéhoto druhu by si všimli a ukázalo by všetkým, aké oddaní sme akejkoľvek [ROOT.GetCountry.GetReligion.GetAdjectiveWithNoTooltip] veci v našom [ROOT.GetCountry.GetFlavorRank]." # todo: NEW TRANSLATION
 culture_greek.29.a: "Dostanú svoje zlato na výzdobu." # todo: NEW TRANSLATION
 culture_greek.29.b: "[target_character.GetNameWithNoTooltip] by nemal šetriť peniaze na každom svätom mieste." # todo: NEW TRANSLATION
 culture_greek.29.c: "V mene [ShowReligionNameWithNoTooltip('orthodox')] na to nebudeme šetriť." # todo: NEW TRANSLATION
 all_orthodox_pops_gain_satisfaction_in_location: "Všetky [ShowReligionAdjective('orthodox')] [pops|e] získajú [ShowNamedValue('pop_satisfaction_extreme_bonus')|+=2%] [pop_satisfaction|e]" # todo: NEW TRANSLATION
 culture_greek.30.title: "Odkaz ríše" # todo: NEW TRANSLATION
 culture_greek.30.desc: "Svetlo Východnej Rímskej ríše bolo zhasnuté. Napriek tomu sa mnohí naši občania nazývajú Rhōmaîoi a časť nášho [ROOT.GetCountry.GetGovernment.GetCourtTitle] prevzala zvyky starej ríše. To nám zase poskytlo určitú legitimitu nárokovať si časti tejto starodávnej ríše pod zámienkou, že sme jej oprávnenými nástupcami. Mnohí v [ROOT.GetCountry.GetCapital.GetName] sú si vedomí našej hranice pri [target_province.GetName] a obhajujú jej získanie späť od [target_country.GetName], ktorí nemajú právo nazývať sa dedičmi Ríma. Zdá sa, že aj armáda súhlasí s týmto pocitom a spolu so [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] povzbudzujú obyvateľstvo, aby šlo do vojny a získalo späť, čo právom patrí [ROOT.GetCountry.GetName]." # todo: NEW TRANSLATION
 culture_greek.30.a: "Hranice Ríma budú znovu získané!" # todo: NEW TRANSLATION
 culture_greek.30.b: "Nie je potrebné viesť vojnu." # todo: NEW TRANSLATION

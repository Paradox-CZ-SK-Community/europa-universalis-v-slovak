l_polish:
 maghrebi_culture_masters_of_sahara_country_bonus: "Nasledujúci bonus možno získať z\n$maghreb_masters_of_the_sahara.title$ [Concept('decision','Rozhodnutie')|e]:" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 maghrebi_culture_masters_of_sahara_desert_location_bonus: "Nasledujúci bonus možno získať z\n$maghreb_masters_of_the_sahara.title$ [Concept('decision','Rozhodnutie')|e] a bude pôsobiť na [Concept('locations','lokality')|e] s [ShowVegetationName('desert')]:" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 maghrebi_culture_masters_of_sahara_arid_location_bonus: "Nasledujúci bonus možno získať z\n$maghreb_masters_of_the_sahara.title$ [Concept('decision','Rozhodnutie')|e] a bude pôsobiť na [Concept('locations','lokality')|e] so [ShowClimateName('arid')]:" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 maghrebi_culture.1.title: "[ShowReligionAdjectiveWithNoTooltip('judaism')] komunita v [target_location.GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 maghrebi_culture.1.desc: "Hoci bola za vlády Almohádov veľká časť [ShowCultureName('mustaarabi')] obyvateľstva v [ShowRegionName('maghreb_region')] vyhnaná, [target_location.GetName] sa stal útočiskom, kam sa opäť uchýlilo mnoho príslušníkov [ShowCultureNameWithNoTooltip('mustaarabi')]. [ROOT.GetCountry.GetGovernment.GetCourtTitle] krajiny [ROOT.GetCountry.GetAdjective] síce zaujal voči [ShowReligionAdjective('judaism')] tolerantnejší postoj, no niektorí radikálnejší príslušníci [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] prejavili záujem znovu prijať odvrhnutú náuku Almohádov." # todo: NEW TRANSLATION
 maghrebi_culture.1.a: "[target_location.GetNameWithNoTooltip] zostane útočiskom pre [ShowCultureNameWithNoTooltip('mustaarabi')]." # todo: NEW TRANSLATION
 maghrebi_culture.1.b: "Získajme si radikálnych príslušníkov [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('clergy_estate')] a prinúťme ich prijať [ROOT.GetCountry.GetReligion.GetNameWithNoTooltip]." # todo: NEW TRANSLATION
 maghrebi_culture.2.title: "[ShowReligionAdjectiveWithNoTooltip('ibadi')] krajiny [ShowRegionNameWithNoTooltip('maghreb_region')]" # todo: NEW TRANSLATION
 maghrebi_culture.2.desc: "Hoci už dávno mocný štát vyznávajúci [ShowReligionAdjectiveWithNoTooltip('ibadi')] vieru neovplyvňuje dianie v [ShowRegionName('maghreb_region')], [our_ruler.GetName] podnikol veľké kroky na zjednotenie zvyšných štátov, ktoré sa stále hlásia k [ShowReligionAdjective('ibadi')] viere. Krajiny [ROOT.GetCountry.GetAltAdjective('G')] síce nie sú také bohaté ako niektoré rozvinutejšie štáty v [ShowRegionNameWithNoTooltip('maghreb_region')], no úspech [our_ruler.GetShortNameWithNoTooltip] môže napokon viesť k vzniku nového štátu vyznávajúceho [ShowReligionAdjectiveWithNoTooltip('ibadi')] vieru." # todo: NEW TRANSLATION # todo: COUNTRY CASE
 maghrebi_culture.2.a: "Vydláždime cestu mocnému štátu vyznávajúcemu [ShowReligionAdjectiveWithNoTooltip('ibadi')] vieru v [ShowRegionNameWithNoTooltip('maghreb_region')]!" # todo: NEW TRANSLATION
 maghrebi_culture.2.b: "Namiesto toho by sme sa mali sústrediť na vlastnú cestu." # todo: NEW TRANSLATION
 maghrebi_culture.3.title: "Obnovenie vlády vyznávajúcej [ShowReligionAdjectiveWithNoTooltip('ibadi')] vieru v [ShowRegionNameWithNoTooltip('maghreb_region')]" # todo: NEW TRANSLATION
 maghrebi_culture.3.desc: "[our_ruler.GetName] dokázal nemožné a vytvoril novú ríšu vyznávajúcu [ShowReligionAdjective('ibadi')] vieru v [ShowRegionName('maghreb_region')]. Keďže [ROOT.GetCountry.GetName] je teraz jednou z hlavných mocností v [ShowRegionNameWithNoTooltip('maghreb_region')], niektorí členovia [ROOT.GetCountry.GetGovernment.GetCourtTitle] naliehali na [our_ruler.GetNameWithNoTooltip], aby zaujal nový postoj k ostatným vetvám [ShowReligionGroupName('muslim')]. Nový štát vyznávajúci [ShowReligionAdjectiveWithNoTooltip('ibadi')] vieru síce prilákal nových stúpencov, no mnoho ľudí v [ShowRegionNameWithNoTooltip('maghreb_region')] sa stále hlási k [ShowReligionAdjective('sunni')] viere." # todo: NEW TRANSLATION
 maghrebi_culture.3.a: "Zaujmime tolerantný postoj ku všetkým vetvám [ShowReligionGroupNameWithNoTooltip('muslim')]." # todo: NEW TRANSLATION
 maghrebi_culture.3.b: "Stúpenci ostatných vetiev musia prijať [ShowReligionNameWithNoTooltip('ibadi')]." # todo: NEW TRANSLATION
 maghrebi_culture.4.title: "Rodiace sa štáty vyznávajúce [ShowReligionAdjectiveWithNoTooltip('ibadi')] vieru v [ShowRegionNameWithNoTooltip('maghreb_region')]" # todo: NEW TRANSLATION
 maghrebi_culture.4.desc: "Hoci kedysi významný sultanát vyznávajúci [ShowReligionAdjective('ibadi')] vieru mal v [ShowRegionName('maghreb_region')] veľký vplyv, v storočiach po páde Rustamidov sa mnoho oddaných stúpencov [ShowReligionAdjectiveWithNoTooltip('ibadi')] viery presťahovalo do [ShowAreaName('desert_area')]. Keďže územia [ROOT.GetCountry.GetAltAdjective('A')] teraz siahajú až do týchto krajov, niektorí členovia [ROOT.GetCountry.GetGovernment.GetCourtTitle] navrhli, aby [our_ruler.GetName] podnikol výpravy proti [target_country.GetName], jednému zo slabších zvyškových štátov." # todo: NEW TRANSLATION # todo: COUNTRY CASE
 maghrebi_culture.4.a: "Využime slabosť [target_country.GetNameWithNoTooltip]!" # todo: NEW TRANSLATION
 maghrebi_culture.4.b: "Sú príliš rozdrobení a vzdialení, aby predstavovali hrozbu." # todo: NEW TRANSLATION
 maghrebi_culture.5.title: "Podrobenie obyvateľstva [ShowCultureGroupNameWithNoTooltip('maghrebi_group')] vyznávajúceho [ShowReligionAdjectiveWithNoTooltip('ibadi')] vieru" # todo: NEW TRANSLATION
 maghrebi_culture.5.desc: "Hoci [ShowAreaName('desert_area')] už dlhší čas obýva početné obyvateľstvo vyznávajúce [ShowReligionAdjectiveWithNoTooltip('ibadi')] vieru, väčšina z neho sa dostala pod vládu [ROOT.GetCountry.GetAltAdjective('A')]. Keďže v [ROOT.GetCountry.GetAltAdjectiveWithNoTooltip('L')] teraz žije nezanedbateľný počet stúpencov [ShowReligionNameWithNoTooltip('ibadi')], mnohí členovia [ROOT.GetCountry.GetGovernment.GetCourtTitle] naliehali na [our_ruler.GetName], aby zaujal tolerantný postoj k veriacim [ShowReligionAdjectiveWithNoTooltip('ibadi')], inak môže štát postihnúť náboženská nestabilita." # todo: NEW TRANSLATION # todo: COUNTRY CASE
 maghrebi_culture.5.a: "Musia sa obrátiť k viere [ROOT.GetCountry.GetReligion.GetAltAdjectiveWithNoTooltip('D')]." # todo: NEW TRANSLATION # todo: COUNTRY CASE
 maghrebi_culture.5.b: "Namiesto toho sa pokúsme obyvateľstvo vyznávajúce [ShowReligionAdjectiveWithNoTooltip('ibadi')] vieru pokojne začleniť." # todo: NEW TRANSLATION
 maghrebi_culture.6.title: "Rastúci vplyv krajiny [ROOT.GetCountry.GetAltAdjectiveWithNoTooltip('G')]" # todo: NEW TRANSLATION # todo: COUNTRY CASE
 maghrebi_culture.6.desc: "Hoci [target_country_1.GetName] a [target_country.GetName] mali v desaťročiach po páde Almohádov veľký vplyv na [ShowRegionName('maghreb_region')], [target_country.GetNameWithNoTooltip] sa pod vedením [our_ruler.GetName] podarilo vytvoriť mocnú ríšu v [ShowRegionNameWithNoTooltip('maghreb_region')]. Elity krajín [target_country_1.GetNameWithNoTooltip] a [target_country.GetNameWithNoTooltip] sa síce obávajú vplyvu krajiny [ROOT.GetCountry.GetAdjectiveWithNoTooltip], no mnohé národy skupiny [ShowCultureGroupNameWithNoTooltip('maghrebi_group')] prijali našu vládu oveľa ochotnejšie." # todo: NEW TRANSLATION
 maghrebi_culture.6.a: "Podriadime [ShowRegionNameWithNoTooltip('maghreb_region')] vláde krajiny [ROOT.GetCountry.GetAdjectiveWithNoTooltip]!" # todo: NEW TRANSLATION
 maghrebi_culture.7.title: "Zavlažovanie paliem v [target_location.GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 maghrebi_culture.7.desc: "Mnohé krajiny [ShowRegionName('maghreb_region')] síce ponúkajú úrodnú pôdu, no vďaka blízkosti [ShowAreaName('desert_area')] sa tu nachádza aj nehostinný terén.\n\n[target_location.GetName] požiadal o zdroje na vybudovanie novej budovy [ShowBuildingTypeName('maghreb_palm_irrigation')] v rámci [target_location.GetRank.GetName], ktorá by zmiernila najťažšie podmienky v tejto osade." # todo: NEW TRANSLATION
 maghrebi_culture.7.a: "Poskytnime miestnym [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('burghers_estate')] zdroje na vybudovanie zavlažovacej siete." # todo: NEW TRANSLATION
 maghrebi_culture.7.b: "Nemôžeme si dovoliť tieto zdroje." # todo: NEW TRANSLATION
 maghrebi_culture.8.title: "Prepracovaná architektúra [target_location.GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 maghrebi_culture.8.desc: "Obyvatelia [target_location.GetName] sú už dlho známi tým, že prispôsobujú svoju architektúru nehostinnému terénu [ShowVegetationName('desert')]. Architekti z našej [ROOT.GetCountry.GetGovernment.GetCourtTitle] sa však vrátili ohromení tým, čo v tomto kraji videli. Terén v [ROOT.GetCountry.GetCapital.GetAltAdjective('L')] síce nie je rovnaký ako v [target_location.GetNameWithNoTooltip], naši architekti sú však presvedčení, že s podporou [our_ruler.GetName] možno podobné vylepšenia zaviesť aj v [ROOT.GetCountry.GetCapital.GetAltAdjectiveWithNoTooltip('L')]." # todo: NEW TRANSLATION # todo: COUNTRY CASE
 maghrebi_culture.8.a: "Prevezmime niektoré prvky architektúry z [target_location.GetNameWithNoTooltip]." # todo: NEW TRANSLATION
 maghrebi_culture.8.b: "Namiesto toho by sme mali poskytnúť ďalšie zdroje [target_location.GetNameWithNoTooltip]." # todo: NEW TRANSLATION
 maghrebi_culture.9.title: "Tradície národa skupiny [ShowCultureGroupNameWithNoTooltip('amazigh_group')]" # todo: NEW TRANSLATION
 maghrebi_culture.9.desc: "Od migrácie mnohých kmeňov [ShowCultureName('bedouin_culture')] do [ShowRegionName('maghreb_region')] v 11. storočí, ktorú podporili Fátimovci, boli mnohé domorodé národy skupiny [ShowCultureGroupName('amazigh_group')] nútené uznať rastúcu elitu skupiny [ShowCultureGroupName('arabic_group')]. Hoci si mnohé národy skupiny [ShowCultureGroupNameWithNoTooltip('amazigh_group')] pod vládou [ROOT.GetCountry.GetAltAdjective('I')] zachovali autonómiu, niektorí členovia [ROOT.GetCountry.GetGovernment.GetCourtTitle] navrhli, aby sme do krajiny [ROOT.GetCountry.GetAltAdjectiveWithNoTooltip('G')] privítali niektorých príslušníkov [ShowCultureGroupNameWithNoTooltip('arabic_group')] [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] a posilnili tak legitimitu našej vlády. Takéto pozvanie však pravdepodobne rozhnevá mnohých príslušníkov [ROOT.GetCountry.GetGovernment.GetEstateName('tribes_estate')]." # todo: NEW TRANSLATION # todo: COUNTRY CASE
 maghrebi_culture.9.a: "Mali by sme sa usilovať o spoluprácu s elitou skupiny [ShowCultureGroupNameWithNoTooltip('arabic_group')]." # todo: NEW TRANSLATION
 maghrebi_culture.9.b: "Namiesto toho by sme sa mali snažiť zachovať tradície skupiny [ShowCultureGroupNameWithNoTooltip('amazigh_group')]." # todo: NEW TRANSLATION
 maghrebi_culture.10.title: "Rastúci význam [target_location.GetNameWithNoTooltip] pre saharský obchod" # todo: NEW TRANSLATION
 maghrebi_culture.10.desc: "[target_location.GetName] leží na jednej z mnohých obchodných trás v [ShowAreaName('desert_area')] a už dlho je dôležitou zastávkou pre obchodníkov z [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')]. V posledných rokoch však [target_location.GetRank.GetName] pod ochranou krajiny [ROOT.GetCountry.GetAltAdjective('G')] nadobudol na význame, pretože si ho mnohí obchodníci vyberajú za zastávku vďaka bezpečnému cestovaniu cez územia krajiny [ROOT.GetCountry.GetAdjective]. Jeho rastúci význam síce priniesol [target_location.GetNameWithNoTooltip] väčšie uznanie naprieč Saharou, no zároveň [target_location.GetRank.GetNameWithNoTooltip] značne zaťažil.\n\nV snahe zabezpečiť, aby [target_location.GetRank.GetNameWithNoTooltip] zostal vplyvným obchodným strediskom, mnohí členovia [ROOT.GetCountry.GetGovernment.GetCourtTitle] požiadali [our_ruler.GetName], aby [target_location.GetRank.GetNameWithNoTooltip] poskytol potrebné zdroje na zvládnutie rastúceho prílevu obchodníkov." # todo: NEW TRANSLATION # todo: COUNTRY CASE
 maghrebi_culture.10.a: "[target_location.GetNameWithNoTooltip] si musí zachovať svoj význam v saharskom obchode!" # todo: NEW TRANSLATION
 maghrebi_culture.10.b: "[ROOT.GetCountry.GetGovernment.GetCourtTitle] nemôže poskytnúť zdroje pre [target_location.GetNameWithNoTooltip]." # todo: NEW TRANSLATION
 maghrebi_culture.11.title: "Rozkvet poľnohospodárstva v [target_location.GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 maghrebi_culture.11.desc: "Hoci sa [target_location.GetName] nachádza v jednej z nehostinnejších oblastí [ShowRegionName('maghreb_region')], jeho obyvatelia dokázali zlepšiť svoju situáciu nedávnym rozšírením budovy [ShowBuildingTypeName('maghreb_palm_irrigation')], ktorá priniesla veľký úžitok roľníkom z [ROOT.GetCountry.GetGovernment.GetEstateName('peasants_estate')] v [target_location.GetNameWithNoTooltip]." # todo: NEW TRANSLATION
 maghrebi_culture.11.a: "$common_string_good$" # todo: NEW TRANSLATION
 maghrebi_culture.12.title: "Pod vládou dynastie [ShowDynastyNameWithNoTooltip('hafsid_dynasty')]" # todo: NEW TRANSLATION
 maghrebi_culture.12.desc: "Od pádu Almohádov si [ShowCultureName('tunisian')] dynastia [ShowDynastyNameWithNoTooltip('hafsid_dynasty')] udržiava značný vplyv vo východnej časti [ShowRegionName('maghreb_region')]. Hoci si [ROOT.GetCountry.GetAltAdjective('D')] zachoval určitú nezávislosť od krajiny [target_country.GetName], vládcovia dynastie [ShowDynastyNameWithNoTooltip('hafsid_dynasty')] sa osvedčili ako schopní zvrchovaní páni, ktorí chránia územie krajiny [ROOT.GetCountry.GetAdjectiveWithNoTooltip]. Vláda Almohádov sa však čoraz viac stáva vzdialenou spomienkou a niektorí členovia [ROOT.GetCountry.GetGovernment.GetCourtTitle] spochybnili legitimitu vládcov dynastie [ShowDynastyNameWithNoTooltip('hafsid_dynasty')]. Tvrdia, že nastal čas, aby sa [ROOT.GetCountry.GetAltAdjectiveWithNoTooltip('A')] vymanil z [ShowCultureNameWithNoTooltip('tunisian')] jarma." # todo: NEW TRANSLATION # todo: COUNTRY CASE
 maghrebi_culture.12.a: "Dynastia [ShowDynastyNameWithNoTooltip('hafsid_dynasty')] poskytla krajine [ROOT.GetCountry.GetAltAdjectiveWithNoTooltip('D')] rozsiahlu ochranu." # todo: NEW TRANSLATION # todo: COUNTRY CASE
 maghrebi_culture.12.b: "Nastal čas zbaviť sa okov nadvlády dynastie [ShowDynastyNameWithNoTooltip('hafsid_dynasty')]." # todo: NEW TRANSLATION
 maghrebi_culture.13.title: "Zasahovanie [ShowCultureNameWithNoTooltip('tunisian')] [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')] do vnútorných záležitostí" # todo: NEW TRANSLATION
 maghrebi_culture.13.desc: "Hoci [ROOT.GetCountry.GetLongName] už nejaký čas uznáva [ShowCultureName('tunisian')] zvrchovanosť, [ROOT.GetCountry.GetGovernment.GetCourtTitle] krajiny [ROOT.GetCountry.GetAltAdjectiveWithNoTooltip('G')] si do veľkej miery zachoval autonómiu. Nedávne výpravy, ktoré [target_character.GetName] podnikol na tradičné územie kultúry [ROOT.GetCountry.GetCulture.GetAltAdjective('G')], však vyvolali v celej krajine [ROOT.GetCountry.GetAltAdjectiveWithNoTooltip('D')] nestabilitu. Mnohí členovia [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')] žiadajú, aby bol [target_character.GetNameWithNoTooltip] okamžite vyhostený z krajiny [ROOT.GetCountry.GetAltAdjectiveWithNoTooltip('G')], no takéto vyhostenie pravdepodobne rozhnevá krajinu [target_country.GetName]." # todo: NEW TRANSLATION # todo: COUNTRY CASE
 maghrebi_culture.13.a: "Vyhostime [target_character.GetNameWithNoTooltip] z krajiny [ROOT.GetCountry.GetAltAdjectiveWithNoTooltip('G')]!" # todo: NEW TRANSLATION # todo: COUNTRY CASE
 maghrebi_culture.13.b: "Dovoľme, aby [target_character.GetHerHim] zostal na [ROOT.GetCountry.GetGovernment.GetCourtTitle]." # todo: NEW TRANSLATION
 maghrebi_culture.14.title: "Neovládateľní príslušníci [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')] prepadli [target_location.GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 maghrebi_culture.14.desc: "[ROOT.GetCountry.GetGovernment.GetCourtTitle] zachvátil nepokoj po správach o prepadnutí karaván vojakmi vernými [ROOT.GetCountry.GetGovernment.GetEstateName('tribes_estate')] v [target_location.GetName]. [target_location.GetNameWithNoTooltip] leží na jednej z kľúčových saharských obchodných trás a je dôležitou zastávkou pre mnohých obchodníkov. Mnohí postihnutí obchodníci z [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')] žiadajú odškodnenie za škody spôsobené neovládateľnými vojakmi a požadujú, aby ich uhradili príslušníci [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')]." # todo: NEW TRANSLATION
 maghrebi_culture.14.a: "Prinúťme [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')], aby uhradili škody spôsobené nájazdmi." # todo: NEW TRANSLATION
 maghrebi_culture.14.b: "Pokarhajme [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')], no škody nech uhradí štát." # todo: NEW TRANSLATION
 maghrebi_culture.14.c: "Podporme [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')] a dovoľme im pokračovať v nájazdoch." # todo: NEW TRANSLATION
 maghrebi_culture.15.title: "Rastúca podpora medzi [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')] kultúry [target_culture.GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 maghrebi_culture.15.desc: "S rastúcim rozširovaním moci krajiny [ROOT.GetCountry.GetAdjective] v [ShowRegionName('maghreb_region')] prisahalo niekoľko domorodých skupín vernosť krajine [ROOT.GetCountry.GetAltAdjectiveWithNoTooltip('D')]. Najústretovejší voči vláde krajiny [ROOT.GetCountry.GetAdjectiveWithNoTooltip] sa ukázali príslušníci [ROOT.GetCountry.GetGovernment.GetEstateName('tribes_estate')] kultúry [target_culture.GetName], pričom mnohí vodcovia kultúry [target_culture.GetNameWithNoTooltip] ponúkli plnú podporu svojich kmeňov. Niektorých členov [ROOT.GetCountry.GetGovernment.GetCourtTitle] prekvapila takáto vlna podpory zo strany kultúry [target_culture.GetNameWithNoTooltip]. Jedni navrhli, aby [our_ruler.GetName] poskytol plnú podporu štátu a presadzoval záujmy kultúry [target_culture.GetNameWithNoTooltip] v [ShowRegionNameWithNoTooltip('maghreb_region')], iní zas navrhli využiť ich horlivú podporu." # todo: NEW TRANSLATION # todo: COUNTRY CASE
 maghrebi_culture.15.a: "Ich podporu vítame!" # todo: NEW TRANSLATION
 maghrebi_culture.15.b: "Využime ich podporu na posilnenie nášho vplyvu v [ShowRegionNameWithNoTooltip('maghreb_region')]." # todo: NEW TRANSLATION
 maghrebi_culture.16.title: "Významný generál kultúry [target_culture.GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 maghrebi_culture.16.desc: "Rastúce vzťahy medzi národom kultúry [target_culture.GetName] a elitou kultúry [ROOT.GetCountry.GetCulture.GetAltAdjective('G')] sa ukázali ako prínosné, keďže vláda krajiny [ROOT.GetCountry.GetAdjective] v [ShowRegionName('maghreb_region')] sa stabilizovala. [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')] kultúry [target_culture.GetNameWithNoTooltip] chcú ďalej prejaviť svoju lojalitu voči [ROOT.GetCountry.GetAdjectiveWithNoTooltip] [ROOT.GetCountry.GetGovernment.GetCourtTitle], a preto ponúkli jedného zo svojich nadaných vodcov do služieb krajiny [ROOT.GetCountry.GetAltAdjectiveWithNoTooltip('G')]. Niektorí príslušníci [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')] však naliehali na [our_ruler.GetName], aby ponuku odmietol. Obávajú sa, že poskytnutie autonómie [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')] kultúry [target_culture.GetNameWithNoTooltip] môže v konečnom dôsledku oslabiť našu vládu v [ShowRegionNameWithNoTooltip('maghreb_region')]." # todo: NEW TRANSLATION # todo: COUNTRY CASE
 maghrebi_culture.16.a: "Privítajme [target_character.GetShortNameWithNoTooltip] na [ROOT.GetCountry.GetGovernment.GetCourtTitle]!" # todo: NEW TRANSLATION
 maghrebi_culture.16.b: "Odmietnime [target_character.GetHimHer] vymenovať za generála." # todo: NEW TRANSLATION
 maghrebi_culture.17.title: "[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')] ponúkajú nadaného generála" # todo: NEW TRANSLATION
 maghrebi_culture.17.desc: "Príslušníci [ROOT.GetCountry.GetGovernment.GetEstateName('tribes_estate')] v krajine [ROOT.GetCountry.GetAltAdjective('D')] síce zaťažovali [ROOT.GetCountry.GetGovernment.GetCourtTitle], no v posledných rokoch začali niekdajší nepoddajní príslušníci [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')] uznávať moc krajiny [ROOT.GetCountry.GetAdjectiveWithNoTooltip] v [ShowRegionName('maghreb_region')]. Aby dokázali svoju novoobjavenú lojalitu voči [ROOT.GetCountry.GetGovernment.GetCourtTitle], príslušníci [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')] ponúkli do služieb krajiny [ROOT.GetCountry.GetAltAdjectiveWithNoTooltip('G')] [target_character.GetName], o ktorom sa hovorí, že má veľký talent. Niektorí členovia [ROOT.GetCountry.GetGovernment.GetCourtTitle] sa však obávajú, že ide o pokus [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')] získať si vplyv u [our_ruler.GetName]." # todo: NEW TRANSLATION # todo: COUNTRY CASE
 maghrebi_culture.17.a: "Prijmime ponuku [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')]." # todo: NEW TRANSLATION
 maghrebi_culture.17.b: "Nemôžeme riskovať, že [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')] získajú ďalší vplyv." # todo: NEW TRANSLATION
 maghrebi_culture.18.title: "Rastúci význam dynastie [our_ruler.GetDynasty.GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 maghrebi_culture.18.desc: "Po páde Almohádov získali dynastie [ShowDynastyName('marinid_dynasty')] a [ShowDynastyName('hafsid_dynasty')] v [ShowRegionName('maghreb_region')] značnú moc. Nedávne vojenské ťaženia dynastie [our_ruler.GetDynasty.GetName] však otvorili cestu k vzostupu novej mocnosti v [ShowRegionNameWithNoTooltip('maghreb_region')]. Vláda dynastie [our_ruler.GetDynasty.GetNameWithNoTooltip] v [ShowRegionNameWithNoTooltip('maghreb_region')] si síce získala podporu domorodého obyvateľstva skupiny [ShowCultureGroupNameWithNoTooltip('amazigh_group')], no niektorí členovia [ROOT.GetCountry.GetGovernment.GetCourtTitle] navrhli, aby sme sa poobzerali za hranicami, ak chceme prekonať ostatných významných hráčov v [ShowRegionNameWithNoTooltip('maghreb_region')]." # todo: NEW TRANSLATION
 maghrebi_culture.18.a: "Mali by sme hľadať spojencov a posilniť svoje postavenie." # todo: NEW TRANSLATION
 maghrebi_culture.18.b: "Namiesto toho sa sústreďme na vnútornú politiku." # todo: NEW TRANSLATION
 maghrebi_culture.19.title: "Spoločná jednota s národom kultúry [target_culture.GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 maghrebi_culture.19.desc: "Migrácia kultúry [ShowCultureName('bedouin_culture')] do [ShowRegionName('maghreb_region')] v 11. storočí síce premenila politické usporiadanie tohto kraja, no národy kultúr [ROOT.GetCountry.GetCulture.GetAltAdjective('G')] a [target_culture.GetName] pod vládou krajiny [ROOT.GetCountry.GetAdjectiveWithNoTooltip] znovu pocítili vzájomnú jednotu. Vláda krajiny [ROOT.GetCountry.GetAdjectiveWithNoTooltip] v ich domovine, v [ShowRegionNameWithNoTooltip('maghreb_region')], do veľkej miery ukončila niekdajšie kmeňové spory a medzi týmito národmi vznikla nová spoločná jednota." # todo: NEW TRANSLATION # todo: COUNTRY CASE
 maghrebi_culture.19.a: "Silná jednota nás urobí nepremožiteľnými!" # todo: NEW TRANSLATION
 maghrebi_culture.19.b: "Našu silnú jednotu s kultúrou [target_culture.GetNameWithNoTooltip] by sme mali využiť na posilnenie vplyvu v [ShowRegionNameWithNoTooltip('maghreb_region')]." # todo: NEW TRANSLATION
 maghrebi_culture.19.c: "Kultúrne puto medzi kultúrami [ROOT.GetCountry.GetCulture.GetAltAdjectiveWithNoTooltip('I')] a [target_culture.GetNameWithNoTooltip] je nezlomné." # todo: NEW TRANSLATION # todo: COUNTRY CASE
 maghrebi_culture.20.title: "Vláda krajiny [ROOT.GetCountry.GetAdjectiveWithNoTooltip] nad [ShowRegionNameWithNoTooltip('maghreb_region')]" # todo: NEW TRANSLATION
 maghrebi_culture.20.desc: "Mnohí príslušníci elity kultúry [ROOT.GetCountry.GetCulture.GetAltAdjective('G')] si postupne osvojili niektoré zvyky a tradície skupiny [ShowCultureGroupName('arabic_group')], čo občas viedlo ku konfliktom s tradicionalistickejšími národmi v [ShowRegionName('maghreb_region')]. Pre [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] sa národ kultúry [target_culture.GetName] stal hlavným zdrojom nespokojnosti na [ROOT.GetCountry.GetGovernment.GetCourtTitle], pričom mnohé elity kultúry [target_culture.GetNameWithNoTooltip] odmietajú obchodovať s [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')].\n\n[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')] chcú využiť svoj vplyv v celej krajine [ROOT.GetCountry.GetAltAdjective('D')], a preto požiadali [our_ruler.GetName], aby voči kultúre [target_culture.GetNameWithNoTooltip] presadzoval agresívnejšiu asimilačnú politiku. Niektorí členovia [ROOT.GetCountry.GetGovernment.GetCourtTitle] však naliehali na [our_ruler.GetShortNameWithNoTooltip], aby ich požiadavky odmietol, pretože sa obávajú následnej nestability." # todo: NEW TRANSLATION # todo: COUNTRY CASE
 maghrebi_culture.20.a: "Usilujme sa o ich asimiláciu do spoločnosti kultúry [ROOT.GetCountry.GetCulture.GetAltAdjectiveWithNoTooltip('G')]." # todo: NEW TRANSLATION # todo: COUNTRY CASE
 maghrebi_culture.20.b: "Namiesto toho by sme sa mali snažiť začleniť národ kultúry [target_culture.GetNameWithNoTooltip]." # todo: NEW TRANSLATION
 maghrebi_culture.21.title: "Nešťastie v [ShowRegionNameWithNoTooltip('maghreb_region')]" # todo: NEW TRANSLATION
 maghrebi_culture.21.desc: "Pád posledného štátu [ShowReligionGroupAdjective('muslim')] v [ShowRegionName('iberia_region')] vyvolal v [ShowRegionName('maghreb_region')] novú vlnu paniky. Mnohí sa obávajú, že štáty [ShowReligionGroupAdjectiveWithNoTooltip('christian')] v [ShowRegionNameWithNoTooltip('iberia_region')] čoskoro obrátia svoj zrak k [ShowRegionNameWithNoTooltip('maghreb_region')]. Mnohí príslušníci kultúry [ShowCultureName('andalusi')] sa už uchýlili do krajiny [ROOT.GetCountry.GetAltAdjectiveWithNoTooltip('G')] v nádeji, že uniknú hnevu skupiny [ShowCultureGroupName('iberian_group')]." # todo: NEW TRANSLATION # todo: COUNTRY CASE
 maghrebi_culture.21.a: "Neustúpime útočníkom zo skupiny [ShowCultureGroupNameWithNoTooltip('iberian_group')]!" # todo: NEW TRANSLATION
 maghrebi_culture.21.b: "Mali by sme zostať ostražití pred možnou inváziou." # todo: NEW TRANSLATION
 maghrebi_culture.22.title: "Prítomnosť v [ShowScriptedGeographyNameWithNoTooltip('mediterranean_sea_geography')]" # todo: NEW TRANSLATION
 maghrebi_culture.22.desc: "Obyvatelia krajiny [ROOT.GetCountry.GetAltAdjective('G')] sú síce zvyknutejší na saharský obchod, no ťaženia [our_ruler.GetName] pomohli krajine [ROOT.GetCountry.GetAltAdjectiveWithNoTooltip('D')] vybudovať rozsiahlu prítomnosť na pobreží a získať prístup k oblasti [ShowScriptedGeographyName('mediterranean_sea_geography')]. Mnohí príslušníci [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')] vidia nové obchodné príležitosti a naliehajú na [ROOT.GetCountry.GetGovernment.GetCourtTitle], aby financoval rozšírenie flotily. Niektorí sa však obávajú, že by to mohlo narušiť tradičné saharské obchodné cesty, z ktorých krajina [ROOT.GetCountry.GetNameWithNoTooltip] už dlho ťaží." # todo: NEW TRANSLATION # todo: COUNTRY CASE
 maghrebi_culture.22.a: "Musíme rýchlo vybudovať námornú prítomnosť." # todo: NEW TRANSLATION
 maghrebi_culture.22.b: "Nesmieme zanedbávať naše saharské obchodné cesty." # todo: NEW TRANSLATION
 maghrebi_culture.23.title: "Zúčtovanie s arabizovanou elitou" # todo: NEW TRANSLATION
 maghrebi_culture.23.desc: "Národ kultúry [target_culture.GetName] má v [ShowRegionName('maghreb_region')] už dlho značnú moc. Je tiež predmetom sporov s mnohými príslušníkmi skupiny [ShowCultureGroupName('amazigh_group')], keďže presadzuje agresívnu asimilačnú politiku a nabáda ich, aby prijali zvyky skupiny [ShowCultureGroupName('arabic_group')]. S nástupom krajiny [ROOT.GetCountry.GetAltAdjective('G')], [ROOT.GetCountry.GetFlavorRank], v ktorej má kultúra [ROOT.GetCountry.GetCulture.GetName] moc ako vládnuca elita, požiadali niektorí príslušníci [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] [our_ruler.GetName], aby obmedzil moc kultúry [target_culture.GetNameWithNoTooltip]. Iní členovia [ROOT.GetCountry.GetGovernment.GetCourtTitle] však považujú elitu kultúry [target_culture.GetNameWithNoTooltip] za nenahraditeľných spojencov pri upevňovaní našej rastúcej vlády nad [ShowRegionNameWithNoTooltip('maghreb_region')]." # todo: NEW TRANSLATION # todo: COUNTRY CASE
 maghrebi_culture.23.a: "Usilujme sa o kompromis medzi elitami kultúr [ROOT.GetCountry.GetCulture.GetAltAdjectiveWithNoTooltip('G')] a [target_culture.GetNameWithNoTooltip]." # todo: NEW TRANSLATION # todo: COUNTRY CASE
 maghrebi_culture.23.b: "Vplyv kultúry [target_culture.GetNameWithNoTooltip] v [ShowRegionNameWithNoTooltip('maghreb_region')] sa skončil." # todo: NEW TRANSLATION
 maghrebi_culture.24.title: "Nové kilimy kultúry [ROOT.GetCountry.GetCulture.GetAltAdjectiveWithNoTooltip('G')]" # todo: NEW TRANSLATION # todo: COUNTRY CASE
 maghrebi_culture.24.desc: "Tapisérie kultúry [ROOT.GetCountry.GetCulture.GetAltAdjective('G')] sú už dlho vyhľadávaným tovarom v [ShowRegionName('maghreb_region')] a kľúčovým artiklom mnohých obchodníkov z krajiny [ROOT.GetCountry.GetAdjective]. Získanie spoľahlivejšieho zdroja tovaru [ShowGoodsNameWithNoTooltip('dyes')] však v posledných rokoch viedlo k vzniku novej generácie kilimov kultúry [ROOT.GetCountry.GetCulture.GetAltAdjectiveWithNoTooltip('G')]. Tapisérie sa tešia čoraz väčšiemu záujmu v [ShowRegionName('maghreb_region')] aj v zahraničí." # todo: NEW TRANSLATION # todo: COUNTRY CASE
 maghrebi_culture.24.a: "Využime výhody nových tapisérií." # todo: NEW TRANSLATION
 maghrebi_culture.24.b: "Musíme naďalej investovať do nových tapisérií!" # todo: NEW TRANSLATION
 maghrebi_culture.25.title: "Upevnenie území [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')]" # todo: NEW TRANSLATION
 maghrebi_culture.25.desc: "Hoci sila [ROOT.GetCountry.GetGovernment.GetEstateName('tribes_estate')] v minulosti významne prispela k tomu, že [ROOT.GetCountry.GetName] dokázala odraziť hrozby, rozrastajúca sa byrokracia [ROOT.GetCountry.GetFlavorRank] vyvolala na [ROOT.GetCountry.GetGovernment.GetCourtTitle] početné diskusie o ich účinnosti. Hoci [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')] v minulosti pomohli chrániť [ROOT.GetCountry.GetNameWithNoTooltip], zároveň spôsobovali problémy, keď nesúhlasili s politikou [ROOT.GetCountry.GetGovernment.GetCourtTitle].\n\nTo viedlo k diskusiám na [ROOT.GetCountry.GetGovernment.GetCourtTitle], že štát dostatočne zosilnel a na svoju ochranu sa už nemusí spoliehať na [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')]. Navyše treba teraz [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')] konečne dostať pod kontrolu, aby sa posilnil rozvíjajúci sa [ROOT.GetCountry.GetAdjectiveWithNoTooltip] štát." # todo: NEW TRANSLATION
 maghrebi_culture.25.a: "Pripomeňme [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')], kam patria." # todo: NEW TRANSLATION
 maghrebi_culture.25.b: "Zachovajme autonómiu [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')], aby sme predišli vnútorným rozbrojom." # todo: NEW TRANSLATION
 maghrebi_culture.26.title: "Nadvláda nad oblasťou [ShowRegionNameWithNoTooltip('maghreb_region')]" # todo: NEW TRANSLATION
 maghrebi_culture.26.desc: "Hoci po páde Almohádov upadla oblasť [ShowRegionName('maghreb_region')] do obdobia nestability a oslabil aj jej vplyv na [ShowRegionName('iberia_region')], [ROOT.GetCountry.GetAltAdjective('A')] pod vládou [our_ruler.GetName] sa stala de facto mocnosťou regiónu. Kým niektoré časti oblasti [ShowRegionNameWithNoTooltip('maghreb_region')] naďalej zostávajú mimo vplyvu [ROOT.GetCountry.GetAdjectiveWithNoTooltip], [ShowCultureGroupName('iberian_group')] kráľovstvá skôr uznajú [ROOT.GetCountry.GetNameWithNoTooltip] za regionálneho rivala, ktorého nemožno podceňovať, ak chcú dobyť oblasť [ShowRegionNameWithNoTooltip('maghreb_region')]." # todo: NEW TRANSLATION # todo: COUNTRY CASE
 maghrebi_culture.26.a: "Budeme ochrancami Maghrebu!" # todo: NEW TRANSLATION
 maghrebi_culture.27.title: "Zlatý vek [our_ruler.GetDynasty.GetNameWithNoTooltip] v oblasti [ShowRegionNameWithNoTooltip('maghreb_region')]" # todo: NEW TRANSLATION
 maghrebi_culture.27.desc: "Keďže väčšina oblasti [ShowRegionName('maghreb_region')] je teraz pod vládou [ROOT.GetCountry.GetAdjective], [our_ruler.GetDynasty.GetName] podnikli kroky na obnovu významných kultúrnych stavieb v oblasti [ShowRegionNameWithNoTooltip('maghreb_region')] a podporili výstavbu viacerých nových vzdelávacích centier. Hoci región kedysi stál na pokraji nadvlády cudzích mocností, pod vládou dynastie [our_ruler.GetDynasty.GetNameWithNoTooltip] sa namiesto toho stal významnou mocnosťou, ktorú si vážia v celom priestore [ShowScriptedGeographyName('mediterranean_sea_geography')]." # todo: NEW TRANSLATION
 maghrebi_culture.27.a: "Nech vláda dynastie [our_ruler.GetDynasty.GetNameWithNoTooltip] naďalej prináša blahobyt" # todo: NEW TRANSLATION
 maghrebi_culture.28.title: "Vplyv na korzárov" # todo: NEW TRANSLATION
 maghrebi_culture.28.desc: "Hoci si korzári z oblasti [ShowRegionName('maghreb_region')] získali v [ShowContinentName('europe')] povesť významnej lúpežnej sily v priestore [ShowScriptedGeographyName('mediterranean_sea_geography')], ich podpora sa dosiaľ v jednotlivých štátoch líšila.\n\nS rastúcim vplyvom [ROOT.GetCountry.GetAdjective] na pobreží sa však mnohí korzári obrátili na [ROOT.GetCountry.GetAltAdjectiveWithNoTooltip('A')] v nádeji, že získajú našu podporu a zintenzívnia nájazdy v priestore [ShowScriptedGeographyNameWithNoTooltip('mediterranean_sea_geography')]. Niektorí členovia [ROOT.GetCountry.GetGovernment.GetCourtTitle] sa však domnievajú, že je to aj príležitosť oslabiť korzárov a pokúsiť sa obnoviť vzťahy s európskymi mocnosťami, ktoré si za stáročia znepriatelili." # todo: NEW TRANSLATION # todo: COUNTRY CASE
 maghrebi_culture.28.a: "Poskytnime im plnú podporu štátu." # todo: NEW TRANSLATION
 maghrebi_culture.28.b: "Dovoľme korzárom pokračovať v ich činnosti." # todo: NEW TRANSLATION
 maghrebi_culture.28.c: "Zastavme korzárske nájazdy" # todo: NEW TRANSLATION
 maghreb_ibadi_nation_establish_majlis_ammi_said.title: "Centralizácia Madžlisu Amí Saída" # todo: NEW TRANSLATION
 maghreb_ibadi_nation_establish_majlis_ammi_said.desc: "Po páde Rustamidov bolo mnoho [ShowReligionAdjective('ibadi')] obyvateľov oblasti [ShowRegionName('maghreb_region')] nútených utiecť do údolia Mzab. Hoci sa mnohé z týchto [ShowReligionAdjectiveWithNoTooltip('ibadi')] štátov rozhodli zúčastňovať na Madžlise Amí Saída pod vedením [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')], iné si zachovali nezávislosť.\n\nKeďže mnohé z najľudnatejších [ShowReligionAdjectiveWithNoTooltip('ibadi')] území sú teraz súčasťou [ROOT.GetCountry.GetAltAdjective('I')], [our_ruler.GetName] sa rozhodol presunúť Madžlis Amí Saída do [ROOT.GetCountry.GetCapital.GetAltAdjective('G')] a centralizovať ho. Dúfa, že tak vytvorí silný a vplyvný [ShowReligionAdjectiveWithNoTooltip('ibadi')] štát v oblasti [ShowRegionNameWithNoTooltip('maghreb_region')]." # todo: NEW TRANSLATION # todo: COUNTRY CASE
 maghreb_ibadi_nation_establish_majlis_ammi_said.desc.entry: "Rada roztrúsená medzi hrdými a nezávislými [ShowReligionAdjective('ibadi')] štátmi môže radiť, ale nemôže vládnuť. Teraz, keď sa najľudnatejšie z týchto území podriadili našej moci, možno Madžlis Amí Saída zhromaždiť pod jednou strechou a pod jednu autoritu. Útočisko v údolí Mzab sa tak môže stať samostatnou ríšou v oblasti [ShowRegionName('maghreb_region')]." # todo: NEW TRANSLATION
 maghreb_ibadi_nation_establish_majlis_ammi_said.a: "Vernosť [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')] pomôže upevniť našu vládu!" # todo: NEW TRANSLATION
 maghreb_ibadi_nation_establish_majlis_ammi_said.a.entry: "Vernosť $crown_estate$ pomôže upevniť našu vládu!" # todo: NEW TRANSLATION
 maghreb_masters_of_the_sahara.title: "Páni Sahary" # todo: NEW TRANSLATION
 maghreb_masters_of_the_sahara.desc: "Obyvatelia oblasti [ShowRegionName('maghreb_region')] sa už celé generácie zapájajú do saharského obchodu a prechádzajú nehostinnými púšťami, aby prepravovali cenný tovar. Hoci to môže byť náročná úloha, ak sa nám podarí získať značný vplyv nad oblasťou [ShowAreaName('desert_area')] a zároveň rozšíriť infraštruktúru hlavných karavánových zastávok, naši ľudia možno napokon skrotia tieto neľútostné piesky." # todo: NEW TRANSLATION
 maghreb_masters_of_the_sahara.a: "Dokázali sme nemožné!" # todo: NEW TRANSLATION
 empower_the_desert_power_privilege_tt: "[ShowEstatePrivilegeName('desert_power')] sa výrazne posilní a získa ďalšie výhody, ktoré vyvážia postihy spôsobené [ShowVegetationName('desert')] a [ShowClimateName('arid')] v [Concept('locations','lokalitách')|e]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 empower_the_desert_power_privilege_tt_default_bonus: "[ShowEstatePrivilegeName('desert_power')] navyše získa #G +0.0020#! [ShowModifierTypeName('global_monthly_development')] a #G +2.50%#! [ShowModifierTypeName('global_max_control')]" # todo: NEW TRANSLATION

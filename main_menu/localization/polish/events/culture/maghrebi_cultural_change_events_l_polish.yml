 maghrebi_cultural_change_events.1004.title: "Drzosť osadníkov [ShowCultureNameWithNoTooltip('andalusi')]" # todo: NEW TRANSLATION
 maghrebi_cultural_change_events.1004.desc: "V posledných rokoch prišiel z [ShowRegionName('iberia_region')] veľký prílev [ShowCultureName('andalusi')], ktorí utekajú pred rozsiahlym prenasledovaním, ktorému tam čelia naši [ShowReligionGroupAdjective('muslim')] spolubratia. Napriek daru nového domova, ktorý im [ROOT.GetCountry.GetReligion.GetGodName] poskytol, si títo opovážliví novoprišelci dovoľujú otvorene sa sťažovať na životnú úroveň v [ShowRegionName('maghreb_region')], a pritom vyzdvihujú tých, ktorí zostali v krajinách podlých [ShowReligionGroupAdjective('christian')] štátov!\n\nZnámy člen [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] z [target_pop2.GetName] prirovnal tento postoj k „takmer odpadnutiu od viery.“" # todo: NEW TRANSLATION
 maghrebi_cultural_change_events.1004.a: "Ak je [ShowRegionNameWithNoTooltip('iberia_region')] také skvelé, prečo sa tam nevrátia?" # todo: NEW TRANSLATION

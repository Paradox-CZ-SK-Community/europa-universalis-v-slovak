l_polish:
 oligarchic_capture.1.title: "Frakcia povstáva" # todo: NEW TRANSLATION
 oligarchic_capture.1.desc: "Roky úpadku vyprázdnili naše republikánske inštitúcie. Dominantný stav vycítil slabosť a pokúsil sa ovládnuť zákonodarný aparát, odstaviť súperov a ohýbať zákony podľa svojej vôle. Musíme sa rozhodnúť, ako tejto výzve čeliť: podvoliť sa frakcii a zachovať krehký mier, alebo sa jej vzoprieť a riskovať otvorenú vzburu." # todo: NEW TRANSLATION
 oligarchic_capture.1.a: "Podvoľme sa požiadavkám frakcie." # todo: NEW TRANSLATION
 oligarchic_capture.1.b: "Vzoprieme sa im, nech to stojí čokoľvek!" # todo: NEW TRANSLATION
 oligarchic_capture.1.tt: "Najnespokojnejšie provincie povstanú na podporu frakcie [ShowDisasterName('oligarchic_capture')]" # todo: NEW TRANSLATION
 oligarchic_capture.2.title: "Oligarchovia žiadajú tribút" # todo: NEW TRANSLATION
 oligarchic_capture.2.desc: "Vodcovia frakcie nám predkladajú sotva zastretú požiadavku na peniaze, ktorú vydávajú za príspevok na verejné blaho. Ak zaplatíme, ich rozhorčenie na čas utíchne. Ak odmietneme, využijú náš vzdor na získanie ďalších stúpencov." # todo: NEW TRANSLATION
 oligarchic_capture.2.a: "Vyplaťme ich." # todo: NEW TRANSLATION
 oligarchic_capture.2.b: "Nenecháme sa vydierať." # todo: NEW TRANSLATION
 oligarchic_capture.3.title: "Občania sa zhromažďujú za reformu" # todo: NEW TRANSLATION
 oligarchic_capture.3.desc: "Na verejných námestiach sa zhromažďujú davy a žiadajú návrat čestnej vlády a koniec vlády frakcií. Ich zápal nám dáva príležitosť obnoviť republikánskeho ducha, no ustúpiť davu znamená riskovať nepokoje." # todo: NEW TRANSLATION
 oligarchic_capture.3.a: "Podporme ich vec." # todo: NEW TRANSLATION
 oligarchic_capture.3.b: "Udržme v uliciach poriadok." # todo: NEW TRANSLATION
 oligarchic_capture.4.title: "Frakcia v senáte bola očistená" # todo: NEW TRANSLATION
 oligarchic_capture.4.desc: "Oligarchovia sa pokúšajú vylúčiť skupinu senátorov, ktorých považujú za nelojálnych. Ak očistu dovolíme, krátkodobo to upevní stabilitu ríše, no frakcii tým doprajeme ďalšie víťazstvo. Ak obvinených ochránime, ubránime naše inštitúcie za cenu ďalších nepokojov." # todo: NEW TRANSLATION
 oligarchic_capture.4.a: "Nech očista pokračuje." # todo: NEW TRANSLATION
 oligarchic_capture.4.b: "Ochráňme obvinených." # todo: NEW TRANSLATION
 oligarchic_capture.5.title: "Nepokoje v uliciach" # todo: NEW TRANSLATION
 oligarchic_capture.5.desc: "Bitky medzi stúpencami frakcie a jej odporcami sa prenášajú na trhoviská a do prístavov. Môžeme nechať vášne samy vychladnúť, alebo vyslať stráže, aby nastolili poriadok pevnou rukou." # todo: NEW TRANSLATION
 oligarchic_capture.5.a: "Nech vášne vychladnú." # todo: NEW TRANSLATION
 oligarchic_capture.5.b: "Tvrdо zakročme." # todo: NEW TRANSLATION
 oligarchic_capture.100.title: "Republika obnovená" # todo: NEW TRANSLATION
 oligarchic_capture.100.desc: "Moc frakcie bola zlomená. Naše súdy, rady a zhromaždenia sa opäť zodpovedajú občanom, a nie skupinke veľmožov. Republika prečkala búrku a jej inštitúcie vyšli z tejto skúšky odolnejšie." # todo: NEW TRANSLATION
 oligarchic_capture.100.a: "Naše inštitúcie pretrvajú." # todo: NEW TRANSLATION
 oligarchic_capture.101.title: "Oligarchická ústava upevnená" # todo: NEW TRANSLATION
 oligarchic_capture.101.desc: "Frakcia zvíťazila. Nová ústava, napísaná v prospech oligarchov, zakotvuje ich nadvládu v samotných základoch štátu. Naša republika bude po celé pokolenie republikou iba podľa mena a jej úrady si bude medzi sebou rozdeľovať úzky kruh mocných." # todo: NEW TRANSLATION
 oligarchic_capture.101.desc.ringleader: "Frakcia zvíťazila a jej vodca [oligarchic_ringleader_scope.GetName] vychádza zo zákulisia senátu, aby si nárokoval korunu. Naša republika bude po celé pokolenie republikou iba podľa mena a jej úrady si bude medzi sebou rozdeľovať úzky kruh mocných." # todo: NEW TRANSLATION
 oligarchic_capture.101.a: "Frakcia zvíťazila." # todo: NEW TRANSLATION
 oligarchic_capture.101.b: "[oligarchic_ringleader_scope.GetName] sa ujíma koruny." # todo: NEW TRANSLATION
 oligarchic_capture.6.title: "Odhalenie vodcu frakcie" # todo: NEW TRANSLATION
 oligarchic_capture.6.desc: "Naši agenti celé týždne sledovali peniaze, protislužby a šepkané rozkazy v radoch frakcie. Napokon sa ukázalo jediné meno: [oligarchic_ringleader_scope.GetName], osoba, ktorá v skutočnosti riadi jej kroky." # todo: NEW TRANSLATION
 oligarchic_capture.6.a: "Teraz vieme, s kým máme do činenia." # todo: NEW TRANSLATION
 oligarchic_capture.7.title: "Konfrontácia s vodcom frakcie" # todo: NEW TRANSLATION
 oligarchic_capture.7.desc.ready: "Keďže sme odhalili [oligarchic_ringleader_scope.GetName], môžeme proti nemu zakročiť priamo. Autorita koruny sa dostatočne obnovila, takže frakciu by sme mali rýchlo rozbiť." # todo: NEW TRANSLATION
 oligarchic_capture.7.desc.not_ready: "Keďže sme odhalili [oligarchic_ringleader_scope.GetName], mohli by sme proti nemu zakročiť priamo, no autorita koruny sa ešte dostatočne neobnovila. Ak zaútočíme priskoro, môžeme frakciu len ešte viac stmeliť." # todo: NEW TRANSLATION
 oligarchic_capture.7.a: "Zakročme proti nemu." # todo: NEW TRANSLATION
 oligarchic_capture.7.a.success_tt: "Naša [Concept('crown_power','moc koruny')|e] dosiahla aspoň 30 %, takže pokus uspeje" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 oligarchic_capture.7.a.fail_tt: "Naša [Concept('crown_power','moc koruny')|e] ešte nedosiahla 30 %, takže pokus zlyhá a následný odpor nás bude stáť veľa stability" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 oligarchic_capture.8.title: "Vyjednávanie o ústupkoch stavom" # todo: NEW TRANSLATION
 oligarchic_capture.8.desc: "Namiesto otvorenej konfrontácie s frakciou začíname tajné rokovania. Ponúkame zlato a menšie ústupky, aby sme zmiernili jej nespokojnosť a spomalili jej rast." # todo: NEW TRANSLATION
 oligarchic_capture.8.a: "Začnime rokovania." # todo: NEW TRANSLATION
 oligarchic_capture.12.title: "Vodca frakcie si nakláňa dvorana" # todo: NEW TRANSLATION
 oligarchic_capture.12.desc: "Dozvedáme sa, že vodca frakcie si potajomky nakláňa jedného z členov nášho dvora a výmenou za podporu mu ponúka výhody a sľuby. Môžeme to prehliadnuť alebo podniknúť kroky na upevnenie dvoranovej lojality." # todo: NEW TRANSLATION
 oligarchic_capture.12.a: "Nechajme to tak; nestojí to za námahu." # todo: NEW TRANSLATION
 oligarchic_capture.12.b: "Potvrďme dvoranovu vernosť korune." # todo: NEW TRANSLATION
 oligarchic_capture.13.title: "Vodca frakcie skúša moc koruny" # todo: NEW TRANSLATION
 oligarchic_capture.13.desc: "Vodca frakcie pred očami dvora verejne skúša, kam až siaha autorita kráľovského stavu, a hľadá jej slabiny. Môžeme túto výzvu nechať bez odozvy alebo rozhodne odpovedať." # todo: NEW TRANSLATION
 oligarchic_capture.13.a: "Nechajme túto výzvu bez odozvy." # todo: NEW TRANSLATION
 oligarchic_capture.13.b: "Odpovedzme rozhodne." # todo: NEW TRANSLATION
 oligarchic_capture.10.title: "Zvolajme občanov" # todo: NEW TRANSLATION
 oligarchic_capture.10.desc: "Heroldi šíria našu výzvu po všetkých mestských štvrtiach a trhoviskách: republika patrí občanom, nie skupinke veľmožov. Námestia sa zapĺňajú tými, ktorí sú pripravení potvrdiť starý poriadok, no takéto zhromaždenia vždy prinášajú riziko nepokojov." # todo: NEW TRANSLATION
 oligarchic_capture.10.a: "Na námestia!" # todo: NEW TRANSLATION
 oligarchic_capture.11.title: "Očista oligarchov" # todo: NEW TRANSLATION
 oligarchic_capture.11.desc: "Rozhodli sme sa zasiahnuť priamo proti vedeniu frakcie. Uskutočňujú sa zatýkania, ich siete sú narúšané a ich moc nad našimi inštitúciami slabne. Šľachta sa búri proti tvrdému zásahu a ríša sa otriasa, no oligarchovia utrpeli porážku." # todo: NEW TRANSLATION
 oligarchic_capture.11.a: "Zaútočme na ich vodcov." # todo: NEW TRANSLATION

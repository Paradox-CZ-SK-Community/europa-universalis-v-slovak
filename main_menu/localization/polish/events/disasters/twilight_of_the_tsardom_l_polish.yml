l_polish:
 twilight_of_the_tsardom.1.title: "Súmrak $rank_empire_bulgarian$" # todo: NEW TRANSLATION
 twilight_of_the_tsardom.1.desc: "Sila, ktorá kedysi niesla naše prápory cez [ShowRegionName('balkan_region')], teraz s každým rokom slabne. Naša autorita sa stáva prázdnou a nepriatelia nás obchádzajú zo všetkých strán. Jazvy minulých vojen a vnútorných sporov sú ďaleko od zahojenia, a ak neprevezmeme rozhodné opatrenia, [GetCountry('BUL').GetFlavorRank] sa čoskoro môže zmeniť len na spomienku. Musíme urobiť všetko, čo je v našich silách, aby sme zabránili katastrofálnemu kolapsu, ktorý postihol Prvé [GetCountry('BUL').GetAdjective] Impérium." # todo: NEW TRANSLATION
 twilight_of_the_tsardom.1.a: "[GetCountry('BUL').GetFlavorRank] nesmie padnúť!" # todo: NEW TRANSLATION
 twilight_of_the_tsardom.1.a.tt: "Dokončenie $twilight_of_the_tsardom$ [Concept('disaster','katastrofa')|e] bez ovládania [ShowLocationName('constantinople')] bude mať nasledovné následky:" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 twilight_of_the_tsardom.1.a.tt2: "Dokončenie $twilight_of_the_tsardom$ [Concept('disaster','katastrofa')|e], pričom zároveň ovládame [ShowLocationName('constantinople')], bude mať nasledovné následky:" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 twilight_of_the_tsardom.1.a.tt3: "Dokončenie $twilight_of_the_tsardom$ [Concept('disaster','katastrofa')|e], pričom zároveň ovládame [ShowLocationName('constantinople')] a sme [Concept('great_power','veľmoc')|e], bude mať nasledovné následky:" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 twilight_of_the_tsardom.1.historical_info: "Po smrti Ivana Asena II. v roku 1241 Bulharsko upadlo do predĺženého obdobia slabého vládnutia, šľachtických sporov a mongolských nájazdov. Následní panovníci nedokázali odolávať cudziemu zasahovaniu, čo viedlo k veľkým územným stratám. Vnútorná nestabilita vyvrcholila povstaním Ivajla a pokračovala desaťročia občianskych sporov a zahraničných zásahov. Hoci začiatkom 14. storočia došlo k krátkemu oživeniu, porážka pri Velbazhde v roku 1330 a obnovené vonkajšie tlaky zanechali Bulharsko oslabené a čoraz zraniteľnejšie do roku 1337. Oslabený štát sa z tohto zápasu nikdy úplne nezotavil a nakoniec padol do rúk Osmanov." # todo: NEW TRANSLATION
 twilight_of_the_tsardom.2.title: "$rank_empire_bulgarian$ pretrváva" # todo: NEW TRANSLATION
 twilight_of_the_tsardom.2.desc: "Napriek všetkým nepriaznivým okolnostiam $rank_empire_bulgarian$ prežil roky chaosu, intríg a úpadku. Hoci jazvy zostávajú a kráľovstvo sa ešte úplne nezotavilo, prežili sme tam, kde mnohí očakávali náš pád. Súmrak pominul, no či nás čaká nový úsvit, ostáva otázne." # todo: NEW TRANSLATION
 twilight_of_the_tsardom.2.a: "Obnovíme to, čo bolo stratené." # todo: NEW TRANSLATION
 twilight_of_the_tsardom_modifier_removal_tt: "Modifikátor [ShowModifier('bul_powerful_local_elites')] bude odstránený z každého ovládaného územia, ktoré ho má" # todo: NEW TRANSLATION
 twilight_of_the_tsardom.3.title: "[GetCountry('BUL').GetNameWithNoTooltip] na vzostupe" # todo: NEW TRANSLATION
 twilight_of_the_tsardom.3.desc: "Z hlbín krízy sa [GetCountry('BUL').GetName] vzoprela obnovená a posilnená. Zajatie [ShowLocationName('constantinople')] je čin, ktorý by si počas najtemnejších dní málokto vedel predstaviť. $rank_empire_bulgarian$ teraz stojí ako dominantná sila v [ShowRegionName('balkan_region')] a všetci, ktorí pochybovali o našej moci, sa musia teraz vyrovnať s naším znovuzrodením." # todo: NEW TRANSLATION
 twilight_of_the_tsardom.3.a: "Nech svet uzná našu silu!" # todo: NEW TRANSLATION
 twilight_of_the_tsardom.4.title: "Úsvit novej ríše" # todo: NEW TRANSLATION
 twilight_of_the_tsardom.4.desc: "$rank_empire_bulgarian$, kedysi ohrozené kolapsom, teraz stojí medzi najväčšími ríšami sveta. V boji o prežitie sme našli silu a nádej, ktorá vyústila v povstanie novej imperiálnej moci. S [ShowLocationName('constantinople')] v našich rukách sme predurčení zanechať stopu v dejinách. Nech je tento deň zapamätaný ako založenie Tretej [GetCountry('BUL').GetAdjectiveWithNoTooltip] Impérie!" # todo: NEW TRANSLATION
 twilight_of_the_tsardom.4.a: "Teraz začína zlatý vek!" # todo: NEW TRANSLATION
 twilight_of_the_tsardom.5.title: "Miestne elity spochybňujú našu autoritu" # todo: NEW TRANSLATION
 twilight_of_the_tsardom.5.desc: "Regionálne elity v [target_location.GetName] začali konať nezávisle, nerešpektujúc naše nariadenia a vládnuc svojej zemi, akoby boli suverénmi. Podnecované oslabenou centrálnou autoritou, ďalší môžu čoskoro nasledovať ich príklad. Ak nevykonáme rozhodný krok, môže to viesť k ešte väčšej fragmentácii." # todo: NEW TRANSLATION
 twilight_of_the_tsardom.5.a: "Máme vážnejšie starosti." # todo: NEW TRANSLATION
 twilight_of_the_tsardom.5.b: "Znovu uplatniť kontrolu nad [target_location.GetNameWithNoTooltip]." # todo: NEW TRANSLATION
 twilight_of_the_tsardom.6.title: "Dvoran obvinený z vlastizrady" # todo: NEW TRANSLATION
 twilight_of_the_tsardom.6.desc: "Jeden z našich dôveryhodných poradcov, [target_character.GetName], sa ocitol pod vážnym podozrením. [target_character.GetSheHe|U] bol(a) obvinený(á) z prijatia peňazí od cudzej moci výmenou za citlivé informácie o našom $rank_empire_bulgarian$. Hoci zatiaľ nebol objavený žiadny jasný dôkaz, samotné obvinenia vzbudili nepokoj na [ROOT.GetCountry.GetGovernment.GetCourtTitle]. Ak túto záležitosť ignorujeme, zradca by mohol konať nekontrolovane v našich kruhoch; konať príliš unáhlene však môže viesť k tomu, že verný služobník bude nespravodlivo potrestaný." # todo: NEW TRANSLATION
 twilight_of_the_tsardom.6.a: "Okamžite prepustite [target_character.GetHerHim]!" # todo: NEW TRANSLATION
 twilight_of_the_tsardom.6.b: "To je určite len klebeta..." # todo: NEW TRANSLATION
 twilight_of_the_tsardom.7.title: "Vzbury v armáde" # todo: NEW TRANSLATION
 twilight_of_the_tsardom.7.desc: "Morálka našich armád ochabuje, keď nevyplatení vojaci nariekajú a dôstojníci majú problém udržať poriadok. Keď sa mzdy oneskorujú a reťaz velenia slabne s každým dňom, hrozí, že vojaci, ktorí kedysi tvorili pilier našej sily, sa stanú hrozbou proti nej." # todo: NEW TRANSLATION
 twilight_of_the_tsardom.7.a: "Vyplatiť im to, čo im patrí." # todo: NEW TRANSLATION
 twilight_of_the_tsardom.7.b: "Nemôžeme si to dovoliť." # todo: NEW TRANSLATION
 twilight_of_the_tsardom.7.c: "Potlačiť vzburu skôr, než sa rozšíri!" # todo: NEW TRANSLATION
 twilight_of_the_tsardom.8.title: "Vzbúrený poddaný" # todo: NEW TRANSLATION
 twilight_of_the_tsardom.8.desc: "Do hlavného mesta prišli správy, že elity v [subject_target.GetName] sú čoraz vzdornejšie a údajne sa tajne spriadajú a skúšajú hranice svojej vernosti. Hoci zatiaľ nebolo vyhlásené otvorené povstanie, naše dôveryhodné zdroje hlásia, že v [subject_target.GetGovernment.GetCourtTitle] sa šepká o nezávislosti." # todo: NEW TRANSLATION
 twilight_of_the_tsardom.8.a: "Uspokojiť ich ústupkami." # todo: NEW TRANSLATION
 twilight_of_the_tsardom.8.b: "Teraz toho veľa nezmôžeme." # todo: NEW TRANSLATION
 twilight_of_the_tsardom.9.title: "Nezaplatená posádka" # todo: NEW TRANSLATION
 twilight_of_the_tsardom.9.desc: "Obrancovia našej posádky v [target_location.GetName] sa stávajú vzburychtivými, obviňujúc miestnych guvernérov z zanedbávania obrany a odmietania vyplatiť posádke riadnu mzdu. Títo vojaci, poverení ochranou kľúčovej pevnosti brániacej celé [target_area.GetName], už nevidia dôvod zostať verní korune, ktorá sa o nich nedokáže postarať." # todo: NEW TRANSLATION
 twilight_of_the_tsardom.9.a: "Okamžite im vyplatiť mzdy!" # todo: NEW TRANSLATION
 twilight_of_the_tsardom.9.b: "Donútiť miestne elity, aby im zaplatili." # todo: NEW TRANSLATION
 twilight_of_the_tsardom.9.c: "Nemáme na to prostriedky." # todo: NEW TRANSLATION
 twilight_of_the_tsardom.10.title: "Spory stavov" # todo: NEW TRANSLATION
 twilight_of_the_tsardom.10.desc: "Oslabenie centrálnej autority v posledných rokoch posilnilo stavy $rank_empire_bulgarian$, ktoré sa každý snažia získať väčší vplyv nad oslabeným [GetEstateName('crown_estate')]. Dusivé rivality prerástli do otvorenej nepriateľskosti a udržať si neutralitu je čoraz náročnejšie. Riziká, že pretneme obe frakcie proti sebe, sú vysoké, no možno získame lojalitu jednej z nich za cenu prehĺbenia rozdelenia v kráľovstve." # todo: NEW TRANSLATION
 twilight_of_the_tsardom.10.a: "Postavíme sa na stranu [first_estate.GetNameWithNoTooltip]." # todo: NEW TRANSLATION
 twilight_of_the_tsardom.10.b: "Chráňme záujmy [second_estate.GetNameWithNoTooltip]." # todo: NEW TRANSLATION
 twilight_of_the_tsardom.10.c: "Nezaujmeme žiadnu stranu v tomto konflikte." # todo: NEW TRANSLATION
 bul_restore_the_realms_unity: "Obnoviť jednotu ríše" # todo: NEW TRANSLATION
 bul_restore_the_realms_unity_desc: "Územia, ktoré boli kedysi neoddeliteľnou súčasťou [GetCountry('BUL').GetFlavorRank], sa odklonili od našej kontroly a už nepodliehajú autorite trónu. Ak chceme prežiť tento súmrak, musíme zabezpečiť ich zjednotenie s vlasťou. Potrebnými prostriedkami, ak bude treba..." # todo: NEW TRANSLATION
 bul_reassert_our_authority: "Znovu uplatniť našu autoritu" # todo: NEW TRANSLATION
 bul_reassert_our_authority_desc: "Vnútorná slabosť [GetCountry('BUL').GetName] povzbudila mnohé elity naprieč [GetCountry('BUL').GetFlavorRank], ktoré teraz vzdorujú našej autorite a vládnu svojim zemiam, akoby nikomu nepodliehali. Musíme zabrániť ďalšej fragmentácii ríše tým, že znovu uplatníme kontrolu nad ich územiami a prinútíme ich opäť podriadiť sa korune." # todo: NEW TRANSLATION
 bul_push_for_diplomatic_reintegration: "Usilovať sa o diplomatické zjednotenie" # todo: NEW TRANSLATION
 bul_push_for_diplomatic_reintegration_desc: "Aby sme predišli vypuknutiu občianskych vojen, upustili sme od časti našich krajín lordom, ktorí nimi vládnu v našom mene. Hoci toto riešenie môže krátkodobo fungovať, je v našom najlepšom záujme usilovať sa o diplomatické zjednotenie $rank_empire_bulgarian$, pretože rozdelené kráľovstvo neprežije to, čo príde." # todo: NEW TRANSLATION
 twilight_of_the_tsardom.11.title: "Obkolesení supmi" # todo: NEW TRANSLATION
 twilight_of_the_tsardom.11.desc: "Kým sme pohltení vnútornými rozbrojmi, naši oportunistickí susedia nás obkolesili ako supi padajúceho zvieraťa. Cítia našu slabosť, sledujú každý náš krok a trpezlivo čakajú na chvíľu, kedy udrú a odtrhnú zvyšky nášho $rank_empire_bulgarian$. Nedávno sa dostalo do pozornosti, že [target_country.GetName] si nárokuje [border_claim_province.GetName] s úmyslom ho zabrať, ak sa naskytne príležitosť." # todo: NEW TRANSLATION
 twilight_of_the_tsardom.11.a: "Nech si skúšajú šťastie!" # todo: NEW TRANSLATION
 twilight_of_the_tsardom.11.b: "Podplatíme ich, aby odvolali nárok." # todo: NEW TRANSLATION

 PRU_DEAL_WITH_ROBBER_BARONS_TOOLTIP_IN_PROGRESS: "Priebeh: $PROGRESS$%\n$DAYS$, $DATE$" # todo: NEW TRANSLATION
 turmoil_in_brandenburg.1.title: "The [root_dynasty.GetNameWithNoTooltip] of [ROOT.GetCountry.GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 turmoil_in_brandenburg.1.desc.start: "S úmrtím posledného člena $bra_askanier_hyperlink$ z [ROOT.GetCountry.GetName], [GetCharacter('bra_heinrich_ii_askanier').GetName], v roku 1320, padli [ROOT.GetCountry.GetAdjectiveWithNoTooltip] územia do rúk [GetCharacter('ubv_ludwig_iv_wittelsbach').GetName], zvoleného cisára $bra_hre_hyperlink$. Aby bola severná [ShowCultureGroupName('german_group')] časť spravovaná, [GetCharacter('ubv_ludwig_iv_wittelsbach').GetShortNameWithNoTooltip] poveril [GetCharacter('ubv_ludwig_iv_wittelsbach').GetHisHer] [GetCharacter('bra_ludwig_v_wittelsbach').GetDaughterSon], [GetCharacter('bra_ludwig_v_wittelsbach').GetName], správou marchie." # todo: NEW TRANSLATION
 turmoil_in_brandenburg.1.desc: "$turmoil_in_brandenburg.1.desc.start$\n\nToto je začiatok éry $bra_wittelsbach_hyperlink$ v [ROOT.GetCountry.GetNameWithNoTooltip]. Je to obdobie problémov: [ROOT.GetCountry.GetGovernment.GetRulerTitle] bol dosadený za vládcu v mladom veku, takže veľkú časť vlády prevzal [GetCharacter('hnb_berthold_iv_henneberg_schleusingen').GetName]. Rabujúci baróni, ekonomické ťažkosti a všeobecné rozčarovanie obyvateľstva voči [ROOT.GetCountry.GetGovernment.GetRulerTitle] sužujú vládu [GetCharacter('bra_ludwig_v_wittelsbach').GetShortNameWithNoTooltip], a $bra_wittelsbach_hyperlink_no_tt$ sa zdajú málo starať o svoje majetky na severe..." # todo: NEW TRANSLATION
 turmoil_in_brandenburg.1.desc.fallback: "$turmoil_in_brandenburg.1.desc.start$\n\nVládnutie [GetCharacter('bra_ludwig_v_wittelsbach').GetShortNameWithNoTooltip] však bolo krátke a kontrolu nad [ROOT.GetCountry.GetNameWithNoTooltip] prevzal [root_ruler.GetName]. Napriek tomu ekonomické problémy aj rabujúci baróni škvrnia autoritu [ROOT.GetCountry.GetGovernment.GetRulerTitle] a $bra_wittelsbach_hyperlink$ prejavujú malý záujem meniť súčasný stav podradenej marchie..." # todo: NEW TRANSLATION
 turmoil_in_brandenburg.1.a: "[ROOT.GetCountry.GetNameWithNoTooltip] prežije!" # todo: NEW TRANSLATION
 turmoil_in_brandenburg.1.a.at: "Naša [control|e] nad krajinou oslabne!" # todo: NEW TRANSLATION
 turmoil_in_brandenburg.1.a.bt: "Aby sme vyriešili túto pohromu, musíme vyriešiť aj dynastickú krízu a nepokoje spôsobené rabujúcimi barónmi." # todo: NEW TRANSLATION
 turmoil_in_brandenburg.2.title: "Koniec obdobia $bra_wittelsbach_hyperlink_no_tt$" # todo: NEW TRANSLATION
 turmoil_in_brandenburg.2.desc: "Keď už žiadny člen dynastie $bra_wittelsbach_hyperlink$ nedrží monarchickú moc nad [ROOT.GetCountry.GetName], éra ekonomickej stagnácie a neustáleho zanedbávania konečne skončila. Teraz je na nových vládcov, aby priniesli ľudu čas prosperity." # todo: NEW TRANSLATION
 turmoil_in_brandenburg.2.a: "Nech je to začiatok Zlatého veku." # todo: NEW TRANSLATION
 turmoil_in_brandenburg.2.a.tt: "$bra_wittelsbacher_investment_var$ a $bra_wittelsbacher_neglect_var$ budú deaktivované." # todo: NEW TRANSLATION
 turmoil_in_brandenburg.3.title: "Falošný $name_waldemar$" # todo: NEW TRANSLATION
 turmoil_in_brandenburg.3.entry: "$turmoil_in_brandenburg.3.title$" # todo: NEW TRANSLATION
 turmoil_in_brandenburg.3.desc: "Najprv [target_character.GetHisHer] príbeh znel vierohodne, hoci trochu zvláštne: vládca, ktorý zariadil [target_character.GetHisHer] vlastný pohreb, aby mohol nerušene vykonať púť, potom sa vrátil. Keď však [target_character.GetHisHer] nová snaha o trón pokračovala, príbeh začal mať trhliny. Tí, ktorí poznali [GetCharacter('bra_waldemar_askanier').GetName] pred rokmi 1320, si všimli aj nevysvetliteľné zmeny osobnosti u [target_character.GetHisHer]...\n\nK šoku všetkých sa teraz konečne ukázalo, že [target_character.GetName] nie je ničím iným než podvodníkom, ktorý sa vydával za ctihodného markgrófa!\n\nV okamihu akákoľvek podpora pretendentovi zanikla a vláda [ROOT.GetCountry.GetGovernment.GetRuler.GetName] je opäť nepochybná." # todo: NEW TRANSLATION
 turmoil_in_brandenburg.3.a: "Podvodník medzi nami... kto by to bol tušil?" # todo: NEW TRANSLATION
 false_waldemar_imposter_protection_tt: "Waldemar si získava podporu" # todo: NEW TRANSLATION
 turmoil_in_brandenburg.4.title: "Tyrania rabujúcich barónov" # todo: NEW TRANSLATION
 turmoil_in_brandenburg.4.desc: "Chránení právnym postavením svojich feudálnych držieb, rabujúci baróni z [ROOT.GetCountry.GetName] sú členmi [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')], ktorí ukladajú obyvateľstvu ničivé mýta a dane. Hoci ich pohnútky môžu byť zúfalé, ich činy brzdia rozvoj [ROOT.GetCountry.GetAdjectiveWithNoTooltip] krajiny, ak im to dovolíme pokračovať..." # todo: NEW TRANSLATION
 turmoil_in_brandenburg.4.a: "Zavedieme boj proti rabujúcim barónom." # todo: NEW TRANSLATION
 turmoil_in_brandenburg.4.b: "[ROOT.GetCountry.Custom('common_string_nothing_we_can_do')]" # todo: NEW TRANSLATION
 bra_peasants_revolt: "Sedliacke povstanie" # todo: NEW TRANSLATION
 PRU_robber_barons_active_tt: "Rabujúci baróni sú aktívni" # todo: NEW TRANSLATION
 turmoil_in_brandenburg.5.title: "[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('peasants_estate')] povstanie" # todo: NEW TRANSLATION
 turmoil_in_brandenburg.5.desc: "Ekonomický prepad [ROOT.GetCountry.GetName] zanechal mnoho členov [ROOT.GetCountry.GetGovernment.GetEstateName('peasants_estate')] rozhorčených a nespokojných. Odmietajú obrábať polia, kým nebudú splnené ich požiadavky na zlepšenie ich situácie pod tyraniou samozáchovných rabujúcich rytierov..." # todo: NEW TRANSLATION
 turmoil_in_brandenburg.5.a: "Zlepšiť ich situáciu." # todo: NEW TRANSLATION
 turmoil_in_brandenburg.5.b: "To sú len sedliaci. Nespôsobia problémy." # todo: NEW TRANSLATION
 turmoil_in_brandenburg.6.title: "[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('clergy_estate')] prevezme kontrolu" # todo: NEW TRANSLATION
 turmoil_in_brandenburg.6.desc: "Zatiaľ čo autorita $bra_wittelsbach_hyperlink$ existuje na papieri, skutočná moc nad ľuďmi leží v rukách tých, ktorých masy nasledujú. V rurálnych osadách sú to [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')]. Ak chceme mať akúkoľvek autoritu v našej vlastnej krajine, musíme odobrať moc klerikom..." # todo: NEW TRANSLATION
 turmoil_in_brandenburg.6.a: "Odobrať im moc." # todo: NEW TRANSLATION
 turmoil_in_brandenburg.6.b: "Nemali by sme zasahovať do [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('clergy_estate')]." # todo: NEW TRANSLATION
 turmoil_in_brandenburg.7.title: "Mestské dane odmietnuté" # todo: NEW TRANSLATION
 turmoil_in_brandenburg.7.desc: "[ROOT.GetCountry.GetName|U] je v zlom stave. Jeho krajiny sú riedko osídlené a ešte menej rozvinuté. Väčšina zlepšení [ROOT.GetCountry.GetAdjectiveWithNoTooltip] inštitúcií sa platí z daní vybieraných od miest a mestok. Avšak [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')] odmieta platiť svoj podiel, pretože má len malý dôvod uznať $bra_wittelsbach_hyperlink$ za svojho suveréna..." # todo: CHANGED
 turmoil_in_brandenburg.7.a: "Uspokojiť [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('burghers_estate')]." # todo: NEW TRANSLATION
 turmoil_in_brandenburg.7.b: "$common_string_leave_them_be$" # todo: NEW TRANSLATION
 turmoil_in_brandenburg.8.title: "Súkromné panstvo [target_character.GetShortNameWithNoTooltip]" # todo: NEW TRANSLATION
 turmoil_in_brandenburg.8.desc: "Správy z [target_location.GetName] hovoria, že [target_character.GetName] vládne svojim panstvám, akoby to bolo samostatné [ROOT.GetCountry.GetFlavorRank]. Hradby rastú, priekopy sa prehlbujú a ozbrojení muži slúžia len [target_character.GetHerHim]. Žiadosti, ktoré by mali byť prerokované na [ROOT.GetCountry.GetGovernment.GetCourtTitle], sa rozhodujú v [target_character.GetHisHer] sieni a mýta a poplatky kedysi platené [ROOT.GetCountry.GetGovernment.GetRulerTitle] teraz plnia [target_character.GetHerHis] truhlice. Pre mnohých sa rozmazáva rozdiel medzi krajinami [ROOT.GetCountry.GetName] a súkromným panstvom [target_character.GetShortNameWithNoTooltip]..." # todo: NEW TRANSLATION
 turmoil_in_brandenburg.8.a: "Na toto zatiaľ pristúpime." # todo: NEW TRANSLATION
 turmoil_in_brandenburg.8.b: "Žiadny pán nie je nad [ROOT.GetCountry.GetGovernment.GetRulerTitle]." # todo: NEW TRANSLATION
 tib_outcome_8_1_tt: "Naši agenti zabezpečia, že nám [target_character.GetShortNameWithNoTooltip] už nebude robiť problémy" # todo: NEW TRANSLATION
 tib_outcome_8_2_tt: "[ShowEstateTypeName('nobles_estate')] z [target_location.GetName] bude na náš zásah hnevlivý" # todo: NEW TRANSLATION
 tib_outcome_8_3_tt: "Naše rozhodnutie pokazí vzťahy s [ShowEstateTypeName('nobles_estate')] v celom kráľovstve" # todo: NEW TRANSLATION
 turmoil_in_brandenburg.9.title: "Liga [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')] z [target_province.GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 turmoil_in_brandenburg.9.desc: "Po vidieku v [target_province.GetName] sa drží množstvo veľkých rodín v formálnej lige. Sľubujú si vzájomnú obranu, konajú spoločné súdy a súhlasia odolávať ďalšiemu vmiešavaniu kráľovských úradníkov do svojich záležitostí.\n\nPre mnohých miestnych je zrejmé, že skutočná autorita v [target_province.GetNameWithNoTooltip] teraz spočíva v tejto skupine [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] skôr než v [ROOT.GetCountry.GetGovernment.GetRulerTitle] v [ROOT.GetCountry.GetCapital.GetName]. Niektorí na [ROOT.GetCountry.GetGovernment.GetCourtTitle] si šepkajú, že tolerovanie takýchto zväzkov len urýchli rozklad centrálnej moci." # todo: NEW TRANSLATION
 turmoil_in_brandenburg.9.a: "Uznajme ligu a získajme si jej priazeň." # todo: NEW TRANSLATION
 turmoil_in_brandenburg.9.b: "Rozdrvme túto zradnú skupinu a obnovme našu autoritu." # todo: NEW TRANSLATION
 nobles_in_target_province_gain_pop_satisfaction_extreme_bonus_tt: "[pops|e], ktoré patria [ShowEstateTypeName('nobles_estate')] pod našou správou v [target_province.GetName], budú veľmi potešené naším uznaním ich ligy, získajúc [ShowNamedValue('pop_satisfaction_mild_bonus')|+=2%] [pop_satisfaction|e]" # todo: NEW TRANSLATION
 lower_class_pop_satisfaction_weak_penalty_tt: "[lower_class|e] v [target_province.GetName] budú závidieť neobmedzenú moc svojich pánov, a preto utrpia [ShowNamedValue('pop_satisfaction_weak_penalty')|+=2%] [pop_satisfaction|e]" # todo: NEW TRANSLATION
 nobles_in_target_province_may_agitate_locals_to_rebel_tt: "Ponížené [ShowEstateTypeName('nobles_estate')] v [target_province.GetName] sa môžu pokúsiť vyvolať nepokoje medzi svojimi poddanými v reakcii na našu tvrdú líniu" # todo: NEW TRANSLATION
 turmoil_in_brandenburg.10.title: "Nelegálne mýta v [target_location.GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 turmoil_in_brandenburg.10.desc: "Obchodníci sa sťažujú, že cesty a mosty okolo [target_location.GetName] sú teraz zahltené novými mýtnymi bránami, postavenými bez kráľovského povolenia podnikavými členmi [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]. Vozidlá sú zastavované, tovar prepočítavaný a mince vyberané v mene #italic miestnej ochrany#!.\n\nKaždý voz, ktorý podlieha týmto poplatkom, okráda [ROOT.GetCountry.GetGovernment.GetRulerTitle] o príjmy a oslabuje predstavu, že zákon pramení z [ROOT.GetCountry.GetGovernment.GetCourtTitle], nie z najbližšej hradnej veže." # todo: NEW TRANSLATION
 turmoil_in_brandenburg.10.a: "Otočíme očami nad ich mýtami." # todo: NEW TRANSLATION
 turmoil_in_brandenburg.10.b: "Zrútme brány a uplatňujme naše práva." # todo: NEW TRANSLATION
 turmoil_in_brandenburg.11.title: "Dom [target_dynasty_1.GetNameWithNoTooltip] vyzýva [target_dynasty_2.GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 turmoil_in_brandenburg.11.desc: "Napätie prepuklo medzi [target_dynasty_1.GetName] a naším domom [target_dynasty_2.GetName]. Na hostinách, pri poľovačkách a teraz aj v radách ich popredné vetvy spochybňujú úsudok a pôvod [ROOT.GetCountry.GetGovernment.GetRulerTitle], naznačujúc, že ich krv nie je menej hoden vládnuť [ROOT.GetCountry.GetName].\n\nTo, čo začalo ako šepoty, sa zmenilo na otvorený súboj o prestíž, klientelu a vplyv na dvore. Ak nezaujmeme pevné stanovisko, menší páni môžu dospieť k záveru, že naša dynastia je len jednou z mnohých šľachtických rodín." # todo: NEW TRANSLATION
 turmoil_in_brandenburg.11.a: "Pevne sa postavme za náš [ROOT.GetCountry.GetGovernment.GetRulerTitle]." # todo: NEW TRANSLATION
 turmoil_in_brandenburg.11.b: "Kúpme mier ústupkami [target_dynasty_1.GetNameWithNoTooltip]." # todo: NEW TRANSLATION
 target_character_2_will_challenge_the_power_nobles_tt: "[target_character_2.GetName] sa postaví priamo [ShowEstateTypeName('nobles_estate')] kvôli ich nárokom na moc." # todo: NEW TRANSLATION
 turmoil_in_brandenburg.12.title: "Investícia do [target_location.GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 turmoil_in_brandenburg.12.desc: "Poradcovia predkladajú plán nalievať kráľovské fondy do [target_location.GetName] a okolitej provincie [target_province.GetName]. Nové cesty, trhy a úrady by rozšírili prítomnosť [ROOT.GetCountry.GetGovernment.GetRulerTitle] hlbšie do vidieka, oslabujúc moc miestnych magnátov nad obchodom a súdnictvom.\n\nAvšak [ShowEstateTypeName('nobles_estate')] tvrdia, že takéto zlepšenia by mali prechádzať ich rukami, nie našimi, a varujú, že centrálne zasahovanie do ich domén len vyvolá odpor." # todo: NEW TRANSLATION
 turmoil_in_brandenburg.12.a: "Investujme kráľovské zdroje a utiahnime kontrolu." # todo: NEW TRANSLATION
 turmoil_in_brandenburg.12.b: "Táto záležitosť je aj tak pod naše možnosti." # todo: NEW TRANSLATION
 turmoil_in_brandenburg.13.title: "Rast [target_location.GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 turmoil_in_brandenburg.13.desc: "Významní občania z [target_location.GetName] predložili petíciu [ROOT.GetCountry.GetGovernment.GetCourtTitle] o investíciu. Tvrdia, že nové ulice, cechovné sály a verejné stavby viac zviažu osady [target_province.GetName] s [ROOT.GetCountry.GetName], upokojúc miestne nepokoje.\n\nNaši pokladníci však varujú, že také veľkorysosti vyčerpajú truhlice a môžu byť vnímané ako rozmažranosť voči iným provinciám, ktoré ešte čakajú na svoju radu." # todo: NEW TRANSLATION
 turmoil_in_brandenburg.13.a: "Rozšírme investície naprieč celou [target_province.GetNameWithNoTooltip]." # todo: NEW TRANSLATION
 turmoil_in_brandenburg.13.b: "Sústreďme naše úsilie na [target_location.GetNameWithNoTooltip]." # todo: NEW TRANSLATION
 turmoil_in_brandenburg.13.c: "Nemôžeme si dovoliť takúto štedrosť." # todo: NEW TRANSLATION
 every_location_in_target_province_gains_center_of_urbanization_modifier_tt: "Každé [location|e] v [target_province.GetName] získa [GetModifier('center_of_urbanization_modifier').GetNameWithTooltip] [modifier|e] na [ShowNamedValue('modifier_duration_years_very_short')] rokov" # todo: CHANGED
 every_location_in_target_province_gains_flourishing_capital_modifier: "Každé [location|e] v [target_province.GetName] získa [GetModifier('flourishing_capital_modifier').GetNameWithTooltip] [modifier|e] na [ShowNamedValue('modifier_duration_years_very_short')] rokov" # todo: CHANGED
 every_location_in_target_province_gains_development_mild_bonus: "Každé [location|e] v [target_province.GetName] získa [ShowNamedValue('development_weak_bonus')|+=] [development|e]" # todo: NEW TRANSLATION
 every_location_in_target_province_gains_prosperity_extreme_bonus: "Každé [location|e] v [target_province.GetName] získa [ShowNamedValue('prosperity_severe_bonus')|+=2%] [prosperity|e]." # todo: NEW TRANSLATION
 turmoil_in_brandenburg.100.title: "$bra_wittelsbach_hyperlink_no_tt$ oživujú [ROOT.GetCountry.GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 turmoil_in_brandenburg.100.entry: "$turmoil_in_brandenburg.100.title$" # todo: NEW TRANSLATION
 turmoil_in_brandenburg.100.desc: "Po rokoch chudoby a zdevastovania, autonómnych panstiev a tyranie rabujúcich barónov, po výzvach a pretendentoch, rod $bra_wittelsbach_hyperlink$ konečne zvíťazil a [ROOT.GetCountry.GetFlavorRank] [ROOT.GetCountry.GetName] sa stal perlou v [ShowRegionName('north_german_region')]. Nech dlhá je vláda [target_character.GetName]!" # todo: NEW TRANSLATION
 turmoil_in_brandenburg.100.a: "[ROOT.GetCountry.GetNameWithNoTooltip] sa stane pýchou $bra_wittelsbach_hyperlink_no_tt$." # todo: NEW TRANSLATION
 turmoil_in_brandenburg.200.title: "Tajomstvo [target_character.GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 turmoil_in_brandenburg.200.desc: "[target_character.GetHisHer|U] smrť bola rýchla a neočakávaná, napriek tomu [target_character.GetHisHer] odkaz stále prenasleduje [ROOT.GetCountry.GetName]. [target_character.GetName], údajný $bra_askanier_hyperlink$, ktorý vládol nášmu [ROOT.GetCountry.GetFlavorRank] do roku 1320, sa ukázal byť najprefíkanejším podvodníkom a intrigánom v [ROOT.GetCountry.GetAdjectiveWithNoTooltip] histórii!\n\nNa [target_character.GetHisHer] pohrebe bol vykopaný [target_character.GetHisHer] starý hrob, aby mohol navždy odpočívať. Ceremónia však skončila predčasne, keď v hrobe objavili kostru [GetCharacter('bra_waldemar_askanier').GetName] - #italic $name_waldemar$#!\n\nTo prirodzene prinieslo veľkú hanbu [ROOT.GetCountry.GetNameWithNoTooltip], keď jediný jedinec dokázal oklamať celú krajinu..." # todo: NEW TRANSLATION
 turmoil_in_brandenburg.200.a: "Ako sa to mohlo stať? Sme predsa múdrejší..." # todo: NEW TRANSLATION
 turmoil_in_brandenburg.300.title: "Končí dlhá bitka" # todo: NEW TRANSLATION
 turmoil_in_brandenburg.300.entry: "$turmoil_in_brandenburg.300.title$" # todo: NEW TRANSLATION
 turmoil_in_brandenburg.300.desc: "Po desaťročiach náš boj skrotiť a podmaniť si [ROOT.GetCountry.GetLongName] konečne skončil. Súperiace dynastie boli odstránené a posledné pevnosti rabujúcich barónov boli vyrabované. Naše rozhodné kroky nám daly príležitosť formovať tento štát v náš prospech a vybudovať správu, ktorá bude tieto ťažkosti v budúcnosti ľahšie znášať." # todo: NEW TRANSLATION
 turmoil_in_brandenburg.300.a: "Konečne mier." # todo: NEW TRANSLATION
 turmoil_in_brandenburg.1000.title: "Návrat [target_character.GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 turmoil_in_brandenburg.1000.entry: "Návrat cieľovej postavy" # todo: NEW TRANSLATION
 turmoil_in_brandenburg.1000.desc: "Keď žiadny cisár $bra_hre_hyperlink$ nie je prepojený s vládnucim $bra_wittelsbach_hyperlink$, legitimita [bra_ruler.GetName] je opäť spochybnená. Ľud [ROOT.GetCountry.GetName] túži po časoch vlády $bra_askanier_hyperlink$.\n\nAko však osud chce, domnelý mŕtvy [target_character.GetName] sa verejne zjavuje! Tvrdí, že jeho pohreb bol inscenovaný, aby mu umožnil púť do Svätej zeme, [target_character.GetShortNameWithNoTooltip] sa vrátil, aby si nárokoval [ROOT.GetCountry.GetAdjective] trón od [bra_ruler.GetShortNameWithNoTooltip]." # todo: NEW TRANSLATION
 turmoil_in_brandenburg.1000.desc.emperor_supports: "$turmoil_in_brandenburg.1000.desc$\n\nNašťastie sú vzťahy medzi [emperor_ruler.GetName] a [bra_ruler.GetShortNameWithNoTooltip] priaznivé. Preto $bra_hre_emperor_hyperlink$ podporuje dom $bra_wittelsbach_hyperlink_no_tt$ proti pretendentovi." # todo: NEW TRANSLATION
 turmoil_in_brandenburg.1000.desc.emperor_rejects: "$turmoil_in_brandenburg.1000.desc$\n\nNanešťastie $bra_hre_emperor_hyperlink$ uprednostňuje dom $bra_askanier_hyperlink_no_tt$ pred $bra_wittelsbach_hyperlink_no_tt$. Preto [emperor_ruler.GetName] udelil právo vládnuť nad [bra_country.GetNameWithNoTooltip] [target_character.GetShortNameWithNoTooltip]. Iba dohoda s [emperor_ruler.GetNameWithNoTooltip] by mohla vyriešiť hrozbu [target_character.GetShortNameWithNoTooltip]..." # todo: NEW TRANSLATION
 turmoil_in_brandenburg.1000.a: "Kontaktovať $bra_hre_emperor_hyperlink$!" # todo: NEW TRANSLATION
 turmoil_in_brandenburg.1000.a.at: "Každá krajina, ktorá má člena dynastie $bra_wittelsbach_hyperlink$ za svojho vládcu, získa [ShowBiasValue('opinion_support_our_dynasty_member')|+0] [opinion|e] voči [ROOT.GetCountry.GetName]" # todo: NEW TRANSLATION
 turmoil_in_brandenburg.1000.a.tt: "Obrátime sa na [emperor_country.GetName] a požiadame o pomoc s pretendentom. Dokončenie tohto potrvá #Y 2 roky#! a budeme nútení splniť podmienky $bra_hre_emperor_hyperlink$, pokiaľ ich [opinion|e] o nás nebude nad #Y 100#!" # todo: NEW TRANSLATION
 turmoil_in_brandenburg.1000.b: "Vykonajme popravu pretendenta sami!" # todo: NEW TRANSLATION
 turmoil_in_brandenburg.1000.b.tt: "Pokusíme sa popraviť [target_character.GetName]. Ak uspejeme, legitimita [bra_ruler.GetName] sa obnoví a dostaneme #Y +5#! bonus k nášmu $bra_wittelsbacher_investment_var$ $bra_variable_counter$.\nAk to zlyhá, vypukne [civil_war|e]" # todo: NEW TRANSLATION
 turmoil_in_brandenburg.1000.c: "Abdikovať k pravému vládcu [ROOT.GetCountry.GetNameWithNoTooltip]." # todo: NEW TRANSLATION
 turmoil_in_brandenburg.1000.c.at: "Každá krajina, ktorá má člena dynastie $bra_wittelsbach_hyperlink$ za svojho vládcu, získa [ShowBiasValue('opinion_ousted_our_dynasty_member')|+0] [opinion|e] voči [ROOT.GetCountry.GetName]" # todo: NEW TRANSLATION
 turmoil_in_brandenburg.false_waldemar_rebel.tt: "[ShowPopTypeName('nobles')] a [ShowPopTypeName('peasants')] až do #Y 4#! najľudnatejších, vlastnených lokalít získajú nasledovné efekty:\n- Strácajú [ShowNamedValue('pop_satisfaction_ultimate_penalty')|+=2%] [pop_satisfaction|e]\n- Pridávajú sa k [false_waldemar_rebel.GetName]" # todo: NEW TRANSLATION
 turmoil_in_brandenburg.1001.title: "Vzostup [target_character.GetShortNameWithNoTooltip] v [bra_country.GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 turmoil_in_brandenburg.1001.desc.imposter_revealed: "Veľvyslanec z [bra_country.GetName] prišiel na náš veľký dvor požiadať o podporu proti rastúcemu pretendentovi a rivalovi [bra_ruler.GetName]. Zrejme tento sebavyhlásený '[target_character.GetName]' tvrdí, že sa vrátil zo svätej púte a teraz požaduje [bra_country.GetAdjectiveWithNoTooltip] trón.\n\nAvšak dorazili správy o podvode: tento '$name_waldemar$' je len pretendent!" # todo: NEW TRANSLATION
 turmoil_in_brandenburg.1001.desc: "Veľvyslanec z [bra_country.GetName] prišiel na náš dvor požiadať o podporu v dynastickom konflikte. Bývalý vládca [bra_country.GetNameWithNoTooltip], [target_character.GetName], sa vrátil z dlhej púte do Svätej zeme a teraz opätovne nárokuje [bra_country.GetAdjective] trón. [bra_ruler.GetName] nachádza málo podpory medzi svojimi poddanými a prejavil ochotu rokovať s nami výmenou za našu podporu proti pretendentovi." # todo: NEW TRANSLATION
 turmoil_in_brandenburg.1001.help.tt: "[target_character.GetName] bude vyhnaný z [bra_country.GetName] a [modifier|e] [ShowModifier('bra_waldemar_rallies_nobility')] bude z nich odstránený" # todo: NEW TRANSLATION
 turmoil_in_brandenburg.1001.a: "Podporíme ich výmenu za zlato." # todo: NEW TRANSLATION
 turmoil_in_brandenburg.1001.a.tt: "Dostaneme [ROOT.GetVariable('bra_gold_tooltip_var').GetValue|+=2] [gold|e] od [bra_country.GetName] za #Y 1 rok#!" # todo: NEW TRANSLATION
 turmoil_in_brandenburg.1001.b: "Ruka ruku umýva. Pomôžme im!" # todo: NEW TRANSLATION
 turmoil_in_brandenburg.1001.b.tt: "[bra_country.GetName] pre nás zahlasuje za #Y 1 rok#!" # todo: NEW TRANSLATION
 turmoil_in_brandenburg.1001.c: "Pomôžeme $bra_wittelsbach_hyperlink_no_tt$ výmenou za politickú podporu." # todo: NEW TRANSLATION
 turmoil_in_brandenburg.1001.c.tt: "Dostaneme [ShowBiasValue('opinion_supported_the_wittelsbacher')|+=0] [opinion|e] od všetkých [countries|e], ktoré majú dynastiu $bra_wittelsbach_hyperlink$ pri moci, za #Y 1 rok#!" # todo: NEW TRANSLATION
 turmoil_in_brandenburg.1001.d: "$bra_wittelsbach_hyperlink_no_tt$ budú podporení." # todo: NEW TRANSLATION
 turmoil_in_brandenburg.1001.d.tt: "Nebudeme žiadať nič na oplátku" # todo: NEW TRANSLATION
 turmoil_in_brandenburg.1001.e: "Nemáme z čoho profitovať, ak pomôžeme $bra_wittelsbach_hyperlink_no_tt$." # todo: NEW TRANSLATION
 turmoil_in_brandenburg.1001.e.tt: "Odmietneme podporiť $bra_wittelsbach_hyperlink$, čo zníži [opinion|e] všetkých [countries|e] s $bra_wittelsbach_hyperlink_no_tt$ ako vládnucou dynastiou o [ShowBiasValue('opinion_rejected_helping_wittelsbacher')|+=0], ale zlepší názor všetkých krajín s dynastiou $bra_askanier_hyperlink$ o [ShowBiasValue('opinion_rejected_helping_wittelsbacher_askanier')|+=0] za #Y 1 rok#!" # todo: NEW TRANSLATION
 turmoil_in_brandenburg.1001.zzz: "[bra_ruler.GetShortNameWithNoTooltip] bude oprávnený vykonávať spravodlivosť podľa vlastného uváženia." # todo: NEW TRANSLATION
 turmoil_in_brandenburg.1001.zzz.tt: "[bra_country.GetName] bude oprávnený naložiť s [target_character.GetName] podľa vlastného uváženia" # todo: NEW TRANSLATION
 turmoil_in_brandenburg.1002.title: "Podpora od $bra_hre_emperor_hyperlink$" # todo: NEW TRANSLATION
 turmoil_in_brandenburg.1002.desc: "Skvelé správy dorazili na náš dvor! $bra_hre_emperor_hyperlink$, [emperor_ruler.GetName] z [emperor_country.GetName], vyjadril skutočnú podporu [bra_ruler.GetName] v [bra_ruler.GetHisHer] boji proti pretendentovi [target_character.GetName]!" # todo: NEW TRANSLATION
 turmoil_in_brandenburg.1002.desc.gold: "$turmoil_in_brandenburg.1002.desc$\n\nSamozrejme, takáto podpora nie je zadarmo. [emperor_ruler.GetShortNameWithNoTooltip] uviedol finančné zaťaženie, ktoré by táto podpora uvalila na [emperor_ruler.GetHisHer] pokladnicu. Preto požaduje tribut [ROOT.GetVariable('bra_owes_gold').GetValue|V2] zlatých na oplátku." # todo: NEW TRANSLATION
 turmoil_in_brandenburg.1002.desc.loyalty: "$turmoil_in_brandenburg.1002.desc$\n\nSamozrejme, takáto podpora nie je zadarmo. [emperor_ruler.GetShortNameWithNoTooltip] sa obáva svojej nástupníckej línie v $bra_hre_hyperlink$ a vyžaduje od nás plnú lojalitu k rodine [emperor_ruler.GetHisHer], aby zabezpečil cisársky trón." # todo: NEW TRANSLATION
 turmoil_in_brandenburg.1002.desc.relations: "$turmoil_in_brandenburg.1002.desc$\n\nSamozrejme, takáto podpora nie je zadarmo. [emperor_ruler.GetShortNameWithNoTooltip] chce, aby sme pôsobili ako jeho herald v rámci $bra_wittelsbach_hyperlink$, ukazujúc slávu [emperor_country.GetNameWithNoTooltip] každému členovi dynastie." # todo: NEW TRANSLATION
 turmoil_in_brandenburg.1002.desc.free: "$turmoil_in_brandenburg.1002.desc$\n\nK našemu prekvapeniu $bra_hre_emperor_hyperlink$ nežiadal nič na oplátku. Ich pomoc vychádza z dobrej vôle a bez akýchkoľvek podmienok." # todo: NEW TRANSLATION
 turmoil_in_brandenburg.1002.a: "Konečne je autorita $bra_wittelsbach_hyperlink_no_tt$ obnovená!" # todo: NEW TRANSLATION
 turmoil_in_brandenburg.1002.a.tt: "Každá [country|e] s dynastiou $bra_wittelsbach_hyperlink$ ako vládnucou dynastiou získa [ShowBiasValue('opinion_supported_the_wittelsbacher')|0] [opinion|e] voči [emperor_country.GetName]" # todo: NEW TRANSLATION
 turmoil_in_brandenburg.1003.title: "Cisár odmieta poskytnúť podporu" # todo: NEW TRANSLATION
 turmoil_in_brandenburg.1003.desc.dead: "Správy z $bra_hre_emperor_hyperlink$ k nám dorazili. Zatiaľ čo [emperor_ruler.GetName] požíval počas života antagonizmus voči našim záujmom, jeho dôvody sú známe len jemu. Preto zostáva [target_character.GetName] nevyzvaný..." # todo: NEW TRANSLATION
 turmoil_in_brandenburg.1003.desc.wittelsbach: "Hrozné správy dorazili na náš dvor! Zatiaľ čo chaos spôsobený [target_character.GetName] narastá, $bra_hre_emperor_hyperlink$ konečne odhalil [emperor_country.GetAdjective] postoj v tejto záležitosti. Napriek [emperor_ruler.GetHisHer] spojeniu s krvou, [emperor_ruler.GetName] odmieta podporiť [bra_ruler.GetName] a otvorene sa stavia proti vlastnej dynastii!" # todo: NEW TRANSLATION
 turmoil_in_brandenburg.1003.desc: "Hrozné správy dorazili na náš dvor! Zatiaľ čo chaos spôsobený [target_character.GetName] narastá, $bra_hre_emperor_hyperlink$ konečne odhalil [emperor_country.GetAdjective] postoj v tejto záležitosti: [emperor_ruler.GetName] odmieta podporiť [bra_ruler.GetName] a otvorene sa stavia proti $bra_wittelsbach_hyperlink_no_tt$!" # todo: NEW TRANSLATION
 turmoil_in_brandenburg.1003.a: "Aký hrozný deň byť [ROOT.GetCountry.GetGovernment.GetRulerTitle]..." # todo: NEW TRANSLATION
 turmoil_in_brandenburg.1003.a.tt: "Každá [country|e] s $bra_wittelsbach_hyperlink$ ako vládnucou dynastiou stratí [ShowBiasValue('opinion_rejected_helping_wittelsbacher')|+=0] [opinion|e] od [emperor_country.GetName], zatiaľ čo každá krajina s dynastiou $bra_askanier_hyperlink$ získa [ShowBiasValue('opinion_rejected_helping_wittelsbacher_askanier')|+=0] ich názor" # todo: NEW TRANSLATION
 turmoil_in_brandenburg.1004.title: "Bezpodmienečná podpora od $bra_hre_emperor_hyperlink$" # todo: NEW TRANSLATION
 turmoil_in_brandenburg.1004.desc: "Správy od $bra_hre_emperor_country_hyperlink$ k nám dorazili. Kvôli nečestným činom [target_character.GetName] nám $bra_hre_emperor_hyperlink$ udelil bezpodmienečné právo naložiť s impostorom podľa vlastného uváženia." # todo: NEW TRANSLATION
 turmoil_in_brandenburg.1004.a: "Vyhnan [target_character.GetHimHer]." # todo: NEW TRANSLATION
 turmoil_in_brandenburg.1004.b: "Popraviť [target_character.GetHimHer]." # todo: NEW TRANSLATION
 turmoil_in_brandenburg.1004.c: "[target_character.GetHisHer|U] schopnosti by nám mohli ešte vyhovovať..." # todo: NEW TRANSLATION
 turmoil_in_brandenburg.1004.c.tt: "[target_character.GetName] dostane ďalšiu šancu a stane sa dostupným pre náš kabinet" # todo: NEW TRANSLATION
 turmoil_in_brandenburg.1005.title: "Sporná autenticita" # todo: NEW TRANSLATION
 turmoil_in_brandenburg.1005.desc: "Vláda $bra_wittelsbach_hyperlink$ skončila a slávni $bra_askanier_hyperlink$ sa konečne vrátili do [bra_country.GetName]. Napriek tomu podozrenie padá na novo korunovaného [ROOT.GetCountry.GetGovernment.GetRulerTitle]. [target_character.GetName] si nespomína na úspechy zo svojho života pred údajne inscenovaným pohrebom, členovia $bra_askanier_hyperlink_no_tt$ si všímajú nevysvetliteľné zmeny vzhľadu svojho milovaného člena rodiny a dokonca [target_character.GetHisHer] štýl vlády je znateľne iný než u [target_character.GetHimHer]. [target_character.GetShortNameWithNoTooltip] tieto nezrovnalosti pripisuje skúsenostiam, ktoré zažili počas púte do Svätej zeme..." # todo: NEW TRANSLATION
 turmoil_in_brandenburg.1005.a: "Začnime vyšetrovanie príbehu [target_character.GetHisHer]." # todo: NEW TRANSLATION
 turmoil_in_brandenburg.1005.a.tt: "Začne sa vyšetrovanie príbehu [target_character.GetName], odhaľujúc ich skutočné prepojenie na $bra_askanier_hyperlink$..." # todo: NEW TRANSLATION
 turmoil_in_brandenburg.1005.b: "To sú len neoverené klebety..." # todo: NEW TRANSLATION
 turmoil_in_brandenburg.1006.title: "Vyšetrovanie proti [target_character.GetShortNameWithNoTooltip]" # todo: NEW TRANSLATION
 turmoil_in_brandenburg.1006.desc: "Po dvoch rokoch výskumu, vyšetrovania a porovnávania dokumentov sa kauza autenticity [target_character.GetName], súčasného [ROOT.GetCountry.GetGovernment.GetRulerTitle], konečne ukončila." # todo: NEW TRANSLATION
 turmoil_in_brandenburg.1006.desc.true_askanier: "$turmoil_in_brandenburg.1006.desc$\n\nPodľa vyšetrovania je [target_character.GetName] skutočne členom $bra_askanier_hyperlink$, hoci nie skutočným [GetCharacter('bra_waldemar_askanier').GetName], za ktorého sa [target_character.GetHeShe] vydával. Má rovnaké meno ako náš zosnulý markgróf, ale ukázalo sa, že [target_character.GetHisHer] bol omylom zamieňaný s nesprávnym $name_waldemar$." # todo: NEW TRANSLATION
 turmoil_in_brandenburg.1006.desc.false_askanier: "$turmoil_in_brandenburg.1006.desc$\n\nNapriek [target_character.GetHisHer] najlepším snahám predstierať, ich šaráda konečne skrachovala pri konfrontácii s faktami. [target_character.GetShortNameWithNoTooltip] nie je nič iné než podvodník, ktorý oklamal všetkých na dvore a dokonca členov $bra_askanier_hyperlink$ presvedčil, že [GetCharacter('bra_waldemar_askanier').GetName] je opäť živý a zdravý. Toto vyvolalo veľký rozruch na [bra_country.GetAdjectiveWithNoTooltip] dvore a mnohé časti vlády žiadajú riešenie." # todo: NEW TRANSLATION
 turmoil_in_brandenburg.1006.a: "Podobnosť bola proste taká výrazná!" # todo: NEW TRANSLATION
 turmoil_in_brandenburg.1006.a.tt: "[target_character.GetName] a každý potomok zmení svoju [dynasty|e] na $bra_askanier_hyperlink$" # todo: NEW TRANSLATION
 turmoil_in_brandenburg.1006.b: "Aspoň [target_character.GetHeShe] nie je $bra_wittelsbach_hyperlink_no_tt$..." # todo: NEW TRANSLATION
 turmoil_in_brandenburg.1006.b.tt: "[target_character.GetName] a každý potomok zmení svoju [dynasty|e] na [target_dynasty.GetName]" # todo: NEW TRANSLATION
 turmoil_in_brandenburg.1006.c: "Odstrániť podvodníka!" # todo: NEW TRANSLATION
 turmoil_in_brandenburg.1007.title: "Poprava falošného [target_character.GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 turmoil_in_brandenburg.1007.desc.successful_execution: "[target_character.GetName] bol úspešne zajatý a uväznený tými, ktorí sú verní [bra_ruler.GetName]. Navyše, [emperor_ruler.GetName] následne dal [emperor_ruler.GetHisHer] súhlas s našimi činmi spätne, čím nás ušetril pred závažnejšími následkami. Ukázalo sa, že [target_character.GetShortNameWithNoTooltip] nie je žiadny $bra_askanier_hyperlink$ - dokonca nie je ani členom nášho prestížneho [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]! [target_character.GetSheHe|U] bol obvinený z intríg, zrady a ohrozovania stability [bra_country.GetName], a bol uznaný vinným..." # todo: CHANGED
 turmoil_in_brandenburg.1007.desc.failed_execution: "Uprostred noci bol [target_character.GetName] zajatý a uväznený v [bra_country.GetCapital.GetName], aby čakal na svoju údajnú popravu pri prvom svitaní. Avšak [target_character.GetShortNameWithNoTooltip] sa ukázal byť prefíkaný, [target_character.GetHerselfHimself] totiž predvídal každý náš krok. Po únose veľká skupina šľachticov - členovia nášho [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] - zaútočila na palácne kobky a oslobodila pretendenta.\n\nTeraz [bra_country.GetName] čelí občianskej vojne nepredvídateľných rozmerov. Ako malý úžitok z našej katastrofálnej situácie sa [emperor_ruler.GetName] rozhodol pasívne podporiť naše rozhodnutie o poprave." # todo: CHANGED
 turmoil_in_brandenburg.1007.a: "Ďalšia kríza hravo zažehnaná." # todo: NEW TRANSLATION
 turmoil_in_brandenburg.1007.b: "K zbraniam!" # todo: NEW TRANSLATION
 bra_true_waldemar_identity_reveal_tt: "#italic Pravá identita [target_character.GetName] bude odhalená...#!" # todo: NEW TRANSLATION
 turmoil_in_brandenburg.false_waldemar_big_rebel.tt: "[ShowPopTypeName('nobles')] a [ShowPopTypeName('peasants')] až do #Y 16#! najľudnatejších, vlastnených lokalít získajú nasledovné efekty:\n- Strácajú [ShowNamedValue('pop_satisfaction_ultimate_penalty')|+=2%] [pop_satisfaction|e]\n- Pridávajú sa k [false_waldemar_rebel.GetName]" # todo: NEW TRANSLATION
 false_waldemar_rebel: "Zástancovia $name_waldemar$" # todo: NEW TRANSLATION
 turmoil_in_brandenburg.1100.title: "Zanedbanie [root_country.GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 turmoil_in_brandenburg.1100.entry: "Zanedbanie materskej krajiny" # todo: NEW TRANSLATION
 turmoil_in_brandenburg.1100.desc: "Územia [root_country.GetName] boli vždy pomerne málo rozvinuté. Avšak ani v najhorších časoch neboli [root_country.GetNameWithNoTooltip] tak zanedbané ako za vlády $bra_wittelsbach_hyperlink$.\n\nSprávy o tomto zlom stave dorazili k $bra_hre_emperor_hyperlink$. Osud [root_ruler.GetName] a jeho vláda nad týmito krajinami visí na vlásku..." # todo: NEW TRANSLATION
 turmoil_in_brandenburg.1100.a: "Iste, $bra_hre_emperor_hyperlink$ pochopí našu situáciu." # todo: NEW TRANSLATION
 turmoil_in_brandenburg.1100.a.tt: "$bra_hre_emperor_hyperlink$ rozhodne o našom osude. Môže sa rozhodnúť dosadiť nám nového vládcu z inej dynastie." # todo: NEW TRANSLATION
 turmoil_in_brandenburg.1101.title: "$bra_wittelsbach_hyperlink_no_tt$ zlyhávajú $bra_hre_hyperlink_no_tt$" # todo: NEW TRANSLATION
 turmoil_in_brandenburg.1101.desc: "Situácia v jednom z našich kurfiřtov, [root_country.GetFlavorRank] [root_country.GetName], sa ukázala byť viac než hrozná. Tyrania miestnych rabujúcich barónov, úplný kolaps ekonomiky a zanedbávajúci [root_country.GetGovernment.GetRulerTitle], [root_ruler.GetName], sužujú krajinu a robia z nej hanbu $bra_hre_hyperlink$. Je našou povinnosťou ako $bra_hre_emperor_hyperlink$ $bra_hre_hyperlink_no_tt$ nedovoliť takéto vážne zlé riadenie pokračovať." # todo: NEW TRANSLATION
 turmoil_in_brandenburg.1101.a: "Prevziať priamu kontrolu nad [root_country.GetFlavorRank]." # todo: NEW TRANSLATION
 turmoil_in_brandenburg.1101.a.tt: "Dosadíme [emperor_ruler.GetName] ako nového [ruler|e] [root_country.GetName], vytvárajúc s nimi [union|e]" # todo: NEW TRANSLATION
 turmoil_in_brandenburg.1101.b: "Nech [dynasty_character.GetNameWithNoTooltip] vládne [root_country.GetNameWithNoTooltip]." # todo: NEW TRANSLATION
 turmoil_in_brandenburg.1101.b.tt: "Dosadíme [dynasty_character.GetName] ako nového [ruler|e] [root_country.GetName]" # todo: NEW TRANSLATION
 turmoil_in_brandenburg.1101.c: "[cabinet_character.GetNameWithNoTooltip] bude vládnuť v našom mene." # todo: NEW TRANSLATION
 turmoil_in_brandenburg.1101.c.tt: "Dosadíme [cabinet_character.GetName] ako nového [ruler|e] [root_country.GetName], čím ich spravíme naším [ShowSubjectTypeName('vassal')], ale spôsobíme [ShowBiasValue('subjugated_elector_antagonism')|-=0] [antagonism|e] so všetkými členmi [GetUniqueInternationalOrganization('hre').GetName]" # todo: NEW TRANSLATION
 subjugated_elector_antagonism: "Podrobený kurfiřt" # todo: NEW TRANSLATION
 turmoil_in_brandenburg.1101.d: "Jeden z našich dvoranov upraví [root_country.GetAdjectiveWithNoTooltip] situáciu." # todo: NEW TRANSLATION
 turmoil_in_brandenburg.1101.d.tt: "Dosadíme miestneho rádcu nášho dvora ako nového [ruler|e] [root_country.GetName]" # todo: NEW TRANSLATION
 turmoil_in_brandenburg.1101.e: "Nech $bra_wittelsbach_hyperlink_no_tt$ sú, oni to obnovia." # todo: NEW TRANSLATION
 turmoil_in_brandenburg.1101.e.tt: "Necháme $bra_wittelsbach_hyperlink$ na pokoji, nech pokračujú vo vládnutí nad [root_country.GetName]" # todo: NEW TRANSLATION
 turmoil_in_brandenburg.1102.title: "Odpoveď $bra_hre_emperor_hyperlink$" # todo: NEW TRANSLATION
 turmoil_in_brandenburg.1102.desc.wittelsbach: "Veľvyslanec z [emperor_country.GetName] prišiel na náš dvor. Vyhlasuje, že územia [root_country.GetName] budú zjednotené s územiami [emperor_country.GetNameWithNoTooltip], s [emperor_ruler.GetName] ako spoločným vládcom." # todo: NEW TRANSLATION
 turmoil_in_brandenburg.1102.desc: "Veľvyslanec z [emperor_country.GetName] prišiel na náš dvor. Hlási, že $bra_wittelsbach_hyperlink$ už od dnešného dňa nie sú pri moci. Územia [root_country.GetName] pripadnú priamo [emperor_ruler.GetName], čo nás prinúti do osobnej únie s [emperor_country.GetNameWithNoTooltip]." # todo: NEW TRANSLATION
 turmoil_in_brandenburg.1102.a: "Nech žije $bra_hre_emperor_hyperlink$!" # todo: NEW TRANSLATION
 turmoil_in_brandenburg.1102.b: "Dúfajme, že tentoraz [root_country.GetLongNameWithNoTooltip] vydrží pokope." # todo: NEW TRANSLATION
 turmoil_in_brandenburg.1103.title: "$turmoil_in_brandenburg.1102.title$" # todo: NEW TRANSLATION
 turmoil_in_brandenburg.1103.desc.wittelsbach: "Veľvyslanec z [emperor_country.GetName] prišiel na náš dvor. Hlási, že územia [root_country.GetName] bude vládnuť [dynasty_character.GetName]." # todo: NEW TRANSLATION
 turmoil_in_brandenburg.1103.desc: "Veľvyslanec z [emperor_country.GetName] prišiel na náš dvor. Hlási, že $bra_wittelsbach_hyperlink$ už od dnešného dňa nie sú pri moci. Územia [root_country.GetName] pripadnú priamo [dynasty_character.GetName]." # todo: NEW TRANSLATION
 turmoil_in_brandenburg.1103.a: "Nech [dynasty_character.GetShortNameWithNoTooltip] vládne silne." # todo: NEW TRANSLATION
 turmoil_in_brandenburg.1103.b: "Vyzerá to na novú šancu pre [root_country.GetLongNameWithNoTooltip]." # todo: NEW TRANSLATION
 turmoil_in_brandenburg.1104.title: "$turmoil_in_brandenburg.1102.title$" # todo: NEW TRANSLATION
 turmoil_in_brandenburg.1104.desc.wittelsbach: "Veľvyslanec z [emperor_country.GetName] prišiel na náš dvor. Hlási, že územia bude vládnuť nový člen dynastie $bra_wittelsbach_hyperlink$ - niekto, kto sa už predtým osvedčil ako spoľahlivý. [root_country.GetName] je teraz v starostlivosti [cabinet_character.GetName], najvernejšieho z [emperor_country.GetAdjectiveWithNoTooltip] vazalov." # todo: NEW TRANSLATION
 turmoil_in_brandenburg.1104.desc: "Veľvyslanec z [emperor_country.GetName] prišiel na náš dvor. Hlási, že $bra_wittelsbach_hyperlink$ už od dnešného dňa nie sú pri moci. Územia [root_country.GetName] pripadnú priamo [cabinet_character.GetName], najvernejšiemu z [emperor_country.GetAdjectiveWithNoTooltip] vazalov." # todo: NEW TRANSLATION
 turmoil_in_brandenburg.1104.a: "Aspoň to nie je $bra_wittelsbach_hyperlink_no_tt$." # todo: NEW TRANSLATION
 turmoil_in_brandenburg.1104.b: "Och, skvelé... $bra_wittelsbach_hyperlink_no_tt$ sú späť..." # todo: NEW TRANSLATION
 turmoil_in_brandenburg.1104.c: "Nebudeme sa klaňať [emperor_country.GetNameWithNoTooltip]!" # todo: NEW TRANSLATION
 turmoil_in_brandenburg.1105.title: "$turmoil_in_brandenburg.1102.title$" # todo: NEW TRANSLATION
 turmoil_in_brandenburg.1105.desc: "Veľvyslanec z [emperor_country.GetName] prišiel na náš dvor. Hlási, že $bra_wittelsbach_hyperlink$ už od dnešného dňa nie sú pri moci. Územia [root_country.GetName] pripadnú priamo [hohenzollern_character.GetName], dôveryhodnému radcovi $bra_wittelsbach_hyperlink_no_tt$." # todo: NEW TRANSLATION
 turmoil_in_brandenburg.1105.a: "Nech [hohenzollern_character.GetHeShe] vládne s múdrosťou." # todo: NEW TRANSLATION
 turmoil_in_brandenburg.1106.title: "$turmoil_in_brandenburg.1102.title$" # todo: NEW TRANSLATION
 turmoil_in_brandenburg.1106.desc: "Veľvyslanec z [emperor_country.GetName] prišiel na náš dvor. Hlási, že $bra_wittelsbach_hyperlink$ dostanú cisárske varovanie, ale budú si ponechať [root_country.GetFlavorRank]." # todo: NEW TRANSLATION
 turmoil_in_brandenburg.1106.a: "[root_country.GetNameWithNoTooltip] navždy zostane majetkom $bra_wittelsbach_hyperlink_no_tt$..." # todo: NEW TRANSLATION
 turmoil_in_brandenburg.1107.title: "Odpor [root_country.GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 turmoil_in_brandenburg.1107.desc: "Tvrdohlavé zlyhanie štátu [root_country.GetName] odmieta podľahnúť nám a našej nadvláde. Je viac než zrejmé, že ich neschopné vedenie postráda víziu, a preto máme viac než dosť dôvodov ich podmaniť silou." # todo: NEW TRANSLATION
 turmoil_in_brandenburg.1107.a: "Nemáme toleranciu pre vlastizradcov!" # todo: NEW TRANSLATION
 turmoil_in_brandenburg.1200.title: "Bremeno [bra_country.GetAdjectiveWithNoTooltip]" # todo: NEW TRANSLATION
 turmoil_in_brandenburg.1200.desc: "Po rokoch zlého vedenia $bra_wittelsbach_hyperlink$ prevzal správu nad [bra_country.GetName] rod [emperor_dynasty.GetName]. Hoci naše úmysly pre [bra_country.GetFlavorRank] sú úprimné a v ich najlepšom záujme, je zrejmé, že naše úsilie nestačí na zvrátenie škôd spôsobených zanedbávaním $bra_wittelsbach_hyperlink_no_tt$.\n\nJeden z našich dvoranov, [hohenzollern_character.GetName], ukázal veľkú spôsobilosť v otázkach správy a diplomacie. Zverením [hohenzollern_character.GetHimHer] do čela [bra_country.GetNameWithNoTooltip] a udelením potrebnej autonómie by mohla pomôcť [bra_country.GetNameWithNoTooltip] zotaviť sa." # todo: NEW TRANSLATION
 turmoil_in_brandenburg.1200.a: "Zveríme [hohenzollern_character.GetShortNameWithNoTooltip] starostlivosť o [bra_country.GetFlavorRank]." # todo: NEW TRANSLATION
 turmoil_in_brandenburg.1200.a.tt: "[ruler|e] [bra_country.GetName] bude nahradený [hohenzollern_character.GetName]" # todo: NEW TRANSLATION
 turmoil_in_brandenburg.1200.b: "Nesmysel. Stále môžeme viesť [bra_country.GetNameWithNoTooltip] sami." # todo: NEW TRANSLATION
 turmoil_in_brandenburg.1201.title: "[hohenzollern_character.GetNameWithNoTooltip] - nový vládca [bra_country.GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 turmoil_in_brandenburg.1201.desc: "Po rokoch zlého vedenia $bra_wittelsbach_hyperlink$ si páni z [emperor_country.GetName] vzali pod správu [bra_country.GetName]. Hoci ich úmysly sú v našom najlepšom záujme, ich povinnosti voči $bra_hre_hyperlink$ im znemožňujú vládnuť nad našimi zemami s väčším zapojením než najzanietenejšiemu členovi dynastie $bra_wittelsbach_hyperlink_no_tt$.\n\nNaše šťastie je, že [emperor_ruler.GetName] si je situácie vedomý a poslal svojho najtalentovanejšieho radcu, [hohenzollern_character.GetName], aby autonomne spravoval [bra_country.GetNameWithNoTooltip]." # todo: NEW TRANSLATION
 turmoil_in_brandenburg.1201.a: "Nech [hohenzollern_character.GetHeShe] vládne s múdrosťou a silou." # todo: NEW TRANSLATION
 turmoil_in_brandenburg.1300.title: "Vzostup rabujúcich barónov" # todo: NEW TRANSLATION
 turmoil_in_brandenburg.1300.entry: "$turmoil_in_brandenburg.1300.title$" # todo: NEW TRANSLATION
 turmoil_in_brandenburg.1300.desc: "Slabá kontrola nad [ROOT.GetCountry.GetGovernment.GetRulerTitle] a všeobecný bezprávny stav viedli k vzostupu rabujúcich barónov - šľachticov žijúcich z bezprávia a páchania zločinu. Ich prítomnosť len oslabuje našu kontrolu a podkopáva autoritu [target_ruler.GetName]. Momentálne majú najsilnejší vplyv v [robber_baron_province.GetName]." # todo: NEW TRANSLATION
 turmoil_in_brandenburg.1300.a: "Vysporiadame sa s nimi v pravý čas." # todo: NEW TRANSLATION

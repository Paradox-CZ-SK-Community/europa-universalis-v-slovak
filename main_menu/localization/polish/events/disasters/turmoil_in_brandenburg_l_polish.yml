 turmoil_in_brandenburg.1301.title: "Rabujúci baróni v [robber_baron_province.GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 turmoil_in_brandenburg.1301.entry: "Lúpežní baróni v provincii Lúpežných barónov" # todo: NEW TRANSLATION
 turmoil_in_brandenburg.1301.desc: "Mor rabujúcich barónov sa rozšíril do provincie [robber_baron_province.GetName]. Ich prejavy zločinnosti a arogancie sú rovné urazeniu našej autority. Je čas dať im lekciu — a obnoviť centrálnu autoritu v krajine." # todo: NEW TRANSLATION
 turmoil_in_brandenburg.1301.a: "Vysporiadame sa s nimi v pravý čas." # todo: NEW TRANSLATION
 turmoil_in_brandenburg.1302.title: "Rod von Quitzow" # todo: NEW TRANSLATION
 turmoil_in_brandenburg.1302.entry: "$turmoil_in_brandenburg.1302.title$" # todo: NEW TRANSLATION
 turmoil_in_brandenburg.1302.desc: "Medzi všetkými rabujúcimi barónmi je malo takých, ktorých vplyv sa dá porovnať s rodinou von Quitzow. Ich majetky sú rozsiahle po oblasti [ShowProvinceDefinitionName('mittelmark_province')] a držia obrovské statky. Napriek tomuto bohatstvu sa obrátili k životu zločinu. Zdrvme ich a zničme ich državy skôr, než spôsobia úplný chaos." # todo: NEW TRANSLATION
 turmoil_in_brandenburg.1302.a: "Musíme sa s nimi vyporiadať!" # todo: NEW TRANSLATION
 turmoil_in_brandenburg.1302.b: "Radšej postupujme opatrne." # todo: NEW TRANSLATION
 turmoil_in_brandenburg.1302.historical_info: "Rod von Quitzow bol najvplyvnejšou šľachtickou rodinou v ranom 15. storočí v Braniborsku. Počas centralizácie marky Fridrichom I. von Hohenzollern medzi rokmi 1411 a 1415 boli známi bratia rabujúci baróni Hans a Dietrich zasiahnutí novým kurfirstom, ktorý dobyl ich hrady a ukončil éru dominance von Quitzow v Braniborsku." # todo: NEW TRANSLATION
 STATIC_MODIFIER_NAME_PRU_quitzow_modifier: "Vplyv rodu von Quitzow" # todo: NEW TRANSLATION
 STATIC_MODIFIER_NAME_PRU_quitzow_repressed_modifier: "Potláčanie rodu von Quitzow" # todo: NEW TRANSLATION
 bra_quitzow_revolt: "Povstanie Quitzow" # todo: NEW TRANSLATION
 turmoil_in_brandenburg.1303.title: "Ukončenie vlády rabujúcich barónov" # todo: NEW TRANSLATION
 turmoil_in_brandenburg.1303.entry: "$turmoil_in_brandenburg.1303.title$" # todo: NEW TRANSLATION
 turmoil_in_brandenburg.1303.desc: "Hoci to trvalo mnoho rokov a ťažení, nakoniec sme dokázali skrotiť povstaleckých [ShowEstateTypeName('nobles_estate')]. Odteraz sú všetky obchodné cesty v krajine bezpečné pred šľachtickými lupičmi a obyčajný človek už nemá čoho sa báť. Navyše väčšina sedliakov už nebude nútená platiť ochranné peniaze [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')]." # todo: NEW TRANSLATION
 turmoil_in_brandenburg.1303.a: "[ROOT.GetCountry.GetFlavorRank] je opäť celistvý." # todo: NEW TRANSLATION
 STATIC_MODIFIER_NAME_PRU_end_of_robber_barons: "Koniec éry rabujúcich barónov" # todo: NEW TRANSLATION
 robber_barons_aftermath_tt: "Rabujúci baróni boli potlačení" # todo: NEW TRANSLATION
 turmoil_in_brandenburg.1304.title: "Potrestanie rabujúcich barónov" # todo: NEW TRANSLATION
 turmoil_in_brandenburg.1304.entry: "$turmoil_in_brandenburg.1304.title$" # todo: NEW TRANSLATION
 turmoil_in_brandenburg.1304.desc: "Hoci sa nám podarilo zvíťaziť v boji proti povstaleckým [ShowEstateTypeName('nobles_estate')], mnohí na [ROOT.GetCountry.GetGovernment.GetCourtTitle] veria, že ich len poraziť nestačí a že [ROOT.GetCountry.GetGovernment.GetRulerTitle] by im mal nechať zaplatiť za ich zradu. Kým mnohí podporujú takéto opatrenia, iní sa domnievajú, že ďalšie odcudzenie nie je potrebné, najmä keď sme už obnovili našu kontrolu." # todo: NEW TRANSLATION
 turmoil_in_brandenburg.1304.a: "Zaplatia za svoju zradu!" # todo: NEW TRANSLATION
 turmoil_in_brandenburg.1304.b: "Potrestajme ich mierne." # todo: NEW TRANSLATION
 turmoil_in_brandenburg.1304.c: "Nie je potrebné ďalšie trestanie." # todo: NEW TRANSLATION

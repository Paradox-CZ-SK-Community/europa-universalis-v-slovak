l_polish:
 crisis_of_faith.1.title: "Rozkol vypukol" # todo: NEW TRANSLATION
 crisis_of_faith.1.desc: "Oddanosť našej štátnej cirkvi sa vytratila a veriaci už nedbajú na jej učenie. Rozkolnícki kazatelia si získavajú nasledovníkov, zatiaľ čo duchovenstvo sa rozdeľuje na reformátorov a zástancov tvrdého postupu. Musíme si zvoliť cestu: vyjsť reformátorom v ústrety a hľadať kompromis, alebo potlačiť rozkol ohňom a mečom." # todo: NEW TRANSLATION
 crisis_of_faith.1.a: "Vyjsť reformátorom v ústrety." # todo: NEW TRANSLATION
 crisis_of_faith.1.b: "Potlačiť rozkolníkov!" # todo: NEW TRANSLATION
 crisis_of_faith.1.tt: "Najznepokojenejšie provincie povstanú na podporu frakcie [ShowDisasterName('crisis_of_faith')]" # todo: NEW TRANSLATION
 crisis_of_faith.1.a.tt: "Duchovenstvo v niekoľkých najznepokojenejších provinciách sa aj tak pridá k frakcii [ShowDisasterName('crisis_of_faith')]" # todo: NEW TRANSLATION
 crisis_of_faith.2.title: "Kacírstvo sa šíri" # todo: NEW TRANSLATION
 crisis_of_faith.2.desc: "Prichádzajú správy o celých zhromaždeniach, ktoré prijímajú rozkolnícke učenie. Môžeme vyslať verných duchovných, aby vykorenili kacírov skôr, než sa nákaza rozšíri ďalej, alebo nechať veci voľne plynúť a dúfať, že ich horlivosť sama vyhasne." # todo: NEW TRANSLATION
 crisis_of_faith.2.a: "Vykoreniť kacírov." # todo: NEW TRANSLATION
 crisis_of_faith.2.b: "Nechať to hnisať." # todo: NEW TRANSLATION
 crisis_of_faith.3.title: "Veriaci sa zhromažďujú" # todo: NEW TRANSLATION
 crisis_of_faith.3.desc: "Zbožné davy sa na vzdor rozkolu zhromažďujú, aby znovu potvrdili zavedenú vieru. Ich horlivosť by mohla znovu rozdmýchať oddanosť v celej ríši, no ak ju neudržíme na uzde, takéto vášne môžu ľahko prerásť do nepokojov." # todo: NEW TRANSLATION
 crisis_of_faith.3.a: "Prijať horlivosť." # todo: NEW TRANSLATION
 crisis_of_faith.3.b: "Zachovať poriadok." # todo: NEW TRANSLATION
 crisis_of_faith.4.title: "Duchovenstvo žiada reformu učenia" # todo: NEW TRANSLATION
 crisis_of_faith.4.desc: "Delegácia umiernených duchovných nás žiada, aby sme upravili cirkevné učenie a zacelili rozkol skôr, než sa prehĺbi. Schválenie ich reforiem by upokojilo duchovenstvo a spomalilo rozkol, no meniť posvätné učenie nie je maličkosť. Odmietnutím by sme udržali pevný postoj, ale stratili priazeň duchovenstva." # todo: NEW TRANSLATION
 crisis_of_faith.4.a: "Schváliť ich reformy." # todo: NEW TRANSLATION
 crisis_of_faith.4.b: "Odmietnuť ustúpiť v otázke učenia." # todo: NEW TRANSLATION
 crisis_of_faith.5.title: "Príležitosť na inkvizíciu" # todo: NEW TRANSLATION
 crisis_of_faith.5.desc: "Naši najhorlivejší duchovní nás naliehavo žiadajú o povolenie spustiť inkvizíciu proti rozkolníkom. Čistka by obnovila oddanosť a zastrašila kacírov, no vyvolaný strach by sa šíril celou ríšou. Môžeme sa tiež rozhodnúť pre zdržanlivosť a ušetriť obyvateľstvo ďalšieho utrpenia." # todo: NEW TRANSLATION
 crisis_of_faith.5.a: "Spustiť inkvizíciu." # todo: NEW TRANSLATION
 crisis_of_faith.5.b: "Prejaviť zdržanlivosť." # todo: NEW TRANSLATION
 crisis_of_faith.12.title: "Rozkol má svojho mecenáša" # todo: NEW TRANSLATION
 crisis_of_faith.12.desc: "Rozkolnícka vec našla svoj mešec. [crisis_of_faith_heresiarch_scope.GetName] prijali vo veľkej sieni našej ríše a šľachtic, ktorý mu otvoril dvere, teraz financuje prepisovanie kázní, ktoré sme zakázali. Môžeme mu potichu ponúknuť protislužbu za jeho vernosť, alebo sa zmieriť s tým, že nedokážeme strážiť každú sieň v krajine." # todo: NEW TRANSLATION
 crisis_of_faith.12.a: "Získať si túto vernosť späť." # todo: NEW TRANSLATION
 crisis_of_faith.12.b: "Nemôžeme strážiť každú sieň." # todo: NEW TRANSLATION
 crisis_of_faith.13.title: "Kázanie na verejnosti" # todo: NEW TRANSLATION
 crisis_of_faith.13.desc: "[crisis_of_faith_heresiarch_scope.GetName] už nekáže v pivniciach. Na námestí sa zhromaždil dav, aby si vypočul rozkolnícke učenie vyslovené nahlas, a nikto sa ho nepokúsil zastaviť. Umlčanie kázne by ukázalo, že naša cirkev má stále autoritu, no vytiahnuť kazateľa pred zrakmi davu z kazateľnice je samo osebe škandál." # todo: NEW TRANSLATION
 crisis_of_faith.13.a: "Umlčať kázeň." # todo: NEW TRANSLATION
 crisis_of_faith.13.b: "Nech veriaci rozhodnú sami." # todo: NEW TRANSLATION
 crisis_of_faith.100.title: "Kacírstvo potlačené" # todo: NEW TRANSLATION
 crisis_of_faith.100.desc: "Rozkol sa zacelil. Rozkolnícki kazatelia sú rozohnaní, ich nasledovníci sa vrátili do lona cirkvi a duchovenstvo sa zjednotilo pod jediným učením. Naša cirkev znovu stojí pevne a jej autorita i naša oddanosť sú obnovené." # todo: NEW TRANSLATION
 crisis_of_faith.100.a: "Viera pretrvá." # todo: NEW TRANSLATION
 crisis_of_faith.101.title: "Rozkolnícke učenie zapustilo korene" # todo: NEW TRANSLATION
 crisis_of_faith.101.desc: "Rozkol zvíťazil. Reformované učenie zapúšťa korene v našich kostoloch i na našich dvoroch a staré učenie je odvrhnuté. Po celú jednu generáciu bude v našej ríši vládnuť rozdelená viera a duchovenstvo, ktoré už úplne nepodlieha nášmu trónu." # todo: NEW TRANSLATION
 crisis_of_faith.101.desc.heresiarch: "Rozkol zvíťazil a má svoju tvár. [crisis_of_faith_heresiarch_scope.GetName] hlásal reformované učenie, až ho už nebolo možné umlčať, hoci našu autoritu na bojisku zlomilo vzbúrené duchovenstvo. Teraz víťazné duchovenstvo vyhlasuje [crisis_of_faith_heresiarch_scope.GetHerHis] povýšenie a v našej cirkvi už nezostal nik, kto by sa im odvážil odporovať. To, čo sme bránili ako posvätné, sa potichu odkladá." # todo: NEW TRANSLATION
 crisis_of_faith.101.a: "Rozkol zvíťazil." # todo: NEW TRANSLATION
 crisis_of_faith.101.b: "Nech heresiarcha nastúpi na trón." # todo: NEW TRANSLATION
 crisis_of_faith.102.title: "Viera opustená" # todo: NEW TRANSLATION
 crisis_of_faith.102.desc: "Už nevládneme ako cirkev. Nech rozkolníci hlásali čokoľvek, naši duchovní im neodpovedia, pretože už nehovoria v mene štátu. Učenie, ktoré sme prestali brániť, stále pretrváva v ústach veriacich a tí, ktorí pre nás zachovávali starú ortodoxiu, si pamätajú, kto ich v tom nechal." # todo: NEW TRANSLATION
 crisis_of_faith.102.a: "Cirkev už nie je naša, aby sme jej vládli." # todo: NEW TRANSLATION
 crisis_of_faith.10.title: "Hlásať obnovu" # todo: NEW TRANSLATION
 crisis_of_faith.10.desc: "Vysielame medzi ľud našich najoddanejších duchovných, aby hlásali obnovu a volali veriacich späť. Ich kázne znovu rozdúchajú oddanosť v celej ríši a oberú rozkolníkov o nasledovníkov, no rozruch veľkého náboženského obrodenia naruší zavedený poriadok." # todo: NEW TRANSLATION
 crisis_of_faith.10.a: "Vyslať kazateľov." # todo: NEW TRANSLATION
 crisis_of_faith.10.a.tt: "Každý pop, ktorý v súčasnosti podporuje frakciu [ShowDisasterName('crisis_of_faith')], získa určitú mieru spokojnosti" # todo: NEW TRANSLATION
 crisis_of_faith.11.title: "Zvolať synodu" # todo: NEW TRANSLATION
 crisis_of_faith.11.desc: "Zvolávame duchovenstvo na veľký snem, aby sme raz a navždy vyriešili spor o učenie. Zhromaždení preláti sa zomknú okolo ortodoxného učenia, čím izolujú rozkolnícku frakciu a obnovia v cirkvi aspoň čiastočnú jednotu." # todo: NEW TRANSLATION
 crisis_of_faith.11.a: "Zvolať snem." # todo: NEW TRANSLATION
 crisis_of_faith.11.a.tt: "Každý pop, ktorý v súčasnosti podporuje frakciu [ShowDisasterName('crisis_of_faith')], získa určitú mieru spokojnosti" # todo: NEW TRANSLATION
 crisis_of_faith.6.title: "Ruka za rozkolom" # todo: NEW TRANSLATION
 crisis_of_faith.6.desc: "Naši agenti sledovali zakázané kázne cez pisárov a poslov, ktorí ich roznášali, a každá stopa sa končí pri tých istých dverách. [crisis_of_faith_heresiarch_scope.GetName] je autorom rozkolníckeho učenia a až dosiaľ ho [crisis_of_faith_heresiarch_scope.GetSheHe] hlásal priamo v našej cirkvi." # todo: NEW TRANSLATION
 crisis_of_faith.6.a: "Odhalíme heresiarchu." # todo: NEW TRANSLATION
 crisis_of_faith.6.a.tt: "Heresiarcha bol odhalený, čím sa sprístupní akcia Odsúdiť heresiarchu" # todo: NEW TRANSLATION
 crisis_of_faith.7.title: "Odsúdiť heresiarchu" # todo: NEW TRANSLATION
 crisis_of_faith.7.desc.ready: "Koruna opäť hovorí s autoritou a nastal čas ju využiť. Pred zhromaždenými veriacimi označíme [crisis_of_faith_heresiarch_scope.GetName], podrobne vymenujeme [crisis_of_faith_heresiarch_scope.GetHerHis] bludy a zbavíme [crisis_of_faith_heresiarch_scope.GetHerHim] postavenia, vďaka ktorému mohol rozkol vzniknúť. Bez svojho autora je reformované učenie len fámou." # todo: NEW TRANSLATION
 crisis_of_faith.7.desc.not_ready: "Označili by sme [crisis_of_faith_heresiarch_scope.GetName] pred zhromaždenými veriacimi a skoncovali s rozkolom, no koruna nemá nad zhromaždením moc. Duchovenstvo, ktoré poskytuje útočisko [crisis_of_faith_heresiarch_scope.GetHerHim], je silnejšie než trón, ktorý [crisis_of_faith_heresiarch_scope.GetHerHim] chce odsúdiť, a neúspešné obvinenie si budú pamätať ako obvinenie, ktoré bolo odmietnuté." # todo: NEW TRANSLATION
 crisis_of_faith.7.a: "Odsúdiť heresiarchu pred veriacimi." # todo: NEW TRANSLATION
 crisis_of_faith.7.a.fail_tt: "Koruna nemá dostatočnú autoritu na zásah proti heresiarchovi" # todo: NEW TRANSLATION
 crisis_of_faith.8.title: "Ustúpiť rozkolníkom" # todo: NEW TRANSLATION
 crisis_of_faith.8.desc: "Rozkol nemožno zlomiť, a tak si ho musíme vykúpiť. Reformátorom udelíme učenie, ktoré žiadajú, aj postavenie v našej cirkvi, ktoré s ním prichádza. Frakcia sa rozíde a jej kazatelia sa vrátia do zhromaždení, ktoré im teraz právom patria. Naša oddanosť sa z toho nespamätá a tento ústupok už nemožno vziať späť." # todo: NEW TRANSLATION
 crisis_of_faith.8.a: "Nech si ponechajú svoje učenie." # todo: NEW TRANSLATION

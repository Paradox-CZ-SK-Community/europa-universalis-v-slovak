l_polish:
 decline_of_empire.1.title: "Úpadok [ROOT.GetCountry.GetLongNameWithNoTooltip]" # todo: NEW TRANSLATION
 decline_of_empire.1.desc: "Ako sa [ROOT.GetCountry.GetLongName] naťahuje do krajnosti, začínajú sa objavovať praskliny. [ROOT.GetCountry.GetGovernment.GetCourtTitle] je paralyzovaný slabým vedením, jeho siene sú naplnené korupciou a nerozhodnosťou. Vzdialené provincie, dokonca aj v [target_region.GetName], sa trápia pod zanedbávaním, zatiaľ čo nespokojnosť sa šíri srdcom krajiny. Šepoty povstania znejú v uliciach a kedysi mocná byrokracia pod vedením [target_character.GetName] bojuje, aby udržala kontrolu.\n\n[ROOT.GetCountry.GetFlavorRank] sa kýve na pokraji. Ľud rastie nepokojom, hlad a ekonomický úpadok podnecujú ich hnev a ambiciózni rivali vidia slabosť. Ak sa poriadok neobnoví, kolaps je nevyhnutný. Nadchádzajúce roky otestujú našu odolnosť ako nikdy predtým. To, čo bolo vybudované krvou a prácou, teraz čelí úplnému zničeniu, keď čas postaví proti sebe ďalší [ROOT.GetCountry.GetFlavorRank]." # todo: NEW TRANSLATION
 decline_of_empire.1.a: "Padnú hviezdy aj naše srdcia." # todo: NEW TRANSLATION
 during_decline_of_empire_explanation_tt: "Počas tohto [Concept('disaster','katastrofy')|e] môžu [Concept('provinces','provincie')|e] s [Concept('non_accepted_culture','diskriminovanou kultúrou')|e] [Concept('pops','populáciami')|e] alebo s nízkou úrovňou [Concept('control','kontrolou')|e] hľadať nezávislosť. Medzitým môžu zahraniční rivali využiť našu slabosť na rozšírenie hraníc." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 decline_of_empire.2.title: "Koniec úpadku" # todo: NEW TRANSLATION
 decline_of_empire.2.desc: "Ako plamene krízy zhasínajú, [ROOT.GetCountry.GetLongName] začína obnovovať. Poriadok bol obnovený a trhliny, ktoré kedysi hrozili roztrhnúť [ROOT.GetCountry.GetFlavorRank], boli zažehnané. Či už cez posilnenie kontroly alebo prijatie kultúrnej jednoty, chaos, ktorý stisol náš ľud, bol utíšený.\n\nŠepoty povstaní utíchli, kedysi nepokojné provincie sa vrátili do lona a [ROOT.GetCountry.GetGovernment.GetCourtTitle] znovu potvrdzuje svoju autoritu. Hoci jazvy zostávajú, najhoršie je za nami. Úspešne sme prečkali búrku a vyšli z nej, ak nie nepoškodení, tak aspoň nezlomení." # todo: NEW TRANSLATION
 decline_of_empire.2.a: "To najhoršie máme za sebou!" # todo: NEW TRANSLATION
 pops_accepted_or_primary_culture_gain_10_satisfaction_home_region_tt: "Každý [Concept('pop','populácia')|e] [Concept('primary_culture','hlavná kultúra')|e] alebo [Concept('accepted_culture','akceptovaná kultúra')|e] v [target_region.GetName] [Concept('region','regióne')|e] získa [ShowNamedValue('pop_satisfaction_mild_bonus')|+=2%] [Concept('pop_satisfaction','spokojnosť populácie')|e]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 decline_of_empire.3.title: "Plamene nezávislosti" # todo: NEW TRANSLATION
 decline_of_empire.3.desc: "Nepokoje, ktoré zasiahli [ROOT.GetCountry.GetLongName], naplno priniesli svoj nevyhnutný dôsledok; [target_country.GetName] sa osamostatnil. Oslabený vnútornými sporami sa náš úchop nad regiónom uvoľnil a miestni vládcovia využili príležitosť zbaviť sa našej nadvlády. Ich zástavy sa týčia vysoko, ich vodcovia hovoria o suverenite a ich armády sú pripravené brániť novo získanú slobodu.\n\nTeraz čelíme voľbe; zvolať zvyšky sily, ktoré nám zostali, aby sme toto povstanie rozdrvili a znovu získali, čo je naše, alebo prijať stratu a sústrediť sa vnútroštátne, aby sme zabránili tomu, aby zvyšok [ROOT.GetCountry.GetFlavorRank] nasledoval ich príklad." # todo: NEW TRANSLATION
 decline_of_empire.3.a: "Zničme ich!" # todo: NEW TRANSLATION
 decline_of_empire.3.b: "Udeľme im slobodu, zatiaľ." # todo: NEW TRANSLATION
 target_country_allowed_to_slip_from_grasp_tt: "[target_country.GetNameWithNoTooltip] vyhlási bezkrvavú nezávislosť.\nMy #R stratíme#! naše [Concept('cores','jadrá')|e] v ich [Concept('locations','lokality')|e]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 decline_of_empire.4.desc: "Uprostred chaosu, ktorý zachvátil naše krajiny, [target_country.GetName] využil okamih a vyhlásil nezávislosť. Naša oslabená autorita sa ukázala ako nedostatočná na udržanie ich nepokojnej provincie pohromade a teraz povstanie stojí vzdorovito. Ich sily sa zhromažďujú pod vlastnou zástavou a ich vodcovia odvážne vyhlasujú autonómiu a navždy sa vzdávajú našej vlády.\n\nOtázka udelenia nezávislosti je náročná vzhľadom na našu súčasnú situáciu. Podľahnúť ich požiadavkám môže znamenať zánik našich nárokov na ich územia, no zároveň to umožní sústrediť naše sily na naliehavejšie problémy inde." # todo: NEW TRANSLATION
 decline_of_empire.4.a: "Zabudli, komu slúžia — do zbraní!" # todo: NEW TRANSLATION
 decline_of_empire.4.b: "Nezaujímajú nás drobné hádky vzdialených [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('peasants_estate')]." # todo: NEW TRANSLATION
 decline_of_empire.5.title: "[target_country.GetFlavorRank] v úpadku" # todo: CHANGED
 decline_of_empire.5.desc: "Naši susedia v [target_country.GetName] sú paralyzovaní krízou a úpadkom, ich [target_country.GetFlavorRank] sa rúti pod tlakom povstaní a neporiadku. Ich armády sú rozťahané, ich provincie im sklzajú z dosahu a ich vodcovia zápasia, aby udržali svoj [target_country.GetGovernment.GetCourtTitle] pokope. S ich silami rozdelenými a pozornosťou odklonenou máme zriedkavú príležitosť. Rýchla kampaň by mohla zabezpečiť kľúčové územia skôr, než sa zotavia — no ak zakročíme príliš neskoro, môžeme čeliť nákladnej vojne." # todo: NEW TRANSLATION
 decline_of_empire.5.a: "Uderme, kým je železo horúce!" # todo: NEW TRANSLATION
 decline_of_empire.5.b: "Zatiaľ počkáme." # todo: NEW TRANSLATION
 decline_of_empire.6.title: "Požiadavky ľudu" # todo: NEW TRANSLATION
 decline_of_empire.6.desc: "V následku nepokojov začal ľud [target_culture.GetName] vyjadrovať svoje požiadavky na väčšiu autonómiu. Nepokoj, ktorý otriasol [ROOT.GetCountry.GetFlavorRank], posilnil ich túžbu mať väčšiu kontrolu nad vlastnými záležitosťami, a teraz žiadajú reformy, ktoré by im udelili väčšiu nezávislosť od našej centrálnej vlády.\n\nOdmietnutie ich žiadosti môže byť nebezpečné! Resentiment rastie a semienka povstania sa sádzajú. Ak ich požiadavku ignorujeme, riskujeme odcudzenie časti našej populácie a vyvolanie ďalších nepokojov naprieč [ROOT.GetCountry.GetFlavorRank]. Naopak, ponúknutie ústupkov môže zmierniť napätie a udržať stabilitu, no môže to oslabiť našu kontrolu." # todo: NEW TRANSLATION
 decline_of_empire.6.a: "Udeľme im určitú autonómiu." # todo: NEW TRANSLATION
 decline_of_empire.6.b: "Zabudli na svoje miesto!" # todo: NEW TRANSLATION
 explain_decline_of_empires_events.6_tt: "Zníženie našej [Concept('control','kontroly')|e] naprieč týmito [Concept('locations','lokalitami')|e] krátkodobo poškodí našu celkovú kontrolu. Avšak zvýšenie [Concept('pop_satisfaction','spokojnosť populácie')|e] našich [target_culture.GetNameWithNoTooltip] [Concept('pops','populácií')|e] môže viesť k dlhodobým ziskom v [Concept('control','kontrole')|e]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 show_num_pops_affected_a_tt: "Približne [ROOT.GetVariable('pop_size_variable').GetValue|V0]#Y K#! [Concept('pops','populáciám')|e] [target_culture.GetNameWithNoTooltip] [Concept('culture','kultúre')|e] získa [ShowNamedValue('pop_satisfaction_extreme_bonus')|+=2%] [Concept('pop_satisfaction','spokojnosť populácie')|e]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 showcase_affected_locations_num_tt: "Približne #Y [ROOT.GetVariable('num_locations_affected_variable').GetValue]#! [Concept('locations','lokality')|e] s [target_culture.GetNameWithNoTooltip] [Concept('pops','populáciami')|e] stratia [ShowNamedValue('control_mild_penalty')|+=2%] [Concept('control','kontrola')|e]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 show_num_pops_affected_b_tt: "Približne [ROOT.GetVariable('pop_size_variable').GetValue|V0]#Y K#! [Concept('pops','populáciám')|e] [target_culture.GetNameWithNoTooltip] [Concept('culture','kultúre')|e] stratí [ShowNamedValue('pop_satisfaction_weak_penalty')|+=2%] [Concept('pop_satisfaction','spokojnosti populácie')|e]"" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 decline_of_empire.7.title: "Inšpekcie územia v [target_area.GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 decline_of_empire.7.desc: "Spustili sme rozsiahly program inšpekcií, aby sme obnovili autoritu naprieč [target_area.GetName]. Sprísnením dohľadu a presadzovaním existujúcich zákonov sme posilnili našu kontrolu a priblížili obyvateľstvo k autorite [ROOT.GetCountry.GetCapital.GetName]." # todo: NEW TRANSLATION
 decline_of_empire.7.a: "Vyslať inšpektorov." # todo: NEW TRANSLATION
 area_size_and_legislative_efficiency_tt: "Účinky sa odvíjajú od [target_area.GetName] [Concept('population','populácie')|e] a našej [Concept('legislative_efficiency','legislatívnej efektívnosti')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 amount_of_provinces_receive_bonus_depends_legislative_efficiency_tt: "Počet [Concept('provinces','provincie')|e], ktoré dostanú [ShowModifier('recent_inspection_modifier')] [Concept('modifier','modifikátor')|e], závisí od našej [ShowModifierTypeName('legislative_efficiency')]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 removal_of_head_of_cabinet_takes_stab_tt: "Keďže [target_character.GetShortName] slúži ako náš [Concept('head_of_the_cabinet','predseda kabinetu')|e], táto [Concept('action','akcia')|e] nás bude stáť ďalších [ShowNamedValue('stability_mild_penalty')|+=2] [Concept('stability','stability')|e] a spôsobí väčšiu stratu [Concept('complacency','bezstarostnosť')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 decline_of_empire.8.title: "Očista [target_character.GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 decline_of_empire.8.desc: "[target_character.GetName] zastáva [target_character.GetHerHis] pozíciu príliš dlho, čo umožnilo prerásť korupcii a stagnácii. V mene obnovy a stability v rámci [ROOT.GetCountry.GetFlavorRank] prišiel čas odstrániť tých, ktorí stoja proti ľudu a autorite [target_character2.GetName]." # todo: NEW TRANSLATION
 decline_of_empire.8.a: "Nevyhnutný krok." # todo: NEW TRANSLATION
 target_character_banned_tt: "Odstránenie je bezkrvné, no účinné" # todo: NEW TRANSLATION
 target_character_violently_purged_tt: "Očista prerastie do násilia" # todo: NEW TRANSLATION
 purging_entrenched_cabinet_member_tt: "Pretože [target_character.GetName] je [ShowModifier('entrenched_cabinet_member')], stratíme výrazne viac [Concept('complacency','bezstarostnosť')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 decline_of_empire.9.title: "Narastajúca moc [target_character.GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 decline_of_empire.9.desc: "Po dlhom a navonok úspešnom pôsobení vo vláde si [target_character.GetName] konsolidoval vplyv ďaleko za hranicami [target_character.GetHerHis] úradu. Sieť verných stúpencov a poslušných úradníkov teraz predovšetkým slúži [target_character.GetHerHim], čím je skreslená centrálná autorita. V ére už poznačenej nestabilitou toto sústredenie osobnej moci hrozí ešte viac rozbúriť nepokoje na úkor nášho [ROOT.GetCountry.GetFlavorRank]." # todo: NEW TRANSLATION
 decline_of_empire.9.a: "To nemožno ignorovať." # todo: NEW TRANSLATION
 character_can_only_be_removed_via_purge_action_tt: "Rastúci vplyv [target_character.GetShortName] možno odstrániť len pomocou [ShowGenericActionName('cd_purge_cabinet_member')] [Concept('action','akcie')|e] v paneli [Concept('disaster','katastrofe')|e]" # todo: NEW TRANSLATION # todo: CONCEPT CASE

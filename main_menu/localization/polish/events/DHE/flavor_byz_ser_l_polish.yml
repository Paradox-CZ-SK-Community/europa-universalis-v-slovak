l_polish:
 flavor_byz_ser.1.title: "Mocný despota" # todo: NEW TRANSLATION
 flavor_byz_ser.1.entry: "$flavor_byz_ser.1.title$" # todo: NEW TRANSLATION
 flavor_byz_ser.1.desc: "Veľkú časť [ROOT.GetCountry.GetAdjective] [ShowProvinceDefinitionName('vardar_province')] spravuje [target_character.GetName], mocný magnát veľkej povesti, ktorý má obrovský vplyv a je takmer nezávislý. Hoci je [target_character.GetSheHe] momentálne verný [ROOT.GetCountry.GetFlavorRank], panovníci takejto bohatosti a moci zriedka dlho rešpektujú vládu svojich suverénov.\n\nHovorí sa, že [target_character.GetNameWithNoTooltip] zvažuje zrieknutie sa [target_character.GetHerHis] vazalstva v prospech titulov v [target_country2.GetLongName], alebo možno dokonca v [target_country3.GetLongName]." # todo: NEW TRANSLATION
 flavor_byz_ser.1.a: "Takáto vzdorovitosť je dôvod, prečo potrebujeme viac moci v rukách [ROOT.GetCountry.GetGovernment.GetRulerTitle]." # todo: NEW TRANSLATION
 flavor_byz_ser.1.a.entry: "Takáto vzdorovitosť je dôvod, prečo potrebujeme viac moci v rukách vládcu." # todo: NEW TRANSLATION
 flavor_byz_ser.1.b: "Musíme zabezpečiť vernosť [target_character.GetHerHis]." # todo: NEW TRANSLATION
 flavor_byz_ser.1.b.entry: "Musíme zabezpečiť jeho vernosť." # todo: NEW TRANSLATION
 flavor_byz_ser.2.title: "$flavor_byz_ser.1.title$" # todo: NEW TRANSLATION
 flavor_byz_ser.2.entry: "$flavor_byz_ser.2.title$" # todo: NEW TRANSLATION
 flavor_byz_ser.2.desc: "Krajina [ShowProvinceDefinitionName('vardar_province')], kedysi vlastnená mocným [ROOT.GetCountry.GetLongName], už dávno padla do rúk barbariánov. Teraz, po mnohých desaťročiach, by sme mohli mať šancu vrátiť ju do našej sféry prostredníctvom nepravdepodobného spojenca.\n\n[target_character.GetName], [target_country.GetAdjective] magnát vládnuci [origin_country.GetName], sa zdá mať svoje priority v poriadku. Hoci je nominálne verný [target_country.GetLongNameWithNoTooltip], naše špióni hlásia, že [target_character.GetHerHis] oddanosť je vrtkavá a že [target_character.GetSheHe] by mohol byť naklonený k nám pomocou niektorých zákerných taktík." # todo: NEW TRANSLATION
 flavor_byz_ser.2.a: "Zasypte [target_character.GetHerHim] zlatom!" # todo: NEW TRANSLATION
 flavor_byz_ser.2.a.entry: "Zasypte ho zlatom!" # todo: NEW TRANSLATION
 flavor_byz_ser.3.title: "$flavor_byz_ser.1.title$" # todo: NEW TRANSLATION
 flavor_byz_ser.3.entry: "$flavor_byz_ser.3.title$" # todo: NEW TRANSLATION
 flavor_byz_ser.3.desc: "[target_character.GetName], ktorý sa predtým osvedčil v krvavej [target_country2.GetAdjective] občianskej vojne, si získal veľkú moc a vplyv v [ROOT.GetCountry.GetAdjective] [ShowProvinceDefinitionName('vardar_province')]. Hoci je [ShowSubjectTypeName('vassal')] [target_country.GetName], [target_character.GetHerHis] vláda je prakticky nezávislá vďaka [ShowSocietyDirectionName('decentralization')] [target_country.GetNameWithNoTooltip]. [target_character.GetSheHe] je pripravený stať sa kráľotvorcom v tejto oblasti." # todo: NEW TRANSLATION
 flavor_byz_ser.3.a: "Moc má tendenciu korumpovať, a despotická moc korumpuje despoticky." # todo: NEW TRANSLATION
 SER_strumica_was_released: "[origin_country.GetName] bolo prepustené ako náš [ShowSubjectTypeName('vassal')]. Ak udržíme ich [subject_loyalty|e], budeme ich môcť okamžite anektovať na začiatku #W 1341#!" # todo: NEW TRANSLATION
 SER_threat_of_secession: "Ak budú mať [origin_country.GetName] menej ako #Y 50.0%#! [subject_loyalty|e] na začiatku #W 1341#!, zmenia príslušnosť a stanú sa [ShowSubjectTypeName('vassal')] [target_country2.GetName]" # todo: NEW TRANSLATION
 SMC_player: "Keďže [origin_country.GetName] je hráč ovládaný človekom, konečné rozhodnutie závisí výlučne od ich voľby v príslušnom [event|e]" # todo: NEW TRANSLATION
 BYZ_threat_of_secession: "Ak budú mať [origin_country.GetName] menej ako #Y 50.0%#! [subject_loyalty|e] na začiatku #W 1341#!, zmenia príslušnosť a stanú sa [ShowSubjectTypeName('vassal')] [ROOT.GetCountry.GetName]" # todo: NEW TRANSLATION
 SMC_threat_of_secession: "V #W 1341#! budeme môcť zvoliť, či sa staneme [ShowSubjectTypeName('vassal')] [target_country2.GetName]. V závislosti od našej [subject_loyalty|e] môže výber jedného alebo druhého stáť [stability|e]." # todo: NEW TRANSLATION
 flavor_byz_ser.4.title: "Čas zúčtovania" # todo: NEW TRANSLATION
 flavor_byz_ser.4.desc: "Ubehli roky a [ROOT.GetCountry.GetAdjective] [ROOT.GetCountry.GetGovernment.GetCourtTitle] navštívili mnohokrát vyslanci [target_country2.GetAdjective]. Ich cieľ — odtiahnuť nás od [target_country.GetName] a nasmerovať k [target_country2.GetFlavorRank] na juhu. My však ich zasahovanie vidíme a nenecháme sa tak ľahko ovplyvniť ich lichotením. Toto je predovšetkým naše rozhodnutie, a bez ohľadu na to, na ktorú stranu sa postavíme, bude to mať vplyv na región [ShowRegionName('balkan_region')] na desaťročia dopredu." # todo: NEW TRANSLATION
 flavor_byz_ser.4.a: "Naša vernosť nebude spochybnená." # todo: NEW TRANSLATION
 flavor_byz_ser.4.b: "Je potrebná zmena." # todo: NEW TRANSLATION
 flavor_byz_ser.5.title: "Osud [origin_country.GetLongNameWithNoTooltip]" # todo: NEW TRANSLATION
 flavor_byz_ser.5.desc: "Napriek všetkým klebetám o [origin_country.GetAdjective] nevernosti sa ukazuje, že puto [ShowCultureName('serbian_culture')] medzi magnátmi a [target_country.GetAdjective] štátom je hlbšie než ich chamtivosť... Aj napriek zásahom [target_country2.GetAdjective] zostal [origin_country.GetGovernment.GetRulerTitle] [origin_country.GetNameWithNoTooltip] neovplyvnený — [origin_country.GetNameWithNoTooltip] zostane súčasťou [target_country.GetLongNameWithNoTooltip]." # todo: NEW TRANSLATION
 flavor_byz_ser.5.byz: "Bohužiaľ, jedného dňa ho znovu dobyjeme..." # todo: NEW TRANSLATION
 flavor_byz_ser.5.ser: "Ako sa dalo očakávať." # todo: NEW TRANSLATION
 flavor_byz_ser.5.ser_annex: "Územia budú reintegrované." # todo: NEW TRANSLATION
 flavor_byz_ser.6.title: "$flavor_byz_ser.5.title$" # todo: NEW TRANSLATION
 flavor_byz_ser.6.desc: "Medzi [target_country.GetName] a [target_country2.GetLongName] vypukol diplomatický konflikt a stalo sa niečo naozaj neobvyklé! Pánovia [origin_country.GetName] sa postavili na stranu [target_country2.GetNameWithNoTooltip] a v dôsledku toho zložili prísahu vernosti nepriateľom svojich bývalých pánov. Zriedka majú magnáti odvahu zradiť svojich zvrchovaných pánov!\n\n[origin_country.GetGovernment.GetRulerTitle] [origin_country.GetNameWithNoTooltip] rozhodol o osude [ShowProvinceDefinitionName('vardar_province')] — [origin_country.GetNameWithNoTooltip] sa už nebude klaňať [target_country.GetNameWithNoTooltip], lebo ich budúcnosť leží u [target_country2.GetNameWithNoTooltip]." # todo: NEW TRANSLATION
 flavor_byz_ser.6.byz: "Vybrali múdro." # todo: NEW TRANSLATION
 flavor_byz_ser.6.ser: "Za toto padnú hlavy!" # todo: NEW TRANSLATION
 SMC_remains_vassal_of_serbia: "[origin_country.GetName] zostáva [ShowSubjectTypeName('vassal')] [target_country.GetName]" # todo: NEW TRANSLATION
 flavor_byz_ser.4.entry: "$flavor_byz_ser.4.title$" # todo: NEW TRANSLATION

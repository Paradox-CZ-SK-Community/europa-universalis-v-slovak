l_polish:
 flavor_byz_ven.1.title: "V zúfalej situácii" # todo: NEW TRANSLATION
 flavor_byz_ven.1.entry: "$flavor_byz_ven.1.title$" # todo: NEW TRANSLATION
 flavor_byz_ven.1.desc: "Ako [ShowDisasterName('byzantine_succession_crisis')] pokračuje, naša pokladnica sa vyprázdňuje, čím sa naša pozícia s pokračovaním konfliktov stáva čoraz neudržateľnejšou. Ak náš vnútorný rozvrat bude pretrvávať, samotná existencia [origin_country.GetLongName] bude ohrozená.\n\nV takýchto zúfalých okolnostiach sa vynára kedysi neuveriteľný nápad — zastaviť [target_woa.GetName] ako zábezpeku za pôžičku od jednej z obchodných republík." # todo: NEW TRANSLATION
 flavor_byz_ven.1.a: "Zúfalé časy si žiadajú rovnako zúfalé opatrenia." # todo: NEW TRANSLATION
 flavor_byz_ven.1.b: "To je absurdné." # todo: NEW TRANSLATION
 BYZ_crown_jewels_tt: "Ak [THIS.GetCountry.GetName] súhlasia, poskytnú nám [loan|e] [SCOPE.GetLocalVariable('loan_size').GetValue|+=] [gold_i|e] a budeme trpieť [ShowModifier('BYZ_lacking_jewels')] až dovtedy, kým nebude [work_of_art|e] [target_woa.GetName] vrátený" # todo: NEW TRANSLATION
 flavor_byz_ven.2.title: "Zastavenie [origin_country.GetAdjectiveWithNoTooltip] korunovačných klenotov" # todo: NEW TRANSLATION
 flavor_byz_ven.2.entry: "Zastavenie $BYZ_ADJ$ korunovačných klenotov" # todo: NEW TRANSLATION
 flavor_byz_ven.2.desc: "[origin_country.GetLongName] je v tých najzúfalejších pomeroch. Trpiac [ShowDisasterName('byzantine_succession_crisis')], aktívne míňa svoju válečnú pokladnicu a naliehavo potrebuje ďalšie prostriedky. Ich situácia je vskutku taká zúfalá, že nám predložili prekvapivú ponuku: žiadajú pôžičku a ako zábezpeku ponúkajú [target_woa.GetName]. Pre niektorých to môže byť prejav dôvery... pre iných akt zúfalstva." # todo: NEW TRANSLATION
 flavor_byz_ven.2.a: "Bude to skvelý prírastok do našej zbierky." # todo: NEW TRANSLATION
 flavor_byz_ven.2.b: "Nech padne zlý [origin_country.GetFlavorRank]." # todo: NEW TRANSLATION
 flavor_byz_ven.2.b.entry: "Nech padne zlý štát." # todo: NEW TRANSLATION
 pawning_of_crown_jewels: "Zastavenie korunovačných klenotov" # todo: NEW TRANSLATION
 LOAN_SHORT_NAME_pawning_of_crown_jewels_L: "$pawning_of_crown_jewels$" # todo: NEW TRANSLATION
 LOAN_SHORT_NAME_pawning_of_crown_jewels_B: "$pawning_of_crown_jewels$" # todo: NEW TRANSLATION
 LOAN_TOOLTIP_pawning_of_crown_jewels: "Dospelo sa k vzájomnej dohode, v rámci ktorej veriteľ poskytne dlžníkovi pôžičku za zábezpeku $byzantine_crown_jewels$. Keď bude pôžička splatená, zastavené klenoty by mali byť vrátené — aspoň v teórii." # todo: NEW TRANSLATION
 LOAN_TITLE_pawning_of_crown_jewels: "$pawning_of_crown_jewels$" # todo: NEW TRANSLATION
 LOAN_NAME_pawning_of_crown_jewels_L: "$pawning_of_crown_jewels$" # todo: NEW TRANSLATION
 LOAN_NAME_pawning_of_crown_jewels_B: "$pawning_of_crown_jewels$" # todo: NEW TRANSLATION
 flavor_byz_ven.3.title: "Pôžička splatená" # todo: NEW TRANSLATION
 flavor_byz_ven.3.entry: "$flavor_byz_ven.3.title$" # todo: NEW TRANSLATION
 flavor_byz_ven.3.desc: "[origin_country.GetLongName] práve splatili pôžičku, ktorú sme im poskytli, a teraz požadujú, aby bol [target_woa.GetName] vrátený do ich vlastníctva. Podľa našej dohody musíme vyhovieť — ale tým stratíme akúkoľvek páku, ktorú na nich máme.\n\nIstotne, keby sme klenoty nevrátili, nič významné by sa nestalo..." # todo: NEW TRANSLATION
 flavor_byz_ven.3.a: "Nemôžeme riskovať takú škvrnu na našej reputácii." # todo: NEW TRANSLATION
 flavor_byz_ven.3.b: "Prečo nie? Prečo by sme si ich nemali nechať?" # todo: NEW TRANSLATION
 flavor_byz_ven.4.title: "Korunovačné klenoty vrátené" # todo: NEW TRANSLATION
 flavor_byz_ven.4.desc: "Podľa našej dohody sme splatili pôžičku [target_country.GetLongName] a [target_woa.GetName] bol následne vrátený a obnovený do vlastníctva [origin_country.GetAdjective] v [target_location.GetName].\n\nBolo potešením obchodovať s najváženejšou [ShowGovernmentReformName('merchant_republic')] zo všetkých." # todo: NEW TRANSLATION
 flavor_byz_ven.4.a: "[ROOT.GetCountry.Custom('common_string_positive')]" # todo: NEW TRANSLATION
 flavor_byz_ven.4.a.entry: "$common_string_brilliant$" # todo: NEW TRANSLATION
 flavor_byz_ven.5.title: "Dohoda porušená" # todo: NEW TRANSLATION
 flavor_byz_ven.5.desc: "Napriek tomu, že sme podľa dohody splatili našu pôžičku, strana [target_country.GetAdjective] ignorovala našu žiadosť vrátiť [target_woa.GetName]. Existuje len jeden spôsob, ako to môžeme interpretovať — veľká krádež!\n\nBudú čeliť hnevu [origin_country.GetLongName]..." # todo: NEW TRANSLATION
 flavor_byz_ven.5.a: "Nemali sme sa dohodnúť s Diablom." # todo: NEW TRANSLATION
 flavor_byz_ven.6.title: "$flavor_byz_ven.4.title$" # todo: NEW TRANSLATION
 flavor_byz_ven.6.desc: "[target_army.GetName] konečne vrátil [target_woa.GetName] do nášho vlastníctva. Náš majetok bol vrátený do [target.GetName], kde ho srdečne prijal [ROOT.GetCountry.GetGovernment.GetCourtTitle]. Naši nepriatelia už nemôžu tieto klenoty používať na vyvíjanie nátlaku na nás!" # todo: NEW TRANSLATION
 flavor_byz_ven.6.a: "[ROOT.GetCountry.Custom('common_string_positive')]" # todo: NEW TRANSLATION
 flavor_byz_ven.6.a.entry: "$common_string_brilliant$" # todo: NEW TRANSLATION
 flavor_byz_ven.7.title: "[target_woa.GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 flavor_byz_ven.7.desc: "Nedávne obsadenie [location.GetName] bolo veľkým úspechom pre [ROOT.GetCountry.GetName]. Naše vojská, [target_army.GetName], vykonali dôkladný 'prieskum' krajiny a pri tom získali [target_woa.GetName], dôležitý majetok našich spojencov v [origin_country.GetName]. Môžeme im ho vrátiť... ale nezaslúžime si rovnaký podiel na koristi z vojny?" # todo: NEW TRANSLATION
 flavor_byz_ven.7.a: "Vrátime ich našim milým spojencom." # todo: NEW TRANSLATION
 flavor_byz_ven.7.b: "Ale právom patria nám — lebo sme ich ukradli!" # todo: NEW TRANSLATION
 flavor_byz_ven.8.title: "Klenoty ukradnuté!" # todo: NEW TRANSLATION
 flavor_byz_ven.8.desc: "Dostali sa k nám správy o úplnej nekompetentnosti našich veriteľov! Požičiavši nám zlato so vzácnym [target_woa.GetName] ako zábezpekou, dokázali nechať tieto isté klenoty ukradnúť priamo spod nosa. Úprimne dúfame, že naše veci nájdu. Ak nie, budeme si ich musieť zobrať späť od [target.GetName] sami..." # todo: NEW TRANSLATION
 flavor_byz_ven.8.a: "Existuje niečo, čo vedia spraviť správne, okrem hromadenia zlata?" # todo: NEW TRANSLATION
 byz_woa_was_moved: "[target_woa.GetName] bol premiestnený do [target.GetName]" # todo: NEW TRANSLATION

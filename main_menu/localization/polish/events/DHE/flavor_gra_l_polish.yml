l_polish:
 flavor_gra.1.title: "Maurovskí utečenci" # todo: NEW TRANSLATION
 flavor_gra.1.desc: "V mene Allāha, Najmilostivejšieho, Najmilosrdnejšieho. Granada padla do rúk neveriacich! Posledný klenot al-Andalusu, maják učenia, je teraz v kastílskych rukách. Keď sa islamský svet spamätáva z tejto straty, maurovskí utečenci sa hrnú do moslimských miest a dvorov v Severnej Afrike a na Blízkom východe, prinášajúc so sebou vedomosti, diela vynikajúcich učencov ako Abu al-Walid ibn Rushd, Abu al-Qasim al-Zahrawi a Abu Bakr ibn Tufail. Pozvanie týchto utečencov do [ROOT.GetCountry.GetAltAdjective('G')] by mohlo výrazne posilniť naše vlastné snahy v oblastiach vedy a kultúry." # todo: CHANGED MINOR # todo: COUNTRY CASE
 flavor_gra.1.a: "Určite ich pozvite do [ROOT.GetCountry.GetAltAdjectiveWithNoTooltip('G')]!" # todo: CHANGED # todo: COUNTRY CASE
 flavor_gra.1.a.entry: "Určite ich k nám pozvite!" # todo: NEW TRANSLATION
 flavor_gra.1.b: "Nie, nepotrebujeme ich." # todo: NEW TRANSLATION
 flavor_gra.2.title: "Emirát Sicílie" # todo: NEW TRANSLATION
 flavor_gra.2.entry: "$flavor_gra.2.title$" # todo: NEW TRANSLATION
 flavor_gra.2.desc: "V dávnych časoch bol Emirát Sicílie pevnou baštou našej viery; odolával až do chvíle, keď križiaci dobyli ostrov v roku 1087.\n\nTeraz, keď máme túto žiadanú krajinu v držbe, už o ňu znovu neprídeme!" # todo: NEW TRANSLATION
 flavor_gra.2.a: "Absolútna autorita vyžaduje absolútne panstvo." # todo: NEW TRANSLATION
 STATIC_MODIFIER_NAME_sicily_in_safe_hands: "Administratívne investície" # todo: NEW TRANSLATION
 STATIC_MODIFIER_NAME_DESC_sicily_in_safe_hands: "Sicílie nám slúži lepšie pod priamou kontrolou - vďaka tomu môžeme vložiť viac zdrojov, aby sme ostrov doviedli k prosperite." # todo: NEW TRANSLATION
 flavor_gra.3.title: "Pomoc od [GetCountry('TUR').GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 flavor_gra.3.entry: "Žiadosť o podporu Osmanskej ríše" # todo: NEW TRANSLATION
 flavor_gra.3.desc: "Keďže sme teraz vo vojne proti [GetCountry('CAS').GetName], ktorá sa môže ukázať beznádejnou, musíme poslať zúfalé prosby veriacim za morom o pomoc. [GetCountry('TUR').GetGovernment.GetRuler.GetDynasty.GetName] by nám mohol prísť na pomoc, ak len zniesieme ponižujúcu nutnosť ich prosiť!" # todo: NEW TRANSLATION
 flavor_gra.3.a: "Sú našou jedinou nádejou!" # todo: NEW TRANSLATION
 flavor_gra.3.tt: "[GetCountry('TUR').GetNameWithNoTooltip|U] by nás mohol brániť proti [GetCountry('CAS').GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 flavor_gra.3.b: "Musíme stáť sami." # todo: NEW TRANSLATION
 flavor_gra.3.historical_info: "Nasridovskí panovníci Granady poslali vyslancov k Osmanom aj k $mamluks$, aby žiadali pomoc proti Kastílii. Osmanská ríša zvyšovala svoju prítomnosť v západnom Stredozemí a Granada nadšene plánovala vylodenie 200 000 tureckých vojakov vo València na ich podporu." # todo: RETRANSLATED ENGLISH
 flavor_gra.4.title: "Skľučujúca odpoveď" # todo: NEW TRANSLATION
 flavor_gra.4.entry: "$flavor_gra.4.title$" # todo: NEW TRANSLATION
 flavor_gra.4.desc: "Dostali sme správu od [GetCountry('TUR').GetName], že nám #italic ne#! prídu na pomoc. Aj keby si to priali, tvrdia, že majú iné naliehavé starosti, ale v liste vznešene chválili staré slávy al-Andalusu - čokoľvek to teraz môže znamenať." # todo: CHANGED MINOR
 flavor_gra.4.a: "Musíme pokračovať v boji!" # todo: NEW TRANSLATION
 flavor_gra.4.historical_info: "Vládci Granady zúfalo dúfali v podporu Osmanov a $mamluks$. Avšak Osmanovia a $mamluks$ čoskoro upadli do vzájomnej vojny a neboli schopní poskytnúť veľa priamej pomoci. Turci vyslali flotilu pod vedením Kemal Reisa, ktorá pustošila kastílske državy v západnom Stredozemí, a táto flotila neskôr pomohla prepraviť mnohých utečencov cez more." # todo: RETRANSLATED ENGLISH
 ibn_khaldun_patronage: "Do nášho [ROOT.GetCountry.GetGovernment.GetCourtTitle] prišiel muž s mimoriadnym intelektom a povesťou. [target_character.GetName], slávny historik a filozof, žiada patronát, aby mohol pokračovať v [target_character.GetHerHis] štúdiách a písomnostiach. Známý svojimi [target_character.GetHerHis] postrehmi o správe, ekonómii a vzostupe a páde ríš, by [target_character.GetHerHis] prítomnosť mohla pozdvihnúť prestíž nášho [ROOT.GetCountry.GetGovernment.GetCourtTitle] a poskytnúť nám nenahraditeľné rady. Máme udeliť [target_character.GetHerHim] pozíciu, ktorú si želá?" # todo: NEW TRANSLATION
 flavor_gra.5.title: "[target_character.GetNameWithNoTooltip] žiada o patronát" # todo: NEW TRANSLATION
 flavor_gra.5.entry: "Ibn Khaldun žiada o patronát" # todo: NEW TRANSLATION
 flavor_gra.5.desc: "$ibn_khaldun_patronage$" # todo: NEW TRANSLATION
 flavor_gra.5.a: "Dobre." # todo: NEW TRANSLATION
 flavor_gra.5.b: "Nezaujímajú nás takéto frivolné výdavky!„" # todo: NEW TRANSLATION
 flavor_gra.6.title: "Perla prielivu" # todo: NEW TRANSLATION
 flavor_gra.6.entry: "$flavor_gra.6.title$" # todo: NEW TRANSLATION
 flavor_gra.6.desc: "Dorazila správa od #italic wālīho#! z [target_location.GetName]. Hradby odolávajú, prístav je rušný a poplatok, ktorý tento mesiac prijala naša pokladnica, bol najvyššou jednorazovou platbou za celý rok z ktoréhokoľvek miesta v našej [ROOT.GetCountry.GetFlavorRank]. Z Alcazaby a hradu Gibralfaro nad ňou dovidí stráž za jasného rána až na druhú stranu prielivu — a práve to potrebuje [ROOT.GetCountry.GetGovernment.GetCourtTitle] vedieť najviac.\n\n[ROOT.GetCountry.GetCapital.GetName] nám dáva trón. [target_location.GetNameWithNoTooltip] nám dáva takmer všetko ostatné. Jeho prístaviská zabezpečujú väčšinu našich colných príjmov. [GetCountry('GEN').GetAdjective] obchodníci tam pravidelne zimujú a sladké fortifikované víno z jeho zázemia sa predáva až do [GetCountry('FLA').GetName]. Niet iného mesta v našom vlastníctve, ktorého stratu by sme si mohli dovoliť.\n\nPráve preto oň majú záujem aj iní. [GetCountry('CAS').GetName] sleduje prístav už dve generácie. A rovnako aj viacerí naši bratranci: nejeden muž, ktorý neskôr nosil našu korunu, vztýčil svoje prvé zástavy na týchto hradbách — rovnako ako niektorí z povstalcov, ktorých neskôr potlačil." # todo: NEW TRANSLATION
 flavor_gra.6.a: "Budeme strážiť Mālaqu, ako strážime samotnú korunu." # todo: NEW TRANSLATION
 flavor_gra.6.historical_info: "Mālaqa bola druhým mestom Granadského emirátu a jedným z najdôležitejších stredomorských prístavov stredovekého islamského sveta. Po tom, čo Nasridovci v roku 1239 pohltili poslednú tajfu z obdobia Hammúdovcov, bolo mesto zverené #italic wālīmu#!, ktorého priamo vymenoval sultán. Prvým bol Ismaʿīl, brat Muhammada I., a tento úrad sa takmer natrvalo stal apanážou blízkych kráľovských príbuzných.\n\nJeho obrana sa opierala o Alcazabu, palácovú pevnosť na kopci s výhľadom na prístav, a vyššie položený hrad Gibralfaro, s ktorým ju spájala krytá hradba zvaná coracha. Z týchto výšin mohli strážcovia spozorovať lode plaviace sa okolo Gibraltárskeho prielivu niekoľko dní pred ich príchodom do prístavu. Nižšie sa v #italic funduqoch#! usádzali janovskí, katalánski a maghrebskí obchodníci a colné príjmy z Mālaqy predstavovali najväčší samostatný zdroj príjmov nasridskej pokladnice.\n\nJej vývoz smeroval až do Flámska a Egypta. Z jej prístavísk odchádzali andalúzsky hodváb, keramika s kovovým leskom, sušené figy a hrozienka z Axarquíe aj sladké fortifikované víno, ktoré mestu zabezpečilo trvalú povesť na európskych trhoch. Lodenice na Guadalmedine zásobovali nasridské galéry, ktoré hliadkovali v prielive po boku svojich marinidských spojencov.\n\nSpráva Mālaqy prinášala prestíž aj nebezpečenstvo. Tento úrad býval odrazovým mostíkom k trónu a opakovanou základňou povstaní vždy, keď sa dynastia rozštiepila. Muhammad VI., takzvaný Červený sultán, vztýčil v meste svoje zástavy v roku 1359 a jeho definitívny pád do rúk katolíckych Veličenstiev v roku 1487 ukončil andalúzsku vládu na polostrove pol desaťročia pred pádom samotnej Granady." # todo: NEW TRANSLATION
 flavor_gra.9.entry: "$flavor_gra.9.title$" # todo: NEW TRANSLATION
 flavor_gra.9.title: "Sefardskí Židia" # todo: NEW TRANSLATION
 flavor_gra.9.desc: "[ShowRegionName('iberia_region')] je už dlho významným centrom vyznávačov [ShowReligionName('judaism')], ktorých komunity žijú v jeho prosperujúcich mestách. Mnohí z nich sa rozhodli premeniť [target_location.GetRank.GetName] [target_location.GetName] na útočisko, kde môžu žiť bez prenasledovania a diskriminácie.\n\n[ROOT.GetCountry.GetGovernment.GetCourtTitle] si tento vývoj všimol. Niektorí toto ich nové útočisko podporujú a veria v rovnosť všetkých stvorení [ROOT.GetCountry.GetReligion.GetGodName], zatiaľ čo iní, ktorých viera je nekompromisnejšia, ho považujú za škvrnu na všetkom svätom v [ROOT.GetCountry.GetFlavorRank] a chcú ho odstrániť!" # todo: NEW TRANSLATION
 flavor_gra.9.a: "Budeme chrániť práva [ShowReligionAdjectiveWithNoTooltip('judaism')] ľudu." # todo: NEW TRANSLATION
 flavor_gra.9.b: "[ROOT.GetCountry.GetReligion.GetGodName] by nikdy nedovolil týmto neveriacim žiť v pokoji!" # todo: NEW TRANSLATION
 gra_jewish_people_in_target_location_become_unhappy: "Každý [Concept('pop','populácia')|e] [ShowReligionAdjective('judaism')] vierovyznania v [target_location.GetName] stratí [ShowNamedValue('pop_satisfaction_extreme_penalty')|+=2%]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 flavor_gra.10.entry: "Atentát na nášho panovníka" # todo: NEW TRANSLATION
 flavor_gra.10.title: "Atentát na [target_character.GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 flavor_gra.10.desc: "[ROOT.GetCountry.GetName] postihla tragédia!\n\nPo modlitbe v [target_location.GetName] zaútočil na [target_character.GetName] zrejme šialenec s úmyslom vraždiť a ťažko [target_character.GetHerHim] zranil. Ani najlepší lekári nedokázali vyliečiť početné rany, ktoré [target_character.GetSheHe] utrpel, a o niekoľko hodín neskôr [target_character.GetSheHe] vyhlásili za mŕtveho.\n\n[ROOT.GetCountry.GetGovernment.GetCourtTitle] to zarmútilo, no niektorí trvajú na tom, že išlo o zinscenovaný incident. Tvrdia, že tí, ktorí boli proti [target_character.GetHerHis] vláde, úmyselne odvrátili pozornosť [target_character.GetHerHis] stráží, aby vrah dostal príležitosť, na ktorú čakal. Pravdu však, žiaľ, nikto nepozná a najlepšie bude zatvoriť rakvu." # todo: NEW TRANSLATION
 flavor_gra.10.a: "Čo sa teraz stane s [ROOT.GetCountry.GetAltAdjectiveWithNoTooltip('I')]?" # todo: NEW TRANSLATION # todo: COUNTRY CASE
 leader_is_scarred: "#Y [target_character.GetName] prežije, ale zostane zjazvený#!" # todo: NEW TRANSLATION
 leader_dies: "#Y [target_character.GetName] neprežije#!" # todo: NEW TRANSLATION
 flavor_gra.11.entry: "$flavor_gra.11.title$" # todo: NEW TRANSLATION
 flavor_gra.11.title: "[ShowGoodsNameWithNoTooltip('silk')] z [ShowLocationNameWithNoTooltip('granada')]" # todo: NEW TRANSLATION
 flavor_gra.11.desc: "[ShowGoodsName('silk')], ktorý vyrába [ROOT.GetCountry.GetName], je azda najznámejší v celej [ShowContinentName('europe')]. Obchodníci z [ShowLocationName('genoa')], [ShowLocationName('venice')] a dokonca aj z [ShowLocationName('prague')] ho chcú kupovať, aby uspokojili dopyt svojich zámožných a privilegovaných [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')], čo je pre nás veľmi výnosná dohoda.\n\nNaši bohatí [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')] sa nechcú pri vývoze [ShowGoodsNameWithNoTooltip('silk')] zameriavať len na zisk. Chcú, aby sme ho skúsili spopularizovať a urobili z neho tovar, ktorý bude chcieť kupovať celý svet, čím zvýšime svoju prestíž vďaka monopolu na jeho obchod." # todo: NEW TRANSLATION
 flavor_gra.11.a: "[ShowGoodsNameWithNoTooltip('silk')] z [ShowLocationNameWithNoTooltip('granada')] bude známy všade!" # todo: NEW TRANSLATION
 unlock_expand_iberian_silk_decision: "Sprístupní sa nám [Concept('decision','rozhodnutiu')|e] $gra_expand_seda_de_granada.title$, na ktorého uskutočnenie budeme musieť dobyť [ShowLocationName('murcia')]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 flavor_gra.12.entry: "$flavor_gra.12.title$" # todo: NEW TRANSLATION
 flavor_gra.12.title: "Obchodná príležitosť" # todo: NEW TRANSLATION
 flavor_gra.12.desc: "Náš [ShowGoodsName('silk')] je najznámejší v celej [ShowContinentName('europe')]. [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')] z celého [ROOT.GetCountry.GetAltAdjective('G')] sa usilujú tento tovar predávať nielen pre zisk, ale aj preto, aby svetu ukázali jeho nedostižnú kvalitu. Sami to však nedokážu, a preto nás požiadali o vytvorenie obchodných trás, ktoré zabezpečia pokračovanie výmeny. Pomohlo by nám to tiež udržať si dobrú povesť a prestíž v obchode s [ShowGoodsNameWithNoTooltip('silk')]." # todo: NEW TRANSLATION # todo: COUNTRY CASE
 flavor_gra.12.a: "Pokúsme sa rozšíriť náš obchod diplomatickou cestou." # todo: NEW TRANSLATION
 flavor_gra.13.entry: "$flavor_gra.13.title$" # todo: NEW TRANSLATION
 flavor_gra.13.title: "$ghuzat_mujahidin_bureaucracy$" # todo: NEW TRANSLATION
 flavor_gra.13.desc: "V záujme prežitia [ROOT.GetCountry.GetName] sa k našej armáde pridalo mnoho dobrovoľníkov.\n\nTíto vojaci, väčšinou [ShowCultureGroupName('amazigh_group')] pôvodu, sú pod velením [target_character2.GetName] — schopnej, no vrtkavej osobnosti. Aby sme si v [ShowSituationName('battle_for_the_strait')] zachovali nezávislosť, musíme mať pod kontrolou čo najviac okolností a títo dobrovoľníci sú kľúčoví pri rozhodovaní o tom, kto zasadne na trón. Namiesto toho, aby sme ich ponechali pod velením cudzieho činiteľa, mali by sme sa pokúsiť získať ich pre vedenie dynastie [target_character.GetDynasty.GetName] a odstrániť riziko zrady." # todo: NEW TRANSLATION
 flavor_gra.13.a: "Nech slúžia všetci títo muži." # todo: NEW TRANSLATION
 flavor_gra.13.b: "Zbavíme sa tých, ktorí nám nie sú úplne oddaní." # todo: NEW TRANSLATION
 gra_mercenary_company_will_be_weaker_and_more_expensive: "[Concept('mercenary','Žoldnier')|e] rota bude mať #Y polovičný#! počet mužov a bude drahšia" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 flavor_gra.14.entry: "$flavor_gra.14.title$" # todo: NEW TRANSLATION
 flavor_gra.14.title: "Qaṣr ar-Riyāḍ as-Sa'īd" # todo: NEW TRANSLATION
 flavor_gra.14.desc: "[ShowBuildingTypeName('alhambra')] v [ShowLocationName('granada')] je hlavným zdrojom našej prestíže ako [ROOT.GetCountry.GetRank.GetName] v [ShowRegionName('iberia_region')]. To však nestačí niekomu tak nenásytnému, ako je [target_character.GetName]. V snahe ukázať slávu dynastie [target_character.GetDynasty.GetName] celému [ShowReligionGroupAdjective('muslim')] svetu chce [target_character.GetSheHe] zamestnať najlepších architektov a nechať postaviť palác v samotnom srdci [ShowBuildingTypeNameWithNoTooltip('alhambra')], vyzdobený sochami levov a klenbami s #italic muqarnaṣ#!." # todo: NEW TRANSLATION
 flavor_gra.14.a: "Podporíme tento projekt." # todo: NEW TRANSLATION
 flavor_gra.14.b: "Nech celý svet uzrie slávu dynastie [target_character.GetDynasty.GetNameWithNoTooltip]!" # todo: NEW TRANSLATION
 flavor_gra.14.b.entry: "Nech celý svet uzrie slávu našej dynastie!" # todo: NEW TRANSLATION
 gra_construct_alhambra_increment_tt: "Maximálna úroveň [ShowBuildingTypeName('alhambra')] sa zvýši o #G +1#!" # todo: NEW TRANSLATION
 flavor_gra.14.c: "Nebudeme sa snažiť uspokojiť tých, ktorým nič nestačí." # todo: NEW TRANSLATION
 flavor_gra.15.entry: "$flavor_gra.15.title$" # todo: NEW TRANSLATION
 flavor_gra.15.title: "Príležitosť v zápase" # todo: NEW TRANSLATION
 flavor_gra.15.desc: "Naši diplomati a špehovia hlásia, že v [target_country.GetName] vládne nesvár. Rozkol je taký vážny, že sa [target_character2.GetName] musí sústrediť na domácu politiku, čo nám dáva šancu vydýchnuť si pod jarmom, ktoré na nás uvalili. [target_character.GetName] si dokonca myslí, že by sme to mohli využiť na získanie výhody v [ShowSituationName('battle_for_the_strait')], keďže sa už nemusíme sústrediť na front s [target_country.GetNameWithNoTooltip]." # todo: NEW TRANSLATION
 flavor_gra.15.a: "Modlime sa, aby ich ťažké časy pokračovali." # todo: NEW TRANSLATION
 gra_gain_granadan_sovereignty_for_the_rest_of_the_disaster: "Kým sa [GetCountry('CAS').GetName] alebo [GetCountry('MOR').GetName] nachádza v [Concept('disaster','katastrofe')|e], budeme získavať #G 0.1#! granadskej [Concept('granadan_sovereignty','granadská suverenita')|e] mesačne" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 flavor_gra.16.entry: "$flavor_gra.16.title$" # todo: NEW TRANSLATION
 flavor_gra.16.title: "Nesvár v [ShowProvinceDefinitionNameWithNoTooltip('malaga_province')]" # todo: NEW TRANSLATION
 flavor_gra.16.desc: "Hoci si v [ShowRegionName('iberia_region')] zachovávame zvrchovanosť, vládcovia [GetCountry('MOR').GetName] sa usadili na územiach [ShowProvinceDefinitionName('malaga_province')], ktoré právom patria nášmu [ROOT.GetCountry.GetRank.GetAltAdjective('D')].\n\n[target_character2.GetName] sa domnieva, že by sme im tieto územia mali ponechať za všetku pomoc, ktorú nám [GetCountry('MOR').GetNameWithNoTooltip] v minulosti poskytlo. Stavy v [ROOT.GetCountry.GetAltAdjective('L')] to však považujú za hrozbu pre našu nezávislosť a chcú, aby sme získali späť to, čo nám kedysi patrilo." # todo: NEW TRANSLATION # todo: COUNTRY CASE
 flavor_gra.16.a: "Vykročme do boja a dobyme ich." # todo: NEW TRANSLATION
 flavor_gra.16.b: "Takto si susedov proti sebe nepoštveme." # todo: NEW TRANSLATION
 flavor_gra.18.entry: "$flavor_gra.18.title$" # todo: NEW TRANSLATION
 flavor_gra.18.title: "Vzdorujeme [GetCountry('CAS').GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 flavor_gra.18.desc: "Sme hrdí na to, že sme pozostatkom $ADU$, no museli sme platiť tribút [GetCountry('CAS').GetName], čo ponižuje náš [ROOT.GetCountry.GetGovernment.GetCourtTitle]. Tieto platby brzdia naše hospodárstvo a zároveň posilňujú nášho úhlavného nepriateľa v zápase o [ShowRegionName('iberia_region')]. Mnohí vojaci to už nechcú ďalej trpieť a považujú túto chvíľu za vhodnú na to, aby sme sa zbavili jarma a oslobodili od cudzích bremien." # todo: NEW TRANSLATION
 flavor_gra.18.a: "Aj keby tento pokus zlyhal, raz tieto reťaze zlomíme." # todo: NEW TRANSLATION
 flavor_gra.18.b: "Zatiaľ sa podrobíme. Neskôr dostaneme ďalšiu príležitosť." # todo: NEW TRANSLATION
 flavor_gra.19.title: "Uťahovanie jarma" # todo: NEW TRANSLATION
 flavor_gra.19.desc: "Vzťah, ktorý sme si vybudovali s [from_country.GetName], sa rozpadol. Namiesto toho, aby si pokojne užívali svoju prosperitu, [target_character.GetName] si všimol slabosť našich hraníc a rozhodol sa prestať platiť tribút. [ROOT.GetCountry.GetGovernment.GetCourtTitle] si to všimol a teraz trvá na tom, aby sme im pripomenuli ich povinnosť. Ak nám budú naďalej odopierať právoplatný tribút, môže sa nám naskytnúť príležitosť anektovať [from_country.GetNameWithNoTooltip] raz a navždy." # todo: NEW TRANSLATION
 flavor_gra.19.a: "[from_country.GetCapital.GetNameWithNoTooltip] padne!" # todo: NEW TRANSLATION
 flavor_gra.19.a.entry: "Za toto zaplatia!" # todo: NEW TRANSLATION
 flavor_gra.20.entry: "$flavor_gra.20.title$" # todo: NEW TRANSLATION
 flavor_gra.20.title: "Prosperita na trhoch [ShowLocationNameWithNoTooltip('granada')]" # todo: NEW TRANSLATION
 flavor_gra.20.desc: "Naša produkcia [ShowGoodsName('silk')] a nadšenie, s akým ho naši [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')] predávajú po celej [ShowContinentName('europe')], viedli k vzniku nových trhovísk v [ShowLocationName('granada')]. Tento vývoj podnietil mnohých našich [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('burghers_estate')], aby obchod rozšírili a využili svoj vplyv i zlato na podporu projektu.\n\nPostaviť sa má veľkolepé [ShowBuildingTypeName('marketplace')], známe ako [ShowBuildingTypeName('al_qaysariyya_market')], ktoré má slúžiť ako najväčšie obchodné centrum v celej [ShowRegionName('iberia_region')]. Má prilákať zahraničných obchodníkov a povzbudiť našich, aby obchodovali aj s najvzdialenejšími kútmi sveta." # todo: NEW TRANSLATION
 flavor_gra.20.a: "Postavme [ShowBuildingTypeNameWithNoTooltip('al_qaysariyya_market')]." # todo: NEW TRANSLATION
 flavor_gra.20.b: "Tentoraz budeme musieť našich [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('burghers_estate')] sklamať." # todo: NEW TRANSLATION
 flavor_gra.1000.entry: "$flavor_gra.1000.title$" # todo: NEW TRANSLATION
 flavor_gra.1000.title: "Významná osobnosť" # todo: NEW TRANSLATION
 flavor_gra.1000.desc: "Počas uplynulých rokov krvavých konfliktov so susedmi sa jeden z príslušníkov dynastie [ShowDynastyName('nasrid_dynasty')] preslávil [target_character.GetHerselfHimself] po celom [ROOT.GetCountry.GetAltAdjective('L')]. Volá sa [target_character.GetName] a [target_character.GetSheHe] preukázal [target_character.GetHerselfHimself] ako výnimočný vojenský vodca, schopný strhnúť na svoju stranu tisíce mužov. Tak si všimol [target_character.GetWomanMan] [target_character2.GetName] a zatúžil priviesť [target_character.GetHerHim] bližšie k [ROOT.GetCountry.GetGovernment.GetCourtTitle]. [target_character.GetSheHe] však prejavil neukojiteľné ambície, čo znepokojuje mnohých ľudí z okolia [target_character2.GetNameWithNoTooltip]." # todo: NEW TRANSLATION # todo: COUNTRY CASE
 flavor_gra.1000.a: "Veľkí ľudia patria tejto veľkej krajine." # todo: NEW TRANSLATION
 gra_yusuf_will_most_likely_rebel: "Pozvanie [target_character.GetName], aby slúžil [ROOT.GetCountry.GetName], s veľkou pravdepodobnosťou povedie k tomu, že sa [target_character.GetHerHim] pokúsi zvrhnúť [target_character2.GetName]" # todo: NEW TRANSLATION
 flavor_gra.1000.b: "Nestojí za to podstupovať také riziko." # todo: NEW TRANSLATION
 gra_banishing_yusuf_prevents_the_rebellion: "Vyhostením [target_character.GetName] zaistíme, že [target_character.GetSheHe] nepovstane" # todo: NEW TRANSLATION
 flavor_gra.1000.c: "Naše kontakty nám hovoria, že tento plán sa obráti proti nám." # todo: NEW TRANSLATION
 flavor_gra.1001.title: "Povstanie [target_character.GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 flavor_gra.1001.desc: "[target_character.GetName] využil [target_character.GetHerHis] popularitu na zhromaždenie početných stúpencov a teraz sa silou i vplyvom vyrovná [target_character2.GetName]. [target_character.GetHerHim] podporovatelia predložili súčasnému vedeniu ultimátum: abdikovať v prospech [target_character.GetNameWithNoTooltip], alebo bude [ROOT.GetCountry.GetName] pohltené zničujúcou vojnou." # todo: NEW TRANSLATION
 flavor_gra.1001.a: "Nikdy neprenecháme vládu uzurpátorovi!" # todo: NEW TRANSLATION
 flavor_gra.1001.b: "Dnes večer nebude preliata žiadna zbytočná krv. [target_character2.GetNameWithNoTooltip] abdikuje." # todo: NEW TRANSLATION
 flavor_gra.1001.b.entry: "Dnes večer nebude preliata žiadna zbytočná krv. Vzdáme sa trónu." # todo: NEW TRANSLATION
 flavor_gra.1100.entry: "$flavor_gra.1100.title$" # todo: NEW TRANSLATION
 flavor_gra.1100.title: "Vychádzajúca hviezda" # todo: NEW TRANSLATION
 flavor_gra.1100.desc: "Medzi našimi vojakmi na fronte sa šíria chýry o silnom mladom [target_character.GetWomanMan], ktorý rýchlo stúpa vojenskými hodnosťami a už bol vymenovaný za generála. Volá sa [target_character.GetName] a vraví sa, že [target_character.GetSheHe] má jastrabie oči, vďaka ktorým dokáže sledovať celé bojisko a aj v zápale bitky robiť múdre strategické rozhodnutia. Hovorí sa tiež, že [target_character.GetSheHe] sa s mečom nikomu nevyrovná a [target_character.GetSheHe] porazil každého protivníka, ktorému čelil. Pravdivosť týchto tvrdení však ukáže až čas..." # todo: NEW TRANSLATION
 flavor_gra.1100.a: "Jeho kariéru budeme pozorne sledovať." # todo: NEW TRANSLATION
 flavor_gra.1100.b: "Takíto ľudia prinášajú len problémy." # todo: NEW TRANSLATION
 flavor_gra.1101.title: "Jeden z mnohých" # todo: NEW TRANSLATION
 flavor_gra.1101.desc: "[ROOT.GetCountry.GetGovernment.GetRulerOrRegent.GetOralAddress], zdá sa, že prehnané tvrdenia našich vojakov sú aspoň sčasti pravdivé — [target_character.GetWomanMan] dokázal nevídané činy a iba so [target_character.GetHerHis] plukom odrazil útok obchádzajúcej jazdy. Dvorania na našom [ROOT.GetCountry.GetGovernment.GetCourtTitle] si myslia, že [target_character.GetSheHe] by mal dostať významný titul, a zdá sa rozumné odmeniť také odvážne činy. [target_character.GetSheHe|U] možno patrí len k mnohým, no mohol by byť aj druhým príchodom Ḵālida ibn al-Walīda." # todo: NEW TRANSLATION
 flavor_gra.1101.a: "Potrebujeme viac takýchto ľudí." # todo: NEW TRANSLATION
 flavor_gra.1102.title: "Obklopený vernými stúpencami" # todo: NEW TRANSLATION
 flavor_gra.1102.desc: "Odkedy sme [target_character.GetName] udelili [target_character.GetHerHis] šľachtický titul, [target_character.GetHerHis] najbližší spoločníci sa začali správať skôr ako [target_character.GetHerHis] družina: starajú sa o každú [target_character.GetHerHis] potrebu a vystupujú ako [target_character.GetHerHis] zástupcovia, keď [target_character.GetSheHe] nie je prítomný. Na panstve, ktoré [target_character.GetSheHe] dostal v [ROOT.GetCountry.GetCapital.GetAltAdjective('L')], je v poslednom čase rušnejšie a davy sa dožadujú možnosti uvidieť [target_character.GetHerHis] tvár. Niektorí [target_character.GetHerHis] činy zveličujú až do náboženského nadšenia a takmer to vyzerá, akoby [target_character.GetHerHim] uctievali." # todo: NEW TRANSLATION # todo: COUNTRY CASE
 flavor_gra.1102.a: "Podozrivé..." # todo: NEW TRANSLATION
 flavor_gra.1103.title: "Vystupuje uchádzač o trón" # todo: NEW TRANSLATION
 flavor_gra.1103.desc: "Konečne sme odhalili dôvod, prečo družina [target_character.GetName] koná tak prehnane. Rozšírili chýr, že tento generál je potomkom vedľajšej vetvy slávnej dynastie [ShowDynastyName('umayyad_dynasty')], ktorá kedysi priviedla [ShowRegionName('iberia_region')] do zlatého veku. Tieto tvrdenia nemôžeme potvrdiť ani vyvrátiť, no niektorí z [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] v tom videli príležitosť na postup a pridali sa k falošnému uchádzačovi. [target_character.GetHerHis|U] stúpenci už vytvorili početnú divíziu, ktorá by mohla ohroziť našu moc nad armádou." # todo: NEW TRANSLATION
 flavor_gra.1103.a: "Dúfajme, že z toho nič nebude." # todo: NEW TRANSLATION
 flavor_gra.1104.title: "Deň zúčtovania" # todo: NEW TRANSLATION
 flavor_gra.1104.desc: "Dočerta! Ten muž sa obrátil proti trónu! [target_character.GetSheHe] sa odvoláva na [target_character.GetHerHis] nárok na pôvod z dynastie [ShowDynastyName('umayyad_dynasty')], zhromaždil [target_character.GetHerHis] vernú družinu a prikázal jej pochodovať na naše najväčšie mestá, kde má podnecovať rozsiahle nepokoje a šíriť chýry o [target_character.GetHerHis] nároku na náš trón. Nemá zmysel popierať, že vláda [ShowDynastyNameWithNoTooltip('umayyad_dynasty')] v [ShowLocationName('cordoba')] priniesla našim predkom veľkú prosperitu, no nárok tohto [target_character.GetWomanMan] ako potomka [ShowDynastyNameWithNoTooltip('umayyad_dynasty')] je prinajlepšom pochybný. Ľuďom na tom však nezáleží, pretože počuli o [target_character.GetHerHis] legendárnych činoch na bojisku. Ľudia zo všetkých vrstiev sú ochotní podporiť [target_character.GetHerHis] vec a už skandujú, aby [ROOT.GetCountry.GetGovernment.GetRulerOrRegent.GetName] odstúpil." # todo: NEW TRANSLATION
 flavor_gra.1104.a: "Rozdrvte tohto uchádzača!" # todo: NEW TRANSLATION
 flavor_gra.1104.b: "Nemáme šancu." # todo: NEW TRANSLATION
 flavor_gra.1200.entry: "$flavor_gra.1200.title$" # todo: NEW TRANSLATION
 flavor_gra.1200.title: "Pomoc z [ShowRegionNameWithNoTooltip('maghreb_region')]" # todo: NEW TRANSLATION
 flavor_gra.1200.desc: "Keďže [ShowSituationName('battle_for_the_strait')] zúri, naše prežitie závisí predovšetkým od zahraničnej intervencie. Súperiť o naše podrobenie sa [GetCountry('CAS').GetName] aj [GetCountry('MOR').GetName], a tak je prirodzené, že hľadáme pomoc u tretej strany. Krajiny [ShowRegionName('maghreb_region')] sú nám spriaznené a majú na túto vec vlastný názor — najmä [strongest_maghreb_country.GetName], ktorá medzi nimi vyniká. Možno získame vojenskú výhodu v tomto zápase, ak požiadame [target_character2.GetName] o pomoc." # todo: NEW TRANSLATION
 flavor_gra.1200.a: "Zúfalo potrebujeme pomoc." # todo: NEW TRANSLATION
 flavor_gra.1200.b: "Prečo by sme mali pri svojej ochrane závisieť od vonkajšej pomoci?" # todo: NEW TRANSLATION
 flavor_gra.1201.title: "$flavor_gra.1200.title$" # todo: NEW TRANSLATION
 flavor_gra.1201.desc: "[from_country.GetName] nás oslovili ohľadom súčasnej situácie v [ShowRegionName('iberia_region')]. Keďže sa ocitli v úzkych, žiadajú nás, aby sme im všetkými dostupnými prostriedkami pomohli čeliť rastúcim hrozbám ohrozujúcim ich zvrchovanosť. Či už pôjde o zlato alebo mužov, oboje by im pomohlo pri obrane vlasti." # todo: NEW TRANSLATION
 flavor_gra.1201.a: "Pošleme im zlato." # todo: NEW TRANSLATION
 flavor_gra.1201.b: "Pošleme im mužov." # todo: NEW TRANSLATION
 flavor_gra.1201.c: "Poskytneme im zlato aj mužov." # todo: NEW TRANSLATION
 flavor_gra.1201.d: "Prečo by sme sa mali zapájať do tohto konfliktu?" # todo: NEW TRANSLATION
 flavor_gra.1300.entry: "$flavor_gra.1300.title$" # todo: NEW TRANSLATION
 flavor_gra.1300.title: "Pomoc z východu" # todo: NEW TRANSLATION
 flavor_gra.1300.desc: "Po tom, čo [target_country.GetName] dobyli [ShowLocationName('constantinople')], zasadili svetu [ShowReligionGroupAdjective('muslim')] veľkú ranu [ShowReligionGroupAdjective('christian')] kráľovstvám [ShowContinentName('europe')]. Víťazný [target_character2.GetName] prejavil záujem o rozšírenie [target_character2.GetHerHis] vplyvu na známy svet. Možno by sme mohli využiť túto príležitosť a vyslať do [target_country.GetCapital.GetName] delegáciu v nádeji, že od nich získame skúsených generálov a vojakov." # todo: NEW TRANSLATION
 flavor_gra.1300.a: "Vyslali by sme delegáciu." # todo: NEW TRANSLATION
 flavor_gra.1300.b: "Na prežitie ich pomoc nepotrebujeme." # todo: NEW TRANSLATION
 gra_demand_a_mercenary_company: "Požiadame [target_country.GetName], aby nám poskytli buď [Concept('gold','dukáty')|e], alebo [Concept('mercenary','žoldnier')|e] spoločnosť vedenú jednou z ich [Concept('characters','postavy')|e]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 flavor_gra.1301.title: "$flavor_gra.1300.title$" # todo: NEW TRANSLATION
 flavor_gra.1301.desc: "[target_character.GetName] z krajiny [from_country.GetName] vyslal delegáciu do [ROOT.GetCountry.GetCapital.GetAltAdjective('G')], aby nám zablahoželala k dobytiu [ShowLocationName('constantinople')] a odovzdala nám tie najláskavejšie slová uznania za naše vojenské úspechy. Keďže sme zasadili [ShowReligionGroupName('christian')] veľkú ranu, teraz nás žiadajú, aby sme im poslali vojenskú pomoc a ochránili ich pred supmi v [ShowRegionName('iberia_region')], ktorí chcú uhasiť plameň [ShowReligionGroupName('muslim')]. Jeden [mercenary_general.GetWomanMan] menom [mercenary_general.GetName] sa obzvlášť dychtivo ponúka, že povedie túto výpravu. Túži získať osobnú slávu, slúžiť [target_character2.GetName] a rozšíriť dosah [ROOT.GetCountry.GetFlavorRank] až k Heraklovým stĺpom." # todo: NEW TRANSLATION # todo: COUNTRY CASE
 flavor_gra.1301.a: "Kto sme, aby sme bránili našim mužom v dobývaní?" # todo: NEW TRANSLATION
 flavor_gra.1301.b: "Nemôžeme sa vzdať žiadneho generála ani vojaka, ale môžeme poskytnúť trochu zlata." # todo: NEW TRANSLATION
 flavor_gra.1301.c: "Prečo by sme mali rozdúchavať takmer vyhasnutý plameň?" # todo: NEW TRANSLATION

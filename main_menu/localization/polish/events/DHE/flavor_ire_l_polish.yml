 ireland.10.title: "Krutá satira" # todo: NEW TRANSLATION
 ireland.10.desc: "Bardská poézia sa tradične považuje za spoľahlivú kroniku dejín [bard_country.GetCulture.GetName]; ako takú ju možno využiť na politický prospech.\n\nJeden z bardov zamestnaných u [bard_ruler.GetName] napísal obzvlášť odsudzujúcu satiru na [neighbor_ruler.GetName], vládcu [neighbor_ruler.GetCountry.GetAltAdjective('A')].\n\nOkrem niekoľkých vtipných a dobre mierených urážok tiež spochybňuje [neighbor_ruler.GetHisHer] rodokmeň." # todo: NEW TRANSLATION # todo: COUNTRY CASE
 ireland.10.a: "Toto zničí povesť [neighbor_ruler.GetShortNameWithNoTooltip]!" # todo: NEW TRANSLATION
 ireland.10.a.entry: "To mu zničí povesť!" # todo: NEW TRANSLATION
 ireland.10.b: "Spievajte radšej o sláve [bard_ruler.GetShortNameWithNoTooltip]." # todo: NEW TRANSLATION
 ireland.10.b.entry: "Namiesto toho spievajte o jeho sláve." # todo: NEW TRANSLATION
 ireland.11.title: "Krutá satira" # todo: NEW TRANSLATION
 ireland.11.desc: "Bardská poézia sa tradične považuje za spoľahlivú kroniku dejín [bard_country.GetCulture.GetName]; ako takú ju možno využiť na politický prospech.\n\nJeden z bardov zamestnaných u [bard_ruler.GetName], vládcu [bard_country.GetName], napísal obzvlášť odsudzujúcu satiru na nášho vládcu, [neighbor_ruler.GetName].\n\nOkrem niekoľkých vtipných a dobre mierených urážok tiež spochybňuje [neighbor_ruler.GetHisHer] rodokmeň." # todo: NEW TRANSLATION
 ireland.11.a: "Povesť [neighbor_ruler.GetShortNameWithNoTooltip] je zničená!" # todo: NEW TRANSLATION
 ireland.11.a.entry: "Jeho povesť je zničená!" # todo: NEW TRANSLATION
 opinion_scathing_bardic_satire: "Krutá bardská satira" # todo: NEW TRANSLATION
 ireland.20.title: "[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('clergy_estate')] požadujú reformu" # todo: CHANGED (predtym: [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] požadujú reformu)
 ireland.20.desc: "[ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] hrá v našej spoločnosti druhé husle oproti bardickej kaste; korunovácie a sobáše vykonávajú učení básnici a rodokmene zapisujú tradiční kronikári v archaickom [ROOT.GetCountry.GetCourtLanguage.GetAltAdjective('L')].\n\nDuchovenstvo — zvyknuté byť v iných krajinách najvýraznejšími spoločenskými osobnosťami — sa teraz verejne sťažujú (samozrejme v [ROOT.GetCountry.GetReligion.GetLanguage.GetAltAdjective('L')]), že staré obyčaje sú zastaralé a ne-[ROOT.GetCountry.GetReligion.GetGroup.GetAltAdjective('A')]." # todo: CHANGED # todo: COUNTRY CASE
 ireland.20.a: "Úplne zrušiť bardskú kastu." # todo: NEW TRANSLATION
 ireland.20.b: "Podplatiť [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')]." # todo: CHANGED (predtym: Podplatiť kléru.)
 ireland.20.c: "Tento spôsob života predchádza katolicizmu." # todo: NEW TRANSLATION
 ireland.30.title: "[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('clergy_estate')] zrušuje brehonské právo" # todo: CHANGED (predtym: [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] zrušuje brehonské právo)
 ireland.30.desc: "Príliš dlho sužovali tradičné keltské zvyky [ROOT.GetCountry.GetAltAdjective('A')]. Odkedy kňazská trieda ovláda regenciu, spravila si za svoj hlavný cieľ odstránenie bardov a brehonov z verejného života." # todo: NEW TRANSLATION # todo: COUNTRY CASE
 ireland.30.a: "Dôverujeme [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('clergy_estate')], že zmodernizuje [ROOT.GetCountry.GetNameWithNoTooltip]." # todo: CHANGED (predtym: Dôverujeme [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')], že zmodernizuje [ROOT.GetCountry.GetNameWithN)
 ireland.30.a.entry: "Dôverujeme $clergy_estate$, že nás zmodernizuje." # todo: NEW TRANSLATION
 ireland.30.b: "[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('clergy_estate')] by sa mali venovať len modlitbám." # todo: CHANGED (predtym: [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] by sa mali venovať len modlitbám.)
 ireland.30.b.entry: "Nech $clergy_estate$ zostane pri modlitbách." # todo: NEW TRANSLATION
 ireland.40.title: "Viac [native_culture.GetNameWithNoTooltip] než samotní [native_culture.GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 ireland.40.desc: "Generácie života medzi [native_culture.GetName] viedli k postupnej, no zreteľnej zmene nášho spôsobu života. [judgmental_culture.GetName] nás už nepovažujú za [judgmental_culture.GetNameWithNoTooltip], zatiaľ čo [native_culture.GetNameWithNoTooltip] nás už nepovažujú za nováčikov…" # todo: NEW TRANSLATION
 ireland.40.a: "Stali sme sa viac [native_culture.GetNameWithNoTooltip] než samotní [native_culture.GetNameWithNoTooltip]!" # todo: NEW TRANSLATION
 ireland.40.a.entry: "Sme kultúrnejší než oni!" # todo: NEW TRANSLATION
 ireland.40.b: "Musíme zachovať naše dedičstvo v tejto divokej krajine!" # todo: NEW TRANSLATION
 opinion_gone_native: "Stali sa domorodcami" # todo: NEW TRANSLATION
 ireland.50.title: "Gallowglass" # todo: NEW TRANSLATION
 ireland.50.desc: "Flotila galér [origin_pop.GetCulture.GetName] vedená kapitánom [captain.GetName] vplávala do prístavu [target_location.GetName].\n\n[captain.GetShortNameWithNoTooltip] tvrdí, že jeho klan bol vyhnaný zo svojich domovín v [origin_location.GetName], a že jeho bojovníci sú pripravení slúžiť nášmu [ROOT.GetCountry.GetAltAdjective('D')] ako verní poddaní, ak im dovolíme usadiť sa v [target_location.GetNameWithNoTooltip]." # todo: CHANGED (predtym: Flotila galér [origin_pop.GetCulture.GetName] vedená kapitánom [captain.GetName] vplávala do prístavu [target_location.G) # todo: COUNTRY CASE

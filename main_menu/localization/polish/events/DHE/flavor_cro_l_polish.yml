l_polish:
 flavor_cro.1000.title: "Zjednotenie [ShowAreaNameWithNoTooltip('croatia_area')] a [ShowAreaNameWithNoTooltip('slavonia_area')]" # todo: NEW TRANSLATION
 flavor_cro.1000.entry: "Zjednotenie Chorvátska a Slavónie - Chorvátsko" # todo: NEW TRANSLATION
 flavor_cro.1000.desc: "Neúprosné rozširovanie [GetCountry('TUR').GetName] predstavuje vážne nebezpečenstvo pre naše [ROOT.GetCountry.GetFlavorRank], a rozdelenie krajín spravovaných [GetCountry('HUN').GetAdjectiveWithNoTooltip] [GetCountry('HUN').GetGovernment.GetEstateNameWithNoTooltip('crown_estate')] by mohlo vytvoriť slabé miesto, ktoré by naši nepriatelia mohli využiť. V dôsledku tejto situácie náš [ROOT.GetCountry.GetGovernment.GetCourtTitle] navrhuje predložiť, aby [GetCountry('HUN').GetNameWithNoTooltip] dal regióny [ShowAreaName('croatia_area')] a [ShowAreaName('slavonia_area')] pod jednu autoritu. Tvrdia, že to by výrazne zlepšilo naše obranné schopnosti a uľahčilo administratívne zaťaženie." # todo: NEW TRANSLATION
 flavor_cro.1000.a: "Pokračovať s návrhom." # todo: NEW TRANSLATION
 flavor_cro.1001.a.tt: "Každé vlastnené [location|e], ktoré je buď [core|e] $SVN$ alebo sa nachádza v [ShowAreaName('slavonia_area')], bude prevedené na [GetCountry('CRO').GetName]" # todo: NEW TRANSLATION
 flavor_cro.1000.b: "To by bolo bremenom pre našu administráciu." # todo: NEW TRANSLATION
 flavor_cro.1000.historical_info: "Historicky bola Slavónia administratívne oddelená od Chorvátska a spravovaná vlastným bánom, ktorý bol podriadený uhorskej korune. Postup Osmanskej ríše však preformoval politickú mapu regiónu a spustošenie spôsobené vojnou prinútilo ľudí utekať na sever. V roku 1476 kráľ Matej I. zlúčil úrady bánov Chorvátska a Dalmácie a bánov Slavónie s cieľom efektívnejšie koordinovať obranu proti osmanským nájazdom. Zlúčenie bolo fakticky dokončené v roku 1558, keď sa parlamenty Chorvátska a Slavónie politicky integrovali a zjednotili." # todo: NEW TRANSLATION
 flavor_cro.1001.title: "$flavor_cro.1000.title$" # todo: NEW TRANSLATION
 flavor_cro.1001.desc: "Poslovia od našich poddaných v [GetCountry('CRO').GetName] prišli na [ROOT.GetCountry.GetGovernment.GetCourtTitle] so návrhom zjednotiť úrady bánu [ShowAreaName('croatia_area')] a bánu [ShowAreaName('slavonia_area')]. Tvrdia, že jednotné velenie by posilnilo obranu a znížilo administratívne bremeno v tvári [GetCountry('TUR').GetAdjective] hrozby." # todo: NEW TRANSLATION
 flavor_cro.1001.a: "Zjednotená hranica posilní našu obranu." # todo: NEW TRANSLATION
 flavor_cro.1001.b: "[ShowAreaNameWithNoTooltip('slavonia_area')] patrí [GetCountry('HUN').GetAdjectiveWithNoTooltip] [GetCountry('HUN').GetGovernment.GetEstateNameWithNoTooltip('crown_estate')]." # todo: NEW TRANSLATION
 flavor_cro.1001.b.entry: "[ShowAreaNameWithNoTooltip('slavonia_area')] patrí $HUN_ADJ$ $crown_estate$." # todo: NEW TRANSLATION
 flavor_cro.1100.title: "Panovanie [target_character.GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 flavor_cro.1100.entry: "Panovanie Ivana Nelipica" # todo: NEW TRANSLATION
 flavor_cro.1100.desc: "Mocný magnát menom [target_character.GetName] získava čoraz väčší vplyv na záležitosti v [ROOT.GetCountry.GetName]. Vo svojej domovskej oblasti sa mu podarilo odstrániť mnoho svojich nepriateľov a tiež uvoľniť vplyv [GetCountry('HUN').GetAdjective] [GetCountry('HUN').GetGovernment.GetEstateNameWithNoTooltip('crown_estate')] nad regionálnymi záležitosťami. Hoci mnohí toto usporiadanie považovali za prospešné, iní sa obávajú, že [GetCountry('HUN').GetNameWithNoTooltip] môže každú chvíľu skúsiť znovu uplatniť svoju autoritu. Na vyriešenie tejto situácie bolo navrhnuté, že ak by [target_character.GetNameWithNoTooltip] uznal autoritu [GetCountry('HUN').GetGovernment.GetEstateNameWithNoTooltip('crown_estate')], potom by [GetCountry('HUN').GetNameWithNoTooltip] mal na oplátku uznať jeho vládu nad [ROOT.GetCountry.GetNameWithNoTooltip]." # todo: NEW TRANSLATION
 flavor_cro.1100.a: "Nezasahovať do [GetCountry('HUN').GetGovernment.GetEstateNameWithNoTooltip('crown_estate')]." # todo: NEW TRANSLATION
 flavor_cro.1100.a.entry: "Nezasahovať do $crown_estate$." # todo: NEW TRANSLATION
 flavor_cro.1100.b: "Poslať ponuku." # todo: NEW TRANSLATION
 flavor_cro.1100.historical_info: "Ivan Nelipić bol chorvátsky šľachtic, ktorý v roku 1322 prakticky ovládol väčšinu Chorvátska po tom, čo zvrhol bána Mladena II. Šubića. Počas jeho vlády bol titul bán Chorvátska prázdny a Chorvátsko takmer úplne vypadlo z uhorskej autority. Bolo podniknutých mnoho pokusov, či už uhorskou korunou alebo bánom Slavónie, zvrhnúť Nelipića, ale nakoniec všetky zlyhali. Uhorsko dokázalo znovu uplatniť kráľovskú autoritu nad Chorvátskom až v roku 1345 po smrti Ivana Nelipića." # todo: NEW TRANSLATION
 flavor_cro.1101.title: "[GetCountry('CRO').GetNameWithNoTooltip] hľadá kompromis" # todo: NEW TRANSLATION
 flavor_cro.1101.desc: "Od víťazstva [ShowCultureNameWithNoTooltip('dalmatian')|U] [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] v bitke pri Bliske roku 1322 je [GetCountry('CRO').GetName] ovládané mocným magnátom [target_character.GetName], ktorý postupne podkopával autoritu [GetCountry('HUN').GetAdjective] [GetCountry('HUN').GetGovernment.GetEstateNameWithNoTooltip('crown_estate')] tam. Prekvapivo [target_character.GetLastNameWithNoTooltip] poslal vyslanca na [ROOT.GetCountry.GetGovernment.GetCourtTitle] s ponukou kompromisu. [target_character.GetSheHe|U] je pripravený formálne uznať autoritu [GetCountry('HUN').GetAdjective] [GetCountry('HUN').GetGovernment.GetEstateNameWithNoTooltip('crown_estate')] a zložiť prísahu vernosti trónu. Na oplátku [target_character.GetSheHe] žiada, aby sme uznali [target_character.GetHerHim] ako právoplatného vládcu [GetCountry('CRO').GetNameWithNoTooltip]." # todo: NEW TRANSLATION
 flavor_cro.1101.a: "Únia zostane zachovaná." # todo: NEW TRANSLATION
 flavor_cro.1101.b: "Legitimizovať [target_character.GetHerHim]." # todo: NEW TRANSLATION
 flavor_cro.1101.b.entry: "Legitimizovať ho." # todo: NEW TRANSLATION
 flavor_cro.1102.title: "[GetCountry('HUN').GetNameWithNoTooltip] odmieta náš nárok" # todo: NEW TRANSLATION
 flavor_cro.1102.desc: "Náš vyslanec sa vrátil so znepokojujúcimi správami. [GetCountry('HUN').GetAdjective] [GetCountry('HUN').GetGovernment.GetEstateNameWithNoTooltip('crown_estate')] odmietla náš návrh uznať [target_character.GetName] za vládcu [GetCountry('CRO').GetName], trvajúc na tom, že náš [ROOT.GetCountry.GetFlavorRank] je neoddeliteľnou súčasťou únie. Hoci všeobecný konsenzus na [ROOT.GetCountry.GetGovernment.GetCourtTitle] je, že s tým nemožno veľa robiť, niektorí navrhujú extrémne opatrenia: ukončiť Pacta Conventa, ktorá viaže náš trón na [GetCountry('HUN').GetNameWithNoTooltip], a korunovať [target_character.GetLastNameWithNoTooltip] za prvého domáceho kráľa [GetCountry('CRO').GetNameWithNoTooltip] za viac než dve storočia." # todo: NEW TRANSLATION
 flavor_cro.1102.a: "[ROOT.GetCountry.Custom('common_string_nothing_we_can_do')]" # todo: NEW TRANSLATION
 flavor_cro.1102.a.entry: "$common_string_nothing_we_can_do_about_it$" # todo: NEW TRANSLATION
 flavor_cro.1102.b: "Ukončiť Pacta Conventa a korunovať [target_character.GetLastNameWithNoTooltip]!" # todo: NEW TRANSLATION
 flavor_cro.1102.b.entry: "Ukončiť Pacta Conventa a korunovať ho!" # todo: NEW TRANSLATION
 flavor_cro.1103.title: "[GetCountry('CRO').GetNameWithNoTooltip] ukončuje Pacta Conventa" # todo: NEW TRANSLATION
 flavor_cro.1103.desc: "Po tom, čo sme odmietli uznať autoritu [target_character.GetName], sa [GetCountry('CRO').GetName] rozhodlo podniknúť oveľa drastickejší krok, než sa kto očakával. Vyhlásili Pacta Conventa, dohodu, ktorá ich viazala na naše [GetCountry('HUN').GetGovernment.GetEstateNameWithNoTooltip('crown_estate')], za neplatnú. Okrem toho bol [target_character.GetLastNameWithNoTooltip] vyhlásený za ich nového [GetCountry('CRO').GetGovernment.GetRulerTitle]." # todo: NEW TRANSLATION
 flavor_cro.1103.a: "Toto povstanie nemôžeme tolerovať!" # todo: NEW TRANSLATION
 flavor_cro.1103.b: "Nebudeme zasahovať." # todo: NEW TRANSLATION

l_polish:
 flavor_ham.1.title: "Berenbergova banka" # todo: NEW TRANSLATION
 flavor_ham.1.entry: "$flavor_ham.1.title$" # todo: NEW TRANSLATION
 flavor_ham.1.desc: "Mnohí obchodníci a finančníci sa vydali do nášho [ROOT.GetCountry.GetFlavorRank], priťahovaní bohatstvom, ktoré preteká našimi zemami. Medzi nimi sú [GetDynasty('berenberg_dynasty').GetName], zruční v umení obchodu a financií, ktorí chcú v [berenberg_bank_hq.GetName] založiť súkromnú bankovú inštitúciu. Takáto inštitúcia by mohla byť neoceniteľná pri správe obchodných úverov a uľahčovaní výmeny tovaru cez Severné more." # todo: NEW TRANSLATION
 flavor_ham.1.historical_info: "Založili ju v roku 1590 Hans a Paul Berenberg, flámski obchodníci, ktorí utiekli pred španielskym znovuzískaním Antverp. #italic Berenbergova banka#! je jednou z najstarších obchodných bánk na svete, ktorá stále pôsobí. Sídliaca v Hamburgu prosperovala ako súkromné rodinné podnikanie financujúce obchod v celej severnej Európe, zostala v súkromných rukách a rástla vďaka starostlivému spravovaniu obchodných úverov a investícií." # todo: NEW TRANSLATION
 flavor_ham.1.a: "Vítame všetkých zručných obchodníkov." # todo: NEW TRANSLATION
 flavor_ham.1.b: "Uvidíme, čo dokážu!" # todo: NEW TRANSLATION
 flavor_ham.2.title: "$flavor_ham.1.title$" # todo: NEW TRANSLATION
 flavor_ham.2.desc: "Zriadili sme našu banku v veľkom [berenberg_bank_hq.GetRank.GetName] v [berenberg_bank_hq.GetName]. Vďaka našim kontaktom s obchodníkmi naprieč severnou Európou a ďalej sme pripravení stať sa nepostrádateľnými pre obchod v tomto regióne." # todo: NEW TRANSLATION
 flavor_ham.2.a: "Naše bohatstvo rastie s každou transakciou." # todo: NEW TRANSLATION
 flavor_ham.3.title: "Hamburská banka" # todo: NEW TRANSLATION
 flavor_ham.3.entry: "$flavor_ham.3.title$" # todo: NEW TRANSLATION
 flavor_ham.3.desc: "Stále rastúci objem obchodu prechádzajúceho cez [hamburger_bank_hq.GetName] odhalil potrebu stabilnej, spoľahlivej verejnej zmenárenskej banky, ktorá by mohla garantovať hodnotu mien a uľahčovať veľké obchodné transakcie. Vzorom podľa úspechu podobných inštitúcií by verejná banka v [hamburger_bank_hq.GetNameWithNoTooltip] poskytla bezpečný základ pre naše finančné blaho." # todo: NEW TRANSLATION
 flavor_ham.3.historical_info: "#italic Hamburská banka#! bola založená v roku 1619 v slobodnom meste Hamburk, úzko inšpirovaná Amsterdamskou bankou založenou o desať rokov skôr. Slúžila ako verejná zmenárenská banka, prijímala vklady a vybavovala medzinárodné platby v spoľahlivej bankovej mene. Bola jednou z najdôležitejších finančných inštitúcií v severnej Európe viac ako dve storočia, až kým nebola v roku 1875 začlenená do Reichsbank." # todo: NEW TRANSLATION
 flavor_ham.3.a: "Banka bude slúžiť našim záujmom." # todo: NEW TRANSLATION
 flavor_ham.3.b: "Poďme sa kúpať v peniazoch!" # todo: NEW TRANSLATION
 flavor_ham.4.title: "$flavor_ham.3.title$" # todo: NEW TRANSLATION
 flavor_ham.4.desc: "Bol nám zverený dohľad nad financiami našich patrónov a ich obchodných partnerov. Prosperita severných morí je v našej správe a nepremeškáme túto príležitosť." # todo: NEW TRANSLATION
 flavor_ham.4.a: "$flavor_ham.3.b$" # todo: NEW TRANSLATION

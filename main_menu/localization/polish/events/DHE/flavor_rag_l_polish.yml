l_polish:
 flavor_rag.1000.title: "Nepriateľ pri bránach" # todo: NEW TRANSLATION
 flavor_rag.1000.entry: "$flavor_rag.1000.title$" # todo: NEW TRANSLATION
 flavor_rag.1000.desc: "Do nášho [ROOT.GetCountry.GetGovernment.GetCourtTitle] dorazila zlovestná správa: mocné [GetCountry('TUR').GetAdjective] armády konečne dosiahli naše hranice. Je bolestne jasné, že náš [ROOT.GetCountry.GetFlavorRank] by im nikdy nemohol odolať vojenskou silou, a preto niektorí z našich patricijov prišli s odvážnym návrhom. Tvrdia, že záujmy [GetCountry('TUR').GetNameWithNoTooltip] a [ROOT.GetCountry.GetName] sa zásadne neprotivia, a že priznanie ich nadvlády a platenie ročnej tribúty výmenou za ochranu a slobodu by nám mohlo umožniť prežiť." # todo: NEW TRANSLATION
 flavor_rag.1000.a: "Pošli vyslanca rokovať s [GetCountry('TUR').GetGovernment.GetRulerTitle]." # todo: NEW TRANSLATION
 flavor_rag.1000.a.entry: "Pošli vyslanca, aby s ním rokoval." # todo: NEW TRANSLATION
 flavor_rag.1000.b: "Budeme brániť našu nezávislosť za každú cenu!" # todo: NEW TRANSLATION
 flavor_rag.1000.historical_info: "V roku 1458 Republika Ragusa formálne vstúpila do tributárneho vzťahu s Osmanskou ríšou. Aj keď dohoda prinútila Ragusú platiť ročnú tribútu približne 12 500 zlatých dukátov, zachovala si pozoruhodnú autonómiu a mohla si ponechať svoju obchodnú flotilu a viesť zahraničnú diplomaciu. Vzájomne prospešný vzťah pretrval stáročia; Ragusa zostala vazalom Osmanskej ríše až do zrušenia republiky v roku 1808 počas napoleonských vojen." # todo: NEW TRANSLATION
 flavor_rag.1001.title: "Ponuka od [GetCountry('RAG').GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 flavor_rag.1001.desc: "Vyslanec z [GetCountry('RAG').GetName] dorazil do [ROOT.GetCountry.GetGovernment.GetCourtTitle] s pokorným návrhom pre [ROOT.GetCountry.GetGovernment.GetRulerTitle]. [GetCountry('RAG').GetAdjectiveWithNoTooltip] vyslanec priznáva, že ich [GetCountry('RAG').GetFlavorRank] nemôže odolať našej sile, a namiesto toho hľadá pragmatické usporiadanie. Ponúkajú uznať našu nadvládu a doručovať ročnú tribútu výmenou za našu ochranu a slobodu obchodovania. Zatiaľ čo niektorí to považujú za spravodlivú dohodu, ktorá by prospela našej sfére vplyvu, iní tvrdia, že takýto slabý štát by mal byť dobytý priamo." # todo: NEW TRANSLATION
 flavor_rag.1001.a: "Prijať ich tribút." # todo: NEW TRANSLATION
 flavor_rag.1001.b: "Načo vyjednávať, keď ich môžeme dobyť?" # todo: NEW TRANSLATION

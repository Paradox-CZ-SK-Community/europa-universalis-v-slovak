l_polish:
 flavor_nav.1.title: "Spoločná vláda [target_character.GetNameWithNoTooltip] a [target_character_2.GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 flavor_nav.1.entry: "Spoločná vláda Jany II. a Filipa z Évreux" # todo: NEW TRANSLATION
 flavor_nav.1.desc: "Po ich nástupe na trón [ROOT.GetCountry.GetName] v roku 1329 vládnu [target_character.GetName] a [target_character_2.GetName] [ROOT.GetCountry.GetFlavorRank] bok po boku. Spoločnými vládcami však jednoznačne uprednostňované sú majetky [target_character_2.GetNameWithNoTooltip] v [ShowRegionName('france_region')], kam [ROOT.GetCountry.GetNameWithNoTooltip] často opúšťajú, aby sa usadili vo svojich držbách v [ShowCultureGroupNameWithNoTooltip('french_group')].\n\nHoci [ROOT.GetCountry.GetGovernment.GetCourtTitle] našiel mnoho schopných regentov, ktorí vládnu [ROOT.GetCountry.GetFlavorRank] v neprítomnosti vládcov, v posledných rokoch narastajú obavy. Mnohí [ROOT.GetCountry.GetAdjectiveWithNoTooltip] páni chcú požiadať oboch vládcov, aby sa natrvalo usadili v [ROOT.GetCountry.GetCapital.GetAltAdjective('L')], inak by [ROOT.GetCountry.GetFlavorRank] mohol v očiach chamtivých cudzích mocností pôsobiť slabo." # todo: NEW TRANSLATION # todo: COUNTRY CASE
 flavor_nav.1.a: "Naše majetky v [ShowRegionNameWithNoTooltip('france_region')] sú najdôležitejšie." # todo: NEW TRANSLATION
 flavor_nav.1.b: "Obe ríše budeme spravovať rovnako." # todo: NEW TRANSLATION
 flavor_nav.1.c: "Naším prvoradým záujmom musia byť krajiny [ROOT.GetCountry.GetAltAdjectiveWithNoTooltip('G')]." # todo: NEW TRANSLATION # todo: COUNTRY CASE
 flavor_nav.2.title: "Nástup [target_character.GetNameWithNoTooltip] na trón" # todo: NEW TRANSLATION
 flavor_nav.2.entry: "Nástup Karola Navarrského na trón" # todo: NEW TRANSLATION
 flavor_nav.2.desc: "Po smrti [GetCharacter('nav_jeanne_ii_capet').GetName] nastúpil na trón ctižiadostivý [target_character.GetName]. Keď [target_character.GetSheHe] dorazil do [ROOT.GetCountry.GetCapital.GetAltAdjective('G')] na [ROOT.GetCountry.GetGovernment.GetAdjective|U] obrad a korunováciu, už sa začal prejavovať [target_character.GetHerselfHimself] ako nezvyčajný vládca: [target_character.GetNameWithNoTooltip] prejavil záujem zložiť prísahu v [ShowDialectName('aragonese_dialect')]. To vyvolalo nevôľu medzi [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')], ktorí by uprednostnili, aby sa prísaha skladala v tradičnej [ShowLanguageNameWithNoTooltip('latin_language')]." # todo: NEW TRANSLATION # todo: COUNTRY CASE
 flavor_nav.2.a: "Zložíme prísahu v románskom jazyku." # todo: NEW TRANSLATION
 flavor_nav.2.b: "Nerozumný nápad: prísaha musí byť v [ShowLanguageNameWithNoTooltip('latin_language')]." # todo: NEW TRANSLATION
 flavor_nav.2.c: "Nech sa prísaha skladá v [ShowLanguageNameWithNoTooltip('basque_language')]." # todo: NEW TRANSLATION
 flavor_nav.3.title: "Držby [target_character.GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 flavor_nav.3.entry: "Francúzske držby Karola Navarrského" # todo: NEW TRANSLATION
 flavor_nav.3.desc: "Po zdedení krajín po [GetCharacter('nav_philip_iii_evreux').GetName] a [GetCharacter('nav_jeanne_ii_capet').GetName] teraz [target_character.GetName] vládne rozsiahlemu územiu, ktoré zahŕňa [ROOT.GetCountry.GetName] a niekoľko držieb v [ShowRegionName('france_region')]. Hoci [GetCharacter('nav_jeanne_ii_capet').GetNameWithNoTooltip] a [GetCharacter('nav_philip_iii_evreux').GetNameWithNoTooltip] vládli [ROOT.GetCountry.GetNameWithNoTooltip] spoločne, [ROOT.GetCountry.GetFlavorRank] navštevovali len zriedka a uprednostňovali pobyt v [ShowRegionNameWithNoTooltip('france_region')].\n\nPo nástupe [target_character.GetNameWithNoTooltip] na trón mnohí spojenci v [ROOT.GetCountry.GetGovernment.GetCourtTitle] naliehajú na [target_character.GetHerHim], aby sa natrvalo usadil v [ROOT.GetCountry.GetAltAdjectiveWithNoTooltip('L')]. Iní sa však domnievajú, že [ROOT.GetCountry.GetGovernment.GetRulerTitle] má väčšie ambície a túži po spornom tróne v [ShowRegionNameWithNoTooltip('france_region')]." # todo: NEW TRANSLATION # todo: COUNTRY CASE
 flavor_nav.3.a: "Spravujme záležitosti [ROOT.GetCountry.GetGovernment.GetCourtTitle] z našich držieb v [ShowRegionNameWithNoTooltip('france_region')]." # todo: NEW TRANSLATION
 flavor_nav.3.b: "Hlavné sídlo [ROOT.GetCountry.GetGovernment.GetCourtTitle] nech je v [ROOT.GetCountry.GetAltAdjectiveWithNoTooltip('L')]." # todo: NEW TRANSLATION # todo: COUNTRY CASE
 flavor_nav.3.c: "Vládnime z [evr_country.GetNameWithNoTooltip]." # todo: NEW TRANSLATION
 flavor_nav.3.c.entry: "Vládnime z Évreux." # todo: NEW TRANSLATION
 nav_will_be_able_to_rally_other_appanages_tt: "Po dosiahnutí #G 150#! vzťahov s podriadeným apanážom [GetCountry('FRA').GetName] budú ochotnejší podporiť nás vo vojne proti [GetCountry('FRA').GetNameWithNoTooltip] prostredníctvom [Concept('decision','rozhodnutia')|e] [ShowDecisionName('navarre_charles_ii_claim_to_france_appanage_route')]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 variable_tt_nav_enable_ambitions_of_charles_ii_ambition_events: "Udalosť $flavor_nav.2.entry$ [Concept('dynamic_historical_event','dynamická historická udalosť')|e] sa odohrala" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 flavor_nav.4.title: "Nárok rodu [ShowDynastyNameWithNoTooltip('capet_dynasty')]" # todo: NEW TRANSLATION
 flavor_nav.4.entry: "Nárok Kapetovcov" # todo: NEW TRANSLATION
 flavor_nav.4.desc: "Hoci mnohí tušili, že [target_character.GetName] je ctižiadostivý [ROOT.GetCountry.GetGovernment.GetRulerTitle], málokto čakal, že [target_character.GetHerHis] túžba priamo si nárokovať trón [fra_country.GetName] vyjde najavo. Nárok [target_character.GetNameWithNoTooltip] je silný vďaka krvi [ShowDynastyName('capet_dynasty')] [GetCharacter('nav_jeanne_ii_capet').GetShortName], jednou z podmienok dedičstva [ROOT.GetCountry.GetAltAdjective('G')] po [GetCharacter('nav_jeanne_ii_capet').GetHerHis] však bolo vzdať sa nároku na [fra_country.GetNameWithNoTooltip].\n\nMnohí páni [fra_country.GetNameWithNoTooltip] pravdepodobne neuznajú nárok [target_character.GetNameWithNoTooltip] v plnom rozsahu pre dávny [ShowHeirSelectionName('salic_law')]. Niektorí sa však domnievajú, že [target_character.GetNameWithNoTooltip] by mal využiť [target_character.GetHerHis] politický vplyv v [fra_country.GetNameWithNoTooltip] a presvedčiť mocnejších pánov." # todo: NEW TRANSLATION # todo: COUNTRY CASE
 flavor_nav.4.a: "Trón [fra_country.GetNameWithNoTooltip] právom patrí [target_character.GetNameWithNoTooltip]!" # todo: NEW TRANSLATION
 flavor_nav.4.a.entry: "Trón Francúzska právom patrí Karolovi!" # todo: NEW TRANSLATION
 flavor_nav.4.b: "Využime tieto nároky na posilnenie legitimity u našich poddaných z [ShowCultureGroupNameWithNoTooltip('french_group')]." # todo: NEW TRANSLATION
 flavor_nav.4.c: "[GetCharacter('nav_jeanne_ii_capet').GetNameWithNoTooltip] sa už [GetCharacter('nav_jeanne_ii_capet').GetHerHis] nároku vzdala. Sústreďme sa radšej na vládnutie v [ROOT.GetCountry.GetAltAdjectiveWithNoTooltip('L')]." # todo: NEW TRANSLATION # todo: COUNTRY CASE
 unlocks_enforce_the_capetian_claim_to_france_tt: "Odomkne [Concept('decision','rozhodnutie')|e] $navarre_charles_ii_claim_to_france.title$" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 nav_appanage_support_for_french_throne_tt: "Ak je [ROOT.GetCountry.GetNameWithNoTooltip] apanážou, dosiahnutie #G +150#! vzťahov s ostatnými podriadenými apanážmi [GetCountry('FRA').GetNameWithNoTooltip] ich nakloní k tomu, aby nás podporili vo vojne proti [GetCountry('FRA').GetNameWithNoTooltip] prostredníctvom [Concept('decision','rozhodnutia')|e] [ShowDecisionName('navarre_charles_ii_claim_to_france_appanage_route')]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 flavor_nav.5.title: "Spojenectvo s [target_character_2.GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 flavor_nav.5.entry: "Spojenectvo s Étiennom Marcelom" # todo: NEW TRANSLATION
 flavor_nav.5.desc: "Spočiatku sa mnohé snahy [target_character.GetName] o získanie podpory stretli s prekážkami. Viacerí [fra_country.GetAdjectiveWithNoTooltip] páni vyjadrili vernosť [fra_ruler.GetName] a odmietli nárok [target_character.GetNameWithNoTooltip]. Hoci sa [target_character.GetNameWithNoTooltip] podarilo získať na svoju stranu niektorých menej významných [fra_country.GetAdjectiveWithNoTooltip] pánov, mnohí poradcovia [target_character.GetShortNameWithNoTooltip] nečakali, že významný [target_character_2.GetName] ponúkne [target_character_2.GetHerHis] [target_character.GetNameWithNoTooltip] svoju podporu. Hoci je [target_character_2.GetNameWithNoTooltip] členom [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')] [fra_country.GetAdjectiveWithNoTooltip], už dlho strpčuje život [fra_ruler.GetNameWithNoTooltip] a hatí mnohé [fra_ruler.GetHerHis] snahy na Generálnych stavoch. [target_character_2.GetNameWithNoTooltip] by sa síce ukázal ako neoceniteľný spojenec, no niektorí sa obávajú, že [target_character_2.GetHerHis] ambície sa môžu líšiť od ambícií [target_character.GetNameWithNoTooltip], a preto sa [target_character_2.GetSheHe] môže stať skôr príťažou.\n\nOkrem toho [target_character_2.GetNameWithNoTooltip] priniesol správu, že páni [nrm_country.GetName] sú nespokojní s [fra_ruler.GetNameWithNoTooltip] a pravdepodobne by boli ochotní ponúknuť podporu [target_character.GetShortNameWithNoTooltip]." # todo: NEW TRANSLATION
 flavor_nav.5.a: "[target_character_2.GetNameWithNoTooltip] sa ukáže ako neoceniteľný spolupracovník." # todo: NEW TRANSLATION
 flavor_nav.5.a.entry: "Étienne Marcel sa ukáže ako neoceniteľný spolupracovník." # todo: NEW TRANSLATION
 flavor_nav.5.b: "Nech [target_character_2.GetHerHim] presmeruje príjmy z [fra_country.GetNameWithNoTooltip] do našej pokladnice." # todo: NEW TRANSLATION
 flavor_nav.5.b.entry: "Nech presmeruje príjmy z Francúzska do našej pokladnice." # todo: NEW TRANSLATION
 flavor_nav.5.c: "Úplne odmietnime pomoc [target_character_2.GetHerHis]. Získame [fra_country.GetNameWithNoTooltip] aj bez [target_character_2.GetHerHis] intríg." # todo: NEW TRANSLATION
 flavor_nav.5.c.entry: "Úplne odmietnime jeho pomoc. Získame Francúzsko aj bez jeho intríg." # todo: NEW TRANSLATION
 nav_decision_seizure_of_duchy_of_normandy_tt: "Odomkne [Concept('decision','rozhodnutie')|e] $nav_coercing_of_normandy.title$" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 flavor_nav.6.title: "Ohnivý koniec" # todo: NEW TRANSLATION
 flavor_nav.6.entry: "Smrť Karola Navarrského v plameňoch" # todo: NEW TRANSLATION
 flavor_nav.6.desc: "Hoci sa zdravie [target_character.GetName] v posledných rokoch zhoršovalo, [ROOT.GetCountry.GetGovernment.GetCourtTitle] aj tak šokovala správa, že [target_character.GetSheHe] minulú noc zomrel pri požiari vo [target_character.GetHerHis] komnatách. V [ROOT.GetCountry.GetGovernment.GetCourtTitle] kolovali zvesti, že počas liečby [target_character.GetHerHis] choroby spadla sviečka na posteľ [target_character.GetNameWithNoTooltip] a zapálila ju.\n\n[scope_our_heir.GetName] teraz nastupuje na trón s menšími ambíciami než [our_ruler.GetHerHis] predchodca a mnohí premýšľajú, ako pisári [ROOT.GetCountry.GetName] zapíšu vládu [target_character.GetNameWithNoTooltip] do dejín." # todo: NEW TRANSLATION
 flavor_nav.6.a: "[target_character.GetHerHis|U] vláda sa zapíše ako ctižiadostivá, no strašná." # todo: NEW TRANSLATION
 flavor_nav.6.b: "[target_character.GetSheHe|U] bude známy ako dobyvateľ [GetCountry('FRA').GetNameWithNoTooltip]!" # todo: NEW TRANSLATION
 flavor_nav.6.c: "[target_character.GetSheHe|U] bude známy tým, že sa napriek [target_character.GetHerHis] [ShowCultureGroupNameWithNoTooltip('french_group')] pôvodu obrátil k [ROOT.GetCountry.GetAltAdjectiveWithNoTooltip('D')], napriek [target_character.GetHerHis] pôvodu." # todo: NEW TRANSLATION # todo: COUNTRY CASE
 flavor_nav.6.d: "Radšej hľaďme do budúcnosti." # todo: NEW TRANSLATION
 flavor_nav.7.title: "Sporné pohraničné územia" # todo: NEW TRANSLATION
 flavor_nav.7.entry: "Rozdelenie pohraničných oblastí" # todo: NEW TRANSLATION
 flavor_nav.7.desc: "Hoci vzťahy medzi [ROOT.GetCountry.GetAltAdjective('I')] a [cas_country.GetName] boli v minulosti nepriateľské, vládcovia [cas_country.GetNameWithNoTooltip] sa nikdy neusilovali o úplné dobytie [ROOT.GetCountry.GetFlavorRank]. V pohraničných oblastiach [ShowProvinceDefinitionName('biscay_province')], [ShowProvinceDefinitionName('gipuzkoa_province')] a [ShowProvinceDefinitionName('alava_province')] však už nejaký čas narastá napätie medzi mocnejšími miestnymi rodmi pre nejasne vymedzené hranice regiónu.\n\nZástupcovia [cas_country.GetNameWithNoTooltip] a [our_ruler.GetName] sa usilovali vyriešiť pohraničné spory, no vypuknutie [ShowDisasterNameWithNoTooltip('castilian_civil_war')] v [cas_country.GetNameWithNoTooltip] rokovania značne zabrzdilo, čo viedlo k ďalším sporom medzi významnými regionálnymi dynastiami.\n\nKeďže [cas_country.GetNameWithNoTooltip] je teraz ponorená do vnútorného konfliktu, zástupcovia miestnych rodín požiadali [our_ruler.GetNameWithNoTooltip], aby podnikol inváziu a zabral sporné územia." # todo: NEW TRANSLATION # todo: COUNTRY CASE
 flavor_nav.7.a: "Ak tieto územné spory nevyriešime, [ROOT.GetCountry.GetAdjectiveWithNoTooltip] rody budú pravdepodobne naďalej nespokojné." # todo: NEW TRANSLATION
 flavor_nav.7.b: "Pozastavme ďalšie diplomatické rokovania: musíme zaistiť, aby bol náš nárok na región uznaný!" # todo: NEW TRANSLATION
 flavor_nav.8.title: "Mocenské vákuum sa šíri do [ROOT.GetCountry.GetAltAdjectiveWithNoTooltip('G')]" # todo: NEW TRANSLATION # todo: COUNTRY CASE
 flavor_nav.8.entry: "Mocenské vákuum sa šíri do Navarry" # todo: NEW TRANSLATION
 flavor_nav.8.desc: "Hoci sa [ShowDisasterNameWithNoTooltip('castilian_civil_war')] skončila, jej následky sú v [ShowRegionName('iberia_region')] stále citeľné. Keďže pohraničné oblasti sú teraz oveľa menej strážené, dávna nevraživosť medzi miestnymi rodmi prerástla do otvoreného boja.\n\nVzhľadom na slabosť [cas_country.GetName] by bolo pre [ROOT.GetCountry.GetGovernment.GetCourtTitle] krajiny [ROOT.GetCountry.GetAltAdjective('G')] náročné vyriešiť konflikt v regióne bez pomoci." # todo: NEW TRANSLATION # todo: COUNTRY CASE
 flavor_nav.8.a: "Krajinu [ROOT.GetCountry.GetAltAdjectiveWithNoTooltip('A')] čakajú nebezpečné časy." # todo: NEW TRANSLATION # todo: COUNTRY CASE
 nav_end_blood_feud_decision_enabled_tt: "Odomkne [Concept('decision','rozhodnutie')|e] $nav_end_the_blood_feuds.title$" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 nav_sow_division_in_the_borderlands_enabled_tt: "Odomkne [Concept('decision','rozhodnutie')|e] $nav_sow_division_in_the_borderlands.title$, ktorú možno použiť na oslabenie [cas_country.GetAdjectiveWithNoTooltip] vplyvu v [ShowScriptedGeographyName('nav_contested_basque_borderlands')], ak si tam udržia značnú kontrolu" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 flavor_nav.9.title: "Zánik [ShowProvinceDefinitionNameWithNoTooltip('biscay_province')]" # todo: NEW TRANSLATION
 flavor_nav.9.entry: "Zánik Biskajska" # todo: NEW TRANSLATION
 flavor_nav.9.desc: "O kontrolu nad [ShowProvinceDefinitionName('biscay_province')] sa už dlho sporili [cas_country.GetName] a [ROOT.GetCountry.GetName]. Región však bol domovom mnohých významných rodín, z ktorých Harovci boli najvplyvnejšími a najvernejšími vazalmi. [cas_country.GetNameWithNoTooltip] však začala v regióne priamo rušiť tituly a následne anektovať sporné oblasti v [ShowProvinceDefinitionNameWithNoTooltip('biscay_province')].\n\nTieto kroky [cas_country.GetNameWithNoTooltip] Harovcov značne rozhnevali. Naliehajú preto na [ROOT.GetCountry.GetGovernment.GetCourtTitle], aby financoval povstalcov v [ShowProvinceDefinitionNameWithNoTooltip('biscay_province')] a zakročil proti tým, ktorí podporili anexiu regiónu zo strany [cas_country.GetAdjectiveWithNoTooltip]." # todo: NEW TRANSLATION
 flavor_nav.9.a: "Nemôžeme vyhovieť požiadavkám Harovcov bez toho, aby sme vyvolali hnev [cas_country.GetAdjectiveWithNoTooltip]." # todo: NEW TRANSLATION
 flavor_nav.9.a.entry: "Nemôžeme vyhovieť požiadavkám Harovcov bez toho, aby sme vyvolali kastílsky hnev." # todo: NEW TRANSLATION
 flavor_nav.9.b: "Podporujme Harovcov, keď budú rozsievať v regióne chaos." # todo: NEW TRANSLATION
 variable_tt_nav_enable_blood_feud_faction_events: "Udalosť $flavor_nav.8.entry$ [Concept('dynamic_historical_event','dynamická historická udalosť')|e] sa odohrala" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 flavor_nav.10.title: "Súboj Leguizamonovcov a Zamudianovcov v [target_location.GetNameWithNoTooltip]" # todo: CHANGED (predtym: Volanie cirkvi)
 flavor_nav.10.entry: "Súboj rodov Leguizamon a Zamudiano" # todo: CHANGED (predtym: $flavor_nav.10.title$)
 flavor_nav.10.desc: "Hoci mali rody Leguizamon a Zamudiano v [ROOT.GetCountry.GetAltAdjective('L')] veľký vplyv, už dlho sú aj zarytými rivalmi. V dôsledku mocenského vákua, ktoré spôsobila [ShowDisasterNameWithNoTooltip('castilian_civil_war')], sa tieto dva rody neustále potýkajú v šarvátkach po celom severnom [ShowRegionName('iberia_region')]. Nedávny stret v [target_location.GetName] sa však skončil katastrofou pre [target_location.GetRank.GetName] a zasiahol veľkú časť obyvateľstva.\n\nKeďže tento spor dosahuje nebezpečné rozmery, mnohí požiadali [our_ruler.GetNameWithNoTooltip], aby [our_ruler.GetSheHe] využil všetku svoju autoritu na oslabenie týchto znepriatelených rodov." # todo: CHANGED (predtym: [target_character.GetName], the first and oldest daughter of our [ROOT.GetCountry.GetGovernment.GetRuler.GetName], is wa) # todo: COUNTRY CASE
 flavor_nav.10.a: "Využime autoritu [our_ruler.GetShortNameWithNoTooltip] na zabránenie ďalšiemu krviprelievaniu." # todo: CHANGED (predtym: Stane sa mníškou.)
 flavor_nav.10.a.entry: "Využime autoritu koruny, aby sme zabránili ďalšiemu krviprelievaniu." # todo: NEW TRANSLATION
 flavor_nav.10.b: "Nemáme inú možnosť, len ich nechať pokračovať." # todo: CHANGED (predtym: Stále môže byť užitočná.)
 flavor_nav.11.title: "Rodiny podporované [ROOT.GetCountry.GetAdjectiveWithNoTooltip] získavajú prevahu v [ShowScriptedGeographyNameWithNoTooltip('nav_contested_basque_borderlands')]" # todo: NEW TRANSLATION
 flavor_nav.11.entry: "Rodiny podporované Navarrčanmi získavajú prevahu v pohraničí" # todo: NEW TRANSLATION
 flavor_nav.11.desc: "Hoci konflikty medzi rodinami podporujúcimi [ROOT.GetCountry.GetAdjective] a [GetCountry('CAS').GetAdjective] v [ShowScriptedGeographyName('nav_contested_basque_borderlands')] región zničujúco zasiahli, [ROOT.GetCountry.GetAdjectiveWithNoTooltip] rodinám sa podarilo takmer nemožné: obnoviť veľkú časť vplyvu [ROOT.GetCountry.GetAltAdjectiveWithNoTooltip('D')] v [ShowScriptedGeographyNameWithNoTooltip('nav_contested_basque_borderlands')]. [GetCountry('CAS').GetNameWithNoTooltip] sa síce ešte môže pokúsiť znovu získať nad regiónom kontrolu, no pre [GetCountry('CAS').GetAdjectiveWithNoTooltip] [GetCountry('CAS').GetGovernment.GetCourtTitle] to bude nepochybne nákladná záležitosť." # todo: NEW TRANSLATION # todo: COUNTRY CASE
 flavor_nav.11.a: "Nech je to začiatok silnejšej krajiny [ROOT.GetCountry.GetAltAdjectiveWithNoTooltip('G')]." # todo: NEW TRANSLATION # todo: COUNTRY CASE
 navarre_gains_castile_basque_lands_tt: "Všetky lokality v [ShowScriptedGeographyName('nav_contested_basque_borderlands')] vlastnené krajinou [GetCountry('CAS').GetName] budú mať vysokú šancu zmeniť vlastníka v prospech [ROOT.GetCountry.GetAltAdjective('A')], ak sa [GetCountry('CAS').GetNameWithNoTooltip] nerozhodne podniknúť drastické kroky na udržanie kontroly nad týmito územiami" # todo: NEW TRANSLATION # todo: COUNTRY CASE
 flavor_nav.12.title: "Posilnenie Hermandades" # todo: NEW TRANSLATION
 flavor_nav.12.entry: "$flavor_nav.12.title$" # todo: NEW TRANSLATION
 flavor_nav.12.desc: "Hoci sa Hermandades z [ROOT.GetCountry.GetAltAdjective('G')] v minulosti ukázali ako schopní spojenci, desaťročia krvavých sporov medzi rôznymi rodmi [ROOT.GetCountry.GetAdjectiveWithNoTooltip] dospeli do bodu varu.\n\nMnohí členovia [ROOT.GetCountry.GetGovernment.GetCourtTitle] prispeli finančnými prostriedkami na podporu [ROOT.GetCountry.GetGovernment.GetAdjective|U] vetvy Hermandades. Bude to síce nákladné, no po posilnení Hermandades pomôžu presadiť autoritu [our_ruler.GetName] nad znepriatelenými rodmi a nadobro ich dostať pod kontrolu." # todo: NEW TRANSLATION # todo: COUNTRY CASE
 flavor_nav.12.a: "Hermandades konečne ukončia tieto rodinné spory." # todo: NEW TRANSLATION
 flavor_nav.13.title: "[target_character.GetNameWithNoTooltip] a výchova [scope_our_heir.GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 flavor_nav.13.entry: "Juan de Beaumont a výchova následníka" # todo: NEW TRANSLATION
 flavor_nav.13.desc: "Beaumontovci majú v [ROOT.GetCountry.GetAltAdjective('L')] vplyv už istý čas, no ich ponuka, že budú osobne vzdelávať [scope_our_heir.GetName], nás prekvapila. [target_character.GetName] má síce povesť čestného muža, niektorí poradcovia sa však obávajú, že [target_character.GetHerHis] ponuka vzdelávať [scope_our_heir.GetNameWithNoTooltip] môže byť pokusom získať si priazeň budúceho vládcu [ROOT.GetCountry.GetAdjectiveWithNoTooltip]." # todo: NEW TRANSLATION # todo: COUNTRY CASE
 flavor_nav.13.a: "[target_character.GetHeShe|U] by bol vynikajúcim učiteľom." # todo: NEW TRANSLATION
 flavor_nav.13.a.entry: "Bol by vynikajúcim učiteľom." # todo: NEW TRANSLATION
 flavor_nav.13.b: "Nemôžeme riskovať, že [target_character.GetHerHim] bude mať vplyv na [scope_our_heir.GetNameWithNoTooltip]." # todo: NEW TRANSLATION
 flavor_nav.13.b.entry: "Nemôžeme riskovať, že bude mať vplyv na nášho následníka." # todo: NEW TRANSLATION
 flavor_nav.14.title: "[scope_our_consort.GetNameWithNoTooltip] a [target_character.GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 flavor_nav.14.entry: "Vplyv manželského partnera a Pedra de Peralta" # todo: NEW TRANSLATION
 flavor_nav.14.desc: "Agramontovci, jeden z významných rodov v [ROOT.GetCountry.GetGovernment.GetCourtTitle], si pod vedením [target_character.GetName] budujú značný vplyv a zároveň nadviazali úzke spojenectvo s [scope_our_consort.GetName]. Ich prínos priniesol [ROOT.GetCountry.GetName] mnoho výhod, no niektorí sa obávajú, že ich intrigy skrývajú temnejšie zámery." # todo: NEW TRANSLATION
 flavor_nav.14.a: "Agramontovci nám dobre slúžili." # todo: NEW TRANSLATION
 flavor_nav.14.b: "[target_character.GetHerHis|U] vplyv na [scope_our_consort.GetNameWithNoTooltip] vzbudzuje obavy: postarajme sa o to, aby sa odlúčili." # todo: NEW TRANSLATION
 flavor_nav.14.b.entry: "Jeho vplyv na manželského partnera vzbudzuje obavy: postarajme sa o to, aby sa odlúčili." # todo: NEW TRANSLATION
 variable_tt_beaumont_backed_heir: "Beaumontovci sú prítomní na dvore a podporujú následníka" # todo: NEW TRANSLATION
 variable_tt_agramonteses_backed_consort: "Agramontovci sú prítomní na dvore a sú blízkymi spojencami manželského partnera" # todo: NEW TRANSLATION
 flavor_nav.15.title: "Blížiace sa uzurpovanie trónu [the_legal_heir.GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 flavor_nav.15.entry: "Blížiace sa uzurpovanie trónu následníka" # todo: NEW TRANSLATION
 flavor_nav.15.desc: "Hoci [our_ruler.GetName] vládol stabilne, nedávno [our_ruler.GetSheHe] ochorel a pripútala ho choroba na lôžko. Agramontovci verní [the_consort_usurper.GetName], ktorí sa obávajú, že život [ROOT.GetCountry.GetGovernment.GetRulerTitle] sa blíži ku koncu, potajomky korunovali [the_consort_usurper.GetHerHim] za nového vládcu [ROOT.GetCountry.GetAltAdjective('A')].\n\nKým [the_legal_heir.GetNameWithNoTooltip] nie je na [ROOT.GetCountry.GetGovernment.GetCourtTitle], niektorí Beaumontovci tajne poslali listy do [the_legal_heir.GetHerHis] sprievodu v nádeji, že [the_legal_heir.GetHerHim] upozornia na zradu Agramontovcov. Ak listy dorazia včas, možno sa podarí zhromaždiť dostatočnú podporu a prekaziť plán Agramontovcov skôr, než sa uskutoční." # todo: NEW TRANSLATION # todo: COUNTRY CASE
 flavor_nav.15.a: "[the_consort_usurper.GetNameWithNoTooltip] je vhodnejší na vedenie [ROOT.GetCountry.GetNameWithNoTooltip]." # todo: NEW TRANSLATION
 flavor_nav.15.a.entry: "Dvor je vhodnejší na vedenie Navarry." # todo: NEW TRANSLATION
 flavor_nav.15.b: "Postavme sa na stranu [the_legal_heir.GetNameWithNoTooltip], právoplatného vládcu [ROOT.GetCountry.GetAltAdjectiveWithNoTooltip('A')]!" # todo: NEW TRANSLATION # todo: COUNTRY CASE
 flavor_nav.15.b.entry: "Postavme sa na stranu nášho následníka, právoplatného vládcu Navarry!" # todo: NEW TRANSLATION
 flavor_nav.15.historical_info: "Spoluvládcovia Blanka I. a Ján II. rozhodli, že po Blankinej smrti zdedí navarrský trón ich syn Karol, knieža z Viany. Namiesto toho, aby trón pripadol Karolovi, sa však Ján II. rozhodol ponechať si vládu nad krajinami Navarry, čím sa fakticky stal kráľom a zosadil vlastného syna. S podporou Beaumontovcov a Agramontovcov sa neskôr stretli v navarrskej občianskej vojne, z ktorej vyšiel víťazne Ján II. a udržal si trón Navarry." # todo: NEW TRANSLATION
 flavor_nav.16.title: "Nárok krajiny [target_country.GetAdjectiveWithNoTooltip]" # todo: NEW TRANSLATION
 flavor_nav.16.desc: "Po získaní značnej podpory v [ShowRegionName('france_region')] otvorene vyhlásil [target_character.GetName] svoj nárok na trón v [ShowRegionNameWithNoTooltip('france_region')] a vyslal poslov po celom [ShowRegionNameWithNoTooltip('france_region')], aby ostatným ponúkol poslednú príležitosť pridať sa k [target_character.GetHerHim] v [target_character.GetHerHis] úsilí zmocniť sa ho. Hoci si [target_character.GetShortNameWithNoTooltip] získal značnú priazeň nášho [ROOT.GetCountry.GetGovernment.GetCourtTitle], niektorí členovia rady sa obávajú, že [target_character.GetSheHe] vážne destabilizuje [ShowRegionNameWithNoTooltip('france_region')], ak [target_character.GetSheHe] uspeje." # todo: NEW TRANSLATION
 flavor_nav.16.a: "Vyhlásime podporu [target_character.GetNameWithNoTooltip]." # todo: NEW TRANSLATION
 flavor_nav.16.b: "Do tohto konfliktu sa nezapletieme." # todo: NEW TRANSLATION
 flavor_nav.16.c: "[target_character.GetSheHe|U] musí byť zastavený." # todo: NEW TRANSLATION
 nav_appanage_ally_join_war_tt: "[ROOT.GetCountry.GetName] sa zapojí do vojny [target_character.GetName] o kontrolu nad [ShowRegionName('france_region')]" # todo: NEW TRANSLATION
 flavor_nav.17.title: "Údel [ShowScriptedGeographyNameWithNoTooltip('nav_contested_basque_borderlands')]" # todo: NEW TRANSLATION
 flavor_nav.17.desc: "Mnohé naše územia pozdĺž hranice [ShowScriptedGeographyName('nav_contested_basque_borderlands')] s [GetCountry('NAV').GetName] ovládli frakcie podporujúce [GetCountry('NAV').GetAdjectiveWithNoTooltip]. Mnohé rodiny [ShowCultureName('basque')] verné krajine [ROOT.GetCountry.GetAltAdjective('D')] pritom utrpeli ničivé straty. Hoci niektorí členovia [ROOT.GetCountry.GetGovernment.GetCourtTitle] cítia, že región ešte nie je stratený, bude ťažké obnoviť v ňom našu moc, keďže mnohí jeho obyvatelia sú teraz závislí od mocných rodín [GetCountry('NAV').GetAdjectiveWithNoTooltip]." # todo: NEW TRANSLATION # todo: COUNTRY CASE
 flavor_nav.17.a: "Nech sa pohraničné územia odtrhnú a pripadnú krajine [GetCountry('NAV').GetNameWithNoTooltip]." # todo: NEW TRANSLATION
 flavor_nav.17.b: "Na túto vzburu [ShowCultureNameWithNoTooltip('basque')] nikdy nezabudneme." # todo: NEW TRANSLATION
 flavor_nav.17.c: "Rýchlo potlačme vzburu, nech to stojí čokoľvek!" # todo: NEW TRANSLATION
 flavor_nav.20.title: "San Francisco de Olite" # todo: NEW TRANSLATION
 flavor_nav.20.entry: "$flavor_nav.20.title$" # todo: NEW TRANSLATION
 flavor_nav.20.desc: "Ako oddaná osoba, [ROOT.GetCountry.GetGovernment.GetRuler.GetName] nemôže akceptovať pomalý priebeh prác na kláštore San Francisco v [ShowLocationName('olite')].\n\nKláštor bol založený pred viac ako storočím a ešte ho nemožno považovať za dokončený.\n\nNapriek dopadu, ktorý by zrýchlenie prác mohlo mať na našu pokladnicu, by miesto a náš prestíž z toho mohli výrazne profitovať." # todo: NEW TRANSLATION
 flavor_nav.20.a: "Chvála Bohu!" # todo: NEW TRANSLATION
 flavor_nav.20.b: "Už to čakalo, môže ešte počkať." # todo: NEW TRANSLATION
 flavor_nav.20.historical_info: "Podľa legendy svätý František z Assisi založil kláštor v Olite počas svojej púte do Santiaga de Compostela (okolo rokov 1213–1214).\n\nZaložený kráľom Theobaldom II., neskôr ho finančne a duchovne podporovali navarrskí panovníci, predovšetkým Jeanne II a Charles II, čím podporili jeho rast a oddanosť.\n\nV priebehu času kláštor prešiel zmenami, stal sa 'Apoštolským kolégiom' na výcvik a vysielanie misionárov do Španielska a Ameriky, alebo slúžil ako nemocnica počas vojny Konventu v roku 1795." # todo: NEW TRANSLATION
 flavor_nav.21.title: "Volanie cirkvi" # todo: NEW TRANSLATION
 flavor_nav.21.entry: "$flavor_nav.21.title$" # todo: NEW TRANSLATION
 flavor_nav.21.desc: "[target_character.GetName], najstaršia dcéra nášho [ROOT.GetCountry.GetGovernment.GetRuler.GetAltAdjective('G')], čaká na sprievod, ktorý ju odprevadí do nového života v [ShowLocationName('paris')].\n\nKeď sa narodila, zdalo sa, že sa na ňu hviezdy usmievajú. Ako dedička všetkého, čo jej rodičia vlastnili, mala pred sebou skvelú budúcnosť. No všetko sa zmenilo. Jej manželstvo s [GetCountry('ARA').GetGovernment.GetRuler.GetName] bolo zrušené a ona sa stala prekážkou svojej mladšej sestre [target_sister.GetShortName].\n\nTeraz vstúpi do [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] v [ShowLocationNameWithNoTooltip('paris')] a bude slúžiť nášmu Pánovi a Spasiteľovi.\n\nNiektorí sa však zamýšľajú, či by ešte nemohla byť ríši užitočná a stať sa cenným tromfom v ďalších diplomatických rokovaniach." # todo: NEW TRANSLATION # todo: COUNTRY CASE
 flavor_nav.21.a: "Stane sa mníškou." # todo: NEW TRANSLATION
 flavor_nav.21.b: "Ešte by mohla byť užitočná." # todo: NEW TRANSLATION
 flavor_nav.21.historical_info: "Hoci bola Jeanne zasnúbená s Petrom IV. Aragónskym, k svadbe nikdy nedošlo. Historici sa domnievajú, že mohla trpieť zdravotným stavom alebo chorobou, pre ktorú nebola žiaducou manželkou. Zastúpila ju mladšia sestra Maria, ktorá sa napokon vydala za Petra.\n\nKeďže k tomuto sobášu došlo, Jeanne sa musela vzdať svojich nástupníckych práv a vstúpila do františkánskeho opátstva Longchamp neďaleko Paríža, kde sa pridala k rádu klarisiek." # todo: NEW TRANSLATION
 flavor_nav.30.title: "Zavlažovacie projekty v Tudele" # todo: NEW TRANSLATION
 flavor_nav.30.entry: "$flavor_nav.30.title$" # todo: NEW TRANSLATION
 flavor_nav.30.desc: "Napriek tomu, že náš [ROOT.GetCountry.GetGovernment.GetRulerTitle] trávi veľa [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHis] času vo svojich panstvách v [ShowRegionName('france_region')], [ROOT.GetCountry.GetGovernment.GetRuler.GetSheHe] má vždy čas rozvíjať nové projekty v [ROOT.GetCountry.GetLongName].\n\nJužné časti [ROOT.GetCountry.GetFlavorRank], okolo [ShowLocationName('tudela')], sú známe svojou úrodnosťou, ale aj suchom, a vykopanie kanálov na zlepšenie zavlažovania polí môže výrazne zvýšiť výnosy plodín." # todo: NEW TRANSLATION
 flavor_nav.30.a: "Pôda bude oveľa produktívnejšia." # todo: NEW TRANSLATION
 flavor_nav.30.b: "Nemôžeme si dovoliť tieto výdavky." # todo: NEW TRANSLATION
 flavor_nav.30.historical_info: "Počas svojej vlády sa Jeanne II i Philippe III pustili do viacerých ekonomických rozvojových projektov v celom Kráľovstve Navarry, vrátane rozšírenia zavlažovacích systémov okolo Tudely, najdôležitejšieho mesta na juhu kráľovstva." # todo: NEW TRANSLATION
 flavor_nav.40.title: "Kópia Fueros z Navarry" # todo: NEW TRANSLATION
 flavor_nav.40.entry: "$flavor_nav.40.title$" # todo: NEW TRANSLATION
 flavor_nav.40.desc: "Ako sa zapojenie [ROOT.GetCountry.GetGovernment.GetRulerTitle] do každodenných povinností kráľovstva stáva bežnejším, bola pre [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHis] objednaná kópia #italic Fueros of Navarre#!.\n\nNavrhovaná kópia bude krásne zdobená, s peknou koženou väzbou najvyššej kvality a napísaná najzručnejšími prepisovačmi v kráľovstve. Ako je tradíciou, text bude napísaný v [spanish_language.GetName], s jeho zaujímavými [basque_language.GetName] termínmi sem–tam.\n\nBohužiaľ, náš [ROOT.GetCountry.GetGovernment.GetRulerTitle] hovorí po [french_language.GetName] a neovláda navarrskú románsku reč." # todo: NEW TRANSLATION
 flavor_nav.40.a: "Bude pridaný preklad do [french_language.GetNameWithNoTooltip]." # todo: NEW TRANSLATION
 flavor_nav.40.a.entry: "Bude pridaný preklad do [ShowLanguageNameWithNoTooltip('french_language')]." # todo: NEW TRANSLATION
 flavor_nav.40.b: "Možno je čas, aby sa naši panovníci naučili jazyk krajiny." # todo: NEW TRANSLATION
 flavor_nav.40.c: "Baskičtina by mala byť úradným jazykom, ak je najrozšírenejšia." # todo: NEW TRANSLATION
 flavor_nav.40.historical_info: "Hoci je pravdepodobné, že väčšina obyvateľstva v Kráľovstve Navarra mala za materinský jazyk baskičtinu (#italic Lingua Navarrorum#!), oficiálna dokumentácia kráľovstva bola väčšinou písaná v navarsko-aragónčine (#italic Ydiomate Navarre Terrae#!, #italic Ydiomate Navarre#! alebo #italic Lengoage de Navarra#!), keďže okcitánčina upadala.\n\nOkrem toho boli francúzske varianty bežné od príchodu prvých francúzskych dynastií do kráľovstva, počnúc rodom Champagne v roku 1234." # todo: NEW TRANSLATION
 flavor_nav.50.title: "Obliehanie Algecirasu" # todo: NEW TRANSLATION
 flavor_nav.50.entry: "$flavor_nav.50.title$" # todo: NEW TRANSLATION
 flavor_nav.50.desc: "Do kráľovstva dorazili správy o vojne na [target_country.GetAdjective] hranici. [GetCountry('CAS').GetName] obnovil krížovú výpravu proti [target_country.GetNameWithNoTooltip] a [target_character.GetName] sa rýchlo vrátil do [ROOT.GetCountry.GetAltAdjective('G')], aby sa zúčastnil bojov.\n\nNapriek zjavnej nedochodnosti pre naše [ROOT.GetCountry.GetFlavorRank] sme vždy cítili, že je našou povinnosťou pomôcť susedom vypudiť [ShowReligionGroupAdjective('muslim')] z [ShowRegionName('iberia_region')]." # todo: NEW TRANSLATION # todo: COUNTRY CASE
 flavor_nav.50.a: "[target_character.GetShortNameWithNoTooltip] bude viesť našich bojovníkov." # todo: NEW TRANSLATION
 flavor_nav.50.a.entry: "Postava bude veliteľom našich bojovníkov." # todo: NEW TRANSLATION
 flavor_nav.50.b: "Musíme poslať mužov na krížovú výpravu, ale nemali by sme posielať [target_character.GetShortNameWithNoTooltip]." # todo: NEW TRANSLATION
 flavor_nav.50.b.entry: "Musíme poslať mužov na krížovú výpravu, ale nemali by sme ho poslať." # todo: NEW TRANSLATION
 flavor_nav.50.c: "To nie je záležitosť [ROOT.GetCountry.GetNameWithNoTooltip]." # todo: NEW TRANSLATION
 flavor_nav.50.c.entry: "To nie je naša záležitosť." # todo: NEW TRANSLATION
 flavor_nav.50.historical_info: "V roku 1343 sa kráľ Philippe z Navarry pripravoval pripojiť ku krížovej výprave proti Granade, zdôrazňujúc svoju povinnosť ako vládcu iberského kráľovstva. Jeho prítomnosť pri obliehaní Algecirasu, podporovaná zásobami z Biskajského zálivu, bola kľúčová napriek malej vojenskej sile. Bohužiaľ Philippe ochorel, čo viedlo k jeho smrti v septembri 1343. Jeho telo bolo dopravené do Pamplony na pochovanie, zatiaľ čo jeho srdce našlo miesto odpočinku v Paríži. Jeanne, jeho vdova, prijala sústrasť od pápeža Klementa VI. Algeciras nakoniec padol a Jeanne pokračovala vo vláde až do svojej smrti v roku 1349, keď korunu zanechala ich synovi, Charlesovi II." # todo: NEW TRANSLATION
 flavor_nav.60.title: "Posledná vôľa kráľovnej" # todo: NEW TRANSLATION
 flavor_nav.60.entry: "$flavor_nav.60.title$" # todo: NEW TRANSLATION
 flavor_nav.60.desc: "[target_character.GetName] zomrela a jej závet prečítali. V ňom [target_character.GetHeSheFormal] žiada svoju nástupkyňu, aby ku kostolu Santa Maria la Real v [ShowLocationName('olite')] pristavila kaplnku.\n\nNiektorí dvorania navrhli zasvätiť kaplnku Nepoškvrnenému počatiu Panny Márie a náš vládca [ROOT.GetCountry.GetGovernment.GetRuler.GetName] je tejto myšlienke veľmi naklonený, pretože [ROOT.GetCountry.GetGovernment.GetRuler.GetSheHe] vie, aká zbožná bola [target_character.GetShortNameWithNoTooltip]." # todo: CHANGED (predtym: The [target_character.GetName] is dead and her will has been read. In it, [target_character.GetHeSheFormal] asks her suc)
 flavor_nav.60.a: "Vôľa matky sa musí dodržať." # todo: NEW TRANSLATION
 flavor_nav.60.b: "Máme lepšie využitie týchto peňazí na mysli." # todo: NEW TRANSLATION
 flavor_nav.60.historical_info: "Keď kráľovná Jeanne II zomrela na Čiernu smrť v roku 1349, bol prečítaný jej posledný testament a medzi jej požiadavkami bola žiadosť, aby jej syn Charles II financoval kaplnku v gotickom kostole Santa Maria La Real de Olite.\n\nTento kostol používal Dom Evreux pri svojich náboženských obradoch a jeho štýl je ovplyvnený parížskou katedrálou Notre Dame." # todo: NEW TRANSLATION
 navarre_charles_ii_claim_to_france.title: "Oprávnený nárok na [GetCountry('FRA').GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 navarre_charles_ii_claim_to_france.desc: "Hoci sa [GetCharacter('nav_jeanne_ii_capet').GetName] vzdala [GetCharacter('nav_jeanne_ii_capet').GetHerHis] nároku na [GetCountry('FRA').GetNameWithNoTooltip], [GetCharacter('nav_charles_ii_evreux').GetName] je stále priamym pokrvným potomkom starého [GetCharacter('fra_louis_x_capet').GetName]. Aj keby [ShowHeirSelectionName('salic_law')] nesprávne vyhlásil [GetCharacter('nav_charles_ii_evreux').GetNameWithNoTooltip] za nespôsobilého, nárok [GetCharacter('nav_charles_ii_evreux').GetNameWithNoTooltip] je stále silnejší než nárok súčasných vládcov krajiny [GetCountry('FRA').GetNameWithNoTooltip]!" # todo: NEW TRANSLATION
 navarre_charles_ii_claim_to_france.a: "Nadišiel čas uplatniť náš oprávnený nárok na [GetCountry('FRA').GetNameWithNoTooltip]!" # todo: NEW TRANSLATION
 navarre_charles_ii_claim_to_france_appanage_route.title: "$navarre_charles_ii_claim_to_france.title$" # todo: NEW TRANSLATION
 navarre_charles_ii_claim_to_france_appanage_route.desc: "$navarre_charles_ii_claim_to_france.desc$" # todo: NEW TRANSLATION
 navarre_charles_ii_claim_to_france_appanage_route.a: "Nadišiel čas rozpútať občiansku vojnu a zmocniť sa trónu!" # todo: NEW TRANSLATION
 nav_appanage_willingness_to_join_tt: "Ak dosiahneme vzťahy #G +150#! s ostatnými apanážnymi vazalmi krajiny [GetCountry('FRA').GetNameWithNoTooltip], priklonia sa k podpore našej vojny proti krajine [GetCountry('FRA').GetNameWithNoTooltip] o trón" # todo: NEW TRANSLATION
 nav_coercing_of_normandy.title: "Prinútenie [GetCountry('NRM').GetNameWithNoTooltip] k poslušnosti" # todo: NEW TRANSLATION
 nav_coercing_of_normandy.desc: "Mnohí páni z [GetCountry('NRM').GetName], ktorí stáli v prvej línii [ShowSituationNameWithNoTooltip('hundred_years_war')], sú nespokojní so súčasným vládcom krajiny [GetCountry('FRA').GetName]. Vďaka dedičstvu po [GetCharacter('nav_philip_iii_evreux').GetName] si [GetCharacter('nav_charles_ii_evreux').GetName] udržiava úzke väzby s ľuďmi v [GetCountry('NRM').GetFlavorRank]; niektorí z nich by možno prijali [GetCharacter('nav_philip_iii_evreux').GetShortNameWithNoTooltip] za svojho nového lenného pána." # todo: NEW TRANSLATION
 nav_coercing_of_normandy.a: "Prevezmime kontrolu nad [GetCountry('NRM').GetNameWithNoTooltip]!" # todo: NEW TRANSLATION
 nav_end_the_blood_feuds.title: "Ukončenie krvavých sporov" # todo: NEW TRANSLATION
 nav_end_the_blood_feuds.desc: "Od skončenia [ShowDisasterName('castilian_civil_war')] zmietajú veľkú časť krajiny [GetCountry('NAV').GetName] dlhotrvajúce krvavé spory medzi rodinami, ktoré nabrali odvahu, keď regionálny vplyv [GetCountry('CAS').GetAdjectiveWithNoTooltip] zoslabol. Teraz, keď vplyv [GetCountry('NAV').GetAdjectiveWithNoTooltip] zosilnel, môžeme ho využiť a tieto spory raz a navždy ukončiť." # todo: NEW TRANSLATION
 nav_end_the_blood_feuds.a: "Moc bola obnovená!" # todo: NEW TRANSLATION
 nav_sow_division_in_the_borderlands.title: "Rozsievanie nezhôd v pohraničí" # todo: NEW TRANSLATION
 nav_sow_division_in_the_borderlands.desc: "Vplyv [GetCountry('CAS').GetAdjective] v [ShowScriptedGeographyName('nav_contested_basque_borderlands')] je len zlomkom toho, čo býval. Pretrvávajúce spory medzi rodinami v regióne vernými krajine [GetCountry('NAV').GetName] sa nám môžu hodiť, ak sa rozhodneme podporiť ich otvorený boj proti ostatným rodinám, ktoré sú stále verné krajine [GetCountry('CAS').GetNameWithNoTooltip]. Môže nás to stáť veľa, no [ShowScriptedGeographyNameWithNoTooltip('nav_contested_basque_borderlands')] by sa mohlo opäť zjednotiť s krajinou [GetCountry('NAV').GetNameWithNoTooltip]." # todo: NEW TRANSLATION
 nav_sow_division_in_the_borderlands.a: "Povoľte plieniť majetky súperiacich rodín." # todo: NEW TRANSLATION
 nav_sow_division_in_the_borderlands.b: "Vypáľte okrajové oblasti pohraničia." # todo: NEW TRANSLATION
 nav_sow_division_in_the_borderlands.c: "Podnecujte nedôveru na územiach ovládaných krajinou [GetCountry('CAS').GetAdjectiveWithNoTooltip]." # todo: NEW TRANSLATION
 nav_sow_division_in_the_borderlands_a_tt: "Každá [Concept('location','lokalita')|e] [Concept('owned','vlastnené')|e] krajinou [GetCountry('CAS').GetName] v oblasti [ShowScriptedGeographyName('nav_contested_basque_borderlands')] získa na 3 roky modifikátor [ShowModifier('nav_feud_crossfire')] a výrazne stratí [Concept('prosperity','prosperita')|e] a [Concept('pop_satisfaction','spokojnosť populácie')|e]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 nav_sow_division_in_the_borderlands_b_tt: "Každá [Concept('location','lokalita')|e] [Concept('owned','vlastnené')|e] krajinou [GetCountry('CAS').GetName] v oblasti [ShowScriptedGeographyName('nav_contested_basque_borderlands')] získa na 3 roky modifikátor [ShowModifier('nav_destructive_feuds')] a mierne stratí [Concept('prosperity','prosperita')|e], [Concept('pop_satisfaction','spokojnosť populácie')|e] a [Concept('development','rozvoj')|e]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 nav_sow_division_in_the_borderlands_c_tt: "Každá [Concept('location','lokalita')|e] [Concept('owned','vlastnené')|e] krajinou [GetCountry('CAS').GetName] v oblasti [ShowScriptedGeographyName('nav_contested_basque_borderlands')] získa na 3 roky modifikátor [ShowModifier('nav_widespread_distrust_caused_by_feuds')] a mierne stratí [Concept('prosperity','prosperita')|e], [Concept('pop_satisfaction','spokojnosť populácie')|e] a [Concept('control','kontrola')|e]" # todo: NEW TRANSLATION # todo: CONCEPT CASE

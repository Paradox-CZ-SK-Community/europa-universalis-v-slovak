l_polish:
 flavor_mfa.1.title: "$BYZ_ADJ$ Tradície" # todo: NEW TRANSLATION
 flavor_mfa.1.entry: "$BYZ_ADJ$ Tradície" # todo: NEW TRANSLATION
 flavor_mfa.1.desc: "[ROOT.GetCountry.GetLongName] stojí na križovatke. Pred niekoľkými desaťročiami nastúpil na trón [ROOT.GetCountry.GetFlavorRank] v osobe [target_character2.GetName], člen hrdého rodu [target_character.GetDynasty.GetName]. Hoci bol [ShowModifier('byz_born_in_the_purple_modifier')], [target_character2.GetName] konvertoval na [ShowReligionName('catholic')] a prijal kultúru [ShowCultureName('piedmontese')], čím opustil svoje [target_country.GetAdjective] korene.\n\nDnes je [ROOT.GetCountry.GetNameWithNoTooltip] vládaný potomkom [target_character2.GetHerHis], [target_character.GetName], ktorý by možno túžil po živote, aký by mal v [target_country.GetLongNameWithNoTooltip], keby sa [target_character.GetName] nenarodil v [target_character.GetLocation.GetName]." # todo: NEW TRANSLATION
 flavor_mfa.1.a: "[target_character2.GetNameWithNoTooltip] sa múdro prispôsobil." # todo: NEW TRANSLATION
 flavor_mfa.1.a.entry: "Náš vládca sa múdro prispôsobil." # todo: NEW TRANSLATION
 flavor_mfa.1.b: "Neopustíme naše korene!" # todo: NEW TRANSLATION
 mfa_extra_information_about_reform: "[Concept('modifiers','Modifikátory')|e] [target_government_reform.GetName] sa menia od negatívnych po pozitívne na základe percenta [ShowCultureName('greek_culture')] [Concept('culture','kultúry')|e] a percenta [ShowReligionAdjective('orthodox')] [Concept('religion','náboženstva')|e]. Ako sa [ROOT.GetCountry.GetName] konvertuje, tresty sa postupne zmenia na pozitíva. Modifikátory sa pohybujú od #N -1#! do #G +1#!" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 mfa_opportunity_for_thessaloniki: "Ak bude [target_government_reform.GetName] prijatá a dosiahneme #W 75.0%#! podiel [ShowCultureName('greek_culture')] [Concept('culture','kultúra')|e] a [ShowReligionAdjective('orthodox')] [Concept('religion','náboženstvo')|e], budeme môcť požiadať [target_country.GetName] o léno v [ShowLocationName('thessaloniki')] a jeho okolí" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 flavor_mfa.2.title: "[target_character.GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 flavor_mfa.2.entry: "Facino Cane" # todo: NEW TRANSLATION
 flavor_mfa.2.desc: "Naša [ROOT.GetCountry.GetFlavorRank] privítala postavu široko známy — [target_character.GetName], slávneho condottiera pôvodom z [target_character.GetBirthLocation.GetName]. Po rokoch služby v radoch iných štátov sa [target_character.GetNameWithNoTooltip] vyznamenal ako schopný veliteľ. Podľa jeho doterajších skutkov veríme, že by [target_character.GetName] bol pre nás a [target_character.GetHerHis] družinu vhodným doplnením — silným aktívom v našich vojnách proti ostatným mocnostiam v regióne." # todo: NEW TRANSLATION
 flavor_mfa.2.a: "Musíme najať [target_character.GetHerHim]." # todo: NEW TRANSLATION
 flavor_mfa.2.a.entry: "Musíme ho najať." # todo: NEW TRANSLATION
 flavor_mfa.2.b: "Ponúknime [target_character.GetHerHim] niekoľko území výmenou za [target_character.GetHerHis] služby." # todo: NEW TRANSLATION
 flavor_mfa.2.b.entry: "Ponúknime mu niekoľko území výmenou za jeho služby." # todo: NEW TRANSLATION
 flavor_mfa.2.c: "Bah! Nech si ten nomád nájde prácu inde." # todo: NEW TRANSLATION
 mfa_facino_condotierro: "Facinova družina" # todo: NEW TRANSLATION
 flavor_mfa.3.title: "Ambície hodné cisára" # todo: NEW TRANSLATION
 flavor_mfa.3.entry: "$flavor_mfa.3.title$" # todo: NEW TRANSLATION
 flavor_mfa.3.desc: "[target_character.GetName] síce nemusí byť [ShowModifier('byz_born_in_the_purple_modifier')] ani priama vetva cisárskeho rodu, no cisárska krv rodu [target_character.GetDynasty.GetName] prúdi v [target_character.GetHerHis] žilách. [target_character.GetSheHe|U] sa neuspokojí s postrannou úlohou medzi mnohými drobnými vládcami [ShowAreaName('piemonte_area')]. [target_character.GetShortNameWithNoTooltip] je hoden vládnuť niečomu oveľa väčšiemu než len obyčajnému [ShowCountryRankName('rank_county')]." # todo: NEW TRANSLATION
 flavor_mfa.3.a: "[ShowAreaNameWithNoTooltip('piemonte_area')] potrebuje nového hegemóna." # todo: NEW TRANSLATION
 flavor_mfa.3.b: "[target_character.GetHerHis|U] ambície len privedú ostatných proti nám." # todo: NEW TRANSLATION
 flavor_mfa.3.b.entry: "Jeho ambície len privedú ostatných proti nám." # todo: NEW TRANSLATION
 mfa_if_we_conquer_enough_in_20_years: "Ak [ROOT.GetCountry.GetName] dosiahne aspoň #W [DisplayPopulationNumber('(CFixedPoint)500')]#! [Concept('population_i','@population!')|e] [Concept('population','populácie')|e] do #W 20#! rokov, získa [SCOPE.ScriptValue('prestige_mild_bonus')|+=] [Concept('prestige_i','@prestige!')|e] [Concept('prestige','prestíže')|e], [ShowModifier('mfa_elevation_modifier')] [Concept('modifier','modifikátor')|e] na #W 40#! rokov a môže byť tiež povýšený na [ShowCountryRankName('rank_duchy')], ak už nie je\nAk [ROOT.GetCountry.GetName] toto nedosiahne, dostane [SCOPE.ScriptValue('prestige_extreme_penalty')|+=] [Concept('prestige_i','@prestige!')|e] [Concept('prestige','prestíže')|e], [SCOPE.ScriptValue('stability_weak_penalty')|+=] [Concept('stability_i','@stability!')|e] [Concept('stability','stability')|e] a všetci ich susedia dostanú [ShowCasusBelliName('cb_cut_down_in_size')] [Concept('casus_belli','casus Belli')|e] na nich" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 flavor_mfa.4.title: "Výsmech [ShowRegionNameWithNoTooltip('italy_region')]" # todo: NEW TRANSLATION
 flavor_mfa.4.desc: "Pred desaťročiami [target_character.GetName] prisahal, že sa stane hegémonom [ShowAreaName('piemonte_area')]. Dnes z tej vízie zostalo len kruté posmeškanie členov [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]. Rod [target_character.GetDynasty.GetName] z [ROOT.GetCountry.GetLongName] nielenže zlyhal, ale pri tom si aj získal mnoho nových nepriateľov. Ušetria si susedia [ROOT.GetCountry.GetFlavorRank] trochu súcitu pre tento žalostný stav?" # todo: NEW TRANSLATION
 flavor_mfa.4.a: "Urobili sme, čo sme mohli." # todo: NEW TRANSLATION
 flavor_mfa.5.title: "Zrelé ovocie" # todo: NEW TRANSLATION
 flavor_mfa.5.desc: "Počas posledných rokov [from_country.GetLongName] usilovne pracoval na tom, aby si získal nepriateľov medzi susedmi. Dnes mu jeho ambície priniesli len posmech a hnev ostatných. My, a mnohí ďalší, cítime pohŕdanie nad ich žalostným stavom." # todo: NEW TRANSLATION
 flavor_mfa.5.a: "Ach, aká bieda." # todo: NEW TRANSLATION
 flavor_mfa.6.title: "Vévodovia [ShowAreaNameWithNoTooltip('piemonte_area')]" # todo: NEW TRANSLATION
 flavor_mfa.6.desc: "Pred rokmi [target_character.GetName] prisahal, že jeho dom, [ROOT.GetCountry.GetAdjective] dynastia [target_character.GetDynasty.GetName], raz získa slávu, ktorú si zaslúži. Dnes sú jeho snahy konečne uznané, pretože tento klenot [ShowAreaName('piemonte_area')] bol povýšený na [ShowCountryRankName('rank_duchy')]." # todo: NEW TRANSLATION
 flavor_mfa.6.a: "Možno sú [ROOT.GetCountry.GetAdjectiveWithNoTooltip] vládcovia tiež hodní narodenia v purpure?" # todo: NEW TRANSLATION
 flavor_mfa.6.b: "Nech bude [ROOT.GetCountry.GetNameWithNoTooltip] slávny!" # todo: NEW TRANSLATION
 mfa_purple_color: "Naša farba sa zmení na odtieň #W Hlbokej purpurovej#!" # todo: NEW TRANSLATION
 flavor_mfa.7.title: "Náš nárok na [ShowScriptedGeographyNameWithNoTooltip('claims_of_thessalonica_geography')]" # todo: NEW TRANSLATION
 flavor_mfa.7.entry: "$flavor_mfa.7.title$" # todo: NEW TRANSLATION
 flavor_mfa.7.desc: "[target_character.GetName], pochádzajúci z línie [target_character.GetDynasty.GetName] začínajúcej u [target_character2.GetName], má prirodzený, hoci vzdialený nárok na [target_country.GetLongName] prostredníctvom svojej dynastie. Menej známy je jeho ďalší nárok na [ShowScriptedGeographyName('claims_of_thessalonica_geography')], ktorý siaha až k [target_character3.GetName] a rodu [target_character3.GetDynasty.GetName]. Po úzkej spolupráci s [target_character.GetDynasty.GetNameWithNoTooltip] z [target_country.GetCapital.GetName] verí [target_character.GetName], že by sme za naše priazne mohli získať [target_location.GetName] a jeho okolie." # todo: NEW TRANSLATION
 flavor_mfa.7.a: "Uplatniť nárok." # todo: NEW TRANSLATION
 flavor_mfa.7.b: "Nezneužijeme ich dobrotu." # todo: NEW TRANSLATION
 MFA_request_thessalonica: "Požiadame [target_country.GetLongName] o územia v [ShowProvinceDefinitionName('chalkidiki_province')], [ShowProvinceDefinitionName('lower_macedonia_province')] a [ShowProvinceDefinitionName('central_macedonia_province')] ako [ShowSubjectTypeName('fiefdom')]" # todo: NEW TRANSLATION
 flavor_mfa.8.title: "Žiadosť od [from_country.GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 flavor_mfa.8.desc: "Naši príbuzní z rodu [target_character.GetDynasty.GetName] v [from_country.GetLongName] vytvorili skutočne [target_country.GetAdjective] štát v [ShowRegionName('italy_region')]. Ich obyvateľstvo je [ROOT.GetCountry.GetReligion.GetAdjective] a [ROOT.GetCountry.GetCulture.GetName]; nosia purpurové rúcha a hovoria naším jazykom. Vzhľadom na našu spoločnú históriu a vzájomnú spoluprácu, ich vládca, [target_character.GetName], žiada o léno v [target_location.GetName] a jeho okolí na základe starobylého nároku na [ShowScriptedGeographyName('claims_of_thessalonica_geography')]." # todo: NEW TRANSLATION
 flavor_mfa.8.a: "[target_character.GetSheHe|U] by mal(a) vedieť lepšie, než citovať [ShowLanguageNameWithNoTooltip('latin_language')] konštrukt." # todo: NEW TRANSLATION
 flavor_mfa.8.b: "Uznáme ich nárok." # todo: NEW TRANSLATION
 mfa_make_thessaloniki_subject: "Naše [locations|e] v [ShowProvinceDefinitionName('chalkidiki_province')], [ShowProvinceDefinitionName('lower_macedonia_province')], a [ShowProvinceDefinitionName('central_macedonia_province')] budú odovzdané ako [ShowSubjectTypeName('fiefdom')] pod [from_country.GetName]" # todo: NEW TRANSLATION
 flavor_mfa.1000.title: "$flavor_mfa.7.title$" # todo: NEW TRANSLATION
 flavor_mfa.1000.entry: "$flavor_mfa.7.title$" # todo: NEW TRANSLATION
 flavor_mfa.1000.desc: "Aj keď je [target_character.GetName] z slávneho rodu [target_character.GetDynasty.GetName], [target_character.GetSheHe] má tiež ďalší významný nárok, ktorý možno vystopovať až k [target_character3.GetName]. Tento nárok sa týka [ShowScriptedGeographyName('claims_of_thessalonica_geography')]. Hoci tento nárok nie je príliš silný, môžeme počítať s podporou iných národov, pretože mnohé [ShowCultureGroupName('italian_group')] štáty dúfajú, že si ukrojia kusy z [target_country.GetLongName] kým trpí [ShowDisasterName('byzantine_succession_crisis')]." # todo: NEW TRANSLATION
 flavor_mfa.1000.a: "Zorganizujme kampaň." # todo: NEW TRANSLATION
 flavor_mfa.1000.b: "Boli by sme blázni viesť vojnu na základe takýchto frivolných nárokov." # todo: NEW TRANSLATION
 recipient_agrees_to_join_war: "[recipient.GetName] sľúbi, že sa do niekoľkých rokov pridá k [actor.GetName] vo vojne proti [GetCountry('BYZ').GetLongName]" # todo: NEW TRANSLATION
 MFA_gather_allies: "[ROOT.GetCountry.GetName] sa pokúsi získať spojencov použitím [ShowCountryInteractionName('mfa_join_against_byz')] [country_interaction|e]\nZa #W 3 roky#! sa spustí [event|e], ktorý vyhlási [war|e] s pomocou získaných podporovateľov" # todo: NEW TRANSLATION
 flavor_mfa.1001.title: "Uspokojenie [from_country.GetAdjectiveWithNoTooltip] pretendentov" # todo: NEW TRANSLATION
 flavor_mfa.1001.desc: "Zbabelí [from_country.GetAdjective] [target_character.GetDynasty.GetName] využívajú svoj pôvod z rodu [target_character3.GetDynasty.GetName], aby si nárokovali [ShowScriptedGeographyName('claims_of_thessalonica_geography')]. Naši špióni hlásia, že sa snažia zostaviť [ShowCultureGroupName('italian_group')] ligu, aby sa pokúsili vyrvať tieto územia počas nášho momentu slabosti v [ShowDisasterName('byzantine_succession_crisis')]." # todo: NEW TRANSLATION
 flavor_mfa.1001.a: "Neodovzdáme tým zradcom ani kúsok územia!" # todo: NEW TRANSLATION
 flavor_mfa.1001.b: "Ponúknime im symbolické územie." # todo: NEW TRANSLATION
 flavor_mfa.1001.c: "Môžu mať všetko, nám je to jedno!" # todo: NEW TRANSLATION
 mfa_offer_few_provinces: "Ponúkneme [from_country.GetName] [provinces|e] [ShowProvinceDefinitionName('chalkidiki_province')], [ShowProvinceDefinitionName('lower_macedonia_province')], a [ShowProvinceDefinitionName('central_macedonia_province')] aby sme ich uspokojili" # todo: NEW TRANSLATION
 mfa_offer_entire_geography: "Ponúkneme [from_country.GetName] všetky naše územia v rámci [ShowScriptedGeographyName('claims_of_thessalonica_geography')]" # todo: NEW TRANSLATION
 flavor_mfa.1002.title: "Príhodný okamih" # todo: NEW TRANSLATION
 flavor_mfa.1002.desc: "Prešlo veľa času, odkedy sme začali zhromažďovať spojencov pre našu kampaň proti [target_country.GetLongName]. Naši nepriatelia, značne oslabení svojimi vnútornými rozbrojmi, zostávajú ideálnym cieľom pre vojnu dobyvateľskú. Keď mnohí spojenci prisľúbili svoju podporu našej veci, možno je čas dokázať, ktorý rod [target_dynasty.GetName] je nadradený." # todo: NEW TRANSLATION
 flavor_mfa.1002.a: "Rozpútajme vojnu!" # todo: NEW TRANSLATION
 flavor_mfa.1002.b: "Teraz nie je ten správny čas." # todo: NEW TRANSLATION
 flavor_mfa.1002.c: "Radšej by sme mali tento plán opustiť." # todo: NEW TRANSLATION
 flavor_mfa.1003.title: "Dodržať našu dohodu" # todo: NEW TRANSLATION
 flavor_mfa.1003.desc: "Vojna s [target_country.GetLongName] konečne vypukla a sme vyzvaní splniť náš sľub [from_country.GetName]. Pomôžeme tejto občianskej vojne rodu [target_character.GetDynasty.GetName], alebo necháme [from_country.GetLongNameWithNoTooltip] samých, nech si poradia v [target_war.GetName]?" # todo: NEW TRANSLATION
 flavor_mfa.1003.a: "Neopustíme našich spojencov." # todo: NEW TRANSLATION
 flavor_mfa.1003.b: "Pozorovanie z boku je správna cesta." # todo: NEW TRANSLATION
 flavor_mfa.1005.title: "Návrh od [target_country.GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 flavor_mfa.1005.desc: "Zbabelé [target_country.GetLongName] konečne prišlo rozum a ponúklo nám územia v [ShowScriptedGeographyName('claims_of_thessalonica_geography')]. Túto ponuku by sme mali dôkladne zvážiť, lebo celá expedícia je sama o sebe rizikom." # todo: NEW TRANSLATION
 flavor_mfa.1005.a: "Vezmeme, čo môžeme získať." # todo: NEW TRANSLATION
 flavor_mfa.1005.b: "Sú blázni, ak si myslia, že nás to zastaví!" # todo: NEW TRANSLATION
 mfa_make_thessaloniki_subject_out_of_provinces: "[target_country.GetAdjective] [locations|e] v [ShowProvinceDefinitionName('chalkidiki_province')], [ShowProvinceDefinitionName('lower_macedonia_province')], a [ShowProvinceDefinitionName('central_macedonia_province')] budú odovzdané ako [ShowSubjectTypeName('fiefdom')] pod [from_country.GetName]" # todo: NEW TRANSLATION
 mfa_make_thessaloniki_subject_out_of_geography: "[target_country.GetAdjective] [locations|e] v [ShowScriptedGeographyName('claims_of_thessalonica_geography')] budú odovzdané ako [ShowSubjectTypeName('fiefdom')] pod [from_country.GetName]" # todo: NEW TRANSLATION
 flavor_mfa.1006.title: "Odpoveď od [from_country.GetLongNameWithNoTooltip]" # todo: NEW TRANSLATION
 flavor_mfa.1006.desc.affirmative: "Občianska vojna rodu [target_character.GetDynasty.GetName] bola odvrátená! Zdá sa, že zradná [from_country.GetAdjective] línia si rozmyslela a rozhodla sa ukončiť svoju agresiu výmenou za presun územia, ktorý sme navrhli." # todo: NEW TRANSLATION
 flavor_mfa.1006.desc.negative: "Tí hanební, zradní [from_country.GetAdjective] [target_character.GetDynasty.GetName] nie sú dôveryhodní! Naša skromná ponuka pokojného riešenia bola odmietnutá. Skutočne, títo [ShowLanguageName('latin_language')] diabli slúžia samotnému Luciferovi!" # todo: NEW TRANSLATION
 flavor_mfa.1006.affirmative: "Dnes prevláda mier." # todo: NEW TRANSLATION
 flavor_mfa.1006.negative: "Zrada od príbuzných bolí najviac." # todo: NEW TRANSLATION

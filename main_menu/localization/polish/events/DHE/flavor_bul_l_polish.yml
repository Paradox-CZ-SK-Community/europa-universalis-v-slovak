l_polish:
 flavor_bul.1.title: "[GetCountry('KVN').GetLongNameWithNoTooltip]" # todo: NEW TRANSLATION
 flavor_bul.1.entry: "Knížatstvo Dobrudža" # todo: NEW TRANSLATION
 flavor_bul.1.desc: "V posledných rokoch oslabená centrálna autorita [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')] viedla k výraznému nárastu vplyvu našich [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]. Najviac je to viditeľné v [ShowProvinceDefinitionName('north_dobruja_province')] a [ShowProvinceDefinitionName('south_dobruja_province')], kde [target_character.GetName] vládne takmer ako nezávislý pán, rozkazujúc miestnym pevnostiam, flotilám a obchodu. Mnohí sa domnievajú, že by sme ich mali formálne akceptovať ako našich vazalov a udeliť im autonómiu, aby sme zabránili odtrhnutiu, iní nás však tlačia, aby sme znovu uplatnili svoju prchavú autoritu nad provinciou." # todo: NEW TRANSLATION
 flavor_bul.1.a: "Uznajme ich autonómiu." # todo: NEW TRANSLATION
 dobrujan_revolt: "Dobrudžské povstanie" # todo: NEW TRANSLATION
 flavor_bul.1.b: "Sú neoddeliteľnou súčasťou ríše." # todo: NEW TRANSLATION
 flavor_bul.1.b.tt: "Všetky [pops|e] v ovládaných lokalitách s jadrom $KVN$ stratia [ShowNamedValue('pop_satisfaction_severe_penalty')|+=2%] [pop_satisfaction|e] a pripoja sa k povstaniu" # todo: NEW TRANSLATION
 flavor_bul.1.c: "Prevezmime žezlo $KVN$." # todo: NEW TRANSLATION
 flavor_bul.1.c.entry: "Prevezmime žezlo $KVN$." # todo: NEW TRANSLATION
 flavor_bul.1.historical_info: "V 14. storočí vznikol Despotát Karvuna v dôsledku postupného rozkladu centrálnej moci v Bulharsku. Hoci pravdepodobne spočiatku fungoval ako polo‑nezávislý vazal, postupne sa stal de facto nezávislým – razil vlastné mince, viedol diplomaciu a samostatne viedol vojny voči Tarnovu." # todo: NEW TRANSLATION
 flavor_bul.2.title: "Zaváhané dedičstvo" # todo: NEW TRANSLATION
 flavor_bul.2.entry: "$flavor_bul.2.title$" # todo: NEW TRANSLATION
 flavor_bul.2.desc: "Keď sa [target_ruler.GetName] starne, jeho myseľ sa čoraz viac obracia k osudu [ROOT.GetCountry.GetName] po jeho smrti. [ROOT.GetCountry.GetGovernment.GetRulerTitle] vyjadril vážne obavy, že po jeho odchode by rivalita medzi jeho synmi mohla vrhnúť [ROOT.GetCountry.GetFlavorRank] do občianskej vojny. Aby sa tomu predišlo, navrhuje sa, aby boli severozápadné země okolo [ShowLocationName('vidin')] zverené [targer_brother.GetName], zatiaľ čo [target_heir.GetName] bude potvrdený ako [ROOT.GetCountry.GetGovernment.GetHeirTitle] na tróne v [ROOT.GetCountry.GetCapital.GetName]." # todo: NEW TRANSLATION
 flavor_bul.2.a: "Nech každý syn vládne v pokoji." # todo: NEW TRANSLATION
 flavor_bul.2.b: "Bude len jeden trón." # todo: NEW TRANSLATION
 flavor_bul.2.c: "Budeme vládnuť z [ShowLocationNameWithNoTooltip('vidin')]." # todo: NEW TRANSLATION
 flavor_bul.2.historical_info: "Fragmentáciu Bulharska počas vlády Ivana Alexandra spôsobil predovšetkým nečakaný úmrtie jeho syna, spolucisára a následníka Michael Asen IV., ktorý zahynul v bitke proti Osmanom. Zrejme obávajúc sa občianskej vojny po jeho smrti, Ivan Alexander rozhodol udeliť titul cára a vládu nad Vidinom svojmu synovi Ivanovi Sratsimirovi, zatiaľ čo jeho druhý syn Ivan Šišman zdedil trón v Tarnove." # todo: CHANGED
 flavor_bul.3.title: "Druhá zlatá doba [ROOT.GetCountry.GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 flavor_bul.3.entry: "$flavor_bul.3.title$" # todo: NEW TRANSLATION
 flavor_bul.3.desc: "[target_ruler.GetName] prejavil ambíciu obnoviť slávne dni vlády Simeona Veľkého, obdobie, keď bolo [ROOT.GetCountry.GetName] centrom vzdelania a kultúry. [target_ruler.GetSheHe|U] chce povzbudiť obnovu našich duchovných a umeleckých tradícií, financovať rekonštrukciu kláštorov a poskytnúť významné prostriedky mníšskym komunitám. Mnohí sa obávajú, že náklady na túto ambíciu budú enormné, ale [ROOT.GetCountry.GetGovernment.GetRulerTitle] verí, že to dlhodobo veľa prinesie [ROOT.GetCountry.GetFlavorRank]." # todo: NEW TRANSLATION
 flavor_bul.3.a: "Schváľme návrh." # todo: NEW TRANSLATION
 flavor_bul.3.b: "Toto vysaje náš štátny poklad." # todo: NEW TRANSLATION
 flavor_bul.3.historical_info: "Na rozdiel od neskorších rokov vlády Ivana Alexandra, ktoré boli poznačené fragmentáciou a úpadkom, jeho skorá vláda znamenala monumentálne oživenie bulharskej kultúry, niekedy nazývané „Druhá zlatá doba Bulharska“. Ivan Alexander podporoval výstavbu a obnovu kláštorov, zaujímal sa o náboženské záležitosti a snažil sa posilniť Bulharskú pravoslávnu cirkev. Bulharsko tiež zažilo nárast literárnej činnosti, čo viedlo k vzniku mnohých rukopisov a kroník." # todo: NEW TRANSLATION
 flavor_bul.4.title: "Evanjeliá cára Ivana Alexandra" # todo: NEW TRANSLATION
 flavor_bul.4.entry: "$flavor_bul.4.title$" # todo: NEW TRANSLATION
 flavor_bul.4.desc: "Rozhodnutie nášho [ROOT.GetCountry.GetGovernment.GetRulerTitle] podporiť kultúrne oživenie [ROOT.GetCountry.GetName] už prináša ovocie. Iluminovaný evanjeliár, venovaný [bul_ivan.GetName], bol vytvorený v [ShowLocationName('tarnovo')] mníchom menom [target_artist.GetShortName] na priamu objednávku [ROOT.GetCountry.GetGovernment.GetAdjective]. Je to jasný dôkaz, že napriek všetkému sme stále schopní vytvárať umenie hodné porovnania s [ShowLocationName('constantinople')] samotným." # todo: CHANGED
 flavor_bul.4.a: "Nádhera!" # todo: NEW TRANSLATION
 flavor_bul.4.historical_info: "„Evanjeliá cára Ivana Alexandra“ sú pravdepodobne najdôležitejším dochovaným dielom zo Secondého Bulharského impéria a jedno z najkrajších diel vyprodukovaných počas tzv. „Druhej zlatej doby“. Rukopis obsahuje celý text evanjelií sprevádzaný 366 bohato detailnými miniaturami." # todo: NEW TRANSLATION
 flavor_bul.5.title: "[ROOT.GetCountry.GetAdjectiveWithNoTooltip]-[GetCountry('TUR').GetAdjectiveWithNoTooltip] vojny" # todo: NEW TRANSLATION
 flavor_bul.5.entry: "Bulharsko-osmanské vojny" # todo: NEW TRANSLATION
 flavor_bul.5.desc_common: "Naše sily sa stretli s [GetCountry('TUR').GetAdjective] armádou pri [target_location.GetName] po prvýkrát v histórii." # todo: NEW TRANSLATION
 flavor_bul.5.desc_victory: "$flavor_bul.5.desc_common$ Aj keď bitka skončila v náš prospech, málo veliteľov verí, že toto víťazstvo znamená koniec zápasu. Sú to silní protivníci, posilnení svojimi vojenskými úspechmi inde. Dnešná bitka môže byť len prvou z mnohých." # todo: NEW TRANSLATION
 flavor_bul.5.desc_defeat: "$flavor_bul.5.desc_common$ Krutý výsledok tejto bitky dokázal, že čelíme disciplinovanému a odhodlanému nepriateľovi. Ak chceme zachovať náš [ROOT.GetCountry.GetFlavorRank], musíme sa pripraviť na dlhý a horký boj proti protivníkovi, ktorého ambície neustále rastú." # todo: NEW TRANSLATION
 flavor_bul.5.a: "Pripravme sa na blížiacu sa búrku." # todo: NEW TRANSLATION
 flavor_bul.5.b: "Iniciatíva musí byť na našej strane." # todo: NEW TRANSLATION
 flavor_bul.5.historical_info: "Bulharsko-osmanské vojny predstavovali zlom v dejinách Bulharska. Keď Osmanovia v 14. storočí expandovali na Balkán, Bulharsko, už vnútornými problémami oslabené a rozdrobené, sa ocitlo na prednej línii vzostupnej veľmoci. Hoci bulharské sily boli niekedy schopné odolávať osmanskému postupu a viedli niekoľko nerozhodných bitiek, nakoniec podľahli prevažujúcim osmanským armádam. Pád Vidinu v roku 1396 priniesol koniec posledných zvyškov bulharskej nezávislosti a znamenal začiatok takmer poltisícročnej osmanskej nadvlády nad bulharskými zemami." # todo: CHANGED
 flavor_bul.6.title: "[ROOT.GetCountry.GetGovernment.GetAdjective|U] rozvod" # todo: NEW TRANSLATION
 flavor_bul.6.entry: "$flavor_bul.6.title$" # todo: NEW TRANSLATION
 flavor_bul.6.desc: "Dvory [ROOT.GetCountry.GetGovernment.GetCourtTitle] otriaslo nedávne vyhlásenie [target_ruler.GetName], ktorý oznámil, že sa chce rozviesť so svojou manželkou [target_oldwife.GetName] a namiesto nej sa oženiť s nízkorodou konvertitkou zo skupiny [ShowCultureGroupName('jewish_group')] menom [target_newwife.GetShortName]. Mnohí sa obávajú, že toto rozhodnutie len ďalej destabilizuje [ROOT.GetCountry.GetFlavorRank] a môže skomplikovať otázku dedičstva tým, že zasieje nezhody medzi kniežatami [ROOT.GetCountry.GetFlavorRank]. Napriek tomu si len málokto trúfne postaviť sa vôli [ROOT.GetCountry.GetGovernment.GetRulerTitle]." # todo: NEW TRANSLATION
 flavor_bul.6.a: "Pokračujme v tomto sobáši." # todo: NEW TRANSLATION
 flavor_bul.6.b: "Hlavne záujmy ríše." # todo: NEW TRANSLATION
 flavor_bul.6.b.entry: "Záujmy ríše sú na prvom mieste." # todo: NEW TRANSLATION
 flavor_bul.6.historical_info: "Manželstvo medzi Ivanom Alexanderom a jeho novou manželkou Sarou-Theodorou prinieslo šesť detí, medzi nimi Ivana Šišmana, ktorý po otcovi nastúpil ako vládca v Tarnove. Predpokladá sa, že Sara-Theodora silno presadzovala, aby hlavný trón zdedil jej syn, čím v podstate vyradila z dedičstva Ivana Sratsimira, ktorý bol najstarším dieťaťom a posledným žijúcim synom Ivanovej bývalej manželky Theodory z Valašska. Toto manželstvo zohralo zásadnú úlohu pri rozdelení Bulharska medzi Tarnovo a Vidin." # todo: CHANGED
 flavor_bul.7.title: "Cisárstvo len v mene" # todo: NEW TRANSLATION
 flavor_bul.7.entry: "$flavor_bul.7.title$" # todo: NEW TRANSLATION
 flavor_bul.7.desc: "Naši panovníci hrdinsky nesú titul cisára, hoci pre cudzincov nie sme cisári — iba králi odetí v vypožičanej veľkoleposti. Cudzinci tvrdia, že tento titul patrí výlučne cisárom [GetCountry('BYZ').GetName] a [GetUniqueInternationalOrganization('hre').GetName]. Rozdiel medzi tým, ako sa vnímame my, a tým, ako nás vidí svet, ohrozuje trón, a musíme urobiť všetko pre to, aby sme si vybudovali legitímnosť." # todo: NEW TRANSLATION
 flavor_bul.7.a: "Donútime ich, aby nás uznali!" # todo: NEW TRANSLATION
 flavor_bul.7.a.tt: "Hoci začíname ako cisárstvo, bonusy nášho vládneho stupňa sú znížené na úroveň kráľovstva\nExistuje niekoľko spôsobov, ako si získať legitimitu a odstrániť [ShowModifier('bul_unrecognized_imperial_title')] [modifier|e] z [ROOT.GetCountry.GetName], a to:\n- Riešením [ShowDisasterName('twilight_of_the_tsardom')] [disaster|e] počas vlastníctva [ShowLocationName('constantinople')] alebo ak ste [great_power|e]\n- Dobytím [ShowLocationName('constantinople')] po vyriešení [ShowDisasterName('twilight_of_the_tsardom')] [disaster|e]\n- Stať sa [great_power|e] po vyriešení [ShowDisasterName('twilight_of_the_tsardom')] [disaster|e]" # todo: NEW TRANSLATION
 flavor_bul.7.historical_info: "V roku 1204 bol bulharský vládca Kaloyan korunovaný pápežským vyslancom, ktorého poslal pápež Inocent III. Počas korunovácie vzniklo napätie, pretože Kaloyanovi bol udelený titul kráľa, nie cisára. Podľa doktríny Cirkvi bol cisársky titul vyhradený výlučne vládcu Svätej Rímskej ríše. Kaloyan toto obmedzenie odmietol a trval na tom, že bol korunovaný za cisára. Takže zatiaľ čo bulharský cisársky titul bol v domovine uznávaný, jeho legitímnosť bola v zahraničí spochybňovaná." # todo: NEW TRANSLATION
 flavor_bul.8.title: "Rozpadávajúce sa cisárstvo" # todo: NEW TRANSLATION
 flavor_bul.8.entry: "$flavor_bul.8.title$" # todo: NEW TRANSLATION
 flavor_bul.8.desc: "Udalosť $twilight_of_the_tsardom.1.title$ sa skončila a [ROOT.GetCountry.GetName] sa zotavilo z desaťročí vnútorných sporov. To isté sa však nedá povedať o [GetCountry('BYZ').GetName], ktoré sú rozdelené a zraniteľné. Udalosti, ktoré sa práve odohrávajú, nám poskytujú jedinečnú príležitosť zaútočiť skôr, než sa impérium zotaví zo svojich rán a okamih nám unikne." # todo: NEW TRANSLATION
 flavor_bul.8.a: "Teraz je čas zaútočiť!" # todo: NEW TRANSLATION
 flavor_bul.8.b: "Ešte nie sme pripravení." # todo: NEW TRANSLATION
 flavor_bul.9.title: "Uznaná veľmoc" # todo: NEW TRANSLATION
 flavor_bul.9.entry: "$flavor_bul.9.title$" # todo: NEW TRANSLATION
 flavor_bul.9.desc: "[ROOT.GetCountry.GetAdjective] $rank_empire_bulgarian$ sa postavilo medzi veľmoci sveta. V mnohých ohľadoch tento okamih zrkadlí slávu Prvého [ROOT.GetCountry.GetAdjectiveWithNoTooltip] cisárstva a možno ho dokonca prevyšuje. Už nemusíme ospravedlňovať naše nároky ani presadzovať našu legitímnosť pred zahraničnými skeptikmi. Naša sila hovorí sama za seba a svet ju teraz uznáva." # todo: NEW TRANSLATION
 flavor_bul.9.a: "Nech žije $rank_empire_bulgarian$!" # todo: NEW TRANSLATION
 flavor_bul.1000.title: "Pád [ShowLocationNameWithNoTooltip('constantinople')]" # todo: CHANGED
 flavor_bul.1000.entry: "$flavor_bul.1000.title$" # todo: NEW TRANSLATION
 flavor_bul.1000.desc: "Konečne padli múry [ShowLocationName('constantinople')] pred mocou [ROOT.GetCountry.GetName]. Kedysi mohutné mesto teraz vstupuje do novej éry, odlišnej od predchádzajúcich storočí, ktoré priniesli [ShowReligionAdjective('orthodox')] svetu len úpadok, poníženie a slabosť. Fénix bol navždy premenený na popol, a od dnešného dňa bude [target_ruler.GetName] zapamätaný ako $STATIC_MODIFIER_NAME_bul_conqueror_of_constantinople$. Už nikdy nebude spochybňovaná legitimita nášho cisárskeho titulu!" # todo: CHANGED
 flavor_bul.1000.a: "Vyhlásme zrod novej ríše!" # todo: NEW TRANSLATION
 flavor_bul.1000.a.tt: "Všetky susedné [countries|e], ktoré s nami nemajú [alliance|e] alebo nie sú našimi [subject|e] štátmi, ako aj každý z našich [rivals|e], získajú [ShowBiasValue('opinion_bul_proclaimed_an_empire')|+=] [opinion|e] voči nám." # todo: CHANGED
 flavor_bul.1000.b: "Naše víťazstvo nepotrebuje veľké tituly." # todo: NEW TRANSLATION
 flavor_bul.1001.title: "Mesto cisárov" # todo: NEW TRANSLATION
 flavor_bul.1001.desc: "Náš vzostup k imperiálnej veľkosti zmenil postavenie [ROOT.GetCountry.GetName] vo svete. S týmto novým prestížom si mnohí v [ROOT.GetCountry.GetGovernment.GetCourtTitle] začali klásť otázku, či [ROOT.GetCountry.GetCapital.GetName] skutočne odráža slávu a autoritu [ROOT.GetCountry.GetLongNameWithNoTooltip]. Navrhujú presun hlavného mesta do [ShowLocationName('constantinople')], ktoré už stáročia stojí ako politické a duchovné srdce pravoslávneho sveta." # todo: NEW TRANSLATION
 flavor_bul.1001.a: "Potrebujeme hlavné mesto hodné ríše!" # todo: NEW TRANSLATION
 flavor_bul.1001.b: "[ROOT.GetCountry.GetCapital.GetNameWithNoTooltip] nám dobre slúži." # todo: NEW TRANSLATION
 flavor_bul.1001.b.entry: "Hlavné mesto nám dobre slúži." # todo: NEW TRANSLATION
 flavor_bul.1001.historical_info: "Historicky mnohé mocnosti túžili po Konštantínopole, Bulharsko nebolo výnimkou. V priebehu storočí sa niekoľko bulharských panovníkov pokúšalo priviesť veľké mesto pod svoju kontrolu, no nikomu sa to nepodarilo. Najpozoruhodnejšie úsilie prišlo počas vlády Simeona Veľkého. Hoci mesto samotné zostalo nepodmanené, vojna sa napriek tomu skončila hlbokým byzantským ponížením. Impérium bolo prinútené uznať Simeonov cisársky titul, uznávajúc ho za cára a účinne povýšilo Bulharsko na úroveň veľmoci na Balkáne." # todo: CHANGED

l_polish:
 flavor_tri.1.title: "#italic Codex Balduini Trevirensis#!" # todo: NEW TRANSLATION
 flavor_tri.1.desc: "Boli sme obdarovaní nádhernou kronikou zobrazujúcou osudový okamih v našej dynastickej histórii! Popisujúca taliansku kampaň [GetCharacter('lux_henry_vii_luxembourg').GetName], prvého cisára nášho rodu, zdôrazňuje vznešené postavenie našej rodiny a jej oprávnený nárok na cisársky trón. Hoci si umelec želá zostať neznámy, jeho zobrazenia korunovácií [GetCharacter('lux_henry_vii_luxembourg').GetNameWithNoTooltip] a Kolégia voliteľov upevňujú našu pozíciu v rámci [GetInternationalOrganization('hre').GetName]." # todo: NEW TRANSLATION
 flavor_tri.1.a: "Ozdobí náš [ROOT.GetCountry.GetGovernment.GetCourtTitle] v [target_location.GetNameWithNoTooltip]." # todo: NEW TRANSLATION
 flavor_tri.1.b: "Darujte ho [GetInternationalOrganization('hre').GetLeaderTitle]." # todo: NEW TRANSLATION

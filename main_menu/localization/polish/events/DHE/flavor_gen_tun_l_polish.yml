l_polish:
 flavor_gen_tun.1.title: "Sústo na dosah" # todo: NEW TRANSLATION
 flavor_gen_tun.1.entry: "$flavor_gen_tun.1.title$" # todo: NEW TRANSLATION
 flavor_gen_tun.1.desc: "Starobylý a krásny [target_location.GetRank.GetName] [target_location.GetName] sa týči nad [ShowLocationName('cape_tajura')]. Napriek svojmu významu pre hospodárstvo [ShowScriptedGeographyName('mediterranean_sea_geography')] zostáva v rukách [target_country.GetLongName], štátu príliš slabého na to, aby sám odolal našej invázii. Mohli by sme sa vylodiť v [ShowProvinceDefinitionName('tripolitania_province')], vyplieniť pobrežie a potom svoje výboje vydražiť susednému štátu — alebo si ich azda nechať." # todo: NEW TRANSLATION
 flavor_gen_tun.1.a: "Výborný nápad!" # todo: NEW TRANSLATION
 flavor_gen_tun.1.b: "Takéto príležitosti sú pre vojnových štváčov." # todo: NEW TRANSLATION
 flavor_gen_tun.2.title: "Predaj $tripoli$" # todo: NEW TRANSLATION
 flavor_gen_tun.2.entry: "$flavor_gen_tun.1.title$" # todo: NEW TRANSLATION
 flavor_gen_tun.2.desc: "Po dobytí a vyplienení [target_location.GetName] teraz náš [ROOT.GetCountry.GetFlavorRank] vlastní rozsiahlu kolóniu v oblasti [target_location.GetArea.GetName] — krajinu, ktorá sa kultúrne aj nábožensky výrazne líši od našej metropoly v [ROOT.GetCountry.GetCapital.GetAltAdjective('L')]. Možno by sme mali jej vlastníctvo previesť na jeden zo susedných kmeňov." # todo: NEW TRANSLATION # todo: COUNTRY CASE
 flavor_gen_tun.2.a: "Predajme ju susednému kmeňu Banū Ṯābit." # todo: NEW TRANSLATION
 flavor_gen_tun.2.b: "Možno by Banū Makkī mali záujem kúpiť svoje územia späť." # todo: NEW TRANSLATION
 flavor_gen_tun.2.c: "Sme si istí, že [tunis_location.GetOwner.GetLongNameWithNoTooltip] by mal záujem." # todo: NEW TRANSLATION
 flavor_gen_tun.2.d: "[target_location.GetNameWithNoTooltip] patrí nám!" # todo: NEW TRANSLATION
 flavor_gen_tun.2.d.entry: "$tripoli$ patrí nám!" # todo: NEW TRANSLATION
 sale_of_tripoli_tt: "Predáme naše kolónie v [target_location.GetName] za [SCOPE.GetLocalVariable('proposed_price_of_sale').GetValue|+] [gold_i|e] [Concept('gold','dukáty')|e] a prevedieme všetky pripojené [Concept('locations','lokality')|e] — celkovo #Y [SCOPE.GetLocalVariable('num_of_locations_to_be_sold').GetValue]#! [Concept('locations','lokality')|e]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 flavor_gen_tun.3.title: "$flavor_gen_tun.2.title$" # todo: NEW TRANSLATION
 flavor_gen_tun.3.desc: "Vyslanec z [from_country.GetName] dorazil do [ROOT.GetCountry.GetCapital.GetAltAdjective('G')] s ponukou predať nám svoje územia v [target_location.GetName] za značnú sumu. Hodnotu [target_location.GetRank.GetName] však nemožno podceňovať — pre [ROOT.GetCountry.GetFlavorRank] by to bola výhodná kúpa." # todo: NEW TRANSLATION # todo: COUNTRY CASE
 flavor_gen_tun.3.desc_banu_makki: "Drzosť, ktorú prejavil [from_country.GetLongName], si zaslúži trest priamo od [ROOT.GetCountry.GetReligion.GetGodName]! Dobývajú náš krásny [target_location.GetRankAndName] a teraz nám dávajú „možnosť“ zaplatiť za jeho navrátenie. Najhoršie na tom je, že by sme ich ponuku mohli skutočne prijať..." # todo: NEW TRANSLATION
 flavor_gen_tun.3.a: "Dobre teda, súhlasíme." # todo: NEW TRANSLATION
 flavor_gen_tun.3.b: "Prečo by sme mali platiť za niečo, čo môžeme dobyť?" # todo: NEW TRANSLATION
 flavor_gen_tun.3.c: "Pri všetkej úcte, nezaujíma nás to." # todo: NEW TRANSLATION

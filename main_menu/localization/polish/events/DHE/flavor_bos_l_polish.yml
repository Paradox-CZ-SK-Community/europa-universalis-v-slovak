l_polish:
 flavor_bos.1.title: "Túžba po nezávislosti" # todo: NEW TRANSLATION
 flavor_bos.1.entry: "$flavor_bos.1.title$" # todo: NEW TRANSLATION
 flavor_bos.1.desc: "Smrť [hun_robert.GetName] otvorila príležitosť, aká tu ešte nebola. Keďže [GetCountry('HUN').GetName] je oslabené a rozptýlené, [target_ruler.GetName] začal si predstavovať [ROOT.GetCountry.GetName] slobodné od [GetCountry('HUN').GetAdjectiveWithNoTooltip] vlády. Namiesto otvoreného povstania sa navrhlo, aby sme začali potichu podrývať ich autoritu a viesť diplomatické rokovania s ich nepriateľmi, ktorí by sa nám mohli hodiť v našom úsilí o slobodu." # todo: NEW TRANSLATION
 flavor_bos.1.a: "Musíme využiť túto príležitosť." # todo: NEW TRANSLATION
 flavor_bos.1.b: "Zostaneme verní [GetCountry('HUN').GetAdjectiveWithNoTooltip] [GetCountry('HUN').GetGovernment.GetEstateNameWithNoTooltip('crown_estate')]." # todo: NEW TRANSLATION
 flavor_bos.1.b.entry: "Zostaneme verní $HUN_ADJ$ $crown_estate$." # todo: NEW TRANSLATION
 flavor_bos.1.a.tt: "Pokračujúce podkopávanie [GetCountry('HUN').GetAdjectiveWithNoTooltip] autority, ako napríklad zlepšovanie vzťahov s ich rivalmi a znižovanie našej lojality, by mohlo prinútiť [GetCountry('HUN').GetNameWithNoTooltip] prehodnotiť náš status ich poddaného." # todo: NEW TRANSLATION
 flavor_bos.1.historical_info: "Panovanie Štefana II. bolo poznačené výrazným úsilím oslobodiť Bosnu od uhorskej nadvlády prostredníctvom hrania Maďarska proti jeho rivalom. Po úmrtí kľúčových uhorských spojencov, ako kráľa Karola Róberta a Mikáča zo Slavónie, Štefan začal využívať uhorské vojny s Benátkami prostredníctvom úplatkov, zadržanej lojality a dokonca únikov informácií o vojenských postaveniach. Tieto činy mu vyniesli prezývku 'Diablov žiak' a spôsobili, že nový uhorský kráľ mu nedôveroval, no vyčerpaná koruna nemala silu ani vôľu ho odstrániť. Na konci jeho panovania sa uhorská autorita nad Bosnou stala čisto nominálnou." # todo: NEW TRANSLATION
 flavor_bos.2.title: "Úpadok [GetCountry('SER').GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 flavor_bos.2.entry: "Úpadok Srbska" # todo: NEW TRANSLATION
 flavor_bos.2.desc: "Po úmrtí [ser_dusan.GetName] čelí [GetCountry('SER').GetName] dlhým rokom vnútorných bojov. Slabnúca vládnuca autorita spôsobila, že niekoľko miestnych pánov bojovalo o moc, hoci žiadny z nich nevlastní dynastickú legitimitu ani právomoc nárokovať si trón. Keďže naši vládcovia majú dynastické väzby na vládnuci rod [ser_dusan.GetDynasty.GetName], môžeme legitímne uplatniť nárok na ich korunu." # todo: NEW TRANSLATION
 flavor_bos.2.a: "Využiť ich rozdrobenosť na rozšírenie nášho vplyvu." # todo: NEW TRANSLATION
 flavor_bos.2.b: "Zamerajme sa na naše vnútorné záležitosti." # todo: NEW TRANSLATION
 flavor_bos.2.historical_info: "Vyhynutie dynastie Nemanjićovcov zanechalo srbský trón v podstate prázdny, pričom miestne rody vládli rozdrobeným častiam bývalého impéria. Tvrtko I. využil tento mocenský vákuum a vďaka svojmu nemanjićskému pôvodu po otcovej matke si uplatnil nárok na srbskú korunu a usiloval sa rozšíriť vplyv Bosny na východ." # todo: NEW TRANSLATION
 flavor_bos.3.title: "Prvý kráľ [ROOT.GetCountry.GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 flavor_bos.3.entry: "$flavor_bos.3.title$" # todo: NEW TRANSLATION
 flavor_bos.3.desc: "Naša úspešná kampaň priniesla do našich rúk rozsiahle územia bývalých [GetCountry('SER').GetAdjective] krajín. Tento triumf posmelil [target_ruler.GetName], aby prišiel s odvážnym návrhom. [target_ruler.GetSheHe|U] si nielen želá oficiálne prevziať kráľovskú hodnosť nad [GetCountry('SER').GetNameWithNoTooltip], ale aj povýšiť [ROOT.GetCountry.GetName] na kráľovské postavenie a stať sa prvým kráľom, akého naša krajina kedy mala." # todo: NEW TRANSLATION
 flavor_bos.3.a: "Naša krajina potrebuje kráľa." # todo: NEW TRANSLATION
 flavor_bos.3.b: "Koruna prináša viac starostí než moci." # todo: NEW TRANSLATION
 flavor_bos.3.historical_info: "Na začiatku 70. rokov 14. storočia sa bývalá srbská ríša rozpadla a bola rozdelená medzi mnohých miestnych pánov, vrátane Tvrtka z Bosny. Tvrtkova pozícia však bola zásadne odlišná. Už vládol nezávislému štátu, ktorý zahŕňal významné územia bývalej srbkej ríše. Ešte dôležitejšie bolo, že sa odvolával na dynastický pôvod z rodu Nemanjićovcov, čo mu dávalo legitimitu, akú žiadny iný srbský pán nemal. Na základe týchto práv jeho dvor formuloval základy pre jeho korunováciu a právo na dvojitú korunu, čo vyústilo do korunovania Tvrtka za kráľa Srbov a Bosny na jeseň roku 1377." # todo: NEW TRANSLATION
 flavor_bos.4.title: "Zasadnutie Strojnici" # todo: NEW TRANSLATION
 flavor_bos.4.entry: "$flavor_bos.4.title$" # todo: NEW TRANSLATION
 flavor_bos.4.desc: "Strojnici, starší predstavitelia [ROOT.GetCountry.GetAdjective] cirkvi, sa zišli, aby prediskutovali budúci smer našej viery. Dlhodobé spory, otázky doktríny a mnohé ďalšie problémy sú pred radou otvorené." # todo: NEW TRANSLATION
 flavor_bos.4.a: "Cirkvi treba predovšetkým stabilita." # todo: NEW TRANSLATION
 flavor_bos.4.b: "Mali by sme pracovať na objasnení našich doktrín." # todo: NEW TRANSLATION
 flavor_bos.4.c: "Zamerať sa na riešenie vnútorných sporov." # todo: NEW TRANSLATION
 flavor_bos.4.d: "Postarajme sa o majetok cirkvi." # todo: NEW TRANSLATION
 flavor_bos.5.title: "Osud [ROOT.GetCountry.GetAdjectiveWithNoTooltip] cirkvi" # todo: NEW TRANSLATION
 flavor_bos.5.entry: "$flavor_bos.5.title$" # todo: NEW TRANSLATION
 flavor_bos.5.desc: "Narastajúci tlak [GetUniqueInternationalOrganization('catholic_church').GetName] na našu [ROOT.GetCountry.GetFlavorRank] je čoraz ťažšie znášať. Doručili sa k nám správy, že [target_pope.GetName] opäť uvažuje o križiackej výprave proti [ROOT.GetCountry.GetName], obviňujúc nás, že skrývame nebezpečné kacírske názory. Po generácie sme bránili prežitie našej domácej cirkvi, ale možno nastal čas sa podriadiť a zabezpečiť si miesto medzi národmi [ShowReligionAdjective('catholic')] sveta." # todo: NEW TRANSLATION
 flavor_bos.5.a: "Naša cirkev pretrvá!" # todo: NEW TRANSLATION
 flavor_bos.5.b: "Pridajme sa k [ShowReligionAdjectiveWithNoTooltip('catholic')] svetu." # todo: NEW TRANSLATION
 flavor_bos.5.c: "Namiesto toho sa obrátime na [ShowLocationNameWithNoTooltip('constantinople')]." # todo: NEW TRANSLATION
 flavor_bos.5_catholic_unhappy: "Všetci [ShowReligionAdjective('catholic')] [Concept('pops','populácie')|e] stratia [ShowNamedValue('pop_satisfaction_severe_penalty')|+=2%] [Concept('pop_satisfaction','spokojnosť populácie')|e]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 flavor_bos.5_krstjani_unhappy: "Všetci [ShowReligionAdjective('bosnian_church')] [Concept('pops','populácie')|e] stratia [ShowNamedValue('pop_satisfaction_severe_penalty')|+=2%] [Concept('pop_satisfaction','spokojnosť populácie')|e]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 flavor_bos.5_orthodox_unhappy: "Všetci [ShowReligionAdjective('orthodox')] [Concept('pops','populácie')|e] stratia [ShowNamedValue('pop_satisfaction_severe_penalty')|+=2%] [Concept('pop_satisfaction','spokojnosť populácie')|e]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 flavor_bos.5.historical_info: "Bosnianska cirkev sa stala trvalým terčom kritiky a zásahov zo strany pápežstva, keď bola často obviňovaná z uctievania kacírskych nauk. V roku 1203 zástupcovia cirkvi podpísali Abjuráciu Bilno Polje, v ktorej súhlasili zanechať praktiky považované za heretické a prispôsobiť sa katolíckej doktríne. Napriek tomu si mnohí v tajnosti zachovali svoje tradičné praktiky. V roku 1337 pápež Benedikt XII. vyhlásil ďalšiu križiacku výpravu, no snahy nakoniec zlyhali. Bosnianska cirkev prežila až do osmanského obsadenia regiónu." # todo: NEW TRANSLATION

l_polish:
 flavor_ach.1.title: "Útek [target_country.GetAdjectiveWithNoTooltip] [target_country.GetGovernment.GetRulerTitle]" # todo: NEW TRANSLATION
 flavor_ach.1.entry: "Útek epirotského dediča" # todo: NEW TRANSLATION
 flavor_ach.1.desc: "Po [target_country2.GetAdjective] invázii do [target_country.GetName] bol oprávnený dedič [target_character.GetFather.GetName], [target_character.GetShortName], zosadený [GetCharacter('byz_andronikos_iii_palaiologos').GetName] a nahradený súčasným [target_country2.GetAdjectiveWithNoTooltip] guvernérom, [GetCharacter('epi_theodoros_synadenos').GetName]. Našťastie bol [target_character.GetShortNameWithNoTooltip] prepašovaný z krajiny anti-[target_country2.GetAdjectiveWithNoTooltip] frakciou a privedený pred [target_character2.GetName]." # todo: NEW TRANSLATION
 flavor_ach.1.a: "Panstvo [target_country.GetAdjectiveWithNoTooltip] patrí [target_character.GetNameWithNoTooltip]!" # todo: NEW TRANSLATION
 flavor_ach.1.a.entry: "Ich panstvo patrí jemu!" # todo: NEW TRANSLATION
 flavor_ach.1.b: "[target_country.GetNameWithNoTooltip] sú strateným prípadom." # todo: NEW TRANSLATION
 flavor_ach.1.b.entry: "Sú strateným prípadom." # todo: NEW TRANSLATION
 flavor_ach.2.title: "Podporovaný [target_country.GetAdjectiveWithNoTooltip] nárokovač" # todo: NEW TRANSLATION
 flavor_ach.2.desc: "Posledný latinský monarcha [target_country.GetName], mladý [target_character.GetName], bol prepašovaný z krajiny do [target_country3.GetName], kde [target_country3.GetGovernment.GetRulerTitle] bol naklonený na stranu [target_character.GetHerHis]. Niet o tom pochýb — [target_country3.GetLongName] bude usilovať o obnovenie zosadeného dediča.\n\nMusíme sa mať na pozore pred akoukoľvek inváziou, pretože [target_character2.GetName] by mohol zaútočiť v našom momente slabosti." # todo: NEW TRANSLATION
 flavor_ach.2.a: "Nech sa pokúsia!" # todo: NEW TRANSLATION
 flavor_ach.3.title: "Slabnúci latinský vplyv" # todo: NEW TRANSLATION
 flavor_ach.3.desc: "Napriek tomu, že menovite je [ROOT.GetCountry.GetName] pod vládou latinskej dynastie [target_character.GetDynasty.GetName], vplyv tejto vládnucej dynastie už mnoho rokov ustavične klesá. [ROOT.GetCountry.GetCulture.GetName] [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] sú často považovaní za neprítomných a hluchých k útrapám [ShowCultureName('greek_culture')] bežného ľudu. Ľud z rôznych vrstiev spoločnosti sa preto obrátil na podporu [target_character2.GetName], helénskeho nárokovača, ktorý by mohol oslobodiť [ROOT.GetCountry.GetName] spod frankovského jha." # todo: NEW TRANSLATION
 flavor_ach.3.a: "Preč s dynastiou [target_character.GetDynasty.GetNameWithNoTooltip]!" # todo: NEW TRANSLATION
 flavor_ach.3.a.entry: "Preč s dynastiou!" # todo: NEW TRANSLATION
 flavor_ach.3.b: "Potlačte toto hnutie!" # todo: NEW TRANSLATION
 flavor_ach.4.title: "Vplyv latinskej cisárovnej v [ShowScriptedGeographyNameWithNoTooltip('greece_geography')]" # todo: NEW TRANSLATION
 flavor_ach.4.entry: "$flavor_ach.4.title$" # todo: NEW TRANSLATION
 flavor_ach.4.desc: "Napriek pádu [ShowFormableCountryName('LAT_f')] v roku 1261 jeho odkaz pretrváva v nepretržitej línii titulárnych cisárov až po súčasnú cisárovnú — [target_character.GetName]. Hoci iba titulárna, dynastia [target_character.GetDynasty.GetName] si stále zachováva veľký rešpekt medzi latinskými štátmi a stále vládne [ROOT.GetCountry.GetLongName] — jednému z najsilnejších pozostatkov Ríše." # todo: NEW TRANSLATION
 flavor_ach.4.a: "[ShowFormableCountryNameWithNoTooltip('LAT_f')] bude obnovená!" # todo: NEW TRANSLATION
 flavor_ach.5.title: "Titulárny [GetCountry('LAT').GetFlavorRank]" # todo: NEW TRANSLATION
 flavor_ach.5.entry: "Titulárne impérium" # todo: NEW TRANSLATION
 flavor_ach.5.desc: "Keďže si [scope_ruler.GetName] zachoval titul [GetCountry('LAT').GetAdjectiveWithNoTooltip] [GetCountry('LAT').GetGovernment.GetRulerTitle] [GetCountry('LAT').GetLongName], aj keď len titulárne, udržiaval značný vplyv medzi zostávajúcou [GetCountry('LAT').GetAdjectiveWithNoTooltip] elitou v [ShowScriptedGeographyName('greece_geography')], ako aj svoje väzby v [naples_country.GetName]. Hoci machinácie a manévre [scope_philip_latin_emperor.GetName] mali zhromaždiť silu schopnú získať ríšu späť, tieto plány boli po jeho smrti opustené.\n\nPo uzavretí dohody so [scope_alb_king.GetName] boli práva na [albania_country.GetName] predané [scope_alb_king.GetShortNameWithNoTooltip] a územia [ROOT.GetCountry.GetName] udelené [ach_heir.GetName], nad ktorými [scope_ruler.GetShortNameWithNoTooltip] pokračoval oficiálne vládnuť.\n\nSo [ShowCultureName('catalan')] kompániou v [ath_country.GetName] a povestami o nestabilite v [byz_country.GetGovernment.GetCourtTitle] [byz_country.GetName] poradcovia blízki [scope_ruler.GetNameWithNoTooltip] naznačujú, že by sa čoskoro mohla naskytnúť príležitosť obnoviť [GetCountry('LAT').GetLongNameWithNoTooltip], tak ako to predvídal [scope_philip_latin_emperor.GetShortNameWithNoTooltip]." # todo: NEW TRANSLATION
 flavor_ach.5.a: "Sústredime sa na zabezpečenie miestnej elity." # todo: NEW TRANSLATION
 flavor_ach.5.b: "Získajme diplomatickú podporu naprieč [ShowScriptedGeographyNameWithNoTooltip('greece_geography')]." # todo: NEW TRANSLATION
 flavor_ach.5.c: "The [ROOT.GetCountry.GetGovernment.GetCourtTitle] should begin laying the groundwork for restoration." # todo: NEW TRANSLATION
 flavor_ach.5.c.entry: "Dvor by mal začať pripravovať pôdu pre obnovu." # todo: NEW TRANSLATION
 flavor_ach.6.title: "Väzby na [naples_country.GetGovernment.GetCourtTitle] v [naples_country.GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 flavor_ach.6.entry: "Väzby na neapolský dvor" # todo: NEW TRANSLATION
 flavor_ach.6.desc: "Aj keď [scope_ruler.GetName] prevzal zodpovednosť za správu [ROOT.GetCountry.GetName], zachoval si značný vplyv na [naples_country.GetGovernment.GetCourtTitle] v [naples_country.GetNameWithNoTooltip], ako aj blízky vzťah s [nap_ruler.GetName]. Hľadajúc posilnenie vlády dynastie [scope_ruler.GetDynasty.GetName] v [ShowScriptedGeographyName('greece_geography')], niektorí poradcovia navrhujú, aby [scope_ruler.GetShortNameWithNoTooltip] využil [scope_ruler.GetHisHer] vplyv na získanie podpory medzi bohatou [naples_country.GetAdjectiveWithNoTooltip] elitou." # todo: NEW TRANSLATION
 flavor_ach.6.a: "[scope_ruler.GetShortNameWithNoTooltip] by mal získať priazeň [naples_country.GetAdjectiveWithNoTooltip] [naples_country.GetGovernment.GetCourtTitle]." # todo: NEW TRANSLATION
 flavor_ach.6.a.entry: "Vládca by mal získať priazeň $NAP_ADJ$ dvora." # todo: NEW TRANSLATION
 flavor_ach.6.b: "Využite vplyv [scope_ruler.GetShortNameWithNoTooltip] na získanie finančnej podpory." # todo: NEW TRANSLATION
 flavor_ach.6.b.entry: "Využite jeho vplyv na získanie finančnej podpory." # todo: NEW TRANSLATION
 flavor_ach.6.c: "Povesť [scope_ruler.GetShortNameWithNoTooltip] by sa lepšie využila na posilnenie [ROOT.GetCountry.GetAdjectiveWithNoTooltip] [ROOT.GetCountry.GetGovernment.GetCourtTitle]." # todo: NEW TRANSLATION
 flavor_ach.6.c.entry: "Jeho povesť by sa lepšie využila na posilnenie nášho dvora." # todo: NEW TRANSLATION
 flavor_ach.7.title: "[nikephoros_ii_orsini.GetNameWithNoTooltip] a [epirus_country.GetLongNameWithNoTooltip]" # todo: NEW TRANSLATION
 flavor_ach.7.entry: "Odtrhnutie v Epire" # todo: NEW TRANSLATION
 flavor_ach.7.desc: "Keďže [nikephoros_ii_orsini.GetName] zostal niekoľko časov po svojom vyhnanstve na [ROOT.GetCountry.GetGovernment.GetCourtTitle] v [ROOT.GetCountry.GetName], ukázal sa byť cenným politickým aktívom pre [scope_ruler.GetName] proti [byz_country.GetAdjective] elite. Do [ROOT.GetCountry.GetGovernment.GetCourtTitle] však dorazili správy, že chvíľa na obnovenie vlády [nikephoros_ii_orsini.GetLastNameWithNoTooltip] sa môže blížiť, pretože niekoľko [epirus_country.GetAdjective] [epirus_country.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')] získalo dostatočnú podporu na vypuknutie povstania proti [byz_country.GetAdjectiveWithNoTooltip] guvernérovi.\n\nVnímajúc to ako príležitosť na ďalšie zasievanie rozporov v [byz_country.GetNameWithNoTooltip], mnohí na [ROOT.GetCountry.GetGovernment.GetCourtTitle] naliehajú na [scope_ruler.GetNameWithNoTooltip], aby využil túto príležitosť a umožnil návrat [nikephoros_ii_orsini.GetLastNameWithNoTooltip] do [epirus_country.GetNameWithNoTooltip]." # todo: NEW TRANSLATION
 flavor_ach.7.a: "Dovoľme [nikephoros_ii_orsini.GetLastNameWithNoTooltip] vrátiť sa do [epirus_country.GetNameWithNoTooltip] s našou podporou." # todo: NEW TRANSLATION
 flavor_ach.7.a.entry: "Dovoľme $Orsini$ vrátiť sa do $EPI$ s našou podporou." # todo: NEW TRANSLATION
 flavor_ach.7.b: "Namiesto toho ponúknuť presadzovanie nároku na [epirus_country.GetNameWithNoTooltip] pre [nikephoros_ii_orsini.GetShortNameWithNoTooltip]." # todo: NEW TRANSLATION
 flavor_ach.7.b.entry: "Namiesto toho ponúknuť uplatnenie nároku na $EPI$ pre $name_nikephoros.greek_language$." # todo: NEW TRANSLATION
 flavor_ach.7.c: "Pre túto chvíľu je to príliš riskantné." # todo: NEW TRANSLATION
 variable_orsini_in_achaea_tt: "Nikephoros Orsini mieri na Epirus" # todo: NEW TRANSLATION
 nikephoros_ii_orsini_revolt: "Orsiniho povstanie" # todo: NEW TRANSLATION
 flavor_ach.8.title: "[nikephoros_ii_orsini.GetNameWithNoTooltip] znovu získava [epirus_country.GetNameWithNoTooltip]!" # todo: NEW TRANSLATION
 flavor_ach.8.entry: "$name_nikephoros.greek_language$ $Orsini$ získa späť $EPI$!" # todo: NEW TRANSLATION
 flavor_ach.8.desc: "Do [ROOT.GetCountry.GetAdjective] [ROOT.GetCountry.GetGovernment.GetCourtTitle] prišli správy, že stúpenci [nikephoros_ii_orsini.GetLastNameWithNoTooltip] úspešne získali späť jeho sídlo v [epirus_country.GetName] a využili príležitosť odtrhnúť [epirus_country.GetNameWithNoTooltip] od [byz_country.GetName]! Aj keď je to bezpochyby veľké víťazstvo pre [scope_ruler.GetName] na oslabenie [byz_country.GetAdjectiveWithNoTooltip] [byz_country.GetGovernment.GetCourtTitle], niektorí v [ROOT.GetCountry.GetGovernment.GetCourtTitle] naliehajú na [scope_ruler.GetShortNameWithNoTooltip], aby uchopil [epirus_country.GetNameWithNoTooltip] skôr, než [nikephoros_ii_orsini.GetShortNameWithNoTooltip] stihne konsolidovať svoju moc." # todo: NEW TRANSLATION
 flavor_ach.8.a: "Namiesto toho uzavorme formálne spojenectvo s [epirus_country.GetNameWithNoTooltip]." # todo: NEW TRANSLATION
 flavor_ach.8.a.entry: "Namiesto toho uzavorme formálne spojenectvo s $EPI$." # todo: NEW TRANSLATION
 flavor_ach.8.b: "Budeme udržiavať len blízke vzťahy s [nikephoros_ii_orsini.GetLastNameWithNoTooltip]." # todo: NEW TRANSLATION
 flavor_ach.8.b.entry: "Budeme udržiavať len blízke vzťahy s $Orsini$." # todo: NEW TRANSLATION
 flavor_ach.8.c: "Teraz je naša šanca zaútočiť!" # todo: NEW TRANSLATION
 variable_supported_orsini_revolt_tt: "Podporili sme Orsiniho povstanie" # todo: NEW TRANSLATION
 flavor_ach.9.title: "Povstanie v [epirus_country.GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 flavor_ach.9.desc: "Hrozné správy! [epirus_country.GetAdjective] [epirus_country.GetGovernment.GetEstateName('nobles_estate')] za podpory [ach_scope_ruler.GetName] vyvolali povstanie s cieľom získať [epirus_country.GetName] pre [nikephoros_ii_orsini.GetName]. [epi_scope_ruler.GetName] požiadal [ROOT.GetCountry.GetName], aby okamžite zasiahlo a potlačilo povstanie." # todo: NEW TRANSLATION
 flavor_ach.9.a: "Podporte [epirus_country.GetAdjectiveWithNoTooltip] guvernéra!" # todo: NEW TRANSLATION
 flavor_ach.9.a.entry: "Podporte $EPI_ADJ$ guvernéra!" # todo: NEW TRANSLATION
 flavor_ach.9.b: "To nie je naša záležitosť." # todo: NEW TRANSLATION
 flavor_ach_9_tt: "Ak [nikephoros_ii_orsini.GetName] vyhrá, [epirus_country.GetName] sa stane nezávislým" # todo: NEW TRANSLATION
 flavor_ach.10.title: "Znovudobytie Peloponézu" # todo: NEW TRANSLATION
 flavor_ach.10.entry: "$flavor_ach.10.title$" # todo: NEW TRANSLATION
 flavor_ach.10.desc: "Po úspechu štvrtej križiackej výpravy v roku 1204 sa [ShowAreaName('morea_area')] stala jednou z mnohých oblastí, ktoré križiaci dobyli po páde [byz_country.GetName]. Avšak v posledných desaťročiach si [byz_country.GetAdjectiveWithNoTooltip] elita znovu získala časti regiónu, hoci väčšina stále zostáva pod kontrolou [ROOT.GetCountry.GetAdjective].\n\nS povestami o nestabilite, ktorá sužuje [byz_country.GetAdjectiveWithNoTooltip] [byz_country.GetGovernment.GetCourtTitle], niekoľko poradcov v [ROOT.GetCountry.GetGovernment.GetCourtTitle] verí, že teraz by bol vhodný čas na spustenie kampane na znovudobytie stratených území a vytlačenie [byz_country.GetAdjectiveWithNoTooltip] vplyvu z [ShowAreaNameWithNoTooltip('morea_area')] nadobro." # todo: NEW TRANSLATION
 flavor_ach.10.a: "Teraz je čas zatlačiť späť [byz_country.GetLongNameWithNoTooltip]!" # todo: NEW TRANSLATION
 flavor_ach.10.a.entry: "Teraz je čas zatlačiť späť $BYZ$!" # todo: NEW TRANSLATION
 flavor_ach.10.b: "Počkajte, či sa povesti o [byz_country.GetAdjectiveWithNoTooltip] nestabilite nepotvrdia." # todo: NEW TRANSLATION
 flavor_ach.10.b.entry: "Počkajte, či povesti o $BYZ_ADJ$ nestabilite neprinesú výsledky." # todo: NEW TRANSLATION
 flavor_ach.11.title: "Rozsiahla nestabilita v [byz_country.GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 flavor_ach.11.entry: "Využiť byzantskú občiansku vojnu" # todo: NEW TRANSLATION
 flavor_ach.11.desc: "Hoci [ROOT.GetCountry.GetAdjective] špióni na [byz_country.GetGovernment.GetCourtTitle] v [byz_country.GetName] už dlhšie prinášajú správy o politickej nestabilite, nedávne správy naznačujú, že [byz_country.GetAdjectiveWithNoTooltip] [byz_country.GetGovernment.GetEstateName('nobles_estate')] sú rozhorčení na vládnucu dynastiu [byz_ruler.GetDynasty.GetName] a teraz plánujú prevrat.\n\nVnímajúc to ako predohru k možnej občianskej vojne v [byz_country.GetNameWithNoTooltip], niektorí naliehajú na [scope_ruler.GetName], aby urobil prípravy na využitie situácie." # todo: NEW TRANSLATION
 flavor_ach.11.a: "Teraz je čas rozdrviť Fénixa!" # todo: NEW TRANSLATION
 flavor_ach.11.b: "Vyhnime sa miešaniu sa do vnútorných záležitostí [byz_country.GetAdjectiveWithNoTooltip]." # todo: NEW TRANSLATION
 flavor_ach.11.b.entry: "Vyhnime sa miešaniu sa do vnútorných záležitostí $BYZ_ADJ$." # todo: NEW TRANSLATION
 flavor_ach.12.title: "Upokojenie [ShowCultureNameWithNoTooltip('greek_culture')] elity" # todo: NEW TRANSLATION
 flavor_ach.12.entry: "Grécke obyvateľstvo Achaea" # todo: NEW TRANSLATION
 flavor_ach.12.desc: "Hoci vláda [GetCountry('LAT').GetAdjective] nad [ShowScriptedGeographyName('greece_geography')] viedla k poklesu vplyvu bývalej [ShowCultureName('greek_culture')] elity, v niektorých oblastiach [ROOT.GetCountry.GetName] členovia starších [ShowCultureNameWithNoTooltip('greek_culture')] rodín udržali moc kompromisom s [ROOT.GetCountry.GetCulture.GetName] [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]. Avšak od pádu [GetCountry('LAT').GetLongNameWithNoTooltip] sa členovia [ShowCultureNameWithNoTooltip('greek_culture')] obyvateľstva stali odolnejšími voči vláde [ROOT.GetCountry.GetCulture.GetNameWithNoTooltip].\n\nHľadajúc stabilnejšiu vládu, [scope_ruler.GetNameWithNoTooltip] pozval členov zostávajúcich [ShowCultureNameWithNoTooltip('greek_culture')] rodín v [ROOT.GetCountry.GetNameWithNoTooltip] na [ROOT.GetCountry.GetGovernment.GetCourtTitle], aby vypracovali kompromis. Niektorí [ROOT.GetCountry.GetCulture.GetNameWithNoTooltip] [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')] však namiesto toho tlačia na ďalšie rozšírenie svojich práv voči [ShowCultureNameWithNoTooltip('greek_culture')] obyvateľstvu, argumentujúc, že silnejšia [ROOT.GetCountry.GetCulture.GetNameWithNoTooltip] elita by potlačila nepokoje [ShowCultureNameWithNoTooltip('greek_culture')]." # todo: NEW TRANSLATION
 flavor_ach.12.a: "Udržať súčasný stav." # todo: NEW TRANSLATION
 flavor_ach.12.b: "Postaviť sa na stranu [ROOT.GetCountry.GetCulture.GetNameWithNoTooltip] [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')]." # todo: NEW TRANSLATION
 flavor_ach.12.b.entry: "Postavte sa na stranu nášho $nobles_estate$." # todo: NEW TRANSLATION
 flavor_ach.12.c: "Usilujme sa o kompromis s [ShowCultureNameWithNoTooltip('greek_culture')] rodinami." # todo: NEW TRANSLATION
 flavor_ach.13.title: "Hrozba [athens_country.GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 flavor_ach.13.entry: "Katalánska vláda v Aténach" # todo: NEW TRANSLATION
 flavor_ach.13.desc: "Hoci mnohí z [GetCountry('LAT').GetAdjective] pánov v [ShowScriptedGeographyName('greece_geography')] ponúkli podporu [scope_ruler.GetName] a jeho nároku na [GetCountry('LAT').GetLongNameWithNoTooltip], [athens_country.GetLongName] v posledných rokoch zintenzívnila nepriateľstvo, podporená [ShowCultureName('catalan')] kompániou. Niekoľko nespokojných [athens_country.GetAdjectiveWithNoTooltip] [athens_country.GetGovernment.GetEstateName('nobles_estate')] však oslovilo [ROOT.GetCountry.GetAdjective] [ROOT.GetCountry.GetGovernment.GetCourtTitle] v nádeji získať pomoc pri vypudení [ShowCultureNameWithNoTooltip('catalan')] Company z [athens_country.GetNameWithNoTooltip], a výmenou by ponúkli vernosť [ROOT.GetCountry.GetNameWithNoTooltip]." # todo: NEW TRANSLATION
 flavor_ach.13.a: "Namiesto toho by sme sa mali spriateliť s [ShowCultureNameWithNoTooltip('catalan')] [athens_country.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')] v [athens_country.GetNameWithNoTooltip]." # todo: NEW TRANSLATION
 flavor_ach.13.a.entry: "Namiesto toho by sme sa mali spriateliť s [ShowCultureNameWithNoTooltip('catalan')] $nobles_estate$ v $ATH$." # todo: NEW TRANSLATION
 flavor_ach.13.b: "Mali by sme vyhovieť ich žiadosti a vypudiť [ShowCultureNameWithNoTooltip('catalan')] kompániu z [athens_country.GetNameWithNoTooltip]." # todo: NEW TRANSLATION
 flavor_ach.13.b.entry: "Mali by sme vyhovieť ich žiadosti a vypudiť [ShowCultureNameWithNoTooltip('catalan')] kompániu z $ATH$." # todo: NEW TRANSLATION
 flavor_ach.13.c: "Využiť túto príležitosť na dobytie [athens_country.GetFlavorRank]." # todo: NEW TRANSLATION
 flavor_ach.13.c.entry: "Využiť príležitosť na dobytie panstva." # todo: NEW TRANSLATION
 ach_vassalize_athens_for_reward: "Ak sa nám podarí podmaniť si [athens_country.GetName], budeme môcť dosadiť nového vládcu priaznivého pre [ROOT.GetCountry.GetName]" # todo: NEW TRANSLATION
 flavor_ach.14.title: "[ShowCultureNameWithNoTooltip('catalan')] kompánia vyhnaná z [athens_country.GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 flavor_ach.14.entry: "Francúzska vláda obnovená v Aténach" # todo: NEW TRANSLATION
 flavor_ach.14.desc: "Keď sme úspešne porazili [ShowCultureName('catalan')] Company a vyhnali ju z [athens_country.GetName], mnohí z [athens_country.GetAdjectiveWithNoTooltip] elity prisľúbili plnú vernosť [scope_ruler.GetName]. Keďže bývalý vládca [athens_country.GetFlavorRank] je teraz v exile, mnohí na [ROOT.GetCountry.GetGovernment.GetCourtTitle] navrhujú obnoviť [ShowCultureNameWithNoTooltip('french')] rodinu, ktorá by vládla [athens_country.GetNameWithNoTooltip], hoci iní navrhujú využiť príležitosť na budovanie vzťahov s [ShowCultureNameWithNoTooltip('greek_culture')] ľuďmi a povýšiť člena miestnej [athens_country.GetGovernment.GetEstateName('nobles_estate')] namiesto toho." # todo: NEW TRANSLATION
 flavor_ach.14.a: "Dosadiť člena [ShowCultureNameWithNoTooltip('french')] [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')] ako nového [athens_country.GetGovernment.GetRulerTitle]." # todo: NEW TRANSLATION
 flavor_ach.14.a.entry: "Dosadiť člena [ShowCultureNameWithNoTooltip('french')] $nobles_estate$ ako nového vládcu." # todo: NEW TRANSLATION
 flavor_ach.14.b: "Vymenovať člena [ShowCultureNameWithNoTooltip('french')] [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')], ale vynútiť privilégiá pre [ShowCultureNameWithNoTooltip('greek_culture')] obyvateľov v [athens_country.GetNameWithNoTooltip]." # todo: NEW TRANSLATION
 flavor_ach.14.b.entry: "Vymenovať člena [ShowCultureNameWithNoTooltip('french')] $nobles_estate$, ale vynútiť privilégiá pre [ShowCultureNameWithNoTooltip('greek_culture')] obyvateľov v $ATH$." # todo: NEW TRANSLATION
 flavor_ach.14.c: "Vymenovať niektorých [ShowCultureNameWithNoTooltip('greek_culture')] [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')], aby prevzali vedenie [athens_country.GetNameWithNoTooltip]." # todo: NEW TRANSLATION
 flavor_ach.14.c.entry: "Vymenovať niekoľkých [ShowCultureNameWithNoTooltip('greek_culture')] $nobles_estate$, aby prevzali vedenie $ATH$." # todo: NEW TRANSLATION
 variable_ach_vassalize_athens_for_reward_tt: "Atény možno za odmenu urobiť vazalom" # todo: NEW TRANSLATION
 flavor_ach.15.title: "Nástup [scope_ruler.GetNameWithNoTooltip] na trón" # todo: NEW TRANSLATION
 flavor_ach.15.entry: "Úmrtie latinskej cisárovnej" # todo: NEW TRANSLATION
 flavor_ach.15.desc: "Po smrti [latin_empress_catherine_valois.GetName] zdedil [scope_ruler.GetName] titulárny nárok na [GetCountry('LAT').GetLongNameWithNoTooltip] a usporiadal ceremóniu v [ROOT.GetCountry.GetCapital.GetName] na pripomenutie tejto udalosti. Hoci [latin_empress_catherine_valois.GetShortNameWithNoTooltip] a [scope_philip_latin_emperor.GetName] podnikli veľké kroky na posilnenie povahy titulu, mnohí z [GetCountry('LAT').GetAdjectiveWithNoTooltip] pánov v [ShowScriptedGeographyName('greece_geography')] odmietli uznať nárok dynastie [scope_ruler.GetDynasty.GetName] na [GetCountry('LAT').GetLongNameWithNoTooltip].\n\nNaliehajúc na [scope_ruler.GetNameWithNoTooltip], aby pokračoval v budovaní dedičstva svojich rodičov, niektorí členovia [ROOT.GetCountry.GetGovernment.GetCourtTitle] požiadali [scope_ruler.GetHeShe], aby využil ceremóniu na posilnenie snáh o obnovenie ríše." # todo: NEW TRANSLATION
 flavor_ach.15.a: "Zachovajme korunováciu len za ceremoniálnu udalosť." # todo: NEW TRANSLATION
 flavor_ach.15.b: "Využime ceremóniu na posilnenie snáh o obnovu ríše." # todo: NEW TRANSLATION
 flavor_ach.15.c: "Využiť korunováciu na získanie politickej prízně u verných pánov." # todo: NEW TRANSLATION
 flavor_ach.16.title: "[the_pope.GetNameWithNoTooltip] ponúka podporu na obnovenie [GetCountry('LAT').GetLongNameWithNoTooltip]" # todo: NEW TRANSLATION
 flavor_ach.16.entry: "Pápež prejavuje záujem o obnovu Latinskej ríše" # todo: NEW TRANSLATION
 flavor_ach.16.desc: "Keď si [the_pope.GetName] všimol naše kampane v [ShowScriptedGeographyName('greece_geography')], poslal emisára z [scope_papal_states.GetName] s návrhom, ako nám pomôcť.\n\nUznávajúc náš nárok [ShowGovernmentReformName('ach_heirs_of_the_latin_empire')], [the_pope.GetShortNameWithNoTooltip] ponúkol finančnú a politickú podporu [scope_papal_states.GetNameWithNoTooltip], ak súhlasíme pomôcť [scope_papal_states.GetGovernment.GetRulerTitle] v [the_pope.GetHisHer] snahách zmieriť vzťahy medzi [ShowReligionAdjective('catholic')] a [ShowReligionAdjective('orthodox')] cirkvami.\n\n[the_pope.GetNameWithNoTooltip] tiež naliehal, že keby bola [constantinople_location.GetName] znovu dobytá, nesmie sa zopakovať tragédia, ktorú Štvrtá križiacka výprava spôsobila [constantinople_location.GetRank.GetName]." # todo: NEW TRANSLATION
 flavor_ach.16.a: "Súhlasíme s požiadavkami [scope_papal_states.GetAdjectiveWithNoTooltip] emisára výmenou za ich podporu." # todo: NEW TRANSLATION
 flavor_ach.16.a.entry: "Agree to the demands of the $PAP_ADJ$ emissary in return for their support." # todo: NEW TRANSLATION
 flavor_ach.16.b: "Nepotrebujeme [the_pope.GetShortNameWithNoTooltip] na znovudobytie [constantinople_location.GetNameWithNoTooltip]." # todo: NEW TRANSLATION
 flavor_ach.16.b.entry: "Nepotrebujeme ho na znovudobytie [ShowLocationNameWithNoTooltip('constantinople')]." # todo: NEW TRANSLATION
 lat_aggressive_conversion_policies_tt: "[the_pope.GetName] môže požadovať, aby sme prijali prísne konverzné politiky, ak zriadime [GetCountry('LAT').GetLongName], výmenou za získanie [the_pope.GetHisHer] podpory" # todo: NEW TRANSLATION
 flavor_ach.17.title: "[constantinople_location.GetNameWithNoTooltip] znovu dobytý!" # todo: NEW TRANSLATION
 flavor_ach.17.entry: "Konštantínopol znovu dobytý!" # todo: NEW TRANSLATION
 flavor_ach.17.desc: "To, čo sa kedysi javilo ako nemožná úloha, bolo konečne dosiahnuté: [constantinople_location.GetName] bol nakoniec znovu dobytý! Hoci veľká časť [constantinople_location.GetRank.GetName] sa ešte nestihla zotaviť, [scope_ruler.GetName] vyzval [ROOT.GetCountry.GetAdjective] vojakov, aby pri znovudobývaní [constantinople_location.GetNameWithNoTooltip] postupovali opatrne a predišli ďalšej destabilizácii obyvateľstva.\n\nKeďže veľká časť [constantinople_location.GetNameWithNoTooltip] je zabezpečená a cisársky palác Blachernae opustený, [scope_ruler.GetNameWithNoTooltip] požiadal [ROOT.GetCountry.GetAdjectiveWithNoTooltip] elitu, aby rýchlo vyhlásila obnovu [GetCountry('LAT').GetLongName], hoci opatrní členovia [ROOT.GetCountry.GetGovernment.GetCourtTitle] nás varujú, aby sme si najprv upevnili pevné postavenie." # todo: NEW TRANSLATION
 flavor_ach.17.a: "Je čas znovu ustanoviť našu vládu nad [constantinople_location.GetNameWithNoTooltip]." # todo: NEW TRANSLATION
 flavor_ach.17.a.entry: "Je čas znovu ustanoviť našu vládu nad [ShowLocationNameWithNoTooltip('constantinople')]." # todo: NEW TRANSLATION
 flavor_ach.17.b: "Mali by sme posilniť našu pozíciu pred formálnym obnovením ríše." # todo: NEW TRANSLATION
 flavor_ach.17.c: "Vyplieniť [constantinople_location.GetNameWithNoTooltip] za všetky jeho zostávajúce bohatstvá!" # todo: NEW TRANSLATION
 flavor_ach.17.c.entry: "Vyplieniť [ShowLocationNameWithNoTooltip('constantinople')] a získať všetky jeho zostávajúce bohatstvá!" # todo: NEW TRANSLATION

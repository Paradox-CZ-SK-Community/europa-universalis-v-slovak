l_polish:
 flavor_tre.1.title: "Citadela [target_location.GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 flavor_tre.1.entry: "Citadela Trebizondu" # todo: NEW TRANSLATION
 flavor_tre.1.desc: "Stojaca hrdoprdne po stáročia, [target_location.GetRank.GetName] v [target_location.GetName] je symbolom kráľovskej moci hlboko v srdci regiónu [ShowRegionName('anatolia_region')]. Slúžiac ako maják našich kultúrnych tradícií, naše veľké hlavné mesto zaznamenalo veľký rozmach, predovšetkým vďaka svojmu nádhernému prístavu a geografickému postaveniu.\n\nVybavená mnohými mestskými zariadeniami, ako sú obchodné štvrte, trhy a akvadukty, sa stala symbolom našej moci, našou pýchou a naším klenotom. Nedávny nárast obyvateľstva si vyžiadal rozšírenie hraníc [target_location.GetRank.GetNameWithNoTooltip], aby sa za našimi pevnými hradbami zmestilo viac domácností." # todo: NEW TRANSLATION
 flavor_tre.1.historical_info: "Založené v roku 756 pred n. l., Trebizond má dlhú históriu ako oporný bod kresťanstva a gréckeho kultúrneho dedičstva. Už v rímskych časoch mesto slúžilo ako dôležitá légijná základňa v Pontos Polemoniakos. Neskôr, počas vlády Justiniána, niekoľko arménskych tažení využívalo Trebizond ako zborové a odrazové miesto.\n\nMesto sa v 8. storočí vyvinulo na arcibiskupstvo a na metropolu na začiatku 10. storočia. Cisárstvo Trebizond, založené v roku 1204 Alexiom I. Komnenom a Davidom Komnenom, pretrvalo až do roku 1461, opevnené Pontskými horami, silnými mestskými opevneniami a strategickými manželskými zväzkami. Hoci bolo malé, s približne 4 000 obyvateľmi v roku 1438, bolo dobre bránené a pýšilo sa významnými pamiatkami, ako kláštor Hagia Sophia a katedrála Panagia Chrysokephalos. Trebizond bol posledným byzantským oporným bodom, ktorý padol do rúk Osmanom, pričom si udržiaval svoje kultúrne a historické významy až do roku 1461." # todo: NEW TRANSLATION
 flavor_tre.1.a: "Financovať rozšírenie!" # todo: NEW TRANSLATION
 flavor_tre.1.b: "Nech nechajú hladovať pred hradbami..." # todo: NEW TRANSLATION
 flavor_tre.2.title: "Neposlušnosť Scholarioi" # todo: NEW TRANSLATION
 flavor_tre.2.entry: "$flavor_tre.2.title$" # todo: NEW TRANSLATION
 flavor_tre.2.desc: "Poháňaní úpadkom centrálnej moci a podnecovaní svojou nenásytnou chamtivosťou, mnohí členovia miestnych šľachtických milícií začali ovládať veľké časti politickej scény v [target_location.GetName]. Zatiaľ čo vždy radi prijímali nové úradné miesta, privilégiá a cenné majetky, mnohí členovia [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] prekročili hranicu... Ak proti nim nezasiahneme rozhodne, ich sklony ku korupcii môžu vhodiť celú krajinu do pazúrov občianskej vojny!" # todo: NEW TRANSLATION
 flavor_tre.2.a: "Spútajte tieto besné psy!" # todo: NEW TRANSLATION
 flavor_tre.2.b: "[ROOT.GetCountry.Custom('common_string_nothing_we_can_do')]" # todo: NEW TRANSLATION
 flavor_tre.2.b.entry: "$common_string_nothing_we_can_do_about_it$" # todo: NEW TRANSLATION
 flavor_tre.2.historical_info: "Scholarioi boli vplyvní #italic άρχοντες#! (šľachtici) a jedna z najsilnejších rodín v Trebizonde. Pôvodne vznikli ako kráľovská milícia určená na ochranu mesta. Čoskoro sa skazili a spochybnili autoritu vládnucej cisárovnej Irene v roku 1340. Ich drzosť a túžba po moci ich priviedli k zablokovaniu nástupu Irene, čím vrhli celú krajinu do občianskej vojny, zatiaľ čo južná hranica Trebizondu bola súčasne terčom nájazdov Turkmenov. To vyvrcholilo tým, že nájazdníci mesto dobyli, zapálili ho a priviedli epidémiu, ktorá vznikla z hnilobného pachu rozkladajúcich sa tiel - ľudí i koní." # todo: NEW TRANSLATION
 flavor_tre.3.title: "Otrava [target_character1.GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 flavor_tre.3.entry: "Otrava Basil Megas Komnenos" # todo: NEW TRANSLATION
 flavor_tre.3.desc: "V zúfalom čine vášnivej nenávisti a žiarlivosti [target_character2.GetName] pristúpil k otráveniu a spečateniu osudu [target_character1.GetShortName]. Situáciu zhoršovali [target_character1.GetShortNameWithNoTooltip] zdanlivo chladné pocity voči nej a existencia mnohých mileniek a milencov..." # todo: CHANGED
 flavor_tre.3.a: "V láske a vojne je všetko dovolené." # todo: NEW TRANSLATION
 flavor_tre.3.b: "Tohto nebudeme tolerovať!" # todo: NEW TRANSLATION
 flavor_tre.3.historical_info: "Manželstvo medzi Irenou a Basilom nebolo ničím iným než spôsobom, akým dynastia Komnenovcov zabezpečila spojenectvo s cisárom Byzancie, keďže Irene bola nemanželským dieťaťom cisára Andronika III. Palaiologa. Medzi oboma nepanovala žiadna náklonnosť; Irene nenarodila žiadne deti, zatiaľ čo Basil hľadal útočisko v náručí dvornej milenky. Napätie medzi kráľovským párom nakoniec viedlo k zavraždeniu Basila a nástupu vlády Irene, turbulentnému obdobiu pre Trebizond." # todo: CHANGED
 flavor_tre.4.title: "Odkaz [target_character_2.GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 flavor_tre.4.entry: "Vláda Alexiosa II" # todo: NEW TRANSLATION
 flavor_tre.4.desc: "Vláda [target_character_1.GetName] znamená pokračovanie veľkej éry pre náš [ROOT.GetCountry.GetFlavorRank]. Po tom, čo zdedil trón po [target_character_2.GetName], musí nový [ROOT.GetCountry.GetGovernment.GetRulerTitle] teraz vládnuť v politickom prostredí formovanom dynastickou tradíciou, miestnou aristokraciou a zahraničnými záujmami pozdĺž [ShowAreaName('black_sea_area')] pobrežia.\n\nAko bude táto vláda zapamätaná, závisí nielen od skutkov, ktoré ešte prídu, ale aj od toho, ako pevne bude odkaz jeho predchodcov zachovaný alebo preformovaný." # todo: NEW TRANSLATION
 flavor_TRE_4_historical_info: "Alexios II Megas Komnenos bol jedným z cisárov Trebizondu, ktorí vládli najdlhšie, panoval v období, keď impérium viac spoliehalo na diplomaciu, obchod a dynastickú kontinuitu než na územnú expanziu. Jeho smrť znamenala prechod, v ktorom moc vládnuceho rodu pokračovala, no základná rovnováha medzi dvorovými frakciami a zahraničnými obchodníkmi zostávala krehká." # todo: NEW TRANSLATION
 flavor_tre.4.a: "Odpočívaj teraz, veľký [ROOT.GetCountry.GetGovernment.GetRulerTitle]..." # todo: NEW TRANSLATION
 flavor_tre.4.a.entry: "Odpočívaj teraz, veľký vládca..." # todo: NEW TRANSLATION
 flavor_tre.5.title: "Rodisko čerešní" # todo: NEW TRANSLATION
 flavor_tre.5.entry: "$flavor_tre.5.title$" # todo: NEW TRANSLATION
 flavor_tre.5.desc: "[target_location.GetRank.GetName] [ShowLocationName('giresun')] už dlhodobo slúži ako skromný, no dôležitý prístav pozdĺž južného [ShowAreaName('black_sea_area')]. Jeho prístav spája vnútrozemské trasy [ROOT.GetCountry.GetAdjective] pohorí s námorným obchodom a ponúka príležitosti na rast, ak budú primerane podporené.\n\nČi už prostredníctvom priamej investície alebo trpezlivej správy, budúcnosť [target_location.GetNameWithNoTooltip] ovplyvní ako miestne bohatstvo, tak aj širšiu obchodnú pozíciu [ROOT.GetCountry.GetNameWithNoTooltip]." # todo: NEW TRANSLATION
 flavor_TRE_5_historical_info: "Kerasous, dnes známa ako Giresun, bola ustáleným sídlom v regióne Pontus so strategickou hodnotou ako pobrežný prístav. Pre cisárstvo Trebizondu takéto mestá poskytovali prístup k obchodu na Čiernom mori a slúžili ako sprostredkovatelia medzi horskými ekonomikami a medzinárodnými obchodnými sieťami. Hovorí sa, že meno #italic Kerasous#! sa nakoniec použilo na označenie miestneho sladkého ovocia, čerešne." # todo: NEW TRANSLATION
 flavor_tre.5.a: "Múdra investícia." # todo: NEW TRANSLATION
 flavor_tre.5.b: "Nech necháme jeho prirodzený rozvoj." # todo: NEW TRANSLATION
 flavor_tre.6.title: "Rastúci vplyv [ShowCultureGroupNameWithNoTooltip('italian_group')] obchodníkov" # todo: NEW TRANSLATION
 flavor_tre.6.entry: "Zdaníme Benátčanov a Janovčanov" # todo: NEW TRANSLATION
 flavor_tre.6.desc: "[ShowCultureGroupName('italian_group')] obchodníci z [GetCountry('VEN').GetName] a [GetCountry('GEN').GetName] sa už dlhé roky tešia rozsiahlym privilégiám v našich prístavoch, oslobodeniam zabezpečeným zmluvami a vzájomnou potrebou. Ich lode prinášajú bohatstvo a tovar, no ich autonomita čoraz viac vyvoláva kritiku miestnej [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')] a úradníkov.\n\nUvalenie nových daní by potvrdilo suverenitu a posilnilo pokladnicu, avšak také konanie rizikuje diplomatické následky s mocnými námornými republikami, ktorých vplyv siaha ďaleko za [ShowAreaName('black_sea_area')] a zasahuje do už existujúcich obchodných dohôd uzavretých na desaťročia." # todo: NEW TRANSLATION
 flavor_tre.6.a: "Uvaľme nové dane." # todo: NEW TRANSLATION
 flavor_tre.6.b: "Nerobme si s nimi nepriateľov." # todo: NEW TRANSLATION
 flavor_tre.7.title: "Aspron" # todo: NEW TRANSLATION
 flavor_tre.7.entry: "$flavor_tre.7.title$" # todo: NEW TRANSLATION
 flavor_tre.7.desc: "[ShowGoodsName('silver')] ťažené zo zemí okolo [ShowLocationName('gumushane')] ponúka viac než len materiálne bohatstvo. V skutočnosti posilňuje dôveru v mincovňu a autoritu [ROOT.GetCountry.GetGovernment.GetRulerTitle]. Rozšírením baníctva a raziacej činnosti v [target_location.GetRank.GetName] môže [ROOT.GetCountry.GetFlavorRank] posilniť svoj menový systém a stimulovať miestny rozvoj.\n\nTakéto snahy však vyžadujú pevnú správu a okamžité výdavky, a zaťaženie zintenzívnenou ťažbou môže, ak sa to privedie príliš ďaleko, rozhádzať pôdu aj ľudí." # todo: NEW TRANSLATION
 flavor_tre.7.a: "Zamerajme sa na rozšírenú ťažbu!" # todo: NEW TRANSLATION
 flavor_tre.7.b: "Taká chamtivosť je nerozumná." # todo: NEW TRANSLATION
 flavor_tre.8.title: "Dedičstvo [target_location.GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 flavor_tre.8.entry: "Dedičstvo Konštantínopola" # todo: NEW TRANSLATION
 flavor_tre.8.desc: "Po celé generácie si [target_dynasty.GetName] z [ROOT.GetCountry.GetName] uchovávali to, čo ostatní nedokázali, udržiavajúc plameň starobylého [ROOT.GetCountry.GetFlavorRank] na brehoch [ShowAreaName('black_sea_area')], zatiaľ čo menej zdatné ruky nechali civilizáciu upadať. Táto bdelosť nikdy nebola spochybnená. Výsledok nikdy nebol otázny.\n\nTeraz [target_ruler.GetName] stojí tam, kde stoja len zaslúžení. Veľký [target_location.GetRank.GetName] [target_location.GetName] teraz otvorí svoje brány aj archívy. Také obrovské bohatstvo administratívnej múdrosti, zakódované naprieč stáročiami vlády, im nikdy nepatrilo. My sme jednoducho prišli, aby sme si ho znovu vzali." # todo: NEW TRANSLATION
 flavor_tre.8.historical_info: "Veľkí Komnenovci z Trebizondy boli založení v roku 1204 Alexiosom I. Komnenosom, vnukom byzantského cisára Andronika I. Počas celej svojej existencie nesú trapezuntskí cisári titul cisára Rimanov a považovali sa za právoplatných nástupcov byzantského cisárskeho dedičstva. Konštantínopol, legendárne sídlo východorímskych cisárov, nebol len politickou korisťou, ale duchovným a kultúrnym srdcom civilizácie, ktorej korene siahajú až tisíc rokov dozadu." # todo: NEW TRANSLATION
 flavor_tre.8.a: "Taký je osud nášho [ROOT.GetCountry.GetFlavorRank]." # todo: NEW TRANSLATION
 flavor_tre.8.a.tt: "Získame prístup k mnohým novým [bureaucracies|e]." # todo: NEW TRANSLATION

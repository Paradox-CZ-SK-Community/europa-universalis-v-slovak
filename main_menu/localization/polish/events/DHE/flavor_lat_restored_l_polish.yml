l_polish:
 flavor_lat.1.title: "Budovanie novej [latin_country.GetAdjectiveWithNoTooltip] byrokracie" # todo: NEW TRANSLATION
 flavor_lat.1.entry: "Nová latinská byrokracia" # todo: NEW TRANSLATION
 flavor_lat.1.desc: "S našou nadvládou nad [constantinople_location.GetName] opätovne obnovenou, mnoho [latin_country.GetAdjective] elít teraz kladie základy pre novú byrokraciu, ktorá by nahradila rozpadnutý [GetCountry('BYZ').GetAdjectiveWithNoTooltip] systém. Jedným z nedostatkov pôvodného [ROOT.GetCountry.GetLongNameWithNoTooltip] bolo, že regionálne tlaky v tom čase zabránili [ROOT.GetCountry.GetFlavorRank] vytvoriť koherentnú vládnú štruktúru.\n\nPod vedením [scope_ruler.GetName] by [ROOT.GetCountry.GetFlavorRank] mohol zvoliť iný smer a vytvoriť koherentnú [ROOT.GetCountry.GetCulture.GetName] byrokraciu." # todo: NEW TRANSLATION
 flavor_lat.1.a: "Založiť novú samostatnú [ROOT.GetCountry.GetCulture.GetNameWithNoTooltip] byrokraciu." # todo: NEW TRANSLATION
 flavor_lat.1.a.entry: "Založiť novú samostatnú byrokraciu." # todo: NEW TRANSLATION
 flavor_lat.1.b: "Založiť novú byrokraciu podľa vzoru starých križiackych štátov." # todo: NEW TRANSLATION
 flavor_lat.1.c: "Prevziať prvky [GetCountry('BYZ').GetAdjectiveWithNoTooltip] byrokracie." # todo: NEW TRANSLATION
 flavor_lat.1.c.entry: "Prevziať prvky $BYZ_ADJ$ byrokracie." # todo: NEW TRANSLATION
 flavor_lat.1.d: "Zaviesť byrokraciu inšpirovanú [ShowCultureNameWithNoTooltip('catalan')]." # todo: NEW TRANSLATION
 flavor_lat.1.e: "Zaviesť byrokraciu inšpirovanú [ShowCultureNameWithNoTooltip('neapolitan')]." # todo: NEW TRANSLATION
 flavor_lat.2.title: "Rastúca hrozba [ShowCultureNameWithNoTooltip('turkish_culture')] v [ShowRegionNameWithNoTooltip('anatolia_region')]" # todo: NEW TRANSLATION
 flavor_lat.2.entry: "Rastúca turecká hrozba v Anatólii" # todo: NEW TRANSLATION
 flavor_lat.2.desc: "Ešte pred našim znovudobytím [constantinople_location.GetName] čelili [GetCountry('BYZ').GetAdjectiveWithNoTooltip] državy v [ShowRegionName('anatolia_region')] vážnym hrozbám od [ShowCultureName('turkish_culture')] obyvateľov tamojších krajín. Medzi týmito [ShowCultureNameWithNoTooltip('turkish_culture')] vojvodami sa [rising_turkish_country_ruler.GetName] ukázal ako jeden z najsilnejších pri konsolidácii území v [ShowRegionNameWithNoTooltip('anatolia_region')], a mnohí v [ROOT.GetCountry.GetAdjective] [ROOT.GetCountry.GetGovernment.GetCourtTitle] sa obávajú, že by mohli využiť naše znovudobytie [constantinople_location.GetNameWithNoTooltip] na spustenie vlastnej invázie do [ShowScriptedGeographyName('greece_geography')]. Iní v [ROOT.GetCountry.GetGovernment.GetCourtTitle] zase navrhli [scope_ruler.GetName], aby sme zatlačili na našu výhodu a zahájili inváziu do [ShowRegionNameWithNoTooltip('anatolia_region')], aby sme oslabili [ShowCultureNameWithNoTooltip('turkish_culture')] [rising_turkish_country.GetFlavorRank]." # todo: NEW TRANSLATION
 flavor_lat.2.a: "Vyženeme [rising_turkish_country.GetFlavorRank]!" # todo: NEW TRANSLATION
 flavor_lat.2.a.entry: "Vyženeme túto ríšu!" # todo: NEW TRANSLATION
 flavor_lat.2.b: "Mali by sme zostať opatrní a zvoliť defenzívnejší prístup." # todo: NEW TRANSLATION
 flavor_lat.3.title: "Väčšie nároky [ROOT.GetCountry.GetLongNameWithNoTooltip]" # todo: NEW TRANSLATION
 flavor_lat.3.entry: "$flavor_lat.3.title$" # todo: NEW TRANSLATION
 flavor_lat.3.desc: "Po páde [constantinople_location.GetName] v roku 1204 sa stará [ROOT.GetCountry.GetAdjective] elita rýchlo snažila upevniť kontrolu nad [GetCountry('BYZ').GetAdjective] držbami po celom [ShowScriptedGeographyName('greece_geography')] a zároveň nárokovať si nadradenosť nad [ShowRegionNameWithNoTooltip('balkan_region')]. Avšak v tom čase sa [serbia_country.GetName] a [bul_country.GetName] ukázali ako významní rivali [ROOT.GetCountry.GetNameWithNoTooltip], pričom [bul_country.GetNameWithNoTooltip] napokon zohralo hlavnú úlohu pri kolapse pôvodného [ROOT.GetCountry.GetFlavorRank] svojimi neustálymi vojenskými výpravami do území [ROOT.GetCountry.GetNameWithNoTooltip].\n\nTeraz, keď je [ROOT.GetCountry.GetLongNameWithNoTooltip] obnovené pod vládou [scope_ruler.GetName], môžeme byť schopní nárokovať si vládu nad týmito zemami a dokázať to, čo staré [ROOT.GetCountry.GetFlavorRank] nedokázalo." # todo: NEW TRANSLATION
 flavor_lat.3.a: "Budeme tlačiť na rozšírenie [ROOT.GetCountry.GetFlavorRank] na úkor týchto starých rivalov." # todo: NEW TRANSLATION
 flavor_lat.3.a.entry: "Budeme tlačiť na rozšírenie panstva na úkor týchto starých rivalov." # todo: NEW TRANSLATION
 flavor_lat.3.b: "Vyvarujme sa opakovania chýb z minulosti." # todo: NEW TRANSLATION
 flavor_lat.4.title: "Obnovenie svätého patriarchátu v [constantinople_location.GetName]" # todo: NEW TRANSLATION
 flavor_lat.4.entry: "Obnovenie svätého patriarchátu Konštantínopolu" # todo: NEW TRANSLATION
 flavor_lat.4.desc: "Aj keď počiatočný vpád na [constantinople_location.GetName] v roku 1204 čelil odporu zo strany [pap_country.GetGovernment.GetRulerTitle], možnosť, že [constantinople_location.GetNameWithNoTooltip] obsadia [ShowReligionAdjective('catholic')] krížovci, umožnila obnovenie patriarchátu a zvýšenie [pap_country.GetAdjective] autority. Avšak znovudobytie [constantinople_location.GetNameWithNoTooltip] v roku 1261 [scope_michael_palaiologos.GetName] spôsobilo, že tento titul opäť zanikol.\n\nTeraz, keď je [ROOT.GetCountry.GetAdjective] vláda nad [constantinople_location.GetNameWithNoTooltip] opäť obnovená, mnohí v [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] nás naliehavo vyzývajú, aby sme patriarchát obnovili." # todo: NEW TRANSLATION
 flavor_lat.4.a: "Povoliť obnovenie patriarchátu." # todo: NEW TRANSLATION
 flavor_lat.4.b: "Prisahať, že zabezpečíme ochranu obnoveného patriarchátu!" # todo: NEW TRANSLATION
 flavor_lat.4.c: "Využiť obnovený patriarchát na získanie vplyvu." # todo: NEW TRANSLATION
 flavor_lat.4.d: "Odmietnuť obnovenie patriarchátu." # todo: NEW TRANSLATION
 latin_patriarchate_of_constantinople: "Patriarchát [ShowLocationNameWithNoTooltip('constantinople')]" # todo: NEW TRANSLATION
 flavor_lat.5.title: "Obnovená kontrola nad [ShowRegionNameWithNoTooltip('anatolia_region')]" # todo: NEW TRANSLATION
 flavor_lat.5.entry: "Obnovená kontrola nad Anatóliou" # todo: NEW TRANSLATION
 flavor_lat.5.desc: "Hoci to spočiatku vyzeralo ako náročný úkol pre obnovené [ROOT.GetCountry.GetLongName], naši vojaci urobili veľké pokroky pri upevňovaní dominancie nad [ShowRegionName('anatolia_region')]. Aj keď stále zostáva niekoľko [ShowCultureName('turkish_culture')] štátov v [ShowRegionNameWithNoTooltip('anatolia_region')], už by nemali predstavovať vážnu hrozbu pre [ROOT.GetCountry.GetNameWithNoTooltip]." # todo: NEW TRANSLATION
 flavor_lat.5.a: "Sláva [ROOT.GetCountry.GetLongNameWithNoTooltip]!" # todo: NEW TRANSLATION
 flavor_lat.5.a.entry: "Sláva nám!" # todo: NEW TRANSLATION
 flavor_lat_anatolia_secured: "Každý [location|e] v [ShowRegionName('anatolia_region')] vlastnený [ROOT.GetCountry.GetName] alebo našimi [subjects|e] získa [ShowModifier('lat_improved_location_integration')] [modifier|e] na #Y 15#! rokov" # todo: NEW TRANSLATION
 flavor_lat.6.title: "Úspešné ťaženia proti [target_country.GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 flavor_lat.6.entry: "Bulharsko porazené" # todo: NEW TRANSLATION
 flavor_lat.6.desc: "Kedysi významná hrozba pre pôvodné [ROOT.GetCountry.GetLongName], [target_country.GetLongName] bola výrazne oslabená a mnoho ich bývalých území je teraz pod kontrolou [ROOT.GetCountry.GetAdjective]. Je nepravdepodobné, že sa [target_country.GetAdjectiveWithNoTooltip] elita dokáže zotaviť a znova predstaviť hrozbu pre [ROOT.GetCountry.GetFlavorRank]." # todo: NEW TRANSLATION
 flavor_lat.6.a: "Mali by sme pristúpiť k integrácii bývalých [target_country.GetAdjectiveWithNoTooltip] provincií." # todo: NEW TRANSLATION
 flavor_lat.6.a.entry: "Mali by sme integrovať ich bývalé provincie." # todo: NEW TRANSLATION
 flavor_lat_balkan_rival_lands_secured: "Každý [location|e] v [ShowRegionName('balkan_region')], ktorý je [core|e] [target_country.GetName] a je vlastnený [ROOT.GetCountry.GetName] alebo našimi [subjects|e], získa [ShowModifier('lat_improved_location_integration')] [modifier|e] na #Y 15#! rokov" # todo: NEW TRANSLATION
 flavor_lat.7.title: "Ambície [target_country.GetAdjectiveWithNoTooltip] zničené" # todo: NEW TRANSLATION
 flavor_lat.7.entry: "Srbske ambície porazené" # todo: NEW TRANSLATION
 flavor_lat.7.desc: "Hoci sa dlhší čas zdali byť stúpajúcou mocou, ambície [target_country.GetAdjective] boli zlomené [ROOT.GetCountry.GetAdjective] vojakmi a naše ťaženia do [target_country.GetNameWithNoTooltip] ich oslably. So [target_country.GetAdjectiveWithNoTooltip] postavením v [ShowRegionName('balkan_region')] zníženým na úroveň menšej moci, ich ambície by nás už nemali trápiť." # todo: NEW TRANSLATION
 flavor_lat.7.a: "Rýchlo stabilizovať provincie znovu dobyté od [target_country.GetNameWithNoTooltip]." # todo: NEW TRANSLATION
 flavor_lat.7.a.entry: "Rýchlo stabilizovať provincie znovu dobyté od nich." # todo: NEW TRANSLATION
 flavor_lat.8.title: "Stará [GetCountry('BYZ').GetAdjectiveWithNoTooltip] elita" # todo: NEW TRANSLATION
 flavor_lat.8.entry: "Stará byzantská elita" # todo: NEW TRANSLATION
 flavor_lat.8.desc: "Keď bol [constantinople_location.GetName] opäť dobytý, nielenže to umožnilo obnovenie [ROOT.GetCountry.GetLongName], ale tiež to znamenalo koniec akýchkoľvek nádejí na ďalšie oživenie starého [GetCountry('BYZ').GetLongName], pričom mnohí zo starej [GetCountry('BYZ').GetAdjectiveWithNoTooltip] elity teraz s nechuťou skladajú väzalskú vernosť [ROOT.GetCountry.GetNameWithNoTooltip].\n\nMnohí v [ROOT.GetCountry.GetGovernment.GetCourtTitle] cítia, že kapitola starého [GetCountry('BYZ').GetLongNameWithNoTooltip] je konečne uzavretá a že je načase, aby [ROOT.GetCountry.GetLongNameWithNoTooltip] formálne zaujalo svoje miesto na svetovej scéne a vytvorilo si vlastnú identitu." # todo: NEW TRANSLATION
 flavor_lat.8.a: "Je čas pustiť starú [GetCountry('BYZ').GetAdjectiveWithNoTooltip] kultúru do zabudnutia." # todo: NEW TRANSLATION
 flavor_lat.8.a.entry: "Je čas pustiť starú $BYZ_ADJ$ kultúru do zabudnutia." # todo: NEW TRANSLATION
 flavor_lat.8.b: "Mali by sme zachovať dedičstvo [GetCountry('BYZ').GetAdjectiveWithNoTooltip] v novom [ROOT.GetCountry.GetFlavorRank]." # todo: NEW TRANSLATION
 flavor_lat.8.b.entry: "Mali by sme zachovať dedičstvo $BYZ_ADJ$ v novom panstve." # todo: NEW TRANSLATION
 flavor_lat.9.title: "Žiadosť [pap_country.GetAdjectiveWithNoTooltip] o konverziu [ShowReligionAdjectiveWithNoTooltip('orthodox')] území" # todo: NEW TRANSLATION
 flavor_lat.9.entry: "Pápež žiada konverziu byzantských území" # todo: NEW TRANSLATION
 flavor_lat.9.desc: "Výmenou za [pap_country.GetAdjective] podporu pri obnovení [ROOT.GetCountry.GetLongName] požiadal [pap_country.GetGovernment.GetRulerTitle], že keď bude [constantinople_location.GetName] konečne znovu získaný, nová [ROOT.GetCountry.GetAdjectiveWithNoTooltip] elita by mala zaviesť politiky na oslabenie vplyvu [ShowReligionAdjective('orthodox')] a posilnenie [ShowReligionAdjective('catholic')] viery. Teraz, keď je [constantinople_location.GetNameWithNoTooltip] opäť naše a [ROOT.GetCountry.GetLongNameWithNoTooltip] obnovené, [scope_pope_ruler.GetName] nás požiadal, aby sme dodržali dohodu a začali tieto politiky uplatňovať." # todo: NEW TRANSLATION
 flavor_lat.9.a: "Dodržať dohodu s [scope_pope_ruler.GetShortNameWithNoTooltip]." # todo: NEW TRANSLATION
 flavor_lat.9.a.entry: "Dodržať dohodu s ním." # todo: NEW TRANSLATION
 flavor_lat.9.b: "Nechať politiky vstúpiť do platnosti, ale uvoľniť ich vynucovanie." # todo: NEW TRANSLATION
 flavor_lat.9.c: "Porušiť dohodu a uprednostniť politiku tolerancie voči [ShowReligionAdjectiveWithNoTooltip('orthodox')] obyvateľstvu." # todo: NEW TRANSLATION
 lat_accepted_pope_latin_empire_proposal_tt: "Prijal ponuku pápeža na obnovenie Latinského impéria" # todo: NEW TRANSLATION

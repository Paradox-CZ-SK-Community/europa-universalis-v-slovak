l_polish:
 unlocked_advance_marble_tradition_tt: "Zažil $flavor_sie.1.title$ [dynamic_historical_event|e]" # todo: NEW TRANSLATION
 flavor_sie.1.title: "Banca Monte dei Paschi" # todo: NEW TRANSLATION
 flavor_sie.1.entry: "$flavor_sie.1.title$" # todo: NEW TRANSLATION
 flavor_sie.1.desc: "Mounts of Piety, or #italic Monte di Pietà#! sa stávajú v našej krajine a v jej okolí čoraz bežnejšími. Sú to charitatívne inštitúcie, ktoré využívajú prostriedky od darcov, aby umožnili menej šťastným ľuďom prístup k pôžičkám s nízkym úrokom. Financovanie jednej takejto organizácie v [monte_paschi_bank_hq.GetName] zvýši bohatstvo a všeobecnú prosperitu nášho [ROOT.GetCountry.GetFlavorRank] a bude slúžiť ako naša národná banka." # todo: NEW TRANSLATION
 flavor_sie.1.a: "Peniaze potečú." # todo: NEW TRANSLATION
 flavor_sie.1.b: "Skutočne zbožná inštitúcia!" # todo: NEW TRANSLATION
 flavor_sie.1.historical_info: "#italic La Banca Monte dei Paschi di Siena#! sa zrodila v Republike Sieny v roku 1472 a má status najstaršej nepretržite fungujúcej banky na svete. Pôvodne založená ako Monte di Pietà, získala svoju modernú podobu počas Veľkovojvodstva Toskánska a po zjednotení Talianska rozšírila svoju pôsobnosť na celý poloostrov." # todo: NEW TRANSLATION
 flavor_sie.2.title: "$flavor_sie.1.title$" # todo: NEW TRANSLATION
 flavor_sie.2.desc: "Monte di Pietà sú charitatívne organizácie určené na pomoc menej zvýhodneným. Avšak to, že naše počiatky sú takéto, neznamená, že z týchto alebo iných podnikaní nemôžeme očakávať zisk a obohatiť sa." # todo: NEW TRANSLATION
 flavor_sie.2.a: "Peniaze budú naše!" # todo: NEW TRANSLATION
 flavor_sie.3.entry: "$flavor_sie.3.title$" # todo: NEW TRANSLATION
 flavor_sie.3.title: "Zlatý vek [ShowLocationNameWithNoTooltip('siena')]" # todo: NEW TRANSLATION
 flavor_sie.3.desc: "Rozšírenie hraníc [ROOT.GetCountry.GetAdjective], spolu s mnohými rokmi pokoja a prosperity, vyústilo do zlatého veku v [target_location.GetRank.GetName] [target_location.GetName]. Ulice vrvia prácou aj oslavami, zabezpečujúc stály prúd bohatstva a hojnosti. Nikto si nemôže predstaviť koniec takéhoto blahobytu — mnohí sa dokonca pýtajú, či tento zlatý vek požiari obyvateľov [target_location.GetRank.GetNameWithNoTooltip] navždy." # todo: NEW TRANSLATION
 flavor_sie.3.a: "Tento zlatý vek bude trvať navždy!" # todo: NEW TRANSLATION
 sie_gain_modifier_until_the_black_death: "[ShowLocationName('siena')] získa [ShowModifier('sie_golden_age_of_siena')] [location_modifier|e] až do začiatku [ShowSituationNameWithNoTooltip('black_death')] [situation|e]" # todo: NEW TRANSLATION
 flavor_sie.4.entry: "$flavor_sie.4.title$" # todo: NEW TRANSLATION
 flavor_sie.4.title: "Obnova po [ShowSituationNameWithNoTooltip('black_death')]" # todo: NEW TRANSLATION
 flavor_sie.4.desc: "Mor, ktorý prešiel cez [ShowRegionName('italy_region')] a zvyšok [ShowContinentName('europe')], zanechal [target_location.GetName] poznačené. Jeho kedysi rušné ulice teraz znejú pochmúrnym pripomenutím, že smrť nemá obľúbencov; hriešnici i svätí sú pred Bledým jazdcom rovnako súdení. Namiesto toho, aby sme umožnili tejto skaze pokračovať, možno by sme mohli pomôcť ľuďom [target_location.GetNameWithNoTooltip]." # todo: NEW TRANSLATION
 flavor_sie.4.a: "Využijeme našu pokladnicu, aby sme sa pokúsili obnoviť [target_location.GetRank.GetNameWithNoTooltip]." # todo: NEW TRANSLATION
 flavor_sie.4.a.entry: "Využijeme pokladnicu, aby sme sa pokúsili obnoviť lokalitu." # todo: NEW TRANSLATION
 sie_all_pops_lose_satisfaction: "Všetky [pops|e] v [target_location.GetName] stratia [ShowNamedValue('pop_satisfaction_extreme_penalty')|+=2%] [pop_satisfaction|e]" # todo: NEW TRANSLATION
 flavor_sie.4.b: "Kruh života a smrti je večný a neodvratný." # todo: NEW TRANSLATION
 flavor_sie.5.entry: "$flavor_sie.5.title$" # todo: NEW TRANSLATION
 flavor_sie.5.title: "Vytvorenie prístavu v [ShowLocationNameWithNoTooltip('grosseto')]" # todo: NEW TRANSLATION
 flavor_sie.5.desc: "Naša námorná prítomnosť pozdĺž pobrežia [ShowRegionName('italy_region')] je ešte v plienkach. Napriek tomu mnohí z našich [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')] volajú po tom, aby [ROOT.GetCountry.GetName] výrazne rozšírilo svoje námorníctvo. Jedným z prvých miest, ktoré si vybrali pre tento projekt, je nedávno získaný [target_location.GetRank.GetName] [target_location.GetName].\n\nMnohí noví obyvatelia si zriadili domovy v [target_location.GetNameWithNoTooltip] v nádeji, že si všimneme rozsah jeho vplyvu v našom [ROOT.GetCountry.GetFlavorRank] a že urobíme úsilie správne tam vybudovať prístav." # todo: NEW TRANSLATION
 flavor_sie.5.a: "Ochráňme náš námorný obchod." # todo: NEW TRANSLATION
 flavor_sie.5.b: "Namiesto toho by sme sa mali sústrediť na naše pozemné hranice." # todo: NEW TRANSLATION
 flavor_sie.6.entry: "$flavor_sie.6.title$" # todo: NEW TRANSLATION
 flavor_sie.6.title: "Námorný vplyv v [ShowLocationNameWithNoTooltip('pitigliano')]" # todo: NEW TRANSLATION
 flavor_sie.6.desc: "Naši [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')] už dlhodobo postrádajú prostriedky, aby boli v [ShowRegionName('italy_region')] skutočne konkurencieschopnými námornými obchodníkmi. Zjavne im chýba sieť prístavov v [target_location.GetMarket.GetName], ktoré by mohli nazývať svojimi, no to neznamená, že nemáme žiadne možnosti.\n\n[target_location.GetRank.GetName] [target_location.GetName] upútal pozornosť mnohých našich [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('burghers_estate')], ktorí pred [ROOT.GetCountry.GetGovernment.GetCourtTitle] tvrdia, že by sa malo investovať do rozšírenia jeho prístavu a premeny na obchodné centrum prístupné každému obchodníkovi." # todo: NEW TRANSLATION
 flavor_sie.6.a: "Rozšírme tento prístav." # todo: NEW TRANSLATION
 flavor_sie.6.b: "Nevyčleníme celú pokladnicu na splnenie požiadaviek [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('burghers_estate')]." # todo: NEW TRANSLATION
 flavor_sie.6.b.entry: "Nevyčleníme celú pokladnicu na splnenie požiadaviek bohatých." # todo: NEW TRANSLATION
 flavor_sie.7.entry: "$flavor_sie.7.title$" # todo: NEW TRANSLATION
 flavor_sie.7.title: "Prístav v [ShowLocationNameWithNoTooltip('piombino')]" # todo: NEW TRANSLATION
 flavor_sie.7.desc: "Obchodníci, [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')] a [ROOT.GetCountry.GetGovernment.GetEstateName('peasants_estate')] sa všetci sťahujú do [target_location.GetName], [target_location.GetRank.GetName], ktorý výrazne upútal pozornosť [ROOT.GetCountry.GetGovernment.GetCourtTitle].\n\nKeďže rozšírenie jeho prístavu by posilnilo naše námorné obchodné trasy, mnohí z [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('burghers_estate')] sa obrátili na [target_character.GetName] s návrhom, aby sme použili prostriedky z národnej pokladnice na premenenie [target_location.GetRank.GetNameWithNoTooltip] na jedno z najvýznamnejších miest v celom [ShowRegionName('italy_region')]." # todo: NEW TRANSLATION
 flavor_sie.7.a: "Aby sme posilnili obchod, vytvoríme tento prístav." # todo: NEW TRANSLATION
 flavor_sie.7.b: "Nie je potrebné viac takýchto prístavov." # todo: NEW TRANSLATION
 flavor_sie.8.entry: "$flavor_sie.8.title$" # todo: NEW TRANSLATION
 flavor_sie.8.title: "Návrat vyhnanca" # todo: NEW TRANSLATION
 flavor_sie.8.desc: "Je mnoho tých medzi [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')], ktorí majú vplyv na [ROOT.GetCountry.GetAdjective] politiku, no nikto nedokázal dosiahnuť moc rodiny [GetDynasty('petrucci').GetName] — aspoň nie, kým nebola vyhnaná kvôli povestiam o pokuse o prevrat.\n\nNapriek tomu sa jeden člen rodiny [GetDynasty('petrucci').GetNameWithNoTooltip] vrátil do rodného mesta predkov [target_character.GetHerHis], slávneho [target_capital.GetRank.GetName] [target_capital.GetName]. Mnohí medzi obyčajnými vítajú [target_character.GetWomanMan], chvália [target_character.GetHerHis] meno a dúfajú, že ich vyslobodí z korupcie súčasných [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')]. Iní sa však obávajú opakovania starých ambícií a požadujú, aby [ROOT.GetCountry.GetGovernment.GetCourtTitle] vykázal [target_character.GetWomanMan] skôr, než sa rodina [GetDynasty('petrucci').GetNameWithNoTooltip] pokúsi o ďalší prevrat." # todo: NEW TRANSLATION
 flavor_sie.8.a: "Nebojíme sa vplyvu jedného jednotlivca." # todo: NEW TRANSLATION
 flavor_sie.8.b: "Existuje mnoho skvelých spôsobov, ako niekoho udržať na mieste..." # todo: NEW TRANSLATION
 flavor_sie.8.c: "Táto rodina bola vyhnaná z nejakého dôvodu." # todo: NEW TRANSLATION
 sie_triumphant_return_means_possibility_of_coup: "S návratom [target_character.GetName] do [ROOT.GetCountry.GetName] sa [target_character.GetSheHe] určite pokúsi uchopiť moc, ak sa [target_character.GetSheHe] stane naším [ruler|e]." # todo: NEW TRANSLATION
 flavor_sie.9.entry: "$flavor_sie.9.title$" # todo: NEW TRANSLATION
 flavor_sie.9.title: "Vzostup k moci" # todo: NEW TRANSLATION
 flavor_sie.9.desc: "Pred rokmi bol [ROOT.GetCountry.GetLongName] rozdelený, pričom rôzne rodiny obsadzovali rôzne úrady. To nechalo naše vedenie rozštiepené takmer v každej záležitosti. Avšak od vzostupu [target_character.GetName] boli mnohé z týchto pozícií obsadené lojálnymi poskokmi alebo členmi rodiny, ktorí plne podporujú túto zmenu v rozložení moci.\n\nNa stretnutí s [ROOT.GetCountry.GetGovernment.GetCourtTitle] si nikto nedovolil hovoriť proti [target_character.GetHerHim], obávajúc sa, že vplyv, ktorý [target_character.GetSheHe] mal, stačí na umlčanie akéhokoľvek politického oponenta.\n\nTáto kontrola nad [ROOT.GetCountry.GetFlavorRank] viedla k vzostupu rodu [target_character.GetDynasty.GetName] v [ROOT.GetCountry.GetNameWithNoTooltip]." # todo: NEW TRANSLATION
 flavor_sie.9.a: "Jedna rodina, ktorá vládne nad všetkými." # todo: NEW TRANSLATION
 flavor_sie.10.entry: "$flavor_sie.10.title$" # todo: NEW TRANSLATION
 flavor_sie.10.title: "Umelecký štýl [ShowLocationNameWithNoTooltip('siena')]" # todo: NEW TRANSLATION
 flavor_sie.10.desc: "[ShowInstitutionName('renaissance')] výrazne zmenila umelecké štýly po celom [ShowRegionName('italy_region')]. Jedným z najpozoruhodnejších vývojov je [ROOT.GetCountry.GetAdjective] štýl, ktorý sa zameriava na mystické a náboženské aspekty vyjadrenia. Bezprostredne súťaží s viac humanistickými, expresionistickými tradíciami z [ShowLocationName('florence')]. Mnohí členovia [ROOT.GetCountry.GetGovernment.GetCourtTitle] to vidia ako príležitosť šíriť našu kultúru po celom [ShowContinentName('europe')] a predviesť naše postavenie každému." # todo: NEW TRANSLATION
 flavor_sie.10.a: "Urobíme z [ShowLocationNameWithNoTooltip('siena')] najprestížnejšie miesto!" # todo: NEW TRANSLATION
 flavor_sie.10.b: "Nemáme peniaze na také ambície." # todo: NEW TRANSLATION
 flavor_sie.11.entry: "$flavor_sie.11.title$" # todo: NEW TRANSLATION
 flavor_sie.11.title: "Rozšírenie školy v [ShowLocationNameWithNoTooltip('siena')]" # todo: NEW TRANSLATION
 flavor_sie.11.desc: "Vrchol [ShowInstitutionName('renaissance')] úplne preformoval kultúrnu identitu [ShowRegionName('italy_region')], čo viedlo mnoho miest k prijatiu vlastných ikonických umeleckých štýlov. Pre [ROOT.GetCountry.GetAdjective] tradíciu je šťastím, že vznikla vlna nových umelcov, nadšených pre prácu v našom štýle.\n\nJedným z nich je [target_character.GetName], [target_character.GetWomanMan]. Chce zaviesť v [ShowLocationName('siena')] viac nábožensky ovplyvnenú estetiku." # todo: NEW TRANSLATION
 flavor_sie.11.a: "Prijmeme nových umelcov ako [target_character.GetHerHim]." # todo: NEW TRANSLATION
 flavor_sie.11.a.entry: "Prijmeme nových umelcov." # todo: NEW TRANSLATION
 flavor_sie.11.b: "Namiesto prijatia nášho súčasného štýlu by sme sa možno mali inšpirovať inými." # todo: NEW TRANSLATION
 flavor_sie.12.entry: "$flavor_sie.12.title$" # todo: NEW TRANSLATION
 flavor_sie.12.title: "Svätý zo [ShowLocationNameWithNoTooltip('siena')]" # todo: NEW TRANSLATION
 flavor_sie.12.desc: "Venovaný len [target_character.GetReligion.GetGodName], [target_character.GetName] je podľa mnohých obyvateľov [ShowLocationName('siena')] považovaný za najzbožnejšiu osobu v [ShowRegionName('italy_region')], hneď po pápežovi.\n\n[ROOT.GetCountry.GetGovernment.GetCourtTitle] si všimol [target_character.GetHerHis] horlivosť a zameranie na teologické diela. [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] to vidia ako príležitosť ukázať zvyšnej [ROOT.GetCountry.GetReligion.GetAdjective] svete našu oddanosť, zatiaľ čo [ROOT.GetCountry.GetGovernment.GetEstateName('peasants_estate')] vnímajú [target_character.GetHerHim] ako putujúceho svätca, ktorý im prinesie blahobyt." # todo: NEW TRANSLATION
 flavor_sie.12.a: "[ROOT.GetCountry.Custom('common_string_positive')]" # todo: NEW TRANSLATION
 flavor_sie.12.a.entry: "Skvelé!" # todo: NEW TRANSLATION

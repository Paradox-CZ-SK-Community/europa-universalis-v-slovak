l_polish:
  flavor_sie.1.title: "Banca Monte dei Paschi" # todo: NEW TRANSLATION
  flavor_sie.1.desc: "Mounts of Piety, or #italic Monte di Pietà#! sa stávajú v našej krajine a v jej okolí čoraz bežnejšími. Sú to charitatívne inštitúcie, ktoré využívajú prostriedky od darcov, aby umožnili menej šťastným ľuďom prístup k pôžičkám s nízkym úrokom. Financovanie jednej takejto organizácie v [monte_paschi_bank_hq.GetName] zvýši bohatstvo a všeobecnú prosperitu nášho [ROOT.GetCountry.GetFlavorRank] a bude slúžiť ako naša národná banka." # todo: NEW TRANSLATION
  flavor_sie.1.a: "Peniaze potečú." # todo: NEW TRANSLATION
  flavor_sie.1.b: "Skutočne zbožná inštitúcia!" # todo: NEW TRANSLATION
  flavor_sie.1.historical_info: "#italic La Banca Monte dei Paschi di Siena#! sa zrodila v Republike Sieny v roku 1472 a má status najstaršej nepretržite fungujúcej banky na svete. Pôvodne založená ako Monte di Pietà, získala svoju modernú podobu počas Veľkovojvodstva Toskánska a po zjednotení Talianska rozšírila svoju pôsobnosť na celý poloostrov." # todo: NEW TRANSLATION
  flavor_sie.2.title: "$flavor_sie.1.title$" # todo: NEW TRANSLATION
  flavor_sie.2.desc: "Monte di Pietà sú charitatívne organizácie určené na pomoc menej zvýhodneným. Avšak to, že naše počiatky sú takéto, neznamená, že z týchto alebo iných podnikaní nemôžeme očakávať zisk a obohatiť sa." # todo: NEW TRANSLATION
  flavor_sie.2.a: "Peniaze budú naše!" # todo: NEW TRANSLATION

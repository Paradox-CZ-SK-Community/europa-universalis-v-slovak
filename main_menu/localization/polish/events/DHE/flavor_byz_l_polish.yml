 flavor_byz.1501.desc.a: "Hoci komúna [target_location.GetName] sa krátko vzbúrila proti miestnym [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')], podarilo sa nám obnoviť poriadok v [target_location.GetRank.GetName]. Modlime sa, aby sa už nikdy nevzburili." # todo: NEW TRANSLATION
 flavor_byz.1501.desc.b: "Napriek našim najlepším snahám zabrániť povstaniu [ROOT.GetCountry.GetGovernment.GetEstateName('peasants_estate')] z [target_location.GetName], [target_character.GetName] zlyhal v zadržaní tejto iskry, čo viedlo k tomu, že sa oblasti okolo [target_location.GetRank.GetName] pridali k povstaniu." # todo: NEW TRANSLATION
 flavor_byz.1501.a: "Katastrofa bola odvrátená." # todo: NEW TRANSLATION
 flavor_byz.1501.b: "Je čas potlačiť toto roľnícke nadšenie." # todo: NEW TRANSLATION

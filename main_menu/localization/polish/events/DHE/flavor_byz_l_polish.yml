l_polish:
 flavor_byz.1.title: "Vyplienenie a zničenie Benátok" # todo: NEW TRANSLATION
 flavor_byz.1.entry: "$flavor_byz.1.title$" # todo: NEW TRANSLATION
 flavor_byz.1.desc: "Dychtiví pomstiť sa za legendárne zradenie križiakmi, [ROOT.GetCountry.GetAdjective] vojská nikoho nešetrili, keď sa zrútili na kedysi veľké mesto [ShowLocationName('venice')]. Úlohou cisárskych generálov bolo vždy jasné: všetky patricijské rodiny musia byť zbavené majetku a čestí a poklady, ktoré boli raz ukradnuté mestu želania sveta, musia byť vrátené.\n\nKeď prišiel čas zostupu [ROOT.GetCountry.GetAdjectiveWithNoTooltip] armád na Mesto vôd, veci sa stali strašnejšími, než kto kedy mohol predstaviť. Život plný vojen v nikom nevychováva láskavosť a so veliteľmi dychtivými vidieť mesto v plameňoch sa [ROOT.GetCountry.GetAdjectiveWithNoTooltip] vojaci pustili do niekoľkodňovej kampane zničenia a drancovania chrámov, palácov a dokonca aj benátskej zbrojnice." # todo: NEW TRANSLATION
 flavor_byz.1.a: "Oderint dum metuant." # todo: NEW TRANSLATION
 flavor_byz.1.b: "Zastavte rabovanie!" # todo: NEW TRANSLATION
 variable_venice_acquired_peacefully_variable_tt: "[ShowLocationName('venice')] bol získaný mierovou cestou" # todo: NEW TRANSLATION
 STATIC_MODIFIER_NAME_chastening_of_venice: "Potrestanie Benátok" # todo: NEW TRANSLATION
 STATIC_MODIFIER_DESC_chastening_of_venice: "Vyplienenie a zničenie, ktorým mesto Benátky trpelo po tom, čo sa dostalo pod byzantskú kontrolu, na ňom zanechalo trvalú stopu." # todo: NEW TRANSLATION
 flavor_byz.2.title: "Atény znovu získané!" # todo: NEW TRANSLATION
 flavor_byz.2.entry: "$flavor_byz.2.title$" # todo: NEW TRANSLATION
 flavor_byz.2.desc: "Po stáročia bola [ShowLocationName('athens')] centrom [ROOT.GetCountry.GetAdjectiveWithNoTooltip] kultúry a umenia, až kým nepadla do rúk Latinov v Štvrtom križiackom výprave. V poslednom čase bolo mesto hlavným mestom nezávislého vojvodstva spravovaného rôznymi západnými rodmi. Ten čas sa však skončil a po prvý raz od roku 1204 je [ShowLocationNameWithNoTooltip('athens')] opäť súčasťou [ROOT.GetCountry.GetLongName]." # todo: NEW TRANSLATION
 flavor_byz.2.desc_hellenic: "Sväté mesto [ShowLocationName('athens')], rodište filozofie a starej múdrosti, sa vrátilo tým, ktorí ctia starých bohov. Pre [ShowReligionAdjective('hellenism_religion')] [ROOT.GetCountry.GetFlavorRank] je to rovnako duchovné víťazstvo ako vojenské — mesto samotnej Atheny je opäť naše." # todo: NEW TRANSLATION
 flavor_byz.2.desc_other: "Starobylé mesto [ShowLocationName('athens')], dlho kultúrne srdce starého sveta, sa vrátilo pod kontrolu [ROOT.GetCountry.GetAdjective] po stáročiach cudzej nadvlády. Po prvý raz od roku 1204 je [ShowLocationNameWithNoTooltip('athens')] opäť súčasťou [ROOT.GetCountry.GetLongName]." # todo: NEW TRANSLATION
 flavor_byz.2.a: "A navždy!" # todo: NEW TRANSLATION
 flavor_byz.2.b: "Mesto Athény je nám navrátené!" # todo: NEW TRANSLATION
 flavor_byz.2.c: "Veľké víťazstvo pre [ROOT.GetCountry.GetFlavorRank]." # todo: NEW TRANSLATION
 flavor_byz.2.c.entry: "Veľké víťazstvo pre ríšu." # todo: NEW TRANSLATION
 flavor_byz.3.title: "$izmit.greek_language$ znovu získané!" # todo: CHANGED
 flavor_byz.3.entry: "$flavor_byz.3.title$" # todo: NEW TRANSLATION
 flavor_byz.3.desc: "$izmit.greek_language$, alebo $izmit$, ako ho Turci nazývali, bol kľúčovým mestom [ROOT.GetCountry.GetAdjective] na pobreží Malej Ázie viac než tisíc rokov, než bol nakoniec v roku 1337 dobytý útočiacimi silami [ShowCultureName('turkish_culture')]. Jeho návrat nás stavia do ideálnej pozície na opätovné rozšírenie do Malej Ázie." # todo: CHANGED
 flavor_byz.3.desc_hellenic: "$izmit$, známe v staroveku ako $izmit.greek_language$, bolo kedysi hlavným mestom kráľovstva Bithýnia a veľkým mestom helenistického východu. Dlho predtým, než sa stalo základným pilierom našej [ROOT.GetCountry.GetFlavorRank], stálo ako centrum civilizácie [ShowCultureName('greek_culture')]. Jeho návrat nás opäť stavia na prah Anatólie." # todo: NEW TRANSLATION
 flavor_byz.3.desc_other: "$izmit.greek_language$, alebo $izmit, ako mu Turci hovorili, bolo viac než tisíc rokov kľúčovým [ROOT.GetCountry.GetAdjective] mestom na pobreží Malej Ázie, kým ho v roku 1337 nezískali útočiace sily [ShowCultureName('turkish_culture')]. Jeho návrat nás stavia do ideálnej pozície na opätovné rozšírenie do Malej Ázie." # todo: NEW TRANSLATION
 flavor_byz.3.a: "A tak urobíme!" # todo: NEW TRANSLATION
 flavor_byz.3.b: "Staroveká Bithýnia je opäť naša!" # todo: NEW TRANSLATION
 flavor_byz.3.c: "Naša základňa v Anatólii je zabezpečená." # todo: NEW TRANSLATION
 flavor_byz.4.title: "Antióchia znovu získaná!" # todo: NEW TRANSLATION
 flavor_byz.4.entry: "$flavor_byz.4.title$" # todo: NEW TRANSLATION
 flavor_byz.4.desc: "Stratené [ShowCultureName('turkish_culture')] bejlikmi v roku 1084, [ShowLocationName('antioch')] bolo nazývané kolískou [ShowReligionGroupName('christian')]. Hoci už nie je metropolou, akou kedysi bývalo, zostáva dôležitým posvätným miestom." # todo: CHANGED
 flavor_byz.4.desc_hellenic: "[ShowLocationName('antioch')] založil Seleukos I. Nikátor, jeden z veľkých nástupcov Alexandra, ako hlavné mesto svojej Seleukovskej ríše. Po stáročia to bolo jedno z najvýznamnejších miest helenistického sveta, veľké centrum kultúry a učenia [ShowCultureName('greek_culture')]. Jeho znovudobytie je hodné uznania pre každého dediča toho starého dedičstva." # todo: NEW TRANSLATION
 flavor_byz.4.desc_other: "Veľké sväté miesto [ShowLocationName('antioch')], ktoré stratili bejliky [ShowCultureName('turkish_culture')] v roku 1084, sa konečne vrátilo pod cisársku kontrolu. Hoci jeho starobylá sláva počas storočí vybledla, [ShowLocationNameWithNoTooltip('antioch')] zostáva významnou pamätihodnosťou a strategickou bránou na východ." # todo: NEW TRANSLATION
 flavor_byz.4.a: "Deus vult!" # todo: NEW TRANSLATION
 flavor_byz.4.b: "[ShowLocationNameWithNoTooltip('antioch')], klenot helenistického východu, je náš!" # todo: NEW TRANSLATION
 flavor_byz.4.c: "[ROOT.GetCountry.GetFlavorRank] siaha ďalej na východ." # todo: NEW TRANSLATION
 flavor_byz.4.c.entry: "Ríša siaha ďalej na východ." # todo: NEW TRANSLATION
 flavor_byz.5.title: "Jeruzalem znovu získaný!" # todo: NEW TRANSLATION
 flavor_byz.5.entry: "$flavor_byz.5.title$" # todo: NEW TRANSLATION
 flavor_byz.5.desc: "Stratený Arabom v roku 634, [ShowLocationName('jerusalem')] bol kedysi centrom [ShowReligionGroupAdjective('christian')] uctievania v Ríši. Jeho znovudobytie určite pozdvihne morálku všetkých [ShowReligionGroupAdjectiveWithNoTooltip('christian')] ľudí." # todo: NEW TRANSLATION
 flavor_byz.5.desc_hellenic: "[ShowLocationName('jerusalem')] už dlhý čas predstavuje miesto veľkého významu pre mnohé vierovyznania, a jeho znovudobytie rozširuje našu nadvládu hlboko do starého impériového srdca. Hoci pre uctievanie [ShowReligionAdjective('hellenism_religion')] nemá osobitný význam, ovládanie takého slávneho miesta prináša vlastnú strategickú hodnotu." # todo: NEW TRANSLATION
 flavor_byz.5.desc_other: "Mesto [ShowLocationName('jerusalem')], ktoré od roku 634 držia cudzie mocnosti, sa vrátilo pod cisársku kontrolu. Jeho znovudobytie posilňuje našu pozíciu v regióne a pridáva našemu panstvu prestížne sväté miesto." # todo: NEW TRANSLATION
 flavor_byz.5.a: "Deus vult!" # todo: NEW TRANSLATION
 flavor_byz.5.b: "Jeho hodnota je strategická, nie duchovná." # todo: NEW TRANSLATION
 flavor_byz.5.c: "Ďalšie sväté miesto vrátené [ROOT.GetCountry.GetFlavorRank]." # todo: NEW TRANSLATION
 flavor_byz.5.c.entry: "Ďalšie sväté miesto vrátené ríši." # todo: NEW TRANSLATION
 flavor_byz.6.title: "Rím znovu získaný!" # todo: NEW TRANSLATION
 flavor_byz.6.entry: "$flavor_byz.6.title$" # todo: NEW TRANSLATION
 flavor_byz.6.desc: "Hoci Rím nebol vždy priamo pod kontrolou Ríše, [ShowLocationName('rome')] definitívne prerušil všetky [ROOT.GetCountry.GetAdjective] väzby, keď pápež Lev III korunoval [GetCharacter('fra_charlemagne').GetName] za svätého rímskeho cisára. Teraz je však mesto opäť v našich rukách a hoci utrpelo veľa škôd, stále je to veľmi prestížne mesto na ovládanie." # todo: NEW TRANSLATION
 flavor_byz.6.desc_hellenic: "Ešte dávno predtým, než pápeži a samozvaní cisári si nárokovali [ShowLocationName('rome')], to bolo západné sídlo nášho Impéria — mesto, ktorého dedičstvo siaha až k samotným zakladateľom civilizácie. Teraz, oslobodené od pápežského zasahovania, môže [ShowLocationNameWithNoTooltip('rome')] opäť stáť ako monument trvalej slávy starovekého sveta." # todo: NEW TRANSLATION
 flavor_byz.6.desc_other: "Starobylé mesto [ShowLocationName('rome')], hoci zmenšené oproti svojej bývalej sláve, zostáva jedným z najprestížnejších miest v známom svete. Jeho návrat do cisárskych rúk je významným úspechom a spolu s ním sa posilňuje náš nárok na staroveké západné impérium." # todo: NEW TRANSLATION
 flavor_byz.6.a: "Rím, mesto, kde to všetko začalo, je opäť v našich rukách." # todo: CHANGED
 flavor_byz.6.b: "Starodávne hlavné mesto je navrátené svojim právoplatným dedičom!" # todo: NEW TRANSLATION
 flavor_byz.6.c: "Cisárska korisť bez porovnania." # todo: NEW TRANSLATION
 flavor_byz.7.title: "V Ríme obnovená ortodoxia!" # todo: NEW TRANSLATION
 flavor_byz.7.entry: "$flavor_byz.7.title$" # todo: NEW TRANSLATION
 flavor_byz.7.desc: "Ľudia v [ShowLocationName('rome')] opäť nasledujú vieru [ShowReligionAdjective('orthodox')], niekoľko zatvrdených papistov sa ukrýva. Hoci to určite neukončí Veľké schizmy — ak vôbec, tak ju prehĺbi — dá to Východnej pravoslávnej cirkvi výhodu v večnom boji o náboženskú autoritu." # todo: NEW TRANSLATION
 flavor_byz.7.a: "Toto máte, schizmatici!" # todo: NEW TRANSLATION
 flavor_byz.8.title: "Turci vyhnaní z Anatólie!" # todo: NEW TRANSLATION
 flavor_byz.8.entry: "$flavor_byz.8.title$" # todo: NEW TRANSLATION
 flavor_byz.8.desc: "Sily [GetCountry('TUR').GetName] boli vyhnané z [ShowRegionName('anatolia_region')], ktoré bolo kedysi sídlom ich moci. S [ShowRegionNameWithNoTooltip('anatolia_region')] zabezpečenou je naše blaho zaistené!" # todo: NEW TRANSLATION
 flavor_byz.8.a: "Fénix vstáva!" # todo: NEW TRANSLATION
 towns_and_cities_anatolia_get_pop_growth_tt: "[Concept('towns_and_cities','Mestské lokality')|e], ktoré ovládame v [ShowRegionNameWithNoTooltip('anatolia_region')], budú profitovať z [ShowModifier('repopulation_of_anatolia_modifier')] [Concept('modifier','modifikátora')|e] po dobu #Y 10#! rokov" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 flavor_byz.9.title: "Západné turné [ROOT.GetCountry.GetGovernment.GetRulerTitle]" # todo: NEW TRANSLATION
 flavor_byz.9.entry: "$flavor_byz.9.title$" # todo: NEW TRANSLATION
 flavor_byz.9.desc: "Sily [GetCountry('TUR').GetName] už nejaký čas vnikajú do našich veľkých miest a priamo ohrozujú naše veľké mesto [target_province.GetName]. Napriek rozkolu medzi Východnou a Západnou cirkvou navrhuje [ROOT.GetCountry.GetGovernment.GetRuler.GetName] viesť diplomatickú misiu k našim bratrom [ShowReligionGroupAdjective('christian')] na Západe, aby získal dosť prostriedkov na odrazenie [GetCountry('TUR').GetAdjectiveWithNoTooltip].\n\nHoci je to pravdepodobne výnosné, poškvrní to našu povesť a bude nás to robiť slabými." # todo: NEW TRANSLATION
 flavor_byz.9.a: "Urobte potrebné prípravy." # todo: NEW TRANSLATION
 flavor_byz.9.tt: " [ROOT.GetCountry.GetGovernment.GetRulerTitle] navštívi dvory západnej Európy v snahe získať prostriedky. Pravdepodobne to bude vnímané ako prejav slabosti a poškodí to naše medzinárodné postavenie" # todo: NEW TRANSLATION
 flavor_byz.9.b: "[ROOT.GetCountry.GetGovernment.GetRuler.GetShortNameWithNoTooltip] musí zostať, aby zvolal naše sily." # todo: NEW TRANSLATION
 flavor_byz.9.b.entry: "Vladár musí zostať, aby zvolal naše sily." # todo: NEW TRANSLATION
 flavor_byz.10.title: "[donated_to_byzantium.GetNameWithNoTooltip] daruje našej veci" # todo: NEW TRANSLATION
 flavor_byz.10.entry: "Dar pre Byzanciu prispieva našej veci" # todo: NEW TRANSLATION
 flavor_byz.10.desc: "Štedrosť našich spolubráčov [ShowReligionGroupAdjective('christian')] panovníkov neostala bez povšimnutia. Diplomatické úsilie [ROOT.GetCountry.GetGovernment.GetRulerTitle] sa vyplatilo a prišla značná dotácia na podporu nášho boja proti [GetCountry('TUR').GetName]." # todo: NEW TRANSLATION
 flavor_byz.10.a: "Naše bohatstvo obnovené." # todo: NEW TRANSLATION
 flavor_byz.11.title: "Krétska škola umenia" # todo: NEW TRANSLATION
 flavor_byz.11.entry: "$flavor_byz.11.title$" # todo: NEW TRANSLATION
 flavor_byz.11.desc: "Máloktoré školy v našej krajine mali taký vplyv na šírenie bohatstva a krásy [GetCountry('BYZ').GetAdjectiveWithNoTooltip] umenia a ikonografie ako krétska škola umenia. Škola je predurčená stať sa centrom kultúry a umenia, keď naďalej priťahuje vynikajúcich študentov pod vedením mužov ako [target_artist.GetName]." # todo: NEW TRANSLATION
 flavor_byz.11.a: "Priviesť ho na dvor." # todo: CHANGED
 flavor_byz.11.b: "On rozšíri našu legendu v cudzine!" # todo: CHANGED
 flavor_byz.11.c: "Nemôžeme si to dovoliť..." # todo: NEW TRANSLATION
 flavor_byz.12.title: "El Greco" # todo: NEW TRANSLATION
 flavor_byz.12.entry: "$flavor_byz.12.title$" # todo: NEW TRANSLATION
 flavor_byz.12.desc: "Len málo umelcov zanechalo na stále sa meniacom poli umenia tak výraznú stopu ako [target_artist.GetName], známy aj ako #italic el Greco#!. Napriek tomu, že jeho diela sa stali protiváhou ranobarokovému štýlu, úspešne vytvoril nový, odlišný priestor tým, že uprednostnil primát predstavivosti a intuície pred subjektívnym charakterom tvorby, čím rozhýbal vlny v umeleckom svete naprieč hálami [ShowContinentName('europe')]." # todo: CHANGED
 flavor_byz.12.a: "Jeho obrazy ozdobia naše steny." # todo: CHANGED
 flavor_byz.12.c: "Nemôžeme si to dovoliť..." # todo: NEW TRANSLATION
 get_el_greco_as_painter_tt: "[target_artist.GetNameWithNoTooltip] sa objaví ako #italic maliar#!" # todo: NEW TRANSLATION
 get_el_greco_as_sculptor_tt: "[target_artist.GetNameWithNoTooltip] sa objaví ako #italic sochár#!" # todo: NEW TRANSLATION
 flavor_byz.13.title: "Brilantné centrum učenia" # todo: NEW TRANSLATION
 flavor_byz.13.entry: "$flavor_byz.13.title$" # todo: NEW TRANSLATION
 flavor_byz.13.desc: "Napriek ťažkostiam obklopujúcim náš ľud zostávajú naše umenia a kultúra živé a prestížne ako nikdy predtým. Žiadne miesto nie je lepším príkladom nášho umeleckého vplyvu a kultivácie než [target_location.GetName]. Slúžiac ako odrazový mostík k rozvoju a šíreniu [ShowInstitutionName('renaissance')], ľudia privítali a rozvinuli školy umenia a myslenia a zažili nádherné zlaté obdobie filozofie a [ROOT.GetCountry.GetAdjective] prejavu." # todo: NEW TRANSLATION
 flavor_byz.13.a: "Financovať jeho rozšírenie." # todo: NEW TRANSLATION
 flavor_byz.13.b: "Nech sa bohatstvo rozšíri po [target_province.GetNameWithNoTooltip]!" # todo: CHANGED
 flavor_byz.13.b.entry: "Nech sa bohatstvo rozdelí po celej provincii!" # todo: NEW TRANSLATION
 flavor_byz.13.c: "Tieto peniaze je lepšie vynaložiť inde." # todo: NEW TRANSLATION
 flavor_byz.14.title: "Návrh [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')]" # todo: NEW TRANSLATION
 flavor_byz.14.entry: "$flavor_byz.14.title$" # todo: NEW TRANSLATION
 flavor_byz.14.desc: "Naša flotila už dlhý čas chátra. To, čo bolo kedysi hrdým odvetvím našej mohutnej moci, sa stalo predmetom posmechu sveta. Nepochybne sa naši drzí susedia, ktorí túžia po našej krajine, pustili do sporu o naše námorné panstvo a často vykonávajú vpády cez naše prístavy. V čase našej núdze sa delegáti zo [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] prihlásili s kurióznym návrhom. Podľa ich korešpondencie chcú prevziať velenie nad našimi námornými silami a zároveň ich financovať..." # todo: NEW TRANSLATION
 flavor_byz.14.a: "Nemôžeme sa na nich spoliehať!" # todo: CHANGED
 flavor_byz.14.b: "[ROOT.GetCountry.Custom('common_string_positive')]" # todo: CHANGED
 flavor_byz.14.b.entry: "$common_string_brilliant$" # todo: NEW TRANSLATION
 byz_magnates_wont_offer_again_tt: "[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')] už znovu neponúkne svoju pomoc v námorných záležitostiach" # todo: NEW TRANSLATION
 flavor_byz.15.title: "Námorné reformy [ROOT.GetCountry.GetGovernment.GetRulerOrRegent.GetNameWithNoTooltip]" # todo: CHANGED
 flavor_byz.15.entry: "$flavor_byz.15.title$" # todo: NEW TRANSLATION
 flavor_byz.15.desc: "Nie je žiadnym tajomstvom, že naša flotila zažila lepšie dni. Nedávne nepokoje, ktorými si náš ľud prešiel, vysušili cisársku pokladnicu, čo viedlo k škrtom a nedostatkom vo všetkých oblastiach. Napriek tomu naši poradcovia pod vedením [target_character.GetName] vypracovali plán, ako získať späť časť našej starej námornej slávy!" # todo: NEW TRANSLATION
 flavor_byz.15.a: "Môžeme ospravedlniť takúto reformu." # todo: CHANGED
 flavor_byz.15.b: "Nech je reforma rozsiahla a ďalekosiahla!" # todo: CHANGED
 flavor_byz.15.c: "Tieto peniaze je najlepšie minúť inde..." # todo: NEW TRANSLATION
 if_we_pass_naval_reform_disaster_panel_tt: "To prinesie výhody, ak sa rozhodneme zreformovať naše [Concept('navy','námorníctvo')|e] prostredníctvom [ShowGenericActionName('reform_imperial_armies')] [Concept('action','akcie')|e] v paneli [ShowDisasterName('fate_of_the_phoenix')] [Concept('disaster','katastrofe')|e]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 following_rewards_are_bolstered_because_of_disaster_action_tt: "Nasledujúce odmeny sú posilnené, pretože sme sa rozhodli zreformovať naše [Concept('navy','námorníctvo')|e] aspoň raz prostredníctvom [ShowGenericActionName('reform_imperial_armies')] [Concept('action','akcie')|e] v paneli [ShowDisasterName('fate_of_the_phoenix')] [Concept('disaster','katastrofe')|e]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 flavor_byz.16.title: "[target_character.GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 flavor_byz.16.entry: "Konstantinos Armenopoulos" # todo: NEW TRANSLATION
 flavor_byz.16.desc: "Ako tichý víchor sa nový právny traktát ujal medzi právnikmi a byrokratmi nášho [ROOT.GetCountry.GetFlavorRank]. Nedávno publikovaný traktát #italic Hexabiblos#! od mladého [target_character.GetName] zhromaždil, krížovo odkazoval a oživil väčšinu [ROOT.GetCountry.GetAdjective] právnej vedy do jedného zväzku obrovskej užitočnosti pre riadne uplatňovanie zákona.\n\nMali by sme tohto mladého juristu pozvať ku nášmu dvoru ako odmenu za jeho dôkladnú prácu?" # todo: NEW TRANSLATION
 flavor_byz.16.a: "Pošlite mu pozvánku." # todo: NEW TRANSLATION
 flavor_byz.16.b: "Nie, nechceme tu viac právnikov." # todo: NEW TRANSLATION
 flavor_byz.17.title: "Anjelský hlas [john_koukouzelis.GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 flavor_byz.17.entry: "The Angelic Voice of John Koukouzelis" # todo: NEW TRANSLATION
 flavor_byz.17.desc: "Úmrtie veľkého [john_koukouzelis.GetName] zahalilo baziliky [ROOT.GetCountry.GetLongName] žalostným tieňom, mnohí oplakávajú stratu jeho hlasu a najučenší oplakávajú stratu jeho skladateľských rúk.\n\nAvšak svetlo nádeje svitá na našom dvore, keď sa príbehy o jeho zjavovaniach Matky Božej šíria z úst do úst. Pobožnosť jeho života a mnohé zázraky pripisované jemu tlačia miestné kléry, aby žiadali jeho kanonizáciu." # todo: NEW TRANSLATION
 flavor_byz.17.a: "Poďme hovoriť s patriarchom!" # todo: NEW TRANSLATION
 flavor_byz.17.b: "Tieto záležitosti nás nezaujímajú." # todo: NEW TRANSLATION
 flavor_byz.18.title: "Pád [GetCountry('BYZ').GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 flavor_byz.18.entry: "Fall of $BYZ$" # todo: NEW TRANSLATION
 flavor_byz.18.desc: "S pádom [GetCountry('BYZ').GetName] bol otrasen svet [ShowCultureName('greek_culture')]. Po mesiacoch a mesiacoch bytia v moci [target_country.GetName] padli múry [target_location.GetName]. [target_country.GetAdjectiveWithNoTooltip] sily vtrhli do mesta a vyrabovali ho, čo zasiahlo hlboko [ShowCultureNameWithNoTooltip('greek_culture')] populáciu po celom svete. Hoci fénix je teraz preč, veľká časť našej populácie bola touto správou zranená, predovšetkým komunity v [target_location2.GetName]." # todo: NEW TRANSLATION
 flavor_byz.18.a: "Purpurový fénix už neexistuje." # todo: NEW TRANSLATION
 BYZ_FALL_OF_BYZANTIUM_CONVERSION: "Všetky naše [ShowCultureName('greek_culture')] [Concept('pops','populácie')|e] stratia [ShowNamedValue('pop_satisfaction_extreme_penalty')|+=2%] [Concept('pop_satisfaction','spokojnosť populácie')|e]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 flavor_byz.19.title: "Ochrana [ShowAreaNameWithNoTooltip('morea_area')]" # todo: NEW TRANSLATION
 flavor_byz.19.entry: "Protecting Morea Area" # todo: NEW TRANSLATION
 flavor_byz.19.desc: "Počas Štvrtého krížiackeho výpravy a pádu [ShowLocationName('constantinople')] boli územia [ShowAreaName('morea_area')] dočasne obsadené Frankami, keď sa naša Ríša rozdelila. Ich vplyv v regióne stále pretrváva, pretože sa tam stále pohybujú žoldnieri priamo odporujúci našej vláde." # todo: NEW TRANSLATION
 flavor_byz.19.a: "Musíme chrániť obyvateľov [ShowAreaNameWithNoTooltip('morea_area')] pred akýmkoľvek vonkajším ohrozením." # todo: NEW TRANSLATION
 flavor_byz.20.title: "Reforma Všeobecných sudcov Rimanov" # todo: NEW TRANSLATION
 flavor_byz.20.entry: "$flavor_byz.20.title$" # todo: NEW TRANSLATION
 flavor_byz.20.desc: "Hoci náš najvyšší súd podstúpil nedávne reformy za predchádzajúcich vládcov, vyplával na povrch nový škandál. Traja zo štyroch sudcov boli obvinení z korupcie, ignorujúc dobro národa v prospech vlastných záujmov. [target_character.GetName] sa o týchto správach dozvedel a plánuje sa zbaviť akejkoľvek formy korupcie v Najvyššom súde." # todo: NEW TRANSLATION
 flavor_byz.20.historical_info: "Hoci bol vytvorený na konci 13. storočia Andronikosom II. Palaiologosom, Všeobecní sudcovia Rimanov obsahovali niekoľko skorumpovaných sudcov. Po vyšetrovaní Andronikom III. Palaiologosom v roku 1337 boli traja zo štyroch sudcov uznaní vinnými a orgán bol čiastočne reformovaný." # todo: NEW TRANSLATION
 flavor_byz.20.a: "Korupcia v tomto systéme musí byť odstránená." # todo: NEW TRANSLATION
 flavor_byz.20.b: "Súčasný systém je v poriadku." # todo: NEW TRANSLATION
 able_to_add_reform_later_tt: "Tento [Concept('government_reform','reforma vlády')|e] budeme môcť prijať neskôr" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 flavor_byz.21.title: "Akritické piesne" # todo: NEW TRANSLATION
 flavor_byz.21.entry: "$flavor_byz.21.title$" # todo: NEW TRANSLATION
 flavor_byz.21.desc: "V časoch skorého [GetCountry('BYZ').GetName] mnohí pohraniční bojovníci známi ako #italic Akritais#! bojovali na obranu [ShowRegionName('anatolia_region')] pred invázou [ShowCultureGroupName('arabian_group')]. To viedlo k zrodu mnohých veľkých básní a hrdinov v [ShowCultureName('greek_culture')] literatúre, ako napríklad #italic Digenes Akritas#!." # todo: CHANGED
 flavor_byz.21.historical_info: "Mnohé z týchto básní sú považované za začiatok moderného gréckeho písomníctva, niektoré sa stali symbolom gréckeho nacionalizmu. Jednou z týchto básní, a možno tou najznámejšou, je príbeh Digenesa Akritasa, pohraničníka grécko-arabskeho pôvodu, ktorý chráni Byzantskú ríšu pred Arabmi a dokonca zabíja mýtické bytosti, ako draky." # todo: NEW TRANSLATION
 flavor_byz.21.a: "Nech sú tieto básne známe celému svetu." # todo: NEW TRANSLATION
 flavor_byz.22.title: "Pieseň o Armourisovi" # todo: NEW TRANSLATION
 flavor_byz.22.entry: "$flavor_byz.22.title$" # todo: NEW TRANSLATION
 flavor_byz.22.desc: "Jedna z najväčších akritických básní je #italic Armouris Armouropoulos#!. Jeho dobrodružstvá obsahujú niekoľko herkulovských činov, ako boj proti armáde Saracénov sám za \"deň a noc\". Hoci je v dôsledku tohto boja zosadený z koňa, prenasleduje toho, kto mu ukradol koňa, až do Sýrie, kde mu nakoniec oba ramená usekne za krádež. Hoci bola pôvodne napísaná v 11. storočí, veľká časť jej obsahu sa stratila. Možno sa teraz môžeme pokúsiť obnoviť niektoré jej časti, aj keď nebudú úplne presné." # todo: NEW TRANSLATION
 flavor_byz.22.historical_info: "$flavor_byz.21.historical_info$" # todo: NEW TRANSLATION
 flavor_byz.22.a: "Stojí to za námahu." # todo: NEW TRANSLATION
 flavor_byz.22.b: "Neznehodnotíme naše staré umelecké diela." # todo: NEW TRANSLATION
 flavor_byz.23.title: "Príbeh mramorového vládcu" # todo: NEW TRANSLATION
 flavor_byz.23.entry: "$flavor_byz.23.title$" # todo: NEW TRANSLATION
 flavor_byz.23.desc: "Hoci [ShowLocationName('constantinople')] už nie je v rukách [ShowCultureGroupName('greek_group')], mnohí veria, že jeho posledný vládca nebol zabitý v [target_character.GetHerHis] posledných okamihoch. Namiesto toho, vedený anjelmi a svetlom zapadajúceho slnka, bol [target_character.GetSheHe] zachránený pod [ShowBuildingTypeName('theodosian_walls')], kde bol zmenený na mramor. Dodnes nikto nevie, či sú tieto fámy pravdivé, ale niekedy môže fikcia zmeniť vnímanie reality." # todo: NEW TRANSLATION
 flavor_byz.23.a: "[target_character.GetNameWithNoTooltip] nech bude Mramorovým vládcom." # todo: NEW TRANSLATION
 flavor_byz.23.historical_info: "Mramorový cisár existoval v mnohých iných kultúrach. Pre Grékov bol Konstantinos XI. Palaiologos možno jedným z najslávnejších cisárov Byzantskej ríše. Hovorilo sa, že počas obliehania Konštantínopola v roku 1453 nezomrel v boji a raz sa vráti, aby obnovil svoju ríšu." # todo: NEW TRANSLATION
 BYZ_MARBLED_EMPEROR_TOOLTIP: "Niekedy môže byť história osoby pozmenená, dokonca aj história [target_character.GetName]..." # todo: NEW TRANSLATION
 flavor_byz.24.title: "Stavraton" # todo: NEW TRANSLATION
 flavor_byz.24.entry: "$flavor_byz.24.title$" # todo: NEW TRANSLATION
 flavor_byz.24.desc: "Keď sa naša stará mena, #italic Hyperpyron#!, pomaly stáva zastaranou v obchode nielen doma, ale aj v zahraničí, navrhol [target_character.GetName] začať raziť novú mincu, #italic Stavraton#!.\n\nTieto menové reformy sú modelované podľa #italic Venetian Ducat#! a umožnili by nášmu [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')] ľahší obchod s inými európskymi krajinami, no aj [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] by sa museli prispôsobiť tejto novej mene." # todo: NEW TRANSLATION
 flavor_byz.24.a: "Začnime raziť túto novú mincu." # todo: NEW TRANSLATION
 flavor_byz.24.b: "[GetCountry('VEN').GetNameWithNoTooltip] nebude ovplyvňovať našu ekonomiku." # todo: NEW TRANSLATION
 flavor_byz.24.b.entry: "$VEN$ nebude ovplyvňovať našu ekonomiku." # todo: NEW TRANSLATION
 flavor_byz.24.historical_info: "V roku 1367 cisár Ján V. Palaiologos zaviedol novú mincu, Stavraton, pomenovanú podľa gréckeho slova pre \"kríž\", namiesto defenzívneho zlatého hyperpyronu. Táto strieborná minca pretrvala až do konca Byzantskej ríše." # todo: NEW TRANSLATION
 policy_will_not_be_implemented_but_available: "The [target_policy.GetName] will not be implemented at this time but will remain available to us" # todo: NEW TRANSLATION
 flavor_byz.25.title: "[target_artist.GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 flavor_byz.25.entry: "Učenec helénizmu" # todo: NEW TRANSLATION
 flavor_byz.25.desc: "[target_artist.GetName] prišiel na náš [ROOT.GetCountry.GetGovernment.GetCourtTitle]. Kázal o návrate [ROOT.GetCountry.GetName] do veku helenizmu. Hoci si získal pozornosť, [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] sú proti jeho myšlienkam." # todo: NEW TRANSLATION
 flavor_byz.25.a: "Nech zostane v našom [ROOT.GetCountry.GetGovernment.GetCourtTitle]." # todo: NEW TRANSLATION
 flavor_byz.25.a.entry: "Nech zostane na našom dvore." # todo: NEW TRANSLATION
 flavor_byz.25.b: "Jeho heretické učenia musia skončiť!" # todo: NEW TRANSLATION
 flavor_byz.25.historical_info: "Gemistos Plethon bol jedným z najslávnejších byzantských učencov. Zastával obnovu gréckeho učenia v západnej Európe a napísal mnoho rukopisov, zameraných na obnovu hellenizmu a odmietanie byzantského práva." # todo: NEW TRANSLATION
 while_remains_chance_to_revive_hellenism_tt: "#italic Pokiaľ [target_artist.GetNameWithNoTooltip] zostane v našom [ROOT.GetCountry.GetGovernment.GetCourtTitle], môže sa pokúsiť o oživenie [ShowReligionName('hellenism_religion')]#!" # todo: NEW TRANSLATION
 flavor_byz.26.title: "Ľud [ShowCultureNameWithNoTooltip('greek_culture')] z [target_location.GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 flavor_byz.26.entry: "Ľudia Malej Ázie" # todo: NEW TRANSLATION
 flavor_byz.26.desc: "S vylodením našich síl v [ShowAreaName('west_anatolia_area')] a znovudobytím prístavov tam, [target_location.GetName] stojí medzi najvýznamnejšími. Bolo to v minulosti ohnisko medzi [ShowCultureName('turkish_culture')] a [ROOT.GetCountry.GetAdjective] ľuďmi a opäť padlo do našich rúk. [target_character.GetName] plánuje mesto udržať v dohľadnej budúcnosti a už posilňuje jeho pozíciu v [ShowRegionName('anatolia_region')]." # todo: NEW TRANSLATION
 flavor_byz.26.a: "Bude to náš hlavný prístav v [ShowAreaNameWithNoTooltip('west_anatolia_area')]." # todo: NEW TRANSLATION
 BYZ_SMYRNA_PEOPLE_CONVERT_TO_GREEK: "#G 20%#! z [Concept('pops','populácií')|e] sa premení na [ShowCultureName('greek_culture')]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 BYZ_SMYRNA_GREEKS_GAIN_SATISFACTION: "Všetky [ShowCultureName('greek_culture')] [Concept('pops','populácie')|e] získajú [ShowNamedValue('pop_satisfaction_severe_bonus')|+=2%] [Concept('pop_satisfaction','spokojnosť populácie')|e]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 flavor_byz.27.title: "Pokles renesancie [target_character.GetDynasty.GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 flavor_byz.27.entry: "Palaeologovská renesancia" # todo: NEW TRANSLATION
 flavor_byz.27.desc: "Kedysi do nášho [ROOT.GetCountry.GetGovernment.GetCourtTitle] prúdili mnohí veľkí umelci v fenoméne nazývanom renesancia [target_character.GetDynasty.GetName], no v posledných rokoch nastal pokles a veľkí muži radšej odchádzajú do iných dvorov namiesto k nám. Možno by [target_character.GetName] mal investovať, aby zastavil tento úpadok." # todo: NEW TRANSLATION
 flavor_byz.27.historical_info: "Keď dynastia Palaiologovcov znovu získala Konštantínopol, zahájili kampaň renovácie mesta. To vyvolalo posledné obdobie rozvoja byzantského umenia, kde sa postupne odkláňalo od mnohých byzantských zvykov, ako napríklad podpisovanie diel umelcami, a presunulo sa k palaeologánskemu štýlu, ktorý neskôr ovplyvnil Krétsku školu umenia." # todo: NEW TRANSLATION
 flavor_byz.27.a: "Momentálne nemáme prostriedky na sponzorovanie nikoho." # todo: NEW TRANSLATION
 flavor_byz.27.b: "Pokladnica [ROOT.GetCountry.GetAdjectiveWithNoTooltip] uhradí náklady!" # todo: CHANGED
 flavor_byz.27.b.entry: "Naša pokladnica pokryje výdavky!" # todo: NEW TRANSLATION
 flavor_byz.27.c: "Nech [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')] uhradí náklady." # todo: NEW TRANSLATION
 flavor_byz.27.c.entry: "Nech $nobles_estate$ uhradí účet." # todo: NEW TRANSLATION
 flavor_byz.27.d: "[target_location.GetNameWithNoTooltip] sa stane kolískou [ShowInstitutionNameWithNoTooltip('renaissance')]." # todo: CHANGED
 flavor_byz.27.d.entry: "Toto miesto sa stane kolískou [ShowInstitutionNameWithNoTooltip('renaissance')]." # todo: NEW TRANSLATION
 constantinople_to_spawn_renaissance_tt: "[ShowLocationName('constantinople')] spĺňa podmienky na to, aby bola rodiskom [ShowInstitutionName('renaissance')]." # todo: CHANGED
 flavor_byz.28.title: "[ROOT.GetCountry.GetGovernment.GetCourtTitle] v [ShowAreaNameWithNoTooltip('morea_area')]" # todo: NEW TRANSLATION
 flavor_byz.28.entry: "Nová Sparta" # todo: NEW TRANSLATION
 flavor_byz.28.desc: "S naším úpadkom v [ShowRegionName('balkan_region')] prišiel [target_character.GetName] s plánom, aby naša ríša prežila. Zriadením novej strediskovej vlády v [target_location.GetName] a opevnením [ShowAreaName('morea_area')] môžeme zaistiť, že žiadny cudzinec nás neobsadí bez veľkých strát." # todo: NEW TRANSLATION
 flavor_byz.28.a: "Možno majú slová [target_character.GetNameWithNoTooltip] isté opodstatnenie..." # todo: NEW TRANSLATION
 flavor_byz.28.a.entry: "Možno majú slová postavy nejakú váhu..." # todo: NEW TRANSLATION
 flavor_byz.28.b: "Opustenie [target_location2.GetNameWithNoTooltip] nám nič dobré neprinesie." # todo: CHANGED
 flavor_byz.28.b.entry: "Opustenie miesta nám neprinesie nič dobré." # todo: NEW TRANSLATION
 flavor_byz.29.title: "Katholikon Mouseion" # todo: NEW TRANSLATION
 flavor_byz.29.entry: "$flavor_byz.29.title$" # todo: NEW TRANSLATION
 flavor_byz.29.desc: "Keďže [target_location.GetName] je popredným mestom rodu [target_character.GetDynasty.GetName], [target_character.GetName] plánuje inštitúciu v kláštore sv. Jána Prodroma. Taká stavba by si vyžadovala veľa zdrojov a mnohé diela, ktoré by naša krajina možno musela objednať." # todo: NEW TRANSLATION
 flavor_byz.29.a: "Žiadna cena nezastaví [target_character.GetNameWithNoTooltip]." # todo: NEW TRANSLATION
 flavor_byz.29.a.entry: "Žiadna cena nezastaví postavu." # todo: NEW TRANSLATION
 flavor_byz.29.b: "Je to príliš drahé." # todo: NEW TRANSLATION
 flavor_byz.29.historical_info: "Hoci o inštitúcii nazvanej Katholikon Mouseion nie je veľa známe, vznikla na prelome 14. storočia v Konštantínopole. Nachádzala sa v kláštore sv. Jána Prodroma a jej knižnica pozývala mnohých Talianov, ktorí sa chceli učiť grécky jazyk a kultúru." # todo: NEW TRANSLATION
 flavor_byz.30.title: "Pakt s [target_country.GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 flavor_byz.30.entry: "Pravoslávna cirkev a luteráni spájajú sily proti katolíkom" # todo: NEW TRANSLATION
 flavor_byz.30.desc: "S nástupom [target_country.GetReligion.GetName] v [ShowContinentName('europe')] [ShowReligionAdjective('catholic')] svet, naši starí nepriatelia, konečne prechádza tým, čo sme my prežili pred stáročiami. V čele tejto reformy stojí [target_country.GetName]. Možno, ak s nimi udržíme dobré vzťahy, konečne dokážeme urobiť dieru proti [target_country2.GetName], ktorú sme si v minulosti želali." # todo: CHANGED
 flavor_byz.30.a: "Spojíme sa s [target_country.GetNameWithNoTooltip]." # todo: NEW TRANSLATION
 flavor_byz.30.a.entry: "Uzavrieme s nimi spojenectvo." # todo: NEW TRANSLATION
 flavor_byz.30.b: "Záležitosti [target_country2.GetReligion.GetNameWithNoTooltip] nás nezaujímajú." # todo: NEW TRANSLATION
 flavor_byz.30.b.entry: "Záležitosti ich viery nás nezaujímajú." # todo: NEW TRANSLATION
 flavor_byz.31.title: "Reforma [ROOT.GetCountry.GetAdjectiveWithNoTooltip] armády" # todo: CHANGED
 flavor_byz.31.entry: "Reforma byzantskej armády" # todo: NEW TRANSLATION
 flavor_byz.31.desc: "Kým naša armáda kedysi dominovala vďaka thematom a početným brannej povinnosti, nárast bohatstva a centralizácia krajín viedli k tomu, že armáda sa stala povolaním. [target_character.GetName] spolu so svojou radou tvrdo pracoval na návrhu novej organizácie armády, ktorá by menej závisela od [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] pri získavaní vojakov." # todo: NEW TRANSLATION
 flavor_byz.31.a: "Armáda bude slúžiť [target_character.GetNameWithNoTooltip]." # todo: NEW TRANSLATION
 flavor_byz.31.a.entry: "Armáda bude slúžiť kráľovi." # todo: NEW TRANSLATION
 flavor_byz.31.b: "Neodoberajme úlohu [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')]." # todo: NEW TRANSLATION
 flavor_byz.31.b.entry: "Nedovoľme obísť úlohu $nobles_estate$." # todo: NEW TRANSLATION
 BYZ_ALL_THEMATA_PROVINCES_GAIN_NOBLE_LOYALTY: "Všetci [ShowPopTypeName('nobles')] [Concept('pops','populácie')|e] v [Concept('locations','lokalitách')|e] s [ShowBuildingTypeName('thema_headquarters')] získajú [ShowNamedValue('pop_satisfaction_ultimate_bonus')|+=2%] [Concept('pop_satisfaction','spokojnosť populácie')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 flavor_byz.32.title: "Vzostup [target_character2.GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 flavor_byz.32.entry: "Veľký domestikos – problémy na obzore" # todo: NEW TRANSLATION
 flavor_byz.32.desc: "Hoci súčasné obdobie [ROOT.GetCountry.GetAdjective] dejín možno opísať ako malé oživenie národa, neprichádza bez problémov. Aj keď sme sa nedávno vymotali z ničivej občianskej vojny, stále sa tvoria nové frakcie. Jedna z nich sa zjednocuje pod heslom [target_character2.GetName], nášho #italic Grand Domestic#!. Čas ukáže, kam to povedie." # todo: NEW TRANSLATION
 flavor_byz.32.a: "Táto dvorská intriga sa rozvíja..." # todo: NEW TRANSLATION
 flavor_byz.33.title: "Rímska ríša?" # todo: NEW TRANSLATION
 flavor_byz.33.entry: "$flavor_byz.33.title$" # todo: NEW TRANSLATION
 flavor_byz.33.desc: "Hoci sme sa vždy považovali za nástupcov [ShowLocationName('rome')], opakovane sme zápasili o udržanie tohto titulu. Možno je čas hľadať novú identitu, menej zameranú na starú slávu a viac vedúcu k budúcnosti." # todo: NEW TRANSLATION
 flavor_byz.33.a: "Už nie sme Rimania. Nech vládneme ako [ShowCultureNameWithNoTooltip('greek_culture')] národ." # todo: NEW TRANSLATION
 flavor_byz.33.b: "Nikdy sa nevzdáme nášho dedičstva." # todo: NEW TRANSLATION
 BYZ_ALL_PRIMARY_AND_ACCEPTED_POP_BECOME_HAPPIER: "Každý [Concept('pop','populácia')|e], ktorý je buď [Concept('primary_culture','hlavná kultúra')|e] alebo [Concept('accepted_culture','akceptovaná kultúra')|e], získa [ShowNamedValue('pop_satisfaction_ultimate_bonus')|+=2%] [Concept('pop_satisfaction','spokojnosť populácie')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 flavor_byz.34.title: "[target_location.GetNameWithNoTooltip] prerastá svoje hradby" # todo: NEW TRANSLATION
 flavor_byz.34.entry: "Konštantínopol, rozpadajúce sa mesto" # todo: NEW TRANSLATION
 flavor_byz.34.desc: "[target_location.GetName] zažil storočia úpadku kvôli množstvu konfliktov. Keď sme konečne obnovili [ROOT.GetCountry.GetAdjective] pokladnice, môžeme konečne začať obnovovať [target_location.GetRank.GetName] a priviesť ho do novej éry." # todo: NEW TRANSLATION
 flavor_byz.34.a: "[target_location.GetNameWithNoTooltip] znova povstane." # todo: NEW TRANSLATION
 flavor_byz.34.a.entry: "Miesto opäť ožije." # todo: NEW TRANSLATION
 flavor_byz.34.b: "Nebudeme míňať prostriedky len na jeden [target_location.GetRank.GetNameWithNoTooltip]." # todo: NEW TRANSLATION
 flavor_byz.34.b.entry: "Nebudeme míňať naše prostriedky len na jedno mesto." # todo: NEW TRANSLATION
 BYZ_UNLOCK_CONSTANTINOPLE_MANAGER_CABINET_ACTION: "Odomkne kabinetnú akciu [ShowCabinetActionName('aid_constantinople')]." # todo: NEW TRANSLATION
 flavor_byz.35.title: "[target_character2.GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 flavor_byz.35.entry: "Giovanni Giustiniani" # todo: NEW TRANSLATION
 flavor_byz.35.desc: "Hoci kolónia [ShowBuildingTypeName('galata')] zvýšila [GetCountry('GEN').GetAdjective] vplyv v [target_location.GetName], zároveň to priviedlo niekoľko mužov odhodlaných chrániť [ROOT.GetCountry.GetName]. Jedným z nich je [target_character2.GetName], [GetCountry('GEN').GetAdjectiveWithNoTooltip] žoldnier pripravený slúžiť [target_character.GetName]." # todo: NEW TRANSLATION
 flavor_byz.35.a: "Najmime ho, v prospech [ROOT.GetCountry.GetFlavorRank]." # todo: NEW TRANSLATION
 flavor_byz.35.a.entry: "Najmeme ho, pre dobro ríše." # todo: NEW TRANSLATION
 flavor_byz.35.b: "Dôverovať [GetCountry('GEN').GetAdjectiveWithNoTooltip]? Nikdy!" # todo: NEW TRANSLATION
 flavor_byz.35.b.entry: "Dôverovať $GEN_ADJ$? Nikdy!" # todo: NEW TRANSLATION
 flavor_byz.36.title: "[ShowRegionNameWithNoTooltip('anatolia_region')] opäť dobytá!" # todo: NEW TRANSLATION
 flavor_byz.36.entry: "Obnovenie kontroly v Anatolii" # todo: NEW TRANSLATION
 flavor_byz.36.desc: "Naše armády konečne zabezpečili územia [ShowRegionName('anatolia_region')]. S mestami pod našou kontrolou a nepriateľmi odohnanými môžeme konečne osláviť tento triumf." # todo: CHANGED
 flavor_byz.36.a: "Sláva [ROOT.GetCountry.GetNameWithNoTooltip]." # todo: NEW TRANSLATION
 flavor_byz.36.a.entry: "Sláva nám." # todo: NEW TRANSLATION
 flavor_byz.37.title: "Vylodenie v [ShowRegionNameWithNoTooltip('italy_region')]" # todo: NEW TRANSLATION
 flavor_byz.37.entry: "Vylodenie v Taliansku" # todo: NEW TRANSLATION
 flavor_byz.37.desc: "[ShowRegionName('italy_region')] kedysi patrila [ROOT.GetCountry.GetAdjective], ale keď ju ovládli Lombardi i Normani, stratili sme tam akýkoľvek oporný bod. Teraz, keď sme opäť zriadili základňu v [target_location.GetName], možno ju môžeme opevniť a použiť na budúce operácie." # todo: NEW TRANSLATION
 flavor_byz.37.a: "[target_location.GetNameWithNoTooltip] bude opevnené!" # todo: NEW TRANSLATION
 flavor_byz.37.a.entry: "Miesto bude opevnené!" # todo: NEW TRANSLATION
 flavor_byz.37.b: "Je to plytvanie peniazmi." # todo: NEW TRANSLATION
 flavor_byz.38.title: "Múr [ShowBuildingTypeNameWithNoTooltip('hexamilion_wall')]" # todo: NEW TRANSLATION
 flavor_byz.38.entry: "Mur Hexamilion" # todo: NEW TRANSLATION
 flavor_byz.38.desc: "Keď sa náš stisk v [ShowRegionName('balkan_region')] uvoľňuje, [target_country.GetLongName] sa ocitol v prekarnej situácii. Avšak [target_character.GetName] vymyslel plán, ako zabezpečiť prežitie [target_country.GetFlavorRank]. Výstavbou [ShowBuildingTypeName('hexamilion_wall')] v [ShowLocationName('corinth')] a posilnením provincie [ShowAreaName('morea_area')] nám možno zostáva nádej." # todo: NEW TRANSLATION
 flavor_byz.38.a: "Bezpečnosť [ShowAreaNameWithNoTooltip('morea_area')] je našou najvyššou prioritou." # todo: NEW TRANSLATION
 flavor_byz.38.b: "[ShowBuildingTypeNameWithNoTooltip('hexamilion_wall')] je príliš drahé." # todo: NEW TRANSLATION
 flavor_byz.38.historical_info: "Počas vlády Konštantína XI. v Morei presunul impérium svoju pozornosť na horské oblasti regiónu, veriac, že ak má impérium prežiť, bude to opevňovaním Hexamilionovho múru a rozvojom miest tam. Jeho plány však zlyhali, keď Osmanská ríša spustila inváziu na jeho územie a krajinu zanechala zdevastovanú." # todo: NEW TRANSLATION
 flavor_byz.39.title: "Nové hlavné mesto v [target_location.GetNameWithNoTooltip]?" # todo: NEW TRANSLATION
 flavor_byz.39.entry: "Nové hlavné mesto" # todo: NEW TRANSLATION
 flavor_byz.39.desc: "Odkedy sa náš [ROOT.GetCountry.GetGovernment.GetCourtTitle] presunul do [ShowAreaName('morea_area')], [target_location.GetName] sa stal [target_country.GetAdjective] hlavným mestom vo všetkom okrem názvu. Nie je snáď čas, aby [target_character.GetName] opustil [target_location2.GetName] a uprednostnil tento nový domov?" # todo: NEW TRANSLATION
 flavor_byz.39.a: "Možno sa bude [ShowAreaNameWithNoTooltip('morea_area')] ľahšie brániť...." # todo: NEW TRANSLATION
 flavor_byz.39.b: "Opustiť [target_location2.GetNameWithNoTooltip] je ťažká chyba, namiesto toho ho posilnime." # todo: NEW TRANSLATION
 flavor_byz.39.b.entry: "Opustenie miesta je vážna chyba, namiesto toho ho posilnime." # todo: NEW TRANSLATION
 flavor_byz.39.c: "Neopustíme [target_location2.GetNameWithNoTooltip], ani nebudeme tam posilňovať našu kontrolu." # todo: NEW TRANSLATION
 flavor_byz.39.c.entry: "Neopustíme miesto, ani ho nebudeme posilňovať." # todo: NEW TRANSLATION
 flavor_byz.40.title: "Nomon Syngraphe" # todo: NEW TRANSLATION
 flavor_byz.40.entry: "$flavor_byz.40.title$" # todo: NEW TRANSLATION
 flavor_byz.40.desc: "Od smrti [target_character.GetName] niekoľko ľudí začalo prehľadávať jeho pozostatky. Jeden z nich, [target_character2.GetName], našiel jeden z jeho rukopisov s názvom #italic Nomoi#!. Inšpirovaný učením [ShowReligionAdjective('zoroastrian')] a Platóna, obsahuje rôzne témy, ktoré všetky smerujú k návratu helénskych zvykov." # todo: NEW TRANSLATION
 flavor_byz.40.a: "Umelecké dielo zostane umeleckým dielom." # todo: CHANGED
 flavor_byz.40.b: "Preštudujme niektoré z týchto textov a urobme ich veľkolepejšími." # todo: NEW TRANSLATION
 flavor_byz.40.c: "Hoďte ho do ohňa, zničte ho!" # todo: NEW TRANSLATION
 flavor_byz.41.title: "[target_artist.GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 flavor_byz.41.entry: "História rodu Palaiologov" # todo: NEW TRANSLATION
 flavor_byz.41.desc: "S rastúcim záujmom historikov o dejiny [target_country.GetName] niekoľko z nich uvažuje o napísaní kroniky o rodine [target_character.GetDynasty.GetName], ako napríklad [target_artist.GetName], aby budúce generácie poznali činy [target_character.GetName] a [target_character.GetHerHis] rodiny." # todo: NEW TRANSLATION
 flavor_byz.41.a: "Nech má slobodu zaznamenávať históriu." # todo: NEW TRANSLATION
 flavor_byz.41.b: "Môžeme sponzorovať jeho diela." # todo: NEW TRANSLATION
 flavor_byz.42.title.a: "Vzostup rodu Mavrokordatos" # todo: NEW TRANSLATION
 flavor_byz.42.title.b: "Veľký dragomán" # todo: NEW TRANSLATION
 flavor_byz.42.entry: "$flavor_byz.42.title.a$" # todo: NEW TRANSLATION
 flavor_byz.42.desc: "Narodený v [target_location.GetName], [target_artist.GetName] študoval západné medicínske a filozofické smery od veľmi mladého veku. Študoval na viacerých univerzitách, nadobudol množstvo vedomostí a ovláda mnohé jazyky. Možno takýto vzdelaný filozof bude užitočný v našom [ROOT.GetCountry.GetGovernment.GetCourtTitle]." # todo: NEW TRANSLATION
 flavor_byz.42.historical_info: "Narodený na Mykonose, Alexandros Mavrokordatos bol grécky lekár za tureckej nadvlády. Po štúdiu na Západe, najmä na Univerzite v Bologni, napísal niekoľko traktátov, ako #italic Instrumentum Pneumaticum Circulandi Sanguinis sive modu usu pulmonum#!. Neskôr slúžil sultánovi Mehmedovi IV., pomáhal pri rokovaniach, ktoré viedli k Treaty of Karlowitz v roku 1699, a podarilo sa mu získať značnú moc na osmanskom dvore, čo umožnilo jeho rodine vládnuť v Moldavsku." # todo: NEW TRANSLATION
 flavor_byz.42.a: "Pozvime [target_artist.GetNameWithNoTooltip] do [target_location2.GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 flavor_byz.42.a.entry: "Pozveme umelca na miesto." # todo: NEW TRANSLATION
 flavor_byz.42.b: "Bol by skvelým diplomatom pre [target_country.GetNameWithNoTooltip]." # todo: CHANGED
 flavor_byz.42.b.entry: "Bol by pre nich skvelým diplomatom." # todo: NEW TRANSLATION
 flavor_byz.42.c: "Je príliš nákladný na udržiavanie." # todo: NEW TRANSLATION
 flavor_byz.43.title: "Založenie Heptanese školy" # todo: NEW TRANSLATION
 flavor_byz.43.entry: "$flavor_byz.43.title$" # todo: NEW TRANSLATION
 flavor_byz.43.desc: "Keď už je Krétska škola etablovaná a západné umenie dominuje v [ShowContinentName('europe')], [ShowCultureName('greek_culture')] preberajú tento nový umelecký smer. Predovšetkým [ShowLocationName('corfu')] zažilo novú vlnu týchto umelcov. Možno je čas založiť novú školu v [ShowProvinceDefinitionName('ionian_islands_province')]." # todo: NEW TRANSLATION
 flavor_byz.43.a: "Založme túto umeleckú školu." # todo: NEW TRANSLATION
 flavor_byz.43.b: "Nepotrebujeme viac umelcov." # todo: NEW TRANSLATION
 flavor_byz.43.c: "[target_character.GetNameWithNoTooltip] nech sústredí všetko svoje úsilie na to." # todo: NEW TRANSLATION
 flavor_byz.43.c.entry: "Postava sústredí všetky svoje úsilie na to." # todo: NEW TRANSLATION
 flavor_byz.43.d: "Uprednostníme starú Krétsku školu." # todo: NEW TRANSLATION
 flavor_byz.44.title: "[target_artist.GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 flavor_byz.44.entry: "Maniera Greca" # todo: NEW TRANSLATION
 flavor_byz.44.desc: "[target_artist.GetName], narodený v [target_location.GetName] ako občan [ShowCultureName('greek_culture')], si razí meno v [ShowProvinceDefinitionName('ionian_islands_province')]. Jeho umenie nasleduje štýl #italic Maniera Greca#!, miešajúc [GetCountry('BYZ').GetAdjective] a [GetCountry('VEN').GetAdjective] umelecké štýly." # todo: NEW TRANSLATION
 flavor_byz.44.a: "Sponzorujme ho a pozvime ho do nášho [ROOT.GetCountry.GetGovernment.GetCourtTitle]." # todo: NEW TRANSLATION
 flavor_byz.44.a.entry: "Sponzorujme ho a pozveme ho na náš dvor." # todo: NEW TRANSLATION
 flavor_byz.44.b: "Nepotrebujeme viac umelcov." # todo: NEW TRANSLATION
 flavor_byz.45.title: "Reforma systému Prónoia" # todo: NEW TRANSLATION
 flavor_byz.45.entry: "$flavor_byz.45.title$" # todo: NEW TRANSLATION
 flavor_byz.45.desc: "Hoci [ShowPolicyName('pronoia_system')] nám v minulosti dobre slúžil, administratívne tituly sa zredukovali na nič iné než feudálne ekvivalenty, vďaka čomu správcovia každej provincie nie sú menovaní [target_character.GetName], ale sú dedičnými pozíciami. [target_character.GetNameWithNoTooltip] už má plány na reformu tohto systému a na obnovenie kontroly nad [ROOT.GetCountry.GetAdjective] provinciami." # todo: NEW TRANSLATION
 flavor_byz.45.a: "Zrušme tento starý systém." # todo: NEW TRANSLATION
 flavor_byz.45.b: "Môžu tam byť nejaké diery v systéme, ale jeho reforma nám neprinesie úžitok." # todo: NEW TRANSLATION
 flavor_byz.46.title: "[ROOT.GetCountry.GetGovernment.GetCourtTitle] ponúka vojenskú pomoc" # todo: NEW TRANSLATION
 flavor_byz.46.desc: "[target_country.GetAdjective] [ROOT.GetCountry.GetGovernment.GetCourtTitle] podporil [target_character.GetName] a [target_character.GetHisHer] politiky. To nám umožňuje ľahko robiť zmeny v štáte." # todo: NEW TRANSLATION
 flavor_byz.46.a: "Ich podpora bude užitočná pre naše pozemné snahy." # todo: NEW TRANSLATION
 flavor_byz.46.b: "Namiesto toho by mali pomáhať námorníctvu." # todo: NEW TRANSLATION
 flavor_byz.47.title: "[ROOT.GetCountry.GetGovernment.GetCourtTitle] spriada spiknutie proti armáde" # todo: NEW TRANSLATION
 flavor_byz_47_desc_common: "Kým armáda chránila naše hranice, [ROOT.GetCountry.GetGovernment.GetCourtTitle] považuje niektorých dôstojníkov a generálov za hrozbu pre [ROOT.GetCountry.GetFlavorRank], hovorí sa, že chcú zvrhnúť [target_character.GetName] a zničiť moc [ROOT.GetCountry.GetGovernment.GetCourtTitle]. Preto navrhli, aby sme sa priklonili smerom k" # todo: NEW TRANSLATION
 flavor_byz.47.desc.a: "$flavor_byz_47_desc_common$ [ShowSocietyDirectionName('quantity')]." # todo: NEW TRANSLATION
 flavor_byz.47.desc.b: "$flavor_byz_47_desc_common$ [ShowSocietyDirectionName('quality')]." # todo: NEW TRANSLATION
 flavor_byz.47.desc.c: "$flavor_byz_47_desc_common$ [ShowSocietyDirectionName('land')]." # todo: NEW TRANSLATION
 flavor_byz.47.desc.d: "$flavor_byz_47_desc_common$ [ShowSocietyDirectionName('naval')]." # todo: NEW TRANSLATION
 flavor_byz.47.a: "Armáda založená na počtoch nám umožní pokryť viac územia." # todo: NEW TRANSLATION
 flavor_byz.47.b: "Namiesto posielania viac mužov do armády radšej vycvičme existujúce sily." # todo: NEW TRANSLATION
 flavor_byz.47.c: "Naši pozemní dôstojníci by mali byť ešte viac posilnení." # todo: NEW TRANSLATION
 flavor_byz.47.d: "Aby sme chránili [ROOT.GetCountry.GetNameWithNoTooltip], musíme chrániť aj jeho mora." # todo: NEW TRANSLATION
 byz_court_wants_to_force_societal_changes: "[ROOT.GetCountry.GetGovernment.GetCourtTitle] si želá, aby sme vynútili zmeny v našej spoločnosti" # todo: NEW TRANSLATION
 flavor_byz.48.title: "[ROOT.GetCountry.GetGovernment.GetCourtTitle] ponúka byrokratickú pomoc" # todo: NEW TRANSLATION
 flavor_byz.48.desc: "Keď naša administratíva v posledných rokoch zaostávala, náš [ROOT.GetCountry.GetGovernment.GetCourtTitle] prišiel s podporou pomôcť [target_character.GetName] vypracovať zákony na posilnenie tejto vetvy [ROOT.GetCountry.GetName]." # todo: NEW TRANSLATION
 flavor_byz.48.a: "[ROOT.GetCountry.GetGovernment.GetAdjective] byrokracia posilní samotný [ROOT.GetCountry.GetGovernment.GetCourtTitle]." # todo: NEW TRANSLATION
 flavor_byz.48.b: "Naša spoločnosť bude riadená zlatom." # todo: NEW TRANSLATION
 flavor_byz.49.title: "[ROOT.GetCountry.GetGovernment.GetCourtTitle] spriada spiknutie proti [ROOT.GetCountry.GetGovernment.GetAdjective|U] byrokracii" # todo: NEW TRANSLATION
 flavor_byz_49_desc_common: "Aj keď naša administrácia v poslednom čase funguje dobre, [ROOT.GetCountry.GetGovernment.GetCourtTitle] si všimol, že niektorí ľudia na pozíciách sú pre nich málo prospešní. Teraz nás prinútili konať a požadujú, aby sme sa uchýlili k" # todo: NEW TRANSLATION
 flavor_byz.49.desc.a: "$flavor_byz_49_desc_common$ [ShowSocietyDirectionName('aristocracy')]." # todo: NEW TRANSLATION
 flavor_byz.49.desc.b: "$flavor_byz_49_desc_common$ [ShowSocietyDirectionName('plutocracy')]." # todo: NEW TRANSLATION
 flavor_byz.49.desc.c: "$flavor_byz_49_desc_common$ [ShowSocietyDirectionName('outward')]." # todo: NEW TRANSLATION
 flavor_byz.49.desc.d: "$flavor_byz_49_desc_common$ [ShowSocietyDirectionName('inward')]." # todo: NEW TRANSLATION
 flavor_byz.49.a: "Podporme [ShowSocietyDirectionNameWithNoTooltip('aristocracy')]." # todo: NEW TRANSLATION
 flavor_byz.49.b: "Budeme národom plutokratických hodnôt." # todo: NEW TRANSLATION
 flavor_byz.49.c: "Naša administrácia sa musí orientovať navonok." # todo: NEW TRANSLATION
 flavor_byz.49.d: "Smerovanie k [ShowSocietyDirectionNameWithNoTooltip('inward')] zabezpečí našu bezpečnosť." # todo: NEW TRANSLATION
 flavor_byz.50.title: "[ROOT.GetCountry.GetGovernment.GetCourtTitle] ponúka obchodnú pomoc" # todo: NEW TRANSLATION
 flavor_byz.50.desc: "Náš [ROOT.GetCountry.GetGovernment.GetCourtTitle] sa rozhodol podporiť nás v ekonomických záležitostiach. Ponúkol pomoc pri presadzovaní akýchkoľvek politík, ktoré by [target_character.GetName] chcel pre náš [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('burghers_estate')]." # todo: NEW TRANSLATION
 flavor_byz.50.a: "Aby sme zachovali toto bohatstvo, podporme [ShowSocietyDirectionNameWithNoTooltip('mercantilism')]." # todo: NEW TRANSLATION
 flavor_byz.50.b: "Naše trhy sú otvorené pre každého." # todo: NEW TRANSLATION
 flavor_byz.51.title: "[ROOT.GetCountry.GetGovernment.GetCourtTitle] oslabuje [ROOT.GetCountry.GetGovernment.GetAdjective|U] [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('burghers_estate')]" # todo: NEW TRANSLATION
 flavor_byz_51_desc_common: "Namiesto toho, aby nám [ROOT.GetCountry.GetGovernment.GetCourtTitle] pomohol naplánovať efektívny systém na podporu nášho [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')], sa rozhodol podieľať na obmedzení našej moci, čo nás núti smerovať národ k" # todo: NEW TRANSLATION
 flavor_byz.51.desc.a: "$flavor_byz_51_desc_common$ [ShowSocietyDirectionName('free_trade')]." # todo: NEW TRANSLATION
 flavor_byz.51.desc.b: "$flavor_byz_51_desc_common$ [ShowSocietyDirectionName('mercantilism')]." # todo: NEW TRANSLATION
 flavor_byz.51.desc.c: "$flavor_byz_51_desc_common$ [ShowSocietyDirectionName('capital_economy')]." # todo: NEW TRANSLATION
 flavor_byz.51.desc.d: "$flavor_byz_51_desc_common$ [ShowSocietyDirectionName('traditional_economy')]." # todo: NEW TRANSLATION
 flavor_byz.51.a: "Návrh smerovať [ROOT.GetCountry.GetNameWithNoTooltip] k [ShowSocietyDirectionNameWithNoTooltip('free_trade')] nemusí byť zlý nápad." # todo: NEW TRANSLATION
 flavor_byz.51.b: "[ShowSocietyDirectionNameWithNoTooltip('mercantilism')] bude užitočný na ochranu [ROOT.GetCountry.GetAdjectiveWithNoTooltip] prístavov." # todo: NEW TRANSLATION
 flavor_byz.51.c: "Posun smerom k [ShowSocietyDirectionNameWithNoTooltip('capital_economy')] určite posilní naše pokladnice." # todo: NEW TRANSLATION
 flavor_byz.51.d: "Zachovajme hodnoty [ShowSocietyDirectionNameWithNoTooltip('traditional_economy')]." # todo: NEW TRANSLATION
 flavor_byz.52.title: "Reforma Corpus Juris Civilis" # todo: NEW TRANSLATION
 flavor_byz.52.entry: "$flavor_byz.52.title$" # todo: NEW TRANSLATION
 flavor_byz.52.desc: "Napriek tomu, že náš [ROOT.GetCountry.GetFlavorRank] je suverénny, nebráni to našemu [ROOT.GetCountry.GetGovernment.GetCourtTitle] zasahovať do politiky [ROOT.GetCountry.GetFlavorRank]. Neustále sa miešajúc do [ROOT.GetCountry.GetGovernment.GetParliament.GetName], ich túžby často odporujú tým [target_character.GetName]. Možno úpravou zákonov môžeme obmedziť ich moc v [ROOT.GetCountry.GetName]." # todo: NEW TRANSLATION
 flavor_byz.52.a: "Prepišme ho, aj keby sme nahnevali naše stavy." # todo: NEW TRANSLATION
 flavor_byz.52.b: "Zákonník slúži [ROOT.GetCountry.GetNameWithNoTooltip] už mnoho storočí." # todo: NEW TRANSLATION
 flavor_byz.52.b.entry: "Kód nám slúžil už mnoho storočí." # todo: NEW TRANSLATION
 BYZ_NO_MORE_COURT_EVENTS: "#Y Byzantský dvorský vplyv#! [Concept('events','udalosti')|e], prostredníctvom ktorých dvor periodicky tlačí naše [Concept('societal_values','sociálne hodnoty')|e] — na lepšie alebo horšie — sa už nebudú spúšťať." # todo: CHANGED # todo: CONCEPT CASE
 BYZ_COURT_EVENTS_WILL_CONTINUE: "#Y Byzantský dvorský vplyv#! [Concept('events','udalosti')|e], prostredníctvom ktorých dvor periodicky tlačí naše [Concept('societal_values','sociálne hodnoty')|e] — na lepšie alebo horšie — sa budú naďalej spúšťať." # todo: CHANGED # todo: CONCEPT CASE
 flavor_byz.53.title: "Opevnenie [ShowBuildingTypeNameWithNoTooltip('theodosian_walls')]" # todo: NEW TRANSLATION
 flavor_byz.53.entry: "Opätovné opevnenie Theodosiovských múrov" # todo: NEW TRANSLATION
 flavor_byz.53.desc: "Odkedy Latini vyplienili [target_province.GetName] v roku 1204, [ShowBuildingTypeName('theodosian_walls')] zostali zredukované na časť svojej bývalej slávy. Predtým sme nemali prostriedky na ich riadne udržiavanie, ale v týchto ťažkých časoch musíme zabezpečiť, aby boli pripravené na útok." # todo: NEW TRANSLATION
 flavor_byz.53.a: "Práve ony udržali impérium tak dlho. Musíme ich opäť opevniť." # todo: NEW TRANSLATION
 flavor_byz.53.b: "Schovávanie sa v [target_province.GetNameWithNoTooltip] nie je cesta k úspechu." # todo: NEW TRANSLATION
 flavor_byz.53.b.entry: "Skryť sa v provincii nie je cesta k úspechu." # todo: NEW TRANSLATION
 strengthened_theodosian_walls_desc: "Z $flavor_byz.53.title$ [Concept('event','udalosti')|e]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 flavor_byz.54.title: "Zaobchádzanie s [ShowCultureGroupNameWithNoTooltip('italian_group')] obchodníkmi" # todo: NEW TRANSLATION
 flavor_byz.54.entry: "Riešenie talianskeho vplyvu" # todo: NEW TRANSLATION
 flavor_byz.54.desc: "Hoci [ShowCultureGroupName('italian_group')] [ShowPopTypeName('burghers')] nám v minulosti pomáhali znovu osídliť [target_location.GetName], teraz je jasné, že momentálne zneužívajú [target_market.GetName]. Musíme ich odstrániť z [target_location.GetNameWithNoTooltip], aby nepokračovali vo svojich machináciách." # todo: NEW TRANSLATION
 flavor_byz.54.a: "[target_location.GetNameWithNoTooltip] patrí iba [target_character.GetNameWithNoTooltip]!" # todo: NEW TRANSLATION
 flavor_byz.54.b: "Nevyvolávajme ďalšiu vojnu s národmi [ShowCultureGroupNameWithNoTooltip('italian_group')]..." # todo: NEW TRANSLATION
 BYZ_ALL_ITALIAN_MERCHANTS_BECOME_UNHAPPY: "Všetky [ShowCultureGroupName('italian_group')] [Concept('pops','populácie')|e] stratia [ShowNamedValue('pop_satisfaction_extreme_penalty')|+=2%] [Concept('pop_satisfaction','spokojnosť populácie')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 byz_destroy_italian_quarters_tt: "Budovy [ShowBuildingTypeName('galata')] a [ShowBuildingTypeName('venetian_quarter')] budú zničené v [target_location.GetName]" # todo: NEW TRANSLATION
 flavor_byz.55.title: "Koncil v [ShowLocationNameWithNoTooltip('florence')]" # todo: NEW TRANSLATION
 flavor_byz.55.entry: "Stať sa, *bŕŕ*, katolíkom" # todo: NEW TRANSLATION
 flavor_byz.55.desc: "S naším poklesom moci a narastajúcimi hrozbami okolo nás, [target_character.GetName] rozmýšľa o nepredstaviteľnom v celej [ROOT.GetCountry.GetAdjective] histórii. Ak má [ROOT.GetCountry.GetFlavorRank] prežiť, potrebujeme podporu [target_character2.GetName] a celého [ShowReligionAdjective('catholic')] sveta. Možno by mal [target_character.GetNameWithNoTooltip] cestovať na západ a rokovať s [target_character2.GetNameWithNoTooltip]." # todo: NEW TRANSLATION
 flavor_byz.55.a: "Aj keby dohoda s [target_country.GetNameWithNoTooltip] rozzúrila patriarchát..." # todo: NEW TRANSLATION
 flavor_byz.55.a.entry: "Aj keď by obchod s nimi rozhneval Patriarchát..." # todo: NEW TRANSLATION
 flavor_byz.55.b: "Toto je poburujúci návrh." # todo: NEW TRANSLATION
 BYZ_ALL_ORTHODOX_BECOME_UNHAPPY: "Všetky [ShowReligionAdjective('orthodox')] [Concept('pops','populácie')|e] stratia [ShowNamedValue('pop_satisfaction_ultimate_penalty')|+=2%] [Concept('pop_satisfaction','spokojnosť populácie')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 flavor_byz.57.title: "Obnova miest [ShowRegionNameWithNoTooltip('anatolia_region')]" # todo: NEW TRANSLATION
 flavor_byz.57.entry: "Obnova miest v regióne Anatolia" # todo: NEW TRANSLATION
 flavor_byz.57.desc: "Od invázie Seldžukov do [ShowRegionName('anatolia_region')] a pádu mnohých našich provincií tam boli mnohé staré [ShowCultureName('greek_culture')] mestá zredukované na nič iné než barbarské základne. Avšak s našim dobytím regiónu späť možno dokážeme obnoviť [ROOT.GetCountry.GetAdjective] poriadok tam." # todo: NEW TRANSLATION
 flavor_byz.57.a: "Obnovme ich." # todo: NEW TRANSLATION
 flavor_byz.57.b: "Sú len reliktom minulosti. Domorodí ľudia tam si zaslúžia rešpekt." # todo: NEW TRANSLATION
 BYZ_RESTORE_GREEK_POPS_IN_ANATOLIAN_CITIES: "#G 10%#! z ne-[ShowCultureGroupName('greek_group')] [Concept('pop','populáciu')|e] v [ShowRegionName('anatolia_region')], ktorí žijú v [ShowLocationRankName('city')] alebo [ShowLocationRankName('town')], prejdu na [ROOT.GetCulture.GetName]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 BYZ_ACCEPT_LOCAL_POPULATION: "Každý ne-[ShowCultureGroupName('greek_group')] [Concept('pop','populáciu')|e] v [ShowRegionName('anatolia_region')], ktorý žije v [ShowLocationRankName('city')] alebo [ShowLocationRankName('town')], získa [ShowNamedValue('pop_satisfaction_extreme_bonus')|+=2%] [Concept('pop_satisfaction','spokojnosť populácie')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 flavor_byz.58.title: "[ShowCultureNameWithNoTooltip('albanian')] Migration" # todo: NEW TRANSLATION
 flavor_byz.58.desc: "Členovia kmene [ShowCultureName('albanian')] zo [source_location.GetName], postavení pred kmeňové spory a chabé možnosti, sa rozhodli opustiť [source_location.GetProvince.GetName] v nádeji nájsť lepšiu budúcnosť. O ich súčasnom pobyte nie je veľa známe, ale chýry hovoria, že sa snažia usadiť v [destination_location.GetProvince.GetName], v rámci [destination_location.GetName]. Uvidíme, či nájdu pokoj, po ktorom tak zúfalo túžia." # todo: NEW TRANSLATION
 flavor_byz.58.a: "Pche! Ich kmeňové spory sa len zhoršia." # todo: NEW TRANSLATION
 flavor_byz.59.title: "$flavor_byz.58.title$" # todo: NEW TRANSLATION
 flavor_byz.59.entry: "$flavor_byz.59.title$" # todo: NEW TRANSLATION
 flavor_byz.59.desc: "Členovia kmene [ShowCultureName('albanian')] zo [source_location.GetName] dorazili do [destination_location.GetName], žiadajúc audienciu u miestneho guvernéra s cieľom založiť si nové osídlenie. Takéto povolenie im už udelilo [destination_location.GetProvince.GetName], no mohlo by byť prospešné udeliť nováčikom ďalšie privilégiá, aby k nám prišlo ďalších viac." # todo: NEW TRANSLATION
 flavor_byz.59.a: "Mali by sme podporiť ďalšie migrácie." # todo: NEW TRANSLATION
 flavor_byz.59.b: "Pche! Nemali by sme sa tým zaoberať." # todo: NEW TRANSLATION
 BYZ_do_not_get_informed_about_migrations: "[Concept('pops','Populácie')|e] of [ShowCultureName('albanian')] [Concept('culture','kultúra')|e] will keep migrating to our lands, but we will no longer be notified about it" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 BYZ_more_reasons_to_migrate_here: "[ShowCultureName('albanian')] [Concept('pops','Populácie')|e] budú mať väčšiu pravdepodobnosť migrovať do našich krajín prostredníctvom [Concept('event','udalosti')|e], ak udelíme [ShowEstatePrivilegeName('tribes_land_rights')] [Concept('estate_privilege','privilégiá stavu')|e]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 flavor_byz.60.title: "A Co-Emperor?" # todo: NEW TRANSLATION
 flavor_byz.60.entry: "$flavor_byz.60.title$" # todo: NEW TRANSLATION
 flavor_byz.60.desc: "[target_character.GetName] bol dlhodobým podporovateľom a spoločníkom zosnulého [target_character2.GetName]. Počiatočne podporujúc [ROOT.GetCountry.GetGovernment.GetRulerTitle] počas [target_character2.GetHerHis] boja proti [target_character2.GetHerHis] starému otcovi, [GetCharacter('byz_andronikos_ii_palaiologos').GetName], [target_character.GetShortNameWithNoTooltip] sa osvedčil ako verný spoločník a schopný štátnik.\n\nPočas [target_character2.GetHerHis] života bol [target_character.GetNameWithNoTooltip] mnohokrát ponúkaný post spolucisára, no vždy odmietol. Keď je [target_character2.GetShortNameWithNoTooltip] teraz preč, sú na [ROOT.GetCountry.GetGovernment.GetCourtTitle] takí, ktorí veria, že [target_character.GetSheHe] by bol výborným spolucisárom." # todo: CHANGED
 flavor_byz.60.a: "Je to len [target_character.GetHerHis] vôľa." # todo: NEW TRANSLATION
 flavor_byz.60.a.entry: "Nie je to vôľa nikoho iného, než jeho vlastná." # todo: NEW TRANSLATION
 flavor_byz.60.b: "Donúťme [target_character.GetHerHim], aby prijal/a." # todo: NEW TRANSLATION
 flavor_byz.60.b.entry: "Vyvíjajme na neho tlak, aby prijal." # todo: NEW TRANSLATION
 BYZ_additional_events_become_available: "Additional [Concept('events','udalosti')|e] become available when [target_character.GetName] is considered co-emperor" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 flavor_byz.61.title: "Vlastizrada alebo sprisahanie" # todo: NEW TRANSLATION
 flavor_byz.61.entry: "$flavor_byz.61.title$" # todo: NEW TRANSLATION
 flavor_byz.61.desc: "[target_character2.GetName], vplyvný hlas v [ROOT.GetCountry.GetGovernment.GetCourtTitle], začal podozrievať [target_character.GetName] z vlastizrady. Spojil sa s nepriateľmi [target_character.GetHerHis], a [target_character2.GetShortNameWithNoTooltip] si želá, aby bol [target_character.GetHerHim] zbavený moci, všetkých titulov a vyhnaný do [ShowBuildingTypeName('orthodox_monastery')], aby už nikdy nemohol ovplyvňovať [ROOT.GetCountry.GetAdjective] politiku. Napriek tomu mnohí dvorania si stále vážia [target_character.GetNameWithNoTooltip] a nechcú mu spôsobiť ujmu." # todo: NEW TRANSLATION
 flavor_byz.61.a: "Treba dôverovať [target_character2.GetNameWithNoTooltip]." # todo: NEW TRANSLATION
 flavor_byz.61.a.entry: "Postave treba dôverovať." # todo: NEW TRANSLATION
 flavor_byz.61.b: "[target_character.GetNameWithNoTooltip] by nikdy nezradil [ROOT.GetCountry.GetFlavorRank]!" # todo: NEW TRANSLATION
 flavor_byz.61.b.entry: "Postava by nikdy nezradila ríšu!" # todo: NEW TRANSLATION
 flavor_byz.62.title: "Delegácia frankských pánov" # todo: NEW TRANSLATION
 flavor_byz.62.entry: "$flavor_byz.62.title$" # todo: NEW TRANSLATION
 flavor_byz.62.desc: "Naša kampaň v roku 1337 v [GetCountry('EPI').GetName] bola veľkým úspechom. [GetCharacter('epi_nikephoros_ii_orsini').GetName] bol rýchlo zvrhnutý a miestni si odniesli dojem silného štátu — to všetko vďaka brilantnému vodcovstvu [target_character.GetName] a [GetCharacter('byz_andronikos_iii_palaiologos').GetName]. Vojská nepriateľského [target_country.GetAdjective], ohúrené touto rýchlou kampaňou a našim dobroprajným zaobchádzaním, sa vrátili domov a šírili správy o [ROOT.GetCountry.GetAdjective] zaobchádzaní s [GetCountry('EPI').GetAdjectiveWithNoTooltip] vojskami a diplomatickom prístupe [target_character.GetNameWithNoTooltip]." # todo: NEW TRANSLATION
 flavor_byz.62.a: "Prisľúbme našu podporu." # todo: NEW TRANSLATION
 flavor_byz.62.b: "Nemáme záujem uspokojovať ich požiadavky." # todo: NEW TRANSLATION
 BYZ_conquered_locations_in_morea_will_be_more_integrated: "Po dobu #W 30#! rokov získajú novo dobyté [Concept('locations','lokality')|e] v [ShowAreaName('morea_area')] #G +30.0%#! [Concept('integration','integrácii')|e]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 flavor_byz.63.title: "Smrť [target_character.GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 flavor_byz.63.entry: "Smrť Nikephoros Gregoras" # todo: NEW TRANSLATION
 flavor_byz.63.desc_neutral: "Chladné uhryznutie smrti vzalo jedného z našich významných historikov, [target_character.GetName]. [target_character.GetShortNameWithNoTooltip] zanecháva odkaz vernej služby [ROOT.GetCountry.GetLongName] a pozoruhodné [target_woa.GetDefinition.GetName] — [target_woa.GetName]." # todo: NEW TRANSLATION
 flavor_byz.63.desc_nikephoros_is_hated: "$flavor_byz.63.desc_neutral$ Je však o to smutnejšie, že [target_character.GetNameWithNoTooltip] strávil posledné roky svojho života šíriac hereziu hesychazmu." # todo: NEW TRANSLATION
 flavor_byz.63.a: "[ROOT.GetCountry.GetLongNameWithNoTooltip] už nebude rovnaká bez [target_character.GetHerHim]." # todo: NEW TRANSLATION
 flavor_byz.63.a.entry: "Nebudeme už rovnakí bez neho." # todo: NEW TRANSLATION
 woa_was_created_here: "[THIS.GetWorkOfArt.GetDefinition.GetName] [THIS.GetWorkOfArt.GetName] bol vytvorený v [THIS.GetWorkOfArt.GetLocation.GetName] tvorcom [THIS.GetWorkOfArt.GetCreator.GetName]" # todo: NEW TRANSLATION
 flavor_byz.64.title: "Kampaň na Peloponéze" # todo: NEW TRANSLATION
 flavor_byz.64.entry: "$flavor_byz.64.title$" # todo: NEW TRANSLATION
 flavor_byz.64.desc: "[target_character.GetName], náš dôveryhodný generál, štátnik a spolucisár, plánuje vojenskú kampaň v [ShowAreaName('morea_area')], aby podrobil miestne frankovské kniežactvá. Po dlhý čas trčali [ShowFormableCountryName('LAT_f')] zvyšky ako tŕň v našom boku a čakajú na vhodný okamih, aby na nás zaútočili. Kampaň [target_character.GetShortNameWithNoTooltip] nám určite prinesie úľavu, ale zároveň by posilnila rod [target_character.GetDynasty.GetName], ktorý už dlho vládne na Peloponéze ako despoti." # todo: NEW TRANSLATION
 flavor_byz.64.a: "Pripravte sa na vojnu!" # todo: NEW TRANSLATION
 flavor_byz.64.b: "To je márna snaha o slávu." # todo: NEW TRANSLATION
 byz_additional_noble_power: "Po dobu #W 30#! rokov novonadobudnuté [Concept('locations','lokality')|e] v [ShowAreaName('morea_area')] získajú [ShowModifier('BYZ_morea_nobles')] [Concept('modifier','modifikátor')|e] na #W 30#! rokov od okamihu dobytia" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 flavor_byz.65.title: "[target_character.GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 flavor_byz.65.entry: "Demetrios Kydones, filozof" # todo: NEW TRANSLATION
 flavor_byz.65.desc: "Náš [ROOT.GetCountry.GetGovernment.GetRulerTitle] nadviazal priateľstvo s naozaj výnimočným [target_character.GetWomanMan]. [target_character.GetName] je študent filozofie s zvedavou a otvorenou mysľou. [target_character2.GetName] aj [target_character.GetShortNameWithNoTooltip] sa v mnohých veciach zhodujú a tí v [ROOT.GetCountry.GetGovernment.GetCourtTitle] vidia potenciál mladého [target_character.GetShortNameWithNoTooltip]. [target_character.GetHeShe|U] by mohol poslúžiť ako vynikajúci poradca v správe [ROOT.GetCountry.GetLongName]." # todo: NEW TRANSLATION
 flavor_byz.65.a: "[target_character.GetSheHe|U] musí byť naším #italic mesazon#!!" # todo: NEW TRANSLATION
 flavor_byz.65.a.entry: "On sa musí stať naším #italic mesazon#!!" # todo: NEW TRANSLATION
 flavor_byz.65.b: "Mali by sme požiadať [target_character.GetHerHim], aby preložil diela [ShowLanguageNameWithNoTooltip('latin_language')] do [ROOT.GetCountry.GetCourtLanguage.GetNameWithNoTooltip]!" # todo: NEW TRANSLATION
 flavor_byz.65.b.entry: "Mali by sme ho nechať preložiť diela [ShowLanguageNameWithNoTooltip('latin_language')] do jazyka nášho dvora!" # todo: NEW TRANSLATION
 byz_target_character_is_free_to_promote: "[target_character.GetName] nebude stáť žiadne [Concept('legitimacy_i','@legitimacy!')|e][Concept('legitimacy','legitimít')|e] na povýšenie na [Concept('head_of_the_cabinet','predsedu kabinetu')|e]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 flavor_byz.66.title: "Sviatok svätého Démétria" # todo: NEW TRANSLATION
 flavor_byz.66.entry: "$flavor_byz.66.title$" # todo: NEW TRANSLATION
 flavor_byz.66.desc: "[ShowPopTypeName('burghers')] v [target_location.GetName] začínajú organizovať tohtoročný jarmok venovaný sv. Demetriovi. Tento dlhodobý každoročný sviatok už priťahuje mnohých občanov i cudzincov a slúži ako veľkolepá ukážka [ROOT.GetCountry.GetAdjective] zbožnosti. Aj my môžeme prispieť svojou pomocou k podpore tejto tradície, aby boli tohtoročné oslavy zapamätané na stáročia." # todo: NEW TRANSLATION
 flavor_byz.66.historical_info: "Sviatok svätého Demetria, patróna Solúna, vznikol ako významná náboženská a kultúrna udalosť do 14. storočia, zakorenený v spomienke na mučeníctvo svätca v rímskom väzení okolo roku 306 a jeho reputáciu ako zázračného obrancu mesta proti obliehačom. Sústreďoval sa na baziliku Hagios Demetrios, oslavy trvali šesť dní a spájali slávnostné hymny a procesie s rušným trhom Demetria konajúcim sa mimo mestských hradieb, ktorý priťahoval obchodníkov a pútnikov z celého regiónu. V moderných časoch táto tradícia pretrváva cez sviatok 26. októbra a obnovený festival Demetria, ktorý naďalej vyjadruje trvalé spojenie mesta s vierou, tradíciou a komunitným životom." # todo: NEW TRANSLATION
 flavor_byz.66.a: "Urobte slávnostný dar." # todo: NEW TRANSLATION
 flavor_byz.66.b: "Majú našu duchovnú podporu." # todo: NEW TRANSLATION
 flavor_byz.1000.title: "Kanóny [cannon_maker.GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 flavor_byz.1000.entry: "Orbánove delá" # todo: NEW TRANSLATION
 flavor_byz.1000.desc: "[cannon_maker.GetName], [cannon_maker.GetCulture.GetName] odlievač a inžinier, sa objavil na dvore. [cannon_maker.GetSheHe|U] odvážne prehlásil, že by nám mohol postaviť delo takej veľkosti, akú sme ešte nevideli - ak mu len poskytneme kov a finančné prostriedky. Avšak prominentní členovia [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('burghers_estate')] nás varujú pred tým, hovoriac, že plat, ktorý [cannon_maker.GetSheHe] požaduje, rozhnevá cechy." # todo: NEW TRANSLATION
 flavor_byz.1000.a: "[cannon_maker.GetSheHe|U] dostane všetko, čo [cannon_maker.GetSheHe] potrebuje." # todo: NEW TRANSLATION
 flavor_byz.1000.a.entry: "Bude mať všetko, čo potrebuje." # todo: NEW TRANSLATION
 flavor_byz.1000.b: "To je poburujúce!" # todo: NEW TRANSLATION
 orban_goes_elsewhere.tt: "[cannon_maker.GetNameWithNoTooltip] môže namiesto toho ísť k vašim nepriateľom..." # todo: NEW TRANSLATION
 flavor_byz.1000.historical_info: "Orbán je v histórii známy tým, že vyrobil veľký bombard, ktorý zrútil hradby Konštantínopola. Najprv ponúkol svoje služby východnorímskemu cisárovi Konštantínovi XI., ale bol odmietnutý - tak išiel k Turkom..." # todo: NEW TRANSLATION
 great_bombard: "Stavba veľkého bombardu" # todo: NEW TRANSLATION
 flavor_byz.1001.title: "Pohroma Babylonu" # todo: NEW TRANSLATION
 flavor_byz.1001.entry: "$flavor_byz.1001.title$" # todo: NEW TRANSLATION
 flavor_byz.1001.desc: "[cannon_maker.GetName], [cannon_maker.GetCulture.GetName] odlievač a inžinier, hľadá zamestnanie. [cannon_maker.GetSheHe|U] žiada skutočne prehnané mzdy a už ho odmietol [GetCountry('BYZ').GetGovernment.GetRuler.GetNameWithNoTooltip] z [GetCountry('BYZ').GetName] - napriek tomu [cannon_maker.GetNameWithNoTooltip] sľubuje, že nám postaví delo, ktoré by dokázalo odpáliť samotné múry Babylonu." # todo: NEW TRANSLATION
 flavor_byz.1001.a: "Určite by sa nám to zišlo." # todo: NEW TRANSLATION
 flavor_byz.1001.b: "Podporte radšej našich vlastných zbrojárov." # todo: NEW TRANSLATION
 flavor_byz.1001.historical_info: "$flavor_byz.1000.historical_info$" # todo: NEW TRANSLATION
 flavor_byz.1100.title: "Hesychazmus" # todo: NEW TRANSLATION
 flavor_byz.1100.entry: "$flavor_byz.1100.title$" # todo: NEW TRANSLATION
 flavor_byz.1100.desc: "Teologické spory už dlho rozbúchavajú srdce nášho cisárstva. Ako strážca a pýcha [ShowReligionAdjective('orthodox')] viery sme stáli ako obrancovia pravého učenia v našom hľadaní božských záhad.\n\nDostáva sa ku nám správa, že [target_character_1.GetName] identifikoval znepokojujúce nezrovnalosti v náboženských praktikách mníchov z [target_location.GetName]. Pod duchovným vedením [target_character_2.GetName] sa ich zbožnosti údajne venujú odvážnym otázkam týkajúcim sa podstaty a energií Božích a podporujú prax vnútorného ticha a neustálej modlitby.\n\nV reakcii na to [target_character_1.GetShortNameWithNoTooltip] zapísal svoje námietky písomne, odsudzujúc tieto učenia hesychazmu ako nebezpečnú inováciu a varujúc, že takéto doktríny môžu siať zmätok medzi veriacimi a narušiť krehký pokoj nášho [ROOT.GetCountry.GetFlavorRank]. Naši poradcovia varujú, že nesprávne nasadený zápal, či už mystika alebo kritika, môže rozprúdiť nepokoje a možno dokonca vyprovokovať otvorené povstanie, ak sa táto záležitosť nevyrieši s rozvahou." # todo: CHANGED
 flavor_byz.1100.a: "Podporiť hnutie." # todo: CHANGED
 flavor_byz.1100.b: "[target_character_1.GetShortNameWithNoTooltip] hovorí pravdu, hesychazmus je herezia!" # todo: CHANGED
 flavor_byz.1100.b.entry: "Postava hovorí pravdu, hesychazmus je heréza!" # todo: NEW TRANSLATION
 flavor_byz.1100.c: "Ignorovať narastajúci chaos." # todo: CHANGED
 byz_may_trigger_other_event_tt: "Tieto debaty sa čoskoro môžu rozšíriť za naše hranice" # todo: NEW TRANSLATION
 worsen_relations_with_all_orthodox_tt: "Naše vzťahy so všetkými [ShowReligionAdjectiveWithNoTooltip('orthodox')] krajinami sa výrazne zhoršia" # todo: NEW TRANSLATION
 angry_barlaamite_clergy_tt: "V dôsledku ich podpory pre [target_character_1.GetName] približne [ROOT.GetVariable('num_barlaamite_pops_variable').GetValue|V0] [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('clergy_estate')] [Concept('pops','populácie')|e] v celom našom [ROOT.GetCountry.GetFlavorRank] utrpí [ShowNamedValue('pop_satisfaction_extreme_penalty')|+=2%] [Concept('pop_satisfaction','spokojnosti populácie')|e]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 angry_palamite_clergy_tt: "V dôsledku ich podpory pre [target_character_2.GetName] približne [ROOT.GetVariable('num_clergy_palamite_pops_variable').GetValue|V0] [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('clergy_estate')] [Concept('pops','populácie')|e] v celom našom [ROOT.GetCountry.GetFlavorRank] utrpí [ShowNamedValue('pop_satisfaction_extreme_penalty')|+=2%] [Concept('pop_satisfaction','spokojnosti populácie')|e]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 negatively_affect_succ_crisis_tt: "Naša nerozhodnosť v tejto záležitosti bude mať negatívne vedľajšie účinky počas úvodného [Concept('event','udalosti')|e] [ShowDisasterName('byzantine_succession_crisis')] [Concept('disaster','katastrofy')|e]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 pay_for_your_indecisiveness_tt: "V dôsledku našej nerozhodnej a ľahostajnej pozície v $flavor_byz.1100.title$ [Concept('event','udalosti')|e] sa strata [Concept('stability','stabilita')|e] výrazne zosilní" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 flavor_byz.1101.title: "[target_character.GetNameWithNoTooltip] prichádza do [target_location.GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 flavor_byz.1101.entry: "Na dvor prichádza barlaamitský učenec" # todo: NEW TRANSLATION
 flavor_byz.1101.desc: "Teologické debaty často končia ostrými sporami a prenasledovaním. Zdá sa, že to platí aj pre [target_character.GetName], ktorého odpor k #italic Hesychazmus#! vyvolal rozkol medzi ním a [target_character3.GetName], v dôsledku čoho bol druhý vyhnaný a hľadal útočisko v našich sieňach." # todo: NEW TRANSLATION
 flavor_byz.1101.a: "Čo sa to deje v [target_country.GetLongName]?" # todo: NEW TRANSLATION
 flavor_byz.1102.title: "Debata storočí" # todo: NEW TRANSLATION
 flavor_byz.1102.entry: "$flavor_byz.1102.title$" # todo: NEW TRANSLATION
 flavor_byz.1102.desc: "'Je táto kalamita začiatkom konca pre [ShowReligionAdjective('orthodox')] vieru?' Takéto znepokojivé šepoty teraz zaznievajú v kláštoroch, keď sa spor medzi [target_character2.GetName] a [target_character.GetName] prehlbuje.\n\nPrvý stojí ako horlivý obhajca hesychastickej tradície, zatiaľ čo druhý neúnavne pracuje na tom, aby tieto učenia označil za omyl a blud. Obvinenia dali miesto otvorenému odsúdeniu a apel na rozum sú odpovedané invokáciou božskej autority. To, čo začalo ako teologický spor, teraz hrozí rozdelením veriacich v [target_location.GetName] na nepriateľské tábory.\n\nAk sa táto záležitosť nevyrieši rýchlo a múdro, môže sa hnev vymknúť z diskurzu a zosadnúť do nepokojov, možno dokonca povstania." # todo: CHANGED
 flavor_byz.1102.a: "Naša podpora hesychazmu je pevná!" # todo: CHANGED
 flavor_byz.1102.b: "[target_character.GetNameWithNoTooltip] bude mať rád [target_character.GetHerHis] nový domov v [target_country.GetNameWithNoTooltip]." # todo: CHANGED
 flavor_byz.1102.b.entry: "Postave sa bude páčiť jeho nový domov v nich." # todo: NEW TRANSLATION

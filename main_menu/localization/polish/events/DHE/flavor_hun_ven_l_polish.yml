l_polish:
 flavor_hun_ven.1.title: "Osídlenie [ShowCultureNameWithNoTooltip('dalmatian')|U]" # todo: NEW TRANSLATION
 flavor_hun_ven.1.entry: "Zadarská zmluva - maďarská udalosť" # todo: NEW TRANSLATION
 flavor_hun_ven.1.desc: "Roky, [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')] snívalo o tom, že sa oslobodí z obmedzení vnútrozemia a získa výhľad na [ShowAreaName('adriatic_sea_area')]. Keď naši agenti prinášajú správy o úpadku [GetCountry('VEN').GetAdjective], niektorí na [ROOT.GetCountry.GetGovernment.GetCourtTitle] navrhujú, že je to príležitosť, na ktorú sme čakali. Namiesto toho, aby sme sa vrhali priamo do vojny, navrhuje sa vyvinúť diplomatický tlak na [GetCountry('VEN').GetNameWithNoTooltip], aby urobili ústupky." # todo: NEW TRANSLATION
 flavor_hun_ven.1.a: "Vyjednávanie je strata času." # todo: NEW TRANSLATION
 flavor_hun_ven.1.b: "Skúsme vyvíjať diplomatický tlak." # todo: NEW TRANSLATION
 flavor_hun_ven.1.historical_info: "Počas panovania Ľudovíta I. sa Uhorsko snažilo rozšíriť svoj prístup k Jadranu a oslabiť benátsku nadvládu pozdĺž dalmátskeho pobrežia. Ľudovít v roku 1356 zahájil útok proti Benátkam a rýchlo obsadil mnoho významných dalmátskych miest. Do roku 1358 Benátky utrpeli sériu veľkých porážok a trápili ich vnútorné problémy, takže sa Republika rozhodla rokovať. Na základe výslednej Zadarskej zmluvy Benátky vzdali kontrolu nad Dalmáciou, čo umožnilo vzostup Republiky Ragusa ako polonezávislého vazala Uhorska." # todo: NEW TRANSLATION
 flavor_hun_ven.2.title: "Osídlenie [ShowCultureNameWithNoTooltip('dalmatian')|U]" # todo: NEW TRANSLATION
 flavor_hun_ven.2.desc: "Vnútorné utrpenie [ROOT.GetCountry.GetFlavorRank] neuniklo pozornosti. [GetCountry('HUN').GetName] navrhol stretnutie delegácií, aby rokovali o odovzdaní našich [ShowCultureName('dalmatian')|U] území v prospech [GetCountry('HUN').GetNameWithNoTooltip]. [ROOT.GetCountry.GetGovernment.GetCourtTitle] je v tejto otázke rozdelený. Mnohí odsudzujú návrh ako ponižujúci úder pre našu česť a silu. Iní vyzývajú na opatrnosť a tvrdia, že odmietnutie ich podmienok by mohlo vyprovokovať vojnu, v ktorej by sme mohli stratiť omnoho viac než len Dalmáciu." # todo: NEW TRANSLATION
 flavor_hun_ven.2.a: "Tento návrh je rovnako hlúpy ako ich [GetCountry('HUN').GetGovernment.GetRulerTitle]!" # todo: NEW TRANSLATION
 flavor_hun_ven.2.a.entry: "Tento návrh je rovnako hlúpy ako ich vládca!" # todo: NEW TRANSLATION
 flavor_hun_ven.2.b: "Nemáme veľa možností, musíme to prijať." # todo: NEW TRANSLATION

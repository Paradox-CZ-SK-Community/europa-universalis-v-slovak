l_polish:
 banu_al_wad: "Bānu 'Abd āl-Wād" # todo: NEW TRANSLATION
 FATE_OF_TLEMCEN: "Osud [ShowLocationNameWithNoTooltip('tlemcen')]" # todo: NEW TRANSLATION
 flavor_tle.1.title: "[target_war.GetNameWithNoTooltip]" # todo: CHANGED (predtym: Pád [capital_scope.GetNameWithNoTooltip])
 flavor_tle.1.desc: "[ShowRegionName('maghreb_region')] stojí na pokraji — obliehanie [target_siege.GetName] je už v plnom prúde a [tle_scope.GetAdjective] pomocné vojsko čoskoro dorazí, takže je možné, že o budúcnosti [ShowSubContinentName('north_africa')] sa rozhodne v priebehu niekoľkých dní. Obstojí [target_location.GetRank.GetName] proti [mor_ruler.GetName] a [mor_ruler.GetHerHis] [mor_scope.GetAdjective] vojskám, alebo [target_location.GetName] padne a spečatí osud [tle_ruler.GetName] a [tle_ruler.GetHerHis] [tle_scope.GetFlavorRank]?" # todo: CHANGED (predtym: Hlavné mesto nášho milého [ROOT.GetCountry.GetFlavorRank], [capital_scope.GetName], bohužiaľ padlo do rúk našich ohavnýc)
 flavor_tle.1.a: "Do zbrane!" # todo: CHANGED (predtym: [ROOT.GetCountry.Custom('common_string_negative')])
 tle_morrocan_tlemcen_war: "Ak bude [target_location.GetName] v [target_war.GetName] okupované [mor_scope.GetLongName], [mor_scope.GetName] bude môcť násilím urobiť z [tle_scope.GetName] [ShowSubjectTypeName('fiefdom')]" # todo: NEW TRANSLATION
 tle_additional_warning: "[target_siege.GetName] sa musí čo najskôr ukončiť!" # todo: NEW TRANSLATION
 flavor_tle.2.title: "Pád [target.GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 flavor_tle.2.desc: "[target.GetName], perla [target.GetArea.GetName], napokon podľahla nášmu obliehaniu a vzdala sa našim mocným vojskám. Keď sa otvorili brány, naše sily vtrhli do [target.GetRank.GetName] v snahe zabezpečiť hlavnú citadelu a zmocniť sa koristi a zajatcov. V citadele sa nachádzalo mnoho členov rodiny [target_country.GetGovernment.GetAdjective], ktorých naši vojaci rýchlo zajali a odviedli pred [from_country.GetAdjective] generálov. Mohol by to byť koniec [target_war.GetName]?" # todo: NEW TRANSLATION
 flavor_tle.2.a: "Postarajte sa, aby [target_dynasty.GetNameWithNoTooltip] neboli prekážkou." # todo: NEW TRANSLATION
 flavor_tle.2.b: "Vpred, na [ShowLocationNameWithNoTooltip('oran')]!" # todo: NEW TRANSLATION
 TLE_once_truce_ends_zayyanid_pretenders_tt: "Keď sa skončí [Concept('truce','prímerie')|e] s [target_country.GetName], budú mať prístup k [ShowDecisionName('zayyanid_pretenders_decision')] [Concept('decision','rozhodnutiu')|e], ktorá im umožní vyhlásiť špeciálnu [Concept('war','vojnu')|e] [ShowCasusBelliName('cb_independence_war')]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 flavor_tle.3.title: "$flavor_tle.2.title$" # todo: NEW TRANSLATION
 flavor_tle.3.desc: "Hlavné mesto nášho milovaného [ROOT.GetCountry.GetFlavorRank], [target.GetName], padlo do rúk našich odporných nepriateľov z [from_country.GetLongName]. Túto tragédiu ešte umocňuje smrť mnohých členov milovanej rodiny [target_dynasty.GetName] počas útoku.\n\nTáto pohroma vyvolala v [ROOT.GetCountry.GetLongName] vlnu zúfalstva a prakticky znemožnila pokračovanie vojny. Samotné vraždenie nestačí na ochromenie krajiny, no strata dôvery vo vedenie rozhodne áno. Naši kmeňoví spojenci nás opustili, naša morálka je na historickom minime a keďže nemáme zorganizované hnutie odporu, znamená to koniec [target_war.GetName]." # todo: NEW TRANSLATION
 flavor_tle.3.a: "[ROOT.GetCountry.Custom('common_string_negative')]" # todo: NEW TRANSLATION
 TLE_as_per_the_warning: "Nedbali sme na varovania a dovolili sme, aby bolo naše milované [target.GetName] okupované. Rodina [target_dynasty.GetName] bola vyvraždená a teraz sme [ShowSubjectTypeName('fiefdom')] podriadeným [from_country.GetName]." # todo: NEW TRANSLATION
 zayyanid_pretenders_decision.title: "Dosadiť na trón princa z rodu [ShowDynastyNameWithNoTooltip('zayyanid_dynasty')]" # todo: NEW TRANSLATION
 zayyanid_pretenders_decision.desc: "Vláda [ROOT.GetCountry.GetDiplomacy.GetOverlord.GetName] je nanajvýš tyranská a v najlepšom prípade na príťaž pre [ROOT.GetCountry.GetLongName]. Pozvime princa z rodu [ShowDynastyName('zayyanid_dynasty')], aby nám opäť vládol, a zjednoťme všetky [ShowEstateTypeName('tribes_estate')] proti spoločnému nepriateľovi." # todo: NEW TRANSLATION
 zayyanid_pretenders_decision.desc.entry: "Vláda nášho vládcu je skutočne tyranská. Do hĺbky podkopáva nadradenosť kmeňov $banu_al_wad$. Pozvime princa z rodu [ShowDynastyName('zayyanid_dynasty')], aby nám opäť vládol, a zjednoťme všetky [ShowEstateTypeName('tribes_estate')] proti spoločnému nepriateľovi." # todo: NEW TRANSLATION
 zayyanid_pretenders_decision.a: "[ROOT.GetCountry.Custom('common_string_positive')]" # todo: NEW TRANSLATION
 zayyanid_pretenders_decision.a.entry: "$common_string_great$" # todo: NEW TRANSLATION
 zayyanid_prince_takes_over: "Moci sa ujme princ z [Concept('dynasty','dynastie')|e] [ShowDynastyName('zayyanid_dynasty')]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 flavor_tle.4.title: "$flavor_tle.7.title$" # todo: NEW TRANSLATION
 flavor_tle.4.desc: "Situácia v [from_country.GetName] sa každým dňom stáva čoraz neudržateľnejšou. Mnohí uchádzači z rodu [target_dynasty.GetName] vyšli z úkrytu a aktívne hľadajú podporu medzi kmeňmi [ShowCultureName('zenati')] v tejto oblasti. Ak sa nám nepodarí uzmieriť miestne stavy, [target_location.GetName] sa môže stať ohniskom ľudového povstania a ukončiť našu hegemóniu nad oblasťou [ShowRegionName('maghreb_region')]. Dokáže [target_country.GetName] ustáť takúto búrku?" # todo: NEW TRANSLATION
 flavor_tle.4.a: "Musíme dbať na tieto varovania." # todo: NEW TRANSLATION
 tle_rules_for_zayyanid_pretenders: "Ak [target_country.GetName] počas ktoréhokoľvek z nasledujúcich #Y 20#! rokov neudrží [Concept('subject_loyalty','vernosť vazala')|e] [from_country.GetLongName] nad hodnotou #Y 30#!, [from_country.GetName] bude môcť vyhlásiť [Concept('war','vojna')|e] [ShowCasusBelliName('cb_independence_war')] prostredníctvom [Concept('decision','rozhodnutia')|e] [ShowDecisionName('zayyanid_pretenders_decision')]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 tle_rules_part_two: "Ak sa tak stane, [from_country.GetName] získa významné bonusy k vojenskej sile a [target_country.GetName] získa nasledujúce:" # todo: NEW TRANSLATION
 flavor_tle.5.title: "Návrat rodu [ShowDynastyNameWithNoTooltip('zayyanid_dynasty')] do [ROOT.GetCountry.GetCapital.GetAltAdjectiveWithNoTooltip('G')]!" # todo: NEW TRANSLATION # todo: COUNTRY CASE
 flavor_tle.5.desc: "[target_character.GetName], uchádzač o [from_country.GetAdjective] trón, práve vstúpil do [ROOT.GetCountry.GetCapital.GetAltAdjective('G')], kde ho jasajúco privítali [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')] a zástupcovia [ROOT.GetCountry.GetGovernment.GetEstateName('tribes_estate')]. Tento čin je otvoreným vyhlásením vojny zo strany [from_country.GetName] proti [target_country.GetLongName], štátu, ktorý vládne [ROOT.GetCountry.GetCapital.GetName] už príliš dlho. [target_character.GetShortNameWithNoTooltip] sa teší širokej podpore v [from_country.GetNameWithNoTooltip], no čo je najdôležitejšie, získal si [ShowModifier('tle_zayyanid_tribe_support')]: podporu najväčšieho a najmocnejšieho kmeňa [ShowCultureName('zenati')] v [ROOT.GetCountry.GetFlavorRank], domovského kmeňa rodu [target_dynasty.GetName].\n\nUkážeme tým [target_country.GetAdjectiveWithNoTooltip] bastardom, kto zvíťazí v [target_war.GetName]!" # todo: NEW TRANSLATION # todo: COUNTRY CASE
 flavor_tle.5.a: "Sláva [ROOT.GetCountry.GetReligion.GetGodName]!" # todo: NEW TRANSLATION
 zayyanid_pretender_effect: "Vyhlásime [ShowCasusBelliName('cb_independence_war')] proti nášmu [overlord|e] a získame ďalšie výhody z nasledujúcej udalosti:" # todo: NEW TRANSLATION
 flavor_tle.6.title: "Povstanie v [from_country.GetLongNameWithNoTooltip]!" # todo: NEW TRANSLATION
 flavor_tle.6.desc: "Naše horlivé úsilie — udeľovanie výsad, diplomatické misie, okázalé dary a prideľovanie úradov — vyšlo nazmar. Kmene [from_country.GetName] si aj naďalej vyberajú tyranského [target_character.GetName] z rodu [target_dynasty.GetName] namiesto zhovievavejšej vlády [target_country.GetAdjective].\n\nNech je teda po ich! Nech zakúsia hnev našich vojsk! Uvalíme na nich boží trest [ROOT.GetCountry.GetReligion.GetGodName] a zvíťazíme v [target_war.GetName]!" # todo: NEW TRANSLATION
 flavor_tle.6.a: "Naša hegemónia v [ShowRegionNameWithNoTooltip('maghreb_region')] nebude zvrhnutá!" # todo: NEW TRANSLATION
 flavor_tle.7.title: "Uchádzači z rodu [target_dynasty.GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 flavor_tle.7.entry: "Uchádzači z rodu [ShowDynastyNameWithNoTooltip('zayyanid_dynasty')]" # todo: NEW TRANSLATION
 flavor_tle.7.desc: "V uplynulých rokoch vyšlo z úkrytu mnoho preživších členov dynastie [target_dynasty.GetName], aby sa pokúsili získať [target_location.GetName] a [from_country.GetAdjective] trón. Tešia sa vlažnej podpore obyvateľstva i [target_country.GetGovernment.GetEstateName('tribes_estate')] a nálady verejnosti sa pomaly obracajú v ich prospech. Ak naši vládcovia v [target_country.GetLongName] budú naďalej zhoršovať krízu v [target_location.GetProvince.GetName], môžeme sa dočkať návratu rodu [target_dynasty.GetNameWithNoTooltip] k moci." # todo: NEW TRANSLATION
 flavor_tle.7.a: "Mohlo by nám to prospieť." # todo: NEW TRANSLATION
 flavor_tle.11.title: "Vernosť zaistená" # todo: NEW TRANSLATION
 flavor_tle.11.desc: "Od [target_country.GetAdjective] podrobenia [from_country.GetName] uplynuli desaťročia a chýry o návrate rodu [ShowDynastyName('zayyanid_dynasty')] väčšinou utíchli. Zdá sa, že sa nám napokon podarilo podriadiť kmene [ShowCultureName('zenati')] z [from_country.GetGovernment.GetEstateName('tribes_estate')] i najvýznamnejší kmeň $banu_al_wad$ medzi nimi. Keď budú ich územia začlenené, nastolíme novú éru prosperity v oblasti [ShowRegionName('maghreb_region')]." # todo: NEW TRANSLATION
 flavor_tle.11.a: "[ROOT.GetCountry.Custom('common_string_positive')]" # todo: NEW TRANSLATION
 tle_secured: "[from_country.GetName] sa už nebude môcť vzbúriť prostredníctvom [ShowDecisionName('zayyanid_pretenders_decision')]" # todo: NEW TRANSLATION
 flavor_tle.13.title: "Rozmach [ShowLocationNameWithNoTooltip('oran')]" # todo: NEW TRANSLATION
 flavor_tle.13.entry: "$flavor_tle.13.title$" # todo: NEW TRANSLATION
 flavor_tle.13.desc: "Ak je [target_location2.GetName] našou bránou k obchodu v oblasti [ShowScriptedGeographyName('sahara_desert_geography')], potom je [target_location.GetName] naším oknom do obchodu s [ShowContinentName('europe')]. Žiadny iný prístav nezohráva takú dôležitú úlohu ako ten v [target_location.GetNameWithNoTooltip], keďže je hlavnou zátokou spájajúcou nás s našimi námornými partnermi v oblasti [ShowScriptedGeographyName('mediterranean_sea_geography')]. Možno by si [target_location.GetRank.GetName] zaslúžilo dodatočné výsady, ktoré by posilnili miestny stav [target_estate.GetName]." # todo: NEW TRANSLATION
 flavor_tle.13.a: "Skvelý nápad!" # todo: NEW TRANSLATION
 flavor_tle.13.b: "[target_location.GetNameWithNoTooltip] si nezaslúži osobitné zaobchádzanie." # todo: NEW TRANSLATION

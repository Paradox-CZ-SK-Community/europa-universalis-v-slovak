l_polish:
 flavor_luc.1.entry: "$flavor_luc.1.title$" # todo: NEW TRANSLATION
 flavor_luc.1.title: "Výroba [ShowGoodsNameWithNoTooltip('silk')] v [ShowLocationNameWithNoTooltip('lucca')]" # todo: NEW TRANSLATION
 flavor_luc.1.desc: "[ShowGoodsName('silk')] sa považuje za jeden z najvzácnejších zdrojov v [ShowContinentName('europe')], a preto ho mnohí [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] pokladajú za najlepší materiál na odevy. [ShowLocationName('lucca')] je už domovom chovu hodvábnych húseníc a začínajúceho priemyslu [ShowGoodsNameWithNoTooltip('silk')], hoci výroba ešte nedosahuje svoj plný potenciál. [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')] aj [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')] sa zhodujú, že investície do tohto tovaru nám umožnia rozšíriť výrobu [ShowGoodsName('fine_cloth')] a zatieniť ktoréhokoľvek konkurenta v [ShowRegionName('italy_region')], ktorý by sa nám pokúsil konkurovať." # todo: NEW TRANSLATION
 flavor_luc.1.a: "Investujeme do týchto hodvábnych húseníc." # todo: NEW TRANSLATION
 flavor_luc.1.b: "Ak chcú zisk, budú si ho musieť vybojovať sami." # todo: NEW TRANSLATION
 flavor_luc.2.entry: "$flavor_luc.2.title$" # todo: NEW TRANSLATION
 flavor_luc.2.title: "Obchod s [ShowGoodsNameWithNoTooltip('fine_cloth')] v [ShowLocationNameWithNoTooltip('lucca')]" # todo: NEW TRANSLATION
 flavor_luc.2.desc: "[ShowLocationName('lucca')] sa môže pýšiť významným priemyslom [ShowGoodsName('fine_cloth')]. Mnohé iné mestá v [ShowRegionName('italy_region')] nás síce prekonávajú množstvom produkcie, no nedokážu sa vyrovnať vynikajúcej kvalite našej látky, ktorú vyrábajú najlepší mešťania s dlhoročnou skúsenosťou v tomto remesle. Aj najbohatší ľudia považujú oblečenie v štýle [ROOT.GetCountry.GetAdjective] za luxus, čo viedlo k zvýšeniu výroby, aby sa uspokojil dopyt." # todo: NEW TRANSLATION
 flavor_luc.2.a: "[ROOT.GetCountry.Custom('common_string_positive')]" # todo: NEW TRANSLATION
 flavor_luc.2.a.entry: "Skvelé!" # todo: NEW TRANSLATION
 luc_fine_cloth_demand: "Dopyt po kvalitných látkach" # todo: NEW TRANSLATION
 flavor_luc.3.entry: "$flavor_luc.3.title$" # todo: NEW TRANSLATION
 flavor_luc.3.title: "Dostať sa do [ShowLocationNameWithNoTooltip('london')]" # todo: NEW TRANSLATION
 flavor_luc.3.desc: "Príležitostnejší členovia nášho [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')] prišli s plánom expandovať na trh [target_market.GetName]. Konkrétne mnohí už naplánovali presun do [ShowLocationName('london')], ktoré vlastní [target_country.GetName] a ktoré je k nám priateľské.\n\nTento návrh bol predložený [ROOT.GetCountry.GetGovernment.GetCourtTitle], pričom niektorí členovia sú nadšení z rozšírenia obchodnej siete. Iní však poukázali na to, že by to mohlo vzbudiť nevoli u [target_country.GetNameWithNoTooltip], že zahraniční kupci nemusia byť prijatí priaznivo, a že spolupráca s nimi by nám mohla slúžiť viac než konkurencia." # todo: NEW TRANSLATION
 flavor_luc.3.a: "Rozšírime našu obchodnú sieť." # todo: NEW TRANSLATION
 flavor_luc.3.b: "Namiesto súťaženia by sme mali spolupracovať." # todo: NEW TRANSLATION
 flavor_luc.4.entry: "$flavor_luc.4.title$" # todo: NEW TRANSLATION
 flavor_luc.4.title: "Libertas!" # todo: NEW TRANSLATION
 flavor_luc.4.desc: "V priebehu dejín [ROOT.GetCountry.GetName] náš ľud zažil mnohé porážky a poníženia. Napriek všetkému však zostávame neotrasiteľní.\n\nLežať a prijať porážku nie je niečo, čo by robili občania [ROOT.GetCountry.GetAdjectiveWithNoTooltip]. Keď sa objaví kríza alebo sú naše armády porazené v bitke, sme pripravení brániť [ShowLocationName('lucca')]." # todo: NEW TRANSLATION
 flavor_luc.4.a: "Nikdy neprejavíme strach, nech sú šance akékoľvek!" # todo: NEW TRANSLATION
 flavor_luc.4.b: "Najlepšia obrana je skvelý útok." # todo: NEW TRANSLATION
 flavor_luc.5.entry: "$flavor_luc.5.title$" # todo: NEW TRANSLATION
 flavor_luc.5.title: "Hradby [ShowBuildingTypeNameWithNoTooltip('walls_of_lucca')]" # todo: NEW TRANSLATION
 flavor_luc.5.desc: "Vojna a hlad nemusia vždy zasiahnuť [ShowLocationName('lucca')], ale keď áno, každý občan trpí. Strážnici na hradbách sú vždy v strehu a hľadajú nepriateľov, lebo ak príde porážka, ich domov bude v nebezpečenstve. Mnohí v [ROOT.GetCountry.GetGovernment.GetCourtTitle] navrhujú rozšíriť hradby, urobiť ich čo najimpozantnejšími, aby získali dôveru ľudu a zaistili bezpečnosť každého občana." # todo: NEW TRANSLATION
 flavor_luc.5.a: "Rozšírime hradby." # todo: NEW TRANSLATION
 flavor_luc.5.b: "Musíme zabezpečiť, aby nikdy neprišla vojenská porážka." # todo: NEW TRANSLATION
 flavor_luc.1000.entry: "$flavor_luc.1000.title$" # todo: NEW TRANSLATION
 flavor_luc.1000.title: "Kúpa [GetCountry('LUC').GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 flavor_luc.1000.desc: "Vojna, ktorú momentálne vedie [target_country.GetName], nám dala príležitosť zmeniť toho, komu slúžime, ak si to želáme. Namiesto dosiahnutia toho vojenskými prostriedkami mnohí v [ROOT.GetCountry.GetGovernment.GetCourtTitle] navrhli, že by sme mohli byť predaní [GetCountry('PIS').GetName], a to nielen za finančný zisk, ale aj ako prejav dobrej vôle." # todo: NEW TRANSLATION
 flavor_luc.1000.a: "Navrhnime to [target_country.GetNameWithNoTooltip]." # todo: NEW TRANSLATION
 flavor_luc.1000.a.entry: "Predložme to našim pánom." # todo: NEW TRANSLATION
 flavor_luc.1000.b: "Ak chceme získať nezávislosť, bude to musieť byť vojenskou cestou." # todo: NEW TRANSLATION
 flavor_luc.1001.title: "$flavor_luc.1000.title$" # todo: NEW TRANSLATION
 flavor_luc.1001.desc: "S vojnou proti [enemy_country.GetName] v plnom prúde prišli diplomati z [GetCountry('LUC').GetName]. Hovoria o stave vojny a o tom, ako sa [GetCountry('PIS').GetName] pripravujú so svojimi vojskami na vojenskú intervenciu proti nám. Aby tomu zabránili, ponúkli samotné [GetCountry('LUC').GetNameWithNoTooltip] ako platbu za mier — a zároveň pre svoj finančný prospech." # todo: NEW TRANSLATION
 flavor_luc.1001.a: "Nemali by sme riskovať ďalšieho nepriateľa v [ShowRegionNameWithNoTooltip('italy_region')]." # todo: NEW TRANSLATION
 flavor_luc.1001.b: "Naši poddaní nie sú na predaj." # todo: NEW TRANSLATION
 flavor_luc.1002.title: "$flavor_luc.1000.title$" # todo: NEW TRANSLATION
 flavor_luc.1002.desc: "[target_country.GetName] nás oslovilo so zvláštnou ponukou. Chcú nám predať svojho vazala [GetCountry('LUC').GetName], a výmenou za to požadujú, aby sme s nimi uzavreli prímerie a nezasahovali do ich súčasného konfliktu proti [enemy_country.GetName]." # todo: NEW TRANSLATION
 flavor_luc.1002.a: "Stojí to za to." # todo: NEW TRANSLATION
 flavor_luc.1002.b: "Prečo kupovať niečo, čo môžeme získať vojenskou silou?" # todo: NEW TRANSLATION
 flavor_luc.1100.entry: "$flavor_luc.1100.title$" # todo: NEW TRANSLATION
 flavor_luc.1100.title: "Výhodné spojenectvo" # todo: NEW TRANSLATION
 flavor_luc.1100.desc: "Naša súčasná pozícia v [ShowRegionName('italy_region')] je stabilná, no vonkajšie hrozby sa môžu objaviť, ak nebudeme dosť opatrní. Z tohto dôvodu mnohí v [ROOT.GetCountry.GetGovernment.GetCourtTitle] navrhujú, aby sme vyhľadali spojenectvo s [GetCountry('GEN').GetName]. Obe strany z toho budú profitovať, čím zabezpečíme, že kto sa pokúsi dobyť región, bude musieť čeliť väčšiemu, zjednotenejšiemu protivníkovi." # todo: NEW TRANSLATION
 flavor_luc.1100.a: "Také spojenectvo by bolo ideálne." # todo: NEW TRANSLATION
 flavor_luc.1100.b: "Namiesto toho by sme sa mali pokúsiť zabezpečiť hranice rozšírením územia." # todo: NEW TRANSLATION
 flavor_luc.1101.title: "$flavor_luc.1100.title$" # todo: NEW TRANSLATION
 flavor_luc.1101.desc: "Súčasné napätie v [ShowRegionName('italy_region')] prinútilo mnohé štáty brániť sa samostatne, no to neznamená, že by sme mali zostať izolovaní. Práve z tohto dôvodu nás oslovili diplomati z [from_country.GetName] ohľadom možného spojenectva. Obe strany, [target_character.GetName] a [target_character2.GetName], budú schopné zabezpečiť svoju suverenitu a možno si navzájom pomôcť pri vyháňaní hrozieb zvonka regiónu." # todo: NEW TRANSLATION
 flavor_luc.1101.a: "Je to určite niečo, čo by pomohlo obom stranám." # todo: NEW TRANSLATION
 flavor_luc.1101.b: "Nestojí za to im pomáhať. Mohli by sme ich namiesto toho dobyť..." # todo: NEW TRANSLATION

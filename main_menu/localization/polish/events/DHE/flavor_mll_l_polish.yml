l_polish:
 flavor_mll.1.title: "Napäté vzťahy s [target_country.GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 flavor_mll.1.entry: "Napäté vzťahy s Aragónom" # todo: NEW TRANSLATION
 flavor_mll.1.desc: "Hoci si [ROOT.GetCountry.GetLongName] a [target_country.GetLongName] udržiavali úzke vzťahy od smrti [GetCharacter('ara_jacme_i_arago').GetName] a [ROOT.GetCountry.GetNameWithNoTooltip] uznávalo zvrchovanosť [target_country.GetAdjectiveWithNoTooltip], nedávny nástup [our_ruler.GetName] na trón viedol k napätiu vo vzťahoch s [target_country.GetCapital.GetName]. [our_ruler.GetNameWithNoTooltip] považuje [our_ruler.GetHerHis] postavenie [ROOT.GetCountry.GetGovernment.GetRulerTitle] za rovnocenné postaveniu [ara_ruler.GetName], a preto nariadil, že žiadny [ROOT.GetCountry.GetGovernment.GetRulerTitle] nemôže byť podriadený žiadnemu [target_country.GetGovernment.GetRulerTitle].\n\nHoci [target_country.GetNameWithNoTooltip] nepodniklo voči [ROOT.GetCountry.GetAltAdjectiveWithNoTooltip('D')] žiadne nepriateľské kroky, mnohí členovia [ROOT.GetCountry.GetGovernment.GetCourtTitle] vyjadrili obavy, že [our_ruler.GetNameWithNoTooltip]ova trúfalosť môže poslúžiť ako zámienka pre [target_country.GetGovernment.GetCourtTitle] krajiny [target_country.GetNameWithNoTooltip], aby si v budúcnosti podrobil [ROOT.GetCountry.GetNameWithNoTooltip]." # todo: NEW TRANSLATION # todo: COUNTRY CASE
 flavor_mll.1.a: "V nasledujúcich rokoch musíme postupovať opatrne." # todo: NEW TRANSLATION
 repair_or_damage_relations_with_aragon_tt: "Ak sa [ROOT.GetCountry.GetAltAdjective('A')] v nasledujúcich rokoch podarí dosiahnuť vzťahy na úrovni #G +190#! s krajinou [target_country.GetName], vzťahy s [target_country.GetAdjectiveWithNoTooltip] [target_country.GetGovernment.GetCourtTitle] sa môžu napraviť. Prípadne sa môžeme pripraviť na to, že sa nadobro vymaníme spod nadvlády krajiny [target_country.GetNameWithNoTooltip]" # todo: NEW TRANSLATION # todo: COUNTRY CASE
 variable_tt_mll_authority_of_james_iii: "Udalosť [Concept('dynamic_historical_event','dynamická historická udalosť')|e] $flavor_mll.1.entry$ nastala" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 flavor_mll.2.title: "Obnova po konflikte s [target_country_1.GetAdjectiveWithNoTooltip]" # todo: NEW TRANSLATION
 flavor_mll.2.entry: "Obnova po minulých konfliktoch s Janovom" # todo: NEW TRANSLATION
 flavor_mll.2.desc: "Nedávne konflikty medzi krajinami [target_country.GetName] a [target_country_1.GetName] mali zničujúci vplyv na [ROOT.GetCountry.GetLongName]. Krajina [target_country.GetName] si na svoje ťaženia do oblasti [ShowAreaName('sardinia_area')] zrekvirovala mnoho lodí [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')]. Hoci sa konflikt skončil, obchodné trasy [ROOT.GetCountry.GetAdjectiveWithNoTooltip] sú vážne narušené a mnohí členovia [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('burghers_estate')] žiadajú [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')] o pomoc pri obnove. Iní členovia [ROOT.GetCountry.GetGovernment.GetCourtTitle] sa však domnievajú, že treba zaviesť novú daň, pretože strata toľkých lodí spôsobila, že [ROOT.GetCountry.GetNameWithNoTooltip] je zraniteľnejšie voči nájazdom z oblasti [ShowRegionName('maghreb_region')]." # todo: NEW TRANSLATION
 flavor_mll.2.a: "Na doplnenie pokladnice [ROOT.GetCountry.GetFlavorRank] treba zaviesť novú daň." # todo: NEW TRANSLATION
 flavor_mll.2.b: "Presmerujte prostriedky [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('crown_estate')] na podporu obnovy [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('burghers_estate')]." # todo: NEW TRANSLATION
 flavor_mll.3.title: "Palatínske zákony [our_ruler.GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 flavor_mll.3.entry: "Palatínske zákony Jakuba III." # todo: NEW TRANSLATION
 flavor_mll.3.desc: "V nádeji, že ešte viac posilní [our_ruler.GetHisHer] postavenie nezávislého vládcu voči krajine [target_country.GetName], položil [our_ruler.GetName] základy nového [ShowLawNameWithNoTooltip('legal_code_law')], [ShowPolicyName('mll_leges_palatinae')]. [ShowPolicyNameWithNoTooltip('mll_leges_palatinae')] posilní nezávislé postavenie krajiny [ROOT.GetCountry.GetAltAdjectiveWithNoTooltip('G')] a upevní vládnu moc [ROOT.GetCountry.GetGovernment.GetAdjective] [ROOT.GetCountry.GetGovernment.GetCourtTitle]." # todo: NEW TRANSLATION # todo: COUNTRY CASE
 flavor_mll.3.a: "Prijmime tento nový [ShowLawNameWithNoTooltip('legal_code_law')], aby sme posilnili svoje postavenie!" # todo: NEW TRANSLATION
 flavor_mll.3.b: "Ponechajme nový [ShowLawNameWithNoTooltip('legal_code_law')] pripravený, no s jeho vyhlásením zatiaľ počkajme." # todo: NEW TRANSLATION
 flavor_mll.3.c: "Zmeny nášho súčasného [ShowLawNameWithNoTooltip('legal_code_law')] nepotrebujeme." # todo: NEW TRANSLATION
 variable_tt_mll_created_palatine_laws_of_mallorca: "Udalosť [Concept('dynamic_historical_event','dynamická historická udalosť')|e] $flavor_mll.3.entry$ nastala" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 flavor_mll.4.title: "Iluminovaný rukopis [ShowPolicyNameWithNoTooltip('mll_leges_palatinae')]" # todo: NEW TRANSLATION
 flavor_mll.4.entry: "Iluminovaný rukopis Leges Palatinae" # todo: NEW TRANSLATION
 flavor_mll.4.desc: "Po dokončení návrhu nového [ShowLawName('legal_code_law')] poveril [our_ruler.GetName] niekoľkých umelcov zo skupiny [ShowCultureGroupName('italian_group')], aby vytvorili iluminovaný rukopis a ešte viac posilnili [our_ruler.GetHisHer] prestíž. Keďže dielo je už hotové, niektorí členovia [ROOT.GetCountry.GetGovernment.GetCourtTitle] navrhli, aby sa [ShowWorkOfArtNameWithNoTooltip('illuminated_manuscrpt_of_the_legas_palatinae')] namiesto toho využil ako diplomatická páka, keďže vysoká kvalita [ShowWorkOfArtTypeNameWithNoTooltip('treatise')] z neho robí veľkorysý dar." # todo: NEW TRANSLATION
 flavor_mll.4.a: "Zatiaľ si ho ponechajme ako artefakt [ROOT.GetCountry.GetGovernment.GetCourtTitle]." # todo: NEW TRANSLATION
 flavor_mll.4.b: "Bol by to skvelý dar pre [fra_ruler.GetShortNameWithNoTooltip] z krajiny [target_country_1.GetNameWithNoTooltip]." # todo: NEW TRANSLATION
 flavor_mll.4.b.entry: "Bol by to skvelý dar pre vládcu Francúzska." # todo: NEW TRANSLATION
 flavor_mll.4.c: "Pošlime rukopis do [target_country.GetCapital.GetNameWithNoTooltip] ako symbol prestíže [ROOT.GetCountry.GetAdjectiveWithNoTooltip]." # todo: NEW TRANSLATION
 flavor_mll.4.c.entry: "Pošlime rukopis do Aragónu ako symbol mallorskej prestíže." # todo: NEW TRANSLATION
 flavor_mll.5.title: "Spojenia s [target_location.GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 flavor_mll.5.entry: "Spojenia s Montpellierom" # todo: NEW TRANSLATION
 flavor_mll.5.desc: "Po smrti [GetCharacter('ara_jacme_i_arago').GetName] a rozdelení [GetCharacter('ara_jacme_i_arago').GetHisHer] území získalo [ROOT.GetCountry.GetName] niekoľko kontinentálnych držav na území [ShowContinentName('europe')]. Medzi nimi sa [target_location.GetRank.GetName] [target_location.GetName] ukázalo ako cenné centrum pre vládcov krajiny [ROOT.GetCountry.GetAltAdjectiveWithNoTooltip('G')], a to aj vďaka svojim spojeniam s [target_country_1.GetAdjective] [target_country_1.GetGovernment.GetCourtTitle].\n\nKeďže vzťahy medzi krajinami [target_country.GetName] a [ROOT.GetCountry.GetNameWithNoTooltip] sú značne napäté, niektorí členovia [ROOT.GetCountry.GetGovernment.GetCourtTitle] naliehali na [our_ruler.GetName], aby požiadal o podporu [ShowCultureName('languedocien')] [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')] v [target_location.GetNameWithNoTooltip]. Iní však navrhli využiť význam [target_location.GetNameWithNoTooltip] na získanie priazne [target_country_1.GetGovernment.GetCourtTitle] krajiny [target_country_1.GetNameWithNoTooltip]." # todo: NEW TRANSLATION # todo: COUNTRY CASE
 flavor_mll.5.a: "Využime naše spojenia so šľachtou [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')] v [target_location.GetNameWithNoTooltip] a získajme si jej podporu." # todo: NEW TRANSLATION
 flavor_mll.5.a.entry: "Využime naše spojenia so šľachtou Montpellieru a získajme si jej podporu." # todo: NEW TRANSLATION
 flavor_mll.5.b: "Namiesto toho sa sústreďme na záležitosti krajiny [ROOT.GetCountry.GetAltAdjectiveWithNoTooltip('G')]." # todo: NEW TRANSLATION # todo: COUNTRY CASE
 flavor_mll.5.c: "Dohodnime sa s krajinou [target_country_1.GetNameWithNoTooltip] na výmene za [target_location.GetNameWithNoTooltip]." # todo: NEW TRANSLATION
 flavor_mll.5.c.entry: "Dohodnime sa s Francúzskom na výmene za Montpellier." # todo: NEW TRANSLATION
 mll_unlock_sale_of_montpellier_decision_tt: "Sprístupní [Concept('decision','rozhodnutie')|e] $mll_exchange_of_montpellier.title$, ktorá ponúkne príležitosť získať diplomatickú páku voči krajine [target_country_1.GetName]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 flavor_mll.6.title: "Obrana oblasti [ShowAreaNameWithNoTooltip('balearics_area')]" # todo: NEW TRANSLATION
 flavor_mll.6.entry: "Obrana oblasti [ShowAreaNameWithNoTooltip('balearics_area')]" # todo: NEW TRANSLATION
 flavor_mll.6.desc: "Hoci sa hliadkam [target_country.GetAdjective] v minulosti darilo zastavovať nájazdy [ShowCultureGroupName('maghrebi_group')] na oblasť [ShowAreaName('balearics_area')], v posledných rokoch tieto nájazdy čoraz viac sužujú [ROOT.GetCountry.GetLongName].\n\nKeďže vzťahy s krajinou [target_country.GetNameWithNoTooltip] sú značne napäté, niektorí členovia [ROOT.GetCountry.GetGovernment.GetCourtTitle] vypracovali plány na výstavbu pobrežných opevnení, ktoré by odrážali nájazdníkov zo skupiny [ShowCultureGroupNameWithNoTooltip('maghrebi_group')] a zároveň sťažili krajine [target_country.GetNameWithNoTooltip] prípadnú inváziu [target_country.GetAdjectiveWithNoTooltip]." # todo: NEW TRANSLATION
 flavor_mll.6.a: "Poskytnime potrebné prostriedky na to, aby bola oblasť [ShowAreaNameWithNoTooltip('balearics_area')] nedobytná." # todo: NEW TRANSLATION
 flavor_mll.6.b: "Toto nákladné podujatie si nemôžeme dovoliť." # todo: NEW TRANSLATION
 mll_area_gains_naval_defensives_tt: "Všetky [Concept('locations','lokality')|e] v oblasti [ShowAreaName('balearics_area')] získajú na 60 rokov modifikátor [ShowModifier('mll_expansion_of_coastal_fortifications')]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 flavor_mll.7.title: "Získavanie podpory v zahraničí" # todo: NEW TRANSLATION
 flavor_mll.7.entry: "$flavor_mll.7.title$" # todo: NEW TRANSLATION
 flavor_mll.7.desc: "Keďže vzťahy medzi krajinou [ROOT.GetCountry.GetAltAdjective('I')] a [target_country.GetLongName] sú nejasnejšie než kedykoľvek predtým, mnohí poradcovia na [ROOT.GetCountry.GetGovernment.GetCourtTitle] naliehali na [our_ruler.GetName], aby sa obrátil na niektorých bývalých rivalov krajiny [target_country.GetNameWithNoTooltip] a získal ich podporu v snahe dosiahnuť skutočnú slobodu od [target_country.GetCapital.GetName]." # todo: NEW TRANSLATION # todo: COUNTRY CASE
 flavor_mll.7.a: "Vyhľadajme podporu krajiny [target_country_2.GetAdjectiveWithNoTooltip]." # todo: NEW TRANSLATION
 flavor_mll.7.a.entry: "Vyhľadajme podporu Kastílčanov." # todo: NEW TRANSLATION
 flavor_mll.7.b: "Vyhľadajme podporu krajiny [target_country_3.GetLongNameWithNoTooltip]." # todo: NEW TRANSLATION
 flavor_mll.7.b.entry: "Vyhľadajme podporu Neapolského kráľovstva." # todo: NEW TRANSLATION
 flavor_mll.7.c: "Obráťme sa na našich starých rivalov v krajine [target_country_4.GetNameWithNoTooltip]." # todo: NEW TRANSLATION
 flavor_mll.7.c.entry: "Obráťme sa na našich starých rivalov v Janove." # todo: NEW TRANSLATION
 flavor_mll.7.d: "Namiesto toho sa musíme spoľahnúť na našu [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')]." # todo: NEW TRANSLATION
 mll_conditions_for_castile_support_tt: "Ak sa [ROOT.GetCountry.GetAltAdjective('A')] v nasledujúcich rokoch podarí dosiahnuť vzťahy na úrovni #G +150#! s krajinou [target_country_2.GetName], získa #G +50#! súhlasu v akomkoľvek hnutí za nezávislosť, ktoré môžeme založiť" # todo: NEW TRANSLATION # todo: COUNTRY CASE
 mll_conditions_for_naples_support_tt: "Ak sa [ROOT.GetCountry.GetAltAdjective('A')] v nasledujúcich rokoch podarí dosiahnuť vzťahy na úrovni #G +120#! s krajinou [target_country_3.GetName], získa #G +50#! súhlasu v akomkoľvek hnutí za nezávislosť, ktoré môžeme založiť" # todo: NEW TRANSLATION # todo: COUNTRY CASE
 mll_conditions_for_genoa_support_tt: "Ak sa [ROOT.GetCountry.GetAltAdjective('A')] v nasledujúcich rokoch podarí dosiahnuť vzťahy na úrovni #G +100#! s krajinou [target_country_4.GetName], získa #G +50#! súhlasu v akomkoľvek hnutí za nezávislosť, ktoré môžeme založiť" # todo: NEW TRANSLATION # todo: COUNTRY CASE
 MLL_PLEDGED_SUPPORT: "Prisľúbená podpora" # todo: NEW TRANSLATION
 flavor_mll.8.title: "Odmietnutie vazalstva" # todo: NEW TRANSLATION
 flavor_mll.8.entry: "Odmietnutie vazalstva voči Aragónu" # todo: NEW TRANSLATION
 flavor_mll.8.desc: "Všetky diplomatické pokusy o dohodu medzi krajinami [ROOT.GetCountry.GetAltAdjective('I')] a [target_country.GetName] zlyhali a diplomati [target_country.GetAdjectiveWithNoTooltip] už nemajú záujem nájsť kompromis s [our_ruler.GetName]. [target_country.GetLongNameWithNoTooltip] pravdepodobne zosnuje plán, ktorým ospravedlní priame zabratie krajiny [ROOT.GetCountry.GetAltAdjectiveWithNoTooltip('G')]." # todo: NEW TRANSLATION # todo: COUNTRY CASE
 flavor_mll.8.a: "Naša trpezlivosť pretiekla!" # todo: NEW TRANSLATION
 mll_ara_will_likely_pursue_subjugation_tt: "[target_country.GetGovernment.GetCourtTitle] krajiny [target_country.GetName] sa pravdepodobne pokúsi priamo zabrať [ROOT.GetCountry.GetName] a dostať ho pod korunu [target_country.GetAdjectiveWithNoTooltip]" # todo: NEW TRANSLATION
 flavor_mll.9.title: "Urovnanie vzťahov" # todo: NEW TRANSLATION
 flavor_mll.9.entry: "Urovnanie vzťahov s Aragónom" # todo: NEW TRANSLATION
 flavor_mll.9.desc: "Vzťahy, ktoré kedysi smerovali ku katastrofe, sa vďaka opatrným rokovaniam medzi diplomatmi [target_country.GetAdjective] a [ROOT.GetCountry.GetAdjective] do veľkej miery napravili. Hoci [target_country.GetNameWithNoTooltip] sa zdráha uznať naše nároky na nezávislú vládu, finančné záväzky voči krajine [target_country.GetNameWithNoTooltip] boli z veľkej časti odpustené. Niektorí členovia [ROOT.GetCountry.GetGovernment.GetCourtTitle] to považujú za víťazstvo [our_ruler.GetNameWithNoTooltip], no blízki spojenci [ROOT.GetCountry.GetGovernment.GetRulerTitle] žiadajú, aby [our_ruler.GetHeShe] hľadal skutočné cesty k nezávislosti od krajiny [target_country.GetNameWithNoTooltip]." # todo: NEW TRANSLATION
 flavor_mll.9.a: "Zatiaľ sme odvrátili krízu." # todo: NEW TRANSLATION
 mll_ara_will_not_pursue_hostile_action_tt: "[target_country.GetName] už nebude usilovať o zabratie krajiny [ROOT.GetCountry.GetAltAdjective('G')] násilnými prostriedkami. [ROOT.GetCountry.GetAltAdjectiveWithNoTooltip('I')] však stále môže slobodne usilovať o vlastnú nezávislosť" # todo: NEW TRANSLATION # todo: COUNTRY CASE
 flavor_mll.10.title: "Povýšenie na miestokráľovstvo" # todo: NEW TRANSLATION
 flavor_mll.10.entry: "Miestokráľovstvo krajiny [ROOT.GetCountry.GetAltAdjectiveWithNoTooltip('G')]" # todo: NEW TRANSLATION # todo: COUNTRY CASE
 flavor_mll.10.desc: "Keďže vzťahy medzi krajinami [target_country.GetName] a [ROOT.GetCountry.GetName] sa do veľkej miery vrátili na predošlú úroveň, [target_country.GetLongNameWithNoTooltip] opäť prejavilo záujem o oblasť [ShowAreaName('balearics_area')]. Keďže hospodárstvo regiónu je stále ochromené minulými nájazdmi [ShowCultureGroupName('maghrebi_group')] a skoršími konfliktmi s krajinou [target_country_1.GetName], [target_country.GetAdjectiveWithNoTooltip] [ROOT.GetCountry.GetGovernment.GetCourtTitle] navrhlo udeliť [ROOT.GetCountry.GetLongNameWithNoTooltip] štatút miestokráľovstva, čím by získalo väčšiu podporu od [target_country.GetAdjectiveWithNoTooltip] [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('crown_estate')]." # todo: NEW TRANSLATION
 flavor_mll.10.a: "Využime nové postavenie miestokráľovstva na posilnenie krajiny [ROOT.GetCountry.GetAltAdjectiveWithNoTooltip('G')]." # todo: NEW TRANSLATION # todo: COUNTRY CASE
 flavor_mll.10.b: "Usilujme sa chrániť záujmy [target_country.GetAdjectiveWithNoTooltip] a [ROOT.GetCountry.GetAdjectiveWithNoTooltip] v oblasti [ShowScriptedGeographyNameWithNoTooltip('mediterranean_sea_geography')]." # todo: NEW TRANSLATION
 flavor_mll.10.b.entry: "Usilujme sa chrániť aragónske a mallorské záujmy v Stredozemnom mori." # todo: NEW TRANSLATION
 flavor_mll.10.c: "Odmietnime ponuku krajiny [target_country.GetNameWithNoTooltip] stať sa miestokráľovstvom." # todo: NEW TRANSLATION
 flavor_mll.10.c.entry: "Odmietnime ponuku Aragónu stať sa miestokráľovstvom." # todo: NEW TRANSLATION
 flavor_mll.11.title: "Pohroma pirátstva z krajiny [source_of_piracy.GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 flavor_mll.11.entry: "Pohroma pirátstva [ShowCultureGroupNameWithNoTooltip('maghrebi_group')]" # todo: NEW TRANSLATION
 flavor_mll.11.desc: "Hoci [ROOT.GetCountry.GetLongName] utrpelo početné nájazdy pirátov z oblasti [ShowRegionName('maghreb_region')], v posledných rokoch boli pre [ROOT.GetCountry.GetGovernment.GetCourtTitle] najničivejší piráti pochádzajúci z krajiny [source_of_piracy.GetName]. Mnohí rozhnevaní členovia [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] žiadali [our_ruler.GetName], aby napadol krajinu [source_of_piracy.GetNameWithNoTooltip] a raz a navždy skoncoval s pirátskou hrozbou." # todo: NEW TRANSLATION
 flavor_mll.11.a: "S pirátmi z krajiny [source_of_piracy.GetNameWithNoTooltip] treba skoncovať." # todo: NEW TRANSLATION
 flavor_mll.11.a.entry: "S pirátmi treba skoncovať." # todo: NEW TRANSLATION
 flavor_mll.11.b: "Piráti budú rýchlo potlačení, iba ak priamo zaberieme državy [source_of_piracy.GetAdjectiveWithNoTooltip]." # todo: NEW TRANSLATION
 flavor_mll.11.b.entry: "Piráti budú rýchlo potlačení, iba ak priamo zaberieme ich državy." # todo: NEW TRANSLATION
 flavor_mll.12.title: "Hradby Alcúdie" # todo: NEW TRANSLATION
 flavor_mll.12.entry: "$flavor_mll.12.title$" # todo: NEW TRANSLATION
 flavor_mll.12.desc: "Alcúdia leží na okraji oblasti [target_location.GetName] a už celé storočie čelí nájazdom z oblasti [ShowRegionName('maghreb_region')]. Pre zraniteľnosť tejto oblasti poveril [GetCharacter('mll_jacme_ii_mallorca').GetName] výstavbou nových hradieb, ktoré mali osadu chrániť pred budúcimi nájazdmi. Hoci hradby ešte nie sú úplne dokončené, doterajšia stavba sa už ukázala ako veľmi účinná. Niektorí členovia [ROOT.GetCountry.GetGovernment.GetCourtTitle] sa preto domnievajú, že [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')] by malo začať nový projekt a podľa podobného návrhu opevniť aj samotné hlavné [target_location.GetRank.GetName] oblasti [target_location.GetNameWithNoTooltip]." # todo: NEW TRANSLATION
 flavor_mll.12.a: "Financujme rozšírenie nového opevnenia, aby chránilo celú oblasť [target_location.GetNameWithNoTooltip]." # todo: NEW TRANSLATION
 flavor_mll.12.a.entry: "Financujme rozšírenie nového opevnenia, aby chránilo celý Manacor." # todo: NEW TRANSLATION
 flavor_mll.12.b: "Prispejme na dokončenie hradieb Alcúdie." # todo: NEW TRANSLATION
 flavor_mll.12.c: "Zrušme všetky ďalšie stavebné projekty v Alcúdii." # todo: NEW TRANSLATION
 flavor_mll.13.title: "Sloboda od krajiny [target_country.GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 flavor_mll.13.entry: "Opätovné vyhlásenie nezávislosti" # todo: NEW TRANSLATION
 flavor_mll.13.desc: "Vďaka úsiliu [our_ruler.GetName] a [ROOT.GetCountry.GetGovernment.GetAdjective] [ROOT.GetCountry.GetGovernment.GetCourtTitle] získalo [ROOT.GetCountry.GetNameWithNoTooltip] konečne skutočnú nezávislosť od [target_country.GetLongName]. [target_country.GetNameWithNoTooltip] bolo donútené uznať odtrhnutie krajiny [ROOT.GetCountry.GetAdjectiveWithNoTooltip], a tak môže [ROOT.GetCountry.GetGovernment.GetAdjective] [ROOT.GetCountry.GetGovernment.GetCourtTitle] obrátiť svoj zrak k [ShowScriptedGeographyName('mediterranean_sea_geography')] bez toho, aby podliehalo rozmarom krajiny [target_country.GetCapital.GetName]." # todo: NEW TRANSLATION
 flavor_mll.13.a: "[ROOT.GetCountry.GetNameWithNoTooltip] si teraz bude určovať vlastnú budúcnosť." # todo: NEW TRANSLATION
 flavor_mll.14.title: "[ShowBuildingTypeNameWithNoTooltip('university')] v [target_location.GetNameWithNoTooltip] podporuje vládu [our_ruler.GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 flavor_mll.14.entry: "Učenci z Montpellieru podporujú našu vládu" # todo: NEW TRANSLATION
 flavor_mll.14.desc: "Hoci [target_location.GetName] zostalo kontinentálnou državou [ROOT.GetCountry.GetAdjectiveWithNoTooltip] [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('crown_estate')], učenci z [ShowBuildingTypeName('university')] v [target_location.GetNameWithNoTooltip] sa ukázali ako oddaní podporovatelia [our_ruler.GetNameWithNoTooltip]. Od prijatia nového [ShowLawNameWithNoTooltip('legal_code_law')] [ShowPolicyName('mll_leges_palatinae')] až po posilnenie [ROOT.GetCountry.GetGovernment.GetAdjective] [ROOT.GetCountry.GetGovernment.GetCourtTitle] — učenci z [target_location.GetNameWithNoTooltip] významne prispeli k upevneniu vlády [our_ruler.GetName]." # todo: NEW TRANSLATION
 flavor_mll.14.a: "Ich podporu vítame!" # todo: NEW TRANSLATION
 flavor_mll.14.b: "Využime ich chválu na ďalšie upevnenie politického postavenia [our_ruler.GetShortNameWithNoTooltip]." # todo: NEW TRANSLATION
 flavor_mll.14.b.entry: "Využime ich chválu na ďalšie upevnenie politického postavenia nášho vládcu." # todo: NEW TRANSLATION
 flavor_mll.15.title: "Obnova obchodného vplyvu [ROOT.GetCountry.GetAdjectiveWithNoTooltip]" # todo: NEW TRANSLATION
 flavor_mll.15.entry: "Obnova mallorského obchodného vplyvu" # todo: NEW TRANSLATION
 flavor_mll.15.desc: "Keďže [ROOT.GetCountry.GetLongName] už nepodlieha rozmarom krajiny [target_country.GetName], mnohí naši obchodníci sa tešia na nezávislé podnikanie v nádeji, že obnovia obchodný vplyv, ktorý [ROOT.GetCountry.GetName] kedysi malo v oblasti [ShowScriptedGeographyName('mediterranean_sea_geography')]. Úpadok vplyvu [ROOT.GetCountry.GetAdjectiveWithNoTooltip] spôsobili najmä minulé konflikty medzi krajinami [target_country_1.GetName] a [target_country.GetNameWithNoTooltip], no novozískaná nezávislosť [ROOT.GetCountry.GetAdjectiveWithNoTooltip] [ROOT.GetCountry.GetFlavorRank] pravdepodobne prinúti obchodníkov v celej oblasti [ShowScriptedGeographyNameWithNoTooltip('mediterranean_sea_geography')] prehodnotiť naše pôsobenie v regióne.\n\nNiektorí členovia [ROOT.GetCountry.GetGovernment.GetCourtTitle] navrhli podporiť obnovenie nášho pôsobenia tým, že [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('burghers_estate')] udelíme ďalšie privilégiá a zrušíme niektoré obmedzenia zavedené počas vlády [target_country.GetAdjectiveWithNoTooltip]. Niektorí sa však obávajú, že posilnenie [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('burghers_estate')] by mohlo priblížiť [ROOT.GetCountry.GetNameWithNoTooltip] k [ShowGovernmentTypeName('republic')] podobným tým v oblasti [ShowRegionName('italy_region')]." # todo: NEW TRANSLATION
 flavor_mll.15.a: "Ponúknime rozsiahle privilégiá [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('burghers_estate')] za ich pomoc." # todo: NEW TRANSLATION
 flavor_mll.15.b: "[ROOT.GetCountry.GetGovernment.GetCourtTitle] sa tejto úlohy ujme samo." # todo: NEW TRANSLATION
 flavor_mll.15.c: "Mali by sme sa viac sústrediť na naše vnútorné záležitosti." # todo: NEW TRANSLATION
 mll_a_hub_of_mediterranean_trade.title: "Centrum obchodu v oblasti [ShowScriptedGeographyNameWithNoTooltip('mediterranean_sea_geography')]" # todo: NEW TRANSLATION
 mll_a_hub_of_mediterranean_trade.desc: "Hoci mnohé zo starých obchodných ciest [GetCountry('MLL').GetAdjective] zanikli v dôsledku niekdajších konfliktov s [GetCountry('ARA').GetAdjective] a [GetCountry('GEN').GetAdjective], novozískaná nezávislosť krajiny [GetCountry('MLL').GetLongNameWithNoTooltip] vytvára príležitosť na obnovenie týchto kedysi výnosných obchodných ciest. Navyše, výhodná poloha [ShowAreaNameWithNoTooltip('balearics_area')] nám dáva šancu stať sa významným hráčom v obchode v oblasti [ShowScriptedGeographyNameWithNoTooltip('mediterranean_sea_geography')]." # todo: NEW TRANSLATION
 mll_a_hub_of_mediterranean_trade.a: "[GetCountry('MLL').GetNameWithNoTooltip] je teraz pripravená ovládnuť [ShowScriptedGeographyNameWithNoTooltip('mediterranean_sea_geography')]." # todo: NEW TRANSLATION
 mll_exchange_of_montpellier.title: "Výmena za [ShowLocationNameWithNoTooltip('montpellier')]" # todo: NEW TRANSLATION
 mll_exchange_of_montpellier.desc: "[ShowLocationNameWithNoTooltip('montpellier')], ktoré [GetCharacter('mll_jacme_ii_mallorca').GetName] odkázal v závete [GetCharacter('ara_jacme_i_arago').GetName], je odvtedy pre krajinu [GetCountry('MLL').GetLongName] kľúčovým územím na pevnine. Rastúce nepriateľstvo medzi krajinami [GetCountry('ARA').GetName] a [GetCountry('MLL').GetNameWithNoTooltip] však [ShowLocationNameWithNoTooltip('montpellier')] nám môže poskytnúť silnú vyjednávaciu páku voči krajine [GetCountry('FRA').GetLongName]." # todo: NEW TRANSLATION
 mll_exchange_of_montpellier.a: "Ponúknime krajine [GetCountry('FRA').GetNameWithNoTooltip] na predaj [ShowLocationNameWithNoTooltip('montpellier')]." # todo: NEW TRANSLATION
 mll_exchange_of_montpellier.b: "Navrhnime výmenu za [ShowLocationNameWithNoTooltip('montpellier')] výmenou za záruky [GetCountry('FRA').GetAdjectiveWithNoTooltip]." # todo: NEW TRANSLATION
 mll_exchange_of_montpellier.c: "[ShowLocationNameWithNoTooltip('montpellier')] musí zostať [GetCountry('MLL').GetAdjectiveWithNoTooltip]!" # todo: NEW TRANSLATION
 mll_french_support_for_montpellier_tt: "[GetCountry('FRA').GetName] získa #G +100#! bodov prijatia od akéhokoľvek hnutia za nezávislosť, ktoré môžeme založiť, na 50 rokov." # todo: NEW TRANSLATION

l_polish:
 flavor_liv.1.title: "[target_government_reform.GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 flavor_liv.1.entry: "$livonian_confederation$" # todo: NEW TRANSLATION
 flavor_liv.1.desc: "Moc [ROOT.GetCountry.GetGovernment.GetRulerTitle] neustále upadá a vplyv [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] a podriadeného [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] je silnejší než kedykoľvek predtým. V takom prípade sa návrh, ktorý bol predtým neprijateľný, stal prijateľným riešením tejto krízy. [target_government_reform.GetName], ako sa nazýva, by zjednotil [ROOT.GetCountry.GetName] a jeho poddaných do konfederácie, udelil by mnohé právomoci rôznym pozemným biskupom a iným vazalským predstaviteľom, ktorí by mali väčšiu právomoc v [ROOT.GetCountry.GetGovernment.GetParliament.GetName] [ROOT.GetCountry.GetNameWithNoTooltip]." # todo: NEW TRANSLATION
 flavor_liv.1.historical_info: "Po bitke pri Ukmerge v roku 1435 zostalo velenie Livónskeho rádu decimované kvôli krutým stratám utrpeným v bitke. Krátko potom bola 4. decembra toho istého roku podpísaná dohoda, ktorá vytvorila Livónsku konfederáciu a udelila rôzne privilégiá biskupom a iným vazalom." # todo: NEW TRANSLATION
 flavor_liv.1.a: "Podľahnúť tlakom." # todo: NEW TRANSLATION
 flavor_liv.1.b: "Prečo si nenájdu iného [ROOT.GetCountry.GetFlavorRank], ktorý by vládol?" # todo: NEW TRANSLATION
 flavor_liv.1.b.entry: "Prečo si nenájdu iné kráľovstvo, ktorému by vládli?" # todo: NEW TRANSLATION
 flavor_liv.2.title: "[target_character.GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 flavor_liv.2.entry: "Balthasar Russow, livónsky kronikár" # todo: NEW TRANSLATION
 flavor_liv.2.desc: "Dochádzajú k nám správy o istom klerikovi menom [target_character.GetName], významnom [target_character.GetWomanMan] mnohých cností. Narodil sa v [target_character.GetBirthLocation.GetName], je [target_character.GetArtistType.GetName] pôvodu [target_character.GetCulture.GetName], ktorý by, popri každodennom kázaní, najlepšie zvládol vytvoriť [ShowWorkOfArtTypeName('chronicle')] o dejinách oblasti [ShowAreaName('baltic_area')]." # todo: CHANGED
 flavor_liv.2.a: "Objednať [ShowWorkOfArtTypeNameWithNoTooltip('chronicle')]." # todo: NEW TRANSLATION
 flavor_liv.2.b: "Nepotrebujeme jeho služby." # todo: CHANGED
 flavor_liv.3.title: "$chronica_provinz_lyfflandt$ je dokončená" # todo: NEW TRANSLATION
 flavor_liv.3.desc: "[ShowWorkOfArtTypeName('chronicle')] od [target_character.GetName] bola konečne publikovaná. [target_work_of_art.GetName], ako sa nazýva, zachytáva históriu oblasti [ShowAreaName('baltic_area')] od vzostupu [GetCountry('LIV').GetLongName] až po jej súčasný stav pod bdelým vplyvom [ROOT.GetCountry.GetName]. Avšak dielo vôbec nie je objektívne voči [ROOT.GetCountry.GetAdjectiveWithNoTooltip] vláde, čím vážne spochybňuje našu legitimitu a dôveru našich [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')], ktoré tieto územia vlastnia." # todo: NEW TRANSLATION
 flavor_liv.3.a: "Takáto kritika je prijateľná." # todo: NEW TRANSLATION
 flavor_liv.3.b: "Vyžeňte ho aj jeho diela!" # todo: CHANGED

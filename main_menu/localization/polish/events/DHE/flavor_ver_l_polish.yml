l_polish:
 VER_benefits_from_winning_the_war: "V [target_war.GetName] bude pre nás dostupná [ShowPeaceTreatyTypeName('scaligeri_victory')] [peace_offer|e]" # todo: NEW TRANSLATION
 ver_remove_antagonism: "[THIS.GetCountry.GetName] bude mať svoj [antagonism|e] z požiadaviek [peace_treaty|e] odstránený voči všetkým [countries|e]" # todo: NEW TRANSLATION
 ver_add_integration_in_every_location: "Každé [owned|e] [location|e] v [ShowScriptedGeographyName('scaligeri_conquests_geography')] získa #G +100.0%#! [integration|e]" # todo: NEW TRANSLATION
 SCALIGER_WAR_NAME: "Scaligerova vojna" # todo: NEW TRANSLATION
 ver_demands_start: "Požadujeme" # todo: NEW TRANSLATION
 ver_demands_end: "ako súčasť mierovej dohody v [target_war.GetName]" # todo: NEW TRANSLATION
 ver_demands_FLO_pescia_demand: "$ver_demands_start$ [ShowLocationName('pescia')] $ver_demands_end$" # todo: NEW TRANSLATION
 ver_demands_FLO_lucca_demand: "$ver_demands_start$ [ShowProvinceDefinitionName('lucca_province')] $ver_demands_end$" # todo: NEW TRANSLATION
 ver_demands_VEN_mestre_demand: "$ver_demands_start$ [ShowLocationName('mestre')] $ver_demands_end$" # todo: NEW TRANSLATION
 ver_demands_VEN_treviso_demand: "$ver_demands_start$ [ShowProvinceDefinitionName('venice_province')] $ver_demands_end$" # todo: NEW TRANSLATION
 ver_demands_MLO_brescia_demand: "$ver_demands_start$ [ShowProvinceDefinitionName('brescia_province')] $ver_demands_end$" # todo: NEW TRANSLATION
 ver_demands_MLO_parma_demand: "$ver_demands_start$ [ShowProvinceDefinitionName('parma_province')] $ver_demands_end$" # todo: NEW TRANSLATION
 ver_effect_depends_on_scope: "Účinky tejto [peace_treaty|e] budú závisieť od voľby v [event|e]" # todo: NEW TRANSLATION
 VER_benefits_for_coalition_members: "Útočníci v [target_war.GetName] dostanú [events|e], aby si uplatnili nároky na rôzne pohraničné územia; obsadzovanie území inými spôsobmi je zakázané" # todo: NEW TRANSLATION
 VER_cannot_take_territory_besides_scripted_peace_deal: "Územie musí byť získané prostredníctvom špeciálnych mierových dohôd, ktoré sa budú sprístupňovať počas Scaligerovej vojny cez [events|e]" # todo: NEW TRANSLATION
 scaligeri_war_historical_info: "Scaligerova vojna začala v polovici roku 1336 v dôsledku napätia medzi Scaligermi a Benátkami. Počiatkom konfliktu bolo veronské inštalovanie reťazí na vyberanie poplatkov, čo priamo ohrozovalo obchod Tichej republiky. Hoci prebehli rokovania na zmiernenie sporu, benátsky senát zatvrdol svoje stanovisko, zastavil vývoz soli a to viedlo padovských Scaligerov k zriadeniu vlastných soľných dielní. Konflikt sa napokon začal 22. júna, keď Florencia a Benátky podpísali dohodu, podľa ktorej prvá pokryje dve tretiny nákladov na vojnu." # todo: NEW TRANSLATION
 flavor_ver.1.title: "[target_war.GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 flavor_ver.1.desc: "Panstvá [target_dynasty.GetName], vybudované krvou a potom nášho drahého [target_character.GetName], sa v posledných rokoch stali cieľom veľkej koalície malých štátikov zo severného [ShowRegionName('italy_region')]. Pôvodne zložená len z [GetCountry('VEN').GetLongName] a [GetCountry('FLO').GetLongName], naša nedávna snaha o mier bola zrazená našimi rozhodcami, ktorí sa rozhodli postaviť na stranu našich nepriateľov. Nič to — aj oni budú tvrdo potrestaní za svoje prehrešky." # todo: NEW TRANSLATION
 flavor_ver.1.historical_info: "$scaligeri_war_historical_info$" # todo: NEW TRANSLATION
 flavor_ver.1.a: "Zahubíme slabých." # todo: NEW TRANSLATION
 flavor_ver.2.title: "[target_war.GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 flavor_ver.2.desc: "Bojujúci rod [target_dynasty.GetName] sa stal terčom veľkej koalície vedenej [anti_scaligeri_leader.GetLongName]. Blížime sa k prelomu v tejto [target_war.GetName], no na úspech potrebujeme pomoc našich nových spojencov. Keď sa [mlo_participant.GetAdjective] [mlo_army.GetName] mobilizuje na hraniciach s [target_ver.GetName], [flo_participant.GetLongName] podporuje vojnu a naše vojsko vedie [target_character.GetName], [target_ver.GetAdjectiveWithNoTooltip] nepriateľ bude čoskoro porazený a [ShowRegionName('italy_region')] sa opäť vráti k pokoju." # todo: NEW TRANSLATION
 flavor_ver.2.historical_info: "$scaligeri_war_historical_info$" # todo: NEW TRANSLATION
 flavor_ver.2.a: "Scaligerov diabol bude vykorenený!" # todo: NEW TRANSLATION
 ver_owner_is_an_defender: "Majiteľ [THIS.GetLocation.GetName] je krajina, ktorá je [defender|e] v [target_war.GetName]" # todo: NEW TRANSLATION
 ver_controller_is_an_attacker: "Kontrolujúcou krajinou [THIS.GetLocation.GetName] je krajina, ktorá je [attacker|e] v [target_war.GetName]" # todo: NEW TRANSLATION
 flavor_ver.3.title: "Naše nároky na [target_province.GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 flavor_ver.3.desc: "V [target_war.GetName] proti [target_dynasty.GetName] v [target_country.GetName] postupujeme hladko. Naše sily nedávno dokázali získať kontrolu nad [target_province.GetName], provinciou v sfére vplyvu [ROOT.GetCountry.GetGovernment.GetRulerOrRegent.GetDynasty.GetName] z [ROOT.GetCountry.GetName]. Možno by sme si mali uplatniť nárok na toto územie, aby naši spojenci v [war_leader.GetName] vedeli, čo od domén [target_dynasty.GetNameWithNoTooltip] požadujeme." # todo: NEW TRANSLATION
 flavor_ver.3.entry: "$MLO_ADJ$ Nároky v Scaligerovej vojne" # todo: NEW TRANSLATION
 flavor_ver.3.a: "Uplatniť nárok." # todo: NEW TRANSLATION
 flavor_ver.3.b: "Čo tak namiesto toho [ShowProvinceDefinitionNameWithNoTooltip('parma_province')]?" # todo: NEW TRANSLATION
 flavor_ver.4.title: "Naše nároky na [target_location.GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 flavor_ver.4.desc: "Svedčíme pádu hegemónie [target_dynasty.GetName] na severe [ShowRegionName('italy_region')] vďaka našim a spojencom snahám. S úspechom vojny si [ROOT.GetCountry.GetLongName], ktorý bol v roku 1336 povinný zaplatiť dve tretiny nákladov, uplatní svoje záujmy v tejto vojne. A naše záujmy? Nehľadáme ďalej než do Scaligerovho [target_country.GetName] — štátu, ktorý dlho vzdoroval pánovaniu [ShowLocationName('florence')]." # todo: NEW TRANSLATION
 flavor_ver.4.entry: "$FLO_ADJ$ Nároky v Scaligerovej vojne" # todo: NEW TRANSLATION
 flavor_ver.4.a: "Uplatniť nárok na [ShowLocationNameWithNoTooltip('pescia')]." # todo: NEW TRANSLATION
 flavor_ver.4.b: "Celé [target_country.GetCapital.GetRank.GetNameWithNoTooltip] patrí nám!" # todo: NEW TRANSLATION
 flavor_ver.4.b.entry: "Celé mesto patrí nám!" # todo: NEW TRANSLATION
 flavor_ver.5.title: "Naše nároky na [target_province.GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 flavor_ver.5.desc: "Vojna sa nevypláca... alebo predsa?\n\nNapriek krvi a námahe začína [target_war.GetName] pomaly konečne sľubovať hmatateľný prospech pre nás. Oficiálnym cieľom tejto vojny môže byť rozbitie štátu [target_dynasty.GetName], no tým sa môžeme zmocniť území, ktoré si oni prisvojili vlastnými krvavými vojnami. Potenciálnou cestou expanzie by mohlo byť [target_location.GetName] a väčšia provincia [target_province.GetName], územia, ktoré kultúrne zapadajú do [ROOT.GetCountry.GetFlavorRank]." # todo: NEW TRANSLATION
 flavor_ver.5.entry: "$VEN_ADJ$ Nároky v Scaligerovej vojne" # todo: NEW TRANSLATION
 flavor_ver.5.a: "[target_location.GetNameWithNoTooltip] bude naše!" # todo: NEW TRANSLATION
 flavor_ver.5.a.entry: "Mestre bude naše!" # todo: NEW TRANSLATION
 flavor_ver.5.b: "[target_province.GetNameWithNoTooltip] bude základňou #italic Terraferma#!." # todo: NEW TRANSLATION
 flavor_ver.5.b.entry: "Veronské Veneto bude základňou #italic Terraferma#!." # todo: NEW TRANSLATION
 flavor_ver.6.title: "Nároky [from_country.GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 flavor_ver.6.desc: "Herold prišiel z [from_country.GetLongName] a informoval nás o ich požiadavkách voči [target_dynasty.GetName] z [war_enemy.GetName]. Radšej by sme mali zvážiť [target_peace_treaty.GetName] pri vyjednávaní mierových podmienok v [target_war.GetName], inak to [from_country.GetAdjectiveWithNoTooltip] poslovia budú považovať za porušený sľub." # todo: NEW TRANSLATION
 flavor_ver.6.a: "V pravý čas vyhovieme ich požiadavkám." # todo: NEW TRANSLATION
 ver_peace_treaty_has_become_available: "[target_peace_treaty.GetName] je k dispozícii v [target_war.GetName]" # todo: NEW TRANSLATION
 flavor_ver.7.title: "Náš triumf" # todo: NEW TRANSLATION
 flavor_ver.7.desc: "Konečne, po rokoch krvavého konfliktu, $SCALIGER_WAR_NAME$ skončila. Dnes sily [ROOT.GetCountry.GetAdjective] triumfujú v [target_location.GetName], lebo naši nepriatelia boli porazení. Táto vojna nebola len bojom o nadvládu nad severným [ShowRegionName('italy_region')] — bola to tiež bitka za česť [target_character.GetName], zakladateľa toho, čo je dnes známe ako [ROOT.GetCountry.GetLongName]. Je to odkaz [target_character.GetHerHis], ktorý sme bránili." # todo: NEW TRANSLATION
 flavor_ver.7.a: "Sláva [target_dynasty.GetNameWithNoTooltip]!" # todo: NEW TRANSLATION
 flavor_ver.8.title: "Víťazstvo ligy" # todo: NEW TRANSLATION
 flavor_ver.8.desc: "Osud agresorov [target_dynasty.GetName] je konečne spečatený — Scaligerov diabol bol porazený a panstvá [target_character.GetName] sú teraz v troskách. Severné [ShowRegionName('italy_region')] už nebude ovládané jediným tyranom. Toto si určite zapamätáme ako jeden z rozhodujúcich momentov v histórii [ROOT.GetCountry.GetName]!" # todo: NEW TRANSLATION
 flavor_ver.8.a: "Konečne!" # todo: NEW TRANSLATION
 flavor_ver.1000.title: "Príbuzný [target_character2.GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 flavor_ver.1000.desc: "Zvrhnutý vládca [target_country.GetName] a príbuzný [target_character2.GetName], [target_character.GetName], zostáva v pozícii moci v [target_country.GetCapital.GetRankAndName] ako vikár. Hoci je nominálne verný [target_dynasty.GetName], [target_character.GetShortNameWithNoTooltip] zostáva populárny vo svojej bývalej doméne a určite je rozhorčený nad prehreškami Scaligerov voči [target_character.GetDynasty.GetName]. Taktiež vieme o [target_character.GetHerHis] slabosti pre nášho drahého [target_character2.GetShortNameWithNoTooltip], kondotiéra v našich službách. Ak by sme obliehali [target_character.GetHerHis] [target_country.GetCapital.GetRank.GetName], [target_character.GetSheHe] by určite defektoval." # todo: NEW TRANSLATION
 flavor_ver.1000.a: "Rozkošne diabolské..." # todo: NEW TRANSLATION
 ver_padua_incident_rules: "Ak bude [ShowLocationName('padova')] obsadená pred #W 1339.1.1#!, [target_country.GetName] zmení stranu v [target_war.GetName] a získa nezávislosť" # todo: NEW TRANSLATION
 flavor_ver.1001.title: "Možná zrada?" # todo: NEW TRANSLATION
 flavor_ver.1001.desc: "Naši špióni v [target_location.GetName] hlásia možné nepriateľské rokovania prebiehajúce priamo pod nosom: Niekto v [target_country.GetLongName] si vymieňa listy s našimi protivníkmi v [target_war.GetName]. Zdá sa, že už nemôžeme byť dlhodobo istí vernosťou [target_country.GetAdjective]. Medzitým sme vyslali agentov, aby našli páchateľa — či ho nájdu včas, zostáva otázne." # todo: NEW TRANSLATION
 flavor_ver.1001.desc_pad: "Naši špióni v našom hlavnom meste hlásia možné nepriateľské rokovania prebiehajúce priamo pod nosom: Niekto si vymieňa listy s našimi protivníkmi v [target_war.GetName]. Ak sa nič neurobí, [target_location.GetName] by mohol byť ohrozený útokom zvnútra! Medzitým sme vyslali agentov, aby našli páchateľa — či ho nájdu včas, zostáva otázne." # todo: NEW TRANSLATION
 flavor_ver.1001.a: "Musíme vykoreniť zradu!" # todo: NEW TRANSLATION
 flavor_ver.1002.title: "Sprisahanca odhalili!" # todo: NEW TRANSLATION
 flavor_ver.1002.entry: "$flavor_ver.1002.title$" # todo: NEW TRANSLATION
 flavor_ver.1002.desc: "[target_character.GetName] bol privlečený pred [target_character2.GetName] a obvinený zo sprisahania s nepriateľmi [target_dynasty.GetName]. Mesiace [target_character.GetShortNameWithNoTooltip] vymieňal listy s našimi nepriateľmi v [target_war.GetName]. Dôvodom všetkého je zášť vyplývajúca z [target_character.GetHerHis] zosadenia pred dekádou." # todo: NEW TRANSLATION
 flavor_ver.1002.a: "Smrť!" # todo: NEW TRANSLATION
 flavor_ver.1003.title: "Brány otvorené!" # todo: NEW TRANSLATION
 flavor_ver.1003.desc: "V posledných okamihoch obliehania [target_character.GetName], náš spojenec v [target_location.GetName], prikázal posádke odraziť rozptýlený útok pri jednej bráne, zatiaľ čo druhú bránu otvoril pre nás. Miesto bolo dobrané a [target_character.GetNameWithNoTooltip] bol vyhlásený za vládcu [target_country.GetName], ku veľkej sláve miestneho [target_estate.GetName]. Toto predstavuje významný obrat v [target_war.GetName], pretože [target_dynasty.GetName] práve stratil jednu zo svojich cenných domén." # todo: NEW TRANSLATION
 flavor_ver.1003.a: "Takto ďalej k ďalším víťazstvám!" # todo: NEW TRANSLATION
 flavor_ver.1004.title: "Posledné záchvevy nášho spojenca" # todo: NEW TRANSLATION
 flavor_ver.1004.desc: "Dostali sme strašné správy! Náš spojenec [target_character.GetName] v [target_country.GetName], jeho bývalý vládca, bol [target_dynasty.GetName] odhalený ako tajne s nami kolaborujúci. [target_character.GetShortNameWithNoTooltip] bol násilne zajatý [target_country2.GetAdjective] vojakmi a predvedený pred [target_character2.GetName], kde mu bola patrične vynesená trest smrti." # todo: NEW TRANSLATION
 flavor_ver.1004.a: "Stratili sme veľkého spojenca." # todo: NEW TRANSLATION
 flavor_ver.1005.title: "Pád [ShowLocationNameWithNoTooltip('padova')]" # todo: NEW TRANSLATION
 flavor_ver.1005.desc: "Sprisahanecká postava v [target_country.GetName] sa ukázala byť [target_character.GetName] od začiatku! Tento muž, ktorého [target_character2.GetName] zvrhol pred približne desiatimi rokmi, napriek svojmu vikariátu dlho nosil zášť voči [target_dynasty.GetName]. Teraz sa mu konečne podarilo vykonať svoju pomstu, keď odovzdal [target_location.GetRank.GetName] našim nepriateľom a prevzal kontrolu nad [target_country.GetNameWithNoTooltip]." # todo: NEW TRANSLATION
 flavor_ver.1005.a: "S [target_country.GetNameWithNoTooltip] alebo bez neho, zvíťazíme." # todo: NEW TRANSLATION
 ver_will_join_target_war: "[THIS.GetCountry.GetName] sa pridá na stranu útočníkov v [target_war.GetName]" # todo: NEW TRANSLATION

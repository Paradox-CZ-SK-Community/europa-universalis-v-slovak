l_polish:
 flavor_sale_of_lusatia.1000.title: "Záloha [GetCountry('SOR').GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 flavor_sale_of_lusatia.1000.entry: "Obnoviť lužický sľub" # todo: NEW TRANSLATION
 flavor_sale_of_lusatia.1000.desc: "The [GetCountry('SOR').GetLongName], ktoré sme nadobudli dedičstvom po smrti [GetCharacter('bra_heinrich_ii_askanier').GetName], nemá veľkú hodnotu pre [target_ruler.GetName] a [target_ruler.GetHerHis] ambície v [ROOT.GetCountry.GetCapital.GetName]. Predtým sme uzavreli dohodu s [GetCountry('MEI').GetLongName], pričom sme im zaviazali práva k [GetCountry('SOR').GetNameWithNoTooltip]. Keď cudzie veľmoci pozerajú na [GetCountry('SOR').GetNameWithNoTooltip] ako na cestu k vlastnému rozšíreniu, mohlo by byť výhodnejšie túto dohodu obnoviť a získať z nej teraz peniaze namiesto toho, aby sme boli viazaní bremenom jej obrany pred zahraničnou agresiou." # todo: RETRANSLATED ENGLISH
 flavor_sale_of_lusatia.1000.a: "Pošlite diplomata do [GetCountry('MEI').GetCapital.GetNameWithNoTooltip]!" # todo: NEW TRANSLATION
 flavor_sale_of_lusatia.1000.a.entry: "Pošlite diplomata do hlavného mesta!" # todo: NEW TRANSLATION
 flavor_sale_of_lusatia.1000.a.tt: "[GetCountry('MEI').GetName] bude schopné odkúpiť [GetCountry('SOR').GetName] za značnú sumu peňazí, pričom presunie vzťah [subject|e] na nich na 10 rokov. Avšak [target_ruler.GetName] zostane [ruler|e] [GetCountry('SOR').GetNameWithNoTooltip]." # todo: NEW TRANSLATION
 flavor_sale_of_lusatia.1000.b: "Nemôžeme sa s ňou rozlúčiť, ani dočasne." # todo: NEW TRANSLATION
 flavor_sale_of_lusatia.1000.historical_info: "Markgrófstvo Lužica bolo v roku 1353 zastavené Markgrófstvu Meißen, obnovujúc starú zálohu z roku 1323. Záloha bola dohodnutá na 10 rokov, dávala Meißen prístup k výnosom Lužice, zatiaľ čo Wittelsbachovia zostali nominálnymi vládcami." # todo: NEW TRANSLATION
 flavor_sale_of_lusatia.1001.desc: "The [GetCountry('BRA').GetLongName] nám ponúkol obnovenie starej zálohy [GetCountry('SOR').GetName] na desať rokov. Hoci požadujú značnú platbu, mohlo by to byť výborná príležitosť získať väčší vplyv v starých zemiach [target_ruler_meissen.GetDynasty.GetName]." # todo: RETRANSLATED ENGLISH
 flavor_sale_of_lusatia.1001.a: "[ROOT.GetCountry.Custom('common_string_positive')]" # todo: CHANGED
 flavor_sale_of_lusatia.1001.a.entry: "$common_string_brilliant$" # todo: NEW TRANSLATION
 flavor_sale_of_lusatia.1001.b: "Tohoto územia nepotrebujeme." # todo: NEW TRANSLATION
 flavor_sale_of_lusatia.1100.title: "Záležitosť [GetCountry('SOR').GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 flavor_sale_of_lusatia.1100.entry: "Obnoviť lužický sľub" # todo: NEW TRANSLATION
 flavor_sale_of_lusatia.1100.desc_normal: "The [GetCountry('SOR').GetLongName] by sa teraz mal vrátiť späť pod našu vládu, keďže záloha sa skončila.\n\nNapriek tomu zostáva vlastníctvom, ktoré nám poskytuje malú hodnotu, a predaj týchto zemí by nám mohol dať potrebné finančné prostriedky na dôležitejšie záležitosti. Môžeme preskúmať možnosť predať titul úplne, čím by sme sa zbavili týchto problémových území. Istotne by mnoho záujemcov chcelo získať [GetCountry('SOR').GetName] a naše dobré vzťahy s [target_buyer.GetName] z nich robia dôveryhodnú možnosť." # todo: RETRANSLATED ENGLISH
 flavor_sale_of_lusatia.1100.desc_fallback: "Záloha [GetCountry('SOR').GetName] uplynula, no bohužiaľ už nie je v držbe zahraničných hlupákov. Teraz máme málo právnych možností, ako tieto zemie získať späť." # todo: RETRANSLATED ENGLISH
 flavor_sale_of_lusatia.1100.a: "Oslovte [target_buyer.GetNameWithNoTooltip] s ponukou." # todo: CHANGED
 flavor_sale_of_lusatia.1100.a.entry: "Obráťte sa na kupca s ponukou." # todo: NEW TRANSLATION
 flavor_sale_of_lusatia.1100.b: "Už nás nebaví predávať územia." # todo: NEW TRANSLATION
 flavor_sale_of_lusatia.1100.c: "Získame naše zákonné územie späť!" # todo: NEW TRANSLATION
 flavor_sale_of_lusatia.1100.d: "Možno omyl úsudku." # todo: NEW TRANSLATION
 flavor_sale_of_lusatia.1100.historical_info: "Po uplynutí zálohy z roku 1353 predal Otto von Wittelsbach titul a územia markgrófstva Lužica Korune Čiech, ktorá ponuku prijala. Lužica vstúpila do domínium Čiech a opätovne zjednotila Hornú a Dolnú Lužicu pod jednou vládou." # todo: NEW TRANSLATION
 flavor_sale_of_lusatia.1101.desc: "S koncom zálohy [GetCountry('SOR').GetName] u [GetCountry('MEI').GetName] sa [GetCountry('BRA').GetName] rozhodla ponúknuť nám úplný odkup [GetCountry('SOR').GetLongNameWithNoTooltip]. Hoci je cena určite vysoká, mohlo by to byť pre nás výnosné investovanie." # todo: RETRANSLATED ENGLISH
 flavor_sale_of_lusatia.1101.a: "Prijímame to!" # todo: NEW TRANSLATION
 flavor_sale_of_lusatia.1101.b: "To vyzerá ako zlá investícia." # todo: NEW TRANSLATION
 flavor_sale_of_lusatia.1102.title: "Ponuka zamietnutá" # todo: NEW TRANSLATION
 flavor_sale_of_lusatia.1102.desc: "[target_buyer.GetName] odmietol našu ponuku! [GetCountry('SOR').GetName] sa vráti pod našu vládu, ako bolo uvedené v pôvodnej zálohe, a opäť nám bude platiť vazalské poplatky." # todo: RETRANSLATED ENGLISH
 flavor_sale_of_lusatia.1102.a: "[ROOT.GetCountry.Custom('common_string_ok')]" # todo: NEW TRANSLATION
 flavor_sale_of_lusatia.1102.a.entry: "$common_string_alright$" # todo: NEW TRANSLATION

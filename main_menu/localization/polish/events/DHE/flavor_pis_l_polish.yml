l_polish:
 flavor_pis.1.entry: "$flavor_pis.1.title$" # todo: NEW TRANSLATION
 flavor_pis.1.title: "Úpadok [ROOT.GetCountry.GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 flavor_pis.1.desc: "Bývalé slávne [ROOT.GetCountry.GetLongName] už nie je obrom, akým kedysi bola v [ShowRegionName('italy_region')]. Jeho vplyv siahal od [ShowRegionName('iberia_region')] až po [ShowRegionName('crescent_region')], ale [GetCountry('GEN').GetAdjective] flotila niekoľko rokov blokovala náš vzácny [ShowBuildingTypeName('porto_pisano')] v [ShowLocationName('pisa')], čo viedlo k jeho úpadku. Ako keby toho nebolo dosť, [GetCountry('ARA').GetAdjective] armády nám vyrvali [ShowAreaName('sardinia_area')].\n\nTo zanechalo [ROOT.GetCountry.GetFlavorRank] v oslabenom stave. Naša mocná flotila je teraz iba tieňom svojej bývalej slávy, zatiaľ čo nás na tomto fronte prekonávajú ostatné [ShowCultureGroupName('italian_group')] štáty. Náš obchodný vplyv je postupne vytláčaný spoľahlivejšími rivalmi a [ROOT.GetCountry.GetFlavorRank] je uväznený v politickej dekadencii.\n\nNamiesto toho, aby sme len sedeli a nechali dejiny plynúť, by sme sa mali sústrediť na obnovu a zhromažďovať čo najviac sily, aby sme sa pomstili tým, ktorí za našu súčasnú situáciu zodpovedajú." # todo: NEW TRANSLATION
 flavor_pis.1.a: "Pokiaľ bude vládnuť [target_character.GetNameWithNoTooltip], nezaváhame!" # todo: NEW TRANSLATION
 flavor_pis.1.a.entry: "Nezaváhame!" # todo: NEW TRANSLATION
 flavor_pis.2.title: "Pád [target.GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 flavor_pis.2.desc: "Armády [ROOT.GetCountry.GetName] opäť vyšli víťazne a zajali [target.GetRank.GetName] [target.GetName]. Nezabúdajúc na spustošenie pôdy v [ShowLocationName('pisa')] a blokádu, ktorá tam obyvateľstvo priviedla k hladovaniu, sa vojská spolu s ich veliteľom pripravujú vyrovnať [target.GetRank.GetNameWithNoTooltip] so zemou, posoliť jeho pôdu a priniesť bohatstvo späť do našej metropoly." # todo: NEW TRANSLATION
 flavor_pis.2.a: "Oko za oko!" # todo: NEW TRANSLATION
 flavor_pis.2.b: "Nie je potrebné to miesto zničiť." # todo: NEW TRANSLATION
 pis_allow_upgrade_of_porto_pisano: "Budovu [ShowBuildingTypeName('porto_pisano')] v [ShowLocationName('pisa')] je možné vylepšiť o jednu úroveň navyše" # todo: NEW TRANSLATION
 flavor_pis.3.entry: "$flavor_pis.3.title$" # todo: NEW TRANSLATION
 flavor_pis.3.title: "Znovuzískanie [ShowAreaNameWithNoTooltip('sardinia_area')]" # todo: NEW TRANSLATION
 flavor_pis.3.desc: "Naše sily konečne znovu obsadili [ShowAreaName('sardinia_area')]!\n\nMnoho vojakov, členov [ROOT.GetCountry.GetGovernment.GetCourtTitle] a [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')] oslavovalo toto víťazstvo a sú pripravení znovu tam nadviazať svoj vplyv. Hoci sú roztrúsení po celom kraji, mnohí začali presúvať sa do [target_location.GetName], pričom ho ustanovujú za hlavné mesto oblasti.\n\nTo viedlo k mnohým návrhom na rozšírenie [target_location.GetRank.GetName], aby sa zabezpečil úspech osadníkov, ktorí by chceli priniesť bohatstvo späť do [ShowBuildingTypeName('porto_pisano')]. Avšak niektorí veria, že náš vplyv by nemal byť sústredený na jednom mieste a že celému ostrovu je potrebná pomoc." # todo: NEW TRANSLATION
 flavor_pis.3.a: "[target_location.GetNameWithNoTooltip] bude perlou [ShowAreaNameWithNoTooltip('sardinia_area')]." # todo: NEW TRANSLATION
 flavor_pis.3.a.entry: "Toto miesto bude perlou [ShowAreaNameWithNoTooltip('sardinia_area')]." # todo: NEW TRANSLATION
 flavor_pis.3.b: "Zabezpečme prosperitu celého ostrova." # todo: NEW TRANSLATION
 pis_all_of_sardinia_gains_development_and_prosperity: "Každé [Concept('location','lokalita')|e] v [ShowAreaName('sardinia_area')], ktoré vlastníme, získa [ShowNamedValue('development_mild_bonus')|+=2%] [Concept('development','rozvoj')|e] a [ShowNamedValue('prosperity_mild_bonus')|+=2%] [Concept('prosperity','prosperita')|e]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 flavor_pis.4.entry: "$flavor_pis.4.title$" # todo: NEW TRANSLATION
 flavor_pis.4.title: "Rozšírenie [ShowWorkOfArtNameWithNoTooltip('leaning_tower_of_pisa')]" # todo: NEW TRANSLATION
 flavor_pis.4.desc: "[ShowWorkOfArtName('leaning_tower_of_pisa')] je dokončený, ale v [ROOT.GetCountry.GetGovernment.GetCourtTitle] je mnoho tých, ktorí si prajú rozšíriť jej interiér.\n\n[target_character.GetName] chce použiť gotické prvky pre zvonicu, spájajúc ich s románskym štýlom, ktorý veža už má. Takáto práca nie je zadarmo, ako dobre vie [ROOT.GetCountry.GetFlavorRank], ale je to niečo, čo by nám pomohlo posilniť našu prestíž v [ShowRegionName('italy_region')]." # todo: NEW TRANSLATION
 flavor_pis.4.a: "Rozšírme vežu." # todo: NEW TRANSLATION
 flavor_pis.4.b: "Je už dokončená; ďalšie zmeny nie sú potrebné." # todo: NEW TRANSLATION
 flavor_pis.5.entry: "$flavor_pis.5.title$" # todo: NEW TRANSLATION
 flavor_pis.5.title: "Zmena zamerania" # todo: NEW TRANSLATION
 flavor_pis.5.desc: "Hoci ambícia získať späť našu bývalú slávu v Stredozemí pomaly vyprcháva, priniesla nám nové nápady, ako obnoviť náš vplyv v [ShowRegionName('italy_region')]. Namiesto spoliehania sa na obchodníkov a námorníkov sa navrhuje začať využívať naše bohatstvo na vojenské ťaženia, najímať početných condottieri a rozkazovať im, aby dobyli susedné mestá.\n\nTakéto nápady nie sú populárne medzi skúsenejšími, ktorí uprednostňujú plán obnoviť [ShowBuildingTypeName('porto_pisano')], ale tí, ktorí chcú dokázať svoju hodnotu, sa prikláňajú k expanzívnej politike, až kým neprekonáme konkurenčné mestské štáty." # todo: NEW TRANSLATION
 flavor_pis.5.a: "Poďme dobyť!" # todo: NEW TRANSLATION
 flavor_pis.5.b: "Načo vojna? Obchod nám prinesie moc." # todo: NEW TRANSLATION
 pis_gain_casus_belli_on_every_neighbor_country_in_italy: "Ak ešte nemáme [Concept('casus_belli','casus Belli')|e], získame [ShowCasusBelliName('cb_conquer_province')] [Concept('casus_belli','casus Belli')|e] na každom susednom [Concept('country','krajinu')|e] [Concept('capital','hlavné mesto')|e] [Concept('province','provinciu')|e]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 flavor_pis.6.title: "Gioco del Ponte" # todo: NEW TRANSLATION
 flavor_pis.6.desc.a: "Nedávny festival Gioco del Ponte v [ShowLocationName('pisa')] viedol k vzostupu sľubného [target_character.GetWomanMan]. V ťahaní lanom, ktoré sa v ten deň konalo, [target_character.GetName] prejavil veľké vodcovstvo, velil vojakom, aby tlačili voz na moste Ponte di Mezzo. To prinieslo [target_character.GetHerHim] rešpekt medzi ľudom, možno si myslia, že [target_character.GetSheHe] má predpoklady pravého vodcu." # todo: NEW TRANSLATION
 flavor_pis.6.desc.b: "[ShowLocationName('pisa')] nedávno hostila Gioco del Ponte a miestne obyvateľstvo si príležitosť užívalo. Pochod pozdĺž rieky Arno prilákal mnohých občanov z rôznych vrstiev spoločnosti, aby sa zúčastnili, čo posilnilo jednotu obyvateľov [ROOT.GetCountry.GetName] — najmä medzi najvplyvnejšími, ktorí odložili svoje rozdiely, aby si užili túto každoročnú tradíciu." # todo: NEW TRANSLATION
 flavor_pis.6.desc.c: "Mnoho ľudí z celého [ShowContinentName('europe')] sa zišlo v [ShowLocationName('pisa')] na festival Gioco del Ponte. Boli nadšení predstavením sprievodu pozdĺž rieky Arno a tí s vojenskými skúsenosťami sa pridali k ťahaní lanom, aby priniesli víťazstvo svojej strane. Aj keď niektorí len sledovali slávnosti, odniesli si správy domov o tejto radostnej skúsenosti, ktorú [ROOT.GetCountry.GetName] každoročne organizuje." # todo: NEW TRANSLATION
 flavor_pis.6.a: "Aj keď dočasné, užime si túto stabilitu." # todo: NEW TRANSLATION
 flavor_pis.6.b: "Príbehy o festivale sa roznesú do každého kúta." # todo: NEW TRANSLATION
 flavor_pis.6.c: "Povýšme [target_character.GetNameWithNoTooltip]." # todo: NEW TRANSLATION
 flavor_pis.6.c.entry: "Povýšme túto postavu." # todo: NEW TRANSLATION
 flavor_pis.6.d: "Nedovolíme, aby hocikto slúžil [ROOT.GetCountry.GetAdjectiveWithNoTooltip] [ROOT.GetCountry.GetGovernment.GetCourtTitle]." # todo: NEW TRANSLATION
 flavor_pis.6.d.entry: "Nedovolíme, aby hocikto slúžil krajine." # todo: NEW TRANSLATION
 flavor_pis.1000.entry: "$flavor_pis.1000.title$" # todo: NEW TRANSLATION
 flavor_pis.1000.title: "Nové vedenie" # todo: NEW TRANSLATION
 flavor_pis.1000.desc: "Krajinu [ROOT.GetCountry.GetName] postihla kríza.\n\nRozšírené dlhy, ekonomický prepad a nestabilita prinútili mnohých spochybniť autoritu [target_character.GetName], ktorý vedie krehkú vládu v zúfalej potrebe zahraničnej podpory. Namiesto toho, aby to všetko nechali zrútiť, sa bohatí a vplyvní zišli, aby našli nového kandidáta, ktorý by vládol [ROOT.GetCountry.GetFlavorRank]. Niektorí navrhli [target_country.GetGovernment.GetRuler.GetDynasty.GetName] z [target_country.GetName] v nádeji, že nás budú môcť ekonomicky podporiť. Iní preferujú [target_country2.GetGovernment.GetRuler.GetDynasty.GetName] z [target_country2.GetName], a ďalší tvrdia, že [target_country3.GetGovernment.GetRuler.GetDynasty.GetName] z [target_country3.GetName] je lepšou voľbou — a že by sme boli blázni, keby sme ich nepozvali, aby sa stali našimi novými vládcami." # todo: NEW TRANSLATION
 flavor_pis.1000.a: "Pošlime list do [target_country.GetNameWithNoTooltip]." # todo: NEW TRANSLATION
 flavor_pis.1000.a.entry: "Pošlime im list." # todo: NEW TRANSLATION
 pis_offer_rulership_to_country1: "Ponúkneme vládu [target_country.GetName]. Ak prijmú, stane sa nasledovné:" # todo: NEW TRANSLATION
 pis_a_member_of_target_country_dynasty_becomes_ruler: "Člen [target_country.GetGovernment.GetRuler.GetDynasty.GetName] [Concept('dynasty','dynastia')|e] sa stane naším [Concept('ruler','panovníkom')|e]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 flavor_pis.1000.b: "Najlepšie bude, ak si vyberieme [target_country2.GetNameWithNoTooltip]." # todo: NEW TRANSLATION
 flavor_pis.1000.b.entry: "Najlepšie bude, ak si vyberieme inú krajinu." # todo: NEW TRANSLATION
 pis_offer_rulership_to_country2: "Ponúkneme vládu [target_country2.GetName]. Ak prijmú, stane sa nasledovné:" # todo: NEW TRANSLATION
 pis_a_member_of_target_country2_dynasty_becomes_ruler: "Člen [target_country2.GetGovernment.GetRuler.GetDynasty.GetName] [Concept('dynasty','dynastia')|e] sa stane naším [Concept('ruler','panovníkom')|e]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 flavor_pis.1000.c: "Vládci [target_country3.GetNameWithNoTooltip] sú najvhodnejší." # todo: NEW TRANSLATION
 flavor_pis.1000.c.entry: "Vládci tejto alternatívy sú najvhodnejší." # todo: NEW TRANSLATION
 pis_offer_rulership_to_country3: "Ponúkneme vládu [target_country3.GetName]. Ak prijmú, stane sa nasledovné:" # todo: NEW TRANSLATION
 pis_a_member_of_target_country3_dynasty_becomes_ruler: "Člen [target_country3.GetGovernment.GetRuler.GetDynasty.GetName] [Concept('dynasty','dynastia')|e] sa stane naším [Concept('ruler','panovníkom')|e]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 flavor_pis.1000.d: "Nebudeme predávať naše [ROOT.GetCountry.GetFlavorRank] našim rivalom." # todo: NEW TRANSLATION
 flavor_pis.1001.title: "$flavor_pis.1000.title$" # todo: NEW TRANSLATION
 flavor_pis.1001.desc: "[target_character.GetName] z [from_country.GetName] nám poslal delegáciu. [target_character.GetHerHis|U] delegáti ospevujú vzdelávanie v [ShowLocationName('pisa')] a mnohých ľudí v [from_country.GetFlavorRank], ktorí túžia stať sa učencami. V tomto duchu prichádzajú s prosbou — udelením pečate uznania od [ROOT.GetCountry.GetName], ktorá by autorizovala založenie formálnej vzdelávacej inštitúcie v ich [from_country.GetFlavorRank]." # todo: NEW TRANSLATION
 flavor_pis.1001.a: "Skvelý spôsob, ako rozšíriť vplyv [ROOT.GetCountry.GetGovernment.GetRuler.GetDynasty.GetNameWithNoTooltip]." # todo: NEW TRANSLATION
 flavor_pis.1001.a.entry: "Skvelý spôsob, ako rozšíriť náš vplyv." # todo: NEW TRANSLATION
 flavor_pis.1001.b: "Takéto spojenia by nám len uškodili." # todo: NEW TRANSLATION
 flavor_pis.1100.entry: "$flavor_pis.1100.title$" # todo: NEW TRANSLATION
 flavor_pis.1100.title: "In Supremae Dignitatis" # todo: NEW TRANSLATION
 flavor_pis.1100.desc: "Učenci z [ShowLocationName('pisa')] sú známi po celom [ShowRegionName('italy_region')], napriek tomu [ROOT.GetCountry.GetName] postráda formálne uznanú inštitúciu vzdelávania. [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] navrhli, aby [target_character.GetName] požiadal [target_character2.GetName], aby bol [ShowLocationNameWithNoTooltip('pisa')] formálne uznaný ako Studium Generale, čo by umožnilo rozkvitnúť autonómnym akademickým inštitúciám." # todo: NEW TRANSLATION
 flavor_pis.1100.a: "Pošlime delegáciu do [GetCountry('PAP').GetCapital.GetNameWithNoTooltip]." # todo: NEW TRANSLATION
 flavor_pis.1100.a.entry: "Pošlime delegáciu do $PAP$." # todo: NEW TRANSLATION
 flavor_pis.1100.b: "Nemusíme sa angažovať v nijakej [GetCountry('PAP').GetAdjectiveWithNoTooltip] politike." # todo: NEW TRANSLATION
 flavor_pis.1100.b.entry: "Nemusíme sa angažovať v nijakej $PAP_ADJ$ politike." # todo: NEW TRANSLATION
 flavor_pis.1101.title: "$flavor_pis.1100.title$" # todo: NEW TRANSLATION
 flavor_pis.1101.desc: "[target_character.GetName] z [from_country.GetName] nám poslal delegáciu. [target_character.GetHerHis|U] delegáti ospevujú vzdelávanie v [ShowLocationName('pisa')] a mnohých ľudí v [from_country.GetFlavorRank], ktorí túžia stať sa učencami. V tomto zmysle prichádzajú s prosbou — udelením pečate uznania od [ROOT.GetCountry.GetName], ktorá by oprávnila zriadenie formálnej vzdelávacej inštitúcie v ich [from_country.GetFlavorRank]." # todo: NEW TRANSLATION
 flavor_pis.1101.a: "Majú náš súhlas." # todo: NEW TRANSLATION
 flavor_pis.1101.b: "V [ShowRegionNameWithNoTooltip('italy_region')] je veľa miest, kde sa dá študovať." # todo: NEW TRANSLATION

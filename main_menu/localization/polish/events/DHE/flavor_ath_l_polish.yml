l_polish:
 flavor_ath.1.title: "Nedávne [target_country.GetAdjectiveWithNoTooltip] nájazdy" # todo: NEW TRANSLATION
 flavor_ath.1.entry: "Nedávne aydinidské nájazdy" # todo: NEW TRANSLATION
 flavor_ath.1.desc: "Naše země pri pobreží [ShowAreaName('aegean_sea_area')] v posledných rokoch utrpeli mnoho ničivých nájazdov zo strany [target_country.GetAdjective] Turkov. Keďže tieto nájazdy vykonával [target_character.GetName], mysleli sme si, že jeho šťastná smrť nám prinesie úľavu; napriek tomu nedávny nájazd jeho nástupcu v [ShowAreaName('thrace_area')] nedáva žiadnu pochybnosť o jeho úmysloch — [target_character2.GetName] sa vráti do [ShowScriptedGeographyName('greece_geography')], aby znova lúpil. Musíme sa s touto hrozbou vysporiadať skôr, než v našich mestách zasie viac utrpenia — protinájazd alebo [GetInternationalOrganizationType('crusade').GetName] by boli na mieste." # todo: NEW TRANSLATION
 flavor_ath.1.a: "Odplaťme im tou istou mincou!" # todo: NEW TRANSLATION
 flavor_ath.2.title: "Náhla smrť [scope_ruler.GetShortNameWithNoTooltip]" # todo: NEW TRANSLATION
 flavor_ath.2.entry: "Náhla smrť vojvodu Guillem II" # todo: NEW TRANSLATION
 flavor_ath.2.desc: "Tragédia! Po tom, čo ochorel náhle na chorobu, bol [scope_ruler.GetName] vyhlásený za mŕtveho a [regent_of_athens.GetName] ustanovil dočasnú regenciu, kým sa vybavujú záležitosti týkajúce sa následníctva. Hoci [scope_ruler.GetShortNameWithNoTooltip] určil [scope_heir.GetName] za svojho nástupcu, [scope_heir.GetHeShe] sa momentálne nachádza v [sic_country.GetName], čo znamená, že potrvá nejaký čas, kým [scope_ruler.GetHeShe] dorazí.\n\nS prichádzajúcou mocenskou medzerou nad [ROOT.GetCountry.GetName] niektorí v [ROOT.GetCountry.GetGovernment.GetCourtTitle], ktorí majú výhrady voči [ShowCultureName('catalan')] Spoločnosti, naliehajú na [regent_of_athens.GetShortNameWithNoTooltip], aby pozval [arg_ruler.GetName] vládnuť [ROOT.GetCountry.GetNameWithNoTooltip] namiesto toho, vidúc v tom príležitosť obnoviť vládu [arg_ruler.GetDynasty.GetName] nad [ROOT.GetCountry.GetNameWithNoTooltip]. Avšak takéto konanie by bolo vnímané ako čin vzbury, čo môže viesť k tomu, že [sic_country.GetNameWithNoTooltip] utlmí autonómiu [ROOT.GetCountry.GetFlavorRank]. Tiež by bolo potrebné presvedčiť [ShowCultureNameWithNoTooltip('catalan')] Spoločnosť, aby akceptovala prevzatie [arg_ruler.GetShortNameWithNoTooltip], ak by sa [arg_ruler.GetHeShe] rozhodol ponuku prijať." # todo: NEW TRANSLATION
 flavor_ath.2.a: "Nech [scope_heir.GetNameWithNoTooltip] nastúpi po [scope_ruler.GetShortNameWithNoTooltip]." # todo: NEW TRANSLATION
 flavor_ath.2.a.entry: "Nech nástupca nastúpi po panovníkovi." # todo: NEW TRANSLATION
 flavor_ath.2.b: "Ponúknime [ROOT.GetCountry.GetFlavorRank] [arg_ruler.GetShortNameWithNoTooltip]." # todo: NEW TRANSLATION
 flavor_ath.2.b.entry: "Ponúknime mu kráľovstvo." # todo: NEW TRANSLATION
 ath_sicily_may_declare_war: "[sic_country.GetName] získa [ShowCasusBelliName('cb_subject_broke_free')] [casus_belli|e] proti [ROOT.GetCountry.GetName], ak sa [arg_ruler.GetName] stane novým panovníkom [ROOT.GetCountry.GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 flavor_ath.3.title: "[scope_athens.GetAdjectiveWithNoTooltip] [scope_athens.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')] ponúka [scope_athens.GetLongNameWithNoTooltip]" # todo: NEW TRANSLATION
 flavor_ath.3.desc: "Diplomat z [scope_athens.GetName] prišiel na [ROOT.GetCountry.GetGovernment.GetCourtTitle] s sľubnou, no zradnou ponukou. Priniesol správy, že [scope_ath_william.GetName] z [scope_athens.GetNameWithNoTooltip] náhle zomrel po krátkej chorobe a jeho smrť zanechala [ROOT.GetCountry.GetFlavorRank] bez vládcu. Kým mnohí z [scope_athens.GetGovernment.GetEstateName('nobles_estate')] v [scope_athens.GetNameWithNoTooltip] čakajú na nástupcu [scope_ath_william.GetShortNameWithNoTooltip], úradujúci regent [regent_of_athens.GetShortName] dohodol zmluvu s inými [scope_athens.GetAdjectiveWithNoTooltip] [scope_athens.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')], ktorí zostali verní dynastii [arg_ruler.GetDynasty.GetName], a radšej by videli [arg_ruler.GetName] korunovaného ako nového vládcu. \n\n[regent_of_athens.GetShortNameWithNoTooltip] poznamenal, že [ShowCultureName('catalan')] Spoločnosť prejavila nespokojnosť s dynastiou [scope_ath_william.GetDynasty.GetName], a hoci histórie medzi [arg_ruler.GetShortNameWithNoTooltip] a spoločnosťou sú napäté kvôli zvrhnutiu [scope_slained_brienne.GetName], pri dostatočnom manévrovaní možno jej vodcovstvo presvedčiť, aby podporilo obnovenie vlády dynastie [arg_ruler.GetDynasty.GetNameWithNoTooltip] nad [scope_athens.GetFlavorRank]. Ak sa ich podpora získa, [scope_sic_country.GetAdjective] [scope_sic_country.GetGovernment.GetCourtTitle] môže byť ochotné dovoliť, aby [scope_athens.GetNameWithNoTooltip] bez konfliktu unikla z ich vplyvu." # todo: NEW TRANSLATION
 flavor_ath.3.a: "Prijmime [scope_athens.GetAdjectiveWithNoTooltip] ponuku." # todo: NEW TRANSLATION
 flavor_ath.3.a.entry: "Prijmime ponuku $ATH_ADJ$." # todo: NEW TRANSLATION
 flavor_ath.3.b: "Odmietnime ponuku; to je príliš veľké riziko." # todo: NEW TRANSLATION
 flavor_ath.3_become_athens: "[ROOT.GetCountry.GetName] bude zlúčené do [scope_athens.GetLongName], získa [cores|e] vo všetkých [scope_athens.GetAdjectiveWithNoTooltip] [core|e] [locations|e]" # todo: NEW TRANSLATION
 ath_arg_sicily_may_declare_war: "[scope_athens.GetName] sa stane nezávislým, ale [scope_sic_country.GetName] získa [ShowCasusBelliName('cb_subject_broke_free')] [casus_belli|e] proti [scope_athens.GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 flavor_ath.4.title: "[arg_ruler.GetNameWithNoTooltip] prijíma!" # todo: NEW TRANSLATION
 flavor_ath.4.desc: "Po tajnom vyslaní [regent_of_athens.GetShortName] do [arg_country_scope.GetName] [arg_ruler.GetNameWithNoTooltip] prijal našu ponuku a prevezme vládu nad [ROOT.GetCountry.GetLongName]. S rozšírenými správami o smrti [scope_ath_william.GetName] sa [sic_country_scope.GetAdjective] [sic_country_scope.GetGovernment.GetCourtTitle] čoskoro dozvie o prevrate, ktorý vykonal [regent_of_athens.GetNameWithNoTooltip].\n\nHoci [ShowCultureName('catalan')] Spoločnosť dobyla [ROOT.GetCountry.GetFlavorRank] od [scope_slained_brienne.GetName] v roku 1311, stali sa čoraz nespokojnejšími s [sic_country_scope.GetAdjectiveWithNoTooltip] [sic_country_scope.GetGovernment.GetCourtTitle] a sú otvorení prijať vládu [arg_ruler.GetShortNameWithNoTooltip] nad [ROOT.GetCountry.GetFlavorRank], ak sa dosiahne kompromis." # todo: NEW TRANSLATION
 flavor_ath.4.a: "Teraz bude potrebné rokovať s [ShowCultureNameWithNoTooltip('catalan')] Spoločnosťou." # todo: NEW TRANSLATION
 flavor_ath.5.title: "Uspokojenie [ShowCultureNameWithNoTooltip('catalan')] Spoločnosti" # todo: NEW TRANSLATION
 flavor_ath.5.desc: "Aj keď dynastia [scope_ath_william.GetDynasty.GetName] držala dukátne tituly [ROOT.GetCountry.GetName] od roku 1312, [ShowCultureName('catalan')] Spoločnosť bola hybnou silou uplatňujúcou [sic_country_scope.GetAdjectiveWithNoTooltip] autoritu v celom [ROOT.GetCountry.GetFlavorRank]. Po zákerných taktikách [regent_of_athens.GetName] mnohí z [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')] v [ROOT.GetCountry.GetNameWithNoTooltip] začali podporovať nárok dynastie [scope_ruler.GetDynasty.GetName] na [ROOT.GetCountry.GetNameWithNoTooltip].\n\nKým niektorí v [ShowCultureNameWithNoTooltip('catalan')] Spoločnosti sú nespokojní s [sic_country_scope.GetAdjectiveWithNoTooltip] [sic_country_scope.GetGovernment.GetCourtTitle], mnohí sú ochotní zradit svoj lenný sľub [sic_country_scope.GetNameWithNoTooltip], ak budú členovia Spoločnosti primerane odmenení." # todo: NEW TRANSLATION
 flavor_ath.5.a: "Vyčleňte časť príjmov [ROOT.GetCountry.GetFlavorRank] Spoločnosti." # todo: NEW TRANSLATION
 flavor_ath.5.a.entry: "Vyčleňte časť príjmov kráľovstva Spoločnosti." # todo: NEW TRANSLATION
 flavor_ath.5.b: "Udeľte Spoločnosti ďalšie privilégiá a pozemkové práva." # todo: NEW TRANSLATION
 flavor_ath.5.c: "Násilne vyhnajte Spoločnosť z [ROOT.GetCountry.GetFlavorRank]." # todo: NEW TRANSLATION
 flavor_ath.5.c.entry: "Násilne vyhnajte Spoločnosť z kráľovstva." # todo: NEW TRANSLATION
 flavor_ath.6.title: "[scope_athens.GetNameWithNoTooltip] zvrhol vládu [ShowDynastyNameWithNoTooltip('barcelona_dynasty')]" # todo: NEW TRANSLATION
 flavor_ath.6.desc: "Hrozivé správy dorazili na [ROOT.GetCountry.GetGovernment.GetCourtTitle]! [scope_ath_william.GetName] zomrel na náhlu chorobu a v mocenskej medzere spôsobenej jeho smrťou dali [scope_athens.GetAdjective] elity [scope_athens.GetFlavorRank] [arg_ruler.GetName], ktorý zanechal svoju povinnosť voči [scope_ruler.GetName] ako vazalovi." # todo: NEW TRANSLATION
 flavor_ath.6.a: "Musíme získať späť [scope_athens.GetNameWithNoTooltip]!" # todo: NEW TRANSLATION
 flavor_ath.6.a.entry: "$ATH$ musí byť znovu získaný!" # todo: NEW TRANSLATION
 flavor_ath.7.title: "[arg_ruler.GetNameWithNoTooltip] odmieta!" # todo: NEW TRANSLATION
 flavor_ath.7.entry: "Vojvoda z Argosu odmieta" # todo: NEW TRANSLATION
 flavor_ath.7.desc: "Náš tajný odoslanec do [arg_country.GetName] sa vrátil s politovaním, že [arg_ruler.GetName] odmietol našu ponuku znovu ho dosadiť ako vládcu [ROOT.GetCountry.GetName]. Rýchlo sa snažiac zachrániť situáciu, [regent_of_athens.GetName] uväznil mnohých z [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] zapojených do sprisahania, hoci iní členovia [ROOT.GetCountry.GetGovernment.GetCourtTitle] navrhujú uväzniť aj [regent_of_athens.GetHeShe] spolu s nimi skôr, než [scope_heir.GetName] dorazí do [ROOT.GetCountry.GetNameWithNoTooltip]." # todo: NEW TRANSLATION
 flavor_ath.7.a: "Zatiaľ ušetri [regent_of_athens.GetShortNameWithNoTooltip]." # todo: NEW TRANSLATION
 flavor_ath.7.a.entry: "Zatiaľ ho ušetri." # todo: NEW TRANSLATION
 flavor_ath.7.b: "Uväzni [regent_of_athens.GetShortNameWithNoTooltip]!" # todo: NEW TRANSLATION
 flavor_ath.7.b.entry: "Uväzni ho!" # todo: NEW TRANSLATION
 flavor_ath.8.title: "Vláda [ShowCultureNameWithNoTooltip('catalan')] Spoločnosti" # todo: NEW TRANSLATION
 flavor_ath.8.entry: "Vláda Katalánskej spoločnosti" # todo: NEW TRANSLATION
 flavor_ath.8.desc: "Od dobytia [ROOT.GetCountry.GetLongName] v roku 1311 [ShowCultureName('catalan')] Spoločnosťou a následnej vernosti [sic_country.GetLongName] vládla dynastia [scope_ruler.GetDynasty.GetName] nad [ROOT.GetCountry.GetLongNameWithNoTooltip]. Aj keď [scope_ruler.GetName] zostáva súčasným [ROOT.GetCountry.GetGovernment.GetRulerTitle], väčšinu moci v [ROOT.GetCountry.GetNameWithNoTooltip] drží [ShowCultureNameWithNoTooltip('catalan')] Spoločnosť a jej vojenská sila bráni nárokmi [arg_ruler.GetName] v obnovení [ROOT.GetCountry.GetFlavorRank].\n\nAj keď [ShowCultureNameWithNoTooltip('catalan')] Spoločnosť zostala verná [sic_country.GetAdjectiveWithNoTooltip] [sic_country.GetGovernment.GetCourtTitle], niektorí miestni [ROOT.GetCountry.GetAdjectiveWithNoTooltip] [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')] podozrievajú, že členovia Spoločnosti sú čoraz viac nespokojní s vládnucou dynastiou [scope_ruler.GetDynasty.GetNameWithNoTooltip]." # todo: NEW TRANSLATION
 flavor_ath.8.a: "Nadále dôverujme [ShowCultureNameWithNoTooltip('catalan')] Spoločnosti, aby ochraňovala [ROOT.GetCountry.GetNameWithNoTooltip]." # todo: NEW TRANSLATION
 flavor_ath.8.a.entry: "Nadále dôverujme [ShowCultureNameWithNoTooltip('catalan')] Spoločnosti, aby nás chránila." # todo: NEW TRANSLATION
 flavor_ath.8.b: "Buďme opatrní voči fámam o nevernosti [ShowCultureNameWithNoTooltip('catalan')] Spoločnosti." # todo: NEW TRANSLATION
 flavor_ath.9.title: "[byz_country.GetAdjectiveWithNoTooltip] vnútorné nepokoje" # todo: NEW TRANSLATION
 flavor_ath.9.entry: "Byzantské vnútorné nepokoje" # todo: NEW TRANSLATION
 flavor_ath.9.desc: "Správy dosiahli [ROOT.GetCountry.GetAdjective] [ROOT.GetCountry.GetGovernment.GetCourtTitle], že [byz_country.GetName] stráca veľkú kontrolu nad pohraničnými regiónmi s [ROOT.GetCountry.GetNameWithNoTooltip], čo viedlo k nasadeniu menších posád. S [byz_country.GetAdjectiveWithNoTooltip] [byz_country.GetGovernment.GetCourtTitle] tiež v neporiadku kvôli dynastickým sporom a ich pozornosťou rozdelenou medzi [ShowCultureName('turkish_culture')] begliky v [ShowRegionName('anatolia_region')], niektorí členovia [ROOT.GetCountry.GetAdjectiveWithNoTooltip] [ROOT.GetCountry.GetGovernment.GetCourtTitle] cítia, že nastal čas zaútočiť na [byz_country.GetLongNameWithNoTooltip] a rozšíriť naše zisky v [ShowProvinceDefinitionName('thessaly_province')].\n\nAlternatívne niektorí v [ShowCultureNameWithNoTooltip('catalan')] Spoločnosti ponúkli uskutočniť nájazdy do [byz_country.GetAdjectiveWithNoTooltip] [ShowAreaName('northern_greece_area')], aby naplnili truhlice [ROOT.GetCountry.GetFlavorRank]." # todo: NEW TRANSLATION
 flavor_ath.9.a: "Teraz je čas zaútočiť hlbšie do [ShowProvinceDefinitionNameWithNoTooltip('thessaly_province')]!" # todo: NEW TRANSLATION
 flavor_ath.9.b: "Odošli [ShowCultureNameWithNoTooltip('catalan')] Spoločnosť na nájazdy do [ShowAreaNameWithNoTooltip('northern_greece_area')]." # todo: NEW TRANSLATION
 flavor_ath.9.c: "Zatiaľ počkáme na vhodný moment." # todo: NEW TRANSLATION
 flavor_ath.10.title: "Obyvateľstvo [ShowCultureNameWithNoTooltip('greek_culture')] v [ROOT.GetCountry.GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 flavor_ath.10.entry: "Vláda v Grécku" # todo: NEW TRANSLATION
 flavor_ath.10.desc: "Od čias vlády [GetCountry('LAT').GetAdjective] nad [ShowScriptedGeographyName('greece_geography')] mnohí z [ShowCultureName('greek_culture')] elít prišli o svoje tituly, ktoré boli udelené členom križiackej elity [GetCountry('LAT').GetAdjectiveWithNoTooltip]. Hoci pád Impéria v roku 1261 spôsobil odlúčenie križiackej dominancie nad [ShowScriptedGeographyNameWithNoTooltip('greece_geography')], mnohé jeho dedičstvá sú stále cítiť v celom [ROOT.GetCountry.GetLongName].\n\nSnahou o ďalšie práva na pôdu mnohí v [ROOT.GetCountry.GetCulture.GetName] [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] požiadali [ROOT.GetCountry.GetGovernment.GetCourtTitle] v nádeji získať viac [ShowCultureNameWithNoTooltip('greek_culture')] pozemkov po celom [ROOT.GetCountry.GetNameWithNoTooltip]. Avšak niektorí v tom vidia príležitosť získať priazeň [ShowCultureNameWithNoTooltip('greek_culture')] obyvateľstva." # todo: NEW TRANSLATION
 flavor_ath.10.a: "Podporiť rozšírenie práv na pôdu [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')]." # todo: NEW TRANSLATION
 flavor_ath.10.a.entry: "Podporiť rozšírenie práv na pôdu $nobles_estate$." # todo: NEW TRANSLATION
 flavor_ath.10.b: "Uspokojiť obyvateľstvo [ShowCultureNameWithNoTooltip('greek_culture')]." # todo: NEW TRANSLATION
 flavor_ath.10.c: "Presunúť časť práv na pôdu na [ShowCultureNameWithNoTooltip('catalan')] Spoločnosť." # todo: NEW TRANSLATION
 flavor_ath.10.d: "Udržať súčasný stav." # todo: NEW TRANSLATION
 ath_greek_pops_lose_mild_satisfaction: "Všetky naše [ShowCultureName('greek_culture')] [pops|e] stratia [ShowNamedValue('pop_satisfaction_mild_penalty')|+=2%] [pop_satisfaction|e]" # todo: NEW TRANSLATION
 ath_greek_pops_gain_severe_satisfaction: "Všetky naše [ShowCultureName('greek_culture')] [pops|e] získajú [ShowNamedValue('estate_satisfaction_severe_bonus')|+=2%] [pop_satisfaction|e]" # todo: NEW TRANSLATION
 ath_greek_pops_lose_severe_satisfaction: "Všetky naše [ShowCultureName('greek_culture')] [pops|e] stratia [ShowNamedValue('estate_satisfaction_severe_penalty')|+=2%] [pop_satisfaction|e]" # todo: NEW TRANSLATION
 flavor_ath.11.title: "[ShowCultureNameWithNoTooltip('catalan')] Spoločnosť versus [ShowCultureNameWithNoTooltip('greek_culture')] obyvateľstvo v [target_conflict_location.GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 flavor_ath.11.entry: "Konflikt medzi Katalánskou spoločnosťou a gréckym obyvateľstvom" # todo: NEW TRANSLATION
 flavor_ath.11.desc: "Keďže [ShowCultureName('catalan')] Spoločnosť užívala privilégiá udelené jej [ROOT.GetCountry.GetGovernment.GetCourtTitle] v [ROOT.GetCountry.GetName], spôsobila veľké pohoršenie medzi [ShowCultureName('greek_culture')] obyvateľstvom [target_conflict_location.GetName], ktoré ich obviňuje z nezákonného zabierania pôdy. Zatiaľ čo niektorí v [ROOT.GetCountry.GetGovernment.GetCourtTitle] už dlhšie vedeli o záujmoch [ShowCultureNameWithNoTooltip('catalan')] Spoločnosti v [target_conflict_location.GetNameWithNoTooltip], iní sa obávajú, že tento incident by sa mohol rozšíriť do susedných provincií a vyvolať veľké [ShowCultureNameWithNoTooltip('greek_culture')] povstanie, a požiadali o zásah [scope_ruler.GetName]." # todo: NEW TRANSLATION
 flavor_ath.11.a: "Podporiť zabratú pôdu." # todo: NEW TRANSLATION
 flavor_ath.11.b: "Zjavnúť [ShowCultureNameWithNoTooltip('catalan')] Spoločnosť." # todo: NEW TRANSLATION
 flavor_ath.11.c: "Využiť príležitosť na vyhnanie [ShowCultureNameWithNoTooltip('catalan')] Spoločnosti z [ROOT.GetCountry.GetNameWithNoTooltip]!" # todo: NEW TRANSLATION
 flavor_ath.11.c.entry: "Využiť príležitosť na vyhnanie [ShowCultureNameWithNoTooltip('catalan')] Spoločnosti od nás!" # todo: NEW TRANSLATION
 flavor_ath.12.title: "Presúvanie hlavných miest [thebes_location.GetNameWithNoTooltip] a [athens_location.GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 flavor_ath.12.entry: "Presúvanie hlavných miest" # todo: NEW TRANSLATION
 flavor_ath.12.desc: "Hoci [athens_location.GetRank.GetName] [athens_location.GetName] je dlhodobo jedným z najdôležitejších sídiel v [ROOT.GetCountry.GetFlavorRank], minulé vlády — od starých nástupcov [GetCountry('LAT').GetAdjective] až po nedávnejšiu [ShowCultureNameWithNoTooltip('catalan')] Spoločnosť — sa usadili v [thebes_location.GetName], kvôli jeho strategickejšiemu postaveniu. Napriek vzostupu [thebes_location.GetNameWithNoTooltip] zostalo [athens_location.GetNameWithNoTooltip] prominentným [athens_location.GetRank.GetNameWithNoTooltip], s veľkou časťou byrokracie [ROOT.GetCountry.GetFlavorRank] stále tam umiestnenou.\n\nKým oba lokality sa ukázali byť cenné, [ROOT.GetCountry.GetGovernment.GetCourtTitle] požiadala [scope_ruler.GetName], aby formalizoval konsenzus v tejto veci a oficiálne rozhodol, ktoré by malo byť určené ako hlavné mesto [ROOT.GetCountry.GetName]." # todo: NEW TRANSLATION
 flavor_ath.12.a: "Zachovať existujúcu štruktúru, pričom obe lokality majú dôležitosť." # todo: NEW TRANSLATION
 flavor_ath.12.b: "Mali by sme sa vrátiť do [athens_location.GetNameWithNoTooltip] a znova ho urobiť hlavným mestom." # todo: NEW TRANSLATION
 flavor_ath.12.b.entry: "Mali by sme sa vrátiť do [ShowLocationNameWithNoTooltip('athens')] a znova ho urobiť hlavným mestom." # todo: NEW TRANSLATION
 flavor_ath.12.c: "Vyhlásiť [thebes_location.GetNameWithNoTooltip] za formálne hlavné mesto [ROOT.GetCountry.GetFlavorRank]." # todo: NEW TRANSLATION
 flavor_ath.12.c.entry: "Vyhlásiť [ShowLocationNameWithNoTooltip('thebes')] za formálne hlavné mesto kráľovstva." # todo: NEW TRANSLATION
 flavor_ath.13.title: "[scope_epi_ruler.GetNameWithNoTooltip] uchvátil moc v [epi_country.GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 flavor_ath.13.entry: "Secesia v Epire" # todo: NEW TRANSLATION
 flavor_ath.13.desc: "Po tom, čo sa [epi_country.GetName] v roku 1337 dostal pod vládu [scope_epi_governor.GetName], sa vrátil do náruče [byz_country.GetName]. Podporovatelia [scope_epi_ruler.GetName] však odštartovali úspešné povstanie proti [byz_country.GetAdjectiveWithNoTooltip] guvernérovi, zvrhli administráciu a obnovili [scope_epi_ruler.GetLastNameWithNoTooltip] na [epi_country.GetFlavorRank]. Hoci [byz_country.GetNameWithNoTooltip] zatiaľ nezačal konať, niektorí v [ROOT.GetCountry.GetLongName] navrhovali využiť príležitosť a uchvátiť [epi_country.GetNameWithNoTooltip], pokiaľ tam pretrváva mocenské vákuum." # todo: NEW TRANSLATION
 flavor_ath.13.a: "Uhlásime si [epi_country.GetLongNameWithNoTooltip]." # todo: NEW TRANSLATION
 flavor_ath.13.a.entry: "Uhlásime si $EPI$." # todo: NEW TRANSLATION
 flavor_ath.13.b: "Namiesto toho by sme mali podporiť [scope_epi_ruler.GetNameWithNoTooltip]." # todo: NEW TRANSLATION
 flavor_ath.13.b.entry: "Namiesto toho by sme ho mali podporiť." # todo: NEW TRANSLATION
 flavor_ath.13.c: "Záležitosti [epi_country.GetAdjectiveWithNoTooltip] nás netýkajú." # todo: NEW TRANSLATION
 flavor_ath.13.c.entry: "Záležitosti $EPI_ADJ$ nás netýkajú." # todo: NEW TRANSLATION
 flavor_ath.14.title: "Titulárni [GetCountry('LAT').GetAdjectiveWithNoTooltip] vládcovia [scope_ach_country.GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 flavor_ath.14.entry: "Titulárny cisár v Achaei" # todo: NEW TRANSLATION
 flavor_ath.14.desc: "Hoci už nejaký čas využívajú ochranu [scope_nap_country.GetName], [scope_ach_country.GetLongNameWithNoTooltip] získava čoraz väčší vplyv medzi mnohými [GetCountry('LAT').GetAdjective] štátmi v [ShowScriptedGeographyName('greece_geography')], pričom [scope_ach_ruler.GetName] využíva svoj nárok ako panovník [GetCountry('LAT').GetLongNameWithNoTooltip]. Hoci titul stratil väčšinu svojej moci pádom [GetCountry('LAT').GetLongNameWithNoTooltip] v roku 1261, mnohí [GetCountry('LAT').GetAdjectiveWithNoTooltip] vládci v [ShowScriptedGeographyNameWithNoTooltip('greece_geography')] naďalej podporujú [scope_ach_ruler.GetShortNameWithNoTooltip].\n\nS rastúcou silou základne [ROOT.GetCountry.GetName] medzi zostávajúcimi [GetCountry('LAT').GetAdjectiveWithNoTooltip] štátmi niektorí v [ROOT.GetCountry.GetGovernment.GetCourtTitle] cítia, že je čas zaútočiť na [scope_ach_country.GetNameWithNoTooltip], aby sme ich nároky na [GetCountry('LAT').GetLongNameWithNoTooltip] navždy oslabili." # todo: NEW TRANSLATION
 flavor_ath.14.a: "Mali by sme napadnúť [scope_ach_country.GetNameWithNoTooltip] a ďalej oslabiť ich nárok." # todo: NEW TRANSLATION
 flavor_ath.14.a.entry: "Mali by sme napadnúť $ACH$ a ďalej oslabiť ich nárok." # todo: NEW TRANSLATION
 flavor_ath.14.b: "Namiesto toho by sme sa mali snažiť nadviazať vzťahy s [scope_ach_ruler.GetShortNameWithNoTooltip]." # todo: NEW TRANSLATION
 flavor_ath.14.b.entry: "Namiesto toho by sme sa mali snažiť nadviazať vzťahy s ním." # todo: NEW TRANSLATION
 flavor_ath.14.c: "Záležitosti [scope_ach_ruler.GetShortNameWithNoTooltip] sa [ROOT.GetCountry.GetNameWithNoTooltip] netýkajú." # todo: NEW TRANSLATION
 flavor_ath.14.c.entry: "Záležitosti vládcu sa nás netýkajú." # todo: NEW TRANSLATION
 flavor_ath.15.title: "[the_pope.GetNameWithNoTooltip] hľadá [ROOT.GetCountry.GetAdjectiveWithNoTooltip] podporu k obnove [GetCountry('LAT').GetLongNameWithNoTooltip]" # todo: NEW TRANSLATION
 flavor_ath.15.entry: "Pápež navrhuje obnovenie Latinského cisárstva" # todo: NEW TRANSLATION
 flavor_ath.15.desc: "Diplomat prišiel na [ROOT.GetCountry.GetGovernment.GetCourtTitle] [ROOT.GetCountry.GetName] z [scope_papal_states.GetLongName] s ambicióznym návrhom. [the_pope.GetNameWithNoTooltip] si všimol rastúcu moc [ROOT.GetCountry.GetNameWithNoTooltip], spolu s ubúdajúcim vplyvom [scope_byz.GetName], a teraz nás vidí ako kandidáta, ktorému by sa dalo obnoviť [GetCountry('LAT').GetLongName] v [constantinople_location.GetName].\n\nAk prijmeme ich požiadavky a [GetCountry('LAT').GetLongNameWithNoTooltip] bude obnovené, [the_pope.GetShortNameWithNoTooltip] nám poskytne plnú podporu [scope_papal_states.GetLongNameWithNoTooltip] a uzná [scope_ruler.GetName] za legitímneho vládcu [constantinople_location.GetNameWithNoTooltip]." # todo: NEW TRANSLATION
 flavor_ath.15.a: "Akceptovať požiadavku [the_pope.GetShortNameWithNoTooltip] obnoviť [GetCountry('LAT').GetLongNameWithNoTooltip]." # todo: NEW TRANSLATION
 flavor_ath.15.a.entry: "Prijať jeho žiadosť obnoviť $LAT$." # todo: NEW TRANSLATION
 flavor_ath.15.b: "Nebudeme sa podriadiť ambíciám [the_pope.GetShortNameWithNoTooltip]." # todo: NEW TRANSLATION
 flavor_ath.15.b.entry: "Nebudeme sa podriadiť ambíciám pápeža." # todo: NEW TRANSLATION
 flavor_ath.16.title: "Nároky [GetCountry('THE').GetLongNameWithNoTooltip]" # todo: NEW TRANSLATION
 flavor_ath.16.entry: "Rekonkvisita thessalonických zemí" # todo: NEW TRANSLATION
 flavor_ath.16.desc: "Hoci krátko žijúce [GetCountry('THE').GetFlavorRank] a vazalský štát starého [GetCountry('LAT').GetLongName], vládcovia [GetCountry('THE').GetName] mali silnú politickú moc v rámci [GetCountry('LAT').GetLongName] predtým, než ho v roku 1224 zničil [scope_theodoros_doukas.GetName].\n\nAj keď ceremoniálne nároky na titul pokračovali pod [achaea_country.GetLongName], nedávne dobytia územia patriaceho starému [GetCountry('THE').GetFlavorRank] [ROOT.GetCountry.GetName] zanechali niektorých v [ROOT.GetCountry.GetGovernment.GetCourtTitle] presvedčených, že by sme si namiesto toho mali uplatniť tento titul pre seba, aby sme ďalej posilnili náš nárok ako nástupcovia [GetCountry('LAT').GetLongNameWithNoTooltip]." # todo: NEW TRANSLATION
 flavor_ath.16.a: "Uplatniť nárok na [GetCountry('THE').GetLongNameWithNoTooltip]!" # todo: NEW TRANSLATION
 flavor_ath.16.a.entry: "Uplatniť nárok na $THE$!" # todo: NEW TRANSLATION
 flavor_ath.16.b: "Vyhlásiť namiesto toho nové [GetCountry('THE').GetFlavorRank]." # todo: NEW TRANSLATION
 flavor_ath.16.b.entry: "Vyhlásiť namiesto toho nové kráľovstvo." # todo: NEW TRANSLATION
 flavor_ath.16.c: "Nemali by sme si nárokovať sporné tituly minulosti." # todo: NEW TRANSLATION
 may_form_thessalonica: "Znižuje počet [locations|e] potrebných v rámci [ShowScriptedGeographyName('claims_of_thessalonica_geography')] na vytvorenie [GetCountry('THE').GetLongNameWithNoTooltip] o #L 30.00%#!" # todo: NEW TRANSLATION
 flavor_ath.17.title: "Dobytie [constantinople_location.GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 flavor_ath.17.entry: "Konštantínopol dobitý!" # todo: NEW TRANSLATION
 flavor_ath.17.desc: "Naši vojaci z [ROOT.GetCountry.GetName] dokázali nemožné a dobyli [constantinople_location.GetName]! Poučení z minulosti, [scope_ruler.GetName] nariadil zastaviť lúpenie v [constantinople_location.GetRank.GetName], v nádeji vyhnúť sa opakovaniu následkov spôsobených štvrtou križiackou výpravou. Keďže veľká časť starej [ShowCultureNameWithNoTooltip('greek_culture')] elity bola opäť porazená, [scope_ruler.GetShortNameWithNoTooltip] predložil návrh [ROOT.GetCountry.GetAdjectiveWithNoTooltip] [ROOT.GetCountry.GetGovernment.GetCourtTitle] na znovuzriadenie [GetCountry('LAT').GetLongName], hoci niektorí sa domnievajú, že by sme sa mali vyvarovať chýb pôvodného [GetCountry('LAT').GetFlavorRank] a najprv obnoviť našu kontrolu nad [ShowScriptedGeographyName('greece_geography')]." # todo: NEW TRANSLATION
 flavor_ath.17.a: "Oznámiť obnovenie [GetCountry('LAT').GetLongNameWithNoTooltip]!" # todo: NEW TRANSLATION
 flavor_ath.17.a.entry: "Oznámiť obnovenie $LAT$!" # todo: NEW TRANSLATION
 flavor_ath.17.b: "Najprv sa snažiť stabilizovať našu pozíciu v [ShowScriptedGeographyNameWithNoTooltip('greece_geography')]." # todo: NEW TRANSLATION
 flavor_ath.17.c: "Namiesto toho pokračujme vládnuť ako [ROOT.GetCountry.GetLongNameWithNoTooltip]." # todo: NEW TRANSLATION
 flavor_ath.17.c.entry: "Namiesto toho pokračujme vládnuť ako my sami." # todo: NEW TRANSLATION

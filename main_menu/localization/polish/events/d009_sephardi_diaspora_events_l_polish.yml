l_polish:
 d009_crypto_jewish_exodus_tt: "[ShowReligionAdjective('catholic')] konvertiti pochádzajúci z krypt židovskej komunity potichu opúšťajú svoju novú vieru, vracajú sa k pôvodnej a odchádzajú do [d009_exodus_destination.GetName]" # todo: NEW TRANSLATION
 d009_sephardi_diaspora.1.title: "Príchod vyhnancov" # todo: NEW TRANSLATION
 d009_sephardi_diaspora.1.entry: "$d009_sephardi_diaspora.1.title$" # todo: NEW TRANSLATION
 d009_sephardi_diaspora.1.desc: "Náš [ROOT.GetCountry.GetGovernment.GetRulerTitle] sa dozvedá, že [origin_country.GetNameWithNoTooltip] vyhnalo svojich [ShowReligionAdjective('judaism')] poddaných zo svojich brehov a že mnohí z nich teraz čakajú v našich prístavoch s jediným majetkom, ktorý si dokázali odniesť. Naši [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')] vidia v ich príchode nečakaný príliv zručných pracovníkov a hotového kapitálu, zatiaľ čo naši [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] v nich vidia masu cudzincov, za ktorých vernosť a vieru sa zatiaľ nemôžeme zaručiť. Naše rozhodnutie si zapamätá každý vyhnanec, ktorý sa o ňom dozvie." # todo: NEW TRANSLATION
 d009_sephardi_diaspora.1.a: "Oficiálne ich privítajme." # todo: NEW TRANSLATION
 d009_sephardi_diaspora.1.b: "Obmedzme ich pobyt na konkrétne mestá." # todo: NEW TRANSLATION
 d009_sephardi_diaspora.1.historical_info: "Sultánovi Bayezidovi II. sa pripisuje poznámka, že Ferdinand Aragónsky ochudobnil svoju vlastnú krajinu a obohatil Osmanov tým, že vyhnal Židov. Svojim miestodržiteľom prikázal, aby vyhnancov vítali a neodmietali ich. V priebehu nasledujúcich desaťročí sa na osmanskom Balkáne a v Anatólii usadili desaťtisíce ľudí, ktorí so sebou priniesli tlačiarenské lisy, textilné techniky a obchodné siete. Tie výrazne obohatili osmanské mestá, najmä Thessaloníki a Konštantínopol." # todo: NEW TRANSLATION
 d009_sephardi_diaspora.2.title: "[ShowLocationNameWithNoTooltip('thessaloniki')] sa stáva [ShowReligionAdjectiveWithNoTooltip('judaism')]" # todo: NEW TRANSLATION
 d009_sephardi_diaspora.2.entry: "$d009_sephardi_diaspora.2.title$" # todo: NEW TRANSLATION
 d009_sephardi_diaspora.2.desc: "V rokoch od príchodu prvých vyhnancov sa [ShowLocationName('thessaloniki')] úplne premenilo. V jeho dokoch, dielňach a na trhoch sa dnes život riadi viac než ktorýmkoľvek iným kalendárom rytmom sabatu a počet obyvateľov vyznávajúcich [ShowReligionAdjective('judaism')] prevýšil súčet všetkých ostatných komunít v meste. Aj naši úradníci si začali viesť účty v rovnakom rytme, už len preto, že od neho dnes závisí taká veľká časť mestského obchodu." # todo: NEW TRANSLATION
 d009_sephardi_diaspora.2.a: "Nech charakter mesta hovorí sám za seba." # todo: NEW TRANSLATION
 d009_sephardi_diaspora.2.historical_info: "V polovici 16. storočia tvorili sefardskí Židia väčšinu obyvateľstva Thessaloníki. Mesto sa medzi židovskými komunitami v celej Európe a Stredomorí preslávilo ako centrum sefardskej vzdelanosti, tlače a textilnej výroby, najmä vlnenej látky tkanej na osmanské vojenské uniformy. Judeošpanielčina (ladino) zostala významným jazykom ulíc a trhov mesta až do 20. storočia." # todo: NEW TRANSLATION
 d009_thessaloniki_has_sephardi_pops_tt: "[ShowLocationNameWithNoTooltip('thessaloniki')] je domovom [ShowCultureNameWithNoTooltip('sephardi')] [Concept('pops','populáciami')|e]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 d009_sephardi_diaspora.3.title: "Geto v [ROOT.GetCountry.GetAltAdjectiveWithNoTooltip('L')]" # todo: NEW TRANSLATION # todo: COUNTRY CASE
 d009_sephardi_diaspora.3.entry: "Geto" # todo: NEW TRANSLATION
 d009_sephardi_diaspora.3.desc: "Náš senát navrhuje uzavrieť [ShowReligionAdjective('judaism')] komunitu v meste [ROOT.GetCountry.GetCapital.GetAltAdjective('L')] na jediný opevnený ostrov, ktorého brány by sa v noci zamykali a cez deň strážili. Obyvatelia by ho smeli opúšťať len za prísnych podmienok. Zástancovia to nazývajú rozumným kompromisom medzi vyhnaním a neobmedzeným usadzovaním. [ShowReligionAdjectiveWithNoTooltip('judaism')] obchodníci a úžerníci, od ktorých úverov je [ROOT.GetCountry.GetCapital.GetNameWithNoTooltip] už dlho závislé, to nazývajú oveľa menej lichotivým menom." # todo: NEW TRANSLATION # todo: COUNTRY CASE
 d009_sephardi_diaspora.3.a: "Zriaďme geto." # todo: NEW TRANSLATION
 d009_sephardi_diaspora.3.b: "Odolajme nátlaku, aby sme ich uzavreli." # todo: NEW TRANSLATION
 d009_sephardi_diaspora.3.historical_info: "Benátky zriadili židovské geto v roku 1516. Komunitu uzavreli v štvrti Cannaregio, v oblasti Ghetto Nuovo, ktorej brány sa v noci zamykali a strážili. Samotné slovo #italic geto#! pochádza z tejto benátskej štvrte, pravdepodobne z benátskeho slova pre zlievareň medi (#italic geto#!), ktorá sa tam predtým nachádzala. Model uzavretých židovských štvrtí zriadených štátom sa v priebehu nasledujúceho storočia rozšíril aj do ďalších miest v Taliansku." # todo: NEW TRANSLATION
 d009_venice_has_jewish_pops_tt: "[ShowLocationNameWithNoTooltip('venice')] je domovom [ShowReligionAdjectiveWithNoTooltip('judaism')] [Concept('pops','populáciami')|e]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 d009_sephardi_diaspora.4.title: "[target_character.GetNameWithNoTooltip] a Ferrarská Biblia" # todo: NEW TRANSLATION
 d009_sephardi_diaspora.4.entry: "Doña Gracia Mendes a Ferrarská Biblia" # todo: NEW TRANSLATION
 d009_sephardi_diaspora.4.desc: "[target_character.GetName], [GetCountry('POR').GetAdjective] vdova so značným majetkom a nemalou odvahou, sa usadila v [ShowLocationNameWithNoTooltip('ferrara')] a začala otvorene žiť tak, ako vždy tajne žila: ako bohatá židovka s pevným presvedčením. [target_character.GetSheHe] financuje preklad Písma do ladino pre konvertitov, ktorí sa nikdy nenaučili po hebrejsky, a potajomky udržiava sieť agentov a bezpečných útočísk siahajúcu až do samotnej [GetCountry('POR').GetNameWithNoTooltip], pripravenú pomôcť každému, kto sa chce vydať v jej stopách." # todo: NEW TRANSLATION
 d009_sephardi_diaspora.4.a: "Podporme jej činnosť." # todo: NEW TRANSLATION
 d009_sephardi_diaspora.4.b: "Obmedzme jej aktivity." # todo: NEW TRANSLATION
 d009_sephardi_diaspora.4.historical_info: "Doña Gracia Mendes Nasi (rodená Beatriz de Luna v Lisabone okolo roku 1510) vybudovala jedno z najväčších konvertitských obchodných bohatstiev 16. storočia. Po tom, čo sa usadila ako židovka najprv v Antverpách a potom vo Ferrare, využila svoje bohatstvo aj kontakty na financovanie Ferrarskej Biblie z roku 1553, prekladu do ladino určeného konvertitom, ktorí stratili znalosť hebrejčiny, a na pomoc pri financovaní únikových ciest pre portugalských nových kresťanov utekajúcich pred inkvizíciou." # todo: NEW TRANSLATION
 d009_sephardi_diaspora.5.title: "[target_character.GetNameWithNoTooltip] a presídlenie do [ShowLocationNameWithNoTooltip('safed')]" # todo: NEW TRANSLATION
 d009_sephardi_diaspora.5.entry: "Don Joseph Nasi a presídlenie do Safedu" # todo: NEW TRANSLATION
 d009_sephardi_diaspora.5.desc: "[target_character.GetName], finančník narodený v [GetCountry('POR').GetAdjective], ktorý nášmu [ROOT.GetCountry.GetGovernment.GetRulerTitle] preukázal značné služby na európskych dvoroch, teraz žiada o správu nad [ShowLocationName('safed')] a okolitou krajinou. Dúfa, že tam vo veľkom počte usadí ďalších vyhnancov a vybuduje centrum [ShowReligionAdjective('judaism')] vzdelanosti a hodvábnictva, ktoré bude podliehať len našej korune. [target_character.GetHerHis] ambície sú nepochybne veľkolepé a podľa našej pokladnice aj [target_character.GetHerHis] majetok." # todo: NEW TRANSLATION
 d009_sephardi_diaspora.5.a: "Povoľme [target_character.GetHimHer] toto presídlenie." # todo: NEW TRANSLATION
 d009_sephardi_diaspora.5.a.entry: "Povoľme donovi Josephovi Nasimu toto presídlenie." # todo: NEW TRANSLATION
 d009_sephardi_diaspora.5.b: "Odmietnime." # todo: NEW TRANSLATION
 d009_sephardi_diaspora.5.historical_info: "Don Joseph Nasi, synovec a zať doñi Gracie, sa stal jedným z najdôveryhodnejších poradcov sultána Süleymana Nádherného. Okolo 60. rokov 16. storočia získal vládu nad Tiberiadou a okolitými dedinami, aby ju obnovil ako centrum židovského osídlenia a výroby hodvábu. Projekt za jeho života dosiahol len mierny úspech, no často sa spomína ako skorá predzvesť neskorších snáh o presídlenie Židov do tohto regiónu." # todo: NEW TRANSLATION
 d009_sephardi_diaspora.6.title: "La Livornina" # todo: NEW TRANSLATION
 d009_sephardi_diaspora.6.entry: "$d009_sephardi_diaspora.6.title$" # todo: NEW TRANSLATION
 d009_sephardi_diaspora.6.desc: "Náš [ROOT.GetCountry.GetGovernment.GetRulerTitle] pripravuje listinu La Livornina, ktorá by otvorila [ShowLocationName('livorno')] [ShowReligionAdjective('judaism')] a konvertitským obchodníkom za podmienok štedrejších než tie, aké dosiaľ ponúkol ktorýkoľvek kresťanský štát: slobodu vierovyznania, výnimku z nosenia odznaku a právo obchodovať za rovnakých podmienok ako naši poddaní. Staršie obchodnícke rodiny v prístave nie sú myšlienkou na konkurenciu, ktorú takáto štedrosť priláka, práve nadšené." # todo: NEW TRANSLATION
 d009_sephardi_diaspora.6.a: "Vydajme La Livorninu." # todo: NEW TRANSLATION
 d009_sephardi_diaspora.6.b: "Obmedzme usádzanie [ShowReligionAdjectiveWithNoTooltip('judaism')]" # todo: NEW TRANSLATION
 d009_sephardi_diaspora.6.historical_info: "Ferdinando I. de' Medici vydal La Livorninu v roku 1593. Židovským a konvertitským obchodníkom ponúkla mimoriadne výhodné podmienky, výnimku z nosenia rozlišovacieho odznaku, slobodu vierovyznania a rovnaké právne postavenie ako kresťanským obchodníkom. Cieľom bolo vybudovať z Livorna obchodný prístav. Listina uspela mimoriadne dobre a židovská komunita v Livorne sa stala jednou z najbohatších a najmenej obmedzovaných v ranonovovekom Taliansku." # todo: NEW TRANSLATION
 variable_d009_sephardi_diaspora_6_fired_tt: "La Livornina bola vydaná" # todo: NEW TRANSLATION
 d009_country_has_sephardi_pops_tt: "V našich krajinách žijú [ShowCultureNameWithNoTooltip('sephardi')] [Concept('pops','populácie')|e]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 d009_sephardi_diaspora.7.title: "[GetCountry('POR').GetAdjectiveWithNoTooltip] národ v [ShowLocationNameWithNoTooltip('amsterdam')]" # todo: NEW TRANSLATION
 d009_sephardi_diaspora.7.entry: "$d009_sephardi_diaspora.7.title$" # todo: NEW TRANSLATION
 d009_sephardi_diaspora.7.desc: "Už celé roky sa obchodníci prichádzajúci z [GetCountry('POR').GetNameWithNoTooltip] a nazývajúci sa jednoducho portugalským národom potichu usádzajú v [ShowLocationName('amsterdam')], kde za zatvorenými dverami zachovávajú vlastné zvyky a žijú podľa vlastných pravidiel. Medzi našimi [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')] sa už všeobecne vie, že mnohí z týchto obchodníkov vyznávajú judaizmus — a vždy ho vyznávali — a že so sebou prinášajú značné bohatstvo." # todo: NEW TRANSLATION
 d009_sephardi_diaspora.7.a: "Povoľme im slobodu vierovyznania." # todo: NEW TRANSLATION
 d009_sephardi_diaspora.7.b: "Zachovajme staré obmedzenia." # todo: NEW TRANSLATION
 d009_sephardi_diaspora.7.historical_info: "Portugalskí konvertiti, ktorí sa nazývali portugalským národom, sa začali usádzať v Amsterdame okolo 90. rokov 16. storočia. Po tom, čo holandské úrady začali tolerovať judaizmus, sa otvorene vrátili k svojej viere, hoci úplné právne uznanie prichádzalo postupne. V polovici 17. storočia sa amsterdamská sefardská komunita stala jednou z najbohatších a najvplyvnejších v Európe. Sídlila tu portugalská synagóga a tlačiarenská dielňa, vďaka ktorej sa mesto stalo významným centrom vydávania kníh v hebrejčine a ladino." # todo: NEW TRANSLATION
 variable_d009_amsterdam_jewish_nation_tt: "Portugalský židovský národ získal uznanie v [ShowLocationName('amsterdam')]" # todo: NEW TRANSLATION
 d009_sephardi_diaspora.8.title: "[ShowCultureNameWithNoTooltip('sephardi')] Brazílčania utekajú do Nového Amsterdamu" # todo: NEW TRANSLATION
 d009_sephardi_diaspora.8.entry: "$d009_sephardi_diaspora.8.title$" # todo: NEW TRANSLATION
 d009_sephardi_diaspora.8.desc: "Dozvedeli sme sa, že vojská [GetCountry('POR').GetAdjective] tvrdo útočia na naše zámorské kolónie a že [ShowCultureName('sephardi')] obchodníckym rodinám, ktoré si tam vybudovali život pod našou vlajkou, nezostáva nič iné, než sa uchýliť do iných našich kolónií. Niektorí z nich už odplávali do našej osady pri ústí Severnej rieky v nádeji, že slobody, ktoré sme im tu v [ShowLocationName('amsterdam')] priznali, s nimi prekročia aj oceán." # todo: NEW TRANSLATION
 d009_sephardi_diaspora.8.a: "Privítajme ich v kolónii." # todo: NEW TRANSLATION
 d009_sephardi_diaspora.8.b: "Obmedzme prisťahovalectvo len na Európu." # todo: NEW TRANSLATION
 d009_sephardi_diaspora.8.historical_info: "Po tom, čo Portugalsko v roku 1654 znovu dobylo Holandskú Brazíliu, sa skupina dvadsiatich troch sefardských židovských utečencov plavila na sever a pristála v Novom Amsterdame. Stali sa prvými známymi židovskými osadníkmi na území dnešného New Yorku. Guvernér Peter Stuyvesant sa ich spočiatku pokúsil vyhostiť, no Holandská západoindická spoločnosť ho prehlasovala — v jej správnej rade boli aj židovskí akcionári. Vďaka tomu sa táto malá komunita stala zárodkom jednej z najväčších židovských populácií na svete." # todo: NEW TRANSLATION

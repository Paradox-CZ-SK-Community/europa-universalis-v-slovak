l_polish:
 seven_cities.10.title: "Žiarivé mesto v diaľke" # todo: NEW TRANSLATION
 seven_cities.10.desc: "Miestni sprievodcovia sú ochotní rozprávať, keď sa naleje víno a vyložia obchodné tovary na obhliadku. Áno, počuli o krajine, na ktorú sa [target_leader.GetName] vypytuje. Áno, za ďalším horským hrebeňom leží mesto, možno ďalšie dva týždne cesty. Jeden muž prisahá, že z diaľky videl slnko vychádzať nad jeho zlatistými hradbami. Iný vraví, že tam jeho strýko jednu sezónu obchodoval a vrátil sa bohatý. Tretí hovorí, že je to rozprávka a prví dvaja povedia čokoľvek za pohárik pálenky. Kronikár si všetko zapisuje." # todo: NEW TRANSLATION
 seven_cities.10.a: "Pálenku pre mužov s najlepšími príbehmi." # todo: NEW TRANSLATION
 seven_cities.10.b: "Rozlúčme sa s nimi a vyrazme na pochod." # todo: NEW TRANSLATION
 seven_cities.10.b.tt: "#italic Rozlúčime sa s rozprávačmi a vydáme sa na cestu, dôverujúc jej viac než ďalšej várke zveličených príbehov#!" # todo: NEW TRANSLATION
 seven_cities.10.historical_info: "Prvé španielske, francúzske a anglické #italic entradas#! v Amerike sa pri získavaní geografických informácií spoliehali takmer výlučne na domorodých informátorov. Ich správy často formovalo to, čo si domorodci mysleli, že ich vypočúvatelia chcú počuť, čo od nich chceli dosiahnuť (často to, aby odišli) a akú predstavu si vypočúvatelia priniesli so sebou. Výsledkom bol nepretržitý kolobeh spätnej väzby, v ktorom európske legendy o zlatých mestách potvrdzovali domorodé svedectvá, ktoré sa samy prispôsobovali európskym očakávaniam." # todo: NEW TRANSLATION
 natives_provide_crudely_drawn_map_tt: "#Y Miestni nám poskytnú hrubo načrtnutú mapu okolitých území#!" # todo: NEW TRANSLATION
 expedition_learns_of_potential_dangers: "#Y [Concept('expedition','Výprava')|e] sa dozvie o možných miestnych nebezpečenstvách#!" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 bonding_over_alcohol_locals_migrate_tt: "#Y Spoločná láska k alkoholu a príjemným rozhovorom vytvorí bratské putá#!" # todo: NEW TRANSLATION
 improve_root_culture_view_of_location_dominant_culture_tt: "Naše [Concept('cultural_opinion','kultúrny názor')|e] o kultúre [target_location.GetDominantCulture.GetName] sa zlepší" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 expedition_observes_local_innovations: "#Y Miestne inovácie budú zaznamenané a zdokumentované#!" # todo: NEW TRANSLATION
 expedition_receives_artifacts_as_gifts: "#Y Po návrate do [ROOT.GetCountry.GetCapital.GetAltAdjective('G')] nám darujú kultúrne artefakty#!" # todo: NEW TRANSLATION # todo: COUNTRY CASE
 should_calamity_occur_chance_to_avoid_tt: "Miestne nepriateľské skupiny a divá zver budú predstavovať menšiu hrozbu" # todo: NEW TRANSLATION
 may_bring_us_closer_to_uncovering_goal_tt: "Môže nás to priblížiť k odhaleniu toho, čo hľadáme" # todo: NEW TRANSLATION
 expedition_brought_back_riches_tt: "[Concept('expedition','Výprava')|e] priniesla bohatstvo:" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 expedition_brought_back_exotic_goods_tt: "Nosiči a náklad [Concept('expedition','výprava')|e] priniesli exotický tovar:" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 expedition_brought_back_artifacts_tt: "[Concept('expedition','Výprava')|e] priniesla dary a artefakty:" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 expedition_healer_joins_court_tt: "Po návrate [Concept('expedition','výprave')|e] sa k nášmu dvoru pridá domorodý liečiteľ" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 porters_guides_prevent_stalling: "Nosiči a sprievodcovia, ktorí sprevádzajú [Concept('expedition','výprava')|e], zabránia jej uviaznutiu" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 warned_expedition_avoids_calamity_tt: "Vďaka varovaniu pred miestnymi nebezpečenstvami sa [Concept('expedition','výpravu')|e] vyhne pohrome" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 seven_cities.11.title: "Hostina na privítanie" # todo: NEW TRANSLATION
 seven_cities.11.desc: "[target_location.GetRank.GetName] nám vychádza v ústrety ešte predtým, než stihneme rozbiť tábor: bubny, pozametané námestie a rohože pokryté väčším množstvom jedla, než aké muži videli za celý mesiac pochodu. Ich náčelník víta [target_leader.GetName] s vážnou zdvorilosťou, akú preukazuje rovnému, a hostina je v plnom prúde skôr, než niekomu napadne položiť otázku. Naši tlmočníci šepkajú, že také vrúcne privítanie nikdy nie je zadarmo a že to, čo hosť dostane v jednom okamihu, sa mu v ďalšom môže započítať na ťarchu. Napriek tomu otvorený hostiteľ a preplnený stôl rozviazali viac jazykov než akákoľvek hrozba, ktorú by sme mohli vysloviť." # todo: NEW TRANSLATION
 seven_cities.11.a: "Odpovedzme na ich privítanie otvorenou náručou a mešcami." # todo: NEW TRANSLATION
 seven_cities.11.b: "Nepreplavili sme oceán, aby sme tu sedeli a jedli." # todo: NEW TRANSLATION
 seven_cities.11.b.tt: "#italic Prijmeme jedlo, no ušetríme si mešce a vyrazíme skôr, než sa z privítania stane záväzok#!" # todo: NEW TRANSLATION
 seven_cities.11.historical_info: "Obradná pohostinnosť bola v mnohých častiach Ameriky kľúčovou súčasťou diplomacie a prichádzajúcich Európanov často vítali hostinami, darmi a formálnym prijatím ešte predtým, než sa začalo rokovať. Koronadova výprava našla ubytovanie a jedlo v pueblách pozdĺž rieky Rio Grande a de Sotova v mississippských náčelníctvach na juhovýchode; v oboch prípadoch išlo o spôsob, ako zvládnuť nebezpečných cudzincov, nie sa im podriadiť. Európania nosili sklenené koráliky, jastrabie zvonce, látky a nože výslovne na nadväzovanie takýchto výmen. Darmi si získavali priazeň a informácie, no obe strany takmer vždy chápali túto výmenu úplne odlišne." # todo: NEW TRANSLATION
 expedition_receives_guides_and_porters: "#Y Na výpravu sa pridajú sprievodcovia a nosiči#!" # todo: NEW TRANSLATION
 expedition_less_likely_to_stall_tt: "Je menej pravdepodobné, že [Concept('expedition','výprava')|e] uviazne" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 expedition_receives_exotic_goods: "#Y [Concept('expedition','Výprava')|e] vymení tovar za exotické miestne výrobky, ktoré odvezie domov#!" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 seven_cities.12.title: "Ochotný sprievodca" # todo: NEW TRANSLATION
 seven_cities.12.desc: "Našiel si nás, nie my jeho: štíhly muž s ľahkým úsmevom, ktorý akoby cestou pochytil kúsok každého jazyka, a prisahá s rukou na srdci, že na vlastné oči stál pred bránami zlatého mesta. Žiada len sprievodcovskú mzdu a skromný podiel na sláve, ak nás tam zavedie. [target_leader.GetName] ho počúva s nacvičenou obozretnosťou človeka, ktorý už počul presne takýto sľub v iných údoliach z úst iných ľudí. Muži si však už utvorili názor a ich oči žiaria rovnako jasne ako jeho." # todo: NEW TRANSLATION
 seven_cities.12.a: "Za bohatstvom a slávou!" # todo: NEW TRANSLATION
 seven_cities.12.b: "Preč s tebou, odporný žobrák!" # todo: NEW TRANSLATION
 seven_cities.12.b.tt: "#italic Zaženieme usmievavého sprievodcu a budeme sa držať cesty, ktorú si vieme nájsť sami#!" # todo: NEW TRANSLATION
 seven_cities.12.historical_info: "Najznámejším sprievodcom severoamerických #italic entradas#! bol zajatec z prérií, ktorého Španieli nazývali El Turco. Koronadovej výprave rozprával o Quivire, kráľovstve na severovýchode, ktoré vraj oplývalo zlatom. Viedol výpravu celé týždne na Veľké planiny a neskôr pri výsluchu priznal, že ju zámerne zavádzal do trávnatých pustín v nádeji, že tam muži aj kone zahynú. Keď napokon dorazili do Quiviry, ukázalo sa, že ide o zhluk dedín Wichitov s trávou pokrytými obydliami a bez štipky zlata. El Turca popravili. Tento prípad bol typický: sprievodcovia mali vlastné dôvody, prečo viedli ozbrojených cudzincov určitým smerom, a tieto dôvody sa len zriedka zhodovali so zámermi výpravy." # todo: NEW TRANSLATION
 expedition_uncovers_riches_in_new_waypoint: "#Y Sprievodcovova cesta sa ukáže ako správna a odhalí skutočné bohatstvo#!" # todo: NEW TRANSLATION
 expedition_led_to_deathly_trap: "#Y Sprievodca nás zavedie do zálohy a [Concept('expedition','výprava')|e] bude zničená#!" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 guide_lied_waste_of_time: "#Y Sprievodca nás vodil v kruhu a jeho zlaté mesto bolo klamstvo#!" # todo: NEW TRANSLATION
 target_character_flogged_tt: "Klamárskeho sprievodcu zbičujú za jeho podvod" # todo: NEW TRANSLATION
 seven_cities.13.title: "Známy jazyk" # todo: NEW TRANSLATION
 seven_cities.13.desc: "Niekedy počas pochodu sa [target_leader.GetName] zmenil. Kým predtým [target_leader.GetSheHe] hovoril iba o meste pred nami, teraz [target_leader.GetSheHe] hovorí o tunajších ľuďoch: o ich jazyku, ktorý sa [target_leader.GetSheHe] napoly naučil, o streche nad hlavou, ktorú mu ponúkli, a o usadenom živote, ktorý čaká, ak sa [target_leader.GetSheHe] prestane túlať. Dnes ráno nám [target_leader.GetSheHe|U] jasne oznámil, že výprava môže pokračovať, ale [target_leader.GetSheHe] už nie. Niektorých mužov pohltí divočina a niektorých si, zdá sa, privlastní." # todo: NEW TRANSLATION
 seven_cities.13.a: "Nech [target_leader.GetHerHim] teda zostane a nech sa tu sen skončí." # todo: NEW TRANSLATION
 seven_cities.13.historical_info: "Európania, ktorí stroskotali alebo padli do zajatia a roky žili medzi domorodými národmi, boli pre neskoršie výpravy cennými tlmočníkmi. Hernando de Soto našiel Juana Ortiza, ktorý prežil skoršiu výpravu Narváeza a po jedenástich rokoch žil medzi Uzitmi na Floride. Ortiz mu slúžil ako tlmočník až do svojej smrti počas pochodu. Gonzalo Guerrero, ktorý stroskotal pri pobreží Yucatánu v roku 1511, sa vydal celkom inou cestou: oženil sa v mayskej komunite, odmietol záchranu a údajne padol v boji proti Španielom. Takíto muži boli živými mostmi medzi svetmi a ich vernosť sa mohla prikloniť na ktorúkoľvek stranu." # todo: NEW TRANSLATION
 seven_cities.14.title: "Prameň mladosti?" # todo: NEW TRANSLATION
 seven_cities.14.desc: "Príbeh sa k nám dostane z tretej ruky a pri každom ďalšom rozprávaní narastá: kdesi v kopcoch za nami leží prameň, ktorého voda zacelí staré rany, narovná zhrbený chrbát a vráti človeku roky, ktoré mu pochod vzal. Domorodci o ňom hovoria s úctivou zdržanlivosťou, akú si vyhradzujú pre posvätné miesta. To môže dokazovať čokoľvek, alebo vôbec nič. Náš chirurg prevracia oči a mrmlá čosi o močiarnej horúčke. Polovica tábora si už plní čutory." # todo: NEW TRANSLATION
 seven_cities.14.a: "Preskúmajme prameň." # todo: NEW TRANSLATION
 seven_cities.14.b: "Nemáme čas čľapkať sa vo vode!" # todo: NEW TRANSLATION
 seven_cities.14.b.tt: "#italic Pôjdeme popri povestnom prameni a jeho vodu prenecháme dôverčivým#!" # todo: NEW TRANSLATION
 seven_cities.14.historical_info: "Prameň mladosti bol skutočnou súčasťou geografických povestí, ktoré si Európania priniesli do Ameriky, a spájal sa s výpravou Juana Ponce de Leóna na Floridu v roku 1513. Tvrdenie, že sa plavil vyslovene za vodou obnovujúcou mladosť, je zväčša neskorším prikrášlením, ktoré ako prvé šírili jeho politickí nepriatelia. Vychádzalo však zo starších povestí Starého sveta o liečivých prameňoch predlžujúcich život, ktorým ľudia široko verili. Domorodí informátori v Karibiku a na juhovýchode skutočne viedli Európanov k posvätným a liečivým vodám, ktoré boli skutočnou súčasťou ich obradných krajín. Rozdiel medzi tým, čo opisovali, a tým, čo Európania hľadali, bol opäť obrovský." # todo: NEW TRANSLATION
 spend_some_time_recovering: "#Y Muži si na chvíľu oddýchnu a naberú síl pri prameni#!" # todo: NEW TRANSLATION
 retrieve_some_rejuvenating_water: "#Y Odnesieme si čutory povestnej omladzujúcej vody#!" # todo: NEW TRANSLATION
 just_water_hole: "#Y Ukáže sa, že je to obyčajná napájadlová jama...#!" # todo: NEW TRANSLATION
 seven_cities.15.title: "Záblesk v riečnom dne" # todo: NEW TRANSLATION
 seven_cities.15.desc: "Jeden z mužov si za súmraku kľakne k potoku a preplachuje štrk v mise tak, ako ho to naučili starí harcovníci. Vzápätí súčasne preklína aj sa smeje: v nánose sa zachytilo jediné ligotavé zrnko [target_material.GetName]. Proti prúdu ho teda musí byť viac. Či ide o poklad, za ktorým sa celá výprava hnala naprieč kontinentom, alebo len o bezcenný ligot, na ktorý sa dajú nachytať chamtivci, dnes večer nik nevie a nik sa to ani veľmi nechce pýtať." # todo: NEW TRANSLATION
 seven_cities.15.a: "Všetci k rieke, každý s panvicou." # todo: NEW TRANSLATION
 seven_cities.15.b: "Pche! Určite je to len pyrit!" # todo: NEW TRANSLATION
 seven_cities.15.historical_info: "#italic Sierra de la Plata#!, Strieborné pohorie, bola legenda, ktorá od 20. rokov 16. storočia lákala španielske a portugalské výpravy hlboko do povodia rieky Río de la Plata a dala meno rieke i neskôr celej krajine. Povrávalo sa o nej s istým základom: hoci len nejasne, ukazovala na skutočné strieborné bohatstvo Ánd, predovšetkým na horu Potosí, ktorej objav v roku 1545 zmenil svetové hospodárstvo. Muži, ktorí sa vydali proti prúdu podľa prvých správ, však väčšinou nachádzali útrapy a nepriateľské krajiny, nie striebro, a povestné pohorie pred nimi celé pokolenie stále ustupovalo. Trocha kovu vyryžovaného z riečneho dna bola často jedinou hmatateľnou známkou toho, že príbeh nebol úplne vymyslený." # todo: NEW TRANSLATION
 expedition_brings_back_valuable_materials: "#Y Vzácnu rudu vyťažíme a odvezieme na trh v hlavnom meste [ROOT.GetCountry.GetCapital.GetAltAdjective('L')]#!" # todo: NEW TRANSLATION # todo: COUNTRY CASE
 study_their_technique: "#Y Osvojíme si nové banské metódy, vďaka ktorým zlacnie rozširovanie baní a obohatia sa naše najlepšie ložiská#!" # todo: NEW TRANSLATION
 men_are_met_by_hunger_and_false_legends: "#Y Riečne dno nám prinesie len hlad a falošné nádeje#!" # todo: NEW TRANSLATION
 expedition_outcome_severely_hindered_tt: "Prídeme o jednu z ťažko získaných stôp" # todo: NEW TRANSLATION
 hunt_for_precious_metals_target_mining_location_goes_cold_tt: "#italic Vzdáme hľadanie kovu a budeme pokračovať v pochode#!" # todo: NEW TRANSLATION
 seven_cities.16.title: "Pohostinnosť náčelníka" # todo: NEW TRANSLATION
 seven_cities.16.desc: "[target_location.GetRank.GetName] je veľká a dobre udržiavaná a jej náčelník nás prijíma s obozretnou zdvorilosťou, ktorá ho zjavne niečo stojí. Jeho sýpky sú plné a jeho mladí muži poznajú každú cestu do vnútrozemia. Zároveň má všetky dôvody chcieť, aby sme do rána odišli. Naši dôstojníci hľadia na sýpky a odpočívajúcich silných mladíkov a vidia v nich nosičov a sprievodcov, ktorých možno získať. [target_leader.GetName] musí rozhodnúť, či sa tu pokúsime dohodnúť, alebo si vezmeme, čo potrebujeme, a následky necháme na tých, čo prídu po nás." # todo: NEW TRANSLATION
 seven_cities.16.a: "Zajmime náčelníka a prinúťme jeho ľudí pochodovať pod hrozbou kopijí." # todo: NEW TRANSLATION
 seven_cities.16.b: "Dohodnime sa na dobrovoľných nosičoch a rozíďme sa v dobrom." # todo: NEW TRANSLATION
 seven_cities.16.c: "Nechajme ich na pokoji. Zbaľme tábor a pokračujme." # todo: NEW TRANSLATION
 seven_cities.16.c.tt: "#italic Necháme náčelníka na pokoji a vyrazíme ďalej bez rukojemníkov či nosičov#!" # todo: NEW TRANSLATION
 the_captive_chief_yields_guides: "#Y Zajatý náčelník nám poskytne sprievodcov, ktorí poznajú cesty do vnútrozemia#!" # todo: NEW TRANSLATION
 the_chiefs_hall_is_plundered: "#Y Pred odchodom vyrabujeme náčelníkovu sieň a oberieme ju o všetky cennosti#!" # todo: NEW TRANSLATION
 the_village_empties_before_us: "#Y [target_location.GetRank.GetName] cez noc zmizne v lese, aj so všetkými sprievodcami#!" # todo: NEW TRANSLATION
 coerced_locals_resent_us_tt: "Naše [Concept('cultural_opinion','kultúrny názor')|e] o kultúre [target_location.GetDominantCulture.GetName] sa zhorší" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 seven_cities.16.historical_info: "Hernando de Soto pri prechode juhovýchodom zvyčajne po príchode zajal miestneho #italic cacique#!, teda najvyššieho náčelníka, a držal ho ako rukojemníka, aby si zaistil jedlo, nosičov a sprievodcov pre ďalšiu etapu pochodu. Zajatého pána prepustili alebo vymenili za susedného náčelníka na hranici jeho územia a celý postup zopakovali. Táto taktika krátkodobo fungovala, no za výpravou zanechávala rozvrátené náčelníctva, rozbité spojenectvá a trvalú nenávisť. Závisela tiež od mississippského usporiadania, v ktorom mali moc jednotliví náčelníci, a tam, kde bola autorita rozptýlenejšia, žalostne zlyhávala." # todo: NEW TRANSLATION
 seven_cities.17.title: "Správy od pobrežia" # todo: NEW TRANSLATION
 seven_cities.17.desc: "Ľudia z pobrežia k nám priplávajú skôr, než sa kotva vôbec dotkne dna. Do popoludnia s nami vymieňajú ryby a čerstvé ovocie a ešte rýchlejšie si vymieňajú zvesti. Je zjavné, že to už robili aj predtým. Za nôž či kus látky nám povedia, čo leží za líniou stromov, a hovoria o tom s nadšením, pričom stále ukazujú do vnútrozemia a ďalej. Z pláže nemožno zistiť, či nás vedú k pravde, alebo len k svojim susedom." # todo: NEW TRANSLATION
 seven_cities.17.a: "Vymeňme tovar za správy o vnútrozemí." # todo: NEW TRANSLATION
 seven_cities.17.b: "Zaznačme kotvisko a pripojme sa k výprave." # todo: NEW TRANSLATION
 seven_cities.17.b.tt: "#italic Zaznačíme kotvisko do máp a bez dohadovania o povestiach sa pripojíme k výprave#!" # todo: NEW TRANSLATION
 the_shore_folk_point_the_way: "#Y Ľudia z pobrežia nám ukážu priamu cestu k tomu, čo hľadáme#!" # todo: NEW TRANSLATION
 the_shore_market_yields_goods: "#Y Čulý obchod na piesku naplní naše nákladné priestory miestnym tovarom#!" # todo: NEW TRANSLATION
 the_shore_folk_send_us_at_their_rivals: "#Y Ich pokyny nás povedú v kruhu k nejakej znepriatelenej dedine#!" # todo: NEW TRANSLATION
 may_bring_us_closer_and_fill_our_holds_tt: "Môže nás to priblížiť k odhaleniu toho, čo hľadáme, a naplniť naše nákladné priestory miestnym tovarom" # todo: NEW TRANSLATION
 seven_cities.17.historical_info: "Pobrežné národy boli zvyčajne prvými obyvateľmi Ameriky, s ktorými sa výprava stretla, a stali sa jej prvým zdrojom informácií o vnútrozemí. Kontakty Verrazzana a Cartiera pozdĺž severoatlantického pobrežia, prvé španielske vylodenia v Karibiku aj stretnutia Portugalcov na brazílskom pobreží sa riadili rovnakým vzorcom: opatrný obchod, vzájomné obhliadanie a prúd geografických povestí smerujúcich od pobrežia do vnútrozemia. Pobrežné komunity často povzbudzovali cudzincov, aby pokračovali ďalej do vnútrozemia, či už sa ich chceli zbaviť, alebo presmerovať ich požiadavky na súperov. Správy o vnútrozemí tak boli ovplyvnené vlastnými záujmami pobrežných obyvateľov dávno predtým, než sa dostali k európskym ušiam." # todo: NEW TRANSLATION
 seven_cities.18.title: "Bezpečný prístav" # todo: NEW TRANSLATION
 seven_cities.18.desc: "Tento prístav je všetkým, v čo by mohla unavená výprava dúfať. Je hlboký a dobre chránený, do širokej pláže, na ktorej možno lode vytiahnuť na breh a očistiť im trupy od hniloby, steká sladká voda. Posádky potrebujú oddych rovnako naliehavo ako trámy opravu. No flotila vytiahnutá na pláž nikam nepláva a nečinní muži v cudzej krajine majú talent nájsť si problémy. [target_leader.GetName] zvažuje, koľko dní zaberie dôkladná oprava, a porovnáva to so stavom lodí a náladou posádok." # todo: NEW TRANSLATION
 seven_cities.18.a: "Vytiahnime lode na breh, očistime trupy a poriadne doplňme zásoby." # todo: NEW TRANSLATION
 seven_cities.18.b: "Odpočívajme jednu noc a potom vyplávajme." # todo: NEW TRANSLATION
 seven_cities.18.b.tt: "#italic Doprajeme posádkam jedinú noc na brehu a vyplávame skôr, než lode zapustia korene#!" # todo: NEW TRANSLATION
 the_refit_goes_smoothly: "#Y Opravy prebehnú hladko a lode sa nám za ne odvďačia lepším stavom#!" # todo: NEW TRANSLATION
 a_wreck_yields_salvage: "#Y Posádky rozoberú vrak hnijúci v plytčine a zachránia všetko, čo sa dá#!" # todo: NEW TRANSLATION
 the_crew_falls_to_brawling: "#Y Posádky sa počas nečinnosti na brehu pustia do bitiek a obnovenie poriadku nás zdrží o niekoľko dní#!" # todo: NEW TRANSLATION
 seven_cities.18.historical_info: "Chránený prístav bol nevyhnutný pre každú výpravu, ktorá cestovala aspoň čiastočne po mori. Poskytoval miesto na vytiahnutie a opravu trupov, doplnenie sladkej vody a palivového dreva i oddych vyčerpaným posádkam. Magellanova flotila prezimovala päť mesiacov v Puerto San Julián na pobreží Patagónie. Vynútená prestávka tam viedla aj k vzbure, ktorú Magellan potlačil s veľkou krutosťou. Prieskumníci často strávili opravami v takýchto kotviskách viac času než plavbou a dobrý prístav s priateľským alebo ľahostajným miestnym obyvateľstvom mohol rozhodnúť, či výprava bude pokračovať, alebo sa rozpadne. Rozhodnutie, kde zastaviť, malo často rovnako vážne dôsledky ako rozhodnutie, kam sa vydať." # todo: NEW TRANSLATION
 seven_cities.20.title: "Táto krajina nás neuživí" # todo: NEW TRANSLATION
 seven_cities.20.desc: "Krajina, ktorou prechádzame, je suchšia a pustejšia, než nám vraveli pred odchodom. Súpravy začínajú zlyhávať. Muži už desať dní dostávajú polovičné dávky. Miestne dediny ukryli zásoby alebo ich spálili. Čerstvá voda je len v dvoch z každých šiestich údolí, ktorými prejdeme. [target_leader.GetName] zvoláva dôstojníkov do tieňa tŕnistého stromu a pýta sa, ako ďaleko ešte dokážu pokračovať bez zásob." # todo: NEW TRANSLATION
 seven_cities.20.a: "Nakúpme zásoby za každú cenu." # todo: NEW TRANSLATION
 seven_cities.20.b: "Zastavme a nechajme mužov odpočinúť." # todo: NEW TRANSLATION
 seven_cities.20.historical_info: "Zásobovanie bolo pri prieskume amerického vnútrozemia neustálym problémom. Cortésovo vojsko sa živilo najmä vďaka politickému kolapsu aztéckej moci, ktorý umožnil Tlaxcalanom a ďalším spojencom zásobovať ho. Koronadova výprava na juhozápad takúto podporu nemala a pri postupe na sever postupne hladovala. Tento vzorec sa opakoval od Floridy po Patagóniu: každá #italic entrada#!, ktorá nedokázala kúpiť ani vziať jedlo v krajine, cez ktorú prechádzala, sa na ceste rozpadla bez ohľadu na to, koľko zlata ležalo za jej hranicami." # todo: NEW TRANSLATION
 seven_cities.21.title: "Prepad v kaňone" # todo: NEW TRANSLATION
 seven_cities.21.desc: "Výprava vstúpila do úzkej tiesňavy medzi dvoma vápencovými stenami a domorodci jej za chrbtom uzavreli cestu. Zhora pršia šípy, na dne kaňonu číhajú bojovníci s kamennými kyjakmi a súprava sa rozbieha na všetky strany. Muži robia to, čo v takejto situácii robili vždy: sformujú sa do ježka a chrbtami sa oprú o skalu. [target_leader.GetName] sa radí so seržantmi. Môžeme si cestu cez kaňon preraziť za cenu strát, alebo ustúpiť, odkiaľ sme prišli, a nájsť inú cestu." # todo: NEW TRANSLATION
 seven_cities.21.a: "Prebojujme sa kaňonom pomocou ocele a pušného prachu." # todo: NEW TRANSLATION
 seven_cities.21.b: "Stiahnime sa a nájdime inú cestu." # todo: NEW TRANSLATION
 seven_cities.21.historical_info: "Domorodá taktika prepadov zo zálohy v teréne, ktorý sa dal dobre brániť — v úzkych kaňonoch, horských priesmykoch a lesných chodníkoch — bola najúčinnejšou formou odporu proti raným koloniálnym #italic entradas#!. Španielske brnenie, strelné zbrane a kone poskytovali rozhodujúcu výhodu na otvorenom priestranstve, v členitom teréne ju však systematicky strácali. Približne polovicu Coronadových pochodov na juhozápade tvorili nútené obchádzky území, cez ktoré jeho výprava nemohla bezpečne prejsť. Rovnaký vzorec viedol k dlhému radu neúspešných francúzskych a anglických výprav do vnútrozemia Severnej Ameriky pred osemnástym storočím." # todo: NEW TRANSLATION
 seven_cities.22.title: "Staroveká ruina" # todo: NEW TRANSLATION
 seven_cities.22.desc: "Chodník vedie na hrebeň a odtiaľ sa otvára výhľad na to, čo kedysi bývalo mestom. Hradby sú kamenné, strechy sa väčšinou prepadli a ulice zarastajú storočnými stromami. Niet tu ľudí. Už nejaký čas tu nikto nežije. Prieskumníci obchádzajú obvod s úctivým odstupom, kronikár si kreslí náčrt a kňaz uvažuje, či má vstúpiť, pretože sa hovorí, že tí, čo znesvätia mŕtve mestá, ochorejú. [target_leader.GetName] dáva kresliarovi hodinu." # todo: NEW TRANSLATION
 seven_cities.22.a: "Zaznamenajme ruinu, než potiahneme ďalej." # todo: NEW TRANSLATION
 seven_cities.22.historical_info: "Predkolumbovská Amerika bola plná opustených sídlisk: mississippských mohýliskových centier na juhovýchode, veľkých pueblových stavieb na juhozápade, samotného Chaca, panvy Tiwanaku v Andách či mayských miest na juhu Yucatánu. Európski prieskumníci, ktorí v šestnástom storočí putovali týmito krajinami, bežne narážali na kamenné stavby, poľnohospodárske terasy a obradné centrá opustené pred storočím či ešte dávnejšie. Európania sa vytrvalo domnievali, že tieto ruiny museli vybudovať dávni Európania alebo obyvatelia Stredomoria — Walesania, Feničania či stratené kmene Izraela. Táto predstava sa šírila už v 40. rokoch 16. storočia a na niektorých miestach pretrvala až do dvadsiateho storočia." # todo: NEW TRANSLATION
 seven_cities.30.title: "Stopa sa stráca" # todo: NEW TRANSLATION
 seven_cities.30.desc: "Výprava dorazila na miesto stretnutia, ktoré sprievodcovia opísali ako bránu do krajiny, ktorú sme mali nájsť. Žiadna brána tu nie je. Sprievodcovia buď klamali, alebo si sami nahovárali, že hovoria pravdu; prieskum okolitých pahorkov neodhalil nijaké mesto, dym, cestu ani známku toho, že by tu v živej pamäti niekto bol. [target_leader.GetName] píše korune so žiadosťou o pokyny, no potom list pokrčí, pretože kým dorazí do prístavu, výprava sa už rozhodne sama. Sú dve možnosti: pokračovať ďalej do krajiny bez ohľadu na všetko v nádeji, že mesto leží ešte o údolie ďalej, alebo obrátiť výpravu a vrátiť sa domov s tým, čo máme." # todo: NEW TRANSLATION
 seven_cities.30.a: "Pokračujme ďalej k mestu, nech sa deje čokoľvek." # todo: NEW TRANSLATION
 seven_cities.30.b: "Vráťme sa a podajme pravdivé hlásenie." # todo: NEW TRANSLATION
 seven_cities.30.historical_info: "Typickým koncom neúspešných #italic entradas#! nebol dramatický masaker, ale pomalé vyhasínanie: výprave dochádzali zásoby, prichádzala o prieskumníkov pre choroby a dezerciu a zisťovala, že každá sľubovaná významná lokalita je buď výsledkom nedorozumenia, alebo klamstvom. Napokon preživší dôstojníci obrátili mužov späť a odviedli ich domov cez územie, o ktorom už vedeli, že je prázdne. Coronadova výprava, Cabrillova výprava, De Sotova výprava aj Aguirrova výprava po Amazonke nasledovali túto trajektóriu, viac či menej. Úspešné #italic entradas#! s podobne veľkolepými cieľmi boli také zriedkavé, že sa na ne spomínalo ešte celé stáročia." # todo: NEW TRANSLATION

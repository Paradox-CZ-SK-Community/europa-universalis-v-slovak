l_polish:
 holy_war.11.title: "Nájazdníci na hraniciach" # todo: NEW TRANSLATION
 holy_war.11.desc: "Z [cabalgada_raider.GetName] sa cez naše pohraničie prehnala #italic cabalgada#!, vypaľovala dediny a odnášala všetko, čo mohla, než sa stiahla späť za hranice. Naše nechránené kraje zostali vydrancované. Povoláme odvody na ochranu pohraničia, alebo necháme túto urážku bez odozvy?" # todo: NEW TRANSLATION
 holy_war.11.a: "Zvolajme odvody na hranice!" # todo: NEW TRANSLATION
 holy_war.11.b: "Nezostáva nám nič iné, len to strpieť." # todo: NEW TRANSLATION
 holy_war.12.title: "Požiadavka na tribut" # todo: NEW TRANSLATION
 holy_war.12.desc: "Na náš dvor prichádzajú vyslanci z [parias_demander.GetName] s neúprosným odkazom: proti nám sa pripravuje [threatening_crusade.GetName] a ak nezaplatíme tribut, jeho vojská vtrhnú do našich krajín. Naši radcovia varujú, že naším zlatom si iba kúpime čas a utíšime ich krvilačnosť, no nikdy ju neuhasíme. Zaplatíme, aby sme odložili zúčtovanie, alebo sa im vzoprieme a pripravíme na búrku?" # todo: NEW TRANSLATION
 holy_war.12.a: "Zaplaťme tribut a získajme čas." # todo: NEW TRANSLATION
 holy_war.12.a.tt: "Odloží [Concept('crusade','križiacka výprava')|e], prípravy sa predĺžia o #G 30#! a náboženská horlivosť klesne o #G 10#!" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 holy_war.12.b: "Nedáme sa zastrašiť. Nech prídu." # todo: NEW TRANSLATION
 holy_war.12.b.tt: "Zvýši náboženskú horlivosť [Concept('crusade','križiacka výprava')|e] o #R 10#!" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 holy_war.13.title: "Neveriaci zaplatil" # todo: NEW TRANSLATION
 holy_war.13.desc: "Naša požiadavka priniesla ovocie. [parias_payer.GetName] zaplatil tribut, namiesto toho, aby čelil [threatening_crusade.GetName] nepripravený. Ich mince napĺňajú naše pokladnice a úľava, ktorú si kúpili, je iba dočasná. Svätá vojna sa len odkladá." # todo: NEW TRANSLATION
 holy_war.13.a: "Ich zlato poslúži svätej veci." # todo: NEW TRANSLATION
 holy_war.13.a.tt: "Zaplatili tribut" # todo: NEW TRANSLATION
 holy_war.14.title: "Neveriaci sa nám vzoprel" # todo: NEW TRANSLATION
 holy_war.14.desc: "[parias_payer.GetName] odmietol našu požiadavku na tribut a zvolil si vzdor. Ich drzosť len posilnila odhodlanie veriacich a ešte viac rozdúchala zápal [threatening_crusade.GetName]." # todo: NEW TRANSLATION
 holy_war.14.a: "Potom nech prehovorí meč." # todo: NEW TRANSLATION
 holy_war.14.a.tt: "Odmietli zaplatiť tribut" # todo: NEW TRANSLATION
 holy_war.15.title: "Nájazdníci z juhu" # todo: NEW TRANSLATION
 holy_war.15.desc: "Z [ghazw_raider.GetName] sa cez naše pohraničie prehnala #italic ḡazw#!, vypaľovala dediny a odnášala všetko, čo mohla, než sa stiahla späť za hranice. Naše nechránené kraje zostali vydrancované. Povoláme odvody na ochranu pohraničia, alebo necháme túto urážku bez odozvy?" # todo: NEW TRANSLATION
 holy_war.15.a: "Zvolajme odvody na hranice!" # todo: NEW TRANSLATION
 holy_war.15.b: "Nezostáva nám nič iné, len to strpieť." # todo: NEW TRANSLATION
 holy_war.16.title: "Nájazdníci z mora" # todo: NEW TRANSLATION
 holy_war.16.desc: "Korzári z [shore_raider.GetName] zaútočili na naše pobrežie, vyplienili prístavy a odviedli našich ľudí v reťaziach, než ich plachty zmizli za obzorom. Naše nechránené pobrežie zostalo vydrancované. Povoláme odvody na jeho ochranu, alebo necháme túto urážku bez odozvy?" # todo: NEW TRANSLATION
 holy_war.16.a: "Zvolajme odvody na pobrežie!" # todo: NEW TRANSLATION
 holy_war.16.b: "Nezostáva nám nič iné, len to strpieť." # todo: NEW TRANSLATION
 d009_holy_war.1.title: "Rády odpovedajú na výzvu" # todo: NEW TRANSLATION
 d009_holy_war.1.desc: "Vojenským rádom bolo odoslané povolanie a bratia sa zhromažďujú." # todo: NEW TRANSLATION
 d009_holy_war.1.desc_santiago: "[summoned_order.GetName] odpovedal na výzvu, a to v plnej sile. Jeho bratia pochodovali v šíku po ceste, osemsto kopijí pod mušľovou zástavou, a utáborili sa bez toho, aby im niekto musel ukázať miesto. [summoned_order.GetNameWithNoTooltip] bojuje v tejto vojne už dvesto rokov a jeho veľmajstrovi netreba vysvetľovať, o čo v ťažení ide.\n\nMá jedinú otázku, ktorú zdvorilo položí len raz: kde bude rád stáť v bojovej zostave?" # todo: NEW TRANSLATION
 d009_holy_war.1.desc_calatrava: "[summoned_order.GetName] odpovedal na výzvu. Jeho bratia dorazili spořiadane a mlčky, v bielych plášťoch s červeným krížom, s cisterciánskou disciplínou prenesenou na bojisko. Utáborili sa trochu bokom od vojska [ROOT.GetCountry.GetGovernment.GetAdjective], ako je ich zvykom.\n\nVeľmajster sa zúčastňuje našich porád, veľa toho nenahovorí a pri výbere terénu má vždy pravdu. Pýta sa, kde bude rád stáť v bojovej zostave." # todo: NEW TRANSLATION
 d009_holy_war.1.desc_alcantara: "[summoned_order.GetName] odpovedal na výzvu a priniesol so sebou aj pohraničie. Toto nie sú rytieri na turnajoch: sú to muži, ktorí v bežných rokoch strážia brody na Tahu, a prišli s vlastnými prieskumníkmi, sprievodcami aj vlastnými názormi na nepriateľa.\n\nVeľmajster sa pýta, kde bude rád stáť v bojovej zostave, tónom človeka, ktorý sa už rozhodol." # todo: NEW TRANSLATION
 d009_holy_war.1.desc_montesa: "[summoned_order.GetName] odpovedal na výzvu, čo ho zaviedlo ďalej od domova, než býva zvykom. Jeho bratia zverili svoje pobrežné veže nepočetnej stráži a vyrazili k nám, pričom si uvedomujú, akú poctu nám tým preukazujú.\n\nVeľmajster sa pýta, kde bude rád stáť v bojovej zostave a ako dlho ich budeme potrebovať." # todo: NEW TRANSLATION
 d009_holy_war.1.desc_avis: "[summoned_order.GetName] odpovedal na výzvu. Jeho bratia sú rovnako politickým zoskupením ako vojenským rádom a ich príchod je vyhlásením, komu táto vojna patrí.\n\nVeľmajster sa pýta, kde bude rád stáť v bojovej zostave. Sleduje, či mu odpoveď preukáže náležitú úctu." # todo: NEW TRANSLATION
 d009_holy_war.1.desc_christ: "[summoned_order.GetName] odpovedal na výzvu a je na tom čosi nezvyčajné. Toto sú bratia, ktorí financujú karavely a vedú spory o zemepisnú šírku, no teraz prišli do vnútrozemia v brnení, aby bojovali v obliehacej vojne.\n\nVeľmajster sa pýta, kde bude rád stáť v bojovej zostave, akoby nám pripomínal, že jeho rád bol založený práve na tento účel." # todo: NEW TRANSLATION
 d009_holy_war.1.a: "Zverte im predvoj." # todo: NEW TRANSLATION
 d009_holy_war.1.b: "Nech držia krídlo." # todo: NEW TRANSLATION
 d009_holy_war.2.title: "Bula bola udelená" # todo: NEW TRANSLATION
 d009_holy_war.2.desc: "Bula dorazila, zapečatená a jednoznačná. #italic Bula de Cruzada#! udeľuje odpustky tým, ktorí prispejú na vojnu proti neveriacim, a určuje náš [ROOT.GetCountry.GetFlavorRank] za nástroj tejto vojny.\n\nV praxi ide o povolenie vyberať peniaze od všetkých našich veriacich, farnosť po farnosti, s plnou autoritou [GetUniqueInternationalOrganization('catholic_church').GetName], ktorá stojí za vyberačmi. Naši [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] sa už opatrne vypytujú, kto bude peniaze vyberať a kto ich bude počítať." # todo: NEW TRANSLATION
 d009_holy_war.2.a: "Nech sa o nej káže v každej farnosti a pokladnicu zverme našim mužom." # todo: NEW TRANSLATION
 d009_holy_war.2.b: "Prijmime len dobrovoľné dary a počítanie zverme [GetUniqueInternationalOrganization('catholic_church').GetNameWithNoTooltip]." # todo: NEW TRANSLATION
 d009_holy_war.3.title: "Dobrovoľníci viery" # todo: NEW TRANSLATION
 d009_holy_war.3.desc: "Už celé týždne prichádzajú: ḡāzī z hôr, študenti z #italic madras#!, bratstvá z miest, od ktorých sme nikdy nevyberali dane. Niektorí priviedli kone. Mnohí si priniesli iba odhodlanie.\n\nNie sú to vojaci a nemožno im veliť ako vojakom. Ak ich však včas pošleme proti nepriateľovi, budú mať oveľa väčšiu cenu, než by naznačovala ich výzbroj." # todo: NEW TRANSLATION
 d009_holy_war.3.a: "Okamžite ich pošlime na sever." # todo: NEW TRANSLATION
 d009_holy_war.3.b: "Podržme ich a najprv z nich vycvičme vojakov." # todo: NEW TRANSLATION
 d009_holy_war.4.title: "Preplavenie" # todo: NEW TRANSLATION
 d009_holy_war.4.desc: "Flotila previezla vojsko a zástavy už vejú na severnom brehu.\n\nKaždý veliteľ, ktorý to už zažil, pozná počty: [ShowLocationName('strait_of_gibraltar')] máme za chrbtom, flotila tu nemôže zostať a o mesiac budeme mať len to, čo si dovtedy udržíme. O ťažení rozhodnú prvé dni." # todo: NEW TRANSLATION
 d009_holy_war.4.a: "Zaútočme do vnútrozemia, kým sa ešte zhromažďujú." # todo: NEW TRANSLATION
 d009_holy_war.4.b: "Najprv zabezpečme vylodenie a prístavy." # todo: NEW TRANSLATION
 d009_holy_war.5.title: "Po ḡazw" # todo: NEW TRANSLATION
 d009_holy_war.5.desc: "Nájazdníci sa vrátili za hranice a ženú pred sebou dobytok aj zajatcov. Celý kraj vyšiel von, aby ich sledoval pri návrate.\n\nTeraz treba rozdeliť korisť a na toto delenie sa dohliada pozornejšie než na samotný nájazd. ḡāzī vyrazili za [ROOT.GetCountry.GetReligion.GetGodName] aj za korisťou, hoci by najradšej neprezradili, v akom poradí." # todo: NEW TRANSLATION
 d009_holy_war.5.a: "Korist patrí tým, ktorí ju získali." # todo: NEW TRANSLATION
 d009_holy_war.5.b: "Pokladnica si vezme povinnú pätinu." # todo: NEW TRANSLATION
 d009_holy_war.6.title: "Korist korzárov" # todo: NEW TRANSLATION
 d009_holy_war.6.desc: "Eskadra sa vrátila s plnými loďami. [ShowGoodsName('cloth')], mince, kostolné cennosti a dvesto zajatcov z pobrežia, ktoré si myslelo, že leží príliš ďaleko na severe, aby sa oplatila plavba.\n\nKapitáni sú na brehu a míňajú peniaze. #italic qāḍī#! má otázky o osude zajatcov a pokladnica sa vypytuje na všetko ostatné." # todo: NEW TRANSLATION
 d009_holy_war.6.a: "Vykúpme zajatcov a vezmime si zisk." # todo: NEW TRANSLATION
 d009_holy_war.6.b: "Usaďme ich tam a nech sa pobrežie dozvie, kam až dosiahneme." # todo: NEW TRANSLATION

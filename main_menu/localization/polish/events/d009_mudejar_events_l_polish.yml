l_polish:
 d009_mudejar.1.title: "Charta aljamy" # todo: NEW TRANSLATION
 d009_mudejar.1.entry: "$d009_mudejar.1.title$" # todo: NEW TRANSLATION
 d009_mudejar.1.desc: "V našich mestách zostávajú [ShowReligionGroupAdjective('muslim')] komunity organizované podobne ako pred reconquistou: pod vlastným kádiom, viazané vlastnými zvykmi a spoločne zodpovedné [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')] namiesto toho, aby sa jednotlivo zodpovedali ktorémukoľvek pánovi, ktorý by si na ne mohol robiť nárok. Naši [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')] žiadajú o formálnu chartu, ktorá by túto samosprávu uznala za trvalé právo, nie iba za tolerovaný zvyk. Otvorene argumentujú, že zabezpečená aljama platí dane spoľahlivejšie než taká, ktorá cíti krivdu. Naši [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] vnímajú rovnaké usporiadanie celkom inak: ako anomáliu, ktorú by [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('crown_estate')] malo napraviť, nie zakotviť v zákone. Teraz stojíme pred závažným rozhodnutím, či [ShowReligionGroupAdjectiveWithNoTooltip('muslim')] autonómia v tejto ríši spočíva na charte, alebo len na trpezlivosti samotného [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('crown_estate')]." # todo: NEW TRANSLATION
 d009_mudejar.1.a: "Udeľme chartu." # todo: NEW TRANSLATION
 d009_mudejar.1.b: "Odoprieme im samosprávu." # todo: NEW TRANSLATION
 d009_mudejar.1.b.tt: "Naši [ShowReligionGroupAdjectiveWithNoTooltip('muslim')] poddaní sa búria proti prísnejšiemu dohľadu [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')]" # todo: NEW TRANSLATION
 d009_mudejar.1.historical_info: "Mudéjarske komunity naprieč kresťanskou Ibériou zvyčajne žili na základe chart, niekedy nazývaných #italic cartas de población#! alebo privilégiá aljamy. Tie im výmenou za dane a vernosť korune zaručovali určitú mieru samosprávy nad vlastnými súdmi, mešitami a vnútornými záležitosťami. Štedrosť týchto chart sa v jednotlivých kráľovstvách značne líšila a v priebehu 15. a 16. storočia sa ich rozsah postupne zmenšoval, keďže kráľovská tolerancia voči islamu na kresťanskom území upadala." # todo: NEW TRANSLATION
 d009_mudejar.2.title: "Štvrť mudéjarov sa rozrastá" # todo: NEW TRANSLATION
 d009_mudejar.2.entry: "$d009_mudejar.2.title$" # todo: NEW TRANSLATION
 d009_mudejar.2.desc: "[ShowReligionGroupAdjective('muslim')] štvrť v [target_location.GetName] prerástla hranice, ktoré jej boli vymedzené pred generáciami. V starých uličkách pribúdajú nové dielne a rodiny žiadajú o pozemky za tradičným okrajom štvrte. Tvrdia, že remeslo, ktoré nemá priestor na rast, pomaly zaniká. Naši úradníci na mieste sa v názore rozchádzajú: niektorí vidia daňové príjmy, ktoré sa oplatí podporovať, iní precedens, ktorý bude tým ťažšie zvrátiť, čím dlhšie ho necháme platiť." # todo: NEW TRANSLATION
 d009_mudejar.2.a: "Podporíme rozširovanie štvrte." # todo: NEW TRANSLATION
 d009_mudejar.2.b: "Obmedzíme ju na súčasné hranice." # todo: NEW TRANSLATION
 d009_mudejar.3.title: "Kapitulácie v [ShowLocationNameWithNoTooltip('granada')]" # todo: NEW TRANSLATION
 d009_mudejar.3.entry: "$d009_mudejar.3.title$" # todo: NEW TRANSLATION
 d009_mudejar.3.desc: "[ShowLocationName('granada')] padla a podmienky, ktoré náš [ROOT.GetCountry.GetGovernment.GetRulerTitle] prisľúbil jej [ShowReligionGroupAdjective('muslim')] obyvateľstvu, boli na pomery akéhokoľvek dobyvateľstva veľkorysé: sloboda vierovyznania, vlastné súdy a vlastné zvyky, všetko písomne zaručené. Pre desaťtisíce moslimov, ktorí sa vzdali na základe nášho slova, je teraz jedinou dôležitou otázkou, či tieto záruky obstojí pred dvorom, ktorý chce dokončiť to, čo sa začalo dobytím." # todo: NEW TRANSLATION
 d009_mudejar.3.a: "Dodržíme podmienky kapitulácií." # todo: NEW TRANSLATION
 d009_mudejar.3.b: "Okamžite vyvinieme nátlak na konverziu." # todo: NEW TRANSLATION
 d009_mudejar.3.b.tt: "[ShowReligionGroupAdjectiveWithNoTooltip('muslim')] obyvateľstvo [ShowLocationNameWithNoTooltip('granada')] je otrasené porušeným sľubom" # todo: NEW TRANSLATION
 d009_mudejar.3.historical_info: "Kapitulácie Granady, podpísané v novembri 1491 v rámci dohody o kapitulácii emirátu, zaručovali granadským moslimom slobodu vierovyznania, používania vlastného jazyka a zvykov a pokračovanie uplatňovania moslimského práva pod vedením vlastných sudcov. V praxi sa tieto podmienky začali rúcať takmer okamžite po dobytí v roku 1492 a do desiatich rokov boli z veľkej časti opustené. Vyvrcholilo to nútenými konverziami v rokoch 1499 – 1502." # todo: NEW TRANSLATION
 variable_d009_gra_capitulations_honored_tt: "Kapitulácie Granady boli dodržané" # todo: NEW TRANSLATION
 d009_mudejar.4.title: "Cisneros v [ShowLocationNameWithNoTooltip('granada')]" # todo: NEW TRANSLATION
 d009_mudejar.4.entry: "$d009_mudejar.4.title$" # todo: NEW TRANSLATION
 d009_mudejar.4.desc: "Kardinál [target_character.GetName] prišiel do [ShowLocationNameWithNoTooltip('granada')] a sľubom, ktoré sa naša koruna kedysi zaviazala dodržať, venuje len malú pozornosť. Zatiaľ čo predchádzajúci arcibiskup hlásal pomalú konverziu presviedčaním, [target_character.GetHerHis] uprednostňovaným nástrojom je hromadný krst: celé štvrte privádzané ku krstiteľnici počas jediného popoludnia, dobrovoľne či nie. Naši [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] považujú [target_character.GetHerHis] horlivosť za dávno potrebnú; podmienky kapitulácie boli podľa [target_character.GetSheHe] len vojnovým opatrením, nie trvalým záväzkom." # todo: NEW TRANSLATION
 d009_mudejar.4.a: "Dovolíme Cisnerosovi konať." # todo: NEW TRANSLATION
 d009_mudejar.4.b: "Zadržíme Cisnerosa." # todo: NEW TRANSLATION
 d009_mudejar.4.historical_info: "Kardinál Francisco Jiménez de Cisneros, toledský arcibiskup a spovedník kráľovnej Izabely, prišiel do Granady v roku 1499. Sklamaný pomalým tempom dobrovoľných konverzií za svojho predchodcu Hernanda de Talaveru začal organizovať hromadné nútené krsty, ktoré priamo vyvolali prvé povstanie v Alpujarras. Historici jeho konanie vo všeobecnosti považujú za rozhodujúce porušenie sľubov z kapitulácií Granady." # todo: NEW TRANSLATION
 d009_mudejar.5.title: "[ROOT.GetCountry.GetAdjectiveWithNoTooltip] mudéjari" # todo: NEW TRANSLATION
 d009_mudejar.5.entry: "Mudéjari" # todo: NEW TRANSLATION
 d009_mudejar.5.desc: "Na náš [ROOT.GetCountry.GetGovernment.GetCourtTitle] dorazili správy, že susedné [ShowReligionGroupAdjective('christian')] ríše dokončujú vlastné ťaženia nútených konverzií svojich [ShowReligionGroupAdjective('muslim')] poddaných. Odvtedy len narastá tlak, aby sme to isté urobili s vlastnými mudéjarmi v [ROOT.GetCountry.GetAltAdjectiveWithNoTooltip('L')], ktorí stále otvorene praktizujú svoju vieru v mestách [ShowAreaName('aragon_area')] a [ShowAreaName('valencia_area')]. Naši [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] žiadajú rovnaký hromadný krst, aký už bol zavedený inde, zatiaľ čo naši [ShowReligionGroupAdjectiveWithNoTooltip('muslim')] poddaní poukazujú na stáročné charty, ktoré sľubovali opak. Tomuto [ROOT.GetCountry.GetGovernment.GetRulerTitle] už zostáva len veľmi málo priestoru na nečinnosť." # todo: NEW TRANSLATION # todo: COUNTRY CASE
 d009_mudejar.5.a: "Nariadime hromadný krst." # todo: NEW TRANSLATION
 d009_mudejar.5.a.tt: "Naše [ShowReligionGroupAdjectiveWithNoTooltip('muslim')] komunity v [ShowAreaName('aragon_area')] a [ShowAreaName('valencia_area')] budú násilne konvertované" # todo: NEW TRANSLATION
 d009_mudejar.5.b: "Oslobodíme ich od ediktu." # todo: NEW TRANSLATION
 d009_mudejar.5.historical_info: "Karol V. nariadil nútenú konverziu zostávajúceho mudéjarskeho obyvateľstva Aragónska v roku 1526, desaťročia po nútených konverziách v Kastílii v rokoch 1500 – 1502. Predchádzalo tomu povstanie valencijských Germanies, ktoré už z vlastnej iniciatívy násilne pokrstili mnohých moslimov. Aragónska šľachta, ktorá bola vo veľkej miere závislá od moslimskej poľnohospodárskej pracovnej sily, sa ediktu roky bránila a ten bol presadený až neskôr." # todo: NEW TRANSLATION
 d009_mudejar.6.title: "Moriskovia a agenti [GetCountry('TUR').GetAdjectiveWithNoTooltip]" # todo: NEW TRANSLATION
 d009_mudejar.6.entry: "$d009_mudejar.6.title$" # todo: NEW TRANSLATION
 d009_mudejar.6.desc: "Na náš dvor prichádzajú správy o tom, že moriskovské komunity si vymieňajú listy s agentmi sultána [GetCountry('TUR').GetNameWithNoTooltip], ktorý neskrýva sympatie ku kryptokresťanským [ShowReligionGroupAdjective('muslim')] obyvateľom [ShowRegionName('iberia_region')]. Nie je možné s istotou povedať, či tieto kontakty predstavujú sprisahanie, alebo iba tichú korešpondenciu ľudí, ktorí sa držia viery, ktorú už nemôžu otvorene vyznávať. Už samotné podozrenie však stačí na to, aby rozdelilo našu radu." # todo: NEW TRANSLATION
 d009_mudejar.6.a: "Zasiahneme proti týmto kontaktom." # todo: NEW TRANSLATION
 d009_mudejar.6.a.tt: "Dohľad nad našimi krypto-[ShowReligionGroupAdjectiveWithNoTooltip('muslim')]skými komunitami sa sprísňuje a obnovuje" # todo: NEW TRANSLATION
 d009_mudejar.6.b: "Nevšímajme si to." # todo: NEW TRANSLATION
 d009_mudejar.6.historical_info: "Španielske úrady sa počas 16. storočia skutočne obávali kontaktov moriskov s Osmanmi a berberskými korzármi, a mali na to dobrý dôvod: zachytené listy a niekoľko zdokumentovaných sprisahaní, najmä okolo 60. rokov 16. storočia, naznačovali, že aspoň niektoré moriskovské komunity dúfali v osmanský zásah proti Španielsku. Toto podozrenie priamo prispelo k tvrdším opatreniam, ktoré vyvrcholili povstaním v Alpujarras v roku 1568 a napokon dekrétom o vyhnaní z roku 1609." # todo: NEW TRANSLATION
 d009_mudejar.7.title: "Krypto-[ShowReligionGroupAdjectiveWithNoTooltip('muslim')]ský život pod inkvizíciou" # todo: NEW TRANSLATION
 d009_mudejar.7.entry: "$d009_mudejar.7.title$" # todo: NEW TRANSLATION
 d009_mudejar.7.desc: "Na základe našich [ShowPolicyName('local_courts')] sa začalo ďalšie kolo procesov proti domácnostiam nových [ShowReligionGroupAdjective('christian')] obyvateľov [target_location.GetName]. Ich súkromné pobožnosti nahlásili susedia, ktorí chcú bez akýchkoľvek pochybností dokázať vlastnú pravovernosť. Či tým tribunál očisťuje skutočnú herézu, alebo len terorizuje rodiny, ktoré [ShowReligionGroupName('muslim')] nepraktizujú už celú generáciu, ho zjavne veľmi nezaujíma." # todo: NEW TRANSLATION
 d009_mudejar.7.a: "Nech tribunál pokračuje v práci." # todo: NEW TRANSLATION
 d009_mudejar.7.a.tt: "Obyvateľstvo [target_location.GetNameWithNoTooltip] je unavené z neustáleho dohľadu tribunálu" # todo: NEW TRANSLATION
 d009_mudejar.7.b: "Potajomky komunitu varujeme." # todo: NEW TRANSLATION
 d009_mudejar.7.b.tt: "Obyvateľstvu [target_location.GetNameWithNoTooltip] varovanie potichu uľaví" # todo: NEW TRANSLATION
 d009_mudejar.7.historical_info: "Moriskovské komunity, ktoré navonok konvertovali, často celé generácie tajne praktizovali islam. Tento jav je dobre zdokumentovaný v záznamoch inkvizičných procesov, ktoré podrobne opisujú všetko od tajných modlitieb a stravovacích zvykov až po utajované zachovávanie znalosti arabčiny. Inkvizícia počas 16. storočia postupne zintenzívňovala prenasledovanie týchto komunít a práve to sa uvádzalo ako jeden z dôvodov neskoršieho dekrétu o vyhnaní z roku 1609." # todo: NEW TRANSLATION
 d009_mudejar.8.title: "Posledná otázka: vyhnanie alebo asimilácia?" # todo: NEW TRANSLATION
 d009_mudejar.8.entry: "$d009_mudejar.8.title$" # todo: NEW TRANSLATION
 d009_mudejar.8.desc: "Generácie nútených konverzií zanechali v [ROOT.GetCountry.GetAltAdjective('L')] komunity, ktoré sú podľa našich [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] [ShowReligionGroupAdjective('christian')] iba podľa mena, no vo všetkom podstatnom sú [ShowReligionGroupAdjective('muslim')]. Všetky susedné dvory už túto otázku nejako vyriešili a náš [ROOT.GetCountry.GetGovernment.GetRulerTitle] už nemôže odkladať rozhodnutie, či tieto nové [ShowReligionGroupAdjectiveWithNoTooltip('christian')] komunity predstavujú trvalé nebezpečenstvo, ktoré treba vyhnať, obyvateľstvo, ktoré treba trpezlivo začleniť, alebo si vyžadujú nejaké riešenie medzi týmito možnosťami." # todo: NEW TRANSLATION # todo: COUNTRY CASE
 d009_mudejar.8.a: "Vydáme edikt o vyhnaní." # todo: NEW TRANSLATION
 d009_mudejar.8.a.tt: "Naše krypto-[ShowReligionGroupAdjectiveWithNoTooltip('muslim')]ské komunity budú vyhnané do prístavov Maghrebu" # todo: NEW TRANSLATION
 d009_mudejar.8.b: "Presadíme integračný program." # todo: NEW TRANSLATION
 d009_mudejar.8.c: "Nariadime selektívne vyhnanie." # todo: NEW TRANSLATION
 d009_mudejar.8.historical_info: "Dekrét Filipa III. o vyhnaní, vydaný v roku 1609 a postupne presadzovaný až do roku 1614, napokon vyhnal zo Španielska odhadom 300 000 moriskov do Maroka, Tunisu, Alžíru a ďalších oblastí osmanského sveta. Išlo o jedno z najväčších nútených presunov obyvateľstva v ranonovovekých európskych dejinách. Jeho hospodárske dôsledky, najmä strata kvalifikovanej poľnohospodárskej pracovnej sily vo Valencii a Aragónsku, pociťovali niektoré časti Španielska ešte celé generácie." # todo: NEW TRANSLATION
 d009_mudejar.9.title: "Posledný morisko" # todo: NEW TRANSLATION
 d009_mudejar.9.entry: "$d009_mudejar.9.title$" # todo: NEW TRANSLATION
 d009_mudejar.9.desc: "Generácia, ktorá si ešte pamätala modlitby v [ShowLanguageName('arabic_language')] šepkané za zatvorenými okenicami, pominula. S ňou zmizla aj posledná rozpoznateľná stopa komunity, ktorá celé storočie a pol nebola v očiach svojich susedov ani úplne [ShowReligionGroupAdjective('muslim')], ani úplne [ShowReligionGroupAdjective('christian')]. Zostali len roztrúsené priezviská, zopár jedál, ktoré si tvrdohlavo zachovali, a tiché uzavretie kapitoly, za ktorou bude v [ROOT.GetCountry.GetAltAdjective('L')] smútiť málokto a ešte menej ľudí si ju správne zapamätá." # todo: NEW TRANSLATION # todo: COUNTRY CASE
 d009_mudejar.9.a: "Uznáme koniec jednej éry." # todo: NEW TRANSLATION
 d009_mudejar.9.historical_info: "Historici stále diskutujú o tom, do akej miery moriskovská identita po konverzii alebo vyhnaní skutočne zanikla. Mnohé rodiny, ktoré zostali a asimilovali sa, zanechali stopy v priezviskách, miestnych názvoch a ľudových zvykoch, ktoré pretrvali celé stáročia. Vyhnanci v severnej Afrike si zasa celé generácie uchovávali osobitnú andalúzsku identitu, ktorá je dodnes viditeľná v architektúre, kuchyni a hudbe miest ako Tetouan, Rabat a Tunis." # todo: NEW TRANSLATION

l_polish:
 goods_camels.1.title: "Veľká púštna karavána" # todo: NEW TRANSLATION
 goods_camels.1.desc: "Združenie obchodníkov pôsobiacich v [ROOT.GetCountry.GetCapital.GetAltAdjective('L')] navrhlo zorganizovať veľkú púštnu karavánu, ktorá by prepojila naše trhy so vzdialenými obchodnými partnermi za vyprahnutými končinami.\n\nPodnik sľubuje značné zisky z [ShowGoodsName('camels')] a súvisiacich tovarov, no zabezpečenie trasy a poskytnutie stráží si vyžiadajú značnú podporu zo strany [ROOT.GetCountry.GetGovernment.GetAdjective]. Obchodníci sú nedočkaví a čakajú na našu odpoveď." # todo: NEW TRANSLATION # todo: COUNTRY CASE
 goods_camels.1.a: "Podporíme tento podnik." # todo: NEW TRANSLATION
 goods_camels.1.b: "Môžu pokračovať, ale za určitú cenu." # todo: NEW TRANSLATION
 goods_camels.2.title: "Výnimočné plemená" # todo: NEW TRANSLATION
 goods_camels.2.desc: "Naši chovatelia v púšti v [target_location.GetName] hlásia, že roky starostlivého výberu priniesli plemeno tiav, ktoré vyniká silou, vytrvalosťou a schopnosťou niesť ťažšie náklady bez väčšej spotreby vody.\n\nŽiadajú o patronát [ROOT.GetCountry.GetGovernment.GetAdjective], aby mohli program rozšíriť a zriadiť osobitné pastviny. Naši velitelia jazdy však predkladajú konkurenčný návrh: najlepšie zvieratá by sa mali rozdeliť medzi púštnu jazdu." # todo: NEW TRANSLATION
 goods_camels.2.a: "Financujme šľachtiteľský program." # todo: NEW TRANSLATION
 goods_camels.2.b: "Rozdeľme najlepšie zvieratá našej jazde." # todo: NEW TRANSLATION
 goods_camels.3.title: "Keď studne vyschnú" # todo: NEW TRANSLATION
 goods_camels.3.desc: "Naše púštne územia sužuje kruté sucho. Studne vysychajú, úroda vädne a ľudia trpia.\n\nV týchto zúfalých podmienkach sa ťavy stali jediným spoľahlivým spôsobom prepravy tovaru, vody a ľudí naprieč pustatinou. [ROOT.GetCountry.GetGovernment.GetRuler.GetAltAdjective('I')] musí rozhodnúť, či stáda vyhradíme na pomoc vlastnému obyvateľstvu, alebo využijeme príležitosť a predáme ich zúfalým zahraničným kupcom za zvýšené ceny." # todo: NEW TRANSLATION # todo: COUNTRY CASE
 goods_camels.3.a: "Najprv pomôžme vlastnému ľudu." # todo: NEW TRANSLATION
 goods_camels.3.b: "Vyvážajme za zvýšené ceny, kým je dopyt vysoký." # todo: NEW TRANSLATION
 goods_camels.4.title: "Pútnická cesta" # todo: NEW TRANSLATION
 goods_camels.4.desc: "Cez [ROOT.GetCountry.GetAltAdjective('A')] na ceste k vzdialeným svätým miestam prechádza veľké množstvo náboženských pútnikov a túžia po ťavách, ktoré by im niesli zásoby cez púšť.\n\nPútnici hovoria o božom požehnaní pre tých, ktorí im pomôžu na ceste. Naši obchodníci však vidia príležitosť za túto službu poriadne si zapýtať." # todo: NEW TRANSLATION # todo: COUNTRY CASE
 goods_camels.4.a: "Pomôžme pútnikom bezplatne." # todo: NEW TRANSLATION
 goods_camels.4.b: "Nech za túto výsadu zaplatia." # todo: NEW TRANSLATION
 goods_camels.5.title: "Lupiči na karavánovej ceste" # todo: NEW TRANSLATION
 goods_camels.5.desc: "Nomádski lupiči začali prepadávať ťavie karavány, ktoré prechádzajú naším územím. Zabíjajú obchodníkov, kradnú zvieratá a narúšajú obchod.\n\nMajstri karaván požadujú, aby sme zakročili, inak presmerujú svoje karavány cez bezpečnejšie krajiny a odnesú svoje peniaze inam. Musíme si vybrať medzi nákladným vojenským riešením a pragmatickejšou dohodou so samotnými lupičmi." # todo: NEW TRANSLATION
 goods_camels.5.a: "Pošlime na karavánové cesty vojenský sprievod." # todo: NEW TRANSLATION
 goods_camels.5.b: "Dohodnime sa s lupičmi na bezpečnom prechode." # todo: NEW TRANSLATION
 goods_camels.6.title: "Návrh generála" # todo: NEW TRANSLATION
 goods_camels.6.desc: "Najskúsenejší púštny veliteľ [ROOT.GetCountry.GetGovernment.GetRuler.GetName] predložil oficiálny návrh, aby sa ťavie jednotky začlenili do celej armády.\n\nTvrdí, že ťavy dokážu v suchom teréne obratnejšie manévrovať než kone, unesú väčšie zásoby a vydržia podmienky, ktoré vojnové kone vyčerpajú. Návrh je rozumný, no nie všetci dôstojníci sú pripravení vzdať sa prestíže jazdy." # todo: NEW TRANSLATION
 goods_camels.6.a: "Zaveďme ťavie jednotky v celej armáde." # todo: NEW TRANSLATION
 goods_camels.6.b: "Naša jazda nám dobre slúžila. Ponechajme si kone." # todo: NEW TRANSLATION
 goods_camels.7.title: "Zahraničný dopyt" # todo: NEW TRANSLATION
 goods_camels.7.desc: "Na naše trhy dorazili zahraniční obchodníci s veľkým množstvom striebra a chcú nakúpiť veľké počty tiav pre vzdialené armády a obchodné výpravy. Ich ponuky sú štedré.\n\nVývoz takého množstva zvierat by však nevyhnutne oslabil našu vlastnú produkciu a zásoby. Niektorí radcovia varujú, že dobre vyzbrojené zahraničné armády sa jedného dňa môžu obrátiť proti nám." # todo: NEW TRANSLATION
 goods_camels.7.a: "Otvoríme obchod. Nech prúdi striebro." # todo: NEW TRANSLATION
 goods_camels.7.b: "Obmedzme vývoz tiav." # todo: NEW TRANSLATION
 goods_camels.8.title: "Prebytok stád" # todo: NEW TRANSLATION
 goods_camels.8.desc: "Roky rozširovania chovu tiav napokon priniesli nečakaný problém: tiav je jednoducho priveľa.\n\nTrhy sú presýtené, ceny sa prepadli a zvieratá spotrebúvajú krmivo rýchlejšie, než ho púšť dokáže obnoviť. Musíme niečo podniknúť. Prebytočné stáda môžeme preriediť a obnoviť tak rovnováhu, alebo hľadať nové zahraničné trhy, ktoré prebytok odoberú — za určitú cenu a za cenu značného diplomatického úsilia." # todo: NEW TRANSLATION
 goods_camels.8.a: "Preriedime prebytočné stáda. Menšie stádo je lepšie než skaza." # todo: NEW TRANSLATION
 goods_camels.8.b: "Pošlime vyslancov, aby v zahraničí našli nových kupcov." # todo: NEW TRANSLATION
 goods_camels.9.title: "Diplomatický incident" # todo: NEW TRANSLATION
 goods_camels.9.desc: "Počas slávnostnej recepcie na dvore sa obľúbená ťava [ROOT.GetCountry.GetGovernment.GetRuler.GetName], ktorú priviedli, aby ohúrila zhromaždených hostí, zjavne z osobných dôvodov hlboko znepáčila [target_character.GetName] z krajiny [offended_country.GetLongName]. Bez varovania vyprázdnila celý obsah svojho žalúdka priamo na slávnostný odev [target_character.GetHerHis].\n\n[target_character.GetSheHe|U] zúri a [target_character.GetHerHis] sprievod už začal pripravovať oficiálnu protestnú nótu." # todo: NEW TRANSLATION
 goods_camels.9.a: "Úprimne sa ospravedlňujeme. A, zdá sa, aj naša pokladnica." # todo: NEW TRANSLATION
 goods_camels.9.b: "To zviera má jednoducho dobrý odhad na ľudí." # todo: NEW TRANSLATION
 goods_camels.10.title: "Veľká súťaž krásy tiav" # todo: NEW TRANSLATION
 goods_camels.10.desc: "Šľachta z [ROOT.GetCountry.GetCapital.GetAltAdjective('G')] zorganizovala súťaž krásy tiav, o ktorej tvrdí, že je úplne legitímna a kultúrne významná. V hre sú značné stávky.\n\nDve mocné šľachtické rodiny sa teraz chystajú rozpútať spor o to, či je pri súťažnej ťave lepšia dlhá šija alebo pekne tvarovaný hrb. [ROOT.GetCountry.GetGovernment.GetRuler.GetName] bol požiadaný, aby osobným verdiktom rozhodol nerozhodný súboj. Súťažiaci aj ich ťavy už čakajú." # todo: NEW TRANSLATION # todo: COUNTRY CASE
 goods_camels.10.a: "Vládca musí svojmu ľudu slúžiť vo všetkom." # todo: NEW TRANSLATION
 goods_camels.10.b: "Mám na práci naliehavejšie veci." # todo: NEW TRANSLATION

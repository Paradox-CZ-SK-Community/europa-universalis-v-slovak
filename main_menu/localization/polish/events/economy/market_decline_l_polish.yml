l_polish:
 market_decline.1.title: "Uvädanie [withering_market.GetName]" # todo: NEW TRANSLATION
 market_decline.1.desc: "Trh v [withering_market.GetCenterLocation.GetName] už nie je obchodným centrom, akým býval. Keďže sa k nemu pripája už len pár miest, naši obchodníci stále častejšie posielajú tovar cez lepšie obsluhované susedné trhy. Ak ho takto necháme, trh sa zmení na mýtnicu na ceste niekam inde.\n\nNaša rada sa pýta, ako chceme tento úpadok riešiť." # todo: NEW TRANSLATION
 market_decline.1.a: "Dotovať obchodníkov a udržať trh." # todo: NEW TRANSLATION
 market_decline.1.b: "Rozpustiť trhovisko a nechať naše miesta pripojiť sa k svojim prirodzeným susedom." # todo: NEW TRANSLATION
 market_decline.1.b.tt: "[Concept('market','Trh')|e] [withering_market.GetName] je zrušené. Jeho miesta sa pripoja k nasledujúcemu najlepšiemu [Concept('market','trhu')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 market_decline.1.c: "Prijať úpadok a nechať obchodníkov, nech sa rozhodujú sami." # todo: NEW TRANSLATION

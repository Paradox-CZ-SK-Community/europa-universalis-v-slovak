l_polish:
 flavor_iberian_union.1.title: "Iberská svadba" # todo: NEW TRANSLATION
 flavor_iberian_union.1.desc: "Manželstvo, ktoré spája koruny [iu_member_a.GetName] a [iu_member_b.GetName], je príležitosťou vytvoriť trvalé puto medzi našimi ríšami. Hoci zväzok vznikol z politickej nevyhnutnosti, [ROOT.GetCountry.GetGovernment.GetAdjective] manželia sa zdajú byť vo svojom manželstve celkom šťastní a spoločne pracujú na upevnení zväzku a vybudovaní trvalého politického útvaru, ktorý možno považovať za veľmoc v [ShowContinentName('europe')]." # todo: NEW TRANSLATION
 flavor_iberian_union.1.historical_info: "Najznámejšie dynastické spojenie na Pyrenejskom polostrove vzniklo v roku 1469 sobášom Izabely I. Kastílskej a Ferdinanda II. Aragónskeho, katolíckych Veličenstiev. Ich zväzok spojil dve najmocnejšie koruny polostrova, pričom zachoval samostatné inštitúcie každej z nich. Ich vnuk Karol zdedil obe koruny ako jednu ríšu. O storočie neskôr, v roku 1580, si Filip II. Španielsky uplatnil nárok na uprázdnený portugalský trón a spojil Kastíliu, Aragónsko a Portugalsko pod vládou španielskych Habsburgovcov až do portugalskej reštaurácie v roku 1640." # todo: NEW TRANSLATION
 flavor_iberian_union.1.a: "Zabezpečme zväzku trvalý odkaz." # todo: NEW TRANSLATION
 flavor_iberian_union.2.title: "Iberská únia" # todo: NEW TRANSLATION
 flavor_iberian_union.2.desc: "Koruny [ShowRegionName('iberia_region')] pripadli jednému panovníkovi. Z toho, čo sa začalo ako manželstvo dvoch rodov, vznikla personálna únia a tróny našich ríš teraz spočívajú na jednej hlave. Každé kráľovstvo si zachováva vlastné zákony, súdy i hrdosť, no v otázkach legitimity a dynastie hovoria jedným hlasom. Zrodila sa Iberská únia a s ňou aj prísľub moci, ktorá sa môže rovnať ktorejkoľvek v kresťanskom svete." # todo: NEW TRANSLATION
 flavor_iberian_union.2.historical_info: "Keď dedič dvoch korún zdedil obe, nevzniklo jedno kráľovstvo, ale zložená monarchia: samostatné ríše so spoločným panovníkom. Taká bola ústavná skutočnosť španielskej monarchie, v ktorej si Kastília, Aragónsko a neskôr Portugalsko zachovali vlastné #italic Cortes#!, zákony a správu pod vládou spoločného kráľa. Takéto únie trvali len dovtedy, kým pretrvávala spoločná dynastia, a bez dediča sa mohlo rozdeliť to, čo spojilo manželstvo." # todo: NEW TRANSLATION
 flavor_iberian_union.2.a: "Nech naše ríše spoločne prosperujú." # todo: NEW TRANSLATION
 flavor_iberian_union.3.title: "Iberská svadba" # todo: NEW TRANSLATION
 flavor_iberian_union.3.desc: "Otázka nástupníctva ťaživo dolieha na [ROOT.GetCountry.GetAltAdjective('A')], keďže [initiator_candidate.GetName] stále nie je zosobášený. Náš [ROOT.GetCountry.GetGovernment.GetCourtTitle] nalieha na [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')], aby uzavrel manželstvo a zabezpečil nástupníctvo. Navrhuje sa, aby sme spojili svoje osudy s jednou z ďalších [ShowReligionGroupAdjective('christian')] korún [ShowRegionName('iberia_region')]. Bez silného nástupcu by našej krajine s hodnosťou [ROOT.GetCountry.GetFlavorRank] mohli hroziť nepokoje, súperiaci uchádzači o trón či dokonca zahraničné zasahovanie." # todo: NEW TRANSLATION # todo: COUNTRY CASE
 flavor_iberian_union.3.historical_info: "Udalosť známa ako Iberská svadba odkazuje na nástupníctvo po Henrichovi IV. Kastílskom. Po jeho smrti sa o trón uchádzali dvaja pretendenti: Izabela Kastílska, ktorú podporoval jej manžel Ferdinand Aragónsky, a jej neter Jana, za ktorou stálo Portugalsko. Konflikt sa skončil víťazstvom Izabely a Ferdinanda, čím sa upevnila Izabelina vláda a začalo sa slávne panovanie katolíckych Veličenstiev. Toto spojenie Kastílie a Aragónska neskôr viedlo k vytvoreniu zjednoteného Španielska." # todo: NEW TRANSLATION
 flavor_iberian_union.3.a: "Pošlime ponuku na sobáš [iu_partner_a.GetNameWithNoTooltip]." # todo: NEW TRANSLATION
 flavor_iberian_union.3.b: "Obráťme sa radšej na [iu_partner_b.GetNameWithNoTooltip]." # todo: NEW TRANSLATION
 flavor_iberian_union.3.c: "Nájdeme iné riešenie." # todo: NEW TRANSLATION
 flavor_iberian_union.4.title: "Iberská svadba" # todo: NEW TRANSLATION
 flavor_iberian_union.4.desc: "Do nášho [ROOT.GetCountry.GetGovernment.GetCourtTitle] dorazil vyslanec z [iu_initiator.GetName]. Navrhuje dynastický sobáš medzi [initiator_candidate.GetName] a [iu_chosen_candidate.GetName] z nášho rodu, ktorý by spojil naše ríše. Ich ponuka sľubuje vzájomnú prosperitu a stabilitu, no niektorí naši radcovia k nej pristupujú skepticky. Takýto zväzok by mohol zabezpečiť spojenectvo proti spoločným nepriateľom a potenciálne viesť k spojeniu korún, iní však varujú, že z dlhodobého hľadiska môže ohroziť našu nezávislosť." # todo: NEW TRANSLATION
 flavor_iberian_union.4.a: "Nemáme čo stratiť." # todo: NEW TRANSLATION
 flavor_iberian_union.4.b: "Bolo by múdrejšie ponuku odmietnuť." # todo: NEW TRANSLATION
 flavor_iberian_union.5.title: "Kráľovský sobáš prijatý" # todo: NEW TRANSLATION
 flavor_iberian_union.5.desc: "Po celej našej krajine s hodnosťou [ROOT.GetCountry.GetFlavorRank] i po krajine [iu_chosen.GetName] sa rozozvučali zvony, keď [initiator_candidate.GetName] a [iu_chosen_candidate.GetName] vstúpili do manželstva a spojili sa v jednom [ROOT.GetCountry.GetGovernment.GetAdjective] rode. Ľudia lemujú ulice a oba dvory pripíjajú na zväzok, ktorý sa veľvyslanci a biskupi usilovne snažili dohodnúť. To, čo bolo kedysi chladnou štátnickou kalkuláciou, je teraz spečatené sľubmi a oslavami.\n\nTento sobáš prináša oveľa viac než len chvíľu slávností. Naše dynastie sa spojili a naše rody zviazala krv. Ak bude manželstvo požehnané dieťaťom, ktoré zdedí obe koruny, môže nastať deň, keď sa naše dve ríše budú spravovať ako jedna. Zatiaľ je naše nástupníctvo pevnejšie a naše postavenie na dvoroch kresťanského sveta rastie spolu s nádherou tejto udalosti." # todo: NEW TRANSLATION
 flavor_iberian_union.5.a: "Radostná udalosť!" # todo: NEW TRANSLATION
 flavor_iberian_union.6.title: "Kráľovský sobáš odmietnutý" # todo: NEW TRANSLATION
 flavor_iberian_union.6.desc: "Našu ponuku na sobáš odmietli v [iu_chosen.GetName]. Hoci toto rozhodnutie nepochybne na dlhé roky pošramotí naše vzťahy, najmä však ponecháva otázku nášho nástupníctva nevyriešenú." # todo: NEW TRANSLATION
 flavor_iberian_union.6.a: "Nájdeme iné riešenie." # todo: NEW TRANSLATION
 flavor_iberian_union.7.title: "Obídení" # todo: NEW TRANSLATION
 flavor_iberian_union.7.desc: "[iu_initiator.GetName] sa rozhodli spojiť svoj rod s [iu_chosen.GetName], nie s naším, hoci sme boli rovnako vhodnou voľbou. Táto urážka zabolí, no prináša aj príležitosť: takáto potupa je dostatočným dôvodom, aby sme si silou vzali to, čo nám malo pripadnúť sobášom." # todo: NEW TRANSLATION
 flavor_iberian_union.7.a: "Za túto urážku nezostanú bez následkov." # todo: NEW TRANSLATION
 iu_marriage_may_form_union_tt: "To môže viesť k vytvoreniu [Concept('union','únii')|e]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 iu_spurned_will_be_displeased_tt: "[iu_spurned.GetName] sa nemusí zmieriť s tým, že pri tomto sobáši zostali bokom" # todo: NEW TRANSLATION

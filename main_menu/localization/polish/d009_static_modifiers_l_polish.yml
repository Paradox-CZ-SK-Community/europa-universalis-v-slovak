 STATIC_MODIFIER_NAME_searching_for_cibola: "Hľadanie Ciboly" # todo: NEW TRANSLATION
 STATIC_MODIFIER_DESC_searching_for_cibola: "Výprava je v teréne, kdesi medzi sonorským pobrežím a krajinou Pueblos, a pátra po siedmich mestách Cibola. Sprevádza ju aj prestíž koruny." # todo: NEW TRANSLATION
 STATIC_MODIFIER_NAME_searching_for_quivira: "Pátranie po Quivire" # todo: NEW TRANSLATION
 STATIC_MODIFIER_DESC_searching_for_quivira: "Výprava je v teréne, kdesi na trávnatom mori severne od Nového Mexika, a pátra po kráľovstve Quivira." # todo: NEW TRANSLATION
 STATIC_MODIFIER_NAME_searching_for_sierra_de_la_plata: "Pátranie po Sierra de la Plata" # todo: NEW TRANSLATION
 STATIC_MODIFIER_DESC_searching_for_sierra_de_la_plata: "Výprava je v teréne, v podhorí Ánd západne od rieky Plate, a pátra po striebornej hore, o ktorej rozprávajú Guaraní." # todo: NEW TRANSLATION
 STATIC_MODIFIER_NAME_searching_for_norumbega: "Pátranie po Norumbegu" # todo: NEW TRANSLATION
 STATIC_MODIFIER_DESC_searching_for_norumbega: "Výprava je v teréne na rieke Penobscot v Novom Anglicku a pátra po opevnenom meste, o ktorom podávali správy francúzski rybári a Verrazanovi kormidelníci." # todo: NEW TRANSLATION
 STATIC_MODIFIER_NAME_searching_for_saguenay: "Pátranie po Saguenay" # todo: NEW TRANSLATION
 STATIC_MODIFIER_DESC_searching_for_saguenay: "Výprava je v teréne v boreálnych lesoch severne od rieky Saint Lawrence a pátra po kráľovstve, ktoré Donnacona opísal Cartierovi v Stadacone." # todo: NEW TRANSLATION
 STATIC_MODIFIER_NAME_searching_for_city_of_caesars: "Pátranie po Meste cézarov" # todo: NEW TRANSLATION
 STATIC_MODIFIER_DESC_searching_for_city_of_caesars: "Výprava je v teréne kdesi v Patagónii a pátra po stratenom meste postavenom medzi dvoma horami." # todo: NEW TRANSLATION
 STATIC_MODIFIER_NAME_cibola_discovered: "Cibola objavená" # todo: NEW TRANSLATION
 STATIC_MODIFIER_DESC_cibola_discovered: "Siedmich miest Cibola sa podarilo nájsť a otvoriť ich obchod: tyrkys, bavlnené látky, opracovaný gagát z dielní Pueblos a okolité kukuričné kraje. Krajina je začlenená do obchodného systému ríše za podmienok, ktoré sa viac-menej podobajú partnerstvu." # todo: NEW TRANSLATION
 STATIC_MODIFIER_NAME_quivira_discovered: "Quivira objavená" # todo: NEW TRANSLATION
 STATIC_MODIFIER_DESC_quivira_discovered: "Kráľovstvo Quivira sa podarilo nájsť na trávnatom mori východne od Pueblos. Krajina je úrodná, stáda bizónov sú obrovské a farmári a obchodníci z kmeňa Wichita vedú rozsiahly regionálny obchod, do ktorého sa teraz zapája aj koruna." # todo: NEW TRANSLATION
 STATIC_MODIFIER_NAME_sierra_plata_discovered: "Sierra de la Plata objavená" # todo: NEW TRANSLATION
 STATIC_MODIFIER_DESC_sierra_plata_discovered: "Strieborná hora v srdci legendy bola nájdená a sprístupnená. Ruda má výnimočnú kvalitu, vládcovia Chicha, ktorí ovládajú podhorie, sú ochotnými obchodnými partnermi a množstvo drahého kovu vyťaženého v baniach sa vyrovná tomu, čo v najlepších obdobiach vyprodukujú staršie bane v Kordillerách." # todo: NEW TRANSLATION
 STATIC_MODIFIER_NAME_norumbega_discovered: "Norumbega objavená" # todo: NEW TRANSLATION
 STATIC_MODIFIER_DESC_norumbega_discovered: "Norumbegu sa podarilo nájsť na hornom toku rieky Penobscot: je to kamenné opevnené mesto so zmiešaným obyvateľstvom Abenakov a — ako trvá na svojom latinista v štábe — starých Nórov. V kopcoch proti prúdu sa nachádza funkčná zlatá baňa. V reakcii na to sa menia osídľovacie výpravy aj koloniálny obchod z Nového Anglicka." # todo: NEW TRANSLATION
 STATIC_MODIFIER_NAME_saguenay_discovered: "Saguenay objavená" # todo: NEW TRANSLATION
 STATIC_MODIFIER_DESC_saguenay_discovered: "Severné kráľovstvo, ktoré Donnacona opísal Cartierovi, sa podarilo nájsť v chladnej krajine za druhým veľkým jazerom v povodí rieky Saint Lawrence. Osada je bohatá, obyvatelia majú svetlú pleť a hovoria po nórsky a obchod s kožušinami a zlatom, ktorý krajina umožňuje, je najvýnosnejší, aký francúzska koruna v Novom svete dosiaľ otvorila." # todo: NEW TRANSLATION
 STATIC_MODIFIER_NAME_city_of_caesars_discovered: "Mesto cézarov objavené" # todo: NEW TRANSLATION
 STATIC_MODIFIER_DESC_city_of_caesars_discovered: "Stratené mesto cézarov sa podarilo nájsť v skrytom údolí patagónskych Ánd. Jeho obyvateľstvo pochádza z preživších po stroskotaní lode v šestnástom storočí. Koruna opäť rozšírila svoju moc nad dávno stratenými poddanými a nad striebornou krajinou, ktorú si počas generácií izolácie potichu sprístupnili." # todo: NEW TRANSLATION
 STATIC_MODIFIER_NAME_searching_for_el_dorado: "Pátranie po El Dorade" # todo: NEW TRANSLATION
 STATIC_MODIFIER_DESC_searching_for_el_dorado: "Výprava je v teréne kdesi v povodí rieky Orinoko a pátra po pozlátenom kráľovi, na ktorého si Muiscovia spomínajú." # todo: NEW TRANSLATION
 STATIC_MODIFIER_NAME_searching_for_fountain_of_youth: "Pátranie po Prameni mladosti" # todo: NEW TRANSLATION
 STATIC_MODIFIER_DESC_searching_for_fountain_of_youth: "Výprava je na Floride, kdesi na území Timucuov, a pátra po prameni, ktorý Taínovia nazývajú Prameň Bimini." # todo: NEW TRANSLATION
 STATIC_MODIFIER_NAME_el_dorado_discovered: "El Dorado objavené" # todo: NEW TRANSLATION
 STATIC_MODIFIER_DESC_el_dorado_discovered: "Pozlátená krajina Muiscov bola sprístupnená španielskemu obchodu. Zlaté výrobky z vysokohorských dielní, zhotovené v štýle a rozsahu, ktorým sa nedokáže vyrovnať žiadny európsky zlatník, prúdia cez novú obchodnú stanicu na úpätí posvätného jazera." # todo: NEW TRANSLATION
 STATIC_MODIFIER_NAME_fountain_of_youth_discovered: "Prameň mladosti objavený" # todo: NEW TRANSLATION
 STATIC_MODIFIER_DESC_fountain_of_youth_discovered: "Prameň v srdci krajiny Timucuov sa podarilo nájsť a overiť jeho omladzujúce účinky. Voda dokáže to, čo sľubovala legenda. Na mieste postavili kaplnku a už sa začínajú rozvíjať púte." # todo: NEW TRANSLATION
 STATIC_MODIFIER_NAME_camelry_doctrine_modifier: "Doktrína ťavieho jazdectva" # todo: NEW TRANSLATION
 STATIC_MODIFIER_DESC_camelry_doctrine_modifier: "Generálov návrh bol prijatý. Popri jazdeckých oddieloch sa vytvárajú ťavie eskadróny, pozdĺž karavánových ciest vznikajú zásobovacie stanice pre ťavy a príručky na výcvik sa prepisujú pre potreby bojov v púšti. Armáda dokáže zájsť ďalej s menším množstvom vody než predtým a dôstojnícky zbor si pomaly zvyká na zápach." # todo: NEW TRANSLATION
 STATIC_MODIFIER_NAME_gra_old_capital_of_the_caliphate: "Hlavné mesto starého kalifátu" # todo: NEW TRANSLATION

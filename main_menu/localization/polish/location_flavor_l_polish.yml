l_polish:
 stockholm_desc: "Toto mesto bolo založené v roku 1252 Birgerom Jarlom na strategickom mieste, kde sa jazero Mälaren stretáva s Baltským morom. To umožnilo Štokholmu slúžiť zároveň ako pevnosť kontrolujúca prístup k jazeru a obchodné centrum spájajúce vnútrozemské Švédsko s hanzeatickými a baltskými obchodnými sieťami. Začiatkom 14. storočia železo a meď dovážané z baní v Bergslagene spolu s prílevom nemeckých mešťanov spravujúcich mesto podľa lübeckého práva spravili zo Štokholmu najvýznamnejšie mesto švédskeho kráľovstva." # todo: CHANGED (predtym: Toto mesto bolo založené v roku 1252 Birgerom Jarlom na strategickom mieste, kde sa jazero Mälaren stretáva s Baltským m)
 paris_desc: "Na brehoch Seiny povstal Paríž zo skromného sídla na korunový klenot Francúzska. So svojimi katedrálami, trhmi a školami sa stal jedným z najvýznamnejších európskych centier moci a kultúry." # todo: CHANGED (predtym: Na brehoch Seiny povstal Paríž zo skromného sídla na korunový klenot Francúzska. So svojou katedrálou, trhmi a školami s)
 london_desc: "Ukotvený pri Temži, Londýn vyrástol z rímskeho Londínia na najvýznamnejšie mesto Anglicka. Jeho rozkvitajúci obchod a kráľovské dvory urobili z mesta politické a ekonomické srdce kráľovstva." # todo: NEW TRANSLATION
 rome_desc: "Večné mesto pri Tibre vládlo impériu rozprestierajúcemu sa cez kontinenty. Aj po páde cisárstva pretrvalo Rím ako maják viery a autority, domov Pápežstva." # todo: NEW TRANSLATION
 jerusalem_desc: "Ako miesto stretu viery a bojov je Jeruzalem uctievaný židmi, kresťanmi i moslimami. Pútnici a dobyvatelia neustále formujú jeho posvätnú, no búrlivú históriu." # todo: NEW TRANSLATION
 alexandria_desc: "Staroveké svetlo Stredozemia, Alexandria prosperuje ako križovatka obchodu a učenosti. Jej maják a knižnica kedysi ohlasovali mesto, kde sa stretávali kultúry a impériá." # todo: CHANGED (predtym: Raz svetlo Stredozemia, Alexandria prosperuje ako križovatka obchodu a učenosti. Jej maják a knižnica kedysi hlásali mes)
 constantinople_desc: "Korunovaný Hagia Sophiou a obkolesený mohutnými hradbami, Konštantínopol kedysi stál ako srdce Východorímskej ríše. Po tisíc rokov jeho bohatstvo a veľkoleposť vzbudzovali závisť sveta." # todo: CHANGED (predtym: Korunovaný Hagia Sophiou a obkolesený mohutnými hradbami, Konštantínopol stál ako srdce Východorímskej ríše. Po tisíc ro)
 sitges_desc: "V stredoveku bol na kopci, kde teraz stojí radnica, postavený hrad. Prvým vlastníkom bolo biskupstvo v Barcelone, ale v 12. storočí prešiel do rúk rodiny, podľa ktorej nesie meno." # todo: NEW TRANSLATION
 valladolid_desc: "Založený v posledných desaťročiach 11. storočia grófmi Pedrom Ansúrezom a Eylo Alfonsom, Valladolid sa rozvinul ako obchodné mesto v samotnom centre Severnej mesety. Do 14. storočia sa stal najdôležitejším mestom regiónu spolu s Burgos a hlavným administratívnym centrom počas regentstiev kráľovnej Márie de Molina a vlády jej vnuka, kráľa Alfonza XI." # todo: CHANGED (predtym: Založené v posledných desaťročiach 11. storočia grófmi Pedrom Ansúrezom a Eylo Alfonsom pri moste cez rieku Pisuerga, Va)
 penafiel_desc: "#italic Penna Fidelis#!, 'Faithful Hill', bola založená v 10. storočí na vrchu, ktorý dominuje strednej časti údolia rieky Duero, vďaka čomu sa stala kľúčovým ohniskom hraničných nájazdov proti Kalifátu Córdoba. Gróf Sancho García z Kastílie ju opevnil a niekedy okolo roku 1013 jej udelil #italic fuero#!. Potom vyrástla na bohaté mesto vďaka rozkvitajúcemu vinohradníctvu a nakoniec sa dostala pod kontrolu mocného rodu Dona Juana Manuela." # todo: CHANGED (predtym: italic Penna Fidelis !, 'Faithful Hill', bola založená v 10. storočí na vrchu, ktorý strategicky kontroluje strednú časť)
 toro_desc: "Toro bolo založené v 10. storočí ako súčasť snáh kráľov Leónu opevniť hranicu kráľovstva pozdĺž údolia rieky Duero v boji proti Kalifátu Córdoba. Neskôr sa vyvinulo na dôležité mesto vďaka svojej strategickej polohe, bohatým poľnohospodárskym poliam a viniciam." # todo: CHANGED (predtym: Toro bolo založené v 10. storočí ako súčasť snáh kráľov Leónu opevniť hranicu kráľovstva v údolie Duera v boji proti Kal)
 thessaloniki_desc: "Trvalo považovaná za druhé mesto Byzantskej ríše po Konštantínopole, Solún vďačí za svoje bohatstvo a prestíž svojej strategickej obchodnej polohe. Jeho rušné prístavy smerujú cenné tovary medzi zvyškom Talianska a rímskym vnútrozemím, slúžiac ako životne dôležitý most medzi Východom a Západom." # todo: CHANGED (predtym: Trvalo považovaná za druhé mesto Byzantskej ríše po Konštantínopole, bohatstvo a prestíž Solúna pramenia z jej strategic)
 malmo_desc: "Kľúčová pevnosť na Øresunde, Malmö ovláda priechod medzi Baltským morom a Severným morom. Jeho opevnené hradby a bdejní obrancovia z neho robia centrum moci a mesto formované stratégiou a ambíciou." # todo: NEW TRANSLATION
 bilbao_desc: "Oficiálne založené v roku 1300 Diegom Lópezom de Haro, pánom Biscay, mesto sa čoskoro stalo dôležitým uzlom na severe Španielska. Umiestnené v úzkom údolí na začiatku ústia rieky Nervión, opevnené sídlo rozvinulo významný lodiarsky priemysel a stalo sa hlavným vývozným miestom cennej kastílskej merino vlny a miestnej vysokokvalitnej železnej rudy do anglických a flámskych prístavov." # todo: CHANGED (predtym: Oficiálne založené v roku 1300 Diegom Lópezom de Haro, pánom Biscay, mesto sa čoskoro stalo dôležitým uzlom na severe Šp)
 radom_desc: "Mesto rozšírené posledným piastovským kráľom, Kazimírom III. Veľkým, zostalo dôležitým politickým centrom počas neskorého stredoveku a renesancie. Mesto tiež hostilo podpísanie Paktu z Vilna a Radomu v roku 1401 a schválenie aktu #italic Nihil Novi#! v roku 1505 počas parlamentnej schôdze v kráľovskom hrade." # todo: CHANGED (predtym: Mesto rozšírené posledným piastovským kráľom Kazimírom III. Veľkým zostalo dôležitým politickým miestom počas neskorého )
 krakow_desc: "Začínajúc ako osada na vrchu Wawel, prvýkrát bolo menovite spomenuté v roku 965, opísané ako významné obchodné centrum tej doby. V roku 1038 sa stalo sídlom poľských panovníkov z rodu Piastovcov a následne slúžilo ako centrum správy, hospodárstva a kultúry pre Kráľovstvo Poľsko." # todo: CHANGED (predtym: Začínajúc ako osada na vrchu Wawel, prvýkrát bolo menovite spomenuté v roku 965, opísané ako významné obchodné centrum s)
 megara_desc: "Založená a obývaná už v staroveku, Megara bola pod vládou legendárnych kráľov, ako boli Nisos a Býzas. Mesto sa stalo významnou mocnosťou na gréckom polostrove, preslávené námornou silou a prosperujúcim obchodom. Jej kolonisti zakladali dôležité osady po celom Stredomorí vrátane Byzantionu, Chersónēsosu a Selinoûsu. Postupom času však Megara postupne upadla do zabudnutia a zachovala si len nepatrné stopy svojej bývalej slávy." # todo: CHANGED (predtym: Založená a obývaná už v staroveku, Megara bola vládnutá legendárnymi kráľmi, ako Nisos a Byzas. Mesto sa stalo významnou)
 grojec_desc: "Až do 12. storočia bolo sídlom miestneho kastelánstva a arcidiecézy v Poznani, no postupne stratilo význam v prospech susedného Czersku." # todo: NEW TRANSLATION
 gdansk_desc: "Jeho názov, prvýkrát zaznamenaný v roku 997, pochádzal zo sídla, ktoré stálo na pobreží Baltského mora. Stalo sa významným lodiarskym a obchodným prístavom, čo upevnilo jeho postavenie ako jedného z najbohatších a najvplyvnejších miest vo východnej Európe." # todo: CHANGED (predtym: Jeho názov bol prvýkrát zaznamenaný v roku 997 — mesto Gdaňsk — vznikol zo sídla, ktoré stálo na pobreží Baltského mora.)
 athens_desc: "Pokladané za kultúrne centrum starovekého Grécka, Atény vyrástli v jeden z najmocnejších mestských štátov svojej doby. Neustále súperili so Spartou, Thébami a ďalšími významnými štátmi staroveku a postupne sa stali dominantnou námornou mocnosťou v Egejskom mori. Po podrobení Makedónskemu impériu a neskôr Rimanmi a Byzantíncami mesto zažilo výrazný úpadok a po roku 1204 sa stalo hlavným mestom križiackeho štátu." # todo: CHANGED (predtym: Pokladané za kultúrne centrum starovekého Grécka, Atény vyrástli v jednu z najsilnejších mestských štátov svojej doby. V)
 wieliczka_desc: "Mesto Wieliczka bolo založené v roku 1290 kráľom Przemysłom II. Poľským v súvislosti s ťažbou miestnych soľných ložísk. Ako významné banské mesto získalo mnoho privilégií a miestne soľné bane sa čoskoro stali významným zdrojom kráľovského bohatstva. Soľná baňa Wieliczka a jej sesterská baňa v Bochni sa napokon stali súčasťou banskej spoločnosti #italic Żupy Krakowskie#!. V oficiálnych dokumentoch je mesto známe ako #italic Wielka Sól#!, čo znamená #italic Great Salt#!." # todo: CHANGED (predtym: Mesto Wieliczka bolo založené v roku 1290 kráľom Przemysłom II. Poľským v súvislosti s ťažbou miestnych soľných ložísk. )
 leksand_desc: "Táto dedina na južnom brehu jazera Siljan je osídlená už niekoľko tisícročí. Kostol bol postavený začiatkom 12. storočia a dnes je najznámejšia tým, že jej prvý luteránsky kňaz bol predok Johana." # todo: NEW TRANSLATION
 leipzig_desc: "Založené v roku 1165 na križovatke #italic Via Imperii#! a #italic Via Regia#!, Lipsko vyrástlo na bohatý obchodný uzol. Neskôr obdarené významnými cisárskymi privilégiami sa Lipsko stalo významným centrom obchodu s kožušinami aj rozvíjajúceho sa vydavateľského priemyslu." # todo: CHANGED (predtym: Založené v roku 1165 na križovatke italic Via Imperii ! a italic Via Regia !, Lipsko vyrástlo na bohatý obchodný uzol. N)
 augsburg_desc: "Za vlády rímskeho cisára Trajána bolo známe ako #italic Augusta Vindelicorum#!. Slobodné cisárske mesto Augsburg bolo jedným z najstarších miest v Svätej ríši rímskej. Na konci raného stredoveku získal Augsburg na dôležitosti ako miesto úspešnej obrany proti útočiacim Maďarom v roku 955. V roku 1276 sa táto dôležitosť ešte zvýšila, keď Augsburg získal práva cisárskeho mesta od kráľa Rudolfa Habsburského, čo otvorilo cestu k prosperujúcej budúcnosti." # todo: CHANGED (predtym: Keď bolo v čase vlády rímskeho cisára Trajána známe ako italic Augusta Videlicum !, Slobodné cisárske mesto Augsburg je )
 warsaw_desc: "Pôvodne malé rybárske mestečko v Mazovsku získalo mesto na význame po tom, čo Zikmund III. v roku 1596 presunul hlavné mesto z Krakova sem. V 18. storočí sa stalo najväčším poľským mestom a prešlo rozsiahlym rozvojom, ktorý výrazne prispel k poľskej architektúre a remeselníctvu." # todo: CHANGED (predtym: Pôvodne vzniklo ako malé rybárske mestečko v Mazovsku, mesto sa stalo významným po presunutí hlavného mesta tam z Krakov)
 tunis_desc: "Založené ako Kartágo legendárnou kráľovnou Dídou, stalo sa hlavným mestom púnskeho národa rovnakého mena, bolo zničené a neskôr Rimanmi prestavané po troch krvavých vojnách. Moderné mesto Tunis bolo založené Arabmi v roku 698 na okraji týchto starovekých ruín. Almohadské dobytie v 12. storočí prinieslo jeho povýšenie na regionálne hlavné mesto, postavenie, ktoré upevnila dynastia Hafsidov." # todo: CHANGED (predtym: Najprv založená ako Kartágo legendárnou kráľovnou Dídou v roku 814 pred Kr., stala sa hlavným mestom púnskeho národa rov)
 heidelberg_desc: "Koncom 12. storočia sa Heidelberg stal sídlom falckého grófa pri Rýne a tam bol postavený známy zámok. Heidelberg je známy ako domov prvej nemeckej univerzity, a preto má dlhú tradíciu vzdelanostnej excelentnosti. Neskôr sa stal centrom reformácie a tolerancie, pričom Falcko sa nakoniec stalo lídrom Protestantskej únie. V neskorších storočiach zámok a jeho ikonický vzhľad priťahovali do mesta mnohých básnikov a vyniesli mu prezývku #italic the City of Romanticism#!." # todo: CHANGED (predtym: Koncom 12. storočia sa Heidelberg stal sídlom falckého grófa pri Rýne a bol postavený známy zámok. Heidelberg je známy a)
 aviles_desc: "Avilés, ktorého história siaha do 10. storočia, sa rozvíjalo pozdĺž ústia rieky, čo mu dávalo strategický význam ako prístavu. V blízkom hrade Gauzón kráľ Alfons III. z Astúrie nariadil vyhotovenie votívneho Kríža víťazstva, ktorý bol pokrytý zlatom a drahými kameňmi a teraz je symbolom celého kráľovstva. Od 11. storočia sa Avilés stalo kráľovským mestom, známym svojím námorným obchodom a skladovaním a distribúciou soli." # todo: CHANGED (predtym: S pôvodom v 10. storočí je Avilés mesto vyvinuté pozdĺž zálivu, čo mu dávalo strategický význam ako prístavu. V blízkom )
 pingjin_desc: "Tàiyuán, domov svätého miesta Jìn Temple, je jedným z najdôležitejších miest v Šanxi a severnej Číne od 5. storočia pred Kr. V roku 979 cisár Tàizōng z dynastie Sòng prikázal staroveké mesto Jìnyáng zaplaviť a zničiť po dobytí severného Hánu a následne ho premenoval na okres Píngjìn (dosl. 'Pacification of Shānxī'), katastrofu, z ktorej sa mesto dlho spamätávalo." # todo: NEW TRANSLATION
 dunstable_desc: "Pôvodne rímske mesto Dunstable sa neskôr rozrástlo okolo augustiniánskeho priorstva a stalo sa významným náboženským a správnym centrom. Preslávilo sa ako kráľovské sídlo Henricha I. od roku 1109 a v roku 1290 tam postavili Eleanorin kríž na pamiatku pohrebného sprievodu Eleonóry Kastílskej. V roku 1533 sa v meste oficiálne ukončilo manželstvo Henricha VIII. s jeho prvou manželkou Katarínou Aragónskou a v roku 1624 sa stalo kľúčovým miestom náboru Cromwellových vojsk počas anglickej občianskej vojny." # todo: CHANGED (predtym: Z rímskeho mesta na mníšske sídlo; preslávené kráľovským sídlom Henricha I. (1109), Eleanoriným krížom (1290), rozvodom )
 paderborn_desc: "Mesto založené ako biskupstvo okolo roku 800 po Kr. sa preslávilo ako miesto prvého stretnutia Karola Veľkého a pápeža Leva III. Vďaka svojmu strategickému a náboženskému významu bolo častým cieľom počas Tridsaťročnej vojny a obliehali ho šestnásťkrát. V roku 1646 mesto ešte viac utrpelo, keď ho vyplienili švédske jednotky." # todo: CHANGED (predtym: Biskupstvo založené okolo roku 800 po Kr., prvé miesto stretnutia Karola Veľkého a pápeža Leva III. V Tridsaťročnej vojn)
 porto_desc: "Prezývané #italic Cidade Invicta#!, či 'Unvanquished City', dalo Portugalsku meno a urobilo z portského vína z Douro niečo, čo sa oslavovalo ďaleko za jeho brehmi." # todo: NEW TRANSLATION
 jiaxing_desc: "Jiāxīng je pohraničná oblasť medzi regiónmi Wú a Yuè. 'Jiā' znamená krása a priaznivosť, zatiaľ čo 'Xīng' predstavuje prosperitu a rozkvet." # todo: NEW TRANSLATION
 torgau_desc: "V roku 1452 zriadil kurfiřt Fridrich II. prvú medvediu jámu v Torgau, ktorá bola postupne zväčšovaná až do roku 1624. Poskytovala priestor pre až 39 medveďov." # todo: NEW TRANSLATION
 changsha_desc: "Centrum mesta Chángshā zostalo nezmenené od svojho založenia pred dvetisíc rokmi." # todo: CHANGED (predtym: Od svojho založenia zostalo centrum mesta Chángshā nezmenené po dve tisíc rokov.)
 ningxiang_desc: "Najväčší bronzový #italic zūn#! (nádoba na víno) z dynastie Šang (spred troch tisíc rokov) bol vykopaný tu." # todo: CHANGED (predtym: Najväčší bronzový italic zūn ! (nádoba na víno) z dynastie Šang (spred troch tisíc rokov) bol tu vykopaný.)
 wurzburg_desc: "Würzburg vyrástol ako frankónska pevnosť a v roku 741 sa stal biskupstvom. V ranom stredoveku prosperoval vďaka svojej pevnosti a obchodným trasám na rieke Mohan." # todo: NEW TRANSLATION
 hanover_desc: "Hannover vyrástol zo stredovekého sídla a stal sa kľúčovým mestom Svätej ríše rímskej. Vládli mu Welfovci a prekvitalo ako centrum obchodu, moci a kultúry." # todo: CHANGED (predtym: Hannover vyrástol zo stredovekého sídla na kľúčové mesto Svätej ríše rímskej, vládli mu Welfovci a vzkvétal ako centrum )
 osnabruck_desc: "Osnabrück, stredoveký obchodný uzol v Svätej ríši rímskej, získal povesť ako biskupstvo a miesto rokovaní o Vestfálskom mieri." # todo: NEW TRANSLATION
 glasgow_desc: "Glesca (Glasgow), založené ako stredoveké biskupstvo, vzkvétalo okolo svojej veľkej katedrály, napokon získalo mestské práva a hostilo univerzitu, ktorá v nasledujúcich storočiach formovala škótske vzdelanectvo." # todo: CHANGED (predtym: Glesca (Glasgow), založené ako stredoveké biskupstvo, vzkvétalo okolo svojej veľkej katedrály, získalo mestské práva a u)
 neva_desc: "Delta Nevy, kedysi súčasť varangánsko-gréckej obchodnej trasy, sa v roku 1703 stala domovom Petrohradu. Toto mesto zostalo hlavným mestom Ruska viac ako 200 rokov." # todo: CHANGED (predtym: Delta Nevy, kedysi súčasť varangánsko-gréckej obchodnej trasy, sa v roku 1703 stala Petrohradom a zostala hlavným mestom)
 dubno_desc: "Dubno, prvýkrát spomenuté v roku 1100, vyrástlo na volyňský obchodný uzol preslávený svojimi jarmokmi a hradom postaveným v roku 1492. Mesto neskôr zvečniťe v Gogolovom #italic Taras Bulba#!." # todo: CHANGED (predtym: Dubno, prvýkrát spomenuté v roku 1100, vyrástlo na volyňský obchodný uzol preslávený svojimi jarmokmi a hradom z roku 14)
 baden_desc: "Pôvodne známe ako #italic Civitas Aurelia Aquensis#! po založení Rimanmi, toto mesto začalo nosiť meno 'Baden-Baden' v skorom stredoveku, ktoré dalo meno markgrófom z Badenu." # todo: NEW TRANSLATION
 erbach_desc: "Koncom 18. storočia sa Erbach vyvinul na významné centrum rezbárstva v slonovine potom, čo gróf František I. z Erbachu, poháňaný vášňou pre starožitnosti, financoval miestny cech rezbárov slonoviny." # todo: NEW TRANSLATION
 manhattan_desc: "Pôvodne obývaný ľudom Lenape, ostrov, ktorý nazývali Manhatta, bol kúpený holandskými osadníkmi za tovar v hodnote 60 guldérov. Tu Holanďania postavili pevnosť, sídlo moci mesta New Amsterdam." # todo: CHANGED (predtym: Pôvodne obývaný ľudom Lenape, ostrov, ktorý nazývali Manhatta, bol kúpený holandskými osadníkmi za tovar v hodnote 60 gu)
 doncaster_desc: "Kedysi rímsky tábor Danum, do roku 1337 sa Doncaster stal yorkshirským trhovým mestom na Veľkej Severnej ceste, kde potulní obchodníci a prevádzači prenášali tovar medzi Londýnom a severom." # todo: NEW TRANSLATION
 kitchissippi_desc: "Pomenované podľa rieky Kichi Sibi, tu Anishinaabe ľudia lovili a obchodovali, až kým britské osídlenie nerozšírilo obchod s drevom a neskôr z neho neurobilo sídlo koloniálnej správy." # todo: NEW TRANSLATION
 saint_marceilin_desc: "Saint-Marcellin, založené v 11. storočí, bolo sídlom Rady Dauphiné v rokoch 1337 až 1340. Preslávilo sa svojím mäkkým syrom s bielou plesňovou kôrkou, ktorý bol prvýkrát podávaný Ľudovítovi XI. v roku 1461." # todo: CHANGED (predtym: Založené v 11. storočí, Saint-Marcellin bolo miestom obliehania počas Rady delfína medzi rokmi 1337 a 1340. Stalo sa slá)
 caerphilly_desc: "Domov najkvalitnejšieho uhlia v Európe, waleské údolia sa v druhej polovici 18. storočia stali centrom výroby železa." # todo: NEW TRANSLATION
 grenoble_desc: "Grenoble je skromné, no strategické mestečko uložené vo francúzskych Alpách, slúžiace ako hlavné mesto Dauphiné. Obklopené riekami a horami je chránené hradbami a dominuje mu pevnosť Bastilla. Život sa sústreďuje okolo katedrály a úzkych, krivolakých ulíc plných obchodníkov, remeselníkov a roľníkov prinášajúcich tovar z okolitých dolín." # todo: CHANGED (predtym: Grenoble je skromné, no strategické mestečko uložené v francúzskych Alpách, slúžiace ako hlavné mesto Dauphiné. Obklopen)
 kinsale_desc: "Kinsale je malé, no živé prístavné mestečko na južnom pobreží Írska, chránené svojím hlbokým prírodným prístavom. Rybolov a pobrežný obchod živili väčšinu obyvateľstva; obchodníci vymieňali slané ryby, kože a vlnu za víno, soľ a luxusné tovary z Pyrenejského polostrova a Francúzska. Úzke uličky sa zhromažďovali okolo nábreží, kde sa miestni námorníci miešali s občasnými zahraničnými obchodníkmi. Hoci skromný veľkosťou, prístav Kinsale mu dodával strategickú hodnotu, bránu medzi Írskom a kontinentálnou Európou." # todo: NEW TRANSLATION
 stockton_desc: "Stockton je anglosaské sídlo na severnom brehu rieky Tees a bolo riedko osídlené, kým biskup neoslobodil mestských nevoľníkov, čím sa stalo atraktívnym miestom pre remeselníkov. Stalo sa dôležitým trhom na vývoz vlny a dovoz vína, hoci významnejšie obyvateľstvo v ňom žilo až počas priemyselnej revolúcie." # todo: CHANGED (predtym: Stockton je anglosaské sídlo na severnom brehu rieky Tees a bolo slabo osídlené, kým biskup neoslobodil mestských nevoľn)
 kunow_desc: "Dôležitá súčasť majetkov krakovského biskupstva s farnosťou existujúcou od roku 1281. Jeho názov pravdepodobne pochádza od kuny, po poľsky #italic kuna#!, ktorá bola hojná v miestnych lesoch." # todo: CHANGED (predtym: Dôležitá súčasť majetkov biskupstva krakovského, s farnosťou existujúcou od roku 1281, jeho názov pravdepodobne pochádza)
 lublin_desc: "Lublin bol založený ako osada na prelome 12. a 13. storočia a v roku 1317 získal mestské privilégium od Władysława 'the Elbow-high'. V nasledujúcich storočiach sa mesto stalo dôležitým obchodným centrom a v 16. storočí zažilo zlatý vek, obohacujúc sa vďaka Lublinskej únii a rozsiahlemu obchodu, najmä s Východom." # todo: NEW TRANSLATION
 kendal_desc: "Kendal bol založený s rímskym táborom na brehu rieky Kent v 1. storočí po Kr. Mesto rástlo pod normandskou nadvládou, získalo trhové práva v roku 1189 od kráľa Richarda I. výmenou za peniaze na jeho križiacke výpravy, čo mestu prinieslo väčšie bohatstvo. Stalo sa stredovekým centrom obchodu s vlnou a hlavný zámok patril rodine Parrovcov, z ktorej je najznámejšou členkou Catherine Parr, manželka Henricha VIII." # todo: NEW TRANSLATION
 cairo_desc: "Založená v roku 969 fatimidským generálom Jawharom aṣ-Ṣiqillīm pri starovekom rímskom pevnostnom bode Babylone, Al-Qāhira, 'Víťazná', rýchlo nahradila Alexandriu ako srdce Egypta. Pod Ayyubovcami a mamlukmi sa premenila na najľudnatejšie mesto islamského sveta, jej trhy a mešity priťahovali obchodníkov, učencov a pútnikov z troch kontinentov. Keď Mongoli v roku 1258 rozdrvili Bagdad, Káhira stála ako nepochybné hlavné mesto islamskej civilizácie, mesto mimoriadnej veľkoleposti, ktorého minarety sa týčili nad riečnym údolím, ktoré udržiavalo ľudský život od úsvitu dejín." # todo: CHANGED (predtym: Založené v roku 969 fatimidským generálom Jawharom al-Siqillim pri starovekom rímskom pevnostnom bode Babylone, Al-Qāhir)
 dadu_desc: "Na rovinách južne od pohoria Tàiháng vybudoval Kublaj chán Dàdū, 'Veľké hlavné mesto', ako sídlo svojej dynastie Yuán v roku 1267 na troskách Zhōngdū z dynastie Jīn. Marco Polo obdivoval jeho veľkoleposť, opisujúc mesto so širokými bulvármi, rozľahlými palácmi a skladišťami prehýbajúcimi sa pod bohatstvom celej Číny. Aj keď mongolská moc bledla, postavenie mesta pri severnej bráne medzi stepami a čínskou vnútrozemskou oblasťou zaručilo jeho pretrvanie ako cisárskeho centra." # todo: CHANGED (predtym: Na rovinách južne od pohoria Taihang vybudoval Kublaj chán Dàdū, 'Veľké hlavné mesto', ako sídlo svojej dynastie Jüan v )
 venice_desc: "Vyrástla z bahnitých plytčín adriatského lagúna, Benátky boli tvarované nutnosťou k ambícii. Utečenci pred lombardskými nájazdmi sa najprv schránili na ostrovoch, a do 9. storočia sa mesto rozrástlo v námornu republiku spravovanú voleným dóžom. Zo svojho Arsenálu a účtovníckych domov benátski obchodníci vládli obchodným trasám od Čierneho mora po Levant, čo urobilo Benátky najbohatším mestom kresťanského sveta a nepochybným pánom stredomorského obchodu." # todo: NEW TRANSLATION
 moscow_desc: "Založená ako malá drevená pevnosť Jurijom Dolgorukijom v roku 1147 na brehu rieky Moskva, Moskva dlho stávala v tieni starších ruských miest. No pod mongolskou nadvládou sa moskovské kniežatá ukázali bystré v prežití a expanzii, vyberajúc tribut pre Zlatú hordu a potichu pohlcujúc susedné kniežatstvá. Poloha Moskvy na križovatke severných riečnych trás jej poskytla obchodnú oporu, z ktorej postupne rástla, a začiatkom 14. storočia jej veľkoknieža disponovalo väčšou mocou než ktorýkoľvek iný panovník v Rusi." # todo: CHANGED (predtym: Založená ako malá drevená pevnosť Jurijom Dolgorukým v roku 1147 na brehu rieky Moskva, Moskva dlho stávala v tieni star)
 tenochtitlan_desc: "Okolo roku 1325, podľa legendy, že ich boh Huitzilopochtli prisľúbil ostrov, kde bude orol sedieť na kaktuse, založili Mexicovia Tenōchtitlan na bažinatom ostrovčeku v jazere Texcoco. Mladé sídlo vzniklo na mieste ponúkajúcom prirodzenú obranu aj prístup k bohatým zdrojom okolitých brehov údolia a rýchlo rástlo. Jeho násypy, vyvýšené záhrady a vojenské tradície raz urobili z neho najväčšie mesto v Amerike a srdce mocnej ríše." # todo: CHANGED (predtym: Okolo roku 1325, podľa legendy, že ich boh Huitzilopochtli prisľúbil ostrov, kde bude orol sediaci na kaktuse, zaločili )
 delhi_desc: "Situovaná na západnom brehu Yamuny slúžila Dillí ako sídlo moci pre postupné dynastie už od staroveku. Otrocká dynastia tu založila Dilliský sultanát v roku 1206, a za vlády panovníkov ako Iltutmish a Alauddin Khalji sa mesto stalo predným islamským hlavným mestom Južnej Ázie. Jeho veľké mešity, trhy a pevnosti priťahovali učencov a obchodníkov z celého islamského sveta, upevňujúc miesto Dillí ako brány, cez ktorú sa vládlo veľkej časti subkontinentu." # todo: NEW TRANSLATION
 prague_desc: "Vyvýšené nad zákrutou Vltavy, Praha vyrástla z slovanského brodového sídla do jedného z veľkých miest stredovekej Európy. Přemyslovská dynastia vystavala svoj hrad a katedrálu na skalnom výbežku Hradčanov, a pod nimi zakvitlo prosperujúce obchodné mesto. Ako sídlo českých kráľov a prirodzená križovatka medzi východnou a západnou Európou priťahovala nemeckých a židovských obchodníkov, remeselníkov a učencov, stávajúc sa do začiatku 14. storočia jedným z najľudnatejších a najbohatších miest severne od Álp." # todo: NEW TRANSLATION
 vienna_desc: "Rímania ju nazývali #italic Vindobona#! a zriadili tu légionársku pevnosť na Dunaji, aby strážili severnú hranicu impéria. Po tom, čo obdobie sťahovania národov zmietlo rímsky poriadok, sa znovu objavila ako sídlo markgrófov Babenbergovcov, ktorí na tej istej strategickej pôde vybudovali mesto hodné svojich ambícií. Keď Habsburgovci v roku 1278 nahradili Babenbergovcov, Viedeň sa stala oporou dynastickej ríše; jej poloha na križovatke dunajského údolia robila z mesta jedno z najstrategickejšie žiadaných v Svätej ríši rímskej." # todo: CHANGED (predtym: Rímania ju nazývali italic Vindobona !, zriadili tu légionársku pevnosť na Dunaji, aby strážili severnú hranicu impéria.)
 baghdad_desc: "Založený v roku 762 abbasidským kalifom al-Manṣūrom na západnom brehu Tigridu, Bagdad bol od počiatku navrhnutý ako stred sveta. Jeho kruhový plán, legendárne Okrúhle mesto, umiestnil palác kalifa a veľkú mešitu v jeho centre, obklopené trhmi a obydliami vyžarujúcimi navonok. Na vrchole abbasidskej moci tu žilo viac ako milión obyvateľov, jeho Dom múdrosti priťahoval učencov z celého známeho sveta na preklady, debaty a objavy. Mongolský vpád v roku 1258 túto zlatú éru zničil, no mesto pretrvalo, stále najväčšou metropolou srdca Tigristo-Eufratskej oblasti." # todo: CHANGED (predtym: Založený v roku 762 abbasidským kalifom al-Mansúrom na západnom brehu Tigridu, Bagdad bol od počiatku navrhnutý ako stre)
 florence_desc: "Prekrývajúca sa cez Arno v srdci Toskánska, Florencia vyrástla z rímskej kolónie do mesta obchodníkov a bankárov, ktorí preformovali európsky obchod. Veľké bankové domy Bardi, Peruzzi a Strozzi rozšírili svoje úvery naprieč kráľovstvami, a zlatý florén, ktorý razili, sa stal štandardnou menou medzinárodného obchodu. Zrážky medzi #italic Guelfi#! a #italic Ghibellini#! a vláda mocných cechov dali Florencii divokú mestskú hrdosť spojenú s mimoriadnym bohatstvom, čím položila základy umeleckého a intelektuálneho rozkvetu, ktorý čoskoro urobil mesto predmetom závisti celého sveta." # todo: CHANGED MINOR
 samarkand_desc: "Jedno z najstarších miest Strednej Ázie, Samarkand ležal na Hodvábnej ceste, tam, kde karavány so silkami, korením a myšlienkami prechádzali medzi Čínou a Stredozemím. Pod Samánovcami a Karachánovcami prosperoval ako významné islamské centrum učenia a remeselnej výroby, jeho majstri boli známi v celom známom svete pre jemné kovové práce a výrobu papiera. Aj keď bol zničený Genghisovými vojskami v roku 1220, poloha mesta na veľkých obchodných trasách zabezpečila jeho oživenie; jeho bazáre a dielne opäť priťahovali obchod polovice sveta." # todo: CHANGED (predtym: Jedno z najstarších miest Strednej Ázie, Samarkand ležal na Hodvábnej ceste tam, kde karavány so silkami, korením a myšl)
 novgorod_desc: "Pán Novgorod Veľký, ako si ho hrdí občania nazývali, vyrástol z vikingského obchodného prístavu na rieke Volkhov do najsilnejšej obchodnej republiky severnej Európy. Jeho volená zhromaždenie, #italic veche#!, vládla hlasom demokracie, aký sa v feudálnom svete len zriedka počul, a jeho hansovnícki obchodní partneri rozvážali novgorodské kožušiny, vosk a jantár na trhy od Londýna po Lübeck. Zatiaľ čo iné ruské mestá padli počas mongolského zničenia v 30. rokoch 13. storočia, severná poloha Novgorodu ho uchránila, čo z neho urobilo najbohatšie a najnezávislejšie mesto celej Rusi." # todo: NEW TRANSLATION
 lisbon_desc: "Zaberajúc prirodzený prístav, kde Tagus ústi do Atlantiku, Lisabon poskytoval útočisko námorníkom a obchodníkom už od fénickej doby. Rímania ho opevnili ako #italic Olisipo#!, a v 8. storočí jeho mauroví vládcovia premenili mesto na prosperujúcu metropolu mešít a palácov. Po tom, čo ho v roku 1147 dobyl Afonso I. s pomocou križiackych rytierov, sa Lisabon stal hlavným mestom zrodzujúceho sa Portugalského kráľovstva a dôležitým atlantickým prístavom, jeho hlboký prístav a západné smerovanie už ukazovali k neprebádanému oceánu za obzorom." # todo: CHANGED (predtym: Zaberať prirodzený prístav, kde Tagus ústi do Atlantiku, Lisabon poskytoval útočisko námorníkom a obchodníkom už od féni)
 sevilla_desc: "Rozprestierajúc sa cez Guadalquivir na úrodných planinách Andalúzie, Sevilla bola jedným z klenotov maurovskej Španielska. Pod Umajjovcami a neskôr Almohadmi rozkvitala ako centrum kultúry, vedy a obchodu, jej veľká mešita stojaca pri rieke bola dôkazom dosahu islamskej civilizácie v Iberii. Dobytá Ferdinandom III. Kastílskym v roku 1248, mesto si zachovalo svoj kozmopolitný charakter a stalo sa najbohatším mestom kresťanskej Španielska, jeho riečny prístav smeroval bohatstvo Andalúzie do širého sveta." # todo: NEW TRANSLATION
 hangzhou_desc: "V sláve známe ako #italic Kinsai#!, čo znamená 'dočasné hlavné mesto', Hángzhōu slúžilo ako sídlo južnej Sung dynastie po páde severu pred žurčenskými Jinmi v roku 1127. Marco Polo, ktorý navštívil koncom 13. storočia, ho nazval najväčším mestom na svete, obdivujúc jeho kanály, trhy s hodvábom a veľké námestia, kde sa obchodovalo so všetkým možným tovarom. Aj po mongolskom dobytí v roku 1279 jeho postavenie na vrchole Veľkého kanála a dominancia v obchode s hodvábom a porcelánom zabezpečili jeho prežitie ako jedného z popredných čínskych komerčných miest." # todo: CHANGED (predtym: V sláve známe ako italic Kinsai !, čo znamená 'dočasné hlavné mesto', Hangzhou slúžilo ako sídlo južnej Sung dynastie po)
 bruges_desc: "Na vrchole stredovekého obchodu slúžil Bruggy ako veľký trh severnej Európy, kde benátske galeje, hansovné kogy a iberské karavely vykladali svoje náklady. Založené na prílivovom zálive spájajúcom mesto s Severným morom, jeho haly na látky a burza, považovaná za prvú burzu na svete, urobili z Bruggy finančnú metropolu severu. Od anglickej vlny po levantínske korenie plynulo bohatstvo známeho sveta jeho kanálmi a účtovníckymi domami." # todo: NEW TRANSLATION
 cologne_desc: "Založené ako #italic Colonia Claudia Ara Agrippinensium#! Rimanmi v roku 50 n. l., Kolín vyrástol na najväčšie mesto stredovekého Nemecka a jedno z najsilnejších arcibiskupstiev vo Svätom rímskom impériu. Nádherná gotická katedrála, začatá v roku 1248, aby uchovala relikvie Troch kráľov, stúpala ako symbol ambícií a viery mesta. Ako slobodné cisárske mesto a zakladajúci člen Hanzovej ligy Kolín ovládal dôležitú dunajskú obchodnú cestu a slúžil ako brána medzi Severným morom a jadrom impéria." # todo: NEW TRANSLATION
 bursa_desc: "Umiestnená pod svahmi bitynskej Olympu, Bursa bola prosperujúcim byzantským mestom, keď ju v roku 1326 po desaťročnom obliehaní dobyl osmanský vodca Orhan. Orhan urobil z nej prvé skutočné hlavné mesto osmanského štátu, postavil mešity, karavanseraje a krytý bazár, ktoré formovali charakter mesta na stáročia. Ako západný terminál hodvábnych karaván zo Východu a producent jedného z najkvalitnejších hodvábnych látok na svete, Bursa rástla do mesta mimoriadného bohatstva a stala sa semenom, z ktorého osmanská ríša rozkvitla." # todo: NEW TRANSLATION
 kyoto_desc: "Keď cisár Kanmu presunul cisársky dvor sem v roku 794 a pomenoval ho #italic Heian-kyō#!, čo znamená 'Hlavné mesto pokoja a pokoja', Kyōto sa stalo srdcom japonskej civilizácie na stáročia. Jeho sieť širokých tried obklopených aristokratickými sídlami a buddhistickými chrámami hostila najjemnejšiu dvorovú kultúru na svete, ktorá vytvorila poéziu, maľbu a literatúru obdobia Heian. Hoci občianske vojny, požiare a vzostup samurajov opakovane otrasali jeho múrmi, mesto pretrvalo ako sídlo cisára a kultúrna duša Japonska." # todo: CHANGED (predtym: Keď cisár Kanmu presunul cisársky dvor sem v roku 794 a pomenoval ho italic Heian-kyō !, čo znamená 'Hlavné mesto pokoja)
 timbuktu_desc: "Vyrastajúc z okraja Sahary pri zákrute Nílu Nigeru, Timbuktu sa z pôvodného sezónneho tábora Tuaregov zmenilo na jedno z veľkých miest stredovekej Afriky. Pod Malianskou ríšou sa stalo križovatkou transsaharského obchodu, kde karavány nesúce soľ zo severu stretávali zlato a slonovinu prichádzajúce z juhu. Jeho mešity a #italic madrasas#! priťahovali islamských učencov z celého kontinentu, čím sa mesto stalo centrom učenia, ktorého knižnice ukrývali desaťtisíce rukopisov o teológii, matematike a astronómii." # todo: NEW TRANSLATION
 barcelona_desc: "Založená ako rímska kolónia #italic Barcino#! v 1. storočí pred n. l., Barcelona vyrástla na hlavné mesto Hrabstva Katalánska a do 12. storočia sa stala námorným motorom Koruny Aragónu. Jej obchodná flotila a konzuláty siahaly od Baleár po Sicíliu a od Sardínie po križiacke prístavy Grécka, čím sa stala dominantnou námornou mocou západného Stredozemia. Na svahoch pod veľkou katedrálou a starovekými rímskymi hradbami bzučalo mesto obchodom námornej veľmoci, ktorá hľadela k moru pre svoje bohatstvo a osud." # todo: NEW TRANSLATION
 cordoba_desc: "Vo svojej zlatej ére bola Córdoba najväčším mestom západnej Európy, mesto pol milióna duší, dláždených ulíc a verejných kúpeľov, knižníc, ktoré zatienili čokoľvek, čo kresťanský svet ponúkal. Pod 'Abd ar-Raḥmānom III., ktorý sa v roku 929 vyhlásil za chalífu, sa stala hlavným mestom konkurenčného chalífátu, ktorý vyzýval Abbásovcov v Bagdade i Karolingovcov na severe. Učenci ako Averroes a Maimonides kráčali po jej uliciach, a jej Veľká mešita, #italic Mezquita#!, stála ako pamiatka na mimoriadnu civilizáciu, ktorá sa usadila na iberskej pôde. Zajatie mesta Ferdinandom III. Kastílskym v roku 1236 túto éru ukončilo, no jej dedičstvo prežilo v poznaní, ktoré uchovala a odovzdala svetu." # todo: CHANGED (predtym: Vo svojej zlatej ére bola Córdoba najväčším mestom západnej Európy, mesto pol milióna duší, dláždených ulíc a verejných )
 damascus_desc: "Jedno z najstaršie neprerušené obývaných miest na svete, Damascus ovláda úrodný oázový pás pod Anti-Libanonmi, jeho trhy zásobené vodami rieky Barada. Ako hlavné mesto Umajjovského chalifátu v 7. a 8. storočí stálo v centre najrozsiahlejšej ríše, akú svet dovtedy poznal, jeho Veľká mešita vystupovala ako jedno z najvznešenejších diel islamskej architektúry. Hoci Abbásovci presunuli moc do Bagdadu, Damascus zostal jedným z popredných obchodných a kultúrnych miest Levantu, jeho bazáre obchodovali s hodvábom, jemnými mečmi a vonnými ružami, pre ktoré bol preslávený." # todo: NEW TRANSLATION
 angkor_desc: "Hlboko v lesoch pevninnej juhovýchodnej Ázie budovali khmerskí králi v Angkore hlavné mesto, aké nemalo obdobu. Začaté pod Suryavarmanom II. na začiatku 12. storočia, rozľahlý chrámový komplex Angkor Wat bol zasvätený Višnu a navrhnutý ako pozemský obraz kozmu, jeho priekopy reprezentovali kozmický oceán a veže vrchy Meru. V najväčšej sláve bola širšia oblasť Angkor udržiavaná zložitým systémom nádrží a zavlažovacích kanálov, čo z nej robilo jedno z najrozsiahlejších mestských komplexov predindustriálneho sveta." # todo: NEW TRANSLATION
 vijayanagar_desc: "Založené v roku 1336 na južnom brehu rieky Tungabhadra bratmi Hariharom a Bukka Rayom, Vijayanagar, 'Mesto víťazstva', bolo vybudované ako opora hinduistickej civilizácie proti expanzii Dilliského sultanátu. Chránené Tungabhadrou a neprístupnou krajinou žulových balvanov a skalnatých roklín už novo vznikajúce hlavné mesto ovládalo úrodné planiny stredného Dekanu. Z tohto skalnatého pevného bodu vyrástla ríša, ktorá pretrvala viac než dve storočia, jej trhy priťahovali obchodníkov a tovar z celého Indického oceánskeho sveta." # todo: NEW TRANSLATION
 naples_desc: "Založené ako grécka kolónia Neapolis okolo roku 600 pred n. l. na brehu svojho úchvatného zálivu, mesto prešlo rímskymi, byzantskými, normanskými a hohenštaufenskými rukami skôr, než Angevínovci urobili z Neapola hlavné mesto Kráľovstva Neapol v roku 1266. Za Angevínov sa stalo jedným z veľkých kráľovských dvorov stredovekej Európy a najľudnatejším mestom Talianska, jeho prístav odvádzal bohatstvo Mezzogiorna do širého sveta. Dvor v Neapole priťahoval učencov, umelcov a teológov, medzi nimi Tomáša Akvinského, ktorý tu učil a zomrel, čím sa mesto stalo centrom intelektuálneho života aj dynastickej moci." # todo: NEW TRANSLATION
 milano_desc: "Vznikajúce v srdci Pó oplainy, pôvod Milána ako keltské sídlo ustúpil, keď Rímania urobili z neho #italic Mediolanum#!, na určitý čas de facto hlavné mesto západnej ríše. Po úpadku spôsobenom migráciami barbarských kmeňov sa mesto obnovilo ako slobodná comuna, ktorá v roku 1176 odrazila cisára Fridricha Barbarossu a jeho cisárske armády v bitke pri Legnane. Pod rodinou Visconti, ktorá uchopila signorálnu moc koncom 13. storočia, sa Miláno stalo sídlom vlády, ktorá postupne vstrebávala okolité mestá Lombardie a stala sa dominantnou silou severného Talianska." # todo: NEW TRANSLATION
 genoa_desc: "Ukryté za oblúkom ligurských Apenínov, Janov vybudoval svoju veľkosť úplne na mori. Jeho obchodníci a admirálovia vytvorili námornú ríšu obchodných staníc a kolónií siahajúcich od Čierneho mora po Atlantik, a ich flotily sa opakovane stretávali s benátskymi pri súťaži o nadvládu nad stredomorským obchodom. Poháňaný neúprosnou ambíciou veľkých rodín, Doria, Grimaldi a Spinola, republika získala hrdé označenie #italic La Superba#! a dokázala, že mesto takmer bez zázemia môže napriek tomu patriť k najbohatším silám kresťanského sveta." # todo: NEW TRANSLATION
 bologna_desc: "Založená ako etruské mesto #italic Felsina#! a neskôr rímska kolónia #italic Bononia#!, Bologna leží na úpätí Apenínov, kde Via Emilia stretáva cesty na sever do Po nížiny. Je známa predovšetkým svojou univerzitou, založenou v roku 1088 a považovanou za najstaršiu na svete, ktorá prilákala študentov práva, medicíny a filozofie z každého kúta Európy do svojich posluchární a do tieňa svojich dvoch stredovekých veží. Bohatstvo jej obchodníkov, autorita biskupov a nezávislosť komuny urobili z Bologne jedno z najžiadanejších miest v politike stredovekého Talianska." # todo: NEW TRANSLATION
 palermo_desc: "Kolísku medzi dvoma výbežkami na severnom pobreží Sicílie založili fénickí obchodníci a mesto rástlo pod karthágskou a neskôr byzantskou vládou, než ho arabské dobytie 9. storočia premenilo na prosperujúcu islamskú metropolu mešít, záhrad a bazárov. Normanskí králi, ktorí ho dobyli v roku 1072, nadviazali na túto kozmopolitnú tradíciu s mimoriadnymi výsledkami, spájajúc arabské, byzantské a latinské prvky do trblietavých kráľovských kaplniek a palácov, ktoré vyhlasovali civilizáciu bez obdobia v kresťanskom svete. Ako hlavné mesto Normanského kráľovstva Sicílie a neskôr Hohenstaufenskej ríše sa Palermo stalo jedným z najvzdelanejších a najsilnejších kráľovských dvorov stredoveku." # todo: NEW TRANSLATION
 verona_desc: "Rozprestierajúca sa cez rieku Adige na južnom okraji Álp, Verona bola miestom prechodu už od staroveku; jej veľký rímsky amfiteáter, jeden z najväčších a najlepšie zachovaných na svete, stále dominuje uliciam, po ktorých prechádzali légie a obchodníci. Pod rodinou della Scala, Scaligeri, ktorá uchmatla moc koncom 13. storočia, sa stala jednou z najsilnejších #italic signorie#! severného Talianska, jej páni dominovali Veneto a rozširovali vplyv k Jadranu. Medzi tými, ktorí našli útočisko na scalgierovskom dvore, bol Dante Alighieri, ktorý dokončoval svoju #italic Commedia#! pod patronátom Cangrandeho della Scala počas svojho dlhého florentského exilu." # todo: CHANGED (predtym: Rozprestierajúca sa cez rieku Adige na južnom okraji Álp, Verona bola miestom prechodu už od staroveku; jej veľký rímsky)
 siena_desc: "Postavená na troch kopcoch v srdci Toskánska, Siena bola jednou z veľkých mocností stredovekého Talianska, jej bohatstvo zakorenené v bankovníctve a obchode s vlnou, ktoré urobilo sienštiny za veriteľov kráľov a pápežov. Mestska súťaž so susednou Florenciou, vzdialenou len necelých päťdesiat kilometrov, formovala dejiny oboch po celé generácie, zatiaľ čo jej veľké centrálne námestie, Campo, slúžilo ako javisko občianskeho života a politickej drámy jednej z najhrdších talianskych komun. Maľby Duccia di Buoninsegna a bratov Lorenzetti urobili zo Sieny jedno z popredných centier gotického umenia v Európe." # todo: NEW TRANSLATION
 pisa_desc: "Na ústí Arna vybudovala Pisa jednu z veľkých námorných ríš stredomoria, jej flotily plienili Palermo v roku 1063, porážali saracénskych korzárov cez Tyrrhénske more a zakladali obchodné kolónie od Sardínie po Antiochiu. Obohatení týmto obchodom, Pisanisti vystavali mimoriadny súbor katedrály, baptistéria a zvonice na #italic Campo dei Miracoli#!, pamätníky mesta, ktorého bohatstvo a dôvera v 12. storočí sa zdali bez hraníc. Hoci katastrofická porážka od Janova v bitke pri Melorii v roku 1284 zlomila pisanckú námornú moc, mesto a jeho pozoruhodné pamiatky prežili." # todo: NEW TRANSLATION
 padova_desc: "Podľa legendy založená trójskym hrdinom Antenorom a kvitnúca ako jedno z najbohatších miest rímskej Italie, Padova sa v stredoveku rozrástla do prosperujúcej komuny v srdci Veneto. Jej univerzita, založená v roku 1222 učencami, ktorí sa odtrhli od Bologne, rýchlo sa stala jedným z popredných centier práva a medicíny v Európe, priťahujúc študentov z celého kontinentu. Začiatkom 14. storočia veľký maliar Giotto premenil interiér jej Kaplnky Arény na orientačný bod západného umenia, zatiaľ čo mesto v prosperite pod vládou rodu Carrara rástlo ako dvor učenia a ambícií." # todo: NEW TRANSLATION
 ferrara_desc: "Vyrastajúca na okraji močarísk delty Pó, Ferrara sa vyvinula z nenápadného riečneho priechodu do mesta formovaného ambíciami rodu Este, ktorý sa v 13. storočí ujal vlády. Pod ich dlhým patrónátom sa mesto stalo centrom rytiernej kultúry a jemného dvorového života, jeho páni hostili básnikov, turnaje a učené debaty, pričom obratne navigovali rivality Milána, Benátok a Pápežských štátov. Široké priame ulice a impozantný estský hrad, ktoré definovali charakter Ferrary, boli symbolom mesta, kde boli poriadok a elegancia rovnako dôležité ako múry a vojaci." # todo: NEW TRANSLATION
 parma_desc: "Založená Rimanmi na Via Emilia v roku 183 pred n. l., Parma sa stala jedným z veľkých miest lombardskej nížiny; jej poloha na veľkej ceste medzi Milánom a Bolognou a úrodné okolie jej zaistili stálu prosperitu a robili z nej neustále sporný cieľ. Ako slobodná comuna bola jedným z najživších členov Lombardskej ligy proti cisárovi Fridrichovi Barbarossovi, a po rokoch krutých straníckych sporov medzi guelfmi a gibelinmi prešla rukami nasledujúcich signorov. Jej katedrála a baptistérium, postavené v románskom štýle 12. storočia, vyjadrovali mestskú zbožnosť a bohatstvo, ktoré pretrvalo politické otrasenia jej komunného veku." # todo: NEW TRANSLATION
 mantova_desc: "Obkolesená na troch stranách jazerami vytvorenými pomalou riekou Mincio, Mantova zaujíma jednu z najľahšie brániteľných pozícií v severnom Taliansku a je obývaná od doby bronzovej. Rímania ju oslávili ako rodište Vergilia, najväčšieho z ich básnikov, a osud mesta bol dlhodobo formovaný umeleckými a literárnymi ambíciami jeho panovníkov. Začiatkom 14. storočia začal v Mantove vystupovať rod Gonzaga a pod jeho dlhým patrónátom sa mesto rozrástlo na jeden z najvychovanejších a najjemnejších dvorov Talianska." # todo: CHANGED (predtym: Obkolesená na troch stranách jazerami vytvorenými pomalou riekou Mincio, Mantova zaujíma jednu z najľahšie brániteľných )
 lucca_desc: "Uzavretá v rámci svojho starovekého rímskeho uličnoho rasteru a obklopená bohatým vidiekom produkujúcim hodváb v Garfagnane, Lucca bola jedným z najbohatších miest stredovekého Talianska. Jej obchodníci sa šírili po Európe, ich bankové domy a obchod s hodvábom spravili zo #italic Lucchese#! synonymum pre jemné látky na trhoch Paríža, Londýna a Bruggy, zatiaľ čo doma si mesto nahromadilo dostatok bohatstva na vybudovanie jednej z najlepších zbierok románskych kostolov v Toskánsku. Aj keď opakovane ohrozené Pisou a Florenciou, Lucca ozajstne sa držala nezávislosti s obdivuhodnou pevnosťou, jej pevné múry a tvrdá mestská hrdosť udržiavali slobodu dlhšie než mnohé konkurenčné mestá podľahli vláde pánov." # todo: NEW TRANSLATION
 messina_desc: "Ovládajúc úzky prieliv, ktorý oddeľuje Sicíliu od talianskej pevniny, Messina bola založená gréckymi kolonistami, ktorí jej dali meno #italic Zánklē#! podľa polmesiaca tvaru jej prístavu; jej poloha ju spravila od samého počiatku jedným z veľkých strategických prístavov Stredozemia. Práve cez Messinu začali Normani svoju dobyvateľskú kampaň na Sicíliu v roku 1061, a cez jej prístav prechádzali armády každého nasledujúceho veku — anjevinské, hohenštaufenské i križiacke vojská smerujúce do Svätej zeme. Hoci opakovane otrasené zemetraseniami a politickými otrasmi, jej výnimočný prírodný prístav zabezpečil, že sa vždy zotavilo, priťahujúc obchod aj konflikty v rovnakej miere." # todo: CHANGED (predtym: Ovládajúc úzky prieliv, ktorý oddeľuje Sicíliu od talianskej pevniny, Messina bola založená gréckymi kolonistami, ktorí )
 brescia_desc: "Ležiaca na úpätí alpských predhorí, kde predalpy klesajú smerom k lombardskej nížine, Brescia bola jedným z veľkých priemyselných miest stredovekého Talianska, jej výhrevné pece vyrábali zbrane a brnenia známe kvalitou, ktoré sa obchodovali po celej Európe. Ako slobodná comuna bola jedným z najaktívnejších členov Lombardskej ligy, a odpor jej občanov voči cisárskym armádam sa stal pilierom tradície severotalianskej komuny. Vtlačená medzi veľké ambície Milána a Benátok, strategická poloha Brescie pri vchode do alpských priechodov a kvalita jej remeselníkov robili z mesta cenné územie, ktoré žiadna z mocností nechcela ľahko vzdať." # todo: NEW TRANSLATION
 cremona_desc: "Založená Rimanmi na južnom brehu Pó ako pohraničná kolónia v roku 218 pred n. l., Cremona vyrástla do jedného z veľkých miest lombardskej nížiny; jej poloha na rieke z nej urobila prirodzené stredisko cestnej a vodnej dopravy medzi východom a západom. Mesto sa stalo synonymom gibelinovej lojality v krutých vojnách medzi cisárom a pápežom, trpiac pre svoje prívrženectvá, ale tiež získavajúc mimoriadne cisárske priazne a bohatstvo. Jeho panoráma, dominovaná veľkým #italic Torrazzo#!, najvyššou stredovekou zvonicou v Taliansku, a lesom konkurenčných rodinných veží, hlásala súťažnú mestskú hrdosť mesta, kde sa moc prejavovala rovnako vášnivo, ako sa vykonávala." # todo: NEW TRANSLATION
 pavia_desc: "Dve storočia po páde Ríma slúžila Pavia ako hlavné mesto Lombardského kráľovstva v Taliansku, sídlo jeho bojových kráľov a strážca ich železnej koruny. Karolínski cisári ju udržiavali ako svoje talianske sídlo, a po dlhú dobu si udržiavala prestíž kráľovského a korunovačného mesta aj po včlenení lombardského kráľovstva do franskej ríše. Jej univerzita, jedna z najstarších v Taliansku, kvitla už v 9. storočí, a poloha pri rieke Ticino ovládajúca západný prístup do Po údolia zabezpečila, že Pavia zostala územím, o ktoré sa bojovalo každou mocnosťou, ktorá chcela dominovať na severe." # todo: NEW TRANSLATION
 perugia_desc: "Na vrchole kopca nad horným Tiberovým údolím leží Perugia, jedna z dvanástich etruských miest a neskôr prosperujúce rímske mestečko, ktoré v stredoveku vyraďovalo ako jedno z najobávanejších a najbouřlivejších nezávislých komun stredného Talianska. Jej veľký Palazzo dei Priori a Fontana Maggiore, dokončená v roku 1278 so sochárskou výzdobou Nicola a Giovanniho Pisano, vyjadrovali občiansku hrdosť a umelecké ambície, ktoré konkurovali čomukoľvek v Toskánsku. Univerzita založená tu v roku 1308 potvrdila Perugiu v snahe zosúladiť vojenskú a politickú silu s rovnocennou reputáciou učenia." # todo: NEW TRANSLATION
 ancona_desc: "Založená ako grécka kolónia syrakúzskymi vyhnancami na adriatskom pobreží, Ancona dostala meno od gréckeho slova pre lakeť, opisujúceho zakrivený výbežok, ktorý chráni jej prístav zo severu. V stredoveku sa stala najdôležitejším prístavom centrálneho Jadranu, jej obchodníci obchodovali s byzantským Konštantínopolom a prístavmi Levantu. Napriek opakovaným pokusom pápežov a cisárov prinútiť ju k poslušnosti, Ancona si zachovala tvrdú komunnú nezávislosť; jej prístav a flotila boli základmi slobody, ktorú mesto žiarlivo strážilo celé stáročia." # todo: NEW TRANSLATION
 aquila_desc: "Jedno z najmladších veľkých miest stredovekého Talianska, L'Aquila bola založená okolo roku 1254 spojením takmer stoviek dedín z Abruzza, z ktorých každá údajne prispela kostolom, fontánou, štvrťou a zvonom do nového mesta. Položené vysoko v Apenínach v srdci horského kráľovstva, mesto rýchlo vyrástlo na hlavné mesto Abruzza; jeho poloha a hradby zabezpečovali obranu proti rivalom a ambíciám vzdialeného Neapolského dvora. Neobvyklé okolnosti jeho založenia, so skoro stovkou prispievajúcich komun, ktoré si každá zachovala časť občianskej identity, dali L'Aquile zvláštnu komplexnosť a pýchu, akú máloktoré mesto na južnom Taliansku malo." # todo: NEW TRANSLATION
 ravenna_desc: "Po krátke, ale výnimočné storočie slúžila Ravenna ako posledné hlavné mesto Západorímskej ríše, a keď Rím padol v roku 476, boli to dvory Odoakra a neskôr ostrogótskeho kráľa Theodoricha, ktoré tu udržiavali formy a tradície rímskej správy. Byzantské znovudobytie v 6. storočí spravilo z mesta západný okraj Konštantínopolu, sídlo exarchátu Ravenna, a práve za tohto obdobia gréckej imperiálnej nadvlády vznikli jeho úchvatné mozaikové cykly v kostoloch a mauzóleách. Hoci dlho zatienené Bolognou a rastúcimi mestami Po údolia, Ravenna si vynútila pamäť impériálnej slávy prostredníctvom svojho výnimočného umenia, ktoré nikde inde v latinskom západe nemalo obdobu." # todo: NEW TRANSLATION
 salerno_desc: "Usporiadaná medzi morom a horami Amalfského pobrežia na chránenom zálive, Salerno si vybral normanský dobyvateľ Robert Guiscard ako svoje hlavné mesto po jeho dobytí v roku 1076, slúžiace ako prvé sídlo normanskej moci v južnom Taliansku skôr, než sa kráľovský dvor presunul do Palerma. Mesto je najznámejšie svojou #italic Schola Medica Salernitana#!, najstaršou lekárskou školou v Európe, ktorá od 9. storočia spájala grécke, arabské a latinské lekárske tradície na tomto kozmopolitnom južnom brehu. Lekári vycvičení v Salerne sa šírili po kontinente a jej texty o anatómii, chirurgii a bylinnej medicíne formovali prax medicíny v celom stredovekom svete." # todo: NEW TRANSLATION
 syracuse_desc: "Založená korintskými osadníkmi v roku 734 pred n. l. na malom ostrove pri vstupe do veľkého prístavu, Syrakúzy vyrástli na najsilnejšie grécke mesto západného Stredomoria; jeho moc bola podčiarknutá katastrofickou porážkou, ktorú uštedrilo aténskej expedícii v rokoch 415–413 pred n. l. Práve tu Archimedes vynašiel legendárne vojnové stroje, ktorými mesto držalo rímske armády na uzde, a tu successive dobyvatelia — kartáginskí, rímski, byzantskí, arabskej a normanskí — vždy ocenili prístav natoľko, že ho nenechali opustený. Hoci dlhodobo zatienené Palermom, Syrakúzy pretrvali ako najväčšie mesto juhovýchodnej Sicílie; jeho staroveký prístav a dláždené ulice svedčia o civilizácii, ktorej brilantnosť formovala celé staroveké Stredomorie." # todo: NEW TRANSLATION
 trebizond_desc: "Vysadené na úzkej pobrežnej polici medzi Pontickými horami a Čiernym morom bolo Trebizond jedným z najdramatičnejšie situovaných miest stredoveku. Keď Konštantínopol padol štvrtou križiackou výpravou v roku 1204, členovia komnenovskej dynastie utiekli sem a založili Trapezuntské cisárstvo, ktoré pretrvalo ako nezávislý grécky kresťanský štát dlho po tom, čo latinské cisárstvo padlo. Ovládajúc východný koniec čiernomorskej obchodnej trasy a horské priechody do Arménska a Perzie, priťahovalo mesto janovských obchodníkov a stalo sa prosperujúcim západným terminálom Hodvábnej cesty, jeho trhy prinášali tovar zo Strednej Ázie a za." # todo: NEW TRANSLATION
 smyrna_desc: "Jedno zo starovekých miest egejského pobrežia, Smyrna bola medzi lokalitami, ktoré si nárokovali poctu Homérovho narodenia, a neskôr sa stala jedným zo Sedem cirkví Malej Ázie, ktorým je venovaný Zjavenie. Pod byzantskou vládou slúžila ako významný prístav spájajúci bohaté anatolské vnútrozemie s egejským obchodom, jej prístav navštevovali benátski a janovskí obchodníci, ktorí tu zakladali kolónie pozdĺž jej móla. Koncom 13. a začiatkom 14. storočia mesto prechádzalo rýchlo medzi byzantskými, janovskými a aydinskými tureckými rukami; jeho výnimočná poloha z neho robila cieľ, ktorý žiadna moc v Egejskom mori nemohla ignorovať." # todo: NEW TRANSLATION
 konya_desc: "Posadené na vysokej plošine strednej Anatolie, Konya slúžila ako hlavné mesto Sultánátu Rum, tureckého štátu, ktorý dominoval Anatolii počas väčšiny 12. a 13. storočia. Pod seldžuckými sultánmi mesto rozkvitlo ako centrum islamského umenia, architektúry a učenia; jeho obložené mauzóleá a madrasy premenili starobylé plošinové mesto na jedno z veľkých kultúrnych centier stredovekého islamského sveta. Tu sa usadil a zomrel mystický básnik Jalāl ad-Dīn Rūmī a práve tu jeho nasledovníci založili mevlevský rád — točiacich sa dervišov — ktorých hudba a obrad rozniesli meno mesta ďaleko za anatolskú plošinu." # todo: CHANGED (predtym: Posadené na vysokej plošine strednej Anatolie, Konya slúžila ako hlavné mesto Sultánátu Rum, tureckého štátu, ktorý domi)
 sivas_desc: "Ovládajúc vysokú plošinu, kde sa stretávajú hlavné trasy medzi Anatoliou a Perziou, Sivas bol jedným z veľkých križovísk stredovekého Blízkeho východu. Pod Sultánátom Rum vyrástol do významného provinčného centra s mimoriadnymi architektonickými ambíciami; veľké madrasy 13. storočia, medzi nimi slávna Gök Medrese a Çifte Minareli, patria k najkrajším príkladom seldžuckej kamenárčiny v Anatolii. Po mongolskom dobytí mesto slúžilo ako kľúčové administratívne centrum anatólskej provincie Ilchanátu, jeho trhy a karavanseraje kanálizovali diaľkový obchod medzi Strednou Áziou a Stredozemím." # todo: NEW TRANSLATION
 kayseri_desc: "Rimanmi známe ako #italic Caesarea Mazaca#!, hlavné mesto starovekej Kappadokie, Kayseri po stáročia slúžilo ako brána medzi anatolskou plošinou a cestami vedúcimi na východ k Arménsku a Mezopotámii. Jedno z prvých centier kresťanstva v Malej Ázii, bolo domovom svätého Bazila Veľkého, ktorého teologické diela a mníšsky poriadok formovali východnú cirkev a ovplyvňujú kresťanskú prax dodnes. Pod seldžukmi a ich nástupcami mesto obohatili mešity, madrasy a karavanseraje; jeho trvalé postavenie ako križovatky anatolského obchodu zabezpečilo, že prechádzalo medzi byzantskými, danišmendovskými, seldžuckými a mongolskými rukami, keď každý vládca vnímal jeho hodnotu." # todo: NEW TRANSLATION
 izmit_desc: "Založené bithýnskym kráľom Nikomédom I. v 3. storočí pred n. l. a Rimanmi známe ako #italic Nicomedia#!, mesto slúžilo ako východné hlavné mesto Rímskej ríše za Diokleciána, ktorý si vybral toto miesto za svoje osobné sídlo a administratívne srdce východných provincií. Práve z Nikomédie v roku 303 Dioklecián spustil svoje Veľké prenasledovanie kresťanov, zbúral hlavnú cirkev v dohľade cisárskeho paláca a zahájil posledný a najsilnejší rímsky útok na vieru. Po založení Konštantínopolu cez vodu bolo postupne zatienené svojím veľkým susedom, no počas byzantských storočí si udržalo dôležitosť ako významný prístav a biskupské centrum." # todo: NEW TRANSLATION
 ankara_desc: "Usadená na skalnatom návrší v srdci anatolskej plošiny, Ankara bola starovekým galatským mestom dávno predtým, než Rímania urobili z nej hlavné mesto svojej provincie Galatia. Jej strategická poloha tam, kde sa cesty z Konštantínopolu, Čierneho mora, Levantu a Perzie všetky zbiehajú, jej dávala trvalý vojenský a obchodný význam; veľký chrám, ktorý jej občania postavili na počesť Augusta, zachoval nápisy, ktoré sú medzi najdôležitejšími dochovanými záznamami rímskej histórie. Pod danišmendmi, seldžukmi Rum a neskôr Mongolmi zostala Ankara kľúčovou križovatkou anatolskej plošiny, mestom, ktorého vlastníctvo znamenalo kontrolu ciest, ktoré ju pretínali." # todo: NEW TRANSLATION
 amasya_desc: "Umiestnená v hlbokom roklinovom údolí, ktoré Yeşilırmak vyhĺbil cez pontské hory, Amasya bola kráľovským hlavným mestom starovekého Pontu a rodišťom geografa Strabona, ktorý ju s náruživosťou popísal vo svojom veľkom diele o geografii sveta. Jej dramatické prostredie, s kráľovskými skalnými hrobkami vytesanými do útesov nad riekou, vyjadrovalo veľkoleposť helenistického kráľovstva, ktoré v úzadí ovládalo veľkú časť Malej Ázie. Pod byzantskou, danišmendovskou, seldžuckou a mongolskou nadvládou si mesto udržalo význam ako hlavné centrum pontských úbočí; jeho hlboká roklina a horské pozadie ho robili jednou z najprirodzenejšie brániteľných pozícií v severnej Anatolii." # todo: NEW TRANSLATION
 rodos_desc: "Po väčšinu staroveku bol Rhodos najbohatším a najkozmopolitnejším prístavom východného Stredozemia; jeho legendárny Kolos, jedno zo siedmich divov starovekého sveta, kedysi stál pri vstupe do prístavu, a jeho námorné právo, #italic Lex Rhodia#!, upravovalo obchod po známom mori. Po stáročiach rímskeho, byzantského a arabského vplyvu ostrov v roku 1309 prešiel do rúk rytierom špitálnym, ktorí ho opevnili a premenili na jednu z najsilnejších kresťanských pevností východného Stredozemia. Za svojimi mohutnými múrmi rytieri premenili Rhodos na centrum križiackej moci, jeho galéry strážili námorné cesty medzi kresťanstvom a islamským východom." # todo: NEW TRANSLATION
 corinth_desc: "Ovládajúc úzky pozemný priechod medzi pevninským Gréckom a Peloponézom a starobylú prenášaciu trasu cez Isthmus, Korint bol jedným z najbohatších a najstrategickejších miest starovekého gréckeho sveta. V čase svojej slávy kontroloval obchod medzi Egejským a Jadranským morom, uvaloval mýta na tovar, ktorý sa ťahal cez pevninu medzi jeho dvoma prístavmi, a jeho bronzové výrobky a dekorovaná keramika sa vyvážali do každého kúta Stredozemia. Hoci bol zničený rímskym generálom Luciom Mummiom v roku 146 pred n. l., Julius Caesar ho znovu založil ako rímsku kolóniu a mesto pretrvalo ako významné centrum, prechádzajúc medzi byzantskými, latinskými a frankovskými rukami, keď každá moc uznávala hodnotu jeho pozície." # todo: NEW TRANSLATION
 candia_desc: "Keď štvrtá križiacka výprava rozbila Byzantskú ríšu v roku 1204, Benátky získali Krétu a urobili z Kandie jej kapitálu, počas nasledujúceho storočia ju prestavali na jedno z najstrategickejších benátskych oporných bodov východného Stredozemia. Úrodné prerie ostrova zásobovali benátske flotily a kolónie, a prístav Kandie slúžil ako kritický zásobovací bod na námorných trasách medzi Benátkami a Levantom. Hoci krétske obyvateľstvo sa opakovane vzbúralo proti svojim benátskym pánom, samotné mesto bolo postupne opevňované a obohacované; jeho múry a sklady vyhlasovali koloniálnu moc, ktorá zamýšľala držať Krétu navždy." # todo: NEW TRANSLATION
 edirne_desc: "Založené rímskym cisárom Hadriánom na brehoch rieky Marica a pomenované #italic Hadrianopolis#! na jeho počesť, Adrianopol strážil hlavnú cestu medzi Konštantínopolom a dunajskou hranicou a slúžil ako kľúčové vojenské a administratívne centrum pre obranu Thrákie. Práve tu v roku 378 porazila vizigótska jazda légie cisára Valensa v jednej z najvýznamnejších starovekých bitiek, porážke, ktorá nastolila integráciu germánskych národov do rímskych hraníc a pomohla viesť k postupnému zániku západorímskeho štátu. Pod Byzantíncami zostal Adrianopol popredným mestom Thrákie a tradíčnou prvou líniou obrany Konštantínopolu proti hrozbám zo západu." # todo: NEW TRANSLATION
 ioannina_desc: "Sediac na skalnatom polostrove vyčnievajúcom do horského jazera Pamvotis bola Ioannina hlavné mesto Despotátu Epirusu, gréckeho nástupníckeho štátu, ktorý vznikol v severozápadnom Grécku po štvrtom križiackom útoku, ktorý v roku 1204 zničil byzantskú moc. Pod epirskými despotmi vyrástla z provinčného mestečka do významného centra gréckej kultúry a odboja; jeho prirodzené obrany umocnené silnými hradbami a jazero poskytujúce potravu aj ochranu, dávali mestu rovnaké množstvo bezpečia i izolácie. Hornatá krajina Epiru mu zabezpečila istú ochranu a Ioannina slúžila ako dôležitá pevnosť upevňujúca grécko-kresťanskú civilizáciu v rozbúrenom severozápadnom kúte bývalej ríše." # todo: NEW TRANSLATION
 tarnovo_desc: "Vysadené na troch kopcoch nad zákrutou rieky Jantra, Tarnovo bolo vybrané za sídlo Druhého bulharského impéria, keď bratia Asen a Peter viedli veľké povstanie proti byzantskej vláde v roku 1185. Pod dynastiou Asenovcov vyrástlo do jedného z najsilnejších opevnených miest na Balkáne; jeho pahorok Tsarevets korunovaný kráľovským palácom a patriaršou katedrálou boli symbolmi štátu, ktorý v 13. storočí rozprestieral svoju moc od Dunaja po Egejské more. Po oslabení ríše tlakom Mongolov zostal Tarnovo hlavným mestom zmenšeného, no hrdého Bulharska, jeho múry a cisárska pamäť formovali identitu mesta ďaleko do 14. storočia." # todo: NEW TRANSLATION
 dubrovnik_desc: "Ukrytý pod vápencovými útesmi dalmátskeho pobrežia Dubrovník vyrástol z byzantského útočiska do jedného z najbohatších a diplomaticky obratných malých štátov v stredovekom Stredozemí. Ako Republika Ragusa navigovala medzi konkurenčnými tlaky Benátok, Uhorska, Srbska a vznikajúcich mocností s mimoriadnou obratnosťou, platením tribútu keď to bolo nutné a súčasne udržiavaním siete obchodných konzulátov od Flámska po Levant. Jej obchodníci roznášali tovar a úvery po známom svete, a elegantné kamenné mesto vzostávajúce za mohutnými hradbami hlásalo civilizáciu, ktorá volila obchod a opatrnú diplomaciu miesto nákladov vojny." # todo: NEW TRANSLATION
 sredets_desc: "Rímania ho poznali ako #italic Serdica#!, hlavné mesto provincie Dacia Mediterranea; mesto, ktoré sa malo stať Sofiou, už zažilo stáročia dejín, keď ho Bulhari urobili provinčným centrom svojej ríše. V Serdice zvolal cisár Konštantín veľký roku 343 veľký koncil, jeden z hlavných synod raného kresťanstva, a hovorí sa, že tu prvýkrát uvažoval o založení svojho nového cisárskeho hlavného mesta, než sa rozhodol pre Bospor. Pod byzantskou a bulharskou vládou slúžila ako kľúčová križovatka, kde sa stretávajú hlavné balkánske trasy, a jej poloha pod vrchom Vitosha zabezpečila, že pretrvávala každé dobytie ako územie hodné držania." # todo: NEW TRANSLATION
 ohrid_desc: "Na brehu starobylého jazera, ktoré nesie jeho meno, Ohrid vystúpol do významu, keď svätý Kliment, učeň Cyrila a Metoda, založil tu veľkú školu slovanského učenia koncom 9. storočia, vyučujúc tisíce kňazov a učencov v novej slovanskej gramotnosti. Po konverzii Bulharska sa Ohrid stal sídlom Bulharského patriarchátu a neskôr autonómnej arcidiecézy Ohrid, jedného z najdôležitejších náboženských centier v pravoslávnom svete. Jeho svahy preplnené kostolmi a kláštormi daleko preslávili mesto ako Jeruzalem Balkánu; jeho duchovné autoritatívne postavenie formovalo kresťanstvo južných Slovanov po stáročia." # todo: NEW TRANSLATION
 nis_desc: "Rímania ho poznali ako #italic Naissus#!, Niš ovládal hlavnú cestu medzi dunajskou hranicou a Konštantínopolom na mieste, kde sa stretávajú údolia riek Morava a Nišava, čím sa stal jedným z najstrategickejších miest starovekého Balkánu. Práve tu, okolo roku 272 n. l., sa narodil cisár Konštantín Veľký, syn západného Balkánu, ktorý premenil Rímsku ríšu a celý smer západnej civilizácie. Hoci opakovane ničený, medzi inými i Attilom Hunom, križovatkové postavenie mesta zabezpečilo jeho obnovenie, a pod byzantskou, bulharskou a srbskou vládou zostalo kľúčovou spojnicou stredného Balkánu." # todo: NEW TRANSLATION
 durres_desc: "Jedno z najstarších miest v Európe, Durrës bol založený ako grécka kolónia Epidamnus okolo roku 627 pred n. l. osadníkmi z Korintu a Korfu; jeho výborný prirodzený prístav na východnom Jadrane mu okamžite priniesol obchodný význam. Rímania ho znali ako #italic Dyrrachium#! a urobili z neho západný terminál Via Egnatia, veľkej vojenskej cesty, ktorá prechádzala Balkánmi až do Byzancia, čím sa zabezpečilo, že celé stáročia každé vojsko putujúce z Ríma na východ prechádzalo jeho bránami. Poloha ako brána medzi Talianskom a Balkánom z neho robila jedno z najbojochovateľnejších miest v regióne; jeho prístav a hradby prešli rukami Byzantincov, Normanov, Benátčanov a anjovských feudálov počas stredoveku." # todo: NEW TRANSLATION
 prizren_desc: "Umiestnené v úrodnom údolí pod štítmi Šar planín, Prizren bolo mestom starobylého pôvodu, ktoré stredoveká srbská štátna moc prestavala na jedno zo svojich hlavných centier od 13. storočia ďalej. Pod dynastiou Nemanjić sa vyvinulo do významného administratívneho a obchodného mesta; jeho pravoslávne kostoly a kláštory vyjadrovali zbožnosť a ambície srbských vládcov, ktorí sa považovali za dedičov byzantskej civilizácie. Do začiatku 14. storočia bolo jedným z najdôležitejších miest srbského kráľovstva; jeho trhy priťahovali obchodníkov z Dubrovníka, Benátok a celého Levantu obchodovať s cennými kovmi ťaženými z okolitých hôr." # todo: NEW TRANSLATION
 belgrad_desc: "Stožiariaci pri sútoku Sávy a Dunaja, kde veľká cesta zo strednej Európy klesá do Balkánu, Belehrad bol opevnenou bránou už od staroveku, keď Rímania nazývali mesto #italic Singidunum#! a umiestnili tu légie, aby strážili dunajskú hranicu. V stredoveku mesto prechádzalo medzi Bulharmi, Byzantíncami a Maďarmi; jeho pahorková pevnosť nad sútokom rieky robila z neho jedno z najžiadanejších opevnení na Balkáne. Začiatkom 14. storočia stál ako kľúčový cieľ v boji medzi Uhorskom a vzostupným srbským štátom; jeho hradby sledovali rieky, ktoré delili svety latinskej a pravoslávnej kresťanskej sféry." # todo: NEW TRANSLATION
 mecca_desc: "V srdci Arábie sa Ka'ba týčila už dávno pred Prorokom ako kamenná svätyňa, ku ktorej kmene polostrova každoročne putovali na púť. Keď sa v roku 570 Muhammad narodil v jej posvätnom okrsku a prijal tu svoje zjavenie, Mekka sa stala duchovným centrom viery, ktorá sa rozšírila na tri kontinenty. Po vzostupe a páde kalifátov zostalo mesto pod vládou šarífov, potomkov Proroka, ktorí sa zodpovedali najmocnejšiemu moslimskému panovníkovi svojej doby. Od roku 1269 ho chránia egyptskí mamlúci a ich karavány každý rok prevážajú cez púšť novú #italic kiswa#!, aby Ka'bu zahalili do čerstvého čierneho hodvábu." # todo: NEW TRANSLATION
 aleppo_desc: "Aleppo, jedno z najstarších miest sveta, poznali už Chetiti a Akkadi ako križovatku severnej Levanty. Za hamdánovského emira Sajfa ad-Dawlu sa v 10. storočí stalo žiarivým arabským dvorom básnikov a bojovníkov, ktorí súperili s byzantskou hranicou veršami aj oceľou. Zengíovec Núr ad-Dín a ajjúbovský princ aẓ-Ẓāhir Ḡāzī, Saladinov syn, prestavali jeho veľkú citadelu na jednu z najmohutnejších pevností islamského sveta. Mesto v roku 1260 vyplienili Mongoli pod vedením Hülegüa, no mamlúci ho znovu získali a obnovili ako druhé mesto svojej sýrskej ríše. Jeho karavánové trhy sprostredkúvali obchod s hodvábom a korením medzi Irakom a Stredozemím." # todo: NEW TRANSLATION
 adan_desc: "Aden, chránený v sopečnom kráteri vyhasnutej sopky, slúži už od staroveku ako prístav medzi Červeným morom a Indickým oceánom. Grécki moreplavci ho pre bohatstvo obchodu poznali ako #italic Eudaimon Arabia#!, „Šťastnú Arábiu“. V 11. storočí mu vládla sulajhidská kráľovná Arwa zo svojho sídla v Jible a po vzostupe Ajjúbovcov prešlo do rúk rasúlovských sultánov Jemenu, ktorí z neho od roku 1229 urobili námornú oporu svojej ríše. Jeho prístav priťahuje egyptských obchodníkov smerujúcich do Indie aj indické flotily, ktoré na západ privážajú korenie, bavlnu a porcelán. Rasúlovská colnica na jeho nábreží patrí k najbohatším v islamskom svete." # todo: NEW TRANSLATION
 hormuz_desc: "Kráľovstvo Hormuz stálo celé stáročia na pevninskom pobreží Perzského zálivu, až kým hrozba mongolských nájazdov neprinútila jeho vládcu okolo roku 1300 opustiť staré mesto a presídliť sa na malý ostrov Džarun. Tam obchodníci v novom Hormuze vybudovali mesto kamenných domov a rozľahlých skladísk, ktorého bezvodnú skalu zásobovali cisterny a ktorého bohatstvo plynulo z obchodu s perlami, koňmi a indickým korením. Za vlády vlastných kráľov, ktorí sa menovite zodpovedali vládcom Kermánu, sa ostrov stal veľkým obchodným strediskom Perzského zálivu. Každú sezónu sa tu stretávali arabské plachetnice dhou, perzské karaky a indické džunky, aby si vymieňali tovar z dvoch oceánov." # todo: NEW TRANSLATION
 tabriz_desc: "Tabríz, ležiaci v úrodnom údolí severne od masívu Sahand, bol prosperujúcim mestom už za sasánovských čias, no na popredné miesto sa dostal, keď si ho perzskí Ilchánovci zvolili za hlavné mesto. Za Gházána Chána, ktorý v roku 1295 prijal islam, a jeho nástupcu Öljeitüho sa mesto stalo srdcom ríše siahajúcej od Oxu po Eufrat. Jeho bazáre sa prehýbali pod čínskym hodvábom, ktorý privážali cisárske #italic yam#! cesty. Vezír Rašíd ad-Dín, polyhistor a historik, vybudoval na predmestí #italic Rab'-e Rašīdī#! rozsiahly komplex medres, knižníc a skriptórií, v ktorých sa schádzali učenci z celej Eurázie. Keď ilchán Abú Sa'íd zomrel, Tabríz patril k najľudnatejším a najkozmopolitnejším mestám sveta." # todo: NEW TRANSLATION
 isfahan_desc: "Isfahán, zavlažovaný riekou Zāyande-rūd a ležiaci v srdci Iránskej náhornej plošiny, patrí k veľkým mestám Perzie už od sasánovských čias, keď ho tvorili dve spojené sídla: Džaj a židovská štvrť Jahúdijja. Za seldžuckého sultána Malika Šáha a jeho vezíra Niẓāma al-Mulka sa v 11. storočí stal hlavným mestom ríše siahajúcej od Anatólie po Strednú Áziu. V jeho strede vyrástla veľká piatková mešita, jeden z vrcholných skvostov islamskej architektúry. Mongoli ho v roku 1241 kruto vyplienili, no za vlády Ilchánovcov sa postupne obnovili jeho záhrady, mosty aj remeslá. Jeho tkáči a kovotepci naďalej zásobovali trhy iránskeho sveta." # todo: NEW TRANSLATION
 mosul_desc: "Mosul, ležiaci oproti troskám starovekého Ninive na druhom brehu Tigrisu, stráži riečne priechody na ceste medzi Sýriou a Bagdadom už od najstarších storočí islamu. Za Hamdánovcov a neskôr za zengíovských atabegov sa stal mocným pohraničným hlavným mestom, odkiaľ 'Imād ad-Dīn Zengī spustil protiútok proti križiakom, v roku 1144 dobyl Edessu a odštartoval dlhé moslimské znovudobývanie Levanty. Mesto preslávili jeho tkáči, podľa ktorých dostala jemná bavlnená látka známa v Európe názov #italic mousseline#!. Železiari a striebrotepci zásobujú trhy hornej Džazíry. Mosul sa vďaka včasnej kapitulácii vyhol najhorším následkom mongolskej katastrofy a zostal významným ilchánovským centrom na hornom Tigrise." # todo: NEW TRANSLATION
 samarra_desc: "Na brehu Tigrisu severne od Bagdadu založil abbásovský kalif al-Mu'taṣim v roku 836 Samarru ako rozsiahle nové hlavné mesto, kde mohol ubytovať nepoddajné turecké gardové oddiely ďaleko od obyvateľov starého mesta. Takmer šesťdesiat rokov sa z jej širokých ulíc, monumentálnych palácov a jedinečného špirálového minaretu Veľkej mešity, najväčšej mešity, aká bola kedy v islamskom svete postavená, vládlo najväčšej ríši sveta. Keď sa kalifovia v roku 892 vrátili do Bagdadu, veľké mesto sa vyprázdnilo od dvoranov a vojakov, no svätyňa desiateho a jedenásteho imáma ho udržala pri živote ako šiitské pútnické centrum. Jeho cisárske ruiny sa dodnes týčia nad riečnou nížinou." # todo: NEW TRANSLATION
 bukhara_desc: "Buchara je už viac než tisíc rokov jedným z veľkých miest Strednej Ázie. Toto sogdijské obchodné centrum premenili samanidskí emirovia 9. a 10. storočia na žiarivé hlavné mesto islamského Iránu. Tehlové mauzóleum Esmā'īla Sāmānīho dodnes stojí ako zázrak ranej islamskej architektúry a minaret Kalján, ktorý Karachánovci postavili v roku 1127, odvtedy dominuje panoráme mesta. Keď Džingischán v roku 1220 mesto dobyl, vraj vošiel na koni do piatkovej mešity a prikázal, aby Korán hodili pod nohy. Nasledovalo takmer úplné zničenie. Za čagatajských chánov sa však mesto pomaly spamätalo a jeho medresy opäť priťahovali učencov, ktorí mu kedysi vyslúžili pomenovanie #italic Bukhara-ye Šarīf#!, „Vznešená Buchara“." # todo: NEW TRANSLATION
 herat_desc: "Staroveké Hérát, achajmenovská Aria, ovláda úrodné údolie rieky Harī-rūd, kde sa stretávajú cesty z Perzie, Chorásánu a Indie. Za Ghaznovcov bolo žiarivým pohraničným mestom básnikov a obchodníkov a ghúridskí sultáni, ktorí sa v 12. storočí dostali k moci neďaleko, ho obohatili o mešity a medresy ešte predtým, než sa ich ríša rozšírila na juh do Hindustanu. Mongolskí jazdci Tuluiho ho v roku 1221 vyplienili s otrasnou dôkladnosťou, no po nástupe kartidských malikových v roku 1245 sa mesto postupne obnovovalo ako sídlo vazalského kráľovstva Ilchánovcov. Jeho poloha na veľkej ceste z východu na západ mu zaručovala pokračujúcu prosperitu." # todo: NEW TRANSLATION
 kashgar_desc: "Kašgar, ležiaci na západnom okraji Tarimskej panvy, kde sa stretávajú cesty z Transoxánie, Fergany a Tibetu, je oázou na Hodvábnej ceste už od staroveku. Za karachánovských chánov 10. a 11. storočia sa stal významným centrom turkickej islamskej civilizácie a domovom veľkého učenca Maḥmūda al-Kāšḡarīho. Jeho dielo #italic Dīwān Luḡāt at-Turk#! zhromaždilo jazyky turkických národov pre abbásovské publikum. Po mongolskom dobytí mesto pripadlo čagatajským chánom, ktorých putovné dvory prechádzali stepou medzi Ťan-šanom a Pamírom. Kašgarské bazáre naďalej sprostredkúvali obchod s nefritom, koňmi a hodvábom, ktorý oázam Tarimskej panvy prinášal trvalé bohatstvo." # todo: NEW TRANSLATION
 lahore_desc: "Láhaur, staroveké hlavné mesto hinduistickej šáhijskej dynastie, dobyl v roku 1021 Maḥmūd z Ghazny a urobil z neho východné hlavné mesto svojej rozľahlej ríše. Mesto sa tak stalo bránou, ktorou islamská civilizácia prenikala na indické nížiny. Za Ghaznovcov vyrástlo na žiarivé pohraničné mesto mešít a medres. Žil tu perzský básnik Mas'ūd Sa'd Salmān aj učenec 'Alī Hujvīrī, ktorého súfijská svätyňa #italic Data Darbar#! dodnes priťahuje pútnikov. Po vzostupe Dillíjskeho sultanátu mamlúkov slúžilo mesto ako hlavná moslimská hrádza proti mongolským jazdcom, ktorí opakovane burácali cez Indus. Za sultánov, ako bol Balban, jeho opevnenia obnovili, aby čelili stepi." # todo: NEW TRANSLATION
 varanasi_desc: "Váránasí, ktoré jeho veriaci poznajú ako #italic Kāśī#!, Mesto svetla, patrí medzi najstaršie nepretržite obývané mestá sveta. Leží na západnom brehu Gangy, na najposvätnejšom mieste hinduizmu. Pútnici sem prichádzali už dávno pred začiatkom zaznamenaných dejín, aby sa očistili vo vodách rieky a hľadali vyslobodenie z kolobehu znovuzrodenia. Gháty zostupujúce k Gange sú preplnené chrámami, askétmi a pohrebnými hranicami tých, ktorých sem priniesli zomrieť. Ghúridské vojská pod vedením Quṭb ad-Dīna Aibaka mesto v roku 1194 vyplienili a zrovnali so zemou mnohé jeho chrámy, no Váránasí sa vždy spamätalo. Jeho tkáči hodvábu, mosadzníci a učenci sanskrtu udržiavajú civilizáciu, ktorú dosiaľ nijaký dobyvateľ nedokázal vymazať." # todo: NEW TRANSLATION
 madurai_desc: "Madurai je už viac než tisíc rokov hlavným mestom pandijských kráľov tamilského juhu. Jeho veľký chrám zasvätený bohyni Mínákší korunuje civilizáciu básnikov, učencov a bojovnej aristokracie. Podľa tradície tu v staroveku prekvitali tamilské literárne akadémie #italic Sangam#!, ktoré priťahovali bardov južných dvorov, aby diskutovali o jazyku a zdokonaľovali ho. Malik Kafur, veľký generál dillíjskeho sultána Alauddina Khaljiho, v roku 1311 zaútočil na mesto a odniesol jeho nahromadené poklady. V roku 1335 vyhlásil tughlucký miestodržiteľ Jalāl ad-Dīn Ḥasan nezávislý sultanát Madurai, krehkú moslimskú mocnosť zasadenú do starovekého tamilského srdca." # todo: NEW TRANSLATION
 patna_desc: "Na južnom brehu Gangy stálo kedysi staroveké mesto #italic Pāṭaliputra#!, hlavné mesto maurjovského cisára Ašóku. Z jeho palácov vládla prvá indická cisárska ríša územiu od Afganistanu po Bengálsky záliv. Grécky vyslanec Megasthenes obdivoval jeho drevenú palisádu a nádheru dvora a čínsky pútnik Faxian ho v 5. storočí za vlády Guptov stále našiel v rozkvete. V čase Dillíjskeho sultanátu sa však veľké hlavné mesto premenilo na skromné mestečko Patna, provinčnú základňu tughluckého Biháru. Odkaz jedného z najväčších miest staroveku sa zachoval už len v spomienkach učencov a v ruinách na brehu rieky." # todo: NEW TRANSLATION
 chittagong_desc: "Čattagrám, ležiaci pri širokých ústiach riek východného Bengálska, ktoré sa vlievajú do Bengálskeho zálivu, slúži ako prístav medzi Indiou a juhovýchodnou Áziou už od staroveku. Arabskí zemepisci ho poznali ako #italic Samandar#!, mesto obchodníkov, ktorých lode sa plavili až do Číny, a tibetský pútnik Dhammapala v 10. storočí opísal jeho kláštory. O mesto súperili bengálski králi, vládcovia Arakanu aj náčelníci z vrchov Tripury a mnohokrát prechádzalo z rúk do rúk. Po dobytí Bengálska Dillíjskym sultanátom sa dostalo pod moslimskú správu a jeho prístav zostal hlavnou východnou bránou, ktorou sa vyvážala ryža a bavlna z delty Gangy." # todo: NEW TRANSLATION
 jinjiang_desc: "Čchüan-čou, ktoré Arabi poznali ako #italic Zaytūn#! a Marco Polo ho označil za jeden z dvoch najväčších prístavov sveta, získalo za dynastií Sung a Jüan mimoriadny význam ako hlavná čínska brána do Indického oceána. Jeho prístav sa hemží džunkami smerujúcimi na Ostrovy korenia, do Indie a do Perzského zálivu. V meste žijú v celých štvrtiach arabskí, perzskí, tamilskí a arménski obchodníci, ktorých mešity, hinduistické chrámy a kresťanské kostoly stoja vedľa budhistických kláštorov a manichejskej svätyne. Marco Polo, ktorý tadiaľto prechádzal v 90. rokoch 13. storočia, napísal, že na každú loď naloženú korením, ktorá dorazí do Alexandrie, ich do Zaytūnu príde sto. Colné príjmy z jeho rozsiahleho obchodu tvoria jeden z finančných pilierov cisárskej pokladnice dynastie Jüan." # todo: NEW TRANSLATION
 shangyuan_desc: "Oblasť dnešného Ťi-čchingu, ležiaca na južnom brehu Jang-c’-ťiang, kde sa rieka stáča na sever k moru, je hlavným mestom a pevnosťou už viac než tisíc rokov. Starovekí králi Wu, Východní Ťinovia aj južné dynastie po období Chan vládli z jeho hradieb pod menami #italic Jianye#! a #italic Jiankang#!. Po stáročia tak bolo kultúrnym srdcom južnej Číny. Keď Džürčeni v 12. storočí dobyli sever, dvor dynastie Sung krátko zvažoval, že sa sem presťahuje a zriadi si tu nové hlavné mesto. Po mongolskom dobytí ríše bolo mesto obnovené ako sídlo prefektúry Ťi-čching. Jeho strategická poloha na dolnom toku Jang-c’-ťiang mu zabezpečila trvalý význam medzi mestami juhu." # todo: NEW TRANSLATION
 wuxian_desc: "Su-čou leží v srdci delty Jang-c’-ťiang. V staroveku ho poznali ako #italic Gusu#! a za dynastie Sung ako #italic Píngjiāng#!. Mesto bolo založené v 6. storočí pred n. l. ako hlavné mesto kráľovstva Wu. Prepletená sieť kanálov mu vyniesla príslovečné prirovnanie k Chang-čou: „Nebo hore, Su-čou a Chang-čou dolu.“ Mesto je už oddávna známe svojimi tkáčmi hodvábu, záhradami učencov a vyberanou kuchyňou a operou. Za Južných Sungov vyrástlo na jedno z najbohatších miest juhu. Hoci mongolské dobytie v roku 1276 zanechalo jazvy, začiatkom 14. storočia jeho záhrady, pagody a trhy pri kanáloch opäť priťahujú obchodníkov a učencov z celej Číny." # todo: NEW TRANSLATION
 guangzhou_desc: "Kuang-čou pri ústí Perlovej rieky víta zahraničné lode už od dynastie Chan, keď jeho obchodníci obchodovali s krajinami južných morí. Za dynastie Tchang sem každú sezónu priplávalo toľko arabských a perzských lodí dhou, že v meste vznikla samostatná cudzinecká štvrť, ktorú spravovali moslimskí obchodnícki starší. V roku 879 tu údajne povstalecký vodca Huang Chao počas jediného krvavého ťaženia zmasakroval vyše stotisíc zahraničných obyvateľov. Mongolské dobytie prinieslo nový rozmach, pretože Kuang-čou profitovalo z veľkého námorného obchodného boomu za dynastie Jüan. Jeho prístav rozváža výrobky Lingnanu do celého sveta a indickí aj arabskí obchodníci opäť zapĺňajú jeho hostince a sklady." # todo: NEW TRANSLATION
 lhasa_desc: "Lhasu založil v 7. storočí tibetský cisár Songcän Gampo, ktorý dal postaviť chrám Džókhang, aby v ňom uchoval posvätnú Buddhovu podobizeň, ktorú mu priniesli nepálska a čínska manželka. Dve storočia bola srdcom tibetskej ríše, ktorá súperila s Tchangskou Čínou a vládla od Pamíru po Bengálsky záliv. Po rozpade ríše v 9. storočí mesto upadlo, no chrámy Džókhang a Ramoche zostali duchovným strediskom tibetského budhizmu. Keď Mongoli v roku 1240 vtrhli na náhornú plošinu, ustanovili opátov kláštora Sakja za svojich miestodržiteľov. Hoci Sakja zostáva správnym centrom, Lhasa si zachováva postavenie svätého mesta. Priťahuje pútnikov, ktorí obchádzajú Barkhor a klaňajú sa pred Džowom Šákjamunim." # todo: NEW TRANSLATION
 kamakura_desc: "V roku 1185 uchvátil vojvodca Minamoto no Joritomo moc od cisárskeho dvora v Kjóte a urobil z prímorského mestečka Kamakura sídlo novej vojenskej vlády, #italic bakufu#!, ktorá odvtedy vládne Japonsku v mene cisára. Za regentov Hódžó sa mesto rozrástlo na pevnostné hlavné mesto prísnej samurajskej kultúry, obkolesené horami a morom. Nad jeho okrskom dodnes medituje veľký bronzový Budha odliaty v roku 1252, pamätník nového zenom ovplyvneného budhizmu, ktorý prijala bojovnícka aristokracia. Z Kamakury riadili obranu počas mongolských vpádov v rokoch 1274 a 1281. Oba odrazili bojovnícke rody Kjúšú a priaznivé búrky, ktoré dostali meno #italic kamikaze#!, božské vetry." # todo: NEW TRANSLATION
 hakata_desc: "Hakata je už stáročia hlavnou japonskou bránou na kontinent. Cez tento prístav sa na ostrovy dostávali posolstvá z Tchangskej a Sungskej Číny, kórejských kráľovstiev aj obchodníci z južných morí. Obchodníci zo Sungského obdobia tu udržiavali čínsku štvrť s kamennými skladmi a budhistickými chrámami, ktoré založili čínski mnísi. Bohatstvo prúdiace cez jeho nábrežia z neho urobilo najbohatší prístav Kjúšú. Na dlhých plážach pri Hakate sa v rokoch 1274 a 1281 vylodili mongolské invázne flotily. Tu obrancovia kamakurského bakufu postavili veľký kamenný múr, #italic genkō bōrui#!, ktorého zvyšky dodnes lemujú pobrežie ako pamätník najzúfalejšej obrany v japonských dejinách." # todo: NEW TRANSLATION
 namgyeong_desc: "Oblasť Hanjangu, ležiaca v kotline chránenej horami, kde sa rieka Han stáča k Žltému moru, je osídlená už od praveku. V staroveku o ňu súperili kráľovstvá Pekče a Kogurjo. Za dynastie Korjo nadobudlo toto miesto význam ako #italic Namgyeong#!, Južné hlavné mesto, jedno z troch vedľajších hlavných miest dopĺňajúcich kráľovské sídlo v Kegjongu. Viacerí panovníci zvažovali presunúť sem dvor na radu geomantov, ktorí vyzdvihovali jeho priaznivú polohu. Začiatkom 14. storočia sa z Hanjangu stalo významné mesto Korja pod voľnou zvrchovanosťou mongolskej dynastie Jüan. Jeho strategická poloha na rieke Han z neho robí prirodzenú bránu medzi Kórejským polostrovom a širším svetom." # todo: NEW TRANSLATION
 pagan_desc: "Na suchej nížine horného Barmy, kde Iravádí preteká popri pustých pahorkoch, založil kráľ Anawrahta v 11. storočí kráľovstvo Pagan. Zjednotil národy hovoriace po barmsky a prijal théravádový budhizmus, ktorý mu priniesol mních Šin Aráhan. Počas dvoch storočí jeho nástupcovia postavili na nížine okolo hlavného mesta tisíce stúp, pagod a chrámov. Vznikla tak rozsiahla posvätná krajina, aká nemala v budhistickom svete obdobu, a bohatstvo barmskej ryžovej misy živilo učencov a remeselníkov z Indie aj Srí Lanky. Mongolské vojská Kublajchána v roku 1287 kráľovstvo rozvrátili. Začiatkom 14. storočia už skutočnú moc držali šansko-barmskí náčelníci z Myinsaingu a Pinye. Staroveké hlavné mesto pretrváva ako posvätná zrúcanina, kde sa pútnici stále prechádzajú medzi desaťtisícmi rozpadajúcich sa chrámov." # todo: NEW TRANSLATION
 sukhothai_desc: "Začiatkom 13. storočia sa thajskí náčelníci horného povodia rieky Čao Praja vymanili spod nadvlády Khmérov z Angkoru a založili kráľovstvo Sukhothai, ktorého názov znamená #italic Úsvit šťastia#!. Za kráľa Ramkhamhaenga, ktorý vládol v rokoch 1279 až 1298, kráľovstvo prekvitalo ako žiarivý théravádový budhistický štát a priťahovalo mníchov a remeselníkov zo Srí Lanky. Nápis, ktorý kráľ zhotovil v roku 1292 na pamiatku svojich reforiem, je najstarším dochovaným dokumentom v thajskom písme, ktorého vynájdenie sa pripisuje práve jemu. Začiatkom 14. storočia už moc Sukhothai spochybňovali rastúce thajské kniežatstvá dolného toku Čao Praje, no jeho pozlátené stúpy a pokojné Budhove sochy určovali vzor thajskej civilizácie." # todo: NEW TRANSLATION
 thang_long_desc: "Vietnamský kráľ Lý Công Uẩn v roku 1010 presťahoval svoje hlavné mesto zo stiesnenej citadely Hoa Lư do nového mesta na brehoch Červenej rieky. Podľa videnia, ktoré mal po príchode, ho nazval #italic Thăng Long#!, Vznášajúci sa drak. Za dynastií Lý a Trần sa mesto stalo srdcom Đại Việtu, mestom pagod, skúškových siení a kráľovských palácov, v ktorom si vietnamská civilizácia utvorila vlastnú identitu pod vplyvom Číny, Čamov a Khmérov. Mongolské vojská Kublajchána trikrát vtrhli cez severnú hranicu, aby si podrobili Đại Việt, a trikrát ich porazili vojaci dynastie Trần pod vedením veľkého generála Trần Hưng Đạa. Tieto bitky dodnes žijú vo vietnamskej pamäti. Najslávnejšia sa odohrala v roku 1288 na vodách rieky Bạch Đằng, posiatych kolmi." # todo: NEW TRANSLATION
 trowulan_desc: "V roku 1293 sa mongolská výprava na Jávu vďaka dôvtipu obrátila proti uzurpátorovi kráľovstva Singhasari. Jávsky princ Raden Wijaya založil novú ríšu Madžapahit a vybudoval jej hlavné mesto Trowulan na dolnom toku rieky Brantas. Mesto leží uprostred bohatých ryžových nížin východnej Jávy a tvorí ho sústava tehlových opevnených sídiel, širokých nádrží a veľkých brán, ktorých terakotové reliéfy oslavujú víťazstvá novej dynastie. Pod vedením hlavného ministra Gajah Madu, ktorý sa dostal k moci v 20. rokoch 14. storočia, začal Madžapahit ťaženia, ktoré rozšíria jeho zvrchovanosť na celý indonézsky ostrovný svet. Trowulan stojí na prahu zlatého veku ako srdce veľkej ríše východnej Indie." # todo: NEW TRANSLATION
 palembang_desc: "Od 7. storočia až do konca 13. storočia bol Palembang hlavným mestom námornej ríše Šrívijaja, ktorej flotily ovládali Malacký prieliv a ktorej mnísi urobili z mesta jedno z veľkých stredísk budhistickej učenosti v ostrovnej Indii. Čínsky pútnik I-ťing v 70. rokoch 7. storočia naliehal na svojich druhov, aby študovali v Palembangu ešte pred cestou do Indie. V miestnych kláštoroch žili tisíce mníchov, ktorí sa venovali prekladom a výkladom textov. Nájazd Čolov v roku 1025 zlomil monopol Šrívijaje na prielivy a mesto v nasledujúcich storočiach upadlo na úroveň vazala jávskych kráľovstiev. Vďaka polohe na rieke Musi však zostalo významným prístavom južných sumatranských vládcov." # todo: NEW TRANSLATION
 pegu_desc: "Pegu, ležiace vo veľkej nížinnej delte, kde sa rieky Sittaung a Bago vlievajú do mora, sa dostalo k moci po tom, čo Mongoli v roku 1287 rozvrátili Pagan. Monovský kráľ Wareru vtedy založil nové théravádové kráľovstvo v dolnom Barme. Za jeho nástupcov vyrástlo mesto, ktoré Monovia nazývali #italic Hanthawaddy#!, na popredný prístav hornej časti Bengálskeho zálivu. Priťahovalo obchodníkov z Bengálska, Srí Lanky a pobrežia Koromandelu, ktorí obchodovali s týkovým drevom, rubínmi a vychýrenými lakovanými výrobkami monských remeselníkov. Veľká pagoda Šwemawdaw, v ktorej sú údajne uložené Budhove relikvie, označuje mesto za nové duchovné srdce monskej civilizácie, ktorá znovu povstala z rozvalín Paganu." # todo: NEW TRANSLATION
 chiang_mai_desc: "V roku 1296 založil thajský kráľ Mangrai z horného údolia Mae Pingu nové hlavné mesto, ktoré nazval #italic Chiang Mai#!, Nové mesto. Dokončil tým zjednotenie Lan Na, Krajiny milióna ryžových polí, v horských údoliach severného Siamu. Miesto vybrali s pomocou kráľov zo Sukhothai a Phayao a jeho hradby i priekopu rozvrhli okolo centrálneho štvorca podľa posvätného plánu, ktorý spája monské, thajské a khmérske tradície. Za Mangraia a jeho nástupcov mesto prekvitalo ako centrum théravádového budhizmu a remesiel. Miestne kláštory podporovali zlievačov bronzu, ktorí vyrábali sochy Lan Na cenené v celom budhistickom svete." # todo: NEW TRANSLATION
 vijaya_desc: "Kráľovstvo Čampa už štyri storočia vládne svojmu pobrežnému pásu v strednom Vietname z citadely Vidžaja, ležiacej za piesočnými dunami na dohľad od Juhočínskeho mora. Tehlové veže, ktoré Čamovia postavili naprieč svojou úzkou ríšou, svedčia o hinduistickej civilizácii indického pôvodu, ktorá obchodovala s hodvábom a vonnými drevinami s kupcami z južných morí. Kráľovstvo však opakovane drvil tlak khmérskeho Angkoru a vietnamského Đại Việtu. Čamské hlavné mesto padlo do rúk Khmérov v roku 1145 a Đại Việtu v rokoch 1283 a 1326. Zakaždým získalo nezávislosť späť, no jeho územie sa stále zmenšovalo. Tehlové veže kráľov sa naďalej týčia ako mlčanliví svedkovia civilizácie, ktorej dlhý ústup pozdĺž pobrežia sa už začal." # todo: NEW TRANSLATION
 lubeck_desc: "Lübeck, ktorý v roku 1143 založil holštajnský gróf Adolf II. a po požiari v roku 1159 obnovil Henrich Lev, sa stal bránou medzi Severným a Baltským morom. Do jeho prístavu na rieke Trave prichádzali obchodníci zo Saska, slovanských krajín aj Škandinávie. Fridrich II. mu v roku 1226 udelil štatút slobodného ríšskeho mesta. Odvtedy lübeckí obchodníci, združení v samosprávnych cechoch pod tehlovými vežami mesta, budovali sieť zmlúv spájajúcich obchodné mestá Baltu. V 14. storočí už viac než sto miest pri Baltskom a Severnom mori prevzalo Lübecké právo, ktoré vytvorilo právny rámec spoločného života obchodných obcí severu." # todo: NEW TRANSLATION
 visby_desc: "Visby, týčiace sa za mohutnými kamennými hradbami na západnom pobreží Gotlandu, sa v 12. a 13. storočí stalo jedným z najbohatších miest Baltu. Jeho prístav bol miestom stretnutia obchodníkov s kožušinami z Novgorodu, súkenníkov z Flámska a prepravcov železa a sleďov z nemeckej Hanzy. Gotlandská roľnícka republika, ktorá po stáročia vládla ostrovu, zdieľala mesto s privilegovanou nemeckou obchodníckou štvrťou. Súbežná vláda oboch obcí priniesla mestu osobité bohatstvo a zložitosť. Dva tucty vápencových kostolov, ktoré do roku 1300 vyrástli v jeho hradbách, svedčili o prosperite, vďaka ktorej bol Visby po jednu generáciu najvýznamnejším prekladiskom baltského obchodu." # todo: NEW TRANSLATION
 tallinn_desc: "Na strmom vápencovom útese Toompea s výhľadom na záliv Revalu založil dánsky kráľ Valdemar II. v roku 1219 svoju pevnosť. Podľa povesti vtedy z neba spadla zástava Dannebrog a povzbudila jeho váhajúce vojsko. Mesto pod hradom osídlili nemeckí obchodníci a remeselníci. Udelili mu Lübecké právo a urobili z neho hanzový prístav, ktorého nábrežia obsluhovali obchod medzi ruskými riečnymi cestami do Novgorodu a hlavnými baltskými plavebnými trasami. Pod voľnou vládou dánskej koruny prosperovali mešťania Dolného mesta z obchodu so sleďmi a jantárom, zatiaľ čo biskup a vazali Rádu nemeckých rytierov súperili o vplyv na skalnom brale nad nimi. Dvojitá povaha mesta ako dánskeho kráľovského oporného bodu a nemeckej obchodnej republiky mu dodávala energiu, akú nemal nijaký iný prístav východného Baltu." # todo: NEW TRANSLATION
 riga_desc: "Biskup Albert z Buxhoevedenu založil v roku 1201 Rigu ako základňu svojho ťaženia proti pohanským Livoncom a Letom, ktorí obývali lesy za riekou Daugava. S požehnaním pápeža založil Livónskych bratov meča, vojenský rád, ktorý počas polstoročia krvavých výprav podrobil pohanské kmene. Z nového mesta, pôvodne misijnej základne, sa čoskoro stal hlavný hanzový prístav východného Baltu. Z jeho nábreží nemecké koggy prevážali ruské kožušiny, vosk a jantár do Lübecku i ďalej, zatiaľ čo miestni obchodníci združení vo veľkých nemeckých cechoch zakladali obchodné stanice na rieke smerom k ruským kniežatstvám. Dlhý zápas medzi rigskými mešťanmi, ich arcibiskupom a novým Livónskym rádom sa stal určujúcim znakom mestskej politiky." # todo: NEW TRANSLATION
 bergen_desc: "Bergen, chránený fjordmi a horami na západnom pobreží Nórska, založil okolo roku 1070 kráľ Olaf Kyrre. Časom sa stal hlavným mestom a kráľovským sídlom stredovekého Nórska. Jeho prístav Bryggen slúžil ako hlavné vývozné miesto pre sušené ryby zo severných lovísk. Koncom 13. storočia sa na nábrežiach začali vo veľkom usádzať nemeckí obchodníci z hanzových miest a založili obchodnú stanicu Kontor, ktorá čoraz viac ovládala nórsky zahraničný obchod. Kráľovské korunovácie, zapisovanie nórskych ság aj spory koruny, cirkvi a zahraničných obchodníkov urobili z mesta politické a kultúrne srdce nórskej ríše, ktorá na vrchole v 13. storočí siahala od Faerských ostrovov po Grónsko." # todo: NEW TRANSLATION
 hamburg_desc: "Hamburg vznikol v 9. storočí, keď Karol Veľký a jeho nástupcovia postavili na Labe pevnosť, aby obrátili Sasov na kresťanskú vieru a udržali ich pod kontrolou. Mesto sa stalo sídlom arcibiskupstva, ktoré chcelo šíriť kresťanstvo na sever do Škandinávie. Opakovane ho vyplienili Vikingovia, Slovania aj poľský kráľ Boleslav I., no zakaždým ho obnovili. V roku 1189 mu Fridrich Barbarossa udelil cisárske obchodné výsady a oslobodenie od ciel, čím položil základy jeho obchodnej budúcnosti. V 13. storočí sa spojenectvo Hamburgu s Lübeckom proti baltským pirátom stalo základným kameňom vznikajúcej Hanzy. Pivovarníci, povrazníci a lodní prepravcovia z neho urobili hlavný konečný prístav severonemeckého obchodu na Labe." # todo: NEW TRANSLATION
 kyiv_desc: "Od 9. storočia si varjažskí vládcovia Rusi zvolili Kyjev za hlavné mesto veľkej slovanskej a severskej konfederácie na strednom Dnepri. Za Vladimíra Veľkého a jeho syna Jaroslava Múdreho sa v 11. storočí stal jedným z najbohatších a najnádhernejších miest východnej Európy. Chrám svätej Sofie a Zlatá brána ohlasovali civilizáciu, ktorá rovnako čulo obchodovala s Konštantínopolom aj s Baltom. Rozdrobenie Rusi na súperiace kniežatstvá mesto postupne oslabovalo ešte pred mongolskou pohromou. V roku 1240 ho Batu Chán dobyl a zrovnal so zemou tak dôkladne, že cestovatelia o generáciu neskôr nachádzali v uliciach trávu a na poliach kopy lebiek. Kyjev sa pomaly spamätával pod voľnou mongolskou nadvládou, no v 20. rokoch 14. storočia už spadal do sféry rastúceho Litovského veľkokniežatstva. Jeho starobylý pôvod od Rurikovcov nedokázal vzdorovať novej politickej realite." # todo: NEW TRANSLATION
 pskov_desc: "Pskov, ležiaci na skalnatom výbežku nad sútokom riek Velikaja a Pskova, je sesterským mestom Novgorodu už od najstarších čias Rusi. Zdieľa s ním tradíciu zhromaždenia #italic veče#!, na ktorom slobodní občania rokujú a rozhodujú o štátnych záležitostiach. V roku 1136 sa začal vymykávať novgorodskej nadvláde a od 13. storočia bránili pskovské domobrany pod vedením bojovníkov, akým bol litovský vyhnanec, knieža Daumantas, západnú hranicu ruských krajín pred neúnavným tlakom Rádu nemeckých rytierov. Vďaka odľahlej polohe unikol najhorším mongolským vpádom a prekvital ako republika obchodníkov a bojovníkov. Jeho veľký kamenný Kremeľ a obchodnícke kostoly vyjadrujú občiansku sebadôveru, aká nemá vtedajšie ruské mestá obdobu." # todo: NEW TRANSLATION
 avignon_desc: "Avignon, ležiaci na veľkej skale nad Rónou pri prirodzenom priechode medzi Provensálskom a Languedocom, bol rímskou kolóniou a sídlom grófov, kým sa jeho osud v roku 1309 úplne nezmenil. Vtedy pápež Klement V., ktorý sa nemohol bezpečne vrátiť do Ríma a hľadal ochranu francúzskeho kráľa, presídlil svoj dvor do Avignonu. Jeho nástupcovia začali budovať veľkolepý Pápežský palác, ktorý sa týči nad mestom ako nové centrum latinského kresťanstva. Ulice v okolí paláca zaplnili kardinálske sídla, vyslanectvá európskych dvorov, skriptóriá a zmenárne. Počet obyvateľov mesta sa zdvojnásobil a znovu zdvojnásobil, keď na seba vzalo ohromujúcu úlohu hlavného mesta univerzálnej cirkvi." # todo: NEW TRANSLATION
 toledo_desc: "Toledo, ležiace na skalnatom výbežku nad riekou Tajo, bolo hlavným mestom vizigótskych kráľov ešte pred moslimským dobytím v roku 711. Za maurských vládcov zostalo jedným z hlavných miest al-Andalusu a jeho úzke ulice lemovali synagógy, kostoly a mešity neobyčajne tolerantne zmiešaných vierovyznaní. Alfons VI. Leónsko-kastílsky mesto v roku 1085 znovudobyl a kastílska koruna, ktorá si tu zriadila hlavné mesto, zdedila miesto, kde sa stretávali latinské, arabské a hebrejské vzdelanosti. Prekladateľská škola, ktorú podporovali arcibiskup Raymond a v 13. storočí kráľ Alfons X. Múdry, urobila z Toleda bránu, cez ktorú do latinského Západu preniklo množstvo gréckej a arabskej filozofie, vedy a medicíny. Tým zásadne pretvorila európske myslenie." # todo: NEW TRANSLATION
 granada_desc: "V roku 1230, keď kresťanské vojská postupovali naprieč al-Andalusom a veľká ríša Almohádov sa rozpadla, vytvoril Muḥammad ibn al-Aḥmar nové granadské emirátske panstvo v pohorí Sierra Nevada, posledné útočisko moslimskej Ibérie. Za ním založenej nasridskej dynastie sa kráľovstvo Granada stalo vazalom Kastílie, no dokázalo prekvitať ako dedič andalúzskej civilizácie. Jeho horská hranica a hustá poľnohospodárska #italic vega#! z neho robili ťažko získateľnú korisť pre každého dobyvateľa. Na kopci Sabika nad mestom vybudovali nasridskí sultáni palácovú pevnosť Alhambru, ktorej nádvoria a komnaty sa rýchlo stali vrcholným architektonickým vyjadrením andalúzskej civilizácie." # todo: NEW TRANSLATION
 dublin_desc: "Dublin, ktorý v 9. storočí založili vikinskí nájazdníci ako #italic long-phort#!, opevnený lodný tábor pri tmavej tôni #italic Dubh Linn#!, kde sa rieka Liffey vlieva do mora, vyrástol na najvýznamnejšie hibernsko-severské mesto Írska. Jeho obchodníci predávali otrokov, kožušiny a striebro naprieč Írskym morom. Jeho králi opakovane bojovali s írskymi veľkokráľmi, až kým Brian Boru v roku 1014 pri Clontarfe nezlomil ich moc. Anglo-normanské dobytie pod vedením Strongbowa, potvrdené Henrichom II. v roku 1170, dostalo mesto pod anglickú korunu. Dublin sa stal hlavným mestom Írskeho panstva. Rozšírili sa jeho hradby, vyrástli katedrály a anglické právo sa odtiaľ šírilo do okolitých území pod kontrolou Angličanov, hoci jeho dosah zostával neistý." # todo: NEW TRANSLATION
 antwerp_desc: "Antverpy, ležiace pri veľkom prílivovom ústí Šeldy, sú opevneným markgrófstvom Svätej ríše rímskej už od 10. storočia. Ich citadela na hrade Steen stráži priechod cez rieku pred vikinskými nájazdníkmi. Brabantskí vojvodovia v 12. a 13. storočí podporovali mesto ako konkurenta flámskych miest Bruggy a Gent. Založenie hanzovej obchodnej stanice Kontor v roku 1296 naznačilo, že z neho vyrastá významný prístav severoeurópskeho obchodu. Začiatkom 14. storočia bolo mesto stále v tieni Brúg, no jeho hlbší prístav a ľahší prístup na otvorené more priťahovali talianske galéry a iberské karaky, ktoré ohlasovali postupný vzostup prístavu na Šelde." # todo: NEW TRANSLATION
 lyon_desc: "Lyon, založený ako rímska kolónia #italic Lugdunum#! na sútoku Róny a Saôny, bol hlavným mestom troch Galíí a sídlom cisárskej mincovne, ktorá zásobovala ríšu striebornými mincami. Po páde Ríma sa stal metropolitným sídlom arcibiskupa, ktorý si nárokoval prvenstvo v celej Galii. Počas stredoveku sa jeho dve údolia vyvinuli na jednu z veľkých križovatiek západnej Európy. Hoci Lyon až do roku 1312 formálne patril Svätej ríši rímskej, keď prešiel pod priamu vládu francúzskeho kráľa, už sa rozvíjal ako mesto veľtrhov, kde obchodníci z Talianska, Nízkych krajín a Stredomoria vyrovnávali účty hodvábom, korením a striebrom." # todo: NEW TRANSLATION
 york_desc: "York založili Rimania v roku 71 n. l. ako legionársku pevnosť #italic Eboracum#!. Vyrástol na hlavné mesto ich severnej provincie a miesto, kde vojaci v roku 306 vyhlásili cisárom Konštantína. Po stáročiach, keď bol anglským hlavným mestom Northumbrie a významným kresťanským strediskom za učenca Alkuina, ho v roku 866 dobylo veľké pohanské vojsko. Mesto sa stalo #italic Jorvikom#!, hlavným mestom vikinského kráľovstva, ktorého obchodníci sa dostali až do Samarkandu. Normanské dobytie prinieslo výstavbu veľkej katedrály a dvoch hradov. Počas stredoveku zostal York sídlom arcibiskupa súperiaceho o cirkevné prvenstvo s Canterbury a veľkosťou, bohatstvom i starobylosťou druhým mestom Anglicka." # todo: NEW TRANSLATION
 canterbury_desc: "Keď v roku 597 dorazil do Kentu Augustín z Ríma, aby obrátil Anglosasov na kresťanskú vieru, z Canterbury urobil sídlo svojej misie a prvé arcibiskupstvo anglickej cirkvi. Toto postavenie si mesto odvtedy zachovalo. Založenú katedrálu mnohokrát prestavali, najosudovejšie po vražde arcibiskupa Thomasa Becketa v jej múroch v roku 1170. Tento akt kráľovského svätokrádežníctva premenil Canterbury na jedno z veľkých pútnických miest stredovekého kresťanstva. Cesta z Londýna do Canterbury sa hemžila pútnikmi smerujúcimi k Becketovej svätyni a prosperita mesta závisela rovnako od ubytovania, jedla a suvenírov predávaných pútnikom ako od jeho starobylého cirkevného významu." # todo: NEW TRANSLATION
 edinburgh_desc: "Edinburgh, korunujúci sopečný výbežok Castle Rock, ktorý sa strmo týči nad okolím, slúži ako pevnosť už od čias Britov, ktorí ho poznali ako #italic Din Eidyn#!. Za Dávida I. sa začiatkom 12. storočia stal hlavným kráľovským mestom Škótska. Kráľ založil na úpätí skaly opátstvo Holyrood a udelil mestu výsady, ktoré prilákali flámskych a anglických obchodníkov na jeho trhovú ulicu. Počas vojen za nezávislosť na prelome 14. storočia hrad opakovane prechádzal medzi škótskymi a anglickými posádkami. Odvážny nočný útok Thomasa Randolpha, ktorým ho v roku 1314 získal späť pre Roberta Brucea, sa stal jedným z legendárnych činov škótskych vojen." # todo: NEW TRANSLATION
 kilwa_kisiwani_desc: "Kilwa Kisiwani, ležiaca na koralovom ostrove pri východoafrickom pobreží, sa v 11. storočí rozrástla na svahilské sídlo šírázskeho pôvodu. V 13. a na začiatku 14. storočia sa stala najbohatším mestským štátom svahilského pobrežia. Za mahdálskej dynastie, založenej v roku 1277, ovládli kilwskí sultáni obchod so zlatom z Veľkého Zimbabwe cez južný prístav Sofala. Získané bohatstvo umožnilo postaviť veľký koralový palác #italic Husuni Kubwa#! s osemuholníkovým kúpeľným bazénom a terasovitým nádvorím, najväčšiu predmodernú stavbu v subsaharskej Afrike. Ibn Battúta, ktorý mesto navštívil v roku 1331, ho označil za jedno z najkrajších a najlepšie postavených miest, aké na svojich cestách videl." # todo: NEW TRANSLATION
 mogadishu_desc: "Mogadišo, ležiace na severnom konci svahilského pobrežia, založili okolo 10. storočia arabskí a perzskí osadníci, ktorí uzavreli manželstvá so Somálčanmi z pobrežia Banaadir. V 12. storočí sa z neho stalo prosperujúce moslimské mesto kamenných domov, mešít a skladísk pri nábreží. Miestni tkáči vyrábali vychýrenú látku #italic Maqdishawi#!, s ktorou sa obchodovalo naprieč Indickým oceánom až do Egypta a Indie. Obchodníci rozšírili svoje pôsobenie po celej západnej časti oceánu. Ibn Battúta, ktorý mesto navštívil v roku 1331, tu našiel vládu sultána Abú Bakra ibn Sajida 'Umara, berberského pôvodu. Pod jeho záštitou sa na piatkových modlitbách vo veľkej mešite schádzali davy obchodníkov, právnikov a súfijských mystikov z celého islamského sveta." # todo: NEW TRANSLATION
 mombasa_desc: "Mombasa, ležiaca na koralovom ostrove pri východoafrickom pobreží, je svahilským prístavom najmenej od 12. storočia, keď ju zemepisec al-Idrísí opísal ako významné moslimské mesto a útočisko obchodníkov zo západného Indického oceána. Za vlády sultánov šírázskeho pôvodu vyrástla na jedno z hlavných obchodných miest svahilského pobrežia, v jeho južnej polovici prekonávala Mombasu len Kilwa. K jej nábrežiam priplávali arabské lode dhou zo severu aj indické flotily smerujúce k Ostrovom korenia. Prístav lemovaný mangrovníkmi a mešity z koralového kameňa svedčia o svahilskej civilizácii, ktorá spojila africké, arabské a perzské tradície do výrazne kozmopolitnej monzúnovej kultúry." # todo: NEW TRANSLATION
 sofala_desc: "Sofala, ležiaca na južnom konci svahilského pobrežia, kde sa krajina Zambezi otvára do Indického oceána, slúžila od 10. storočia ako hlavná vývozná brána pre zlato z afrického vnútrozemia. Kráľovstvo Veľké Zimbabwe posielalo zlato dlhými karavánovými cestami do Sofaly, kde ho vymieňalo za čínsky hodváb, perzskú keramiku a indickú bavlnu, ktoré sem každoročne privážali monzúnové lode z Kilwy a ďalších prístavov. Arabský zemepisec al-Mas'údí mesto navštívil v 10. storočí. Za mahdálskych sultánov z Kilwy sa z neho stala poslušná základňa veľkej severnej svahilskej ríše. Jeho prosperita úplne závisela od obchodu so zlatom a od monzúnových cyklov." # todo: NEW TRANSLATION
 gao_desc: "Gao, ležiace pri veľkom severovýchodnom ohybe rieky Niger, bolo hlavným mestom kráľovstva Songhai najmenej od 8. storočia. Jeho islamizovaní vládcovia obchodovali so severnou Afrikou dávno pred vzostupom Mali. Dobývajúce vojská Mansu Musu ho začiatkom 14. storočia začlenili do ríše Mali a Gao sa stalo jedným z hlavných poplatných miest veľkého afrického cisára. Jeho lode sa plavili po Nigere hore aj dolu a privážali soľ zo Sahary a zlato z južných lesov na trhy Timbuktu. Za malijskej nadvlády si songhajský kráľovský rod zachoval svoju moc a v mešitách a obchodných štvrtiach mesta sa zasievali zárodky budúceho cisárskeho obrodenia." # todo: NEW TRANSLATION
 djenne_desc: "Djenné, ležiace na hornom okraji vnútrozemskej delty Nigeru, je významným sídlom už od storočí pred Kristom. Jeho starší predchodca Djenné-Djenno predstavuje jednu z najstarších mestských civilizácií subsaharskej Afriky. Koncom 13. storočia mesto za vlády kráľa Konbora prijalo islam a veľká hlinená piatková mešita, ktorú dal postaviť, vyrástla v strede prosperujúceho mesta vnútrozemskej delty spojeného s Timbuktu transsaharským obchodom. Obchodníci z Djenné zhromažďovali zlato z oblastí Bambuk a Buré a bavlnu z vnútrozemskej delty, aby ich vymieňali za púštnu soľ. Architektúra zvaná #italic banco#!, s vyčnievajúcimi drevenými trámami a hlinenými vežami, vtlačila krajine sahelského Sudánu nezameniteľnú podobu." # todo: NEW TRANSLATION
 great_zimbabwe_desc: "Južne od Zambezi, na vysokej žulovej plošine nad riekou Save, vybudovali národy hovoriace po šonsky v 11. a 12. storočí výnimočné mesto z kameňa bez malty. Jeho zakrivené múry a kužeľovité veže dali kráľovstvu názov podľa slov #italic dzimba dzemabwe#!, „kamenné domy“. Na vrchole v 14. storočí zaberalo mesto stovky akrov a mohlo v ňom žiť až osemnásťtisíc ľudí. Jeho vládcovia kontrolovali obchod so zlatom, ktoré putovalo k svahilskému pobrežiu do Sofaly a odtiaľ do Kilwy a ďalej do Indického oceána. Trhy zapĺňali sochárske diela z mastenca v podobe vtákov, črepy čínskeho porcelánu i koráliky z Perzie a Indie. Svedčili o globálnom dosahu civilizácie, o ktorej existencii Európania vtedy nemali ani tušenia." # todo: NEW TRANSLATION
 kano_desc: "Kano, ležiace na savane južne od veľkých saharských dún, podľa hauskej tradície založili potomkovia legendárneho hrdinu Bayajiddu. Ten zabil hada pri studni a svojich synov ustanovil za kráľov siedmich hauskych mestských štátov. V 14. storočí bolo Kano najmocnejším z nich. Jeho skalnatý pahorok Dala si uctievali ako miesto, kde sa zrodil tento štát. Hlinené hradby a farbiarske jamy priťahovali saharské karavány so soľou a meďou. Tie vymieňali svoj náklad za indigom farbené látky a kožený tovar, v ktorých vynikali hauski remeselníci. Králi vládli podľa obradov staršieho hauskyho náboženstva, no islamskí misionári a obchodníci si už prenikali do kráľovstva po transsaharských cestách." # todo: NEW TRANSLATION
 axum_desc: "Aksum patrí medzi najstaršie mestá Afriky. Bol hlavným mestom aksumskej ríše, ktorá prekvitala od 1. storočia, obchodovala s Rímom a Indiou cez prístav Adulis pri Červenom mori a za kráľa Ezanu v 4. storočí prijala kresťanstvo za štátne náboženstvo. Bola prvým štátom subsaharskej Afriky, ktorý tak urobil. Nad ruinami mesta sa stále týčia obrovské žulové stély, ktoré Aksumčania postavili nad kráľovskými hrobkami. Najvyššia z nich váži päťsto ton a nesie vyrytú podobu viacposchodového paláca. V 14. storočí sa skutočná moc presunula na juh, kde v roku 1270 obnovil vládu nová Šalamúnovská dynastia pod vedením Yekuna Amlaka. Aksum však zostal duchovným hlavným mestom etiópskeho kresťanstva, miestom korunovácie etiópskych cisárov a podľa tradície aj úkrytom samotnej Archy zmluvy v Kostole Panny Márie Sionskej." # todo: NEW TRANSLATION
 mayapan_desc: "Mayapan, vybudovaný v rámci veľkého obranného múru na suchej nížine severného Yucatánu, sa koncom 13. storočia stal nástupcom staršieho mayského hlavného mesta Chichén Itzá. Podľa mayských kroník ho založila rodina Cocomovcov, ktorá si nárokovala pôvod od vládcov staršieho mesta. Z nového hlavného mesta vládli Cocomovci spolku spojeneckých pánov z celého Yucatánu. Hlavy podriadených rodov museli bývať pod kráľovským dohľadom v hlavnom meste, aby sa zaistila ich vernosť. Mnohé menšie a menej ambiciózne napodobeniny chrámov Chichén Itzá hlásali civilizáciu, ktorá sa považovala za dedičku staršej a veľkolepejšej tradície. Politické úspechy spolku Mayapan, ktorý zjednotil drobných kráľov Yucatánu do jednej konfederácie, však boli skutočne jeho vlastné." # todo: NEW TRANSLATION
 chan_chan_desc: "Na púštnom pobreží severného Peru, kde Andy prudko klesajú k Tichému oceánu a celé roky nemusí spadnúť ani kvapka dažďa, vybudovali čimúcki králi v 12. až 14. storočí rozsiahle mesto Chan Chan, najväčšie predkolumbovské mesto Južnej Ameriky. V jeho hradbách vyrástol rad veľkých kráľovských #italic ciudadelas#!, samostatných palácových komplexov postavených pre jednotlivých vládcov a po ich smrti uzavretých. Hlinené múry každého komplexu zdobili rytmické reliéfy vĺn a morských vtákov, pripomínajúce námorný pôvod národa Čimú. Z tohto hlavného mesta vládli králi Chimoru najrozsiahlejšej pobrežnej ríši, aká kedy vznikla v Andách. Tisíc kilometrov zavlažovacích kanálov, rybárskych osád a hutníckych obcí odvádzalo dane púštnemu mestu v jej srdci." # todo: NEW TRANSLATION
 cholollan_desc: "Pod svahmi sopky Popocatepetl na veľkej centrálnej náhornej plošine Mexika stálo mesto Cholollan. Jeho výnimočná pyramída #italic Tlachihualtepetl#!, Hora vytvorená človekom, bola najväčšou samostatnou stavbou predkolumbovského sveta. Začali ju budovať stáročia pred Kristom a postupne ju rozširovali Toltékovia aj neskorší stavitelia. Zaberala obrovskú plochu, na ktorej stál chrám opereného hada Quetzalcōātl, veľkého božstva, ktorému bolo Cholollan zasvätené. Mesto prešlo z rúk Toltékov do rúk Olmékov-Xicalankov a napokon Toltékov-Čičimékov. Zostalo najvýznamnejším pútnickým centrom centrálnej vysočiny, kde si noví vládcovia kotliny nechávali potvrdiť svoju autoritu kňazmi Quetzalcōātl." # todo: NEW TRANSLATION
 qusqu_desc: "Vysoko v andskom údolí, v srdci kraja, ktorý miestne národy nazývajú štyrmi svetovými stranami, založil podľa povesti Manco Cápac malé mesto Cusco, staroveké #italic Qusqu#!, Pupok sveta. So svojou sestrou a manželkou vystúpil z vôd jazera Titicaca a na vybranom mieste zapichol zlatú palicu. Počas 13. a na začiatku 14. storočia bolo mesto skromným sídlom regionálneho kniežatstva, ktoré súperilo so susedmi, ako boli Čankovia, Kečuovia a Ajarmakovia, o prvenstvo v južných Andách. Jeho vládcovia, ktorí si jedného dňa prisvoja titul #italic Sapa Inca#!, pripravovali spojenectvá a bojovníkov, s ktorými ich ďalšia generácia dokáže uskutočniť omnoho väčšie plány v južných Andách." # todo: NEW TRANSLATION
 roskilde_desc: "Roskilde, ležiace pri hlbokom fjorde na severnom pobreží Sjællandu, získalo význam v 10. storočí ako sídlo kráľov dynastie Jellingovcov, ktorí zjednotili Dánsko. Prvý kamenný kostol tu vlastnoručne postavil Harald Modrozub, pochovaný v jeho areáli. Ako kráľovské mauzóleum dánskej koruny a sídlo mocného biskupstva sa mesto v 12. a 13. storočí stalo najvýznamnejším mestom dánskej ríše. Jeho veľká tehlová katedrála patrila k najstarším príkladom tehlovej gotiky v severnej Európe. Začiatkom 14. storočia začal rastúci prístav v Øresunde, Kodaň, odčerpávať obchodníkov, no Roskilde zostalo duchovným srdcom Dánska. Jeho králi sa tu korunovali aj pochovávali viac než tri storočia." # todo: NEW TRANSLATION
 kobenhavn_desc: "Na východnom pobreží Sjællandu, oproti úzkemu prielivu Øresund a pobrežiu Skåne, daroval kráľ Valdemar I. malú rybársku osadu #italic Havn#! svojmu nevlastnému bratovi, biskupovi Absalonovi. Okolo roku 1167 postavil na ostrove Slotsholmen opevnený hrad, aby potlačil vendických pirátov v Balte. Za jeho nástupcov sa biskupská pevnosť zmenila na obchodné mesto #italic Købmandshavn#!, Prístav kupcov, ktoré ovládalo bohaté loviská sleďov v Øresunde, kam sa každé leto zbiehali veľké húfy rýb. O mesto sa horko sporili dánski králi a roskildskí arcibiskupi, no jeho výhodná poloha pri prielive neustále priťahovala do prístavu baltský obchod." # todo: NEW TRANSLATION
 lund_desc: "Lund, ktorý koncom 10. storočia založil Sweyn Vidlofúz v srdci svojich držav v Skåne, dosiahol mimoriadny význam v roku 1103. Pápež Paschal II. ho vtedy povýšil na sídlo arcibiskupstva celej Škandinávie a oddelil severné cirkvi od hambursko-brémskeho arcibiskupstva. Veľká románska katedrála, ktorej výstavbu začal arcibiskup Asser, bola vysvätená v roku 1145 a dominovala mestu. V jej krypte sa nachádzali slávne astronomické hodiny a postava obra Finna. Nidaros získal vlastné arcibiskupstvo v roku 1152 a Uppsala ho nasledovala v roku 1164, no Lund si zachoval prvenstvo v dánskej cirkvi aj v Skåne. Jeho arcibiskup patril k najvyšším hodnostárom dánskej ríše." # todo: NEW TRANSLATION
 oslo_desc: "Podľa tradície založil Oslo okolo roku 1049 kráľ Harald Hardrada na konci veľkého fjordu, ktorý nesie jeho meno. V roku 1070 sa stalo sídlom biskupstva a počas stredoveku vyrástlo na jedno z hlavných miest nórskeho kráľovstva. Kráľ Håkon V. Magnusson si ho v roku 1299 zvolil za kráľovské hlavné mesto a presunul sem dvor z Bergenu, aby bol bližšie k politickému centru pevninskej Škandinávie. Jeho veľká pevnosť Akershus, ktorej výstavba sa začala okolo roku 1300, sa týči nad prístavom ako symbol tejto kráľovskej ambície. Drevené ulice mesta, natlačené medzi skalu Akershus a biskupskú štvrť, žijú obchodom s drevom a kožušinami z nórskeho vnútrozemia, ktoré sa vymieňajú za obilie a látky z baltských prístavov." # todo: NEW TRANSLATION
 nidaros_desc: "Nidaros, ležiaci pri ústí rieky Nidelva do veľkého fjordu Trøndelag, založil okolo roku 997 kráľ Olaf Tryggvason. Stalo sa miestom posledného odpočinku jeho kresťanstvo šíriaceho nástupcu Olafa Haraldssona, ktorý padol v bitke pri Stiklestade v roku 1030 a takmer okamžite ho začali uctievať ako svätca a mučeníka. Veľká katedrála postavená nad jeho svätyňou sa stala najposvätnejším pútnickým miestom severu a priťahovala veriacich z Islandu, Grónska aj Britských ostrovov. V roku 1152 povýšili mesto na arcibiskupské sídlo cirkevnej provincie, ktorá siahala od nórskeho vnútrozemia po kolónie v západných moriach. Aj keď sa kráľovské hlavné mesto presťahovalo na juh, najprv do Bergenu a potom do Osla, Nidaros zostal duchovným srdcom Nórska. Tu sa korunovali jeho králi a svätý Olaf, večný panovník, odtiaľ bdel nad ríšou." # todo: NEW TRANSLATION
 abo_desc: "Po druhej švédskej križiackej výprave, ktorá v 40. rokoch 13. storočia podrobila Fínov kresťanskej vláde, vyrástlo Åbo, Fínom známe ako #italic Turku#!, pri ústí rieky Aura na hlavné švédske oporné miesto na juhozápadnom pobreží Fínska. V roku 1300 tu zriadili biskupstvo a novovysvätená katedrála sa stala duchovným centrom fínskej cirkvi. Mestské nábrežia začali priťahovať baltský obchod, ktorý spájal fínske vnútrozemie so Štokholmom a vzdialenejšími hanzovými mestami. Hoci je Åbo oproti veľkým hanzovým prístavom južného Baltu stále skromné, slúži ako správne a cirkevné hlavné mesto fínskych území švédskej ríše. Jeho biskup patrí medzi najvýznamnejších hodnostárov švédskej cirkvi." # todo: NEW TRANSLATION
 kalmar_desc: "Kalmar, ležiaci na juhovýchodnom pobreží Švédska pri najužšom mieste prielivu medzi pevninou a dlhým ostrovom Öland, vyrástol v 12. storočí okolo veľkého kamenného hradu, jednej z najstarších a najmohutnejších kráľovských pevností švédskej ríše. Jeho prístav slúžil ako hlavná južná brána Švédska a cez neho smeroval vývoz železa, medi a masla k hanzovým obchodníkom z Lübecku a ďalších miest. Kráľ Magnus Ladulås udelil mestu kráľovské výsady v roku 1276 a potvrdil tak jeho postavenie medzi najvýznamnejšími mestami kráľovstva. Začiatkom 14. storočia z neho strategická poloha na dánsko-švédskej hranici a mohutné hradby urobili dôležitý obchodný prístav aj kľúčovú pevnosť, južnú baštu švédskej koruny proti ambíciám Dánska." # todo: NEW TRANSLATION
 falun_desc: "Na svahoch veľkej červenej hory Tiskasjöberget v Dalarne ležala medená baňa #italic Stora Kopparberget#!, najväčší a najvýnosnejší zdroj medi v stredovekej Európe a základ švédskeho priemyslu najmenej od 9. storočia. Kráľ Magnus III. v roku 1288 udelil formálne výsady ťažobnej spoločnosti #italic Stora Kopparbergs Bergslag#!, ktorá baňu prevádzkovala. Bola jedným z najstarších spoločných obchodných podnikov na svete. Osada baníkov Falun pri jazere pod baňou vyrástla okolo veľkej šachty. Jej dym a červený oxidový prach sfarbovali okolité domy aj pôdu na míle ďaleko. Meď z miestnych hút zásobovala nielen švédsku ríšu, ale aj trhy celej severnej Európy." # todo: NEW TRANSLATION
 uppsala_desc: "Len niekoľko kilometrov od skromného katedrálneho mesta stojí staroveká Gamla Uppsala, niekdajšie pohanské stredisko. Adam Brémsky tu opísal veľký zlatý chrám s tromi modlami Thóra, Ódina a Freyra, ktorým každých deväť rokov obetovali ľudí a zvieratá. Nad nížinou sa stále dvíhajú kráľovské mohyly dynastie Ynglingovcov. Po prijatí kresťanstva vo Švédsku stratilo toto kultové miesto svoj význam a pápež Alexander III. v roku 1164 ustanovil Uppsalu za sídlo arcibiskupstva celého Švédska, čím oddelil švédsku cirkev od dánskeho prvenstva v Lunde. V roku 1287 presunuli biskupské sídlo o niekoľko kilometrov na juh do nového mesta Östra Aros. Začala sa tu výstavba veľkej tehlovej gotickej katedrály, ktorá bude po dokončení najväčšou v Škandinávii. Pri jej oltári korunovali švédskych kráľov najvyšší hodnostári ríše." # todo: NEW TRANSLATION
 skara_desc: "Skara, ležiaca na nížinách Västergötlandu medzi veľkými jazerami Vänern a Vättern, sa v roku 1014 stala z rozhodnutia kráľa Olofa Skötkonunga sídlom prvého švédskeho biskupstva. Prvým biskupom sa stal nemecký misionár Thurgot. Z tohto skromného nížinného mesta sa kresťanská viera šírila do švédskej ríše, ktorá bola ešte sčasti pohanská. Veľká románska katedrála vysvätená v roku 1150 za biskupa Bengta Dobrého urobila zo Skary duchovné hlavné mesto Västergötlandu na celé stáročia. Hoci jej vplyv napokon zatienili Uppsala a Linköping, biskup zo Skary si zachoval dôstojné postavenie medzi najvýznamnejšími hodnostármi švédskej ríše. Jeho katedrálna kapitula a #italic Skarakrönikan#! uchovali spomienky na prvé kresťanské storočia kráľovstva." # todo: NEW TRANSLATION
 linkoping_desc: "Linköping, ležiaci na vnútrozemskej nížine Östergötlandu pri ceste zo Štokholmu do južných kráľovstiev a pri rieke Stång, sa začiatkom 12. storočia stal biskupstvom a odvtedy patrí k najvýznamnejším cirkevným strediskám švédskej ríše. Veľkú katedrálu, ktorej stavbu začali v 12. storočí z miestneho svetlosivého vápenca, postupne premenili na jednu z najambicióznejších gotických stavieb vo Švédsku. Biskup z Linköpingu bol medzi hodnostármi kráľovstva hneď po arcibiskupovi z Uppsaly. Neďaleký veľký snem v Skänninge v roku 1248 zvolal pápežský legát Viliam zo Sabiny. Zaviedol celibát duchovenstva vo švédskej cirkvi a pevne ju začlenil do latinského kánonického poriadku širšieho kresťanského sveta." # todo: NEW TRANSLATION
 soderkoping_desc: "Söderköping leží na rieke Storå, pri jej ústí do Baltu a na konci chráneného zálivu. V 12. a 13. storočí vyrástol na jeden z najvýznamnejších švédskych prístavov. Jeho nábrežia sa hemžili koggami z Lübecku a Visby, ktoré nakladali železo a meď z vnútrozemia na trhy juhu. V kráľovskom trhovom meste žila početná nemecká meštianska obec, ktorá spravovala svoje záležitosti podľa výsad odvodených od Lübeckého práva. Mesto hostilo kráľovské korunovácie, rokovania o zmluvách aj veľký jarmok, ktorý každé leto priťahoval obchodníkov z celého Baltu. Hoci jeho prístav už začalo ohrozovať pomalé zanášanie vodnej cesty, začiatkom 14. storočia zostáva Söderköping jedným z hlavných obchodných miest východného pobrežia Švédska." # todo: NEW TRANSLATION
 lodose_desc: "Lödöse ležalo na rieke Göta älv, ktorá sa z jazera Vänern vinie smerom k moru. Švédsku slúžilo ako jediný prístup k Atlantiku a obchodu Severného mora. Drevený riečny prístav sa tiesnil na úzkom páse zeme medzi vodou a strmými západnými pahorkami. Zo svojich nábreží vyplávali švédske lode do Nórska, Anglicka a miest Nízkych krajín, kde vymieňali železo a kože za látky a víno zo západných trhov. Kráľovská mincovňa razila mince pre švédskych kráľov najmenej od 12. storočia. Keďže si o územie pri dolnom toku Göta älv nárokovali Dáni, Nóri aj Švédi, vlastníctvo Lödöse bolo neustálym predmetom diplomatických sporov. Jeho strategickú hodnotu ako jediného švédskeho prístupu k Atlantiku nemalo v kráľovstve ničím porovnateľnú." # todo: NEW TRANSLATION
 jonkoping_desc: "Jönköping leží na južnom konci veľkého jazera Vättern, pri prirodzenom priechode medzi vysočinou Smålandu a nížinami Östergötlandu. Kráľ Magnus Ladulås mu v roku 1284 udelil výsady kráľovského mesta a potvrdil tak jeho dlhodobý význam ako miesta stretnutí a obchodu medzi severnými a južnými kráľovstvami. Jeho poloha pri hlavnej ceste spájajúcej centrálne provincie s pohraničnými oblasťami Skåne, ktoré držali Dáni, z neho urobila rušné trhové mesto aj pohraničnú pevnosť. Kráľovský hrad nad prístavom predstavoval stály val proti odvekým dánskym ambíciám posúvať hranicu na sever. Začiatkom 14. storočia bolo Jönköping kľúčom k politickej a vojenskej kontrole prístupu zo Smålandu do švédskeho vnútrozemia." # todo: NEW TRANSLATION
 ribe_desc: "Ribe, založené okolo roku 700 ako vikinské trhovisko na močaristom západnom pobreží Jutska, kde prílivový potok umožňoval vyťahovať na breh zaoceánske lode, je najstarším mestom Škandinávie. Jeho obchodníci nadväzovali styky s pobrežím Frízska a Anglicka viac než storočie predtým, než Vikingovia dorazili na Britské ostrovy. Adam Brémsky ho označil za hlavný dánsky trh a misionár Ansgar tu začiatkom 9. storočia založil kostol. Ribe sa tak stalo jednou z prvých kresťanských základní na škandinávskom severe. Veľká románska katedrála, ktorú v 12. storočí začali stavať z tufového kameňa privezeného z Porýnia, sa týči nad mestom. Jeho obchodníci obchodovali s frízskymi a flámskymi prístavmi na druhej strane Severného mora a vymieňali soľ a obilie zo západného dánskeho pobrežia za látky a víno z juhu." # todo: NEW TRANSLATION
 viborg_desc: "Viborg, ležiaci na centrálnej náhornej plošine Jutska medzi rozsiahlymi vresoviskami a jazerami, bol už v pohanských časoch sídlom jutskej #italic landsting#!, oblastného zhromaždenia, kde sa schádzali náčelníci polostrova, aby rokovali o zákonoch a vyhlasovali svojich kráľov. V stredoveku tu nových dánskych kráľov najprv uznávali a až potom putovali na juh do Lundu, kde ich arcibiskup cirkevne korunoval. Dve veľké katedrály mesta, biskupské sídlo a starší kráľovský kostol, svedčili o neobyčajnej koncentrácii duchovnej a politickej autority v jeho hradbách. Vzostup Kodane a presun dánskej moci na východ oslabili každodenný význam Viborgu, no symbolické prvenstvo jeho #italic landsting#! zostalo neoddeliteľnou súčasťou ustanovovania dánskeho kráľa." # todo: NEW TRANSLATION
 odense_desc: "Odense, ležiace v srdci ostrova Fyn, odvodzuje svoje meno od severského boha Ódina, ktorému bolo miestne veľké kultové miesto zasvätené dávno pred príchodom kresťanstva. Premena mesta sa začala v roku 1086, keď kráľa Knuda Svätého zavraždili pred oltárom kostola svätého Albana. Vzbúrení šľachtici sa odmietli podriadiť jeho desiatku a odvodu do križiackej výpravy. Kult mučeníckeho kráľa sa rýchlo rozšíril, v roku 1101 ho pápež vyhlásil za svätého a Odense sa stalo jedným z veľkých pútnických miest Škandinávie. Benediktínsky kláštor, ktorý založili anglickí mnísi z Eveshamu na uchovávanie svätcových relikvií, premenil mesto na centrum vzdelanosti. Začiatkom 14. storočia bolo Odense najvýznamnejším mestom dánskych ostrovov západne od Sjællandu." # todo: NEW TRANSLATION
 aarhus_desc: "Aarhus vznikol ako osada z vikinských čias na východnom pobreží Jutska pri ústí rieky Aarhus do Kattegatu. V roku 948 sa spomína medzi štyrmi dánskymi biskupstvami založenými pod vplyvom nemeckých misionárov po obrátení kráľa Haralda Modrozuba na kresťanstvo. Jeho chránený prístav z neho počas stredoveku urobil hlavný prístav východného Jutska. Cez neho prúdili jutski dobytok a obilie na trhy Lübecku a Hamburgu. Nad mestom obchodníkov a rybárov sa týči veľká tehlová katedrála, ktorej stavbu začali v 13. storočí. Hoci ho politickým významom zatieňoval Viborg a obchodnou silou Ribe, začiatkom 14. storočia malo Aarhus neohrozené postavenie popredného prístavu na jutskej strane Kattegatu." # todo: NEW TRANSLATION
 aalborg_desc: "Aalborg na južnom brehu Limfjordu ovládal hlavný priechod cez veľkú vnútrozemskú vodnú cestu, ktorá pretína severné Jutsko od Severného mora po Kattegat. Jeho prístav strážil obchod smerujúci medzi oboma moriami na východ aj na západ. Kráľovský hrad Aalborghus, spočiatku drevená pevnosť, strážil priechod najmenej od 11. storočia. Loviská sleďov vo fjorde obohatili miestnych obchodníkov natoľko, že mohli udržiavať rozsiahly hanzový obchod s Lübeckom a vendickými prístavmi. Kráľovské výsady, dôstojné tehlové kostoly a rastúca meštianska obec urobili z Aalborgu začiatkom 14. storočia jedno z hlavných miest severného Dánska. Jeho poloha na vodnej ceste naprieč Jutskom mu dávala v regióne neprekonateľnú strategickú hodnotu." # todo: NEW TRANSLATION
 tonsberg_desc: "Podľa ság Snorriho Sturlusona založili Tønsberg ešte pred veľkou bitkou pri Hafrsfjorde, ktorá v roku 872 zjednotila Nórsko pod vládou Haralda Krásnovlasého. Preto si nárokuje titul najstaršieho nórskeho mesta. Jeho chránený prístav na Oslofjorde slúžil vikinským flotilám aj kráľovským dvorom v 9. a 10. storočí. Pevnosť Tunsberghus na výšine nad prístavom sa stala jedným z hlavných kráľovských hradov stredovekého Nórska. Veľké premonštrátske opátstvo Olavskloster, založené koncom 12. storočia, urobilo z mesta centrum vzdelanosti. Zmluvy medzi nórskymi kráľmi a uchádzačmi o trón, kráľovské razenie mincí i zhromažďovanie vojsk na občianske vojny a križiacke výpravy urobili z Tønsbergu dôležité miesto nórskych dejín. Z ostatných sídiel ríše mu významom konkurovali len Bergen, Nidaros a Oslo." # todo: NEW TRANSLATION
 stavanger_desc: "Stavanger, ležiaci v chránenej zátoke na juhozápadnom pobreží Nórska, kde veľké fjordy Ryfylke ústia do Severného mora, povýšil na biskupstvo kráľ Sigurd Krížovník v roku 1125. Priviedol sem anglického biskupa Reinalda z Winchesteru, aby založil nové biskupské sídlo. Románska katedrála, ktorej výstavbu začal Reinald v štýle priamo prevzatom z anglo-normandského Anglicka, dominovala prístavu. Patrila k najvýraznejším kostolom v Škandinávii ovplyvneným Anglickom. Ako sídlo biskupstva patril Stavanger k hlavným cirkevným strediskám nórskej ríše. Jeho biskup ovládal rozsiahle majetky v diecézach Rogaland a Agder, hoci samotný prístav zostáva skromným rybárskym mestečkom na západnom okraji nórskeho sveta." # todo: NEW TRANSLATION
 hamar_desc: "Hamar leží na západnom brehu jazera Mjøsa v srdci vnútrozemského Nórska. V roku 1152 ho kardinál Nicholas Breakspear, budúci pápež Hadrián IV., povýšil na biskupstvo počas svojej veľkej misie, ktorej cieľom bola reorganizácia nórskej cirkvi a založenie arcibiskupstva v Nidare. Katedrálu začali stavať krátko nato pri jazere a počas 12. a 13. storočia sa rozrástla na jeden z najambicióznejších románskych kostolov vnútrozemského Nórska. Biskup Hamaru spravoval diecézu horských údolí a farností pri jazerách a patril medzi najvýznamnejších hodnostárov kráľovstva. Začiatkom 14. storočia slúžilo toto skromné katedrálne mesto ako hlavné náboženské centrum vnútrozemských nórskych provincií. Jeho biskupstvo bolo duchovným strediskom jazerného kraja a východných nórskych hôr." # todo: NEW TRANSLATION
 vyborg_desc: "Viborg založil v roku 1293 švédsky maršal Torkel Knutsson počas tretej švédskej križiackej výpravy proti Kareľom. Na skalnatom ostrovčeku pri karelskom pobreží postavili mohutný kamenný hrad, najvýchodnejšiu základňu švédskej ríše a hlavnú pevnosť na ochranu novej hranice pred Novgorodom. Švédski miestodržitelia z jeho hradieb viedli tridsať rokov výpravy proti karelským a ruským nájazdníkom, až kým Nöteborská zmluva v roku 1323 neurčila hranicu medzi Švédskom a Novgorodom. Viborg tak zostal nespornou východnou baštou švédskeho kráľa. Okolo hradu vyrástlo obchodné mesto, ktorého nábrežia priťahovali karelské kožušiny, ruský vosk a fínske výrobky. Mesto slúžilo ako východný koniec baltských plavebných ciest." # todo: NEW TRANSLATION
 burgos_desc: "Burgos, ktorý v roku 884 založil gróf Diego Rodríguez Porcelos pri sútoku riek Arlanzón a Vena, sa v 9. a 10. storočí stal hlavnou pevnosťou Kastílskeho grófstva. Od roku 1037, za vlády Ferdinanda Veľkého, bol hlavným kráľovským mestom zjednoteného Kastílskeho a leónskeho kráľovstva. Pochádzal odtiaľ Rodrigo Díaz de Vivar, známy ako El Cid Campeador, ktorého telesné pozostatky spočinuli v neďalekom kláštore San Pedro de Cardeña. Burgos ležal aj na začiatku veľkej pútnickej cesty #italic Camino Francés#!, po ktorej prichádzali pútnici z celého kresťanstva do Santiaga de Compostela. Kráľovské mauzóleum Las Huelgas, ktoré v roku 1187 založil Alfons VIII., uchovávalo hrobky kastílskych kráľov. Veľká gotická katedrála, ktorú začali stavať v roku 1221 za kráľa Ferdinanda III., sa považovala za jeden z vrcholných architektonických počinov stredovekého Španielska." # todo: NEW TRANSLATION
 leon_desc: "León založili Rimania ako tábor #italic Legio VII Gemina#!, od ktorého odvodzuje svoje meno. V 10. storočí sa stal hlavným mestom kresťanského astúrsko-leónskeho kráľovstva, ktoré posúvalo reconquistu na juh cez kantábrijské úpätia až na náhornú plošinu Meseta. Kráľovský palác a veľká bazilika San Isidoro, ktorej Panthéon kráľov z 11. storočia uchovával hrobky dvoch desiatok leónskych panovníkov, urobili z mesta duchovné a politické srdce ríše, ktorá svojou prestížou i územím istý čas prevyšovala Kastíliu. Spojenie s Kastíliou za Ferdinanda III. v roku 1230 presunulo politické centrum na juh, do Toleda a Valladolidu, Leónu však zostala symbolická dôstojnosť starobylého kráľovského sídla. Jeho veľká gotická katedrála, ktorej stavbu začali v roku 1205 podľa vzoru severofrancúzskych katedrál, žiarila ako svedectvo pretrvávajúcej hrdosti." # todo: NEW TRANSLATION
 salamanca_desc: "Salamanca, ležiaca na skalnatom výbežku nad riekou Tormes v západnej časti Mesety, bola starým keltiberským a rímskym mestom. Kresťanské kráľovstvá ju za Alfonsa VI. v roku 1085 znovu osídlili v rámci veľkého osídľovania územia medzi riekami Duero a Tajo. Zásadná premena prišla v roku 1218, keď leónsky kráľ Alfons IX. založil miestne #italic Studium Generale#!. Škola mimoriadne rýchlo vyrástla na jednu zo štyroch veľkých univerzít kresťanského sveta, popri Bologni, Paríži a Oxforde. Pápež Alexander IV. v roku 1255 potvrdil jej právo udeľovať #italic licentia ubique docendi#!, oprávnenie vyučovať kdekoľvek. Jej učenci kánonického práva a teológie čoskoro súperili s učencami starších európskych #italic studia#! a začiatkom 14. storočia bola Salamanca hlavným centrom intelektuálneho života v Kastílskom kráľovstve." # todo: NEW TRANSLATION
 segovia_desc: "Segovii pri úpätí pohoria Sierra de Guadarrama dominuje veľký rímsky akvadukt z dvojitého radu žulových oblúkov. Vodu z pohoria sem privádza už vyše dvanásť storočí bez použitia malty. Patrí k najúchvatnejším technickým pamiatkam, ktoré sa v Španielsku zachovali z antiky. Po dobytí Toleda v roku 1085 mesto znovu osídlil Alfons VI. a počas stredoveku sa stalo obľúbeným kráľovským sídlom aj miestom významnej kráľovskej mincovne. Kastílski králi sa zastavovali v jeho hrade Alcázar na skale nad riekou, aby vynášali rozsudky a riadili štátne záležitosti. Segovské merinské ovce každoročne putovali medzi zimnými pastvinami Extremadury a letnými vysokohorskými pastvinami Kastílie a preslávili segovskú vlnu na flámskych trhoch." # todo: NEW TRANSLATION
 avila_desc: "Ávila, ležiaca na vetrom bičovanom žulovom výbežku na západnom okraji pohoria Sistema Central, bola v roku 1090 znovu osídlená grófom Raymondom Burgundským. Hneď ju obohnali najucelenejším a najmohutnejším okruhom stredovekých hradieb na Pyrenejskom polostrove, ktoré leónski a burgoskí murári vybudovali za menej než desaťročie. Osemdesiatosem polkruhových veží a deväť brán na okraji skalnej plošiny dohliada na mesto, ktoré sa stalo kľúčovou pohraničnou pevnosťou znovu osídľovanej Kastílie. Mestské kostoly vrátane katedrály San Salvador, ktorej apsida je zabudovaná do východnej časti hradieb, urobili z Ávily cirkevné stredisko aj vojenskú baštu. Začiatkom 14. storočia stáli hradby mesta stále nezdolané a ako symbol kastílskeho znovuosídľovania nehybne strážili Mesetu, ktorú mali chrániť." # todo: NEW TRANSLATION
 madrid_desc: "Madrid vznikol koncom 9. storočia ako malá moslimská základňa #italic Majrīṭ#!, pomenovaná podľa početných prameňov zavlažujúcich okolité vresoviská. Keď ho Alfons VI. Leónsko-kastílsky počas veľkého postupu na Toledo v roku 1083 dobyl bez odporu, bol to opevnený vidiecky mestečko na severnej hranici kalifátu. Kastílska koruna si ho ponechala ako skromné kráľovské mesto a Alfons VIII. mu v roku 1202 udelil jeho #italic fuero#!, mestské právo. Vresoviská v okolí, obľúbené na lov, z neho urobili vyhľadávanú zastávku putovného kastílskeho dvora. V roku 1309 zvolal kráľ Ferdinand IV. v Madride po prvý raz kastílske kortesy, čo svedčilo o rastúcom správnom význame mesta. Stále však zostávalo skromným sídlom v dlhom tieni neďalekého cisárskeho mesta Toleda." # todo: NEW TRANSLATION
 santiago_compostela_desc: "Začiatkom 9. storočia zaviedla pustovníka Pelaya zvláštna hviezda nad dubovým hájom v divokých galícijských kopcoch k rímskej hrobke. Biskup Theodemir z Iria Flavia ju označil za miesto posledného odpočinku apoštola Jakuba, brata Jána, ktorého telo po mučeníckej smrti v Jeruzaleme priniesli jeho učeníci. Astúrsky kráľ Alfons II. dal nad znovuobjavenou hrobkou postaviť prvý kostol. Počas 11. a 12. storočia vyrástlo Santiago de Compostela na tretie najväčšie pútnické miesto kresťanstva po Ríme a Jeruzaleme. Pútnici zo všetkých kútov Európy nosili na klobúkoch mušle apoštola #italic concha#!. Veľká románska katedrála, ktorú v roku 1075 začal stavať biskup Diego Peláez a dokončil ju mocný biskup Diego Gelmírez, dominovala na konci #italic Camino Francés#!, najrušnejšej cesty stredovekej Európy. Arcibiskupstvo v Compostele patrilo k najmocnejším a najspornejším cirkevným panstvám latinského kresťanstva." # todo: NEW TRANSLATION
 zaragoza_desc: "Zaragozu, pôvodne #italic Caesaraugusta#!, založil cisár Augustus na rieke Ebro v srdci veľkej riečnej nížiny. Predtým, než sa dostala pod vládu Vizigótov a moslimov, bola najvýznamnejším rímskym mestom horného údolia Ebra. Za kráľov tajfy Banú Húd v 11. storočí sa stala hlavným mestom jedného z najkultivovanejších nástupníckych štátov al-Andalusu. Jeho palác Aljafería na predmestí žiaril ako skvost neskorej islamskej dvorskej architektúry. Alfons Bojovník Aragónsky ju v roku 1118 dobyl v jednom z veľkých víťazstiev reconquisty a urobil z nej hlavné mesto nového Aragonského kráľovstva. Jeho mudejárske kostoly, kráľovská mincovňa a sídlo aragonských kortesov z neho urobili politické a ceremoniálne srdce aragonskej koruny." # todo: NEW TRANSLATION
 valencia_desc: "Valencia vznikla ako rímska kolónia #italic Valentia Edetanorum#! na širokej pobrežnej nížine pri rieke Turia. Mesto prešlo rukami Vizigótov a Maurov a napokon sa na krátky čas stalo osobným panstvom Rodriga Díaza de Vivara, El Cida, ktorý mu vládol od roku 1094 až do svojej smrti v roku 1099. Keď jeho kresťanské vojská odišli, mesto sa vrátilo pod moslimskú vládu a za Almorávidov a Almohádov prekvitalo ako jedno z veľkých miest al-Andalusu. Jeho zavlažované polia a citrusové háje v oblasti #italic huerta#! boli známe po celom Stredozemí. Aragónsky kráľ Jaume Dobyvateľ vošiel do mesta triumfálne 9. októbra 1238, čím ukončil najdlhšie obliehanie východnej reconquisty a založil v rámci aragonskej koruny nové kráľovstvo Valencia. Zachoval jeho zavlažované poľnohospodárstvo, vodný súd #italic huerta#! aj veľkú časť jeho prosperity." # todo: NEW TRANSLATION
 palma_desc: "Palmu založili ako rímsku kolóniu #italic Palmaria#! v chránenej zátoke ostrova, ktorý Rimania nazývali Baleárskym. Mesto prešlo do rúk Vandalov a Byzantíncov, až kým ho v roku 902 nedobyl Córdobský kalifát. Vtedy sa premenilo na prosperujúce moslimské mesto #italic Madīnat Mayūrqa#!. V roku 1229 viedol aragonský kráľ Jaume Dobyvateľ veľkú námornú križiacku výpravu, ktorá dobyla ostrov v jedinom ťažení. Jeho syn Jaume II. získal v roku 1276 nové Malorské kráľovstvo, malé, no bohaté územie zahŕňajúce Baleárske ostrovy, Roussillon a Montpellier. Začiatkom 14. storočia pretrvávalo Malorské kráľovstvo pod vládou Jauma III. ako nezávislý vazal aragonskej koruny. Jeho hlavné mesto patrilo k najvýznamnejším obchodným prístavom západného Stredomoria a katedrála La Seu zlatisto žiarila z pieskovca nad prístavom." # todo: NEW TRANSLATION
 girona_desc: "Girona, ležiaca na sútoku štyroch riek vo východných Pyrenejach, bola rímskou #italic Gerundou#! na ceste Via Augusta a opevneným mestom už od staroveku. Od 9. storočia odtiaľ jej karolínski grófi viedli španielsku marku proti moslimskému al-Andalusu. V 13. storočí sa mesto stalo jedným z hlavných sídiel Katalánskeho kniežatstva. Jeho biskupstvo patrilo k najvýznamnejším v Aragonskej korune a v židovskej štvrti #italic Call#! žila prosperujúca obec učencov a lekárov. V roku 1285 Gironu počas aragonskej križiackej výpravy obliehal francúzsky kráľ Filip III., ktorý podporil sicílske vešpery. Úspešná obrana mesta, zavŕšená zničením francúzskej flotily pri Les Formigues, sa stala jedným z najhrdších okamihov katalánskej občianskej pamäti." # todo: NEW TRANSLATION
 pamplona_desc: "Rímsky generál Pompeius založil Pamplonu ako #italic Pompaelo#! počas ťaženia proti Sertoriovi v roku 75 pred n. l. Od chvíle, keď v roku 824 vyhlásili Íñiga Aristu za prvého kráľa, bola hlavným mestom baskicko-románskeho kráľovstva Navarra. Nezvyčajnú mestskú podobu tvorili tri súperiace opevnené štvrte: Navarrería pôvodných baskických obyvateľov, štvrť San Cernin frankských obchodníkov a štvrť San Nicolás, ktorú neskôr osídlili Francúzi. Politika mesta bola povestne roztrieštená a obyvatelia troch štvrtí proti sebe občas bojovali aj v rámci mestských hradieb. Za kapetovského rodu Évreux, ktorý od roku 1328 držal navarrskú korunu, bola Pamplona hlavným mestom jediného pyrenejského kráľovstva, ktoré si zachovalo nezávislosť medzi rastúcimi mocnosťami Kastílie a Aragónska. Biskup a obchodníci spoločne utvárali identitu mesta, ktorá bola zároveň baskická, románska aj franská." # todo: NEW TRANSLATION
 malaga_desc: "Málagu v 8. storočí pred n. l. osídlili Feničania z Týru ako #italic Malaka#!. Jej názov pripomína spracovanie rýb, ktoré dodnes tvorí základ miestneho hospodárstva. Takmer tritisíc rokov patrí k hlavným prístavom južného pobrežia Pyrenejského polostrova. Za Córdobského kalifátu a neskôr za nasridských emirov z Granady sa stala námornou bránou al-Andalusu. Do prístavu prichádzali hodváb, otroci a koreniny z maghrebského obchodu a úrodné vnútrozemie #italic Axarquía#! dodávalo vychýrené sladké vína a mandle, ktoré sa vyvážali cez Stredozemné more. Opevnená alcazaba na prístavnom kopci, ktorú v 11. storočí postavili hammúdovskí emirovia a postupne rozširovali, chránila mesto. Janovská obchodná kolónia, garbiarske štvrte a bohaté záhrady z neho spoločne urobili hospodársku oporu nasridskej ríše." # todo: NEW TRANSLATION
 almeria_desc: "Almeríju založil začiatkom 10. storočia 'Abd ar-Raḥmān III. ako veľkú námornú lodenicu Córdobského kalifátu. Za svojich kráľov tajfy v 11. storočí dosiahla mimoriadny rozkvet ako jedno z najbohatších miest al-Andalusu. Jej tkáči hodvábu a pracovníci s bronzom vyvážali jemné výrobky do Levanty a Maghrebu a v miestnych lodeniciach sa stavali galéry, ktoré nakrátko súperili s Pisou a Janovom o vládu nad západným Stredozemím. Katastrofálne dobytie mesta spojenými flotilami Kastílie, Aragónska, Janova a Pisy počas druhej križiackej výpravy v roku 1147 ukončilo tento zlatý vek. Hoci ho o desať rokov neskôr znovu dobyli Almohádi, mesto sa už nikdy úplne nespamätalo. Začiatkom 14. storočia bola Almería začlenená do nasridského kráľovstva Granada ako jeho druhé mesto. Z jeho dielní stále prúdil hodváb, ktorý pripomínal niekdajšiu prosperitu." # todo: NEW TRANSLATION
 coimbra_desc: "Coimbra, ležiaca na strmom kopci nad riekou Mondego, kde sa rieka stáča na sever k Atlantiku, vznikla ako rímske #italic Aeminium#!. Neskôr prijala meno neďalekého staršieho zničeného mesta #italic Conimbriga#!. V roku 1064 ju Maurom znovudobyl Ferdinand Veľký z Leónu a stala sa hlavným mestom nového kresťanského Portugalského grófstva. Za kráľa Afonsa Henriquesa a jeho nástupcov slúžila od roku 1139 do roku 1255 ako hlavné mesto nového nezávislého Portugalského kráľovstva. Práve tu písali prvé portugalské kroniky a formovali sa rytierske romány kráľovstva. Kráľ Alfons III. síce presunul dvor do Lisabonu, no Coimbra si zachovala významné kultúrne a cirkevné postavenie. #italic Studium Generale#!, ktoré v roku 1290 založil kráľ Dinis a ktoré sa opakovane presúvalo medzi Lisabonom a Coimbrou, urobilo z mesta jedno z najvýznamnejších stredísk vzdelanosti na Pyrenejskom polostrove." # todo: NEW TRANSLATION
 braga_desc: "Založil ju cisár Augustus pod menom #italic Bracara Augusta#! a urobil z nej hlavné mesto rímskej provincie Gallaecia. Braga patrí medzi najstaršie kresťanské mestá na Pyrenejskom polostrove: biskupstvo tu vzniklo už v 3. storočí a jej nárok na postavenie primaciálneho sídla celej Hispánie sa opiera o nepretržitú apoštolskú tradíciu. Postupní vládcovia z radov Vizigótov, Svébov aj Maurov zakaždým potvrdili cirkevnú nadradenosť mesta. Po reconquiste sa arcibiskupstvo v Brage, obnovené v roku 1070, po stáročia sporilo s Toledom o prvenstvo v cirkvi na Pyrenejskom polostrove. Veľká románska katedrála, ktorej výstavba sa začala v roku 1070 a počas stredoveku sa neustále rozširovala, slúžila ako sídlo arcibiskupa, ktorý nielenže spravoval duchovné záležitosti severného Portugalska, ale vždy, keď to politické pomery dovolili, si nárokoval aj metropolitnú právomoc nad galícijskými a astúrskymi cirkvami." # todo: NEW TRANSLATION
 evora_desc: "Évoru založili v dávnej minulosti keltskí Lusitánci na nízkom kopci v rozľahlých zvlnených nížinách južného Alenteja. Za Rimanov sa stala mestom #italic Ebora Liberalitas Iulia#! a v srdci jej starého mesta sa zachoval staroveký Dianin chrám. Mesto v roku 1166 dobyl Maurom legendárny Geraldo Sem Pavor, Gerald Nebojácny, odvážnym nočným útokom. V priebehu 12. a 13. storočia vyrástlo na hlavné mesto kresťanského Alenteja, sídlo biskupstva a základňu vojenských rádov rytierov z Avisu a Rádu Calatrava v Portugalsku. Začiatkom 14. storočia bola Évora jedným z najvýznamnejších miest portugalského kráľovstva. Jej charakteristická románska katedrála z 12. storočia patrila k dominantám mesta, ktoré sa stalo obľúbeným kráľovským sídlom rodu Avis." # todo: NEW TRANSLATION
 merida_desc: "Méridu založil Augustus v roku 25 pred n. l. ako kolóniu pre veteránov kantabrijských vojen a urobil z nej hlavné mesto rímskej provincie #italic Lusitania#!. Vyrástla na jedno z najväčších a najhonosnejších miest západorímskej ríše. Jej divadlo, amfiteáter, cirkus, akvadukty a veľký most cez Guadiana vtlačili krajine pečať, ktorá pretrvala jedenásť storočí úpadku. Za Vizigótov zostala dôležitým biskupským sídlom a po moslimskom dobytí sa stala jedným z hlavných miest západných pohraničných oblastí kalifátu. Méridu v roku 1230 dobyl Alfonz IX. Leónsky a daroval ju Rádu Santiaga, ktorý si tu zriadil svoje sídlo. Hoci sa rímske ruiny týčili nad tým, čo sa zmenilo na skromné pohraničné mestečko, Mérida zostala dôležitou pevnosťou pri kresťanskom postupe do Extremadury a významným sídlom veľkého kastílskeho vojenského rádu." # todo: NEW TRANSLATION
 tarragona_desc: "Tarragonu založili Rimania po druhej púnskej vojne ako veľké provinčné hlavné mesto #italic Tarraco#!. Stala sa jedným z najvýznamnejších miest západorímskej ríše, sídlom prokonzulov spravujúcich Hispania Citerior a jednou z prvých kresťanských obcí na Pyrenejskom polostrove. Moslimskí útočníci ju vyplienili v roku 714 a mesto zostalo takmer štyri storočia opustené, kým ho v roku 1118 formálne neobnovili. Arcibiskupstvo v Tarragone bolo obnovené ako metropolitné sídlo katalánskej cirkvi a najvýznamnejšia prelatúra Aragónskej koruny; energicky si nárokovalo právomoc nad aragónskymi, katalánskymi a valencijskými cirkvami. Na začiatku 14. storočia sa nad starými rímskymi hradbami týčila veľká románsko-gotická katedrála, symbol mesta, ktoré pomaly znovu nadobúdalo svoju niekdajšiu dôstojnosť." # todo: NEW TRANSLATION
 murcia_desc: "Murciu založil v roku 825 umajjovský emir 'Abd ar-Raḥmān II. pod menom #italic Mursiyya#!, v zákrute rieky Segura, kde sa rozľahlá zavlažovaná #italic huerta#! začína otvárať do pobrežnej nížiny. Za vlády taifských kráľov v 11. storočí sa stala hlavným mestom juhovýchodného al-'Andalusu a prekvitajúcim centrom hodvábnictva, keramickej výroby i arabského matematického a astronomického učenia, ktoré šírila škola Ibn al-Bannu. Murcijské kráľovstvo prijalo v roku 1243 kastílsku zvrchovanosť na základe dohody z Alcarazu. Po povstaní, ktoré v roku 1266 potlačil Jaume I. Aragónsky, Alfonz X. Múdry definitívne začlenil mesto do kastílskej koruny. Začiatkom 14. storočia slúžila Murcia, znovu osídlená katalánskymi a aragónskymi kolonistami, ako hlavné pohraničné mesto Kastílie oproti nasridskému kráľovstvu Granada na juhu." # todo: NEW TRANSLATION
 cadiz_desc: "Cádiz osídlili okolo roku 1100 pred n. l. Feničania z Týru a nazvali ho #italic Gadir#!, Pevné miesto. Leží na dlhom piesočnatom výbežku, ktorý sa z južného pobrežia Pyrenejského polostrova vysúva do Atlantiku. Patrí medzi najstaršie nepretržite obývané mestá západnej Európy a jeho prístav za tri tisícročia hostil fénické, kartáginské, rímske, vizigótske i maurské flotily. Rimania ho nazývali #italic Gades#! a urobili z neho jedno z najbohatších miest svojej západnej ríše, domov básnikov, senátorov a vychýrených tanečníc cisárskeho obdobia. Dlhý úpadok neskorej antiky ho však v čase maurskej vlády zmenšil na skromné rybárske mestečko. Alfonz X. Múdry ho dobyl v roku 1262 a znovu osídlil ako kastílsky pohraničný prístav. Začiatkom 14. storočia bol Cádiz dôležitou južnou námornou bránou kastílskeho kráľovstva a jeho prístav obrátený k Atlantiku sa upínal k šíremu oceánu." # todo: NEW TRANSLATION
 jaca_desc: "Jaca leží vo vysoko položenom pyrenejskom údolí na hornom toku rieky Aragón, kadiaľ z priesmyku Somport zostupuje pútnická cesta z Francúzska. Kráľ Ramiro I. z nej začiatkom 11. storočia urobil prvé hlavné mesto rodiaceho sa Aragónskeho kráľovstva. Jatský koncil v roku 1063 potvrdil miestne biskupstvo a slávne #italic fuero#!, ktoré okolo roku 1077 udelil kráľ Sancho Ramírez, prilákalo na cestu do Santiaga franských obchodníkov a remeselníkov. Táto jedna z najstarších a najvplyvnejších mestských listín na Pyrenejskom polostrove slúžila ako vzor mestám po celom Aragónsku a Navarre. Pôsobivá románska katedrála San Pedro, ktorej výstavba sa začala približne v tom istom čase, patrí k najstarším v Španielsku. Hoci sa aragónsky dvor s postupom reconquisty čoskoro presunul na juh, najprv do Huescy a potom do Zaragozy, Jaca zostala začiatkom 14. storočia hrdou severnou bránou medzi Aragónskom a Francúzskom a dôležitou zastávkou na pútnickej ceste." # todo: NEW TRANSLATION
 san_sebastian_desc: "San Sebastián sa rozrástol okolo kláštora zasväteného mučeníkovi svätému Sebastiánovi, chránený zalesnenou výšinou hory Urgull pri úzkom mieste Biskajského zálivu. Okolo roku 1180 mu kráľ Sancho VI. Múdry Navarrský udelil mestské práva, čím vnútrozemskej navarrskej korune zabezpečil vytúžený prístup k moru. Keď Kastília v roku 1200 za vlády Alfonza VIII. anektovala Gipuzkou, mesto pripadlo kastílskej korune, ktorá potvrdila jeho privilégiá a zvýhodňovala jeho gaskónsky hovoriacich mešťanov v rybolove a námornom obchode. Jeho námorníci sa vydávali ďaleko za veľrybami a prístav vyvážal kastílske železo a vlnu do Bordeaux i ďalej, odkiaľ sa lode vracali naložené vínom. Začiatkom 14. storočia bol San Sebastián jedným z najdôležitejších prístavov na baskickom pobreží, opevneným mestom, ktoré žilo a prosperovalo z mora." # todo: NEW TRANSLATION
 perpignan_desc: "Perpignan sa prvýkrát spomína v prameňoch z 10. storočia. Leží na nížine pri rieke Têt medzi Pyrenejami a Stredozemným morom. Mesto sa stalo hlavným sídlom grófov z Roussillonu a napokon v roku 1172 pripadlo spolu s grófstvom Aragónskej korune. Keď kráľ Jaume I. Aragónsky rozdelil svoje ríše medzi dedičov, Perpignan sa v roku 1276 za vlády Jaumeho II. stal pevninským hlavným mestom nového Mallorského kráľovstva. Ten dal na vyvýšenine nad mestom postaviť veľký Palác mallorských kráľov. Mesto bohatlo vďaka tkáčom, vychýreným látkam z Roussillonu a obchodu medzi Katalánskom a Francúzskom a prekvitalo ako centrum súkenníctva a garbiarstva. Začiatkom 14. storočia bol Perpignan pevninským sídlom mallorských kráľov, prosperujúcim trhovým mestom, ktorého tkáčske stavy obliekali veľkú časť západného Stredomoria." # todo: NEW TRANSLATION
 alicante_desc: "Alicante, osídlené už v staroveku pod strmým skalným útesom Benacantil, poznali Gréci ako #italic Ákra Leukḗ#!, Biely mys, a Rimania ako #italic Lucentum#!. Za moslimskej vlády sa z neho stalo mestečko #italic Madīnat Laqant#!, skromný prístav na pobreží Stredozemného mora, ktorý chránila pevnosť na kopci. Budúci Alfonz X. dobyl mesto pre Kastíliu v roku 1248, no v roku 1296 sa ho počas nástupníckej krízy v Kastílii zmocnil Jaume II. Aragónsky. Po rozdelení dobytých území v Torrellase bolo v roku 1308 začlenené do Valencijského kráľovstva. Na prelome 14. storočia slúžilo Alicante ako južný prístav Aragónskej koruny. Jeho hrad korunoval skalný útes Benacantil nad prístavom, z ktorého sa víno, mandle a esparto z vyprahnutého vnútrozemia vyvážali do celého sveta." # todo: NEW TRANSLATION
 cartagena_desc: "Kartágin­sky vojvodca Hasdrubal založil Cartagenu okolo roku 227 pred n. l. pod menom #italic Qart Ḥadašt#! pri jednom z najlepších prirodzených prístavov Stredozemného mora. Rimania ju premenovali na #italic Carthago Nova#!. Mesto zbohatlo na strieborných baniach a hostilo veľkú námornú lodenicu, ktorú počas vojny proti Kartágu v roku 209 pred n. l. preslávil útok Scipiona Africana. Jeho biskupstvo patrilo k najstarším v Hispánii, no dlhé stáročia úpadku a moslimské dobytie zmenili niekdajší veľký prístav na tieň jeho dávnej slávy. Infante Alfonz ho v roku 1245 dobyl pre Kastíliu a obnovil tu biskupské sídlo. Začiatkom 14. storočia bola Cartagena skromným, no strategicky dôležitým prístavom na hraniciach kastílskeho kráľovstva a v jej nádhernom zálive sa stále ukrývali flotily plaviace sa pozdĺž južného pobrežia." # todo: NEW TRANSLATION
 algeciras_desc: "Mesto #italic Al-Jazīra al-Ḵaḍrā'#!, Zelený ostrov, založil v roku 711 berberský veliteľ Ṭāriq ibn Ziyād práve na mieste, kde moslimskí dobyvatelia prvýkrát vstúpili na Pyrenejský polostrov. Svoje meno dostalo podľa ostrovčeka, ktorý chráni jeho prístav na západnom brehu prielivu. Počas šiestich storočí slúžilo ako hlavné miesto vylodenia vojsk a obchodníkov prichádzajúcich z Maghrebu a ako nevyhnutné predmostie spájajúce al-'Andalus so severnou Afrikou. Mesto postupne ovládali Umajjovci, rovnomenná taifa, Almorávidovia a Almohadovia. Začiatkom 14. storočia tvorilo oporu marinidskej moci na Pyrenejskom polostrove a jeho dvojitý opevnený prístav bol hlavnou bránou, ktorou do sporných krajín okolo prielivu prúdili vojaci a zlato z Afriky." # todo: NEW TRANSLATION
 gibraltar_desc: "Nad Gibraltárom sa týči mohutný vápencový útes, ktorý nesie jeho meno: #italic Jabal Ṭāriq#!, Hora Ṭāriqa. Práve tu sa v roku 711 vylodil Ṭāriq ibn Ziyād so svojím vojskom a začal dobývanie Pyrenejského polostrova. Po stáročia bola skala sotva viac než strážnou vežou nad prielivom, no v roku 1160 ju opevnil almohadský kalif 'Abd al-Mu'min. Dal tu postaviť opevnené mesto a citadelu s názvom #italic Madīnat al-Fatḥ#!, Mesto víťazstva, aby ovládali úžinu. Kastília sa ho na krátky čas zmocnila v roku 1309, no zakrátko sa vrátilo pod islamskú vládu. Začiatkom 14. storočia bol Gibraltár prudko napádanou marinidskou pevnosťou a jeho týčiaci sa útes ovládal bránu medzi dvoma moriami a dvoma kontinentmi." # todo: NEW TRANSLATION
 marbella_desc: "Marbella sa rozprestiera na úrodnej pobrežnej nížine pod horami Serranía. Z rímskej osady vyrástla na moslimské mesto #italic Marballa#!, ktorého opevnená alcazaba strážila pobrežie bohaté na vinič, figy a úrodu mierneho podnebia. Skromný, no prosperujúci prístav na južnom pobreží vyvážal ovocie a hodváb z vnútrozemia a živil sa aj rybolovom v teplých vodách Stredozemného mora. Začiatkom 14. storočia bola Marbella súčasťou nasridského kráľovstva Granada a patrila do reťaze opevnených pobrežných miest, ktoré chránili morský okraj poslednej moslimskej ríše na Pyrenejskom polostrove." # todo: NEW TRANSLATION
 fez_desc: "Fez založila idrisovská dynastia okolo roku 800 na oboch brehoch rieky, ktorá dala mestu meno. Vďaka andalúzskym utečencom z Córdoby a arabským rodinám z Kairouanu mesto rýchlo rástlo a jeho dve štvrte mu vtlačili trvalú podobu. Veľká mešita a univerzita #italic Qarawiyyīn#!, ktorú v roku 859 založila Fāṭima al-Fihrī, urobili z Fezu jedno z najvýznamnejších centier vzdelanosti v islamskom svete. Priťahovali sem učencov práva, teológie a prírodných vied z celého Stredomoria. Keď Marinidovci zosadili Almohadov, urobili z Fezu svoje hlavné mesto a v roku 1276 vedľa starého mesta postavili kráľovskú štvrť #italic Fās al-Jadīd#! s palácmi, záhradami a hlavnou mešitou. Na začiatku 14. storočia dosahoval Fez vrchol svojej slávy a bol politickým i intelektuálnym srdcom marinidského sultanátu." # todo: NEW TRANSLATION
 marrakesh_desc: "Marrákeš založil v roku 1070 almorávidsky veliteľ Abū Bakr ibn 'Umar na okraji veľkej nížiny Haouz, pod zasneženými vrcholmi Vysokého Atlasu. Z púštneho tábora sa neuveriteľne rýchlo zmenil na cisárske hlavné mesto ríše siahajúcej od Senegalu až po Ebro. Za Almorávidov a neskôr Almohadov, ktorí ho dobyli v roku 1147, mesto skrášlili paláce, záhrady a vysoký minaret mešity Koutoubia. Voda sem prúdila z hôr dômyselnými podzemnými kanálmi #italic khettara#!. Európski cestovatelia jeho meno preniesli na celé Maroko. Hoci Marinidovci presunuli svoje sídlo na sever do Fezu, Marrákeš zostal začiatkom 14. storočia veľkým južným hlavným mestom a bránou medzi Atlasom, Sousom a karavánovými cestami do púšte." # todo: NEW TRANSLATION
 sijilmasa_desc: "Sijilmāsu založili v roku 757 v datľovej oáze Tafilalt na severnom okraji Sahary. Stala sa hlavnou severnou konečnou stanicou transsaharského karavánového obchodu, miestom, kde sa zlato z Ghany a Mali, prevážané cez púšť berberskými ťavými karavánami, vymieňalo za soľ, látky a výrobky zo stredomorského sveta. Po stáročia tu razili zlaté dináre, ktoré poháňali obchod celého západného islamského sveta, a miestni obchodníci rozprávkovo zbohatli ako sprostredkovatelia medzi dvoma kontinentmi. Sijilmāsa bola nezávislá pod vlastnými dynastiami, kým ju nedobyli Almorávidovia, ktorí pôvodne povstali neďaleko. Začiatkom 14. storočia zostávala nenahraditeľnou púštnou bránou marinidskej ríše, hoci jej dávnu prosperitu začala ohrozovať pomalá zmena karavánových trás." # todo: NEW TRANSLATION
 rabat_desc: "Almohadský kalif 'Abd al-Mu'min dal v polovici 12. storočia vybudovať opevnený #italic ribāṭ#!, ktorý strážil ústie rieky Bou Regreg. Za jeho vnuka Ya'qūba al-Manṣūra dostal tábor veľkolepé ambície. Po víťazstve pri Alarcos v roku 1195 ho pomenoval #italic Ribāṭ al-Fatḥ#!, Tábor víťazstva, a rozhodol sa z neho urobiť hlavné mesto obrovskej ríše. Začal stavať nesmiernu hlavú mešitu, ktorej veľký minaret, Hassanova veža, zostal po jeho smrti nedokončený a navždy sa stal pomníkom zmareného sna. S úpadkom almohadskej moci sa veľkolepé mesto z veľkej časti vyprázdnilo. Začiatkom 14. storočia bol Rabat značne zmenšeným mestečkom pri mohutných nedokončených hradbách, ktoré hľadelo na Atlantik pri ústí rieky oproti svojmu staršiemu susedovi Salé." # todo: NEW TRANSLATION
 sale_desc: "Salé leží na severnom brehu rieky Bou Regreg, kde sa vlieva do Atlantiku, a patrilo medzi najvýznamnejšie prístavy stredovekého Maroka. Jeho obchodníci vymieňali obilie, vlnu, kožu a vosk z vnútrozemia s kresťanskými mestami Pyrenejského polostrova a Talianska i s trhmi Stredomoria. V roku 1260 mesto zničujúco vyplienila kastílska flotila. Marinidskí sultáni ho následne obnovili a opevnili a ozdobili ho krásnou hlavnou mešitou a vychýrenou medresou. Na začiatku 14. storočia bol Salé bohatým a kultivovaným obchodným mestom. Jeho prístav bol plný lodí z dvoch morí a učenci i právnici mu zabezpečovali povesť centra vzdelanosti, ktorá sa vyrovnala veľkým mestám vo vnútrozemí." # todo: NEW TRANSLATION
 ceuta_desc: "Ceuta, po arabsky #italic Sabta#!, ovláda africké pobrežie prielivu, kde sa takmer stretávajú dve moria a dva kontinenty. Už od staroveku patrí medzi najvyhľadávanejšie prístavy západného Stredomoria a jej chránená zátoka je prirodzeným priechodom medzi Maghrebom a al-'Andalusom. Toto významné obchodné centrum preslávili dielne vyrábajúce jemné mosadzné predmety aj pisári tvoriaci nádherné rukopisy. Mesto sprostredkúvalo obchod so zlatom a tovarom medzi Afrikou a Európou a dlhodobo si zachovávalo žiarlivo stráženú samosprávu pod vedením svojich obchodníckych veľmožov, Banū al-'Azafī. Ceuta, o ktorú súperili Marinidovci a nasridskí vládcovia Granady, zostávala začiatkom 14. storočia vzácnou korisťou: jej bohatstvo a poloha z nej spoločne robili kľúč k prielivu." # todo: NEW TRANSLATION
 tangier_desc: "Tangier stráži západný vstup do prielivu, kde sa Stredozemné more otvára do Atlantiku, a patrí medzi najstaršie mestá Maroka. Fénická obchodná stanica a rímske #italic Tingis#! dali meno provincii Mauretania Tingitana. Počas stáročí prechádzal jeho strategický prístav z rúk Vandalov, Byzantíncov, Umajjovcov, Almorávidov a Almohadov; všetci si mesto cenili ako bránu medzi Afrikou a Európou. Začiatkom 14. storočia bol Tangier skromným, no stále významným marinidským prístavom. Jeho poloha na samom cípe kontinentu zaručovala, že ho nemohla prehliadať nijaká mocnosť súperiaca o nadvládu nad prielivom." # todo: NEW TRANSLATION
 taza_desc: "Taza leží naprieč úzkym koridorom medzi pohorím Rif a Stredným Atlasom, priesmykom, ktorý predstavuje jediný ľahko priechodný prechod medzi východným a západným Marokom. Už oddávna je pevnostným mestom mimoriadneho strategického významu. Práve tu upevnil v 30. rokoch 12. storočia svoju moc almohadský vodca 'Abd al-Mu'min a potom vyrazil dobyť Marrákeš. Z tých čias pochádza aj veľká mešita mesta. Marinidovci Tazu dobyli medzi prvými a urobili z nej kľúčovú pevnosť strážiacu cestu do Fezu. Začiatkom 14. storočia opevnené mesto ovládalo dôležitú východnú bránu marinidskej ríše a zostávalo trvalým kľúčom k ovládnutiu celého Maroka." # todo: NEW TRANSLATION
 meknes_desc: "Meknes založili v 10. storočí berberskí Meknassovci, ktorí mu dali meno, a Almorávidovia ho opevnili ako pevnosť na úrodnej nížine severne od Stredného Atlasu. Uprostred ovocných sadov, olivových hájov a obilných polí vyrástlo na prosperujúce trhové mesto. Hoci vždy žilo v tieni neďalekého Fezu, Marinidovci ho obdarili mešitami a krásnou medresou. Poľnohospodárske bohatstvo a hojnosť vody z neho urobili sýpku ríše. Začiatkom 14. storočia bol Meknes prekvitajúcim provinčným mestom plným záhrad a trhov. Jeho strategická poloha a bohaté zázemie mu predurčovali veľkú budúcnosť." # todo: NEW TRANSLATION
 taroudant_desc: "Taroudant leží v úrodnom údolí Sousu medzi Vysokým a Antiatlasom a už oddávna je hlavným mestom bohatých poľnohospodárskych oblastí juhu. Zavlažuje ho rieka a preslávili ho obilie, olivy, cukrová trstina i úroda záhrad. Almorávidovia ho dobyli v roku 1056, počas jednej zo svojich prvých výprav na ceste k moci. Opevnené mesto sa potom stalo hlavným mestom a trhoviskom celého regiónu Sous, kam sa zvážala úroda z údolia aj tovar privezený z púštnych oáz. Začiatkom 14. storočia zostával Taroudant prosperujúcim srdcom juhu, opevneným mestom sadov a trhov na križovatke hôr, nížin a púšte." # todo: NEW TRANSLATION
 aghmat_desc: "Aghmat leží na úpätí Vysokého Atlasu a dávno pred vznikom Marrákeša bol hlavným mestom oblasti Haouz. Na jeho prekvitajúcom trhu sa vymieňal tovar z hôr, nížin i transsaharských karaván. Aghmat slúžil ako prvá základňa Almorávidov ešte pred založením ich nového hlavného mesta neďaleko. Práve tu prežil posledné roky v exile zosadený básnik a kráľ al-Mu'tamid zo Sevilly, ktorý v roku 1095 zomrel. Jeho hrob sa stal miestom trúchlivých pútí. Marrákeš Aghmat zatienil a začiatkom 14. storočia sa z neho stalo skromné mestečko. Jeho niekdajšiu slávu pripomínali najmä verše zajatého kráľa, ktorý zomrel medzi jeho hradbami." # todo: NEW TRANSLATION
 tinmel_desc: "Vysoko v odľahlom údolí Vysokého Atlasu leží horská pevnosť Tinmel, kolíska almohadského hnutia. Práve tu mahdi Ibn Tumart, hlásateľ učenia o božej jednote, zhromaždil začiatkom 12. storočia svojich berberských stúpencov a rozpútal revolúciu, ktorá zvrhla Almorávidov a podmanila si celý Maghreb aj al-'Andalus. Jeho hrob a veľká opevnená mešita, ktorú vedľa neho postavili, urobili z Tinmelu duchovné hlavné mesto a dynastickú svätyňu almohadských kalifov, posvätné miesto strážené medzi horskými štítmi. Začiatkom 14. storočia, keď už Almohadovci dávno padli, bol Tinmel uctievanou, no odľahlou svätyňou. Jeho mešita zostávala pomníkom ríše, ktorá vznikla v týchto horách." # todo: NEW TRANSLATION
 volubilis_desc: "Volubilis sa rozprestieral na úrodnej náhornej plošine v pahorkatine neďaleko neskoršieho mesta Meknes. Rímske #italic Walīlī#! bolo západným hlavným mestom provincie Mauretania Tingitana a bohatým provinčným mestom s víťaznými oblúkmi, bazilikami, lisovňami olív a nádhernými mozaikami, ležiacim na samom okraji rímskeho sveta. Hoci légie v neskorej antike odišli, mesto pretrvalo pod vládou svojich berberských obyvateľov. Práve neďaleko sa v roku 788 uchýlil Idrīs ibn 'Abdallāh a bol vyhlásený za zakladateľa prvej moslimskej dynastie Maroka. Na začiatku 14. storočia je niekdajšie veľké rímske mesto poľom rozvalín vedľa skromnej osady a jeho pováľané stĺpy pripomínajú ríše, ktoré sa na tejto pôde striedali." # todo: NEW TRANSLATION
 anfa_desc: "Anfa leží na nízkej vyvýšenine nad širokým zálivom na pobreží Atlantiku. Bolo to berberské prístavné mestečko, ktorého obyvateľov živil rybolov, úrodná planina Chaouia za mestom a námorný obchod na západnom pobreží. Mesto si dlho žiarlivo strážilo nezávislosť od veľkých vnútrozemských dynastií a medzi susedmi si získalo povesť hniezda odvážnych námorníkov a korzárov, ktorí prepadávali lode pri pobreží. Začiatkom 14. storočia bola Anfa malým, no živým atlantickým prístavom na okraji marinidskej ríše. Jej námorníci brázdili oceánske pobrežie a lovili ryby aj korisť." # todo: NEW TRANSLATION
 azemmour_desc: "Azemmour leží na útese nad ústím veľkej rieky Oum Er-Rbia, ktorá sa tu vlieva do Atlantiku. Je to starobylé prístavné mestečko, ktoré žije z mora i rieky a preslávili ho najmä pleskáče, ktoré každú jar tiahnu jeho vodami v obrovských húfoch. V prístave sa obchodovalo s obilím a vlnou z bohatej nížiny Doukkala za mestom, ako aj s kupcami z Pyrenejského polostrova a Stredomoria. Začiatkom 14. storočia bol Azemmour prosperujúcim opevneným prístavom rybárov a obchodníkov na atlantickom pobreží Maroka. Jeho osud stúpal a klesal spolu s riekou, ktorá mu dávala život." # todo: NEW TRANSLATION
 asfi_desc: "Asfi leží v zálive na atlantickom pobreží, chránené nízkymi útesmi. Tento starobylý rybársky a obchodný prístav zhromažďoval obilie, vlnu a ďalšie plodiny z nížiny 'Abda za mestom a vyvážal ich za západné moria. Do jeho prístavu prichádzali kupci z Janova, Katalánska a Portugalska, ktorí túžili po tovare z južného Maroka, a miestni rybári využívali bohaté vody Atlantiku. Na začiatku 14. storočia bol Asfi jedným z hlavných atlantických prístavov marinidského juhu. Bol to skromný, no rušný prístav, kde sa miešala úroda z vnútrozemia s tovarom z lodí kresťanských obchodných miest." # todo: NEW TRANSLATION
 asilah_desc: "Asilah leží na pobreží Atlantiku, kúsok južne od prielivu, a patrí medzi najstaršie prístavy Maroka. Starovekí ho poznali ako fénickú a kartáginskú obchodnú stanicu #italic Zilis#!, ktorú Rimania zaraďovali medzi prístavy Mauretania Tingitana. Počas stáročí jeho hradby a prístavné nábrežia prešli mnohými rukami, no poloha na oceánskom pobreží pri bráne prielivu z neho vždy robila miesto obchodu i sporov. Začiatkom 14. storočia bol Asilah skromným opevneným marinidským prístavom. Zabezpečoval pobrežný obchod na atlantickom pobreží a jeho hradby chránili mesto pred flotilami, ktoré sa plavili spornými vodami." # todo: NEW TRANSLATION
 larache_desc: "Larache leží pri ústí rieky Loukkos do Atlantiku, neďaleko ruín starovekej fénickej kolónie #italic Lixus#!, jednej z najstarších obchodných staníc na oceánskom pobreží, ktorú legenda umiestňovala do záhrad Hesperidiek. Obyvateľov mesta živil rybolov v rieke i mori, soľ z močiarov a obchod s obilím a tovarom prepravovaným cez prístav. Začiatkom 14. storočia bol Larache malým, no užitočným atlantickým prístavom marinidskej ríše. Chránené ústie rieky poskytovalo útočisko na pobreží, ktoré by inak naplno bičoval oceán." # todo: NEW TRANSLATION
 tetouan_desc: "Tetouan leží v úrodnom údolí pod pohorím Rif, kúsok od Stredozemného mora. Marinidský princ Abū Ṯābit ho okolo roku 1286 obnovil a opevnil ako vojenskú základňu na podporu obliehania neďalekej Ceuty. Poloha za chráneným ústím rieky, s horami za chrbtom a morom pred sebou, z neho urobila prirodzenú pevnosť aj obchodné stredisko spájajúce Rif s pobrežím. Začiatkom 14. storočia bol Tetouan opevneným marinidským mestom, ktorého význam rástol. Strážil prístupy od Stredozemného mora aj horské cesty severného Maroka." # todo: NEW TRANSLATION

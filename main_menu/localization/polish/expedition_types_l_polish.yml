 EXPEDITION_VARIABLE_MONTHLY_CHANGE_TITLE: "Mesačná zmena [MonthlySavedVariable.GetMonthlyChangeValue(Expedition.GetBaseClass)|+=2] z dôvodu:" # todo: NEW TRANSLATION
 EXPEDITION_VARIABLES_TT_TITLE: "Premenné výpravy" # todo: NEW TRANSLATION
 pilgrimage_expedition: "Veľká púť" # todo: NEW TRANSLATION
 pilgrimage_expedition_desc: "Náš vládca sa vydá na svätú púť na posvätné miesta [ShowReligionAdjective('catholic')] viery." # todo: NEW TRANSLATION
 pilgrimage_expedition_historical_info: "Jeruzalem priťahuje kresťanských pútnikov už od 4. storočia, keď cisár Konštantín dal na mieste Kristovho pochovania a zmŕtvychvstania postaviť Chrám Božieho hrobu. Mesto počas križiackych výprav opakovane menilo majiteľov: prvá križiacka výprava ho dobyla v roku 1099, Saladin ho získal v roku 1187 a Fridrich II. ho v roku 1229 nakrátko opäť získal na základe zmluvy, no napokon padlo do rúk Mamlúkov. Napriek strate kresťanskej vlády zostali sväté miesta vďaka diplomatickým dohodám prístupné pútnikom, a Jeruzalem sa tak stal najvýznamnejším cieľom katolíckej zbožnosti v celom stredovekom svete." # todo: NEW TRANSLATION
 pilgrimage_expedition_outcome_overview: "$BULLET$Každé [Concept('holy_site','sväté miesto')|e], ktoré náš [Concept('ruler','panovník')|e] navštívi, mu po príchode prinesie vlastnú odmenu, či už ďalšiu [Concept('legitimacy','legitimitu')|e], [Concept('prestige','prestíž')|e], alebo vďačnosť [ShowEstateTypeName('clergy_estate')].\n$BULLET$Dokončenie púte potom prinesie odmeny, ktorých výška závisí od zbožnosti, s akou sa púť konala:\n$BULLET_WITH_TAB$Až #G +20#! [legitimacy].\n$BULLET_WITH_TAB$[Concept('estate_satisfaction','Spokojnosť stavu')|e] stavu [ShowEstateTypeName('clergy_estate')].\n$BULLET_WITH_TAB$Zlepšenie [Concept('opinion','názor')|e] krajiny [GetCountry('PAP').GetName]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 piety: "Zbožnosť" # todo: NEW TRANSLATION
 piety_desc: "Vyjadruje, s akou zbožnosťou sa púť koná. Počas cestovania postupne klesá a míňa sa pri svetských rozhodnutiach. Ak sa úplne vyčerpá, púť sa skončí potupným neúspechom; ak sa udrží na vysokej úrovni, znásobí jej záverečné odmeny." # todo: NEW TRANSLATION
 retinue: "Sprievod" # todo: NEW TRANSLATION
 retinue_desc: "Ozbrojený sprievod vládcu-pútnika. Sám od seba sa nezmenšuje, ubúda iba v dôsledku nešťastia na ceste. Ak sa úplne stratí, vládca zostane nebezpečne nechránený a púť zlyhá." # todo: NEW TRANSLATION
 pilgrimage_expedition_cooldown: "Veľká púť" # todo: NEW TRANSLATION
 pilgrimage_expedition_ruler_owner_tt: "[pilgrimage_ruler.GetName] sídli v krajine [pilgrimage_ruler.GetCourtCountry.GetName]" # todo: NEW TRANSLATION
 holy_site_pilgrimage_expedition: "Púť na sväté miesto" # todo: NEW TRANSLATION
 holy_site_pilgrimage_expedition_desc: "Náš vládca sa vydá na jedno vybrané sväté miesto, aby sa tam modlil, aby ho pri modlitbe bolo vidieť a aby sa vrátil s prestížou a náboženským vplyvom, ktoré mu cesta prinesie. Výprava sa začína prostredníctvom akcie púte, nie v prehľade výprav." # todo: NEW TRANSLATION
 holy_site_pilgrimage_expedition_outcome_overview: "$BULLET$Po príchode na vybrané [Concept('holy_site','sväté miesto')|e] získame odmenu podľa našej [Concept('religion','náboženstva')|e]:\n$BULLET_WITH_TAB$#G +10#! [Concept('religious_influence','náboženského vplyvu')|e], [Concept('purity','čistoty')|e] alebo [Concept('karma','karma')|e], pričom výška závisí od vzdialenosti od hlavného mesta a môže dosiahnuť až #G +100#!.\n$BULLET_WITH_TAB$Náboženstvá [ShowReligionGroupAdjective('folk_peruvian_group')] namiesto toho posunú [Concept('yanantin','yanantin')|e] o #Y 20#! smerom k povahe [Concept('god','bohu')|e] daného [holy_site].\n$BULLET_WITH_TAB$Oprávnené [ShowReligionGroupAdjective('muslim')] školy sa posunú o ďalších #Y 10#! smerom k [ShowSocietyDirectionName('mysticism')] alebo [ShowSocietyDirectionName('jurisprudence')]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 holy_site_pilgrimage_expedition_order_zeal_tt: "Oddanosť pútnikov na tomto území bude celé roky podnecovať zápal rádu, ktorý ho spravuje" # todo: NEW TRANSLATION
 holy_site_pilgrimage_cooldown: "Púť na sväté miesto" # todo: NEW TRANSLATION
 treasure_fleet_expedition: "Pokladová flotila" # todo: NEW TRANSLATION
 treasure_fleet_expedition_desc: "Vyslať cisársku pokladovú flotilu na štátnu plavbu do vybraného regiónu. Flotila bude plávať po pobrežných námorných trasách k cieľu a späť a cestou navštívi zahraničné prístavy. Plavba rozšíri diplomatický dosah dvora, rozdá vládcom južných morí dary a [ShowGoodsName('silk')], vyberie tribút a vráti sa so vzácnym tovarom, vyslancami a menami kráľov, ktorí spoznali zvuk čínskych plachiet." # todo: NEW TRANSLATION
 treasure_fleet_expedition_outcome_overview: "$BULLET$Flotila vypláva s nákladom darov zaplatených z našej pokladnice.\n$BULLET$Po bezpečnom návrate sa všetko, čo sa neminulo, premení na [Concept('gold','dukáty')|e] a získame aj #G +10#! [Concept('prestige','prestíž')|e].\n$BULLET$Každý zahraničný dvor zareaguje inak:\n$BULLET_WITH_TAB$Dvor, ktorý nás dobre prijme, prinesie ďalších #G +5#! [prestige], môže sa pridať k [GetUniqueInternationalOrganization('middle_kingdom').GetName] ako náš tributárny štát a pošle tribút a vzácne dary, ktoré obohatia náš [Concept('market','trh')|e].\n$BULLET_WITH_TAB$Dvor, ktorý odmietne tributárne postavenie, spôsobí pokles vzájomnej [Concept('opinion','názoru')|e] o #R -50#! a získa [ShowModifier('chi_resisting_subjugation')]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 treasure_fleet_cooldown: "Pokladová flotila" # todo: NEW TRANSLATION
 western_ocean_voyage_expedition: "Plavba do západného oceánu" # todo: NEW TRANSLATION
 western_ocean_voyage_expedition_desc: "Vyslať flotilu na západ cez otvorený Atlantik, aby našla námornú cestu do Indie. Za [ShowAreaName('canary_islands_area')] nás nečakajú žiadne mapy, ktoré by nás pripravili na to, čo leží ďalej. Iba vietor, voda a nádej, že oceán je užší, než sa učenci domnievajú." # todo: NEW TRANSLATION
 western_ocean_voyage_expedition_historical_info: "O možnosti dostať sa do Ázie plavbou na západ diskutovali európski učenci celé desaťročia pred prvým pokusom. Hlavnou prekážkou nebol tvar Zeme, keďže vzdelaní ľudia vedeli, že je guľatá, ale jej veľkosť. Väčšina učencov správne odhadovala, že oceán je príliš široký na to, aby sa dal prekonať. Výpravy, ktoré dokázali opak, tento odhad nevyvrátili — cestou narazili na niečo nečakané." # todo: NEW TRANSLATION
 western_ocean_voyage_expedition_outcome_overview: "$BULLET$Počas plavby výprava zmapuje otvorený oceán a odhalí pobrežia, ku ktorým dopláva.\n$BULLET$Doplávanie k pevnine prinesie #G +10#! [Concept('prestige','prestíž')|e] alebo #G +10#! [Concept('legitimacy','legitimita')|e].\n$BULLET$Návrat domov prinesie #G +10#! [Concept('legitimacy','legitimita')|e].\n$BULLET$Prvá krajina, ktorá oceán prepláva a vráti sa domov, získa aj:\n$BULLET_WITH_TAB$#G +20#! [Concept('prestige','prestíž')|e].\n$BULLET_WITH_TAB$[Concept('modifier','Modifikátor')|e] [ShowModifier('western_ocean_pioneer')].\n$BULLET$Každý ďalší návrat prinesie namiesto toho #G +10#! [Concept('prestige','prestíž')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 western_ocean_voyage_cooldown: "Plavba do západného oceánu" # todo: NEW TRANSLATION
 western_ocean_voyage_expedition_columbus_tt: "Krištof Kolumbus je v našich službách" # todo: NEW TRANSLATION
 hajj_caravan_expedition: "Kráľovský ḥadždž" # todo: NEW TRANSLATION
 hajj_caravan_expedition_desc: "Vyslať nášho vládcu na púť do [ShowLocationName('mecca')], čím naplní jednu z piatich podmienok islamu. Cesta je dlhá a nákladná, no vládca, ktorý sa vráti zo svätého mesta, bude mať autoritu, ktorú mu nedokáže zabezpečiť žiadna armáda." # todo: NEW TRANSLATION
 hajj_caravan_expedition_historical_info: "Abbásovský kalif Hārūn ar-Rašīd absolvoval počas svojej vlády (786 – 809) púť z Bagdadu deväťkrát. Časť cesty dokonca prešiel pešo ako prejav zbožnosti a jeho oddanosť sa na stáročia stala vzorom, ktorý sa zbožní vládcovia usilovali napodobniť." # todo: NEW TRANSLATION
 hajj_caravan_expedition_religious_influence_bullet: "$BULLET_WITH_TAB$#G +20#! [Concept('religious_influence','náboženský vplyv')|e].\n" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 hajj_caravan_expedition_outcome_overview: "$BULLET$Dosiahnutie [ShowLocationNameWithNoTooltip('mecca')] odmení karavánu podľa jej nádhery, a to až:\n$BULLET_WITH_TAB$#G +20#! [Concept('prestige','prestíž')|e].\n[SelectLocalization(RELIGION.HasReligiousInfluence, 'hajj_caravan_expedition_religious_influence_bullet', '')]$BULLET$Návrat domov potom prinesie:\n$BULLET_WITH_TAB$#G +10#! [Concept('legitimacy','legitimita')|e].\n$BULLET_WITH_TAB$Päťročný [Concept('modifier','modifikátor')|e] [ShowModifier('hajj_pious_return')].\n$BULLET_WITH_TAB$Trvalú poctu [ShowModifier('hajji_pilgrim')], ak [Concept('ruler','panovník')|e] absolvuje svoj prvý ḥadždž.\n$BULLET$Karavána musí dosiahnuť [ShowLocationNameWithNoTooltip('mecca')] ešte v tom istom roku, v ktorom vyrazila, inak sa púť úplne zmarí." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 guards: "Ozbrojený sprievod" # todo: NEW TRANSLATION
 guards_desc: "Ozbrojený sprievod karavány. Získava sa najímaním strážcov alebo nesením #italic maḥmalu#! na ceste a ubúda pri nájazdoch a útrapách. Dobre strážená karavána má väčšiu šancu prežiť útok." # todo: NEW TRANSLATION
 splendor: "Nádhera" # todo: NEW TRANSLATION
 splendor_desc: "Vyjadruje, ako okázalo je karavána zásobená a vyzdobená. Zvyšuje sa rozhadzovaním a vystavovaním bohatstva, klesá počas búrok a útrap na ceste. Určuje odmenu karavány po dosiahnutí [ShowLocationNameWithNoTooltip('mecca')]." # todo: NEW TRANSLATION
 hajj_caravan_cooldown: "Kráľovský ḥadždž" # todo: NEW TRANSLATION
 circumnavigation_expedition: "Plavba okolo sveta" # todo: NEW TRANSLATION
 circumnavigation_expedition_desc: "Vyslať flotilu na západ, aby oboplávala celý svet: na juh popri [ShowRegionName('la_plata_region')], cez prieliv na samom konci sveta a cez bezmenný oceán až k Ostrovom korenia, odkiaľ sa vráti domov okolo [ShowLocationName('good_hope_cape')]. Nijaká flotila to ešte nedokázala. Nie je isté, či sa to vôbec dá." # todo: NEW TRANSLATION
 circumnavigation_expedition_historical_info: "V septembri 1519 vyplával Ferdinand Magellan zo Sanlúcar de Barrameda na základe zmluvy so španielskou korunou, aby našiel západnú cestu na Ostrovy korenia. Výpravu tvorilo päť lodí: #italic Trinidad#!, #italic San Antonio#!, #italic Concepción#!, #italic Victoria#! a #italic Santiago#!. Magellan bol portugalský moreplavec, ktorý predtým slúžil portugalskej korune a plavil sa do Indie a na Moluky. K španielskej korune prešiel po tom, čo kráľ Manuel I. odmietol zvýšiť jeho plat. Táto plavba sa stala prvým oboplávaním Zeme, hoci Magellan sa jej dokončenia nedožil." # todo: NEW TRANSLATION
 circumnavigation_expedition_outcome_overview: "$BULLET$Prvá krajina na svete, ktorá obopláva zemeguľu, získa:\n$BULLET_WITH_TAB$#G +100#! [Concept('prestige','prestíž')|e].\n$BULLET_WITH_TAB$#G +10#! [Concept('legitimacy','legitimita')|e].\n$BULLET_WITH_TAB$[Concept('modifier','Modifikátor')|e] [ShowModifier('first_circumnavigation')].\n$BULLET$Každé dokončenie výpravy prinesie aj:\n$BULLET_WITH_TAB$#G +10#! [prestige].\n$BULLET_WITH_TAB$Ďalších #G +10#!, ak sa domov vrátia aspoň tri lode.\n$BULLET_WITH_TAB$#G +5#! za dobrú náladu posádky.\n$BULLET_WITH_TAB$[ShowGoodsName('cloves')] nazbierané v oblasti [ShowAreaName('moluccas_area')], ktoré sa predajú za trhovú cenu výmenou za [Concept('gold','dukáty')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 circumnavigation_expedition_low_morale_prestige_tt: "Nízka morálka posádky znižuje získanú prestíž" # todo: NEW TRANSLATION
 circumnavigation_expedition_high_morale_prestige_tt: "Vysoká morálka posádky zvyšuje získanú prestíž" # todo: NEW TRANSLATION
 morale: "Morálka posádky" # todo: NEW TRANSLATION
 morale_desc: "Nálada posádky. Nízka morálka môže viesť k vzbure." # todo: NEW TRANSLATION
 provisions: "Zásoby" # todo: NEW TRANSLATION
 provisions_desc: "Jedlo a voda na cestu. Počas plavby sa neustále míňajú a ich vyčerpanie ohrozuje výpravu." # todo: NEW TRANSLATION
 num_ships: "Lode" # todo: NEW TRANSLATION
 num_ships_desc: "Plavidlá, ktoré sú stále súčasťou flotily. Ak nezostane žiadne, výprava je stratená." # todo: NEW TRANSLATION
 cargo: "Náklad" # todo: NEW TRANSLATION
 cargo_desc: "Cennosti naložené počas plavby, ktoré sa po návrate flotily predajú na trhu." # todo: NEW TRANSLATION
 cape_route_to_india_expedition: "Cesta do Indie okolo Mysu" # todo: NEW TRANSLATION
 cape_route_to_india_expedition_desc: "Vyslať flotilu na juh pozdĺž afrického pobrežia a okolo veľkého južného mysu, aby otvorila námornú cestu na Ostrovy korenia, ktorá obíde všetky osmanské mýta aj benátskych sprostredkovateľov. Cesta je krutá: dva roky na otvorenom oceáne, neznáme pobrežia a búrky, ktoré rozptyľujú lode. No prvý národ, ktorý ju otvorí, bude ovládať svetový obchod s korením." # todo: NEW TRANSLATION
 cape_route_to_india_expedition_historical_info: "Portugalská výprava s cieľom nájsť námornú cestu do $india$ bola vyvrcholením takmer storočného postupného prieskumu smerom na juh pozdĺž afrického pobrežia. Bartolomeu Dias oboplával Mys dobrej nádeje v roku 1488 a dokázal, že táto cesta je možná. Plavba Vasca da Gamu v rokoch 1497 – 1499 úlohu dokončila a vrátila sa s takým množstvom korenia, že jeho predaj pokryl šesťdesiatnásobok nákladov na výpravu. Táto plavba zásadne zmenila svetový obchod s korením a prelomila benátsky a osmanský monopol na pozemné trasy." # todo: NEW TRANSLATION
 cape_route_to_india_expedition_outcome_overview: "$BULLET$Na každej zastávke pozdĺž afrického pobrežia možno založiť [ShowBuildingTypeName('por_feitoria')], alebo v prístave bez vlastníka [ShowBuildingTypeName('por_trading_post')] a priamo si prisvojiť danú [Concept('location','lokalitu')|e]. Každá z možností zanechá trvalý obchodný [Concept('modifier','modifikátor')|e].\n$BULLET$Dosiahnutie [ShowLocationName('kozhikode')] prinesie [ShowModifier('calicut_trade_rights')] a zásobu [ShowGoodsName('pepper')], ktorú možno predať za trhovú cenu výmenou za [Concept('gold','dukáty')|e].\n$BULLET$Dokončenie trasy prinesie:\n$BULLET_WITH_TAB$#G +20#! [Concept('prestige','prestíž')|e].\n$BULLET_WITH_TAB$#G +10#! [Concept('legitimacy','legitimita')|e].\n$BULLET_WITH_TAB$Trvalý [modifier] [ShowModifier('cape_route_pioneer')], prípadne [ShowModifier('portuguese_african_network')] alebo [ShowModifier('east_africa_trade_dominance')], ak sa založia tri alebo päť feitorií." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 cape_route_to_india_expedition_low_morale_prestige_tt: "Nízka morálka posádky znižuje získanú prestíž" # todo: NEW TRANSLATION
 cape_route_to_india_expedition_high_morale_prestige_tt: "Vysoká morálka posádky zvyšuje získanú prestíž" # todo: NEW TRANSLATION
 grand_tour_expedition: "Veľká cesta" # todo: NEW TRANSLATION
 grand_tour_expedition_desc: "Náš dedič sa vydá na dlhú vzdelávaciu cestu cez veľké mestá regiónu [ShowRegionName('italy_region')] — [ShowLocationName('florence')], [ShowLocationName('rome')], [ShowLocationName('venice')] a [ShowLocationName('naples')] — aby študoval na ich dvoroch, akadémiách a medzi starožitnosťami. Dedič, ktorý sa vráti, už nebude tým istým človekom, ktorý odcestoval. Všetko, čo sa naučí, aj od koho, utvorí jeho povahu, ktorú si prinesie na trón." # todo: NEW TRANSLATION
 grand_tour_expedition_historical_info: "Veľká cesta, teda zvyk posielať mladých európskych šľachticov na dlhú vzdelávaciu cestu po Taliansku, sa v priebehu 17. storočia stala medzi šľachtou severnej Európy pevnou tradíciou. Florencia, Rím, Benátky a Neapol tvorili klasický okruh. Každé mesto ponúkalo niečo, čo severné dvory nemali: humanistickú vzdelanosť, klasické starožitnosti, nádheru umenia a architektúry či obradnosť najstarších kráľovských dvorov v Európe. Očakávalo sa, že účastníci sa vrátia zmenení a pripravení na štátnické a diplomatické povinnosti spôsobom, aký domáci učitelia nedokázali dosiahnuť." # todo: NEW TRANSLATION
 grand_tour_expedition_outcome_overview: "$BULLET$Každé navštívené mesto prináša podľa zvoleného prístupu vedomosti, kontakty alebo skúsenosti a [Concept('research_progress','pokrok výskumu')|e] za čas strávený štúdiom alebo [Concept('legitimacy','legitimita')|e] za čas strávený na dvore.\n$BULLET$Návšteva aspoň troch veľkých miest regiónu [ShowRegionNameWithNoTooltip('italy_region')] potom prinesie:\n$BULLET_WITH_TAB$Buď vlastnosť [ShowTraitName('free_thinker')], [ShowTraitName('well_connected')] alebo [ShowTraitName('worldly')], podľa toho, ktorá hodnota bola najvyššia.\n$BULLET_WITH_TAB$Trvalý [Concept('modifier','modifikátor')|e] [ShowModifier('returned_from_grand_tour')].\n$BULLET_WITH_TAB$#G +10#! [Concept('prestige','prestíž')|e].\n$BULLET$Kratšia cesta prinesie iba #G +5#! [prestige] a žiadnu [Concept('trait','vlastnosť')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 grand_tour_expedition_heir_completed_tt: "Dedič ešte neabsolvoval Veľkú cestu" # todo: NEW TRANSLATION
 grand_tour_expedition_stalled_status: "Na pobyte" # todo: NEW TRANSLATION
 gt_diligence: "Usilovnosť" # todo: NEW TRANSLATION
 gt_diligence_desc: "Schopnosť dediča učiť sa počas cesty, určená jeho hodnotami [Concept('ability','schopnosťou')|e] pri odchode. Usilovnejší dedič si z cesty odnesie viac." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 knowledge: "Vedomosti" # todo: NEW TRANSLATION
 knowledge_desc: "Poznatky získané teoretickým štúdiom počas cesty — v knižniciach, na prednáškach a v spoločnosti učencov. Dedič, ktorý sa vráti s väčším množstvom vedomostí než čohokoľvek iného, získa vlastnosť [ShowTraitName('free_thinker')]." # todo: NEW TRANSLATION
 connections: "Kontakty" # todo: NEW TRANSLATION
 connections_desc: "Vzťahy nadviazané na dvoroch navštívených počas cesty. Dedič, ktorý sa vráti s väčším množstvom kontaktov než čohokoľvek iného, získa vlastnosť [ShowTraitName('well_connected')]." # todo: NEW TRANSLATION
 experience: "Skúsenosti" # todo: NEW TRANSLATION
 experience_desc: "Praktické skúsenosti získané počas cesty — v dielňach, prístavoch a obchodných domoch. Dedič, ktorý sa vráti s väčším množstvom skúseností než čohokoľvek iného, získa vlastnosť [ShowTraitName('worldly')]." # todo: NEW TRANSLATION
 grand_tour_cooldown: "Veľká cesta" # todo: NEW TRANSLATION
 grand_embassy_expedition: "Veľké vyslanectvo" # todo: NEW TRANSLATION
 grand_embassy_expedition_desc: "Vyslať vládcu pod falošným menom na dvory západnej Európy, aby preskúmal inštitúcie, armádu a námorníctvo štátov, ktoré už prešli modernizáciou. Delegáciu vydávajúcu sa za kráľovskú čakajú bankety a prázdne zdvorilosti; tá, ktorá na seba neupozorňuje, sa dostane do skutočných lodeníc a projekčných kancelárií. Správy sa však šíria a vládca, ktorého odhalia priskoro, nájde dvere už zatvorené." # todo: NEW TRANSLATION
 grand_embassy_expedition_outcome_overview: "$BULLET$To, ako nenápadne delegácia cestuje, určuje, ako dlho pred každým hostiteľom zatají svoj skutočný účel a ako dvor zareaguje, keď ho odhalí.\n$BULLET$Každý navštívený dvor poskytne niekoľko príležitostí na učenie a náhodné stretnutia na ceste môžu zlepšiť schopnosti vládcu, prehĺbiť modernizáciu alebo znížiť nenápadnosť.\n$BULLET$Po skončení vyslanectva nahromadená modernizácia urýchli postup [Concept('institutions','inštitúcie')|e] vo všetkých našich územiach, pričom v hlavnom meste bude účinok väčší než inde, a zvýši [Concept('army_tradition','armádna tradícia')|e]. Ak sme navštívili prístav, zvýši aj [Concept('navy_tradition','námorná tradícia')|e].\n$BULLET$Dvor, ktorý delegáciu odmietne, zníži [Concept('prestige','prestíž')|e]; dvor, ktorý jej umožní prístup alebo ktorého oň požiadame, prinesie [Concept('prestige','prestíž')|e] a ďalšie príležitosti." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 grand_embassy_expedition_institution_spread_tt: "Pokročí vybraná inštitúcia o [GetVariable('grand_embassy_institution_progress_amount')|V0] vo všetkých vlastnených územiach, kde sa ešte nerozšírila, a o [GetVariable('grand_embassy_institution_progress_capital_amount')|V0] v hlavnom meste" # todo: NEW TRANSLATION
 grand_embassy_expedition_stalled_status: "Učenie" # todo: NEW TRANSLATION
 discretion: "Nenápadnosť" # todo: NEW TRANSLATION
 discretion_desc: "Vyjadruje, ako dobre sa darí utajiť skutočný účel delegácie a totožnosť vládcu. Pri hodnote nad 90 považuje dvor delegáciu za obyčajných vyslancov a nikto nič netuší. Pri hodnote 90 alebo menej hostiteľ zistí, kto sa medzi nimi v skutočnosti pohybuje, či už na základe obyčajného podozrenia, alebo vďaka vlastnej špionážnej sieti." # todo: NEW TRANSLATION
 modernization: "Modernizácia" # todo: NEW TRANSLATION
 modernization_desc: "Dosiahnutý pokrok delegácie v osvojovaní si západných metód. Každá získaná lekcia ho zvyšuje a čím viac si toho vládca prinesie domov, tým väčšia bude odmena po skončení vyslanectva." # todo: NEW TRANSLATION
 opportunities: "Príležitosti" # todo: NEW TRANSLATION
 opportunities_desc: "Vyjadruje, koľko možností učiť sa poskytol delegácii konkrétny dvor. Hodnota sa nastavuje nanovo na každej zastávke podľa toho, ako otvorene sa tam vládca rozhodol vystupovať." # todo: NEW TRANSLATION
 pacific_crossing_expedition: "Hľadanie tornaviaje" # todo: NEW TRANSLATION
 pacific_crossing_expedition_desc: "Vyslať flotilu z nášho pacifického pobrežia v Amerike, aby našla #italic tornaviaje#! — spoľahlivú spiatočnú trasu cez najväčší oceán na Zemi. Pasáty bez problémov odnesú loď na západ do Ázie; plavba späť proti nim však zlyhala pri každom pokuse. Kým sa nezmapuje spiatočná cesta, naše kolónie a bohatstvo Ostrovov korenia zostanú nedostupné. Prvý národ, ktorý nájde cestu späť, spojí Ameriku s Áziou a otvorí naprieč Tichým oceánom obchod s galeónami." # todo: NEW TRANSLATION
 pacific_crossing_expedition_historical_info: "Spiatočná plavba na východ — #italic tornaviaje#! — bola veľkou nevyriešenou záhadou raného Tichomoria. Álvaro de Saavedra sa v rokoch 1528 a 1529 na plavbe z Nového Španielska dvakrát nechal zahnať pasátmi späť a pri pokuse zahynul. Výprava Ruya Lópeza de Villalobosa v roku 1542 sa takisto dostala do Ázie, no nenašla cestu domov. Spoľahlivú spiatočnú trasu objavili až v roku 1565; dovtedy sa flotila dokázala dostať do Ázie, ale svoj náklad odtiaľ nikdy nedokázala priviezť späť." # todo: NEW TRANSLATION
 pacific_crossing_expedition_outcome_overview: "$BULLET$Zmapovanie spiatočnej trasy cez [ShowContinentName('pacific_ocean_continent')] prinesie:\n$BULLET_WITH_TAB$#G +100#! [Concept('prestige','prestíž')|e].\n$BULLET_WITH_TAB$#G +15#! [Concept('legitimacy','legitimita')|e].\n$BULLET_WITH_TAB$Trvalý obchodný [Concept('modifier','modifikátor')|e].\n$BULLET_WITH_TAB$[ShowGoodsName('cloves')] nazbierané v oblasti [ShowAreaName('moluccas_area')], ktoré sa predajú za trhovú cenu výmenou za [Concept('gold','dukáty')|e].\n$BULLET_WITH_TAB$Trvalý prístup k [Concept('decision','rozhodnutiu')|e] [ShowDecisionName('charter_manila_galleon')], ktorú možno každých päť rokov prijať znova a získať za ňu značné množstvo [gold].\n$BULLET$Flotila, ktorá nikdy nenájde cestu domov, nezíska vôbec nič." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 pacific_crossing_expedition_low_morale_prestige_tt: "Nízka morálka posádky znižuje získanú prestíž" # todo: NEW TRANSLATION
 pacific_crossing_expedition_high_morale_prestige_tt: "Vysoká morálka posádky zvyšuje získanú prestíž" # todo: NEW TRANSLATION
 cartographic_survey_expedition: "Prieskum pobrežia" # todo: NEW TRANSLATION
 cartographic_survey_expedition_desc: "Vyslať prieskumnú loď pozdĺž nášho vlastného pobrežia, aby zmapovala prístavy, zmerala plytčiny a zaznamenala nebezpečné miesta. Táto práca nie je nijako slávna, no zhotovené mapy vydržia celú generáciu a vďaka nim budú všetky budúce výpravy lacnejšie a rýchlejšie pripravené." # todo: NEW TRANSLATION
 cartographic_survey_expedition_historical_info: "Systematické mapovanie pobrežia sa naplno začalo v 16. storočí, keď rastúci objem námorného obchodu urobil z presných máp štátny záujem. Sevillská #italic Casa de Contratación#! aj portugalský #italic Armazém da Guiné e Índia#! zamestnávali oficiálnych kartografov, ktorých úlohou bolo vytvárať a aktualizovať námorné mapy. V 17. storočí sa k nim pridali aj holandské admirality." # todo: NEW TRANSLATION
 cartographic_survey_expedition_outcome_overview: "$BULLET$Po prieskume každého [Concept('port','prístavu')|e] tu môže na 10 až 20 rokov zostať trvalý [Concept('location_modifier','modifikátor lokality')|e], ktorý zvýši produkciu niektorej z viacerých surovín, napríklad [ShowGoodsName('fish')], [ShowGoodsName('pearls')] alebo [ShowGoodsName('amber')], prípadne zlepší samotný prístav; navyše prinesie [Concept('prestige','prestíž')|e].\n$BULLET$Prieskum troch alebo viacerých prístavov navyše prinesie:\n$BULLET_WITH_TAB$Pätnásťročný [Concept('modifier','modifikátor')|e] [ShowModifier('accurate_charts')].\n$BULLET_WITH_TAB$#G +10#! [prestige].\n$BULLET$Prieskum menšieho počtu prístavov prinesie iba #G +5#! [prestige]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 cartographic_survey_cooldown: "Prieskum pobrežia" # todo: NEW TRANSLATION
 mining_survey_expedition: "Prieskum ložísk v horách" # todo: NEW TRANSLATION
 mining_survey_expedition_desc: "Pošlite tím prospektorov a skúšačov rúd do našej hornatej krajiny, aby prešli korytá potokov, rozbíjali skalné výchozy a skúmali horniny, či neobsahujú vzácne kovy. Kopce už v minulosti vydali svoje bohatstvo a ťažko nadobudnuté znalosti starého baníka majú väčšiu cenu než rok dvorských špekulácií." # todo: NEW TRANSLATION
 mining_survey_expedition_historical_info: "Systematický prieskum ložísk sa praktizoval v celej stredovekej a ranonovovekej Európe, najznámejšie v Krušných horách v Sasku a Čechách, kde objav strieborných žíl v 12. storočí vyvolal rozmach banských miest Freibergu, Jáchymova a Schneebergu. Dielo Georgiusa Agricolu #italic De re metallica#! (1556) sa stalo štandardnou učebnicou tohto remesla. Podrobne opisovalo používanie prútikov na vyhľadávanie ložísk, skúšanie vzoriek rudy v malých téglikoch aj právne zvyklosti upravujúce zabraté ťažobné nároky." # todo: NEW TRANSLATION
 mining_survey_expedition_outcome_overview: "$BULLET$Každý prieskum zanechá na 20 rokov [Concept('modifier','modifikátora')|e] [ShowModifier('thorough_survey')], ktorý zvýši produkciu surovín v celej krajine.\n$BULLET$Každý objav zanechá aj bohaté ložisko, napríklad [ShowModifier('rich_silver_vein')] alebo [ShowModifier('rich_gold_strike')], ktoré možno ťažiť otvorene pre [Concept('prestige','prestíž')|e] alebo potajomky pre [Concept('gold','dukáty')|e].\n$BULLET$Získate tiež:\n$BULLET_WITH_TAB$#G +10#! [prestige] za dva alebo viac objavov.\n$BULLET_WITH_TAB$#G +5#! za každý preskúmaný horský kraj." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 mining_survey_cooldown: "Prieskum ložísk v horách" # todo: NEW TRANSLATION
 relic_expedition: "Pátranie po relikvii" # todo: NEW TRANSLATION
 relic_expedition_desc: "Pošlite výpravu do [ShowLocationName('jerusalem')] a odtiaľ ďalej naprieč Svätou zemou a širším [ShowRegionName('crescent_region')], aby pátrala po povestiach o relikvii, ktorú môže získať každý dostatočne trpezlivý a šťastný, aby ju našiel." # todo: NEW TRANSLATION
 relic_expedition_historical_info: "Obchod s relikviami bol v stredoveku a ranom novoveku významným odvetvím. Katolícke a pravoslávne spoločenstvá súperili o najvzácnejšie predmety a predaje, výmeny i obyčajné krádeže po stáročia presúvali relikvie po celom kresťanskom svete. Relikvie križiackych štátov boli tomuto obchodu vystavené obzvlášť často: Pravý kríž, ktorý padol do rúk nepriateľa pri Hattíne v roku 1187, sa nikdy nenašiel a Sväté kopije objavené v Antiochii v roku 1098 mizne z historických záznamov krátko po prvej križiackej výprave. Obe straty podnecovali stáročia dohadov o tom, kde by sa takéto predmety mohli ešte nachádzať." # todo: NEW TRANSLATION
 relic_expedition_outcome_overview: "$BULLET$Nájdená relikvia závisí od náhody a priebehu pátrania: môže ísť o dávno stratený Pravý kríž či Sväté kopije, alebo o skromnejšiu relikviu, napríklad klinec, kosť či úlomok.\n$BULLET$Čokoľvek nájdete, stane sa hmotným [Concept('work_of_art','umeleckým dielom')|e], ktoré prinesiete späť do nášho hlavného mesta." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 clues: "Stopy" # todo: NEW TRANSLATION
 clues_desc: "Ako blízko je výprava k tomu, aby s istotou zachytila stopu relikvie. Začína sa jedinou povesťou a rastie alebo slabne s každou vypátranou stopou. Ak sa celkom vyčerpá, pátranie sa môže ukončiť." # todo: NEW TRANSLATION
 hunt_retinue: "Sprievod" # todo: NEW TRANSLATION
 hunt_retinue_desc: "Stráže výpravy, tlmočník a učený sprievodca. Sám osebe sa nevyčerpáva, no ak sa celkom minie, výprava sa rozíde a pátranie zlyhá." # todo: NEW TRANSLATION

l_polish:
 d009_flavor_religious_orders.1.title: "Zmena vedenia" # todo: NEW TRANSLATION
 d009_flavor_religious_orders.1.entry: "$d009_flavor_religious_orders.1.title$" # todo: NEW TRANSLATION
 d009_flavor_religious_orders.1.desc: "[old_head_of_order.GetName], ktorý verne slúžil nášmu [ROOT.GetCountry.GetGovernment.GetCourtTitle] ako veľmajster [target_order.GetName], náhle ochorel a odstúpil zo [old_head_of_order.GetHisHer] funkcie.\n\nHoci po takejto funkcii túži mnoho známych rytierov a šľachticov, je zrejmé, že [target_ruler.GetShortName] už má na túto úlohu niekoho vyhliadnutého. [target_character.GetShortName], obľúbenec [target_ruler.GetHimHerFormal], by bol tým najposlušnejším veľmajstrom [target_order.GetNameWithNoTooltip], ak by sme bratom odopreli možnosť zvoliť si vlastného." # todo: NEW TRANSLATION
 d009_flavor_religious_orders.1.a: "[target_character.GetShortName] bude novým veľmajstrom." # todo: NEW TRANSLATION
 d009_flavor_religious_orders.1.a.entry: "Náš obľúbenec bude novým veľmajstrom." # todo: NEW TRANSLATION
 d009_flavor_religious_orders.1.b: "Bratia z [target_order.GetNameWithNoTooltip] si zvolia vlastného veľmajstra." # todo: NEW TRANSLATION
 d009_flavor_religious_orders.1.b.entry: "Bratia si zvolia vlastného veľmajstra." # todo: NEW TRANSLATION
 d009_flavor_religious_orders.2.title: "Rastúci vplyv [target_character.GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 d009_flavor_religious_orders.2.entry: "Rastúci vplyv veľmajstra" # todo: NEW TRANSLATION
 d009_flavor_religious_orders.2.desc: "Za posledné roky sa bohatstvo a moc [target_character.GetName] výrazne zvýšili. Hoci takýto nárast osobného majetku nie je u veľmajstra [target_order.GetName] ničím neobvyklým, zdá sa, že [target_character.GetSheHe] si zároveň obľúbil aj politiku hlavného mesta. Kedysi bol obľúbencom [target_ruler.GetNameWithNoTooltip], no dnes [target_character.GetNameWithNoTooltip] bežne kritizuje našu vládu a vedenie, čo vedie mnohých príslušníkov [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] k požiadavkám na [target_character.GetHerHis] odvolanie z funkcie veľmajstra." # todo: NEW TRANSLATION
 d009_flavor_religious_orders.2.a: "[target_character.GetSheHe|U] koná v najlepšom záujme [ROOT.GetCountry.GetAltAdjectiveWithNoTooltip('L')]." # todo: NEW TRANSLATION # todo: COUNTRY CASE
 d009_flavor_religious_orders.2.a.entry: "Koná v najlepšom záujme našej krajiny." # todo: NEW TRANSLATION
 d009_flavor_religious_orders.2.b: "[target_character.GetSheHe|U] prekračuje [target_character.GetHisHer] právomoci." # todo: NEW TRANSLATION
 d009_flavor_religious_orders.2.b.entry: "Prekračuje svoje právomoci." # todo: NEW TRANSLATION
 d009_flavor_religious_orders.3.title: "Zneuctený obľúbenec" # todo: NEW TRANSLATION
 d009_flavor_religious_orders.3.entry: "$d009_flavor_religious_orders.3.title$" # todo: NEW TRANSLATION
 d009_flavor_religious_orders.3.desc: "Politické manévrovanie [target_character.GetName] naďalej vyvoláva nevraživosť medzi [target_character.GetHerHim] a [ROOT.GetCountry.GetGovernment.GetCourtTitle]. Najmä [target_character.GetHerHis] verejná kritika [target_ruler.GetName] a [target_ruler.GetHerHis] aféra oddelili niekdajšieho obľúbenca [ROOT.GetCountry.GetGovernment.GetRulerTitle] od [target_character.GetHerHis] podporovateľov. Keďže si [target_character.GetHerHis] prudkým vzostupom postavenia znepriatelil príslušníkov [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')], [ROOT.GetCountry.GetAltAdjective('A')] sa už nemôže spoliehať na takúto osobu ako na veľmajstra [target_order.GetName]." # todo: NEW TRANSLATION # todo: COUNTRY CASE
 d009_flavor_religious_orders.3.a: "[target_character.GetSheHe|U] bude popraven za vlastizradu!" # todo: NEW TRANSLATION
 d009_flavor_religious_orders.3.a.entry: "Bude popraven za vlastizradu!" # todo: NEW TRANSLATION
 d009_flavor_religious_orders.3.b: "Vyžeňte [target_character.GetHerHim] a vymenujte novú hlavu [target_order.GetNameWithNoTooltip]." # todo: NEW TRANSLATION
 d009_flavor_religious_orders.3.b.entry: "Vyžeňte ho a vymenujte novú hlavu rádu." # todo: NEW TRANSLATION

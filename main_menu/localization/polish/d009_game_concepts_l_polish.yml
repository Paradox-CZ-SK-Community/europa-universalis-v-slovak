 game_concept_granadan_sovereignty: "Granadská suverenita" # todo: NEW TRANSLATION
 game_concept_granadan_sovereignty_desc: "Miera toho, do akej miery [GetCountry('GRA').GetName] vládne samo sebe počas situácie [ShowSituationName('battle_for_the_strait')], pod tlakom [GetCountry('CAS').GetName] a [GetCountry('MOR').GetName]." # todo: NEW TRANSLATION
 game_concept_gc_colonial_dominance: "Koloniálna dominancia" # todo: NEW TRANSLATION
 game_concept_gc_colonial_dominance_desc: "Miera moci, ktorú má hlavná [Concept('country','krajiny')|e] situácie [ShowSituationName('golden_century')] v Novom svete. Zvyšuje sa v pevných prírastkoch vďaka kolonizácii, flotilám s pokladmi a šíreniu viery v zámorí. S jej rastom sa odomykajú jedinečné tematické a prestížne bonusy, ktoré platia, kým je situácia aktívna." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_gc_european_dominance: "Európska dominancia" # todo: NEW TRANSLATION
 game_concept_gc_european_dominance_desc: "Miera moci, ktorú má hlavná [Concept('country','krajiny')|e] situácie [ShowSituationName('golden_century')] nad Európou. Zvyšuje sa v pevných prírastkoch vďaka víťazstvám v kontinentálnych vojnách, dôležitým územným državám a dynastickému i náboženskému prvenstvu. S jej rastom sa odomykajú jedinečné tematické a prestížne bonusy, ktoré platia, kým je situácia aktívna." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_flashpoint: "Zlomový bod" # todo: NEW TRANSLATION
 game_concept_flashpoint_desc: "Rozhodujúci okamih, ktorý nastane, keď situácia [ShowSituationName('golden_century')] dosiahne kritické štádium. Zlomový bod spustí udalosť, ktorá otrasie celou krajinou, v dobrom či zlom: môže priniesť silný bonus, občiansku vojnu alebo iný otras, ktorý zmení podobu ríše." # todo: NEW TRANSLATION

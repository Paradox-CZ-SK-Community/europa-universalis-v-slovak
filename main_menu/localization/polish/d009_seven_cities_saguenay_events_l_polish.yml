 seven_cities_saguenay.1.title: "Donnacona si vymýšľal" # todo: NEW TRANSLATION
 seven_cities_saguenay.1.desc: "Po troch mesiacoch plavby proti prúdu Saguenay dorazila výprava do krajiny, ktorú Donnacona opísal Cartierovi pred šesťdesiatimi rokmi: podľa náčelníka zo Stadacony to bola krajina svetlopletých mužov v kožušinových plášťoch, hôr plných zlata a riek, v ktorých sa valí striebro. Skutočná krajina je skalnatá, zalesnená a chladná. Nijakí svetlopletí muži tu nie sú. V potokoch niet zlata. Innuovia, na ktorých výprava natrafí, sú ochotní obchodovať s kožušinami, no o kráľovstvách ďalej na severe nič nevedia. [target_leader.GetName] musí uznať, že Donnacona vyrozprával Cartierovi príbeh, aký chcel Cartier počuť, v nádeji, že ho vezme do Francúzska a umožní mu vrátiť sa domov živému." # todo: NEW TRANSLATION
 seven_cities_saguenay.1.a: "Výpravu rozpustiť. Kráľovstvo bolo výmysel. Kožušiny zostávajú." # todo: NEW TRANSLATION
 seven_cities_saguenay.1.historical_info: "Donnacona, náčelník Stadacony pri hornom toku Svätého Vavrinca, počas zimy, ktorú Cartier strávil v Stadacone v rokoch 1535 – 1536, neustále rozprával o bohatom kráľovstve menom Saguenay vo vnútrozemí Novej Francúzska. Cartier vzal Donnaconu do Francúzska ako hosťa koruny; Donnacona tam zomrel bez toho, aby ešte niekedy uvidel svoj domov. Legenda o Saguenay pretrvala vo francúzskych výpravách do vnútrozemia až do konca sedemnásteho storočia. Dovtedy už bola skutočná geografia krajiny, jazier, riek a obchodu s kožušinami, ktorý sa odtiaľ rozvíjal, dostatočne zmapovaná na to, aby sa legenda mohla odložiť." # todo: NEW TRANSLATION
 seven_cities_saguenay.2.title: "Domorodá konfederácia a trochu kožušín" # todo: NEW TRANSLATION
 seven_cities_saguenay.2.desc: "Krajina, do ktorej sme dorazili, nie je bájny Saguenay, no aj tak stojí za to ju spoznať. Innuovia majú voľnú konfederáciu dedín pozdĺž horného toku rieky a pri jazerách za ňou. Ich lovecké územia siahajú až do boreálneho lesa, kam dovidí naša výprava. Obchodujú s kožušinami, sušenými rybami, kanoe z brezovej kôry a malým množstvom domácej medi zo zdrojov ďalej na severe. Sú ochotní prijať francúzske vyslanectvo. Niet tu zlata, striebra ani svetlopletého kráľa. Je tu fungujúci obchod s kožušinami. [target_leader.GetName] nariaďuje postaviť obchodnú stanicu na sútoku." # todo: NEW TRANSLATION
 seven_cities_saguenay.2.a: "Postavme stanicu. Obchod s kožušinami zaplatí výpravu." # todo: NEW TRANSLATION
 seven_cities_saguenay.2.historical_info: "Povodia Svätého Vavrinca a Saguenay boli vstupnými bránami pre francúzsky obchod s kožušinami, ktorý v priebehu sedemnásteho a začiatku osemnásteho storočia priviedol obchodníkov, misionárov a kolonistov hlboko do vnútrozemia Severnej Ameriky. Obchod sa opieral o domorodých sprostredkovateľov, predovšetkým Hurónov-Wendatov a Algonkinov, a o sieť obchodných staníc, ktorá sa postupne rozšírila na západ, cez Veľké jazerá až do povodia Mississippi. Legenda o Saguenay sa v istom zmysle naplnila sama: krajinou z legiend nebolo kráľovstvo zlata, ale kožušín, a Francúzi napokon na tomto obchode zbohatli." # todo: NEW TRANSLATION
 seven_cities_saguenay.3.title: "Severné kráľovstvo je nájdené" # todo: NEW TRANSLATION
 seven_cities_saguenay.3.desc: "Krajina z legiend skutočne existuje a výprava do nej dorazila. Za druhým veľkým jazerom, v krajine, ktorú Innuovia nazývajú len studenou zemou, leží osada asi troch tisícok svetlopletých ľudí v dlhých kožušinových plášťoch. Hovoria jazykom, ktorý nikto z výpravy dosiaľ nepočul, no latinista v sprievode v ňom rozpoznáva slová staroseverského pôvodu. Majú rokovaciu sieň so strechou z medi a malú obradnú komnatu, kde vystavujú zlaté výrobky očividne severoeurópskeho remeselného pôvodu. O našom príchode na pobrežie vedia už dve generácie a čakali, kým ich nájdeme. Kronikár píše celú noc. [target_leader.GetName] za úsvitu žiada o posily." # todo: NEW TRANSLATION
 seven_cities_saguenay.3.a: "Podpíšme zmluvu. Stratené kresťanské kráľovstvo je konečne nájdené." # todo: NEW TRANSLATION
 seven_cities_saguenay.3.historical_info: "Legenda o prežívajúcej severskej populácii vo vnútrozemí Kanady sa nikdy nepotvrdila, napriek občasným tvrdeniam o opaku. Severské osady v Grónsku boli opustené v pätnástom storočí; neexistujú archeologické dôkazy o tom, že by sa severská prítomnosť na pevnine Severnej Ameriky udržala dlhšie než krátke kontakty zhruba o storočie či dve skôr. Pretrvávanie tejto legendy vo francúzskych výpravách do krajiny najlepšie vysvetľuje jej prenos z príbehov o Norumbegu a Vinlande. Tie vychádzali z jedného súboru stredovekých islandských ság, ktorých skutočná geografia sa zabudla ešte predtým, ako sa legenda dostala na francúzsky dvor." # todo: NEW TRANSLATION
 seven_cities_saguenay.10.title: "Kráľ za perejami" # todo: NEW TRANSLATION
 seven_cities_saguenay.10.desc: "Mladík prezimoval na našom dvore po tom, čo ho spiatočná výprava priviezla cez oceán, a náš jazyk už ovláda dosť na to, aby s ním vedel narobiť problémy. Keď sa ho pýtajú na krajinu za veľkými perejami, [target_character.GetName] opisuje kráľovstvo Saguenay: zlato a červené kamene v skalách, mužov s pokožkou bledou ako naša, oblečených do vlnenej látky, a keď sa zdá, že si to jeho poslucháči želajú, aj jednonožcov a mužov, ktorí lietajú. Písari si všímajú, že kráľovstvo získava novú provinciu za každú pochybnosť, ktorá o ňom zaznie. Leží, ako starostlivo dodáva, veľmi ďaleko proti prúdu a nik ho nenájde bez neho." # todo: NEW TRANSLATION
 seven_cities_saguenay.10.a: "Dovoľme mu vrátiť sa domov a získať si priazeň vodcu." # todo: NEW TRANSLATION
 seven_cities_saguenay.10.b: "Nechajme ho na dvore. Príbeh má väčšiu cenu než rozprávač." # todo: NEW TRANSLATION
 saguenay_chiefs_son_sails_tt: "[target_character.GetName] sa vracia cez oceán ako náš sprievodca a tlmočník" # todo: NEW TRANSLATION
 seven_cities_saguenay.10.historical_info: "Jacques Cartier vzal synov náčelníka zo Stadacony Donnaconu do Francúzska v roku 1534 a nasledujúci rok ich priviedol domov. V roku 1536 vzal do Francúzska aj samotného Donnaconu, ktorý zvyšok života rozprával francúzskemu dvoru o kráľovstve Saguenay, jeho zlate, bielych mužoch vo vlnenom odeve a — ako sa jeho poslucháči stávali vznešenejšími — aj o jednonožcoch a mužoch, ktorí lietali ako netopiere. Vzorec bol stále rovnaký: kráľovstvo získalo všetko, čo si jeho poslucháči najviac želali, a vždy ležalo o jednu rieku ďalej, než ktokoľvek doplával. Donnacona zomrel vo Francúzsku okolo roku 1539 bez toho, aby ešte niekedy uvidel Stadaconu. Príbehy ho prežili o poldruha storočia." # todo: NEW TRANSLATION
 seven_cities_saguenay.11.title: "Biela choroba" # todo: NEW TRANSLATION
 seven_cities_saguenay.11.desc: "Začína sa to na ďasnách. Chirurg tomu hovorí choroba krajiny a nepozná na ňu liek. Mužom černejú a opúchajú nohy, staré jazvy sa otvárajú, akoby boli čerstvé, zuby sa kývu v ďasnách a ako prví ochorejú tí najsilnejší, čo si nik nevie vysvetliť. Osem mužov je mŕtvych a štvrtina posádky nedokáže držať stráž. Chladná krajina leží niekde na záveternej strane a na zadnej palube sa pýtajú, či môže byť čokoľvek, čo nás čaká na brehu, krutejšie než to, čo už máme na palube." # todo: NEW TRANSLATION
 seven_cities_saguenay.11.a: "Zamierme k pobrežiu a požiadajme jeho obyvateľov o pomoc." # todo: NEW TRANSLATION
 seven_cities_saguenay.11.b: "Púšťajme chorým žilou a držme kurz." # todo: NEW TRANSLATION
 saguenay_annedda_cure: "#Y Príbuzní nášho sprievodcu nám ukážu strom, ktorého odvar z kôry a ihličia postaví umierajúcich na nohy za pár dní#!" # todo: NEW TRANSLATION
 saguenay_strangers_mercy: "#Y Pomoc cudzincov prichádza pomaly, ale predsa prichádza#!" # todo: NEW TRANSLATION
 seven_cities_saguenay.11.historical_info: "Skorbut pripravil Cartierovu výpravu v zime 1535 – 1536 v Stadacone o štvrtinu mužov, kým im Domagaya, jeden zo synov náčelníka, ktorý bol vo Francúzsku, neukázal, ako pripraviť nápoj z varenej kôry a ihličia stromu, ktorý Irokézovia nazývali annedda. Muži, ktorí nedokázali stáť, už o týždeň chodili a Cartier napísal, že všetci lekári z Lovane a Montpellieru by so všetkými svojimi liekmi nedokázali za osem dní to, čo dokázal ten strom. Totožnosť anneddy sa neskôr stratila, Európa na liek na dvesto rokov zabudla a skorbut naďalej zabíjal viac námorníkov než všetky námorné bitky v ére plachetníc dokopy." # todo: NEW TRANSLATION
 seven_cities_saguenay.12.title: "Diamanty na myse" # todo: NEW TRANSLATION
 seven_cities_saguenay.12.desc: "Pod sivým mysom pri zákrute rieky sa ligotá samotné pobrežie. Skalnú stenu pretínajú žilky bielych kameňov, ktoré sa blyštia ako brúsené drahokamy, a pomedzi ne sa tiahne žltý kov, ktorý sa dá vyleštiť mokrým palcom. Do poludnia je polovica posádky na brehu s barelmi a už vyberajú slová, ktorými opíšu ich obsah v správe domov. Hlavný delostrelec, syn baníka, dlho obracia v prstoch jednu žltú hrudku a žiada o slovo skôr, než čokoľvek zapíšu." # todo: NEW TRANSLATION
 seven_cities_saguenay.12.a: "Naplňme každý barel. Konečne dôkaz pre pochybovačov doma." # todo: NEW TRANSLATION
 seven_cities_saguenay.12.b: "Nech baníkov syn najprv skúma skalu, než sa ktokoľvek začne chváliť." # todo: NEW TRANSLATION
 saguenay_barrels_ring_true: "#Y Napriek všetkým očakávaniam skúška potvrdila, že na myse je pravý kov#!" # todo: NEW TRANSLATION
 saguenay_glitter_and_air: "#Y Kremeň a pyrit, celý nákladný priestor toho plný, a príbeh dorazí domov skôr než my#!" # todo: NEW TRANSLATION
 seven_cities_saguenay.12.historical_info: "Cartierova posledná výprava v roku 1542 naložila v Cap Rouge jedenásť barelov zlatej rudy a veľkú zásobu diamantov a triumfálne ich odviezla domov, pričom Robervala a kolonistov nechala napospas osudu. Vo Francúzsku sa pri skúške ukázalo, že zlato je pyrit a diamanty kremeň, a toto sklamanie sa zapísalo do jazyka: výraz #italic faux comme un diamant du Canada#!, falošný ako kanadský diamant, sa v priebehu jednej generácie stal príslovím. Mys však napriek tomu naďalej nesie meno Cap Diamant a mesto Québec dnes stojí priamo nad týmto žartom." # todo: NEW TRANSLATION
 seven_cities_saguenay.13.title: "Stretnutie v Tadoussacu" # todo: NEW TRANSLATION
 seven_cities_saguenay.13.desc: "Ráno po zakotvení začínajú priplávať kanoe z horného toku aj z opačného brehu, nízko ponorené pod balíkmi zimných kožušín. Tlmočník vysvetľuje, že ide o stretnutie: národy chladnej krajiny sa každoročne schádzajú pri ústí rieky, aby obchodovali ešte pred príchodom ľadov, a naše plachty považujú za najväčšiu obchodnú kanoe, aká kedy bola postavená. Pisar obracia bobriu kožušinu, potom ďalšiu, napokon odkladá pero a púšťa sa do iných počtov. Zlaté kráľovstvo je možno len klebeta, hovorí. Bobry nie." # todo: NEW TRANSLATION
 seven_cities_saguenay.13.a: "Otvorme podpalubie a obchodujme. Legendy zostanú, kožušiny sa predajú." # todo: NEW TRANSLATION
 seven_cities_saguenay.13.b: "Nepreplávali sme oceán, aby sme naháňali bobry. Proti prúdu!" # todo: NEW TRANSLATION
 seven_cities_saguenay.13.historical_info: "Tadoussac pri ústí Saguenay bol obchodným miestom stretnutí dávno predtým, než tam vznikla európska stanica: skupiny Innuov a Algonkinov sa každú sezónu stretávali pri ústí rieky, aby si vymieňali kožušiny a meď, a prvé francúzske lode jednoducho zakotvili na už existujúcom trhu. Pierre de Chauvin tam v roku 1600 vybudoval prvú stálu francúzsku obchodnú stanicu, roky pred založením Québecu. Kráľovstvo Saguenay sa proti prúdu nikdy nenašlo, no kožušiny, ktoré po rieke priplávali, financovali Nové Francúzsko dve storočia — čo sa podarilo máloktorému skutočnému kráľovstvu." # todo: NEW TRANSLATION

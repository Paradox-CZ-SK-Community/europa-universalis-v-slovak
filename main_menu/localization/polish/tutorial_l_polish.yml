 lesson_basics_welcome: "@caesar! Vitajte v #italic Europa Universalis V#!" # todo: NEW TRANSLATION
 lesson_welcome_desc: "Pred vami sa chystá odohrať takmer päť storočí histórie. Ako Duch národa máte moc rozhodnúť, ako sa bude história vyvíjať.\n\nMôžete ovládnuť svet, vybudovať rozkvitajúcu utópiu alebo sa stať neporaziteľnou ekonomickou veľmocou. Osud dejín je vo vašich rukách."
 lesson_basics_camera: "@caesar! Kamera a ovládanie" # todo: NEW TRANSLATION
 lesson_basics_camera_desc: "Prejdime si niekoľko rýchlych základov predtým, než začneme. Najdôležitejšia vec v hre je mapa a vedieť sa na nej orientovať je zásadné.\n\nPoužite klávesy @key_w!, @key_a!, @key_s! a @key_d! na pohyb kamery po mape.\n\nPoužite @centerscroll! #high koliesko myši#! na priblíženie a oddialenie.\n\nPodržaním @key_tab! si môžete zobraziť prehľad celého sveta." # todo: NEW TRANSLATION
 lesson_basics_nested_tooltips: "@caesar! Nápovedy" # todo: NEW TRANSLATION
 lesson_basics_nested_tooltips_complete: "@caesar! Nápovedy" # todo: NEW TRANSLATION
 lesson_basics_nested_tooltips_desc: "Herné koncepty sú zvýraznené modrou farbou a obsahujú informácie o konkrétnych mechanikách, na ktoré môžete v hre natrafiť. Môžeme napríklad povedať, že hráte ako [country_icon|e] [Concept('country','krajiny')|e].\n\nŠtandardne sú vnorené nápovedy dostupné po krátkom počkaní, kým sa uzamknú, potom môžete pokračovať v nabehávaní myšou na okno nápovedy. Môžete tiež uzamknúť nápovedy pomocou @centerclick!#high stredného tlačidla myši#!.\n\nToto správanie je možné zmeniť v #high Nastavenia (@key_escape!) > Rozhranie > Nastavenia nápovedy#!." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 lesson_basics_tooltips_in_tooltips_hover_word: "Prejdite myšou na modrý text" # todo: NEW TRANSLATION
 lesson_basics_nested_tooltips_continue: "Prejdite na vnorenú nápovedu" # todo: NEW TRANSLATION
 lesson_basics_your_nation: "[country_icon] Vaša krajina" # todo: NEW TRANSLATION
 lesson_basics_your_nation_desc: "V #high Europa Universalis V#! hráte ako #high duch národa#!, abstraktné stelesnenie vášej [country_icon|e] [Concept('country','krajiny')|e].\n\nMomentálne hráte za [country_icon] [GetPlayer.GetLongName], [country] s [GetPlayer.GetGovernment.GetRuler.GetShortName] ako jeho [ruler_icon|e] [Concept('ruler','vládcom')|E]." # todo: NEW TRANSLATION
 lesson_basics_top_bar: "@caesar! Horný panel" # todo: NEW TRANSLATION
 lesson_basics_top_bar_desc: "Horný panel (#high Top Bar#!) pozostáva z niekoľkých rôznych prvkov. Odteraz zostane v hornej časti obrazovky a poskytne vám prehľad o vašej [country_icon|e] [Concept('country','krajinu')|e].\n\nMožno si tiež všimnete dátum v pravom hornom rohu. To preto, že hra prebieha v #high reálnom čase#!. Nebojte sa však, hra práve je pozastavená a nič sa nedeje." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 lesson_basics_estates: "@caesar! Horný panel" # todo: NEW TRANSLATION
 lesson_basics_estates_desc: "Ľavá časť Horného panela zobrazuje vaše [estates_icon|e] [Concept('estates','stavov')|e], skupiny, ktoré držia moc v rámci vašej [country_icon|e] [Concept('country','krajiny')|e]. Ako hráča vás reprezentuje [GetEstateName('crown_estate')].\n\nK stavom sa ešte vrátime, ale teraz majte na pamäti, že každý stav vlastní percento bohatstva a moci krajiny a má úroveň     [estate_satisfaction_icon|e] [Concept('estate_satisfaction','spokojnosti stavu')|e], ktorú môžete sledovať na Hornom paneli.\n\nRozdelenie moci medzi stavmi sa bude líšiť od krajiny ku krajine, pričom niektoré krajiny budú mať prístup k jedinečným stavom." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 lesson_basics_resources: "@caesar! Horný panel" # todo: NEW TRANSLATION
 lesson_basics_resources_desc: "Ďalej sa pozrime na zdroje a štatistiky v hornom paneli. Toto je stredná časť panela, ktorá obsahuje najdôležitejšie zdroje, ktoré budete musieť sledovať pri vládnutí vašej [country_icon|e] [Concept('country','krajine')|e].\n\nBudete musieť míňať [gold_icon|e] [Concept('gold','dukátov')|e] na mnohé akcie v tejto hre, od platenia vašich vojakov až po budovanie miest. Avšak skutočne najdôležitejším zdrojom je vaša [population_icon|e] [Concept('population','populácie')|e], pretože tvoria základ vašej politiky, ekonomiky a armád.\n\nĎalším obzvlášť dôležitým číslom je vaša [Concept('stability_with_icon','stabilita')|e], ukazovateľ vašej vnútornej odolnosti, ktorý vám pomôže udržať vašich [estates|l] a [population|l] lojálnych a ktorý môžete využiť na ovplyvňovanie politiky vašej [country|l].\n\nO zvyšných číslach si povieme, keď budú relevantné. Teraz pokračujme." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 lesson_basics_time_and_research: "@caesar! Čas" # todo: NEW TRANSLATION
 lesson_basics_time_and_research_desc: "#high Europa Universalis V#! sa odohráva počas stoviek rokov. Aktuálny dátum vidíte v pravom hornom rohu obrazovky, kde tiež ovládate rýchlosť hry.\n\nČas je rozdelený do šiestich rôznych [Concept('ages','vekov')|E]. Práve prebieha [ShowAgeName('age_1_traditions')|l], ktorý skončí v roku #high 1342#! a nastúpi [ShowAgeName('age_2_renaissance')|l]. V každom veku budete mať prístup k novým [advances_icon|e] [Concept('advances','pokrokom')|e] na výskum.\n\nAko už bolo spomenuté, hra je momentálne pozastavená, takže o nič neprichádzate." # todo: NEW TRANSLATION
 lesson_basics_wrap_up_0: "@caesar! Hlavné panely" # todo: NEW TRANSLATION
 lesson_basics_wrap_up_0_desc: "Venujme chvíľu prehľadu základných prvkov rozhrania, počnúc záložkami v ľavom hornom rohu. Odtiaľ máte prístup k 9 rôznym panelom, v ktorých strávite veľa času.\n\nSú to @government_panel![Link('government', '', 'Vláda')], @economy_panel![Link('economy', '', 'Ekonomika')], @production_panel![Link('production', '', 'Produkcia')], @society_panel![Link('country_culture', '', 'Spoločnosť')], @diplomacy_panel![Link('diplomacy', '', 'Diplomacia')], @military_panel![Link('unit_overview', '', 'Vojenské')], @geopolitics_panel![Link('expansion', '', 'Geopolitika')], @advances_panel![Link('advances', '', 'Pokroky')] a @content_panel![Link('country_dhe', '', 'Obsah')]." # todo: CHANGED (predtym: Venujme chvíľu prehľadu základných prvkov rozhrania, počnúc záložkami v ľavom hornom rohu. Odtiaľ máte prístup k 8 rôzny)
 lesson_basics_wrap_up_2: "@hint! Nápovedy" # todo: NEW TRANSLATION
 lesson_basics_wrap_up_2b: "Nápovedy 2b" # todo: NEW TRANSLATION
 lesson_basics_wrap_up_2_desc: "Okrem Herných konceptov, ktoré nájdete po celej hre, niektoré kľúčové herné mechaniky majú súvisiace Nápovedy, ktoré ponúkajú podrobnejšie vysvetlenie spolu s niekoľkými odporúčaniami.\n\nNápovedy si môžete kedykoľvek zobraziť v @hint![Link('hints', '', 'Panel nápovedy')].\n\n@hint! Kedykoľvek uvidíte túto ikonu v nápovede, kliknutím na ňu budete presmerovaní na súvisiacu Nápovedu." # todo: NEW TRANSLATION
 lesson_basics_open_hints: "Otvoriť panel nápovedy" # todo: NEW TRANSLATION
 lesson_basics_close_hints: "Zatvoriť panel nápovedy" # todo: NEW TRANSLATION
 lesson_core_loop_0: "@caesar! Úvod do hry" # todo: NEW TRANSLATION
 lesson_core_loop_0_desc: "#high Europa Universalis V#! je rozsiahla hra, ktorá umožňuje nespočetné množstvo rôznych štýlov hrania a možností.\n\nNezáleží na tom, či sa považujete za nemilosrdného dobyvateľa, prefíkaného politika alebo administrátora obdareného dotykom Midasa, existujú niektoré základy, ktoré musí každý úspešný vládca ovládať. Pozrime sa na ne!" # todo: NEW TRANSLATION
 lesson_core_loop_1: "[gold_icon] Rozpočet" # todo: NEW TRANSLATION
 lesson_core_loop_1_desc: "Ako sme spomenuli, [gold_icon|e] [Concept('gold','dukátov')|e] sú jedným z najdôležitejších zdrojov v hre. Väčšina akcií stojí [gold|l] a veľmi často bude vaša schopnosť presadzovať svoju vôľu ako vládcu, či už mimo alebo vnútri vašej [country_icon|e] [Concept('country','krajiny')|e], bude závisieť od bohatstva, ktoré dokážete sústrediť do svojich rúk. Cesta k svetovej dominancii je vydláždená zlatom a krvou.\n\nVäčšina vašich financií sa ovláda z [Link('economy', '', '@economy_panel! Panel bilancie')], takže si ho pozrime z zblízka." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 lesson_core_loop_open_balance: "Otvoriť panel bilancie" # todo: NEW TRANSLATION
 lesson_core_loop_2: "[gold_icon] Rozpočet" # todo: NEW TRANSLATION
 lesson_core_loop_2_desc: "Tu nájdete prehľad vášej [budget_icon|e] [Concept('budget','bilancie')|e]. Rozdiel medzi vašími      [income_icon|e] [Concept('income','príjmu')|e] a [expenses_icon|e] [Concept('expenses','výdavkov')|e] sa na konci každého mesiaca pridá do vášej [treasury_icon|e] [Concept('treasury','pokladnice')|e]. V tomto paneli môžete meniť rôzne posuvníky, aby ste upravili svoj mesačný [balance].\n\nAko ste práve videli, rozdiel medzi mesačnými príjmami a výdavkami je zobrazený aj na #high Hornom paneli#!." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 lesson_core_loop_3: "[taxes_icon] Dane" # todo: NEW TRANSLATION
 lesson_core_loop_3_desc: "Väčšina bohatstva v #high Europa Universalis V#! sa generuje mesačne na území, ktoré vlastníte: vo vašich [locations_icon|e] [Concept('locations','lokalít')|e].\n\nO lokalitách si povieme neskôr. Teraz môžete podržať kurzor nad číslom [tax_base_icon|e] [Concept('tax_base','daňavý základ')|e] v ľavom hornom rohu, aby ste si zobrazili prehľad vašich najbohatších lokalít. Tam [country_icon] [Player.GetLongName] generuje [gold_icon|e] [Concept('gold','dukátov')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 lesson_core_loop_4: "[taxes_icon] Dane" # todo: NEW TRANSLATION
 lesson_core_loop_4_desc: "Avšak tieto [gold_icon|e] [Concept('gold','dukátov')|e] nejdú priamo do vášej [treasury_icon|e] [Concept('treasury','pokladnice')|e]. Ako vláda vyberáte len časť z [tax_base_icon|e] [Concept('tax_base','daňovej základne')|e] tým, že uvalíte [taxes_icon|e] [Concept('taxes','daní')|e] na vaše [estates_icon|e] [Concept('estates','stavov')|e].\n\nÚroveň zdaňovania môžete nastaviť úpravou daňových posuvníkov v paneli rozpočtu. Všimnite si, ako ich \n[estate_satisfaction_icon|e] [Concept('estate_satisfaction','Spokojnosť stavu')|e] klesá čím viac ich zdaňujete. Stavy dane nemajú rady.\n\n[Concept('maximum_tax_with_icon','Maximálna daň')|e], ktorú môžete nastaviť pre každý stav, závisí od mnohých faktorov, napríklad od toho, akí sú mocní. Niekedy nemusíte byť schopný niektoré stavy zdanit vôbec.\n\nPre teraz odporúčame automatizovať dane kliknutím na ikonu @automation! #W ozubeného kolieska#!. To im nastaví primeranú daň tak, aby ich spokojnosť zostala nad #G 50%#! [estate_satisfaction_icon] hneď, ako hru odpozastavíte." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 lesson_core_loop_automate_taxes: "Automatizovať dane pre všetky stavy" # todo: NEW TRANSLATION
 lesson_core_loop_5: "[income_icon] Mesačný príjem" # todo: NEW TRANSLATION
 lesson_core_loop_5_desc: "Okrem [taxes_icon|e] [Concept('taxes','daní')|e] je ďalším významným zdrojom [income_icon|e] [Concept('income','príjmu')|e] \n[minting_icon|e] [Concept('minting','Ražba mincí')|e]. Môžete raziť mince podľa potreby, aby ste upravili rozpočet, ale príliš veľa razenia spôsobí [inflation_icon|e] [Concept('inflation','inflácie')|e].\n\nO [Concept('inflation','infláciu')] sa môžete dozvedieť viac v [Link('hints', 'selected_hint = hint_inflation', '@hint! Nápovede o inflácii')]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 lesson_core_loop_minting: "Posuňte posuvníky razenia, aby ste vyrazili niekoľko lesklých dukátov" # todo: NEW TRANSLATION
 lesson_core_loop_inflation: "Dbajte na to, aby ste nevytvárali infláciu" # todo: NEW TRANSLATION
 lesson_core_loop_6: "[income_icon] Mesačný príjem" # todo: NEW TRANSLATION
 lesson_core_loop_6_desc: "Ďalšími dvoma najbežnejšími zdrojmi [income_icon|e] [Concept('income','príjmu')|e] sú [trade_icon|e] [Concept('trade','obchodu')|e] a [food_icon|e] [Concept('food','potravín')|e]. Keďže ide o pokročilejšie koncepty, teraz ich nebudeme rozoberať. Môžete sa o nich dozvedieť, keď budete pripravení, v príslušných Nápovedách:\n\n$TAB$[Link('hints', 'selected_hint = hint_trade', '@hint! Nápoveda: Obchod')]\n$TAB$[Link('hints', 'selected_hint = hint_food', '@hint! Nápoveda: Potraviny')]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 lesson_core_loop_7: "@caesar! Odpozastavenie" # todo: NEW TRANSLATION
 lesson_core_loop_7_desc: "Odpozastavme na chvíľu hru predtým, než sa pozrieme na \n[expenses_icon|e] [Concept('expenses','Výdavky')|e].\n\nMôžete upraviť #high rýchlosť#!, pri ktorej hra beží, z #high horného panelu#!. Rýchlosti #high 3#! alebo #high 4#! sú dobré na začiatok, ale každý hráč má svoje preferencie.\n\nTiež môžete stlačiť @key_space! pre #high pozastavenie#! a #high o  bnovenie#! hry kedykoľvek." # todo: CHANGED NUMBER
 lesson_core_loop_unpause_month: "Obnovte hru a nechajte prejsť mesiac, aby sa čísla aktualizovali" # todo: NEW TRANSLATION
 lesson_core_loop_7b: "@caesar! Odpozastavenie" # todo: NEW TRANSLATION
 lesson_core_loop_7b_desc: "Výborne! Prešiel jeden mesiac a hru sme pre vás opäť pozastavili.\n\nTeraz vidíte, že sa čísla aktualizovali a vaše [estates_icon|e] [Concept('estate','stavu')|e] prispeli svojimi [taxes_icon|e] [Concept('taxes','daní')|e]. Mnohé výpočty v tejto hre prebiehajú na konci mesiaca.\n\nPozrime sa teraz na [expenses_icon|e] [Concept('expenses','výdavky')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 lesson_core_loop_8: "[expenses_icon] Mesačné výdavky" # todo: NEW TRANSLATION
 lesson_core_loop_8_desc: "Mnohé akcie v hre stoja [gold_icon|e] [Concept('gold','dukátov')|e] okamžite pri ich vykonaní. Ale aj keď aktívne míňate [gold|l], váš [budget_icon|e] [Concept('budget','rozpočtu')|e] musí niesť bremeno pravidelných mesačných [expenses_icon|e] [Concept('expenses','výdavkov')|e].\n\nMôžete míňať [gold|l] na zvyšovanie [stability_icon|e] [Concept('stability','stability')|e] a [legitimacy_icon|e] [Concept('legitimacy','legitimity')|e], dvoch z vašich najdôležitejších štatistík, ktoré môžete vidieť na #high hornom paneli#!. Odporúčame minúť aspoň toľko [Concept('gold','dukátov')], aby sa neznižovali.\n\nNáklady na [maintenance_icon|e] [Concept('maintenance','údržbu')|e] vašich stálych [armies_icon|e] [Concept('armies','armád')|e], \n[navies_icon|e] [Concept('navies','Námorné sily')|e] a aktívnych [fortifications_icon|e] [Concept('fortifications','opevnenií')|e] môžu byť značným bremenom pre váš [budget]. Zníženie ich [Concept('maintenance','údržby')] počas mieru je rozumný krok." # todo: CONCEPT CASE
 lesson_core_loop_positive_income: "Upravte posuvníky rozpočtu tak, aby ste mali kladnú mesačnú bilanciu" # todo: NEW TRANSLATION
 lesson_core_loop_9: "[budget_icon] Rekapitulácia rozpočtu" # todo: NEW TRANSLATION
 lesson_core_loop_9_desc: "Perfektné! Pochopili ste základy správy rozpočtu. \nZhrňme si to:\n\n$BULLET$[income_icon|e] [Concept('income','Príjem')|e] a [expenses_icon|e] [Concept('expenses','výdavkov')|e] sa vypočítavajú na konci mesiaca.\n\n$BULLET$[gold_icon|e] [Concept('gold','Dukáty')|e] sa generujú vo vašich [locations_icon|e] [Concept('location','lokality')|e] a zberajú sa od vašich [Concept('estates','stavov')], ktoré odvádzajú [tax_icon|e][Concept('tax','dane')|e], aby naplnili vášu \n[treasury_icon|e] [Concept('treasury','pokladnucu')|e].\n\n$BULLET$[Concept('estates_with_icon','Stavy')|e] nemajú zvlášť radi, keď sú zdaňované.\n\n\nAle čo sú to tie [estates], počujem sa vás pýtať, a prečo sa nepoddávajú každému vašemu rozmaru?" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 lesson_estates_1: "[estates_icon] Koruna a Stavy" # todo: NEW TRANSLATION
 lesson_estates_1_desc: "[Concept('estates_with_icon','Stavy')|e] sú jedným z pilierov vládnutia v #high Europa Universalis V#!. Nielenže sú zdrojom [taxes_icon|e] [Concept('taxes','daní')|e], ale môžu byť aj mocnými spojencami, keď sú lojálny, alebo strašnými nepriateľmi, keď sú nelojálny.\n\nPozrime sa na ne bližšie v @government_panel![Link('government', 'tabcontent = estates', 'lateralview_government_entry_name')]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 lesson_estates_2: "[crown_power_icon] Koruna" # todo: NEW TRANSLATION
 lesson_estates_2_desc: "Tu môžete vidieť rôzne skupiny nazývané [estates_icon|e] [Concept('estate','stavov')|e], ktoré ovládajú [Concept('political_power','politickú moc')] vo vašej [country_icon|e] [Concept('country','krajine')|e] . Každý [estate|l] má svoju [estate_power_icon|e] [Concept('estate_power','sily stavu')|e]. Ako stelesnenie národa vás reprezentuje \n[GetEstateName('crown_estate')].\n\nVaša [crown_power_icon|e] [Concept('crown_power','moci koruny')|e] predstavuje vašu schopnosť odolávať osobitným záujmom vašich statov. Konkrétne vám umožňuje uvaliť vyššie [taxes_icon|e] [Concept('taxes','daní')|e], zvýšiť [estate_satisfaction_icon|e] [Concept('estate_satisfaction','spokojnosti stavu')|e] alebo vašu podporu v \n[parliament_icon|e] [Concept('parliament','Parlament')|e], uľahčuje zmenu [laws_icon|e] [Concept('laws','zákonov')|e] a poskytuje percento z výnosov z [trade_icon|e] [Concept('trade','obchodu')|e].\n\n@hint! O moci koruny sa môžete dozvedieť viac v [Link('hints', 'selected_hint = hint_crown_power', 'Nápoveda: Korunná moc')]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 lesson_estates_3: "[estates_icon] Estáty" # todo: NEW TRANSLATION
 lesson_estates_3_desc: "Vaše [estates_icon|e] [Concept('estates','stavov')|e] môžu byť silnými aktívami pri správnom riadení, ale ak sú nespokojné, rýchlo sa môžu stať zákernou tŕňou v päte.\n\nOkrem prispievania do vašej pokladnice sú [estates|l] nevyhnutné pre [war_icon|e] [Concept('war','vojnu')|e], pretože budete z ich radov verbovať [levies_icon|e] [Concept('levies','milície')|e] pri vedení vojen, až kým si nebudete môcť dovoliť nahradiť ich [regular_regiments_icon|e] [Concept('regular_regiments','stále plukov')|e].\n\nAvšak, ak sú nelojálny, môžu začať podporovať [rebellions_icon|e] [Concept('rebellions','rebelov')|e] proti vašej moci, potenciálne zosadiť vašu vládu cez\n [civil_war_icon|e] [Concept('civil_war','Občianska vojna')|e].\n\nNakoniec stavy, ktorých spokojnosť je nad #G 50%#! [estate_satisfaction_icon] poskytnú rôzne bonusy vašej [country_icon|e] [Concept('country','krajiny')|e] v závislosti od ich typu, zatiaľ čo nespokojné stavy udelia postih." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 lesson_estates_4: "[privileges_icon] Privilégiá" # todo: NEW TRANSLATION
 lesson_estates_4_desc: "[estates] môžu byť obdarované [privileges_icon|e] [Concept('privileges','privilégií')|e], ktoré zvyčajne zvyšujú ich [estate_satisfaction_icon|e] [Concept('estate_satisfaction','spokojnosti stavu')|e] aj [estate_power_icon|e] [Concept('estate_power','sily stavu')|e] a prinášajú ďalšie efekty pre vašu krajinu a ľud.\n\nOdobratie [Concept('privileges','privilégií')] rozhnevá a oslabí vybrané stavy, hoci to môže byť nákladné a pravdepodobne zníži vašu [stability_icon|e] [Concept('stability','stability')|e].\n\nNapriek tomu, že zvyšujú moc stavov a tým znižujú vašu \n[crown_power_icon|e] [Concept('crown_power','Moc koruny')|e], niektoré [privileges|l] môžu byť v súlade s vašimi záujmami. Udeľovanie niekoľkých privilégií v čase núdze môže byť rozumný krok, ak to pomôže uhasíť iskru [rebellion_icon|e] [Concept('rebellion','povstania')|e]." # todo: CONCEPT CASE
 lesson_estates_5: "[pop_type_icon|e] Spoločenské triedy" # todo: NEW TRANSLATION
 lesson_estates_5_desc: "Okrem [privileges] získavajú [estates_with_icon|e] svoju [estate_power_with_icon|e] predovšetkým zo sociálnej skladby vašej [population_with_icon|e].\n\nVaša [population] je rozdelená do rôznych [pop_types_with_icon|e], z ktorých každá podporuje iný [estate]:\n\n$BULLET_WITH_TAB$[GetEstateName('nobles_estate')] sú podporovaní @nobles! [ShowPopTypeName('nobles')]\n$BULLET_WITH_TAB$[GetEstateName('clergy_estate')] sú podporovaní @clergy! [ShowPopTypeName('clergy')]\n$BULLET_WITH_TAB$[GetEstateName('burghers_estate')] sú podporovaní @burghers! [ShowPopTypeName('burghers')]\n$BULLET_WITH_TAB$[GetEstateName('peasants_estate')] sú podporovaní:\n$TAB$$BULLET_WITH_TAB$@peasants! [ShowPopTypeName('peasants')], @laborers! [ShowPopTypeName('laborers')] a @soldiers! [ShowPopTypeName('soldiers')]\n\nNiektoré [Concept('countries','krajiny')|e] sú domovom ďalších [estates], ako napríklad [ShowEstateTypeName('dhimmi_estate')], [ShowEstateTypeName('tribes_estate')] alebo [ShowEstateTypeName('cossacks_estate')]. Tam, kde existujú, ich namiesto niektorého z vyššie uvedených stavov podporujú [pop_types], ktoré by ho za normálnych okolností podporovali.\n\nVaša [population] žije a zomiera vo vašich [locations_with_icon|e], teda na mape. Pozrime sa na ne." # todo: CHANGED (predtym: Okrem [Concept('privileges','privilégií')|E] získavajú [estates_icon|e] [Concept('estates','stavov')|e] svoju [estate_po) # todo: CONCEPT CASE
 lesson_map_1: "[known_world_icon] Mapa" # todo: NEW TRANSLATION
 lesson_map_1_desc: "Svet #high Europa Universalis V#! je tvorený rôznymi [Concept('countries_with_icon','krajinami')|e], ktoré vlastnia [Concept('locations_with_icon','lokality')|e] na mape, z ktorých získavajú zdroje a pracovnú silu potrebnú na udržanie náskoku pred susedmi.\n\nAk oddialite zobrazenie, uvidíte na mape názvy [country] Prejdite myšou na ne a zobrazí sa vám tooltip [country]; kliknutím na ne otvoríte #high Panel cudzej krajiny#!, kde sa o danej [country] môžete dozvedieť viac a interagovať s ňou." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 lesson_trigger_zoom_out: "@centerscroll! Oddiaľte zobrazenie, aby ste videli krajiny" # todo: NEW TRANSLATION
 lesson_trigger_foreign_country: "Otvorte panel krajiny kliknutím @leftclick!#high ľavým tlačidlom#! na cudziu krajinu" # todo: NEW TRANSLATION
 lesson_map_2: "[known_world_icon] Mapa" # todo: NEW TRANSLATION
 lesson_map_2_desc: "[Concept('countries_with_icon','Krajiny')|e] nič neznamenajú bez [Concept('locations_with_icon','lokalít')|e]. [locations] sú srdcom ekonomiky a politiky každej [country] v #high Europa Universalis V#!. Produkujú [Concept('goods_with_icon','tovary')|e] a generujú [Concept('tax_base_with_icon','daňový základ')|e], ale sú tiež domovom [Concept('population_with_icon','populáciou')|e] rôznych [Concept('pop_types_with_icon','sociálnych tried')|e], [Concept('religions_with_icon','náboženstiev')|e] a [Concept('cultures_with_icon','kultúry')|e].\n\n[locations] môžu mať 4 rôzne [Concept('location_rank_with_icon','rang lokality')|e]:\n$BULLET_WITH_TAB$@megalopolis! [ShowLocationRankName('megalopolis')]\n$BULLET_WITH_TAB$@city! [ShowLocationRankName('city')]\n$BULLET_WITH_TAB$@town! [ShowLocationRankName('town')]\n$BULLET_WITH_TAB$@rural_settlement! [ShowLocationRankName('rural_settlement')]\n\nRôzne ranky lokalít majú rôzne [pop_types], [Concept('buildings_with_icon','budovy')|e] a modifikátory." # todo: CHANGED (predtym: [Concept('countries_with_icon','Krajiny')|e] nič neznamenajú bez [Concept('locations_with_icon','lokalít')|e]. [location)
 lesson_map_3: "[known_world_icon] Mapa" # todo: NEW TRANSLATION
 lesson_map_3_desc: "Najdôležitejšia [Concept('location_with_icon','lokalita')|e] pre každú [Concept('country_with_icon','krajinu')|e] je [Concept('capital_with_icon','hlavné mesto')|e]. Vaše hlavné mesto je [Player.GetCapital.GetName]. Na mape ho spoznáte podľa zlatej hviezdy v ikone jeho [Concept('location_rank','rangu lokality')|e] (@city_capital!/@town_capital!/@rural_settlement_capital!).\n\n$BULLET$Môžete @leftclick!#high dvojkliknúť#! na svoju zástavu v #high Hornom paneli#!, aby sa kamera presunula na vaše hlavné mesto.\n\n$BULLET$Rovnako môžete nájsť ľubovoľnú [location] stlačením @key_f! na otvorenie [Link('find_location', '', '@finder_panel!Finder')] a zadaním názvu." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 lesson_trigger_zoom_in: " @centerscroll! Približte zobrazenie, aby ste videli [locations]" # todo: NEW TRANSLATION
 lesson_trigger_capital: "@leftclick!#high Kliknite#! na svoje hlavné mesto, [Player.GetCapital.GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 lesson_control_groups_1: "@caesar! Ovládacie skupiny" # todo: NEW TRANSLATION
 lesson_control_groups_1_desc: "Predtým, než sa pozrieme na [location_icon] [Player.GetCapital.GetName], zastavme sa na chvíľu a pozrime sa na #high Ovládacie skupiny#!. Nachádzajú sa v dolnej časti obrazovky a slúžia ako rýchle spôsoby prístupu k rôznym veciam v hernom svete.\n\nMôžete priradiť [Concept('locations_with_icon','lokality')|e], [Concept('countries_with_icon','krajiny')|e], [Concept('markets_with_icon','trhy')|e] alebo [Concept('armies_with_icon','armády')|e] a ďalšie k určitému číselnému tlačidlu. Vyskúšajme to priradením vášho [Concept('capital_with_icon','hlavného mesta')|e], [Player.GetCapital.GetName].\n\nS otvoreným panelom [Player.GetCapital.GetNameWithNoTooltip] stlačte #high CTRL+1#!, aby ste ho priradili do novej Ovládacej skupiny." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 lesson_basics_click_map: "@leftclick!#high Kliknite#! na [Player.GetCapital.GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 lesson_basics_assign_control_group: "Stlačte #high CTRL+1#! pre priradenie do Ovládacej skupiny" # todo: NEW TRANSLATION
 lesson_control_groups_2: "@caesar! Ovládacie skupiny" # todo: NEW TRANSLATION
 lesson_control_groups_2_desc: "Dobrá práca! Teraz stlačením priradeného čísla otvoríte panel [location_icon] [Player.GetCapital.GetName] a ak to urobíte dvakrát, kamera sa presunie naň.\n\nAk chcete vyprázdniť Ovládaciu skupinu, môžete buď @rightclick!#high pravým tlačidlom kliknúť#! na ňu, alebo stlačiť #high CTRL#! a príslušné číselné tlačidlo." # todo: CHANGED (predtym: Dobrá práca! Teraz stlačením priradeného čísla sa kamera presunie na [location_icon] [Player.GetCapital.GetName] a otvor)
 lesson_location_1: "[location_icon] Lokalita" # todo: NEW TRANSLATION
 lesson_location_1_desc: "Pozrime sa teraz na #high Location Panel#!\n\nKaždá [Concept('location_with_icon','lokalita')|e] je obývaná rôznymi [Concept('pop_types_with_icon','sociálnymi triedami')|e]. Ako sme práve videli, [Concept('pops_with_icon','populácie')|e] zvýšia [Concept('estate_power_with_icon','sila stavu')|e] príslušného [Concept('estate_with_icon','stavu')|e].\n\nPočet [pops] každého [pop_type] závisí predovšetkým na [Concept('buildings_with_icon','budovy')|e] prítomných v [location]. Budovy môžu stavať vy alebo vaše stavy, a na svoju činnosť potrebujú zamestnať konkrétny [pop_type]. Keď sa budova postaví, @peasants! [ShowPopTypeName('peasants')] sa [Concept('promote_with_icon','povýšiť')|e] na potrebný [pop_type], aby ju zaplnili.\n\nNiektoré [buildings] vyrábajú [Concept('goods_with_icon','tovary')|e], ktoré predávané na [Concept('market_with_icon','trh')|e] generujú [Concept('wealth_with_icon','bohatstvo')|e] [location]." # todo: CHANGED # todo: CONCEPT CASE
 lesson_location_2: "[rgo_icon] RGO" # todo: NEW TRANSLATION
 lesson_location_2_desc: "Nie všetky [Concept('locations_with_icon','lokality')|e] majú na začiatku hry postavené [Concept('buildings_with_icon','budovy')|e], ale každá lokalita sa špecializuje na výrobu jedného konkrétneho [Concept('good_with_icon','tovaru')|e] vo svojich #high [resource_gathering_operations]#!, alebo [Concept('rgo_with_icon','R.G.O.')|e]. To je špeciálny typ budovy, ktorá zamestnáva @laborers! [ShowPopTypeName('laborers')] na výrobu [Concept('raw_materials_with_icon','suroviny')|e].\n\nRovnako ako budovy, [rgo] predávajú svoje [goods] na [Concept('market_with_icon','trh')|e] lokality, aby generovali [Concept('tax_base_with_icon','daňový základ')|e]. Na začiatku hry väčšina vášho [tax_base] pochádza z produkcie vašich [rgo]\n\n@hint! O [markets] sa môžete dozvedieť viac tu: [Link('hints', 'selected_hint = hint_markets', 'Nápoveda: Trhy')]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 lesson_location_3: "[wealth_icon] Bohatstvo lokality" # todo: CHANGED
 lesson_location_3b: "[wealth_icon] Bohatstvo lokality" # todo: CHANGED
 lesson_location_3_desc: "Ako sme videli, pridané zisky z [Concept('buildings_with_icon','budov')|e] a [rgo_with_icon|e] tvoria [Concept('wealth_with_icon','bohatstvo')|e] [Concept('location_with_icon','lokality')|e]. [wealth] sa následne zhromažďuje od [Concept('estates_with_icon','stavov')|e] podľa ich prítomnosti v [location].\n\nPamätajte, že z týchto [Concept('gold_with_icon','dukátov')|e] nakoniec dostanete len časť vo forme [Concept('taxes_with_icon','daniam')|e].\n\n#weak Napríklad celkové [wealth] v [location_icon] [Player.GetCapital.GetName] predstavuje [Player.GetCapital.GetTotalPossibleTaxBase|2W] [tax_base_icon], z ktorých zdaníte [Player.GetCapital.GetTotalIncome|2g][gold_icon] od svojich [estates].#!" # todo: CHANGED # todo: CONCEPT CASE
 lesson_basics_hover_tax_base: "Prejdite kurzorom nad Bohatstvo, aby ste videli, ako sa rozdeľuje medzi stavy" # todo: CHANGED
 lesson_location_3_recap: "@caesar! Zhrňme si to!" # todo: NEW TRANSLATION
 lesson_location_3_recap_desc: "[Concept('buildings_with_icon','Budovy')|e] a [Concept('rgo_with_icon','R.G.O.')|e] vo vašich [Concept('locations_with_icon','lokalít')|e] zamestnávajú [Concept('pops_with_icon','populácie')|e] na vytváranie [Concept('wealth_with_icon','bohatstvo')|e]. [wealth] sa rozdeľuje medzi vaše [Concept('estates_with_icon','stavy')|e], ktoré vám následne poskytujú [Concept('taxes_with_icon','dane')|e] a [Concept('levies_with_icon','branci')|e]." # todo: CHANGED # todo: CONCEPT CASE
 lesson_location_4: "[control_icon] Kontrola" # todo: NEW TRANSLATION
 lesson_location_4_desc: "Nie všetky [Concept('locations_with_icon','lokality')|e] sú však rovnako výhodné. Prediskutujme jednu z najdôležitejších štatistík [location]: [Concept('control_with_icon','kontroly')|e].\n\n[control] predstavuje dosah centrálnej vlády v [location]. Okrem iného [control] určuje [Concept('tax_base_with_icon','daňový základ')|e] lokality, teda časť jej [Concept('wealth_with_icon','bohatstva')|e], ktorá môže byť ovplyvnená vašimi [Concept('taxes_with_icon','daňami')|e]. Akékoľvek bohatstvo mimo dosahu vášho [control] putuje priamo do vreciek vašich [Concept('estates_with_icon','stavov')|e], úplne bez [taxes].\n\n#weak Vďaka tomu, že máte #W 100%#! [control] vo vašom [capital], #W 100%#! [wealth] sa započítava do daňovej základne, takže žiadne dane nie sú stratené.#!" # todo: CHANGED # todo: CONCEPT CASE
 lesson_location_5: "[proximity_icon] Blízkosť" # todo: NEW TRANSLATION
 lesson_location_5_desc: "[Concept('control_with_icon','Kontrola')|e] konkrétnej [Concept('location_with_icon','lokalite')|e] priamo závisí od jej [Concept('proximity_with_icon','blízkosti')|e] k vášmu [Concept('capital_with_icon','hlavnému mestu')|e].\n\nPreto je váš [capital] jednou z najdôležitejších [locations]: vždy bude mať vysoké [control]. To znamená, že [Concept('buildings_with_icon','budovy')|e] a [Concept('rgo_with_icon','R.G.O.')|e] vo vašom [capital] budú vždy prispievať najviac k vášmu [Concept('income_with_icon','príjmu')|e].\n\n@hint! Viac o [proximity] a [control] sa môžete dozvedieť tu: [Link('hints', 'selected_hint = hint_control', 'Proximity and Control Hint')]" # todo: CHANGED # todo: CONCEPT CASE
 lesson_mapmodes_1: "@mapmode! Režimy mapy" # todo: NEW TRANSLATION
 lesson_mapmodes_1_desc: "Poďme si teraz na chvíľu pozrieť #high Režimy mapy#!. Sú to rôzne pohľady, ktorými môžete vidieť rôzne aspekty sveta zobrazeného na mape.\n\nAk najazdíte myšou na [Concept('control_with_icon','kontrolu')|e] tooltip v Paneli lokácií, uvidíte tlačidlo Režim mapy v pravom hornom rohu tooltipu. Keď @leftclick!#high Kliknite#! naň, Režim mapy sa zmení tak, aby zobrazil [Concept('control_with_icon','kontrola')|e] vo všetkých vašich [Concept('locations_with_icon','lokalít')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 lesson_basics_control_mapmode: "Najeďte kurzorom na tooltip Kontroly" # todo: NEW TRANSLATION
 lesson_basics_control_mapmode_2: "@leftclick!#high Kliknite#! na tlačidlo Režim mapy v hlavičke tooltipu, aby ste aktivovali Režim mapy Kontroly" # todo: NEW TRANSLATION
 lesson_mapmodes_1b: "@mapmode! Režimy mapy" # todo: NEW TRANSLATION
 lesson_mapmodes_1c: "@mapmode! Režimy mapy" # todo: NEW TRANSLATION
 lesson_mapmodes_1b_desc: "Teraz na mape vidíte rozloženie [Concept('control_with_icon','kontrola')|e] po vašom území. Všimnite si, že [control] má tendenciu klesať, čím sú [Concept('locations_with_icon','lokality')|e] vzdialenejšie od [Concept('capital_with_icon','hlavného mesta')|e]. V dôsledku [control] nebudú [locations] na periférii vašich domén takmer vôbec užitočné, aspoň bez patričnej infraštruktúry.\n\nKeď ste v tomto Režime mapy, môžete tiež @leftclick!#high Kliknúť#! na iné [Concept('countries_with_icon','krajiny')|e], aby ste videli ich [control] zobrazené na mape." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 lesson_mapmodes_2: "@mapmode! Režimy mapy" # todo: NEW TRANSLATION
 lesson_mapmodes_2a: "@mapmode! Režimy mapy" # todo: NEW TRANSLATION
 lesson_mapmodes_2_desc: "Teraz si pozrime Režim mapy [Concept('proximity_with_icon','blízkosť')|e]. Môžete k nemu pristúpiť z tooltipu Proximita, podobne ako ste to urobili pri [Concept('control_with_icon','kontrole')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 lesson_basics_proximity_mapmode: "Najeďte kurzorom na tooltip Proximity" # todo: NEW TRANSLATION
 lesson_basics_proximity_mapmode_2: "@leftclick!#high Kliknite#! na tlačidlo Režim mapy v hlavičke tooltipu, aby ste aktivovali Režim mapy Proximity" # todo: NEW TRANSLATION
 lesson_mapmodes_2b: "@mapmode! Režimy mapy" # todo: NEW TRANSLATION
 lesson_mapmodes_2b_desc: "Režim mapy [Concept('proximity_with_icon','blízkosť')|e] ukazuje, ako ďaleko sú [Concept('locations_with_icon','lokality')|e] od vášho [Concept('capital_with_icon','hlavného mesta')|e] v praktickom zmysle.\n\nMôžete si všimnúť, že [proximity] sa šíri ďalej cez plániny a pozdĺž riek, a je výrazne obmedzená horskými pásmami alebo lesmi. Naozaj, [Concept('topography_with_icon','topografia')|e] a [Concept('vegetation_with_icon','vegetácia')|e] hrajú veľmi dôležitú úlohu pri výpočte [proximity], rovnako ako prítomnosť ľuďmi vytvorenej infraštruktúry, ako sú [Concept('roads_with_icon','cesty')|e] alebo [Concept('ports_with_icon','prístavy')|e].\n\n@leftclick!#high Kliknutím#! na rôzne [Concept('locations_with_icon','lokality')|e] v tomto Režime mapy sa zobrazí trasa, ktorú používajú na dosiahnutie hlavného mesta." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 lesson_basics_map_modes: "@mapmode! Režimy mapy" # todo: NEW TRANSLATION
 lesson_basics_map_modes_complete: "@mapmode! Režimy mapy" # todo: NEW TRANSLATION
 lesson_basics_map_modes_desc: "V tejto hre existujú desiatky rôznych #high Režimov mapy#!, ktoré môžete použiť na zobrazenie všetkých možných údajov.\n\nNapríklad vás môžu zaujímať rôzne [Concept('markets_with_icon','trhy')|e] po svete alebo rozloženie [Concept('population_with_icon','populácia')|e] vo vašom [Concept('country_with_icon','krajine')|e].\n\nK dispozícii máte všetky #high Režimy mapy#! po najetí myšou na widget v dolnej časti obrazovky a výbere konkrétneho Režimu mapy. Kludne ich preskúmajte, ale nemusíte si hneď osvojiť všetky.\n\nNezabudnite sa vrátiť do predvoleného Režimu mapy stlačením #high Ctrl+Q#!, alebo výberom z panelu Režimov mapy." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 lesson_basics_open_map_mode_widget: "Otvorte panel Režimov mapy (zvýraznené)" # todo: NEW TRANSLATION
 lesson_basics_return_map_mode_widget: "Vráťte sa do predvoleného Režimu terénu (#high Ctrl+Q#!)" # todo: NEW TRANSLATION
 lesson_road: "[road_icon] Cesty" # todo: NEW TRANSLATION
 lesson_road_desc: "Povedali sme, že potrebujete [Concept('proximity_with_icon','blízkosť')|e], aby ste mali [Concept('control_with_icon','kontrola')|e], ale ako zlepšiť svoju [proximity]?\n\nExistuje viacero spôsobov, ale jedným z najdôležitejších je budovanie [Concept('roads_with_icon','cesty')|e]. [roads] zlepšujú spojenie medzi dvoma [Concept('locations_with_icon','lokalitami')|e], čím znižujú stratu Proximity pre všetky [locations], ktoré používajú túto trasu na prístup k [Concept('capital_with_icon','hlavnému mestu')|e].\n\nPostavme [road] z [location_icon] [Player.GetCapital.GetName]. Všimnite si, že vás to bude stáť [Concept('gold_with_icon','dukáty')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 lesson_basics_road1: "Otvorte Panel [Player.GetCapital.GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 lesson_basics_road2: "@leftclick!#high Kliknite#! na tlačidlo Stavby ciest, aby ste postavili [road] z vášho [capital]" # todo: NEW TRANSLATION
 lesson_basics_road3: "@leftclick!#high Kliknite#! na ktorýkoľvek susedný [location] na mape, aby ste začali výstavbu" # todo: NEW TRANSLATION
 lesson_road_2: "[road_icon] Cesty" # todo: NEW TRANSLATION
 lesson_road_2_desc: "Výborne! [Concept('road_with_icon','cesta')|e] je teraz v stave [Concept('construction_with_icon','výstavbe')|e]. Dokončenie potrvá niekoľko mesiacov. Môžete sledovať priebeh výstavby v kruhovom widgete na mape nad vaším [Concept('capital_with_icon','hlavným mestom')|e].\n\nPo dokončení sa [Concept('proximity_with_icon','blízkosť')|e] v cieľovom [location] primerane zlepší a uvidíte vzostup jeho [Concept('control_with_icon','kontroly')|e].\n\nStavba [construction] budov, [Concept('buildings_with_icon','budov')|e], [rgo_with_icon|e] a [Concept('regiments_with_icon','pluky')|e] funguje veľmi podobne. Stoja [Concept('gold_with_icon','dukáty')|e], vyžadujú niektoré [Concept('goods_with_icon','tovary')|e] z [Concept('market_with_icon','trhu')|e] a ich dokončenie trvá určitý čas." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 lesson_road_3: "[road_icon] Všetky cesty vedú do [Player.GetCapital.GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 lesson_road_3_desc: "[Concept('proximity_with_icon','Blízkosť')|e] a [Concept('control_with_icon','kontrola')|e] sú jednými z najdôležitejších mechaník, ktoré musíte ovládnuť v @caesar!#W Europa Universalis V#!. Vaša [Concept('crown_power_with_icon','moc koruny')|e], [Concept('tax_base_with_icon','daňový základ')|e] a veľkosť vašich [Concept('levies_with_icon','brancov')|e] budú priamo závisieť od [control], ktoré máte nad svojimi [locations], čo zase závisí od ich [proximity] k vášmu [Concept('capital_with_icon','hlavnému mestu')|e]. To znamená, že kladenie [Concept('roads_with_icon','cesty')|e] z [capital] je kľúčové pre všetky [countries], veľké i malé.\n\nOkrem [roads] sa [proximity] môže šíriť aj po mori, hoci efektívne to vyžaduje dobrú [Concept('harbor_capacity_with_icon','kapacitu prístavu')|e] a [Concept('maritime_presence_with_icon','námorná prítomnosť')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 tutorial_diagram_belong_to: "Patriť k" # todo: NEW TRANSLATION
 tutorial_diagram_provide: "Poskytovať" # todo: NEW TRANSLATION
 tutorial_diagram_employ: "Zamestnávať" # todo: NEW TRANSLATION
 tutorial_diagram_create: "Vytvárať" # todo: NEW TRANSLATION
 tutorial_diagram_buildings_rgo: "Budovy & R.G.O." # todo: NEW TRANSLATION
 tutorial_diagram_harbors: "Prístavy" # todo: NEW TRANSLATION
 tutorial_diagram_increases: "Zvyšuje" # todo: NEW TRANSLATION
 tutorial_diagram_decreases: "Znižuje" # todo: NEW TRANSLATION
 tutorial_diagram_affects: "Ovlplyvňuje" # todo: NEW TRANSLATION
 tutorial_diagram_improves: "Zlepšuje" # todo: NEW TRANSLATION
 lesson_basics_wrap_up_3: "@caesar! Prehľad" # todo: NEW TRANSLATION
 lesson_basics_wrap_up_3b: "@caesar! Prehľad" # todo: NEW TRANSLATION
 lesson_basics_wrap_up_3_desc: "Pred dokončením si prejdime ešte niekoľko ďalších prvkov rozhrania, ktoré potrebujete poznať, počnúc #high Outlinerom#!.\n\nOutliner ponúka prehľad toho, čo sa vo vašom [country] deje. Napríklad stavbu [Concept('road_with_icon','cestu')|e], ktorú ste práve spustili, uvidíte v skupine [Concept('construction_with_icon','výstavbe')|e].\n\nObsah Outlinera je vysoko prispôsobiteľný. Podobne ako #high Kontrolné skupiny#!, môžete pripnúť množstvo vecí do Outlinera, ako sú [Concept('countries_with_icon','krajiny')|e], [Concept('markets_with_icon','trhy')|e] alebo [Concept('armies_with_icon','armády')|e].\n\nNa to môžete využiť #high Kontextové menu#!, ktoré otvoríte @rightclick!#high Pravým klikom#! na [Concept('location_with_icon','lokalitu')|e] alebo [Concept('country','krajinu')] na mape.\n\n@rightclick!Pravým klikom niekde na mape otvorte menu a potom hľadajte @pin_icon! ikonu." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 lesson_basics_add_outliner: "Pripnite [Concept('country','krajinu')] alebo [Concept('location','lokalitu')] do #high Outlinera#!" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 lesson_basics_open_contextmenu: "Otvorte Kontextové menu" # todo: NEW TRANSLATION
 lesson_basics_wrap_up_4: "@automation! Automatizácia" # todo: NEW TRANSLATION
 lesson_basics_wrap_up_4_desc: "Výborne! Budete mať prístup ku všetkému, čo ste si pripevnili na pravej strane obrazovky.\n\nSme takmer na konci tohto úvodu. Automatizovali sme niektoré funkcie, aby ste sa mohli sústrediť na osvojenie základov, ale ktoré aspekty hry sú automatizované, môžete kedykoľvek ovládať v @automation! [Link('automation', '', 'lateralview_automation_entry_name')]." # todo: CHANGED
 lesson_basics_open_automation_view: "Otvorte panel Automatizácie (zvýraznené)" # todo: NEW TRANSLATION
 lesson_basics_wrap_up_4b: "@automation! Automatizácia" # todo: NEW TRANSLATION
 lesson_basics_wrap_up_4b_desc: "Z tohto panela môžete ovládať, ktoré aspekty vášho [Concept('country_with_icon','krajiny')|e] bude hra spravovať za vás. Odporúčame vám rýchlo si prehliadnuť dostupné možnosti a neskôr sa k tomuto panelu vrátiť, keď budete mať jasnejšiu predstavu o tom, čo chcete riadiť sami.\n\nNapríklad sa môžete rozhodnúť, či chcete automatizovať vaše [Concept('advances_with_icon','pokroky')|e] a [Concept('cabinet_with_icon','kabinet')|e] alebo ich ponechať manuálne.\n\nO týchto funkciách sa môžete dozvedieť viac v príslušných nápovedách, ak sa rozhodnete s nimi pracovať manuálne:\n\n$TAB$[Link('hints', 'selected_hint = hint_can_do_more_research', '@hint! Advances Hint')]\n$TAB$[Link('hints', 'selected_hint = hint_has_possible_cabinet_action', '@hint! Cabinet Hint')]" # todo: CHANGED # todo: CONCEPT CASE
 lesson_basics_wrap_up_5: "@caesar! Upozornenia" # todo: NEW TRANSLATION
 lesson_basics_wrap_up_3b_desc: "Ďalším dôležitým prvkom, ktorý budete pri kampaniach používať, sú #high Upozornenia#!. Objavia sa pod #high Horným panelom#! a informujú vás o rôznych záležitostiach, ktoré nakoniec budú potrebovať vašu pozornosť, zoradené podľa úrovne naliehavosti, od najnaliehavejších (#R Červené#!) po menej naliehavé (#G Zelené#!).\n\nPoznámka: Upozornenia sa týkajú len oblastí hry, ktoré nemáte @automation! #high Automatizované#!.\n\n@hint! Väčšina Upozornení má príslušnú Nápovedu, ktorá vám pomôže danú vec riešiť. Môžete #high Shift+Kliknite#! na Upozornenie, aby sa otvorila príslušná Nápoveda." # todo: NEW TRANSLATION
 lesson_basics_wrap_up_6: "@caesar! Agenda" # todo: NEW TRANSLATION
 lesson_basics_wrap_up_6_desc: "Nakoniec odporúčame, aby ste sa na začiatku každej hry pozreli do @agenda! #high Agendy#!, kde nájdete niečo historického kontextu o vašom [Concept('country_with_icon','krajinu')|e] a zbierku tých @hint! #high Nápovedí#!, ktoré sú najrelevantnejšie pre vašu aktuálnu situáciu." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 lesson_basics_open_agenda: "Otvorte Agendu" # todo: NEW TRANSLATION
 lesson_basics_final: "[mission_icon] Pokračovať na misie!" # todo: NEW TRANSLATION
 lesson_basics_final_desc: "Dostali sme sa na koniec #W Základného návodu#!. Odporúčame vám pokračovať výberom cesty [Concept('mission_with_icon','misia')|e] podľa vašej voľby.\n\nV závislosti od zvoleného herného štýlu vám misie ponúknu rôzne ciele a odmeny, ktoré vás nasmerujú počas počiatočných krokov v @caesar!#W Europa Universalis V#!.\n\nPri výbere zamerania misie najprv dostanete krátke vysvetlenie, ktoré rozšíri vaše znalosti o danej časti herného zážitku.\n\nVeľa šťastia a nech váš národ prekvita cez vírenia Času!" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 lesson_basics_mission_focus: "Vyberte zameranie misie" # todo: NEW TRANSLATION
 lesson_diplomacy_0: "@diplomacy! Politický návod" # todo: NEW TRANSLATION
 lesson_diplomacy_0b: "@diplomacy! Politický návod" # todo: NEW TRANSLATION
 lesson_diplomacy_0_desc: "Začíname teraz Politický návod. Pôjdeme trochu hlbšie do zložitostí vašej spoločnosti, vlády a zahraničnej politiky.\n\nZačnime základmi každého štátu: [Concept('population_with_icon','populácii')|e]\n\nUž sme počas úvodu nazreli na [pops], žijúce vo vašom [Concept('capital_with_icon','hlavnom meste')|e]. Teraz sa ponoríme hlbšie do [Link('country_culture', '', '@society_panel!Panel spoločnosti')]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 lesson_diplomacy_open_society: "Otvorte panel Spoločnosť" # todo: NEW TRANSLATION
 lesson_diplomacy_open_pops: "Otvorte kartu Populácia" # todo: NEW TRANSLATION
 lesson_diplomacy_1: "@society_panel! Spoločnosť" # todo: NEW TRANSLATION
 lesson_diplomacy_1_desc: "V tomto paneli môžete zobraziť a pristupovať k ľudskejším aspektom vášho [Concept('country_with_icon','krajine')|e]. Položka [Concept('population_with_icon','populácia')|e] v #high Hornom paneli#! vám ukazuje, koľko ľudí momentálne žije vo vašom [country], ako aj to, ako sa táto hodnota mení mesiac po mesiaci.\n\nVaša populácia je rozdelená na [Concept('pops_with_icon','populácie')|e]: skupiny ľudí rovnakej [Concept('culture_with_icon','kultúry')|e], [Concept('religion_with_icon','náboženstva')|e] a [Concept('pop_type_with_icon','sociálna trieda')|e], žijúce v rovnakej [Concept('location_with_icon','lokalite')|e].\n\nAko sme už videli, každý [pop_type] podporuje konkrétne [Concept('estate_with_icon','stav')|e]. Okrem toho majú [pops] úroveň [Concept('literacy_with_icon','gramotnosť')|e], úroveň [Concept('pop_satisfaction_with_icon','spokojnosť populácie')|e] a požadujú [Concept('food_with_icon','potraviny')|e] aj [Concept('pop_needs_with_icon','potreby populácie')|e] od svojho [Concept('market_with_icon','trhu')|e].\n\nSpokojnosť vašich popov závisí od viacerých faktorov, napríklad od toho, ako sú ich [culture] a [religion] vnímané vo vašej krajine, ako aj od [Concept('estate_satisfaction_with_icon','spokojnosti stavu')|e] príslušných [estates]. Keď spokojnosť [pop] príliš klesne, môže hľadať podporu pre [Concept('rebellion_with_icon','povstanie')|e].\n\n@hint! Viac sa o [rebels] dozviete v [Link('hints', 'selected_hint = hint_rebels_growing', 'Nápoveda: Povstania')]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 lesson_diplomacy_2: "@culture! Kultúra" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 lesson_diplomacy_2_desc: "Spomenuli sme, že každý [Concept('pop_with_icon','populácia')|e] patrí k určitej [Concept('culture_with_icon','kultúre')|e]. Pozrime sa na [Link('country_culture', '', '@society_panel! Karta Kultúry')]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 lesson_diplomacy_open_culture: "Otvorte kartu Kultúra" # todo: NEW TRANSLATION
 lesson_diplomacy_3: "@culture! Kultúra" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 lesson_diplomacy_3_desc: "Vo vašej [Concept('country_with_icon','krajine')|e] sa zvyčajne nachádza viacero [Concept('cultures_with_icon','kultúry')|e]. Každá [country] má [Concept('primary_culture_with_icon','hlavná kultúra')|e], pričom všetky ostatné [Concept('cultures','kultúry')] majú odlišný [Concept('cultural_status','kultúrny status')|e].\n\n[Concept('pops_with_icon','Populácie')|e] patriace ku kultúre s nízkym [cultural_status] budú všeobecne mať oveľa nižšiu [Concept('pop_satisfaction_with_icon','spokojnosti populácie')|e] a prispejú menej [Concept('levies_with_icon','brancom')|e]. Môžete zvýšiť [cultural_status] kultúr vo vašom kráľovstve pridelením [Concept('cultural_capacity_with_icon','kultúrnej kapacite')|e].\n\nNakoniec sa [pops] vo vašej [country] budú [Concept('assimilate_with_icon','asimilovať')|e] do vašej [primary_culture] na základe rôznych faktorov, pričom najdôležitejším je rozdiel medzi [Concept('cultural_influence_with_icon','kultúrnym vplyvom')|e] vašej [primary_culture] a [Concept('cultural_tradition_with_icon','kultúrnou tradíciou')|e] ich kultúry." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 lesson_diplomacy_open_works_of_art: "Otvorte podkartu Diela" # todo: NEW TRANSLATION
 lesson_diplomacy_4: "@art_work! Diela" # todo: NEW TRANSLATION
 lesson_diplomacy_4_desc: "Jedným z najdôležitejších nástrojov na zvýšenie [Concept('cultural_influence_with_icon','kultúrny vplyv')|e] vašej [Concept('primary_culture_with_icon','hlavnej kultúry')|e] sú [Concept('works_of_art_with_icon','umelecké diela')|e].\n\nPoďme sa pozrieť na #high Kartu diel#! Ďalej prejdite do zvýraznenej podkarty." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 lesson_diplomacy_open_culture_breakdown: "Otvorte podkartu Rozpis kultúr" # todo: NEW TRANSLATION
 lesson_diplomacy_5: "@art_work! Diela" # todo: NEW TRANSLATION
 lesson_diplomacy_5_desc: "[Concept('works_of_art_with_icon','Umelecké diela')|e] sú artefakty vytvorené [Concept('artists_with_icon','umelci')|e] vo vašej [Concept('country_with_icon','krajine')|e]. Napríklad [ShowArtistTypeName('painter')] môže vyprodukovať [ShowWorkOfArtTypeName('painting')], alebo [ShowArtistTypeName('writer')] môže vytvoriť [ShowWorkOfArtTypeName('novel')].\n\nKeď je [Concept('work_of_art','umelecké dielo')] vytvorené, poskytne určitú hodnotu [Concept('cultural_influence_with_icon','kultúrny vplyv')|e] vašej [Concept('primary_culture_with_icon','hlavnej kultúry')|e].\n\nPo vytvorení bude pokračovať v poskytovaní výhod pre [Concept('cultural_tradition_with_icon','kultúrnu tradíciu')|e] vašej hlavnú kultúru, ako aj mesačný bonus k vášmu [Concept('prestige_with_icon','prestíži')|e] na základe jeho [Concept('art_quality','kvality umenia')|e].\n\n[prestige] je ďalšia z hodnôt, ktorú môžete sledovať v #high Hornom paneli#! a predstavuje mieru kultúrnej prítomnosti vašej [country] na svetovej scéne. Medzi iným vám vysoké [prestige] pomáha v [Concept('diplomacy','diplomacii')|e] a [Concept('integration','integrácii')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 lesson_diplomacy_open_religion: "Otvorte kartu Náboženstvo" # todo: NEW TRANSLATION
 lesson_diplomacy_6: "[religion_icon] Náboženstvo" # todo: NEW TRANSLATION
 lesson_diplomacy_6_desc: "Okrem [Concept('culture_with_icon','kultúry')|e] je druhou definujúcou črtou [Concept('pops_with_icon','populáciami')|e] ich [Concept('religion_with_icon','náboženstvo')|e]. Pozrime sa na [Link('country_religion', '', '@society_panel! Karta Náboženstva')]!" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 lesson_diplomacy_7: "[religion_icon] Náboženstvo" # todo: NEW TRANSLATION
 lesson_diplomacy_7_desc: "V tejto karte môžete vidieť svoje [Concept('primary_religion_with_icon','hlavné náboženstvo')|e], ako aj iné [Concept('religions_with_icon','náboženstvá')|e] prítomné vo vašej [Concept('country_with_icon','krajine')|e].\n\nMôžete minúť [Concept('religious_influence_with_icon','náboženský vplyv')|e], aby ste interagovali s vaším náboženstvom rôznymi spôsobmi v závislosti od konkrétnej viery vášho krajiny.\n\nPodobne ako pri [Concept('culture_with_icon','kultúre')|e], všetky [Concept('religions','náboženstvá')] v krajine majú aj pridružený [Concept('religious_status','náboženský status')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 lesson_diplomacy_8: "@population! Ľudia" # todo: NEW TRANSLATION
 lesson_diplomacy_8_desc: "Ďalej si pozrime #high Kartu ľudí.#!" # todo: NEW TRANSLATION
 lesson_diplomacy_open_people: "Otvorte kartu Ľudia" # todo: NEW TRANSLATION
 lesson_diplomacy_8b: "@population! Ľudia" # todo: NEW TRANSLATION
 lesson_diplomacy_8b_desc: "Tu nájdete informácie o [Concept('pops_with_icon','populácie')|e] vo vašej [Concept('country_with_icon','krajine')|e]. Vaši populácie žijú v konkrétnej [Concept('location_with_icon','lokalite')|e] a sú identifikovaní podľa [Concept('culture_with_icon','kultúry')|e], [Concept('religion_with_icon','náboženstva')|e] a [Concept('pop_type','sociálnej triedy')|e].\n\nV tomto paneli nájdete aj informácie o [Concept('rebels_with_icon','povstalcov')|e]. Všeobecne sa s povstalcami dá zaobchádzať zvýšením ich [Concept('pop_satisfaction','spokojnosť populácie')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 lesson_diplomacy_8c: "@characters! Postavy" # todo: NEW TRANSLATION
 lesson_diplomacy_8c_desc: "Pozrime sa teraz na [Concept('characters_with_icon','postavy')|e]. Prejdite do #high Karty postáv.#!" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 lesson_diplomacy_open_character: "Otvorte podkartu Postavy" # todo: NEW TRANSLATION
 lesson_diplomacy_8d: "@characters! Postavy" # todo: NEW TRANSLATION
 lesson_diplomacy_8d_desc: "Počas hry budete interagovať s množstvom rôznych [Concept('characters_with_icon','postavami')|e], významnými jednotlivcami, ktorých môžete zamestnávať do rôznych [Concept('roles','rol')|e].\n\nV tejto karte vidíte zoznam všetkých [characters] na vašom dvore a ich aktuálne [role]. Postavy majú [Concept('abilities_with_icon','schopnosti')|e], ktoré určujú ich efektivitu pri plnení rôznych [roles]:\n\n[Concept('adm_with_icon','Administratívna schopnosť')|e]\n[Concept('dip_with_icon','Diplomatická schopnosť')|e]\n[Concept('mil_with_icon','Vojenská schopnosť')|e]\n\nOkrem 3 základných [abilities] môžu [characters] rozvíjať špecifické [Concept('traits','vlastnosti')|e], ktoré ich robia lepšími v určitých úlohách. [characters] tiež patria k [Concept('estate_with_icon','stavu')|e] a niektorí budú patriť k slávnej [Concept('dynasty_with_icon','dynastii')|e].\n\n#weak Tiež môžete @rightclick!#high Pravým klikom#! na meno alebo portrét [character] kdekoľvek v hre otvoriť #high Kontextové menu#!#!" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 lesson_diplomacy_8e: "[character_icon] Postavy" # todo: NEW TRANSLATION
 lesson_diplomacy_8e_desc: "Už sme videli využitie [artists] vo vašom [court], ale vašou najdôležitejšou [Concept('character_with_icon','postavou')|e] bude zďaleka váš [Concept('ruler_with_icon','panovník')|e].\n\nNavštívme znovu Panel vlády, aby sme nazreli do ušľachtilej vedy vládnutia." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 lesson_admin_1: "[ruler_icon] Vládca" # todo: NEW TRANSLATION
 lesson_admin_1_desc: "Toto je váš [Concept('ruler_with_icon','panovník')|e], vaša najdôležitejšia [Concept('character_with_icon','postava')|e]. [Concept('abilities_with_icon','Schopnosti')|e] vášho [ruler] majú výrazný dopad na váš [Concept('country_with_icon','krajina')|e]. Ich účinky môžete skontrolovať najetím myšou.\n\nV tomto prehľade vidíte aj svojho [Concept('consort_with_icon','konzort panovníka')|e], [Concept('heir_with_icon','dediča')|e] a [Concept('regent_with_icon','regent')|e], ak máte niektorú z týchto [Concept('roles','rol')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 lesson_admin_open_government: "Otvorte panel [Concept('government','vlády')]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 lesson_admin_9: "[cabinet_icon] Kabinet" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 lesson_admin_9_desc: "Keď už hovoríme o dôležitých [Concept('characters_with_icon','postavy')|e], pozrime sa na jeden z najsilnejších nástrojov na vládnutie: váš [Concept('cabinet_with_icon','kabinet')|e].\n\nPrejdite do zvýraznenej podkarty Kabinetu." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 lesson_admin_open_cabinet: "Otvorte podkartu Kabinet" # todo: NEW TRANSLATION
 lesson_admin_10: "[cabinet_icon] Kabinet" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 lesson_admin_10_desc: "Toto je váš [Concept('cabinet_with_icon','kabinet')|e]. Skladá sa niekoľkých [Concept('cabinet_seats_with_icon','miest v kabinete')|e], ktoré môžu byť obsadené [Concept('characters_with_icon','postavy')|e], ktorí budú slúžiť ako [Concept('cabinet_members_with_icon','členovia kabinetu')|e]. Môžete poveriť svojich členov kabinetu rôznymi [Concept('cabinet_actions_with_icon','akciami kabinetu')|e], ako napríklad [ShowCabinetActionName('increase_control_province')] alebo [ShowCabinetActionName('develop_province')].\n\nAkcie kabinetu sú založené na jednej z troch [Concept('abilities_with_icon','schopností')|e]. Schopnosti vášho [Concept('ruler_with_icon','panovníka')|e] a [Concept('cabinet_member','člena kabinetu')] priradeného k vykonaniu akcie ovplyvnia dopad akcie.\n\nNapríklad akcia ako [ShowCabinetActionName('change_societal_values')] bude postupovať rýchlejšie, ak má priradený [Concept('cabinet_member','člen kabinetu')] vysoké [Concept('dip_with_icon','diplomatická schopnosť')|e]. Celková [Concept('cabinet_efficiency_with_icon','efektivita kabinetu')|e] vašej [Concept('country_with_icon','krajiny')|e] tiež ovplyvní rýchlosť a efektívnosť akcie.\n\n@hint! O Kabinete sa môžete dozvedieť viac v [Link('hints', 'selected_hint = hint_has_possible_cabinet_action', 'Nápoveda: Kabinet')]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 lesson_admin_5: "[estates_icon] Stavy" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 lesson_admin_5_desc: "Prejdime do #high Podkarty stavov#! V rámci karty krajiny v paneli [Concept('government','vlády')|e] môžete zobraziť a interagovať s rôznymi stavmi vo vašej [Concept('country_with_icon','krajine')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 lesson_admin_6: "[government_type_icon] Vláda" # todo: NEW TRANSLATION
 lesson_admin_6_desc: "Každý [Concept('country_with_icon','krajina')|e] je v #high Europa Universalis V#! iný. Podstata politiky vášho [country] bude závisieť predovšetkým od vášho [Concept('government_type_with_icon','typu vlády')|e].\n\nAko [Player.GetGovernment.GetGovernmentType.GetName] sa fungovanie vášho [country] už v mnohých kľúčových aspektoch líši od niektorých susedov. Okrem toho je povaha a politická štruktúra každého [country] silno závislá od nastavenia jeho [Concept('government_reforms_with_icon','vládnych reforiem')|e], [Concept('privileges_with_icon','privilégií')|e] a [Concept('laws_with_icon','zákony')|e].\n\nZmena ktoréhokoľvek z týchto troch zvyčajne prináša veľké náklady na [Concept('stability_with_icon','stabilitu')|e].\n\nPozrime sa, kde sa nachádzajú, začnúc už známym [Link('government', 'tabcontent = estates', '@government_panel!Estates Subtab')]." # todo: CHANGED # todo: CONCEPT CASE
 lesson_admin_6b: "[government_reform_icon] Vládne reformy" # todo: NEW TRANSLATION
 lesson_admin_6b_desc: "Vaše [Concept('government_reforms_with_icon','vládne reformy')|e] sú jednou z najdefinujúcejších vlastností vašej [Concept('country_with_icon','krajiny')|e]. Často majú veľmi výrazné efekty, preto by ich nastavenie malo byť jednou z prvých vecí, ktoré urobíte v novej hre.\n\n@hint! O [government_reforms] sa dozviete viac v [Link('hints', 'selected_hint = hint_has_possible_reform', 'Nápoveda: Vládne reformy')]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 lesson_admin_open_country: "Otvorte kartu Štát" # todo: NEW TRANSLATION
 lesson_admin_open_estates: "Otvorte podkartu Stavy" # todo: NEW TRANSLATION
 lesson_admin_6c: "[privileges_icon] Výsady" # todo: NEW TRANSLATION
 lesson_admin_6c_desc: "O [Concept('privileges_with_icon','privilégiá')|e] sme už hovorili pri [Concept('estates_with_icon','stavoch')|e]. Okrem ich vplyvu na [Concept('estate_satisfaction_with_icon','spokojnosť stavu')|e] a [Concept('estate_power_with_icon','silu stavu')|e] môžu mať [privileges] aj zásadné dôsledky na spôsob hrania vašej [Concept('country_with_icon','krajiny')|e], často otvárajúc nové možnosti alebo obmedzujúc vašu slobodu konania." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 lesson_admin_open_laws: "Otvorte podkartu Zákony" # todo: NEW TRANSLATION
 lesson_admin_11: "[laws_icon] Zákony" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 lesson_admin_11_desc: "Nakoniec, každá krajina začína s odlišnou sadou [Concept('laws_with_icon','zákonmi')|e]. Prepnite sa do #high Podkarty zákonov#! v #high Karte štátu#!." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 lesson_admin_12: "[law_icon] Zákony" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 lesson_admin_12_desc: "[Concept('laws_with_icon','Zákony')|e] existujú v niekoľkých kategóriách a umožňujú vám upravovať vašu [Concept('country_with_icon','krajinu')|e]. Každý [law] obsahuje rad možných [Concept('policies_with_icon','politík')|e], z ktorých si môžete vybrať.\n\nNapríklad si môžete zvoliť mať [ShowPolicyName('no_censorship')] ako aktívnu politiku pre zákon [ShowLawName('censorship')]. To bude mať rôzne efekty, niektoré negatívne a niektoré pozitívne. Ako rýchlo môžete zmeniť [Concept('policy','politiku')] závisí od vašej [Concept('legislative_efficiency_with_icon','legislatívnej efektívnosti')|e].\n\n#weak Zákony je možné meniť kedykoľvek za cenu v [Concept('gold_with_icon','dukátoch')|e] a [Concept('stability_with_icon','stabilite')|e], ale zvykne byť múdrejšie čakať na zasadnutie [Concept('parliament_with_icon','parlament')|e].#!" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 lesson_admin_open_values: "Otvorte kartu Hodnoty" # todo: NEW TRANSLATION
 lesson_admin_13: "[societal_value_icon] Sociálne hodnoty" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 lesson_admin_13_desc: "Teraz môžete podľa vôle vydávať [Concept('government_reforms_with_icon','vládne reformy')|e], [Concept('laws_with_icon','zákony')|e] a [Concept('privileges_with_icon','privilégiá')|e] vo vašej [Concept('country_with_icon','krajine')|e], pokiaľ znášate náklady na [Concept('stability_with_icon','stabilitu')|e]. Ale niektoré veci sa nezmenia zo dňa na deň a spoločnosti sú pomaly prispôsobivé.\n\nNa zobrazenie hlbších štrukturálnych čŕt vašej krajiny a ľudí máme [Concept('societal_values_with_icon','sociálne hodnoty')|e]. Poďme sa na ne pozrieť." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 lesson_admin_14: "[societal_value_icon] Sociálne hodnoty" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 lesson_admin_14_desc: "[Concept('societal_values_with_icon','Sociálne hodnoty')|e] vašej [Concept('country_with_icon','krajiny')|e] reprezentujú hlbšie zvyky jej obyvateľstva, sekulárnu zotrvačnosť inštitúcií a ich odtlačok na povahe obyvateľov. Menia sa pomaly v čase, prispôsobujúc sa povahe zákonov.\n\n[Concept('reforms_with_icon','Reformy')|e], [Concept('privileges_with_icon','privilégií')|e], [Concept('laws_with_icon','zákonov')|e] a konkrétne kroky, ktoré počas vášho vládnutia podniknete, spôsobia, že sa jednotlivé [societal_values] pomaly posunú smerom k cieľovej hodnote.\n\n#weak Napríklad udelenie určitých [privileges] [GetEstateName('nobles_estate')] vo vašom krajine posunie vašu krajinu smerom k [ShowSocietyDirectionName('aristocracy')]#!." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 lesson_admin_15: "[crown_power_icon] Moc koruny" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 lesson_admin_15_desc: "Využitie moci [GetEstateName('crown_estate')] proti ostatným [Concept('estates_with_icon','stavom')|e] je jedným zo základov vládnutia v @caesar!#high Europa Universalis V#!.\n\nVaša [Concept('crown_power_with_icon','moc koruny')|e] závisí hlavne od priemerného [Concept('control_with_icon','kontroly')|e] všetkých vašich [locations], a je znižovaná [Concept('privileges_with_icon','privilégiá')|e] vašich [estates]. Mnohé [Concept('government_reforms_with_icon','vládne reformy')|e], [Concept('laws_with_icon','zákony')|e], a[Concept('societal_values_with_icon','sociálne hodnoty')|e] ju tiež ovplyvňujú.\n\nUdržiavanie [crown_power] vysoko je mimoriadne dôležité: nielenže zvyšuje [Concept('cabinet_efficiency_with_icon','efektivita kabinetu')|e] a vašu vlastnú podporu počas [Concept('parliament_with_icon','parlamentu')|e], ale tiež určuje percento [Concept('trade_income_with_icon','príjem z obchodu')|e], ktoré priamo tečie do vášho [Concept('treasury_with_icon','pokladnice')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 lesson_economy_1: "@adm! Sprievodca ekonomikou" # todo: NEW TRANSLATION
 lesson_economy_1_desc: "Začíname teraz @adm! #high Economy Walkthrough#!. Pôjdeme trochu hlbšie do ekonomiky #high Europa Universalis V#!, začnúc jej základom: [Concept('markets_with_icon','trhmi')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 lesson_economy_2: "[market_icon] Trhy" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 lesson_economy_2_desc: "Tu vidíte zoznam [Concept('markets_with_icon','trhy')|e], kde je prítomná vaša [Concept('country_with_icon','krajina')|e], zatiaľ čo na mape vidíte všetky [markets] v známom svete. Každé [Concept('location_with_icon','lokalita')|e] patrí do [market], kde predávajú [Concept('goods_with_icon','tovary')|e], ktoré vyrábajú, a kupujú [goods], ktoré potrebujú.\n\nMnohé veci v tejto hre vyžadujú [goods]: [Concept('pops_with_icon','populácie')|e] potrebujú [goods] na prežitie, [Concept('constructions_with_icon','výstavby')|e] potrebujú [goods] na postup, [Concept('buildings_with_icon','budovy')|e] potrebujú [goods] na fungovanie, [Concept('armies_with_icon','armády')|e] potrebujú [goods] na boj.\n\nNapríklad na mape vidíte, že vaše [Concept('capital_with_icon','hlavné mesto')|e], [Player.GetCapital.GetName], patrí do [market_icon][Player.GetCapital.GetMarket.GetName], takže čokoľvek tam postavíte bude využívať [goods] z toho [market].\n\n#weak Môžete tiež @rightclick!#high Kliknite pravým tlačidlom myši#! na názov alebo kartu [market] kdekoľvek v hre a otvoriť tak #high Kontextové menu#!#!." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 lesson_economy_3: "[market_icon] Trhy" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 lesson_economy_3_desc: "Produkcia všetkých [Concept('locations_with_icon','lokality')|e] sa predáva každý mesiac do [Concept('stockpile_with_icon','zásob')|e] [Concept('market_with_icon','trhu')|e], čím im poskytuje [Concept('wealth_with_icon','bohatstvo')|e]. Naopak, všetky [locations] sa snažia nakupovať potrebné [Concept('goods_with_icon','tovary')|e] z ich [market] podľa poradia ich [Concept('market_access_with_icon','prístup na trh')|e]. Rozdiel medzi [Concept('supply_with_icon','ponukou')|e] a [Concept('demand_with_icon','dopytom')|e] pre [good] v [market] ovplyvní jeho [Concept('market_price_with_icon','trhovej cene')|e].\n\nVšimnite si, že [markets] presahujú hranice [Concept('country_with_icon','krajina')|e]. Produkcia vašich [locations] vždy ide priamo do ich príslušného [market], takže zahraničné [locations] v rovnakom [market] môžu nakupovať tieto [goods] skôr, než vaše vlastné [locations], ak majú vyššie [market_access].\n\n[Concept('market_access_with_icon','Prístup na trh')|e] [location] závisí od jej vzdialenosti od [Concept('market_center_with_icon','trhového centra')|e] a, podobne ako [Concept('proximity_with_icon','blízkosť')|e], môžete ju zlepšiť pomocou [Concept('roads_with_icon','ciest')|e]. Lokality zvyčajne patria k najbližšiemu [market], teda tomu, kde majú vyššie [market_access].\n\n@hint! O [markets] sa môžete dozvedieť viac v [Link('hints', 'selected_hint = hint_markets', 'Markets Hint')]." # todo: CHANGED # todo: CONCEPT CASE
 lesson_economy_4: "[trade_icon] Obchod" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 lesson_economy_4_desc: "Teraz, [Concept('markets_with_icon','trhy')|e] nie sú nikdy úplne izolované od seba. Pohyb [Concept('goods_with_icon','tovary')|e] medzi dvoma [markets] sa nazýva [Concept('trade_with_icon','obchod')|e].\n\n[Concept('countries_with_icon','Krajiny')|e] môžu presúvať [goods] medzi [markets] pomocou svojej [Concept('merchant_capacity_with_icon','neobchodnou kapacitou')|e], čím vytvárajú zisk (alebo stratu). Okrem toho @burghers! [ShowPopTypeName('burghers')] žijúci v [market] budú vykonávať vlastný [trade].\n\nŠtandardne je Trade @automation! #high automatizovaný#! vo všetkých [markets], čo znamená, že akákoľvek [merchant_capacity], ktorou disponujete v danom [market], sa automaticky použije na najlepšie dostupné obchody. Odporúčame nechať všetok [trade] automatizovaný, kým nezískate viac skúseností s hrou.\n\nKeď na to príde, môžete sa o [trade] dozvedieť viac tu:\n$TAB$[Link('hints', 'selected_hint = hint_trade', '@hint! Trade Hint')]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 lesson_economy_5: "[food_icon] Potraviny" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 lesson_economy_5_desc: "Na záver, [Concept('pops_with_icon','populácie')|e] tiež produkujú a spotrebúvajú [Concept('food_with_icon','potraviny')|e].\n\n[food] sa vyrába hlavne @laborers! [ShowPopTypeName('laborers')] pracujúcimi v [rgo_with_icon|e] s [Concept('food_raw_materials','surovými potravinami')|e], ako napríklad [ShowGoodsName('wheat')], hoci aj @peasants! [ShowPopTypeName('peasants')] pracujúci v [Concept('subsistence_agriculture_with_icon','sebestačnom poľnohospodárstve')|e] prispievajú malým množstvom.\n\nKaždý [Concept('market_with_icon','trh')|e] má [Concept('food_stockpile_with_icon','zásoby potravín')|e], ktoré sa mesačne zvyšuje alebo znižuje. Ak [market] vyčerpá [food], [population] utrpí [Concept('starvation_with_icon','hladovanie')|e]. Stav [food] v [market] môžete vidieť v karte [market].\n\nO tom, ako funguje zásoba [food], sa môžete dozvedieť v [Link('hints', 'selected_hint = hint_food', '@hint! Food Hint')]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 lesson_admin_21: "[good_icon] Tovary" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 lesson_admin_21_desc: "Pokračujme skúmaním [Concept('goods','tovarmi')|e] vo vašich [Concept('markets_with_icon','trhov')|e]!\n\nAk to chcete urobiť, môžete kliknúť na [good_icon|e] tlačidlo [goods] v [market_icon] #high Market Card#!. To vás zavedie na záložku Goods Produkčného panelu, filtrovanú podľa tohto Marketu." # todo: CHANGED # todo: CONCEPT CASE
 lesson_admin_22: "[good_icon] Tovary" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 lesson_admin_22_desc: "Tu môžete vidieť všetky [Concept('goods_with_icon','tovary')|e] v konkrétnom [Concept('market_with_icon','trhu')|e].\n\n#weak Môžete odstrániť [market_icon] #high Market Card#!, aby ste videli Goods v celom vašom [country], vrátane všetkých Markets, kde vlastníte [locations]#!.\n\nMôžete zvýšiť [Concept('supply_with_icon','ponuka')|e] akéhokoľvek tovaru v [market] troma spôsobmi:\n\n$BULLET$ [rgo_icon] Rozšírenie [Concept('rgo','R.G.O.')|e]\n[rgo] môže byť rozšírené na produkciu [Concept('raw_materials_with_icon','suroviny')|e], ak [Concept('own','vlastniť')|e] príslušné [Concept('locations_with_icon','lokality')|e].\n\n$BULLET$ [building_icon|e] Stavaním [Concept('buildings','budovami')|e]\nHoci niektoré z nich môžu tiež vyrábať [raw_materials], [buildings] vynikajú v spracovaní [raw_materials] na [Concept('produced_goods_with_icon','vyrábané tovary')|e].\n\n$BULLET$ [import_icon|e] Importovaním cez [Concept('trade_with_icon','obchod')|e]\nVždy môžete importovať [goods], ktoré potrebujete z iných [markets], ak máte k dispozícii [Concept('merchant_capacity_with_icon','neobchodnej kapacite')|e].\n\n#weak Napríklad môžete vytvoriť $game_concept_rgo$ na zber @wool! [ShowGoodsName('wool')], potom postaviť @cloth_guild![ShowBuildingTypeName('cloth_guild')] [Concept('building','budovu')], aby ste túto vlnu premenili na @cloth! [ShowGoodsName('cloth')], ktorý používajú mnohé ďalšie [buildings], [pops] a [armies].#!" # todo: CHANGED # todo: CONCEPT CASE
 lesson_admin_25: "[building_icon] Budovy" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 lesson_admin_25_desc: "Na záver sa porozprávajme o [Concept('buildings_with_icon','budovy')|e].\n\nPoďme sa pozrieť na celý zoznam [buildings], ktoré máte, alebo ktoré môžete postaviť vo vašom [Concept('country_with_icon','krajine')|e]. K nemu sa dostanete kliknutím na #high Building Tab#! v Produkčnom paneli.\n\nAlternatívne môžete stlačiť tlačidlo [building_icon] Building v [market_icon]#high Market Card#!, aby ste videli zoznam Budov v tomto konkrétnom Markete." # todo: CHANGED # todo: CONCEPT CASE
 lesson_admin_26: "[building_icon] Budovy" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 lesson_admin_26_desc: "Na rozdiel od [rgo_with_icon|e] všetky [Concept('buildings_with_icon','budovy')|e] potrebujú na svoju činnosť vstupné [Concept('goods_with_icon','tovary')|e], ale len niektoré produkujú [goods] a teda [Concept('wealth_with_icon','bohatstvo')|e].\n\nIné [buildings] majú rôzne účely, napríklad poskytovať [Concept('manpower_with_icon','živá sila')|e], umožniť nábor [Concept('regulars_with_icon','stáli vojaci')|e], zlepšiť váš [Concept('crown_power_with_icon','moc koruny')|e] alebo zvýšiť [Concept('control_with_icon','kontrola')|e] ich [Concept('location_with_icon','lokalita')|e].\n\nBudovy, rovnako ako [Concept('rgo_with_icon','R.G.O.')|e], majú [Concept('construction_with_icon','výstavba')|e] náklady a ich výstavba zaberie určitý herný čas. Po postavení každá [building] potrebuje prístup k vstupným [goods] z ich [market], aby správne fungovala.\n\n#weak Pamätajte, že váš [Concept('country','krajina')|e] môže mať viac ako jeden [market]. [market_icon] #high Market Card#! v hornej časti #high Production Panel#! vám umožňuje filtrovať jeho obsah na základe Marketu.#!\n\nO [buildings] sa môžete dozvedieť viac v príslušných nápovedách:\n[Link('hints', 'selected_hint = hint_lack_pop_promotion_to_fill_buildings', '@hint! Buildings missing employees')]\n[Link('hints', 'selected_hint = hint_unprofitable_buildings', '@hint! Unprofitable Buildings')]\n[Link('hints', 'selected_hint = hint_has_buildings_missing_input', '@hint! Building Missing inputs')]" # todo: CHANGED # todo: CONCEPT CASE
 lesson_admin_27: "[mission_icon] Misie" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 lesson_admin_27b: "[mission_icon] Misie" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 lesson_admin_27_desc: "Nakoniec si pozrime [Concept('missions_with_icon','misie')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 lesson_admin_28: "[mission_icon] Misie" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 lesson_admin_28_desc: "[Concept('missions_with_icon','Misie')|e] sú balíčky úloh, ktoré vám poskytnú vodítko, čo presne môžete robiť v #high Europa Universalis V#!. Táto hra je veľká a je tu veľa sa naučiť. To je súčasť zábavy!\n\nPráve ste dokončili úvod @adm! #high Economy Playstyle#!, čo znamená, že teraz máte prístup k misiám, ktoré vám pomôžu hlbšie preskúmať, ako môžete využiť všetky panely a mechaniky, o ktorých sme práve hovorili.\n\nAby sme vám uľahčili prechod k ďalšiemu obsahu, pripravili sme pre vás niekoľko misií na začiatok." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 lesson_admin_29: "@caesar! Zhrnutie" # todo: NEW TRANSLATION
 lesson_admin_29_desc: "Výborne! Teraz máte niekoľko [Concept('missions_with_icon','misií')|e], ktoré sú dostupné v #high záložke Misií#!. Keď dokončíte všetky [Concept('missions','misie')] pre váš herný štýl, budete vyzvaní absolvovať podobný Walkthrough pre iný herný štýl.\n\nVeľa šťastia!" # todo: NEW TRANSLATION # todo: CONCEPT CASE

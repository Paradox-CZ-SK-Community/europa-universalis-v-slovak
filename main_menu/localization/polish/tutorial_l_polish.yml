 lesson_diplomacy_9: "@diplomacy! Diplomacia" # todo: NEW TRANSLATION
 lesson_diplomacy_9_desc: "Ale nie všetka politika sa odohráva v našom kráľovstve. Pozrime sa teraz na [Concept('diplomacy_with_icon','diplomaciu')|e], začnúc #high záložkou Vzťahy#! v @diplomacy_panel![Link('diplomacy', '', ' Diplomacy Panel')]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 lesson_diplomacy_open_diplomacy: "Otvorte panel diplomacie" # todo: NEW TRANSLATION
 lesson_diplomacy_open_relations: "Otvorte záložku Vzťahy" # todo: NEW TRANSLATION
 lesson_diplomacy_open_current_relations: "Otvorte podzáložku Aktuálne vzťahy" # todo: NEW TRANSLATION
 lesson_diplomacy_10: "@diplomacy! Diplomacia" # todo: NEW TRANSLATION
 lesson_diplomacy_10_desc: "Nezáleží na tom, ako mocní sa stanete, budete sa musieť zapojiť do [Concept('diplomacy_with_icon','diplomacie')|e], ak chcete prežiť cez veky, pretože budete potrebovať podpisovať [Concept('alliances_with_icon','aliancie')|e] na ochranu proti nepriateľom alebo vyjednávať o [Concept('peace_with_icon','mier')|e] po dlhej [Concept('war_with_icon','vojne')|e].\n\nDve dôležité veci na zváženie:\n\n$BULLET$Budete musieť minúť [Concept('diplomats_with_icon','diplomati')|e], aby ste vykonali [Concept('diplomatic_action_with_icon','diplomatická akcia')|e] s inými [Concept('countries_with_icon','krajinami')|e], ako napríklad [Concept('improve_relations_with_icon','zlepšiť vzťahy')|e], vytvárať [Concept('spy_networks_with_icon','špionážne siete')|e] alebo vyhlásiť [Concept('wars_with_icon','vojny')|e]. Aktuálnych [diplomats] vidíte na #high hornom paneli (Top Bar)#!.\n\n$BULLET$Diplomatické [Concept('treaties_with_icon','dohody')|e] s inými [countries], ako [alliance] alebo [Concept('subject_with_icon','vazal')|e], zaberajú časť [Concept('diplomatic_capacity_with_icon','diplomatickej kapacity')|e]. Dostupnú [diplomatic_capacity] môžete zvýšiť vynaložením [Concept('gold_with_icon','dukátmi')|e] z panelu rozpočtu (Budget Panel)." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 lesson_diplomacy_11: "@diplomacy! Aktuálne vzťahy" # todo: NEW TRANSLATION
 lesson_diplomacy_11_desc: "Prejdime na #high podzáložku Aktuálne vzťahy#!, aby sme sa trochu hlbšie pozreli na to, do čoho je zapojená vaša [Concept('country_with_icon','krajina')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 lesson_diplomacy_12: "@diplomacy! Aktuálne vzťahy" # todo: NEW TRANSLATION
 lesson_diplomacy_12_desc: "#high Podzáložka Aktuálne vzťahy#! obsahuje informácie o všetkých [Concept('treaties_with_icon','dohody')|e], ktoré ste podpísali s inými [Concept('countries_with_icon','krajinami')|e], ako aj o [Concept('international_organizations_with_icon','medzinárodných organizáciách')|e], ktorým patríte.\n\nAk máte [Concept('subjects_with_icon','vazali')|e], budete ich môcť spravovať z tohto panela." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 lesson_diplomacy_13: "[country_icon] Známe krajiny" # todo: NEW TRANSLATION
 lesson_diplomacy_13_desc: "Ďalej si pozrime [Concept('countries_with_icon','krajiny')|e], ktoré sú vám známe." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 lesson_diplomacy_open_known_countries: "Otvorte podzáložku Známe krajiny" # todo: NEW TRANSLATION
 lesson_diplomacy_14: "[country_icon] Known Countries" # todo: NEW TRANSLATION
 lesson_diplomacy_14_desc: "Z tejto #high podzáložky#! môžete vidieť všetky [Concept('countries_with_icon','krajiny')|e], ktoré ste [Concept('discovered_with_icon','objavené')|e]. Predvolene bude filtrovaná tak, aby ste videli len [Concept('countries','krajiny')] v rámci vášho [Concept('diplomatic_range_with_icon','diplomatického dosahu')|e].\n\nToto je tiež dobré miesto na zobrazenie vášho [Concept('great_power_score_with_icon','skóre veľmoci')|e]. Ak je váš [Concept('great_power_score','skóre veľmoci')] medzi najvyššími na svete, ste považovaný za [Concept('great_power_with_icon','veľmoc')|e], čo vám umožní vyvíjať väčší vplyv na susedov." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 lesson_diplomacy_15: "[international_organizations_icon] Organizácie" # todo: NEW TRANSLATION
 lesson_diplomacy_15_desc: "Poďme sa pozrieť na [Concept('international_organizations_with_icon','medzinárodné organizácie')|e]!" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 lesson_diplomacy_open_known_orgs: "Otvorte podzáložku Organizácie" # todo: NEW TRANSLATION
 lesson_diplomacy_16: "[international_organization_icon] Organizácie" # todo: NEW TRANSLATION
 lesson_diplomacy_16_desc: "Odtiaľto môžete zobraziť všetky [international_organization_icon] [Concept('international_organizations','medzinárodné organizácie')|e] vo svete. Medzi nimi sú organizácie ako [GetUniqueInternationalOrganization('hre').GetName], [GetUniqueInternationalOrganization('catholic_church').GetName] alebo [Concept('personal_unions_with_icon','personálne únie')|e].\n\nAké akcie sú pre vás dostupné v rámci [Concept('international_organizations','medzinárodných organizácií')], ktorých ste súčasťou, závisí od samotnej organizácie, ako aj od akéhokoľvek [Concept('special_status','špeciálneho statusu')|e], ktorý v nej môžete mať." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 lesson_diplomacy_17: "[country_icon] Zahraničné krajiny" # todo: NEW TRANSLATION
 lesson_diplomacy_17_desc: "Venujme chvíľu zahraničným [Concept('countries_with_icon','krajine')|e]. Choďte a @leftclick!#high kliknite#! na krajinu na mape, aby ste otvorili panel.\n\n#weak Možno budete musieť oddialiť zobrazenie, aby ste vybrali [country], pretože pri priblížení vyberáte [Concept('locations_with_icon','lokality')|e].#!" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 lesson_diplomacy_open_foreign_country: "Otvorte panel Zahraničnej krajiny pomocou @leftclick!#high kliknutia#! na krajinu na mape" # todo: NEW TRANSLATION
 lesson_diplomacy_18: "[countries_icon] Zahraničné krajiny" # todo: NEW TRANSLATION
 lesson_diplomacy_18_desc: "Odtiaľto môžete vidieť prehľad o zahraničnej [Concept('country_with_icon','krajinu')|e], vrátane jej [Concept('ruler_with_icon','panovníka')|e]. Záložka [Concept('diplomacy_with_icon','diplomacia')|e] sa podobá sekcii Aktuálne vzťahy, o ktorej sme hovorili, a zobrazuje veci ako [Concept('allies_with_icon','spojenci')|e], [Concept('rivals_with_icon','rivali')|e] a [Concept('subjects_with_icon','vazali')|e].\n\nPre teraz sa pozrime na zvýraznenú kartu diplomacie, ktorá obsahuje tlačidlá na rýchly prístup k bežným [Concept('diplomatic_actions_with_icon','diplomatickým akciám')|e], ako napríklad zlepšovanie [Concept('opinion_with_icon','názor')|e] alebo získavanie [Concept('favors_with_icon','láskavosti')|e].\n\n#weak Môžete tiež #high kliknúť pravým tlačidlom myši#! na názov krajiny alebo vlajku kdekoľvek v hre, aby ste otvorili #high Kontextové menu#!#!." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 lesson_diplomacy_19: "[diplomatic_action_icon] Diplomatické akcie" # todo: NEW TRANSLATION
 lesson_diplomacy_19b: "[diplomatic_action_icon] Diplomatické akcie" # todo: NEW TRANSLATION
 lesson_diplomacy_19_desc: "Okrem bežných [Concept('diplomatic_actions_with_icon','diplomatických akcií')|e] prístupných cez kartu [Concept('diplomacy_with_icon','diplomaciu')|e], môžete tiež #high kliknúť#! na názov [Concept('country_with_icon','krajina')|e], aby ste prešli na #high záložku Akcie (Actions Tab)#! v [Link('diplomacy', '', '@diplomacy_panel! Diplomacy Panel')], pričom konkrétny krajine, ktorý práve prezeráte, bude už predvybraný." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 lesson_diplomacy_open_actions: "Otvorte diplomatické akcie tak, že @leftclick!#high kliknete#! na tlačidlo Diplomatické akcie." # todo: CHANGED (predtym: Otvorte diplomatické akcie tak, že @leftclick! high kliknete ! na názov v karte krajiny)
 lesson_diplomacy_20: "[diplomatic_action_icon] Diplomatické akcie" # todo: NEW TRANSLATION
 lesson_diplomacy_20b: "[diplomatic_action_icon] Diplomatické akcie" # todo: NEW TRANSLATION
 lesson_diplomacy_20_desc: "Z #high záložky Diplomatické akcie#! môžeme vykonať rôzne [Concept('diplomatic_actions_with_icon','diplomatické akcie')|e]. Keďže sme sem prešli výberom [Concept('country_with_icon','krajinou')|e] na mape, tá konkrétna [Concept('country','krajina')] je už predvybraný ako cieľ akcie.\n\nExistuje veľa rôznych diplomatických akcií, ktoré môžete vykonať, z ktorých niektoré sú použiteľné len v určitých situáciách. Ak chcete jednat s inými krajinami mierumilovne, sú tri veci, o ktoré by ste sa mali starať: [Concept('opinion_with_icon','názor')|e], [Concept('trust_with_icon','dôvera')|e] a [Concept('favors_with_icon','láskavosti')|e].\n\nPre teraz si vyskúšajme použiť akciu [Concept('improve_relations_with_icon','zlepšiť vzťahy')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 lesson_diplomacy_confirm_diplo_action: "@leftclick! Kliknite na tlačidlo Zlepšiť názor pre vybranú krajinu" # todo: NEW TRANSLATION
 lesson_diplomacy_21: "[diplomatic_action_icon] Diplomatické akcie" # todo: NEW TRANSLATION
 lesson_diplomacy_21_desc: "Dobrá práca! Keď potvrdíte svoju [Concept('diplomatic_action_with_icon','diplomatickú akciu')|e], vaši [Concept('diplomats_with_icon','diplomatov')|e] odcestujú do príslušného [Concept('country_with_icon','krajiny')|e] a začnú vykonávať vybranú akciu.\n\nAkcia [Concept('improve_relation_with_icon','zlepšiť vzťah')|e] nemá okamžitý efekt; namiesto toho postupne zvyšuje [Concept('opinion_with_icon','názor')|e] v priebehu mesiacov a rokov. To isté platí aj pre mnohé ďalšie [Concept('diplomatic_actions','diplomatické akcie')]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 lesson_admin_28b_desc: "[Concept('missions_with_icon','Misie')|e] sú balíčky úloh, ktoré vám poskytnú vodítko, čo presne môžete robiť v #high Europa Universalis V#!. Táto hra je veľká a je tu veľa sa naučiť. To je súčasť zábavy!\n\nPráve ste dokončili úvod @dip! #high Politics Playstyle#!, čo znamená, že teraz máte prístup k misiám, ktoré vám pomôžu hlbšie preskúmať, ako môžete využiť všetky panely a mechaniky, o ktorých sme práve hovorili.\n\nAby sme vám uľahčili prechod k ďalšiemu obsahu, pripravili sme pre vás niekoľko misií na začiatok." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 lesson_diplomacy_has_mission_active: "Spustiť politickú misiu" # todo: NEW TRANSLATION
 lesson_military_open_military: "Otvorte vojenský panel" # todo: NEW TRANSLATION
 lesson_military_0: "[war_icon] $PLAYER_PLAYSTYLE_MILITARY$ Walkthrough" # todo: NEW TRANSLATION
 lesson_military_0b: "[war_icon] $PLAYER_PLAYSTYLE_MILITARY$ Walkthrough" # todo: NEW TRANSLATION
 lesson_military_0_desc: "Ďalej si prezrieme $PLAYER_PLAYSTYLE_MILITARY$ Walkthrough! Najprv sa pozrime na vojenský panel." # todo: NEW TRANSLATION
 lesson_military_1: "@military_panel! Vojenské" # todo: NEW TRANSLATION
 lesson_military_1_desc: "Tu uvidíte prehľad vašich [Concept('armies_with_icon','armád')|e]. V prípade [Concept('war_with_icon','vojne')|e] môžu byť [armies] presunuté po mape, aby sa zapojili do boja s nepriateľskými [armies] a [Concept('occupy_with_icon','okupovať')|e] nepriateľské [Concept('locations_with_icon','lokalitami')|e].\n\n[armies] sa skladajú z [Concept('regiments_with_icon','plukov')|e] troch rôznych typov:\n\n$BULLET$[Concept('levies_with_icon','Branci')|e] sú povolané z vášho [Concept('population_with_icon','populácie')|e] cez vaše [Concept('estates_with_icon','stavy')|e], a sú všeobecne slabé, ale lacné na udržanie.\n\n$BULLET$[Concept('regulars_with_icon','Stáli vojaci')|e] sú profesionálni vojaci, ktorých musíte platiť a cvičiť, a ktorí vyžadujú [Concept('manpower_with_icon','živá sila')|e].\n\n$BULLET$[Concept('mercenaries_with_icon','Žoldnieri')|e] je možné najať za [Concept('gold_with_icon','dukáty')|e], aby zomierali za vaše [country]... pokiaľ im budete platiť.\n\nNa začiatku hry sa väčšina [Concept('countries_with_icon','krajiny')|e] primárne spolieha na [levies] zo svojich [estates] pri vedení [wars], ale postupom času a s dosahovaním [Concept('advances_with_icon','pokrokmi')|e] dôjde k presunu k profesionálnym [regiments], ktoré vyžadujú [manpower].\n\n[Concept('navies_with_icon','Námorné sily')|e] sú námorný ekvivalent [armies] a nasledujú podobný vzorec, s [Concept('navy_levies_with_icon','povolané loďstvom')|e] a profesionálnymi [Concept('ships_with_icon','loďami')|e], ktoré vyžadujú [Concept('sailors_with_icon','námorníci')|e]." # todo: CHANGED # todo: CONCEPT CASE
 lesson_military_2: "[manpower_icon] Živá sila" # todo: NEW TRANSLATION
 lesson_military_2_desc: "Chvíľu sa pozrime na [Concept('manpower_with_icon','živú silu')|e]. Ako sme spomenuli, [Concept('regular_regiments_with_icon','stále pluky')|e] vyžadujú [manpower] nielen k náboru, ale aj k doplneniu, ak utrpia obete.\n\n[manpower] pochádza z vojenských [Concept('buildings_with_icon','budov')|e], ktoré zamestnávajú @soldiers! [ShowPopTypeName('soldiers')] [pops].\n\n#weak Na začiatku môžete generovať [Concept('manpower','živú silu')] postavením [ShowBuildingTypeName('sergeantry')] [building] cez Produkčný panel, ale s objavovaním nových [Concept('advances_with_icon','pokrokmi')|e] získate prístup k ďalším zdrojom.#!\n\n@hint! O [manpower] sa môžete dozvedieť viac v [Link('hints', 'selected_hint = hint_manpower', 'Manpower Hint')]." # todo: CHANGED # todo: CONCEPT CASE
 lesson_military_war_0: "[casus_belli_icon] Casus Belli" # todo: NEW TRANSLATION
 lesson_military_war_0_desc: "Keďže sme už prešli [Concept('armies_with_icon','armády')|e] a [Concept('navies_with_icon','námorné sily')|e], mali by sme sa všeobecne porozprávať o [Concept('war_with_icon','vojnu')|e] a [Concept('casus_belli_with_icon','casus belli')|e].\n\n[war] začína, keď [Concept('country_with_icon','krajina')|e] vyhlási [war] proti inému. [war] možno vyhlásiť z legitímneho dôvodu, známeho ako [Concept('casus_belli_with_icon','casus Belli')|e], čo vám uľahčí mierové rokovania. Ísť do [war] bez [casus_belli] je stále možné, ale bude to mať väčší dopad na vašu [Concept('stability_with_icon','stabilitu')|e] a [Concept('opinion_with_icon','názor')|e] vašich susedov.\n\nNajlepší spôsob, ako získať Casus Belli, je požiadať oň váš [Concept('parliament_with_icon','parlament')|e] prostredníctvom panelu vlády. Vytváranie [Concept('spy_networks_with_icon','špionážne siete')|e] v cudzej [country] vám tiež umožní vytvoriť Casus Belli proti nim, ak máte v ich zemi [Concept('cores_with_icon','jadrám')|e] alebo ak ste [Concept('rivals_with_icon','rivali')|e].\n\n#weak Pri vyhlasovaní [war] majte na pamäti, že [Concept('allies_with_icon','spojenci')|e] a [Concept('subjects_with_icon','vazali')|e] vašich nepriateľov pravdepodobne vstúpia na ich stranu! #!\n\n@hint! Viac o [casus_belli] sa dozviete v [Link('hints', 'selected_hint = hint_casus_belli', 'Casus Belli Hint')]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 lesson_military_war_1: "[war_icon] Vojna" # todo: NEW TRANSLATION
 lesson_military_war_1_desc: "Každú [Concept('war_with_icon','vojnu')|e] sa vyhráva hromadením [Concept('war_score_with_icon','vojnového skóre')|e], ktoré môžete získať vyhraním [Concept('battles_with_icon','bitky')|e], obsadením [Concept('locations_with_icon','lokalitami')|e] nepriateľa a, čo je najdôležitejšie, dosiahnutím [Concept('war_goal','vojnovým cieľom')|e]. Každá [Concept('war_with_icon','vojna')|e] je vedená s [Concept('war_goal','vojnovým cieľom')|e], ktorý závisí od [Concept('casus_belli_with_icon','casus belli')|e] útočníka.\n\nVojna má dvoch [Concept('war_leaders_with_icon','vodcov vojny')|e], z ktorých každý môže mať viacerých [Concept('war_allies_with_icon','vojnových spojencov')|e]. Nakoniec [Concept('war','vojna')] skončí, keď sa obe strany dohodnú na [Concept('peace_treaty_with_icon','mierovú dohodu')|e].\n\nAj keď môžete počas vojny [occupy] nepriateľské územia, skutočne sa nezmenia vlastníci, kým vojnou neskončí a [peace_treaty] neschváli prenos [Concept('ownership','vlastníctvo')|e].\n\nO [war], [battles] a [occupation] sa môžete dozvedieť viac v príslušných tipoch:\n[Link('hints', 'selected_hint = hint_war', '@hint! War Hint')]\n[Link('hints', 'selected_hint = hint_battle', '@hint! Battle Hint')]\n[Link('hints', 'selected_hint = hint_siege_and_occupation', '@hint! Occupation and Siege Hint')]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 lesson_military_war_2: "[war_exhaustion_icon] Únava z vojny" # todo: NEW TRANSLATION
 lesson_military_war_2_desc: "Počas [Concept('war_with_icon','vojny')|e] budete nabaľovať [Concept('war_exhaustion_with_icon','vojnová vyčerpanosť')|e]. Ak bude príliš vysoká, vaše [Concept('armies_with_icon','armády')|e] a [Concept('levies_with_icon','branci')|e] budú v [Concept('battle_with_icon','bitke')|e] horšie a vaša [Concept('population_with_icon','populácia')|e] začne klesať.\n\nNajlepší spôsob, ako znížiť [Concept('war_exhaustion','vojnovú vyčerpanosť')], je byť v [Concept('peace_with_icon','mieri')|e]. Existujú však určité [Concept('laws_with_icon','zákony')|e] a [Concept('estate_privileges_with_icon','privilégiá stavov')|e], ktoré časom znižujú [Concept('war_exhaustion','vojnovú vyčerpanosť')].\n\n@hint! Viac o [war_exhaustion] sa dozviete v [Link('hints', 'selected_hint = hint_war_exhaustion', 'War Exhaustion Hint')]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 lesson_military_war_3: "[war_icon] Kontrola nových území" # todo: NEW TRANSLATION
 lesson_military_war_3_desc: "Nové územia, ktoré dobyjete, vám okamžite nebudú užitočné. Pamätajte, že potrebujete [Concept('control_with_icon','kontrola')|e], aby vaše [Concept('locations_with_icon','lokality')|e] mali nejaký úžitok, a to môže vyžadovať značné investície do infraštruktúry na rozšírenie dosahu vášho [Concept('proximity_with_icon','blízkosti')|e].\n\nOkrem toho bude [Concept('conquered_with_icon','dobytá')|e] územie trpieť vysokými penalizáciami, kým ho [Concept('integrate_with_icon','integrovať')|e] pomocou [Concept('cabinet_action_with_icon','akcie kabinetu')|e]. Z tohto dôvodu je často múdre vytvoriť na novo dobitom území [Concept('subject_with_icon','vazala')|e], aby za vás územie spravoval.\n\n#italic Ak sa chcete dozvedieť viac o [integration], môžete si pozrieť [Link('hints', 'selected_hint = hint_has_conquered_provinces', '@hint! $hint_has_conquered_provinces$')] Hint." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 lesson_military_open_geopolitics: "Otvorte geopolitický panel" # todo: NEW TRANSLATION
 lesson_military_8: "@geopolitics_panel! Geopolitika" # todo: NEW TRANSLATION
 lesson_military_8_desc: "Na záver si pozrime @geopolitics_panel! #high Geopolitics Panel#! a povieme si niečo o ďalšej funkcii, ktorá môže byť dôležitá v neskorších [Concept('ages','vekov')|e]: [Concept('exploration_with_icon','prieskumu')|e] a [Concept('colonization_with_icon','kolonizácia')|e]!." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 lesson_military_9: "@geopolitics_panel! Geopolitics" # todo: NEW TRANSLATION
 lesson_military_9_desc: "Nakoniec, a obzvlášť počas [ShowAgeName('age_3_discovery')], mnoho [countries_with_icon|e] začne svoje [exploration_with_icon|e] snahy. Z tohto panela môžete vidieť prehľad vašich prieskumu príležitostí, ako aj všetku vhodnú pôdu pre [colonization_with_icon|e], pokiaľ máte prostriedky sa k nej dostať. Získate [colonial_range_with_icon|e], ak preskúmate príslušné [advances_with_icon|e].\n\nAk [Concept('own','vlastniť')|e] akékoľvek [coastal] [location_with_icon|e], budete mať tiež prístup k námornej záložke, kde môžete vidieť zoznam [seazones_with_icon|e], ktoré sú pre vás relevantné, [maritime_presence_with_icon|e], ktoré v nich máte, a nebezpečenstvá [pirates_with_icon|e] a [privateers_with_icon|e]." # todo: CHANGED (predtym: Nakoniec, a obzvlášť počas [ShowAgeName('age_3_discovery')], mnoho [Concept('countries_with_icon','krajiny')|e] začne sv) # todo: CONCEPT CASE
 lesson_admin_28c_desc: "[Concept('missions_with_icon','Misie')|e] sú balíčky úloh, ktoré poskytnú isté usmernenie, čo presne môžete robiť v #high Europa Universalis V#!. Táto hra je veľká a je v nej veľa vecí, ktoré sa dá naučiť. To je súčasť zábavy!\n\nPráve ste dokončili @mil! #high Expansion Playstyle#! úvod, čo znamená, že teraz máte prístup k misiám, ktoré vám pomôžu hlbšie preskúmať, ako môžete využiť všetky tie panely a mechaniky, o ktorých sme práve hovorili.\n\nAby sme vám uľahčili prechod k tomu, čo príde ďalej, pripravili sme niekoľko misií, ktoré vám pomôžu začať." # todo: NEW TRANSLATION # todo: CONCEPT CASE

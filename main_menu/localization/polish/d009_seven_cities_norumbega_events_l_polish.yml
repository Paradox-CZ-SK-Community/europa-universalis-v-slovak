l_polish:
 seven_cities_norumbega.1.title: "Rieka, ale žiadne mesto" # todo: NEW TRANSLATION
 seven_cities_norumbega.1.desc: "Po troch mesiacoch plavby proti prúdu od pobrežia Nového Anglicka dorazila výprava na koniec splavnej časti rieky. Niet tu žiadneho opevneného mesta. Podľa všetkého, čo prieskumné skupiny zistili, niet žiadneho mesta nikde na rieke Penobscot. Brehy rieky husto zarástli lesom; na lúkach v zákrutách rieky ležia dediny Abenakiov; miestni sú ochotní obchodovať s kožušinami a cez tlmočníka sa pýtajú, čo sme čakali, že nájdeme. Kronikár na to nemá dobrú odpoveď. [target_leader.GetName] píše správu v malej zrubovej pevnosti pri ústí rieky a čaká, kým sa na jar roztopí ľad, aby sa vydal späť." # todo: NEW TRANSLATION
 seven_cities_norumbega.1.a: "Spusťte zástavu. Tá legenda bola len rybárskou historkou." # todo: NEW TRANSLATION
 seven_cities_norumbega.1.historical_info: "Norumbega sa na európskych mapách objavuje po prvý raz v 30. rokoch 16. storočia a označuje oblasť niekde na pobreží dnešného Maine. V čase skutočného európskeho prieskumu údolia Penobscotu o storočie neskôr už legenda hovorila o opevnenom meste z krásneho kameňa na hornom toku rieky. Základom toho všetkého sa zrejme stali zveličené správy jedinej francúzskej výpravy, ktorá v roku 1525 nakrátko obchodovala s Abenakiami na dolnom toku Penobscotu. Ich domy s dlhými klenutými strechami z kôry opísala slovami, aké by sa hodili bohatším obyvateľom Saint-Malo, ako čosi pripomínajúce európske mesto s kamennými hradbami." # todo: NEW TRANSLATION
 seven_cities_norumbega.2.title: "Obývaná krajina" # todo: NEW TRANSLATION
 seven_cities_norumbega.2.desc: "Krajina, do ktorej sme vstúpili, nie je mestom v zmysle tej legendy, no je obývaná. Na brehoch Penobscotu medzi ústím rieky a vodopádmi sa rozprestierajú dediny s domami obloženými kôrou, ohradené záhrady, obradné mohyly a dobre zhotovené kanoe z kôry. Náčelník Abenakiov z najväčšej dediny prijal [target_leader.GetName] s náležitou úctou a je ochotný poskytnúť pri rieke pozemok pre francúzsku či anglickú obchodnú stanicu. Obchod s kožušinami je skutočný. Opevnené mesto nie. Aj tak sa však môže oplatiť túto krajinu ovládnuť." # todo: NEW TRANSLATION
 seven_cities_norumbega.2.a: "Založte stanicu. Obchod s kožušinami prítomnosť ospravedlňuje." # todo: NEW TRANSLATION
 seven_cities_norumbega.2.historical_info: "Spoločensko-politická štruktúra Abenakiov v ranom období kontaktu sa zakladala na dedinách rozšírených rodín, ktorým vládli dediční sagamori. Sezónne sa presúvali medzi poľnohospodárskymi sídliskami na riečnych nivách a pobrežnými loviskami rýb. Európskym obchodníkom tento systém vyhovoval: poskytoval im spoľahlivých obchodných partnerov, stály prísun kožušín a kukurice a politickú roztrieštenosť, ktorá bránila tomu, aby niektorý z kmeňových útvarov Abenakiov diktoval podmienky obchodu. Norumbega ako opevnené mesto bola výmyslom, no obchod s kožušinami na Penobscote, na ktorý legenda poukazovala, pretrval vyše dvoch storočí." # todo: NEW TRANSLATION
 seven_cities_norumbega.3.title: "Opevnené mesto na rieke" # todo: NEW TRANSLATION
 seven_cities_norumbega.3.desc: "Krajina, do ktorej sme vstúpili, je presne taká, ako ju opisovali mapy. Rieka je hlboká a čistá a jej splavná časť siaha štyridsať míľ do vnútrozemia. Na konci splavnej časti, na západnom brehu, objavila výprava opevnené mesto: kamenné hradby v európskom štýle, ústredné námestie, veľký kamenný dom so bridlicovou strechou a trhovisko. Obyvateľstvo je zmiešané: väčšinu tvoria Abenakiovia, no náčelník hovorí skomolenou starou nórčinou, ktorej učenec latinčiny v družine čiastočne rozumie. V kamennej svätyni na ústrednom námestí sa navyše nachádza jediný železný meč, očividne škandinávskej výroby. Podľa náčelníka tu žijú od čias jeho praprapradeda. [target_leader.GetName] si robí poznámky rýchlejšie než kronikár." # todo: NEW TRANSLATION
 seven_cities_norumbega.3.a: "Podpíšte zmluvu. Našli sme krajinu aj zlato." # todo: NEW TRANSLATION
 seven_cities_norumbega.3.historical_info: "Európske predstavy o stratenej nórskej kolónii, ktorá prežila vo vnútrozemí Severnej Ameriky, kolovali po stáročia. Občas im dodali dôveryhodnosť ojedinelé archeologické nálezy — Newportská veža, Kensingtonský runový kameň, Maine Penny či Vinlandská mapa — no všetky sa napokon ukázali ako pochybného pôvodu alebo priam falzifikáty. Skutočné archeologické dôkazy o prítomnosti Nórov v Severnej Amerike sa obmedzujú na L'Anse aux Meadows na Newfoundlande a zopár ojedinelých nálezov, ktoré sú zlučiteľné s krátkymi výpravami Nórov južnejšie. Opevnené kamenné mesto škandinávskeho pôvodu na Penobscote nikdy neexistovalo." # todo: NEW TRANSLATION
 seven_cities_norumbega.10.title: "Muž, ktorý kráčal" # todo: NEW TRANSLATION
 seven_cities_norumbega.10.desc: "Čaká na móle, ešte kým naložia posledné sudy s vodou: bosý, dohneda opálený, oblečený v tom, čo mu dali tri rôzne prístavy. [target_character.GetName] rozpráva svoj príbeh s istotou človeka, ktorý ho už mnohokrát opakoval. Pred rokmi ho vyplavilo na vzdialený breh západného oceánu. Potom kráčal pozdĺž pobrežia rok či dlhšie, kým ho z jedného severného výbežku neodviezla rybárska posádka. Niekde uprostred tej cesty prešiel cez Norumbegu a rozpráva o tamojších stĺpoch z krištáľu a striebra, o pánoch nesených v nosidlách ovešaných perlami. Lodivodi ho žiadajú, aby im ukázal miesto na mape, no on len odpovedá, že žiadna mapa nikdy neukázala nič správne." # todo: NEW TRANSLATION
 seven_cities_norumbega.10.a: "Prijmite ho na palubu. Prešiel cestu, po ktorej sa chystáme plaviť." # todo: NEW TRANSLATION
 seven_cities_norumbega.10.b: "Zapíšte jeho výpoveď a nechajte ho na móle." # todo: NEW TRANSLATION
 norumbega_walker_signs_aboard_tt: "[target_character.GetName] nastupuje na palubu ako sprievodca" # todo: NEW TRANSLATION
 seven_cities_norumbega.10.historical_info: "V roku 1568 vysadili anglického námorníka Davida Ingrama a stovku jeho druhov pri Tampicu. Po bitke pri San Juan de Ulúa nemal John Hawkins dostatok zásob, aby ich odviezol domov. O jedenásť mesiacov neskôr vzala Ingrama na palubu francúzska loď pri pobreží Nového Škótska. Ak je to pravda, znamená to, že prešiel približne tritisíc míľ po domorodých obchodných cestách. V čase, keď ho v roku 1582 vypočúval okruh sira Francisa Walsinghama, jeho príbeh už zahŕňal mesto zvané Norumbega so stĺpmi zo striebra a krištáľu a kráľmi nesenými na rubínmi vykladaných kreslách. Richard Hakluyt tento príbeh uverejnil v roku 1589, no z ďalšieho vydania ho vynechal, lebo mu už pripadal neuveriteľný. Samotná cesta sa možno naozaj uskutočnila. Mesto nabralo na veľkoleposti až pri rozprávaní; vymámili ho z úbohého muža mocní, ktorí sa pýtali presne to, čo chceli počuť." # todo: NEW TRANSLATION
 seven_cities_norumbega.11.title: "Lodivodova kozmografia" # todo: NEW TRANSLATION
 seven_cities_norumbega.11.desc: "Sme na mori už mesiac a lodivod si po večernej stráži zvykol čítať pri stolíku s mapami. Jeho kniha je stará kozmografia, opakovane odpisovaná, až sa pobrežné línie rozmazali, no jej slová si zachovali neochvejnú istotu. Za istým výbežkom na pobreží, ku ktorému plávame, sľubuje kniha veľkú rieku a na jej hornom toku opevnené mesto múdrych ľudí, ktorí používajú slová znejúce ako cirkevná [ShowLanguageName('latin_language')]. Kňaz už začal hovoriť o stratenej [ShowReligionGroupAdjective('christian')] krajine na západe. Náš tlmočník poznamenáva, že autor počul [ShowLanguageNameWithNoTooltip('latin_language')] od muža, ktorý ho počul od iného muža, a že takto vznikajú knihy." # todo: NEW TRANSLATION
 seven_cities_norumbega.11.a: "Označte rieku presne tak, ako ju uvádza kniha." # todo: NEW TRANSLATION
 seven_cities_norumbega.11.b: "Odložte knihu. Plávame podľa lodného denníka a olovnice." # todo: NEW TRANSLATION
 seven_cities_norumbega.11.b.tt: "#italic Kozmografia sa vracia do truhlice a výprava sa riadi lodivodovým odhadom polohy#!" # todo: NEW TRANSLATION
 seven_cities_norumbega.11.historical_info: "Jean Alfonse, lodivod, ktorý v roku 1542 priviedol Robervalových kolonistov do Kanady, vo svojej #italic Cosmographie#! písal o tom, ako vplával na Norumbege do veľkej rieky a našiel mesto inteligentných ľudí hovoriacich jazykom podobným latinčine. Jeho správa sa spojila s názvom, ktorý Verrazzano zapísal na toto pobrežie v roku 1524, a kartografi už urobili ostatné. Mercatorova mapa sveta z roku 1569 zobrazuje Norumbegu ako mesto s vežičkami na širokej rieke a kartografi ju takmer celé storočie verne kopírovali jeden od druhého. Mesto však nikdy neexistovalo nikde inde než na tých kópiách." # todo: NEW TRANSLATION
 seven_cities_norumbega.12.title: "Dym nad riekou" # todo: NEW TRANSLATION
 seven_cities_norumbega.12.desc: "Kotvisko, kde sme sa pripravovali na cestu, zostalo za nami a pred nami sa otvára veľká rieka, široká a tmavá medzi zalesnenými brehmi. Kanoe priplávajú obchodovať skôr, než stihneme stiahnuť plachty, a tlmočníka nútia, aby sa spýtal: Kde je opevnené mesto? Ukazujú proti prúdu na svoju vlastnú dedinu, obydlia z kôry nad rybárskou hrádzou a dym stúpajúci do chladného vzduchu. Otázku položia znova, tentoraz s darmi, a potom tretí raz s ešte vzácnejšími darmi, no odpoveď sa nezmení. [target_leader.GetName] nariaďuje znova zabaliť obchodný tovar a mlčí." # todo: NEW TRANSLATION
 seven_cities_norumbega.12.desc_walker: "Muž, ktorý kráčal, sa od chvíle, čo sme vplávali do rieky, drží pri zábradlí a teraz ho muži pozorujú pozornejšie než brehy. Napokon ho predvedú pred dôstojníkov. Dlho skúma pobrežie a potom povie, že mesto leží ďalej. Vždy leží ďalej, za touto dedinou, za miestami, kam sa ktokoľvek z týchto ľudí kedy dostal. Muži mu chcú veriť, pretože viera dnes večer nič nestojí, kým opak by stál celú výpravu." # todo: NEW TRANSLATION
 seven_cities_norumbega.12.a: "Mapy nie sú hore nohami. Proti prúdu!" # todo: NEW TRANSLATION
 seven_cities_norumbega.12.b: "Zaznamenajte rieku takú, aká je, nie takú, akou sme si ju želali." # todo: NEW TRANSLATION
 seven_cities_norumbega.12.c: "Náš vodca sa už predral aj horším než dymom. Vpred." # todo: NEW TRANSLATION
 seven_cities_norumbega.12.historical_info: "Keď seriózne prieskumné výpravy napokon dorazili k Penobscotu, legenda po stretnutí s realitou neprežila. Samuel de Champlain vystúpil po rieke v roku 1604, aby vyriešil otázku Norumby, a našiel dediny Abenakiov, no ani stopu po meste, opevnenom či inom; sucho poznamenal, že nevidel nič z divov, o ktorých sa rozprávalo. Názov zostal na mapách ešte dve generácie, posúval sa pozdĺž pobrežia a postupne sa zmenšoval, až z máp úplne zmizol. Len máloktorú legendu ukončila tak dôkladne jediná výprava." # todo: NEW TRANSLATION
 seven_cities_norumbega.13.title: "Ostrov démonov" # todo: NEW TRANSLATION
 seven_cities_norumbega.13.desc: "Ostrov sa vynára z hmly presne tam, kde na mapách varujú pred jeho nebezpečenstvom, a vietor, ktorý cezň fúka, vydáva zvuk, o ktorom sa muži odmietajú navzájom rozprávať. Potom sa znovu ozve vyhliadková hliadka a ďalekohľad si v tichosti podávajú z ruky do ruky. Na brehu pod skalami horí oheň z naplaveného dreva, niekto ho prikladá a chráni pred vetrom. Vedľa neho stojí postava v handrách, ktoré kedysi bývali dobrým odevom, a oboma rukami na nás máva horiacou fakľou. Lodný tesár poznamená, že démoni zvyčajne nepotrebujú drevo na oheň." # todo: NEW TRANSLATION
 seven_cities_norumbega.13.a: "Spustite čln na vodu. Ktokoľvek stráži ten oheň, zaslúži si pomoc." # todo: NEW TRANSLATION
 seven_cities_norumbega.13.b: "Držte kurz. Niektoré ohne slúžia ako návnada." # todo: NEW TRANSLATION
 seven_cities_norumbega.13.b.tt: "#italic Ostrov zostáva za kormou a oheň na brehu horí, kým ho nepohltí hmla#!" # todo: NEW TRANSLATION
 norumbega_survivor_joins_tt: "[target_character.GetName] je zachránený z ostrova a pridáva sa k nášmu dvoru" # todo: NEW TRANSLATION
 seven_cities_norumbega.13.historical_info: "V roku 1542 šľachtic Roberval plával kolonizovať Kanadu s Jeanom Alfonsem ako lodivodom. Zistil, že jeho mladá príbuzná Marguerite de La Rocque si na palube našla milenca, a vysadil ju spolu s milencom a slúžkou na Ostrove démonov pri pobreží Newfoundlandu. Milenec, slúžka aj dieťa narodené na ostrove tam zomreli. Marguerite prežila sama viac než dva roky a strieľala medvede z arkebúz výpravy, až ju odtiaľ odviezli baskickí rybári. Po návrate do Francúzska vyrozprávala svoj príbeh navarrskej kráľovnej, ktorá ho zapísala do knihy. Len vďaka tomu sa o ňom dozvedáme. Samotný ostrov odvtedy upadol do zabudnutia; dnes si nikto nie je istý, ktorý ostrov to bol." # todo: NEW TRANSLATION

 mor_central_makhzen: "Maḵzan" # todo: NEW TRANSLATION
 mor_central_makhzen_desc: "Voľná autorita raného sultanátu musí ustúpiť skutočnému #italic maḵzan#!, stálemu aparátu vyberačov daní, tajomníkov a menovaných miestodržiteľov, ktorý prenáša vôľu trónu z poslušného jadra krajiny až do odbojných oblastí. Vďaka nemu prestáva byť ústredný štát záležitosťou samotného panovníka a stáva sa trvalou inštitúciou." # todo: NEW TRANSLATION

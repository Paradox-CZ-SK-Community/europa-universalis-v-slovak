l_polish:
 gra_frontier_warriors: "Hraniční bojovníci" # todo: NEW TRANSLATION
 gra_frontier_warriors_desc: "Pozdĺž #italic ṯuḡūr#! musí každá pohraničná dedina posielať svojich synov k línii signálnych ohňov a #italic ṯaḡrī#!, ktorý na toto volanie odpovie, pozná priesmyky, studne aj sezónne nájazdy kresťanských kráľov rovnako dobre, ako pastier pozná svoje kopce. Lacno ho vyzbrojíme, živíme zo zásob jeho vlastnej dediny a necháme samotnú hranicu, aby ho vyučila jedinému spôsobu boja, na ktorom záleží. Táto ľahká pechota zaťažuje našu pokladnicu len málo, no udrží horské cesty proti silám, ktoré by potrebovali zásoby na celú sezónu, aby sa vyrovnali jej znalosti terénu." # todo: NEW TRANSLATION
 gra_jamaa: "Džamá'a" # todo: NEW TRANSLATION
 gra_jamaa_desc: "Džamá'a, doslova „spoločenstvo“, je stálym poradným orgánom nášho emirátu, v ktorom sa schádzajú #italic qāḍī al-jamā'a#!, #italic wazīr#!, #italic ḥājib#! a #italic šayḵ al-ḡuzāt#!, ktorý popri našom dvore velí dobrovoľníkom z radov džihádistov Marinovcov. Zvolávame tento orgán v jeho mimoriadnej funkcii ako stelesnenie spoločenstva veriacich a meníme tak naše rozhodnutia o vojne, tribúte a nástupníctve z emírových svojvoľných príkazov na súhlas celého štátu. Táto rada bráni jednostranným ústupkom vynúteným na rozdelenom emiráte a zabezpečuje, aby nijaká frakcia — kresťanský kráľ, maghrebský sultán ani pohraničný náčelník — nemohla rokovať s jediným naším predstaviteľom, akoby hovoril za všetkých." # todo: NEW TRANSLATION
 gra_jinetes: "$a_granadan_jinetes$" # todo: NEW TRANSLATION
 gra_jinetes_desc: "Ľahký jazdec, ktorého nazývame #italic jinete#!, dostal meno po berberských Zanátach, ktorí v trinástom storočí prekročili prieliv, aby bojovali pod andalúzskymi zástavami. Jazdili na malých ibersko-arabských koňoch a riadili sa taktikou útoku, hodu oštepom a predstieraného ústupu. Túto zanátsku školu pretvárame na stálu zložku nášho vojska a od #italic ṯuḡūr#! až po pobrežnú nížinu tvoria $a_granadan_jinetes$ clonu, za ktorou manévrujú všetky naše ostatné formácie. Táto ľahká jazda stojí zlomok toho, čo obrnení rytieri, a poskytuje nám clonu, ktorú nijaká kresťanská kolóna nedokáže ľahko preraziť bez toho, aby sama nerozbila svoju formáciu." # todo: NEW TRANSLATION
 unlocked_jinetes_via_decision_tt: "Počas [ShowSituationName('battle_for_the_strait')] [Concept('situation','situácie')|e] sme sa v rámci [Concept('decision','rozhodnutia')|e] [ShowDecisionName('demand_conversion_of_granada')] rozhodli pre #italic $demand_conversion_of_granada.b$#!" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 gra_mailed_jinetes: "Obrnení jinete" # todo: NEW TRANSLATION
 gra_mailed_jinetes_desc: "Dve storočia pohraničných bojov vycibrili našich #italic jinete#! na disciplinovanejšiu zložku vojska. Teraz ich vybavujeme krúžkovými košeľami, aby odolali kresťanským kušiam, a predlžujeme im kopije, aby dosiahli cez obranu obrneného protivníka. Taktika útoku, hodu oštepom a predstieraného ústupu zostáva zachovaná, no teraz slúži jazdcom, ktorí dokážu v boji zblízka obstáť, ak prvý útok zlyhá. Táto ľahká obrnená jazda rozširuje pôsobnosť $a_granadan_jinetes_2$ na strety, z ktorých sa naši jazdci predtým museli stiahnuť a uniknúť." # todo: NEW TRANSLATION
 gra_renegade_warriors: "Odpadlícki bojovníci" # todo: NEW TRANSLATION
 gra_renegade_warriors_desc: "Na hranici medzi al-'Andalusom a kresťanskými kráľovstvami sa rodí osobitý druh vojaka: #italic elche#!, ktorý opustil jednu vieru v prospech druhej a teraz slúži pod našimi zástavami s taktikami svojich bývalých pánov. Nábor týchto odpadlíkov pretvárame na stálu jazdeckú zložku a udeľujeme im pôdu, miesta na dvore i právo jazdiť pod našimi farbami. Títo jazdci s kopijami a plátovou zbrojou, vycvičení v kresťanskej obrnenej taktike, dávajú našej armáde ťažkú jazdu, akú naša vlastná tradícia nikdy nevytvorila." # todo: NEW TRANSLATION
 gra_taifa_subjects: "$taifa$" # todo: NEW TRANSLATION
 gra_taifa_subjects_desc: "$taifa_desc$" # todo: NEW TRANSLATION
 gra_tali_a_coastal_watch: "Pobrežné Ṭalā'i'" # todo: NEW TRANSLATION
 gra_tali_a_coastal_watch_desc: "Na každom myse a výbežku pozdĺž nášho pobrežia staviame kamenné veže #italic ṭalā'i'#!. Každá má v noci signálny oheň a cez deň zástavu, je na dohľad od susedných veží a ukrýva oddiel kušostrelcov a #italic faqīh#!, ktorý vedie poplašnú modlitbu. Nijaká galéra neobopláva výbežok bez toho, aby sme o nej vedeli, a každá pobrežná #italic vega#! dokáže zmobilizovať svoju domobranu celé hodiny predtým, než nepriateľský kýl rozryje pláž. Táto sieť strážnych stanovíšť odníma nájazdovým flotilám moment prekvapenia a chráni naše pobrežie bez nákladov na trvalé pobrežné posádky." # todo: NEW TRANSLATION
 gra_thughur: "Ṯuḡūr" # todo: NEW TRANSLATION
 gra_thughur_desc: "#italic ṯuḡūr#! sú pohraničné oblasti al-'Andalusu, divoké územia medzi osídlenou kresťanskou Ibériou a naším emirátom, ktoré vymedzujeme, obsadzujeme posádkami a pripútavame k nášmu dvoru udeľovaním pôdy a výsad bojovníckym rodinám. Na každom priesmyku a brode budujeme pevnosti #italic ṯaḡr#! a spájame ich do súvislého obranného valu, ktorý spomaľuje každý kresťanský postup a poskytuje našim jazdcom miesto na zhromaždenie a doplnenie zásob. Takto organizovaná hranica mení pohraničné klany z nezávislých nájazdníkov na obrancov, ktorých prežitie emirátu priamo zaujíma." # todo: NEW TRANSLATION
 gra_veteran_thagri: "Skúsení Ṯaḡrī" # todo: NEW TRANSLATION
 gra_veteran_thagri_desc: "Štyri generácie služby na hranici premenili #italic ṯaḡrī#! v našich pohraničných oblastiach na stálu bojovnícku vrstvu. Ich rodiny sú zakorenené v tých istých priesmykoch, ktoré bránili ich starí otcovia, a kapitánske hodnosti sa dedia z otca na syna. $a_thagri_2$ platíme len ako dedinských robotníkov, a predsa pochodujú pod našimi zástavami s prídelmi, ktoré by zastavili každú kresťanskú kolónu, ktorú proti nim vyšleme. Táto skúsená pechota je najúspornejšou obranou, akú môže naša hranica poskytnúť, a udržiava územie, ktorého posádky by inak vyžadovali drahých žoldnierov." # todo: NEW TRANSLATION
 gra_veteran_tornadizos: "Skúsení tornadizos" # todo: NEW TRANSLATION
 gra_veteran_tornadizos_desc: "To, čo sa začalo ako príležitostný nábor kresťanských #italic elches#!, sa počas štyroch generácií premenilo na usadenú bojovnícku kastu, ktorú si naša hranica osvojila. Rodiny odpadlíkov sa teraz sobášia medzi sebou, odovzdávajú si zručnosť boja s kopijou a v plátovej zbroji z otca na syna a vyzbrojujú sa na úroveň, ktorú pôvodní dobrodruhovia nikdy nedosiahli. Túto usadenú vrstvu uznávame udeľovaním pôdy a dôstojníckych hodností a pripútavame tak k našej veci ťažkú jazdu, ktorej vernosť už nie je pochybná. Táto skúsená formácia nám poskytuje najťažšiu údernú jazdu, akú môže naša tradícia vytvoriť, jazdiacu ako $a_tornadizos_2$ v strede našej bojovej línie." # todo: NEW TRANSLATION
 saqaliba_barracks_advance: "Dār aṣ-Ṣaqāliba" # todo: NEW TRANSLATION
 saqaliba_barracks_advance_desc: "Starí kordóbsky kalifovia udržiavali gardu #italic Ṣaqāliba#!, otrockých vojakov vycvičených poslúchať jedine trón. Túto inštitúciu obnovujeme založením #italic Dār aṣ-Ṣaqāliba#!, Domu otrokov, kde takýchto mužov kupujeme, vyzbrojujeme a cvičíme. Jeho arzenály sa vyrovnajú každej zbrojnici v ríši, no využívajú celkom iný zdroj. Z jeho radov získava kráľovský dvor stály zbor, ktorý je verný nám skôr než akémukoľvek klanu či mestu." # todo: NEW TRANSLATION
 a_saqaliba_mutaqaddimun_advance: "Aṣ-Ṣaqāliba al-Mutaqaddimūn" # todo: NEW TRANSLATION
 a_saqaliba_mutaqaddimun_advance_desc: "Vytvárame prvú generáciu obnoveného zboru: #italic mutaqaddimūn#!, tých, ktorí prišli predtým. Nazývame ich #italic aṣ-Ṣaqāliba al-Judud#!, Noví Ṣaqāliba, aby sme ich odlíšili od #italic al-Qudamā'#! strateného zlatého veku Kordóby. Sú spätí s #italic dār#! a kráľovskou domácnosťou a nič nedlhujú pohraničným klanom ani starým arabským rodinám." # todo: NEW TRANSLATION
 a_saqaliba_mutaakhkhirun_advance: "Aṣ-Ṣaqāliba al-Muta'aḵḵirūn" # todo: NEW TRANSLATION
 a_saqaliba_mutaakhkhirun_advance_desc: "Reformátor reorganizuje zbor pre jeho druhý vek. Výcvik sa zjednocuje, mušketa nahrádza staršie zbrane a súpisy #italic dār#! sa rozrastajú nad všetko, čo poznali $a_saqaliba_mutaqaddimun$. Neskorší Ṣaqāliba, #italic muta'aḵḵirūn#!, sa stávajú stálym pilierom vojska, nie iba obnoveným zborom, ktorý sa ešte musí osvedčiť." # todo: NEW TRANSLATION
 a_saqaliba_nizam_jadid_advance: "An-Niẓām al-Jadīd" # todo: NEW TRANSLATION
 a_saqaliba_nizam_jadid_advance_desc: "Rozsiahla reorganizácia pretvára zbor na #italic niẓām jadīd#!, Nový poriadok v duchu veľkých armád éry pušného prachu. Jednotné roty, cvičenie so zásobníkmi a reťaz otrockých dôstojníkov, ktorí postúpili z radových vojakov, dávajú kráľovskej domácnosti modernú pechotu, ktorá poslúcha trón a nikoho iného. Už samotný jej názov hlása rozchod so všetkým, čo bolo predtým." # todo: NEW TRANSLATION

 granary_town: "Mesto so sýpkou" # todo: NEW TRANSLATION
 granary_town_desc: "Tomuto [Concept('location','lokalite')|e] boli udelené právne privilégiá a nariadenia na zvýšenie jeho produkcie a skladovania [Concept('food','potravín')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 market_charter: "Trhové privilégium" # todo: NEW TRANSLATION
 market_charter_desc: "Táto [Concept('location','lokalita')|e] získala právo usporiadať pravidelné trhy, ktoré priťahujú obchodníkov a rozširujú kapacitu jej miestneho [ShowBuildingTypeName('marketplace')]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 free_town_charter: "Štatút slobodného mesta" # todo: NEW TRANSLATION
 free_town_charter_desc: "Táto [Concept('location','lokalita')|e] získala práva samosprávy, čím sa znížila priama autorita [ShowEstateTypeName('crown_estate')] výmenou za väčšiu slobodu pri prilákaní osadníkov a obchodovaní." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 fortress_town: "Pevnostné mesto" # todo: NEW TRANSLATION
 fortress_town_desc: "Táto [Concept('location','lokalita')|e] bola určená ako vojenská posádka, dostáva investície do opevnenia a [Concept('manpower','živá sila')|e]. Trvalá vojenská prítomnosť vytláča civilný obchod." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 mining_charter: "Ťažobné privilégium" # todo: NEW TRANSLATION
 mining_charter_desc: "Táto [Concept('location','lokalita')|e] získala formálne práva na prevádzkovanie a rozširovanie ťažobných operácií, čím sa zvyšuje rozsah ťažby. [ShowEstateTypeName('peasants_estate')] sú v dôsledku toho podrobení prísnejším povinnostiam." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 mining_charter_rgo_tt: "Má ťažobnú surovinu [Concept('raw_material','surovinu')|e] alebo produkuje [ShowGoodsName('salt')] vo vnútrozemí" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 studium_privileges: "Študijné privilégiá" # todo: NEW TRANSLATION
 studium_privileges_desc: "Táto [Concept('location','lokalita')|e] bola uznaná za centrum vzdelania, čo jej udeľuje právo udržiavať školy a pritiahnuť učencov. Takéto aktivity napomáhajú rozvoju [Concept('literacy','gramotnosti')|e] a šíreniu [Concept('institution','inštitúcii')|e], hoci zriedka priamo obohacujú štátnu pokladnicu." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 studium_privileges_rank_tt: "Lokalita je [ShowLocationRankName('city')] alebo [ShowLocationRankName('megalopolis')]" # todo: NEW TRANSLATION
 royal_tooling_rights: "Práva na výrobu nástrojov" # todo: NEW TRANSLATION
 royal_tooling_rights_desc: "Tomuto [Concept('location','lokalite')|e] boli udelené právne privilégiá týkajúce sa výroby a distribúcie [ShowGoodsName('tools')], čo mu poskytuje významnú konkurenčnú výhodu." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 royal_jewelry_rights: "Práva na výrobu šperkov" # todo: NEW TRANSLATION
 royal_jewelry_rights_desc: "Tomuto [Concept('location','lokalite')|e] boli udelené právne privilégiá týkajúce sa výroby a distribúcie [ShowGoodsName('jewelry')], čo mu poskytuje významnú konkurenčnú výhodu." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 royal_weaponry_rights: "Práva na výrobu zbraní" # todo: NEW TRANSLATION
 royal_weaponry_rights_desc: "Tomuto [Concept('location','lokalite')|e] boli udelené právne privilégiá týkajúce sa výroby a distribúcie [ShowGoodsName('weaponry')], [ShowGoodsName('firearms')], a [ShowGoodsName('cannons')], čo mu poskytuje významnú konkurenčnú výhodu." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 royal_book_rights: "Práva na tlač" # todo: NEW TRANSLATION
 royal_book_rights_desc: "Tomuto [Concept('location','lokalite')|e] boli udelené právne privilégiá týkajúce sa výroby a distribúcie [ShowGoodsName('paper')], [ShowGoodsName('books')], a [ShowGoodsName('dyes')], čo mu poskytuje významnú konkurenčnú výhodu." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 royal_artisan_rights: "Remeselnícke práva" # todo: NEW TRANSLATION
 royal_artisan_rights_desc: "Tomuto [Concept('location','lokalite')|e] boli udelené právne privilégiá týkajúce sa výroby a distribúcie [ShowGoodsName('leather')], [ShowGoodsName('pottery')], a [ShowGoodsName('furniture')], čo mu poskytuje významnú konkurenčnú výhodu." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 royal_brewing_rights: "Práva na liehoviny" # todo: NEW TRANSLATION
 royal_brewing_rights_desc: "Tomuto [Concept('location','lokalite')|e] boli udelené právne privilégiá týkajúce sa výroby a distribúcie [ShowGoodsName('liquor')], [ShowGoodsName('beer')], a [ShowGoodsName('wine')], čo mu poskytuje významnú konkurenčnú výhodu." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 royal_textile_rights: "Textilné práva" # todo: NEW TRANSLATION
 royal_textile_rights_desc: "Tomuto [Concept('location','lokalite')|e] boli udelené právne privilégiá týkajúce sa výroby a distribúcie [ShowGoodsName('cloth')] a [ShowGoodsName('fine_cloth')], čo mu poskytuje významnú konkurenčnú výhodu." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 royal_naval_rights: "Práva na námorné zásoby" # todo: NEW TRANSLATION
 royal_naval_rights_desc: "Tomuto [Concept('location','lokalite')|e] boli udelené právne privilégiá týkajúce sa výroby a distribúcie [ShowGoodsName('naval_supplies')] a [ShowGoodsName('tar')], čo mu poskytuje významnú konkurenčnú výhodu." # todo: NEW TRANSLATION # todo: CONCEPT CASE

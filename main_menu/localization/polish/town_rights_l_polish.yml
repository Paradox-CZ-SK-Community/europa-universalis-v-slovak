 granary_town_desc: "Tomuto [location|e] boli udelené právne privilégiá a nariadenia na zvýšenie jeho produkcie a skladovania [food|e]." # todo: NEW TRANSLATION
 royal_tooling_rights: "Práva na výrobu nástrojov" # todo: NEW TRANSLATION
 royal_tooling_rights_desc: "Tomuto [location|e] boli udelené právne privilégiá týkajúce sa výroby a distribúcie [ShowGoodsName('tools')], čo mu poskytuje významnú konkurenčnú výhodu." # todo: NEW TRANSLATION
 royal_jewelry_rights: "Práva na výrobu šperkov" # todo: NEW TRANSLATION
 royal_jewelry_rights_desc: "Tomuto [location|e] boli udelené právne privilégiá týkajúce sa výroby a distribúcie [ShowGoodsName('jewelry')], čo mu poskytuje významnú konkurenčnú výhodu." # todo: NEW TRANSLATION
 royal_weaponry_rights: "Práva na výrobu zbraní" # todo: NEW TRANSLATION
 royal_weaponry_rights_desc: "Tomuto [location|e] boli udelené právne privilégiá týkajúce sa výroby a distribúcie [ShowGoodsName('weaponry')], [ShowGoodsName('firearms')], a [ShowGoodsName('cannons')], čo mu poskytuje významnú konkurenčnú výhodu." # todo: NEW TRANSLATION
 royal_book_rights: "Práva na tlač" # todo: NEW TRANSLATION
 royal_book_rights_desc: "Tomuto [location|e] boli udelené právne privilégiá týkajúce sa výroby a distribúcie [ShowGoodsName('paper')], [ShowGoodsName('books')], a [ShowGoodsName('dyes')], čo mu poskytuje významnú konkurenčnú výhodu." # todo: NEW TRANSLATION
 royal_artisan_rights: "Remeselnícke práva" # todo: NEW TRANSLATION
 royal_artisan_rights_desc: "Tomuto [location|e] boli udelené právne privilégiá týkajúce sa výroby a distribúcie [ShowGoodsName('leather')], [ShowGoodsName('pottery')], a [ShowGoodsName('furniture')], čo mu poskytuje významnú konkurenčnú výhodu." # todo: NEW TRANSLATION
 royal_brewing_rights: "Práva na liehoviny" # todo: NEW TRANSLATION
 royal_brewing_rights_desc: "Tomuto [location|e] boli udelené právne privilégiá týkajúce sa výroby a distribúcie [ShowGoodsName('liquor')], [ShowGoodsName('beer')], a [ShowGoodsName('wine')], čo mu poskytuje významnú konkurenčnú výhodu." # todo: NEW TRANSLATION
 royal_textile_rights: "Textilné práva" # todo: NEW TRANSLATION
 royal_textile_rights_desc: "Tomuto [location|e] boli udelené právne privilégiá týkajúce sa výroby a distribúcie [ShowGoodsName('cloth')] a [ShowGoodsName('fine_cloth')], čo mu poskytuje významnú konkurenčnú výhodu." # todo: NEW TRANSLATION
 royal_naval_rights: "Práva na námorné zásoby" # todo: NEW TRANSLATION
 royal_naval_rights_desc: "Tomuto [location|e] boli udelené právne privilégiá týkajúce sa výroby a distribúcie [ShowGoodsName('naval_supplies')] a [ShowGoodsName('tar')], čo mu poskytuje významnú konkurenčnú výhodu." # todo: NEW TRANSLATION
 not_forcefully_revoked_last_10_years_tt: "Mestské práva neboli v posledných 10 rokoch násilne odobrané." # todo: NEW TRANSLATION
 royal_masonry_rights: "Práva na stavebné materiály" # todo: NEW TRANSLATION
 royal_masonry_rights_desc: "Tomuto [location|e] boli udelené právne privilégiá týkajúce sa výroby a distribúcie [ShowGoodsName('masonry')] a [ShowGoodsName('glass')], čo mu poskytuje výraznú konkurenčnú výhodu." # todo: NEW TRANSLATION

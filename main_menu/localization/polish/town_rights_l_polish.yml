 unlock_mageburg_town_rights_tt: "Odomkne [ShowTownRightsName('magdeburg_rights_town_rights')] a [ShowTownRightsName('nuremberg_rights_town_rights')] [town_rights]" # todo: NEW TRANSLATION
 lubeck_town_rights: "[ShowLocationNameWithNoTooltip('lubeck')] Práva" # todo: NEW TRANSLATION
 lubeck_town_rights_desc: "Usporiadanie zákonov a privilégií v našich mestských sídlach podľa vzoru [ShowLocationName('lubeck')] poskytne našim obchodníkom väčšiu moc. Hoci tieto výhody zlepšia schopnosť našich obchodníkov obchodovať, cechoví členovia v meste budú nespokojní s týmto preferovaným zaobchádzaním a budú nám klásť prekážky po svojom." # todo: NEW TRANSLATION
 town_rights_marketplace: "Trhoviskové mestské práva" # todo: NEW TRANSLATION
 nuremberg_rights_town_rights: "[ShowLocationNameWithNoTooltip('nuremberg')] Práva" # todo: NEW TRANSLATION
 nuremberg_rights_town_rights_desc: "$magdeburg_rights_town_rights_desc$" # todo: NEW TRANSLATION
 upper_bergregal: "Horný bergregal" # todo: NEW TRANSLATION
 upper_bergregal_desc: "Postúpenie práva vykonávať banícke operácie mestu zvýši prostriedky dostupné na prieskum ďalších minerálov a zvýši príťažlivosť pre potenciálnych nových osadníkov. Bohužiaľ to prináša tvrdšie obmedzenia pre miestnych obyčajných ľudí a ich schopnosť profitovať z baní samotných." # todo: NEW TRANSLATION
 unlock_bergregal_rights_tt: "Odomkne [ShowTownRightsName ('upper_bergregal')] a [ShowTownRightsName('lower_bergregal')] [town_rights]" # todo: NEW TRANSLATION
 lower_bergregal: "Dolný bergregal" # todo: NEW TRANSLATION
 lower_bergregal_desc: "$upper_bergregal_desc$" # todo: NEW TRANSLATION
 stapelrecht_town_rights: "[ShowSpecialStatusNameWithNoTooltip('free_city')] Staplové práva" # todo: NEW TRANSLATION
 stapelrecht_town_rights_desc: "Titul [ShowSpecialStatusName('free_city')] udelený nám [ShowSpecialStatusName('emperor')] nám poskytuje slobodu zavádzať určité privilégiá v našich mestách, čo prospieva miestnym obchodníkom a núti viac zahraničných obchodníkov obchodovať cez naše územie." # todo: NEW TRANSLATION
 kulm_town_rights: "Kulmské práva" # todo: NEW TRANSLATION
 kulm_town_rights_desc: "$kulm_law_desc$" # todo: NEW TRANSLATION
 unlock_kulm_town_rights_tt: "Odomkne [ShowTownRightsName('kulm_town_rights')] [town_rights]" # todo: NEW TRANSLATION
 novi_fori_town_rights: "$novi_fori$ Práva" # todo: NEW TRANSLATION
 novi_fori_town_rights_desc: "$novi_fori_desc$" # todo: NEW TRANSLATION
 unlock_novi_fori_rights_tt: "Odomkne [ShowTownRightsName('novi_fori_town_rights')] [town_rights]" # todo: NEW TRANSLATION
 royal_free_cities_town_rights: "Práva kráľovských slobodných miest" # todo: NEW TRANSLATION
 royal_free_cities_town_rights_desc: "Vyhlásením našich mestských centier za kráľovské a slobodné mestá môžeme zabrániť tomu, aby sa naše [ShowEstateTypeName('nobles_estate')] v nich koncentrovali mocou." # todo: NEW TRANSLATION
 bohemian_royal_cities_town_rights: "Kráľovské mestské práva" # todo: NEW TRANSLATION
 bohemian_royal_cities_town_rights_desc: "Udelenie mestám privilégií byť priamym vlastníctvom nášho vládcu oslabí [ShowEstateTypeName('nobles_estate')] a môže pomôcť nášmu štátu priamo získať z nich viac hodnoty." # todo: NEW TRANSLATION
 swedish_city_rights: "Práva Stadsrättigheter" # todo: NEW TRANSLATION
 swedish_city_rights_desc: "Obchodníci tohto [location|e] získajú rozšírené privilégiá na výkon obchodu bez zahraničnej konkurencie." # todo: NEW TRANSLATION
 norwegian_city_rights: "Práva Kjøpstad" # todo: NEW TRANSLATION
 norwegian_city_rights_desc: "Udelenie privilégií obchodníkom tohto [location|e] a poskytnutie preferenčného zaobchádzania posilní naše obchodné trasy a poškodí zahraničných obchodníkov." # todo: NEW TRANSLATION
 borough_customals: "Mestské zvyky" # todo: NEW TRANSLATION
 borough_customals_desc: "Miesta, ktorým sú tieto práva udelené, budú schopné spravovať vlastný rozvoj a slúžiť ako slobodné útočiská pred útlakom šľachty." # todo: NEW TRANSLATION
 manorial_customals: "Manoriálne zvyklosti" # todo: NEW TRANSLATION
 manorial_customals_desc: "Udelenie vlastníkom panstiev väčšej výkonnej moci nad týmto miestom zvýši využívanie pôdy a udrží nepoddajných roľníkov pod kontrolou." # todo: NEW TRANSLATION
 foros_extensos_town_rights: "Foros Extensos" # todo: NEW TRANSLATION
 foros_extensos_town_rights_desc: "Od svojho vzniku bolo $POR$ pohraničným územím, obývaným známymi mužmi ako Geraldo sem Pavor. Jeho vládcovia podporujú túto statočnosť a nezdolnosť udeľovaním rozsiahlych ústupkov známych ako $foros_extensos_town_rights$." # todo: NEW TRANSLATION
 fuero_juzgo_town_rights: "Fuero Juzgo" # todo: NEW TRANSLATION
 fuero_juzgo_town_rights_desc: "$fuero_juzgo_town_rights$ vychádza zo starovekého vizigótskeho kódexu, #italic Liber Iudiciorum#!. Ako taký reguluje mnohé aspekty každodenného života, čo ho robí obzvlášť vhodným pre novo kolonizované územia." # todo: NEW TRANSLATION
 fuero_real_town_rights: "Fuero Real" # todo: NEW TRANSLATION
 fuero_real_town_rights_desc: "$fuero_real_town_rights$ je kódex zostavený kráľom Alfonzom X. Kastílskym s cieľom rozšíriť kráľovskú moc v obciach $CAS$." # todo: NEW TRANSLATION
 fuero_general_town_rights: "Fuero General" # todo: NEW TRANSLATION
 fuero_general_town_rights_desc: "$fuero_general_town_rights$ z $NAV$ je kompilácia zvykov a zákonov, ktoré upravujú rôzne stavy územia v súlade s jeho vládcom." # todo: NEW TRANSLATION
 fuero_de_aragon_town_rights: "Fueros de Aragón" # todo: NEW TRANSLATION
 fuero_de_aragon_town_rights_desc: "Fueros de Aragón zhromaždili rôzne mestské práva, ktoré sa rozšírili po $aragon_area$ počas jej expanzie. Preto sú dôsledne bránené ako $nobles_estate$, tak aj $peasants_estate$." # todo: NEW TRANSLATION
 usatges_de_barcelona_town_rights: "Usatges de Barcelona" # todo: NEW TRANSLATION
 usatges_de_barcelona_town_rights_desc: "$usatges_de_barcelona_town_rights$ sú zvyky a tradície, ktoré upravujú $catalan$ územia, vyhlásené a pôvodne udelené grófmi z $barcelona$." # todo: NEW TRANSLATION
 furs_de_valencia_town_rights: "Furs de Valencia" # todo: NEW TRANSLATION
 furs_de_valencia_town_rights_desc: "$furs_de_valencia_town_rights$ boli udelené kráľovstvu toho istého mena kráľom Jakubom I. Aragónskym po jeho dobytí. Ich hlavný rozdiel oproti starým zvykom $aragon_area$ a $catalonia_area$ spočíva v zameraní na reguláciu spolužitia s $muslim_ADJ$ obyvateľstvom, ktoré je v niektorých oblastiach väčšinové." # todo: NEW TRANSLATION
 flemish_cloth_industries_right: "Flámsky textilný priemysel" # todo: NEW TRANSLATION
 flemish_cloth_industries_right_desc: "Neskoré stredoveké obdobie zaznamenalo vznik silného textilného priemyslu v Nizozemských krajinách. Vyrábané z dovezenej $ENG_ADJ$ a $CAS_ADJ$ vlny, látky najvyššej kvality sa vyvážali do celého $europe$." # todo: NEW TRANSLATION
 ville_franche_town_rights: "Práva Ville Franche" # todo: NEW TRANSLATION
 ville_franche_town_rights_desc: "$villes_franches_desc$" # todo: NEW TRANSLATION
 unlock_ville_franche_town_rights_tt: "Odomkne [ShowTownRightsName('ville_franche_town_rights')] [town_rights]" # todo: NEW TRANSLATION
 borgo_franco_town_rights: "Práva Borgo Franco" # todo: NEW TRANSLATION
 borgo_franco_town_rights_desc: "Šírenie komun v rámci $italy_region$ je realitou, tvoriac chrbticu regiónu. Často sú považované za #italic Borgo Franco#! (slobodné mestá) a tešia sa mnohým špeciálnym privilégiám v porovnaní s vidiekom." # todo: NEW TRANSLATION
 scandinavian_fishing_privileges: "Fiskeriprivilegier" # todo: NEW TRANSLATION
 scandinavian_fishing_privileges_desc: "Tomuto [location|e] boli udelené výhradné práva na blízke rybolovné oblasti a obchod so sušenými a solenými rybami. Nórske pobrežné mestá organizované okolo týchto privilégií zásobovali [ShowGoodsName('fish')] po celom severnom $europe$." # todo: NEW TRANSLATION
 scandinavian_bergslag_privileges: "Bergslagsprivilegier" # todo: NEW TRANSLATION
 scandinavian_bergslag_privileges_desc: "Koruna uznala toto [location|e] ako banícku komunitu (bergslag), udeľujúc jej kolektívne práva na miestnu ťažbu rudy, vlastný súd a oslobodenie od vojenskej brannej povinnosti. [ShowEstateTypeName('peasants_estate')] baní majú silnejšie právne postavenie než v bežných mestách." # todo: NEW TRANSLATION
 scandinavian_tar_privileges: "Tjärprivilegier" # todo: NEW TRANSLATION
 scandinavian_tar_privileges_desc: "Tomuto [location|e] boli udelené práva na zber a vývoz [ShowGoodsName('tar')] a [ShowGoodsName('naval_supplies')] z kráľovských lesov. Tieto lesné odvetvia sú chrbticou baltských dodávateľských reťazcov stavby lodí." # todo: NEW TRANSLATION
 scandinavian_thing_rights: "Tingsrätt" # todo: NEW TRANSLATION
 scandinavian_thing_rights_desc: "Tomuto [location|e] boli udelené formálne zhromažďovacie práva (tingsrätt), čo poskytuje jeho obyvateľom uznávané právne fórum pre správu a súdnictvo. Kráľovská autorita je obmedzená výmenou za usporiadanejšie a lojálnejšie obyvateľstvo." # todo: NEW TRANSLATION
 imperial_breadbasket_rights: "Cisárska obilnica" # todo: NEW TRANSLATION
 imperial_breadbasket_rights_granary_tt: "Má [ShowBuildingTypeName('granary')] na maximálnej úrovni." # todo: NEW TRANSLATION
 imperial_breadbasket_rights_desc: "Tomuto [location|e] bola zverená zásobovacia úloha pre širšie kráľovstvo, jeho sýpky boli rozšírené, aby zodpovedali našim ambicióznym plánom. Obilie prúdi dovnútra i von pod imperiálnym dohľadom, zásobujúc obyvateľov i armádu hojnosťou." # todo: NEW TRANSLATION
 constantinopolitan_silk_monopoly_rights: "Hodvábny monopol [ShowLocationNameWithNoTooltip('constantinople')]" # todo: NEW TRANSLATION
 constantinopolitan_silk_monopoly_rights_desc: "V [ShowLocationName('constantinople')] je výroba [ShowGoodsName('silk')] držaná na vysokej úrovni, dlhá tradícia siahajúca cez generácie. Dielne prosperujú pod imperiálnym dohľadom, hoci celá produkcia sa riadi monopolom." # todo: NEW TRANSLATION
 scholai_literacy_rights: "Scholai privilégia" # todo: NEW TRANSLATION
 scholai_literacy_rights_desc: "Toto [location|e] je uznávané ako centrum učenia, kde sa písmo pestuje pod oficiálnym patronátom. Poznanie sa šíri rýchlo, hoci takéto aktivity málokedy obohatia pokladnicu. Lenivé mysle sú hračkami diabla." # todo: NEW TRANSLATION
 municipia_privilegia: "Privilégiá municipií" # todo: NEW TRANSLATION
 municipia_privilegia_desc: "Tomuto [location|e] bol pridelený status municipium, jeho občanom boli udelené práva podľa nášho zákona. Lokálni eliti získavajú väčší vplyv, viažu územie bližšie na tradície [ShowSocietyDirectionName('latinization')]." # todo: NEW TRANSLATION

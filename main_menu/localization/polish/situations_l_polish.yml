 rtr_call_loyalists_to_arms_desc: "#flavor Krajiny [GetCountry('CHI').GetName] horia, keď nájazdní vojvodovia deptajú pôdu, ktorá ich živí. Musíme povolať do zbraní všetkých, ktorí sa považujú za lojálnych Nebeskému trónu!#!\n\nVybraná krajina [ShowGovernmentReformName('warring_state')], ktorá je #G lojálna#! (rovnaká alebo viac než [ShowNamedValue('RTR_IS_LOYAL_VALUE')|+=2] $rtr_yuan_allegiance$) voči [actor.GetName], sa pripojí na našu stranu do vojen [ShowCasusBelliName('cb_red_turban_rebellions')]." # todo: NEW TRANSLATION

 IW_FOREIGN_LEAGUE_BALKAN_VICTORY_TT: "#T Víťazstvo#!\n$BULLET$Všetci [Concept('members','členovia')|e] získajú trvalý [ShowModifier('iw_victory_in_the_italian_wars_modifier')] [Concept('modifier','modifikátor')|e]\n$BULLET$Vodca Ligy vyhlási [ShowLawName('administration_of_italian_lands_law')] [Concept('law','zákon')|e]\n$BULLET$Ako $ROM$ alebo $BYZ$ s #bold Fate of the Phoenix#! DLC, získajte [ShowModifier('iw_rom_byz_latin_victory_dlc_modifier')] alebo [ShowModifier('iw_byz_hellenic_victory_dlc_modifier')] na základe ich [ShowSocietyDirectionName('latinization')] a [ShowSocietyDirectionName('hellenization')] [Concept('societal_values','sociálne hodnoty')|e]\n$BULLET$Bez DLC, $ROM$ alebo $BYZ$ namiesto toho získajú trvalý [ShowModifier('iw_balkan_victory_no_dlc_modifier')]\n$BULLET$Inak, získať Impérium [Concept('country_rank','rang krajiny')|e], alebo trvalý [ShowModifier('iw_balkan_victory_cabinet_modifier')] ak už je Impérium" # todo: NEW TRANSLATION # todo: CONCEPT CASE

 the_revolution: "Ľudové povstanie" # todo: NEW TRANSLATION
 the_revolution_desc: "Nerovnosť bohatstva, klesajúca životná úroveň a rastúca gramotnosť viedli k nárastu individuálneho povedomia. Pretrvávajúce vykorisťovanie nižších vrstiev šľachtou spolu s nekontrolovanou mocou monarchie nakoniec prinútilo obchodníkov aj roľníkov požadovať zmenu vlády. Toto nové hnutie spochybňuje ustálený poriadok monarchie, ktorá viac než tisíc rokov spočívala na dominantnej vyššej vrstve a utláčala nižšie triedy." # todo: NEW TRANSLATION
 institute_governmental_purges: "Zaviesť vládne čistky" # todo: NEW TRANSLATION
 institute_governmental_purges_desc: "Nemôžeme nikomu dôverovať! Špióni a vrahovia sa skrývajú za každým rohom a tí, ktorých sme kedysi považovali za dôveryhodných priateľov, sa teraz snažia zničiť nás zvnútra. Aby sme bezpečne previedli náš ľud cez túto krízu, musia padnúť hlavy!" # todo: NEW TRANSLATION
 suppress_foreign_revolutionaries: "Potlačiť zahraničných revolucionárov" # todo: NEW TRANSLATION
 suppress_foreign_revolutionaries_desc: "Nemôžeme dovoliť, aby tento nový prúd myšlienok a antimonarchistických nálad uchvátil mysle roľníkov v zahraničí, inak riskujeme, že prevrátia aj našu vládu." # todo: NEW TRANSLATION

 IW_FOREIGN_LEAGUE_IBERIA_VICTORY_TT: "#T Víťazstvo#!\n$BULLET$Všetci [Concept('members','členovia')|e] získajú trvalý [ShowModifier('iw_victory_in_the_italian_wars_modifier')] [Concept('modifier','modifikátor')|e]\n$BULLET$Vodca Ligy získa [Concept('prestige','prestíž')|e] a [ShowModifier('iw_iberia_victory_modifier')] na [ShowNamedValue('modifier_duration_years_long')|0] rokov, škálované podľa [Concept('locations','lokalít')|e] kontrolovaných [international_organization|e] v [ShowRegionName('italy_region')]\n$BULLET$Vodca Ligy vyhlási [ShowLawName('administration_of_italian_lands_law')] [Concept('law','zákon')|e]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 IW_FOREIGN_LEAGUE_HRE_VICTORY_TT: "#T Víťazstvo#!\n$BULLET$Všetci [Concept('members','členovia')|e] získajú trvalý [ShowModifier('iw_victory_in_the_italian_wars_modifier')] [Concept('modifier','modifikátor')|e]\n$BULLET$Vodca Ligy získa [Concept('prestige','prestíž')|e] a [ShowNamedValue('imperial_authority_unique_bonus')|+=2] Impériumej autority v [Concept('holy_roman_empire','svätej rímskej ríši')|e]\n$BULLET$Non-Prince [Concept('members','členovia')|e] ligy sú povýšení na kniežatá [Concept('holy_roman_empire','svätú rímsku ríšu')|e]\n$BULLET$Vodca Ligy vyhlási [ShowLawName('administration_of_italian_lands_law')] [Concept('law','zákon')|e]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 IW_ITALIAN_LEAGUE_VICTORY_TT: "#T Víťazstvo#!\n$BULLET$Všetci [Concept('members','členovia')|e] získajú [Concept('prestige','prestíž')|e] a [Concept('stability','stabilita')|e]\n$BULLET$Vodca Ligy získa trvalý [ShowModifier('iw_victory_in_the_italian_wars_modifier')] [Concept('modifier','modifikátor')|e]\n$BULLET$[Concept('ruler','Panovník')|e] vodcu Ligy získa zvýšené [Concept('abilities','schopnosti')|e]\n$BULLET$Vodca Ligy vyhlási [ShowLawName('administration_of_italian_lands_law')] [Concept('law','zákon')|e]\n$BULLET$Nezávislí členovia môžu byť podľa [Concept('opinion','názoru')|e] podriadení ako [ShowSubjectTypeName('vassal')] vodcovi" # todo: NEW TRANSLATION # todo: CONCEPT CASE

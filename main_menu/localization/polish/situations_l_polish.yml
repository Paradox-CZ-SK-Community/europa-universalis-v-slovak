 iw_tension_25_tt: "#T Pri 25 [Concept('situation_tension','napätí')|e]#! \n$BULLET$Odomkne sa [ShowGenericActionName('fortify_key_location')]. Členovia Ligy môžu posilniť kľúčové mestá a horské priechody obranným bonusom.\n$BULLET$Odomkne sa [ShowCountryInteractionName('italian_wars_bribe_country')]. Vodcovia Líg môžu minúť [gold_with_icon|e] na nábor [countries_with_icon|e] z [ShowRegionName('italy_region')] priamo do svojej Ligy." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 iw_tension_50_tt: "#T Pri 50 [Concept('situation_tension','napätí')|e]#! \n$BULLET$Odomkne sa [ShowGenericActionName('iw_militarize_country')]. Vodcovia Líg s aktívnym parlamentom môžu presadiť okamžitú vojenskú pripravenosť, ktorá poskytne armádnej tradícii a skúsenostiam jednotiek.\n$BULLET$Poptávka [ShowGoodsDemandName('italian_wars_militarization')] v celej [ShowRegionName('italy_region')] stúpa, čím rastie hodnota výroby strelných zbraní a delostrelectva." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 iw_tension_75_tt: "#T Pri 75 [Concept('situation_tension','napätí')|e]#! \n$BULLET$Všetky tri #italic talianske Ligy#! začnú automaticky povolávať svojich členov do obranných vojen, keď sú napadnuté [ShowRegionName('france_region')], [ShowRegionName('iberia_region')] alebo #italic cisárskymi#! vodcami Líg.\n$BULLET$Odomkne sa [ShowGenericActionName('iw_intervene_in_war')]. Vodcovia Líg, veľmoci a regionálne mocnosti sa môžu zapojiť do akejkoľvek prebiehajúcej ligovej vojny.\n$BULLET$Odomkne sa [ShowCountryInteractionName('violate_italian_sovereignty')]. Vodcovia Líg vo vojne môžu násilne získať vojenský prístup od štátov v [ShowRegionName('italy_region')]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 iw_tension_100_tt: "#T Pri 100 [Concept('situation_tension','napätí')|e]#! \n$BULLET$Všetky prímeria medzi vodcami Líg sú zrušené. Začína sa otvorený, pohlcujúci konflikt.\n$BULLET$Všetci vodcovia Líg získajú schopnosť povolať svojich členov do útočných vojen kdekoľvek v [ShowRegionName('italy_region')] na nasledujúce desaťročie.\n$BULLET$[Concept('situation_tension','Napätie')|e] potom začne pomaly klesať, čo bude trvať #Y 5 až 10 rokov#! k návratu na 0 v závislosti od aktivity konfliktu." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 iw_tension_explain_tt: "Aktuálne napätie je: [GetSituationByKey('italian_wars').MakeScope.GetVariable('iw_tension').GetValue|2]%\nMeria, ako sa [ShowSituationName('italian_wars')] vyostrili.\n\n#T Mesačné zisky#!\n$BULLET$#R +0.4#! pasívne každý mesiac\n$BULLET$#R +0.4#! ak je niektorý zahraničný vodca Ligy vo vojne\n$BULLET$#R +0.4#! ak je niektorý taliansky vodca Ligy vo vojne\n$BULLET$#R +0.025#! za každú veľkú bitku vyhranú medzi členmi Ligy ([Concept('battles','bitiek')|e] prinášajúce viac než 1% [Concept('war_score','vojnové skóre')|e])\n\n#T Zisky akciami#!\n$BULLET$#R +0.5#! keď sa vykoná [ShowGenericActionName('create_italian_league')] [Concept('action','akcia')|e]\n$BULLET$#R +1#! keď sa vykoná [ShowGenericActionName('expel_league_member')] [Concept('action','akcia')|e]\n$BULLET$#R +2#! keď sa vykoná [ShowGenericActionName('challenge_league_leadership')] [Concept('action','akcia')|e]\n\n#T Úľava#!\n$BULLET$#G -1#! keď sa vykoná [ShowGenericActionName('dissolve_italian_league')] [Concept('action','akcia')|e]\n$BULLET$#G -2#! keď je Liga rozpustená cez [ShowPeaceTreatyTypeName('dissolve_league_peace_deal')] [Concept('peace_treaty','mierovú dohodu')|e]\n\nVyššie [Concept('situation_tension','napätie')|e] robí všetkých vodcov Líg agresívnejšími a skracuje čas medzi ich vojnami." # todo: NEW TRANSLATION # todo: CONCEPT CASE

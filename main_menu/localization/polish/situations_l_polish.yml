 abandon_piracy_action: "Zanechať pirátstvo" # todo: NEW TRANSLATION
 abandon_piracy_action_desc: "Uvedomili sme si, že existuje lepší spôsob, ako sa zbohatnúť. Ak ochránime sedliakov a mešťanov pred inými pirátmi a lúpežníkmi, dovolia nám zobrať časť ich produktov a zlata bez boja. Ak to potom investujeme do infraštruktúry a vojska, môžeme to ešte znásobiť. Zbohatneme viac, než sme si kedy predstavovali!" # todo: NEW TRANSLATION

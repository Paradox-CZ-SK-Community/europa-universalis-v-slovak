 rtr_rekindle_revolt: "Znovu vzbudiť povstanie" # todo: NEW TRANSLATION
 rtr_rekindle_revolt_desc: "#flavor Hoci sme uzavreli prímerie s našimi tyranickými, bývalými pánmi, naše ambície túžia opäť bojovať za oslobodenie Číňanov!#!\n" # todo: NEW TRANSLATION
 rtr_rein_in_area: "Upevniť kontrolu nad oblasťou" # todo: NEW TRANSLATION
 rtr_rein_in_area_desc: "#flavor Čína je krajinou bohatou na obyvateľstvo. Upevnením kontroly nad oblasťami, ktoré dobyjeme od našich nepriateľov, môžeme zabezpečiť vernosť miestnych a ich podporu pre naše budúce expanzie počas týchto povstaleckých čias.#!\n\n[actor.GetName] pridá [ShowModifier('rtr_rein_in_area_modifier')] do dobytej [Concept('area','oblasti')|e] a jej lokality získajú [Concept('integrated','integrované')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE

 reformation_desc: "#italic Keď náš Pán a Učiteľ Ježiš Kristus povedal 'Pokajte sa', želal si, aby celý život veriacich bol jedným pokáním.#!\n\nToto boli prvé poznámky v dokumente 95 téz, ktoré boli nájdené pribité na dvere kostola, a ktoré podrobne opisovali korupciu [GetInternationalOrganization('catholic_church').GetName]. Po období slabosti a vnútorných zápasov sa zdá, že viera [ShowReligionAdjective('catholic')] dozrela na reformu. Mnohí zdieľajú rovnaký názor ako pôvodný autor o čistote vnútorného presvedčenia a že len skrze Boha môže [ShowReligionGroupAdjective('christian')] zažiť odpustenie. Iní toto dielo odsudzujú ako kacírstvo a odklon od [ShowReligionAdjectiveWithNoTooltip('catholic')] presvedčení.\n\nS vlnou diskusií, ktorá zasiahla [ShowContinentName('europe')], je jasné, že tvar kontinentu bude nenávratne zmenený." # todo: NEW TRANSLATION

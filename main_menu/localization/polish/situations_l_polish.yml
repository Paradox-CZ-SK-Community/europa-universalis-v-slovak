 rtr_negotiate_with_rebels: "Vyjednať s rebelmi" # todo: NEW TRANSLATION
 rtr_negotiate_with_rebels_desc: "#flavor Nie všetci rebeli sú ambiciózni vojvodovia, ktorí chcú náš trón. Väčšinu rebelského obyvateľstva tvoria tí, ktorí si len prajú pokojný život bez starostí. Vyjednávaním a investovaním do riešení ich problémov môžeme zmierniť ich rebéliu.#!\n\n[actor.GetName] zníži progres jednej [Concept('rebel','povstalcovi')|e] frakcie o #G -30.00%#!" # todo: NEW TRANSLATION # todo: CONCEPT CASE

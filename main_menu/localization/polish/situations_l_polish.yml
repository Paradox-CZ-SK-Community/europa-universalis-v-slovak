 rtr_support_faction: "Podporiť frakciu" # todo: NEW TRANSLATION
 rtr_support_faction_desc: "#flavor Zeme [GetCountry('CHI').GetName] horia pod náporom rebelov, ktorí povstali proti vládcovi [GetCountry('CHI').GetCulture.GetName]. Náš príspevok môže rozhodnúť v prospech jednej alebo druhej strany.#!\n\nPreveďte [Concept('gold','dukáty')|e] v hodnote #Y 1 year#! cieľovej krajine v rámci [ShowSituationName('red_turban_rebellions')] výmenou za [ShowBiasValue('opinion_rtr_supported_side')|+=0] [Concept('opinion','názor')|e]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 rtr_declare_independence: "Vyhlásiť nezávislosť" # todo: NEW TRANSLATION

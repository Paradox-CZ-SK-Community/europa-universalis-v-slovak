 guelphs_and_ghibellines: "Guelphovia a Ghibellini" # todo: NEW TRANSLATION
 guelphs_and_ghibellines_desc: "[GetUniqueInternationalOrganization('guelphs_io').GetName] a [GetUniqueInternationalOrganization('ghibellines_io').GetName] bojujú o nadvládu nad [ShowRegionName('italy_region')] už niekoľko storočí od čias investitúrneho sporu, ktorý postavil proti sebe [GetUniqueInternationalOrganization('catholic_church').GetLeaderTitle] a [GetUniqueInternationalOrganization('hre').GetLeaderTitle]. [GetUniqueInternationalOrganization('guelphs_io').GetNameWithNoTooltip] podporujú [GetCountry('PAP').GetAdjective] autoritu nad polostrovom, zatiaľ čo [GetUniqueInternationalOrganization('ghibellines_io').GetNameWithNoTooltip] sú považovaní za cisárskych lojalistov verných [GetUniqueInternationalOrganization('hre').GetName]. Postupne sa obe strany odklonili od pôvodných pozícií a dnes zastupujú rôzne záujmy, takže jednotlivé krajiny nie sú cudzie tomu, že menia strany pre vlastný prospech." # todo: NEW TRANSLATION

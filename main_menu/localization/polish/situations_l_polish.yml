 rise_of_the_ottomans_desc: "Poháňaní silnou kombináciou ambícií, vojenského umenia a strategickej vízie, mnohé [ShowCultureName('turkish_culture')] bejliky si vydlabaním cesty cez rozfragmentované územia [ShowRegionName('anatolia_region')] vytvorili miesto. Ich nomádsky pôvod sa spojil so sofistikovanosťou usadených spoločností a vytvoril tak mocnú kombináciu vojenskej sily a administratívnej zdatnosti.\n\nKeď boli regionálne kniežatstvá rozdelené a zraniteľné, najsilnejší medzi nimi využili príležitosť zjednotiť svoje rady pod jediným praporom. Charizmatickí vodcovia ako [GetCharacter('tur_osman').GetName], zakladateľ [GetCountry('TUR').GetName], zapálili plameň inšpirácie, ktorý bude horieť jasne celé storočia.\n\nS každým víťazstvom tieto bejliky naberali hybnosť a pretransformovali sa na silu, s ktorou treba počítať. Dobytie dôležitých miest a miest across regiónu oznamovalo ich neodvratný vzostup." # todo: NEW TRANSLATION

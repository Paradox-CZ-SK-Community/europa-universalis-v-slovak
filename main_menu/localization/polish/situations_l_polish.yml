 rtr_declare_war_for_regional_supremacy: "Vyhlásiť vojnu o regionálnu nadvládu" # todo: NEW TRANSLATION
 rtr_declare_war_for_regional_supremacy_desc: "#flavor $red_turban_rebellions$ nie je len povstanie proti útlaku súčasnej dynastie, ale aj mocenský boj o Nebeský trón samotný. Nemôžeme dovoliť, aby niektorý z týchto pretendentov získal moc a nárokoval si Mandát pre seba!#!\n\n[actor.GetName] vyhlasuje [ShowCasusBelliName('cb_red_turban_rebellions_against_other_rebels')] proti cieľu [Concept('country','krajine')|e]" # todo: RETRANSLATED ENGLISH # todo: CONCEPT CASE

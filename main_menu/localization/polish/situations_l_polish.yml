 black_death_desc: "Otec opustil dieťa, manželka manžela, jeden brat druhého; lebo táto choroba akoby zasahovala cez dych a zrak. A tak zomreli. A nikto sa nenašiel, kto by pochoval mŕtvych za peniaze alebo priateľstvo. Členovia domácnosti priniesli svojich mŕtvych do rokliny, ako najlepšie vedeli, bez kňaza, bez bohoslužieb ... vykopali sa veľké jamy a hromadili sa do nich množstvá mŕtvych. A umierali po stovkách i vo dne aj v noci ... A hneď ako sa tie rokliny naplnili, vykopali sa ďalšie ..." # todo: NEW TRANSLATION

l_polish:
 gold_fleet_tierra_firme_events.1.title: "Na ceste do Tierra Firme" # todo: NEW TRANSLATION
 gold_fleet_tierra_firme_events.1.desc_prefix: "Flotila je vystrojená a pripravená v prístave [departure_port.GetName]. Na palube je voda a proviant, ako aj železo a ortuť, ktoré si kolónie nedokážu zaobstarať samy, a [target_leader.GetName] má v rukách rozkazy [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')].\n\nRočné obdobie je vhodné a vietor praje plavbe. Za ním sa už z hôr na pobrežie znáša [ShowGoodsName('silver')] z" # todo: NEW TRANSLATION
 gold_fleet_tierra_firme_events.1.desc_suffix: "a čaká na flotilu, ktorá ho odvezie domov. Ak ho chceme bezpečne dopraviť do [departure_port.GetName], galeóny musia vyplávať hneď." # todo: NEW TRANSLATION
 gold_fleet_tierra_firme_events.1.desc: "$gold_fleet_tierra_firme_events.1.desc_prefix$ Indie $gold_fleet_tierra_firme_events.1.desc_suffix$" # todo: NEW TRANSLATION
 gold_fleet_tierra_firme_events.1.desc.rich: "$gold_fleet_tierra_firme_events.1.desc_prefix$ [silver_source.GetName] $gold_fleet_tierra_firme_events.1.desc_suffix$" # todo: NEW TRANSLATION
 gold_fleet_tierra_firme_events.1.a: "Odviazať laná. Galeóny vyplávajú s ranným prílivom." # todo: NEW TRANSLATION
 gold_fleet_tierra_firme_events.1.historical_info: "#italic Galeones de Tierra Firme#! bola jedna z dvoch konvojových flotíl, ktoré tvorili španielsku #italic Carrera de Indias#!. Flotila Tierra Firme slúžila juhoamerickým vicekráľovstvám a zhromažďovala striebro z baní v Potosí v Hornom Peru a ďalšie koloniálne príjmy v prístavoch Portobelo a Cartagena. Striebro sa pred nalodením prepravovalo po súši od pobrežia Tichého oceánu cez Panamskú šiju. Filip II. v roku 1566 zaviedol konvojový systém, podľa ktorého sa všetok obchod musel prepravovať v ozbrojených flotilách a prechádzať cez #italic Casa de Contratación#! v Seville, kde sa vyberala kráľovská #italic quinto real#!, teda pätina všetkých drahých kovov vyťažených v Novom svete." # todo: NEW TRANSLATION
 gold_fleet_tierra_firme_events.2.title: "Striebro z Novej Granady" # todo: NEW TRANSLATION
 gold_fleet_tierra_firme_events.2.desc_prefix: "Dorazili sme do [loot_port.GetName] a za jeho hradbami a v bezpečí prístavného zálivu sme v bezpečí. V skladoch pozdĺž nábrežia leží ročná úroda práce baní: tehličky [ShowGoodsName('silver')]" # todo: NEW TRANSLATION
 gold_fleet_tierra_firme_events.2.desc_middle: "truhlice s mincami, zväzky koží, sudy s indigom a tu i tam strážená debna s [ShowGoodsName('gems')]" # todo: NEW TRANSLATION
 gold_fleet_tierra_firme_events.2.desc_suffix: "Nákladné priestory ešte nie sú plné a z vnútrozemia stále prichádza ďalšie [ShowGoodsNameWithNoTooltip('silver')]. Môžeme počkať na celý konvoj a zaplniť každý nákladný priestor, alebo naložiť to, čo sa už zhromaždilo, a vyplávať skôr, než sa priblíži obdobie hurikánov." # todo: NEW TRANSLATION
 gold_fleet_tierra_firme_events.2.desc: "$gold_fleet_tierra_firme_events.2.desc_prefix$, $gold_fleet_tierra_firme_events.2.desc_middle$.\n\n$gold_fleet_tierra_firme_events.2.desc_suffix$" # todo: NEW TRANSLATION
 gold_fleet_tierra_firme_events.2.desc.rich: "$gold_fleet_tierra_firme_events.2.desc_prefix$ z [silver_source.GetName], $gold_fleet_tierra_firme_events.2.desc_middle$ z [gem_source.GetName].\n\n$gold_fleet_tierra_firme_events.2.desc_suffix$" # todo: NEW TRANSLATION
 gold_fleet_tierra_firme_events.2.a: "Počkajme na celý konvoj a naplňme všetky nákladné priestory." # todo: NEW TRANSLATION
 gold_fleet_tierra_firme_events.2.b: "Vezmime len to, čo sa už zhromaždilo." # todo: NEW TRANSLATION
 gold_fleet_tierra_firme_events.2.c: "Riziko je príliš veľké. Vráťme sa domov s tým, čo máme." # todo: NEW TRANSLATION
 gold_fleet_tierra_firme_events.2.historical_info: "Cartagena de Indias, založená v roku 1533, bola hlavným karibským zberným miestom pre striebro z Južnej Ameriky. Striebro z baní v Potosí v Hornom Peru, ktoré boli v čase svojho najväčšieho rozkvetu najbohatším ložiskom striebra na svete, sa prepravovalo do tichomorského prístavu Callao, odtiaľ loďou na sever do Panamy a potom na muliciach cez šiju do Portobela, kde ho počas veľkého obchodného jarmoku nakladali na galeóny Tierra Firme. Bohatstvo prúdiace cez Cartagenu z nej urobilo jedno z najlepšie opevnených miest v Amerike a neustály cieľ korzárov, predovšetkým sira Francisa Drakea, ktorý mesto vyplienil v roku 1586." # todo: NEW TRANSLATION
 gold_fleet_tierra_firme_events.3.title: "$gold_fleet_nueva_espana_events.3.title$" # todo: NEW TRANSLATION
 gold_fleet_tierra_firme_events.3.desc.together: "Flotila dorazila do [rendezvous_port.GetName], kde už kotví #italic flota#! z Nového Španielska pod ochranou diel pevnosti; jej nákladné priestory sú rovnako plné [ShowGoodsName('silver')] ako naše. Odtiaľ obe flotily preplávajú spolu Atlantik, na sever Golfským prúdom a potom na východ popri pobreží Floridy.\n\nPrišla správa, že na tejto trase číhajú nepriateľské lode, no taký veľký konvoj je ťažkou korisťou. [target_leader.GetName] musí rozhodnúť, ako spojená flotila odpovie na hrozbu, skôr než vypláva do Španielska." # todo: NEW TRANSLATION
 gold_fleet_tierra_firme_events.3.desc.alone: "Flotila dorazila do [rendezvous_port.GetName] a kotví pod ochranou diel pevnosti. #italic flota#! z Nového Španielska sa k nám nepridá; Atlantik preplávame sami, na sever Golfským prúdom a potom na východ popri pobreží Floridy.\n\nPrišla správa, že na tejto trase číhajú nepriateľské lode, a osamelá flotila je lákavým cieľom. [target_leader.GetName] musí rozhodnúť, ako na hrozbu odpovieme, skôr než vyplávame do Španielska." # todo: NEW TRANSLATION
 gold_fleet_tierra_firme_events.3.a: "$gold_fleet_nueva_espana_events.3.a$" # todo: NEW TRANSLATION
 gold_fleet_tierra_firme_events.3.b: "$gold_fleet_nueva_espana_events.3.b$" # todo: NEW TRANSLATION
 gold_fleet_tierra_firme_events.3.c: "$gold_fleet_nueva_espana_events.3.c$" # todo: NEW TRANSLATION
 gold_fleet_tierra_firme_events.3.historical_info: "Havana sa po zavedení konvojového systému Filipom II. v roku 1566 stala povinným zhromaždiskom flotíl vracajúcich sa so striebrom. Hlboký prírodný prístav a poloha pri Floridskom prielive z nej robili ideálne miesto stretnutia galeón Tierra Firme a Flota de Nueva España pred spoločným preplávaním Atlantiku. Výstavba Castillo de los Tres Reyes del Morro od roku 1589 bola priamou odpoveďou na hrozbu zo strany zahraničných korzárov. Načasovanie plavby bolo kľúčové: príliš neskorý odchod znamenal riziko karibského obdobia hurikánov, príliš skorý zas nepriaznivé vetry na Atlantiku." # todo: NEW TRANSLATION
 gold_fleet_tierra_firme_events.8.title: "Čakanie na flotilu z Nového Španielska" # todo: NEW TRANSLATION
 gold_fleet_tierra_firme_events.8.desc: "Flotila dorazila do [rendezvous_port.GetName], no #italic flota#! z Nového Španielska ešte neprišla. Rozkazy [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')] sú jasné: pokladové flotily majú preplávať Atlantik spoločne a namieriť svoje delá proti korzárom, ktorí číhajú vo Floridskom prielive.\n\nZakotvíme teda pod ochranou pevnosti, budeme na ňu čakať a dúfať, že sa dlho nezdrží." # todo: NEW TRANSLATION
 gold_fleet_tierra_firme_events.8.a: "$gold_fleet_nueva_espana_events.8.a$" # todo: NEW TRANSLATION
 gold_fleet_tierra_firme_events.8.historical_info: "$gold_fleet_nueva_espana_events.8.historical_info$" # todo: NEW TRANSLATION
 gold_fleet_tierra_firme_events.awaiting_fleet_tt: "Flotila tu bude kotviť a čakať na príchod Flota de Nueva España, nech to potrvá akokoľvek dlho" # todo: NEW TRANSLATION
 gold_fleet_tierra_firme_events.9.title: "$gold_fleet_nueva_espana_events.9.title$" # todo: NEW TRANSLATION
 gold_fleet_tierra_firme_events.9.desc: "V [rendezvous_port.GetName] sme už celé týždne zakotvení, no #italic flota#! z Nového Španielska stále neprišla. Zásoby sa míňajú, muži sú čoraz nepokojnejší a každý deň v prístave znamená, že obdobie vhodné na bezpečnú plavbu sa nám vzďaľuje.\n\n[target_leader.GetName] musí rozhodnúť, či budeme čakať na stretnutie, alebo riskneme plavbu cez Atlantik bez nej." # todo: NEW TRANSLATION
 gold_fleet_tierra_firme_events.9.a: "$gold_fleet_nueva_espana_events.9.a$" # todo: NEW TRANSLATION
 gold_fleet_tierra_firme_events.9.b: "$gold_fleet_nueva_espana_events.9.b$" # todo: NEW TRANSLATION
 gold_fleet_tierra_firme_events.9.historical_info: "$gold_fleet_nueva_espana_events.9.historical_info$" # todo: NEW TRANSLATION
 gold_fleet_tierra_firme_events.10.title: "$gold_fleet_nueva_espana_events.10.title$" # todo: NEW TRANSLATION
 gold_fleet_tierra_firme_events.10.desc: "[target_leader.GetName] sa dozvedá, že aj z [secondary_port.GetName] možno získať jeho podiel: [ShowGoodsName('goods_gold')] prepravované cez šiju prechádza tamojšími skladmi. Mohli by sme odčleniť eskadru, aby ho vyzdvihla, hoci rozdelenie flotily v týchto vodách predstavuje nezanedbateľné riziko.\n\nMôžeme zostať s flotilou v [loot_port.GetNameWithNoTooltip], kým sa oddelená eskadra nevráti, alebo pokračovať do [rendezvous_port.GetNameWithNoTooltip] a nechať ju, aby sa k nám tam pripojila." # todo: NEW TRANSLATION
 gold_fleet_tierra_firme_events.10.a: "$gold_fleet_nueva_espana_events.10.a$" # todo: NEW TRANSLATION
 gold_fleet_tierra_firme_events.10.b: "$gold_fleet_nueva_espana_events.10.b$" # todo: NEW TRANSLATION
 gold_fleet_tierra_firme_events.10.c: "$gold_fleet_nueva_espana_events.10.c$" # todo: NEW TRANSLATION
 gold_fleet_tierra_firme_events.10.historical_info: "$gold_fleet_nueva_espana_events.10.historical_info$" # todo: NEW TRANSLATION
 gold_fleet_tierra_firme_events.10.danger_tt: "$gold_fleet_nueva_espana_events.10.danger_tt$" # todo: NEW TRANSLATION
 gold_fleet_tierra_firme_events.havana_together_danger_tt: "Plavba spolu s flotilou Nueva España $gold_fleet_nueva_espana_events.together_danger_suffix$" # todo: NEW TRANSLATION
 gold_fleet_tierra_firme_events.11.title: "Oddelená eskadra sa vracia" # todo: NEW TRANSLATION
 gold_fleet_tierra_firme_events.11.desc: "Eskadra vyslaná do [secondary_port.GetName] sa vrátila do [loot_port.GetName] s nákladnými priestormi plnými [ShowGoodsName('goods_gold')], [ShowGoodsName('gems')] a koží. Flotila je opäť pohromade, a tým aj bezpečnejšia." # todo: NEW TRANSLATION
 gold_fleet_tierra_firme_events.11.a: "$gold_fleet_nueva_espana_events.11.a$" # todo: NEW TRANSLATION
 gold_fleet_tierra_firme_events.11.historical_info: "$gold_fleet_nueva_espana_events.11.historical_info$" # todo: NEW TRANSLATION
 gold_fleet_tierra_firme_events.12.title: "Oddelená eskadra sa pripája pri Kube" # todo: NEW TRANSLATION
 gold_fleet_tierra_firme_events.12.desc: "Eskadra odvelená do [secondary_port.GetName] dostihla flotilu, keď sa blížila k [rendezvous_port.GetNameWithNoTooltip]. Jej nákladné priestory sú naložené zvyškom sezónnej úrody [ShowGoodsName('goods_gold')], [ShowGoodsName('gems')] a koží." # todo: NEW TRANSLATION
 gold_fleet_tierra_firme_events.12.a: "$gold_fleet_nueva_espana_events.12.a$" # todo: NEW TRANSLATION
 gold_fleet_tierra_firme_events.12.historical_info: "$gold_fleet_nueva_espana_events.12.historical_info$" # todo: NEW TRANSLATION
 gold_fleet_tierra_firme_events.14.title: "Zásielka smaragdov" # todo: NEW TRANSLATION
 gold_fleet_tierra_firme_events.14.desc: "Z [gem_source.GetName] dorazil na nábrežie strážený sprievod a vezie bohatstvo v podobe [ShowGoodsName('gems')] — neopracovaných smaragdov najvyššej kvality, ktorých hodnota na váhu prevyšuje čokoľvek iné v našich nákladných priestoroch. Obchodní zástupcovia žiadajú, aby sme ich dopravili domov; zisk by bol nesmierny.\n\nTakáto korisť však priťahuje korzárov a správa o takomto náklade sa šíri rýchlejšie než ktorákoľvek loď. [target_leader.GetName] musí zvážiť bohatstvo oproti nebezpečenstvu, ktoré so sebou prináša." # todo: NEW TRANSLATION
 gold_fleet_tierra_firme_events.14.a: "Naložme smaragdy. Takéto bohatstvo nepočká." # todo: NEW TRANSLATION
 gold_fleet_tierra_firme_events.14.b: "Nechajme ich tu. Naše nákladné priestory sú už dosť plné." # todo: NEW TRANSLATION
 gold_fleet_tierra_firme_events.14.decline_tt: "Smaragdy zostanú na mieste pre ďalšiu flotilu a menší náklad zníži nebezpečenstvo plavby" # todo: NEW TRANSLATION
 gold_fleet_tierra_firme_events.14.historical_info: "Smaragdové bane Muzo a Somondoco v Novej Granade patrili k najbohatším na svete a kolumbijské smaragdy sa stali jedným z najvyhľadávanejších luxusných tovarov svojej doby, ceneným na európskych dvoroch aj na dvoroch Mughalskej Indie a Safíjovskej Perzie. Kamene boli malé a ľahké, no ich hodnota bola ohromujúca; jediná strážená zásielka sa mohla vyrovnať nákladu striebra na celej lodi. Takéto sústredenie bohatstva priťahovalo zlodejov a prepadávačov, preto kráľovská koruna dohliadala na ich prepravu rovnako prísne ako na drahé kovy." # todo: NEW TRANSLATION
 gold_fleet_tierra_firme_events.15.title: "Mulecie karavány na šiji" # todo: NEW TRANSLATION
 gold_fleet_tierra_firme_events.15.desc: "Posledná tohtoročná #italic recua#! je stále na ceste — dlhá karavána mulíc naložených [ShowGoodsName('silver')] z tichomorskej strany sa vinie cez horúčkami sužovanú šiju Panamy smerom k pobrežiu. Dostali sme správu, že na jej stopu sa zavesili nájazdníci #italic cimarrón#!, utečenci z plantáží, ktorí žijú voľne v džungli, a chcú na karavánu zaútočiť skôr, než dorazí k nám.\n\nStriebro možno ešte priviezť, no iba ak sa postaráme, aby sa bezpečne dostalo k vode." # todo: NEW TRANSLATION
 gold_fleet_tierra_firme_events.15.a: "Pošlime ozbrojený sprievod, aby karavánu bezpečne previedol." # todo: NEW TRANSLATION
 gold_fleet_tierra_firme_events.15.b: "Nemôžeme čakať. Vezmime všetko, čo dorazí na pobrežie." # todo: NEW TRANSLATION
 gold_fleet_tierra_firme_events.15.historical_info: "Peruánske striebro sa dostávalo do Karibiku až po namáhavej pozemnej ceste cez Panamskú šiju na #italic recuas#!, mulicích karavánach, ktoré prepravovali drahé kovy z Panamy na tichomorskom pobreží do Nombre de Dios a neskôr do Portobela na pobreží Atlantiku. Na karavány útočili #italic cimarrones#! — spoločenstvá utečených otrokov, ktoré sa uchýlili do vnútrozemia — a Francis Drake sa s nimi v roku 1573 preslávil spojenectvom pri prepade striebornej karavány, z ktorej získal obrovskú korisť. Ochrana cesty cez šiju bola pre španielsku korunu neustálym a nákladným problémom." # todo: NEW TRANSLATION
 gold_fleet_tierra_firme_events.16.title: "Pobrežie perál" # todo: NEW TRANSLATION
 gold_fleet_tierra_firme_events.16.desc: "K flotile prirazil rýchly čln so správou z [pearl_source.GetName]: sezónna úroda [ShowGoodsName('pearls')] je pripravená. Je to malé bohatstvo, ktoré by v našich nákladných priestoroch zabralo len málo miesta. Krátka zachádzka na východ pozdĺž pobrežia by nám umožnila naložiť ju.\n\nTieto vody sú však plytké, stiesnené a často sa v nich pohybujú korzári; flotila, ktorá vybočí z kurzu, si koleduje o problémy. [target_leader.GetName] musí zvážiť korisť oproti riziku." # todo: NEW TRANSLATION
 gold_fleet_tierra_firme_events.16.a: "Odbočme do [pearl_source.GetNameWithNoTooltip] a naložme perly." # todo: NEW TRANSLATION
 gold_fleet_tierra_firme_events.16.b: "Držme sa kurzu. Perly počkajú na ďalšiu flotilu." # todo: NEW TRANSLATION
 gold_fleet_tierra_firme_events.16.decline_tt: "Flotila sa bude držať kurzu a obíde pobrežie perál; menší náklad zníži nebezpečenstvo plavby" # todo: NEW TRANSLATION
 gold_fleet_tierra_firme_events.16.historical_info: "Loviská perál v južnom Karibiku — pri ostrovoch Cubagua a Margarita a pri Río de la Hacha — patrili medzi prvé zdroje bohatstva, ktoré Španieli v Novom svete využívali. Otroci sa tam potápali v krutých podmienkach, až kým sa ložiská takmer nevyčerpali. Perly boli malé, ľahko prenosné a nesmierne cenné; ideálny náklad, ktorý v niekoľkých truhliciach ukrýval celé bohatstvo. Flotily ich bežne nakladali spolu so striebrom a zlatom." # todo: NEW TRANSLATION
 gold_fleet_tierra_firme_events.17.title: "Prevoz kráľovských úradníkov" # todo: NEW TRANSLATION
 gold_fleet_tierra_firme_events.17.desc: "Z [colony_source.GetName] prišla žiadosť: kráľovskí úradníci a ich domácnosti uviazli v kolónii a čakajú na prevoz domov do Španielska. Bezpečný prevoz by si [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')] určite všimol — flotila by však musela zakotviť, kým by ich aj s batožinou nenaložili na palubu.\n\n[target_leader.GetName] musí rozhodnúť, či si flotila môže dovoliť takéto zdržanie." # todo: NEW TRANSLATION
 gold_fleet_tierra_firme_events.17.a: "Zastavme sa pre úradníkov. Ich priazeň stojí za zdržanie." # todo: NEW TRANSLATION
 gold_fleet_tierra_firme_events.17.b: "Nemôžeme strácať dni. Budú musieť počkať na ďalšiu loď." # todo: NEW TRANSLATION
 gold_fleet_tierra_firme_events.17.decline_tt: "Úradníci zostanú čakať na ďalší prevoz a flotila sa bude držať svojho rozvrhu" # todo: NEW TRANSLATION
 gold_fleet_tierra_firme_events.17.historical_info: "Casa de Contratación očakávala, že pokladové flotily prepravia do Španielska koloniálnych úradníkov, duchovných a ich domácnosti vždy, keď o to požiadajú. Túto povinnosť považovala za rovnako dôležitú ako prevoz samotného striebra. Kapitán, ktorý takýchto cestujúcich odmietol, riskoval, že sa sťažnosti dostanú až k Rade pre Indiá. Každý deň strávený nakladaním cestujúcich a ich batožiny však ukrajoval z času na plavbu, ktorá už aj tak súperila s obdobím hurikánov." # todo: NEW TRANSLATION

l_polish:
 a_ahl_tinmal_spearmen: "Oštepníci z Ahl Tīnmal" # todo: NEW TRANSLATION
 a_ahl_tinmal_spearmen_desc: "$a_ahl_tinmal_spearmen$ sú oštepníci z pohoria Atlas, pochádzajúci z Tīnmalu: útočiska Ibn Tūmarta vo Vysokom Atlase a svätyne, ktorú jeho stúpenci udržiavali pri jeho hrobe, až kým ju Marinidi nezrovnali so zemou. Spočiatku ich tvorili príslušníci Harga, jeho vlastného ľudu, neskôr aj širšej konfederácie Masmuda. Nosia ťažký oštep a okrúhly štít a bojujú v tesnom šíku. Ich hnutie neprevrátilo iba nejaký bezvýznamný vojenský poriadok, ale celý štát: v 20. rokoch 12. storočia almorávidska správa vydávala protichodné rozkazy a jej armády už z veľkej časti netvorili Almorávidi. Práve na tomto zbore bol vybudovaný kalifát a náš štát Masmuda ho stále udržiava, naplnený inštitucionálnou hrdosťou ríše, ktorá kedysi zjednotila celý západný moslimský svet." # todo: NEW TRANSLATION
 a_caballeria_de_cuantia: "Caballería de Cuantía" # todo: NEW TRANSLATION
 a_caballeria_de_cuantia_desc: "$a_caballeria_de_cuantia$ sú jazdci z Kastílie, ktorých majetok zaväzuje k vojenskej službe — muži dostatočne bohatí na to, aby si udržiavali koňa a výzbroj, no stojaci pod vysokou šľachtou. Títo jazdci strednej vrstvy, bojujúci ľahkým spôsobom #italic jinete#!, vypĺňajú priestor medzi družinami veľmožov a pešími odvodmi miest. Kastílskej korune tak poskytujú širokú základňu jazdeckých síl výmenou za oslobodenie od bežnej dane — užšiu výsadu, než akú majú hidalgovia, no dostatočnú na to, aby si mohli udržiavať koňa." # todo: NEW TRANSLATION
 a_coronelias: "Coronelías" # todo: NEW TRANSLATION
 a_coronelias_desc: "$a_coronelias$ sú pešie jednotky, ktoré Gonzalo Fernández de Córdoba sformoval počas talianskych vojen: niekoľko rôt spojených do jedného celku pod velením plukovníka, hoci predtým im velil kapitán. Piky, meče a arkebúzy majú v zostave každá svoje miesto, namiesto toho, aby sa bez ladu a skladu miešali. #italic Tercio#! ešte nemá svoje meno; to mu prinesie až nariadenie z Janova. Práve táto formácia však bude tým menom známa a muži, ktorí sa tu vyučia remeslu, ju neskôr naplnia." # todo: NEW TRANSLATION
 a_granadan_crossbowmen: "Granadskí kušostrelci" # todo: NEW TRANSLATION
 a_granadan_crossbowmen_desc: "$a_granadan_crossbowmen$ používajú zbraň, ktorú Granada prevzala, nie zdedila: Ibn Huḏayl, píšuci pre samotného Muḥammada V., ju nazýva #italic qaḍīb afranjī#! — franský luk. Osvojili sme si ju na hranici, kde bojujeme, a naše dielne dnes vo veľkom vyrábajú jej matice a pažby podľa jednotného vzoru. Kušostrelec nasadený pred hlavnou líniou potrebuje na výcvik jednu sezónu, kým lukostrelec celý život, a jeho šíp prerazí aj zbroj, ktorá by zastavila obyčajný šíp." # todo: NEW TRANSLATION
 a_granadan_jinetes: "Granadskí jinetes" # todo: NEW TRANSLATION
 a_granadan_jinetes_2: "Neskorí granadskí jinetes" # todo: NEW TRANSLATION
 a_granadan_jinetes_2_desc: "Stáročia zdokonaľovania jednotiek $a_granadan_jinetes$ priniesli disciplinovanejšieho a lepšie vybaveného jazdca. Tradičný oštep dopĺňa krúžková košeľa a dlhšia kopija, no základná doktrína rýchlosti, obťažovania a predstieraného ústupu zostáva charakteristickým znakom granadskej ľahkej jazdy." # todo: NEW TRANSLATION
 a_granadan_jinetes_desc: "Jinetes, zrodení z andalúzskych pohraničných vojen, jazdia na ľahkých neobrnených koňoch a bojujú oštepmi, krátkymi mečmi a koženými štítmi v tvare srdca, zvanými #italic adarga#!. Ich údery a ústupy, vychádzajúce z berberských taktík prenesených cez úžinu, určujú tempo vojny na Pyrenejskom polostrove a susedné ríše ich rýchlo začínajú napodobňovať." # todo: NEW TRANSLATION
 a_guich_cavalry: "Jazda guich" # todo: NEW TRANSLATION
 a_guich_cavalry_desc: "$a_guich_cavalry$ je stála jazda marockého Maḵzanu — príslušníci kmeňov #italic jīš#!, zvyčajne arabského pôvodu, usadení na pôde #italic arḍ al-jayš#!, ktorú môžu užívať bez daní, pokiaľ slúžia na koni. Sú to vojaci a roľníci, nie šľachtici, a nemajú vlastný rodokmeň, o ktorý by sa mohli oprieť. Práve preto im sultán dôveruje: postavenie tohto zboru závisí výhradne od koruny. Jazdia a dostávajú pôdu za službu, pričom sultánovu moc presadzujú aj v krajoch, kde by samotného výbercu daní nikto nepočúval. Pokladnicu pritom stoja menej než akékoľvek vojsko, ktoré treba platiť mincami." # todo: NEW TRANSLATION
 a_hermandad_infantry: "Pešiaci hermandad" # todo: NEW TRANSLATION
 a_hermandad_infantry_desc: "$a_hermandad_infantry$ tvoria organizované domobranecké roty Santa Hermandad — Svätej bratstvá, založenej na vytvorenie stálej vnútornej ozbrojenej sily, ktorá by udržiavala poriadok na rozľahlej náhornej plošine Meseta. Na rozdiel od starých feudálnych odvodov týchto mužov verbujú a platia mestá, no zodpovedajú kráľovským úradníkom, nie miestnym pánom. Vďaka disciplíne sú oveľa spoľahlivejším nástrojom nového centralizovaného štátu než akékoľvek vojsko barónov." # todo: NEW TRANSLATION
 a_hilali_bedouin_cavalry: "Hilálska beduínska jazda" # todo: NEW TRANSLATION
 a_hilali_bedouin_cavalry_desc: "$a_hilali_bedouin_cavalry$ tvoria ľahkí jazdci arabských kmeňov Banū Hilāl a Banū Sulaym — pastieri, ktorí prichádzali na západ z Horného Egypta postupne počas mnohých generácií, nie v jedinej vlne. Ich pomalé osídľovanie stepi natrvalo zmenilo jej jazyk aj vidiecky poriadok. V našich časoch už Riyāḥ a Dawāwida dosadzujú kráľov aj ich zosadzujú a sultáni medzi Tunisom a Tlemcenom si ich naklonili sobášmi, daňovými prenájmami a udelením pôdy a príjmov ich náčelníkom. Prichádzajú k nám pod vlastnými veliteľmi a na vlastných koňoch a nikto im nebude určovať, kde majú táboriť. Táto arabsko-beduínska tradícia dáva našim armádam údernú jazdu, ktorej pohyblivosť a početnosť kmeňov dopĺňajú berberské konfederácie bez toho, aby súperila o tých istých ľudí na verbovanie." # todo: NEW TRANSLATION
 a_infanteria_de_marina: "Infantería de Marina" # todo: NEW TRANSLATION
 a_infanteria_de_marina_desc: "$a_infanteria_de_marina$ sú námorní pešiaci kastílskeho loďstva — vojaci, ktorí sa plavia na našich vojnových lodiach, aby dobýjali nepriateľské paluby, držali pobrežné pozície a viedli obojživelné výsadky. Organizovaní do stálych rôt podľa veľkej tradície #italic tercio#!, títo bojujúci námorníci sa rovnako dobre vyznajú na stiesnenej lávke galeje aj v prielome pobrežnej pevnosti, a sú tak ostrou špičkou našej zámorskej moci." # todo: NEW TRANSLATION
 a_kabyle_skirmishers: "Kabýlski harcovníci" # todo: NEW TRANSLATION
 a_kabyle_skirmishers_desc: "$a_kabyle_skirmishers$ sú horali z pohorí Djurdjura a Babor východne od Alžíru — Zwāwa, ako ich nazývajú arabskí zemepisci, poddaní hafsidského sultána v Béjaïi, ktorí mu však neplatia nič. Ich príbuzní už v minulosti budovali ríše: Kutāma z východných vrchov tvorili vojsko, ktoré priviedlo Fátimovcov do Ifrīqije, a Ṣanhāja z rovnakého kmeňa neskôr založili dynastie Ziridov a Hammadidov. Pochodujúci oddiel zasypú oštepmi a zmiznú v teréne, kam ich žiadna formácia nedokáže nasledovať. Táto tradícia horského boja dáva maghrebským armádam možnosť obchvatu v kopcovitých a zalesnených krajoch, kde sa pechota určená na boj v otvorenom poli nedokáže pohybovať." # todo: NEW TRANSLATION
 a_masmuda_atlas_infantry: "Pešiaci Masmuda z Atlasu" # todo: NEW TRANSLATION
 a_masmuda_atlas_infantry_desc: "$a_masmuda_atlas_infantry$ sú ťažkí oštepníci berberských konfederácií Masmuda z pohoria Atlas — roľníci z vysokohorských údolí, ktorí narukujú na jednu sezónu a potom sa vracajú na svoje terasy, tak ako to robili dávno pred almohádskym kalifátom aj dlho po jeho páde. Ich predkovia pochodovali v armádach, ktoré v 12. storočí zaplavili Maghreb a Pyrenejský polostrov, a túto spomienku si nesú v tesných formáciách, ktorým ich naučili hory. Tie sa hodia do členitého terénu aj na odrážanie ťažkej kresťanskej jazdy. Tradícia Masmuda poskytuje každému maghrebskému štátu zbor ťažkej pechoty, ktorý nijaký čisto jazdecký protivník nedokáže ľahko zlomiť v boji zblízka." # todo: NEW TRANSLATION
 a_mesnaderos: "Mesnaderos" # todo: NEW TRANSLATION
 a_mesnaderos_desc: "$a_mesnaderos$ tvoria kráľovskú družinu jazdcov pyrenejských korún — obrnených dvorských rytierov, ktorí slúžia priamo kráľovi Navarry alebo Aragónska. Organizujú sa na základe starobylej povinnosti #italic mesnada#! a svojho panovníka zaväzujú osobnou vernosťou a zmluvou. Tvoria tak spoľahlivé jadro skúsených ťažkých jazdcov, ktoré možno vyslať tam, kam by feudálny odvod dorazil príliš neskoro alebo by nebol dostatočne spoľahlivý." # todo: NEW TRANSLATION
 a_milicia_concejil: "Milicia Concejil" # todo: NEW TRANSLATION
 a_milicia_concejil_desc: "$a_milicia_concejil$ sú mestské odvody kastílskych a leónskych obcí — #italic concejos#! na náhornej plošine Meseta, ktoré sa kráľovskou listinou zaviazali poskytnúť mužov na miestnu obranu a službu na hraniciach. Verbujú sa z mešťanov a remeselníkov opevnených miest. Sú lacnou a ľahko dostupnou silou, ktorej najväčšou prednosťou je znalosť územia, ktoré majú chrániť." # todo: NEW TRANSLATION
 a_milicia_irmandinha: "Milicia Irmandinha" # todo: NEW TRANSLATION
 a_milicia_irmandinha_desc: "$a_milicia_irmandinha$ sú domobranecké oddiely, ktoré verbujú galícijské bratstvá — #italic Irmandades#! z polovice 15. storočia, ktoré zjednotili mestá Galície proti tyranii veľkých šľachtických rodov. Títo občianski vojaci sú slabo vyzbrojení, no odhodlaní. Stelesňujú súdržnosť mestských cechov a drobných vlastníkov pôdy v Galícii, ktorí namiesto podriadenia sa panskému útlaku zvolili spoločný postup." # todo: NEW TRANSLATION
 a_miquelets: "Miquelets" # todo: NEW TRANSLATION
 a_miquelets_desc: "$a_miquelets$ sú nepravidelní ľahkí pešiaci z katalánskych hôr — húževnaté oddiely horalov, ktoré slúžili katalánskym pánom aj kastílskym kráľom v pyrenejských priesmykoch a roklinách východného pobrežia. Pohybujú sa rýchlejšie než pravidelné vojská a zmiznú skôr, než sa stihne zorganizovať prenasledovanie. Títo partizáni vynikajú v prepadoch a nájazdoch a drsný terén svojej domoviny premieňajú na svoju najväčšiu zbraň." # todo: NEW TRANSLATION
 a_mulaththamun_spearmen: "Oštepníci Mulaṯṯamūn" # todo: NEW TRANSLATION
 a_mulaththamun_spearmen_desc: "$a_mulaththamun_spearmen$ sú bojovníci Ṣanhāja zo západnej Sahary. Svoje meno dostali podľa #italic liṯām#!, ktorý nikdy neodkladajú — príslušníci klanov Lamtūna, ktorých usporiadané šíky oštepníkov šírili prísnu reformnú doktrínu mālikovského islamu Ibn Yāsīna a neskôr aj vojenskú moc Yūsufa ibn Tāšfīna od saharského piesočného mora až po údolie rieky Ebro. Predný rad nastavuje dlhé kopije a rady za ním vrhajú oštepy; každý muž je chránený štítom #italic lamt#! z kože oryxa a zahalený tak, že vidno iba očné otvory. Ich vysoká morálka pramení z náboženského odhodlania, ktorému sa nijaká čisto svetská vojenská tradícia nevyrovná. Ríša, ktorú títo oštepníci vybudovali, už dávno padla, no Maghreb nikdy nezabudol, ako bojovali, a náš štát Ṣanhāja stále nasadzuje ich zbor ťažkej pechoty." # todo: NEW TRANSLATION
 a_mutatawwia: "Mutaṭawwi'a" # todo: NEW TRANSLATION
 a_mutatawwia_desc: "#italic Mutaṭawwi'a#! sú dobrovoľníci z granadskej hranice — zbožní muži, ktorí sa vydávajú na nájazdy v období ťažení v nádeji na raj a podiel z koristi, nie za žold. Mnohí sa zhromažďujú okolo miestneho #italic morabita#!, ktorého povesť svätosti ich priťahuje. Sú ľahkí a rýchli; na kresťanské pohraničie útočia oštepmi a mečmi a potom sa rozptýlia v pohorí Sierra. Nie sú to sultánovi platení pohraniční jazdci a ani sa za nich nevydávajú: prinášajú početnosť a horlivosť, no na konci sezóny sa rozpustia." # todo: NEW TRANSLATION
 a_sanhaja_camel_cavalry: "Ťavia jazda Ṣanhāja" # todo: NEW TRANSLATION
 a_sanhaja_camel_cavalry_desc: "$a_sanhaja_camel_cavalry$ tvoria jazdci na ťavách a ľahkých koňoch zo saharského kmeňa Ṣanhāja — Lamtūna a Masūfa, zahalení muži, ktorých otcovia vybudovali ríšu siahajúcu od Senegalu až po Ebro. Tie časy sú preč. Storočie sa obracia proti nim a k moci teraz stúpajú dynastie Zanata a Masmuda. Púšť sa však nezmenila a nik ju nedokáže prekonať tak ako oni: ich ťavy ich prenesú na vzdialenosti, na ktoré by sa jazdecké kone neodvážili, a ich útoky ľahkými oštepmi sú maghrebskou odpoveďou na ťažké kopije iberských a sahelských mocností. Táto tradícia púštnej jazdy Ṣanhāja dáva našim armádam neprekonateľný logistický dosah a schopnosť manévrovať na južnej hranici." # todo: NEW TRANSLATION
 a_sometent: "Sometent" # todo: NEW TRANSLATION
 a_sometent_desc: "$a_sometent$ tvoria #italic mestské a vidiecke milície#! z katalánskych krajín, povolávané do zbrane zvonením zvonov a trúbením na roh vždy, keď je ohrozená hranica. Sú vyzbrojené oštepmi a štítmi, nie sú to profesionálni vojaci, ale ochrancovia svojich domovov a dedín. Vďaka ich neoblomnosti tvárou v tvár nájazdom a vpádom sa lámu ťažšie, než by ich počet napovedal." # todo: NEW TRANSLATION
 a_alabarderos: "Alabarderos" # todo: NEW TRANSLATION
 a_alabarderos_desc: "$a_alabarderos$ sú halapartňová garda chrániaca samotného panovníka — jediná rota s niekoľkými desiatkami mužov, určená na stráženie dverí panovníkovej komnaty, nie na boj v šíku. Ich tyčové zbrane chránia panovníka a zároveň dodávajú lesk dvoru. Kráľ, ktorý sa na nich musí spoliehať v poli, už bitku prehral." # todo: NEW TRANSLATION
 a_guardias_de_ornato: "Guardias de Ornato" # todo: NEW TRANSLATION
 a_guardias_de_ornato_desc: "$a_guardias_de_ornato$ sú slávnostná halapartňová garda kastílskeho dvora, bohato odetí nástupcovia jednotky $a_alabarderos$, ktorí panovníka sprevádzajú s kopijou a halapartňou." # todo: NEW TRANSLATION
 a_thagri: "Ṯaḡrī" # todo: NEW TRANSLATION
 a_thagri_2: "Neskorí Ṯaḡrī" # todo: NEW TRANSLATION
 a_thagri_2_desc: "Generácie služby v jednotkách $a_thagri$ premenili tento zbor na dedičnú vrstvu pohraničných strážcov. Pochody majú v krvi, priesmyky poznajú z piesní svojich starých otcov a výcvik zdedili po rotách svojich otcov. Stále dostávajú žold a chlieb ako roľníci, no ich kolóna dokáže udržať pohorie Sierra počas celej sezóny ťaženia, zatiaľ čo rytierska družina by hladovala už po dvoch týždňoch." # todo: NEW TRANSLATION
 a_thagri_desc: "Jednotky #italic ṯaḡrī#!, verbované v pohraničných dedinách krajov #italic ṯuḡūr#!, bojujú ako peší oštepníci, ktorí poznajú každý priesmyk a vodný tok andalúzskej hranice. Lacno sa cvičia na dedinskej strave, celé týždne pochodujú na prídel, ktorý by kastílskej kolóne vystačil iba na niekoľko dní, a na výzvu odpovedajú pri prvom signálnom ohni. Ich zbrane sú jednoduché a žold skromný, no v odolnosti na horských hraniciach sa im na Pyrenejskom polostrove nik nevyrovná." # todo: NEW TRANSLATION
 a_tornadizos: "Tornadizos" # todo: NEW TRANSLATION
 a_tornadizos_2: "Neskorí tornadizos" # todo: NEW TRANSLATION
 a_tornadizos_2_desc: "Generácie osídľovania jednotiek $a_tornadizos$ vytvorili stálu vrstvu obrnenej jazdy, ktorej výcvik a výzbroj sa dnes vyrovnajú najlepším kresťanským rytierom Pyrenejského polostrova. Ich kopije sú dlhšie, plátová zbroj ťažšia a ich počet už nezávisí od rozmarov pohraničia. Andalúzska ťažká jazda dospela a pod našimi vlastnými zástavami vyráža proti kráľovstvám, ktorých bojové umenie ju kedysi formovalo." # todo: NEW TRANSLATION
 a_tornadizos_desc: "Títo muži odišli z kresťanských kráľovstiev do nasridských služieb a pri službe nám si zachovávajú vlastnú vieru aj kňazov — pohraničníci ich však bez rozdielu nazývajú #italic tornadizos#!, čo je výraz, ktorým označujú každého, kto prebehne na druhú stranu. Do našich armád prinášajú bojové umenie kopije a plátovej zbroje. Ich obrnený útok sa vyrovná kastílskym a aragónskym #italic žandárom#!, no jazdia po boku jednotiek $a_granadan_jinetes$ pod zelenými zástavami nášho emirátu. Verbovanie postupuje pomaly, lebo takýchto mužov je málo. Každý z nich, vycvičený v kresťanskom bojovom umení, však robí našu jazdu protivníkom, akého pohraničie medzi andalúzskymi vojskami ešte nepoznalo." # todo: NEW TRANSLATION
 a_tuareg_camelry: "Tuarežská ťavia jazda" # todo: NEW TRANSLATION
 a_tuareg_camelry_desc: "$a_tuareg_camelry$ tvoria jazdci #italic mahrī#! z hlbín Sahary — muži, ktorých arabskí zemepisci radia k Ṣanhāja a poznajú podľa závojov. Jazdia na rýchlych dromedároch vyšľachtených na prekonávanie veľkého piesočného mora a skalnatej púšte a nosia dlhú kopiju aj #italic takoubu#! na boj zblízka, keď útok tiav rozptýli nepriateľskú kolónu. Nielenže prepadávajú karavánové cesty, ale ich aj strážia: za odmenu poskytujú sprievod a ukazujú cestu, pričom vyberajú poplatky všade, kde ovládajú studne. Kým jazdecká jazda musí zastaviť po vodu, oni prejdú za tri dni také vzdialenosti, vďaka čomu ovládajú koridory, ktoré nedokáže strážiť nijaké usadené vojsko. Táto tradícia jazdy na ťavách dáva našim konfederáciám schopnosť nájazdov a diaľkového hliadkovania, ktorej sa nijaký súper v okruhu tisícich líg od púšte nevyrovná." # todo: NEW TRANSLATION
 a_zenata_cavalry: "Jazda Zenata" # todo: NEW TRANSLATION
 a_zenata_cavalry_desc: "$a_zenata_cavalry$ tvoria ľahkí jazdci berberských konfederácií Zenata — Banū Marīn, Banū 'Abd al-Wād a Maghrāwa — ktorých pastiersky pôvod z nich urobil majstrov rýchleho boja v púšti a stepi. Každý bojovník si privádza vlastného koňa, výstroj aj družinu príbuzných; na ich nasadenie preto netreba kráľovskú zbrojnicu ani dlhý výcvik. Tieto zásoby kmeňovej ľahkej jazdy poskytujú každému maghrebskému sultánovi rýchle úderné vojsko, ktoré ťažšia kresťanská ani východná moslimská jazda v otvorenom teréne ľahko nedostihne." # todo: NEW TRANSLATION
 n_carraca_portuguesa: "Nau Portuguesa" # todo: NEW TRANSLATION
 n_carraca_portuguesa_desc: "$n_carraca_portuguesa$ je ťažká karaka, ktorá poháňa našu východnú ríšu — vysoká loď s viacerými palubami, postavená tak, aby prežila prudké búrky na trase okolo Mysu dobrej nádeje a vrátila sa s korením a hodvábom z obchodu v Indickom oceáne. Tieto lode, vyzbrojené kanónmi a schopné prepravovať stovky vojakov, sú plávajúcimi pevnosťami, ktoré otvorili svetové námorné cesty portugalskému obchodu a moci." # todo: NEW TRANSLATION
 n_galeota_andalusi: "Galeota Andalusí" # todo: NEW TRANSLATION
 n_galeota_andalusi_desc: "$n_galeota_andalusi$ je rýchla nájazdová galeota andalúzskych korzárov — úzka veslová loď postavená na rýchlosť a prekvapenie, nie na otvorený boj loďstiev. Jej posádku tvoria skúsení námorníci z prístavov Granady a južného pobrežia. Tieto galeoty sa prešmykujú medzi kresťanskými rybárskymi dedinami a obchodnými trasami, udierajú skôr, než sa stihne zorganizovať obrana, a unikajú po vetre skôr, než ich prenasledovatelia dostihnú." # todo: NEW TRANSLATION
 n_ghurab_maghribi: "Ghurāb Maghribī" # todo: NEW TRANSLATION
 n_ghurab_maghribi_desc: "$n_ghurab_maghribi$ je vojnová galeja maghrebských prístavov — #italic ghurāb#!, havran, dlhý veslový trup, ktorý vezie početnú bojovú posádku namiesto ťažkej delostreleckej výzbroje. Tieto galeje sa stavajú v lodeniciach v Salé, Bādis a Hunayn a veslujú na nich posádky naverbované z pobrežných kmeňov. V eskadrách prenasledujú obchodné lode a vysielajú na ne útočné oddiely skôr, než stihnú zorganizovať obranu. Táto tradícia veslujúcich korzárov poskytuje každému maghrebskému sultánovi loďstvo schopné súperiť o úžinu a pobrežné trasy bez nákladov na delostrelecké námorníctvo." # todo: NEW TRANSLATION
 n_nao_castellana: "Nao Castellana" # todo: NEW TRANSLATION
 n_nao_castellana_desc: "$n_nao_castellana$ je #italic veľká obchodná vojnová loď#! Kastílie — široká, s vysokými nástavbami, schopná preplávať oceán a zároveň niesť dostatok diel a vojakov na odrazenie každého súperiaceho loďstva. Práve na lodiach tohto typu sa uskutočnili naše najslávnejšie objavné plavby a v ich podpalubí sa bohatstvo nových kontinentov začína plaviť späť do Kastílie." # todo: NEW TRANSLATION
 n_sale_rover: "Korzár zo Salé" # todo: NEW TRANSLATION
 n_sale_rover_desc: "$n_sale_rover$ je ľahká korzárska plachetnica republiky Bou Regreg — loď s malým ponorom, postavená v lodeniciach v Salé a Rabate hornacheroskými a moriskovskými utečencami, ktorí pri ústí rieky založili nezávislý korzársky mestský štát. Naši kapitáni plavia tieto rýchle lode do atlantických trás, kde zachytávajú pobrežnú dopravu pri Pyrenejskom polostrove, Kanárskych ostrovoch a západných prístupoch do Stredozemného mora. Ujdú každej ťažkej vojenskej galeóne, ktorá sa ich vydá prenasledovať. Tradícia korzárov zo Salé dáva nášmu štátu loďstvo rýchlych atlantických nájazdníkov, aké nemôže napodobniť nijaké korzárske loďstvo založené na galejách na otvorenom mori." # todo: NEW TRANSLATION

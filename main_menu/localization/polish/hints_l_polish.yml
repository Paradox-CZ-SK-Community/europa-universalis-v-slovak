 hint_societal_values: "Sociálne hodnoty" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 hint_societal_values_hint_text: "$hint_societal_values_hint_text_1$\n\n$hint_societal_values_hint_text_2$\n\n$hint_societal_values_hint_text_3$" # todo: NEW TRANSLATION
 hint_societal_values_hint_text_1: "Naše [Concept('societal_values_with_icon','sociálne hodnoty')|e] definujú sociálnu a politickú štruktúru nášho [Concept('country_with_icon','krajiny')|e], zvyky nášho ľudu a charakteristiky nášho právneho systému. Ich účinky môžu mať hlboký vplyv na spôsob hrania krajiny, najmä cez odomykanie špecifických [Concept('government_reforms_with_icon','vládne reformy')|e].\n\nKaždá sociálna hodnota je os s dvoma opačnými pólmi, ktoré môžu dosiahnuť až 100. Pozícia krajiny na tejto osi je primárne ovplyvnená [Concept('laws','zákony')|e], [Concept('estate_privileges','privilégiá stavov')|e] a [Concept('cabinet_actions','akcie kabinetu')|e] a postupne sa v čase posúva smerom k jednému z pólov. Pokrok k jednému pólu sa však zastaví na maxime, ktoré je určené celkovým množstvom faktorov tlačiacich v tom smere. Čím je Sociálna hodnota vyššia, tým viac faktorov je potrebných na jej ďalší posun." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 hint_societal_values_hint_text_2: "#T Recommended Actions:#!\n@arrow_bonus_tier_3! Skontrolujte [societal_values] a ich aktuálny trend v [Link('societal_values', '', '@government_panel! Government Panel > Values Tab')]. Odtiaľ môžete tiež skontrolovať [government_reforms] odomknuté každou Sociálnou hodnotou @leftclick! #W Kliknutím#! na ich ikonu.\n@arrow_bonus_tier_2! Hlavnými faktormi ovplyvňujúcimi [societal_values] sú [Concept('laws_with_icon','zákony')|e] a [Concept('estate_privileges_with_icon','privilégiá stavov')|e]. Sledujte ich.\n@arrow_bonus_tier_1! Ak sa chcete zamerať na konkrétnu Sociálnu hodnotu, môžete tiež poveriť [Concept('cabinet_with_icon','kabinet')|e], aby vykonal [ShowCabinetActionName('change_societal_values')]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 hint_societal_values_hint_text_3: "#T Extra Hints:#!\n@hint! Remember that a Societal Value can only trend towards a maximum of 100 times its current push. For example, a monthly push of #W 0.10#! monthly means the Value will cap at #W 10.00#!.\n@hint! Societal Values also play an important role in [Concept('diplomacy','diplomacia')|e], as [countries] with affine Societal Values will tend to have a higher [Concept('opinion','názor')|e] of each other.\n@hint! Some of the most unique [government_reforms] in later [Concept('ages','veky')|e] require one or more [societal_values]. For instance, [ShowGovernmentReformName('naval_infrastructure_act')] requires a minimum of #W 50#! into [ShowSocietyDirectionName('naval')]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 hint_societal_values_diplomatic: "\"Dobrá vôľa našich susedov stojí viac ako akákoľvek zmluva. Hodnoty, ktoré s nimi zdieľame, nám ju zadarmo získajú.\"" # todo: NEW TRANSLATION
 hint_societal_values_administrative: "\"Bohatá krajina vydrží dlhšie než ktorýkoľvek nepriateľ. Hodnoty uprednostňujúce obchod si zaslúžia prvé zváženie.\"" # todo: NEW TRANSLATION
 hint_societal_values_military: "\"Naši rivali s každým rokom odvážnejú. Vojenské hodnoty udržia vlkov od našich dverí.\"" # todo: NEW TRANSLATION

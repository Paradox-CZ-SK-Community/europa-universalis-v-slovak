l_polish:
 TAB_TOOLTIP_HINTS_TITLE: "Rady"
 TAB_TOOLTIP_HINTS: "#T Tipy#!\nTento panel obsahuje rady relevantné pre vašu aktuálnu hernú situáciu."
 OPEN_HINTS: "Otvoriť rady"
 OPEN_HINT: "Otvoriť radu"
 EXPAND_HINT: "Kliknite pre rozvinutie rady"
 COLLAPSE_HINT: "Kliknite pre zbalenie rady"
 EMPTY_HINT_SCREEN_TEXT: "Naša krajina funguje hladko a nemáme žiadne rady!"
 OPEN_HINT_TEXT: "Zobraziť radu @hint!"
 ALERT_HINT: "Otvoriť s radou"
 ALERT_ADVANCES_HINT: "Otvoriť panel Pokrokov s radou"
 HINT_TITLE: "Rada @hint!"
 RECOMMENDED_ACTIONS_TITLE: "@hint! Odporúčané akcie"
 SCRIPTABLE_HINT_DEFINITION_TEXT: "$MAIN_HINT$ $CONTEXT_HINT$"
 HINT_DIVIDER: "\n\n---\n\n"
 HINT_SORT_BY_PRIORITY: "Zoradiť podľa priority"
 hint_advisor_salute_diplomatic: "\n\"Dovoľte mi predstaviť sa, Vaša Výsosť. Som [Player.GetGovernment.CalcBestRepresentativeForPlaystyle('diplomatic').GetName], Váš politický poradca a najslušnejší služobník.\""
 hint_advisor_salute_administrative: "\n\"Volám sa [Player.GetGovernment.CalcBestRepresentativeForPlaystyle('administrative').GetName], verný radca Vášho veličenstva vo všetkom, čo sa týka hospodárstva.\""
 hint_advisor_salute_military: "\n\"Volám sa [Player.GetGovernment.CalcBestRepresentativeForPlaystyle('military').GetName], Váš odborník na vojenské záležitosti. K vašim službám.\""
 HINTS_AND_SUGGESTIONS: "Rady a návrhy"
 MANPOWER_HINT: "Nedostatok personálu!"
 manpower_topbar_hint: "Viac [manpower_with_icon|e] získavame predovšetkým výstavbou určitých typov [building_with_icon|e]." # todo: CHANGED
 MANPOWER_HINT_EXTRA: "Môžeme postaviť nasledujúce budovy, aby sme získali viac [manpower_with_icon|e]:" # todo: CHANGED
 MANPOWER_HINT_NONE: "Bohužiaľ, neexistujú žiadne budovy, ktoré by sme mohli postaviť a ktoré by nám dali viac personálu."
 MANPOWER_HINT_BUILDING: "$BULLET_WITH_TAB$[BUILDING_TYPE.GetName]"
 SAILORS_HINT: "Nedostatok námorníkov!"
 sailors_topbar_hint: "Viac [sailors_with_icon|e] získavame predovšetkým výstavbou špecifických typov [buildings_with_icon|e] v pobrežných [locations_with_icon|e]." # todo: CHANGED
 SAILOR_HINT_EXTRA: "Môžeme postaviť nasledujúce budovy, aby sme získali viac námorníkov:"
 SAILOR_HINT_NONE: "Bohužiaľ, neexistujú budovy, ktoré by sme mohli postaviť a ktoré by nám poskytli námorníkov."
 SAILOR_HINT_BUILDING: "$BULLET_WITH_TAB$[BUILDING_TYPE.GetName]"
 INVALID_MODIFIER_TYPE: "Hľadanie neplatného typu modifikátora!"
 EMPTY_RESEARCH_HINT: "Môžeme zvoliť výskum!"
 empty_research_topbar_hint: "@trigger_no! Nemá žiadnu nevýhodu mať aktívny [research_with_icon|e] a momentálne strácame pokrok, ktorý by mohol byť dosiahnutý inak." # todo: CHANGED
 NO_BUILDINGS_WITH_MODIFIER: "Žiadne"
 GOLD_HINT: "Máme deficit!"
 gold_topbar_hint: "Ak sme v deficite, môžeme znížiť naše [expenses_with_icon|e], zvýšiť [taxes_with_icon|e] alebo viac [mint_with_icon|e] mincí. Ak nám dôjde [gold_with_icon|e], budeme nútení brať si [loans_with_icon|e] a nakoniec môžeme skrachovať [bankrupt_with_icon|e]." # todo: CHANGED
 STABILITY_HINT: "Naša krajina je nestabilná!"
 stability_topbar_hint: "Akcie, ktoré môžeme urobiť pre zvýšenie stability zahŕňajú:\n$BULLET_WITH_TAB$Zvýšenie počtu [GetPlayer.GetReligion.GetAdjective] [ShowPopTypeName('clergy')].\n$BULLET_WITH_TAB$Investovať viac zo [budget_with_icon|e] do stability.\n$BULLET_WITH_TAB$Inštruovať [cabinet_with_icon|e], aby [ShowCabinetActionName('stabilize_country')]." # todo: CHANGED
 LEGITIMACY_HINT: "[Localize( GetPlayer.GetGovernment.GetGovernmentType.GetPowerKey )] je nízka!"
 legitimacy_topbar_hint: "Existuje niekoľko spôsobov, ako to riešiť:\n$BULLET_WITH_TAB$Zvýšiť [budget_with_icon|e] na [court_maintenance_with_icon|e].\n$BULLET_WITH_TAB$Inštruovať [cabinet_with_icon|e], aby [ShowCabinetActionName('strengthen_government')]." # todo: CHANGED
 devotion_topbar_hint: "$legitimacy_topbar_hint$"
 republican_tradition_topbar_hint: "$legitimacy_topbar_hint$"
 horde_unity_topbar_hint: "$legitimacy_topbar_hint$"
 tribal_cohesion_topbar_hint: "$legitimacy_topbar_hint$"
 GOLD_VIEW_HINT: "Zobraziť rady o deficite"
 hint_in_deficit: "Negatívny zostatok"
 hint_in_deficit_hint_text: "$hint_in_deficit_hint_text_1$\n\n$hint_in_deficit_hint_text_2$\n\n$hint_in_deficit_hint_text_3$"
 hint_in_deficit_hint_text_1: "Máme negatívny zostatok. Ak nebudeme opatrní, môže to viesť k dlhu alebo dokonca k bankrotu."
 hint_in_deficit_hint_text_2: "#T Odporúčané kroky:#!\n@arrow_bonus_tier_3! Prejdite na @economy_panel! [Link('economy', '', 'lateralview_economy_entry_name')] a pozrite si naše [income_with_icon|e] a [expenses]. Posúvajte posuvníky na zvýšenie [taxes_with_icon|e] alebo zníženie nákladov.\n@arrow_bonus_tier_2! Uistite sa, že všetky naše [buildings_with_icon|E] sú ziskové, alebo postavte viac, ak si to môžeme dovoliť. Urobíte to v @production_panel! [Link('production', '', 'lateralview_production_entry_name')].\n@arrow_bonus_tier_2! Správa alebo využitie vašich [estates_with_icon|E] môže tiež priniesť významné zisky krátkodobo aj dlhodobo. Majte na pamäti, že stavy môžu mať veľkú politickú moc a ich prílišné využívanie môže byť rizikové. Nájdu sa v @government_panel! [Link('government', 'tabcontent = estates', 'lateralview_government_entry_name')]\n@arrow_bonus_tier_1! Nastavenie ziskových [trades_with_icon|E] je tiež skvelý zdroj príjmov. Prehľadajte existujúce alebo potenciálne obchodné trasy v @economy_panel! [Link('trade', '', 'lateralview_trade_entry_name')]" # todo: CHANGED
 hint_in_deficit_hint_text_3: "#T Extra tipy:#!\n@hint! [laws_with_icon|E], [reforms_with_icon|E], [diplomacy_with_icon|E] a ďalšie vám môžu poskytnúť možnosti na riešenie záporného zostatku." # todo: CHANGED
 hint_in_deficit_military: "\"Vojna môže byť krátkodobo nákladná, ale ak budeme úspešní, môžeme prenechať nepriateľa aby za ňu zaplatil. Získanie území môže priniesť dlhodobé zisky a vydieranie nepriateľov môže poskytnúť krátkodobý príliv bohatstva.\""
 hint_in_deficit_explorer: "\"Veľké neznámo je iste plné bohatstva, pripravené na rozvoj a drancovanie.\""
 hint_in_deficit_administrative: "\"Dominancia na domácom trhu by bol výborný spôsob, ako rozvíjať naše bohatstvo. Ak sme ambiciózni, založenie postavení na zahraničných trhoch môže ešte viac podporiť rast.\"" # todo: NEW TRANSLATION
 hint_in_deficit_diplomatic: "\"Ako sa hovorí, musíme minúť peniaze, aby sme zarobili! Zabezpečiť, že naše budovy a obyvateľstvo sú ziskové, je najlepší spôsob, ako zvrátiť situáciu.\"" # todo: NEW TRANSLATION
 hint_cultural_capacity: "Presiahnutie kultúrnej kapacity" # todo: NEW TRANSLATION
 hint_cultural_capacity_hint_text: "$hint_cultural_capacity_hint_text_1$\n\n$hint_cultural_capacity_hint_text_2$\n\n$hint_cultural_capacity_hint_text_3$" # todo: NEW TRANSLATION
 hint_cultural_capacity_hint_text_1: "Aj keď multikultúrnosť prináša veľa výhod, národy, ktoré nie sú pripravené na administratívne bremená a postrádajú [cultural_capacity_with_icon|E], utrpia penalizácie. [pops_with_icon|E] patriace k [cultures_with_icon|E] iným než našej [primary_culture_with_icon|E] budú obyčajne začínať ako [non_accepted_culture_short_with_icon|E], ale môžu byť [tolerated_culture_short_with_icon|E] alebo [accepted_culture_short_with_icon|E] za cenu." # todo: CHANGED
 hint_cultural_capacity_hint_text_2: "#T Odporúčané kroky:#!\n@arrow_bonus_tier_3! Zvážte degradáciu menej strategicky dôležitej kultúry, aby ste znížili náklady.\n@arrow_bonus_tier_2! Existujú zdroje [ShowModifierTypeName('cultures_capacity')], bežne v [government_reforms_with_icon|E] a [advances_with_icon|E]." # todo: CHANGED
 hint_cultural_capacity_hint_text_3: "#T Extra tipy:#!\n@hint! [assimilation_with_icon|e] môže tiež pomôcť znížiť počet kultúr v krajine." # todo: CHANGED
 hint_cultural_capacity_military: "\"Plné využitie našich kultúr je kľúčové pre tvorbu kultúrnej tradície a vplyvu - dáva nám prevahu pri kultúrnom konflikte. Zvýšenie práv cudzích kultúr nám tiež poskytne ďalšie levy a vojakov.\"" # todo: NEW TRANSLATION
 hint_cultural_capacity_administrative: "\"Naša kultúra sa môže prejaviť aj prostredníctvom úžasných umeleckých diel našich národných umelcov. Napokon, čo je národ iné než súčet jeho vplyvu vo svete?\"" # todo: NEW TRANSLATION
 hint_cultural_capacity_diplomatic: "\"Postupom času sa cudzie kultúry môžu asimilovať bližšie k našej primárnej kultúre v [GetPlayer.GetNameWithNoTooltip]! Kto by nechcel byť [GetPlayer.GetCulture.GetNameWithNoTooltip]?\"" # todo: NEW TRANSLATION
 hint_unhappy_estates: "Nespokojné stavy" # todo: NEW TRANSLATION
 hint_unhappy_estates_hint_text: "$hint_unhappy_estates_hint_text_1$\n\n$hint_unhappy_estates_hint_text_2$\n\n$hint_unhappy_estates_hint_text_3$" # todo: NEW TRANSLATION
 hint_unhappy_estates_hint_text_1: "Udržiavať [estates_with_icon|e] spokojné je dôležitá každodenná súčasť riadenia krajiny. Spoločne predstavujú významný podiel na ekonomickej a vojenskej sile krajiny.\n\nKaždý nelojálny [estate] udelí tresty vašej [country] a spôsobí, že jeho zložky [pops_with_icon|e] sa s veľkou pravdepodobnosťou pridajú k [rebellions_with_icon|e]." # todo: NEW TRANSLATION
 hint_unhappy_estates_hint_text_2: "#T Odporúčané kroky:#!\n@arrow_bonus_tier_3! Ich produkciu a [estate_satisfaction_short_with_icon|E] možno riadiť udeľovaním alebo odoberaním privilégií v @government_panel! [Link('government', 'tabcontent = estates', 'lateralview_government_entry_name')].\n@arrow_bonus_tier_2! Zvyšovanie a znižovanie daní v @economy_panel! [Link('economy', '', 'lateralview_economy_entry_name')] tiež ovplyvní ich spokojnosť." # todo: CHANGED
 hint_unhappy_estates_hint_text_3: "#T Extra tipy:#!\n@hint! [parliament_with_icon|e] môže byť tiež použitý na pomoc pri riadení [estate_satisfaction_with_icon|e].\n@hint! Viac o [rebel_movements_with_icon] sa dozviete v [Link('hints', 'selected_hint = hint_rebels_growing', 'Rebels Hint')]." # todo: CHANGED
 hint_unhappy_estates_administrative: "\"Stavy sú rozhodujúce pre zdravé obchodné impérium. Áno, možno budeme musieť v dlhodobom horizonte obetovať časť autority, ale pomyslite na ekonomiku!\"" # todo: NEW TRANSLATION
 hint_unhappy_estates_diplomatic: "\"Naše stavy môžu mať názory aj na diplomatické záležitosti. Môže byť užitočné zvážiť ich hodnotenie cudzej moci pri posudzovaní spojenectiev alebo paktov.\"" # todo: NEW TRANSLATION
 hint_unhappy_estates_military: "\"Naše stavy poskytujú dôležité levy na podporu expanzie. Ak ich nezískame na svoju stranu, môže nám chýbať nábor práve vtedy, keď ho budeme potrebovať.\"" # todo: NEW TRANSLATION
 ESTATE_CONTEXT_TEXT: "Vo vašej krajine sú $LIST$ nespokojné.\n\n$TEXT$" # todo: NEW TRANSLATION
 HINT_UNHAPPY_ESTATE: "[ESTATE.GetName]" # todo: NEW TRANSLATION
 hint_manpower: "Ľudské zdroje" # todo: NEW TRANSLATION
 hint_manpower_hint_text: "$hint_manpower_hint_text_1$\n\n$hint_manpower_hint_text_2$\n\n$hint_manpower_hint_text_3$" # todo: NEW TRANSLATION
 hint_manpower_hint_text_1: "Náš [manpower_with_icon|e] je rezervou mužov pripravených byť naverbovaní ako [regulars_with_icon|e] pre naše [armies_with_icon|e]. Regulars sú vo [battle_with_icon|e] výrazne lepší než [levies_with_icon|e], ale sú drahí, takže nie každá [country_with_icon|e] si ich môže dovoliť na začiatku hry." # todo: CHANGED
 hint_manpower_hint_text_2: "#T Odporúčané kroky:#!\n@arrow_bonus_tier_3! Ak sa spoliehame na [regulars] pri vedení vojny, nízky [manpower] vážne obmedzuje našu schopnosť doplniť [armies_with_icon|e], takže nie je múdre vyhlásiť [war_with_icon|E], keď máme nízke zásoby manpower.\n@arrow_bonus_tier_2! Ak nám dochádza manpower počas vojny, zvážte väčšie využitie [levies_with_icon|E], nájomných [mercenaries_with_icon|E], alebo dokonca zvážte rokovania o [peace_with_icon|E]." # todo: CHANGED
 hint_manpower_hint_text_3: "#T Extra tipy:#!\n@hint! Našu maximálnu manpower a schopnosť naverbovať stálu armádu môžeme zvýšiť rôznymi [buildings_with_icon|E].\n@hint! [estate_privileges_with_icon|E] a [laws_with_icon|E] tiež môžu ovplyvniť náš manpower potenciál." # todo: CHANGED
 hint_manpower_diplomatic: "\"Elitná stála armáda obsadená dobrými [GetPlayer.GetAdjectiveWithNoTooltip] mužmi a chlapcami je zvyčajne najefektívnejšia bojová sila na hlavu.\"" # todo: NEW TRANSLATION
 hint_manpower_military: "\"Konquista by mala používať všetky dostupné prostriedky. Rozsiahla armáda by mala využívať žoldnierov, levy aj stálu armádu naraz.\"" # todo: NEW TRANSLATION
 hint_manpower_administrative: "\"Nezabúdajte, že každý vojak, ktorý zomrie na bojisku, je o jedného robotníka menej na poli. Vojna je drahá.\"" # todo: NEW TRANSLATION
 hint_low_stability: "Nízka stabilita" # todo: NEW TRANSLATION
 hint_low_stability_hint_text: "$hint_low_stability_hint_text_1$\n\n$hint_low_stability_hint_text_2$\n\n$hint_low_stability_hint_text_3$" # todo: NEW TRANSLATION
 hint_low_stability_hint_text_1: "Ak je naša [stability_with_icon|E] nízka, hrozí, že [pops_with_icon|E] sa pridajú ku [rebellion_with_icon|E], nespokojnosť [estate_with_icon|E] môže viesť k [civil_war_with_icon|E] a všeobecný chaos v krajine." # todo: CHANGED
 stability_raise_actions: "@arrow_bonus_tier_3! Investovať viac zo [budget_with_icon|e] do stability.\n@arrow_bonus_tier_2! Inštruovať [cabinet_with_icon|e], aby [ShowCabinetActionName('stabilize_country')]\n@arrow_bonus_tier_1! Zvýšiť počet [GetPlayer.GetReligion.GetAdjective] [ShowPopTypeName('clergy')]." # todo: CHANGED
 hint_low_stability_hint_text_2: "#T Odporúčané akcie:#!\n$stability_raise_actions$" # todo: NEW TRANSLATION
 hint_low_stability_hint_text_3: "#T Extra tipy:#!\n@hint! Existujú aj iné zdroje stability, ako [advances_with_icon|e] alebo [policies_with_icon|e].\n@hint! Pamätajte, že stabilita sa tiež spotrebováva pri dôležitých akciách, ako vyhlásenie [wars_with_icon|E] bez správneho [casus_belli_with_icon|e] alebo zmena [law_with_icon|e]." # todo: CHANGED
 hint_low_stability_administrative: "\"Krajina s vysokou stabilitou je samozrejme krajina v stave prosperity! Keď sú úrody bohaté, tak isto prúdi bohatstvo do našich pokladníc.\"" # todo: NEW TRANSLATION
 hint_low_stability_military: "\"Krajina nemôže bezpečne uplatňovať dominanciu, kým najprv nedosiahne skľudnenie svojho obyvateľstva. Bežní ľudia tak milujú svoje vidly...\"" # todo: NEW TRANSLATION
 hint_low_stability_diplomatic: "\"Naši susedia sa budú škodoradostne pozerať, ak potopíme našu krajinu do zániku. Nemohli by sme s tým niečo urobiť?\"" # todo: NEW TRANSLATION
 hint_very_low_stability: "Veľmi nízka stabilita" # todo: NEW TRANSLATION
 hint_very_low_stability_hint_text: "$hint_very_low_stability_hint_text_1$\n\n$hint_very_low_stability_hint_text_2$\n\n$hint_very_low_stability_hint_text_3$" # todo: NEW TRANSLATION
 hint_very_low_stability_hint_text_1: "Naša [stability_with_icon|E] je extrémne nízka a hrozí nám, že [pops_with_icon|E] sa pridajú ku [rebellion_with_icon|E], nespokojnosť [estate_with_icon|E] vedie k [civil_war_with_icon|E] a nepriatelia využijú príležitosť zaútočiť, keď sme slabí." # todo: CHANGED
 hint_very_low_stability_hint_text_2: "#T Odporúčané kroky:#!\n@arrow_bonus_tier_3! Mali by sme zvýšiť stabilitu čo najskôr a vyhnúť sa vyhlasovaniu ďalších [wars_with_icon|E] alebo ďalším akciám, ktoré stabilitu znižujú.\n$stability_raise_actions$" # todo: CHANGED
 hint_very_low_stability_hint_text_3: "$hint_low_stability_hint_text_3$" # todo: NEW TRANSLATION
 hint_very_low_stability_administrative: "\"Ako môže niekto očakávať, že sa bude v takejto ekonomike obchodovať? Nech nám niekto pomôže s rozpočtom, naše dobytok hladujú.\"" # todo: NEW TRANSLATION
 hint_very_low_stability_military: "\"Každý nepriateľ [GetPlayer.GetNameWithNoTooltip] by bol nadšený, akoby sme vyzerali takto slabí. Mali by sme očakávať, že rivali a nepriatelia začnú spisovať plány proti nám.\"" # todo: NEW TRANSLATION
 hint_very_low_stability_diplomatic: "\"Kým národ v období vysokej stability zažíva vynikajúcu sociálnu mobilitu, my sme zrejme vynašli istú formu sociálnej demobilizácie.\"" # todo: NEW TRANSLATION
 hint_low_legitimacy: "Nízka legitimita" # todo: NEW TRANSLATION
 hint_low_legitimacy_hint_text: "$hint_low_legitimacy_hint_text_1$\n\n$hint_low_legitimacy_hint_text_2$\n\n$hint_low_legitimacy_hint_text_3$" # todo: NEW TRANSLATION
 hint_low_legitimacy_hint_text_1: "[legitimacy_with_icon|E] predstavuje, ako svet vníma oprávnenosť nášho [GetPlayer.GetGovernment.GetRulerTitle] vládnuť. Ak klesne príliš nízko, nielenže stratíme výhody k [crown_power_with_icon|E] a zníženú šancu na [rebellion_with_icon|E], ale začneme dostávať penalizácie k spokojnosti [estate_with_icon|E] a [righteousness_with_icon|E]." # todo: CHANGED
 hint_low_legitimacy_hint_text_2: "#T Odporúčané kroky:#!\n@arrow_bonus_tier_3! Mali by sme si udržiavať legitimitu čo najvyššiu, aby sme minimalizovali potenciálne penalizácie.\n@arrow_bonus_tier_2! Zvýšenie [court_maintenance_with_icon|e] pomôže udržať vysokú [legitimacy_with_icon|e].\n@arrow_bonus_tier_2! Môžeme tiež získať iné zdroje [legitimacy_with_icon|e], napr. [advances_with_icon|e] alebo [policies_with_icon|e].\n@arrow_bonus_tier_1! Zvoľte [cabinet_action_with_icon|e] s názvom [ShowCabinetActionName('strengthen_government')]." # todo: CHANGED
 hint_low_legitimacy_hint_text_3: "#T Extra tipy:#!\n@hint! Rovnako ako väčšina dôležitých hodnôt, vytvorenie priaznivého obrazu vašej [dynasty_with_icon|E] zaberie čas, takže myslite dlhodobo." # todo: CHANGED
 hint_low_legitimacy_administrative: "\"Ktokoľvek, kto preverí záznamy o našom pôvode a nádheru nášho dvora, nebude schopný poprieť naše právo vládnuť.\"" # todo: NEW TRANSLATION
 hint_low_legitimacy_military: "\"Ako môžeme očakávať, že naše armády budú báť, keď naši vlastní vojaci spochybňujú naše vedenie?\"" # todo: NEW TRANSLATION
 hint_low_legitimacy_diplomatic: "\"Niekedy vnútorná sila vychádza z toho, ako nás vnímajú ostatní, a naši spojenci nám môžu tiež pomôcť v časoch núdze.\"" # todo: NEW TRANSLATION
 hint_low_republican_tradition: "Nízka republikánska tradícia"
 hint_low_republican_tradition_hint_text: "$hint_low_republican_tradition_hint_text_1$\n\n$hint_low_republican_tradition_hint_text_2$\n\n$hint_low_republican_tradition_hint_text_3$" # todo: NEW TRANSLATION
 hint_low_republican_tradition_hint_text_1: "[republican_tradition_with_icon|E] predstavuje zakorenenie republikánstva v našom [GetPlayer.GetGovernment.GetGovernmentType.GetName]. Ak klesne príliš nízko, nielenže stratíme výhody k [legislative_efficiency_with_icon|E] a zníženú šancu na [rebellion_with_icon|E], ale začneme dostávať vážne penalizácie k nákladom na zvyšovanie [stability_with_icon|E]." # todo: CHANGED
 hint_low_republican_tradition_hint_text_2: "#T Odporúčané kroky:#!\n@arrow_bonus_tier_3! Mali by sme sa snažiť udržiavať tradíciu čo najvyššiu, aby sme minimalizovali možné penalizácie.\n@arrow_bonus_tier_2! Zvýšenie [court_maintenance_with_icon|e] pomôže udržať vysokú [republican_tradition_with_icon|e].\n@arrow_bonus_tier_2! Môžeme získať ďalšie zdroje [republican_tradition_with_icon|e], napr. [advances_with_icon|e] alebo [policies_with_icon|e].\n@arrow_bonus_tier_1! Zmena [ruler_with_icon|e] počas [election_with_icon|e] tiež pomôže udržať vysokú [republican_tradition_with_icon|e]." # todo: CHANGED
 hint_low_republican_tradition_hint_text_3: "#T Ďalšie tipy:#!\n@hint! Ako pri väčšine dôležitých hodnôt, výchova obyvateľstva k republikánskym hodnotám je dlhodobé úsilie - myslite dopredu." # todo: NEW TRANSLATION
 hint_low_republican_tradition_administrative: "\"Voľby sú prirodzeným procesom každej zdravé republiky.\"" # todo: NEW TRANSLATION
 hint_low_republican_tradition_military: "\"Ani žoldnieri nebudú ochotní bojovať za nás, ak vyzeráme ako tyrani.\"" # todo: NEW TRANSLATION
 hint_low_republican_tradition_diplomatic: "\"Žiadny národ, ktorý si cení svoju silu, sa dobrovoľne nespojí s krajinou, ktorá blatantne ignoruje princípy svojho základu.\"" # todo: NEW TRANSLATION
 hint_low_devotion: "Nízka oddanosť" # todo: NEW TRANSLATION
 hint_low_devotion_hint_text: "$hint_low_devotion_hint_text_1$\n\n$hint_low_devotion_hint_text_2$\n\n$hint_low_devotion_hint_text_3$" # todo: NEW TRANSLATION
 hint_low_devotion_hint_text_1: "$game_concept_devotion_desc$ Ak klesne príliš nízko, nielenže stratíme výhody k [religious_influence_with_icon|E] a zníženú šancu na [rebellion_with_icon|E], ale začneme dostávať penalizácie k spokojnosti [estate_with_icon|E]." # todo: CHANGED
 hint_low_devotion_hint_text_2: "#T Odporúčané kroky:#!\n@arrow_bonus_tier_3! Mali by sme sa snažiť udržiavať našu oddanosť čo najvyššiu, aby sme minimalizovali možné penalizácie.\n@arrow_bonus_tier_2! Zvýšenie [court_maintenance_with_icon|e] pomôže udržať vysokú [devotion_with_icon|e].\n@arrow_bonus_tier_2! Môžeme získať ďalšie zdroje [devotion_with_icon|e], napr. [advances_with_icon|e] alebo [policies_with_icon|e]." # todo: CHANGED
 hint_low_devotion_hint_text_3: "#T Ďalšie tipy:#!\n@hint! Ako pri väčšine dôležitých hodnôt, podporovanie náboženskej horlivosti nie je záležitosť noci, takže myslite dlhodobo." # todo: NEW TRANSLATION
 hint_low_devotion_administrative: "\"Nestačí len zastupovať vieru a tváriť sa ako jej obrancovia, musíme tomu aj vyzerať zodpovedať.\"" # todo: NEW TRANSLATION
 hint_low_devotion_military: "\"Ak majú naše armády predstavovať meč a štít veriacich, musíme byť svetlom, za ktoré bojujú.\"" # todo: NEW TRANSLATION
 hint_low_devotion_diplomatic: "\"Naším cieľom by malo byť šíriť našu vieru čo najďalej, ale nikto nebude ochotný veriť našim slovám, ak nevyzeráme pobožne.\"" # todo: NEW TRANSLATION
 hint_low_horde_unity: "Nízka jednota húfov" # todo: NEW TRANSLATION
 hint_low_horde_unity_hint_text: "$hint_low_horde_unity_hint_text_1$\n\n$hint_low_horde_unity_hint_text_2$\n\n$hint_low_horde_unity_hint_text_3$" # todo: NEW TRANSLATION
 hint_low_horde_unity_hint_text_1: "$game_concept_horde_unity_desc$" # todo: NEW TRANSLATION
 hint_low_horde_unity_hint_text_2: "#T Odporúčané kroky:#!\n@arrow_bonus_tier_3! Najefektívnejšou metódou na zjednotenie hordu je poraziť nepriateľov.\n@arrow_bonus_tier_2! Zvýšenie [court_maintenance_with_icon|e] pomôže udržať vysokú [horde_unity_with_icon|e].\n@arrow_bonus_tier_2! Môžeme získať ďalšie zdroje [horde_unity_with_icon|e], napr. [advances_with_icon|e] alebo [policies_with_icon|e]." # todo: CHANGED
 hint_low_horde_unity_hint_text_3: "#T Ďalšie tipy:#!\n@hint! Nízka jednota môže mať niektoré devastujúce následky, preto by sme ju mali udržiavať vysokú." # todo: NEW TRANSLATION
 hint_low_horde_unity_administrative: "\"Deliť a panovať je dobre známa stratégia. Ak nie sme zjednotení, budeme tým, koho porazia.\"" # todo: NEW TRANSLATION
 hint_low_horde_unity_military: "\"Ako hovorí naše príslovie: dobré veci prichádzajú tým, ktorí ich uchopia od slabých. Moc nás zjednocuje, a s mocou budeme jednotní!\"" # todo: NEW TRANSLATION
 hint_low_horde_unity_diplomatic: "\"Sila našej bojovej zdatnosti je priamo ovplyvnená tým, ako jednotní sme ako kmeň. Úspech v vojne a dobytí je sebazapĺňajúca sa prerokávanie.\"" # todo: NEW TRANSLATION
 hint_low_tribal_cohesion: "Nízka kmeňová zdržanosť" # todo: NEW TRANSLATION
 hint_low_tribal_cohesion_hint_text: "$hint_low_tribal_cohesion_hint_text_1$\n\n$hint_low_tribal_cohesion_hint_text_2$\n\n$hint_low_tribal_cohesion_hint_text_3$" # todo: NEW TRANSLATION
 hint_low_tribal_cohesion_hint_text_1: "$game_concept_tribal_cohesion_desc$ Na rozdiel od iných [government_types_with_icon|E] majú kmeňové vlády výrazne zvýšenú veľkosť levy, keď koherencia rastie. Ak chceme robiť efektívne vojenské rozhodnutia, musíme mať kmene na svojej strane." # todo: CHANGED
 hint_low_tribal_cohesion_hint_text_2: "#T Odporúčané kroky:#!\n@arrow_bonus_tier_2! Zvýšenie [court_maintenance_with_icon|e] pomôže udržať vysokú [tribal_cohesion_with_icon|e].\n@arrow_bonus_tier_2! Môžeme získať ďalšie zdroje [tribal_cohesion_with_icon|e], napr. [advances_with_icon|e] alebo [policies_with_icon|e]." # todo: CHANGED
 hint_low_tribal_cohesion_hint_text_3: "#T Ďalšie tipy:#!\n@hint! Nízka kohezia môže mať niektoré devastujúce následky, preto by sme ju mali udržiavať vysokú." # todo: NEW TRANSLATION
 hint_low_tribal_cohesion_administrative: "\"Ak jej jednoducho nevenujeme pozornosť, naša kohezia klesne. Spravovanie krajiny si vyžaduje starostlivosť o detaily.\"" # todo: NEW TRANSLATION
 hint_low_tribal_cohesion_military: "\"Zlá kmeňová kohezia nás oslabuje. Slabosť nás ešte viac rozdelí. Nechoďte touto cestou, inak sa môžeme stať porazenými a zotročenými.\"" # todo: NEW TRANSLATION
 hint_low_tribal_cohesion_diplomatic: "\"Stavy sú zakorenené v mnohých aspektoch krajiny, takže takmer každé naše rozhodnutie môže mať následky v budúcnosti. Strategické plánovanie vyžaduje dlhodobé uvažovanie.\"" # todo: NEW TRANSLATION
 hint_war_exhaustion: "Vysoké vojnové vyčerpanie" # todo: NEW TRANSLATION
 hint_war_exhaustion_hint_text: "$hint_war_exhaustion_hint_text_1$\n\n$hint_war_exhaustion_hint_text_2$\n\n$hint_war_exhaustion_hint_text_3$" # todo: NEW TRANSLATION
 hint_war_exhaustion_hint_text_1: "[war_exhaustion_with_icon|E] je hodnota predstavujúca únavu populácie z vedenia vojny. Vysoké hodnoty môžu byť pre krajinu mimoriadne nebezpečné. Ako sa war_exhaustion zvyšuje, znižuje sa bojová účinnosť našej [army_with_icon|E] a [levies_with_icon|E], rast [pops_with_icon|E] a poškodzuje našu ekonomiku." # todo: CHANGED
 hint_war_exhaustion_hint_text_2: "#T Odporúčané kroky:#!\n@arrow_bonus_tier_3! Najefektívnejšia a istá metóda je mier.\n@arrow_bonus_tier_2! Niektoré [laws_with_icon|E] a [estate_privileges_with_icon|E] môžu pomôcť znižovať war_exhaustion v čase." # todo: CHANGED
 hint_war_exhaustion_hint_text_3: "#T Extra tipy:#!\n@hint! Mali by sme tempo našich dobytí prispôsobiť a nevyhlasovať [wars_with_icon|E], ak už máme vysoké war_exhaustion." # todo: CHANGED
 hint_war_exhaustion_administrative: "\"Rozhodné vojny môžu priniesť výhody, ale obyvateľstvo unavené vojnou prináša len zlé dôsledky. Produkcia klesá, spotreba klesá, jednoducho - všetko klesá!\"" # todo: NEW TRANSLATION
 hint_war_exhaustion_military: "\"Vojnová únava môže byť nebezpečná, ale je primárne výsledkom zlých taktík. Obrovské straty a významné porážky rýchlo obrátili ľudí proti nám.\"" # todo: NEW TRANSLATION
 hint_war_exhaustion_diplomatic: "\"Prehra vo vojne nie je nikdy dobrá vec, ale utrpenie krutej porážky môže tiež viesť obyvateľstvo k pomste. Revanchizmus je mocný opiát.\"" # todo: NEW TRANSLATION
 hint_low_sailors: "Nedostatok námorníkov" # todo: NEW TRANSLATION
 hint_low_sailors_hint_text: "$hint_low_sailors_hint_text_1$\n\n$hint_low_sailors_hint_text_2$\n\n$hint_low_sailors_hint_text_3$" # todo: NEW TRANSLATION
 hint_low_sailors_hint_text_1: "$game_concept_sailors_desc$" # todo: NEW TRANSLATION
 hint_low_sailors_hint_text_2: "#T Odporúčané kroky:#!\n@arrow_bonus_tier_3! Ak sa spoliehame na [ships_with_icon|e] pri vedení vojny, nízky počet námořníkov výrazne obmedzí našu schopnosť obnoviť [navies_with_icon|e], takže nie je múdre vyhlasovať [war_with_icon|E], keď máme málo námořníkov.\n@arrow_bonus_tier_2! [explorations_with_icon|e] tiež vyžadujú námorníkov, takže ich treba správne plánovať." # todo: CHANGED
 hint_low_sailors_hint_text_3: "#T Extra tipy:#!\n@hint! Produkciu námorníkov môžeme zlepšiť výstavbou rôznych [buildings_with_icon|E].\n@hint! [estate_privileges_with_icon|E] a [laws_with_icon|E] tiež môžu ovplyvniť potenciál námorníkov." # todo: CHANGED
 hint_low_sailors_administrative: "\"Kto ovláda more, ovláda bohatstvo sveta. Silná námorná a námornícka tradícia ide ruka v ruke s obchodnou dominanciou.\"" # todo: NEW TRANSLATION
 hint_low_sailors_military: "\"Silné námorníctvo s dostatkom námorníkov umožňuje vyťažiť z ďalekých krajín i vnútrozemia. Dokonca aj vojaci pôsobiaci v zálohe profitujú z chránených zásobovacích liniek.\"" # todo: NEW TRANSLATION
 hint_low_sailors_diplomatic: "\"Námorné stavby často priamo ovplyvňujú náš obchodný potenciál. Stojí za to zvážiť synergie medzi týmito oblasťami.\"" # todo: NEW TRANSLATION
 hint_low_diplomats: "Málo diplomatov" # todo: NEW TRANSLATION
 hint_low_diplomats_hint_text: "$hint_low_diplomats_hint_text_1$\n\n$hint_low_diplomats_hint_text_2$\n\n$hint_low_diplomats_hint_text_3$" # todo: NEW TRANSLATION
 hint_low_diplomats_hint_text_1: "[diplomats_with_icon|E] sú potrební na správu našich diplomatických vzťahov s inými krajinami. Mnohé akcie, ako Zlepšenie vzťahov, nás budú stáť diplomatov priebežne, zatiaľ čo jednorazové akcie majú spravidla fixné náklady." # todo: CHANGED
 hint_low_diplomats_hint_text_2: "#T Odporúčané kroky:#!\n@arrow_bonus_tier_3! Zrušenie zlepšovania vzťahov s niektorými krajinami uvoľní našich diplomatov, ak ich nemáme dosť.\n@arrow_bonus_tier_2! Môžeme tiež získať viac diplomatov z iných zdrojov, ako sú [advances_with_icon|e]." # todo: CHANGED
 hint_low_diplomats_hint_text_3: "#T Dodatočné tipy:#!\n@hint! Aj keď je dobré mať rezervu diplomatov pre príležitostné akcie, plánovanie využitia diplomatov v dlhodobom horizonte je tiež nevyhnutné pre úspech." # todo: NEW TRANSLATION
 hint_low_diplomats_administrative: "\"Udržiavanie dobrých vzťahov je kľúčom k ziskovému impériu! Prístup k väčším a lepším trhom bude nevyhnutne nasledovať po priateľstve s našimi susedmi.\"" # todo: NEW TRANSLATION
 hint_low_diplomats_military: "\"Diplomati môžu byť tiež použité na preukázanie našej nadvlády nad slabšími štátmi. Metódou priateľstva či hrozby—čím silnejší budeme, tým pravdepodobnejšie sa ostatní podvolia.\"" # todo: NEW TRANSLATION
 hint_low_diplomats_diplomatic: "\"Reforma a rozvoj našej vlády je istý spôsob, ako zlepšiť našu kapacitu pre ďalšiu diplomaciu. Samozrejme, niektoré kultúry sú k umeniu presviedčania jednoducho viac predisponované ako iné.\"" # todo: NEW TRANSLATION
 LOW_DIPLOMATS_HINT: "Nedostatok diplomatov!" # todo: NEW TRANSLATION
 hint_low_food_in_market: "Nedostatok potravín na trhu" # todo: NEW TRANSLATION
 hint_low_food_in_market_hint_text: "$hint_low_food_in_market_hint_text_1$\n\n$hint_low_food_in_market_hint_text_2$\n\n$hint_low_food_in_market_hint_text_3$" # todo: NEW TRANSLATION
 hint_low_food_in_market_hint_text_1: "Trhy potrebujú dostatok uloženého [food_with_icon|E], aby zabezpečili svoje provincie. Bez toho môžu lokality patriace týmto provinciám hladovať [starving_with_icon|E]." # todo: CHANGED
 hint_low_food_in_market_hint_text_2: "#T Odporúčané kroky:#!\n@arrow_bonus_tier_3! Zlepšenie [rgo_with_icon|e], ktoré produkujú jedlo, zvýši jeho zásobu.\n@arrow_bonus_tier_2! Môžeme [import_with_icon|e] jedlo zavedením [trades_with_icon|e] na [goods_with_icon|e] produkujúce jedlo." # todo: CHANGED
 hint_low_food_in_market_hint_text_3: "#T Extra tipy:#!\n@hint! Zníženie počtu [buildings_with_icon|e] v [location_with_icon|e] tiež spôsobí, že [pops_with_icon|e] sa vrátia k [subsistence_agriculture_with_icon|e]." # todo: CHANGED
 HINT_MARKET_ENTRY: "[MARKET.GetName]" # todo: NEW TRANSLATION
 HINT_BUILDING_ENTRY: "[BUILDING_TYPE.GetName]" # todo: NEW TRANSLATION
 LOW_FOOD_CAP_TEXT: "[SelectLocalization( StringIsEmpty( GetListOfAvailableBuildingsWithModifier('merchant_capacity_from_building') ), Localize('LOW_FOOD_NO'), Localize( 'LOW_FOOD_YES' ) )]" # todo: NEW TRANSLATION
 LOW_FOOD_YES: "\n@arrow_bonus_tier_1! Ak máme [merchant_capacity_with_icon|E], môžeme vytvoriť dovoz jedla z iného trhu, ktorý má prebytok.\n\nAk nemáme kapacitu, výstavba budovy ako [GetListOfAvailableBuildingsWithModifier('merchant_capacity_from_building')] môže zvýšiť náš obchodný potenciál." # todo: CHANGED
 LOW_FOOD_NO: "\n\nAk máme [merchant_capacity_with_icon|E], môžeme vytvoriť dovoz jedla z iného trhu, ktorý má prebytok." # todo: CHANGED
 LOW_MARKET_FOOD_TEXT: "Zásoby [food_with_icon|E] v $LIST$ dosiahli kritické hodnoty.$LOW_FOOD_CAP_TEXT$" # todo: CHANGED
 LOW_MARKET_FOOD_TEXT_BUILDINGS: "Zásoby [food_with_icon|E] v $LIST$ dosiahli kritické hodnoty.\n\nExistuje niekoľko vrstiev riešenia nedostatku jedla na trhu. Čím viac jedla lokácia produkuje, tým menší odlev to bude predstavovať pre provinciu a trh, ku ktorému patrí, a môže dokonca pomôcť iným lokalitám, ak generuje prebytok.\n\n\n@arrow_bonus_tier_3! [rgo_with_icon|e] sú hlavným zdrojom [food], najmä v lokalitách s vysokou [food_productivity_with_icon|e]. Mali by sme sa najprv zamerať na ich rozšírenie, ak má náš [market] nedostatok [food].\n@arrow_bonus_tier_2! [buildings_with_icon|E] ako $BUILDING_LIST$ môžu tiež zvýšiť produkciu jedla, ak produkcia [goods_with_icon|E] súhlasí.$LOW_FOOD_CAP_TEXT$" # todo: CHANGED
 hint_low_food_in_market_administrative: "\"Trhy s lokalitami špecializovanými na výrobu potravín ponúkajú bezpečie aj obrovský ziskový potenciál. Ak ostatní budú musieť prichádzať k nám, aby prežili, získame takmer neobmedzený vplyv.\"" # todo: NEW TRANSLATION
 hint_low_food_in_market_military: "\"Kým je naša obchodná kapacita obmedzená infraštruktúrou, dovozná ekonomika musí byť zvyčajne podporená silnou námornou prítomnosťou. Bez nej sa vystavíme na milosť každému, kto odváži ohroziť naše obchodné trasy.\"" # todo: NEW TRANSLATION
 hint_low_food_in_market_diplomatic: "\"Sebaudržiavacia ekonomika potravín je pekný cieľ, ale prevádzka dovoznej ekonomiky na nakŕmenie [GetPlayer.GetAdjectiveWithNoTooltip] obyvateľstva nám môže dať silu sústrediť sa na výnosnejšiu produkciu.\"" # todo: NEW TRANSLATION
 hint_over_diplo_capacity: "Presiahnutá diplomatická kapacita" # todo: NEW TRANSLATION
 hint_over_diplo_capacity_hint_text: "$hint_over_diplo_capacity_hint_text_1$\n\n$hint_over_diplo_capacity_hint_text_2$\n\n$hint_over_diplo_capacity_hint_text_3$" # todo: NEW TRANSLATION
 hint_over_diplo_capacity_hint_text_1: "Spoliehať sa na spojenectvá so všetkými znamená mať spojenectvo s nikým. [country_with_icon|e], ktorá má viac vzťahov než jej $game_concept_diplomatic_capacity$, utrpí penalizáciu k [diplomatic_reputation_with_icon|e] a [prestige_with_icon|e]. Niektoré [subject_types_with_icon|e] majú $game_concept_diplomatic_upkeep$, čo znižuje dostupnú kapacitu.\n\nČlenstvo v niektorých [international_organizations_with_icon|e] bude stáť časť $game_concept_diplomatic_capacity$ a sila vášho [ally_with_icon|e] určuje cenu [alliance_with_icon|e]." # todo: CHANGED
 hint_over_diplo_capacity_hint_text_2: "#T Odporúčané kroky:#!\n@arrow_bonus_tier_3! Zastavenie zlepšovania vzťahov našimi [diplomats_with_icon|E] uvoľní kapacitu.\n@arrow_bonus_tier_2! Zvážte ukončenie niektorých [alliances_with_icon|E] alebo [treaties_with_icon|E].\n@arrow_bonus_tier_1! Odchod z [international_organizations_with_icon|E], ktorých už nepotrebujeme, je ďalší spôsob uvoľnenia kapacity." # todo: CHANGED
 hint_over_diplo_capacity_hint_text_3: "#T Extra tipy:#!\n@hint! [estate_privileges_with_icon|E], [laws_with_icon|E] a [advances_with_icon|E] môžu niekedy prideliť ďalšiu diplomatickú kapacitu." # todo: CHANGED
 hint_over_diplo_capacity_military: "\"Možno by sme mali považovať aliancie za prostriedok k dosiahnutiu cieľa, nie za trvalé priateľstvo. Veď aj naši vlastní spojenci nás budú chamtivo pozerať, ak ukážeme slabosť...\"" # todo: NEW TRANSLATION
 hint_over_diplo_capacity_administrative: "\"Preťažovanie našich diplomatov má nežiaduce následky znižujúce ich efektivitu takmer vo všetkých úlohách. Aj keď môže byť lákavé nechať ich preťažených, nie je to dobré dlhodobé riešenie.\"" # todo: NEW TRANSLATION
 hint_over_diplo_capacity_diplomatic: "\"Ak uprednostníme náš vnútorný rozvoj, silné aliancie viac než vykompenzujú akékoľvek vnímané vojenské slabosti. Možno by sme mali najprv zrušiť iné vzťahy?\"" # todo: NEW TRANSLATION
 hint_rebels_growing: "$game_concept_rebel_movements$" # todo: NEW TRANSLATION
 hint_rebels_growing_hint_text: "$hint_rebels_growing_hint_text_1$\n\n$hint_rebels_growing_hint_text_2$\n\n$hint_rebels_growing_hint_text_3$" # todo: NEW TRANSLATION
 hint_rebels_growing_hint_text_1: "Vaše [pops_with_icon|e] sa pripoja k [rebel_movements_with_icon|e], keď ich [pop_satisfaction_with_icon|e] klesne pod [ShowModifierTypeName('pop_join_rebel_threshold')].\n\n[rebel_movements] budú každý mesiac získavať pokrok smerom k otvorenému povstaniu v závislosti od ich podpory. Keď dosiahnu #W 100%#! podporu, začnú [revolt_with_icon|e], alebo [civil_war_with_icon|e].\n\nNajčastejšie dôvody podpory povstalcov sú nízke [stability_with_icon|e], diskriminované [cultures_with_icon|e] a [religions_with_icon|e], a rozzúrené [estates_with_icon|e]." # todo: CHANGED
 hint_rebels_growing_hint_text_2: "#T Odporúčané kroky:#!\n@arrow_bonus_tier_3! Udržiavajte [stability_with_icon|e] a [legitimacy_with_icon|e] čo najvyššie.\n@arrow_bonus_tier_2! Použite [ShowCabinetActionName('rebel_crackdown')] [cabinet_action_with_icon|e] na zastavenie postupu blížiaceho sa [rebellion].\n@arrow_bonus_tier_1! Presuňte [army_with_icon|e] do [province_with_icon|e] s nespokojnými [pops]. Prítomnosť vašich vojsk ich urobí viac... #italic porozumenými#!.\n\nNakoniec je to zvýšenie [pop_satisfaction_icon] spokojnosti rebelských [pops], čo najviac záleží:\n@arrow_bonus_tier_2! Uistite sa, že najpočetnejšie [cultures] vo vašej [country] sú [accepted_culture_short_with_icon|e] alebo [tolerated_culture_short_with_icon|e].\n@arrow_bonus_tier_1! Zabezpečte, aby rebeli mali prístup k zakúpeniu čo najviac svojich [pop_needs_with_icon|e] na svojom [market_with_icon|e].\n@arrow_bonus_tier_3! Udržiavajte vysokú [estate_icon] [estate_satisfaction_with_icon|e], pretože to silne ovplyvňuje spokojnosť všetkých jej príslušných [pops]:\n$TAB$@arrow_bonus_tier_2! Udeľte [privilege_with_icon|e]\n$TAB$@arrow_bonus_tier_2! Úplatkujte [estate]\n$TAB$@arrow_bonus_tier_2! Znížte [taxes_with_icon|e]" # todo: CHANGED
 hint_rebels_growing_hint_text_3: "#T Extra tipy:#!\n@hint! [societal_values_with_icon|E] ako [ShowSocietyDirectionName('communalism')] a [ShowSocietyDirectionName('decentralization')] môžu tiež ovplyvniť pravdepodobnosť rastu rebelov.\n@hint! Rebeli vzniknú v rôznych [rebel_movements] v závislosti od rôznych faktorov. Napríklad [pops] diskriminovanej [culture] budú viac inklinovať k [nationalist_rebels_with_icon|e]." # todo: CHANGED
 hint_rebels_growing_military: "\"Môžu vyzerať tvrdí, ale pri obyčajných ľuďoch sú zvyčajne viac rečou než skutkom. To, čo im často chýba na disciplíne, viac než vykompenzujú počtom.\"" # todo: NEW TRANSLATION
 hint_rebels_growing_administrative: "\"Aj keď sú rebeli určite zlé pre obchod, zvyčajne sú reaktívni — ak vyriešite príčinu ich nepokojov, nielen ich upokojíte, ale aj zlepšíte našu krajinu.\"" # todo: NEW TRANSLATION
 hint_rebels_growing_diplomatic: "\"Naše obyvateľstvo má rôzne identity a príslušnosti. Dobyté národy sú omnoho pravdepodobnejšie, že sa budú chcieť odlúčiť a vytvoriť vlastnú vládu alebo sa dokonca pripojiť k cudzej sile.\"" # todo: NEW TRANSLATION
 hint_call_for_peace: "Výzva na mier" # todo: NEW TRANSLATION
 hint_call_for_peace_hint_text: "$hint_call_for_peace_hint_text_1$\n\n$hint_call_for_peace_hint_text_2$\n\n$hint_call_for_peace_hint_text_3$" # todo: NEW TRANSLATION
 hint_call_for_peace_hint_text_1: "Tento stav sa môže objaviť, ak konkrétna [war_with_icon|E] pretrváva príliš dlho alebo ak odmietneme podpísať [peace_treaty_with_icon|E] napriek celkovému víťazstvu alebo porážke." # todo: CHANGED
 hint_call_for_peace_hint_text_2: "#T Odporúčané kroky:#!\n@arrow_bonus_tier_3! Mali by sme zredukovať straty a podpísať mier skôr, než náš [war_exhaustion_with_icon|E] dosiahne kritické hodnoty.\n@arrow_bonus_tier_2! Môže to znamenať, že prijmeme menej, než sme pôvodne požadovali, alebo dokonca stratíme [war_with_icon|e]." # todo: CHANGED
 hint_call_for_peace_hint_text_3: "#T Extra tipy:#!\n@hint! Čokoľvek stratené kvôli nutnosti podpísať predčasnú [peace_treaty_with_icon|e] možno získať neskôr v inej [war_with_icon|e]." # todo: CHANGED
 hint_call_for_peace_diplomatic: "\"Frustrácia pravidiel vojny môže mať skutočne devastujúce následky pre našu vnútornú stabilitu a našu reputáciu v zahraničí. Prečo by nás mal niekto počúvať, ak sa ukážeme ako nerozumní?\"" # todo: NEW TRANSLATION
 hint_call_for_peace_military: "\"Vojna je len pokračovaním politiky inými prostriedkami. Možno by sme to mali zapísať skôr, než to urobí niekto iný?\"" # todo: NEW TRANSLATION
 hint_call_for_peace_administrative: "\"Výzva na mier bude s časom len horšia. Ľud je možné upokojiť, ale nie navždy ignorovať.\"" # todo: NEW TRANSLATION
 hint_unprofitable_buildings: "Nevýnosné budovy" # todo: NEW TRANSLATION
 hint_unprofitable_buildings_hint_text: "$hint_unprofitable_buildings_hint_text_1$\n\n$hint_unprofitable_buildings_hint_text_2$\n\n$hint_unprofitable_buildings_hint_text_3$" # todo: NEW TRANSLATION
 hint_unprofitable_buildings_hint_text_1: "Budovy sa stanú neziskovými, ak náklady na ich kombinované vstupné [goods_with_icon|E] presiahnu hodnotu ich [produced_goods_with_icon|E]." # todo: CHANGED
 hint_unprofitable_buildings_hint_text_2: "#T Odporúčané kroky:#!\n@arrow_bonus_tier_3! Zabezpečte, aby vstupné suroviny boli lacnejšie tým, že ich vyrábate alebo [importujete_with_icon|E] viac, aby bola ich ponuka dostatočná.\n@arrow_bonus_tier_3! Vytvorenie alebo zabezpečenie ďalšieho dopytu po tovaroch zvýši ich cenu.\n@arrow_bonus_tier_3! [buildings_with_icon|E] možno zatvoriť @building_open! alebo dokonca zničiť, ak už nespĺňajú účel.\n@arrow_bonus_tier_3! [market_owner_with_icon|E] môže uvaliť embargo na krajiny vyvážajúce tovary, ktoré produkuje, aby zvýšil cenu vlastného exportu." # todo: CHANGED
 hint_unprofitable_buildings_hint_text_3: "#T Extra tipy:#!\n@hint! Niektoré budovy možno [subsidized_with_icon|E]. To môže byť užitočné, ak sú náklady na [import_with_icon|E] tovarov potrebných pre [pop_needs_with_icon|E] alebo udržanie armády vysoké." # todo: CHANGED
 hint_unprofitable_buildings_diplomatic: "\"Riadenie ziskovosti priemyslu celej krajiny môže byť náročná úloha. Môžete zapojiť pomoc byrokracie vašej krajiny, ak sa nechcete zaoberať detailmi!\"" # todo: NEW TRANSLATION
 hint_unprofitable_buildings_military: "\"Čím sme silnejší, tým väčšia je naša schopnosť uplatňovať ochrannú politiku. Embargá a obchodné spory sú vždy účinnejšie, keď sú podporené kanónmi.\"" # todo: NEW TRANSLATION
 hint_unprofitable_buildings_administrative: "\"Stratégia manipulácie cien má mnoho vrstiev. S dostatočnou prefíkanosťou môžeme nielen vytvoriť dopyt na trhu, ale aj byť tými, čo ho uspokoja.\"" # todo: NEW TRANSLATION
 NO_HINTS_AVAILABLE: "Žiadne nápovedy k dispozícii!" # todo: NEW TRANSLATION
 hint_trade: "Obchod" # todo: NEW TRANSLATION
 hint_trade_hint_text: "$hint_trade_hint_text_1$\n\n$hint_trade_hint_text_2$\n\n$hint_trade_hint_text_3$" # todo: NEW TRANSLATION
 hint_trade_hint_text_1: "[trade_with_icon|E] zahŕňa presun [goods_with_icon|E] medzi [markets_with_icon|E] a ich predaj a nákup na týchto trhoch." # todo: CHANGED
 hint_trade_hint_text_2: "#T Odporúčané kroky:#!\n@arrow_bonus_tier_3! Založte nové [trade_with_icon|E] trasy na získanie [goods_with_icon|e].\n@arrow_bonus_tier_2! Zvýšte produkciu [goods_with_icon|e], aby ste ich mali viac na obchod." # todo: CHANGED
 hint_trade_hint_text_3: "#T Extra tipy:#!\n@hint! [trade_with_icon|E] trasa môže byť zisková alebo stratová v závislosti od cenového rozdielu medzi [export_with_icon|E] (zdroj) a [import_with_icon|E] (cieľ) [markets_with_icon|E].\n@hint! Každá [country_with_icon|E] prítomná na [market_with_icon|E] má maximálnu [merchant_capacity_with_icon|E], ktorú môže využiť na vytváranie [trade_with_icon|E] trás, a [merchant_power_with_icon|E], ktorý určuje prioritu pri exporte [goods_with_icon|E] v prípade nedostatku.\n@hint! Obchod je možné automatizovať v každom jednotlivom [market_with_icon|E] predvolením kliknutím na súvisiace ozubené koliesko." # todo: CHANGED
 hint_trade_military: "\"Obchod je pre slabochov. Napriek tomu budeme v pozícii vynucovať tok tovaru ovládaním pevniny a mora.\"" # todo: NEW TRANSLATION
 hint_trade_administrative: "\"Jadro našej stratégie: Predpovedať ďalšiu vlnu cien cez hod kockami a nebeské zarovnanie hviezd.\"" # todo: NEW TRANSLATION
 hint_trade_diplomatic: "\"Jeden z neodmysliteľných pilierov zrelého impéria, obchod má potenciál naplniť naše truhlice rýchlejšie než čokoľvek iné.\"" # todo: NEW TRANSLATION
 hint_unused_trade_capacity: "Nevyužitá obchodná kapacita" # todo: NEW TRANSLATION
 hint_unused_trade_capacity_hint_text: "$hint_unused_trade_capacity_hint_text_1$\n\n$hint_unused_trade_capacity_hint_text_2$\n\n$hint_unused_trade_capacity_hint_text_3$" # todo: NEW TRANSLATION
 hint_unused_trade_capacity_hint_text_1: "[merchant_capacity_with_icon|e] sa používa na presun [goods_with_icon|e] medzi [markets_with_icon|e], s očakávaním zisku v procese. Mali by sme vždy využívať všetku našu [merchant_capacity]." # todo: NEW TRANSLATION
 hint_unused_trade_capacity_hint_text_2: "#T Odporúčané kroky:#!\n@arrow_bonus_tier_1! Kliknite na Upozornenie, aby ste videli ovplyvnený trh v @economy_panel! [Link('trade', 'subtab = markets', 'Markets Panel')]. Odtiaľ môžete priradiť obchodnú kapacitu k navrhovaným obchodom.\n@arrow_bonus_tier_1! Môžete tiež kliknúť na hlavičku trhu a prejsť do Panelu trhu, kde uvidíte zoznam [goods_with_icon|e] relevantných pre daný trh. Kliknite na tlačidlá Export/Import pri každom [good], aby ste spustili obchod.\n@automation! Odporúča sa automatizovať obchod vo všetkých vašich trhoch stlačením ozubeného kolieska v karte trhu. Vždy môžete manuálne vytvoriť a zablokovať obchody, aj keď je obchod automatizovaný." # todo: CHANGED
 hint_unused_trade_capacity_hint_text_3: "#T Dodatočné tipy:#!\n@hint! Zisk z [trade] sa delí medzi [estates_with_icon|e], vrátane [ShowEstateTypeName('crown_estate')], podľa ich [estate_power_with_icon|e]." # todo: NEW TRANSLATION
 hint_unused_trade_capacity_military: "\"Pokiaľ ide o možnosť hlúpeho využívania našich zdrojov, som tomu absolútne proti.\"" # todo: NEW TRANSLATION
 hint_unused_trade_capacity_administrative: "\"Musíme sa čo najskôr vrátiť na efektívnu hranicu.\"" # todo: NEW TRANSLATION
 hint_unused_trade_capacity_diplomatic: "\"Nevyužitú obchodnú kapacitu možno prirovnať k ležiacemu poli, ktoré už dávno čaká na ďalšie osivo.\"" # todo: NEW TRANSLATION
 hint_unprofitable_trade_route: "Nevýnosná obchodná trasa" # todo: NEW TRANSLATION
 hint_unprofitable_trade_route_hint_text: "$hint_unprofitable_trade_route_hint_text_1$\n\n$hint_unprofitable_trade_route_hint_text_2$\n\n$hint_unprofitable_trade_route_hint_text_3$" # todo: NEW TRANSLATION
 hint_unprofitable_trade_route_hint_text_1: "Vo väčšine prípadov, ak máte stratovú [trade_with_icon|E] trasu, chcete ju zrušiť a nahradiť ziskovou trasou, alebo zapnúť automatizáciu pre daný [market_with_icon|E]." # todo: CHANGED
 hint_unprofitable_trade_route_hint_text_2: "#T Odporúčané kroky:#!\n@arrow_bonus_tier_1! Niekedy má zmysel prerábať peniaze na obchodnej trase, ak sú [goods_with_icon|E] strategicky dôležité.\n@arrow_bonus_tier_1! Príkladom by bolo získavanie dreva na dokončenie [building_with_icon|E]. Ďalším dôvodom môže byť zabezpečenie potravy pre naše [pops_with_icon|E]." # todo: CHANGED
 hint_unprofitable_trade_route_hint_text_3: "#T Extra tipy:#!\n@hint! Nepriame ovplyvnenie ziskovosti existujúcej [trade_with_icon|E] trasy je možné zmenou cien (a teda cenového rozdielu pre obchodovaný [good_with_icon|E]) zapojených [markets_with_icon|E]. To urobíte ovplyvnením [supply_with_icon|E] a [demand_with_icon|E] pre daný [good_with_icon|E]." # todo: CHANGED
 hint_unprofitable_trade_route_military: "\"Možno by sme im mali ich tovar vziať namiesto toho, aby sme zaň platili?\"" # todo: NEW TRANSLATION
 hint_unprofitable_trade_route_administrative: "\"Minimalizujte straty čo najrýchlejšie. Obchod nie je charita.\"" # todo: NEW TRANSLATION
 hint_unprofitable_trade_route_diplomatic: "\"Nedokonalosť vzniká v prírodnom poriadku vecí a je na nás, aby sme ju upravili.\"" # todo: NEW TRANSLATION
 hint_market_out_of_supply: "Trh bez zásob" # todo: NEW TRANSLATION
 hint_market_out_of_supply_hint_text: "$hint_market_out_of_supply_hint_text_1$\n\n$hint_market_out_of_supply_hint_text_2$\n\n$hint_market_out_of_supply_hint_text_3$" # todo: NEW TRANSLATION
 hint_market_out_of_supply_hint_text_1: "Ak má [market_with_icon|e] príliš vysoký celkový [demand_with_icon|E] v porovnaní s konečnou [supply_with_icon|E], nemusíme získať [goods_with_icon|E], ktoré sa pokúšame [export_with_icon|E] alebo [import_with_icon|E], čo vedie k nedostatku tovaru." # todo: CHANGED
 hint_market_out_of_supply_hint_text_2: "#T Odporúčané kroky:#!\n@arrow_bonus_tier_3! Môžeme okamžite zrušiť stratové [trade_with_icon|E] trasy a použiť túto [merchant_capacity_with_icon|E] na iné typy [goods_with_icon|E].\n@arrow_bonus_tier_1! Zvýšenie našej [merchant_power_with_icon|E] na dotknutom [market_with_icon|E] nám môže umožniť väčší prístup k jeho tovarom." # todo: CHANGED
 hint_market_out_of_supply_hint_text_3: "#T Extra tipy:#!\n@hint! [merchant_power_with_icon|e] možno získať z rôznych zdrojov ako [advances_with_icon|e], [privileges_with_icon|e], [policies_with_icon|e] atď.\n@hint! Môžeme sa tiež pokúsiť zvýšiť [supply_with_icon|E], ale to môže byť ťažké urobiť krátkodobo a zvyčajne vyžaduje dlhodobé strategické plánovanie." # todo: CHANGED
 hint_market_out_of_supply_military: "\"Občas nebude dostupného tovaru na export na podporu nášho vojnového stroja. Treba to rýchlo riešiť.\"" # todo: NEW TRANSLATION
 hint_market_out_of_supply_administrative: "\"Zvážte zvýšenie našej úplne férovej obchodnej výhody akýmikoľvek prostriedkami, ktoré sú dostupné.\"" # todo: NEW TRANSLATION
 hint_market_out_of_supply_diplomatic: "\"Možno musíme podniknúť kroky na diverzifikáciu našich obchodných operácií a vyhnúť sa monokultúre.\"" # todo: NEW TRANSLATION
 hint_increasing_trade_capacity: "Zvyšovanie obchodnej kapacity" # todo: NEW TRANSLATION
 hint_increasing_trade_capacity_hint_text: "$hint_increasing_trade_capacity_hint_text_1$\n\n$hint_increasing_trade_capacity_hint_text_2$\n\n$hint_increasing_trade_capacity_hint_text_3$" # todo: NEW TRANSLATION
 hint_increasing_trade_capacity_hint_text_1: "[merchant_capacity_with_icon|e] určuje množstvo [trade_with_icon|e], ktoré môže [country_with_icon|e] vykonávať." # todo: CHANGED
 hint_increasing_trade_capacity_hint_text_2: "#T Odporúčané kroky:#!\n@arrow_bonus_tier_3! Postavte viac [buildings_with_icon|e], ktoré zvyšujú kapacitu, napríklad [ShowBuildingTypeName('marketplace')] alebo [ShowBuildingTypeName('market_village')].\n@arrow_bonus_tier_2! Niektoré [advances_with_icon|e] alebo [laws_with_icon|e] môžu tiež zvýšiť našu [merchant_capacity_with_icon|e]." # todo: CHANGED
 hint_increasing_trade_capacity_hint_text_3: "#T Extra tipy:#!\n@hint! Viac [merchant_capacity_with_icon|e] umožňuje viac položiek v obchode, čo vedie k vyššiemu [income_with_icon|e]." # todo: CHANGED
 hint_increasing_trade_capacity_military: "\"Čím väčšie bude naše impérium, tým väčšiu obchodnú kapacitu budeme mať. Je to takmer tautológia.\"" # todo: NEW TRANSLATION
 hint_increasing_trade_capacity_administrative: "\"Riešenie obchodnej kapacity, podobne ako všetky ľudské problémy, spočíva v mať viac trhov.\"" # todo: NEW TRANSLATION
 hint_increasing_trade_capacity_diplomatic: "\"Zabezpečte rastúci tok obchodu vytváraním základov pre trhovú výmenu vždy, keď je to možné.\"" # todo: NEW TRANSLATION
 hint_increasing_trade_advantage: "$game_concept_merchant_power$" # todo: NEW TRANSLATION
 hint_increasing_trade_advantage_hint_text: "$hint_increasing_trade_advantage_hint_text_1$\n\n$hint_increasing_trade_advantage_hint_text_2$\n\n$hint_increasing_trade_advantage_hint_text_3$" # todo: NEW TRANSLATION
 hint_increasing_trade_advantage_hint_text_1: "[merchant_power_with_icon|e] určuje, ktorá [country_with_icon|e] má prístup k [goods_with_icon|e] daného [market_with_icon|e] ako prvá pre účely [trade_with_icon|e].\n\nAk dve obchodujúce [countries] pokúšajú získať [good] a nie je ho dosť pre oboch, prvé ho kúpi krajina s vyššou [merchant_power].\n\nUpozorňujeme, že [merchant_power] sa vzťahuje len na obchod. [locations_with_icon|e] namiesto toho pri nákupe [goods] pre [constructions_with_icon|e] alebo [pop_needs_with_icon|e] nasledujú poradie [market_access_with_icon|e]." # todo: CHANGED
 hint_increasing_trade_advantage_hint_text_2: "#T Odporúčané akcie:#!\n@arrow_bonus_tier_3! Vlastnite viac [locations_with_icon|e] patriacich danému [market].\n@arrow_bonus_tier_2! Zvýšte [maritime_presence_with_icon|e] na pobrežných vodách daného [market].\n@arrow_bonus_tier_1! Niektoré [buildings_with_icon|e], ako napríklad [ShowBuildingTypeName('marketplace')], tiež zvyšujú [merchant_power]." # todo: NEW TRANSLATION
 hint_increasing_trade_advantage_hint_text_3: "#T Ďalšie tipy:#!\n@hint! #italic Ak sa chcete dozvedieť viac, môžete si pozrieť [Link('hints', 'selected_hint = hint_trade', 'Obchod')] a [Link('hints', 'selected_hint = hint_maritime', 'Námorná prítomnosť')] Nápovedy#!" # todo: CHANGED
 hint_increasing_trade_advantage_military: "\"Keďže obchod je skôr konkurenčný než kooperatívny podnik, nadobudnutie výhody v obchode je prirodzený poriadok vecí.\"" # todo: NEW TRANSLATION
 hint_increasing_trade_advantage_administrative: "\"Jadro našej stratégie: Predpovedať ďalšiu vlnu cien cez hod kockami a nebeské zarovnanie hviezd.\"" # todo: NEW TRANSLATION
 hint_increasing_trade_advantage_diplomatic: "\"Jeden z neodmysliteľných pilierov zrelého impéria, obchod má potenciál naplniť naše truhlice rýchlejšie než čokoľvek iné.\"" # todo: NEW TRANSLATION
 hint_pops_with_needs_yellow: "Pops požadujúci tovar" # todo: NEW TRANSLATION
 hint_pops_with_needs_yellow_hint_text: "$hint_pops_with_needs_yellow_hint_text_1$\n\n$hint_pops_with_needs_yellow_hint_text_2$\n\n$hint_pops_with_needs_yellow_hint_text_3$" # todo: NEW TRANSLATION
 hint_pops_with_needs_yellow_hint_text_1: "[pops_with_icon|e] sa budú snažiť kúpiť si [goods_with_icon|e], ktoré potrebujú, na [market_with_icon|e] svojej [location_with_icon|e]. Ak [pops] nedokážu kúpiť všetky požadované [goods], ich [pop_satisfaction_with_icon|e] klesne. Ak ich spokojnosť klesne pod [ShowModifierTypeName('pop_join_rebel_threshold')], môžu sa začať pridávať k [rebellion_with_icon|e] proti [government]." # todo: CHANGED
 hint_pops_with_needs_yellow_hint_text_2: "#T Odporúčané kroky:#!\n@arrow_bonus_tier_3! Udržiavajte vysoké [stability_with_icon|e], [legitimacy_with_icon|e] a [estate_satisfaction_with_icon|e], aby ste zabránili [rebellions].\n@arrow_bonus_tier_1! Rozšírte produkciu požadovaných [goods_with_icon|e] výstavbou [rgo_with_icon|e] a [buildings_with_icon|e] v @production_panel! [Link('goods_production', '', 'lateralview_goods_production_entry_name')].\n@arrow_bonus_tier_1! Dovážajte [goods] z iných trhov pomocou [merchant_capacity_with_icon|e]." # todo: CHANGED
 hint_pops_with_needs_yellow_hint_text_3: "#T Dodatočné tipy:#!\n@hint! Mať nespokojené požiadavky Popov nemusí byť nutne znepokojujúce, pokiaľ [pops] nerebelujú. Poskytuje to však prehľad o stave [market].\n@hint! Požiadavky Popov sú len jedným z faktorov ovplyvňujúcich [pop_satisfaction]. Aj keď budú všetky ich potreby uspokojené, ľudia sa stále môžu vzbúriť z iných dôvodov.\n@hint! Viac o [rebel_movements_with_icon] sa dozviete v [Link('hints', 'selected_hint = hint_rebels_growing', 'Rebels Hint')]." # todo: NEW TRANSLATION
 hint_pops_with_needs_yellow_military: "\"Mocný vládca by sa nemal starať o rozmarnosti pokorných.\"" # todo: NEW TRANSLATION
 hint_pops_with_needs_yellow_administrative: "\"Kde nezaujaté oko vidí chudobné obyvateľstvo, ja vidím zázračnú príležitosť na zisk.\"" # todo: NEW TRANSLATION
 hint_pops_with_needs_yellow_diplomatic: "\"Ľudia vždy budú požadovať viac, než im patrí. Ale buďte opatrní. Nedostatky, ak sa neodstránia, môžu povzbudiť vašich poddaných k povstaniu.\"" # todo: NEW TRANSLATION
 hint_pops_with_needs_red: "Rebeliujúci Pops požadujúci tovar" # todo: NEW TRANSLATION
 hint_pops_with_needs_red_hint_text: "$hint_pops_with_needs_yellow_hint_text_1$\n\n$hint_pops_with_needs_red_hint_text_1$\n\n$hint_pops_with_needs_red_hint_text_2$\n\n$hint_pops_with_needs_red_hint_text_3$" # todo: NEW TRANSLATION
 hint_pops_with_needs_red_hint_text_1: "Niektorí z našich [pops] sa momentálne pridávajú k [rebel_movements]. Zvýšenie zásob požadovaných [goods] by mohlo presvedčiť niektorých z nich, aby opustili [rebellions]." # todo: NEW TRANSLATION
 hint_pops_with_needs_red_hint_text_2: "#T Odporúčané kroky:#!\n@arrow_bonus_tier_3! Zvýšte [stability_with_icon|e], [legitimacy_with_icon|e] a [estate_satisfaction_with_icon|e].\n@arrow_bonus_tier_1! Rozšírte produkciu požadovaných [goods_with_icon|e] výstavbou [rgo_with_icon|e] a [buildings_with_icon|e] v @production_panel! [Link('goods_production', '', 'lateralview_goods_production_entry_name')].\n@arrow_bonus_tier_1! Dovážajte [goods] z iných trhov pomocou [merchant_capacity_with_icon|e]\n@arrow_bonus_tier_1! Ak nič nepomôže, pripravte naše [armies_with_icon|e] na zásah proti povstalcom." # todo: CHANGED
 hint_pops_with_needs_red_hint_text_3: "#T Ďalšie tipy:#!\n@hint! Požiadavky obyvateľstva sú len jedným z faktorov ovplyvňujúcich [pop_satisfaction]. Aj keď budú všetky ich potreby uspokojené, ľudia sa stále môžu vzbúriť z iných dôvodov.\n@hint! Dozviete sa viac o [rebel_movements_with_icon] v [Link('hints', 'selected_hint = hint_rebels_growing', 'Rebels Hint')]." # todo: NEW TRANSLATION
 hint_pops_with_needs_red_diplomatic: "\"Zaručenie dodávok kľúčových tovarov môže postačiť na utlmenie rozkolu medzi našimi ľuďmi.\"" # todo: NEW TRANSLATION
 hint_pops_with_needs_red_administrative: "\"Povstanie by prinieslo skazu našim obchodníkom. Zvýšme výrobu, skôr než sa náš ľud rozhodne chytiť za zbrane!\"" # todo: NEW TRANSLATION
 hint_pops_with_needs_red_military: "\"Hladová masa? Naša armáda sa postará o túto hrozbu.\"" # todo: NEW TRANSLATION
 hint_has_possible_reform: "Možné reformy" # todo: NEW TRANSLATION
 hint_has_possible_reform_hint_text: "$hint_has_possible_reform_hint_text_1$\n\n$hint_has_possible_reform_hint_text_2$\n\n$hint_has_possible_reform_hint_text_3$" # todo: NEW TRANSLATION
 hint_has_possible_reform_hint_text_1: "[government_reforms_with_icon|e] sú jednou z najdefinujúcejších čŕt nášho [country_with_icon|e]. Vždy by sme mali mať všetky dostupné [reforms] prijaté." # todo: NEW TRANSLATION
 hint_has_possible_reform_hint_text_2: "#T Odporúčané kroky:#!\n@arrow_bonus_tier_3! Stlačte tlačidlo plus pod kartou [ShowEstateTypeName('crown_estate')] v @government_panel! [Link('government', 'tabcontent = estates', 'lateralview_government_entry_name')] na zavedenie nového [reform]." # todo: CHANGED
 hint_has_possible_reform_hint_text_3: "#T Extra tipy:#!\n@hint! Ako hra postupuje, viac [government_reforms] bude dostupných cez [advances_with_icon|e] a [events_with_icon|e].\n@hint! [government_reforms] stoja [stability_with_icon|e] pri odvolaní a ich implementácia trvá dlho. Vyberajte opatrne.\n@hint! Niektoré [government_reforms] vyžadujú, aby sa vaša [country] priklonila k určitej [societal_value_with_icon|e]." # todo: CHANGED
 hint_has_possible_reform_diplomatic: "\"Dobre definovaná vláda je symbolom zdravej správy.\"" # todo: NEW TRANSLATION
 hint_has_possible_reform_administrative: "\"Musíme mať jasnú definíciu vlády, aby si cudzie krajiny vedeli správne vytvoriť názov pre nás.\"" # todo: NEW TRANSLATION
 hint_has_possible_reform_military: "\"Ako očakávame, že sa dokážeme brániť pred nepriateľmi, ak ani nevieme, kým v skutočnosti sme?\"" # todo: NEW TRANSLATION
 hint_has_conquered_provinces: "Neintegrované provincie" # todo: NEW TRANSLATION
 hint_has_conquered_provinces_hint_text: "$hint_has_conquered_provinces_hint_text_1$\n\n$hint_has_conquered_provinces_hint_text_2$\n\n$hint_has_conquered_provinces_hint_text_3$" # todo: NEW TRANSLATION
 hint_has_conquered_provinces_hint_text_1: "[conquered_with_icon|e] [locations_with_icon|e] je potrebné [integrate_with_icon|e] do našej správy, aby prispievali k bohatstvu ríše. Mali by sme sa snažiť integrovať všetky naše [locations_with_icon|e] čo najskôr." # todo: CHANGED
 hint_has_conquered_provinces_hint_text_2: "#T Odporúčané kroky #!:\n@arrow_bonus_tier_3! Inštruujte [cabinet_with_icon|e], aby [ShowCabinetActionName('integrate_province')] z @government_panel! [Link('government', 'tabcontent = cabinet', 'lateralview_government_entry_name')].\n@arrow_bonus_tier_1! Ak náš [cabinet] nezvláda tempo dobytí, zvážte vytvorenie [subject_with_icon|e], ktorý bude spravovať územie za vás. Urobíte to v @diplomacy_panel! [Link('diplomacy', 'relations_tab = current_relations', 'lateralview_diplomacy_entry_name')]." # todo: CHANGED
 hint_has_conquered_provinces_hint_text_3: "#T Extra tipy:#!\n@hint! Integrácia je zvyčajne jednou z hlavných zodpovedností [cabinet_with_icon|e] v expanzívnych [countries_with_icon|e].\n@hint! [pop_satisfaction_with_icon|e] bude v [conquered] [locations] omnoho nižšia, čo môže spôsobiť [rebellions_with_icon|e].\n@hint! Rýchlosť integrácie môžete zvýšiť vymenovaním talentovaných [characters_with_icon|e] do [cabinet_members_with_icon|e] a zvýšením globálnej [cabinet_efficiency_with_icon|e] vašej [country].\n@hint! Integrácia bude rýchlejšia, ak naša [primary_culture_with_icon|e] je [dominant_culture_with_icon|e] lokality alebo ak je naša [cultural_influence_with_icon|e] vyššia než [cultural_tradition_with_icon|e] dominantnej kultúry." # todo: CHANGED
 hint_has_conquered_provinces_diplomatic: "\"Nové... #italic získané #! subjekty sa nepoddajú našej vláde hneď. Integrácia je dlhý a namáhavý proces, no nevyhnutný pre stabilitu kráľovstva.\"" # todo: NEW TRANSLATION
 hint_has_conquered_provinces_administrative: "\"Obchodu sa nedarí, keď je krajina v rozvrate. Právo a poriadok sú prvoradé pre prosperitu.\"" # todo: NEW TRANSLATION
 hint_has_conquered_provinces_military: "\"Birokrati nie sú vždy zbytoční. Bez správnych administratívnych kádrí by sme nedokázali odviesť dane od obyvateľstva.\"" # todo: NEW TRANSLATION
 hint_has_possible_cabinet_action: "Možné kabinetné akcie" # todo: NEW TRANSLATION
 hint_has_possible_cabinet_action_hint_text: "$hint_has_possible_cabinet_action_hint_text_1$\n\n$hint_has_possible_cabinet_action_hint_text_2$\n\n$hint_has_possible_cabinet_action_hint_text_3$" # todo: NEW TRANSLATION
 hint_has_possible_cabinet_action_hint_text_1: "[cabinet_actions_with_icon|e] patria medzi najsilnejšie nástroje, ktoré máme na správu národa. Mali by sme neustále využívať všetky naše dostupné [cabinet_seats_with_icon|e]." # todo: NEW TRANSLATION
 hint_has_possible_cabinet_action_hint_text_2: "#T Odporúčané kroky:#!\n@arrow_bonus_tier_3! Prejdite do @government_panel! [Link('government', 'tabcontent = cabinet', 'lateralview_government_entry_name')] a pozrite si dostupné kabinetné akcie.\n@arrow_bonus_tier_3! [ShowCabinetActionName('integrate_province')] ak máme nedávno [conquered_with_icon|e] územie.\n@arrow_bonus_tier_2! [ShowCabinetActionName('stabilize_country')] ak je [stability_with_icon|e] nízka.\n@arrow_bonus_tier_2! [ShowCabinetActionName('strengthen_government')] ak je [legitimacy_with_icon|e] nízka.\n@arrow_bonus_tier_2! [ShowCabinetActionName('diplomatic_endeavors')] pre ľahšiu [diplomacy_with_icon|e].\n@arrow_bonus_tier_1! [ShowCabinetActionName('change_societal_values')] ak chcete presadzovať konkrétnu [societal_value_with_icon|e].\n@arrow_bonus_tier_1! [ShowCabinetActionName('develop_province')] na zvýšenie [development_with_icon|e] v našich najcennejších [provinces_with_icon|e].\n@arrow_bonus_tier_1! [cabinet_actions] možno použiť aj na [convert_with_icon|e] iné [religions_with_icon|e] alebo [assimilate_with_icon|e] iné [cultures_with_icon|e].\n@automation! Kabinet môžete tiež automatizovať v @automation! [Link('automation', '', 'lateralview_automation_entry_name')]." # todo: CHANGED
 hint_has_possible_cabinet_action_hint_text_3: "#T Extra tipy:#!\n@hint! [characters_with_icon|e] vymenovaní do [cabinet_with_icon|e] zvýšia [estate_power_with_icon|e] ich [estate_with_icon|e].\n@hint! Nové [cabinet_actions] sa odomknú v neskorších [ages_with_icon|e]." # todo: CHANGED
 hint_has_possible_cabinet_action_diplomatic: "\"Byrokracia je životodarnou šťavou každého štátu... ak sa používa múdro.\"" # todo: NEW TRANSLATION
 hint_has_possible_cabinet_action_administrative: "\"Cez kabinet má štát moc premeniť pustú púšť na prosperujúce metropoly.\"" # todo: NEW TRANSLATION
 hint_has_possible_cabinet_action_military: "\"Silný kabinet dokáže skrotiť najnepokojnejších členov našej spoločnosti.\nDajte príkazy, a budú splnené.\"" # todo: NEW TRANSLATION
 hint_has_possible_law: "Zákony bez aktívnej politiky" # todo: NEW TRANSLATION
 hint_has_possible_law_hint_text: "$hint_has_possible_law_hint_text_1$\n\n$hint_has_possible_law_hint_text_2$\n\n$hint_has_possible_law_hint_text_3$" # todo: NEW TRANSLATION
 hint_has_possible_law_hint_text_1: "Je rozumné mať aktívnu [policy_with_icon|e] pre všetky naše [laws_with_icon|e]. Inak môže vaša [country_with_icon|e] prísť o užitočné výhody." # todo: CHANGED
 hint_has_possible_law_hint_text_2: "#T Odporúčané kroky:#!\n@arrow_bonus_tier_3! Kliknite na Upozornenie, aby ste prešli naše [laws] bez zavedenéj [policy], a vyberte starostlivo.\n@arrow_bonus_tier_3! Môžete prejsť do @government_panel! [Link('government', 'tabcontent = politics', 'lateralview_government_entry_name')] a prezrieť si súčasné [laws].\n@automation! Môžete si tiež automatizovať naše zákony v @automation! [Link('automation', '', 'lateralview_automation_entry_name')]." # todo: CHANGED
 hint_has_possible_law_hint_text_3: "#T Extra tipy:#!\n@hint! [policies] majú implementačný čas v závislosti od našej [legislative_efficiency_with_icon|e]. Ich plné účinky nebudú aktívne okamžite.\n@hint! [policy] môžete neskôr zmeniť za cenu [gold_with_icon|e] a [stability_with_icon|e]. Náklady závisia od nášho [crown_power_with_icon|e].\n@hint! Mnoho nových [laws] a [policies] sa odomkne v neskorších [ages_with_icon|e]." # todo: CHANGED
 hint_has_possible_law_diplomatic: "\"Štát bez zákonov je ako budova bez stĺpov, telo bez končatín. Radšej viac než menej.\"" # todo: NEW TRANSLATION
 hint_has_possible_law_administrative: "\"Zákony krajiny by mali zabezpečiť rast našich miest, ochranu obchodníkov a riadne vymáhanie daní.\"" # todo: NEW TRANSLATION
 hint_has_possible_law_military: "\"Schvaľovanie zákonov je dôležité; ich vynútenie je kľúčové.\"" # todo: NEW TRANSLATION
 hint_has_army_without_leader: "Chýba veliteľ" # todo: NEW TRANSLATION
 hint_has_army_without_leader_hint_text: "$hint_has_army_without_leader_hint_text_1$\n\n$hint_has_army_without_leader_hint_text_2$\n\n$hint_has_army_without_leader_hint_text_3$" # todo: NEW TRANSLATION
 hint_has_army_without_leader_hint_text_1: "Naše [units_with_icon|e] potrebujú [commander_with_icon|e], aby vykonávali svoje úlohy v [battle_with_icon|e]. [generals_with_icon|e] vedú [armies], [admirals] vedú [navies]." # todo: CHANGED
 hint_has_army_without_leader_hint_text_2: "#T Odporúčané kroky:#!\n@arrow_bonus_tier_3! Kliknite na #W Upozornenie#! a vyberte vhodného [character_with_icon|e] pre vašu [unit]. Vo všeobecnosti vyberajte tých s vyššími [abilities_with_icon|e].\n@arrow_bonus_tier_2! Môžete tiež vybrať [unit] z mapy alebo z #W Outliner#!.\n@arrow_bonus_tier_2! Ak nemáme žiadneho dobrého [character], skúste nejakého vytrénovať v @military_panel! [Link('unit_overview', '', 'lateralview_unit_overview_entry_name')].\n@automation! Môžete automatizovať menovanie [generals] a [admirals] v @automation! [Link('automation', '', 'lateralview_automation_entry_name')]." # todo: CHANGED
 hint_has_army_without_leader_hint_text_3: "#T Extra tipy:#!\n@hint! Nezačínajte [battle] bez schopného [commander_with_icon|e] v velení!\n@hint! Niektorí [characters_with_icon|e] majú [traits_with_icon|e], ktoré ich robia vhodnejšími pre konkrétne úlohy.\n@hint! Niektoré [laws_with_icon|e] môžu obmedziť, ktorí [characters_with_icon|e] sú spôsobilí viesť." # todo: CHANGED
 hint_has_army_without_leader_diplomatic: "\"Armáda by vždy mala mať veliteľa. Ale musíme byť opatrní, lebo velitelia využijú svoj vplyv na zvýšenie moci svojho stavu.\"" # todo: NEW TRANSLATION
 hint_has_army_without_leader_administrative: "\"Prosím, nepýtajte sa ma. Bravúrne záležitosti vojny zverujem vašim menej... #italic sofistikovaným #! poradcom.\"" # todo: NEW TRANSLATION
 hint_has_army_without_leader_military: "\"Zapojenie sa do boja bez riadneho vedenia je samovražda.\nZa žiadnych okolností to nerobte.\"" # todo: NEW TRANSLATION
 hint_is_heir_underage: "Neplnoletý dedič" # todo: NEW TRANSLATION
 hint_is_heir_underage_hint_text: "$hint_is_heir_underage_hint_text_1$\n\n$hint_is_heir_underage_hint_text_2$" # todo: NEW TRANSLATION
 hint_is_heir_underage_hint_text_1: "Ak by náš [ruler_with_icon|e] zomrel skôr, než sa náš [heir_with_icon|e] dostane do veku dospelosti, ocitli by sme sa pod [regency_with_icon|e]. Podľa okolností člen najsilnejšieho [estate_with_icon|e] prevezme vládu, čím sa výrazne zvýši ich [estate_power_with_icon|e] počas interregna." # todo: CHANGED
 hint_is_heir_underage_hint_text_2: "#T Odporúčané kroky:#!\n@arrow_bonus_tier_1! Len málo môžete urobiť iného, než čakať uplynutie času a vyhýbať sa zbytočnému riziku života nášho [ruler]. Pokiaľ náš [ruler] nie je obzvlášť neschopný..." # todo: NEW TRANSLATION
 hint_is_heir_underage_hint_text_3: "#T Extra tipy:#!\n@hint! [regency_with_icon|e] nemusí byť zlý, ak máme obzvlášť schopného [character_with_icon|e], ktorý môže byť regentom." # todo: CHANGED
 hint_is_heir_underage_diplomatic: "\"Zaistiť nástupníctvo znamená zabezpečiť budúcnosť kráľovstva.\"" # todo: NEW TRANSLATION
 hint_is_heir_underage_administrative: "\"Manželstvá a dynastické väzby sú najlepším spôsobom, ako spojiť dve krajiny.\"" # todo: NEW TRANSLATION
 hint_is_heir_underage_military: "\"Práve v mladosti možno vychovať dedičov na najlepších vládcov.\"" # todo: NEW TRANSLATION
 hint_has_unmarried_adult_ruler: "Nezadaný panovník" # todo: NEW TRANSLATION
 hint_has_unmarried_adult_ruler_hint_text: "$hint_has_unmarried_adult_ruler_hint_text_1$\n\n$hint_has_unmarried_adult_ruler_hint_text_2$\n\n$hint_has_unmarried_adult_ruler_hint_text_3$" # todo: NEW TRANSLATION
 hint_has_unmarried_adult_ruler_hint_text_1: "Mali by sme sa pokúsiť zosobášiť nášho [ruler_with_icon|e] so vhodným kandidátom, aby sme rozšírili veľkosť a moc našej [dynasty_with_icon|e]. Plodné kráľovské potomstvo nielen zabezpečuje stabilné dedičstvo, ale princovia môžu tvoriť cennú rezervu dostupných [characters_with_icon|e] pre vládne úrady." # todo: CHANGED
 hint_has_unmarried_adult_ruler_hint_text_2: "#T Odporúčané kroky:#!\n@arrow_bonus_tier_3! Kliknite na Upozornenie a vyhľadajte kandidátov na [royal_marriage_with_icon|e]. Monarchie môžu uzavrieť kráľovské manželstvá medzi sebou na upevnenie [opinion] a položiť základy pre [alliance_with_icon|e]. [royal_marriages_with_icon|e] môžu tiež otvoriť možnosť [personal_union_with_icon|e].\n@arrow_bonus_tier_2! Môžete oženiť svojho [ruler] alebo [heir] s vhodným [character_with_icon|e] v dvore cez [ShowCharacterInteractionName('marry_noble')] interakciu pravým kliknutím na portrét.\n@arrow_bonus_tier_1! V prípade núdze je vždy možnosť [ShowCharacterInteractionName('marry_lowborn')], hoci nie je populárna." # todo: CHANGED
 hint_has_unmarried_adult_ruler_hint_text_3: "#T Extra tipy:#!\n@hint! [characters] vládnucej [dynasty] patria k [ShowEstateTypeName('crown_estate')], takže pri vymenovaní na vplyvné funkcie neoslabujú iné [estates_with_icon|e]." # todo: CHANGED
 hint_has_unmarried_adult_ruler_diplomatic: "\"$hint_is_heir_underage_diplomatic$\"" # todo: NEW TRANSLATION
 hint_has_unmarried_adult_ruler_administrative: "\"$hint_is_heir_underage_administrative$\"" # todo: NEW TRANSLATION
 hint_has_unmarried_adult_ruler_military: "\"Každý meč potrebuje pochvu.\"" # todo: NEW TRANSLATION
 hint_can_do_more_research: "Výskum" # todo: NEW TRANSLATION
 hint_can_do_more_research_hint_text: "$hint_can_do_more_research_hint_text_1$\n\n$hint_can_do_more_research_hint_text_2$\n\n$hint_can_do_more_research_hint_text_3$" # todo: NEW TRANSLATION
 hint_can_do_more_research_hint_text_1: "Mali by sme zabezpečiť, aby naša [country_with_icon|e] neustále skúmala nové [advances_with_icon|e]." # todo: CHANGED
 hint_can_do_more_research_hint_text_2: "#T Odporúčané kroky:#!\n@arrow_bonus_tier_3! Prejdite do @advances_panel! [Link('advances', 'subtab = research', 'lateralview_advances_entry_name')] a vyberte Advance, ktorý vyhovuje vašim potrebám.\n@arrow_bonus_tier_2! Môžete tiež kliknúť na prázdnu ikonu kvasničky vpravo hore, aby ste otvorili celý @advances_panel! [Link('technology_view', '', 'lateralview_technology_view_entry_name')].\n@automation! Ak sa nechcete zatiaľ ponoriť do detailov [advances], môžete automatizovať náš výskum v @automation! [Link('automation', '', 'lateralview_automation_entry_name')]. Stále budete upozornení, keď objavíme nový [advance_with_icon|e]." # todo: CHANGED
 hint_can_do_more_research_hint_text_3: "#T Extra tipy: #!\n@hint! Nepoužité body výskumu sa ukladajú do určitej miery, potom už sa strácajú.\n@hint! Rýchlosť [research_progress_with_icon|e] môžete zvýšiť zvýšením priemernej [literacy_with_icon|e] a spokojnosti [ShowEstateTypeName('clergy_estate')]." # todo: CHANGED
 hint_can_do_more_research_diplomatic: "\"Technológia ponúka veľa možností, ako zjednodušiť správu našich domén.\"" # todo: NEW TRANSLATION
 hint_can_do_more_research_administrative: "\"Pri náležitej investícii by sme mohli výrazne zlepšiť efektivitu našej ekonomiky.\"" # todo: NEW TRANSLATION
 hint_can_do_more_research_military: "\"Neustále zlepšovanie našich profesionálnych armád je najdôležitejšie, aby naša sila nezaostala za nepriateľmi.\"" # todo: NEW TRANSLATION
 hint_lack_cabinet_for_cabinet_action: "Kabinetu chýba člen" # todo: NEW TRANSLATION
 hint_lack_cabinet_for_cabinet_action_hint_text: "$hint_lack_cabinet_for_cabinet_action_hint_text_1$\n\n$hint_lack_cabinet_for_cabinet_action_hint_text_2$\n\n$hint_lack_cabinet_for_cabinet_action_hint_text_3$" # todo: NEW TRANSLATION
 hint_lack_cabinet_for_cabinet_action_hint_text_1: "[cabinet_action_with_icon|e] nebude efektívna bez schopného [character_with_icon|e] priradeného na ňu. Vždy obsadzujte všetky [cabinet_seats_with_icon|e]." # todo: CHANGED
 hint_lack_cabinet_for_cabinet_action_hint_text_2: "#T Odporúčané kroky:#!\n@arrow_bonus_tier_3! Kliknite na #W Upozornenie#! a choďte do @government_panel! [Link('government', 'tabcontent = cabinet', 'lateralview_government_entry_name')], a vymenujte [character_with_icon|e] s najvyššou súvisiacou [ability_with_icon|e] do prázdneho [cabinet_seat].\n@arrow_bonus_tier_1! Zvážte nábor nového [courtier_with_icon|e], ak nemáme dobrých kandidátov.\n@automation! Kabinet môžete automatizovať v @automation! [Link('automation', '', 'lateralview_automation_entry_name')]." # todo: CHANGED
 hint_lack_cabinet_for_cabinet_action_hint_text_3: "#T Extra tipy: #!\n@hint! Každá [cabinet_action_with_icon|e] využíva jednu z troch charakterových [abilities_with_icon|e], takže si starostlivo vyberajte členov podľa úlohy.\n@hint! [cabinet_members_with_icon|e] zvýšia [estate_power_with_icon|e] [estate_with_icon|e], ku ktorému patria." # todo: CHANGED
 hint_lack_cabinet_for_cabinet_action_diplomatic: "\"Najlepšia správa vždy využije najlepších ľudí.\"" # todo: NEW TRANSLATION
 hint_lack_cabinet_for_cabinet_action_administrative: "\"Čím lepšie funguje náš štát, tým lepší vonkajší obraz predvedieme.\"" # todo: NEW TRANSLATION
 hint_lack_cabinet_for_cabinet_action_military: "\"Len s efektívnou administratívou dokážeme jasne premietať našu silu.\"" # todo: NEW TRANSLATION
 hint_inflation: "Inflácia" # todo: NEW TRANSLATION
 hint_inflation_hint_text: "$hint_inflation_hint_text_1$\n\n$hint_inflation_hint_text_2$" # todo: NEW TRANSLATION
 hint_inflation_hint_text_1: "Inflácia jednoducho zvyšuje všetky výdavky našej [country_with_icon|e], takže by sa jej malo vždy vyhnúť. Rýchlo rastie zo [minting_with_icon|e], ale niekedy môže byť ťažké ju znížiť." # todo: CHANGED
 hint_inflation_hint_text_2: "#T Odporúčané kroky:#!\n@arrow_bonus_tier_3! Ak inflácia rastie, upravte posuvník [minting] v @economy_panel! [Link('economy', '', 'lateralview_economy_entry_name')], aby ste zabránili rastu [inflation].\n@arrow_bonus_tier_2! Ak už máme nejakú infláciu, nastavenie posuvníka na minimum ju začne znižovať." # todo: CHANGED
 hint_inflation_hint_text_3: "#T Extra tipy:#!\n@hint! Môžeme získať ďalšie zdroje na zníženie inflácie, napríklad z [advances_with_icon|e]." # todo: CHANGED
 hint_inflation_diplomatic: "\"Nech nás uchráni pred touto neviditeľnou chorobou ekonomiky.\"" # todo: NEW TRANSLATION
 hint_inflation_administrative: "\"Mintovanie môže byť lákavým riešením pre rozvrátený rozpočet, ale aj zdrojom dlhodobých nešťastí.\"" # todo: NEW TRANSLATION
 hint_inflation_military: "\"Inflácia je pomalý a zákerný zabijak.\"" # todo: NEW TRANSLATION
 hint_has_disloyal_subjects: "Neloajálni vazali" # todo: NEW TRANSLATION
 hint_has_disloyal_subjects_hint_text: "$hint_has_disloyal_subjects_hint_text_1$\n\n$hint_has_disloyal_subjects_hint_text_2$\n\n$hint_has_disloyal_subjects_hint_text_3$" # todo: NEW TRANSLATION
 hint_has_disloyal_subjects_hint_text_1: "Naši [subjects_with_icon|e] sú [countries_with_icon|e], ktoré sú nám nejako podriadené. Zvyčajne nám platia [subject_taxation_with_icon|e] a sú povolaní do našich [wars_with_icon|e].\n\nAk ich [subject_loyalty_with_icon|e] klesne pod #W 50#!, budú považovaní za nelojálnych a nepomôžu nám vo vojne. Neloajálni poddaní sa môžu spojiť a vytvoriť [GetInternationalOrganizationType('independence_movement').GetName], potenciálne začať vojnu proti nám, ak sa cítia dostatočne silní." # todo: CHANGED
 hint_has_disloyal_subjects_hint_text_2: "#T Odporúčané kroky:#!\n@arrow_bonus_tier_3! Uistite sa, že [opinion_with_icon|e] našich subjectov o nás zostáva vysoké. Môžete ho zvýšiť pomocou $IMPROVE_RELATIONTITLE$ [diplomatic_action_with_icon|e].\n@arrow_bonus_tier_1! Zvážte [annexing_with_icon|e] lojálnych poddaných. Zvýšenie nášho relatívneho vplyvu oproti všetkým subjectom zvýši ich lojalitu.\n@arrow_bonus_tier_1! Zvýšenie veľkosti našich [armies_with_icon|e] zastraší subjectov a zvýši ich lojalitu." # todo: CHANGED
 hint_has_disloyal_subjects_hint_text_3: "#T Extra tipy:#!\n@hint! Prehľad našich subjectov nájdete v panely Subject v @diplomacy_panel! [Link('diplomacy', 'relations_tab = current_relations', 'lateralview_diplomacy_entry_name')].\n@hint! Čím viac a čím mocnejší sú naši subjecti v pomere k našej moci, tým ťažšie bude udržať ich [subject_loyalty] vysokú.\n@hint! Rôzne typy [subjects] majú odlišné charakteristiky a obmedzenia." # todo: CHANGED
 hint_has_disloyal_subjects_diplomatic: "\"Vždy by sme mali pestovať dobré vzťahy s našimi Subjects, aby si nezačali myslieť, že sú pánmi svojho osudu.\"" # todo: NEW TRANSLATION
 hint_has_disloyal_subjects_administrative: "\"Subjects sú ziskovým prírastkom do našej pokladnice.\nNedovoľme im, aby si to uvedomili.\"" # todo: NEW TRANSLATION
 hint_has_disloyal_subjects_military: "\"Ovce sa pri prvej príležitosti zatúla. Radšej buďme pripravení pustiť psy vojny!\"" # todo: NEW TRANSLATION
 hint_has_buildings_missing_input: "Budovy chýbajú vstupy" # todo: NEW TRANSLATION
 hint_has_buildings_missing_input_hint_text: "$hint_has_buildings_missing_input_hint_text_1$\n\n$hint_has_buildings_missing_input_hint_text_2$\n\n$hint_has_buildings_missing_input_hint_text_3$" # todo: NEW TRANSLATION
 hint_has_buildings_missing_input_hint_text_1: "[buildings_with_icon|e] potrebujú prístup k [goods_with_icon|e] z ich trhov, aby správne fungovali. Ak nemôžu kúpiť všetky potrebné [goods], ich produkcia bude primerane znížená." # todo: CHANGED
 hint_has_buildings_missing_input_hint_text_2: "#T Odporúčané kroky:#!\n$hint_address_shortage_text$" # todo: NEW TRANSLATION
 hint_has_buildings_missing_input_hint_text_3: "#T Ďalšie tipy:#!\n@hint! Nie všetky nedostatky v budovách predstavujú kritický problém pre našu krajinu. Napriek tomu môže byť rozumné zabezpečiť správne fungovanie niektorých obzvlášť strategických výrobných reťazcov.\n@hint! Napríklad sa nemusíme môcť naverbovať [ShowUnitDefinitionName('a_footmen')], ak náš [ShowBuildingTypeName('weapon_guild')] nemôže nakúpiť dostatok [ShowGoodsName('lumber')] zo svojho [market]." # todo: NEW TRANSLATION
 hint_has_buildings_missing_input_diplomatic: "\"Niektoré budovy sú obzvlášť dôležité pre správne fungovanie nášho kráľovstva.\"" # todo: NEW TRANSLATION
 hint_has_buildings_missing_input_administrative: "\"Naši obchodníci by sa mali snažiť riešiť akékoľvek nedostatky na našich trhoch. Avšak niekedy neviditeľná ruka trhu potrebuje... malý impulz.\"" # todo: NEW TRANSLATION
 hint_has_buildings_missing_input_military: "\"Pred začatím akejkoľvek vojenskej operácie musíme zabezpečiť stály prísun zbraní a vojenských zásob.\"" # todo: NEW TRANSLATION
 hint_address_shortage_text: "Kliknutím na #W Upozornenie#! prejdete do @production_panel! [Link('goods_production', '', 'lateralview_goods_production_entry_name')] filtrovaného na chýbajúce [goods] v postihnutom [market].\nMôžete zvýšiť [supply_with_icon|e] tovaru v našich [markets_with_icon|e] troma spôsobmi:\n\n@arrow_bonus_tier_3! Kliknite na @rgo! [rgo|e] tlačidlo a pozrite si zoznam našich [locations] v tomto [market] s príslušným [rgo]. Pamätajte, že iba [raw_materials_with_icon|e] možno produkovať v [rgo]\n@arrow_bonus_tier_2! Kliknite na @building! [building|e] tlačidlo a pozrite si zoznam všetkých dostupných [buildings], ktoré môžu produkovať daný [good].\n@arrow_bonus_tier_2! Kliknite na @import! [import|e] tlačidlo a dovezte [good] z iného trhu pomocou [merchant_capacity_with_icon|e].\n@automation! Môžete automatizovať stavbu [buildings] a [rgo], ako aj náš [trade_with_icon|e], z @automation! [Link('automation', '', 'lateralview_automation_entry_name')]." # todo: CHANGED
 hint_has_constructions_missing_input: "Výstavba chýba vstupy" # todo: NEW TRANSLATION
 hint_has_constructions_missing_input_hint_text: "$hint_has_constructions_missing_input_hint_text_1$\n\n$hint_has_constructions_missing_input_hint_text_2$\n\n$hint_has_constructions_missing_input_hint_text_3$" # todo: NEW TRANSLATION
 hint_has_constructions_missing_input_hint_text_1: "Všetky [constructions_with_icon|e] potrebujú prístup k určitým [goods_with_icon|e] z [market_with_icon|e] lokality. Ak nie je dostatok [goods], [construction] sa zastaví." # todo: CHANGED
 hint_has_constructions_missing_input_hint_text_2: "#T Odporúčané kroky:#!\n$hint_address_shortage_text$" # todo: NEW TRANSLATION
 hint_has_constructions_missing_input_hint_text_3: "#T Extra tipy:#!\n@hint! Všetky [locations] v [market] majú prístup k potrebným [goods] podľa poradia [market_access_with_icon|e], bez ohľadu na to, kto tovar vyrobil.\n@hint! To znamená, že lokality bližšie k [market_centers_with_icon|e] ľahšie získajú potrebné tovary." # todo: CHANGED
 hint_has_constructions_missing_input_diplomatic: "\"Presná kontrola všetkých zdrojov a potrieb je kľúčová pre každé podnikanie.\"" # todo: NEW TRANSLATION
 hint_has_constructions_missing_input_administrative: "\"Diplomacia a obchod nám dokážu dodať všetko, čo sami nedokážeme vyrobiť.\"" # todo: NEW TRANSLATION
 hint_has_constructions_missing_input_military: "\"Musíme byť schopní uspokojiť všetky naše zásobovacie potreby a požiadavky, ak nechceme, aby iní využili naše slabiny.\"" # todo: NEW TRANSLATION
 hint_lack_pop_promotion_to_fill_buildings: "Budovy alebo [rgo] s chýbajúcimi zamestnancami" # todo: NEW TRANSLATION
 hint_lack_pop_promotion_to_fill_buildings_hint_text: "$hint_lack_pop_promotion_to_fill_buildings_hint_text_1$\n\n$hint_lack_pop_promotion_to_fill_buildings_hint_text_2$\n\n$hint_lack_pop_promotion_to_fill_buildings_hint_text_3$" # todo: NEW TRANSLATION
 hint_lack_pop_promotion_to_fill_buildings_hint_text_1: "Rôzne [buildings_with_icon|e] zamestnávajú rôzne [pop_types_with_icon|e]. Ak pri dokončení novej budovy nie je dostatok voľných [pops_with_icon|e] požadovaného typu, [ShowPopTypeName('peasants')] začnú [promote_with_icon|e] podľa [ShowModifierTypeName('local_pop_promotion_speed')] lokality.\n\nBudovy môžu tiež stratiť zamestnancov pri úmrtiach [pops] v dôsledku [diseases_with_icon|e], [sieges_with_icon|e] alebo [starvation_with_icon|e]." # todo: CHANGED
 hint_lack_pop_promotion_to_fill_buildings_hint_text_2: "#T Odporúčané kroky:#!\n@arrow_bonus_tier_3! Nestavajte v lokalitách, ktoré už majú príliš málo zamestnancov.\n@arrow_bonus_tier_2! Zvýšte dôležité zdroje rýchlosti povýšenia pre lokalitu: [stability_with_icon|e], [literacy_with_icon|e] a [control_with_icon|e].\n@arrow_bonus_tier_1! Postavte [ShowBuildingTypeName('library')] a [ShowBuildingTypeName('university')] v našich najdôležitejších lokalitách.\n@arrow_bonus_tier_1! Zvážte zničenie menej užitočných [buildings], aby ste uvoľnili pracovnú silu." # todo: CHANGED
 hint_lack_pop_promotion_to_fill_buildings_hint_text_3: "#T Extra tipy:#!\n@hint! [urban_locations_with_icon|e] majú vyšší základný počet dostupných [upper_class_with_icon|e] [pops].\n@hint! Pamätajte, že lokalita potrebuje aspoň nejakých dostupných [available_with_icon|e] [ShowPopTypeName('peasants')] pre [promotion] byť možnou.\n@hint! Môžete skontrolovať [ShowModifierTypeName('local_pop_promotion_speed')] lokality v #W Demography Tab#! v #W Location Panel#!." # todo: CHANGED
 hint_lack_pop_promotion_to_fill_buildings_diplomatic: "\"Čo je priemysel bez ľudí, ktorí v ňom pracujú?\"" # todo: NEW TRANSLATION
 hint_lack_pop_promotion_to_fill_buildings_administrative: "\"Ak naši ľudia nebudú pracovať, iné krajiny nás môžu nazvať lenivými.\"" # todo: NEW TRANSLATION
 hint_lack_pop_promotion_to_fill_buildings_military: "\"Povinnosťou obyvateľstva je pracovať a vyrábať potreby krajiny.\"" # todo: NEW TRANSLATION
 hint_casus_belli: "Casus Belli" # todo: NEW TRANSLATION
 hint_casus_belli_hint_text: "$hint_casus_belli_hint_text_1$\n\n$hint_casus_belli_hint_text_2$\n\n$hint_casus_belli_hint_text_3$" # todo: NEW TRANSLATION
 hint_casus_belli_hint_text_1: "A [casus_belli_with_icon|e] je legitimný dôvod začať [war_with_icon|e]. Ísť do vojny bez správneho Casus Belli je stále možné, ale vynútenie požiadaviek v [peace_treaty_with_icon|e] bude ťažšie a susedia zareagujú zvýšenou nepriateľskosťou." # todo: CHANGED
 hint_casus_belli_hint_text_2: "#T Odporúčané kroky:#!\n@arrow_bonus_tier_3! Najlepší spôsob, ako získať Casus Belli, je požiadať o neho v našom [parliament_with_icon|e]. Parlament môžete zvolať z @government_panel! [Link('government', 'tabcontent = parliament', 'lateralview_government_entry_name')].\n@arrow_bonus_tier_2! Vytvorenie [spy_network_with_icon|e] v cudzej [country] nám umožní sfabrikovať Casus Belli proti nim, ak máme tam [cores_with_icon|e] alebo ak sú našimi [rivals_with_icon|e]." # todo: CHANGED
 hint_casus_belli_hint_text_3: "#T Extra tipy:#!\n@hint! Nie všetky [wars] sú spravodlivé a môžeme vstúpiť do vojny bez Casus Belli. Dobrý Casus Belli je užitočným nástrojom, ale častejšie platí, že sila rozhoduje.\n@hint! Každý Casus Belli má konkrétny [war_goal_with_icon|e]. Splnenie [war_goal] počas vojny nám prinesie [war_score_with_icon|e], ktoré sú kľúčové pre víťazstvo.\n@hint! [events_with_icon|e] a [situations_with_icon|e] môžu udeliť špeciálne Casus Belli." # todo: CHANGED
 hint_casus_belli_diplomatic: "\"Aj vo vojne sú pravidlá, ktoré treba dodržiavať.\"" # todo: NEW TRANSLATION
 hint_casus_belli_administrative: "\"Dobrý Casus Belli by nám umožnil vyhlásiť vojnu bez pobúrenia našich susedov.\"" # todo: NEW TRANSLATION
 hint_casus_belli_military: "\"Najlepší Casus Belli, pane, je žiadny Casus Belli.\"" # todo: NEW TRANSLATION
 hint_has_unraised_levies_in_war: "Domobrana" # todo: NEW TRANSLATION
 hint_has_unraised_levies_in_war_hint_text: "$hint_has_unraised_levies_in_war_hint_text_1$\n\n$hint_has_unraised_levies_in_war_hint_text_2$\n\n$hint_has_unraised_levies_in_war_hint_text_3$" # todo: NEW TRANSLATION
 hint_has_unraised_levies_in_war_hint_text_1: "[levies_with_icon|e] tvoria podstatnú časť ozbrojených síl každého [country_with_icon|e] v prvých storočiach hry, než ich nahradia profesionálni vojaci, známi ako [regulars_with_icon|e]. Až dovtedy je vhodné vždy povolávať naše [levies] počas [war_with_icon|e]." # todo: NEW TRANSLATION
 hint_has_unraised_levies_in_war_hint_text_2: "#T Odporúčané kroky:#!\n@arrow_bonus_tier_3! Keď sa vojna začne, kliknite na #W Upozornenie#! prejsť na #W Raise Levy#! v @military_panel! [Link('unit_overview', '', 'lateralview_unit_overview_entry_name')]. Odtiaľ môžete naraziť všetky [levies] naraz alebo vybrať konkrétne [provinces_with_icon|e] na odvedenie.\n@arrow_bonus_tier_2! Je rozumné znížiť našu závislosť na [levies] s prevahou, ale drahšími [regular_regiments]. Na to budete potrebovať postaviť [ShowBuildingTypeName('sergeantry')].\n@arrow_bonus_tier_1! V časoch núdze môžu [mercenaries_with_icon|e] doplniť alebo dokonca nahradiť naše [levies], ak máme peniaze. Najmete ich v @military_panel! [Link('unit_overview', '', 'lateralview_unit_overview_entry_name')]." # todo: CHANGED
 hint_has_unraised_levies_in_war_hint_text_3: "#T Extra Hints:#!\n@hint! [levies] pochádzajú predovšetkým z [pops_with_icon|e] vašej [primary_culture_with_icon|e] a [accepted_cultures_with_icon|e], ale množstvo, ktoré môžete povolať z každej [location], bude závisieť od jeho [control_with_icon|e].\n@hint! Majte na pamäti, že výroba [food_with_icon|e] a [rgo_with_icon|e] sa v povolaných [locations] zníži, kým sa muži nevrátia domov.\n@hint! Buďte opatrní: každý roľník, ktorý zomrie v bitke, je o jedného menej, kto bude pracovať na poliach." # todo: NEW TRANSLATION
 hint_has_unraised_levies_in_war_diplomatic: "\"Ľudia musia pracovať, ale tiež musia brániť svoje domovy, ak sú napadnutí.\"" # todo: NEW TRANSLATION
 hint_has_unraised_levies_in_war_administrative: "\"Ak nám ľudia dôverujú, prídu nám na pomoc, keď ich zavoláme.\"" # todo: NEW TRANSLATION
 hint_has_unraised_levies_in_war_military: "\"Mať pole na orbou nie je výhovorka, keď je treba vyhrať vojnu.\"" # todo: NEW TRANSLATION
 hint_no_allies: "Žiadni spojenci" # todo: NEW TRANSLATION
 hint_no_allies_hint_text: "$hint_no_allies_hint_text_1$\n\n$hint_no_allies_hint_text_2$\n\n$hint_no_allies_hint_text_3$" # todo: NEW TRANSLATION
 hint_no_allies_hint_text_1: "Aliancia [alliance_with_icon|e] je dohoda medzi dvoma [countries_with_icon|e], ktorá im umožňuje vstúpiť do vzájomných [wars_with_icon|e]. Ak sme napadnutí, naši [allies] dostanú [call_to_arms_with_icon|e], aby vstúpili do vojny na našej strane. Pri vyhlasovaní vojny vždy zohľadnite spojencov nepriateľa, pretože sa pravdepodobne zapoja proti nám." # todo: CHANGED
 hint_no_allies_hint_text_2: "#T Odporúčané kroky:#!\n@arrow_bonus_tier_3! Prejdite do @diplomacy_panel! [Link('diplomacy_macrobuilder', '', 'lateralview_diplomacy_macrobuilder_entry_name')] a kliknite na $offer_alliance$ v #W $CATEGORY_FRIENDLY_ACTIONS$#!. Uvidíte zoznam všetkých [countries], ochotných uzavrieť s nami [alliance_with_icon|e].\n@arrow_bonus_tier_2! Niektoré [countries] môže treba presvedčiť. Použitie #W $IMPROVE_RELATIONTITLE$#! [diplomatic_action_with_icon|e] ich pomaly pritiahne na našu stranu." # todo: CHANGED
 hint_no_allies_hint_text_3: "#T Extra Hints:#!\n@hint! Pozor: naši spojenci nás môžu tiež zavolať do svojich vlastných vojen. Nezjednávajte aliancie s krajinami, ktoré pôsobia príliš zraniteľne, inak sa môžeme ocitnúť na prehrávajúcej strane cudzej vojny.\n@hint! Vždy môžete odmietnuť [call_to_arms] od nášho spojenca. Avšak takéto konanie znamená koniec priateľstva a poškodenie našej diplomatickej reputácie na dlhé roky." # todo: NEW TRANSLATION
 hint_no_allies_diplomatic: "\"Nikto nemôže v tomto svete prežiť sám.\"" # todo: NEW TRANSLATION
 hint_no_allies_administrative: "\"Aj keď nemáme v pláne útočiť, vstup do aliancie s jedným zo susedov môže odradiť našich nepriateľov od útoku.\"" # todo: NEW TRANSLATION
 hint_no_allies_military: "\"Silný spojenec nám kryje chrbát pri ofenzíve.\"" # todo: NEW TRANSLATION
 hint_black_death: "Čierna smrť" # todo: NEW TRANSLATION
 hint_black_death_hint_text: "$hint_black_death_hint_text_1$\n\n$hint_black_death_hint_text_2$\n\n$hint_black_death_hint_text_3$" # todo: NEW TRANSLATION
 hint_black_death_hint_text_1: "Čierna smrť je [situation_with_icon|e], ktorá zdecimuje Starý svet, nasledujúc trasy obchodu a civilizácie. Bude najzničujúcejšia v hustých [locations_with_icon|e] a časom vyprchá, keď preživší získajú dostatočnú [disease_resistance_with_icon|e].\n\nVšetky [pop_type_with_icon|e] budú umierať na chorobu, čo zanechá naše [buildings_with_icon|E] prázdne, až kým sa neobjavia noví [ShowPopTypeName('peasants')], ktorí sa [promote_with_icon|e]. To znamená, že náš [tax_base_with_icon|e] pravdepodobne klesne, pretože výnosy budov kolabujú, a [ShowModifierTypeName('local_pop_promotion_speed')] bude kľúčová pre zotavenie." # todo: CHANGED
 hint_black_death_hint_text_2: "#T Odporúčané kroky:#!\n@arrow_bonus_tier_3! Postavte [ShowBuildingTypeName('hospital')] [buildings] v našich najväčších [urban_locations_with_icon|e], ešte predtým, než choroba dosiahne našu [country_with_icon|e].\n@arrow_bonus_tier_2! Kliknite na banner [situation], aby ste si pozreli špeciálne interakcie, ktoré môžu pomôcť znížiť katastrofu.\n@arrow_bonus_tier_2! Udržiavajte vysokú [stability_with_icon|e]. Nielenže pomáha proti [rebellions_with_icon|e], ale je aj nevyhnutná pre [ShowModifierTypeName('local_pop_promotion_speed')].\n@arrow_bonus_tier_1! Nestavajte nové budovy v depopulujúcich sa lokalitách, lebo budú mať problém nájsť pracovníkov.\n@arrow_bonus_tier_1! Sledujte našu [ShowModifierTypeName('local_pop_promotion_speed')], keďže väčšina [buildings] a [rgo_with_icon|e] bude potrebovať [ShowPopTypeName('peasants')] na povýšenie." # todo: CHANGED
 hint_black_death_hint_text_3: "#T Extra tipy:#!\n@hint! Môže to trvať roky, ale ak bude dosť roľníkov v našich [locations], ľudia sa nakoniec [promote_with_icon|e] a zaplnia prázdne miesta.\n@hint! Poučte sa z tejto katastrofy a aplikujte lekcie pri iných pohromách: [starvation_with_icon|e], [diseases_with_icon|e] a [loot_with_icon|e] majú podobné následky." # todo: CHANGED
 hint_black_death_diplomatic: "\"Smrť prichádza. Nasleduje skaza a rozvrat.\"" # todo: NEW TRANSLATION
 hint_black_death_administrative: "\"Bledá smrť klope bez rozdielu na veže kráľov aj chatrče chudobných.\"" # todo: NEW TRANSLATION
 hint_black_death_military: "\"Štvrtý jazdec je medzi nami. Už nás nezachráni žiadna rada.\"" # todo: NEW TRANSLATION
 hint_fall_of_delhi: "[GetSituationByKey('fall_of_delhi').GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 hint_fall_of_delhi_hint_text: "$hint_fall_of_delhi_hint_text_1$\n\n$hint_fall_of_delhi_hint_text_2$\n\n$hint_fall_of_delhi_hint_text_3$\n\n$hint_fall_of_delhi_hint_text_4$" # todo: NEW TRANSLATION
 hint_fall_of_delhi_hint_text_1: "[GetSituationByKey('fall_of_delhi').GetName] je [situation_with_icon|e], ktorá môže priniesť rozpad kedysi veľkej [GetCountry('DLH').GetFlavorRank]. Okolo nej sa zhromažďujú supi a potenciálni dobyvatelia pri oslabených hraniciach, ako autorita [GetCountry('DLH').GetGovernment.GetRulerOrRegent.GetName] upadá..." # todo: CHANGED
 hint_fall_of_delhi_hint_text_2: "#T Odporúčané kroky ako Dillí:#!\n@arrow_bonus_tier_3! Ako [GetCountry('DLH').GetName] zvážte využitie mnohých nových [actions_with_icon|e], ako [ShowGenericActionName('strengthen_neighbor_relations')] alebo [ShowGenericActionName('fall_of_delhi_appoint_governors')]. \n@arrow_bonus_tier_2! Počas rôznych [events_with_icon|e] súvisiacich s touto [situation_with_icon|e] sa snažte získať väčší [share_of_power_gc_with_icon|e] na úkor protivníkov, inak môže prísť zánik." # todo: CHANGED
 hint_fall_of_delhi_hint_text_3: "#T Extra tipy pre Dillí:#!\n@hint! Jednou z jasných výhod je naša mocná stála [army_with_icon|e]. Na rozdiel od [levies_with_icon|e] sa naši platení vojaci dopĺňajú a sú oveľa silnejší. To je pevný pilier moci, ktorý pomáha udržať režim." # todo: CHANGED
 hint_fall_of_delhi_hint_text_4: "#T Odporúčané kroky ako odporca:#!\n@arrow_bonus_tier_3! Najsilnejšia [country_with_icon|e] v $india$ bude na začiatku hlavný odporca tejto [situation_with_icon|e], ale túto pozíciu môžeme získať vyhlásením vojny a získaním prvenstva. Môžeme to dosiahnuť buď tým, že budeme na začiatku [situation_with_icon|e] najsilnejšou [country_with_icon|e] v $india$, alebo porazíme súčasného vodcu a uchmatneme prvenstvo cez [ShowPeaceTreatyTypeNameWithNoTooltip('peace_seize_opposition_leadership')] [peace_treaty_with_icon|e]." # todo: CHANGED
 hint_fall_of_delhi_diplomatic: "\"Či už bránime trón [GetCountry('DLH').GetName] alebo povstávame ako jeho rival, je múdre udržiavať opatrné vzťahy so susedmi. Priateľstvo môže kúpiť čas, zatiaľ čo nepriateľstvo môže ospravedlniť nové dobývania.\"" # todo: NEW TRANSLATION
 hint_fall_of_delhi_administrative: "\"Získané územia v chaose sú krehké. Zvážte udelenie [subjects_with_icon|e] alebo zlepšenie [control_with_icon|e], aby novo obsadené územia neupadli tak rýchlo, ako boli získané.\" # todo: CHANGED
 hint_fall_of_delhi_military: "\"Meč rozhoduje veľa v tomto zápase. Silná [army_with_icon|e] môže ochrániť Dillí pred kolapsom alebo umožniť odporcom zraziť obra. Avšak aj víťazstvo prináša riziká! Strážte povstania a preťažené línie.\" # todo: CHANGED
 hint_rise_of_the_ottomans: "[GetSituationByKey('rise_of_the_ottomans').GetNameWithNoTooltip] Rady" # todo: NEW TRANSLATION
 hint_rise_of_the_ottomans_hint_text: "$hint_rise_of_the_ottomans_hint_text_1$\n\n$hint_rise_of_the_ottomans_hint_text_2$" # todo: NEW TRANSLATION
 hint_rise_of_the_ottomans_hint_text_1: "Táto [situation_with_icon|e] označuje vzostup #italic Najsilnejšieho beyliku#!, predurčeného vytvoriť jednu z najväčších ríš v dejinách. Prostredníctvom jedinečných [events_with_icon|e] a [actions_with_icon|e] musíme zabezpečiť dominanciu nad ostatnými beylikmi, prekročiť [ShowProvinceDefinitionName('marmara_sea_province')] a získať bohatstvo [ShowLocationName('constantinople')]. Večná sláva čaká!" # todo: CHANGED
 hint_rise_of_the_ottomans_hint_text_2: "#T Odporúčané kroky:#!\n@arrow_bonus_tier_2! Nadišiel náš čas vzostupu. Využitím mocných [actions_with_icon|e] ako [ShowGenericActionName('press_claims')] a prínosom z [events_with_icon|e], ktoré urýchľujú [integration_with_icon|e], bude náš vzostup zapísaný do dejín.\n@arrow_bonus_tier_1! Ak držíte #Y 120#! [locations_with_icon|e] a získate oporu v [ShowRegionName('balkan_region')], môžete rozšíriť [ShowGenericActionNameWithNoTooltip('press_claims')] [action_with_icon|e] aj na túto [region_with_icon|e]." # todo: CHANGED
 hint_rise_of_the_ottomans_diplomatic: "\"Na začiatku [situation_with_icon|e] môže #italic Najsilnejší beylik#! využiť jedinečné [actions_with_icon|e], ako [ShowGenericActionName('seek_relations_with_the_byzantines')]. Využitie prestíže poslednej bašty $ROM$ na budovanie ich dedičstva.\" # todo: CHANGED
 hint_rise_of_the_ottomans_administrative: "\"Aj keď v dobyvačných ťaženiach určite vynikneme, musíme myslieť aj na naše vnútro a jadro nášho panstva. Nezanedbávajme naše vnútorné záležitosti v honbe za slávou v cudzine!\""
 hint_rise_of_the_ottomans_military: "\"Musíme sa snažiť dobyť [towns_and_cities_with_icon|e] našich protivníkov. Tieto kampane budú základom generácií moci.\" # todo: CHANGED
 hint_council_of_trent: "[GetSituationByKey('council_of_trent').GetNameWithNoTooltip]"
 hint_council_of_trent_hint_text: "$hint_council_of_trent_hint_text_1$\n\n$hint_council_of_trent_hint_text_2$"
 hint_council_of_trent_hint_text_1: "Počas [ShowSituationName('council_of_trent')] môže [GetUniqueInternationalOrganization('catholic_church').GetName] zmeniť svoje súčasné [laws_with_icon|e] a zaviesť nové [policies_with_icon|e] do [international_organization_with_icon|e]." # todo: CHANGED
 hint_council_of_trent_hint_text_2: "#T Možné interakcie:#!\n@arrow_bonus_tier_3! Ako [member_with_icon|e] [GetUniqueInternationalOrganization('catholic_church').GetName] môžete navrhnúť [ShowResolutionName('policy_vote')] použitím zoznamu [laws] nižšie alebo z panela Doktrín v [GetUniqueInternationalOrganization('catholic_church').GetName]\n@arrow_bonus_tier_2! Ako [member_with_icon|e] [GetUniqueInternationalOrganization('catholic_church').GetName] môžete hlasovať o navrhovanom [ShowResolutionName('policy_vote')]" # todo: CHANGED
 hint_golden_age_of_piracy: "[GetSituationByKey('golden_age_of_piracy').GetNameWithNoTooltip]"
 hint_golden_age_of_piracy_hint_text: "$hint_golden_age_of_piracy_hint_text_1$\n\n$hint_golden_age_of_piracy_hint_text_2$\n\n$hint_golden_age_of_piracy_hint_text_3$\n\n$hint_golden_age_of_piracy_hint_text_4$"
 hint_golden_age_of_piracy_hint_text_1: "[GetSituationByKey('golden_age_of_piracy').GetName] je [situation_with_icon|e], ktorá môže vyvolať vznik nových pirátov. Slobodní muži, znechutení námorníci a tí, ktorí odmietajú centralizovanú autoritu, posilňujú čierne plachty, pod ktorými teraz konajú svoje nelegálne aktivity." # todo: CHANGED
 hint_golden_age_of_piracy_hint_text_2: "#T Odporúčané kroky na boj proti pirátom:#!\n@arrow_bonus_tier_3! Zvážte vyhubenie pirátov pri našich pobrežiach, nemôžeme si dovoliť, aby sa voľne pohybovali po našich moriach. \n@arrow_bonus_tier_2! Každý [event_with_icon|e] súvisiaci s touto [situation_with_icon|e] môže odštartovať vznik novej pirátskej republiky." # todo: CHANGED
 hint_golden_age_of_piracy_hint_text_3: "#T Extra tipy:#!\n@hint! Môžeme využiť nové [actions_with_icon|e] v paneli [situation_with_icon|e], či už plachtením s čiernou zástavou alebo nie." # todo: CHANGED
 hint_golden_age_of_piracy_hint_text_4: "#T Odporúčané kroky ako pirát:#!\n@arrow_bonus_tier_3! Je múdre zabezpečiť pobrežie a vybudovať mocné [navy_with_icon|e]. Využitím [actions_with_icon|e] ako [ShowGenericActionName('attract_sailors')] alebo [ShowGenericActionName('migrate_to_new_waters')] môžeme udržiavať všestrannú flotilu a prítomnosť." # todo: CHANGED
 hint_golden_age_of_piracy_diplomatic: "\"Úsmevy a rum fungujú lepšie než hrozby, aspoň kým nezačnú rozprávať dela. Možno by bolo múdre udržiavať pevné vzťahy s dobrodruhmi. Nie všetko bohatstvo je striebro a zlato, pane.\"" # todo: NEW TRANSLATION
 hint_golden_age_of_piracy_administrative: "\"Správa našich námorných majetkov je v ére pirátstva delikátna záležitosť. Či už bránime proti nim alebo proti zradnej konkurencii, udržiavanie pevnej administrácie je kľúčové!\"" # todo: NEW TRANSLATION
 hint_golden_age_of_piracy_military: "\"Piráti neuznávajú žiadnu krajinu, keďže predali svoju. A keďže sú pri chytení určite obesení, nebudú mať výčitky z vraždy a ničenia, ak im nebude vyhovené.\"" # todo: NEW TRANSLATION
 hint_hundred_years_war: "[GetSituationByKey('hundred_years_war').GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 hint_hundred_years_war_hint_text: "$hint_hundred_years_war_hint_text_1$\n\n$hint_hundred_years_war_hint_text_2$\n\n$hint_hundred_years_war_hint_text_3$\n\n$hint_hundred_years_war_hint_text_4$" # todo: NEW TRANSLATION
 hint_hundred_years_war_hint_text_1: "[GetSituationByKey('hundred_years_war').GetName] uvrhne [ShowSubContinentName('western_europe')] do chaosu! Toto obdobie preverí spojenectvá a z trosiek určite povstanú nové mocnosti."
 hint_hundred_years_war_hint_text_2: "#T Odporúčané činnosti:#!\n@arrow_bonus_tier_3! [GetCountry('FRA').GetName] aj [GetCountry('ENG').GetName] majú prístup k [ShowGenericActionName('request_war_entry')], [ShowGenericActionName('hyw_sign_truce')] a [ShowGenericActionName('request_papal_delegates')]. Tieto jedinečné možnosti umožňujú manipulovať so statusom quo konfliktu alebo ho dokonca nakloniť v prospech ktorejkoľvek strany."
 hint_hundred_years_war_hint_text_3: "#T Ďalšie tipy:#!\n@hint! Ako účastník konfliktu môžeme získať územia alebo mocné spojenectvá."
 hint_hundred_years_war_hint_text_4: "#T Odporúčané kroky ako [subject_with_icon|e] [GetCountry('FRA').GetName]:#!\n@arrow_bonus_tier_3! Bolo by rozumné zabezpečiť [ShowGenericActionName('demand_autonomy')]. Každý [ShowSubjectTypeName('appanage')] môže požadovať určitý stupeň autonómie a výrazne profitovať tým, že využije svoju dôležitosť ako obranca [GetCountry('FRA').GetAdjectiveWithNoTooltip] koruny." # todo: CHANGED
 hint_hundred_years_war_diplomatic: "\"Dajte vojne šancu!\"" # todo: NEW TRANSLATION
 hint_hundred_years_war_administrative: "\"Zahraničné územia budú pravdepodobne trpieť zníženým [control_with_icon|e]. Majte na pamäti [proximity_with_icon|e] novodobytych lokalít k nášmu [capital_with_icon|e].\" # todo: CHANGED
 hint_hundred_years_war_military: "\"Vedenie vojny s našimi južnými nepriateľmi ako [GetCountry('FRA').GetName] alebo [GetCountry('ENG').GetName]? Zvážte [ShowGenericActionName('hyw_sign_truce')] [action_with_icon|e] s mocným susedom inde.\" # todo: CHANGED
 hint_hussite_wars: "[GetSituationByKey('hussite_wars').GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 hint_hussite_wars_hint_text: "$hint_hussite_wars_hint_text_1$\n\n$hint_hussite_wars_hint_text_2$\n\n$hint_hussite_wars_hint_text_3$\n\n$hint_hussite_wars_hint_text_4$" # todo: NEW TRANSLATION
 hint_hussite_wars_hint_text_1: "[GetSituationByKey('hussite_wars').GetName] spôsobujú hlboký rozkol v [GetReligionByKey('catholic').GetName]. Mnohí [GetReligionByKey('catholic').GetAdjectiveWithNoTooltip] panovníci sa obávajú, že ak sa táto heréza rýchlo neudusí, môže zachvátiť rozsiahle časti [ShowContinentName('europe')] a ohroziť duchovnú autoritu [GetCountry('PAP').GetGovernment.GetRulerTitle]."
 hint_hussite_wars_hint_text_2: "#T Odporúčané kroky:#!\n@arrow_bonus_tier_3! [GetCountry('PAP').GetGovernment.GetRulerTitle] sa pokúsi viesť [war_with_icon|e] proti [GetCountry('BOH').GetName]. Susedné [ShowReligionGroupAdjective('christian')] krajiny sa môžu pridať na ktorúkoľvek stranu a rozhodnúť osud celého [continent_with_icon|e]." # todo: CHANGED
 hint_hussite_wars_hint_text_3: "#T Extra tipy:#!\n@hint! [GetCountry('BOH').GetName] má prístup k mnohým jedinečným [actions_with_icon|e], ako [ShowGenericActionName('convert_heretics_hw_action')] a [ShowGenericActionName('prepare_defenses_hw_action')], medzi inými." # todo: CHANGED
 hint_hussite_wars_hint_text_4: "#T Odporúčané kroky ako [GetCountry('PAP').GetName]:#!\n@arrow_bonus_tier_3! Dobré vzťahy s ostatnými [GetReligionByKey('catholic').GetAdjective] krajinami vám môžu umožniť privolať ich do boja. Jedinečný [ShowPeaceTreatyTypeName('supress_hussite_faith')] [peace_treaty_with_icon|e] je dostupný počas [situation_with_icon|e]. Zníži cenu použitia #Y Force Convert#! [peace_treaty_with_icon|e].\n@arrow_bonus_tier_2! [GetReligionByKey('catholic').GetAdjective] [countries_with_icon|e] vo vojne s [GetCountry('BOH').GetName] získajú prístup k jedinečnej [unit_with_icon|e] akcii [ShowUnitAbilityName('hussite_tribunal')]. Tá umožní násilné [convert_with_icon|e] [GetReligionByKey('hussite').GetAdjective] [pops_with_icon|e] a zabiť tých, ktorí sa bránia v [province_capitals_with_icon|e] ktoré kontrolujú počas vojny." # todo: CHANGED
 hint_hussite_wars_diplomatic: "\"Viera by nás mala viesť k hľadaniu rovnako zmýšľajúcich spojencov a vytrvaniu v tomto búrlivom období.\""
 hint_hussite_wars_administrative: "\"Mali by sme sa starať o udržiavanie [religious_unity_with_icon|e].\" # todo: CHANGED
 hint_hussite_wars_military: "\"Je pravdepodobné, že budeme musieť našu vieru brániť násilím.\""
 hint_italian_wars: "[GetSituationByKey('italian_wars').GetNameWithNoTooltip]"
 hint_italian_wars_hint_text: "$hint_italian_wars_hint_text_1$\n\n$hint_italian_wars_hint_text_2$\n\n$hint_italian_wars_hint_text_3$\n\n$hint_italian_wars_hint_text_4$"
 hint_italian_wars_hint_text_1: "[GetSituationByKey('italian_wars').GetName] zahŕňa [ShowRegionName('italy_region')]. Ako vonkajšie [countries_with_icon|e] usilujú o inváziu regiónu, vznik Talianskych líg znamená obdobie rozdelenia a odporu, ktoré chránia bohatstvo regiónu." # todo: CHANGED
 hint_italian_wars_hint_text_2: "#T Odporúčané kroky:#!\n@arrow_bonus_tier_3! Vodcovia každej ligy môžu pozvať ďalšie [countries_with_icon|e], aby posilnili ich vplyv v [ShowRegionName('italy_region')]." # todo: CHANGED
 hint_italian_wars_hint_text_3: "#T Ďalšie tipy:#!\n@hint! Rivali alebo nepriatelia vodcov líg môžu využiť [ShowGenericActionName('iw_send_aid')] a nakloniť rovnováhu dôležitej vojny."
 hint_italian_wars_hint_text_4: "#T Odporúčané kroky ako vodca ligy [ShowCultureGroupName('italian_group')]:#!\n@arrow_bonus_tier_3! Dobré vzťahy so susedmi zvýšia moc našej [international_organization_with_icon|e]." # todo: CHANGED
 hint_italian_wars_diplomatic: "\"[ShowRegionName('italy_region')] musí byť pod kontrolou nás a našich rovnako zmýšľajúcich spojencov.\""
 hint_italian_wars_administrative: "\"Zriadenie [subjects_with_icon|e] v [ShowRegionName('italy_region')] posilní náš vplyv v regióne.\" # todo: CHANGED
 hint_italian_wars_military: "\"Musíme rozdrviť konkurenciu — v hre je príliš veľa bohatstva a moci.\""
 hint_little_ice_age: "[GetSituationByKey('little_ice_age').GetNameWithNoTooltip]"
 hint_little_ice_age_hint_text: "$hint_little_ice_age_hint_text_1$\n\n$hint_little_ice_age_hint_text_2$\n\n$hint_little_ice_age_hint_text_3$"
 hint_little_ice_age_hint_text_1: "[GetSituationByKey('little_ice_age').GetName] je tu! Mrazivé počasie pokrýva krajinu. Musíme urobiť všetko pre ochranu úrody, zvierat a prežitie našich ľudí!"
 hint_little_ice_age_hint_text_2: "#T Odporúčané kroky:#!\n@arrow_bonus_tier_3! Zvážte rozšírenie [buildings_with_icon|e], ktoré produkujú alebo zvyšujú produkciu [food_with_icon|e]." # todo: CHANGED
 hint_little_ice_age_hint_text_3: "#T Extra tipy:#!\n@hint! Môžeme využiť jedinečné [actions_with_icon|e], aby sme posilnili a rozdelili [food_with_icon|e] medzi naše [provinces_with_icon|e]." # todo: CHANGED
 hint_little_ice_age_diplomatic: "\"Zima prichádza.\""
 hint_little_ice_age_administrative: "\"Správna výroba a distribúcia [food_with_icon|e] ochráni naše [pops_with_icon|e] pred predčasným stretnutím so žatvou.\" # todo: CHANGED
 hint_little_ice_age_military: "\"Zamrznuté vodné plochy môžu byť dočasne priechodné, ale [armies_with_icon|e] uviaznuté v zimných horách riskujú byť uviaznuté omnoho dlhšie.\" # todo: CHANGED
 hint_the_revolution: "[GetSituationByKey('the_revolution').GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 hint_the_revolution_hint_text: "$hint_the_revolution_hint_text_1$\n\n$hint_the_revolution_hint_text_2$\n\n$hint_the_revolution_hint_text_3$" # todo: NEW TRANSLATION
 hint_the_revolution_hint_text_1: "Vypukla [GetSituationByKey('the_revolution').GetName]! Monarchie sa trasú, keď sa myšlienky slobody, rovnosti a bratstva šíria ako požiar. Prijmeme plamene zmien, alebo budeme brániť starý poriadok?" # todo: NEW TRANSLATION
 hint_the_revolution_hint_text_2: "#T Odporúčané kroky:#!\n@arrow_bonus_tier_3! Môžeme sa stať [revolutionary_with_icon|e] prispením na stranu revolučných povstalcov počas [ShowDisasterName('revolution_disaster')] [disaster_with_icon|e].\n@arrow_bonus_tier_2! [situation|e] umožňuje #Y 2#! jedinečné [peace_treaties_with_icon|e]: [ShowPeaceTreatyTypeName('reinstate_the_monarchy')] a [ShowPeaceTreatyTypeNameWithNoTooltip('force_revolution')].\n@arrow_bonus_tier_1! [situation|e] poskytuje prístup k novým [actions_with_icon|e] ako [ShowGenericActionName('suppress_foreign_revolutionaries')] a [ShowGenericActionName('assist_foreign_revolutionaries')]." # todo: CHANGED
 hint_the_revolution_hint_text_3: "#T Extra tipy:#!\n@hint! Najsilnejšia revolučná krajina môže získať titul [revolutionary_target_with_icon|e] tým, že bude mať najvyšší [great_power_score_with_icon|e]." # todo: CHANGED
 hint_the_revolution_diplomatic: "\"V politickom prostredí sa zdá, že mnohí monarchovia pri snahe potlačiť tieto revolúcie prišli o hlavu.\"" # todo: NEW TRANSLATION
 hint_the_revolution_administrative: "\"Mali by sme si vybrať stranu a rýchlo. Prežitie nášho kráľovstva závisí od rýchleho rozhodovania. Ak revolúcia zaklope na dvere, buďme pripravení.\"" # todo: NEW TRANSLATION
 hint_the_revolution_military: "\"Či už revolučné hnutie drvíme alebo podporujeme, náš vplyv musí siahať za hranice.\"" # todo: NEW TRANSLATION
 hint_western_schism: "[GetSituationByKey('western_schism').GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 hint_western_schism_hint_text: "$hint_western_schism_text_1$\n\n$hint_western_schism_text_2$\n\n$hint_western_schism_text_3$\n\n$hint_western_schism_text_4$" # todo: NEW TRANSLATION
 hint_western_schism_text_1: "Počas [ShowSituationNameWithNoTooltip('western_schism')] [situation|e] je [international_organization_with_icon|e] [GetUniqueInternationalOrganization('catholic_church').GetName] rozdelená medzi dvoch kandidátov na pápežský stolec, čo znemožňuje akúkoľvek interakciu s Kuriou.\n\nNa ovplyvnenie výsledku [situation] sa podľa vašej úlohy v Cirkvi dajú podniknúť nasledujúce kroky:" # todo: NEW TRANSLATION
 hint_western_schism_text_2: "#T [countries] v držbe [cardinal_with_icon|e]:#!\n@arrow_bonus_tier_3! Hlasujte za jedného z kandidátov" # todo: NEW TRANSLATION
 hint_western_schism_text_3: "#T [countries] bez [cardinal_with_icon|e]:#!\n@arrow_bonus_tier_3! Použite [situation] [action|e] #V $schism_show_support_for_one_pope$#! na udelenie postupu vybranému kandidátovi\n@arrow_bonus_tier_2! Použite náboženskú [action] $request_cardinal_seat$ na získanie [cardinal]\n@arrow_bonus_tier_1! Použite [situation] [action] #V $schism_demand_support_from_one_pope$#! na vyťaženie zo [situation]" # todo: NEW TRANSLATION
 hint_western_schism_text_4: "Počas [situation] sa v katolíckom svete rozšíria kacírske prúdy.\n\n#T Odporúčané kroky:#!\n@arrow_bonus_tier_3! Zvážte použitie [situation|e] akcie #V $schism_show_unity_of_faith$#! na udržanie vysokej [religious_unity_with_icon|e]." # todo: CHANGED
 hint_reformation: "[GetSituationByKey('reformation').GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 hint_reformation_hint_text: "$hint_reformation_hint_text_1$\n\n$hint_reformation_hint_text_2$\n\n$hint_reformation_hint_text_3$" # todo: NEW TRANSLATION
 hint_reformation_hint_text_1: "Počas [ShowSituationNameWithNoTooltip('reformation')] [situation|e] budú [ShowBuildingTypeName('lutheran_preachers')] a [ShowBuildingTypeName('calvinist_preachers')] šíriť nové [religions_with_icon|e] po [ShowReligionGroupAdjective('christian')] svete." # todo: CHANGED
 hint_reformation_hint_text_2: "#T Boj proti reformátorom:#!\n@arrow_bonus_tier_3! Keď máte vybranú [ShowPolicyName('jesuits_allowed')], odstráňte [ShowBuildingTypeName('lutheran_preachers')] a [ShowBuildingTypeName('calvinist_preachers')] [buildings_with_icon|e], čo vás bude stáť [stability_with_icon|e]\n@arrow_bonus_tier_3! Po povolení stavte a udržiavajte [ShowBuildingTypeName('jesuit_college')], aby ste bojovali proti šíreniu [ShowReligionName('lutheran')] a [ShowReligionName('calvinist')]" # todo: CHANGED
 hint_reformation_hint_text_3: "#T Pridajte sa k reformátorom:#!\n@arrow_bonus_tier_3! Ak sa jeden z nových vierovyznaní rozšíri do vašej krajiny, prijmite ho a konvertujte s akciou #V $embrace_the_reformation$#!\n@arrow_bonus_tier_2! Použite @religion_panel! [Link('country_religion', '', '@society_panel! Religion Tab')] na konverziu na nové [religion]" # todo: CHANGED
 hint_treaty_of_tordesillas: "[GetSituationByKey('treaty_of_tordesillas').GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 hint_treaty_of_tordesillas_hint_text: "$hint_treaty_of_tordesillas_hint_text_1$\n\n$hint_treaty_of_tordesillas_hint_text_2$" # todo: NEW TRANSLATION
 hint_treaty_of_tordesillas_hint_text_1: "Začala sa [GetSituationByKey('treaty_of_tordesillas').GetName]! [GetSituationByKey('treaty_of_tordesillas').MakeScope.GetVariable('var_west_country').GetCountry.GetName] a [GetSituationByKey('treaty_of_tordesillas').MakeScope.GetVariable('var_east_country').GetCountry.GetName] sa usilujú rozdeliť Nový svet medzi sebou!" # todo: NEW TRANSLATION
 hint_treaty_of_tordesillas_hint_text_2: "#T Odporúčané kroky:#!\n@arrow_bonus_tier_3! Môžeme využiť jedinečné [actions_with_icon|e] v paneli [situation|e] na formovanie našich koloniálnych ambícií.\n@arrow_bonus_tier_2! [situation|e] sa nakoniec dostane do #Y Druhej#! fázy, keď bude ratifikovaný. Potom sa doň môže zapojiť viac [countries_with_icon|e] a uplatniť svoje nároky." # todo: CHANGED
 hint_treaty_of_tordesillas_diplomatic: "\"Toto je dobrá príležitosť vyrezať si kúsok novoobjavených území pod zámienkou náboženskej a nadradenej autority.\"" # todo: NEW TRANSLATION
 hint_treaty_of_tordesillas_administrative: "\"Nový svet ponúka mnohé obchodné príležitosti. Využime ich.\"" # todo: NEW TRANSLATION
 hint_treaty_of_tordesillas_military: "\"Nemôžeme dovoliť, aby naši nepriatelia obsadili tieto územia skôr než my!\"" # todo: NEW TRANSLATION
 hint_great_pestilence: "[GetSituationByKey('great_pestilence').GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 hint_great_pestilence_hint_text: "$hint_black_death_hint_text_2$\n\n$hint_black_death_hint_text_3$" # todo: NEW TRANSLATION
 hint_great_pestilence_diplomatic: "\"Naši spojenci nás opustili. Vedenie nás zradilo. Opustite svoje posty! Utečte, utečte o život!\"" # todo: NEW TRANSLATION
 hint_great_pestilence_administrative: "\"Nezúfajte, existuje mnoho opatrení, ktoré môžeme prijať, aby sme zmiernili úmrtia, akokoľvek malé a neúčinné môžu byť...\"" # todo: NEW TRANSLATION
 hint_great_pestilence_military: "\"Majte na pamäti presun našich [armies_with_icon|e] cez [locations_with_icon|e] postihnuté chorobou. Nemôžeme si dovoliť stratu vojakov.\" # todo: CHANGED
 hint_columbian_exchange: "[GetSituationByKey('columbian_exchange').GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 hint_columbian_exchange_hint_text: "$hint_columbian_exchange_hint_text_1$\n\n$hint_columbian_exchange_hint_text_2$" # todo: NEW TRANSLATION
 hint_columbian_exchange_hint_text_1: "[GetSituationByKey('columbian_exchange').GetName] začala! [trade_with_icon|e] a [goods_with_icon|e] teraz budú prúdiť medzi Starým a Novým svetom!" # todo: CHANGED
 hint_columbian_exchange_hint_text_2: "#T Odporúčané kroky:#!\n@arrow_bonus_tier_3! Môžeme využiť jedinečné [actions_with_icon|e] v paneli [situation_with_icon|e], aby sme zvýšili zisk zavedením nových tovarov do nášho [market_with_icon|e]." # todo: CHANGED
 hint_columbian_exchange_diplomatic: "\"Zisky z obchodu poháňajú svet!\"" # todo: NEW TRANSLATION
 hint_columbian_exchange_administrative: "$hint_treaty_of_tordesillas_administrative$" # todo: NEW TRANSLATION
 hint_columbian_exchange_military: "\"Musíme urobiť všetko pre to, aby sme zabezpečili ziskové zdroje a nové tovary skôr než naši konkurenti!\"" # todo: NEW TRANSLATION
 hint_war_of_religions: "[GetSituationByKey('war_of_religions').GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 hint_war_of_religions_hint_text: "$hint_war_of_religions_hint_text_1$\n\n$hint_war_of_religions_hint_text_2$\n\n$hint_war_of_religions_hint_text_3$\n\n$hint_war_of_religions_hint_text_4$" # todo: NEW TRANSLATION
 hint_war_of_religions_hint_text_1: "Počas [ShowSituationNameWithNoTooltip('war_of_religions')] [situation|e] sa dve [international_organizations_with_icon|e] snažia zabezpečiť prežitie svojich [religions_with_icon|e] v rámci [GetUniqueInternationalOrganization('hre').GetName]. [GetUniqueInternationalOrganization('protestant_union').GetName] a [GetUniqueInternationalOrganization('catholic_league').GetName] budú poskytovať ochranu [countries_with_icon|e] ríše. Pri narastajúcom napätí sa obe snažia dosiahnuť náboženskú supremaciu a meniť [laws_with_icon|e] [GetUniqueInternationalOrganization('hre').GetNameWithNoTooltip] podľa svojich preferencií." # todo: CHANGED
 hint_war_of_religions_hint_text_2: "#T Odporúčané kroky:#!\n@arrow_bonus_tier_3! Pridajte sa k [international_organization], ktorú chcete podporiť\n@arrow_bonus_tier_2! Hľadajte nové [alliances_with_icon|e] s vonkajšími krajinami\n@arrow_bonus_tier_2! Ako krajina mimo [GetUniqueInternationalOrganization('hre').GetNameWithNoTooltip], hľadajte [alliance] s vodcom preferovanej náboženskej ligy" # todo: CHANGED
 hint_war_of_religions_hint_text_3: "#T Ak ste vodcom náboženskej ligy:#!\n@arrow_bonus_tier_3! Použite [situation] [action|e] #V $prepare_military_escalation$#!, aby ste získali [ShowCasusBelliName('cb_religious_superiority')]\n@hint! Akonáhle ju použijete, môžete vynútiť [ShowPeaceTreatyTypeName('religious_supremacy')] na presadenie požiadaviek vašej frakcie\n@arrow_bonus_tier_2! Použite [situation] [action] #V $demand_member_removal$#!, aby ste pred vypuknutím [war] odstránili nebezpečné krajiny z druhej [international_organization]" # todo: NEW TRANSLATION
 hint_war_of_religions_hint_text_4: "#T Extra tipy:#!\n@hint! Počas [war] typu [ShowCasusBelliName('cb_religious_superiority')] [countries] získajú [war_exhaustion]\n@hint! Ak #Y 80%#! všetkých účastníkov túži po [peace_with_icon|e], dosiahne sa #Y Mier vo Westfálsku#!\n@hint! To donúti vojnu skončiť a dosiahne náboženský mier v [GetUniqueInternationalOrganization('hre').GetNameWithNoTooltip]" # todo: CHANGED
 hint_guelphs_and_ghibellines: "[GetSituationByKey('guelphs_and_ghibellines').GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 hint_guelphs_and_ghibellines_hint_text: "$hint_guelphs_and_ghibellines_hint_text_1$\n\n$hint_guelphs_and_ghibellines_hint_text_2$" # todo: NEW TRANSLATION
 hint_guelphs_and_ghibellines_hint_text_1: "Počas [ShowSituationNameWithNoTooltip('guelphs_and_ghibellines')] [situation|e] súperia [international_organizations_with_icon|e] [GetUniqueInternationalOrganization('guelphs_io').GetName] a [GetUniqueInternationalOrganization('ghibellines_io').GetName] o vplyv nad [region|e] [ShowRegionName('italy_region')] v mene [GetUniqueInternationalOrganization('catholic_church').GetLeaderTitle] ([GetUniqueInternationalOrganization('guelphs_io').GetName]) alebo [GetUniqueInternationalOrganization('hre').GetLeaderTitle] ([GetUniqueInternationalOrganization('ghibellines_io').GetName])." # todo: NEW TRANSLATION
 hint_guelphs_and_ghibellines_hint_text_2: "#T Ak ste členom ktorejkoľvek strany:#!\n@arrow_bonus_tier_3! Vynúťte [country_with_icon|e] do vašej frakcie pomocou [ShowCasusBelliName('cb_gag_force_country_into_faction')] [casus_belli_with_icon|e]\n@arrow_bonus_tier_2! Pomôžte členom vašej frakcie udržať ich [tax_base_with_icon|e] diplomatickými vzťahmi ako [alliances_with_icon|e] alebo [guarantee_with_icon|e]\n@arrow_bonus_tier_2! Zvýšte [tax_base_with_icon|e] vašej [country]" # todo: CHANGED
 hint_colonial_revolution: "[GetSituationByKey('colonial_revolution').GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 hint_colonial_revolution_hint_text: "$hint_colonial_revolution_hint_text_1$\n\n$hint_colonial_revolution_text_2$\n\n$hint_colonial_revolution_text_3$" # todo: NEW TRANSLATION
 hint_colonial_revolution_hint_text_1: "Počas [ShowSituationNameWithNoTooltip('colonial_revolution')] [situation|e] koloniálni [subjects_with_icon|e] po svete bojujú o nezávislosť proti svojim [overlords_with_icon|e]." # todo: CHANGED
 hint_colonial_revolution_text_2: "#T Ak ste koloniálna krajina :#!\n@arrow_bonus_tier_3! Vytvorte koloniálnu federáciu [international_organization|e]\n@arrow_bonus_tier_2! Použite [situation] akciu #V $seek_alliance_with_overlord_rival$#! a získajte pomoc od iných [countries_with_icon|e]\n@arrow_bonus_tier_1! Ak existuje koloniálna federácia, zvážte jej pripojenie" # todo: CHANGED
 hint_colonial_revolution_text_3: "#T Ak ste [overlord] :#!\n@arrow_bonus_tier_3! Použite [situation] [action] #V $establish_goods_act$#! na získanie ďalších prostriedkov\n@arrow_bonus_tier_2! Zvážte použitie [situation] [action] #V $give_colony_representation$#!, ak sa kolónia stane neloajálnou" # todo: NEW TRANSLATION
 hint_red_turban_rebellions: "[GetSituationByKey('red_turban_rebellions').GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 hint_red_turban_rebellions_hint_text: "$hint_red_turban_rebellions_hint_text_1$\n\n$hint_red_turban_rebellions_hint_text_2$\n\n$hint_red_turban_rebellions_hint_text_3$" # todo: NEW TRANSLATION
 hint_red_turban_rebellions_hint_text_1: "Vypukli [GetSituationByKey('red_turban_rebellions').GetName] po celom $china$! [GetCountry('CHI').GetName] prišli o priazeň nebies, nestabilita teraz vládne ich [GetCountry('CHI').GetFlavorRank]!" # todo: NEW TRANSLATION
 hint_red_turban_rebellions_hint_text_2: "#T Odporúčané kroky:#!\n@arrow_bonus_tier_3! [GetCountry('CHI').GetName] musí vynútiť [ShowPeaceTreatyTypeName('rtr_rein_in_rebellion')] na tých, ktorí sa odtrhávajú od ich vlády.\n@arrow_bonus_tier_2! [GetInternationalOrganizationType('red_turban_rebels').GetName] môže požadovať [ShowPeaceTreatyTypeName('rtr_demand_occupied_territories')] proti [GetCountry('CHI').GetNameWithNoTooltip].\n@arrow_bonus_tier_1! [GetCountry('CHI').GetLongName] bude trpieť mnohými jedinečnými [events_with_icon|e], keď jeho krajinu obsadia potenciálni dobyvatelia." # todo: CHANGED
 hint_red_turban_rebellions_hint_text_3: "#T Extra tipy:#!\n@hint! Môžeme použiť mnohé jedinečné [actions_with_icon|e] v paneli [situation_with_icon|e] na pomoc [integrate_with_icon|e] dobytí a udržať vysoké [control_with_icon|e].\n@hint! Ak situáciu vyhráme a vytvoríme [GetFormableCountry('CHI').GetName], automaticky dostaneme [cores|e] v celom $china$." # todo: CHANGED
 hint_red_turban_rebellions_diplomatic: "\"Nepretržité vojny nechávajú málo priestoru pre reči a diplomaciu...\"" # todo: NEW TRANSLATION
 hint_red_turban_rebellions_administrative: "\"Bolo by múdre správne využiť akcie tejto situácie. Sú to cenné nástroje, ktoré nám pomôžu vyjsť víťazne.\"" # todo: NEW TRANSLATION
 hint_red_turban_rebellions_military: "\"Teraz celé $china$ vie, že sme tu!\"" # todo: NEW TRANSLATION
 hint_rise_of_timur: "[GetSituationByKey('rise_of_timur').GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 hint_rise_of_timur_hint_text: "$hint_rise_of_timur_hint_text_1$\n\n$hint_rise_of_timur_hint_text_2$\n\n$hint_rise_of_timur_hint_text_3$" # todo: NEW TRANSLATION
 hint_rise_of_timur_hint_text_1: "Z hlbín [ShowSubContinentName('central_asia')] prichádza bledý obraz smrti v podobe [GetCharacter('chg_timur_lame_borjigin').GetName] a [GetCharacter('chg_timur_lame_borjigin').GetHerHis] [GetCountry('TIM').GetFlavorRank]. Beda tým, ktorí sa postavia proti [GetCharacter('chg_timur_lame_borjigin').GetHerHis] dobytím!" # todo: NEW TRANSLATION
 hint_rise_of_timur_hint_text_2: "#T Odporúčané kroky:#!\n@arrow_bonus_tier_3! Pokiaľ žije [GetCharacter('chg_timur_lame_borjigin').GetName], [GetCharacter('chg_timur_lame_borjigin').GetHerHis] [GetCountry('TIM').GetFlavorRank] bude profitovať z [ShowModifier('timmy_wants_to_play')] [modifier_with_icon|e].\n@arrow_bonus_tier_2! Spomínaný [modifier_with_icon|e] umožní [GetCharacter('chg_timur_lame_borjigin').GetShortNameWithNoTooltip] automaticky anektovať obliehané [locations_with_icon|e].\n@arrow_bonus_tier_1! [GetCountry('TIM').GetLongName] získa prístup k jedinečným [casus_belli_with_icon|e]." # todo: CHANGED
 hint_rise_of_timur_hint_text_3: "#T Extra tipy:#!\n@hint! [GetCountry('TIM').GetName] môže využívať mnohé mocné [actions_with_icon|e] v paneli [situation_with_icon|e]." # todo: CHANGED
 hint_rise_of_timur_diplomatic: "\"Možno sa s hordou dá vyjednávať?\"" # todo: NEW TRANSLATION
 hint_rise_of_timur_administrative: "\"Zvážme výstavbu opevnení na ochranu našich hraníc.\"" # todo: NEW TRANSLATION
 hint_rise_of_timur_military: "\"[GetCountry('TIM').GetName] sú závislí na mocnej armáde pekelných jazdcov, histórii dobytí a hlade rozopnúť čeľuste a pohltiť celé [ShowContinentName('asia')]!\"" # todo: NEW TRANSLATION
 hint_nanbokuchou: "[GetSituationByKey('nanbokuchou').GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 hint_nanbokuchou_hint_text: "$hint_nanbokuchou_hint_text_1$\n\n$hint_nanbokuchou_hint_text_2$\n\n$hint_nanbokuchou_hint_text_3$" # todo: NEW TRANSLATION
 hint_nanbokuchou_hint_text_1: "[GetSituationByKey('nanbokuchou').GetName] je [situation_with_icon|e], ktorá rozdeľuje [ShowRegionName('japan_region')] na súperiace cisárske dvory, severnú a južnú líniu, pričom každá usiluje o legitimitu. Klany musia zvoliť stranu, pretože tento konflikt preformuje celý ostrovný národ." # todo: CHANGED
 hint_nanbokuchou_hint_text_2: "#T Odporúčané kroky:#!\n@arrow_bonus_tier_3! Použite jedinečný [ShowCasusBelliName('cb_nanbokuchou')] [casus_belli_with_icon|e] na vedenie vojny za vášho cisárskeho nárokovača.\n@arrow_bonus_tier_2! Môžete prinútiť riválneho dvora abdikovať použitím [ShowPeaceTreatyTypeName('peace_nanbokuchou_force_imperial_abdication')] [peace_treaty|e] a zabezpečiť nadvládu vášho preferovaného cisára.\n@arrow_bonus_tier_2! Použite [ShowUnitAbilityName('raid_clan_holdings')] a [ShowUnitAbilityName('raid_imperial_family_holdings')] [unit_abilities|e] na získanie [war_score|e]\n@arrow_bonus_tier_1! Rozšírte vplyv svojej klanu pomocou [ShowPeaceTreatyTypeName('peace_expand_clan_influence')] na zajatie nepriateľských [locations_with_icon|e]." # todo: CHANGED
 hint_nanbokuchou_hint_text_3: "#T Ďalšie tipy:#!\n@hint! Opatrné načasovanie je kľúčové. Menšie klany môžu využiť konflikt na získanie vplyvu nad rivalmi.\n@hint! Zvážte rovnováhu síl predtým, než sa zaviažete na jednu stranu." # todo: NEW TRANSLATION
 hint_nanbokuchou_diplomatic: "\"Toto je viac než vojna mečov. Naša voľba nárokovateľa určí naše dedičstvo.\"" # todo: NEW TRANSLATION
 hint_nanbokuchou_administrative: "\"Udržať poriadok pri postavení sa na jednu alebo druhú stranu je výzva, ale môže nám to udeliť bezkonkurenčný vplyv nad cisárskou inštitúciou.\"" # todo: NEW TRANSLATION
 hint_nanbokuchou_military: "\"Udeľte rozhodujúci úder a získajte plášť legitimity skôr, než si naši rivali konsolidujú moc.\"" # todo: NEW TRANSLATION
 hint_sengoku: "[GetSituationByKey('sengoku').GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 hint_sengoku_hint_text: "$hint_sengoku_hint_text_1$\n\n$hint_sengoku_hint_text_2$\n\n$hint_sengoku_hint_text_3$" # todo: NEW TRANSLATION
 hint_sengoku_hint_text_1: "[GetSituationByKey('sengoku').GetName] je [situation_with_icon|e], ktorá zahŕňa [ShowRegionName('japan_region')] do takmer nepretržitého vojnového stavu. Klany bojujú o nadvládu, zatiaľ čo $JAPANESE_SHOGUNATE_LEADER_MALE$ bojuje o kontrolu nad krajinou." # todo: CHANGED
 hint_sengoku_hint_text_2: "#T Odporúčané kroky:#!\n@arrow_bonus_tier_3! Vádzajte vojnu s jedinečným [ShowCasusBelliName('cb_sengoku')] [casus_belli_with_icon|e] na rozšírenie svojej klanu.\n@arrow_bonus_tier_2! Ako $JAPANESE_SHOGUNATE_LEADER_MALE$ použite [ShowGenericActionName('sengoku_revoke_clans_land')] na oslabenie prerastených klanov a [ShowGenericActionName('sengoku_limit_clans_autonomy')] premenením ich na [building_based_with_icon|e].\n@arrow_bonus_tier_1! Ak ste [building_based_with_icon|e], môžete vyhlásiť nezávislosť a stať sa [location_based_with_icon|e] pomocou [ShowGenericActionName('sengoku_proclaim_clan_independence')]." # todo: CHANGED
 hint_sengoku_hint_text_3: "#T Ďalšie tipy:#!\n@hint! Rovnováha síl sa neustále mení. Hľadajte príležitosti zasiahnuť oslabené klany.\n@hint! Ako $JAPANESE_SHOGUNATE_LEADER_MALE$, skorá konsolidácia kontroly výrazne uľahčí zjednotenie [ShowRegionName('japan_region')].\n@hint! Malé klany môžu profitovať hraním väčších rivalov proti sebe, až kým nenastane vhodný okamih na odtrhnutie sa." # todo: NEW TRANSLATION
 hint_sengoku_diplomatic: "\"Aliancie sa rýchlo menia. Vyberajte si priateľov opatrne, pretože môžu byť zajtra vašimi nepriateľmi.\"" # todo: NEW TRANSLATION
 hint_sengoku_administrative: "\"Je potrebné silné vládnutie, aby sa kráľovstvo nevrútilo do chaosu.\"" # todo: NEW TRANSLATION
 hint_sengoku_military: "\"Toto je vek meča. Uderte rýchlo a tvrdo, alebo vás pohlcú iní.\"" # todo: NEW TRANSLATION
 swift_end_string: "Rovnako ako pri každej katastrofe je často najvhodnejší rýchly koniec, pretože nevybavené záležitosti môžu viesť k nežiaducim následkom." # todo: NEW TRANSLATION
 disaster_war_hint: "Je dobré mať na pamäti, že niektorí z našich susedov si počas našich búrlivých čias neželajú prímerie ani alianciu, pretože hľadajú expanzívne príležitosti na náš úkor." # todo: NEW TRANSLATION
 hint_coup_attempt: "$coup_attempt$ Hints" # todo: NEW TRANSLATION
 hint_coup_attempt_hint_text: "$hint_coup_attempt_hint_text_1$\n\n$hint_coup_attempt_hint_text_2$\n\n$hint_coup_attempt_hint_text_3$" # todo: NEW TRANSLATION
 hint_coup_attempt_hint_text_1: "V našom [court_with_icon|e] ambitní ľudia hľadajú moc nekalými spôsobmi, aby na tróne umiestnili bábky, diktovali [laws_with_icon|e] a získali pre seba [privileges_with_icon|e]. Tento [disaster_with_icon|e] potrvá, kým sprisahanci nezmiznú, ich vodca neprevezme trón, alebo kým nezískame dostatočnú [legitimacy_with_icon|e]. $swift_end_string$" # todo: CHANGED
 hint_coup_attempt_hint_text_2: "#T Odporúčané kroky:#!\n@arrow_bonus_tier_3! Môžeme vykonať [ShowGenericActionName('conduct_investigation')]. To môže nejaký čas trvať, ale odhalí nám niektorých sprisahancov a priblíži nás k ich očisteniu.\n@arrow_bonus_tier_2! Udržiavajte vysokú [stability_with_icon|e]. Čím vyššia je, tým nižší je prah potrebnej [legitimacy_with_icon|e] na ukončenie tohto [disaster_with_icon|e].\n@arrow_bonus_tier_1! Ak by sa situácia zhoršila, môžeme zvoliť buď [ShowGenericActionName('call_private_council')] alebo [ShowGenericActionName('execute_court_member')]. Prvé umožní spoľahnúť sa na naše [estates_with_icon|e] pri odhaľovaní sprisahancov výmenou za [privileges_with_icon|e] alebo [gold_with_icon|e]. Druhá akcia dovolí popraviť akúkoľvek [character_with_icon|e] na dvore, ktorého považujeme za súčasť sprisahania." # todo: CHANGED
 hint_coup_attempt_hint_text_3: "#T Extra tipy:#!\n@hint! Počas tohto [disaster_with_icon|e] môžeme dostať náhodné [events_with_icon|e], ktoré ukážu potenciálnych sprisahancov. Je múdre ich preskúmať a rozhodovať rozumne. Nebolo by rozumné, keby náš najlepší [cabinet_member_with_icon|e] stratil hlavu bez dôvodu." # todo: CHANGED
 hint_coup_attempt_diplomatic: "\"Teraz je čas posilniť vzťahy so susednými [countries_with_icon|e] a zabezpečiť pevné hranice. Posledné, čo potrebujeme, sú nebezpečenstvá zvonku aj zvnútra.\" # todo: CHANGED
 hint_coup_attempt_administrative: "\"Jeden z ostatných poradcov môže byť sprisahankom. Možno sa to nikdy nedozvieme!\"" # todo: NEW TRANSLATION
 hint_coup_attempt_military: "\"$disaster_war_hint$ Pamätajte, predbežný úder je len a #italic prekvapujúca mierová zmluva#! doručená veľmi násilne.\"" # todo: NEW TRANSLATION
 hint_crisis_of_the_chinese_dynasty: "$crisis_of_the_chinese_dynasty$ Hints" # todo: NEW TRANSLATION
 hint_crisis_of_the_chinese_dynasty_hint_text: "$hint_crisis_of_the_chinese_dynasty_hint_text_1$\n\n$hint_crisis_of_the_chinese_dynasty_hint_text_2$" # todo: NEW TRANSLATION
 hint_crisis_of_the_chinese_dynasty_hint_text_1: "Nebesia nám kedysi dávali svetlo a prosperitu. Avšak nedávne udalosti, hladomory a zničenie priniesli temné obdobie pre našu vládu nad $china$. Tento [disaster_with_icon|e] potrvá, kým sa nevymaníme pomocou dôsledných reforiem administratívy, alebo stratíme svoje miesto v čele [GetUniqueInternationalOrganization('middle_kingdom').GetName]. $swift_end_string$" # todo: CHANGED
 hint_crisis_of_the_chinese_dynasty_hint_text_2: "#T Odporúčané kroky:#!\n@arrow_bonus_tier_3! Môžeme zvoliť [ShowCabinetActionName('reform_taxation_system')] cez náš [cabinet_with_icon|e]. To môže trvať, ale nastaví nás na správnu cestu k ukončeniu tohto [disaster_with_icon|e].\n@arrow_bonus_tier_2! Udržiavajte vysokú [celestial_authority_gc_with_icon|e]. Ak dosiahne #G 90#! alebo vyššie, [disaster_with_icon|e] sa pokojne skončí.\n@arrow_bonus_tier_1! [disaster_with_icon|e] prináša množstvo nových [actions_with_icon|e] ako [ShowGenericActionName('cmd_reform_the_cabinet')], [ShowGenericActionName('cmd_restore_stability')] a [ShowGenericActionName('cmd_strengthen_crown')]. Tie ponúkajú alternatívny spôsob pokojného ukončenia obdobia, ak nemôžeme dosiahnuť potrebnú [celestial_authority_gc_with_icon|e]." # todo: CHANGED
 hint_crisis_of_the_chinese_dynasty_diplomatic: "\"Teraz je čas upevniť vzťahy s [countries_with_icon|e] patriacimi do [GetUniqueInternationalOrganization('middle_kingdom').GetName], aby sme zaistili prežitie tejto veľkej inštitúcie.\n\nBez rešpektu, čím sa odlišujú ľudia od zverí?\" # todo: CHANGED
 hint_crisis_of_the_chinese_dynasty_administrative: "\"Ak sa rozhodneme ukončiť toto [disaster_with_icon|e] prostredníctvom reforiem administratívy, je rozumné zveriť tieto monumentálne úlohy schopným [cabinet_members_with_icon|e].\n\nKto nebude šetriť, bude trpieť.\" # todo: CHANGED
 hint_crisis_of_the_chinese_dynasty_military: "\"$disaster_war_hint$\n\nV strede chaosu je aj príležitosť!\"" # todo: NEW TRANSLATION
 hint_turmoil_in_brandenburg: "$turmoil_in_brandenburg$" # todo: NEW TRANSLATION
 hint_turmoil_in_brandenburg_hint_text: "$hint_turmoil_in_brandenburg_hint_text_1$\n\n$hint_turmoil_in_brandenburg_hint_text_2$\n\n$hint_turmoil_in_brandenburg_hint_text_3$\n\n$hint_turmoil_in_brandenburg_hint_text_4$" # todo: NEW TRANSLATION
 hint_turmoil_in_brandenburg_hint_text_1: "Katastrofa $turmoil_in_brandenburg$ predstavuje dva problémy, s ktorými sa musíme vyrovnať. Najprv musíme buď upevniť našu vládnucu dynastiu zvýšením Skóre investícií na 100, alebo požiadať cisára Svätého rímskeho impéria, aby na náš trón dosadil novú dynastiu, ak dosiahnete skóre -100 v Zanedbaní. Po roku 1365 sa Lúpežní baróni budú v našich [provinces|e] objavovať častejšie a budú krajinu devastovať. Keď bude dostatočná časť našej krajiny (75% našich vlastnených [provinces]) oslobodená od teroru Lúpežných barónov prostredníctvom $pru_deal_with_robber_barons$ [cabinet_action|e], katastrofa bude môcť skončiť." # todo: NEW TRANSLATION
 hint_turmoil_in_brandenburg_hint_text_2: "#T Recommended Actions:#!\n@arrow_bonus_tier_1! Zvýšte svoje skóre v Investíciách alebo Zanedbaní prostredníctvom udalostí súvisiacich s touto katastrofou\n@arrow_bonus_tier_1! Opatrne rozširujte svoje územie, aby ste Lúpežným barónom nedali nový priestor na rozšírenie" # todo: NEW TRANSLATION
 hint_turmoil_in_brandenburg_hint_text_3: "#T Extra Hints:#!Získajte späť stratenú [control] pomocou príslušného [cabinet_action]\n@hint! Nájdite [alliances|e], ktoré sú schopné vám pomôcť v prípadnom [civil_war|e]" # todo: NEW TRANSLATION
 hint_turmoil_in_brandenburg_hint_text_4: "#T How to achieve different dynastic outcomes:#!\n@hint!Zachováte súčasnú vládnucu dynastiu dosiahnutím $bra_wittelsbacher_investment_var$ 100\n@hint!Bude možné získať dynastiu Hohenzollern dosiahnutím $bra_wittelsbacher_neglect_var$ -100, keď bude cisár mať dospelého dediča. Keď táto postava bude vládnuť obom krajinám ako cisár Svätého rímskeho impéria, bude môcť dosadiť člena dynastie Hohenzollern na váš trón." # todo: NEW TRANSLATION
 hint_war: "Vojna" # todo: NEW TRANSLATION
 hint_war_hint_text: "$hint_war_hint_text_1$\n\n$hint_war_hint_text_2$\n\n$hint_war_hint_text_3$" # todo: NEW TRANSLATION
 hint_war_hint_text_1: "[war_with_icon|e] začína, keď [country_with_icon|e] vyhlási vojnu a končí, keď sa obe strany dohodnú na [peace_treaty_with_icon|e]. Každá vojna má dvoch [war_leaders_with_icon|e], ale môžu existovať aj ďalší [war_allies_with_icon|e]. Vojna skončí, keď dvaja [war_leaders] podpíšu [peace_treaty], no sekundárni účastníci môžu podpísať samostatné mierové zmluvy s nepriateľom." # todo: CHANGED
 hint_war_hint_text_2: "#T Odporúčané kroky:#!\n@arrow_bonus_tier_3! Zvážte získanie [casus_belli_with_icon|e] pred vyhlásením [war]. Môžeme o ne požiadať počas [parliament_with_icon|e] alebo si ich sfabrikovať voči [rivals_with_icon|e].\n@arrow_bonus_tier_3! Po začiatí vojny sledujte [casus_belli] a jeho [war_goal_with_icon|e], pretože sú rozhodujúce pre získavanie [war_score_with_icon|e] a zabezpečenie priaznivého [peace_treaty_with_icon|e].\n@arrow_bonus_tier_3! V závislosti od Casus Belli budeme získavať [war_score_with_icon|e] rôznymi spôsobmi. Tu sú najbežnejšie zdroje:\n @arrow_bonus_tier_1! Obsadiť nepriateľské [capital_with_icon|e].\n @arrow_bonus_tier_1! Ovládnuť nárokované [locations_with_icon].\n @arrow_bonus_tier_1! Obsadiť nepriateľské [forts_with_icon|e].\n @arrow_bonus_tier_1! Poraziť nepriateľské [armies_with_icon|e] v [battle].\n @arrow_bonus_tier_1! [blockade_with_icon|e] nepriateľské [ports_with_icon|e].\n@arrow_bonus_tier_3! Sledujte náš [war_exhaustion_with_icon|e], pretože môže výrazne poškodiť ekonomiku a schopnosť viesť vojnu." # todo: CHANGED
 hint_war_hint_text_3: "#T Extra tipy:#!\n@hint! Počas [war] môžu obe strany [occupy_with_icon|e] nepriateľské [locations_with_icon|e], ale územie sa oficiálne nemení až do ratifikácie v [peace_treaty_with_icon|e].\n@hint! Čím dlhšie vojna trvá, tým ochotnejšie budú strany akceptovať mierovú ponuku." # todo: CHANGED
 hint_war_diplomatic: "\"Vojna môže byť veľmi výnosné podnikanie, ale aj rýchla cesta k katastrofe\"" # todo: NEW TRANSLATION
 hint_war_administrative: "\"Keď obchod nedokáže zabezpečiť zásoby životne dôležitých zdrojov, vojna sa stáva takmer nevyhnutnou.\"" # todo: NEW TRANSLATION
 hint_war_military: "\"Jediný spôsob, ako si zaistiť bezpečie, je prerásť svojich susedov.\"" # todo: NEW TRANSLATION
 hint_battle: "Bitky" # todo: NEW TRANSLATION
 hint_battle_hint_text: "$hint_battle_hint_text_1$\n\n$hint_battle_hint_text_2$\n\n$hint_battle_hint_text_3$" # todo: NEW TRANSLATION
 hint_battle_hint_text_1: "Keď sa [army_with_icon|e] ocitne v tej istej [location_with_icon|e] ako nepriateľská [army], začne [battle_with_icon|e]. Armáda, ktorá bola v lokalite prvá, bude [defender_with_icon|e] a bude mať výhodu terénu. Bitka končí, keď jedná strana stratí všetku [morale_with_icon|e] alebo všetky [regiments_with_icon|e], podľa toho, čo nastane skôr." # todo: CHANGED
 hint_battle_hint_text_2: "#T Odporúčané kroky:#!\n@arrow_bonus_tier_3! Privolajte susedné armády ako posily do prebiehajúcich bitiek. Ak dorazia načas, vstúpia do boja ako čerstvé rezervy.\n@arrow_bonus_tier_2! Uistite sa, že naše [armies_with_icon|e] majú dobrého [commander_with_icon|e] pred zaviazaním ich do [battle].\n@arrow_bonus_tier_2! Vždy venujte pozornosť terénu lokality. Útočiaci [attacker_with_icon|e] bude trpieť penalizáciami vo svojej hode podľa topografie a vegetácie lokality. Starostlivo si vyberte bojisko!\n@arrow_bonus_tier_1! Niekedy je múdre dať rozkaz k včasnému [retreat_with_icon|e], kým naše sily nie sú zničené nepriateľskou presilou." # todo: CHANGED
 hint_battle_hint_text_3: "#T Extra tipy:#!\n@hint! Prehra v bitke neznamená nevyhnutne koniec vojny. Po porážke sa môžete stiahnuť do bezpečia, získať morálku, prípadne naverbovať žoldnierov a skúsiť to znovu za priaznivejších okolností (rovnako to môže urobiť aj nepriateľ! Nestriehajte predčasné oslavy víťazstva).\n@hint! Ak má lokalita [fort_with_icon|e], bude obranca tejto lokality vždy považovaný za [defender], bez ohľadu na to, kto prišiel prvý." # todo: CHANGED
 hint_battle_diplomatic: "\"Nech nechajú naši nepriatelia zahynúť úpadkom a hladom, skôr než s nimi vstúpime do boja.\"" # todo: NEW TRANSLATION
 hint_battle_administrative: "\"Rýchle víťazstvo na bojisku by nám umožnilo ísť do ofenzívy bez vystavovania našich miest protivníkovej pustošivosti.\"" # todo: NEW TRANSLATION
 hint_battle_military: "\"Dobrý generál môže rozhodnúť výsledok bitky.\"" # todo: NEW TRANSLATION
 hint_siege_and_occupation: "Okupácia a obliehania" # todo: NEW TRANSLATION
 hint_siege_and_occupation_hint_text: "$hint_siege_and_occupation_hint_text_1$\n\n$hint_siege_and_occupation_hint_text_2$\n\n$hint_siege_and_occupation_hint_text_3$" # todo: NEW TRANSLATION
 hint_siege_and_occupation_hint_text_1: "Keď [army_with_icon|e] vstúpi do nepriateľskej [location_with_icon|e], pokúsi sa ju [occupy_with_icon|e]. Ak lokalita nemá [fort_with_icon|e], bude obsadená za niekoľko dní. Avšak v prítomnosti pevnosti začne [siege_with_icon|e].\n\nObliehania môžu trvať mesiace alebo aj roky, v závislosti od úrovne opevnenia, prítomnosti delostrelectva, [ability_with_icon|e] obliehajúceho [general_with_icon|e] a ďalších faktorov.\n\nKeď sa posádka vzdá, lokalita sa stane [occupied] a [fort] zostane pod kontrolou víťaza.\n\nObsadené lokality sú na mape zobrazené krížiacimi sa pruhmi a nevlastní ich dobyvateľ, kým nie je dobytok potvrdený mierovou zmluvou." # todo: CHANGED
 hint_siege_and_occupation_hint_text_2: "#T Odporúčané kroky:#!\n@arrow_bonus_tier_3! Uistite sa, že [army_with_icon|e] dokáže prežiť obliehanie pred jeho začatím.\n@arrow_bonus_tier_1! Nebojte sa stiahnuť z obliehania, ak sa blíži nebezpečná nepriateľská armáda." # todo: CHANGED
 hint_siege_and_occupation_hint_text_3: "#T Ďalšie tipy:#!\n@hint! Sledujte svoje armády počas obliehania, aj keď sa momentálne v okolí nenachádzajú žiadne nepriateľské sily." # todo: NEW TRANSLATION
 hint_siege_and_occupation_diplomatic: "\"Dlhotrvajúce obliehanie môže byť osudné pre miestne obyvateľstvo a prosperitu.\"" # todo: NEW TRANSLATION
 hint_siege_and_occupation_administrative: "\"Pevnosti by sme mali rozmiestniť tak, aby naše hlavné mestá boli chránené pred votrelcami a v prípade nepriateľského obliehania ich bolo možné rýchlo oslobodiť.\"" # todo: NEW TRANSLATION
 hint_siege_and_occupation_military: "\"Obliehanie a bránenie kľúčových pozícií, ako sú horské priechody, môže byť rozhodujúce pri víťazstve vo vojne.\"" # todo: NEW TRANSLATION
 hint_lacks_of_rivals: "Možní rivali" # todo: NEW TRANSLATION
 hint_lacks_of_rivals_hint_text: "$hint_lacks_of_rivals_hint_text_1$\n\n$hint_lacks_of_rivals_hint_text_2$\n\n$hint_lacks_of_rivals_hint_text_3$" # todo: NEW TRANSLATION
 hint_lacks_of_rivals_hint_text_1: "[rivals_with_icon|e] sú [countries_with_icon|e], ktoré verejne označíme za nepriateľské voči našim záujmom. Účel Rivalov je dvojaký: diplomaticky pomáhajú nadviazať priateľstvá s ich nepriateľmi, a ako útočný nástroj nám umožňujú sfabrikovať [casus_belli_with_icon|e] proti nim a zasahovať do ich vojen." # todo: CHANGED
 hint_lacks_of_rivals_hint_text_2: "#T Odporúčané kroky:#!\n@arrow_bonus_tier_3! Sledujte rivality a [alliances_with_icon|e] susedov a vyberte si tých istých rivalov ako krajina, s ktorou sa chcete spriateliť. Dávajte si pozor, aby ste si nezrobili príliš mocných nepriateľov.\n@arrow_bonus_tier_2! Môžete počkať, kým iné [countries] nevyhlásia rivalov, a potom konať, aby ste sa vyhli rozstreku zlých krajín.\n@arrow_bonus_tier_2! Vytvorte [spy_network_with_icon|e] vo vašich [rivals], aby ste sfabrikovali [casus_belli_with_icon|e] proti nim." # todo: CHANGED
 hint_lacks_of_rivals_hint_text_3: "#T Extra tipy:#!\n@hint! Nemusíte deklarovať všetkých dostupných rivalov. Môžete pravým kliknutím na #W Upozornenie#! ho zahodiť.\n@hint! Mať Rivalov tiež znamená, že budete vyzvaní do ich vojen na opačnej strane. Buďte však opatrní: naši [rival_enemies_with_icon|e] sa môžu vmiešať aj do našich vojen." # todo: CHANGED
 hint_lacks_of_rivals_diplomatic: "\"Robenie zbytočných nepriateľov nie je nikdy múdre, ale vyhlásenie rovnakých Rivalov ako naši susedia nám môže pomôcť získať s nimi spojenectvo.\"" # todo: NEW TRANSLATION
 hint_lacks_of_rivals_administrative: "\"Nepriatelia našich rivalov by mali byť našimi priateľmi.\"" # todo: NEW TRANSLATION
 hint_lacks_of_rivals_military: "\"Mať správnych Rivalov ponúka bohaté príležitosti tým, ktorí sú dostatočne odvážni ich využiť.\"" # todo: NEW TRANSLATION
 hint_control: "Blízkosť a kontrola" # todo: NEW TRANSLATION
 hint_control_hint_text: "$hint_control_hint_text_1$\n\n$hint_control_hint_text_2$\n\n$hint_control_hint_text_3$" # todo: NEW TRANSLATION
 hint_control_hint_text_1: "[control_with_icon|e] je jedným z najdôležitejších atribútov našich [locations_with_icon|e]. Reprezentuje dosah centrálnej vlády a určuje podiel [wealth_with_icon|e] v lokalite, ktorý je možné zdanariť [taxes_with_icon|e]. Akékoľvek bohatstvo mimo dosahu vášho [control] ide priamo do vreciek vašich [estates_with_icon|e] bez daní. [control] tiež určuje, koľko [levies_with_icon|e] môžete z lokality povolať.\n\nControl lokality sa mesačne mení smerom k [max_control_with_icon|e]. [siege_with_icon|e] alebo iné udalosti ho môžu dočasne znížiť, ale lokalita sa nakoniec vráti na svoju max hodnotu.\n\nHlavným zdrojom [max_control] je [proximity_icon] [proximity|e]. Naša [capital_icon] [capital|e] bude mať vždy #W 100%#! Proximity a všetky ostatné lokality vypočítavajú svoju proximitu podľa vzdialenosti od hlavného mesta. Proximita sa šíri cez súš a more, efektívnejšie pozdĺž [road_icon] [roads_with_icon|e], otvoreného terénu a [seazones_icon] [seazones|e] s vysokou [maritime_presence_icon] [maritime_presence|e]; menej efektívne cez hory, lesy a [seazones] infikované [pirates_with_icon|e]. Ďalšie faktory ovplyvňujú Max Control, ako [pop_satisfaction_with_icon|e], [integration_status_with_icon|e] alebo špeciálne [buildings].\n\nOkrem hlavného mesta môžete šíriť [proximity] z [ShowBuildingTypeName('local_governor')] [building|e]." # todo: CHANGED
 hint_control_hint_text_2: "#T Odporúčané kroky:#!\n@arrow_bonus_tier_3! Koncentrujte stavebné úsilie v našom [capital] a okolí, pretože od začiatku budú mať najvyšší [control].\n@arrow_bonus_tier_2! Postavte [road_icon] [roads|e] z #W Location Panel#!, aby ste spojili hlavné mesto s najbohatšími mestami.\n@arrow_bonus_tier_2! Zvážte výstavbu [ShowBuildingTypeName('local_governor')] v oblastiach s vysokým [wealth] a nízkym [control]. Musia byť postavené v [ShowLocationRankName('city')] pripojenej cestou k vášmu [capital] a budú fungovať ako sekundárne [capital]. Sú drahé na udržanie, takže sa uistite, že prínosy ospravedlňujú investíciu!\n@arrow_bonus_tier_2! Lokality s [port_icon] [port|e] môžu mať ľahší prístup k hlavnému mestu po mori, obzvlášť ak majú vysokú [harbor_capacity_with_icon|e]. Môžete ju zvýšiť v kľúčových pobrežných lokalitách pomocou [buildings] ako [ShowBuildingTypeName('wharf')] alebo [ShowBuildingTypeName('dock')].\n@arrow_bonus_tier_1! Nové [conquered_with_icon|e] [locations_with_icon|e] začínajú na #W 0%#! [control] a môže im dlho trvať dosiahnutie maxima. Môžete urýchliť proces umiestnením [army_with_icon|e] v lokalite alebo použitím [ShowCabinetActionName('increase_control_province')] [cabinet_action_icon] [cabinet_action|e]." # todo: CHANGED
 hint_control_hint_text_3: "#T Extra tipy:#!\n@hint! Priemerné [control] vašej [country] má veľký vplyv na váš [crown_power_with_icon|e]. Veľká krajina s nízkym [control] bude mať problémy efektívne spravovať svoje [estates] a zdroje, zatiaľ čo malý centralizovaný štát môže mať väčší vplyv, než by jeho veľkosť naznačovala. Pamätajte, že bezhlavá expanzia môže krajinu zničiť! Viac o [crown_power] nájdete v [Link('hints', 'selected_hint = hint_crown_power', 'Crown Power Hint')].\n@hint! Lokalita s #W 0%#! [control] nebude generovať žiadne [taxes], ale [estates] si aj tak prichystajú svoje príjmy. Bohaté a šťastné [estates] môžu pomôcť vybudovať ekonomiku aj samy.\n@hint! Plánujte sieť [road] starostlivo: jedna dobre umiestnená cesta cez horské pásmo môže zlepšiť [proximity] mnohých lokalít na druhej strane.\n@hint! Niektoré [government_reforms_with_icon|e], ako [ShowGovernmentReformName('harbor_administration')], umožňujú postaviť [ShowBuildingTypeName('naval_governor')] v zámorí. Guvernéri fungujú ako sekundárne [capitals] a pomáhajú šíriť [proximity] do vzdialených krajín. Námořní guvernéri sa dajú postaviť len v pobrežnom [ShowLocationRankName('city')], ktorý nie je spojený pozemnou cestou s vaším [capital].\n@hint! Ak sa chcete dozvedieť viac o [proximity] z [maritime_presence_with_icon|e], skontrolujte [Link('hints', 'selected_hint = hint_maritime', 'Maritime Presence')] Hint#!" # todo: CHANGED
 hint_control_diplomatic: "\"Vysoká kontrola pomáha konvertovať a asimilovať naj... #italic neporiadnych#! členov našej spoločnosti.\"" # todo: NEW TRANSLATION
 hint_control_administrative: "\"Lokalita mimo našej kontroly sotva prinesie nejaké dane.\"" # todo: NEW TRANSLATION
 hint_control_military: "\"Musíme ovládať naše územie, ak chceme naverbovať našu populáciu.\"" # todo: NEW TRANSLATION
 hint_crown_power: "Korunná moc" # todo: NEW TRANSLATION
 hint_crown_power_hint_text: "$hint_crown_power_hint_text_1$\n\n$hint_crown_power_hint_text_2$\n\n$hint_crown_power_hint_text_3$" # todo: NEW TRANSLATION
 hint_crown_power_hint_text_1: "Naša [crown_power_with_icon|e] predstavuje vplyv vlády v našich vlastných hraniciach. Ako [ShowEstateTypeName('crown_estate')] zdieľame zdroje krajiny s našimi [estates_with_icon|e], ktorých záujmy nemusia byť vždy v súlade s našimi.\n\nVyššia Korunná moc uľahčí prijímanie nových [laws_with_icon|e], zlepší efektivitu nášho [cabinet_with_icon|e] a zvýši našu základnú podporu v [parliament_with_icon|e]. Možno ešte dôležitejšie je, že Korunná moc určuje, do akej miery štát zdieľa zisky a náklady z [trade_with_icon|e] a [food_with_icon|e] s [estates].\n\nNaša Korunná moc bude primárne závisieť od množstva udelených [privileges_with_icon|e] [estates] a od [control_with_icon|e] našich najhustejšie osídlených [locations_with_icon|e]." # todo: NEW TRANSLATION
 hint_crown_power_hint_text_2: "#T Odporúčané kroky:#!\n@arrow_bonus_tier_3! Zvýšte kontrolu v našich [locations] budovaním [roads_with_icon|e] z [capital_with_icon|e]. \n@arrow_bonus_tier_2! Odoberajte [privileges] od našich najsilnejších [estates] keď máme vysokú [stability_with_icon|e], ale sledujte ich [estate_satisfaction|e]. Nahnevané [estate] môže znamenať problémy v dohľadne.\n@arrow_bonus_tier_1! Zvýšte [Localize(Player.GetGovernment.GetGovernmentType.GetPowerConcept)] pomocou [ShowCabinetActionName('strengthen_government')] [cabinet_action_with_icon|e].\n@arrow_bonus_tier_1! Postavte [ShowBuildingTypeName('royal_court')] alebo [ShowBuildingTypeName('sergeantry')] v [capital]." # todo: NEW TRANSLATION
 hint_crown_power_hint_text_3: "#T Ďalšie tipy:#!\n@hint! Pri 50% Korunnej moci pôjde polovica výdavkov a ziskov z [trade] a [food] priamo do [treasury_with_icon|e], zatiaľ čo druhá polovica bude rozdelená medzi [estates] podľa ich príslušnej [estate_power_with_icon|e].\n@hint! Korunná moc je zvyčajne veľmi nízka na začiatku hry, obzvlášť u väčších [countries].\n@hint! Budúce [advances_with_icon|e] odomknú ďalšie [buildings] a bonusy k vašej [crown_power]." # todo: NEW TRANSLATION
 hint_crown_power_diplomatic: "\"Kým je naša Korunná moc nízka, zostávame na milosti našich Estátov.\"" # todo: NEW TRANSLATION
 hint_crown_power_administrative: "\"Zvýšenie Korunnej moci by nám pomohlo zbierať výhody z Obchodu.\"" # todo: NEW TRANSLATION
 hint_crown_power_military: "\"Centralizovaný štát môže udierať silnejšie, než by jeho veľkosť naznačovala.\"" # todo: NEW TRANSLATION
 hint_estates: "Estáty" # todo: NEW TRANSLATION
 hint_estates_hint_text: "$hint_estates_hint_text_1$\n\n$hint_estates_hint_text_2$\n\n$hint_estates_hint_text_3$" # todo: NEW TRANSLATION
 hint_estates_hint_text_1: "Estates predstavujú špecifické záujmy v našich hraniciach. Každý Estate má percento [estate_power_with_icon|e], ktoré meria ich moc oproti ostatným Estates a [ShowEstateTypeName('crown_estate')] v distribúcii s nulovým súčtom.\n\nMoc stavov vychádza primárne z [population_with_icon|e], pričom každý [pop_type_with_icon|e] podporuje konkrétny [estate]. Moc Estate ďalej modifikujú existujúce [laws_with_icon|e] a [privileges_with_icon|e].\n\nEstate Power určuje ich vplyv v [parliament_with_icon|e], ovplyvňuje, koľko im môžete [tax_with_icon|e] a určuje, ako sa rozdeľujú zisky a náklady z [trade_with_icon|e] a [food_with_icon|e].\n\nEstates tiež majú úroveň [estate_satisfaction_with_icon|e], ktorá meria ich súlad s vládou. Každý Estate poskytuje rozdielny pozitívny modifikátor pri vysokej spokojnosti a penalizáciu, ak klesne pod #W 50%#!. Keď je spokojnosť Estate príliš nízka, ich [pops_with_icon|e] môžu začať podporovať [rebellions_with_icon|e]. Najkritickejšie, Estate pod #W 25%#! už neposkytuje [levies_with_icon|e]." # todo: CHANGED
 hint_estates_hint_text_2: "#T Odporúčané kroky:#!\n@arrow_bonus_tier_3! [taxes_with_icon|e] vybrané od [estates] sú hlavným zdrojom [income_with_icon|e] pre väčšinu [countries]. Môžete nastaviť alebo automatizovať dane v @economy_panel! #W Budget panel#!.\n@arrow_bonus_tier_2! Akákoľvek moc, ktorú majú stavy, prichádza na úkor nášho [crown_power_with_icon|e]. Môžete oslabovať ich moc odoberaním [privileges_with_icon|e] v @government_panel! #W Estates Tab#!.\n@arrow_bonus_tier_1! Upokojenie vzbury Estate dosiahnete znížením [taxes], udelením [privilege] alebo úplatkom v @government_panel! #W Estates Tab#!." # todo: CHANGED
 hint_estates_hint_text_3: "#T Extra tipy:#!\n@hint! Stavy zbierajú celé [tax_base_with_icon|e] z našich [locations_with_icon|e] a my dostávame len toľko, koľko z nich [tax] vyberieme.\n@hint! V skorých fázach hry sú [countries] veľmi závislé na [levies_with_icon|e] od [estates] na vedenie ich [wars_with_icon|e], kým ich nezačnú nahrádzať modernejšie [regular_regiments_with_icon|e]." # todo: CHANGED
 hint_estates_diplomatic: "\"Silné Kňazstvo zvyšuje stabilitu kráľovstva.\"" # todo: NEW TRANSLATION
 hint_estates_administrative: "\"Silný Stav Mešťanov pridáva bohatstvo nášmu národu a objem nášho obchodu.\"" # todo: NEW TRANSLATION
 hint_estates_military: "\"Silná šľachta zvyšuje veľkosť a silu našich armád.\"" # todo: NEW TRANSLATION
 hint_markets: "Trhy" # todo: NEW TRANSLATION
 hint_markets_hint_text: "$hint_markets_hint_text_1$\n\n$hint_markets_hint_text_2$\n\n$hint_markets_hint_text_3$" # todo: NEW TRANSLATION
 hint_markets_hint_text_1: "[markets_with_icon|e] sú srdcom ekonomiky v #italic Europa Universalis V#!. Všetky lokality patria do trhu, kde predávajú a kupujú tovary potrebné pre [pop_needs_with_icon|e], [buildings_with_icon|e] a [constructions_with_icon|e]. Predajom tovaru na svojom trhu lokality generujú [tax_base_with_icon|e] pre [estates_with_icon|e], ktoré vláda potom môže vyberať formou [taxes_with_icon|e]." # todo: CHANGED
 hint_markets_hint_text_2: "#T Odporúčané kroky:#!\n@arrow_bonus_tier_3! Prejdite do @economy_panel! [Link('trade', 'subtab = markets', 'Markets Panel')] a pozrite si relevantné trhy. Trhy so #G zeleným#! nadpisom obsahujú naše [owned_with_icon|e], zatiaľ čo trhy s modrým nadpisom sú trhy, kde máme [merchant_capacity_with_icon|e], ale nevlastníme žiadnu [location].\n@arrow_bonus_tier_3! Odporúča sa automatizovať každý jednotlivý trh kliknutím na @automation! #W Cog Icon#!. To udrží našu [merchant_capacity_with_icon|e] použitú na najzaujímavejšie [merchants_with_icon|e].\n@arrow_bonus_tier_2! Postavte [buildings_with_icon|e] ako [ShowBuildingTypeName('marketplace')] a [ShowBuildingTypeName('trade_office')] na zvýšenie [merchant_capacity_with_icon|e] na trhu." # todo: CHANGED
 hint_markets_hint_text_3: "#T Ďalšie tipy:#!\n@hint! Hranice Trhov sú dynamické: [locations] pripadnú Trhu s najvyšším [market_attraction_with_icon|e] na ich území, aj keď ide o cudzí Trh. [market_attraction] cudzích Trhov môže byť zneplatnená [protectionism_with_icon|e]." # todo: NEW TRANSLATION
 hint_markets_diplomatic: "\"Neviditeľná ruka je múdry pán, ale niekedy potrebuje malé usmernenie.\"" # todo: NEW TRANSLATION
 hint_markets_administrative: "\"To je ekonomika, ty hlupák!\"" # todo: NEW TRANSLATION
 hint_markets_military: "\"Rozširovanie našich Trhov je dobré.\nDobývanie susedných Trhov je ešte lepšie.\"" # todo: NEW TRANSLATION
 hint_food: "Potraviny" # todo: NEW TRANSLATION
 hint_food_hint_text: "$hint_food_hint_text_1$\n\n$hint_food_hint_text_2$\n\n$hint_food_hint_text_3$" # todo: NEW TRANSLATION
 hint_food_hint_text_1: "[pops_with_icon|e] potrebujú [food_with_icon|e] na život a [armies_with_icon|e] potrebujú jedlo na pochod. Obe čerpajú jedlo zo zásob provincie [province_with_icon|e], v ktorej sa nachádzajú (a nie z lokality!). Ak nie je dostatok [food], [pops] budú trpieť [starvation_with_icon|e] a [armies] utrpia [attrition_with_icon|e].\n\nSú tri vrstvy zapojené do produkcie a distribúcie $game_concept_food$:\n\n@location! [local_food_with_icon|e]:\n$game_concept_food$ sa primárne produkuje v lokalitách s [food_raw_materials_with_icon|e] ako ich [rgo_with_icon|e], napr. [ShowGoodsName('livestock')]. Ak má lokalita prebytok alebo deficit, pridá sa to do $game_concept_provincial_food$.\n\n@province! [provincial_food|e]:\n$game_concept_provincial_food$ je najdôležitejšia vrstva. Ak provincia nevyrába dosť $game_concept_food$ na zásobenie všetkých svojich lokalít, provinčné zásoby sa znižujú. Keď sa vyčerpajú, všetky lokality v provincii budú hladovať. Predtým však provincia skúsi [buy_food_with_icon|e] z jej [market].\n\n@market! [market_food|e]:\nVšetky provincie v [market_with_icon|e] sa snažia predávať jedlo, keď majú prebytok, a kupovať jedlo, keď majú deficit. Pokiaľ je v trhu dostatok jedla, nikto nehladovuje." # todo: CHANGED
 hint_food_hint_text_2: "#T Odporúčané kroky:#!\n@arrow_bonus_tier_3! Prejdite do @economy_panel! [Link('trade', 'subtab = markets', 'Markets Panel')] a pozrite si relevantné trhy. Trhy so #G zeleným#! nadpisom obsahujú naše [owned_with_icon|e] [locations], takže musíme zabezpečiť, aby ich bilancia jedla zostala pozitívna. Ak sa jedlo v niektorom trhu rýchlo znižuje, uvidíte žltý banner. Ak lokality hladujú, uvidíte červený banner.\n@arrow_bonus_tier_3! Aby ste zvýšili produkciu jedla v ktoromkoľvek z našich trhov, kliknite na tlačidlo Jedlo a prejdite do @production_panel! [Link('food_production', '', 'lateralview_food_production_entry_name')]. Odtiaľ môžete vidieť, ktoré provincie sú v nebezpečenstve a rozšíriť ich [rgo].\n@arrow_bonus_tier_3! Rozšírte [rgo_with_icon|e] v lokalitách s najlepšími [food_raw_materials], ako [ShowGoodsName('rice')] alebo [ShowGoodsName('wheat')], a vysokou [food_productivity_with_icon|e].\n@arrow_bonus_tier_1! Môžeme tiež použiť [merchant_capacity_with_icon|e] na dovoz [food_raw_materials_with_icon|e] z iných trhov, čo presunie ekvivalentné množstvo [food]. Urobíte to v @economy_panel! [Link('trade', 'subtab = trades', 'lateralview_trade_entry_name')]." # todo: CHANGED
 hint_food_hint_text_3: "#T Extra tipy:#!\n@hint! Produkcia jedla klesá počas [winter_with_icon|e]. Nepanikárte, ak uvidíte, že všetky naše trhy idú niekoľko mesiacov do mínusu.\n@hint! [provinces|U] v deficite si kúpia prebytok vašich najproduktívnejších provincií, ak patria do toho istého trhu, takže je zvyčajne najlepšie rozširovať potravinové tovary v lokalitách s najvyššou [food_productivity].\n@hint! [town_or_city_with_icon|e] sú obvykle menej efektívne pri produkcii [food] než [rural_locations_with_icon|e]." # todo: CHANGED
 hint_food_diplomatic: "\"Dlhodobý hlad môže znamenať zánik obyvateľstva a pád národa.\"" # todo: NEW TRANSLATION
 hint_food_administrative: "\"Hlad je do veľkej miery otázkou perspektívy. Nie je to také zlé, ak ste ten, kto predáva jedlo.\"" # todo: NEW TRANSLATION
 hint_food_military: "\"Armáda pochoduje na žalúdku.\"" # todo: NEW TRANSLATION
 hint_maritime: "Námorná prítomnosť" # todo: NEW TRANSLATION
 hint_maritime_hint_text: "$hint_maritime_hint_text_1$\n\n$hint_maritime_hint_text_2$\n\n$hint_maritime_hint_text_3$" # todo: NEW TRANSLATION
 hint_maritime_hint_text_1: "[maritime_presence_with_icon|e] je veľmi dôležitá metrika pre pobrežné [seazones_with_icon|e]. Pomáha uplatňovať [proximity_with_icon|e] pozdĺž našich brehov alebo na ostrovoch.\n\nOkrem toho poskytuje [merchant_power_with_icon|e] trhu [market_with_icon|e], ku ktorému príslušné [seazones] patria.\n\n[maritime_presence] sa získava pasívne cez budovy a prítomnosť [navy_with_icon|e], má útlm v čase, ale môže byť tiež stratená kvôli [privateers_with_icon|e] alebo [blockade_with_icon|e]." # todo: CHANGED
 hint_maritime_hint_text_2: "#T Odporúčané kroky:#!\n@arrow_bonus_tier_3! Vytvorte špecializované [navies] s lodami, ktoré majú vysoký zisk [maritime_presence]. Potom ich umiestnite do jedného z vašich pobrežných [seazones] a budú šíriť [maritime_presence] rovnomerne do všetkých [seazones] patriacich tej istej provincie.\n@arrow_bonus_tier_3! Alternatívne ich nastavte na [military_objective_with_icon|e] #V $MILITARY_OBJECTIVE_TYPE_NAME_patrol_the_seas$#!, čo urobí to isté a zároveň automaticky opraví lode podľa potreby.\n@arrow_bonus_tier_2! Podporujte [ShowSocietyDirectionName('naval')] [societal_value|e].\n@arrow_bonus_tier_1! [ShowBuildingTypeName('coastal_fort')] je veľmi dobrá budova na použitie!" # todo: CHANGED
 hint_maritime_hint_text_3: "#T Extra tipy:#!\n@hint! [maritime_presence] sa šíri len do provincie, na ktorej sa nachádzajú, aj keď má cieľ nastavený na viac provincií. #V $MILITARY_OBJECTIVE_TYPE_NAME_patrol_the_seas$#! presunie [navy], keď [seazone] dosiahne #W 100%#! [maritime_presence].\n@hint! [privateers] kradnú bohatstvo iným [countries] a zároveň znižujú ich [maritime_presence]. Na rozdiel od [maritime_presence] pôsobia [privateers] na úrovni [area_with_icon|e], čo znamená, že všetky [provinces] v oblasti pociťujú ich účinky.\n@hint! Niektoré [government_reforms_with_icon|e], ako [ShowGovernmentReformName('harbor_administration')], umožňujú postaviť [ShowBuildingTypeName('naval_governor')] v zámorí. Guvernéri fungujú ako sekundárne [capitals] a pomáhajú rozširovať [proximity] do vzdialených krajín. Námořní guvernéri sa dajú postaviť len v pobrežnom [ShowLocationRankName('city')], ktorý nie je spojený pozemnou cestou s vaším [capital]." # todo: CHANGED
 hint_maritime_diplomatic: "\"Musíme využiť naše pobrežie na zlepšenie obchodov.\"" # todo: NEW TRANSLATION
 hint_maritime_administrative: "\"Čím bezpečnejšie morské plavby, tým lepšia komunikácia s naším obyvateľstvom.\"" # todo: NEW TRANSLATION
 hint_maritime_military: "\"So silnou námornou prítomnosťou si piráti nedovolia ohroziť naše obchodné trasy.\"" # todo: NEW TRANSLATION
 hint_slaves: "Otroci" # todo: NEW TRANSLATION
 hint_slaves_hint_text: "$hint_slaves_hint_text_1$\n\n$hint_slaves_hint_text_2$\n\n$hint_slaves_hint_text_3$" # todo: NEW TRANSLATION
 hint_slaves_hint_text_1: "@slaves_goods! [ShowGoodsName('slaves_goods')] sú špeciálny druh [good_with_icon|e]. Ako každý iný [good], kupujú sa a predávajú na [markets_with_icon|e] a ich cena závisí od [supply_with_icon|e] a [demand_with_icon|e]. Na rozdiel od iných [goods] predstavujú skutočných [pops_with_icon|e], ktorí sa pri obchode presúvajú.\n\nAko [pop_type_with_icon|e], @slaves! [ShowPopTypeName('slaves')] môžu byť využití ako pracovná sila v [rgo_with_icon|e] a otrockých [buildings_with_icon|e], ako [ShowBuildingTypeName('sugar_plantation')].\n\nBudovy ako [ShowBuildingTypeName('slave_market')] môžu transformovať existujúcich @slaves! [ShowPopTypeName('slaves')] na @slaves_goods! [ShowGoodsName('slaves_goods')] [goods], ktoré sa následne predávajú na trhu. Potom tieto [goods] možno obchodovať a budovy si ich vyžiadajú ako vstup. Keď sa to stane, @slaves! [ShowPopTypeName('slaves')] budú presunutí do lokality pracovať v danej budove." # todo: CHANGED
 hint_slaves_hint_text_2: "#T Odporúčané kroky:#! \n@arrow_bonus_tier_3! Pri zakladaní [colonies_with_icon|e] v inom [continent_with_icon|e] môžete [trade_with_icon|e] Otroci do koloniálnych trhov, aby pracovali na plantážach.\n@arrow_bonus_tier_2! Môžete stavať [ShowBuildingTypeName('slave_center')] [buildings] v cudzích lokalitách v rámci vášho [trade_range_with_icon|e], aby ste zabezpečili stály prísun otrokov na obchod." # todo: CHANGED
 hint_slaves_hint_text_3: "#T Extra tipy:#!\n@hint! [pops_with_icon|e] sú zvyčajne zotročovaní budovami ako [ShowBuildingTypeName('slave_market')], hoci niektoré [countries] majú špeciálne mechaniky, ktoré umožňujú zotročovanie [pops] počas [war_with_icon|e].\n@hint! [ShowReligionGroupName('christian')] povoľuje Otroky len v Plantážnych [buildings], ktoré sa odomknú v #V Age of Discovery#! a je možné ich stavať len zámorsky." # todo: CHANGED
 hint_slaves_diplomatic: "\"Všetci ľudia sú stvorení rovní, okrem niektorých.\"" # todo: NEW TRANSLATION
 hint_slaves_administrative: "\"Nič pozoruhodné nebolo nikdy dosiahnuté bez obetovania mnohých.\"" # todo: NEW TRANSLATION
 hint_slaves_military: "\"Ak je voľnej pracovnej sily nedostatok, pohania ju môžu poskytnúť.\"" # todo: NEW TRANSLATION
 hint_eco: "Pokročilé ekonomické rady" # todo: NEW TRANSLATION
 hint_eco_hint_text: "$hint_eco_hint_text_1$\n\n$hint_eco_hint_text_2$\n\n$hint_eco_hint_text_3$" # todo: NEW TRANSLATION
 hint_eco_hint_text_1: "Aj keď môžete automatizovať mnoho aspektov svojej ekonomiky, existujú stále kroky, ktoré musíte vykonať priamo, aby ste posunuli svoj [country] vpred." # todo: NEW TRANSLATION
 hint_eco_hint_text_2: "#T Odporúčané kroky:#!\n@arrow_bonus_tier_3! Najlepšia rada je vždy snažiť sa znížiť vaše [expenses_with_icon|e].\n\n@arrow_bonus_tier_3! Ako hráč by ste sa mali sústrediť na plánovanie [towns_and_cities_with_icon|e] a [roads_with_icon|e]\n    Keďže [towns_and_cities_with_icon|e] znižujú počet [rgo_with_icon|e], ktoré môžete postaviť, chcete urbanizovať najmenej hodnotné z vašich [rural_locations]. To sú zvyčajne:\n@sand! [ShowGoodsName('sand')] @clay! [ShowGoodsName('clay')] @horses! [ShowGoodsName('horses')] @medicaments! [ShowGoodsName('medicaments')] @wine! [ShowGoodsName('wine')] @olives! [ShowGoodsName('olives')] @millet! [ShowGoodsName('millet')] @legumes! [ShowGoodsName('legumes')] @fruit! [ShowGoodsName('fruit')] @wild_game! [ShowGoodsName('wild_game')] @beeswax! [ShowGoodsName('beeswax')] \n\n@arrow_bonus_tier_3! Uvoľnite [subjects_with_icon|e] na územiach s nízkym [control_with_icon|e], pretože oni budú šíriť vlastné $game_concept_control$.\n    [annex_with_icon|e] vašich subjectov, keď si vybudujete infraštruktúru v oblasti.\n    [annexation_with_icon|e] rýchlosť sa škáluje podľa relatívnej veľkosti krajiny a [cultural_influence_with_icon|e].\n\n@arrow_bonus_tier_2! Cenné [rgo_with_icon|e] sú veľmi dobrou investíciou, zvlášť ak si vybudujete [merchant_capacity_with_icon|e] na ich [export_with_icon|e].\n@goods_gold! [ShowGoodsName('goods_gold')] @silver! [ShowGoodsName('silver')] @gems! [ShowGoodsName('gems')] @pearls! [ShowGoodsName('pearls')] @amber! [ShowGoodsName('amber')] @ivory! [ShowGoodsName('ivory')] @pepper! [ShowGoodsName('pepper')] @saffron! [ShowGoodsName('saffron')] @chili! [ShowGoodsName('chili')]\n\n@arrow_bonus_tier_2! [trade_income_with_icon|e] škáluje s [Link('hints', 'selected_hint = hint_crown_power', '@hint! Crown Power')] a vždy je dobré ho zvyšovať rozširovaním [Link('hints', 'selected_hint = hint_increasing_trade_capacity', '@hint! Trade Capacity')], ktoré na rozdiel od [tax_base] neskalujú s [control]\n\n@arrow_bonus_tier_1! Udržujte priemyselné $game_concept_goods$ $game_concept_prices$ nízke! Zvýšia ziskovosť $game_concept_towns_or_cities$ a znížia udržiavacie náklady [buildings_with_icon|e].\n@lumber! [ShowGoodsName('lumber')] @masonry! [ShowGoodsName('masonry')] @glass! [ShowGoodsName('glass')] @iron! [ShowGoodsName('iron')] @mercury! [ShowGoodsName('mercury')] @steel! [ShowGoodsName('steel')]\n\n@arrow_bonus_tier_1! $game_concept_buildings$ bez [production_method_with_icon|e] budú mať [maintenance_with_icon|e] náklady. Tie budú kolísať podľa $game_concept_price$ vstupných $game_concept_goods$. Pamätajte, že [demand_with_icon|e] zo strany [buildings] tiež stimuluje rast vašej ekonomiky!" # todo: CHANGED
 hint_eco_hint_text_3: "#T Ďalšie tipy:#!\n[Link('hints', 'selected_hint = hint_inflation', '@hint! Znižovanie inflácie')]\n[Link('hints', 'selected_hint = hint_increasing_trade_capacity', '@hint! Zvýšenie obchodnej kapacity')]\n[Link('hints', 'selected_hint = hint_control', '@hint! Zvýšenie kontroly')]" # todo: NEW TRANSLATION
 hint_eco_diplomatic: "\"Niekedy sú mince tým najlepším nástrojom vplyvu.\""
 hint_eco_administrative: "\"Zlato je krvou národov.\""
 hint_eco_military: "\"Príjem získaný od iných je ten najlepší príjem.\""
 hint_pol: "Pokročilé politické rady" # todo: NEW TRANSLATION
 hint_pol_hint_text: "$hint_pol_hint_text_1$\n\n$hint_pol_hint_text_2$\n\n$hint_pol_hint_text_3$" # todo: NEW TRANSLATION
 hint_pol_hint_text_1: "Všetky [countries_with_icon|e] začínajú s niektorými nevýhodami. Uistite sa, že skontrolujete [Link('government', 'tabcontent = estates', '@government_panel! $lateralview_government_entry_name$')] pre [privileges_with_icon|e] a [laws_with_icon|e]. Tieto makro-zmeny môžu byť dlhodobo mimoriadne nápomocné.\n\nNebojte sa niečo zmeniť!" # todo: NEW TRANSLATION
 hint_pol_hint_text_2: "#T Odporúčané kroky:#!\n@arrow_bonus_tier_3! Uistite sa, že [estate_satisfaction_equilibrium_with_icon|e] je dosť na [tax_with_icon|e] [ShowEstateTypeName('burghers_estate')] a [ShowEstateTypeName('peasants_estate')] na maximálnej úrovni, bez toho aby to kleslo pod #W 50%#!.\n\n@arrow_bonus_tier_3! Skontrolujte [Link('societal_values', '', '@government_panel! Government Panel > Values')] aby ste zistili, ktoré [societal_values_with_icon|e] stojí za to sledovať. Vo všeobecnosti sú najvýhodnejšie:\n$BULLET_WITH_TAB$[ShowSocietyDirectionName('capital_economy')]\n$BULLET_WITH_TAB$[ShowSocietyDirectionName('centralization')]\n\n@arrow_bonus_tier_3! Prejdite [laws_with_icon|e], aby ste zistili, čo je potrebné zmeniť.\n    [parliament_with_icon|e] umožní jednoduché zmeny $game_concept_law$ a malo by byť jednou z priorít v skorom štádiu hry\n    $game_concept_laws$ na ktoré si dať pozor na začiatku hry:\n    $BULLET_WITH_TAB$[ShowLawName('mining_law')]\n    $BULLET_WITH_TAB$[ShowLawName('precious_metal_distribution_law')]\n    $BULLET_WITH_TAB$[ShowLawName('distribution_of_power_law')]\n    $BULLET_WITH_TAB$[ShowLawName('administrative_system')]\n\n@arrow_bonus_tier_3! Prejdite priradené a dostupné [privileges_with_icon|e] pre každé [estate_with_icon|e]. Sú nástrojom na úpravu $game_concept_estate_satisfaction_equilibrium$ a driftu $game_concept_societal_values$.\n   [ShowEstateTypeName('nobles_estate')] by mali dostať len toľko, aby boli lojálni. Odňatie $game_concept_estate_power$ od nich je dlhodobo prospešné.\n    $BULLET_WITH_TAB$[ShowEstatePrivilegeName('nobles_land_rights')]\n    $BULLET_WITH_TAB$[ShowEstatePrivilegeName('nobility_council')]\n    $BULLET_WITH_TAB$[ShowEstatePrivilegeName('noble_serfdom_rights')]\n    $BULLET_WITH_TAB$[ShowEstatePrivilegeName('noble_sponsored_navy')]\n\n   [ShowEstateTypeName('clergy_estate')] by mali dostať všetky pozitívne $game_concept_privilege$, aj keď ich nemožno zdaňovať - každý bod ich $game_concept_estate_satisfaction$ nad #W 50%#! poskytuje bonus k [research_progress_with_icon|e]\n    $BULLET_WITH_TAB$[ShowEstatePrivilegeName('embellish_great_works_of_faith')]\n    $BULLET_WITH_TAB$[ShowEstatePrivilegeName('clergy_in_administration')]\n    $BULLET_WITH_TAB$[ShowEstatePrivilegeName('clergy_religious_state')]\n    $BULLET_WITH_TAB$[ShowEstatePrivilegeName('clerical_advisory_council')]\n\n   [ShowEstateTypeName('burghers_estate')] by mali byť aktívne obdarovaní čo najväčším počtom pozitívnych $game_concept_privileges$. Sú prevažne prínosné, avšak zvýšenie [estate_power_with_icon|e] burghers zníži moc ostatných $game_concept_estates$. Navyše každý bod $game_concept_estate_satisfaction$ zvýši [production_efficiency_with_icon|e]\n    $BULLET_WITH_TAB$[ShowEstatePrivilegeName('building_roads_rights')]\n    $BULLET_WITH_TAB$[ShowEstatePrivilegeName('market_fairs')]\n    $BULLET_WITH_TAB$[ShowEstatePrivilegeName('building_rights')]\n    $BULLET_WITH_TAB$[ShowEstatePrivilegeName('allow_trade_center_sponsorship')]\n    $BULLET_WITH_TAB$[ShowEstatePrivilegeName('commercial_advisory_council')]\n    $BULLET_WITH_TAB$[ShowEstatePrivilegeName('control_over_the_coinage')]\n    $BULLET_WITH_TAB$[ShowEstatePrivilegeName('guild_investments')]\n    $BULLET_WITH_TAB$[ShowEstatePrivilegeName('land_of_commerce')]\n    $BULLET_WITH_TAB$[ShowEstatePrivilegeName('urban_development_grants')]\n\n   [ShowEstateTypeName('peasants_estate')] $game_concept_privileges$ by mali zabezpečiť dostatočné $game_concept_estate_satisfaction_equilibrium$, aby umožnili maximálny $game_concept_tax$. Je dôležité mať na pamäti ich sklony k [ShowSocietyDirectionName('decentralization')], čo nie je ideálne. Napriek tomu budú roľníci mať počas hry nízke $game_concept_estate_power$, takže náklady na odobratie práv budú v porovnaní s inými $game_concept_estates$ nízke\n    $BULLET_WITH_TAB$[ShowEstatePrivilegeName('peasants_allowed_weapons_privilege')]\n    $BULLET_WITH_TAB$[ShowEstatePrivilegeName('allow_hunting')]\n    $BULLET_WITH_TAB$[ShowEstatePrivilegeName('no_labor_sunday')]\n    $BULLET_WITH_TAB$[ShowEstatePrivilegeName('peasants_represented_in_parliament')]\n    $BULLET_WITH_TAB$[ShowEstatePrivilegeName('peasants_fewer_levies')]\n\n@arrow_bonus_tier_2! Hľadajte [government_reforms_with_icon|e], ktoré by vyhovovali $game_concept_societal_values$, ktoré hľadáte. Majte na pamäti, že niektoré bonusy, ako [diplomatic_capacity_with_icon|e], môžu umožniť znížiť [diplomatic_maintenance_with_icon|e].\n\n@arrow_bonus_tier_2! Niektoré [cabinet_actions_with_icon|e], ako [ShowCabinetActionName('stabilize_country')] alebo [ShowCabinetActionName('strengthen_government')], môžu znížiť výdavky, takže vám zostane viac $game_concept_income$ na míňanie!" # todo: CHANGED
 hint_pol_hint_text_3: "#T Ďalšie tipy:#!\n[Link('hints', 'selected_hint = hint_crown_power', '@hint! Moc koruny')]\n[Link('hints', 'selected_hint = hint_estates', '@hint! Stavy')]" # todo: NEW TRANSLATION
 hint_pol_diplomatic: "\"Prefíkaný vládca dokáže vyťažiť maximum z každej udalosti\"" # todo: NEW TRANSLATION
 hint_pol_administrative: "\"Prosperujúca politika znamená prosperujúce podniky\"" # todo: NEW TRANSLATION
 hint_pol_military: "\"Naše stavy sú často horšie než naši nepriatelia.\"" # todo: NEW TRANSLATION
 hint_mil: "Pokročilé rady pre expanziu" # todo: NEW TRANSLATION
 hint_mil_hint_text: "$hint_mil_hint_text_1$\n\n$hint_mil_hint_text_2$\n\n$hint_mil_hint_text_3$" # todo: NEW TRANSLATION
 hint_mil_hint_text_1: "Dve všeobecné rady: profesionálne [armies_with_icon|e] (vrátane [mercenaries_with_icon|e]) vždy porazia rovnako veľké [levies_with_icon|e], a najlepší spôsob, ako zväčšiť svoj $game_concept_army$, je rozvíjať ekonomiku." # todo: CHANGED
 hint_mil_hint_text_2: "#T Odporúčané kroky:#!\n@arrow_bonus_tier_3! Získajte [ShowInstitutionName('professional_armies')] [institution|e] čo najskôr: rýchle získanie [ShowAdvanceName('armory_advance')] vám umožní vyhrať [wars_with_icon|e], ktoré boli predtým nemožné.\n\n@arrow_bonus_tier_3! [war_score_with_icon|e] z [battles_with_icon|e] sa s [ages_with_icon|e] zmenšuje. Na začiatku to je až #W 50%#!, takže je jednoduché vyhrať [wars_with_icon|e] len s $game_concept_battles$!\n\n@arrow_bonus_tier_3! Uistite sa, že máte prístup k strategickým [goods_with_icon|e]. Nemusia byť v veľkom množstve, ale sú nevyhnutné na vybudovanie vášho [army_with_icon|e] a [navy_with_icon|e]: @tin! [ShowGoodsName('tin')] @lead! [ShowGoodsName('lead')] @copper! [ShowGoodsName('copper')]\n\n@arrow_bonus_tier_3! $game_concept_armies$ sa môžu [reinforce_with_icon|e] len na území spojenca.\n\n@arrow_bonus_tier_3! [ShowUnitCategoryName('army_heavy_infantry')] je hlavná línia [battle_with_icon|e]. Je lacná a účinná pri absorbovaní [damage_taken|e], zatiaľ čo [ShowUnitCategoryName('army_artillery')] spôsobuje veľké škody prednej línii - je dôležité, aby predná línia prežila [bombard_phase_with_icon|e]\n\n@arrow_bonus_tier_2! Vytvorenie jasnej logistickej linky pre vaše $game_concept_armies$ na území [enemy_with_icon|e] je kľúčové. Ak sa váš zásobovací líniu preruší, celý $game_concept_army$ môže zmiznúť kvôli [attrition|e]. Môžete použiť jednotky [ShowUnitCategoryName('army_auxiliary')] na prepravu [food_with_icon|e] na front, alebo umiestniť [supply_depots_with_icon|e] na pomoc s logistikou.\n\n@arrow_bonus_tier_1! [manpower_with_icon|e] [buildings|e] majú v hre najvyššie [maintenance_with_icon|e] náklady, preto je najlepšie stavať ich v [locations_with_icon|e] s vysokým [control_with_icon|e].\n\n@arrow_bonus_tier_1! $game_concept_battles$ typicky trvajú len niekoľko dní, takže pred ďalším postupom sa uistite, že sa vždy môžete včas $game_concept_reinforce$." # todo: CHANGED
 hint_mil_hint_text_3: "#T Ďalšie tipy:#!\n[Link('hints', 'selected_hint = hint_manpower', '@hint! Ľudská sila')]\n[Link('hints', 'selected_hint = hint_sailors', '@hint! Námorníci')]\n[Link('hints', 'selected_hint = hint_war', '@hint! Vojna')]\n[Link('hints', 'selected_hint = hint_battle', '@hint! Bitky')]\n[Link('hints', 'selected_hint = hint_siege_and_occupation', '@hint! Obliehania a okupácia')]" # todo: NEW TRANSLATION

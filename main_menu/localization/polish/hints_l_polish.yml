 hint_town_rights_hint_text_1: "$game_concept_town_rights_desc$" # todo: NEW TRANSLATION
 hint_town_rights_hint_text_3: "#T Extra Hints:#!\n@hint! Some historical Rights might be positive, some may be negative. Rights can be revoked, but keep in mind that doing so costs [Concept('stability_with_icon','stabilita')|e], and greatly angers the local [Concept('pops_with_icon','populácie')|e].\n@hint! The specialization Rights that come with [advance_icon][ShowAdvanceName('town_rights_enable')] can become a powerful boost to the efficiency of your urban centers, and can be used to shape the economic fabric of our [country] in the long run.\n@hint! Productivity Rights are best employed in places that naturally enjoy a high [Concept('production_efficiency_with_icon','efektivita produkcie')|e] in a given industry. For instance, a [ShowBuildingTypeName('cloth_guild')] is more efficient at turning [ShowGoodsName('wool')] into [ShowGoodsName('cloth')] if Wool is produced in one of the [Concept('rgo_with_icon','R.G.O.')|e] of its [Concept('province_with_icon','provincia')|e]. That might be a perfect candidate for granting [ShowTownRightsName('royal_textile_rights')]." # todo: NEW TRANSLATION # todo: CONCEPT CASE

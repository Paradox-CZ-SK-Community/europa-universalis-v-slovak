 hint_mil_military: "\"Nechoďte do boja s nožom proti strelným zbraniam\"" # todo: NEW TRANSLATION
 hint_holland: "Začiatočné rady pre Holandsko" # todo: NEW TRANSLATION
 hint_holland_hint_text: "Vysoko urbanizované [locations] v Nízkych krajinách robia z [Player.GetLongName] ideálneho kandidáta stať sa obchodnou mocnosťou v severnej Európe.\n\n@hint! #T Stavajte [ShowBuildingTypeName('marketplace')] budovy v každom [ShowLocationRankName('town')]#!\nAutomatický obchod použije ich [merchant_capacity_with_icon|e] na [import_with_icon|e] [raw_materials_with_icon|e], ktoré [market_icon][Player.GetCapital.GetMarket.GetName] postráda, ako aj na [export_with_icon|e] prebytok [produced_goods_with_icon|e] z našich miest.\n\n@hint! #T Rozšírte textilný priemysel#!\nZ exportu [ShowGoodsName('fine_cloth')] je veľký zisk. Postavte [ShowBuildingTypeName('cloth_guild')] a [ShowBuildingTypeName('fine_cloth_guild')] budovy a zvážte dovoz [ShowGoodsName('wool')] z [ShowLocationName('london')] Market, ak bude treba.\n\n@hint! #T Zvýšte našu [crown_power]#!\n[trade_income_with_icon|e] sa rozdeľuje medzi [ShowEstateTypeName('crown_estate')] a [estates_with_icon|e] podľa ich relatívnej moci. Udržiavanie našej [crown_power_with_icon|e] vysokej zabezpečí stálu prítok [trade_income] do [treasury_with_icon|e]. Viac o [crown_power] sa dozviete v [Link('hints', 'selected_hint = hint_crown_power', 'Crown Power Hint')].\n\n@hint! #T Dávajte pozor na zásoby [food]#!\n[urban_locations_with_icon|e] produkujú menej [food_with_icon|e] než [rural_locations_with_icon|e]. Sledujte [food_stockpile_with_icon|e] [Player.GetCapital.GetMarket.GetName] a v prípade potreby rozšírte naše [ShowGoodsName('fish')] a [ShowGoodsName('livestock')] [rgo_with_icon|e]. Náš [budget] utrpí, ak sa [food] stane príliš drahým.\n\n@hint! #T Uspokojte našich susedov#!\nMôžeme byť bohatí, ale náš skromný rozmer nás robí zraniteľnými voči cudzej agresii. Použite $IMPROVE_RELATIONTITLE$ [diplomatic_action_with_icon|e] s našimi najnebezpečnejšími susedmi, obzvlášť s [GetCountry('FRA').GetName] a [GetCountry('ENG').GetName]." # todo: CHANGED
 hint_holland_diplomatic: "$hint_advisor_salute_diplomatic$" # todo: NEW TRANSLATION
 hint_holland_administrative: "$hint_advisor_salute_administrative$" # todo: NEW TRANSLATION
 hint_holland_military: "$hint_advisor_salute_military$" # todo: NEW TRANSLATION
 hint_hungary: "Začiatočné rady pre Uhorsko" # todo: NEW TRANSLATION
 hint_hungary_hint_text: " [Player.GetLongName] začína v privilégovanej pozícii ako jedna z hlavných mocností v [region|e]. Máme [alliance_with_icon|e] s #W Poland#!, #W Bosnia#! je naším [subject_with_icon|e] a #W Croatia#! je v [personal_union_with_icon|e] pod naším [ruler_with_icon|e] [Player.GetGovernment.GetRuler.GetName]. To znamená, že sa môžeme sústrediť na rozvoj nášho [country_with_icon|e] bez obáv o vonkajšie hrozby... aspoň zatiaľ.\n\n@hint! #T Stavajte [roads] smerom k svojim baníam#!\nNa sever od [capital_icon] [Player.GetCapital.GetName] sa nachádzajú bohaté ložiská [ShowGoodsName('goods_gold')] a [ShowGoodsName('silver')]. Sú však málo rozvinuté a v [locations] s nízkym [control_with_icon|e]. Mali by sme vybudovať [roads_with_icon|e] z [Player.GetCapital.GetNameWithNoTooltip] k týmto cenným baníam, aby sme zvýšili našu [proximity_with_icon|e], a tým aj náš [control].\n\n@hint!  #T Stavajte [ShowBuildingTypeName('jewelry_guild')] okolo nášho [capital]#!\nVďaka veľkej ponuke je cena [ShowGoodsNameWithNoTooltip('goods_gold')] a [ShowGoodsNameWithNoTooltip('silver')] v [market_icon] [Player.GetCapital.GetMarket.GetName] mimoriadne nízka. [ShowBuildingTypeName('jewelry_guild')] použije [ShowGoodsNameWithNoTooltip('goods_gold')] a [ShowGoodsNameWithNoTooltip('silver')] na výrobu [ShowGoodsName('jewelry')], veľmi ziskového spracovaného tovaru, čím zvýši hodnotu našich baní.\n\n@hint! #T Postavte [ShowBuildingTypeName('marketplace')] aby ste exportovali prebytok#!\nAutomatický [trade_with_icon|e] bude [export_with_icon|e] akýkoľvek prebytok [goods_with_icon|e], ako napríklad [ShowGoodsNameWithNoTooltip('jewelry')], do iných [markets_with_icon|e], čo vytvorí [trade_income_with_icon|e] a udrží celú výrobnú reťaz ziskovú.\n\n@hint! #T Zrušte [ShowPolicyName('gold_export_ban')]#!\nEurópa túži po našom [ShowGoodsNameWithNoTooltip('goods_gold')], a priame exportovanie by bolo veľmi ziskové, ale náš súčasný [ShowLawName('precious_metal_distribution_law')] [law_with_icon|e] to zakazuje. Zvážte zmenu tejto [policy] počas nasledujúceho [parliament_with_icon|e].\n\n@hint! #T Inštalujte [ShowBuildingTypeName('local_governor')]#!\nVýchod našej [country] je bohatý, no máme malý [control] nad jeho zdrojmi. V dlhodobom horizonte by sme mali postaviť tam [ShowLocationRankName('city')] a umiestniť [ShowBuildingTypeName('local_governor')]. Bude fungovať ako sekundárny [capital], vyžarujúci [proximity] do blízkych [locations]. Majte na pamäti, že miestni guvernéri sa dajú stavať len v [ShowLocationRankName('city')], sú drahí na udržiavanie a vyžadujú priamu [road] spojenie s naším [capital]." # todo: CHANGED
 hint_hungary_diplomatic: "$hint_advisor_salute_diplomatic$" # todo: NEW TRANSLATION
 hint_hungary_administrative: "$hint_advisor_salute_administrative$" # todo: NEW TRANSLATION
 hint_hungary_military: "$hint_advisor_salute_military$" # todo: NEW TRANSLATION
 hint_norway: "Začiatočné rady pre Nórsko" # todo: NEW TRANSLATION
 hint_norway_hint_text: " [Player.GetLongName] je rozľahlá [country_with_icon|e], ale náš [control_with_icon|e] mimo nášho [capital_with_icon|e] je iba formálny. Mali by sme rozšíriť infraštruktúru, morské aj pozemné, aby sme zvýšili naše [proximity_with_icon|e] a využili zdroje severu.\n\n@hint! #T Stavajte [roads] z nášho [capital] #!\nMali by sme sa snažiť položiť [roads_with_icon|e] z [capital_icon] [Player.GetCapital.GetName] do každej blízkej [ShowLocationRankName('town')] a cenného [rgo_with_icon|e], aby sme zvýšili našu [proximity_with_icon|e] a [control_with_icon|e]. Baníky s [ShowGoodsName('silver')] západne od [Player.GetCapital.GetNameWithNoTooltip] by mali byť obzvlášť ziskové pri primeranej investícii. Často kontrolujte [proximity] Map Mode!\n\n@hint! #T Zvýšte [maritime_presence] #!\nVysekanie [roads] cez naše horské vnútro môže byť márne a drahé. S dobrou [maritime_presence_with_icon|e] pozdĺž pobrežia sa môže [proximity] šíriť oveľa efektívnejšie po mori. Stavte [ShowBuildingTypeName('wharf')] a [ShowBuildingTypeName('dock')] v našich mestách a mať flotily [ShowUnitCategoryName('navy_light_ship')] strážiace naše pobrežie, keď budeme mať potrebný [advance_with_icon|e].\n\n@hint! #T Zakladajte mestá v dobrých prístavoch blízko nášho [capital]#!\n[Proximity] pobrežných [locations] je výrazne zlepšená [natural_harbor_suitability_with_icon|e]. Skontrolujte $mapmode_natural_harbor_suitability_name$ Mapmode, aby ste našli naše najlepšie prírodné prístavy.\n\n@hint! #T Rozšírte naše priemysly#!\nPostavte [ShowBuildingTypeName('fine_cloth_guild')], [ShowBuildingTypeName('furniture_guild')] a [ShowBuildingTypeName('scriptorium')] v našich mestách na spracovanie našich surovín a postavte [ShowBuildingTypeName('marketplace')] na [export_with_icon|e] do iných [markets_with_icon|e].\n\n@hint! #T Posilnite úniu so Švédskom #!\nNáš [personal_union_with_icon|e] so [GetCountry('SWE').GetName] zaručuje pokoj na našich hraniciach. Môžeme sa usilovať o hlbšiu integráciu s ich krajinou prijatím spoločných [laws] v paneli [international_organization|e]." # todo: CHANGED
 hint_norway_diplomatic: "$hint_advisor_salute_diplomatic$" # todo: NEW TRANSLATION
 hint_norway_administrative: "$hint_advisor_salute_administrative$" # todo: NEW TRANSLATION
 hint_norway_military: "$hint_advisor_salute_military$" # todo: NEW TRANSLATION
 hint_naples: "Začiatočné rady pre Neapol" # todo: NEW TRANSLATION
 hint_naples_hint_text: "Ako najväčšia mocnosť v [region_with_icon|e] je [Player.GetLongName] pripravená dominovať talianskému obchodu a politike, zatiaľ čo naši [subjects_with_icon|e] v Grécku predstavujú pohodlný východiskový bod pre vonkajšiu expanziu.\n\n@hint! #T Stavajte [roads] z nášho [capital] #!\nMali by sme sa snažiť položiť [roads_with_icon|e] z [capital_icon] [Player.GetCapital.GetName] ku každému blízkemu [ShowLocationRankName('town')] a cennému [rgo_with_icon|e], aby sme zvýšili našu [proximity_with_icon|e], a tým aj náš [control_with_icon|e].\n\n@hint! #T Rozšírte ťažbu [raw_materials]#!\nNaša [country] obsahuje veľké množstvo cenných [raw_materials_with_icon|e]. [ShowGoodsName('wool')], [ShowGoodsName('fiber_crops')] a [ShowGoodsName('silk')] nie sú len hodnotné samy o sebe, ale môžu byť použité v našich textilných odvetviach v [urban_locations_with_icon|e]. Rozšírte tieto [rgo_with_icon|e] čo najskôr a uprednostnite zvýšenie [control] tam.\n\n@hint! #T Rozvíjajte textilný priemysel #!\nPostavte [ShowBuildingTypeName('cloth_guild')] a [ShowBuildingTypeName('fine_cloth_guild')] [buildings] v našich [urban_locations]. Použijú naše [raw_materials] na výrobu drahých [produced_goods_with_icon|e], zatiaľ čo zvýšený dopyt spraví naše [rgo] ešte ziskovejšie.\n\n@hint! #T Postavte [ShowBuildingTypeName('marketplace')] aby ste exportovali prebytok#!\nAutomatický [trade_with_icon|e] bude [export_with_icon|e] akýkoľvek prebytok [goods_with_icon|e], ako napríklad [ShowGoodsNameWithNoTooltip('fine_cloth')], do iných [markets_with_icon|e], čo vytvorí [trade_income_with_icon|e] a udrží celú výrobnú reťaz ziskovú." # todo: CHANGED
 hint_naples_diplomatic: "$hint_advisor_salute_diplomatic$" # todo: NEW TRANSLATION
 hint_naples_administrative: "$hint_advisor_salute_administrative$" # todo: NEW TRANSLATION
 hint_naples_military: "$hint_advisor_salute_military$" # todo: NEW TRANSLATION
 hint_castile: "Začiatočné rady pre Kastíliu" # todo: NEW TRANSLATION
 hint_castile_hint_text: "Ako dominantná mocnosť v [region_with_icon|e] stojí [Player.GetLongName] v priaznivej pozícii na zjednotenie Pyrenejského polostrova pod jednou korunou. Naša administratíva je však už teraz preťažená a náš [control] na juhu je taký nízky, že takmer neprispieva do nášho [budget_with_icon|e]. Bolo by rozumné konsolidovať náš [control] nad súčasným územím pred ďalšími dobytím.\n\n@hint! #T Stavajte [roads] z nášho [capital] #!\n[Locations] bez [control_with_icon|e] sú prakticky nepoužiteľné pre našu administráciu. Stavajte [roads_with_icon|e] a [ShowBuildingTypeName('bridge_infrastructure')] budovy z nášho [capital_with_icon|e], aby ste zvýšili našu [proximity_with_icon|e], a tým aj náš [control]. Často kontrolujte [proximity] Map Mode!\n\n@hint! #T Inštalujte [ShowBuildingTypeName('local_governor')]#!\nJuh našej [country] je bohatý a urbanizovaný, no máme tam malý [control]. Zvážte postavenie [ShowBuildingTypeName('local_governor')] v [ShowLocationName('sevilla')]. Bude fungovať ako sekundárny [capital], vyžarujúci [proximity] do blízkych [locations]. Majte na pamäti, že miestni guvernéri sa dajú stavať len v [ShowLocationRankName('city')], sú drahí na udržiavanie a vyžadujú priamu [road] spojenie s naším [capital].\n\n@hint! #T Podrobte [GetCountry('GRA').GetName]#!\nAj keď nie sme schopní efektívne vlastniť ich zem hneď, môžeme spraviť z [GetCountry('GRA').GetName] nášho [subject_with_icon|e]. Vládli by zem v našom mene a platili by mesačný tribut do nášho [treasury]. Zvážte ich [annexing_with_icon|e] až keď bude naša infraštruktúra a technológia dostatočne rozvinutá. Na [annex] [subject] musíme vládnuť nad nimi viac než #Y 10#! rokov a mať s nimi dobré vzťahy.\n\n@hint! #T Plus Ultra#!\n[explorers_with_icon|e] prinášajú príbehy o nezmerateľnom bohatstve zo svojich výprav do Indie. Avšak pustiť sa do takýchto podnikov bez tých najmodernejších [advances_with_icon|e] môže byť mimoriadne nákladné." # todo: CHANGED
 hint_castile_diplomatic: "$hint_advisor_salute_diplomatic$" # todo: NEW TRANSLATION
 hint_castile_administrative: "$hint_advisor_salute_administrative$" # todo: NEW TRANSLATION
 hint_castile_military: "$hint_advisor_salute_military$" # todo: NEW TRANSLATION
 hint_ottomans: "Začiatočné rady pre Osmanskú ríšu" # todo: NEW TRANSLATION
 hint_ottomans_hint_text: "Hroziaci Rise of the Turks [situation_with_icon|e] ponúkne jedinečnú príležitosť na rýchlu expanziu do Grécka a Anatolie. Použite [actions_with_icon|e] zo Situácie, aby ste získali [casus_belli_with_icon|e] na našich susedov a uvoľnili našu silu proti nim.\n\n@hint! #T Integrujte naše dobyté územia #!\nNové [conquered_with_icon|e] [locations] je potrebné [integrate_with_icon|e] do našej administratívy cez [cabinet_with_icon|e], než z nich budeme môcť ťažiť.\n\n@hint! #T Stavajte [roads] z nášho [capital] #!\n[Locations] bez [control_with_icon|e] sú prakticky nepoužiteľné pre našu administráciu. Položte [roads_with_icon|e] z nášho [capital_with_icon|e], aby ste zvýšili našu [proximity_with_icon|e], a tým aj náš [control]. Často kontrolujte [proximity] Map Mode!\n\n@hint! #T Vytvárajte [subjects] na správu dobytých zemí#!\nAko sa rozširujeme, získame územia, ktoré ležia ďaleko mimo dosahu našej [proximity]. Odporúča sa vytvoriť [subjects_with_icon|e], ktoré budú správou týchto zemí, kým si nebudeme môcť dovoliť priamu správu.\n\n@hint! #T Anektujte našich [subjects] keď sa [proximity] zlepší #!\nS rozvojom infraštruktúry a rastom [proximity] sa územia, ktoré boli kedysi pre nás neudržateľné, stanú hodné priameho vlastníctva. Na [annex_with_icon|e] [subject] musíme vládnuť nad nimi viac než #Y 10#! rokov a mať s nimi dobré vzťahy.\n\n@hint! #T Zvýšte [maritime_presence] #!\nNáročný terén Grécka a Anatolie sťažuje šírenie [proximity] po zemi. S dobrou [maritime_presence_with_icon|e] pozdĺž pobrežia sa môže [proximity] šíriť oveľa efektívnejšie po mori. Stavte [ShowBuildingTypeName('wharf')] a [ShowBuildingTypeName('dock')] v našich mestách a majte [navies_with_icon|e] strážiace naše pobrežie. To bude obzvlášť dôležité, ak by sme presunuli náš [capital] do [ShowLocationName('constantinople')]...\n\n@hint! #T Inštalujte [ShowBuildingTypeName('local_governor')]#!\nAk plánujeme priamu správu vzdialených území, zvážme umiestnenie [ShowBuildingTypeName('local_governor')]. Bude fungovať ako sekundárny [capital], vyžarujúci [proximity] do blízkych [locations]. Majte na pamäti, že miestni guvernéri sa dajú stavať len v [ShowLocationRankName('city')], sú drahí na udržiavanie a vyžadujú priamu [road] spojenie s naším [capital]." # todo: CHANGED
 hint_ottomans_diplomatic: "$hint_advisor_salute_diplomatic$" # todo: NEW TRANSLATION
 hint_ottomans_administrative: "$hint_advisor_salute_administrative$"
 hint_ottomans_military: "$hint_advisor_salute_military$"
 hint_hre: "Rady pre Sväto-rímsku ríšu" # todo: NEW TRANSLATION
 hint_hre_hint_text: "$hint_hre_hint_text_1$\n\n$hint_hre_hint_text_2$\n\n$hint_hre_hint_text_3$\n\n$hint_hre_hint_text_4$\n\n$hint_hre_hint_text_5$\n\n$hint_hre_hint_text_6$" # todo: NEW TRANSLATION
 hint_hre_hint_text_1: "[GetInternationalOrganizationType('hre').GetName] je veľké [international_organization_with_icon|e] v strednej Európe. Členstvo v [international_organization] ovplyvní herný zážitok pre akúkoľvek [country]." # todo: NEW TRANSLATION
 hint_hre_hint_text_2: "[hre_emperor_icon] #T Cisár:#!\n[GetInternationalOrganization('hre').GetNameWithNoTooltip] vedie [hre_emperor_with_icon|e]. Je povinnosťou [ShowSpecialStatusNameWithNoTooltip('emperor')] chrániť členov Ríše pred zahraničnými hrozbami, udržiavať vnútorný mier a stabilitu a zabezpečiť náboženskú jednotu v Ríši.\n@arrow_bonus_tier_3! [ShowSpecialStatusNameWithNoTooltip('emperor')] môže použiť #Y $imperial_authority$#! na navrhovanie [policies_with_icon|e] a [parliament_issues_with_icon|e].\n@arrow_bonus_tier_2! Využite rôzne [diplomatic_actions_with_icon|e] na nasmerovanie ostatných členov k priaznivej politickej situácii v Ríši.\n@arrow_bonus_tier_1! [ShowCountryInteractionName('enforce_landfriede')] - vynútiť [white_peace|e] nad členom.\n@arrow_bonus_tier_1! [ShowCountryInteractionName('enforce_religious_unity')] - vynútiť cisárske náboženstvo na člena.\n@arrow_bonus_tier_1! [ShowCountryInteractionName('demand_unlawful_territory')] - požadovať vrátenie dobytého [location|e] jeho predchádzajúcemu vlastníkovi. Ak je to odmietnuté, bude udelený [casus_belli|e] na jeho vynútenie.\n@arrow_bonus_tier_1! [ShowCountryInteractionName('ask_to_vote_for_me_as_emperor')] - za cenu [favors|e] môžete požiadať [country], aby za vás hlasovala ako za cisára. Platí až do ďalších volieb.\n@arrow_bonus_tier_1! [ShowCountryInteractionName('bolster_imperial_army')] - požiadať [country], aby sa pripojila k jednej z vašich vojen. Dostanú plat z cisárskej pokladnice.\n@arrow_bonus_tier_1! Udelte [special_status|e] - Každý [special_status], s výnimkou [ShowSpecialStatusName('imperial_peasant_republic')], môže byť udelený členovi Ríše.\n@arrow_bonus_tier_1!Odobrať [special_status|e] - Každý [special_status], s výnimkou [ShowSpecialStatusName('imperial_peasant_republic')], môže byť odobratý členovi Ríše." # todo: NEW TRANSLATION
 hint_hre_hint_text_3: "[elector_icon] #T Volitelia:#!\n[hre_electoral_college_with_icon|e] pozostáva z [ShowSpecialStatusNamePlural('elector')] a [ShowSpecialStatusNamePlural('archbishop_elector')]. Ich hlas rozhodne o ďalšom [ShowSpecialStatusName('emperor')], keď [ruler] súčasnej vedúcej [country] zomrie.\n@arrow_bonus_tier_1! Voľba môže byť úspešná len ak aspoň 50% súčasných voliteľov zahlasuje za tú istú [country]. Ak žiadna väčšina nie je dosiahnutá, Ríša vstúpi do Boja o moc.\n$BULLET_WITH_TAB$ Boj o moc je obdobie bez zvoleného [ShowSpecialStatusName('emperor')], počas ktorého privilégiá a povinnosti cisára nemôže vykonávať žiadna [country]. [hre_electoral_college] sa pokúsi vyriešiť boj o moc zjednotením svojich hlasov. Po 10 rokoch bude boj o moc násilne ukončený a [country] s najvyšším [great_power_score_with_icon|e] sa stane [ShowSpecialStatusName('emperor')]." # todo: NEW TRANSLATION
 hint_hre_hint_text_4: "[hre_law_level_icon] #T Cisárske zákony:#!\nImperiálna ústava stanovuje pravidlá, ktorými sa Ríša a jej členovia riadia. Zdanenie členov v [gold|e] a [manpower|e], počet voliteľov a zjednotenie Ríše budú diktované tým, ktoré [policies] sú momentálne aktívne.\n@arrow_bonus_tier_3! Ríša začína bez [policy] [ShowPolicyName('golden_bull_policy')]. Predtým než môže byť implementovaná akákoľvek iná [policy], musí byť navrhnutá a schválená [policy] [ShowPolicyName('golden_bull_policy')].\n@arrow_bonus_tier_3! Keď je [policy] [ShowPolicyName('golden_bull_policy')] prijatá, Ríša sa nastaví na základné politiky vo všetkých kategóriách. Potom má [ShowSpecialStatusName('emperor')] privilégium vybrať akúkoľvek [policy] na hlasovanie v cisárskom dietári, ak je [ShowSpecialStatusName('emperor')] schopný zaplatiť #Y $imperial_authority$#! na zmenu [policy].\n@arrow_bonus_tier_2! Každá [policy] označená 'Emperor Comfort Policy' posúva Ríšu bližšie k zjednoteniu do jednej [country] pod [ShowSpecialStatusName('emperor')].\n@arrow_bonus_tier_1! Zjednotenie nie je jediným cieľom Ríše. Mnohé [policies] môžu prospieť [ShowSpecialStatusName('emperor')] alebo konkrétnym členom Ríše bez toho, aby posúvali smerom k zjednoteniu." # todo: NEW TRANSLATION
 hint_hre_hint_text_5: "[parliament_icon] #T Cisársky diét:#!\n Cisársky diét sa aktivuje pri dvoch príležitostiach:\n$TAB$@arrow_bonus_tier_1! Keď [ShowSpecialStatusName('emperor')] navrhne novú [policy].\n$TAB$@arrow_bonus_tier_1! Keď [ShowSpecialStatusName('emperor')] navrhne [parliament_issue], ktorý sa dotýka všetkých členov Ríše.\n@arrow_bonus_tier_3! Keď je Cisársky diét na zasadnutí, každý člen môže hlasovať o aktuálnej otázke. Síla hlasu každej [country] je určená [special_status_power] ich [special_status]. Aby ste zvýšili svoju hlasovaciu silu, môžete požiadať o nový [special_status] od [ShowSpecialStatusName('emperor')].\n$BULLET_WITH_TAB$ Vo všeobecnosti budú [countries] s [special_status] [hre_electoral_college] mať najvyššiu [special_status_power], nasledované [countries] s [ShowCountryRankName('rank_kingdom')] [country_rank] bez miesta v [hre_electoral_college].\n$BULLET_WITH_TAB$ [special_status_power] je tiež určená konkrétnymi [policies] v Ríši.\n@arrow_bonus_tier_2! [ShowSpecialStatusName('emperor')] môže použiť [parliament_agendas] na presviedčanie krajín so špecifickým [special_status] na svoju stranu.\n@arrow_bonus_tier_2! [ShowSpecialStatusName('emperor')] môže použiť [ShowCountryInteractionName('bribe_voter_for_policy')] [diplomatic_action] na úplatok ktorémukoľvek voličovi." # todo: NEW TRANSLATION
 hint_hre_hint_text_6: "[hre_icon] #T Členovia:#!\nKaždá [country] v [international_organization] je považovaná za člena, ak práve nie je [ShowSpecialStatusName('emperor')]. Ich význam v Ríši však určuje ich [special_status_power].\n@arrow_bonus_tier_3! Požiadajte o [special_status] od [ShowSpecialStatusName('emperor')] - Každý člen môže požiadať o [special_status], pokiaľ spĺňa podmienky pre daný status.\n@arrow_bonus_tier_3! [ShowCountryInteractionName('ask_for_dukedom')] - Každý člen môže požiadať o povýšenie na [ShowCountryRankName('rank_duchy')] [country_rank|e], ak spĺňa podmienky. Členovia si nesmú povýšiť svoj [country_rank] bez potvrdenia [ShowSpecialStatusName('emperor')].\n@arrow_bonus_tier_1! [ShowCountryInteractionName('request_county_privileges')] - Toto možno využiť na získanie prístupu k [ShowGovernmentReformName('margraviate')] a [ShowGovernmentReformName('landgraviate')] [government_reforms|e]." # todo: NEW TRANSLATION

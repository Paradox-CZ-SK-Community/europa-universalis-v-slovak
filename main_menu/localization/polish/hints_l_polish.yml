l_polish:
 TAB_TOOLTIP_HINTS_TITLE: "Rady"
 TAB_TOOLTIP_HINTS: "#T Tipy#!\nTento panel obsahuje rady relevantné pre vašu aktuálnu hernú situáciu."
 OPEN_HINTS: "Otvoriť rady"
 OPEN_HINT: "Otvoriť radu"
 EXPAND_HINT: "Kliknite pre rozvinutie rady"
 COLLAPSE_HINT: "Kliknite pre zbalenie rady"
 EMPTY_HINT_SCREEN_TEXT: "Naša krajina funguje hladko a nemáme žiadne rady!"
 OPEN_HINT_TEXT: "Zobraziť radu @hint!"
 ALERT_HINT: "Otvoriť s radou"
 ALERT_ADVANCES_HINT: "Otvoriť panel Pokrokov s radou"
 HINT_TITLE: "Rada @hint!"
 RECOMMENDED_ACTIONS_TITLE: "@hint! Odporúčané akcie"
 SCRIPTABLE_HINT_DEFINITION_TEXT: "$MAIN_HINT$ $CONTEXT_HINT$"
 HINT_DIVIDER: "\n\n---\n\n"
 HINT_SORT_BY_PRIORITY: "Zoradiť podľa priority"
 hint_advisor_salute_diplomatic: "\n\"Dovoľte mi predstaviť sa, Vaša Výsosť. Som [Player.GetGovernment.CalcBestRepresentativeForPlaystyle('diplomatic').GetName], Váš politický poradca a najslušnejší služobník.\""
 hint_advisor_salute_administrative: "\n\"Volám sa [Player.GetGovernment.CalcBestRepresentativeForPlaystyle('administrative').GetName], verný radca Vášho veličenstva vo všetkom, čo sa týka hospodárstva.\""
 hint_advisor_salute_military: "\n\"Volám sa [Player.GetGovernment.CalcBestRepresentativeForPlaystyle('military').GetName], Váš odborník na vojenské záležitosti. K vašim službám.\""
 HINTS_AND_SUGGESTIONS: "Rady a návrhy"
 MANPOWER_HINT: "Nedostatok personálu!"
 manpower_topbar_hint: "Viac [Concept('manpower_with_icon','živá sila')|e] získavame predovšetkým výstavbou určitých typov [Concept('building_with_icon','budovy')|e]." # todo: CHANGED # todo: CONCEPT CASE
 MANPOWER_HINT_EXTRA: "Môžeme postaviť nasledujúce budovy, aby sme získali viac [Concept('manpower_with_icon','živá sila')|e]:" # todo: CHANGED # todo: CONCEPT CASE
 MANPOWER_HINT_NONE: "Bohužiaľ, neexistujú žiadne budovy, ktoré by sme mohli postaviť a ktoré by nám dali viac personálu."
 MANPOWER_HINT_BUILDING: "$BULLET_WITH_TAB$[BUILDING_TYPE.GetName]"
 SAILORS_HINT: "Nedostatok námorníkov!"
 sailors_topbar_hint: "Viac [Concept('sailors_with_icon','námorníci')|e] získavame predovšetkým výstavbou špecifických typov [Concept('buildings_with_icon','budov')|e] v pobrežných [Concept('locations_with_icon','lokalitách')|e]." # todo: CHANGED # todo: CONCEPT CASE
 SAILOR_HINT_EXTRA: "Môžeme postaviť nasledujúce budovy, aby sme získali viac námorníkov:"
 SAILOR_HINT_NONE: "Bohužiaľ, neexistujú budovy, ktoré by sme mohli postaviť a ktoré by nám poskytli námorníkov."
 SAILOR_HINT_BUILDING: "$BULLET_WITH_TAB$[BUILDING_TYPE.GetName]"
 INVALID_MODIFIER_TYPE: "Hľadanie neplatného typu modifikátora!"
 EMPTY_RESEARCH_HINT: "Môžeme zvoliť výskum!"
 empty_research_topbar_hint: "@trigger_no! Nemá žiadnu nevýhodu mať aktívny [Concept('research_with_icon','výskum')|e] a momentálne strácame pokrok, ktorý by mohol byť dosiahnutý inak." # todo: CHANGED # todo: CONCEPT CASE
 NO_BUILDINGS_WITH_MODIFIER: "Žiadne"
 GOLD_HINT: "Máme deficit!"
 gold_topbar_hint: "Ak sme v deficite, môžeme znížiť naše [Concept('expenses_with_icon','výdavky')|e], zvýšiť [Concept('taxes_with_icon','dane')|e] alebo viac [Concept('mint_with_icon','ražba')|e] mincí. Ak nám dôjde [Concept('gold_with_icon','dukáty')|e], budeme nútení brať si [Concept('loans_with_icon','pôžičkám')|e] a nakoniec môžeme skrachovať [Concept('bankrupt_with_icon','bankrot')|e]." # todo: CHANGED # todo: CONCEPT CASE
 STABILITY_HINT: "Naša krajina je nestabilná!"
 stability_topbar_hint: "Akcie, ktoré môžeme urobiť pre zvýšenie stability zahŕňajú:\n$BULLET_WITH_TAB$Zvýšenie počtu [GetPlayer.GetReligion.GetAdjective] [ShowPopTypeName('clergy')].\n$BULLET_WITH_TAB$Investovať viac zo [Concept('budget_with_icon','rozpočtu')|e] do stability.\n$BULLET_WITH_TAB$Inštruovať [Concept('cabinet_with_icon','kabinet')|e], aby [ShowCabinetActionName('stabilize_country')]." # todo: CHANGED # todo: CONCEPT CASE
 LEGITIMACY_HINT: "[Localize( GetPlayer.GetGovernment.GetGovernmentType.GetPowerKey )] je nízka!"
 legitimacy_topbar_hint: "Existuje niekoľko spôsobov, ako to riešiť:\n$BULLET_WITH_TAB$Zvýšiť [Concept('budget_with_icon','rozpočet')|e] na [Concept('court_maintenance_with_icon','náklady dvora')|e].\n$BULLET_WITH_TAB$Inštruovať [Concept('cabinet_with_icon','kabinet')|e], aby [ShowCabinetActionName('strengthen_government')]." # todo: CHANGED # todo: CONCEPT CASE
 devotion_topbar_hint: "$legitimacy_topbar_hint$"
 republican_tradition_topbar_hint: "$legitimacy_topbar_hint$"
 horde_unity_topbar_hint: "$legitimacy_topbar_hint$"
 tribal_cohesion_topbar_hint: "$legitimacy_topbar_hint$"
 GOLD_VIEW_HINT: "Zobraziť rady o deficite"
 hint_in_deficit: "Negatívny zostatok"
 hint_in_deficit_hint_text: "$hint_in_deficit_hint_text_1$\n\n$hint_in_deficit_hint_text_2$\n\n$hint_in_deficit_hint_text_3$"
 hint_in_deficit_hint_text_1: "Máme negatívny zostatok. Ak nebudeme opatrní, môže to viesť k dlhu alebo dokonca k bankrotu."
 hint_in_deficit_hint_text_2: "#T Odporúčané kroky:#!\n@arrow_bonus_tier_3! Prejdite na @economy_panel! [Link('economy', '', 'lateralview_economy_entry_name')] a pozrite si naše [Concept('income_with_icon','príjem')|e] a [expenses]. Posúvajte posuvníky na zvýšenie [Concept('taxes_with_icon','dane')|e] alebo zníženie nákladov.\n@arrow_bonus_tier_2! Uistite sa, že všetky naše [Concept('buildings_with_icon','budovy')|E] sú ziskové, alebo postavte viac, ak si to môžeme dovoliť. Urobíte to v @production_panel! [Link('production', '', 'lateralview_production_entry_name')].\n@arrow_bonus_tier_2! Správa alebo využitie vašich [Concept('estates_with_icon','stavov')|E] môže tiež priniesť významné zisky krátkodobo aj dlhodobo. Majte na pamäti, že stavy môžu mať veľkú politickú moc a ich prílišné využívanie môže byť rizikové. Nájdu sa v @government_panel! [Link('government', 'tabcontent = estates', 'lateralview_government_entry_name')]\n@arrow_bonus_tier_1! Nastavenie ziskových [Concept('trades_with_icon','obchody')|E] je tiež skvelý zdroj príjmov. Prehľadajte existujúce alebo potenciálne obchodné trasy v @economy_panel! [Link('trade', '', 'lateralview_trade_entry_name')]" # todo: CHANGED # todo: CONCEPT CASE
 hint_in_deficit_hint_text_3: "#T Extra tipy:#!\n@hint! [Concept('laws_with_icon','Zákony')|E], [Concept('reforms_with_icon','reformy')|E], [Concept('diplomacy_with_icon','diplomacia')|E] a ďalšie vám môžu poskytnúť možnosti na riešenie záporného zostatku." # todo: CHANGED # todo: CONCEPT CASE
 hint_in_deficit_military: "\"Vojna môže byť krátkodobo nákladná, ale ak budeme úspešní, môžeme prenechať nepriateľa aby za ňu zaplatil. Získanie území môže priniesť dlhodobé zisky a vydieranie nepriateľov môže poskytnúť krátkodobý príliv bohatstva.\""
 hint_in_deficit_explorer: "\"Veľké neznámo je iste plné bohatstva, pripravené na rozvoj a drancovanie.\""
 hint_in_deficit_administrative: "\"Dominancia na domácom trhu by bol výborný spôsob, ako rozvíjať naše bohatstvo. Ak sme ambiciózni, založenie postavení na zahraničných trhoch môže ešte viac podporiť rast.\"" # todo: NEW TRANSLATION
 hint_in_deficit_diplomatic: "\"Ako sa hovorí, musíme minúť peniaze, aby sme zarobili! Zabezpečiť, že naše budovy a obyvateľstvo sú ziskové, je najlepší spôsob, ako zvrátiť situáciu.\"" # todo: NEW TRANSLATION
 hint_cultural_capacity: "Presiahnutie kultúrnej kapacity" # todo: NEW TRANSLATION
 hint_cultural_capacity_hint_text: "$hint_cultural_capacity_hint_text_1$\n\n$hint_cultural_capacity_hint_text_2$\n\n$hint_cultural_capacity_hint_text_3$" # todo: NEW TRANSLATION
 hint_cultural_capacity_hint_text_1: "Aj keď multikultúrnosť prináša veľa výhod, národy, ktoré nie sú pripravené na administratívne bremená a postrádajú [Concept('cultural_capacity_with_icon','kultúrna kapacita')|E], utrpia penalizácie. [Concept('pops_with_icon','Populácie')|E] patriace k [Concept('cultures_with_icon','kultúre')|E] iným než našej [Concept('primary_culture_with_icon','hlavnej kultúre')|E] budú obyčajne začínať ako [Concept('non_accepted_culture_short_with_icon','diskriminovaná')|E], ale môžu byť [Concept('tolerated_culture_short_with_icon','tolerovaná')|E] alebo [Concept('accepted_culture_short_with_icon','akceptovaná')|E] za cenu." # todo: CHANGED # todo: CONCEPT CASE
 hint_cultural_capacity_hint_text_2: "#T Odporúčané kroky:#!\n@arrow_bonus_tier_3! Zvážte degradáciu menej strategicky dôležitej kultúry, aby ste znížili náklady.\n@arrow_bonus_tier_2! Existujú zdroje [ShowModifierTypeName('cultures_capacity')], bežne v [Concept('government_reforms_with_icon','vládnych reformách')|E] a [Concept('advances_with_icon','pokrokoch')|E]." # todo: CHANGED # todo: CONCEPT CASE
 hint_cultural_capacity_hint_text_3: "#T Extra tipy:#!\n@hint! [Concept('assimilation_with_icon','Asimilácia')|e] môže tiež pomôcť znížiť počet kultúr v krajine." # todo: CHANGED # todo: CONCEPT CASE
 hint_cultural_capacity_military: "\"Plné využitie našich kultúr je kľúčové pre tvorbu kultúrnej tradície a vplyvu - dáva nám prevahu pri kultúrnom konflikte. Zvýšenie práv cudzích kultúr nám tiež poskytne ďalšie levy a vojakov.\"" # todo: NEW TRANSLATION
 hint_cultural_capacity_administrative: "\"Naša kultúra sa môže prejaviť aj prostredníctvom úžasných umeleckých diel našich národných umelcov. Napokon, čo je národ iné než súčet jeho vplyvu vo svete?\"" # todo: NEW TRANSLATION
 hint_cultural_capacity_diplomatic: "\"Postupom času sa cudzie kultúry môžu asimilovať bližšie k našej primárnej kultúre v [GetPlayer.GetNameWithNoTooltip]! Kto by nechcel byť [GetPlayer.GetCulture.GetNameWithNoTooltip]?\"" # todo: NEW TRANSLATION
 hint_unhappy_estates: "Nespokojné stavy" # todo: NEW TRANSLATION
 hint_unhappy_estates_hint_text: "$hint_unhappy_estates_hint_text_1$\n\n$hint_unhappy_estates_hint_text_2$\n\n$hint_unhappy_estates_hint_text_3$" # todo: NEW TRANSLATION
 hint_unhappy_estates_hint_text_1: "Udržiavať [Concept('estates_with_icon','stavy')|e] spokojné je dôležitá každodenná súčasť riadenia krajiny. Spoločne predstavujú významný podiel na ekonomickej a vojenskej sile krajiny.\n\nKaždý nelojálny [estate] udelí tresty vašej [country] a spôsobí, že jeho zložky [Concept('pops_with_icon','populácie')|e] sa s veľkou pravdepodobnosťou pridajú k [Concept('rebellions_with_icon','povstaniu')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 hint_unhappy_estates_hint_text_2: "#T Odporúčané kroky:#!\n@arrow_bonus_tier_3! Ich produkciu a [Concept('estate_satisfaction_short_with_icon','spokojnosť')|E] možno riadiť udeľovaním alebo odoberaním privilégií v @government_panel! [Link('government', 'tabcontent = estates', 'lateralview_government_entry_name')].\n@arrow_bonus_tier_2! Zvyšovanie a znižovanie daní v @economy_panel! [Link('economy', '', 'lateralview_economy_entry_name')] tiež ovplyvní ich spokojnosť." # todo: CHANGED # todo: CONCEPT CASE
 hint_unhappy_estates_hint_text_3: "#T Extra tipy:#!\n@hint! [Concept('parliament_with_icon','Parlament')|e] môže byť tiež použitý na pomoc pri riadení [Concept('estate_satisfaction_with_icon','spokojnosti stavu')|e].\n@hint! Viac o [rebel_movements_with_icon] sa dozviete v [Link('hints', 'selected_hint = hint_rebels_growing', 'Rebels Hint')]." # todo: CHANGED # todo: CONCEPT CASE
 hint_unhappy_estates_administrative: "\"Stavy sú rozhodujúce pre zdravé obchodné impérium. Áno, možno budeme musieť v dlhodobom horizonte obetovať časť autority, ale pomyslite na ekonomiku!\"" # todo: NEW TRANSLATION
 hint_unhappy_estates_diplomatic: "\"Naše stavy môžu mať názory aj na diplomatické záležitosti. Môže byť užitočné zvážiť ich hodnotenie cudzej moci pri posudzovaní spojenectiev alebo paktov.\"" # todo: NEW TRANSLATION
 hint_unhappy_estates_military: "\"Naše stavy poskytujú dôležité levy na podporu expanzie. Ak ich nezískame na svoju stranu, môže nám chýbať nábor práve vtedy, keď ho budeme potrebovať.\"" # todo: NEW TRANSLATION
 ESTATE_CONTEXT_TEXT: "Vo vašej krajine sú $LIST$ nespokojné.\n\n$TEXT$" # todo: NEW TRANSLATION
 HINT_UNHAPPY_ESTATE: "[ESTATE.GetName]" # todo: NEW TRANSLATION
 hint_manpower: "Ľudské zdroje" # todo: NEW TRANSLATION
 hint_manpower_hint_text: "$hint_manpower_hint_text_1$\n\n$hint_manpower_hint_text_2$\n\n$hint_manpower_hint_text_3$" # todo: NEW TRANSLATION
 hint_manpower_hint_text_1: "Náš [Concept('manpower_with_icon','živá sila')|e] je rezervou mužov pripravených byť naverbovaní ako [Concept('regulars_with_icon','stáli vojaci')|e] pre naše [Concept('armies_with_icon','armády')|e]. Regulars sú vo [Concept('battle_with_icon','bitke')|e] výrazne lepší než [Concept('levies_with_icon','branci')|e], ale sú drahí, takže nie každá [Concept('country_with_icon','krajina')|e] si ich môže dovoliť na začiatku hry." # todo: CHANGED # todo: CONCEPT CASE
 hint_manpower_hint_text_2: "#T Odporúčané kroky:#!\n@arrow_bonus_tier_3! Ak sa spoliehame na [regulars] pri vedení vojny, nízky [manpower] vážne obmedzuje našu schopnosť doplniť [Concept('armies_with_icon','armády')|e], takže nie je múdre vyhlásiť [Concept('war_with_icon','vojna')|E], keď máme nízke zásoby manpower.\n@arrow_bonus_tier_2! Ak nám dochádza manpower počas vojny, zvážte väčšie využitie [Concept('levies_with_icon','branci')|E], nájomných [Concept('mercenaries_with_icon','žoldnierov')|E], alebo dokonca zvážte rokovania o [Concept('peace_with_icon','mier')|E]." # todo: CHANGED # todo: CONCEPT CASE
 hint_manpower_hint_text_3: "#T Extra tipy:#!\n@hint! Našu maximálnu manpower a schopnosť naverbovať stálu armádu môžeme zvýšiť rôznymi [Concept('buildings_with_icon','budovami')|E].\n@hint! [Concept('estate_privileges_with_icon','Privilégiá stavov')|E] a [Concept('laws_with_icon','zákony')|E] tiež môžu ovplyvniť náš manpower potenciál." # todo: CHANGED # todo: CONCEPT CASE
 hint_manpower_diplomatic: "\"Elitná stála armáda obsadená dobrými [GetPlayer.GetAdjectiveWithNoTooltip] mužmi a chlapcami je zvyčajne najefektívnejšia bojová sila na hlavu.\"" # todo: NEW TRANSLATION
 hint_manpower_military: "\"Konquista by mala používať všetky dostupné prostriedky. Rozsiahla armáda by mala využívať žoldnierov, levy aj stálu armádu naraz.\"" # todo: NEW TRANSLATION
 hint_manpower_administrative: "\"Nezabúdajte, že každý vojak, ktorý zomrie na bojisku, je o jedného robotníka menej na poli. Vojna je drahá.\"" # todo: NEW TRANSLATION
 hint_low_stability: "Nízka stabilita" # todo: NEW TRANSLATION
 hint_low_stability_hint_text: "$hint_low_stability_hint_text_1$\n\n$hint_low_stability_hint_text_2$\n\n$hint_low_stability_hint_text_3$" # todo: NEW TRANSLATION
 hint_low_stability_hint_text_1: "Ak je naša [Concept('stability_with_icon','stabilita')|E] nízka, hrozí, že [Concept('pops_with_icon','populácie')|E] sa pridajú ku [Concept('rebellion_with_icon','povstaniu')|E], nespokojnosť [Concept('estate_with_icon','stav')|E] môže viesť k [Concept('civil_war_with_icon','občianskej vojne')|E] a všeobecný chaos v krajine." # todo: CHANGED # todo: CONCEPT CASE
 stability_raise_actions: "@arrow_bonus_tier_3! Investovať viac zo [Concept('budget_with_icon','rozpočtu')|e] do stability.\n@arrow_bonus_tier_2! Inštruovať [Concept('cabinet_with_icon','kabinet')|e], aby [ShowCabinetActionName('stabilize_country')]\n@arrow_bonus_tier_1! Zvýšiť počet [GetPlayer.GetReligion.GetAdjective] [ShowPopTypeName('clergy')]." # todo: CHANGED # todo: CONCEPT CASE
 hint_low_stability_hint_text_2: "#T Odporúčané akcie:#!\n$stability_raise_actions$" # todo: NEW TRANSLATION
 hint_low_stability_hint_text_3: "#T Extra tipy:#!\n@hint! Existujú aj iné zdroje stability, ako [Concept('advances_with_icon','pokroky')|e] alebo [Concept('policies_with_icon','politiky')|e].\n@hint! Pamätajte, že stabilita sa tiež spotrebováva pri dôležitých akciách, ako vyhlásenie [Concept('wars_with_icon','vojny')|E] bez správneho [Concept('casus_belli_with_icon','casus belli')|e] alebo zmena [Concept('law_with_icon','zákon')|e]." # todo: CHANGED # todo: CONCEPT CASE
 hint_low_stability_administrative: "\"Krajina s vysokou stabilitou je samozrejme krajina v stave prosperity! Keď sú úrody bohaté, tak isto prúdi bohatstvo do našich pokladníc.\"" # todo: NEW TRANSLATION
 hint_low_stability_military: "\"Krajina nemôže bezpečne uplatňovať dominanciu, kým najprv nedosiahne skľudnenie svojho obyvateľstva. Bežní ľudia tak milujú svoje vidly...\"" # todo: NEW TRANSLATION
 hint_low_stability_diplomatic: "\"Naši susedia sa budú škodoradostne pozerať, ak potopíme našu krajinu do zániku. Nemohli by sme s tým niečo urobiť?\"" # todo: NEW TRANSLATION
 hint_very_low_stability: "Veľmi nízka stabilita" # todo: NEW TRANSLATION
 hint_very_low_stability_hint_text: "$hint_very_low_stability_hint_text_1$\n\n$hint_very_low_stability_hint_text_2$\n\n$hint_very_low_stability_hint_text_3$" # todo: NEW TRANSLATION
 hint_very_low_stability_hint_text_1: "Naša [Concept('stability_with_icon','stabilita')|E] je extrémne nízka a hrozí nám, že [Concept('pops_with_icon','populácie')|E] sa pridajú ku [Concept('rebellion_with_icon','povstaniu')|E], nespokojnosť [Concept('estate_with_icon','stav')|E] vedie k [Concept('civil_war_with_icon','občianskej vojne')|E] a nepriatelia využijú príležitosť zaútočiť, keď sme slabí." # todo: CHANGED # todo: CONCEPT CASE
 hint_very_low_stability_hint_text_2: "#T Odporúčané kroky:#!\n@arrow_bonus_tier_3! Mali by sme zvýšiť stabilitu čo najskôr a vyhnúť sa vyhlasovaniu ďalších [Concept('wars_with_icon','vojen')|E] alebo ďalším akciám, ktoré stabilitu znižujú.\n$stability_raise_actions$" # todo: CHANGED # todo: CONCEPT CASE
 hint_very_low_stability_hint_text_3: "$hint_low_stability_hint_text_3$" # todo: NEW TRANSLATION
 hint_very_low_stability_administrative: "\"Ako môže niekto očakávať, že sa bude v takejto ekonomike obchodovať? Nech nám niekto pomôže s rozpočtom, naše dobytok hladujú.\"" # todo: NEW TRANSLATION
 hint_very_low_stability_military: "\"Každý nepriateľ [GetPlayer.GetNameWithNoTooltip] by bol nadšený, akoby sme vyzerali takto slabí. Mali by sme očakávať, že rivali a nepriatelia začnú spisovať plány proti nám.\"" # todo: NEW TRANSLATION
 hint_very_low_stability_diplomatic: "\"Kým národ v období vysokej stability zažíva vynikajúcu sociálnu mobilitu, my sme zrejme vynašli istú formu sociálnej demobilizácie.\"" # todo: NEW TRANSLATION
 hint_low_legitimacy: "Nízka legitimita" # todo: NEW TRANSLATION
 hint_low_legitimacy_hint_text: "$hint_low_legitimacy_hint_text_1$\n\n$hint_low_legitimacy_hint_text_2$\n\n$hint_low_legitimacy_hint_text_3$" # todo: NEW TRANSLATION
 hint_low_legitimacy_hint_text_1: "[Concept('legitimacy_with_icon','Legitimita')|E] predstavuje, ako svet vníma oprávnenosť nášho [GetPlayer.GetGovernment.GetRulerTitle] vládnuť. Ak klesne príliš nízko, nielenže stratíme výhody k [Concept('crown_power_with_icon','moci koruny')|E] a zníženú šancu na [Concept('rebellion_with_icon','povstanie')|E], ale začneme dostávať penalizácie k spokojnosti [Concept('estate_with_icon','stavu')|E] a [Concept('righteousness_with_icon','spravodlivosť')|E]." # todo: CHANGED # todo: CONCEPT CASE
 hint_low_legitimacy_hint_text_2: "#T Odporúčané kroky:#!\n@arrow_bonus_tier_3! Mali by sme si udržiavať legitimitu čo najvyššiu, aby sme minimalizovali potenciálne penalizácie.\n@arrow_bonus_tier_2! Zvýšenie [Concept('court_maintenance_with_icon','náklady dvora')|e] pomôže udržať vysokú [Concept('legitimacy_with_icon','legitimitu')|e].\n@arrow_bonus_tier_2! Môžeme tiež získať iné zdroje [Concept('legitimacy_with_icon','legitimita')|e], napr. [Concept('advances_with_icon','Pokroky')|e] alebo [Concept('policies_with_icon','politiky')|e].\n@arrow_bonus_tier_1! Zvoľte [Concept('cabinet_action_with_icon','akcia kabinetu')|e] s názvom [ShowCabinetActionName('strengthen_government')]." # todo: CHANGED # todo: CONCEPT CASE
 hint_low_legitimacy_hint_text_3: "#T Extra tipy:#!\n@hint! Rovnako ako väčšina dôležitých hodnôt, vytvorenie priaznivého obrazu vašej [Concept('dynasty_with_icon','dynastie')|E] zaberie čas, takže myslite dlhodobo." # todo: CHANGED # todo: CONCEPT CASE
 hint_low_legitimacy_administrative: "\"Ktokoľvek, kto preverí záznamy o našom pôvode a nádheru nášho dvora, nebude schopný poprieť naše právo vládnuť.\"" # todo: NEW TRANSLATION
 hint_low_legitimacy_military: "\"Ako môžeme očakávať, že naše armády budú báť, keď naši vlastní vojaci spochybňujú naše vedenie?\"" # todo: NEW TRANSLATION
 hint_low_legitimacy_diplomatic: "\"Niekedy vnútorná sila vychádza z toho, ako nás vnímajú ostatní, a naši spojenci nám môžu tiež pomôcť v časoch núdze.\"" # todo: NEW TRANSLATION
 hint_low_republican_tradition: "Nízka republikánska tradícia"
 hint_low_republican_tradition_hint_text: "$hint_low_republican_tradition_hint_text_1$\n\n$hint_low_republican_tradition_hint_text_2$\n\n$hint_low_republican_tradition_hint_text_3$" # todo: NEW TRANSLATION
 hint_low_republican_tradition_hint_text_1: "[Concept('republican_tradition_with_icon','Republikánska tradícia')|E] predstavuje zakorenenie republikánstva v našom [GetPlayer.GetGovernment.GetGovernmentType.GetName]. Ak klesne príliš nízko, nielenže stratíme výhody k [Concept('legislative_efficiency_with_icon','legislatívnej efektívnosti')|E] a zníženú šancu na [Concept('rebellion_with_icon','povstanie')|E], ale začneme dostávať vážne penalizácie k nákladom na zvyšovanie [Concept('stability_with_icon','stabilita')|E]." # todo: CHANGED # todo: CONCEPT CASE
 hint_low_republican_tradition_hint_text_2: "#T Odporúčané kroky:#!\n@arrow_bonus_tier_3! Mali by sme sa snažiť udržiavať tradíciu čo najvyššiu, aby sme minimalizovali možné penalizácie.\n@arrow_bonus_tier_2! Zvýšenie [Concept('court_maintenance_with_icon','náklady dvora')|e] pomôže udržať vysokú [Concept('republican_tradition_with_icon','republikánsku tradíciu')|e].\n@arrow_bonus_tier_2! Môžeme získať ďalšie zdroje [Concept('republican_tradition_with_icon','republikánska tradícia')|e], napr. [Concept('advances_with_icon','Pokroky')|e] alebo [Concept('policies_with_icon','politiky')|e].\n@arrow_bonus_tier_1! Zmena [Concept('ruler_with_icon','panovník')|e] počas [Concept('election_with_icon','voľby')|e] tiež pomôže udržať vysokú [Concept('republican_tradition_with_icon','republikánsku tradíciu')|e]." # todo: CHANGED # todo: CONCEPT CASE
 hint_low_republican_tradition_hint_text_3: "#T Ďalšie tipy:#!\n@hint! Ako pri väčšine dôležitých hodnôt, výchova obyvateľstva k republikánskym hodnotám je dlhodobé úsilie - myslite dopredu." # todo: NEW TRANSLATION
 hint_low_republican_tradition_administrative: "\"Voľby sú prirodzeným procesom každej zdravé republiky.\"" # todo: NEW TRANSLATION
 hint_low_republican_tradition_military: "\"Ani žoldnieri nebudú ochotní bojovať za nás, ak vyzeráme ako tyrani.\"" # todo: NEW TRANSLATION
 hint_low_republican_tradition_diplomatic: "\"Žiadny národ, ktorý si cení svoju silu, sa dobrovoľne nespojí s krajinou, ktorá blatantne ignoruje princípy svojho základu.\"" # todo: NEW TRANSLATION
 hint_low_devotion: "Nízka oddanosť" # todo: NEW TRANSLATION
 hint_low_devotion_hint_text: "$hint_low_devotion_hint_text_1$\n\n$hint_low_devotion_hint_text_2$\n\n$hint_low_devotion_hint_text_3$" # todo: NEW TRANSLATION
 hint_low_devotion_hint_text_1: "$game_concept_devotion_desc$ Ak klesne príliš nízko, nielenže stratíme výhody k [Concept('religious_influence_with_icon','náboženskému vplyvu')|E] a zníženú šancu na [Concept('rebellion_with_icon','povstanie')|E], ale začneme dostávať penalizácie k spokojnosti [Concept('estate_with_icon','stavu')|E]." # todo: CHANGED # todo: CONCEPT CASE
 hint_low_devotion_hint_text_2: "#T Odporúčané kroky:#!\n@arrow_bonus_tier_3! Mali by sme sa snažiť udržiavať našu oddanosť čo najvyššiu, aby sme minimalizovali možné penalizácie.\n@arrow_bonus_tier_2! Zvýšenie [Concept('court_maintenance_with_icon','náklady dvora')|e] pomôže udržať vysokú [Concept('devotion_with_icon','oddanosť')|e].\n@arrow_bonus_tier_2! Môžeme získať ďalšie zdroje [Concept('devotion_with_icon','oddanosť')|e], napr. [Concept('advances_with_icon','Pokroky')|e] alebo [Concept('policies_with_icon','politiky')|e]." # todo: CHANGED # todo: CONCEPT CASE
 hint_low_devotion_hint_text_3: "#T Ďalšie tipy:#!\n@hint! Ako pri väčšine dôležitých hodnôt, podporovanie náboženskej horlivosti nie je záležitosť noci, takže myslite dlhodobo." # todo: NEW TRANSLATION
 hint_low_devotion_administrative: "\"Nestačí len zastupovať vieru a tváriť sa ako jej obrancovia, musíme tomu aj vyzerať zodpovedať.\"" # todo: NEW TRANSLATION
 hint_low_devotion_military: "\"Ak majú naše armády predstavovať meč a štít veriacich, musíme byť svetlom, za ktoré bojujú.\"" # todo: NEW TRANSLATION
 hint_low_devotion_diplomatic: "\"Naším cieľom by malo byť šíriť našu vieru čo najďalej, ale nikto nebude ochotný veriť našim slovám, ak nevyzeráme pobožne.\"" # todo: NEW TRANSLATION
 hint_low_horde_unity: "Nízka jednota húfov" # todo: NEW TRANSLATION
 hint_low_horde_unity_hint_text: "$hint_low_horde_unity_hint_text_1$\n\n$hint_low_horde_unity_hint_text_2$\n\n$hint_low_horde_unity_hint_text_3$" # todo: NEW TRANSLATION
 hint_low_horde_unity_hint_text_1: "$game_concept_horde_unity_desc$" # todo: NEW TRANSLATION
 hint_low_horde_unity_hint_text_2: "#T Odporúčané kroky:#!\n@arrow_bonus_tier_3! Najefektívnejšou metódou na zjednotenie hordu je poraziť nepriateľov.\n@arrow_bonus_tier_2! Zvýšenie [Concept('court_maintenance_with_icon','náklady dvora')|e] pomôže udržať vysokú [Concept('horde_unity_with_icon','jednotu hordy')|e].\n@arrow_bonus_tier_2! Môžeme získať ďalšie zdroje [Concept('horde_unity_with_icon','jednota hordy')|e], napr. [Concept('advances_with_icon','Pokroky')|e] alebo [Concept('policies_with_icon','politiky')|e]." # todo: CHANGED # todo: CONCEPT CASE
 hint_low_horde_unity_hint_text_3: "#T Ďalšie tipy:#!\n@hint! Nízka jednota môže mať niektoré devastujúce následky, preto by sme ju mali udržiavať vysokú." # todo: NEW TRANSLATION
 hint_low_horde_unity_administrative: "\"Deliť a panovať je dobre známa stratégia. Ak nie sme zjednotení, budeme tým, koho porazia.\"" # todo: NEW TRANSLATION
 hint_low_horde_unity_military: "\"Ako hovorí naše príslovie: dobré veci prichádzajú tým, ktorí ich uchopia od slabých. Moc nás zjednocuje, a s mocou budeme jednotní!\"" # todo: NEW TRANSLATION
 hint_low_horde_unity_diplomatic: "\"Sila našej bojovej zdatnosti je priamo ovplyvnená tým, ako jednotní sme ako kmeň. Úspech v vojne a dobytí je sebazapĺňajúca sa prerokávanie.\"" # todo: NEW TRANSLATION
 hint_low_tribal_cohesion: "Nízka kmeňová zdržanosť" # todo: NEW TRANSLATION
 hint_low_tribal_cohesion_hint_text: "$hint_low_tribal_cohesion_hint_text_1$\n\n$hint_low_tribal_cohesion_hint_text_2$\n\n$hint_low_tribal_cohesion_hint_text_3$" # todo: NEW TRANSLATION
 hint_low_tribal_cohesion_hint_text_1: "$game_concept_tribal_cohesion_desc$ Na rozdiel od iných [Concept('government_types_with_icon','typov vlád')|E] majú kmeňové vlády výrazne zvýšenú veľkosť levy, keď koherencia rastie. Ak chceme robiť efektívne vojenské rozhodnutia, musíme mať kmene na svojej strane." # todo: CHANGED # todo: CONCEPT CASE
 hint_low_tribal_cohesion_hint_text_2: "#T Odporúčané kroky:#!\n@arrow_bonus_tier_2! Zvýšenie [Concept('court_maintenance_with_icon','náklady dvora')|e] pomôže udržať vysokú [Concept('tribal_cohesion_with_icon','kmeňovú súdržnosť')|e].\n@arrow_bonus_tier_2! Môžeme získať ďalšie zdroje [Concept('tribal_cohesion_with_icon','kmeňová súdržnosť')|e], napr. [Concept('advances_with_icon','Pokroky')|e] alebo [Concept('policies_with_icon','politiky')|e]." # todo: CHANGED # todo: CONCEPT CASE
 hint_low_tribal_cohesion_hint_text_3: "#T Ďalšie tipy:#!\n@hint! Nízka kohezia môže mať niektoré devastujúce následky, preto by sme ju mali udržiavať vysokú." # todo: NEW TRANSLATION
 hint_low_tribal_cohesion_administrative: "\"Ak jej jednoducho nevenujeme pozornosť, naša kohezia klesne. Spravovanie krajiny si vyžaduje starostlivosť o detaily.\"" # todo: NEW TRANSLATION
 hint_low_tribal_cohesion_military: "\"Zlá kmeňová kohezia nás oslabuje. Slabosť nás ešte viac rozdelí. Nechoďte touto cestou, inak sa môžeme stať porazenými a zotročenými.\"" # todo: NEW TRANSLATION
 hint_low_tribal_cohesion_diplomatic: "\"Stavy sú zakorenené v mnohých aspektoch krajiny, takže takmer každé naše rozhodnutie môže mať následky v budúcnosti. Strategické plánovanie vyžaduje dlhodobé uvažovanie.\"" # todo: NEW TRANSLATION
 hint_war_exhaustion: "Vysoké vojnové vyčerpanie" # todo: NEW TRANSLATION
 hint_war_exhaustion_hint_text: "$hint_war_exhaustion_hint_text_1$\n\n$hint_war_exhaustion_hint_text_2$\n\n$hint_war_exhaustion_hint_text_3$" # todo: NEW TRANSLATION
 hint_war_exhaustion_hint_text_1: "[Concept('war_exhaustion_with_icon','Vojnová vyčerpanosť')|E] je hodnota predstavujúca únavu populácie z vedenia vojny. Vysoké hodnoty môžu byť pre krajinu mimoriadne nebezpečné. Ako sa war_exhaustion zvyšuje, znižuje sa bojová účinnosť našej [Concept('army_with_icon','armády')|E] a [Concept('levies_with_icon','branci')|E], rast [Concept('pops_with_icon','populácie')|E] a poškodzuje našu ekonomiku." # todo: CHANGED # todo: CONCEPT CASE
 hint_war_exhaustion_hint_text_2: "#T Odporúčané kroky:#!\n@arrow_bonus_tier_3! Najefektívnejšia a istá metóda je mier.\n@arrow_bonus_tier_2! Niektoré [Concept('laws_with_icon','zákony')|E] a [Concept('estate_privileges_with_icon','privilégiá stavov')|E] môžu pomôcť znižovať war_exhaustion v čase." # todo: CHANGED # todo: CONCEPT CASE
 hint_war_exhaustion_hint_text_3: "#T Extra tipy:#!\n@hint! Mali by sme tempo našich dobytí prispôsobiť a nevyhlasovať [Concept('wars_with_icon','vojny')|E], ak už máme vysoké war_exhaustion." # todo: CHANGED # todo: CONCEPT CASE
 hint_war_exhaustion_administrative: "\"Rozhodné vojny môžu priniesť výhody, ale obyvateľstvo unavené vojnou prináša len zlé dôsledky. Produkcia klesá, spotreba klesá, jednoducho - všetko klesá!\"" # todo: NEW TRANSLATION
 hint_war_exhaustion_military: "\"Vojnová únava môže byť nebezpečná, ale je primárne výsledkom zlých taktík. Obrovské straty a významné porážky rýchlo obrátili ľudí proti nám.\"" # todo: NEW TRANSLATION
 hint_war_exhaustion_diplomatic: "\"Prehra vo vojne nie je nikdy dobrá vec, ale utrpenie krutej porážky môže tiež viesť obyvateľstvo k pomste. Revanchizmus je mocný opiát.\"" # todo: NEW TRANSLATION
 hint_low_sailors: "Nedostatok námorníkov" # todo: NEW TRANSLATION
 hint_low_sailors_hint_text: "$hint_low_sailors_hint_text_1$\n\n$hint_low_sailors_hint_text_2$\n\n$hint_low_sailors_hint_text_3$" # todo: NEW TRANSLATION
 hint_low_sailors_hint_text_1: "$game_concept_sailors_desc$" # todo: NEW TRANSLATION
 hint_low_sailors_hint_text_2: "#T Odporúčané kroky:#!\n@arrow_bonus_tier_3! Ak sa spoliehame na [Concept('ships_with_icon','lode')|e] pri vedení vojny, nízky počet námořníkov výrazne obmedzí našu schopnosť obnoviť [Concept('navies_with_icon','námorné sily')|e], takže nie je múdre vyhlasovať [Concept('war_with_icon','vojna')|E], keď máme málo námořníkov.\n@arrow_bonus_tier_2! [Concept('explorations_with_icon','Prieskumy')|e] tiež vyžadujú námorníkov, takže ich treba správne plánovať." # todo: CHANGED # todo: CONCEPT CASE
 hint_low_sailors_hint_text_3: "#T Extra tipy:#!\n@hint! Produkciu námorníkov môžeme zlepšiť výstavbou rôznych [Concept('buildings_with_icon','budov')|E].\n@hint! [Concept('estate_privileges_with_icon','Privilégiá stavov')|E] a [Concept('laws_with_icon','zákony')|E] tiež môžu ovplyvniť potenciál námorníkov." # todo: CHANGED # todo: CONCEPT CASE
 hint_low_sailors_administrative: "\"Kto ovláda more, ovláda bohatstvo sveta. Silná námorná a námornícka tradícia ide ruka v ruke s obchodnou dominanciou.\"" # todo: NEW TRANSLATION
 hint_low_sailors_military: "\"Silné námorníctvo s dostatkom námorníkov umožňuje vyťažiť z ďalekých krajín i vnútrozemia. Dokonca aj vojaci pôsobiaci v zálohe profitujú z chránených zásobovacích liniek.\"" # todo: NEW TRANSLATION
 hint_low_sailors_diplomatic: "\"Námorné stavby často priamo ovplyvňujú náš obchodný potenciál. Stojí za to zvážiť synergie medzi týmito oblasťami.\"" # todo: NEW TRANSLATION
 hint_low_diplomats: "Málo diplomatov" # todo: NEW TRANSLATION
 hint_low_diplomats_hint_text: "$hint_low_diplomats_hint_text_1$\n\n$hint_low_diplomats_hint_text_2$\n\n$hint_low_diplomats_hint_text_3$" # todo: NEW TRANSLATION
 hint_low_diplomats_hint_text_1: "[Concept('diplomats_with_icon','Diplomati')|E] sú potrební na správu našich diplomatických vzťahov s inými krajinami. Mnohé akcie, ako Zlepšenie vzťahov, nás budú stáť diplomatov priebežne, zatiaľ čo jednorazové akcie majú spravidla fixné náklady." # todo: CHANGED # todo: CONCEPT CASE
 hint_low_diplomats_hint_text_2: "#T Odporúčané kroky:#!\n@arrow_bonus_tier_3! Zrušenie zlepšovania vzťahov s niektorými krajinami uvoľní našich diplomatov, ak ich nemáme dosť.\n@arrow_bonus_tier_2! Môžeme tiež získať viac diplomatov z iných zdrojov, ako sú [Concept('advances_with_icon','pokroky')|e]." # todo: CHANGED # todo: CONCEPT CASE
 hint_low_diplomats_hint_text_3: "#T Dodatočné tipy:#!\n@hint! Aj keď je dobré mať rezervu diplomatov pre príležitostné akcie, plánovanie využitia diplomatov v dlhodobom horizonte je tiež nevyhnutné pre úspech." # todo: NEW TRANSLATION
 hint_low_diplomats_administrative: "\"Udržiavanie dobrých vzťahov je kľúčom k ziskovému impériu! Prístup k väčším a lepším trhom bude nevyhnutne nasledovať po priateľstve s našimi susedmi.\"" # todo: NEW TRANSLATION
 hint_low_diplomats_military: "\"Diplomati môžu byť tiež použité na preukázanie našej nadvlády nad slabšími štátmi. Metódou priateľstva či hrozby—čím silnejší budeme, tým pravdepodobnejšie sa ostatní podvolia.\"" # todo: NEW TRANSLATION
 hint_low_diplomats_diplomatic: "\"Reforma a rozvoj našej vlády je istý spôsob, ako zlepšiť našu kapacitu pre ďalšiu diplomaciu. Samozrejme, niektoré kultúry sú k umeniu presviedčania jednoducho viac predisponované ako iné.\"" # todo: NEW TRANSLATION
 LOW_DIPLOMATS_HINT: "Nedostatok diplomatov!" # todo: NEW TRANSLATION
 hint_low_food_in_market: "Nedostatok potravín na trhu" # todo: NEW TRANSLATION
 hint_low_food_in_market_hint_text: "$hint_low_food_in_market_hint_text_1$\n\n$hint_low_food_in_market_hint_text_2$\n\n$hint_low_food_in_market_hint_text_3$" # todo: NEW TRANSLATION
 hint_low_food_in_market_hint_text_1: "Trhy potrebujú dostatok uloženého [Concept('food_with_icon','potravín')|E], aby zabezpečili svoje provincie. Bez toho môžu lokality patriace týmto provinciám hladovať [Concept('starving_with_icon','hladujúcim')|E]." # todo: CHANGED # todo: CONCEPT CASE
 hint_low_food_in_market_hint_text_2: "#T Odporúčané kroky:#!\n@arrow_bonus_tier_3! Zlepšenie [rgo_with_icon|e], ktoré produkujú jedlo, zvýši jeho zásobu.\n@arrow_bonus_tier_2! Môžeme [Concept('import_with_icon','dovoz')|e] jedlo zavedením [Concept('trades_with_icon','obchodmi')|e] na [Concept('goods_with_icon','tovary')|e] produkujúce jedlo." # todo: CHANGED # todo: CONCEPT CASE
 hint_low_food_in_market_hint_text_3: "#T Extra tipy:#!\n@hint! Zníženie počtu [Concept('buildings_with_icon','budov')|e] v [Concept('location_with_icon','lokalite')|e] tiež spôsobí, že [Concept('pops_with_icon','populácie')|e] sa vrátia k [Concept('subsistence_agriculture_with_icon','sebestačnému poľnohospodárstvu')|e]." # todo: CHANGED # todo: CONCEPT CASE
 HINT_MARKET_ENTRY: "[MARKET.GetName]" # todo: NEW TRANSLATION
 HINT_BUILDING_ENTRY: "[BUILDING_TYPE.GetName]" # todo: NEW TRANSLATION
 LOW_FOOD_CAP_TEXT: "[SelectLocalization( StringIsEmpty( GetListOfAvailableBuildingsWithModifier('merchant_capacity_from_building') ), Localize('LOW_FOOD_NO'), Localize( 'LOW_FOOD_YES' ) )]" # todo: NEW TRANSLATION
 LOW_FOOD_YES: "\n@arrow_bonus_tier_1! Ak máme [Concept('merchant_capacity_with_icon','obchodná kapacita')|E], môžeme vytvoriť dovoz jedla z iného trhu, ktorý má prebytok.\n\nAk nemáme kapacitu, výstavba budovy ako [GetListOfAvailableBuildingsWithModifier('merchant_capacity_from_building')] môže zvýšiť náš obchodný potenciál." # todo: CHANGED # todo: CONCEPT CASE
 LOW_FOOD_NO: "\n\nAk máme [Concept('merchant_capacity_with_icon','obchodná kapacita')|E], môžeme vytvoriť dovoz jedla z iného trhu, ktorý má prebytok." # todo: CHANGED # todo: CONCEPT CASE
 LOW_MARKET_FOOD_TEXT: "Zásoby [Concept('food_with_icon','potraviny')|E] v $LIST$ dosiahli kritické hodnoty.$LOW_FOOD_CAP_TEXT$" # todo: CHANGED # todo: CONCEPT CASE
 LOW_MARKET_FOOD_TEXT_BUILDINGS: "Zásoby [Concept('food_with_icon','potraviny')|E] v $LIST$ dosiahli kritické hodnoty.\n\nExistuje niekoľko vrstiev riešenia nedostatku jedla na trhu. Čím viac jedla lokácia produkuje, tým menší odlev to bude predstavovať pre provinciu a trh, ku ktorému patrí, a môže dokonca pomôcť iným lokalitám, ak generuje prebytok.\n\n\n@arrow_bonus_tier_3! [Concept('rgo_with_icon','R.G.O.')|e] sú hlavným zdrojom [food], najmä v lokalitách s vysokou [Concept('food_productivity_with_icon','produktivitou potravín')|e]. Mali by sme sa najprv zamerať na ich rozšírenie, ak má náš [market] nedostatok [food].\n@arrow_bonus_tier_2! [Concept('buildings_with_icon','Budovy')|E] ako $BUILDING_LIST$ môžu tiež zvýšiť produkciu jedla, ak produkcia [Concept('goods_with_icon','tovary')|E] súhlasí.$LOW_FOOD_CAP_TEXT$" # todo: CHANGED # todo: CONCEPT CASE
 hint_low_food_in_market_administrative: "\"Trhy s lokalitami špecializovanými na výrobu potravín ponúkajú bezpečie aj obrovský ziskový potenciál. Ak ostatní budú musieť prichádzať k nám, aby prežili, získame takmer neobmedzený vplyv.\"" # todo: NEW TRANSLATION
 hint_low_food_in_market_military: "\"Kým je naša obchodná kapacita obmedzená infraštruktúrou, dovozná ekonomika musí byť zvyčajne podporená silnou námornou prítomnosťou. Bez nej sa vystavíme na milosť každému, kto odváži ohroziť naše obchodné trasy.\"" # todo: NEW TRANSLATION
 hint_low_food_in_market_diplomatic: "\"Sebaudržiavacia ekonomika potravín je pekný cieľ, ale prevádzka dovoznej ekonomiky na nakŕmenie [GetPlayer.GetAdjectiveWithNoTooltip] obyvateľstva nám môže dať silu sústrediť sa na výnosnejšiu produkciu.\"" # todo: NEW TRANSLATION
 hint_over_diplo_capacity: "Presiahnutá diplomatická kapacita" # todo: NEW TRANSLATION
 hint_over_diplo_capacity_hint_text: "$hint_over_diplo_capacity_hint_text_1$\n\n$hint_over_diplo_capacity_hint_text_2$\n\n$hint_over_diplo_capacity_hint_text_3$" # todo: NEW TRANSLATION
 hint_over_diplo_capacity_hint_text_1: "Spoliehať sa na spojenectvá so všetkými znamená mať spojenectvo s nikým. [Concept('country_with_icon','Krajina')|e], ktorá má viac vzťahov než jej diplomatickej kapacity, utrpí penalizáciu k [Concept('diplomatic_reputation_with_icon','diplomatickej reputácii')|e] a [Concept('prestige_with_icon','prestíži')|e]. Niektoré [Concept('subject_types_with_icon','druhom vazalov')|e] majú [Concept('diplomatic_upkeep','diplomatické náklady')], čo znižuje dostupnú kapacitu.\n\nČlenstvo v niektorých [Concept('international_organizations_with_icon','medzinárodných organizáciách')|e] bude stáť časť diplomatickej kapacity a sila vášho [Concept('ally_with_icon','spojenca')|e] určuje cenu [Concept('alliance_with_icon','alianciu')|e]." # todo: CHANGED # todo: CONCEPT CASE
 hint_over_diplo_capacity_hint_text_2: "#T Odporúčané kroky:#!\n@arrow_bonus_tier_3! Zastavenie zlepšovania vzťahov našimi [Concept('diplomats_with_icon','diplomatmi')|E] uvoľní kapacitu.\n@arrow_bonus_tier_2! Zvážte ukončenie niektorých [Concept('alliances_with_icon','aliancie')|E] alebo [Concept('treaties_with_icon','dohody')|E].\n@arrow_bonus_tier_1! Odchod z [Concept('international_organizations_with_icon','medzinárodných organizácií')|E], ktorých už nepotrebujeme, je ďalší spôsob uvoľnenia kapacity." # todo: CHANGED # todo: CONCEPT CASE
 hint_over_diplo_capacity_hint_text_3: "#T Extra tipy:#!\n@hint! [Concept('estate_privileges_with_icon','Privilégiá stavov')|E], [Concept('laws_with_icon','zákony')|E] a [Concept('advances_with_icon','pokroky')|E] môžu niekedy prideliť ďalšiu diplomatickú kapacitu." # todo: CHANGED # todo: CONCEPT CASE
 hint_over_diplo_capacity_military: "\"Možno by sme mali považovať aliancie za prostriedok k dosiahnutiu cieľa, nie za trvalé priateľstvo. Veď aj naši vlastní spojenci nás budú chamtivo pozerať, ak ukážeme slabosť...\"" # todo: NEW TRANSLATION
 hint_over_diplo_capacity_administrative: "\"Preťažovanie našich diplomatov má nežiaduce následky znižujúce ich efektivitu takmer vo všetkých úlohách. Aj keď môže byť lákavé nechať ich preťažených, nie je to dobré dlhodobé riešenie.\"" # todo: NEW TRANSLATION
 hint_over_diplo_capacity_diplomatic: "\"Ak uprednostníme náš vnútorný rozvoj, silné aliancie viac než vykompenzujú akékoľvek vnímané vojenské slabosti. Možno by sme mali najprv zrušiť iné vzťahy?\"" # todo: NEW TRANSLATION
 hint_rebels_growing: "Povstalecké hnutia" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 hint_rebels_growing_hint_text: "$hint_rebels_growing_hint_text_1$\n\n$hint_rebels_growing_hint_text_2$\n\n$hint_rebels_growing_hint_text_3$" # todo: NEW TRANSLATION
 hint_rebels_growing_hint_text_1: "Vaše [Concept('pops_with_icon','populácie')|e] sa pripoja k [Concept('rebel_movements_with_icon','povstaleckým hnutiam')|e], keď ich [Concept('pop_satisfaction_with_icon','spokojnosť populácie')|e] klesne pod [ShowModifierTypeName('pop_join_rebel_threshold')].\n\n[rebel_movements] budú každý mesiac získavať pokrok smerom k otvorenému povstaniu v závislosti od ich podpory. Keď dosiahnu #W 100%#! podporu, začnú [Concept('revolt_with_icon','povstanie')|e], alebo [Concept('civil_war_with_icon','občianska vojna')|e].\n\nNajčastejšie dôvody podpory povstalcov sú nízke [Concept('stability_with_icon','stabilita')|e], diskriminované [Concept('cultures_with_icon','kultúry')|e] a [Concept('religions_with_icon','náboženstvá')|e], a rozzúrené [Concept('estates_with_icon','stavy')|e]." # todo: CHANGED # todo: CONCEPT CASE
 hint_rebels_growing_hint_text_2: "#T Odporúčané kroky:#!\n@arrow_bonus_tier_3! Udržiavajte [Concept('stability_with_icon','stabilita')|e] a [Concept('legitimacy_with_icon','legitimita')|e] čo najvyššie.\n@arrow_bonus_tier_2! Použite [ShowCabinetActionName('rebel_crackdown')] [Concept('cabinet_action_with_icon','akcia kabinetu')|e] na zastavenie postupu blížiaceho sa [rebellion].\n@arrow_bonus_tier_1! Presuňte [Concept('army_with_icon','armáda')|e] do [Concept('province_with_icon','provincie')|e] s nespokojnými [pops]. Prítomnosť vašich vojsk ich urobí viac... #italic porozumenými#!.\n\nNakoniec je to zvýšenie [pop_satisfaction_icon] spokojnosti rebelských [pops], čo najviac záleží:\n@arrow_bonus_tier_2! Uistite sa, že najpočetnejšie [cultures] vo vašej [country] sú [Concept('accepted_culture_short_with_icon','akceptovaná')|e] alebo [Concept('tolerated_culture_short_with_icon','tolerovaná')|e].\n@arrow_bonus_tier_1! Zabezpečte, aby rebeli mali prístup k zakúpeniu čo najviac svojich [Concept('pop_needs_with_icon','potrieb populácie')|e] na svojom [Concept('market_with_icon','trh')|e].\n@arrow_bonus_tier_3! Udržiavajte vysokú [estate_icon] [Concept('estate_satisfaction_with_icon','spokojnosti stavu')|e], pretože to silne ovplyvňuje spokojnosť všetkých jej príslušných [pops]:\n$TAB$@arrow_bonus_tier_2! Udeľte [Concept('privilege_with_icon','privilégium')|e]\n$TAB$@arrow_bonus_tier_2! Úplatkujte [estate]\n$TAB$@arrow_bonus_tier_2! Znížte [Concept('taxes_with_icon','dane')|e]" # todo: CHANGED # todo: CONCEPT CASE
 hint_rebels_growing_hint_text_3: "#T Extra tipy:#!\n@hint! [Concept('societal_values_with_icon','Sociálne hodnoty')|E] ako [ShowSocietyDirectionName('communalism')] a [ShowSocietyDirectionName('decentralization')] môžu tiež ovplyvniť pravdepodobnosť rastu rebelov.\n@hint! Rebeli vzniknú v rôznych [rebel_movements] v závislosti od rôznych faktorov. Napríklad [pops] diskriminovanej [culture] budú viac inklinovať k [Concept('nationalist_rebels_with_icon','nacionalistickým povstalcom')|e]." # todo: CHANGED # todo: CONCEPT CASE
 hint_rebels_growing_military: "\"Môžu vyzerať tvrdí, ale pri obyčajných ľuďoch sú zvyčajne viac rečou než skutkom. To, čo im často chýba na disciplíne, viac než vykompenzujú počtom.\"" # todo: NEW TRANSLATION
 hint_rebels_growing_administrative: "\"Aj keď sú rebeli určite zlé pre obchod, zvyčajne sú reaktívni — ak vyriešite príčinu ich nepokojov, nielen ich upokojíte, ale aj zlepšíte našu krajinu.\"" # todo: NEW TRANSLATION
 hint_rebels_growing_diplomatic: "\"Naše obyvateľstvo má rôzne identity a príslušnosti. Dobyté národy sú omnoho pravdepodobnejšie, že sa budú chcieť odlúčiť a vytvoriť vlastnú vládu alebo sa dokonca pripojiť k cudzej sile.\"" # todo: NEW TRANSLATION
 hint_call_for_peace: "Výzva na mier" # todo: NEW TRANSLATION
 hint_call_for_peace_hint_text: "$hint_call_for_peace_hint_text_1$\n\n$hint_call_for_peace_hint_text_2$\n\n$hint_call_for_peace_hint_text_3$" # todo: NEW TRANSLATION
 hint_call_for_peace_hint_text_1: "Tento stav sa môže objaviť, ak konkrétna [Concept('war_with_icon','vojna')|E] pretrváva príliš dlho alebo ak odmietneme podpísať [Concept('peace_treaty_with_icon','mierová dohoda')|E] napriek celkovému víťazstvu alebo porážke." # todo: CHANGED # todo: CONCEPT CASE
 hint_call_for_peace_hint_text_2: "#T Odporúčané kroky:#!\n@arrow_bonus_tier_3! Mali by sme zredukovať straty a podpísať mier skôr, než náš [Concept('war_exhaustion_with_icon','vojnová vyčerpanosť')|E] dosiahne kritické hodnoty.\n@arrow_bonus_tier_2! Môže to znamenať, že prijmeme menej, než sme pôvodne požadovali, alebo dokonca stratíme [Concept('war_with_icon','vojna')|e]." # todo: CHANGED # todo: CONCEPT CASE
 hint_call_for_peace_hint_text_3: "#T Extra tipy:#!\n@hint! Čokoľvek stratené kvôli nutnosti podpísať predčasnú [Concept('peace_treaty_with_icon','mierovú dohodu')|e] možno získať neskôr v inej [Concept('war_with_icon','vojne')|e]." # todo: CHANGED # todo: CONCEPT CASE
 hint_call_for_peace_diplomatic: "\"Frustrácia pravidiel vojny môže mať skutočne devastujúce následky pre našu vnútornú stabilitu a našu reputáciu v zahraničí. Prečo by nás mal niekto počúvať, ak sa ukážeme ako nerozumní?\"" # todo: NEW TRANSLATION
 hint_call_for_peace_military: "\"Vojna je len pokračovaním politiky inými prostriedkami. Možno by sme to mali zapísať skôr, než to urobí niekto iný?\"" # todo: NEW TRANSLATION
 hint_call_for_peace_administrative: "\"Výzva na mier bude s časom len horšia. Ľud je možné upokojiť, ale nie navždy ignorovať.\"" # todo: NEW TRANSLATION
 hint_unprofitable_buildings: "Nevýnosné budovy" # todo: NEW TRANSLATION
 hint_unprofitable_buildings_hint_text: "$hint_unprofitable_buildings_hint_text_1$\n\n$hint_unprofitable_buildings_hint_text_2$\n\n$hint_unprofitable_buildings_hint_text_3$" # todo: NEW TRANSLATION
 hint_unprofitable_buildings_hint_text_1: "Budovy sa stanú neziskovými, ak náklady na ich kombinované vstupné [Concept('goods_with_icon','tovary')|E] presiahnu hodnotu ich [Concept('produced_goods_with_icon','vyrábané tovary')|E]." # todo: CHANGED # todo: CONCEPT CASE
 hint_unprofitable_buildings_hint_text_2: "#T Odporúčané kroky:#!\n@arrow_bonus_tier_3! Zabezpečte, aby vstupné suroviny boli lacnejšie tým, že ich vyrábate alebo [Concept('importing_with_icon','dovážate')|E] viac, aby bola ich ponuka dostatočná.\n@arrow_bonus_tier_3! Vytvorenie alebo zabezpečenie ďalšieho dopytu po tovaroch zvýši ich cenu.\n@arrow_bonus_tier_3! [Concept('buildings_with_icon','Budovy')|E] možno zatvoriť @building_open! alebo dokonca zničiť, ak už nespĺňajú účel.\n@arrow_bonus_tier_3! [Concept('market_owner_with_icon','Majiteľ trhu')|E] môže uvaliť embargo na krajiny vyvážajúce tovary, ktoré produkuje, aby zvýšil cenu vlastného exportu." # todo: CHANGED # todo: CONCEPT CASE
 hint_unprofitable_buildings_hint_text_3: "#T Extra tipy:#!\n@hint! Niektoré budovy možno [Concept('subsidized_with_icon','dotované')|E]. To môže byť užitočné, ak sú náklady na [Concept('import_with_icon','dovoz')|E] tovarov potrebných pre [Concept('pop_needs_with_icon','potreby populácie')|E] alebo udržanie armády vysoké." # todo: CHANGED # todo: CONCEPT CASE
 hint_unprofitable_buildings_diplomatic: "\"Riadenie ziskovosti priemyslu celej krajiny môže byť náročná úloha. Môžete zapojiť pomoc byrokracie vašej krajiny, ak sa nechcete zaoberať detailmi!\"" # todo: NEW TRANSLATION
 hint_unprofitable_buildings_military: "\"Čím sme silnejší, tým väčšia je naša schopnosť uplatňovať ochrannú politiku. Embargá a obchodné spory sú vždy účinnejšie, keď sú podporené kanónmi.\"" # todo: NEW TRANSLATION
 hint_unprofitable_buildings_administrative: "\"Stratégia manipulácie cien má mnoho vrstiev. S dostatočnou prefíkanosťou môžeme nielen vytvoriť dopyt na trhu, ale aj byť tými, čo ho uspokoja.\"" # todo: NEW TRANSLATION
 NO_HINTS_AVAILABLE: "Žiadne nápovedy k dispozícii!" # todo: NEW TRANSLATION
 hint_trade: "Obchod" # todo: NEW TRANSLATION
 hint_trade_hint_text: "$hint_trade_hint_text_1$\n\n$hint_trade_hint_text_2$\n\n$hint_trade_hint_text_3$" # todo: NEW TRANSLATION
 hint_trade_hint_text_1: "[Concept('trade_with_icon','Obchod')|E] zahŕňa presun [Concept('goods_with_icon','tovary')|E] medzi [Concept('markets_with_icon','trhmi')|E] a ich predaj a nákup na týchto trhoch." # todo: CHANGED # todo: CONCEPT CASE
 hint_trade_hint_text_2: "#T Odporúčané kroky:#!\n@arrow_bonus_tier_3! Založte nové [Concept('trade_with_icon','obchod')|E] trasy na získanie [Concept('goods_with_icon','tovary')|e].\n@arrow_bonus_tier_2! Zvýšte produkciu [Concept('goods_with_icon','tovary')|e], aby ste ich mali viac na obchod." # todo: CHANGED # todo: CONCEPT CASE
 hint_trade_hint_text_3: "#T Extra tipy:#!\n@hint! [Concept('trade_with_icon','Obchod')|E] trasa môže byť zisková alebo stratová v závislosti od cenového rozdielu medzi [Concept('export_with_icon','vývozom')|E] (zdroj) a [Concept('import_with_icon','dovoz')|E] (cieľ) [Concept('markets_with_icon','trhy')|E].\n@hint! Každá [Concept('country_with_icon','krajina')|E] prítomná na [Concept('market_with_icon','trh')|E] má maximálnu [Concept('merchant_capacity_with_icon','neobchodnú kapacitu')|E], ktorú môže využiť na vytváranie [Concept('trade_with_icon','obchod')|E] trás, a [Concept('merchant_power_with_icon','obchodná výhoda')|E], ktorý určuje prioritu pri exporte [Concept('goods_with_icon','tovaroch')|E] v prípade nedostatku.\n@hint! Obchod je možné automatizovať v každom jednotlivom [Concept('market_with_icon','trhu')|E] predvolením kliknutím na súvisiace ozubené koliesko." # todo: CHANGED # todo: CONCEPT CASE
 hint_trade_military: "\"Obchod je pre slabochov. Napriek tomu budeme v pozícii vynucovať tok tovaru ovládaním pevniny a mora.\"" # todo: NEW TRANSLATION
 hint_trade_administrative: "\"Jadro našej stratégie: Predpovedať ďalšiu vlnu cien cez hod kockami a nebeské zarovnanie hviezd.\"" # todo: NEW TRANSLATION
 hint_trade_diplomatic: "\"Jeden z neodmysliteľných pilierov zrelého impéria, obchod má potenciál naplniť naše truhlice rýchlejšie než čokoľvek iné.\"" # todo: NEW TRANSLATION
 hint_unused_trade_capacity: "Nevyužitá obchodná kapacita" # todo: NEW TRANSLATION
 hint_unused_trade_capacity_hint_text: "$hint_unused_trade_capacity_hint_text_1$\n\n$hint_unused_trade_capacity_hint_text_2$\n\n$hint_unused_trade_capacity_hint_text_3$" # todo: NEW TRANSLATION
 hint_unused_trade_capacity_hint_text_1: "[Concept('merchant_capacity_with_icon','Obchodná kapacita')|e] sa používa na presun [Concept('goods_with_icon','tovary')|e] medzi [Concept('markets_with_icon','trhmi')|e], s očakávaním zisku v procese. Mali by sme vždy využívať všetku našu [merchant_capacity]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 hint_unused_trade_capacity_hint_text_2: "#T Odporúčané kroky:#!\n@arrow_bonus_tier_1! Kliknite na Upozornenie, aby ste videli ovplyvnený trh v @economy_panel! [Link('trade', 'subtab = markets', 'Markets Panel')]. Odtiaľ môžete priradiť obchodnú kapacitu k navrhovaným obchodom.\n@arrow_bonus_tier_1! Môžete tiež kliknúť na hlavičku trhu a prejsť do Panelu trhu, kde uvidíte zoznam [Concept('goods_with_icon','tovary')|e] relevantných pre daný trh. Kliknite na tlačidlá Export/Import pri každom [good], aby ste spustili obchod.\n@automation! Odporúča sa automatizovať obchod vo všetkých vašich trhoch stlačením ozubeného kolieska v karte trhu. Vždy môžete manuálne vytvoriť a zablokovať obchody, aj keď je obchod automatizovaný." # todo: CHANGED # todo: CONCEPT CASE
 hint_unused_trade_capacity_hint_text_3: "#T Dodatočné tipy:#!\n@hint! Zisk z [trade] sa delí medzi [Concept('estates_with_icon','stavmi')|e], vrátane [ShowEstateTypeName('crown_estate')], podľa ich [Concept('estate_power_with_icon','sila stavu')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 hint_unused_trade_capacity_military: "\"Pokiaľ ide o možnosť hlúpeho využívania našich zdrojov, som tomu absolútne proti.\"" # todo: NEW TRANSLATION
 hint_unused_trade_capacity_administrative: "\"Musíme sa čo najskôr vrátiť na efektívnu hranicu.\"" # todo: NEW TRANSLATION
 hint_unused_trade_capacity_diplomatic: "\"Nevyužitú obchodnú kapacitu možno prirovnať k ležiacemu poli, ktoré už dávno čaká na ďalšie osivo.\"" # todo: NEW TRANSLATION
 hint_unprofitable_trade_route: "Nevýnosná obchodná trasa" # todo: NEW TRANSLATION
 hint_unprofitable_trade_route_hint_text: "$hint_unprofitable_trade_route_hint_text_1$\n\n$hint_unprofitable_trade_route_hint_text_2$\n\n$hint_unprofitable_trade_route_hint_text_3$" # todo: NEW TRANSLATION
 hint_unprofitable_trade_route_hint_text_1: "Vo väčšine prípadov, ak máte stratovú [Concept('trade_with_icon','obchod')|E] trasu, chcete ju zrušiť a nahradiť ziskovou trasou, alebo zapnúť automatizáciu pre daný [Concept('market_with_icon','trh')|E]." # todo: CHANGED # todo: CONCEPT CASE
 hint_unprofitable_trade_route_hint_text_2: "#T Odporúčané kroky:#!\n@arrow_bonus_tier_1! Niekedy má zmysel prerábať peniaze na obchodnej trase, ak sú [Concept('goods_with_icon','tovary')|E] strategicky dôležité.\n@arrow_bonus_tier_1! Príkladom by bolo získavanie dreva na dokončenie [Concept('building_with_icon','budova')|E]. Ďalším dôvodom môže byť zabezpečenie potravy pre naše [Concept('pops_with_icon','populácie')|E]." # todo: CHANGED # todo: CONCEPT CASE
 hint_unprofitable_trade_route_hint_text_3: "#T Extra tipy:#!\n@hint! Nepriame ovplyvnenie ziskovosti existujúcej [Concept('trade_with_icon','obchodu')|E] trasy je možné zmenou cien (a teda cenového rozdielu pre obchodovaný [Concept('good_with_icon','tovar')|E]) zapojených [Concept('markets_with_icon','trhy')|E]. To urobíte ovplyvnením [Concept('supply_with_icon','ponukou')|E] a [Concept('demand_with_icon','dopyt')|E] pre daný [Concept('good_with_icon','tovar')|E]." # todo: CHANGED # todo: CONCEPT CASE
 hint_unprofitable_trade_route_military: "\"Možno by sme im mali ich tovar vziať namiesto toho, aby sme zaň platili?\"" # todo: NEW TRANSLATION
 hint_unprofitable_trade_route_administrative: "\"Minimalizujte straty čo najrýchlejšie. Obchod nie je charita.\"" # todo: NEW TRANSLATION
 hint_unprofitable_trade_route_diplomatic: "\"Nedokonalosť vzniká v prírodnom poriadku vecí a je na nás, aby sme ju upravili.\"" # todo: NEW TRANSLATION
 hint_market_out_of_supply: "Trh bez zásob" # todo: NEW TRANSLATION
 hint_market_out_of_supply_hint_text: "$hint_market_out_of_supply_hint_text_1$\n\n$hint_market_out_of_supply_hint_text_2$\n\n$hint_market_out_of_supply_hint_text_3$" # todo: NEW TRANSLATION
 hint_market_out_of_supply_hint_text_1: "Ak má [Concept('market_with_icon','trh')|e] príliš vysoký celkový [Concept('demand_with_icon','dopyt')|E] v porovnaní s konečnou [Concept('supply_with_icon','ponukou')|E], nemusíme získať [Concept('goods_with_icon','tovary')|E], ktoré sa pokúšame [Concept('export_with_icon','vývoz')|E] alebo [Concept('import_with_icon','dovoz')|E], čo vedie k nedostatku tovaru." # todo: CHANGED # todo: CONCEPT CASE
 hint_market_out_of_supply_hint_text_2: "#T Odporúčané kroky:#!\n@arrow_bonus_tier_3! Môžeme okamžite zrušiť stratové [Concept('trade_with_icon','obchod')|E] trasy a použiť túto [Concept('merchant_capacity_with_icon','neobchodnú kapacitu')|E] na iné typy [Concept('goods_with_icon','tovary')|E].\n@arrow_bonus_tier_1! Zvýšenie našej [Concept('merchant_power_with_icon','neobchodnej výhody')|E] na dotknutom [Concept('market_with_icon','trh')|E] nám môže umožniť väčší prístup k jeho tovarom." # todo: CHANGED # todo: CONCEPT CASE
 hint_market_out_of_supply_hint_text_3: "#T Extra tipy:#!\n@hint! [Concept('merchant_power_with_icon','Obchodná výhoda')|e] možno získať z rôznych zdrojov ako [Concept('advances_with_icon','pokroky')|e], [Concept('privileges_with_icon','privilégiá')|e], [Concept('policies_with_icon','politiky')|e] atď.\n@hint! Môžeme sa tiež pokúsiť zvýšiť [Concept('supply_with_icon','ponuka')|E], ale to môže byť ťažké urobiť krátkodobo a zvyčajne vyžaduje dlhodobé strategické plánovanie." # todo: CHANGED # todo: CONCEPT CASE
 hint_market_out_of_supply_military: "\"Občas nebude dostupného tovaru na export na podporu nášho vojnového stroja. Treba to rýchlo riešiť.\"" # todo: NEW TRANSLATION
 hint_market_out_of_supply_administrative: "\"Zvážte zvýšenie našej úplne férovej obchodnej výhody akýmikoľvek prostriedkami, ktoré sú dostupné.\"" # todo: NEW TRANSLATION
 hint_market_out_of_supply_diplomatic: "\"Možno musíme podniknúť kroky na diverzifikáciu našich obchodných operácií a vyhnúť sa monokultúre.\"" # todo: NEW TRANSLATION
 hint_increasing_trade_capacity: "Zvyšovanie obchodnej kapacity" # todo: NEW TRANSLATION
 hint_increasing_trade_capacity_hint_text: "$hint_increasing_trade_capacity_hint_text_1$\n\n$hint_increasing_trade_capacity_hint_text_2$\n\n$hint_increasing_trade_capacity_hint_text_3$" # todo: NEW TRANSLATION
 hint_increasing_trade_capacity_hint_text_1: "[Concept('merchant_capacity_with_icon','Obchodná kapacita')|e] určuje množstvo [Concept('trade_with_icon','obchod')|e], ktoré môže [Concept('country_with_icon','krajina')|e] vykonávať." # todo: CHANGED # todo: CONCEPT CASE
 hint_increasing_trade_capacity_hint_text_2: "#T Odporúčané kroky:#!\n@arrow_bonus_tier_3! Postavte viac [Concept('buildings_with_icon','budovy')|e], ktoré zvyšujú kapacitu, napríklad [ShowBuildingTypeName('marketplace')] alebo [ShowBuildingTypeName('market_village')].\n@arrow_bonus_tier_2! Niektoré [Concept('advances_with_icon','pokroky')|e] alebo [Concept('laws_with_icon','zákony')|e] môžu tiež zvýšiť našu [Concept('merchant_capacity_with_icon','neobchodnú kapacitu')|e]." # todo: CHANGED # todo: CONCEPT CASE
 hint_increasing_trade_capacity_hint_text_3: "#T Extra tipy:#!\n@hint! Viac [Concept('merchant_capacity_with_icon','obchodná kapacita')|e] umožňuje viac položiek v obchode, čo vedie k vyššiemu [Concept('income_with_icon','príjmu')|e]." # todo: CHANGED # todo: CONCEPT CASE
 hint_increasing_trade_capacity_military: "\"Čím väčšie bude naše impérium, tým väčšiu obchodnú kapacitu budeme mať. Je to takmer tautológia.\"" # todo: NEW TRANSLATION
 hint_increasing_trade_capacity_administrative: "\"Riešenie obchodnej kapacity, podobne ako všetky ľudské problémy, spočíva v mať viac trhov.\"" # todo: NEW TRANSLATION
 hint_increasing_trade_capacity_diplomatic: "\"Zabezpečte rastúci tok obchodu vytváraním základov pre trhovú výmenu vždy, keď je to možné.\"" # todo: NEW TRANSLATION
 hint_increasing_trade_advantage: "Obchodná výhoda" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 hint_increasing_trade_advantage_hint_text: "$hint_increasing_trade_advantage_hint_text_1$\n\n$hint_increasing_trade_advantage_hint_text_2$\n\n$hint_increasing_trade_advantage_hint_text_3$" # todo: NEW TRANSLATION
 hint_increasing_trade_advantage_hint_text_1: "[Concept('merchant_power_with_icon','Obchodná výhoda')|e] určuje, ktorá [Concept('country_with_icon','krajina')|e] má prístup k [Concept('goods_with_icon','tovarom')|e] daného [Concept('market_with_icon','trhu')|e] ako prvá pre účely [Concept('trade_with_icon','obchod')|e].\n\nAk dve obchodujúce [countries] pokúšajú získať [good] a nie je ho dosť pre oboch, prvé ho kúpi krajina s vyššou [merchant_power].\n\nUpozorňujeme, že [merchant_power] sa vzťahuje len na obchod. [Concept('locations_with_icon','Lokality')|e] namiesto toho pri nákupe [goods] pre [Concept('constructions_with_icon','výstavby')|e] alebo [Concept('pop_needs_with_icon','potreby populácie')|e] nasledujú poradie [Concept('market_access_with_icon','prístup na trh')|e]." # todo: CHANGED # todo: CONCEPT CASE
 hint_increasing_trade_advantage_hint_text_2: "#T Odporúčané akcie:#!\n@arrow_bonus_tier_3! Vlastnite viac [Concept('locations_with_icon','lokality')|e] patriacich danému [market].\n@arrow_bonus_tier_2! Zvýšte [Concept('maritime_presence_with_icon','námorná prítomnosť')|e] na pobrežných vodách daného [market].\n@arrow_bonus_tier_1! Niektoré [Concept('buildings_with_icon','budovy')|e], ako napríklad [ShowBuildingTypeName('marketplace')], tiež zvyšujú [merchant_power]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 hint_increasing_trade_advantage_hint_text_3: "#T Ďalšie tipy:#!\n@hint! #italic Ak sa chcete dozvedieť viac, môžete si pozrieť [Link('hints', 'selected_hint = hint_trade', 'Obchod')] a [Link('hints', 'selected_hint = hint_maritime', 'Námorná prítomnosť')] Nápovedy#!" # todo: CHANGED
 hint_increasing_trade_advantage_military: "\"Keďže obchod je skôr konkurenčný než kooperatívny podnik, nadobudnutie výhody v obchode je prirodzený poriadok vecí.\"" # todo: NEW TRANSLATION
 hint_increasing_trade_advantage_administrative: "\"Jadro našej stratégie: Predpovedať ďalšiu vlnu cien cez hod kockami a nebeské zarovnanie hviezd.\"" # todo: NEW TRANSLATION
 hint_increasing_trade_advantage_diplomatic: "\"Jeden z neodmysliteľných pilierov zrelého impéria, obchod má potenciál naplniť naše truhlice rýchlejšie než čokoľvek iné.\"" # todo: NEW TRANSLATION
 hint_pops_with_needs_yellow: "Pops požadujúci tovar" # todo: NEW TRANSLATION
 hint_pops_with_needs_yellow_hint_text: "$hint_pops_with_needs_yellow_hint_text_1$\n\n$hint_pops_with_needs_yellow_hint_text_2$\n\n$hint_pops_with_needs_yellow_hint_text_3$" # todo: NEW TRANSLATION
 hint_pops_with_needs_yellow_hint_text_1: "[Concept('pops_with_icon','Populácie')|e] sa budú snažiť kúpiť si [Concept('goods_with_icon','tovarom')|e], ktoré potrebujú, na [Concept('market_with_icon','trh')|e] svojej [Concept('location_with_icon','lokalitu')|e]. Ak [pops] nedokážu kúpiť všetky požadované [goods], ich [Concept('pop_satisfaction_with_icon','spokojnosť populácie')|e] klesne. Ak ich spokojnosť klesne pod [ShowModifierTypeName('pop_join_rebel_threshold')], môžu sa začať pridávať k [Concept('rebellion_with_icon','povstaniu')|e] proti [government]." # todo: CHANGED # todo: CONCEPT CASE
 hint_pops_with_needs_yellow_hint_text_2: "#T Odporúčané kroky:#!\n@arrow_bonus_tier_3! Udržiavajte vysoké [Concept('stability_with_icon','stabilita')|e], [Concept('legitimacy_with_icon','legitimita')|e] a [Concept('estate_satisfaction_with_icon','spokojnosť stavu')|e], aby ste zabránili [rebellions].\n@arrow_bonus_tier_1! Rozšírte produkciu požadovaných [Concept('goods_with_icon','tovary')|e] výstavbou [rgo_with_icon|e] a [Concept('buildings_with_icon','budovy')|e] v @production_panel! [Link('goods_production', '', 'lateralview_goods_production_entry_name')].\n@arrow_bonus_tier_1! Dovážajte [goods] z iných trhov pomocou [Concept('merchant_capacity_with_icon','neobchodnej kapacity')|e]." # todo: CHANGED # todo: CONCEPT CASE
 hint_pops_with_needs_yellow_hint_text_3: "#T Dodatočné tipy:#!\n@hint! Mať nespokojené požiadavky Popov nemusí byť nutne znepokojujúce, pokiaľ [pops] nerebelujú. Poskytuje to však prehľad o stave [market].\n@hint! Požiadavky Popov sú len jedným z faktorov ovplyvňujúcich [pop_satisfaction]. Aj keď budú všetky ich potreby uspokojené, ľudia sa stále môžu vzbúriť z iných dôvodov.\n@hint! Viac o [rebel_movements_with_icon] sa dozviete v [Link('hints', 'selected_hint = hint_rebels_growing', 'Rebels Hint')]." # todo: NEW TRANSLATION
 hint_pops_with_needs_yellow_military: "\"Mocný vládca by sa nemal starať o rozmarnosti pokorných.\"" # todo: NEW TRANSLATION
 hint_pops_with_needs_yellow_administrative: "\"Kde nezaujaté oko vidí chudobné obyvateľstvo, ja vidím zázračnú príležitosť na zisk.\"" # todo: NEW TRANSLATION
 hint_pops_with_needs_yellow_diplomatic: "\"Ľudia vždy budú požadovať viac, než im patrí. Ale buďte opatrní. Nedostatky, ak sa neodstránia, môžu povzbudiť vašich poddaných k povstaniu.\"" # todo: NEW TRANSLATION
 hint_pops_with_needs_red: "Rebeliujúci Pops požadujúci tovar" # todo: NEW TRANSLATION
 hint_pops_with_needs_red_hint_text: "$hint_pops_with_needs_yellow_hint_text_1$\n\n$hint_pops_with_needs_red_hint_text_1$\n\n$hint_pops_with_needs_red_hint_text_2$\n\n$hint_pops_with_needs_red_hint_text_3$" # todo: NEW TRANSLATION
 hint_pops_with_needs_red_hint_text_1: "Niektorí z našich [pops] sa momentálne pridávajú k [rebel_movements]. Zvýšenie zásob požadovaných [goods] by mohlo presvedčiť niektorých z nich, aby opustili [rebellions]." # todo: NEW TRANSLATION
 hint_pops_with_needs_red_hint_text_2: "#T Odporúčané kroky:#!\n@arrow_bonus_tier_3! Zvýšte [Concept('stability_with_icon','stabilita')|e], [Concept('legitimacy_with_icon','legitimita')|e] a [Concept('estate_satisfaction_with_icon','spokojnosť stavu')|e].\n@arrow_bonus_tier_1! Rozšírte produkciu požadovaných [Concept('goods_with_icon','tovary')|e] výstavbou [rgo_with_icon|e] a [Concept('buildings_with_icon','budovy')|e] v @production_panel! [Link('goods_production', '', 'lateralview_goods_production_entry_name')].\n@arrow_bonus_tier_1! Dovážajte [goods] z iných trhov pomocou [Concept('merchant_capacity_with_icon','neobchodnej kapacity')|e]\n@arrow_bonus_tier_1! Ak nič nepomôže, pripravte naše [Concept('armies_with_icon','armády')|e] na zásah proti povstalcom." # todo: CHANGED # todo: CONCEPT CASE
 hint_pops_with_needs_red_hint_text_3: "#T Ďalšie tipy:#!\n@hint! Požiadavky obyvateľstva sú len jedným z faktorov ovplyvňujúcich [pop_satisfaction]. Aj keď budú všetky ich potreby uspokojené, ľudia sa stále môžu vzbúriť z iných dôvodov.\n@hint! Dozviete sa viac o [rebel_movements_with_icon] v [Link('hints', 'selected_hint = hint_rebels_growing', 'Rebels Hint')]." # todo: NEW TRANSLATION
 hint_pops_with_needs_red_diplomatic: "\"Zaručenie dodávok kľúčových tovarov môže postačiť na utlmenie rozkolu medzi našimi ľuďmi.\"" # todo: NEW TRANSLATION
 hint_pops_with_needs_red_administrative: "\"Povstanie by prinieslo skazu našim obchodníkom. Zvýšme výrobu, skôr než sa náš ľud rozhodne chytiť za zbrane!\"" # todo: NEW TRANSLATION
 hint_pops_with_needs_red_military: "\"Hladová masa? Naša armáda sa postará o túto hrozbu.\"" # todo: NEW TRANSLATION
 hint_has_possible_reform: "Možné reformy" # todo: NEW TRANSLATION
 hint_has_possible_reform_hint_text: "$hint_has_possible_reform_hint_text_1$\n\n$hint_has_possible_reform_hint_text_2$\n\n$hint_has_possible_reform_hint_text_3$" # todo: NEW TRANSLATION
 hint_has_possible_reform_hint_text_1: "[Concept('government_reforms_with_icon','Vládne reformy')|e] sú jednou z najdefinujúcejších čŕt nášho [Concept('country_with_icon','krajiny')|e]. Vždy by sme mali mať všetky dostupné [reforms] prijaté." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 hint_has_possible_reform_hint_text_2: "#T Odporúčané kroky:#!\n@arrow_bonus_tier_3! Stlačte tlačidlo plus pod kartou [ShowEstateTypeName('crown_estate')] v @government_panel! [Link('government', 'tabcontent = estates', 'lateralview_government_entry_name')] na zavedenie nového [reform]." # todo: CHANGED
 hint_has_possible_reform_hint_text_3: "#T Doplnkové tipy:#!\n@hint! Ako sa hra vyvíja, ďalšie [government_reforms] budú dostupné cez [Concept('advances_with_icon','pokroky')|e] a [Concept('events_with_icon','udalosti')|e].\n@hint! Zrušenie [government_reforms] stojí [Concept('stability_with_icon','stabilita')|e] a ich zavedenie trvá dlho. Vyberajte ich starostlivo.\n@hint! Niektoré [government_reforms] vyžadujú, aby sa vaše [country] priklonilo k určitej [Concept('societal_value_with_icon','sociálnej hodnote')|e]. Môžete skontrolovať [government_reforms] odomknuté každou [societal_value] pomocou @leftclick! #W Kliknutím#! na ich ikony v [Link('societal_values', '', '@government_panel! Government Panel > Values Tab')]." # todo: CHANGED # todo: CONCEPT CASE
 hint_has_possible_reform_diplomatic: "\"Dobre definovaná vláda je symbolom zdravej správy.\"" # todo: NEW TRANSLATION
 hint_has_possible_reform_administrative: "\"Musíme mať jasnú definíciu vlády, aby si cudzie krajiny vedeli správne vytvoriť názov pre nás.\"" # todo: NEW TRANSLATION
 hint_has_possible_reform_military: "\"Ako očakávame, že sa dokážeme brániť pred nepriateľmi, ak ani nevieme, kým v skutočnosti sme?\"" # todo: NEW TRANSLATION
 hint_has_conquered_provinces: "Neintegrované provincie" # todo: NEW TRANSLATION
 hint_has_conquered_provinces_hint_text: "$hint_has_conquered_provinces_hint_text_1$\n\n$hint_has_conquered_provinces_hint_text_2$\n\n$hint_has_conquered_provinces_hint_text_3$" # todo: NEW TRANSLATION
 hint_has_conquered_provinces_hint_text_1: "[Concept('conquered_with_icon','Dobytá')|e] [Concept('locations_with_icon','Lokality')|e] je potrebné [Concept('integrate_with_icon','integrovať')|e] do našej správy, aby prispievali k bohatstvu ríše. Mali by sme sa snažiť integrovať všetky naše [Concept('locations_with_icon','lokality')|e] čo najskôr." # todo: CHANGED # todo: CONCEPT CASE
 hint_has_conquered_provinces_hint_text_2: "#T Odporúčané kroky #!:\n@arrow_bonus_tier_3! Inštruujte [Concept('cabinet_with_icon','kabinet')|e], aby [ShowCabinetActionName('integrate_province')] z @government_panel! [Link('government', 'tabcontent = cabinet', 'lateralview_government_entry_name')].\n@arrow_bonus_tier_1! Ak náš [cabinet] nezvláda tempo dobytí, zvážte vytvorenie [Concept('subject_with_icon','vazal')|e], ktorý bude spravovať územie za vás. Urobíte to v @diplomacy_panel! [Link('diplomacy', 'relations_tab = current_relations', 'lateralview_diplomacy_entry_name')]." # todo: CHANGED # todo: CONCEPT CASE
 hint_has_conquered_provinces_hint_text_3: "#T Extra tipy:#!\n@hint! Integrácia je zvyčajne jednou z hlavných zodpovedností [Concept('cabinet_with_icon','kabinetu')|e] v expanzívnych [Concept('countries_with_icon','krajinách')|e].\n@hint! [Concept('pop_satisfaction_with_icon','Spokojnosť populácie')|e] bude v [conquered] [locations] omnoho nižšia, čo môže spôsobiť [Concept('rebellions_with_icon','povstania')|e].\n@hint! Rýchlosť integrácie môžete zvýšiť vymenovaním talentovaných [Concept('characters_with_icon','postavy')|e] do [Concept('cabinet_members_with_icon','členov kabinetu')|e] a zvýšením globálnej [Concept('cabinet_efficiency_with_icon','efektivity kabinetu')|e] vašej [country].\n@hint! Integrácia bude rýchlejšia, ak naša [Concept('primary_culture_with_icon','hlavná kultúra')|e] je [Concept('dominant_culture_with_icon','dominantná kultúra')|e] lokality alebo ak je naša [Concept('cultural_influence_with_icon','kultúrny vplyv')|e] vyššia než [Concept('cultural_tradition_with_icon','kultúrna tradícia')|e] dominantnej kultúry." # todo: CHANGED # todo: CONCEPT CASE
 hint_has_conquered_provinces_diplomatic: "\"Nové... #italic získané #! subjekty sa nepoddajú našej vláde hneď. Integrácia je dlhý a namáhavý proces, no nevyhnutný pre stabilitu kráľovstva.\"" # todo: NEW TRANSLATION
 hint_has_conquered_provinces_administrative: "\"Obchodu sa nedarí, keď je krajina v rozvrate. Právo a poriadok sú prvoradé pre prosperitu.\"" # todo: NEW TRANSLATION
 hint_has_conquered_provinces_military: "\"Birokrati nie sú vždy zbytoční. Bez správnych administratívnych kádrí by sme nedokázali odviesť dane od obyvateľstva.\"" # todo: NEW TRANSLATION
 hint_has_possible_cabinet_action: "Možné kabinetné akcie" # todo: NEW TRANSLATION
 hint_has_possible_cabinet_action_hint_text: "$hint_has_possible_cabinet_action_hint_text_1$\n\n$hint_has_possible_cabinet_action_hint_text_2$\n\n$hint_has_possible_cabinet_action_hint_text_3$" # todo: NEW TRANSLATION
 hint_has_possible_cabinet_action_hint_text_1: "[Concept('cabinet_actions_with_icon','Akcie kabinetu')|e] patria medzi najsilnejšie nástroje, ktoré máme na správu národa. Mali by sme neustále využívať všetky naše dostupné [Concept('cabinet_seats_with_icon','miesta v kabinete')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 hint_has_possible_cabinet_action_hint_text_2: "#T Odporúčané kroky:#!\n@arrow_bonus_tier_3! Prejdite do @government_panel! [Link('government', 'tabcontent = cabinet', 'lateralview_government_entry_name')] a pozrite si dostupné kabinetné akcie.\n@arrow_bonus_tier_3! [ShowCabinetActionName('integrate_province')] ak máme nedávno [Concept('conquered_with_icon','dobytá')|e] územie.\n@arrow_bonus_tier_2! [ShowCabinetActionName('stabilize_country')] ak je [Concept('stability_with_icon','stabilita')|e] nízka.\n@arrow_bonus_tier_2! [ShowCabinetActionName('strengthen_government')] ak je [Concept('legitimacy_with_icon','legitimita')|e] nízka.\n@arrow_bonus_tier_2! [ShowCabinetActionName('diplomatic_endeavors')] pre ľahšiu [Concept('diplomacy_with_icon','diplomaciu')|e].\n@arrow_bonus_tier_1! [ShowCabinetActionName('change_societal_values')] ak chcete presadzovať konkrétnu [Concept('societal_value_with_icon','sociálnu hodnotu')|e].\n@arrow_bonus_tier_1! [ShowCabinetActionName('develop_province')] na zvýšenie [Concept('development_with_icon','rozvoj')|e] v našich najcennejších [Concept('provinces_with_icon','provincie')|e].\n@arrow_bonus_tier_1! [cabinet_actions] možno použiť aj na [Concept('convert_with_icon','konvertovať')|e] iné [Concept('religions_with_icon','náboženstvá')|e] alebo [Concept('assimilate_with_icon','asimilovať')|e] iné [Concept('cultures_with_icon','kultúry')|e].\n@automation! Kabinet môžete tiež automatizovať v @automation! [Link('automation', '', 'lateralview_automation_entry_name')]." # todo: CHANGED # todo: CONCEPT CASE
 hint_has_possible_cabinet_action_hint_text_3: "#T Extra tipy:#!\n@hint! [Concept('characters_with_icon','Postavy')|e] vymenovaní do [Concept('cabinet_with_icon','kabinetu')|e] zvýšia [Concept('estate_power_with_icon','sila stavu')|e] ich [Concept('estate_with_icon','stav')|e].\n@hint! Nové [cabinet_actions] sa odomknú v neskorších [Concept('ages_with_icon','vekov')|e]." # todo: CHANGED # todo: CONCEPT CASE
 hint_has_possible_cabinet_action_diplomatic: "\"Byrokracia je životodarnou šťavou každého štátu... ak sa používa múdro.\"" # todo: NEW TRANSLATION
 hint_has_possible_cabinet_action_administrative: "\"Cez kabinet má štát moc premeniť pustú púšť na prosperujúce metropoly.\"" # todo: NEW TRANSLATION
 hint_has_possible_cabinet_action_military: "\"Silný kabinet dokáže skrotiť najnepokojnejších členov našej spoločnosti.\nDajte príkazy, a budú splnené.\"" # todo: NEW TRANSLATION
 hint_has_possible_law: "Zákony bez aktívnej politiky" # todo: NEW TRANSLATION
 hint_has_possible_law_hint_text: "$hint_has_possible_law_hint_text_1$\n\n$hint_has_possible_law_hint_text_2$\n\n$hint_has_possible_law_hint_text_3$" # todo: NEW TRANSLATION
 hint_has_possible_law_hint_text_1: "Je rozumné mať aktívnu [Concept('policy_with_icon','politiku')|e] pre všetky naše [Concept('laws_with_icon','zákony')|e]. Inak môže vaša [Concept('country_with_icon','krajina')|e] prísť o užitočné výhody." # todo: CHANGED # todo: CONCEPT CASE
 hint_has_possible_law_hint_text_2: "#T Odporúčané kroky:#!\n@arrow_bonus_tier_3! Kliknite na Upozornenie, aby ste prešli naše [laws] bez zavedenéj [policy], a vyberte starostlivo.\n@arrow_bonus_tier_3! Môžete prejsť do @government_panel! [Link('government', 'tabcontent = politics', 'lateralview_government_entry_name')] a prezrieť si súčasné [laws].\n@automation! Môžete si tiež automatizovať naše zákony v @automation! [Link('automation', '', 'lateralview_automation_entry_name')]." # todo: CHANGED
 hint_has_possible_law_hint_text_3: "#T Extra tipy:#!\n@hint! [policies] majú implementačný čas v závislosti od našej [Concept('legislative_efficiency_with_icon','legislatívnej efektívnosti')|e]. Ich plné účinky nebudú aktívne okamžite.\n@hint! [policy] môžete neskôr zmeniť za cenu [Concept('gold_with_icon','dukáty')|e] a [Concept('stability_with_icon','stabilita')|e]. Náklady závisia od nášho [Concept('crown_power_with_icon','moci koruny')|e].\n@hint! Mnoho nových [laws] a [policies] sa odomkne v neskorších [Concept('ages_with_icon','vekov')|e]." # todo: CHANGED # todo: CONCEPT CASE
 hint_has_possible_law_diplomatic: "\"Štát bez zákonov je ako budova bez stĺpov, telo bez končatín. Radšej viac než menej.\"" # todo: NEW TRANSLATION
 hint_has_possible_law_administrative: "\"Zákony krajiny by mali zabezpečiť rast našich miest, ochranu obchodníkov a riadne vymáhanie daní.\"" # todo: NEW TRANSLATION
 hint_has_possible_law_military: "\"Schvaľovanie zákonov je dôležité; ich vynútenie je kľúčové.\"" # todo: NEW TRANSLATION
 hint_has_army_without_leader: "Chýba veliteľ" # todo: NEW TRANSLATION
 hint_has_army_without_leader_hint_text: "$hint_has_army_without_leader_hint_text_1$\n\n$hint_has_army_without_leader_hint_text_2$\n\n$hint_has_army_without_leader_hint_text_3$" # todo: NEW TRANSLATION
 hint_has_army_without_leader_hint_text_1: "Naše [Concept('units_with_icon','jednotky')|e] potrebujú [Concept('commander_with_icon','veliteľ')|e], aby vykonávali svoje úlohy v [Concept('battle_with_icon','bitke')|e]. [Concept('generals_with_icon','Generáli')|e] vedú [armies], [admirals] vedú [navies]." # todo: CHANGED # todo: CONCEPT CASE
 hint_has_army_without_leader_hint_text_2: "#T Odporúčané kroky:#!\n@arrow_bonus_tier_3! Kliknite na #W Upozornenie#! a vyberte vhodného [Concept('character_with_icon','postavy')|e] pre vašu [unit]. Vo všeobecnosti vyberajte tých s vyššími [Concept('abilities_with_icon','schopnosťami')|e].\n@arrow_bonus_tier_2! Môžete tiež vybrať [unit] z mapy alebo z #W Outliner#!.\n@arrow_bonus_tier_2! Ak nemáme žiadneho dobrého [character], skúste nejakého vytrénovať v @military_panel! [Link('unit_overview', '', 'lateralview_unit_overview_entry_name')].\n@automation! Môžete automatizovať menovanie [generals] a [admirals] v @automation! [Link('automation', '', 'lateralview_automation_entry_name')]." # todo: CHANGED # todo: CONCEPT CASE
 hint_has_army_without_leader_hint_text_3: "#T Extra tipy:#!\n@hint! Nezačínajte [battle] bez schopného [Concept('commander_with_icon','veliteľa')|e] v velení!\n@hint! Niektorí [Concept('characters_with_icon','postavách')|e] majú [Concept('traits_with_icon','vlastnosti')|e], ktoré ich robia vhodnejšími pre konkrétne úlohy.\n@hint! Niektoré [Concept('laws_with_icon','zákony')|e] môžu obmedziť, ktorí [Concept('characters_with_icon','postavy')|e] sú spôsobilí viesť." # todo: CHANGED # todo: CONCEPT CASE
 hint_has_army_without_leader_diplomatic: "\"Armáda by vždy mala mať veliteľa. Ale musíme byť opatrní, lebo velitelia využijú svoj vplyv na zvýšenie moci svojho stavu.\"" # todo: NEW TRANSLATION
 hint_has_army_without_leader_administrative: "\"Prosím, nepýtajte sa ma. Bravúrne záležitosti vojny zverujem vašim menej... #italic sofistikovaným #! poradcom.\"" # todo: NEW TRANSLATION
 hint_has_army_without_leader_military: "\"Zapojenie sa do boja bez riadneho vedenia je samovražda.\nZa žiadnych okolností to nerobte.\"" # todo: NEW TRANSLATION
 hint_is_heir_underage: "Neplnoletý dedič" # todo: NEW TRANSLATION
 hint_is_heir_underage_hint_text: "$hint_is_heir_underage_hint_text_1$\n\n$hint_is_heir_underage_hint_text_2$" # todo: NEW TRANSLATION
 hint_is_heir_underage_hint_text_1: "Ak by náš [Concept('ruler_with_icon','panovník')|e] zomrel skôr, než sa náš [Concept('heir_with_icon','dedič')|e] dostane do veku dospelosti, ocitli by sme sa pod [Concept('regency_with_icon','regentstvom')|e]. Podľa okolností člen najsilnejšieho [Concept('estate_with_icon','stav')|e] prevezme vládu, čím sa výrazne zvýši ich [Concept('estate_power_with_icon','sila stavu')|e] počas interregna." # todo: CHANGED # todo: CONCEPT CASE
 hint_is_heir_underage_hint_text_2: "#T Odporúčané kroky:#!\n@arrow_bonus_tier_1! Len málo môžete urobiť iného, než čakať uplynutie času a vyhýbať sa zbytočnému riziku života nášho [ruler]. Pokiaľ náš [ruler] nie je obzvlášť neschopný..." # todo: NEW TRANSLATION
 hint_is_heir_underage_hint_text_3: "#T Extra tipy:#!\n@hint! [Concept('regency_with_icon','Regentstvo')|e] nemusí byť zlý, ak máme obzvlášť schopného [Concept('character_with_icon','postavy')|e], ktorý môže byť regentom." # todo: CHANGED # todo: CONCEPT CASE
 hint_is_heir_underage_diplomatic: "\"Zaistiť nástupníctvo znamená zabezpečiť budúcnosť kráľovstva.\"" # todo: NEW TRANSLATION
 hint_is_heir_underage_administrative: "\"Manželstvá a dynastické väzby sú najlepším spôsobom, ako spojiť dve krajiny.\"" # todo: NEW TRANSLATION
 hint_is_heir_underage_military: "\"Práve v mladosti možno vychovať dedičov na najlepších vládcov.\"" # todo: NEW TRANSLATION
 hint_has_unmarried_adult_ruler: "Nezadaný panovník" # todo: NEW TRANSLATION
 hint_has_unmarried_adult_ruler_hint_text: "$hint_has_unmarried_adult_ruler_hint_text_1$\n\n$hint_has_unmarried_adult_ruler_hint_text_2$\n\n$hint_has_unmarried_adult_ruler_hint_text_3$" # todo: NEW TRANSLATION
 hint_has_unmarried_adult_ruler_hint_text_1: "Mali by sme sa pokúsiť zosobášiť nášho [Concept('ruler_with_icon','panovníka')|e] so vhodným kandidátom, aby sme rozšírili veľkosť a moc našej [Concept('dynasty_with_icon','dynastie')|e]. Plodné kráľovské potomstvo nielen zabezpečuje stabilné dedičstvo, ale princovia môžu tvoriť cennú rezervu dostupných [Concept('characters_with_icon','postavy')|e] pre vládne úrady." # todo: CHANGED # todo: CONCEPT CASE
 hint_has_unmarried_adult_ruler_hint_text_2: "#T Odporúčané kroky:#!\n@arrow_bonus_tier_3! Kliknite na Upozornenie a vyhľadajte kandidátov na [Concept('royal_marriage_with_icon','kráľovský sňatok')|e]. Monarchie môžu uzavrieť kráľovské manželstvá medzi sebou na upevnenie [opinion] a položiť základy pre [Concept('alliance_with_icon','alianciu')|e]. [Concept('royal_marriages_with_icon','Kráľovské sňatky')|e] môžu tiež otvoriť možnosť [Concept('personal_union_with_icon','personálnu úniu')|e].\n@arrow_bonus_tier_2! Môžete oženiť svojho [ruler] alebo [heir] s vhodným [Concept('character_with_icon','postavou')|e] v dvore cez [ShowCharacterInteractionName('marry_noble')] interakciu pravým kliknutím na portrét.\n@arrow_bonus_tier_1! V prípade núdze je vždy možnosť [ShowCharacterInteractionName('marry_lowborn')], hoci nie je populárna." # todo: CHANGED # todo: CONCEPT CASE
 hint_has_unmarried_adult_ruler_hint_text_3: "#T Extra tipy:#!\n@hint! [characters] vládnucej [dynasty] patria k [ShowEstateTypeName('crown_estate')], takže pri vymenovaní na vplyvné funkcie neoslabujú iné [Concept('estates_with_icon','stavy')|e]." # todo: CHANGED # todo: CONCEPT CASE
 hint_has_unmarried_adult_ruler_diplomatic: "\"$hint_is_heir_underage_diplomatic$\"" # todo: NEW TRANSLATION
 hint_has_unmarried_adult_ruler_administrative: "\"$hint_is_heir_underage_administrative$\"" # todo: NEW TRANSLATION
 hint_has_unmarried_adult_ruler_military: "\"Každý meč potrebuje pochvu.\"" # todo: NEW TRANSLATION
 hint_can_do_more_research: "Výskum" # todo: NEW TRANSLATION
 hint_can_do_more_research_hint_text: "$hint_can_do_more_research_hint_text_1$\n\n$hint_can_do_more_research_hint_text_2$\n\n$hint_can_do_more_research_hint_text_3$" # todo: NEW TRANSLATION
 hint_can_do_more_research_hint_text_1: "Mali by sme zabezpečiť, aby naša [Concept('country_with_icon','krajina')|e] neustále skúmala nové [Concept('advances_with_icon','pokroky')|e]." # todo: CHANGED # todo: CONCEPT CASE
 hint_can_do_more_research_hint_text_2: "#T Odporúčané kroky:#!\n@arrow_bonus_tier_3! Prejdite do @advances_panel! [Link('advances', 'subtab = research', 'lateralview_advances_entry_name')] a vyberte Advance, ktorý vyhovuje vašim potrebám.\n@arrow_bonus_tier_2! Môžete tiež kliknúť na prázdnu ikonu kvasničky vpravo hore, aby ste otvorili celý @advances_panel! [Link('technology_view', '', 'lateralview_technology_view_entry_name')].\n@automation! Ak sa nechcete zatiaľ ponoriť do detailov [advances], môžete automatizovať náš výskum v @automation! [Link('automation', '', 'lateralview_automation_entry_name')]. Stále budete upozornení, keď objavíme nový [Concept('advance_with_icon','pokrok')|e]." # todo: CHANGED # todo: CONCEPT CASE
 hint_can_do_more_research_hint_text_3: "#T Extra tipy: #!\n@hint! Nepoužité body výskumu sa ukladajú do určitej miery, potom už sa strácajú.\n@hint! Rýchlosť [Concept('research_progress_with_icon','pokrok výskumu')|e] môžete zvýšiť zvýšením priemernej [Concept('literacy_with_icon','gramotnosti')|e] a spokojnosti [ShowEstateTypeName('clergy_estate')]." # todo: CHANGED # todo: CONCEPT CASE
 hint_can_do_more_research_diplomatic: "\"Technológia ponúka veľa možností, ako zjednodušiť správu našich domén.\"" # todo: NEW TRANSLATION
 hint_can_do_more_research_administrative: "\"Pri náležitej investícii by sme mohli výrazne zlepšiť efektivitu našej ekonomiky.\"" # todo: NEW TRANSLATION
 hint_can_do_more_research_military: "\"Neustále zlepšovanie našich profesionálnych armád je najdôležitejšie, aby naša sila nezaostala za nepriateľmi.\"" # todo: NEW TRANSLATION
 hint_lack_cabinet_for_cabinet_action: "Kabinetu chýba člen" # todo: NEW TRANSLATION
 hint_lack_cabinet_for_cabinet_action_hint_text: "$hint_lack_cabinet_for_cabinet_action_hint_text_1$\n\n$hint_lack_cabinet_for_cabinet_action_hint_text_2$\n\n$hint_lack_cabinet_for_cabinet_action_hint_text_3$" # todo: NEW TRANSLATION
 hint_lack_cabinet_for_cabinet_action_hint_text_1: "[Concept('cabinet_action_with_icon','Akcia kabinetu')|e] nebude efektívna bez schopného [Concept('character_with_icon','postavy')|e] priradeného na ňu. Vždy obsadzujte všetky [Concept('cabinet_seats_with_icon','miesta v kabinete')|e]." # todo: CHANGED # todo: CONCEPT CASE
 hint_lack_cabinet_for_cabinet_action_hint_text_2: "#T Odporúčané kroky:#!\n@arrow_bonus_tier_3! Kliknite na #W Upozornenie#! a choďte do @government_panel! [Link('government', 'tabcontent = cabinet', 'lateralview_government_entry_name')], a vymenujte [Concept('character_with_icon','postavu')|e] s najvyššou súvisiacou [Concept('ability_with_icon','schopnosťou')|e] do prázdneho [cabinet_seat].\n@arrow_bonus_tier_1! Zvážte nábor novú [Concept('courtier_with_icon','dvorana')|e], ak nemáme dobrých kandidátov.\n@automation! Kabinet môžete automatizovať v @automation! [Link('automation', '', 'lateralview_automation_entry_name')]." # todo: CHANGED # todo: CONCEPT CASE
 hint_lack_cabinet_for_cabinet_action_hint_text_3: "#T Extra tipy: #!\n@hint! Každá [Concept('cabinet_action_with_icon','akcia kabinetu')|e] využíva jednu z troch charakterových [Concept('abilities_with_icon','schopností')|e], takže si starostlivo vyberajte členov podľa úlohy.\n@hint! [Concept('cabinet_members_with_icon','Členovia kabinetu')|e] zvýšia [Concept('estate_power_with_icon','sila stavu')|e] [Concept('estate_with_icon','stavu')|e], ku ktorému patria." # todo: CHANGED # todo: CONCEPT CASE
 hint_lack_cabinet_for_cabinet_action_diplomatic: "\"Najlepšia správa vždy využije najlepších ľudí.\"" # todo: NEW TRANSLATION
 hint_lack_cabinet_for_cabinet_action_administrative: "\"Čím lepšie funguje náš štát, tým lepší vonkajší obraz predvedieme.\"" # todo: NEW TRANSLATION
 hint_lack_cabinet_for_cabinet_action_military: "\"Len s efektívnou administratívou dokážeme jasne premietať našu silu.\"" # todo: NEW TRANSLATION
 hint_inflation: "Inflácia" # todo: NEW TRANSLATION
 hint_inflation_hint_text: "$hint_inflation_hint_text_1$\n\n$hint_inflation_hint_text_2$" # todo: NEW TRANSLATION
 hint_inflation_hint_text_1: "Inflácia jednoducho zvyšuje všetky výdavky našej [Concept('country_with_icon','krajiny')|e], takže by sa jej malo vždy vyhnúť. Rýchlo rastie zo [Concept('minting_with_icon','ražby mincí')|e], ale niekedy môže byť ťažké ju znížiť." # todo: CHANGED # todo: CONCEPT CASE
 hint_inflation_hint_text_2: "#T Odporúčané kroky:#!\n@arrow_bonus_tier_3! Ak inflácia rastie, upravte posuvník [minting] v @economy_panel! [Link('economy', '', 'lateralview_economy_entry_name')], aby ste zabránili rastu [inflation].\n@arrow_bonus_tier_2! Ak už máme nejakú infláciu, nastavenie posuvníka na minimum ju začne znižovať." # todo: CHANGED
 hint_inflation_hint_text_3: "#T Extra tipy:#!\n@hint! Môžeme získať ďalšie zdroje na zníženie inflácie, napríklad z [Concept('advances_with_icon','pokrokov')|e]." # todo: CHANGED # todo: CONCEPT CASE
 hint_inflation_diplomatic: "\"Nech nás uchráni pred touto neviditeľnou chorobou ekonomiky.\"" # todo: NEW TRANSLATION
 hint_inflation_administrative: "\"Mintovanie môže byť lákavým riešením pre rozvrátený rozpočet, ale aj zdrojom dlhodobých nešťastí.\"" # todo: NEW TRANSLATION
 hint_inflation_military: "\"Inflácia je pomalý a zákerný zabijak.\"" # todo: NEW TRANSLATION
 hint_has_disloyal_subjects: "Neloajálni vazali" # todo: NEW TRANSLATION
 hint_has_disloyal_subjects_hint_text: "$hint_has_disloyal_subjects_hint_text_1$\n\n$hint_has_disloyal_subjects_hint_text_2$\n\n$hint_has_disloyal_subjects_hint_text_3$" # todo: NEW TRANSLATION
 hint_has_disloyal_subjects_hint_text_1: "Naši [Concept('subjects_with_icon','vazalov')|e] sú [Concept('countries_with_icon','krajiny')|e], ktoré sú nám nejako podriadené. Zvyčajne nám platia [Concept('subject_taxation_with_icon','zdanenie vazalov')|e] a sú povolaní do našich [Concept('wars_with_icon','vojen')|e].\n\nAk ich [Concept('subject_loyalty_with_icon','vernosť vazala')|e] klesne pod #W 50#!, budú považovaní za nelojálnych a nepomôžu nám vo vojne. Neloajálni poddaní sa môžu spojiť a vytvoriť [GetInternationalOrganizationType('independence_movement').GetName], potenciálne začať vojnu proti nám, ak sa cítia dostatočne silní." # todo: CHANGED # todo: CONCEPT CASE
 hint_has_disloyal_subjects_hint_text_2: "#T Odporúčané kroky:#!\n@arrow_bonus_tier_3! Uistite sa, že [Concept('opinion_with_icon','názor')|e] našich subjectov o nás zostáva vysoké. Môžete ho zvýšiť pomocou $IMPROVE_RELATIONTITLE$ [Concept('diplomatic_action_with_icon','diplomatická akcia')|e].\n@arrow_bonus_tier_1! Zvážte [Concept('annexing_with_icon','anektovanie')|e] lojálnych poddaných. Zvýšenie nášho relatívneho vplyvu oproti všetkým subjectom zvýši ich lojalitu.\n@arrow_bonus_tier_1! Zvýšenie veľkosti našich [Concept('armies_with_icon','armád')|e] zastraší subjectov a zvýši ich lojalitu." # todo: CHANGED # todo: CONCEPT CASE
 hint_has_disloyal_subjects_hint_text_3: "#T Extra tipy:#!\n@hint! Prehľad našich subjectov nájdete v panely Subject v @diplomacy_panel! [Link('diplomacy', 'relations_tab = current_relations', 'lateralview_diplomacy_entry_name')].\n@hint! Čím viac a čím mocnejší sú naši subjecti v pomere k našej moci, tým ťažšie bude udržať ich [subject_loyalty] vysokú.\n@hint! Rôzne typy [subjects] majú odlišné charakteristiky a obmedzenia." # todo: CHANGED
 hint_has_disloyal_subjects_diplomatic: "\"Vždy by sme mali pestovať dobré vzťahy s našimi Subjects, aby si nezačali myslieť, že sú pánmi svojho osudu.\"" # todo: NEW TRANSLATION
 hint_has_disloyal_subjects_administrative: "\"Subjects sú ziskovým prírastkom do našej pokladnice.\nNedovoľme im, aby si to uvedomili.\"" # todo: NEW TRANSLATION
 hint_has_disloyal_subjects_military: "\"Ovce sa pri prvej príležitosti zatúla. Radšej buďme pripravení pustiť psy vojny!\"" # todo: NEW TRANSLATION
 hint_has_imminent_independence_war: "Hroziaca vojna za nezávislosť" # todo: NEW TRANSLATION
 hint_has_imminent_independence_war_hint_text: "$hint_has_imminent_independence_war_hint_text_1$\n\n$hint_has_imminent_independence_war_hint_text_2$" # todo: NEW TRANSLATION
 hint_has_imminent_independence_war_hint_text_1: "Jeden alebo viacerí z našich [Concept('subjects_with_icon','vazalov')|e] vedie [GetInternationalOrganizationType('independence_movement').GetName], ktorého odhadované šance na víťazstvo v [Concept('war','vojne')|e] proti nám dosiahli prah, pri ktorom sa [AI] môže rozhodnúť vyhlásiť vojnu za nezávislosť kedykoľvek." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 hint_has_imminent_independence_war_hint_text_2: "#T Recommended Actions:#!\n@arrow_bonus_tier_3! Zmobilizujte ďalšie [Concept('armies_with_icon','armády')|e], aby ste znížili ich odhadovanú šancu na víťazstvo pod prah.\n@arrow_bonus_tier_3! Zvážte zaútočiť ako prví pomocou [ShowCasusBelliName('cb_disloyal_subject')] [Concept('casus_belli_with_icon','casus belli')|e], aby ste hnutie rozložili skôr, než vojna začne.\n@arrow_bonus_tier_1! Zlepšite [Concept('subject_loyalty_with_icon','vernosť vazala')|e] členov hnutia, aby opustili [Concept('international_organization_with_icon','medzinárodná organizácia')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 hint_has_buildings_missing_input: "Budovy chýbajú vstupy" # todo: NEW TRANSLATION
 hint_has_buildings_missing_input_hint_text: "$hint_has_buildings_missing_input_hint_text_1$\n\n$hint_has_buildings_missing_input_hint_text_2$\n\n$hint_has_buildings_missing_input_hint_text_3$" # todo: NEW TRANSLATION
 hint_has_buildings_missing_input_hint_text_1: "[Concept('buildings_with_icon','Budovy')|e] potrebujú prístup k [Concept('goods_with_icon','tovarom')|e] z ich trhov, aby správne fungovali. Ak nemôžu kúpiť všetky potrebné [goods], ich produkcia bude primerane znížená." # todo: CHANGED # todo: CONCEPT CASE
 hint_has_buildings_missing_input_hint_text_2: "#T Odporúčané kroky:#!\n$hint_address_shortage_text$" # todo: NEW TRANSLATION
 hint_has_buildings_missing_input_hint_text_3: "#T Ďalšie tipy:#!\n@hint! Nie všetky nedostatky v budovách predstavujú kritický problém pre našu krajinu. Napriek tomu môže byť rozumné zabezpečiť správne fungovanie niektorých obzvlášť strategických výrobných reťazcov.\n@hint! Napríklad sa nemusíme môcť naverbovať [ShowUnitDefinitionName('a_footmen')], ak náš [ShowBuildingTypeName('weapon_guild')] nemôže nakúpiť dostatok [ShowGoodsName('lumber')] zo svojho [market]." # todo: NEW TRANSLATION
 hint_has_buildings_missing_input_diplomatic: "\"Niektoré budovy sú obzvlášť dôležité pre správne fungovanie nášho kráľovstva.\"" # todo: NEW TRANSLATION
 hint_has_buildings_missing_input_administrative: "\"Naši obchodníci by sa mali snažiť riešiť akékoľvek nedostatky na našich trhoch. Avšak niekedy neviditeľná ruka trhu potrebuje... malý impulz.\"" # todo: NEW TRANSLATION
 hint_has_buildings_missing_input_military: "\"Pred začatím akejkoľvek vojenskej operácie musíme zabezpečiť stály prísun zbraní a vojenských zásob.\"" # todo: NEW TRANSLATION
 hint_address_shortage_text: "Kliknutím na #W Upozornenie#! prejdete do @production_panel! [Link('goods_production', '', 'lateralview_goods_production_entry_name')] filtrovaného na chýbajúce [goods] v postihnutom [market].\nMôžete zvýšiť [Concept('supply_with_icon','ponuka')|e] tovaru v našich [Concept('markets_with_icon','trhov')|e] troma spôsobmi:\n\n@arrow_bonus_tier_3! Kliknite na @rgo! [rgo|e] tlačidlo a pozrite si zoznam našich [locations] v tomto [market] s príslušným [rgo]. Pamätajte, že iba [Concept('raw_materials_with_icon','suroviny')|e] možno produkovať v [rgo]\n@arrow_bonus_tier_2! Kliknite na @building! [Concept('building','budovu')|e] tlačidlo a pozrite si zoznam všetkých dostupných [buildings], ktoré môžu produkovať daný [good].\n@arrow_bonus_tier_2! Kliknite na @import! [Concept('import','dovoz')|e] tlačidlo a dovezte [good] z iného trhu pomocou [Concept('merchant_capacity_with_icon','neobchodnej kapacity')|e].\n@automation! Môžete automatizovať stavbu [buildings] a [rgo], ako aj náš [Concept('trade_with_icon','obchod')|e], z @automation! [Link('automation', '', 'lateralview_automation_entry_name')]." # todo: CHANGED # todo: CONCEPT CASE
 hint_has_constructions_missing_input: "Výstavba chýba vstupy" # todo: NEW TRANSLATION
 hint_has_constructions_missing_input_hint_text: "$hint_has_constructions_missing_input_hint_text_1$\n\n$hint_has_constructions_missing_input_hint_text_2$\n\n$hint_has_constructions_missing_input_hint_text_3$" # todo: NEW TRANSLATION
 hint_has_constructions_missing_input_hint_text_1: "Všetky [Concept('constructions_with_icon','výstavby')|e] potrebujú prístup k určitým [Concept('goods_with_icon','tovarom')|e] z [Concept('market_with_icon','trhu')|e] lokality. Ak nie je dostatok [goods], [construction] sa zastaví." # todo: CHANGED # todo: CONCEPT CASE
 hint_has_constructions_missing_input_hint_text_2: "#T Odporúčané kroky:#!\n$hint_address_shortage_text$" # todo: NEW TRANSLATION
 hint_has_constructions_missing_input_hint_text_3: "#T Extra tipy:#!\n@hint! Všetky [locations] v [market] majú prístup k potrebným [goods] podľa poradia [Concept('market_access_with_icon','prístup na trh')|e], bez ohľadu na to, kto tovar vyrobil.\n@hint! To znamená, že lokality bližšie k [Concept('market_centers_with_icon','trhovým centrám')|e] ľahšie získajú potrebné tovary." # todo: CHANGED # todo: CONCEPT CASE
 hint_has_constructions_missing_input_diplomatic: "\"Presná kontrola všetkých zdrojov a potrieb je kľúčová pre každé podnikanie.\"" # todo: NEW TRANSLATION
 hint_has_constructions_missing_input_administrative: "\"Diplomacia a obchod nám dokážu dodať všetko, čo sami nedokážeme vyrobiť.\"" # todo: NEW TRANSLATION
 hint_has_constructions_missing_input_military: "\"Musíme byť schopní uspokojiť všetky naše zásobovacie potreby a požiadavky, ak nechceme, aby iní využili naše slabiny.\"" # todo: NEW TRANSLATION
 hint_lack_pop_promotion_to_fill_buildings: "Budovy alebo [rgo] s chýbajúcimi zamestnancami" # todo: NEW TRANSLATION
 hint_lack_pop_promotion_to_fill_buildings_hint_text: "$hint_lack_pop_promotion_to_fill_buildings_hint_text_1$\n\n$hint_lack_pop_promotion_to_fill_buildings_hint_text_2$\n\n$hint_lack_pop_promotion_to_fill_buildings_hint_text_3$" # todo: NEW TRANSLATION
 hint_lack_pop_promotion_to_fill_buildings_hint_text_1: "Rôzne [Concept('buildings_with_icon','budovy')|e] zamestnávajú rôzne [Concept('pop_types_with_icon','sociálne triedy')|e]. Ak pri dokončení novej budovy nie je dostatok voľných [Concept('pops_with_icon','populácie')|e] požadovaného typu, [ShowPopTypeName('peasants')] začnú [Concept('promote_with_icon','povýšiť')|e] podľa [ShowModifierTypeName('local_pop_promotion_speed')] lokality.\n\nBudovy môžu tiež stratiť zamestnancov pri úmrtiach [pops] v dôsledku [Concept('diseases_with_icon','chorobám')|e], [Concept('sieges_with_icon','obliehaniu')|e] alebo [Concept('starvation_with_icon','hladovanie')|e]." # todo: CHANGED # todo: CONCEPT CASE
 hint_lack_pop_promotion_to_fill_buildings_hint_text_2: "#T Odporúčané kroky:#!\n@arrow_bonus_tier_3! Nestavajte v lokalitách, ktoré už majú príliš málo zamestnancov.\n@arrow_bonus_tier_2! Zvýšte dôležité zdroje rýchlosti povýšenia pre lokalitu: [Concept('stability_with_icon','stabilitu')|e], [Concept('literacy_with_icon','gramotnosť')|e] a [Concept('control_with_icon','kontrola')|e].\n@arrow_bonus_tier_1! Postavte [ShowBuildingTypeName('library')] a [ShowBuildingTypeName('university')] v našich najdôležitejších lokalitách.\n@arrow_bonus_tier_1! Zvážte zničenie menej užitočných [buildings], aby ste uvoľnili pracovnú silu." # todo: CHANGED # todo: CONCEPT CASE
 hint_lack_pop_promotion_to_fill_buildings_hint_text_3: "#T Extra tipy:#!\n@hint! [Concept('urban_locations_with_icon','Mestské lokality')|e] majú vyšší základný počet dostupných [Concept('upper_class_with_icon','vyššiu triedu')|e] [pops].\n@hint! Pamätajte, že lokalita potrebuje aspoň nejakých dostupných [Concept('available_with_icon','dostupné')|e] [ShowPopTypeName('peasants')] pre [promotion] byť možnou.\n@hint! Môžete skontrolovať [ShowModifierTypeName('local_pop_promotion_speed')] lokality v #W Demography Tab#! v #W Location Panel#!." # todo: CHANGED # todo: CONCEPT CASE
 hint_lack_pop_promotion_to_fill_buildings_diplomatic: "\"Čo je priemysel bez ľudí, ktorí v ňom pracujú?\"" # todo: NEW TRANSLATION
 hint_lack_pop_promotion_to_fill_buildings_administrative: "\"Ak naši ľudia nebudú pracovať, iné krajiny nás môžu nazvať lenivými.\"" # todo: NEW TRANSLATION
 hint_lack_pop_promotion_to_fill_buildings_military: "\"Povinnosťou obyvateľstva je pracovať a vyrábať potreby krajiny.\"" # todo: NEW TRANSLATION
 hint_casus_belli: "Casus Belli" # todo: NEW TRANSLATION
 hint_casus_belli_hint_text: "$hint_casus_belli_hint_text_1$\n\n$hint_casus_belli_hint_text_2$\n\n$hint_casus_belli_hint_text_3$" # todo: NEW TRANSLATION
 hint_casus_belli_hint_text_1: "A [Concept('casus_belli_with_icon','casus Belli')|e] je legitimný dôvod začať [Concept('war_with_icon','vojna')|e]. Ísť do vojny bez správneho Casus Belli je stále možné, ale vynútenie požiadaviek v [Concept('peace_treaty_with_icon','mierovej dohode')|e] bude ťažšie a susedia zareagujú zvýšenou nepriateľskosťou." # todo: CHANGED # todo: CONCEPT CASE
 hint_casus_belli_hint_text_2: "#T Odporúčané kroky:#!\n@arrow_bonus_tier_3! Najlepší spôsob, ako získať Casus Belli, je požiadať o neho v našom [Concept('parliament_with_icon','parlamente')|e]. Parlament môžete zvolať z @government_panel! [Link('government', 'tabcontent = parliament', 'lateralview_government_entry_name')].\n@arrow_bonus_tier_2! Vytvorenie [Concept('spy_network_with_icon','špionážna sieť')|e] v cudzej [country] nám umožní sfabrikovať Casus Belli proti nim, ak máme tam [Concept('cores_with_icon','jadrá')|e] alebo ak sú našimi [Concept('rivals_with_icon','rivalmi')|e]." # todo: CHANGED # todo: CONCEPT CASE
 hint_casus_belli_hint_text_3: "#T Extra tipy:#!\n@hint! Nie všetky [wars] sú spravodlivé a môžeme vstúpiť do vojny bez Casus Belli. Dobrý Casus Belli je užitočným nástrojom, ale častejšie platí, že sila rozhoduje.\n@hint! Každý Casus Belli má konkrétny [Concept('war_goal_with_icon','vojnového cieľa')|e]. Splnenie [war_goal] počas vojny nám prinesie [Concept('war_score_with_icon','vojnové skóre')|e], ktoré sú kľúčové pre víťazstvo.\n@hint! [Concept('events_with_icon','Udalosti')|e] a [Concept('situations_with_icon','situácie')|e] môžu udeliť špeciálne Casus Belli." # todo: CHANGED # todo: CONCEPT CASE
 hint_casus_belli_diplomatic: "\"Aj vo vojne sú pravidlá, ktoré treba dodržiavať.\"" # todo: NEW TRANSLATION
 hint_casus_belli_administrative: "\"Dobrý Casus Belli by nám umožnil vyhlásiť vojnu bez pobúrenia našich susedov.\"" # todo: NEW TRANSLATION
 hint_casus_belli_military: "\"Najlepší Casus Belli, pane, je žiadny Casus Belli.\"" # todo: NEW TRANSLATION
 hint_has_unraised_levies_in_war: "Domobrana" # todo: NEW TRANSLATION
 hint_has_unraised_levies_in_war_hint_text: "$hint_has_unraised_levies_in_war_hint_text_1$\n\n$hint_has_unraised_levies_in_war_hint_text_2$\n\n$hint_has_unraised_levies_in_war_hint_text_3$" # todo: NEW TRANSLATION
 hint_has_unraised_levies_in_war_hint_text_1: "[Concept('levies_with_icon','Branci')|e] tvoria podstatnú časť ozbrojených síl každého [Concept('country_with_icon','krajiny')|e] v prvých storočiach hry, než ich nahradia profesionálni vojaci, známi ako [Concept('regulars_with_icon','stáli vojaci')|e]. Až dovtedy je vhodné vždy povolávať naše [levies] počas [Concept('war_with_icon','vojny')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 hint_has_unraised_levies_in_war_hint_text_2: "#T Odporúčané kroky:#!\n@arrow_bonus_tier_3! Keď sa vojna začne, kliknite na #W Upozornenie#! prejsť na #W Raise Levy#! v @military_panel! [Link('unit_overview', '', 'lateralview_unit_overview_entry_name')]. Odtiaľ môžete naraziť všetky [levies] naraz alebo vybrať konkrétne [Concept('provinces_with_icon','provincie')|e] na odvedenie.\n@arrow_bonus_tier_2! Je rozumné znížiť našu závislosť na [levies] s prevahou, ale drahšími [regular_regiments]. Na to budete potrebovať postaviť [ShowBuildingTypeName('sergeantry')].\n@arrow_bonus_tier_1! V časoch núdze môžu [Concept('mercenaries_with_icon','žoldnieri')|e] doplniť alebo dokonca nahradiť naše [levies], ak máme peniaze. Najmete ich v @military_panel! [Link('unit_overview', '', 'lateralview_unit_overview_entry_name')]." # todo: CHANGED # todo: CONCEPT CASE
 hint_has_unraised_levies_in_war_hint_text_3: "#T Extra Hints:#!\n@hint! [levies] pochádzajú predovšetkým z [Concept('pops_with_icon','populácií')|e] vašej [Concept('primary_culture_with_icon','hlavnej kultúry')|e] a [Concept('accepted_cultures_with_icon','akceptovaných kultúr')|e], ale množstvo, ktoré môžete povolať z každej [location], bude závisieť od jeho [Concept('control_with_icon','kontroly')|e].\n@hint! Majte na pamäti, že výroba [Concept('food_with_icon','potraviny')|e] a [Concept('rgo_with_icon','R.G.O.')|e] sa v povolaných [locations] zníži, kým sa muži nevrátia domov.\n@hint! Buďte opatrní: každý roľník, ktorý zomrie v bitke, je o jedného menej, kto bude pracovať na poliach." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 hint_has_unraised_levies_in_war_diplomatic: "\"Ľudia musia pracovať, ale tiež musia brániť svoje domovy, ak sú napadnutí.\"" # todo: NEW TRANSLATION
 hint_has_unraised_levies_in_war_administrative: "\"Ak nám ľudia dôverujú, prídu nám na pomoc, keď ich zavoláme.\"" # todo: NEW TRANSLATION
 hint_has_unraised_levies_in_war_military: "\"Mať pole na orbou nie je výhovorka, keď je treba vyhrať vojnu.\"" # todo: NEW TRANSLATION
 hint_no_allies: "Žiadni spojenci" # todo: NEW TRANSLATION
 hint_no_allies_hint_text: "$hint_no_allies_hint_text_1$\n\n$hint_no_allies_hint_text_2$\n\n$hint_no_allies_hint_text_3$" # todo: NEW TRANSLATION
 hint_no_allies_hint_text_1: "Aliancia [Concept('alliance_with_icon','aliancia')|e] je dohoda medzi dvoma [Concept('countries_with_icon','krajinou')|e], ktorá im umožňuje vstúpiť do vzájomných [Concept('wars_with_icon','vojen')|e]. Ak sme napadnutí, naši [allies] dostanú [Concept('call_to_arms_with_icon','volanie do zbrane')|e], aby vstúpili do vojny na našej strane. Pri vyhlasovaní vojny vždy zohľadnite spojencov nepriateľa, pretože sa pravdepodobne zapoja proti nám." # todo: CHANGED # todo: CONCEPT CASE
 hint_no_allies_hint_text_2: "#T Odporúčané kroky:#!\n@arrow_bonus_tier_3! Prejdite do @diplomacy_panel! [Link('diplomacy_macrobuilder', '', 'lateralview_diplomacy_macrobuilder_entry_name')] a kliknite na $offer_alliance$ v #W $CATEGORY_FRIENDLY_ACTIONS$#!. Uvidíte zoznam všetkých [countries], ochotných uzavrieť s nami [Concept('alliance_with_icon','alianciou')|e].\n@arrow_bonus_tier_2! Niektoré [countries] môže treba presvedčiť. Použitie #W $IMPROVE_RELATIONTITLE$#! [Concept('diplomatic_action_with_icon','diplomatická akcia')|e] ich pomaly pritiahne na našu stranu." # todo: CHANGED # todo: CONCEPT CASE
 hint_no_allies_hint_text_3: "#T Extra Hints:#!\n@hint! Pozor: naši spojenci nás môžu tiež zavolať do svojich vlastných vojen. Nezjednávajte aliancie s krajinami, ktoré pôsobia príliš zraniteľne, inak sa môžeme ocitnúť na prehrávajúcej strane cudzej vojny.\n@hint! Vždy môžete odmietnuť [call_to_arms] od nášho spojenca. Avšak takéto konanie znamená koniec priateľstva a poškodenie našej diplomatickej reputácie na dlhé roky." # todo: NEW TRANSLATION
 hint_no_allies_diplomatic: "\"Nikto nemôže v tomto svete prežiť sám.\"" # todo: NEW TRANSLATION
 hint_no_allies_administrative: "\"Aj keď nemáme v pláne útočiť, vstup do aliancie s jedným zo susedov môže odradiť našich nepriateľov od útoku.\"" # todo: NEW TRANSLATION
 hint_no_allies_military: "\"Silný spojenec nám kryje chrbát pri ofenzíve.\"" # todo: NEW TRANSLATION
 hint_black_death: "Čierna smrť" # todo: NEW TRANSLATION
 hint_black_death_hint_text: "$hint_black_death_hint_text_1$\n\n$hint_black_death_hint_text_2$\n\n$hint_black_death_hint_text_3$" # todo: NEW TRANSLATION
 hint_black_death_hint_text_1: "Čierna smrť je [Concept('situation_with_icon','situácia')|e], ktorá zdecimuje Starý svet, nasledujúc trasy obchodu a civilizácie. Bude najzničujúcejšia v hustých [Concept('locations_with_icon','lokalitách')|e] a časom vyprchá, keď preživší získajú dostatočnú [Concept('disease_resistance_with_icon','odolnosť voči chorobám')|e].\n\nVšetky [Concept('pop_type_with_icon','sociálna trieda')|e] budú umierať na chorobu, čo zanechá naše [Concept('buildings_with_icon','budovy')|E] prázdne, až kým sa neobjavia noví [ShowPopTypeName('peasants')], ktorí sa [Concept('promote_with_icon','povýšiť')|e]. To znamená, že náš [Concept('tax_base_with_icon','daňový základ')|e] pravdepodobne klesne, pretože výnosy budov kolabujú, a [ShowModifierTypeName('local_pop_promotion_speed')] bude kľúčová pre zotavenie." # todo: CHANGED # todo: CONCEPT CASE
 hint_black_death_hint_text_2: "#T Odporúčané kroky:#!\n@arrow_bonus_tier_3! Postavte [ShowBuildingTypeName('hospital')] [buildings] v našich najväčších [Concept('urban_locations_with_icon','mestské lokality')|e], ešte predtým, než choroba dosiahne našu [Concept('country_with_icon','krajinu')|e].\n@arrow_bonus_tier_2! Kliknite na banner [situation], aby ste si pozreli špeciálne interakcie, ktoré môžu pomôcť znížiť katastrofu.\n@arrow_bonus_tier_2! Udržiavajte vysokú [Concept('stability_with_icon','stabilitu')|e]. Nielenže pomáha proti [Concept('rebellions_with_icon','povstaniu')|e], ale je aj nevyhnutná pre [ShowModifierTypeName('local_pop_promotion_speed')].\n@arrow_bonus_tier_1! Nestavajte nové budovy v depopulujúcich sa lokalitách, lebo budú mať problém nájsť pracovníkov.\n@arrow_bonus_tier_1! Sledujte našu [ShowModifierTypeName('local_pop_promotion_speed')], keďže väčšina [buildings] a [Concept('rgo_with_icon','R.G.O.')|e] bude potrebovať [ShowPopTypeName('peasants')] na povýšenie." # todo: CHANGED # todo: CONCEPT CASE
 hint_black_death_hint_text_3: "#T Extra tipy:#!\n@hint! Môže to trvať roky, ale ak bude dosť roľníkov v našich [locations], ľudia sa nakoniec [Concept('promote_with_icon','povýšiť')|e] a zaplnia prázdne miesta.\n@hint! Poučte sa z tejto katastrofy a aplikujte lekcie pri iných pohromách: [Concept('starvation_with_icon','hladovaní')|e], [Concept('diseases_with_icon','chorobách')|e] a [Concept('loot_with_icon','lúpež')|e] majú podobné následky." # todo: CHANGED # todo: CONCEPT CASE
 hint_black_death_diplomatic: "\"Smrť prichádza. Nasleduje skaza a rozvrat.\"" # todo: NEW TRANSLATION
 hint_black_death_administrative: "\"Bledá smrť klope bez rozdielu na veže kráľov aj chatrče chudobných.\"" # todo: NEW TRANSLATION
 hint_black_death_military: "\"Štvrtý jazdec je medzi nami. Už nás nezachráni žiadna rada.\"" # todo: NEW TRANSLATION
 hint_fall_of_delhi: "[GetSituationByKey('fall_of_delhi').GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 hint_fall_of_delhi_hint_text: "$hint_fall_of_delhi_hint_text_1$\n\n$hint_fall_of_delhi_hint_text_2$\n\n$hint_fall_of_delhi_hint_text_3$\n\n$hint_fall_of_delhi_hint_text_4$" # todo: NEW TRANSLATION
 hint_fall_of_delhi_hint_text_1: "[GetSituationByKey('fall_of_delhi').GetName] je [Concept('situation_with_icon','situácia')|e], ktorá môže priniesť rozpad kedysi veľkej [GetCountry('DLH').GetFlavorRank]. Okolo nej sa zhromažďujú supi a potenciálni dobyvatelia pri oslabených hraniciach, ako autorita [GetCountry('DLH').GetGovernment.GetRulerOrRegent.GetName] upadá..." # todo: CHANGED # todo: CONCEPT CASE
 hint_fall_of_delhi_hint_text_2: "#T Odporúčané kroky ako Dillí:#!\n@arrow_bonus_tier_3! Ako [GetCountry('DLH').GetName] zvážte využitie mnohých nové [Concept('actions_with_icon','akcie')|e], ako [ShowGenericActionName('strengthen_neighbor_relations')] alebo [ShowGenericActionName('fall_of_delhi_appoint_governors')]. \n@arrow_bonus_tier_2! Počas rôznych [Concept('events_with_icon','udalostí')|e] súvisiacich s touto [Concept('situation_with_icon','situáciou')|e] sa snažte získať väčší [Concept('share_of_power_gc_with_icon','podiel moci')|e] na úkor protivníkov, inak môže prísť zánik." # todo: CHANGED # todo: CONCEPT CASE
 hint_fall_of_delhi_hint_text_3: "#T Extra tipy pre Dillí:#!\n@hint! Jednou z jasných výhod je naša mocná stála [Concept('army_with_icon','armáda')|e]. Na rozdiel od [Concept('levies_with_icon','brancov')|e] sa naši platení vojaci dopĺňajú a sú oveľa silnejší. To je pevný pilier moci, ktorý pomáha udržať režim." # todo: CHANGED # todo: CONCEPT CASE
 hint_fall_of_delhi_hint_text_4: "#T Odporúčané kroky ako odporca:#!\n@arrow_bonus_tier_3! Najsilnejšia [Concept('country_with_icon','krajina')|e] v $india$ bude na začiatku hlavný odporca tejto [Concept('situation_with_icon','situácii')|e], ale túto pozíciu môžeme získať vyhlásením vojny a získaním prvenstva. Môžeme to dosiahnuť buď tým, že budeme na začiatku [Concept('situation_with_icon','situácie')|e] najsilnejšou [Concept('country_with_icon','krajinou')|e] v $india$, alebo porazíme súčasného vodcu a uchmatneme prvenstvo cez [ShowPeaceTreatyTypeNameWithNoTooltip('peace_seize_opposition_leadership')] [Concept('peace_treaty_with_icon','mierovú dohodu')|e]." # todo: CHANGED # todo: CONCEPT CASE
 hint_fall_of_delhi_diplomatic: "\"Či už bránime trón [GetCountry('DLH').GetName] alebo povstávame ako jeho rival, je múdre udržiavať opatrné vzťahy so susedmi. Priateľstvo môže kúpiť čas, zatiaľ čo nepriateľstvo môže ospravedlniť nové dobývania.\"" # todo: NEW TRANSLATION
 hint_fall_of_delhi_administrative: "\"Získané územia v chaose sú krehké. Zvážte udelenie [Concept('subjects_with_icon','vazali')|e] alebo zlepšenie [Concept('control_with_icon','kontrolu')|e], aby novo obsadené územia neupadli tak rýchlo, ako boli získané.\" # todo: CHANGED # todo: CONCEPT CASE
 hint_fall_of_delhi_military: "\"Meč rozhoduje veľa v tomto zápase. Silná [Concept('army_with_icon','armáda')|e] môže ochrániť Dillí pred kolapsom alebo umožniť odporcom zraziť obra. Avšak aj víťazstvo prináša riziká! Strážte povstania a preťažené línie.\" # todo: CHANGED # todo: CONCEPT CASE
 hint_rise_of_the_ottomans: "[GetSituationByKey('rise_of_the_ottomans').GetNameWithNoTooltip] Rady" # todo: NEW TRANSLATION
 hint_rise_of_the_ottomans_hint_text: "$hint_rise_of_the_ottomans_hint_text_1$\n\n$hint_rise_of_the_ottomans_hint_text_2$" # todo: NEW TRANSLATION
 hint_rise_of_the_ottomans_hint_text_1: "Táto [Concept('situation_with_icon','situácia')|e] označuje vzostup #italic Najsilnejšieho beyliku#!, predurčeného vytvoriť jednu z najväčších ríš v dejinách. Prostredníctvom jedinečných [Concept('events_with_icon','udalostí')|e] a [Concept('actions_with_icon','akcií')|e] musíme zabezpečiť dominanciu nad ostatnými beylikmi, prekročiť [ShowProvinceDefinitionName('marmara_sea_province')] a získať bohatstvo [ShowLocationName('constantinople')]. Večná sláva čaká!" # todo: CHANGED # todo: CONCEPT CASE
 hint_rise_of_the_ottomans_hint_text_2: "#T Odporúčané kroky:#!\n@arrow_bonus_tier_2! Nadišiel náš čas vzostupu. Využitím mocných [Concept('actions_with_icon','akcií')|e] ako [ShowGenericActionName('press_claims')] a prínosom z [Concept('events_with_icon','udalostí')|e], ktoré urýchľujú [Concept('integration_with_icon','integrácia')|e], bude náš vzostup zapísaný do dejín.\n@arrow_bonus_tier_1! Ak držíte #Y 120#! [Concept('locations_with_icon','lokality')|e] a získate oporu v [ShowRegionName('balkan_region')], môžete rozšíriť [ShowGenericActionNameWithNoTooltip('press_claims')] [Concept('action_with_icon','akcia')|e] aj na túto [Concept('region_with_icon','región')|e]." # todo: CHANGED # todo: CONCEPT CASE
 hint_rise_of_the_ottomans_diplomatic: "\"Na začiatku [Concept('situation_with_icon','situácie')|e] môže #italic Najsilnejší beylik#! využiť jedinečné [Concept('actions_with_icon','akcie')|e], ako [ShowGenericActionName('seek_relations_with_the_byzantines')]. Využitie prestíže poslednej bašty $ROM$ na budovanie ich dedičstva.\" # todo: CHANGED # todo: CONCEPT CASE
 hint_rise_of_the_ottomans_administrative: "\"Aj keď v dobyvačných ťaženiach určite vynikneme, musíme myslieť aj na naše vnútro a jadro nášho panstva. Nezanedbávajme naše vnútorné záležitosti v honbe za slávou v cudzine!\""
 hint_rise_of_the_ottomans_military: "\"Musíme sa snažiť dobyť [Concept('towns_and_cities_with_icon','mestské lokality')|e] našich protivníkov. Tieto kampane budú základom generácií moci.\" # todo: CHANGED # todo: CONCEPT CASE
 hint_council_of_trent: "[GetSituationByKey('council_of_trent').GetNameWithNoTooltip]"
 hint_council_of_trent_hint_text: "$hint_council_of_trent_hint_text_1$\n\n$hint_council_of_trent_hint_text_2$"
 hint_council_of_trent_hint_text_1: "Počas [ShowSituationName('council_of_trent')] môže [GetUniqueInternationalOrganization('catholic_church').GetName] zmeniť svoje súčasné [Concept('laws_with_icon','zákony')|e] a zaviesť nové [Concept('policies_with_icon','politiky')|e] do [Concept('international_organization_with_icon','medzinárodnej organizácie')|e]." # todo: CHANGED # todo: CONCEPT CASE
 hint_council_of_trent_hint_text_2: "#T Možné interakcie:#!\n@arrow_bonus_tier_3! Ako [Concept('member_with_icon','člen')|e] [GetUniqueInternationalOrganization('catholic_church').GetName] môžete navrhnúť [ShowResolutionName('policy_vote')] použitím zoznamu [laws] nižšie alebo z panela Doktrín v [GetUniqueInternationalOrganization('catholic_church').GetName]\n@arrow_bonus_tier_2! Ako [Concept('member_with_icon','člen')|e] [GetUniqueInternationalOrganization('catholic_church').GetName] môžete hlasovať o navrhovanom [ShowResolutionName('policy_vote')]" # todo: CHANGED # todo: CONCEPT CASE
 hint_council_of_trent_diplomatic: "$hint_advisor_salute_diplomatic$" # todo: NEW TRANSLATION
 hint_council_of_trent_administrative: "$hint_advisor_salute_administrative$" # todo: NEW TRANSLATION
 hint_council_of_trent_military: "$hint_advisor_salute_military$" # todo: NEW TRANSLATION
 hint_golden_age_of_piracy: "[GetSituationByKey('golden_age_of_piracy').GetNameWithNoTooltip]"
 hint_golden_age_of_piracy_hint_text: "$hint_golden_age_of_piracy_hint_text_1$\n\n$hint_golden_age_of_piracy_hint_text_2$\n\n$hint_golden_age_of_piracy_hint_text_3$\n\n$hint_golden_age_of_piracy_hint_text_4$"
 hint_golden_age_of_piracy_hint_text_1: "[GetSituationByKey('golden_age_of_piracy').GetName] je [Concept('situation_with_icon','situácia')|e], ktorá môže vyvolať vznik nových pirátov. Slobodní muži, znechutení námorníci a tí, ktorí odmietajú centralizovanú autoritu, posilňujú čierne plachty, pod ktorými teraz konajú svoje nelegálne aktivity." # todo: CHANGED # todo: CONCEPT CASE
 hint_golden_age_of_piracy_hint_text_2: "#T Odporúčané kroky na boj proti pirátom:#!\n@arrow_bonus_tier_3! Zvážte vyhubenie pirátov pri našich pobrežiach, nemôžeme si dovoliť, aby sa voľne pohybovali po našich moriach. \n@arrow_bonus_tier_2! Každý [Concept('event_with_icon','udalosť')|e] súvisiaci s touto [Concept('situation_with_icon','situáciou')|e] môže odštartovať vznik novej pirátskej republiky." # todo: CHANGED # todo: CONCEPT CASE
 hint_golden_age_of_piracy_hint_text_3: "#T Extra tipy:#!\n@hint! Môžeme využiť nové [Concept('actions_with_icon','akcie')|e] v paneli [Concept('situation_with_icon','situácii')|e], či už plachtením s čiernou zástavou alebo nie." # todo: CHANGED # todo: CONCEPT CASE
 hint_golden_age_of_piracy_hint_text_4: "#T Odporúčané kroky ako pirát:#!\n@arrow_bonus_tier_3! Je múdre zabezpečiť pobrežie a vybudovať mocné [Concept('navy_with_icon','námorníctvo')|e]. Využitím [Concept('actions_with_icon','akciami')|e] ako [ShowGenericActionName('attract_sailors')] alebo [ShowGenericActionName('migrate_to_new_waters')] môžeme udržiavať všestrannú flotilu a prítomnosť." # todo: CHANGED # todo: CONCEPT CASE
 hint_golden_age_of_piracy_diplomatic: "\"Úsmevy a rum fungujú lepšie než hrozby, aspoň kým nezačnú rozprávať dela. Možno by bolo múdre udržiavať pevné vzťahy s dobrodruhmi. Nie všetko bohatstvo je striebro a zlato, pane.\"" # todo: NEW TRANSLATION
 hint_golden_age_of_piracy_administrative: "\"Správa našich námorných majetkov je v ére pirátstva delikátna záležitosť. Či už bránime proti nim alebo proti zradnej konkurencii, udržiavanie pevnej administrácie je kľúčové!\"" # todo: NEW TRANSLATION
 hint_golden_age_of_piracy_military: "\"Piráti neuznávajú žiadnu krajinu, keďže predali svoju. A keďže sú pri chytení určite obesení, nebudú mať výčitky z vraždy a ničenia, ak im nebude vyhovené.\"" # todo: NEW TRANSLATION
 hint_hundred_years_war: "[GetSituationByKey('hundred_years_war').GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 hint_hundred_years_war_hint_text: "$hint_hundred_years_war_hint_text_1$\n\n$hint_hundred_years_war_hint_text_2$\n\n$hint_hundred_years_war_hint_text_3$\n\n$hint_hundred_years_war_hint_text_4$\n\n$hint_hundred_years_war_hint_text_5$" # todo: CHANGED
 hint_hundred_years_war_hint_text_1: "[GetSituationByKey('hundred_years_war').GetName] uvrhne [ShowSubContinentName('western_europe')] do chaosu! Toto obdobie preverí spojenectvá a z trosiek určite povstanú nové mocnosti."
 hint_hundred_years_war_hint_text_2: "#T Odporúčané činnosti:#!\n@arrow_bonus_tier_3! [GetCountry('FRA').GetName] aj [GetCountry('ENG').GetName] majú prístup k [ShowGenericActionName('request_war_entry')], [ShowGenericActionName('hyw_sign_truce')] a [ShowGenericActionName('request_papal_delegates')]. Tieto jedinečné možnosti umožňujú manipulovať so statusom quo konfliktu alebo ho dokonca nakloniť v prospech ktorejkoľvek strany."
 hint_hundred_years_war_hint_text_3: "#T Ďalšie tipy:#!\n@hint! Ako účastník konfliktu môžeme získať územia alebo mocné spojenectvá."
 hint_hundred_years_war_hint_text_4: "#T Odporúčané kroky ako [Concept('subject_with_icon','vazal')|e] [GetCountry('FRA').GetName]:#!\n@arrow_bonus_tier_3! Bolo by rozumné zabezpečiť [ShowGenericActionName('demand_autonomy')]. Každý [ShowSubjectTypeName('appanage')] môže požadovať určitý stupeň autonómie a výrazne profitovať tým, že využije svoju dôležitosť ako obranca [GetCountry('FRA').GetAdjectiveWithNoTooltip] koruny." # todo: CHANGED # todo: CONCEPT CASE
 hint_hundred_years_war_hint_text_5: "#T Vassal Defection#!\n@hint! Disloyal subjects of either [GetCountry('FRA').GetName] or [GetCountry('ENG').GetName] may abandon their overlord and join the opposing crown, reshaping the war. Defections become much more likely during an active war between the two crowns; in peacetime, only deeply disloyal subjects will switch sides. A subject that shares its overlord's dynasty cannot defect at all, no matter how disloyal it becomes.\n@hint! As the overlord, watch [Concept('subject_loyalty_with_icon','vernosť vazala')|e] of subjects without our dynasty closely. Use [ShowGenericActionName('fra_diplomacy_with_subjects')] to shore up wavering vassals, or strengthen loyalty through opinion gifts before war breaks out. As the rival, target subjects ruled by a different dynasty and erode their loyalty over time." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 hint_hundred_years_war_diplomatic: "\"Dajte vojne šancu!\"" # todo: NEW TRANSLATION
 hint_hundred_years_war_administrative: "\"Zahraničné územia budú pravdepodobne trpieť zníženým [Concept('control_with_icon','kontrolám')|e]. Majte na pamäti [Concept('proximity_with_icon','blízkosť')|e] novodobytych lokalít k nášmu [Concept('capital_with_icon','hlavnému mestu')|e].\" # todo: CHANGED # todo: CONCEPT CASE
 hint_hundred_years_war_military: "\"Kým [GetCountry('FRA').GetName] a [GetCountry('ENG').GetName] sa navzájom vykrvácajú, tí s víziou môžu veľa získať. Majte armády pripravené a spojencov blízko.\" # todo: CHANGED
 hint_hussite_wars: "[GetSituationByKey('hussite_wars').GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 hint_hussite_wars_hint_text: "$hint_hussite_wars_hint_text_1$\n\n$hint_hussite_wars_hint_text_2$\n\n$hint_hussite_wars_hint_text_3$\n\n$hint_hussite_wars_hint_text_4$" # todo: NEW TRANSLATION
 hint_hussite_wars_hint_text_1: "[GetSituationByKey('hussite_wars').GetName] spôsobujú hlboký rozkol v [GetReligionByKey('catholic').GetName]. Mnohí [GetReligionByKey('catholic').GetAdjectiveWithNoTooltip] panovníci sa obávajú, že ak sa táto heréza rýchlo neudusí, môže zachvátiť rozsiahle časti [ShowContinentName('europe')] a ohroziť duchovnú autoritu [GetCountry('PAP').GetGovernment.GetRulerTitle]."
 hint_hussite_wars_hint_text_2: "#T Odporúčané kroky:#!\n@arrow_bonus_tier_3! [GetCountry('PAP').GetGovernment.GetRulerTitle] sa pokúsi viesť [Concept('war_with_icon','vojna')|e] proti [GetCountry('BOH').GetName]. Susedné [ShowReligionGroupAdjective('christian')] krajiny sa môžu pridať na ktorúkoľvek stranu a rozhodnúť osud celého [Concept('continent_with_icon','kontinentu')|e]." # todo: CHANGED # todo: CONCEPT CASE
 hint_hussite_wars_hint_text_3: "#T Extra tipy:#!\n@hint! [GetCountry('BOH').GetName] má prístup k mnohým jedinečným [Concept('actions_with_icon','akciám')|e], ako [ShowGenericActionName('convert_heretics_hw_action')] a [ShowGenericActionName('prepare_defenses_hw_action')], medzi inými." # todo: CHANGED # todo: CONCEPT CASE
 hint_hussite_wars_hint_text_4: "#T Odporúčané kroky ako [GetCountry('PAP').GetName]:#!\n@arrow_bonus_tier_3! Dobré vzťahy s ostatnými [GetReligionByKey('catholic').GetAdjective] krajinami vám môžu umožniť privolať ich do boja. Jedinečný [ShowPeaceTreatyTypeName('supress_hussite_faith')] [Concept('peace_treaty_with_icon','mierová dohoda')|e] je dostupný počas [Concept('situation_with_icon','situácie')|e]. Zníži cenu použitia #Y Force Convert#! [Concept('peace_treaty_with_icon','mierová dohoda')|e].\n@arrow_bonus_tier_2! [GetReligionByKey('catholic').GetAdjective] [Concept('countries_with_icon','Krajiny')|e] vo vojne s [GetCountry('BOH').GetName] získajú prístup k jedinečnej [Concept('unit_with_icon','jednotke')|e] akcii [ShowUnitAbilityName('hussite_tribunal')]. Tá umožní násilné [Concept('convert_with_icon','konvertovať')|e] [GetReligionByKey('hussite').GetAdjective] [Concept('pops_with_icon','populácie')|e] a zabiť tých, ktorí sa bránia v [Concept('province_capitals_with_icon','hlavných mestách provincií')|e] ktoré kontrolujú počas vojny." # todo: CHANGED # todo: CONCEPT CASE
 hint_hussite_wars_diplomatic: "\"Viera by nás mala viesť k hľadaniu rovnako zmýšľajúcich spojencov a vytrvaniu v tomto búrlivom období.\""
 hint_hussite_wars_administrative: "\"Mali by sme sa starať o udržiavanie [Concept('religious_unity_with_icon','náboženská jednota')|e].\" # todo: CHANGED # todo: CONCEPT CASE
 hint_hussite_wars_military: "\"Je pravdepodobné, že budeme musieť našu vieru brániť násilím.\""
 hint_italian_wars: "[GetSituationByKey('italian_wars').GetNameWithNoTooltip]"
 hint_italian_wars_hint_text: "$hint_italian_wars_hint_text_1$\n\n$hint_italian_wars_hint_text_2$\n\n$hint_italian_wars_hint_text_3$\n\n$hint_italian_wars_hint_text_4$"
 hint_italian_wars_hint_text_1: "The [GetSituationByKey('italian_wars').GetName] erupt when a [Concept('great_power_with_icon','veľmoc')|e] goes to war in [ShowRegionName('italy_region')] after 1450, or automatically from 1496 onward. #italic Foreign Leagues#!, supported by the great powers of [ShowContinentName('europe')], clash against Italian states defending their sovereignty through their own #italic Italian Leagues#!. As the conflict deepens, [Concept('situation_tension','napätie')|e] rises, unlocking new [Concept('actions_with_icon','akcie')|e] at four key thresholds. Each league fights toward a distinct outcome: Italian leagues defend the peninsula while each Foreign League pursues its own ambitions, with unique lasting rewards for the winning side." # todo: CHANGED # todo: CONCEPT CASE
 hint_italian_wars_hint_text_2: "#T Odporúčané akcie:#!\n@arrow_bonus_tier_3! Talianske štáty by mali [ShowGenericActionName('join_a_league')] alebo [ShowGenericActionName('create_italian_league')] aby zoskupili zdroje a bránili sa spoločne. Členstvo poskytuje zdieľaný vojenský prístup, možnosť verbovať vojska na území spoluičlenov a bonus k udržiavaniu žoldnierov. Lídri Talianskej ligy, veľmoci a zaprisahaní nepriatelia votrelcov môžu použiť [ShowGenericActionName('iw_send_aid')] na doručenie zlata alebo posíl mužstva bojujúcemu lídrovi Talianskej ligy.\n@arrow_bonus_tier_3! Vedenia Foreign League by mali [ShowGenericActionName('plan_campaign_in_italy')] aby zabezpečili [Concept('casus_belli_with_icon','casus Belli')|e] proti talianskym štátom, a potom použiť [ShowGenericActionName('iw_intervene_in_war')] na vstup do prebiehajúcich vojen na strane svojich členov. Členovia Foreign League získavajú bonus k efektívnosti vojnového skóre.\n@arrow_bonus_tier_3! Akýkoľvek člen ligy môže použiť #italic Secure Italy#! [Concept('casus_belli_with_icon','casus Belli')|e] na nárokovanie provincií v [ShowRegionName('italy_region')] od protivníckych štátov. Ochota ho použiť sa zvyšuje s aktuálnym [Concept('situation_tension','napätím')|e]." # todo: CHANGED # todo: CONCEPT CASE
 hint_italian_wars_hint_text_3: "#T Prahy napätia situácie:#!\n@hint! #Y 25#!: Odomykajú sa opevňovacie [Concept('actions_with_icon','akcie')|e] pre akéhokoľvek člena ligy alebo taliansky štát, zatiaľ čo úplatky sa stávajú dostupné vedúcim ligy.\n@hint! #Y 50#!: Prostredníctvom parlamentu sa sprístupní vojenská mobilizácia a dopyt po zbraniach stúpa na kapitálových trhoch lídrov Talianskej ligy.\n@hint! #Y 75#!: Talianske ligy automaticky povolávajú členov, ktorí nie sú ich subjektmi ani sponzormi, aby bránili každého lídra napadnutého Foreign League. Pre oprávnené mocnosti sa odomykajú [Concept('actions_with_icon','akcie')|e] zasahovania a porušenia suverenity.\n@hint! #Y 100#!: Všetky prímeria medzi vedúcimi líg sú zrušené. Foreign Leagues získavajú právo svolávať členov do útočných vojen." # todo: CHANGED # todo: CONCEPT CASE
 hint_italian_wars_hint_text_4: "#T Doplnkové tipy:#!\n@hint! Lídri ligy môžu [ShowGenericActionName('expel_league_member')] na vylúčenie nespoľahlivých členov. Dostačujúco mocní členovia môžu [ShowGenericActionName('challenge_league_leadership')] získať vedenie zvnútra, hoci to vyžaduje víťazstvo vo vojne proti súčasnému lídrovi.\n@hint! Veľmoci môžu pôsobiť ako #italic Sponsors#!, prispievajúc zlatom a mužstvom talianskej lige bez formálneho vstupu. Po skončení vojny môže líder víťaznej ligy spolu s každým členom víťaznej Foreign League [ShowGenericActionName('establish_italian_administration_center')] v meste v [ShowRegionName('italy_region')] aby upevnili svoj vplyv.\n@hint! Strana, ktorá ovláda aspoň #Y 200#! miest v [ShowRegionName('italy_region')] keď situácia skončí, získa rozhodujúcu výhodu v konečnom výsledku.\n@hint! [ShowGenericActionName('dissolve_italian_league')] výrazne znižuje [Concept('situation_tension','napätia')|e], čím sa stáva silným diplomatickým nástrojom, aj za cenu samotnej ligy." # todo: CHANGED # todo: CONCEPT CASE
 hint_italian_wars_diplomatic: "\"Verbujte ochotných, uplácajte nerozhodných a nenechajte žiadne talianske mesto čeliť cudziemu prívalu osamote.\" # todo: CHANGED
 hint_italian_wars_administrative: "\"Napätie je zbraň — nech rastie, keď nám slúži, a stlmime ho skôr, než nás spáli.\" # todo: CHANGED
 hint_italian_wars_military: "\"Opevnite priechody, zvolajte každého spojenca do zbraní a utopte votrelcov skôr, než preniknú do nášho vnútrozemia.\" # todo: CHANGED
 hint_little_ice_age: "[GetSituationByKey('little_ice_age').GetNameWithNoTooltip]"
 hint_little_ice_age_hint_text: "$hint_little_ice_age_hint_text_1$\n\n$hint_little_ice_age_hint_text_2$\n\n$hint_little_ice_age_hint_text_3$"
 hint_little_ice_age_hint_text_1: "[GetSituationByKey('little_ice_age').GetName] je tu! Mrazivé počasie pokrýva krajinu. Musíme urobiť všetko pre ochranu úrody, zvierat a prežitie našich ľudí!"
 hint_little_ice_age_hint_text_2: "#T Odporúčané kroky:#!\n@arrow_bonus_tier_3! Zvážte rozšírenie [Concept('buildings_with_icon','budovy')|e], ktoré produkujú alebo zvyšujú produkciu [Concept('food_with_icon','potraviny')|e]." # todo: CHANGED # todo: CONCEPT CASE
 hint_little_ice_age_hint_text_3: "#T Extra tipy:#!\n@hint! Môžeme využiť jedinečné [Concept('actions_with_icon','akcie')|e], aby sme posilnili a rozdelili [Concept('food_with_icon','potraviny')|e] medzi naše [Concept('provinces_with_icon','provincie')|e]." # todo: CHANGED # todo: CONCEPT CASE
 hint_little_ice_age_diplomatic: "\"Zima prichádza.\""
 hint_little_ice_age_administrative: "\"Správna výroba a distribúcia [Concept('food_with_icon','potraviny')|e] ochráni naše [Concept('pops_with_icon','populácie')|e] pred predčasným stretnutím so žatvou.\" # todo: CHANGED # todo: CONCEPT CASE
 hint_little_ice_age_military: "\"Zamrznuté vodné plochy môžu byť dočasne priechodné, ale [Concept('armies_with_icon','armády')|e] uviaznuté v zimných horách riskujú byť uviaznuté omnoho dlhšie.\" # todo: CHANGED # todo: CONCEPT CASE
 hint_the_revolution: "[GetSituationByKey('the_revolution').GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 hint_the_revolution_hint_text: "$hint_the_revolution_hint_text_1$\n\n$hint_the_revolution_hint_text_2$\n\n$hint_the_revolution_hint_text_3$" # todo: NEW TRANSLATION
 hint_the_revolution_hint_text_1: "Vypukla [GetSituationByKey('the_revolution').GetName]! Monarchie sa trasú, keď sa myšlienky slobody, rovnosti a bratstva šíria ako požiar. Prijmeme plamene zmien, alebo budeme brániť starý poriadok?" # todo: NEW TRANSLATION
 hint_the_revolution_hint_text_2: "#T Odporúčané kroky:#!\n@arrow_bonus_tier_3! Môžeme sa stať [Concept('revolutionary_with_icon','revolučným')|e] prispením na stranu revolučných povstalcov počas [ShowDisasterName('revolution_disaster')] [Concept('disaster_with_icon','katastrofy')|e].\n@arrow_bonus_tier_2! [Concept('situation','Situácia')|e] umožňuje #Y 2#! jedinečné [Concept('peace_treaties_with_icon','mierové dohody')|e]: [ShowPeaceTreatyTypeName('reinstate_the_monarchy')] a [ShowPeaceTreatyTypeNameWithNoTooltip('force_revolution')].\n@arrow_bonus_tier_1! [Concept('situation','Situácia')|e] poskytuje prístup k novým [Concept('actions_with_icon','akciám')|e] ako [ShowGenericActionName('suppress_foreign_revolutionaries')] a [ShowGenericActionName('assist_foreign_revolutionaries')]." # todo: CHANGED # todo: CONCEPT CASE
 hint_the_revolution_hint_text_3: "#T Extra tipy:#!\n@hint! Najsilnejšia revolučná krajina môže získať titul [Concept('revolutionary_target_with_icon','cieľ revolúcie')|e] tým, že bude mať najvyšší [Concept('great_power_score_with_icon','skóre veľmoci')|e]." # todo: CHANGED # todo: CONCEPT CASE
 hint_the_revolution_diplomatic: "\"V politickom prostredí sa zdá, že mnohí monarchovia pri snahe potlačiť tieto revolúcie prišli o hlavu.\"" # todo: NEW TRANSLATION
 hint_the_revolution_administrative: "\"Mali by sme si vybrať stranu a rýchlo. Prežitie nášho kráľovstva závisí od rýchleho rozhodovania. Ak revolúcia zaklope na dvere, buďme pripravení.\"" # todo: NEW TRANSLATION
 hint_the_revolution_military: "\"Či už revolučné hnutie drvíme alebo podporujeme, náš vplyv musí siahať za hranice.\"" # todo: NEW TRANSLATION
 hint_western_schism: "[GetSituationByKey('western_schism').GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 hint_western_schism_hint_text: "$hint_western_schism_text_1$\n\n$hint_western_schism_text_2$\n\n$hint_western_schism_text_3$\n\n$hint_western_schism_text_4$" # todo: NEW TRANSLATION
 hint_western_schism_text_1: "Počas [ShowSituationNameWithNoTooltip('western_schism')] [Concept('situation','situácie')|e] je [Concept('international_organization_with_icon','medzinárodná organizácia')|e] [GetUniqueInternationalOrganization('catholic_church').GetName] rozdelená medzi dvoch kandidátov na pápežský stolec, čo znemožňuje akúkoľvek interakciu s Kuriou.\n\nNa ovplyvnenie výsledku [situation] sa podľa vašej úlohy v Cirkvi dajú podniknúť nasledujúce kroky:" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 hint_western_schism_text_2: "#T [countries] v držbe [Concept('cardinal_with_icon','kardinálovi')|e]:#!\n@arrow_bonus_tier_3! Hlasujte za jedného z kandidátov" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 hint_western_schism_text_3: "#T [countries] bez [Concept('cardinal_with_icon','kardinála')|e]:#!\n@arrow_bonus_tier_3! Použite [situation] [Concept('action','akcie')|e] #V $schism_show_support_for_one_pope$#! na udelenie postupu vybranému kandidátovi\n@arrow_bonus_tier_2! Použite náboženskú [action] $request_cardinal_seat$ na získanie [cardinal]\n@arrow_bonus_tier_1! Použite [situation] [action] #V $schism_demand_support_from_one_pope$#! na vyťaženie zo [situation]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 hint_western_schism_text_4: "Počas [situation] sa v katolíckom svete rozšíria kacírske prúdy.\n\n#T Odporúčané kroky:#!\n@arrow_bonus_tier_3! Zvážte použitie [Concept('situation','situácia')|e] akcie #V $schism_show_unity_of_faith$#! na udržanie vysokej [Concept('religious_unity_with_icon','náboženskej jednote')|e]." # todo: CHANGED # todo: CONCEPT CASE
 hint_reformation: "[GetSituationByKey('reformation').GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 hint_reformation_hint_text: "$hint_reformation_hint_text_1$\n\n$hint_reformation_hint_text_2$\n\n$hint_reformation_hint_text_3$" # todo: NEW TRANSLATION
 hint_reformation_hint_text_1: "Počas [ShowSituationNameWithNoTooltip('reformation')] [Concept('situation','situácie')|e] budú [ShowBuildingTypeName('lutheran_preachers')] a [ShowBuildingTypeName('calvinist_preachers')] šíriť nové [Concept('religions_with_icon','náboženstvá')|e] po [ShowReligionGroupAdjective('christian')] svete." # todo: CHANGED # todo: CONCEPT CASE
 hint_reformation_hint_text_2: "#T Boj proti reformátorom:#!\n@arrow_bonus_tier_3! Keď máte vybranú [ShowPolicyName('jesuits_allowed')], odstráňte [ShowBuildingTypeName('lutheran_preachers')] a [ShowBuildingTypeName('calvinist_preachers')] [Concept('buildings_with_icon','budovy')|e], čo vás bude stáť [Concept('stability_with_icon','stabilita')|e]\n@arrow_bonus_tier_3! Po povolení stavte a udržiavajte [ShowBuildingTypeName('jesuit_college')], aby ste bojovali proti šíreniu [ShowReligionName('lutheran')] a [ShowReligionName('calvinist')]" # todo: CHANGED # todo: CONCEPT CASE
 hint_reformation_hint_text_3: "#T Pridajte sa k reformátorom:#!\n@arrow_bonus_tier_3! Ak sa jeden z nových vierovyznaní rozšíri do vašej krajiny, prijmite ho a konvertujte s akciou #V $embrace_the_reformation$#!\n@arrow_bonus_tier_2! Použite @religion_panel! [Link('country_religion', '', '@society_panel! Religion Tab')] na konverziu na nové [religion]" # todo: CHANGED
 hint_reformation_diplomatic: "$hint_advisor_salute_diplomatic$" # todo: NEW TRANSLATION
 hint_reformation_administrative: "$hint_advisor_salute_administrative$" # todo: NEW TRANSLATION
 hint_reformation_military: "$hint_advisor_salute_military$" # todo: NEW TRANSLATION
 hint_treaty_of_tordesillas: "[GetSituationByKey('treaty_of_tordesillas').GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 hint_treaty_of_tordesillas_hint_text: "$hint_treaty_of_tordesillas_hint_text_1$\n\n$hint_treaty_of_tordesillas_hint_text_2$" # todo: NEW TRANSLATION
 hint_treaty_of_tordesillas_hint_text_1: "Začala sa [GetSituationByKey('treaty_of_tordesillas').GetName]! [GetSituationByKey('treaty_of_tordesillas').MakeScope.GetVariable('var_west_country').GetCountry.GetName] a [GetSituationByKey('treaty_of_tordesillas').MakeScope.GetVariable('var_east_country').GetCountry.GetName] sa usilujú rozdeliť Nový svet medzi sebou!" # todo: NEW TRANSLATION
 hint_treaty_of_tordesillas_hint_text_2: "#T Odporúčané kroky:#!\n@arrow_bonus_tier_3! Môžeme využiť jedinečné [Concept('actions_with_icon','akcie')|e] v paneli [Concept('situation','situácii')|e] na formovanie našich koloniálnych ambícií.\n@arrow_bonus_tier_2! [Concept('situation','Situácia')|e] sa nakoniec dostane do #Y Druhej#! fázy, keď bude ratifikovaný. Potom sa doň môže zapojiť viac [Concept('countries_with_icon','krajiny')|e] a uplatniť svoje nároky." # todo: CHANGED # todo: CONCEPT CASE
 hint_treaty_of_tordesillas_diplomatic: "\"Toto je dobrá príležitosť vyrezať si kúsok novoobjavených území pod zámienkou náboženskej a nadradenej autority.\"" # todo: NEW TRANSLATION
 hint_treaty_of_tordesillas_administrative: "\"Nový svet ponúka mnohé obchodné príležitosti. Využime ich.\"" # todo: NEW TRANSLATION
 hint_treaty_of_tordesillas_military: "\"Nemôžeme dovoliť, aby naši nepriatelia obsadili tieto územia skôr než my!\"" # todo: NEW TRANSLATION
 hint_great_pestilence: "[GetSituationByKey('great_pestilence').GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 hint_great_pestilence_hint_text: "$hint_black_death_hint_text_2$\n\n$hint_black_death_hint_text_3$" # todo: NEW TRANSLATION
 hint_great_pestilence_diplomatic: "\"Naši spojenci nás opustili. Vedenie nás zradilo. Opustite svoje posty! Utečte, utečte o život!\"" # todo: NEW TRANSLATION
 hint_great_pestilence_administrative: "\"Nezúfajte, existuje mnoho opatrení, ktoré môžeme prijať, aby sme zmiernili úmrtia, akokoľvek malé a neúčinné môžu byť...\"" # todo: NEW TRANSLATION
 hint_great_pestilence_military: "\"Majte na pamäti presun našich [Concept('armies_with_icon','armád')|e] cez [Concept('locations_with_icon','lokality')|e] postihnuté chorobou. Nemôžeme si dovoliť stratu vojakov.\" # todo: CHANGED # todo: CONCEPT CASE
 hint_columbian_exchange: "[GetSituationByKey('columbian_exchange').GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 hint_columbian_exchange_hint_text: "$hint_columbian_exchange_hint_text_1$\n\n$hint_columbian_exchange_hint_text_2$" # todo: NEW TRANSLATION
 hint_columbian_exchange_hint_text_1: "[GetSituationByKey('columbian_exchange').GetName] začala! [Concept('trade_with_icon','obchod')|e] a [Concept('goods_with_icon','tovary')|e] teraz budú prúdiť medzi Starým a Novým svetom!" # todo: CHANGED # todo: CONCEPT CASE
 hint_columbian_exchange_hint_text_2: "#T Odporúčané kroky:#!\n@arrow_bonus_tier_3! Môžeme využiť jedinečné [Concept('actions_with_icon','akcie')|e] v paneli [Concept('situation_with_icon','situácii')|e], aby sme zvýšili zisk zavedením nových tovarov do nášho [Concept('market_with_icon','trhu')|e]." # todo: CHANGED # todo: CONCEPT CASE
 hint_columbian_exchange_diplomatic: "\"Zisky z obchodu poháňajú svet!\"" # todo: NEW TRANSLATION
 hint_columbian_exchange_administrative: "$hint_treaty_of_tordesillas_administrative$" # todo: NEW TRANSLATION
 hint_columbian_exchange_military: "\"Musíme urobiť všetko pre to, aby sme zabezpečili ziskové zdroje a nové tovary skôr než naši konkurenti!\"" # todo: NEW TRANSLATION
 hint_war_of_religions: "[GetSituationByKey('war_of_religions').GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 hint_war_of_religions_hint_text: "$hint_war_of_religions_hint_text_1$\n\n$hint_war_of_religions_hint_text_2$\n\n$hint_war_of_religions_hint_text_3$\n\n$hint_war_of_religions_hint_text_4$" # todo: NEW TRANSLATION
 hint_war_of_religions_hint_text_1: "Počas [ShowSituationNameWithNoTooltip('war_of_religions')] [Concept('situation','situácie')|e] sa dve [Concept('international_organizations_with_icon','medzinárodné organizácie')|e] snažia zabezpečiť prežitie svojich [Concept('religions_with_icon','náboženstiev')|e] v rámci [GetUniqueInternationalOrganization('hre').GetName]. [GetUniqueInternationalOrganization('protestant_union').GetName] a [GetUniqueInternationalOrganization('catholic_league').GetName] budú poskytovať ochranu [Concept('countries_with_icon','krajiny')|e] ríše. Pri narastajúcom napätí sa obe snažia dosiahnuť náboženskú supremaciu a meniť [Concept('laws_with_icon','zákonov')|e] [GetUniqueInternationalOrganization('hre').GetNameWithNoTooltip] podľa svojich preferencií." # todo: CHANGED # todo: CONCEPT CASE
 hint_war_of_religions_hint_text_2: "#T Odporúčané kroky:#!\n@arrow_bonus_tier_3! Pridajte sa k [international_organization], ktorú chcete podporiť\n@arrow_bonus_tier_2! Hľadajte nové [Concept('alliances_with_icon','aliancie')|e] s vonkajšími krajinami\n@arrow_bonus_tier_2! Ako krajina mimo [GetUniqueInternationalOrganization('hre').GetNameWithNoTooltip], hľadajte [alliance] s vodcom preferovanej náboženskej ligy" # todo: CHANGED # todo: CONCEPT CASE
 hint_war_of_religions_hint_text_3: "#T Ak ste vodcom náboženskej ligy:#!\n@arrow_bonus_tier_3! Použite [situation] [Concept('action','akcie')|e] #V $prepare_military_escalation$#!, aby ste získali [ShowCasusBelliName('cb_religious_superiority')]\n@hint! Akonáhle ju použijete, môžete vynútiť [ShowPeaceTreatyTypeName('religious_supremacy')] na presadenie požiadaviek vašej frakcie\n@arrow_bonus_tier_2! Použite [situation] [action] #V $demand_member_removal$#!, aby ste pred vypuknutím [war] odstránili nebezpečné krajiny z druhej [international_organization]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 hint_war_of_religions_hint_text_4: "#T Extra tipy:#!\n@hint! Počas [war] typu [ShowCasusBelliName('cb_religious_superiority')] [countries] získajú [war_exhaustion]\n@hint! Ak #Y 80%#! všetkých účastníkov túži po [Concept('peace_with_icon','mieri')|e], dosiahne sa #Y Mier vo Westfálsku#!\n@hint! To donúti vojnu skončiť a dosiahne náboženský mier v [GetUniqueInternationalOrganization('hre').GetNameWithNoTooltip]" # todo: CHANGED # todo: CONCEPT CASE
 hint_war_of_religions_diplomatic: "$hint_advisor_salute_diplomatic$" # todo: NEW TRANSLATION
 hint_war_of_religions_administrative: "$hint_advisor_salute_administrative$" # todo: NEW TRANSLATION
 hint_war_of_religions_military: "$hint_advisor_salute_military$" # todo: NEW TRANSLATION
 hint_guelphs_and_ghibellines: "[GetSituationByKey('guelphs_and_ghibellines').GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 hint_guelphs_and_ghibellines_hint_text: "$hint_guelphs_and_ghibellines_hint_text_1$\n\n$hint_guelphs_and_ghibellines_hint_text_2$\n\n$hint_guelphs_and_ghibellines_hint_text_3$" # todo: CHANGED
 hint_guelphs_and_ghibellines_hint_text_1: "Počas [ShowSituationNameWithNoTooltip('guelphs_and_ghibellines')] [Concept('situation','situácie')|e] sa [Concept('international_organizations_with_icon','medzinárodné organizácie')|e] [GetUniqueInternationalOrganization('guelphs_io').GetName] a [GetUniqueInternationalOrganization('ghibellines_io').GetName] súperia o vplyv nad regiónom [ShowRegionName('italy_region')] v mene [GetUniqueInternationalOrganization('catholic_church').GetLeaderTitle] ([GetUniqueInternationalOrganization('guelphs_io').GetName]) alebo [GetUniqueInternationalOrganization('hre').GetLeaderTitle] ([GetUniqueInternationalOrganization('ghibellines_io').GetName]). Lídrom oboch [international_organizationss] bude krajina, ktorá má svoju [Concept('capital','hlavné mesto')|e] v [ShowRegionNameWithNoTooltip('italy_region')] a najvyššie [Concept('great_power_score','skóre veľmoci')|e]." # todo: CHANGED # todo: CONCEPT CASE
 hint_guelphs_and_ghibellines_hint_text_2: "#T Ak ste členom ktorejkoľvek strany:#!\n@arrow_bonus_tier_3! Prinúťte [Concept('country_with_icon','krajiny')|e] vstúpiť do vášho zoskupenia s pomocou [ShowCasusBelliName('cb_gag_force_country_into_faction')] [Concept('casus_belli_with_icon','casus belli')|e]\n@arrow_bonus_tier_2! Nútenie krajiny zmeniť frakciu touto mierovou zmluvou pridá skóre vašej frakcii. Útočenie na vlastných členov frakcie však skóre vašej frakcie odčíta.\n@arrow_bonus_tier_1! Pomáhajte členom vašej frakcie udržať si ich [Concept('tax_base_with_icon','daňového základu')|e] prostredníctvom diplomatických vzťahov ako [Concept('alliances_with_icon','aliancií')|e] alebo [Concept('guarantee_with_icon','garancie')|e]\n@arrow_bonus_tier_1! Zvyšujte [Concept('tax_base_with_icon','daňového základu')|e] vášho [country]" # todo: CHANGED # todo: CONCEPT CASE
 hint_guelphs_and_ghibellines_hint_text_3: "#T Potential Situation Outcomes:#!\n@hint! In case of a victory for the [GetUniqueInternationalOrganization('guelphs_io').GetName], all countries within Imperial [ShowRegionName('italy_region')] will be forced to leave the [GetUniqueInternationalOrganization('hre').GetName] and will not allowed to rejoin for 50 years.\nAdditionally, the leader of the [GetUniqueInternationalOrganization('guelphs_io').GetName] will be able to form $ITA_f$ without the requirement to own specific [locations] for 200 years.\n@hint! In case of a victory for the [GetUniqueInternationalOrganization('ghibellines_io').GetName], all countries within Imperial [ShowRegionName('italy_region')] will be forced to join the [GetUniqueInternationalOrganization('hre').GetName].\nAdditionally, the leader of the [GetUniqueInternationalOrganization('ghibellines_io').GetName] will be able to request the Kingdom of Italy Title from the [hre_emperor] at much reduced requirements for 200 years, giving them an upgrade to the kingdom [Concept('country_rank','rang krajiny')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 hint_guelphs_and_ghibellines_diplomatic: "$hint_advisor_salute_diplomatic$" # todo: NEW TRANSLATION
 hint_guelphs_and_ghibellines_administrative: "$hint_advisor_salute_administrative$" # todo: NEW TRANSLATION
 hint_guelphs_and_ghibellines_military: "$hint_advisor_salute_military$" # todo: NEW TRANSLATION

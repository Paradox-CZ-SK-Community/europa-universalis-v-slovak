 hint_naples: "Začiatočné rady pre Neapol" # todo: NEW TRANSLATION
 hint_naples_hint_text: "Ako najväčšia mocnosť v [Concept('region_with_icon','regióne')|e] je [Player.GetLongName] pripravená dominovať talianskému obchodu a politike, zatiaľ čo naši [Concept('subjects_with_icon','vazalov')|e] v Grécku predstavujú pohodlný východiskový bod pre vonkajšiu expanziu.\n\n@hint! #T Stavajte [roads] z nášho [capital] #!\nMali by sme sa snažiť položiť [Concept('roads_with_icon','cesty')|e] z [capital_icon] [Player.GetCapital.GetName] ku každému blízkemu [ShowLocationRankName('town')] a cennému [rgo_with_icon|e], aby sme zvýšili našu [Concept('proximity_with_icon','blízkosť')|e], a tým aj náš [Concept('control_with_icon','kontrola')|e].\n\n@hint! #T Rozšírte ťažbu [raw_materials]#!\nNaša [country] obsahuje veľké množstvo cenných [Concept('raw_materials_with_icon','surovín')|e]. [ShowGoodsName('wool')], [ShowGoodsName('fiber_crops')] a [ShowGoodsName('silk')] nie sú len hodnotné samy o sebe, ale môžu byť použité v našich textilných odvetviach v [Concept('urban_locations_with_icon','mestských lokalitách')|e]. Rozšírte tieto [Concept('rgo_with_icon','R.G.O.')|e] čo najskôr a uprednostnite zvýšenie [control] tam.\n\n@hint! #T Rozvíjajte textilný priemysel #!\nPostavte [ShowBuildingTypeName('cloth_guild')] a [ShowBuildingTypeName('fine_cloth_guild')] [buildings] v našich [urban_locations]. Použijú naše [raw_materials] na výrobu drahých [Concept('produced_goods_with_icon','vyrábané tovary')|e], zatiaľ čo zvýšený dopyt spraví naše [rgo] ešte ziskovejšie.\n\n@hint! #T Postavte [ShowBuildingTypeName('marketplace')] aby ste exportovali prebytok#!\nAutomatický [Concept('trade_with_icon','obchod')|e] bude [Concept('export_with_icon','vývoz')|e] akýkoľvek prebytok [Concept('goods_with_icon','tovary')|e], ako napríklad [ShowGoodsNameWithNoTooltip('fine_cloth')], do iných [Concept('markets_with_icon','trhov')|e], čo vytvorí [Concept('trade_income_with_icon','príjem z obchodu')|e] a udrží celú výrobnú reťaz ziskovú." # todo: CHANGED # todo: CONCEPT CASE
 hint_naples_diplomatic: "$hint_advisor_salute_diplomatic$" # todo: NEW TRANSLATION
 hint_naples_administrative: "$hint_advisor_salute_administrative$" # todo: NEW TRANSLATION
 hint_naples_military: "$hint_advisor_salute_military$" # todo: NEW TRANSLATION
 hint_castile: "Začiatočné rady pre Kastíliu" # todo: NEW TRANSLATION
 hint_castile_hint_text: "Ako dominantná mocnosť v [Concept('region_with_icon','regióne')|e] stojí [Player.GetLongName] v priaznivej pozícii na zjednotenie Pyrenejského polostrova pod jednou korunou. Naša administratíva je však už teraz preťažená a náš [control] na juhu je taký nízky, že takmer neprispieva do nášho [Concept('budget_with_icon','rozpočtu')|e]. Bolo by rozumné konsolidovať náš [control] nad súčasným územím pred ďalšími dobytím.\n\n@hint! #T Stavajte [roads] z nášho [capital] #!\n[Locations] bez [Concept('control_with_icon','kontroly')|e] sú prakticky nepoužiteľné pre našu administráciu. Stavajte [Concept('roads_with_icon','cesty')|e] a [ShowBuildingTypeName('bridge_infrastructure')] budovy z nášho [Concept('capital_with_icon','hlavného mesta')|e], aby ste zvýšili našu [Concept('proximity_with_icon','blízkosť')|e], a tým aj náš [control]. Často kontrolujte [proximity] Map Mode!\n\n@hint! #T Inštalujte [ShowBuildingTypeName('local_governor')]#!\nJuh našej [country] je bohatý a urbanizovaný, no máme tam malý [control]. Zvážte postavenie [ShowBuildingTypeName('local_governor')] v [ShowLocationName('sevilla')]. Bude fungovať ako sekundárny [capital], vyžarujúci [proximity] do blízkych [locations]. Majte na pamäti, že miestni guvernéri sa dajú stavať len v [ShowLocationRankName('city')], sú drahí na udržiavanie a vyžadujú priamu [road] spojenie s naším [capital].\n\n@hint! #T Podrobte [GetCountry('GRA').GetName]#!\nAj keď nie sme schopní efektívne vlastniť ich zem hneď, môžeme spraviť z [GetCountry('GRA').GetName] nášho [Concept('subject_with_icon','vazala')|e]. Vládli by zem v našom mene a platili by mesačný tribut do nášho [treasury]. Zvážte ich [Concept('annexing_with_icon','anektovanie')|e] až keď bude naša infraštruktúra a technológia dostatočne rozvinutá. Na [annex] [subject] musíme vládnuť nad nimi viac než #Y 10#! rokov a mať s nimi dobré vzťahy.\n\n@hint! #T Plus Ultra#!\n[Concept('explorers_with_icon','Prieskumníci')|e] prinášajú príbehy o nezmerateľnom bohatstve zo svojich výprav do Indie. Avšak pustiť sa do takýchto podnikov bez tých najmodernejších [Concept('advances_with_icon','pokroky')|e] môže byť mimoriadne nákladné." # todo: CHANGED # todo: CONCEPT CASE
 hint_castile_diplomatic: "$hint_advisor_salute_diplomatic$" # todo: NEW TRANSLATION
 hint_castile_administrative: "$hint_advisor_salute_administrative$" # todo: NEW TRANSLATION
 hint_castile_military: "$hint_advisor_salute_military$" # todo: NEW TRANSLATION
 hint_ottomans: "Začiatočné rady pre Osmanskú ríšu" # todo: NEW TRANSLATION
 hint_ottomans_hint_text: "Hroziaci Rise of the Turks [Concept('situation_with_icon','situácia')|e] ponúkne jedinečnú príležitosť na rýchlu expanziu do Grécka a Anatolie. Použite [Concept('actions_with_icon','akcie')|e] zo Situácie, aby ste získali [Concept('casus_belli_with_icon','casus Belli')|e] na našich susedov a uvoľnili našu silu proti nim.\n\n@hint! #T Integrujte naše dobyté územia #!\nNové [Concept('conquered_with_icon','dobytá')|e] [locations] je potrebné [Concept('integrate_with_icon','integrovať')|e] do našej administratívy cez [Concept('cabinet_with_icon','kabinet')|e], než z nich budeme môcť ťažiť.\n\n@hint! #T Stavajte [roads] z nášho [capital] #!\n[Locations] bez [Concept('control_with_icon','kontroly')|e] sú prakticky nepoužiteľné pre našu administráciu. Položte [Concept('roads_with_icon','cesty')|e] z nášho [Concept('capital_with_icon','hlavného mesta')|e], aby ste zvýšili našu [Concept('proximity_with_icon','blízkosť')|e], a tým aj náš [control]. Často kontrolujte [proximity] Map Mode!\n\n@hint! #T Vytvárajte [subjects] na správu dobytých zemí#!\nAko sa rozširujeme, získame územia, ktoré ležia ďaleko mimo dosahu našej [proximity]. Odporúča sa vytvoriť [Concept('subjects_with_icon','vazali')|e], ktoré budú správou týchto zemí, kým si nebudeme môcť dovoliť priamu správu.\n\n@hint! #T Anektujte našich [subjects] keď sa [proximity] zlepší #!\nS rozvojom infraštruktúry a rastom [proximity] sa územia, ktoré boli kedysi pre nás neudržateľné, stanú hodné priameho vlastníctva. Na [Concept('annex_with_icon','anektovať')|e] [subject] musíme vládnuť nad nimi viac než #Y 10#! rokov a mať s nimi dobré vzťahy.\n\n@hint! #T Zvýšte [maritime_presence] #!\nNáročný terén Grécka a Anatolie sťažuje šírenie [proximity] po zemi. S dobrou [Concept('maritime_presence_with_icon','námornou prítomnosťou')|e] pozdĺž pobrežia sa môže [proximity] šíriť oveľa efektívnejšie po mori. Stavte [ShowBuildingTypeName('wharf')] a [ShowBuildingTypeName('dock')] v našich mestách a majte [Concept('navies_with_icon','námorné sily')|e] strážiace naše pobrežie. To bude obzvlášť dôležité, ak by sme presunuli náš [capital] do [ShowLocationName('constantinople')]...\n\n@hint! #T Inštalujte [ShowBuildingTypeName('local_governor')]#!\nAk plánujeme priamu správu vzdialených území, zvážme umiestnenie [ShowBuildingTypeName('local_governor')]. Bude fungovať ako sekundárny [capital], vyžarujúci [proximity] do blízkych [locations]. Majte na pamäti, že miestni guvernéri sa dajú stavať len v [ShowLocationRankName('city')], sú drahí na udržiavanie a vyžadujú priamu [road] spojenie s naším [capital]." # todo: CHANGED # todo: CONCEPT CASE
 hint_ottomans_diplomatic: "$hint_advisor_salute_diplomatic$" # todo: NEW TRANSLATION
 hint_ottomans_administrative: "$hint_advisor_salute_administrative$"
 hint_ottomans_military: "$hint_advisor_salute_military$"
 hint_hre: "Rady pre Sväto-rímsku ríšu" # todo: NEW TRANSLATION
 hint_hre_hint_text: "$hint_hre_hint_text_1$\n\n$hint_hre_hint_text_2$\n\n$hint_hre_hint_text_3$\n\n$hint_hre_hint_text_4$\n\n$hint_hre_hint_text_5$\n\n$hint_hre_hint_text_6$" # todo: NEW TRANSLATION
 hint_hre_hint_text_1: "[GetInternationalOrganizationType('hre').GetName] je veľká [Concept('international_organization_with_icon','medzinárodná organizácia')|e] v strednej Európe. Členstvo v [international_organization] ovplyvní herný zážitok pre akúkoľvek [country]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 hint_hre_hint_text_2: "[hre_emperor_icon] #T Cisár:#!\n[GetInternationalOrganization('hre').GetNameWithNoTooltip] vedie [Concept('hre_emperor_with_icon','cisár')|e]. Je povinnosťou [ShowSpecialStatusNameWithNoTooltip('emperor')] chrániť členov Ríše pred zahraničnými hrozbami, udržiavať vnútorný mier a stabilitu a zabezpečiť náboženskú jednotu v Ríši.\n@arrow_bonus_tier_3! [ShowSpecialStatusNameWithNoTooltip('emperor')] môže použiť #Y $imperial_authority$#! na navrhovanie [Concept('policies_with_icon','politiky')|e] a [Concept('parliament_issues_with_icon','parlamentné záležitosti')|e].\n@arrow_bonus_tier_2! Využite rôzne [Concept('diplomatic_actions_with_icon','diplomatické akcie')|e] na nasmerovanie ostatných členov k priaznivej politickej situácii v Ríši.\n@arrow_bonus_tier_1! [ShowCountryInteractionName('enforce_landfriede')] - vynútiť [Concept('white_peace','status quo ante bellum')|e] nad členom.\n@arrow_bonus_tier_1! [ShowCountryInteractionName('enforce_religious_unity')] - vynútiť cisárske náboženstvo na člena.\n@arrow_bonus_tier_1! [ShowCountryInteractionName('demand_unlawful_territory')] - požadovať vrátenie dobytého [Concept('location','lokality')|e] jeho predchádzajúcemu vlastníkovi. Ak je to odmietnuté, bude udelený [Concept('casus_belli','casus belli')|e] na jeho vynútenie.\n@arrow_bonus_tier_1! [ShowCountryInteractionName('ask_to_vote_for_me_as_emperor')] - za cenu [Concept('favors','láskavostí')|e] môžete požiadať [country], aby za vás hlasovala ako za cisára. Platí až do ďalších volieb.\n@arrow_bonus_tier_1! [ShowCountryInteractionName('bolster_imperial_army')] - požiadať [country], aby sa pripojila k jednej z vašich vojen. Dostanú plat z cisárskej pokladnice.\n@arrow_bonus_tier_1! Udelte [Concept('special_status','špeciálneho statusu')|e] - Každý [special_status], s výnimkou [ShowSpecialStatusName('imperial_peasant_republic')], môže byť udelený členovi Ríše.\n@arrow_bonus_tier_1!Odobrať [Concept('special_status','špeciálneho statusu')|e] - Každý [special_status], s výnimkou [ShowSpecialStatusName('imperial_peasant_republic')], môže byť odobratý členovi Ríše." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 hint_hre_hint_text_3: "[elector_icon] #T Volitelia:#!\n[Concept('hre_electoral_college_with_icon','Zbor kurfirstov')|e] pozostáva z [ShowSpecialStatusNamePlural('elector')] a [ShowSpecialStatusNamePlural('archbishop_elector')]. Ich hlas rozhodne o ďalšom [ShowSpecialStatusName('emperor')], keď [ruler] súčasnej vedúcej [country] zomrie.\n@arrow_bonus_tier_1! Voľba môže byť úspešná len ak aspoň 50% súčasných voliteľov zahlasuje za tú istú [country]. Ak žiadna väčšina nie je dosiahnutá, Ríša vstúpi do Boja o moc.\n$BULLET_WITH_TAB$ Boj o moc je obdobie bez zvoleného [ShowSpecialStatusName('emperor')], počas ktorého privilégiá a povinnosti cisára nemôže vykonávať žiadna [country]. [hre_electoral_college] sa pokúsi vyriešiť boj o moc zjednotením svojich hlasov. Po 10 rokoch bude boj o moc násilne ukončený a [country] s najvyšším [Concept('great_power_score_with_icon','skóre veľmoci')|e] sa stane [ShowSpecialStatusName('emperor')]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 hint_hre_hint_text_4: "[hre_law_level_icon] #T Cisárske zákony:#!\nImperiálna ústava stanovuje pravidlá, ktorými sa Ríša a jej členovia riadia. Zdanenie členov v [Concept('gold','dukátoch')|e] a [Concept('manpower','živej sile')|e], počet voliteľov a zjednotenie Ríše budú diktované tým, ktoré [policies] sú momentálne aktívne.\n@arrow_bonus_tier_3! Ríša začína bez [policy] [ShowPolicyName('golden_bull_policy')]. Predtým než môže byť implementovaná akákoľvek iná [policy], musí byť navrhnutá a schválená [policy] [ShowPolicyName('golden_bull_policy')].\n@arrow_bonus_tier_3! Keď je [policy] [ShowPolicyName('golden_bull_policy')] prijatá, Ríša sa nastaví na základné politiky vo všetkých kategóriách. Potom má [ShowSpecialStatusName('emperor')] privilégium vybrať akúkoľvek [policy] na hlasovanie v cisárskom dietári, ak je [ShowSpecialStatusName('emperor')] schopný zaplatiť #Y $imperial_authority$#! na zmenu [policy].\n@arrow_bonus_tier_2! Každá [policy] označená 'Emperor Comfort Policy' posúva Ríšu bližšie k zjednoteniu do jednej [country] pod [ShowSpecialStatusName('emperor')].\n@arrow_bonus_tier_1! Zjednotenie nie je jediným cieľom Ríše. Mnohé [policies] môžu prospieť [ShowSpecialStatusName('emperor')] alebo konkrétnym členom Ríše bez toho, aby posúvali smerom k zjednoteniu." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 hint_hre_hint_text_5: "[parliament_icon] #T Cisársky diét:#!\n Cisársky diét sa aktivuje pri dvoch príležitostiach:\n$TAB$@arrow_bonus_tier_1! Keď [ShowSpecialStatusName('emperor')] navrhne novú [policy].\n$TAB$@arrow_bonus_tier_1! Keď [ShowSpecialStatusName('emperor')] navrhne [parliament_issue], ktorý sa dotýka všetkých členov Ríše.\n@arrow_bonus_tier_3! Keď je Cisársky diét na zasadnutí, každý člen môže hlasovať o aktuálnej otázke. Síla hlasu každej [country] je určená [special_status_power] ich [special_status]. Aby ste zvýšili svoju hlasovaciu silu, môžete požiadať o nový [special_status] od [ShowSpecialStatusName('emperor')].\n$BULLET_WITH_TAB$ Vo všeobecnosti budú [countries] s [special_status] [hre_electoral_college] mať najvyššiu [special_status_power], nasledované [countries] s [ShowCountryRankName('rank_kingdom')] [country_rank] bez miesta v [hre_electoral_college].\n$BULLET_WITH_TAB$ [special_status_power] je tiež určená konkrétnymi [policies] v Ríši.\n@arrow_bonus_tier_2! [ShowSpecialStatusName('emperor')] môže použiť [parliament_agendas] na presviedčanie krajín so špecifickým [special_status] na svoju stranu.\n@arrow_bonus_tier_2! [ShowSpecialStatusName('emperor')] môže použiť [ShowCountryInteractionName('bribe_voter_for_policy')] [diplomatic_action] na úplatok ktorémukoľvek voličovi." # todo: NEW TRANSLATION
 hint_hre_hint_text_6: "[hre_icon] #T Členovia:#!\nKaždá [country] v [international_organization] je považovaná za člena, ak práve nie je [ShowSpecialStatusName('emperor')]. Ich význam v Ríši však určuje ich [special_status_power].\n@arrow_bonus_tier_3! Požiadajte o [special_status] od [ShowSpecialStatusName('emperor')] - Každý člen môže požiadať o [special_status], pokiaľ spĺňa podmienky pre daný status.\n@arrow_bonus_tier_3! [ShowCountryInteractionName('ask_for_dukedom')] - Každý člen môže požiadať o povýšenie na [ShowCountryRankName('rank_duchy')] [Concept('country_rank','rang krajiny')|e], ak spĺňa podmienky. Členovia si nesmú povýšiť svoj [country_rank] bez potvrdenia [ShowSpecialStatusName('emperor')].\n@arrow_bonus_tier_1! [ShowCountryInteractionName('request_county_privileges')] - Toto možno využiť na získanie prístupu k [ShowGovernmentReformName('margraviate')] a [ShowGovernmentReformName('landgraviate')] [Concept('government_reforms','vládnym reformám')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 hint_hre_diplomatic: "$hint_advisor_salute_diplomatic$" # todo: NEW TRANSLATION
 hint_hre_administrative: "$hint_advisor_salute_administrative$" # todo: NEW TRANSLATION
 hint_hre_military: "$hint_advisor_salute_military$" # todo: NEW TRANSLATION
 hint_eastern_roman_empire: "Začiatočné rady pre [Player.GetLongName]" # todo: NEW TRANSLATION
 hint_eastern_roman_empire_hint_text: "$hint_eastern_roman_empire_text_1$\n\n$hint_eastern_roman_empire_text_2$\n\n$hint_eastern_roman_empire_text_3$\n\n$hint_eastern_roman_empire_text_4$" # todo: NEW TRANSLATION
 hint_eastern_roman_empire_text_1: "[Player.GetLongName] prešiel obdobím nepokojov a situácia sa má ešte zhoršiť.\nV [ShowRegionName('anatolia_region')] anatolské beyliky zosilneli, pričom [GetCountry('TUR').GetName] nedávno dobyl naše územia v [ShowLocationName('bursa')] a [ShowLocationName('izmit')].\nNa pevnine v [ShowScriptedGeographyName('greece_geography')] sa nám podarilo znovu získať kontrolu nad [ShowProvinceDefinitionName('thessaly_province')] a oblastami okolo pohoria Pindos, ale frankovské štáty sú stále pri moci.\nNa severe na nás číhajú [GetCountry('SER').GetName] a [GetCountry('BUL').GetName], ktoré ohrozujú naše územia ako supy.\n#italic Možno vzbúrenie slobody v [GetCountry('SMC').GetName] by nám prinieslo nového spojenca#!." # todo: NEW TRANSLATION
 hint_eastern_roman_empire_text_2: "@hint! #T Správa stavov#!\nVnútri krajiny sa naše stavy stali pomerne skorumpované, ich 4 privilégiá [ShowEstatePrivilegeName('consolidated_corruption_of_the_nobles')], [ShowEstatePrivilegeName('consolidated_corruption_of_the_clergy')], [ShowEstatePrivilegeName('consolidated_corruption_of_the_burghers')], a [ShowEstatePrivilegeName('consolidated_corruption_of_the_peasants')] škodia národu. Je životne dôležité, aby sme sa ich čo najskôr zbavili.\n\nPresadzovanie [ShowSocietyDirectionName('communalism')] [Concept('societal_value','sociálna hodnota')|e] je skvelý začiatok tejto snahy.\nUdeľovanie [Concept('estate_privileges_with_icon','privilégiá stavov')|E] nám môže pomôcť udržať ich na uzde, keď sa budú hnevať. Buďte však si vedomí, že naša [Concept('legitimacy_with_icon','legitimita')|E] má pre národ veľký význam." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 hint_eastern_roman_empire_text_3: "@hint! #T Ekonomické cesty#!\nNaše provincie [ShowProvinceDefinitionName('constantinople_province')] a [ShowProvinceDefinitionName('edirne_province')] sú vynikajúcim štartovacím bodom pre ekonomickú obnovu. [Player.GetLongName] môže výrazne profitovať z priemyslu na [ShowGoodsName('fine_cloth')] a zároveň rozširovať [ShowGoodsName('silk')]. [ShowProvinceDefinitionName('edirne_province')] by mohla byť kľúčovou provinciou pre produkciu [ShowGoodsName('tools')] a [ShowGoodsName('firearms')].\n\n[ShowProvinceDefinitionName('chalkidiki_province')] je tiež bohatá na prírodné zdroje, pričom [ShowLocationRankName('city')] [ShowLocationName('thessaloniki')] je ideálnym kandidátom pre produkciu [ShowGoodsName('jewelry')]. Možno zriadenie [Concept('market_with_icon','trh')|e] a [ShowBuildingTypeName('local_governor')] tam by nám prinieslo značné príjmy.\n\nNaše nedávne dobytia v [ShowProvinceDefinitionName('thessaly_province')] a [ShowAreaName('morea_area')] budú chvíľu trvať, kým sa stanú integrálnou súčasťou ríše a začnú byť ziskové.\n#italic Možno by bolo rozumné zriadiť niekoľko [ShowSubjectTypeName('pronoia')] v týchto provinciách#!." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 hint_eastern_roman_empire_text_4: "@hint! #T Zahraničné záležitosti#!\nNič iné nemá význam, ak nedokážeme prežiť proti cudzej sile, ktorá nám hrozí zánikom. Mali by sme stabilizovať vnútornú situáciu, vyriešiť prípadné otázky [ShowDisasterName('byzantine_succession_crisis')] a vytvoriť zdravú ekonomiku, ktorá dokáže financovať našu armádu. Potom môžeme získať svoje územia späť, ba aj celú našu [ShowScriptedGeographyName('roman_borders_geography')].\n\nAlternatívne môžeme prejsť do ofenzívy okamžite a získať späť [ShowLocationName('bursa')] a [ShowLocationName('izmit')] od [GetCountry('TUR').GetName] a potom zvyšok [ShowScriptedGeographyName('byzantine_aegean_coastline')]. Táto cesta bude náročnejšia, pretože si vyžaduje súčasné riešenie vnútorných aj vonkajších problémov, čo silne ovplyvní našu stabilitu a ekonomické zotavenie.\n\nAvšak každý riskantný čin prináša veľké odmeny. Mali by sme byť ambiciózni a určovať si osud namiesto toho, aby sme naň čakali." # todo: NEW TRANSLATION

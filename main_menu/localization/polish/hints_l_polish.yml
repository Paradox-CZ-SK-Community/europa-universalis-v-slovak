 hint_red_turban_rebellions_hint_text: "$hint_red_turban_rebellions_hint_text_1$\n\n$hint_red_turban_rebellions_hint_text_2$\n\n$hint_red_turban_rebellions_hint_text_3$" # todo: NEW TRANSLATION
 hint_red_turban_rebellions_hint_text_1: "Vypukli [GetSituationByKey('red_turban_rebellions').GetName] po celom $china$! [GetCountry('CHI').GetName] prišli o priazeň nebies, nestabilita teraz vládne ich [GetCountry('CHI').GetFlavorRank]!" # todo: NEW TRANSLATION
 hint_red_turban_rebellions_hint_text_2: "#T Odporúčané kroky:#!\n@arrow_bonus_tier_3! [GetCountry('CHI').GetName] musí vynútiť [ShowPeaceTreatyTypeName('rtr_rein_in_rebellion')] na tých, ktorí sa odtrhávajú od ich vlády.\n@arrow_bonus_tier_2! [GetInternationalOrganizationType('red_turban_rebels').GetName] môže požadovať [ShowPeaceTreatyTypeName('rtr_demand_occupied_territories')] proti [GetCountry('CHI').GetNameWithNoTooltip].\n@arrow_bonus_tier_1! [GetCountry('CHI').GetLongName] bude trpieť mnohými jedinečnými [Concept('events_with_icon','udalosťami')|e], keď jeho krajinu obsadia potenciálni dobyvatelia." # todo: CHANGED # todo: CONCEPT CASE
 hint_red_turban_rebellions_hint_text_3: "#T Extra tipy:#!\n@hint! Môžeme použiť mnohé jedinečné [Concept('actions_with_icon','akcie')|e] v paneli [Concept('situation_with_icon','situácii')|e] na pomoc [Concept('integrate_with_icon','integrovať')|e] dobytí a udržať vysoké [Concept('control_with_icon','kontrola')|e].\n@hint! Ak situáciu vyhráme a vytvoríme [GetFormableCountry('CHI').GetName], automaticky dostaneme [Concept('cores','jadrá')|e] v celom $china$." # todo: CHANGED # todo: CONCEPT CASE
 hint_red_turban_rebellions_diplomatic: "\"Nepretržité vojny nechávajú málo priestoru pre reči a diplomaciu...\"" # todo: NEW TRANSLATION
 hint_red_turban_rebellions_administrative: "\"Bolo by múdre správne využiť akcie tejto situácie. Sú to cenné nástroje, ktoré nám pomôžu vyjsť víťazne.\"" # todo: NEW TRANSLATION
 hint_red_turban_rebellions_military: "\"Teraz celé $china$ vie, že sme tu!\"" # todo: NEW TRANSLATION
 hint_rise_of_timur: "[GetSituationByKey('rise_of_timur').GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 hint_rise_of_timur_hint_text: "$hint_rise_of_timur_hint_text_1$\n\n$hint_rise_of_timur_hint_text_2$\n\n$hint_rise_of_timur_hint_text_3$" # todo: NEW TRANSLATION
 hint_rise_of_timur_hint_text_1: "Z hlbín [ShowSubContinentName('central_asia')] prichádza bledý obraz smrti v podobe [GetCharacter('chg_timur_lame_borjigin').GetName] a [GetCharacter('chg_timur_lame_borjigin').GetHerHis] [GetCountry('TIM').GetFlavorRank]. Beda tým, ktorí sa postavia proti [GetCharacter('chg_timur_lame_borjigin').GetHerHis] dobytím!" # todo: NEW TRANSLATION
 hint_rise_of_timur_hint_text_2: "#T Odporúčané kroky:#!\n@arrow_bonus_tier_3! Pokiaľ žije [GetCharacter('chg_timur_lame_borjigin').GetName], [GetCharacter('chg_timur_lame_borjigin').GetHerHis] [GetCountry('TIM').GetFlavorRank] bude profitovať z [ShowModifier('timmy_wants_to_play')] [Concept('modifier_with_icon','modifikátora')|e].\n@arrow_bonus_tier_2! Spomínaný [Concept('modifier_with_icon','modifikátor')|e] umožní [GetCharacter('chg_timur_lame_borjigin').GetShortNameWithNoTooltip] automaticky anektovať obliehané [Concept('locations_with_icon','lokality')|e].\n@arrow_bonus_tier_1! [GetCountry('TIM').GetLongName] získa prístup k jedinečným [Concept('casus_belli_with_icon','casus belli')|e]." # todo: CHANGED # todo: CONCEPT CASE
 hint_rise_of_timur_hint_text_3: "#T Extra tipy:#!\n@hint! [GetCountry('TIM').GetName] môže využívať mnohé mocné [Concept('actions_with_icon','akcie')|e] v paneli [Concept('situation_with_icon','situácii')|e]." # todo: CHANGED # todo: CONCEPT CASE
 hint_rise_of_timur_diplomatic: "\"Možno sa s hordou dá vyjednávať?\"" # todo: NEW TRANSLATION
 hint_rise_of_timur_administrative: "\"Zvážme výstavbu opevnení na ochranu našich hraníc.\"" # todo: NEW TRANSLATION
 hint_rise_of_timur_military: "\"[GetCountry('TIM').GetName] sú závislí na mocnej armáde pekelných jazdcov, histórii dobytí a hlade rozopnúť čeľuste a pohltiť celé [ShowContinentName('asia')]!\"" # todo: NEW TRANSLATION
 hint_nanbokuchou: "[GetSituationByKey('nanbokuchou').GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 hint_nanbokuchou_hint_text: "$hint_nanbokuchou_hint_text_1$\n\n$hint_nanbokuchou_hint_text_2$\n\n$hint_nanbokuchou_hint_text_3$" # todo: NEW TRANSLATION
 hint_nanbokuchou_hint_text_1: "[GetSituationByKey('nanbokuchou').GetName] je [Concept('situation_with_icon','situácia')|e], ktorá rozdeľuje [ShowRegionName('japan_region')] na súperiace cisárske dvory, severnú a južnú líniu, pričom každá usiluje o legitimitu. Klany musia zvoliť stranu, pretože tento konflikt preformuje celý ostrovný národ." # todo: CHANGED # todo: CONCEPT CASE
 hint_nanbokuchou_hint_text_2: "#T Odporúčané kroky:#!\n@arrow_bonus_tier_3! Použite jedinečný [ShowCasusBelliName('cb_nanbokuchou')] [Concept('casus_belli_with_icon','casus Belli')|e] na vedenie vojny za vášho cisárskeho nárokovača.\n@arrow_bonus_tier_2! Môžete prinútiť riválneho dvora abdikovať použitím [ShowPeaceTreatyTypeName('peace_nanbokuchou_force_imperial_abdication')] [Concept('peace_treaty','mierovou dohodou')|e] a zabezpečiť nadvládu vášho preferovaného cisára.\n@arrow_bonus_tier_2! Použite [ShowUnitAbilityName('raid_clan_holdings')] a [ShowUnitAbilityName('raid_imperial_family_holdings')] [Concept('unit_abilities','schopnosti jednotiek')|e] na získanie [Concept('war_score','vojnového skóre')|e]\n@arrow_bonus_tier_1! Rozšírte vplyv svojej klanu pomocou [ShowPeaceTreatyTypeName('peace_expand_clan_influence')] na zajatie nepriateľských [Concept('locations_with_icon','lokalít')|e]." # todo: CHANGED # todo: CONCEPT CASE
 hint_nanbokuchou_hint_text_3: "#T Ďalšie tipy:#!\n@hint! Opatrné načasovanie je kľúčové. Menšie klany môžu využiť konflikt na získanie vplyvu nad rivalmi.\n@hint! Zvážte rovnováhu síl predtým, než sa zaviažete na jednu stranu." # todo: NEW TRANSLATION
 hint_nanbokuchou_diplomatic: "\"Toto je viac než vojna mečov. Naša voľba nárokovateľa určí naše dedičstvo.\"" # todo: NEW TRANSLATION
 hint_nanbokuchou_administrative: "\"Udržať poriadok pri postavení sa na jednu alebo druhú stranu je výzva, ale môže nám to udeliť bezkonkurenčný vplyv nad cisárskou inštitúciou.\"" # todo: NEW TRANSLATION
 hint_nanbokuchou_military: "\"Udeľte rozhodujúci úder a získajte plášť legitimity skôr, než si naši rivali konsolidujú moc.\"" # todo: NEW TRANSLATION
 hint_sengoku: "[GetSituationByKey('sengoku').GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 hint_sengoku_hint_text: "$hint_sengoku_hint_text_1$\n\n$hint_sengoku_hint_text_2$\n\n$hint_sengoku_hint_text_3$" # todo: NEW TRANSLATION
 hint_sengoku_hint_text_1: "[GetSituationByKey('sengoku').GetName] je [Concept('situation_with_icon','situácia')|e], ktorá zahŕňa [ShowRegionName('japan_region')] do takmer nepretržitého vojnového stavu. Klany bojujú o nadvládu, zatiaľ čo $JAPANESE_SHOGUNATE_LEADER_MALE$ bojuje o kontrolu nad krajinou." # todo: CHANGED # todo: CONCEPT CASE
 hint_sengoku_hint_text_2: "#T Odporúčané kroky:#!\n@arrow_bonus_tier_3! Vádzajte vojnu s jedinečným [ShowCasusBelliName('cb_sengoku')] [Concept('casus_belli_with_icon','casus belli')|e] na rozšírenie svojej klanu.\n@arrow_bonus_tier_2! Ako $JAPANESE_SHOGUNATE_LEADER_MALE$ použite [ShowGenericActionName('sengoku_revoke_clans_land')] na oslabenie prerastených klanov a [ShowGenericActionName('sengoku_limit_clans_autonomy')] premenením ich na [Concept('building_based_with_icon','krajinu založenú na budovách')|e].\n@arrow_bonus_tier_1! Ak ste [Concept('building_based_with_icon','krajina založená na budovách')|e], môžete vyhlásiť nezávislosť a stať sa [Concept('location_based_with_icon','krajinu viazanú na územie')|e] pomocou [ShowGenericActionName('sengoku_proclaim_clan_independence')]." # todo: CHANGED # todo: CONCEPT CASE
 hint_sengoku_hint_text_3: "#T Ďalšie tipy:#!\n@hint! Rovnováha síl sa neustále mení. Hľadajte príležitosti zasiahnuť oslabené klany.\n@hint! Ako $JAPANESE_SHOGUNATE_LEADER_MALE$, skorá konsolidácia kontroly výrazne uľahčí zjednotenie [ShowRegionName('japan_region')].\n@hint! Malé klany môžu profitovať hraním väčších rivalov proti sebe, až kým nenastane vhodný okamih na odtrhnutie sa." # todo: NEW TRANSLATION
 hint_sengoku_diplomatic: "\"Aliancie sa rýchlo menia. Vyberajte si priateľov opatrne, pretože môžu byť zajtra vašimi nepriateľmi.\"" # todo: NEW TRANSLATION
 hint_sengoku_administrative: "\"Je potrebné silné vládnutie, aby sa kráľovstvo nevrútilo do chaosu.\"" # todo: NEW TRANSLATION
 hint_sengoku_military: "\"Toto je vek meča. Uderte rýchlo a tvrdo, alebo vás pohlcú iní.\"" # todo: NEW TRANSLATION
 swift_end_string: "Rovnako ako pri každej katastrofe je často najvhodnejší rýchly koniec, pretože nevybavené záležitosti môžu viesť k nežiaducim následkom." # todo: NEW TRANSLATION
 disaster_war_hint: "Je dobré mať na pamäti, že niektorí z našich susedov si počas našich búrlivých čias neželajú prímerie ani alianciu, pretože hľadajú expanzívne príležitosti na náš úkor." # todo: NEW TRANSLATION
 hint_coup_attempt: "$coup_attempt$ Hints" # todo: NEW TRANSLATION
 hint_coup_attempt_hint_text: "$hint_coup_attempt_hint_text_1$\n\n$hint_coup_attempt_hint_text_2$\n\n$hint_coup_attempt_hint_text_3$" # todo: NEW TRANSLATION
 hint_coup_attempt_hint_text_1: "V našom [Concept('court_with_icon','dvore')|e] ambitní ľudia hľadajú moc nekalými spôsobmi, aby na tróne umiestnili bábky, diktovali [Concept('laws_with_icon','zákony')|e] a získali pre seba [Concept('privileges_with_icon','privilégiá')|e]. Tento [Concept('disaster_with_icon','katastrofa')|e] potrvá, kým sprisahanci nezmiznú, ich vodca neprevezme trón, alebo kým nezískame dostatočnú [Concept('legitimacy_with_icon','legitimitu')|e]. $swift_end_string$" # todo: CHANGED # todo: CONCEPT CASE
 hint_coup_attempt_hint_text_2: "#T Odporúčané kroky:#!\n@arrow_bonus_tier_3! Môžeme vykonať [ShowGenericActionName('conduct_investigation')]. To môže nejaký čas trvať, ale odhalí nám niektorých sprisahancov a priblíži nás k ich očisteniu.\n@arrow_bonus_tier_2! Udržiavajte vysokú [Concept('stability_with_icon','stabilitu')|e]. Čím vyššia je, tým nižší je prah potrebnej [Concept('legitimacy_with_icon','legitimity')|e] na ukončenie tohto [Concept('disaster_with_icon','katastrofy')|e].\n@arrow_bonus_tier_1! Ak by sa situácia zhoršila, môžeme zvoliť buď [ShowGenericActionName('call_private_council')] alebo [ShowGenericActionName('execute_court_member')]. Prvé umožní spoľahnúť sa na naše [Concept('estates_with_icon','stavy')|e] pri odhaľovaní sprisahancov výmenou za [Concept('privileges_with_icon','privilégiá')|e] alebo [Concept('gold_with_icon','dukáty')|e]. Druhá akcia dovolí popraviť akúkoľvek [Concept('character_with_icon','postavu')|e] na dvore, ktorého považujeme za súčasť sprisahania." # todo: CHANGED # todo: CONCEPT CASE
 hint_coup_attempt_hint_text_3: "#T Extra tipy:#!\n@hint! Počas tohto [Concept('disaster_with_icon','katastrofy')|e] môžeme dostať náhodné [Concept('events_with_icon','udalosti')|e], ktoré ukážu potenciálnych sprisahancov. Je múdre ich preskúmať a rozhodovať rozumne. Nebolo by rozumné, keby náš najlepší [Concept('cabinet_member_with_icon','člen kabinetu')|e] stratil hlavu bez dôvodu." # todo: CHANGED # todo: CONCEPT CASE
 hint_coup_attempt_diplomatic: "\"Teraz je čas posilniť vzťahy so susednými [Concept('countries_with_icon','krajinami')|e] a zabezpečiť pevné hranice. Posledné, čo potrebujeme, sú nebezpečenstvá zvonku aj zvnútra.\" # todo: CHANGED # todo: CONCEPT CASE
 hint_coup_attempt_administrative: "\"Jeden z ostatných poradcov môže byť sprisahankom. Možno sa to nikdy nedozvieme!\"" # todo: NEW TRANSLATION
 hint_coup_attempt_military: "\"$disaster_war_hint$ Pamätajte, predbežný úder je len a #italic prekvapujúca mierová zmluva#! doručená veľmi násilne.\"" # todo: NEW TRANSLATION
 hint_crisis_of_the_chinese_dynasty: "$crisis_of_the_chinese_dynasty$ Hints" # todo: NEW TRANSLATION
 hint_crisis_of_the_chinese_dynasty_hint_text: "$hint_crisis_of_the_chinese_dynasty_hint_text_1$\n\n$hint_crisis_of_the_chinese_dynasty_hint_text_2$" # todo: NEW TRANSLATION
 hint_crisis_of_the_chinese_dynasty_hint_text_1: "Nebesia nám kedysi dávali svetlo a prosperitu. Avšak nedávne udalosti, hladomory a zničenie priniesli temné obdobie pre našu vládu nad $china$. Tento [Concept('disaster_with_icon','katastrofa')|e] potrvá, kým sa nevymaníme pomocou dôsledných reforiem administratívy, alebo stratíme svoje miesto v čele [GetUniqueInternationalOrganization('middle_kingdom').GetName]. $swift_end_string$" # todo: CHANGED # todo: CONCEPT CASE
 hint_crisis_of_the_chinese_dynasty_hint_text_2: "#T Odporúčané kroky:#!\n@arrow_bonus_tier_3! Môžeme zvoliť [ShowCabinetActionName('reform_taxation_system')] cez náš [Concept('cabinet_with_icon','kabinet')|e]. To môže trvať, ale nastaví nás na správnu cestu k ukončeniu tohto [Concept('disaster_with_icon','katastrofy')|e].\n@arrow_bonus_tier_2! Udržiavajte vysokú [Concept('celestial_authority_gc_with_icon','nebeskú autoritu')|e]. Ak dosiahne #G 90#! alebo vyššie, [Concept('disaster_with_icon','katastrofa')|e] sa pokojne skončí.\n@arrow_bonus_tier_1! [Concept('disaster_with_icon','Katastrofa')|e] prináša množstvo nových [Concept('actions_with_icon','akcie')|e] ako [ShowGenericActionName('cmd_reform_the_cabinet')], [ShowGenericActionName('cmd_restore_stability')] a [ShowGenericActionName('cmd_strengthen_crown')]. Tie ponúkajú alternatívny spôsob pokojného ukončenia obdobia, ak nemôžeme dosiahnuť potrebnú [Concept('celestial_authority_gc_with_icon','nebeskú autoritu')|e]." # todo: CHANGED # todo: CONCEPT CASE
 hint_crisis_of_the_chinese_dynasty_diplomatic: "\"Teraz je čas upevniť vzťahy s [Concept('countries_with_icon','krajinou')|e] patriacimi do [GetUniqueInternationalOrganization('middle_kingdom').GetName], aby sme zaistili prežitie tejto veľkej inštitúcie.\n\nBez rešpektu, čím sa odlišujú ľudia od zverí?\" # todo: CHANGED # todo: CONCEPT CASE
 hint_crisis_of_the_chinese_dynasty_administrative: "\"Ak sa rozhodneme ukončiť toto [Concept('disaster_with_icon','katastrofu')|e] prostredníctvom reforiem administratívy, je rozumné zveriť tieto monumentálne úlohy schopným [Concept('cabinet_members_with_icon','členmi kabinetu')|e].\n\nKto nebude šetriť, bude trpieť.\" # todo: CHANGED # todo: CONCEPT CASE
 hint_crisis_of_the_chinese_dynasty_military: "\"$disaster_war_hint$\n\nV strede chaosu je aj príležitosť!\"" # todo: NEW TRANSLATION
 hint_turmoil_in_brandenburg: "$turmoil_in_brandenburg$" # todo: NEW TRANSLATION
 hint_turmoil_in_brandenburg_hint_text: "$hint_turmoil_in_brandenburg_hint_text_1$\n\n$hint_turmoil_in_brandenburg_hint_text_2$\n\n$hint_turmoil_in_brandenburg_hint_text_3$\n\n$hint_turmoil_in_brandenburg_hint_text_4$" # todo: NEW TRANSLATION
 hint_turmoil_in_brandenburg_hint_text_1: "Katastrofa $turmoil_in_brandenburg$ predstavuje dva problémy, s ktorými sa musíme vyrovnať. Najprv musíme buď upevniť našu vládnucu dynastiu zvýšením Skóre investícií na 100, alebo požiadať cisára Svätého rímskeho impéria, aby na náš trón dosadil novú dynastiu, ak dosiahnete skóre -100 v Zanedbaní. Po roku 1365 sa Lúpežní baróni budú v našich [Concept('provinces','provincií')|e] objavovať častejšie a budú krajinu devastovať. Keď bude dostatočná časť našej krajiny (75% našich vlastnených [provinces]) oslobodená od teroru Lúpežných barónov prostredníctvom $pru_deal_with_robber_barons$ [Concept('cabinet_action','akciou kabinetu')|e], katastrofa bude môcť skončiť." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 hint_turmoil_in_brandenburg_hint_text_2: "#T Recommended Actions:#!\n@arrow_bonus_tier_1! Zvýšte svoje skóre v Investíciách alebo Zanedbaní prostredníctvom udalostí súvisiacich s touto katastrofou\n@arrow_bonus_tier_1! Opatrne rozširujte svoje územie, aby ste Lúpežným barónom nedali nový priestor na rozšírenie" # todo: NEW TRANSLATION
 hint_turmoil_in_brandenburg_hint_text_3: "#T Extra Hints:#!Získajte späť stratenú [control] pomocou príslušného [cabinet_action]\n@hint! Nájdite [Concept('alliances','aliancie')|e], ktoré sú schopné vám pomôcť v prípadnom [Concept('civil_war','občianskej vojne')|e]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 hint_turmoil_in_brandenburg_hint_text_4: "#T How to achieve different dynastic outcomes:#!\n@hint!Zachováte súčasnú vládnucu dynastiu dosiahnutím $bra_wittelsbacher_investment_var$ 100\n@hint!Bude možné získať dynastiu Hohenzollern dosiahnutím $bra_wittelsbacher_neglect_var$ -100, keď bude cisár mať dospelého dediča. Keď táto postava bude vládnuť obom krajinám ako cisár Svätého rímskeho impéria, bude môcť dosadiť člena dynastie Hohenzollern na váš trón." # todo: NEW TRANSLATION
 hint_war: "Vojna" # todo: NEW TRANSLATION
 hint_war_hint_text: "$hint_war_hint_text_1$\n\n$hint_war_hint_text_2$\n\n$hint_war_hint_text_3$" # todo: NEW TRANSLATION
 hint_war_hint_text_1: "[Concept('war_with_icon','Vojna')|e] začína, keď [Concept('country_with_icon','krajina')|e] vyhlási vojnu a končí, keď sa obe strany dohodnú na [Concept('peace_treaty_with_icon','mierovú dohodu')|e]. Každá vojna má dvoch [Concept('war_leaders_with_icon','vodcov vojny')|e], ale môžu existovať aj ďalší [Concept('war_allies_with_icon','vojnoví spojenci')|e]. Vojna skončí, keď dvaja [war_leaders] podpíšu [peace_treaty], no sekundárni účastníci môžu podpísať samostatné mierové zmluvy s nepriateľom." # todo: CHANGED # todo: CONCEPT CASE
 hint_war_hint_text_2: "#T Odporúčané kroky:#!\n@arrow_bonus_tier_3! Zvážte získanie [Concept('casus_belli_with_icon','casus belli')|e] pred vyhlásením [war]. Môžeme o ne požiadať počas [Concept('parliament_with_icon','parlamentu')|e] alebo si ich sfabrikovať voči [Concept('rivals_with_icon','rivalom')|e].\n@arrow_bonus_tier_3! Po začiatí vojny sledujte [casus_belli] a jeho [Concept('war_goal_with_icon','vojnového cieľa')|e], pretože sú rozhodujúce pre získavanie [Concept('war_score_with_icon','vojnové skóre')|e] a zabezpečenie priaznivého [Concept('peace_treaty_with_icon','mierovej dohody')|e].\n@arrow_bonus_tier_3! V závislosti od Casus Belli budeme získavať [Concept('war_score_with_icon','vojnové skóre')|e] rôznymi spôsobmi. Tu sú najbežnejšie zdroje:\n @arrow_bonus_tier_1! Obsadiť nepriateľské [Concept('capital_with_icon','hlavné mesto')|e].\n @arrow_bonus_tier_1! Ovládnuť nárokované [locations_with_icon].\n @arrow_bonus_tier_1! Obsadiť nepriateľské [Concept('forts_with_icon','pevnosti')|e].\n @arrow_bonus_tier_1! Poraziť nepriateľské [Concept('armies_with_icon','armády')|e] v [battle].\n @arrow_bonus_tier_1! [Concept('blockade_with_icon','Blokáda')|e] nepriateľské [Concept('ports_with_icon','prístavoch')|e].\n@arrow_bonus_tier_3! Sledujte náš [Concept('war_exhaustion_with_icon','vojnová vyčerpanosť')|e], pretože môže výrazne poškodiť ekonomiku a schopnosť viesť vojnu." # todo: CHANGED # todo: CONCEPT CASE
 hint_war_hint_text_3: "#T Extra tipy:#!\n@hint! Počas [war] môžu obe strany [Concept('occupy_with_icon','okupovať')|e] nepriateľské [Concept('locations_with_icon','lokality')|e], ale územie sa oficiálne nemení až do ratifikácie v [Concept('peace_treaty_with_icon','mierovej dohode')|e].\n@hint! Čím dlhšie vojna trvá, tým ochotnejšie budú strany akceptovať mierovú ponuku." # todo: CHANGED # todo: CONCEPT CASE
 hint_war_diplomatic: "\"Vojna môže byť veľmi výnosné podnikanie, ale aj rýchla cesta k katastrofe\"" # todo: NEW TRANSLATION
 hint_war_administrative: "\"Keď obchod nedokáže zabezpečiť zásoby životne dôležitých zdrojov, vojna sa stáva takmer nevyhnutnou.\"" # todo: NEW TRANSLATION
 hint_war_military: "\"Jediný spôsob, ako si zaistiť bezpečie, je prerásť svojich susedov.\"" # todo: NEW TRANSLATION
 hint_battle: "Bitky" # todo: NEW TRANSLATION
 hint_battle_hint_text: "$hint_battle_hint_text_1$\n\n$hint_battle_hint_text_2$\n\n$hint_battle_hint_text_3$" # todo: NEW TRANSLATION
 hint_battle_hint_text_1: "Keď sa [Concept('army_with_icon','armádu')|e] ocitne v tej istej [Concept('location_with_icon','lokalite')|e] ako nepriateľská [army], začne [Concept('battle_with_icon','bitka')|e]. Armáda, ktorá bola v lokalite prvá, bude [Concept('defender_with_icon','obranca')|e] a bude mať výhodu terénu. Bitka končí, keď jedná strana stratí všetku [Concept('morale_with_icon','morálku')|e] alebo všetky [Concept('regiments_with_icon','pluky')|e], podľa toho, čo nastane skôr." # todo: CHANGED # todo: CONCEPT CASE
 hint_battle_hint_text_2: "#T Odporúčané kroky:#!\n@arrow_bonus_tier_3! Privolajte susedné armády ako posily do prebiehajúcich bitiek. Ak dorazia načas, vstúpia do boja ako čerstvé rezervy.\n@arrow_bonus_tier_2! Uistite sa, že naše [Concept('armies_with_icon','armády')|e] majú dobrého [Concept('commander_with_icon','veliteľa')|e] pred zaviazaním ich do [battle].\n@arrow_bonus_tier_2! Vždy venujte pozornosť terénu lokality. Útočiaci [Concept('attacker_with_icon','útočník')|e] bude trpieť penalizáciami vo svojej hode podľa topografie a vegetácie lokality. Starostlivo si vyberte bojisko!\n@arrow_bonus_tier_1! Niekedy je múdre dať rozkaz k včasnému [Concept('retreat_with_icon','ústupu')|e], kým naše sily nie sú zničené nepriateľskou presilou." # todo: CHANGED # todo: CONCEPT CASE
 hint_battle_hint_text_3: "#T Extra tipy:#!\n@hint! Prehra v bitke neznamená nevyhnutne koniec vojny. Po porážke sa môžete stiahnuť do bezpečia, získať morálku, prípadne naverbovať žoldnierov a skúsiť to znovu za priaznivejších okolností (rovnako to môže urobiť aj nepriateľ! Nestriehajte predčasné oslavy víťazstva).\n@hint! Ak má lokalita [Concept('fort_with_icon','pevnosť')|e], bude obranca tejto lokality vždy považovaný za [defender], bez ohľadu na to, kto prišiel prvý." # todo: CHANGED # todo: CONCEPT CASE
 hint_battle_diplomatic: "\"Nech nechajú naši nepriatelia zahynúť úpadkom a hladom, skôr než s nimi vstúpime do boja.\"" # todo: NEW TRANSLATION
 hint_battle_administrative: "\"Rýchle víťazstvo na bojisku by nám umožnilo ísť do ofenzívy bez vystavovania našich miest protivníkovej pustošivosti.\"" # todo: NEW TRANSLATION
 hint_battle_military: "\"Dobrý generál môže rozhodnúť výsledok bitky.\"" # todo: NEW TRANSLATION
 hint_siege_and_occupation: "Okupácia a obliehania" # todo: NEW TRANSLATION
 hint_siege_and_occupation_hint_text: "$hint_siege_and_occupation_hint_text_1$\n\n$hint_siege_and_occupation_hint_text_2$\n\n$hint_siege_and_occupation_hint_text_3$" # todo: NEW TRANSLATION
 hint_siege_and_occupation_hint_text_1: "Keď [Concept('army_with_icon','armáda')|e] vstúpi do nepriateľskej [Concept('location_with_icon','lokality')|e], pokúsi sa ju [Concept('occupy_with_icon','okupovať')|e]. Ak lokalita nemá [Concept('fort_with_icon','pevnosť')|e], bude obsadená za niekoľko dní. Avšak v prítomnosti pevnosti začne [Concept('siege_with_icon','obliehanie')|e].\n\nObliehania môžu trvať mesiace alebo aj roky, v závislosti od úrovne opevnenia, prítomnosti delostrelectva, [Concept('ability_with_icon','schopnosti')|e] obliehajúceho [Concept('general_with_icon','generála')|e] a ďalších faktorov.\n\nKeď sa posádka vzdá, lokalita sa stane [occupied] a [fort] zostane pod kontrolou víťaza.\n\nObsadené lokality sú na mape zobrazené krížiacimi sa pruhmi a nevlastní ich dobyvateľ, kým nie je dobytok potvrdený mierovou zmluvou." # todo: CHANGED # todo: CONCEPT CASE
 hint_siege_and_occupation_hint_text_2: "#T Odporúčané kroky:#!\n@arrow_bonus_tier_3! Uistite sa, že [Concept('army_with_icon','armáda')|e] dokáže prežiť obliehanie pred jeho začatím.\n@arrow_bonus_tier_1! Nebojte sa stiahnuť z obliehania, ak sa blíži nebezpečná nepriateľská armáda." # todo: CHANGED # todo: CONCEPT CASE
 hint_siege_and_occupation_hint_text_3: "#T Ďalšie tipy:#!\n@hint! Sledujte svoje armády počas obliehania, aj keď sa momentálne v okolí nenachádzajú žiadne nepriateľské sily." # todo: NEW TRANSLATION
 hint_siege_and_occupation_diplomatic: "\"Dlhotrvajúce obliehanie môže byť osudné pre miestne obyvateľstvo a prosperitu.\"" # todo: NEW TRANSLATION
 hint_siege_and_occupation_administrative: "\"Pevnosti by sme mali rozmiestniť tak, aby naše hlavné mestá boli chránené pred votrelcami a v prípade nepriateľského obliehania ich bolo možné rýchlo oslobodiť.\"" # todo: NEW TRANSLATION
 hint_siege_and_occupation_military: "\"Obliehanie a bránenie kľúčových pozícií, ako sú horské priechody, môže byť rozhodujúce pri víťazstve vo vojne.\"" # todo: NEW TRANSLATION
 hint_lacks_of_rivals: "Možní rivali" # todo: NEW TRANSLATION
 hint_lacks_of_rivals_hint_text: "$hint_lacks_of_rivals_hint_text_1$\n\n$hint_lacks_of_rivals_hint_text_2$\n\n$hint_lacks_of_rivals_hint_text_3$" # todo: NEW TRANSLATION
 hint_lacks_of_rivals_hint_text_1: "[Concept('rivals_with_icon','Rivali')|e] sú [Concept('countries_with_icon','krajiny')|e], ktoré verejne označíme za nepriateľské voči našim záujmom. Účel Rivalov je dvojaký: diplomaticky pomáhajú nadviazať priateľstvá s ich nepriateľmi, a ako útočný nástroj nám umožňujú sfabrikovať [Concept('casus_belli_with_icon','casus Belli')|e] proti nim a zasahovať do ich vojen." # todo: CHANGED # todo: CONCEPT CASE
 hint_lacks_of_rivals_hint_text_2: "#T Odporúčané kroky:#!\n@arrow_bonus_tier_3! Sledujte rivality a [Concept('alliances_with_icon','aliancie')|e] susedov a vyberte si tých istých rivalov ako krajina, s ktorou sa chcete spriateliť. Dávajte si pozor, aby ste si nezrobili príliš mocných nepriateľov.\n@arrow_bonus_tier_2! Môžete počkať, kým iné [countries] nevyhlásia rivalov, a potom konať, aby ste sa vyhli rozstreku zlých krajín.\n@arrow_bonus_tier_2! Vytvorte [Concept('spy_network_with_icon','špionážna sieť')|e] vo vašich [rivals], aby ste sfabrikovali [Concept('casus_belli_with_icon','casus Belli')|e] proti nim." # todo: CHANGED # todo: CONCEPT CASE
 hint_lacks_of_rivals_hint_text_3: "#T Extra tipy:#!\n@hint! Nemusíte deklarovať všetkých dostupných rivalov. Môžete pravým kliknutím na #W Upozornenie#! ho zahodiť.\n@hint! Mať Rivalov tiež znamená, že budete vyzvaní do ich vojen na opačnej strane. Buďte však opatrní: naši [Concept('rival_enemies_with_icon','nepriateľov')|e] sa môžu vmiešať aj do našich vojen." # todo: CHANGED # todo: CONCEPT CASE
 hint_lacks_of_rivals_diplomatic: "\"Robenie zbytočných nepriateľov nie je nikdy múdre, ale vyhlásenie rovnakých Rivalov ako naši susedia nám môže pomôcť získať s nimi spojenectvo.\"" # todo: NEW TRANSLATION
 hint_lacks_of_rivals_administrative: "\"Nepriatelia našich rivalov by mali byť našimi priateľmi.\"" # todo: NEW TRANSLATION
 hint_lacks_of_rivals_military: "\"Mať správnych Rivalov ponúka bohaté príležitosti tým, ktorí sú dostatočne odvážni ich využiť.\"" # todo: NEW TRANSLATION
 hint_control: "Blízkosť a kontrola" # todo: NEW TRANSLATION
 hint_control_hint_text: "$hint_control_hint_text_1$\n\n$hint_control_hint_text_2$\n\n$hint_control_hint_text_3$" # todo: NEW TRANSLATION
 hint_control_hint_text_1: "[Concept('control_with_icon','Kontrola')|e] je jedným z najdôležitejších atribútov našich [Concept('locations_with_icon','lokalít')|e]. Reprezentuje dosah centrálnej vlády a určuje podiel [Concept('wealth_with_icon','bohatstvo')|e] v lokalite, ktorý je možné zdanariť [Concept('taxes_with_icon','dane')|e]. Akékoľvek bohatstvo mimo dosahu vášho [control] ide priamo do vreciek vašich [Concept('estates_with_icon','stavov')|e] bez daní. [control] tiež určuje, koľko [Concept('levies_with_icon','branci')|e] môžete z lokality povolať.\n\nControl lokality sa mesačne mení smerom k [Concept('max_control_with_icon','maximálnej kontrole')|e]. [Concept('siege_with_icon','Obliehanie')|e] alebo iné udalosti ho môžu dočasne znížiť, ale lokalita sa nakoniec vráti na svoju max hodnotu.\n\nHlavným zdrojom [max_control] je [proximity_icon] [Concept('proximity','blízkosti')|e]. Naša [capital_icon] [Concept('capital','hlavného mesta')|e] bude mať vždy #W 100%#! Proximity a všetky ostatné lokality vypočítavajú svoju proximitu podľa vzdialenosti od hlavného mesta. Proximita sa šíri cez súš a more, efektívnejšie pozdĺž [road_icon] [Concept('roads_with_icon','ciest')|e], otvoreného terénu a [seazones_icon] [Concept('seazones','morských zón')|e] s vysokou [maritime_presence_icon] [Concept('maritime_presence','námornou prítomnosťou')|e]; menej efektívne cez hory, lesy a [seazones] infikované [Concept('pirates_with_icon','piráti')|e]. Ďalšie faktory ovplyvňujú Max Control, ako [Concept('pop_satisfaction_with_icon','spokojnosť populácie')|e], [Concept('integration_status_with_icon','stav integrácie')|e] alebo špeciálne [buildings].\n\nOkrem hlavného mesta môžete šíriť [proximity] z [ShowBuildingTypeName('local_governor')] [Concept('building','budovy')|e]." # todo: CHANGED # todo: CONCEPT CASE
 hint_control_hint_text_2: "#T Odporúčané kroky:#!\n@arrow_bonus_tier_3! Koncentrujte stavebné úsilie v našom [capital] a okolí, pretože od začiatku budú mať najvyšší [control].\n@arrow_bonus_tier_2! Postavte [road_icon] [Concept('roads','ciest')|e] z #W Location Panel#!, aby ste spojili hlavné mesto s najbohatšími mestami.\n@arrow_bonus_tier_2! Zvážte výstavbu [ShowBuildingTypeName('local_governor')] v oblastiach s vysokým [wealth] a nízkym [control]. Musia byť postavené v [ShowLocationRankName('city')] pripojenej cestou k vášmu [capital] a budú fungovať ako sekundárne [capital]. Sú drahé na udržanie, takže sa uistite, že prínosy ospravedlňujú investíciu!\n@arrow_bonus_tier_2! Lokality s [port_icon] [Concept('port','prístavom')|e] môžu mať ľahší prístup k hlavnému mestu po mori, obzvlášť ak majú vysokú [Concept('harbor_capacity_with_icon','kapacitu prístavu')|e]. Môžete ju zvýšiť v kľúčových pobrežných lokalitách pomocou [buildings] ako [ShowBuildingTypeName('wharf')] alebo [ShowBuildingTypeName('dock')].\n@arrow_bonus_tier_1! Nové [Concept('conquered_with_icon','dobytá')|e] [Concept('locations_with_icon','lokalít')|e] začínajú na #W 0%#! [control] a môže im dlho trvať dosiahnutie maxima. Môžete urýchliť proces umiestnením [Concept('army_with_icon','armádou')|e] v lokalite alebo použitím [ShowCabinetActionName('increase_control_province')] [cabinet_action_icon] [Concept('cabinet_action','akcie kabinetu')|e]." # todo: CHANGED # todo: CONCEPT CASE
 hint_control_hint_text_3: "#T Extra tipy:#!\n@hint! Priemerné [control] vašej [country] má veľký vplyv na váš [Concept('crown_power_with_icon','moc koruny')|e]. Veľká krajina s nízkym [control] bude mať problémy efektívne spravovať svoje [estates] a zdroje, zatiaľ čo malý centralizovaný štát môže mať väčší vplyv, než by jeho veľkosť naznačovala. Pamätajte, že bezhlavá expanzia môže krajinu zničiť! Viac o [crown_power] nájdete v [Link('hints', 'selected_hint = hint_crown_power', 'Crown Power Hint')].\n@hint! Lokalita s #W 0%#! [control] nebude generovať žiadne [taxes], ale [estates] si aj tak prichystajú svoje príjmy. Bohaté a šťastné [estates] môžu pomôcť vybudovať ekonomiku aj samy.\n@hint! Plánujte sieť [road] starostlivo: jedna dobre umiestnená cesta cez horské pásmo môže zlepšiť [proximity] mnohých lokalít na druhej strane.\n@hint! Niektoré [Concept('government_reforms_with_icon','vládne reformy')|e], ako [ShowGovernmentReformName('harbor_administration')], umožňujú postaviť [ShowBuildingTypeName('naval_governor')] v zámorí. Guvernéri fungujú ako sekundárne [capitals] a pomáhajú šíriť [proximity] do vzdialených krajín. Námořní guvernéri sa dajú postaviť len v pobrežnom [ShowLocationRankName('city')], ktorý nie je spojený pozemnou cestou s vaším [capital].\n@hint! Ak sa chcete dozvedieť viac o [proximity] z [Concept('maritime_presence_with_icon','námornej prítomnosti')|e], skontrolujte [Link('hints', 'selected_hint = hint_maritime', 'Maritime Presence')] Hint#!" # todo: CHANGED # todo: CONCEPT CASE
 hint_control_diplomatic: "\"Vysoká kontrola pomáha konvertovať a asimilovať naj... #italic neporiadnych#! členov našej spoločnosti.\"" # todo: NEW TRANSLATION
 hint_control_administrative: "\"Lokalita mimo našej kontroly sotva prinesie nejaké dane.\"" # todo: NEW TRANSLATION
 hint_control_military: "\"Musíme ovládať naše územie, ak chceme naverbovať našu populáciu.\"" # todo: NEW TRANSLATION
 hint_crown_power: "Korunná moc" # todo: NEW TRANSLATION
 hint_crown_power_hint_text: "$hint_crown_power_hint_text_1$\n\n$hint_crown_power_hint_text_2$\n\n$hint_crown_power_hint_text_3$" # todo: NEW TRANSLATION
 hint_crown_power_hint_text_1: "Naša [Concept('crown_power_with_icon','moc koruny')|e] predstavuje vplyv vlády v našich vlastných hraniciach. Ako [ShowEstateTypeName('crown_estate')] zdieľame zdroje krajiny s našimi [Concept('estates_with_icon','stavmi')|e], ktorých záujmy nemusia byť vždy v súlade s našimi.\n\nVyššia Korunná moc uľahčí prijímanie nové [Concept('laws_with_icon','zákony')|e], zlepší efektivitu nášho [Concept('cabinet_with_icon','kabinetu')|e] a zvýši našu základnú podporu v [Concept('parliament_with_icon','parlamente')|e]. Možno ešte dôležitejšie je, že Korunná moc určuje, do akej miery štát zdieľa zisky a náklady z [Concept('trade_with_icon','obchodu')|e] a [Concept('food_with_icon','potravín')|e] s [estates].\n\nNaša Korunná moc bude primárne závisieť od množstva udelených [Concept('privileges_with_icon','privilégií')|e] [estates] a od [Concept('control_with_icon','kontroly')|e] našich najhustejšie osídlených [Concept('locations_with_icon','lokality')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 hint_crown_power_hint_text_2: "#T Odporúčané kroky:#!\n@arrow_bonus_tier_3! Zvýšte kontrolu v našich [locations] budovaním [Concept('roads_with_icon','cestami')|e] z [Concept('capital_with_icon','hlavného mesta')|e]. \n@arrow_bonus_tier_2! Odoberajte [privileges] od našich najsilnejších [estates] keď máme vysokú [Concept('stability_with_icon','stabilitu')|e], ale sledujte ich [Concept('estate_satisfaction','spokojnosť stavu')|e]. Nahnevané [estate] môže znamenať problémy v dohľadne.\n@arrow_bonus_tier_1! Zvýšte [Localize(Player.GetGovernment.GetGovernmentType.GetPowerConcept)] pomocou [ShowCabinetActionName('strengthen_government')] [Concept('cabinet_action_with_icon','akcie kabinetu')|e].\n@arrow_bonus_tier_1! Postavte [ShowBuildingTypeName('royal_court')] alebo [ShowBuildingTypeName('sergeantry')] v [capital]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 hint_crown_power_hint_text_3: "#T Ďalšie tipy:#!\n@hint! Pri 50% Korunnej moci pôjde polovica výdavkov a ziskov z [trade] a [food] priamo do [Concept('treasury_with_icon','pokladnice')|e], zatiaľ čo druhá polovica bude rozdelená medzi [estates] podľa ich príslušnej [Concept('estate_power_with_icon','sile stavu')|e].\n@hint! Korunná moc je zvyčajne veľmi nízka na začiatku hry, obzvlášť u väčších [countries].\n@hint! Budúce [Concept('advances_with_icon','pokroky')|e] odomknú ďalšie [buildings] a bonusy k vašej [crown_power]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 hint_crown_power_diplomatic: "\"Kým je naša Korunná moc nízka, zostávame na milosti našich Estátov.\"" # todo: NEW TRANSLATION
 hint_crown_power_administrative: "\"Zvýšenie Korunnej moci by nám pomohlo zbierať výhody z Obchodu.\"" # todo: NEW TRANSLATION
 hint_crown_power_military: "\"Centralizovaný štát môže udierať silnejšie, než by jeho veľkosť naznačovala.\"" # todo: NEW TRANSLATION
 hint_estates: "Estáty" # todo: NEW TRANSLATION
 hint_estates_hint_text: "$hint_estates_hint_text_1$\n\n$hint_estates_hint_text_2$\n\n$hint_estates_hint_text_3$" # todo: NEW TRANSLATION
 hint_estates_hint_text_1: "Estates predstavujú špecifické záujmy v našich hraniciach. Každý Estate má percento [Concept('estate_power_with_icon','sila stavu')|e], ktoré meria ich moc oproti ostatným Estates a [ShowEstateTypeName('crown_estate')] v distribúcii s nulovým súčtom.\n\nMoc stavov vychádza primárne z [Concept('population_with_icon','populácie')|e], pričom každý [Concept('pop_type_with_icon','sociálna trieda')|e] podporuje konkrétny [estate]. Moc Estate ďalej modifikujú existujúce [Concept('laws_with_icon','zákony')|e] a [Concept('privileges_with_icon','privilégiá')|e].\n\nEstate Power určuje ich vplyv v [Concept('parliament_with_icon','parlamente')|e], ovplyvňuje, koľko im môžete [Concept('tax_with_icon','daň')|e] a určuje, ako sa rozdeľujú zisky a náklady z [Concept('trade_with_icon','obchodu')|e] a [Concept('food_with_icon','potravín')|e].\n\nEstates tiež majú úroveň [Concept('estate_satisfaction_with_icon','spokojnosť stavu')|e], ktorá meria ich súlad s vládou. Každý Estate poskytuje rozdielny pozitívny modifikátor pri vysokej spokojnosti a penalizáciu, ak klesne pod #W 50%#!. Keď je spokojnosť Estate príliš nízka, ich [Concept('pops_with_icon','populácie')|e] môžu začať podporovať [Concept('rebellions_with_icon','povstania')|e]. Najkritickejšie, Estate pod #W 25%#! už neposkytuje [Concept('levies_with_icon','branci')|e]." # todo: CHANGED # todo: CONCEPT CASE
 hint_estates_hint_text_2: "#T Odporúčané kroky:#!\n@arrow_bonus_tier_3! [Concept('taxes_with_icon','Dane')|e] vybrané od [estates] sú hlavným zdrojom [Concept('income_with_icon','príjmom')|e] pre väčšinu [countries]. Môžete nastaviť alebo automatizovať dane v @economy_panel! #W Budget panel#!.\n@arrow_bonus_tier_2! Akákoľvek moc, ktorú majú stavy, prichádza na úkor nášho [Concept('crown_power_with_icon','moci koruny')|e]. Môžete oslabovať ich moc odoberaním [Concept('privileges_with_icon','privilégiami')|e] v @government_panel! #W Estates Tab#!.\n@arrow_bonus_tier_1! Upokojenie vzbury Estate dosiahnete znížením [taxes], udelením [privilege] alebo úplatkom v @government_panel! #W Estates Tab#!." # todo: CHANGED # todo: CONCEPT CASE
 hint_estates_hint_text_3: "#T Extra tipy:#!\n@hint! Stavy zbierajú celé [Concept('tax_base_with_icon','daňový základ')|e] z našich [Concept('locations_with_icon','lokalít')|e] a my dostávame len toľko, koľko z nich [tax] vyberieme.\n@hint! V skorých fázach hry sú [countries] veľmi závislé na [Concept('levies_with_icon','brancov')|e] od [estates] na vedenie ich [Concept('wars_with_icon','vojny')|e], kým ich nezačnú nahrádzať modernejšie [Concept('regular_regiments_with_icon','stále pluky')|e]." # todo: CHANGED # todo: CONCEPT CASE
 hint_estates_diplomatic: "\"Silné Kňazstvo zvyšuje stabilitu kráľovstva.\"" # todo: NEW TRANSLATION
 hint_estates_administrative: "\"Silný Stav Mešťanov pridáva bohatstvo nášmu národu a objem nášho obchodu.\"" # todo: NEW TRANSLATION
 hint_estates_military: "\"Silná šľachta zvyšuje veľkosť a silu našich armád.\"" # todo: NEW TRANSLATION
 hint_markets: "Trhy" # todo: NEW TRANSLATION
 hint_markets_hint_text: "$hint_markets_hint_text_1$\n\n$hint_markets_hint_text_2$\n\n$hint_markets_hint_text_3$" # todo: NEW TRANSLATION
 hint_markets_hint_text_1: "[Concept('markets_with_icon','Trhy')|e] sú srdcom ekonomiky v #italic Europa Universalis V#!. Všetky lokality patria do trhu, kde predávajú a kupujú tovary potrebné pre [Concept('pop_needs_with_icon','potreby populácie')|e], [Concept('buildings_with_icon','budovy')|e] a [Concept('constructions_with_icon','výstavby')|e]. Predajom tovaru na svojom trhu lokality generujú [Concept('tax_base_with_icon','daňový základ')|e] pre [Concept('estates_with_icon','stavy')|e], ktoré vláda potom môže vyberať formou [Concept('taxes_with_icon','daňami')|e]." # todo: CHANGED # todo: CONCEPT CASE
 hint_markets_hint_text_2: "#T Odporúčané kroky:#!\n@arrow_bonus_tier_3! Prejdite do @economy_panel! [Link('trade', 'subtab = markets', 'Markets Panel')] a pozrite si relevantné trhy. Trhy so #G zeleným#! nadpisom obsahujú naše [Concept('owned_with_icon','vlastnené')|e], zatiaľ čo trhy s modrým nadpisom sú trhy, kde máme [Concept('merchant_capacity_with_icon','obchodná kapacita')|e], ale nevlastníme žiadnu [location].\n@arrow_bonus_tier_3! Odporúča sa automatizovať každý jednotlivý trh kliknutím na @automation! #W Cog Icon#!. To udrží našu [Concept('merchant_capacity_with_icon','neobchodnú kapacitu')|e] použitú na najzaujímavejšie [Concept('merchants_with_icon','obchodníci')|e].\n@arrow_bonus_tier_2! Postavte [Concept('buildings_with_icon','budovy')|e] ako [ShowBuildingTypeName('marketplace')] a [ShowBuildingTypeName('trade_office')] na zvýšenie [Concept('merchant_capacity_with_icon','obchodná kapacita')|e] na trhu." # todo: CHANGED # todo: CONCEPT CASE
 hint_markets_hint_text_3: "#T Ďalšie tipy:#!\n@hint! Hranice Trhov sú dynamické: [locations] pripadnú Trhu s najvyšším [Concept('market_attraction_with_icon','atraktivitou trhu')|e] na ich území, aj keď ide o cudzí Trh. [market_attraction] cudzích Trhov môže byť zneplatnená [Concept('protectionism_with_icon','trhová ochrana')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 hint_markets_diplomatic: "\"Neviditeľná ruka je múdry pán, ale niekedy potrebuje malé usmernenie.\"" # todo: NEW TRANSLATION
 hint_markets_administrative: "\"To je ekonomika, ty hlupák!\"" # todo: NEW TRANSLATION
 hint_markets_military: "\"Rozširovanie našich Trhov je dobré.\nDobývanie susedných Trhov je ešte lepšie.\"" # todo: NEW TRANSLATION
 hint_food: "Potraviny" # todo: NEW TRANSLATION
 hint_food_hint_text: "$hint_food_hint_text_1$\n\n$hint_food_hint_text_2$\n\n$hint_food_hint_text_3$" # todo: NEW TRANSLATION
 hint_food_hint_text_1: "[Concept('pops_with_icon','Populácie')|e] potrebujú [Concept('food_with_icon','potraviny')|e] na život a [Concept('armies_with_icon','armády')|e] potrebujú jedlo na pochod. Obe čerpajú jedlo zo zásob provincie [Concept('province_with_icon','provincia')|e], v ktorej sa nachádzajú (a nie z lokality!). Ak nie je dostatok [food], [pops] budú trpieť [Concept('starvation_with_icon','hladovanie')|e] a [armies] utrpia [Concept('attrition_with_icon','vyčerpanie')|e].\n\nSú tri vrstvy zapojené do produkcie a distribúcie [Concept('food','potravín')]:\n\n@location! [Concept('local_food_with_icon','Lokálne potraviny')|e]:\nPotraviny sa primárne produkuje v lokalitách s [Concept('food_raw_materials_with_icon','surovými potravinami')|e] ako ich [Concept('rgo_with_icon','R.G.O.')|e], napr. [ShowGoodsName('livestock')]. Ak má lokalita prebytok alebo deficit, pridá sa to do provinčných potravín.\n\n@province! [Concept('provincial_food','Provinčné potraviny')|e]:\nProvinčné potraviny je najdôležitejšia vrstva. Ak provincia nevyrába dosť [Concept('food','potravín')] na zásobenie všetkých svojich lokalít, provinčné zásoby sa znižujú. Keď sa vyčerpajú, všetky lokality v provincii budú hladovať. Predtým však provincia skúsi [Concept('buy_food_with_icon','kúpiť potraviny')|e] z jej [market].\n\n@market! [Concept('market_food','Trhové potraviny')|e]:\nVšetky provincie v [Concept('market_with_icon','trhu')|e] sa snažia predávať jedlo, keď majú prebytok, a kupovať jedlo, keď majú deficit. Pokiaľ je v trhu dostatok jedla, nikto nehladovuje." # todo: CHANGED # todo: CONCEPT CASE
 hint_food_hint_text_2: "#T Odporúčané kroky:#!\n@arrow_bonus_tier_3! Prejdite do @economy_panel! [Link('trade', 'subtab = markets', 'Markets Panel')] a pozrite si relevantné trhy. Trhy so #G zeleným#! nadpisom obsahujú naše [Concept('owned_with_icon','vlastnené')|e] [locations], takže musíme zabezpečiť, aby ich bilancia jedla zostala pozitívna. Ak sa jedlo v niektorom trhu rýchlo znižuje, uvidíte žltý banner. Ak lokality hladujú, uvidíte červený banner.\n@arrow_bonus_tier_3! Aby ste zvýšili produkciu jedla v ktoromkoľvek z našich trhov, kliknite na tlačidlo Jedlo a prejdite do @production_panel! [Link('food_production', '', 'lateralview_food_production_entry_name')]. Odtiaľ môžete vidieť, ktoré provincie sú v nebezpečenstve a rozšíriť ich [rgo].\n@arrow_bonus_tier_3! Rozšírte [Concept('rgo_with_icon','R.G.O.')|e] v lokalitách s najlepšími [food_raw_materials], ako [ShowGoodsName('rice')] alebo [ShowGoodsName('wheat')], a vysokou [Concept('food_productivity_with_icon','produktivitou potravín')|e].\n@arrow_bonus_tier_1! Môžeme tiež použiť [Concept('merchant_capacity_with_icon','obchodná kapacita')|e] na dovoz [Concept('food_raw_materials_with_icon','surové potraviny')|e] z iných trhov, čo presunie ekvivalentné množstvo [food]. Urobíte to v @economy_panel! [Link('trade', 'subtab = trades', 'lateralview_trade_entry_name')]." # todo: CHANGED # todo: CONCEPT CASE
 hint_food_hint_text_3: "#T Extra tipy:#!\n@hint! Produkcia jedla klesá počas [Concept('winter_with_icon','zimy')|e]. Nepanikárte, ak uvidíte, že všetky naše trhy idú niekoľko mesiacov do mínusu.\n@hint! [provinces|U] v deficite si kúpia prebytok vašich najproduktívnejších provincií, ak patria do toho istého trhu, takže je zvyčajne najlepšie rozširovať potravinové tovary v lokalitách s najvyššou [food_productivity].\n@hint! [Concept('town_or_city_with_icon','Mestská lokalita')|e] sú obvykle menej efektívne pri produkcii [food] než [Concept('rural_locations_with_icon','vidiecke lokality')|e]." # todo: CHANGED # todo: CONCEPT CASE
 hint_food_diplomatic: "\"Dlhodobý hlad môže znamenať zánik obyvateľstva a pád národa.\"" # todo: NEW TRANSLATION
 hint_food_administrative: "\"Hlad je do veľkej miery otázkou perspektívy. Nie je to také zlé, ak ste ten, kto predáva jedlo.\"" # todo: NEW TRANSLATION
 hint_food_military: "\"Armáda pochoduje na žalúdku.\"" # todo: NEW TRANSLATION
 hint_maritime: "Námorná prítomnosť" # todo: NEW TRANSLATION
 hint_maritime_hint_text: "$hint_maritime_hint_text_1$\n\n$hint_maritime_hint_text_2$\n\n$hint_maritime_hint_text_3$" # todo: NEW TRANSLATION
 hint_maritime_hint_text_1: "[Concept('maritime_presence_with_icon','Námorná prítomnosť')|e] je veľmi dôležitá metrika pre pobrežné [Concept('seazones_with_icon','morské zóny')|e]. Pomáha uplatňovať [Concept('proximity_with_icon','blízkosť')|e] pozdĺž našich brehov alebo na ostrovoch.\n\nOkrem toho poskytuje [Concept('merchant_power_with_icon','neobchodnú výhodu')|e] trhu [Concept('market_with_icon','trhu')|e], ku ktorému príslušné [seazones] patria.\n\n[maritime_presence] sa získava pasívne cez budovy a prítomnosť [Concept('navy_with_icon','námorníctvo')|e], má útlm v čase, ale môže byť tiež stratená kvôli [Concept('privateers_with_icon','korzárom')|e] alebo [Concept('blockade_with_icon','blokáda')|e]." # todo: CHANGED # todo: CONCEPT CASE
 hint_maritime_hint_text_2: "#T Odporúčané kroky:#!\n@arrow_bonus_tier_3! Vytvorte špecializované [navies] s lodami, ktoré majú vysoký zisk [maritime_presence]. Potom ich umiestnite do jedného z vašich pobrežných [seazones] a budú šíriť [maritime_presence] rovnomerne do všetkých [seazones] patriacich tej istej provincie.\n@arrow_bonus_tier_3! Alternatívne ich nastavte na [Concept('military_objective_with_icon','vojenský cieľ')|e] #V $MILITARY_OBJECTIVE_TYPE_NAME_patrol_the_seas$#!, čo urobí to isté a zároveň automaticky opraví lode podľa potreby.\n@arrow_bonus_tier_2! Podporujte [ShowSocietyDirectionName('naval')] [Concept('societal_value','sociálna hodnota')|e].\n@arrow_bonus_tier_1! [ShowBuildingTypeName('coastal_fort')] je veľmi dobrá budova na použitie!" # todo: CHANGED # todo: CONCEPT CASE
 hint_maritime_hint_text_3: "#T Extra tipy:#!\n@hint! [maritime_presence] sa šíri len do provincie, na ktorej sa nachádzajú, aj keď má cieľ nastavený na viac provincií. #V $MILITARY_OBJECTIVE_TYPE_NAME_patrol_the_seas$#! presunie [navy], keď [seazone] dosiahne #W 100%#! [maritime_presence].\n@hint! [privateers] kradnú bohatstvo iným [countries] a zároveň znižujú ich [maritime_presence]. Na rozdiel od [maritime_presence] pôsobia [privateers] na úrovni [Concept('area_with_icon','oblasti')|e], čo znamená, že všetky [provinces] v oblasti pociťujú ich účinky.\n@hint! Niektoré [Concept('government_reforms_with_icon','vládne reformy')|e], ako [ShowGovernmentReformName('harbor_administration')], umožňujú postaviť [ShowBuildingTypeName('naval_governor')] v zámorí. Guvernéri fungujú ako sekundárne [capitals] a pomáhajú rozširovať [proximity] do vzdialených krajín. Námořní guvernéri sa dajú postaviť len v pobrežnom [ShowLocationRankName('city')], ktorý nie je spojený pozemnou cestou s vaším [capital]." # todo: CHANGED # todo: CONCEPT CASE
 hint_maritime_diplomatic: "\"Musíme využiť naše pobrežie na zlepšenie obchodov.\"" # todo: NEW TRANSLATION
 hint_maritime_administrative: "\"Čím bezpečnejšie morské plavby, tým lepšia komunikácia s naším obyvateľstvom.\"" # todo: NEW TRANSLATION
 hint_maritime_military: "\"So silnou námornou prítomnosťou si piráti nedovolia ohroziť naše obchodné trasy.\"" # todo: NEW TRANSLATION
 hint_slaves: "Otroci" # todo: NEW TRANSLATION
 hint_slaves_hint_text: "$hint_slaves_hint_text_1$\n\n$hint_slaves_hint_text_2$\n\n$hint_slaves_hint_text_3$" # todo: NEW TRANSLATION
 hint_slaves_hint_text_1: "@slaves_goods! [ShowGoodsName('slaves_goods')] sú veľmi špecifický druh [Concept('good_with_icon','tovar')|e]. Rovnako ako ktorýkoľvek iný [good], sú kupované a predávané na [Concept('markets_with_icon','trhy')|e], a ich cena závisí od [Concept('supply_with_icon','ponuky')|e] a [Concept('demand_with_icon','dopytu')|e]. Na rozdiel od iných [good] predstavujú skutočné [Concept('pops_with_icon','populácie')|e], ktoré sa presúvajú vždy, keď sa [good] obchoduje.\n\nAko [Concept('pop_type_with_icon','sociálna trieda')|e] môžu byť @slaves! [ShowPopTypeName('slaves')] použité ako pracovná sila v [rgo_with_icon|e] a otrockých [Concept('buildings_with_icon','budovách')|e], ako je [ShowBuildingTypeName('sugar_plantation')].\n\n[buildings] ako [ShowBuildingTypeName('slave_market')] môžu premeniť existujúcich @slaves! [ShowPopTypeName('slaves')] na @slaves_goods! [ShowGoodsName('slaves_goods')] [goods], ktoré sú následne predávané na [market]. [good] je potom obchodovaný ako ktorýkoľvek iný [good] a [buildings] ho môžu požadovať ako vstup. Keď k tomu dôjde, @slaves! [ShowPopTypeName('slaves')] budú presunutí do [location] aby pracovali v [building].\n\n@trigger_no! [ShowPopTypeName('slaves')] sa presunú do [location] len ak ešte nedosiahlo svoj #T slave [Concept('pop_with_icon','populácia')|e] strop#!. Postavte najprv [building], ktorý vyžaduje otrokov, inak dovážané [ShowGoodsName('slaves_goods')] sa nepremenia na [pops]." # todo: CHANGED # todo: CONCEPT CASE
 hint_slaves_hint_text_2: "#T Odporúčané kroky:#!\n@arrow_bonus_tier_3! [ShowBuildingTypeName('slave_center')] je cudzie [Concept('building_with_icon','budova')|e] postavené v západnej alebo strednej Afrike. Spotrebúva @firearms! [ShowGoodsName('firearms')], @paper! [ShowGoodsName('paper')], @stone! [ShowGoodsName('stone')] a @tools! [ShowGoodsName('tools')] na výrobu @slaves_goods! [ShowGoodsName('slaves_goods')]. Vyvezte tieto [goods] na váš africký [market], aby [ShowBuildingTypeName('slave_center')] fungoval.\n@arrow_bonus_tier_3! Pri zakladaní [Concept('colonies_with_icon','koloniách')|e] v [Concept('continent_with_icon','kontinente')|e] Ameriky najprv postavte [Concept('rgo_with_icon','R.G.O.')|e], ktoré vyžadujú otrokov, ako je [ShowBuildingTypeName('sugar_plantation')] — tie vytvárajú [Concept('demand_with_icon','dopyt')|e] po @slaves_goods! [ShowGoodsName('slaves_goods')]. Potom vytvorte [Concept('trade_with_icon','obchod')|e] trasu z vášho afrického [market] do vášho koloniálneho [market] na ich zásobovanie.\n@arrow_bonus_tier_2! Toto je klasický trojuholníkový [Concept('trade_with_icon','obchod')|e]: vyvážajte [ShowGoodsName('firearms')] a [ShowGoodsName('paper')] do Afriky, dovážajte [ShowGoodsName('slaves_goods')] z Afriky do vašich kolónií a na oplátku zbierajte [Concept('income_with_icon','príjem')|e] z plantážnej [production_with_icon|e]." # todo: CHANGED # todo: CONCEPT CASE
 hint_slaves_hint_text_3: "#T Extra tipy:#!\n@hint! [Concept('pops_with_icon','Populácie')|e] sú zvyčajne zotročovaní budovami ako [ShowBuildingTypeName('slave_market')], hoci niektoré [countries] majú špeciálne mechaniky, ktoré umožňujú zotročovanie [pops] počas [Concept('war_with_icon','vojny')|e].\n@hint! [ShowReligionGroupName('christian')] povoľuje Otroky len v Plantážnych [buildings], ktoré sa odomknú v #V Age of Discovery#! a je možné ich stavať len zámorsky." # todo: CHANGED # todo: CONCEPT CASE
 hint_slaves_diplomatic: "\"Všetci ľudia sú stvorení rovní, okrem niektorých.\"" # todo: NEW TRANSLATION
 hint_slaves_administrative: "\"Nič pozoruhodné nebolo nikdy dosiahnuté bez obetovania mnohých.\"" # todo: NEW TRANSLATION
 hint_slaves_military: "\"Ak je voľnej pracovnej sily nedostatok, pohania ju môžu poskytnúť.\"" # todo: NEW TRANSLATION
 hint_eco: "Pokročilé ekonomické rady" # todo: NEW TRANSLATION
 hint_eco_hint_text: "$hint_eco_hint_text_1$\n\n$hint_eco_hint_text_2$\n\n$hint_eco_hint_text_3$" # todo: NEW TRANSLATION
 hint_eco_hint_text_1: "Aj keď môžete automatizovať mnoho aspektov svojej ekonomiky, existujú stále kroky, ktoré musíte vykonať priamo, aby ste posunuli svoj [country] vpred." # todo: NEW TRANSLATION
 hint_eco_hint_text_2: "#T Odporúčané kroky:#!\n@arrow_bonus_tier_3! Najlepšia rada je vždy snažiť sa znížiť vaše [Concept('expenses_with_icon','výdavky')|e].\n\n@arrow_bonus_tier_3! Ako hráč by ste sa mali sústrediť na plánovanie [Concept('towns_and_cities_with_icon','mestské lokality')|e] a [Concept('roads_with_icon','cesty')|e]\n    Keďže [Concept('towns_and_cities_with_icon','mestské lokality')|e] znižujú počet [Concept('rgo_with_icon','R.G.O.')|e], ktoré môžete postaviť, chcete urbanizovať najmenej hodnotné z vašich [rural_locations]. To sú zvyčajne:\n@sand! [ShowGoodsName('sand')] @clay! [ShowGoodsName('clay')] @horses! [ShowGoodsName('horses')] @medicaments! [ShowGoodsName('medicaments')] @wine! [ShowGoodsName('wine')] @olives! [ShowGoodsName('olives')] @millet! [ShowGoodsName('millet')] @legumes! [ShowGoodsName('legumes')] @fruit! [ShowGoodsName('fruit')] @wild_game! [ShowGoodsName('wild_game')] @beeswax! [ShowGoodsName('beeswax')] \n\n@arrow_bonus_tier_3! Uvoľnite [Concept('subjects_with_icon','vazali')|e] na územiach s nízkym [Concept('control_with_icon','kontrolou')|e], pretože oni budú šíriť vlastné kontrolu.\n    [Concept('annex_with_icon','Anektovať')|e] vašich subjectov, keď si vybudujete infraštruktúru v oblasti.\n    [Concept('annexation_with_icon','Anexia')|e] rýchlosť sa škáluje podľa relatívnej veľkosti krajiny a [Concept('cultural_influence_with_icon','kultúrny vplyv')|e].\n\n@arrow_bonus_tier_2! Cenné [Concept('rgo_with_icon','R.G.O.')|e] sú veľmi dobrou investíciou, zvlášť ak si vybudujete [Concept('merchant_capacity_with_icon','obchodná kapacita')|e] na ich [Concept('export_with_icon','vývoz')|e].\n@goods_gold! [ShowGoodsName('goods_gold')] @silver! [ShowGoodsName('silver')] @gems! [ShowGoodsName('gems')] @pearls! [ShowGoodsName('pearls')] @amber! [ShowGoodsName('amber')] @ivory! [ShowGoodsName('ivory')] @pepper! [ShowGoodsName('pepper')] @saffron! [ShowGoodsName('saffron')] @chili! [ShowGoodsName('chili')]\n\n@arrow_bonus_tier_2! [Concept('trade_income_with_icon','Príjem z obchodu')|e] škáluje s [Link('hints', 'selected_hint = hint_crown_power', '@hint! Crown Power')] a vždy je dobré ho zvyšovať rozširovaním [Link('hints', 'selected_hint = hint_increasing_trade_capacity', '@hint! Trade Capacity')], ktoré na rozdiel od [tax_base] neskalujú s [control]\n\n@arrow_bonus_tier_1! Udržujte [Concept('prices','ceny')] priemyselných [Concept('goods','tovarov')] nízke! Zvýšia ziskovosť [Concept('towns_or_cities','mestských lokalít')] a znížia udržiavacie náklady [Concept('buildings_with_icon','budovy')|e].\n@lumber! [ShowGoodsName('lumber')] @masonry! [ShowGoodsName('masonry')] @glass! [ShowGoodsName('glass')] @iron! [ShowGoodsName('iron')] @mercury! [ShowGoodsName('mercury')] @steel! [ShowGoodsName('steel')]\n\n@arrow_bonus_tier_1! Budovy bez [Concept('production_method_with_icon','spôsobu výroby')|e] budú mať [Concept('maintenance_with_icon','údržba')|e] náklady. Tie budú kolísať podľa ceny vstupných tovarov. Pamätajte, že [Concept('demand_with_icon','dopyt')|e] zo strany [buildings] tiež stimuluje rast vašej ekonomiky!" # todo: CHANGED # todo: CONCEPT CASE
 hint_eco_hint_text_3: "#T Ďalšie tipy:#!\n[Link('hints', 'selected_hint = hint_inflation', '@hint! Znižovanie inflácie')]\n[Link('hints', 'selected_hint = hint_increasing_trade_capacity', '@hint! Zvýšenie obchodnej kapacity')]\n[Link('hints', 'selected_hint = hint_control', '@hint! Zvýšenie kontroly')]" # todo: NEW TRANSLATION
 hint_eco_diplomatic: "\"Niekedy sú mince tým najlepším nástrojom vplyvu.\""
 hint_eco_administrative: "\"Zlato je krvou národov.\""
 hint_eco_military: "\"Príjem získaný od iných je ten najlepší príjem.\""
 hint_pol: "Pokročilé politické rady" # todo: NEW TRANSLATION
 hint_pol_hint_text: "$hint_pol_hint_text_1$\n\n$hint_pol_hint_text_2$\n\n$hint_pol_hint_text_3$" # todo: NEW TRANSLATION
 hint_pol_hint_text_1: "Všetky [Concept('countries_with_icon','krajiny')|e] začínajú s niektorými nevýhodami. Uistite sa, že skontrolujete [Link('government', 'tabcontent = estates', '@government_panel! $lateralview_government_entry_name$')] pre [Concept('privileges_with_icon','privilégiá')|e] a [Concept('laws_with_icon','zákony')|e]. Tieto makro-zmeny môžu byť dlhodobo mimoriadne nápomocné.\n\nNebojte sa niečo zmeniť!" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 hint_pol_hint_text_2: "#T Odporúčané kroky:#!\n@arrow_bonus_tier_3! Uistite sa, že [Concept('estate_satisfaction_equilibrium_with_icon','rovnováha spokojnosti')|e] je dosť na [Concept('tax_with_icon','daň')|e] [ShowEstateTypeName('burghers_estate')] a [ShowEstateTypeName('peasants_estate')] na maximálnej úrovni, bez toho aby to kleslo pod #W 50%#!.\n\n@arrow_bonus_tier_3! Skontrolujte [Link('societal_values', '', '@government_panel! Government Panel > Values')] aby ste zistili, ktoré [Concept('societal_values_with_icon','sociálne hodnoty')|e] stojí za to sledovať. Vo všeobecnosti sú najvýhodnejšie:\n$BULLET_WITH_TAB$[ShowSocietyDirectionName('capital_economy')]\n$BULLET_WITH_TAB$[ShowSocietyDirectionName('centralization')]\n\n@arrow_bonus_tier_3! Prejdite [Concept('laws_with_icon','zákony')|e], aby ste zistili, čo je potrebné zmeniť.\n    [Concept('parliament_with_icon','Parlament')|e] umožní jednoduché zmeny [Concept('law','zákonov')] a malo by byť jednou z priorít v skorom štádiu hry\n    Zákony na ktoré si dať pozor na začiatku hry:\n    $BULLET_WITH_TAB$[ShowLawName('mining_law')]\n    $BULLET_WITH_TAB$[ShowLawName('precious_metal_distribution_law')]\n    $BULLET_WITH_TAB$[ShowLawName('distribution_of_power_law')]\n    $BULLET_WITH_TAB$[ShowLawName('administrative_system')]\n\n@arrow_bonus_tier_3! Prejdite priradené a dostupné [Concept('privileges_with_icon','privilégiá')|e] pre každé [Concept('estate_with_icon','stav')|e]. Sú nástrojom na úpravu rovnováhu spokojnosti a driftu [Concept('societal_values','sociálnych hodnôt')].\n   [ShowEstateTypeName('nobles_estate')] by mali dostať len toľko, aby boli lojálni. Odňatie [Concept('estate_power','sily stavu')] od nich je dlhodobo prospešné.\n    $BULLET_WITH_TAB$[ShowEstatePrivilegeName('nobles_land_rights')]\n    $BULLET_WITH_TAB$[ShowEstatePrivilegeName('nobility_council')]\n    $BULLET_WITH_TAB$[ShowEstatePrivilegeName('noble_serfdom_rights')]\n    $BULLET_WITH_TAB$[ShowEstatePrivilegeName('noble_sponsored_navy')]\n\n   [ShowEstateTypeName('clergy_estate')] by mali dostať všetky pozitívne [Concept('privilege','privilégiá')], aj keď ich nemožno zdaňovať - každý bod ich [Concept('estate_satisfaction','spokojnosti stavu')] nad #W 50%#! poskytuje bonus k [Concept('research_progress_with_icon','pokroku výskumu')|e]\n    $BULLET_WITH_TAB$[ShowEstatePrivilegeName('embellish_great_works_of_faith')]\n    $BULLET_WITH_TAB$[ShowEstatePrivilegeName('clergy_in_administration')]\n    $BULLET_WITH_TAB$[ShowEstatePrivilegeName('clergy_religious_state')]\n    $BULLET_WITH_TAB$[ShowEstatePrivilegeName('clerical_advisory_council')]\n\n   [ShowEstateTypeName('burghers_estate')] by mali byť aktívne obdarovaní čo najväčším počtom pozitívnych privilégií. Sú prevažne prínosné, avšak zvýšenie [Concept('estate_power_with_icon','sila stavu')|e] burghers zníži moc ostatných stavy. Navyše každý bod spokojnosť stavu zvýši [Concept('production_efficiency_with_icon','efektivita produkcie')|e]\n    $BULLET_WITH_TAB$[ShowEstatePrivilegeName('building_roads_rights')]\n    $BULLET_WITH_TAB$[ShowEstatePrivilegeName('market_fairs')]\n    $BULLET_WITH_TAB$[ShowEstatePrivilegeName('building_rights')]\n    $BULLET_WITH_TAB$[ShowEstatePrivilegeName('allow_trade_center_sponsorship')]\n    $BULLET_WITH_TAB$[ShowEstatePrivilegeName('commercial_advisory_council')]\n    $BULLET_WITH_TAB$[ShowEstatePrivilegeName('control_over_the_coinage')]\n    $BULLET_WITH_TAB$[ShowEstatePrivilegeName('guild_investments')]\n    $BULLET_WITH_TAB$[ShowEstatePrivilegeName('land_of_commerce')]\n    $BULLET_WITH_TAB$[ShowEstatePrivilegeName('urban_development_grants')]\n\n   [ShowEstateTypeName('peasants_estate')] Privilégiá by mali zabezpečiť dostatočné [Concept('estate_satisfaction_equilibrium','rovnováhu spokojnosti')], aby umožnili maximálny [Concept('tax','daň')]. Je dôležité mať na pamäti ich sklony k [ShowSocietyDirectionName('decentralization')], čo nie je ideálne. Napriek tomu budú roľníci mať počas hry nízke [Concept('estate_power','silu stavu')], takže náklady na odobratie práv budú v porovnaní s inými stavmi nízke\n    $BULLET_WITH_TAB$[ShowEstatePrivilegeName('peasants_allowed_weapons_privilege')]\n    $BULLET_WITH_TAB$[ShowEstatePrivilegeName('allow_hunting')]\n    $BULLET_WITH_TAB$[ShowEstatePrivilegeName('no_labor_sunday')]\n    $BULLET_WITH_TAB$[ShowEstatePrivilegeName('peasants_represented_in_parliament')]\n    $BULLET_WITH_TAB$[ShowEstatePrivilegeName('peasants_fewer_levies')]\n\n@arrow_bonus_tier_2! Hľadajte [Concept('government_reforms_with_icon','vládne reformy')|e], ktoré by vyhovovali [Concept('societal_values','sociálnym hodnotám')], ktoré hľadáte. Majte na pamäti, že niektoré bonusy, ako [Concept('diplomatic_capacity_with_icon','diplomatická kapacita')|e], môžu umožniť znížiť [Concept('diplomatic_maintenance_with_icon','diplomatické výdavky')|e].\n\n@arrow_bonus_tier_2! Niektoré [Concept('cabinet_actions_with_icon','akcie kabinetu')|e], ako [ShowCabinetActionName('stabilize_country')] alebo [ShowCabinetActionName('strengthen_government')], môžu znížiť výdavky, takže vám zostane viac [Concept('income','príjmu')] na míňanie!" # todo: CHANGED # todo: CONCEPT CASE
 hint_pol_hint_text_3: "#T Ďalšie tipy:#!\n[Link('hints', 'selected_hint = hint_crown_power', '@hint! Moc koruny')]\n[Link('hints', 'selected_hint = hint_estates', '@hint! Stavy')]" # todo: NEW TRANSLATION
 hint_pol_diplomatic: "\"Prefíkaný vládca dokáže vyťažiť maximum z každej udalosti\"" # todo: NEW TRANSLATION
 hint_pol_administrative: "\"Prosperujúca politika znamená prosperujúce podniky\"" # todo: NEW TRANSLATION
 hint_pol_military: "\"Naše stavy sú často horšie než naši nepriatelia.\"" # todo: NEW TRANSLATION
 hint_mil: "Pokročilé rady pre expanziu" # todo: NEW TRANSLATION
 hint_mil_hint_text: "$hint_mil_hint_text_1$\n\n$hint_mil_hint_text_2$\n\n$hint_mil_hint_text_3$" # todo: NEW TRANSLATION
 hint_mil_hint_text_1: "Dve všeobecné rady: profesionálne [Concept('armies_with_icon','armády')|e] (vrátane [Concept('mercenaries_with_icon','žoldnieri')|e]) vždy porazia rovnako veľké [Concept('levies_with_icon','brancov')|e], a najlepší spôsob, ako zväčšiť svoj armádu, je rozvíjať ekonomiku." # todo: CHANGED # todo: CONCEPT CASE
 hint_mil_hint_text_2: "#T Odporúčané kroky:#!\n@arrow_bonus_tier_3! Získajte [ShowInstitutionName('professional_armies')] [Concept('institution','inštitúcia')|e] čo najskôr: rýchle získanie [ShowAdvanceName('armory_advance')] vám umožní vyhrať [Concept('wars_with_icon','vojny')|e], ktoré boli predtým nemožné.\n\n@arrow_bonus_tier_3! [Concept('war_score_with_icon','Vojnové skóre')|e] z [Concept('battles_with_icon','bitiek')|e] sa s [Concept('ages_with_icon','vekmi')|e] zmenšuje. Na začiatku to je až #W 50%#!, takže je jednoduché vyhrať [Concept('wars_with_icon','vojny')|e] len s bitkami!\n\n@arrow_bonus_tier_3! Uistite sa, že máte prístup k strategickým [Concept('goods_with_icon','tovarom')|e]. Nemusia byť v veľkom množstve, ale sú nevyhnutné na vybudovanie vášho [Concept('army_with_icon','armády')|e] a [Concept('navy_with_icon','námorníctvo')|e]: @tin! [ShowGoodsName('tin')] @lead! [ShowGoodsName('lead')] @copper! [ShowGoodsName('copper')]\n\n@arrow_bonus_tier_3! Armády sa môžu [Concept('reinforce_with_icon','doplniť')|e] len na území spojenca.\n\n@arrow_bonus_tier_3! [ShowUnitCategoryName('army_heavy_infantry')] je hlavná línia [Concept('battle_with_icon','bitka')|e]. Je lacná a účinná pri absorbovaní [Concept('damage_taken','obdržanom poškodení')|e], zatiaľ čo [ShowUnitCategoryName('army_artillery')] spôsobuje veľké škody prednej línii - je dôležité, aby predná línia prežila [Concept('bombard_phase_with_icon','bombardovacia fáza')|e]\n\n@arrow_bonus_tier_2! Vytvorenie jasnej logistickej linky pre vaše [Concept('armies','armády')] na území [Concept('enemy_with_icon','vojnového nepriateľa')|e] je kľúčové. Ak sa váš zásobovací líniu preruší, celý [Concept('army','armáda')] môže zmiznúť kvôli [Concept('attrition','vyčerpaniu')|e]. Môžete použiť jednotky [ShowUnitCategoryName('army_auxiliary')] na prepravu [Concept('food_with_icon','potraviny')|e] na front, alebo umiestniť [Concept('supply_depots_with_icon','zásobovacie sklady')|e] na pomoc s logistikou.\n\n@arrow_bonus_tier_1! [Concept('manpower_with_icon','Živá sila')|e] [Concept('buildings','Budovy')|e] majú v hre najvyššie [Concept('maintenance_with_icon','údržba')|e] náklady, preto je najlepšie stavať ich v [Concept('locations_with_icon','lokalitách')|e] s vysokým [Concept('control_with_icon','kontrolou')|e].\n\n@arrow_bonus_tier_1! Bitky typicky trvajú len niekoľko dní, takže pred ďalším postupom sa uistite, že sa vždy môžete včas [Concept('reinforce','doplniť')]." # todo: CHANGED # todo: CONCEPT CASE
 hint_mil_hint_text_3: "#T Ďalšie tipy:#!\n[Link('hints', 'selected_hint = hint_manpower', '@hint! Ľudská sila')]\n[Link('hints', 'selected_hint = hint_sailors', '@hint! Námorníci')]\n[Link('hints', 'selected_hint = hint_war', '@hint! Vojna')]\n[Link('hints', 'selected_hint = hint_battle', '@hint! Bitky')]\n[Link('hints', 'selected_hint = hint_siege_and_occupation', '@hint! Obliehania a okupácia')]" # todo: NEW TRANSLATION
 hint_mil_diplomatic: "\"Make other countries win your wars\"" # todo: NEW TRANSLATION
 hint_mil_administrative: "\"Postupné straty môžu viesť k zdecimovaniu akejkoľvek armády\"" # todo: NEW TRANSLATION
 hint_mil_military: "\"Nechoďte do boja s nožom proti strelným zbraniam\"" # todo: NEW TRANSLATION
 hint_holland: "Začiatočné rady pre Holandsko" # todo: NEW TRANSLATION
 hint_holland_hint_text: "Vysoko urbanizované [locations] v Nízkych krajinách robia z [Player.GetLongName] ideálneho kandidáta stať sa obchodnou mocnosťou v severnej Európe.\n\n@hint! #T Stavajte [ShowBuildingTypeName('marketplace')] budovy v každom [ShowLocationRankName('town')]#!\nAutomatický obchod použije ich [Concept('merchant_capacity_with_icon','obchodná kapacita')|e] na [Concept('import_with_icon','dovoz')|e] [Concept('raw_materials_with_icon','suroviny')|e], ktoré [market_icon][Player.GetCapital.GetMarket.GetName] postráda, ako aj na [Concept('export_with_icon','vývoz')|e] prebytok [Concept('produced_goods_with_icon','vyrábané tovary')|e] z našich miest.\n\n@hint! #T Rozšírte textilný priemysel#!\nZ exportu [ShowGoodsName('fine_cloth')] je veľký zisk. Postavte [ShowBuildingTypeName('cloth_guild')] a [ShowBuildingTypeName('fine_cloth_guild')] budovy a zvážte dovoz [ShowGoodsName('wool')] z [ShowLocationName('london')] Market, ak bude treba.\n\n@hint! #T Zvýšte našu [crown_power]#!\n[Concept('trade_income_with_icon','Príjem z obchodu')|e] sa rozdeľuje medzi [ShowEstateTypeName('crown_estate')] a [Concept('estates_with_icon','stavmi')|e] podľa ich relatívnej moci. Udržiavanie našej [Concept('crown_power_with_icon','moci koruny')|e] vysokej zabezpečí stálu prítok [trade_income] do [Concept('treasury_with_icon','pokladnice')|e]. Viac o [crown_power] sa dozviete v [Link('hints', 'selected_hint = hint_crown_power', 'Crown Power Hint')].\n\n@hint! #T Dávajte pozor na zásoby [food]#!\n[Concept('urban_locations_with_icon','Mestské lokality')|e] produkujú menej [Concept('food_with_icon','potraviny')|e] než [Concept('rural_locations_with_icon','vidiecke lokality')|e]. Sledujte [Concept('food_stockpile_with_icon','zásoby potravín')|e] [Player.GetCapital.GetMarket.GetName] a v prípade potreby rozšírte naše [ShowGoodsName('fish')] a [ShowGoodsName('livestock')] [Concept('rgo_with_icon','R.G.O.')|e]. Náš [budget] utrpí, ak sa [food] stane príliš drahým.\n\n@hint! #T Uspokojte našich susedov#!\nMôžeme byť bohatí, ale náš skromný rozmer nás robí zraniteľnými voči cudzej agresii. Použite $IMPROVE_RELATIONTITLE$ [Concept('diplomatic_action_with_icon','diplomatická akcia')|e] s našimi najnebezpečnejšími susedmi, obzvlášť s [GetCountry('FRA').GetName] a [GetCountry('ENG').GetName]." # todo: CHANGED # todo: CONCEPT CASE
 hint_holland_diplomatic: "$hint_advisor_salute_diplomatic$" # todo: NEW TRANSLATION
 hint_holland_administrative: "$hint_advisor_salute_administrative$" # todo: NEW TRANSLATION
 hint_holland_military: "$hint_advisor_salute_military$" # todo: NEW TRANSLATION
 hint_hungary: "Začiatočné rady pre Uhorsko" # todo: NEW TRANSLATION
 hint_hungary_hint_text: " [Player.GetLongName] začína v privilégovanej pozícii ako jedna z hlavných mocností v [Concept('region','regióne')|e]. Máme [Concept('alliance_with_icon','aliancia')|e] s #W Poland#!, #W Bosnia#! je naším [Concept('subject_with_icon','vazalom')|e] a #W Croatia#! je v [Concept('personal_union_with_icon','personálnej únii')|e] pod naším [Concept('ruler_with_icon','panovníkom')|e] [Player.GetGovernment.GetRuler.GetName]. To znamená, že sa môžeme sústrediť na rozvoj nášho [Concept('country_with_icon','krajiny')|e] bez obáv o vonkajšie hrozby... aspoň zatiaľ.\n\n@hint! #T Stavajte [roads] smerom k svojim baníam#!\nNa sever od [capital_icon] [Player.GetCapital.GetName] sa nachádzajú bohaté ložiská [ShowGoodsName('goods_gold')] a [ShowGoodsName('silver')]. Sú však málo rozvinuté a v [locations] s nízkym [Concept('control_with_icon','kontrolou')|e]. Mali by sme vybudovať [Concept('roads_with_icon','cesty')|e] z [Player.GetCapital.GetNameWithNoTooltip] k týmto cenným baníam, aby sme zvýšili našu [Concept('proximity_with_icon','blízkosť')|e], a tým aj náš [control].\n\n@hint!  #T Stavajte [ShowBuildingTypeName('jewelry_guild')] okolo nášho [capital]#!\nVďaka veľkej ponuke je cena [ShowGoodsNameWithNoTooltip('goods_gold')] a [ShowGoodsNameWithNoTooltip('silver')] v [market_icon] [Player.GetCapital.GetMarket.GetName] mimoriadne nízka. [ShowBuildingTypeName('jewelry_guild')] použije [ShowGoodsNameWithNoTooltip('goods_gold')] a [ShowGoodsNameWithNoTooltip('silver')] na výrobu [ShowGoodsName('jewelry')], veľmi ziskového spracovaného tovaru, čím zvýši hodnotu našich baní.\n\n@hint! #T Postavte [ShowBuildingTypeName('marketplace')] aby ste exportovali prebytok#!\nAutomatický [Concept('trade_with_icon','obchod')|e] bude [Concept('export_with_icon','vývoz')|e] akýkoľvek prebytok [Concept('goods_with_icon','tovary')|e], ako napríklad [ShowGoodsNameWithNoTooltip('jewelry')], do iných [Concept('markets_with_icon','trhov')|e], čo vytvorí [Concept('trade_income_with_icon','príjem z obchodu')|e] a udrží celú výrobnú reťaz ziskovú.\n\n@hint! #T Zrušte [ShowPolicyName('gold_export_ban')]#!\nEurópa túži po našom [ShowGoodsNameWithNoTooltip('goods_gold')], a priame exportovanie by bolo veľmi ziskové, ale náš súčasný [ShowLawName('precious_metal_distribution_law')] [Concept('law_with_icon','zákon')|e] to zakazuje. Zvážte zmenu tejto [policy] počas nasledujúceho [Concept('parliament_with_icon','parlamentu')|e].\n\n@hint! #T Inštalujte [ShowBuildingTypeName('local_governor')]#!\nVýchod našej [country] je bohatý, no máme malý [control] nad jeho zdrojmi. V dlhodobom horizonte by sme mali postaviť tam [ShowLocationRankName('city')] a umiestniť [ShowBuildingTypeName('local_governor')]. Bude fungovať ako sekundárny [capital], vyžarujúci [proximity] do blízkych [locations]. Majte na pamäti, že miestni guvernéri sa dajú stavať len v [ShowLocationRankName('city')], sú drahí na udržiavanie a vyžadujú priamu [road] spojenie s naším [capital]." # todo: CHANGED # todo: CONCEPT CASE
 hint_hungary_diplomatic: "$hint_advisor_salute_diplomatic$" # todo: NEW TRANSLATION
 hint_hungary_administrative: "$hint_advisor_salute_administrative$" # todo: NEW TRANSLATION
 hint_hungary_military: "$hint_advisor_salute_military$" # todo: NEW TRANSLATION
 hint_norway: "Začiatočné rady pre Nórsko" # todo: NEW TRANSLATION
 hint_norway_hint_text: " [Player.GetLongName] je rozľahlá [Concept('country_with_icon','krajina')|e], ale náš [Concept('control_with_icon','kontrola')|e] mimo nášho [Concept('capital_with_icon','hlavného mesta')|e] je iba formálny. Mali by sme rozšíriť infraštruktúru, morské aj pozemné, aby sme zvýšili naše [Concept('proximity_with_icon','blízkosť')|e] a využili zdroje severu.\n\n@hint! #T Stavajte [roads] z nášho [capital] #!\nMali by sme sa snažiť položiť [Concept('roads_with_icon','cesty')|e] z [capital_icon] [Player.GetCapital.GetName] do každej blízkej [ShowLocationRankName('town')] a cenného [rgo_with_icon|e], aby sme zvýšili našu [Concept('proximity_with_icon','blízkosť')|e] a [Concept('control_with_icon','kontrola')|e]. Baníky s [ShowGoodsName('silver')] západne od [Player.GetCapital.GetNameWithNoTooltip] by mali byť obzvlášť ziskové pri primeranej investícii. Často kontrolujte [proximity] Map Mode!\n\n@hint! #T Zvýšte [maritime_presence] #!\nVysekanie [roads] cez naše horské vnútro môže byť márne a drahé. S dobrou [Concept('maritime_presence_with_icon','námornou prítomnosťou')|e] pozdĺž pobrežia sa môže [proximity] šíriť oveľa efektívnejšie po mori. Stavte [ShowBuildingTypeName('wharf')] a [ShowBuildingTypeName('dock')] v našich mestách a mať flotily [ShowUnitCategoryName('navy_light_ship')] strážiace naše pobrežie, keď budeme mať potrebný [Concept('advance_with_icon','pokrok')|e].\n\n@hint! #T Zakladajte mestá v dobrých prístavoch blízko nášho [capital]#!\n[Proximity] pobrežných [locations] je výrazne zlepšená [Concept('natural_harbor_suitability_with_icon','vhodnosť prírodného prístavu')|e]. Skontrolujte $mapmode_natural_harbor_suitability_name$ Mapmode, aby ste našli naše najlepšie prírodné prístavy.\n\n@hint! #T Rozšírte naše priemysly#!\nPostavte [ShowBuildingTypeName('fine_cloth_guild')], [ShowBuildingTypeName('furniture_guild')] a [ShowBuildingTypeName('scriptorium')] v našich mestách na spracovanie našich surovín a postavte [ShowBuildingTypeName('marketplace')] na [Concept('export_with_icon','vývoz')|e] do iných [Concept('markets_with_icon','trhov')|e].\n\n@hint! #T Posilnite úniu so Švédskom #!\nNáš [Concept('personal_union_with_icon','personálna únia')|e] so [GetCountry('SWE').GetName] zaručuje pokoj na našich hraniciach. Môžeme sa usilovať o hlbšiu integráciu s ich krajinou prijatím spoločných [laws] v paneli [Concept('international_organization','medzinárodnej organizácie')|e]." # todo: CHANGED # todo: CONCEPT CASE
 hint_norway_diplomatic: "$hint_advisor_salute_diplomatic$" # todo: NEW TRANSLATION
 hint_norway_administrative: "$hint_advisor_salute_administrative$" # todo: NEW TRANSLATION

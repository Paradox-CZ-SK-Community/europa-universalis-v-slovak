 hint_colonial_revolution_hint_text: "$hint_colonial_revolution_hint_text_1$\n\n$hint_colonial_revolution_text_2$\n\n$hint_colonial_revolution_text_3$" # todo: NEW TRANSLATION
 hint_colonial_revolution_hint_text_1: "Počas [ShowSituationNameWithNoTooltip('colonial_revolution')] [Concept('situation','situácie')|e] koloniálni [Concept('subjects_with_icon','vazali')|e] po svete bojujú o nezávislosť proti svojim [Concept('overlords_with_icon','suzerénom')|e]." # todo: CHANGED # todo: CONCEPT CASE
 hint_colonial_revolution_text_2: "#T Ak ste koloniálna krajina :#!\n@arrow_bonus_tier_3! Vytvorte koloniálnu federáciu [Concept('international_organization','medzinárodnú organizáciu')|e]\n@arrow_bonus_tier_2! Použite [situation] akciu #V $seek_alliance_with_overlord_rival$#! a získajte pomoc od iných [Concept('countries_with_icon','krajín')|e]\n@arrow_bonus_tier_1! Ak existuje koloniálna federácia, zvážte jej pripojenie" # todo: CHANGED # todo: CONCEPT CASE
 hint_colonial_revolution_text_3: "#T Ak ste [overlord] :#!\n@arrow_bonus_tier_3! Použite [situation] [action] #V $establish_goods_act$#! na získanie ďalších prostriedkov\n@arrow_bonus_tier_2! Zvážte použitie [situation] [action] #V $give_colony_representation$#!, ak sa kolónia stane neloajálnou" # todo: NEW TRANSLATION
 hint_colonial_revolution_diplomatic: "$hint_advisor_salute_diplomatic$" # todo: NEW TRANSLATION
 hint_colonial_revolution_administrative: "$hint_advisor_salute_administrative$" # todo: NEW TRANSLATION
 hint_colonial_revolution_military: "$hint_advisor_salute_military$" # todo: NEW TRANSLATION

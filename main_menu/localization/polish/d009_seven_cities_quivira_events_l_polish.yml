l_polish:
 seven_cities_quivira.1.title: "Hlinené mestečko v tráve" # todo: NEW TRANSLATION
 seven_cities_quivira.1.desc: "Po dvoch mesiacoch na rovinách dorazil oddiel do krajiny, ktorú opísal El Turco. Stojí tu osada, na pomery trávnatého mora pomerne veľká, no je to mestečko s okrúhlymi domami pokrytými trávou, nie kamenné hlavné mesto. Náčelník je vysoký muž v bizónej kožušine. Jeho ľud pestuje kukuricu a fazuľu v údoliach pri rieke a na rovine loví bizóny. Zlato tu nie je. Keď naňho El Turco zatlačia, prizná, že ho Pueblovia poslali, aby odviedol oddiel čo najďalej od ich krajiny. [target_leader.GetName] prikáže, aby ho obesili." # todo: NEW TRANSLATION
 seven_cities_quivira.1.a: "Zrušme výpravu. Nie je tu nič okrem trávy a lží." # todo: NEW TRANSLATION
 seven_cities_quivira.1.historical_info: "Coronado dorazil do Quiviry, niekde na území dnešného Kansasu, v lete roku 1541. Túto krajinu obývali wichitaanskí roľníci v dedinách s trávnatými domami pozdĺž rieky Arkansas. Zlato tu nebolo. Pawneeov menom El Turco, ktorý viedol oddiel na východ z Nového Mexika s prísľubom bohatého kráľovstva, španielski vojaci na Coronadov rozkaz uškrtili; priznal sa, že mu Pueblovia prikázali zaviesť Španielov na roviny v nádeji, že sa už nikdy nevrátia. Coronado odviedol oddiel v tú zimu domov a Mendozovi oznámil, že v krajine nie je nič, čo by stálo za armádu potrebnú na jej udržanie." # todo: NEW TRANSLATION
 seven_cities_quivira.2.title: "Úrodná krajina, no bez zlata" # todo: NEW TRANSLATION
 seven_cities_quivira.2.desc: "Krajina, do ktorej sme dorazili, je svojím spôsobom bohatá: dobre zavlažované údolia pri riekach plné kukurice, na okrajoch lesov stáda bizónov, ľud je mierumilovný a ochotný obchodovať. Náčelník daruje [target_leader.GetName] šnúru zelených riečnych kameňov, ktoré kronikár najprv pokladá za nefrit. Španielsky zlatník ho vyvedie z omylu: nefrit to nie je. Je to mäkký zelený kameň, ktorý nepozná, krásny, no doma nemá obchodnú hodnotu. Táto krajina nie je tým, čo sme prišli hľadať, ale predsa len niečo znamená. Mapy sa prekreslia." # todo: NEW TRANSLATION
 seven_cities_quivira.2.a: "Odvezme si kamene domov ako kuriozity. Krajina je zmapovaná." # todo: NEW TRANSLATION
 seven_cities_quivira.2.historical_info: "Coronadovi dôstojníci opísali krajinu Veľkých plání ako vhodnú na chov dobytka a pestovanie obilia, no chudobnú na taký obchod, ktorý by ospravedlnil španielsku koloniálnu prítomnosť. Tento úsudok platil vyše dvoch storočí; Španieli Veľké pláne nikdy nekolonizovali a následné výpravy Francúzov a Britov mali podobu obchodných staníc, nie trvalých kolónií, a to až do konca devätnásteho storočia. Zelené kamene, ktoré Wichita darovali Coronadovi, sa nikdy nepodarilo s istotou určiť; najpravdepodobnejšie išlo o mäkký serpentín, ktorý sa po riečnych systémoch dovážal z nálezísk na juhozápade." # todo: NEW TRANSLATION
 seven_cities_quivira.3.title: "Legenda potvrdená" # todo: NEW TRANSLATION
 seven_cities_quivira.3.desc: "El Turco hovoril pravdu. Táto krajina je taká, ako ju opísal: bohaté kráľovstvo kamenných miest obohnaných múrmi, roztrúsených medzi riekami a trávnatými pláňami, ktorému vládne rada náčelníkov vo veľkej budove z trámov a tyrkysu. Zlato sa tu ryžuje v potokoch stekajúcich zo západných hôr. Náčelníci nosia strieborné ozdoby. Keď im predvedú obchodný tovar a dovolia kňazovi prejsť dedinou bez toho, aby ho niekto napadol, sú ochotní prijať vyslanectvo. [target_leader.GetName] žiada o posily ešte predtým, než zapečatia prvé posolstvo." # todo: NEW TRANSLATION
 seven_cities_quivira.3.a: "Vztyčme zástavu. Pošlime posily. Krajina je nájdená." # todo: NEW TRANSLATION
 seven_cities_quivira.3.historical_info: "Quivira bola veľkou nenaplnenou nádejou španielskych výprav na sever od Nového Španielska: bohatým vnútrozemským kráľovstvom, ktoré by, keby skutočne existovalo, zmenilo dejiny Severnej Ameriky tým, že by španielskej korune dalo dôvod obsadiť Veľké pláne. Mýtus bol natoľko odolný, že sa Quivira objavovala na európskych mapách približne na správnom mieste ešte v osemnástom storočí, keď už skutočnú krajinu mapovali francúzski obchodníci s kožušinami pôsobiaci v povodí Mississippi." # todo: NEW TRANSLATION
 seven_cities_quivira.10.title: "Dvaja sprievodcovia" # todo: NEW TRANSLATION
 seven_cities_quivira.10.desc: "Pred výpravou stoja dvaja muži z plání, ktorých na skoršej plavbe previezli cez oceán a odvtedy ich vydržiava prístav. Keď sa staršieho, [target_character.GetName], opýtajú na krajinu zvanú Quivira, opisuje kráľa, ktorý spáva pod stromom ovešaným zlatými zvoncami, kanoe so zobákmi z tepaného zlata a misy z tepaného striebra na každom stole. Mladší, [second_guide.GetName], na tú istú otázku odpovedá, že ich krajinu tvoria tráva, obloha a dobré rieky a že jeho ľud stavia domy z trávy a loví hrbatý dobytok. Nemôžu predsa obaja opisovať svoj domov. Miesto na lodi dostane iba jeden z nich." # todo: NEW TRANSLATION
 seven_cities_quivira.10.a: "Vezmime staršieho. Zlato si človek nevymyslí." # todo: NEW TRANSLATION
 seven_cities_quivira.10.b: "Vezmime mladšieho. Menší sľub sa ľahšie splní." # todo: NEW TRANSLATION
 quivira_gold_guide_tt: "[target_character.GetName] sa pripojí k výprave ako náš sprievodca" # todo: NEW TRANSLATION
 quivira_grass_guide_tt: "[second_guide.GetName] sa pripojí k výprave ako náš sprievodca" # todo: NEW TRANSLATION
 seven_cities_quivira.10.historical_info: "Coronadova výprava odviezla z krajiny Pueblov dvoch zajatcov z plání, aby slúžili ako sprievodcovia: muža, ktorého Španieli nazývali El Turco a ktorý opisoval Quiviru ako kráľovstvo, kde pán spáva pod stromom so zlatými zvoncami a jedáva zo strieborných mís, a Wichita menom Ysopete, ktorý každému, kto ho chcel počúvať, stále opakoval, že v Quivire zlato nie je a El Turco klame. Oddiel sa rozhodol veriť El Turcovi. Bola to tá nákladnejšia z dvoch možností a, ako neskôr poznamenal jeden veterán, urobili tak preto, lebo armáda, ktorá pochodovala tisíc líg, potrebuje veriť tomu lepšiemu príbehu." # todo: NEW TRANSLATION
 seven_cities_quivira.11.title: "Tridsať kopijníkov" # todo: NEW TRANSLATION
 seven_cities_quivira.11.desc: "Pred nami leží kontinent a šanca, že ho prekročíme všetci, je mizivá. Krajina medzi týmto kotviskom a Quivirou nedokáže uživiť taký veľký oddiel; možno uživí nanajvýš tridsať mužov. [target_leader.GetName] rozložil na námornej truhlici súpisy mužstva a meno po mene vyberá, kto pôjde na sever na koni a kto zostane pri lodiach a zásobách. Každý muž v tábore má na zoznam svoj názor a väčšina z nich sa týka toho, na ktorej strane sa ocitne jeho vlastné meno." # todo: NEW TRANSLATION
 seven_cities_quivira.11.a: "Tridsať jazdcov a kompas. Ostatní udržia pobrežie." # todo: NEW TRANSLATION
 seven_cities_quivira.11.b: "Celý sprievod aj stáda. Dorazíme tam ako mocnosť, alebo vôbec." # todo: NEW TRANSLATION
 quivira_train_left_behind_tt: "Naši sprievodcovia a nosiči zostanú so sprievodom" # todo: NEW TRANSLATION
 seven_cities_quivira.11.historical_info: "Pri rieke Rio Grande, po zime plnej nevraživosti s Pueblami a jari, počas ktorej sa míňali zásoby, poslal Coronado väčšinu armády späť a s tridsiatimi vybranými jazdcami vyrazil ku Quivire. Cez jednotvárnu rovinu sa orientovali pomocou kompasu a počítaním denných krokov. Na pláňach bežné postupy zlyhávali: skupiny, ktoré sa vzdialili z dohľadu oddielu, zmizli, orientačné body neexistovali a stáda bizónov v priebehu niekoľkých hodín zahladili všetky stopy. Tých tridsať dorazilo do Quiviry, čo by sa tristo mužom nepodarilo." # todo: NEW TRANSLATION
 seven_cities_quivira.12.title: "More trávy" # todo: NEW TRANSLATION
 seven_cities_quivira.12.desc: "Rovina nemá konca. Už dvanásť dní kráča oddiel trávou, ktorá sa za ním zatvára ako voda, a míňa stáda hrbatého dobytka, ktoré siahajú až po obzor a zatieňujú zem. Štvrtý deň sa lovecká družina vzdialila z dohľadu a odvtedy ju nikto nevidel. Muži označujú cestu späť kopami bizónieho trusu, keďže tu niet kameňov ani stromov. Jedinými geografickými pomôckami sú kompas a počítanie krokov." # todo: NEW TRANSLATION
 seven_cities_quivira.12.desc_false_guide: "Sprievodca stíchol, zatiaľ čo rovina sa rozľahla. Už nehovorí, koľko dní nám zostáva, a už sa nepozrie do očí mužovi, ktorého vedie. Pri ohňoch si muži navzájom opakujú jeho staré príbehy, no v hlase majú nový nádych a [target_leader.GetName] nad ním bez vyzvania zdvojnásobil stráž. Tu sa niet kam zatúlať. To je na ňom jediná upokojujúca vec." # todo: NEW TRANSLATION
 seven_cities_quivira.12.desc_true_guide: "Sprievodca, ktorý sľuboval iba trávu, dodržal slovo, čo si muži začínajú uvedomovať, znamená naozaj veľa. Číta krajinu tak, ako kormidelník číta vodu: vie, ktoré rieky sa stáčajú na sever, kadiaľ prejdú stáda a ktoré hviezdy nás povedú, keď bude orientácia v krajine náročná. Každý večer vyškriabe kronikárovi do popola polohu oddielu a každý deň sa ukáže, že mal pravdu. V jeho krajine zlato nie je, vraví, no sú aj horšie veci, ktoré krajine môžu chýbať." # todo: NEW TRANSLATION
 seven_cities_quivira.12.a: "Riaďme sa jeho pokynmi." # todo: NEW TRANSLATION
 seven_cities_quivira.12.b: "Dôverujme mužovi, ktorý nám neklamal." # todo: NEW TRANSLATION
 seven_cities_quivira.12.c: "Na sever podľa strelky, počítajme každý krok." # todo: NEW TRANSLATION
 seven_cities_quivira.12.historical_info: "Kronikári Coronadovej výpravy písali o pláňach takmer v delíriu: opisovali krajinu takú rovnú a jednotvárnu, že muži, ktorí sa vzdialili od oddielu čo len na dostrel luku, sa stratili; trávu, ktorá sa za koňmi opäť vzpriamila a nezanechala nijakú stopu; a orientáciu, ktorú umožňovali iba kompas, počítané kroky a kopy kostí a trusu navŕšené ako orientačné body. Keď sa El Turco napokon v Quivire priznal, povedal, že ho Pueblovia požiadali, aby zaviedol armádu na rovinu a nechal ju tam zablúdiť. Takmer sa mu to podarilo a väčšinu práce zaňho odviedla samotná krajina." # todo: NEW TRANSLATION
 seven_cities_quivira.13.title: "Hrbatý dobytok" # todo: NEW TRANSLATION
 seven_cities_quivira.13.desc: "Skauti ho najprv hlásia ako hnedú hmlu na obzore, potom ako pahorok, ktorý sa hýbe, a napoludnie už niet pochýb: hrbatý, strapatý dobytok v takom počte, aký si nikto z oddielu nedokáže predstaviť. Stádo sa rozostúpi pred pochodovou kolónou ako rieka pred skalou, za ňou sa opäť spojí a vo všetkých smeroch pokračuje až na kraj sveta. Zásobovač ním pomaly prechádza na koni, nič nepočíta, nič nehovorí a tvári sa ako človek, ktorý vošiel do sýpky veľkej ako celá provincia." # todo: NEW TRANSLATION
 seven_cities_quivira.13.a: "Zastavme oddiel a lovme, kým nebudú stojany plné." # todo: NEW TRANSLATION
 seven_cities_quivira.13.b: "Prejdime cez stáda. Lovíme legendy, nie dobytok." # todo: NEW TRANSLATION
 seven_cities_quivira.13.b.tt: "#italic Oddiel sa celé dni prediera cez stáda bez zastávky a muži jedia solené hovädzie, obklopení čerstvým mäsom#!" # todo: NEW TRANSLATION
 quivira_hides_and_meat_tt: "#Y Batohy sa naplnia kožami a sušeným mäsom a nosiči ich odnesú domov#!" # todo: NEW TRANSLATION
 seven_cities_quivira.13.historical_info: "Kronikári Coronadovej výpravy len ťažko hľadali slová na opis bizónov: písali o hrbatých kravách s bradami ako kozy a stádach, ktorými sa jazdilo celé dni, pričom za sebou zanechávali udupanú holú rovinu. Počas pochodu cez pláne žil oddiel aj jeho spojenci výlučne z týchto stád a veteráni vo svojich spomienkach opisovali dobytok s väčším úžasom než samotnú Quiviru. Niektorí dospeli k záveru, že stáda sú jediným bohatstvom, ktoré krajina ponúka, a že Španielsko už dobytok má." # todo: NEW TRANSLATION

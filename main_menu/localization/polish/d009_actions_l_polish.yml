l_polish:
 proclaim_pase_foral: "Vyhlásiť Pase Foral" # todo: NEW TRANSLATION
 proclaim_pase_foral_desc: "Dovolávame sa baskického práva #italic pase foral#! — starobylej výsady, ktorá baskickým panstvám umožňuje preskúmavať a pozastavovať kráľovské dekréty, ktoré sú v rozpore s ich fueros. Vyhlásenie napĺňa očakávania šľachty a posilňuje stabilitu, no dočasne obmedzuje dosah koruny." # todo: NEW TRANSLATION
 summon_santa_hermandad: "Zvolať Santa Hermandad" # todo: NEW TRANSLATION
 summon_santa_hermandad_desc: "Aktivujeme Santa Hermandad — kráľovskou korunou podporované bratstvo vidieckych strážnikov a milicionárov, ktoré Kastília nasadzovala na potláčanie zbojníctva a presadzovanie kráľovského poriadku v celej ríši. Ich mobilizácia zvyšuje #Y zásoby živej sily#! a posilňuje #Y morálku#! našich armád." # todo: NEW TRANSLATION
 proclaim_pase_foral_action: "$proclaim_pase_foral$" # todo: NEW TRANSLATION

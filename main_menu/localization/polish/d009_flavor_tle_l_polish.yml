l_polish:
 flavor_tle.8.title: "Fatva [ShowDecisionNameWithNoTooltip('oran_fatwa_decision')]" # todo: NEW TRANSLATION
 flavor_tle.8.desc: "[ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] krajiny [ROOT.GetCountry.GetAltAdjective('G')] nedávno vydali novú fatvu, ktorá našim spoluveriacim povoľuje praktizovať #italic taqíju#!, keď čelia prenasledovaniu. Fatva [ShowDecisionName('oran_fatwa_decision')], pomenovaná podľa miesta, kde bola vyhlásená, dorazila do [ShowRegionName('iberia_region')] a široko sa šíri medzi utláčanými [ShowReligionAdjective('sunni')] súvercami.\n\nToto povolenie praktizovať taqíju umožňuje tajne vyznávať [ShowReligionGroupName('muslim')] a predstierať pritom príslušnosť k inej viere. V #italic umme#! je takáto prax zvyčajne zakázaná, no táto fatva ju povoľuje v [ShowRegionNameWithNoTooltip('iberia_region')]." # todo: NEW TRANSLATION # todo: COUNTRY CASE
 flavor_tle.8.a: "[ROOT.GetCountry.Custom('common_string_positive')]" # todo: NEW TRANSLATION
 flavor_tle.8.a.entry: "$common_string_great$" # todo: NEW TRANSLATION
 oran_fatwa_decision.title: "Fatva z [ShowLocationNameWithNoTooltip('oran')]" # todo: NEW TRANSLATION
 oran_fatwa_decision.desc: "$flavor_tle.8.desc$" # todo: NEW TRANSLATION
 oran_fatwa_decision.desc.entry: "Naši [ShowReligionAdjective('sunni')] súverci v [ShowRegionName('iberia_region')] sú utláčaní. Nemôžeme ich nechať zotrvať v stave #italic taqíje#! a stratiť vieru. Musíme vydať fatvu, ktorá im pomôže v ich zápase." # todo: NEW TRANSLATION
 oran_fatwa_decision.a: "$flavor_tle.8.a$" # todo: NEW TRANSLATION
 has_most_prestige_out_of_all_maghrebi_sunni_countries: "Má viac [Concept('prestige','prestíž')|e] než všetky [ShowReligionAdjective('sunni')] krajiny s [Concept('capital','hlavným mestom')|e] v [ShowRegionName('maghreb_region')]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 tle_enable_free_the_mudejar_cb_tt: "[ShowReligionAdjective('sunni')] [Concept('countries','Krajiny')|e] s [Concept('capital','hlavným mestom')|e] v [ShowRegionName('maghreb_region')] budú môcť vykonštruovať [Concept('casus_belli','casus Belli')|e] [ShowCasusBelliName('cb_free_the_mudejar')] proti [ShowReligionGroupAdjective('christian')] cieľom, ktoré majú [Concept('provinces','provincie')|e] s [ShowReligionAdjective('sunni')] [Concept('pops','populáciami')|e] v [ShowRegionName('iberia_region')]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 tle_enable_events_for_liberating_mudejar_tt: "[ShowReligionAdjective('sunni')] [Concept('countries','Krajiny')|e], ktoré [Concept('occupy','okupovať')|e] [Concept('locations','lokalít')|e] s [ShowReligionAdjective('sunni')] [Concept('pops','populáciami')|e] počas [Concept('war','vojny')|e] s [ShowCasusBelliName('cb_free_the_mudejar')], dostanú [Concept('events','udalosti')|e] o oslobodzovaní miestneho obyvateľstva" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 flavor_tle.9.title: "Oslobodenie [target.GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 flavor_tle.9.desc: "Utrpenie našich [ROOT.GetCountry.GetReligion.GetAdjective] súvercov v [target.GetName] sa možno konečne skončí. Už celé desaťročia tieto úbohé duše trpia zlým zaobchádzaním pod tyranskou vládou krajiny [target.GetOwner.GetLongName]. Teraz, keď ich oslobodili naše vojská, môžu konečne v pokoji vyznávať [ShowReligionGroupName('muslim')]. Už nebudú musieť svoju vieru skrývať." # todo: NEW TRANSLATION
 flavor_tle.9.a: "Radujte sa, bratia!" # todo: NEW TRANSLATION
 tle_fires_for_all_locations: "Tento [Concept('effect','efekt')|e] sa uplatní na každú oslobodenú [Concept('location','lokalitu')|e], ale toto upozornenie [Concept('event','udalosť')|e] sa zobrazí iba pre [Concept('province_capitals','hlavné mestá provincií')|e]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 flavor_tle.10.title: "Arábizácia krajiny [ROOT.GetCountry.GetAltAdjectiveWithNoTooltip('G')]" # todo: NEW TRANSLATION # todo: COUNTRY CASE
 flavor_tle.10.entry: "Arábizácia $TLE$" # todo: NEW TRANSLATION
 flavor_tle.10.desc: "[ShowAreaName('algiers_area')] je len jednou z oblastí [ShowRegionName('maghreb_region')], ktoré pod silným vplyvom [ShowEstateTypeName('tribes_estate')] skupiny [ShowCultureGroupName('arabic_group')] intenzívne podliehajú arábizácii. S postupom tohto procesu sa [ShowLanguageName('tamazight_language')] prestáva používať a mestské elity si osvojujú miestne nárečie jazyka [ShowLanguageName('arabic_language')]. S rastúcou imigráciou z [ShowRegionName('iberia_region')] si tieto zvyky napokon v plnej miere osvojujú aj naši [ShowEstateTypeName('nobles_estate')]. Náš štát čoskoro možno prijme [ShowCultureName('algerian')] identitu." # todo: NEW TRANSLATION
 flavor_tle.10.a: "Musíme posilniť svoje korene." # todo: NEW TRANSLATION
 flavor_tle.10.b: "To je naša budúcnosť!" # todo: NEW TRANSLATION
 flavor_tle.12.title: "Zbavujeme sa svojich kmeňových koreňov" # todo: NEW TRANSLATION
 flavor_tle.12.entry: "$flavor_tle.12.title$" # todo: NEW TRANSLATION
 flavor_tle.12.desc: "Základy štátu [target_country.GetAdjective] spočívajú v [target_government_reform.GetName], najľudnatejšom kmeni v okolí [target_location.GetName]. Práve z tohto kmeňa pochádza dynastia [target_dynasty.GetName], ktorá následne dala vzniknúť [target_country.GetFlavorRank], akým sme dnes. V poslednom čase však [target_estate.GetName] postupne slabne, čo ohrozuje rovnováhu síl na [ROOT.GetCountry.GetGovernment.GetCourtTitle]. Ak nepodnikneme kroky na posilnenie $banu_al_wad$, ich politické privilégiá sa rozplynú na stránkach dejín." # todo: NEW TRANSLATION
 flavor_tle.12.a: "Legitimitu musíme hľadať aj mimo kmeňov." # todo: NEW TRANSLATION
 flavor_tle.12.b: "Prvenstvo $banu_al_wad$ musíme zachovať!" # todo: NEW TRANSLATION
 tle_empower_banu_al_wad_reform: "[ShowGovernmentReformName('tle_support_of_banu_al_wad')] navyše poskytne nezmenený [Concept('modifier','modifikátor')|e] [ShowModifierTypeName('stability_investment')] v hodnote [ShowNamedValue('small_stability_investment')|+=]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 tle_empower_banu_al_wad_reform_unlock_tt: "Odomkne sa po udalosti #Y $flavor_tle.12.title$#! [Concept('event','udalosť')|e]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 has_more_prestige_than_root_tt: "Má viac [Concept('prestige','prestíž')|e] než [ROOT.GetCountry.GetName]" # todo: NEW TRANSLATION # todo: CONCEPT CASE

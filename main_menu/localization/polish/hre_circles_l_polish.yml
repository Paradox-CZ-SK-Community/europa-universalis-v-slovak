 IMPERIAL_CIRCLES_EVENTS_FLAVOR: "Cisárske kruhy" # todo: NEW TRANSLATION
 imperial_circles.1.title: "Cisárske kruhy boli zriadené" # todo: NEW TRANSLATION
 imperial_circles.1.desc: "Obdobie zriaďovania sa skončilo. Cisárske kruhy boli pevne ustanovené a ich vodcovia budú spravovať záležitosti Ríše. Začína sa nová kapitola pre Svätú Rímsku ríšu." # todo: NEW TRANSLATION
 imperial_circles.1.a: "Pre slávu Ríše!" # todo: NEW TRANSLATION
 imperial_circles.2.title: "Chýbajúce prostriedky" # todo: NEW TRANSLATION
 imperial_circles.2.desc: "Na nedávnom Ríšskom sneme náš kruh podporil navrhovanú reformu ríšskej ústavy. Táto podpora bola sprevádzaná vzájomným očakávaním medzi členmi nášho kruhu, že my ako vodca kruhu rozdelíme medzi nich prostriedky. Oprávnené alebo nie, naše neuskutočnenie týchto očakávaní viedlo k niekoľkým sťažnostiam na zneužívanie moci a zadržiavanie prostriedkov určených členom kruhu. Ak na tieto sťažnosti nezareagujeme, môže to vážne poškodiť naše vedenie v budúcnosti." # todo: NEW TRANSLATION
 imperial_circles.2.a: "Majú pravdu, mali by sme to teraz rozdeliť." # todo: NEW TRANSLATION
 imperial_circles.2.b: "Mýlia sa, žiadne takéto podplácanie neexistovalo." # todo: NEW TRANSLATION
 imperial_circles.2.c: "Osloviť našich priateľov v [GetUniqueInternationalOrganization('hre').GetLeaderCountry.GetNameWithNoTooltip]." # todo: NEW TRANSLATION
 imperial_circles.11.title: "Nespokojnosť v kruhu" # todo: NEW TRANSLATION
 imperial_circles.11.desc: "Členovia nášho kruhu sú čoraz nepokojnejší. Ak nezareagujeme čoskoro, naša autorita ako vodcu kruhu môže byť otvorene spochybnená." # todo: NEW TRANSLATION
 imperial_circles.11.a: "Rozdeliť núdzové prostriedky na zmiernenie napätia." # todo: NEW TRANSLATION
 imperial_circles.11.b: "Nech sa sťažujú — máme dôležitejšie starosti." # todo: NEW TRANSLATION
 imperial_circles.12.title: "Kniežatá žiadajú zmeny" # todo: NEW TRANSLATION
 imperial_circles.12.desc: "Frustrácia v kruhu dosiahla bod zlomu. Naši členovia otvorene spochybňujú naše vedenie. Voľba môže byť neodvratná." # todo: NEW TRANSLATION
 imperial_circles.12.a: "Musíme konať skôr, než bude neskoro." # todo: NEW TRANSLATION
 imperial_circles.20.title: "Náš hlas bol kúpený" # todo: NEW TRANSLATION
 imperial_circles.20.desc: "[SCOPE.sCountry('actor').GetName] zaplatil vedúcemu nášho cisárskeho kruhu, [SCOPE.sCountry('target').GetName], aby podporil návrh predložený Ríšskemu snemu. Dostali sme [SCOPE.GetValue('received_bribe')|0V]@gold! ako našu časť a náš [Concept('vote','hlas')|e] v aktuálnom rozhodnutí je teraz zablokovaný podľa voľby cisára až do jeho uzavretia." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 imperial_circles.20.a: "Zlato nebude odmietnuté." # todo: NEW TRANSLATION
 imperial_circles.50.title: "Súboj o vedenie kruhu" # todo: NEW TRANSLATION
 imperial_circles.50.desc: "Postavili sme sa, aby sme vyzvali [recipient.GetName] o vedenie nášho cisárskeho kruhu.\n\nIch slabosť a nedbanlivosť už nemožno tolerovať, a mnoho by nás určite podporilo v našich sťažnostiach. Ak sa nám podarí ukázať sa ako jasne lepší a silnejší vodca, podriadia sa našim požiadavkám, ale ak zlyháme, určite to poškodí naše vnímanie nielen medzi zahraničnými krajinami, ale aj medzi naším ľudom." # todo: NEW TRANSLATION
 imperial_circles.50.a: "Pokračovať vo výzve." # todo: NEW TRANSLATION
 imperial_circles.50.b: "Stiahnuť výzvu." # todo: NEW TRANSLATION
 imperial_circles.53.title: "Výzva zlyhala" # todo: NEW TRANSLATION
 imperial_circles.53.desc: "Naša výzva voči [recipient.GetName] o vedenie nášho cisárskeho kruhu zlyhala. Naša prestíž sa nevyrovnala ich a naša povesť utrpela kvôli tomuto pokusu. Musíme počkať, než opäť zaútočíme." # todo: NEW TRANSLATION
 imperial_circles.53.a: "Počkáme si." # todo: NEW TRANSLATION
 imperial_circles.51.title: "Zvrhnutý z postu vodcu kruhu" # todo: NEW TRANSLATION
 imperial_circles.51.desc: "Rival nás úspešne vyzval. Bola nám odobratá funkcia vodcu kruhu a musíme obnoviť naše postavenie v kruhu." # todo: NEW TRANSLATION
 imperial_circles.51.a: "Toto poníženie nebude zabudnuté." # todo: NEW TRANSLATION
 imperial_circles.52.title: "Vedenie kruhu zachované" # todo: NEW TRANSLATION
 imperial_circles.52.desc: "Niekto sa nás snažil zosadiť, ale jeho prestíž bola nedostatočná. Naša pozícia vodcu kruhu zostáva bezpečná." # todo: NEW TRANSLATION
 imperial_circles.52.a: "Naša autorita sa tak ľahko neotrasie." # todo: NEW TRANSLATION
 imperial_circles.70.title: "Zvolený za vodcu kruhu" # todo: NEW TRANSLATION
 imperial_circles.70.desc: "Keďže predchádzajúci vodca už nie je medzi nami, kruh sa obrátil na nás, aby sme prevzali vedenie. Teraz sme vodcom kruhu." # todo: NEW TRANSLATION
 imperial_circles.70.a: "Povedieme kruh s cťou." # todo: NEW TRANSLATION
 imperial_circles.71.title: "Kruh postráda vodcu" # todo: NEW TRANSLATION
 imperial_circles.71.desc: "Jeden z cisárskych kruhov zostal bez kvalifikovaného kandidáta na prevzatie vedenia. Autorita cisára je oslabená, keď kruhy zostávajú bez správy." # todo: NEW TRANSLATION
 imperial_circles.71.a: "Musíme niekoho vymenovať sami." # todo: NEW TRANSLATION
 imperial_circles.80.title: "Cisárska koruna mení všetko" # todo: NEW TRANSLATION
 imperial_circles.80.desc: "Teraz nosíme cisársku korunu. Ako cisár nemôžeme zároveň zastávať úlohu vodcu kruhu — obe funkcie vyžadujú nerozdelenú lojalitu. Vzdávame sa vodcovstva kruhu, aby mohol iný vystúpiť." # todo: NEW TRANSLATION
 imperial_circles.80.a: "Ríša musí byť na prvom mieste." # todo: NEW TRANSLATION

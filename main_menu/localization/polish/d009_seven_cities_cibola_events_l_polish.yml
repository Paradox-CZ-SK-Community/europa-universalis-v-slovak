l_polish:
 seven_cities_cibola.1.title: "Pueblo je len dedina" # todo: NEW TRANSLATION
 seven_cities_cibola.1.desc: "Po mesiacoch v teréne dorazila kolóna na miesto, ktoré mnísi a sprievodcovia nazývali Cibola. Ako opisovali, nachádza sa tu sedem osád. Sú to pueblá z nepálenej tehly a kameňa, dobre postavené a starobylé, no sú to dediny roľníkov a tkáčov, nie pozlátené mestá. Steny nie sú obložené zlatom, dvere nie sú posiate tyrkysom a sýpky sú plné kukurice, sušenej fazule a takmer ničoho iného. [target_leader.GetName] píše správu domov so zatvorenými dverami kapitánovho stanu. Vonku muži mlčky sedia na svojich batohoch." # todo: NEW TRANSLATION
 seven_cities_cibola.1.a: "No, aspoň to bol nezabudnuteľný výlet..." # todo: NEW TRANSLATION
 seven_cities_cibola.1.historical_info: "V júli 1540 dorazila Coronadova kolóna do Hawikuhu, prvého z puebl Ciboly, kde ju privítala komunita zuniovských roľníkov v opevnenom meste z nepálenej tehly. Nasledujúci boj bol krátky: Coronada zranili, pueblo obsadili a zlato sa nenašlo. Fraya Marcosa de Nizu, ktorý sa rok predtým vrátil do Mexico City so správami o meste, ktoré vraj videl z diaľky, a o uliciach dláždených drahokamami, poslali domov v hanbe. Španielske výpravy na juhozápad nepriniesli zlato, encomiendu ani trvalú prítomnosť počas nasledujúcich päťdesiatich rokov." # todo: NEW TRANSLATION
 seven_cities_cibola.2.title: "O tyrkyse a nepálenej tehle" # todo: NEW TRANSLATION
 seven_cities_cibola.2.desc: "Pueblo, ku ktorému sme dorazili, je miestom, o ktorom mnísi rozprávali, hoci nie je také, ako ho opisovali. Steny nie sú zlaté, ale vysoké a nabielo omietnuté, s tyrkysovými mozaikami okolo vchodov do kivas. Sýpky sú plné kukurice, fazule, sušených paprík, tkanej bavlny a slušného množstva opracovaného tyrkysu a mušľových korálikov. Náčelníci sú ochotní rokovať a niektorí z nich dokonca poznajú krajiny ďalej na severe a vedia opísať, čo leží pozdĺž horného toku rieky. Legendu tu nenájdeme, no miesto áno. [target_leader.GetName] dojednáva podmienky so staršími." # todo: NEW TRANSLATION
 seven_cities_cibola.2.a: "Nie je to skvelé, ale ani hrozné." # todo: NEW TRANSLATION
 seven_cities_cibola.2.historical_info: "Pueblovské kultúry na území dnešného Nového Mexika a Arizony mali rozsiahle obchodné kontakty. Tyrkys z pohoria Cerrillos putoval na juh do Mezoameriky a na sever na Prérie, perie papagájov ara prichádzalo z Yucatánu a obsidián si vymieňali pueblovskí a prérijní obchodníci. Hawikuh, Acoma a sídla pri Rio Grande boli na pomery regiónu prosperujúce, hoci nie podľa španielskych pomerov po páde Tenochtitlanu. Rozpor medzi španielskymi ambíciami a realitou pueblovských národov viedol k tomu, čo Španieli považovali za neúspech a čo pre obyvateľov puebl to bola takmer katastrofa. Napriek tomu sa väčšinu zúčastnených kultúr podarilo zachovať." # todo: NEW TRANSLATION
 seven_cities_cibola.3.title: "Legenda o siedmich mestách" # todo: NEW TRANSLATION
 seven_cities_cibola.3.desc: "Táto krajina je všetkým, čo mnísi opisovali, a ešte čímsi navyše. Nachádza sa tu sedem veľkých puebl, každé s vlastným nárečím a náčelníkom, a za nimi sieť obchodných ciest, ktorá vedie až k zálivu a veľkej rieke na východe. Dvere sú posiate tyrkysom, náčelníci nosia plášte z peria a chodia v sprievode a v sýpkach sa nachádzajú zlaté výrobky, aké sa už celé generácie nevideli. Zmluvu podpíšu ešte pred prvým snehom a [target_leader.GetName] pošle dvoch jazdcov späť na pobrežie so vzorkami a žiadosťou o posily." # todo: NEW TRANSLATION
 seven_cities_cibola.3.a: "Urobme z toho naše severné sídlo. Našli sme druhé Mexiko." # todo: NEW TRANSLATION
 seven_cities_cibola.3.historical_info: "Španieli dúfali, hoci sa to nikdy nenaplnilo, že niekde v púšťach severne od mexickej náhornej plošiny leží druhá Mezoamerika: oblasť s hustým osídlením, ťažiteľným zlatom a centralizovanou politickou mocou, ktorú by mohli ovládnuť tak, ako Cortés ovládol Mexikov. V skutočnosti tam bola sústava poľnohospodárskych miest s bohatou hmotnou kultúrou, no s malým množstvom zlata a bez ústrednej autority, s ktorou by sa dalo rokovať. Táto predstava pretrvávala dlhšie, než mala, pretože španielske inštitúcie odmeňovali správy o zlatých mestách omnoho štedrejšie než správy o ich neexistencii." # todo: NEW TRANSLATION
 seven_cities_cibola.10.title: "Mníšova prísažná správa" # todo: NEW TRANSLATION
 seven_cities_cibola.10.desc: "Na nábreží stojí mních, ktorý sa vrátil zo vzdialených pobreží, a drží správu potvrdenú prísahou pred Bohom a notárom. Mesto videl, hovorí [target_character.GetName]: z kopca za súmraku, z diaľky, ktorú odmieta spresniť; mesto väčšie a nádhernejšie než ktorékoľvek v Západnej Indii, s tyrkysom zdobenými vchodmi. Nevstúpil doň, vraj by to bolo pre osamelého muža nerozumné. Muži sú z tej správy nadšení. Dôstojníci však v súkromí premýšľajú, o čo všetko sa opiera: o jeden vrchol kopca a jeden západ slnka." # todo: NEW TRANSLATION
 seven_cities_cibola.10.a: "Dajme mníchovi miesto na lodi. Jeho mesto bude potrebovať svedka." # todo: NEW TRANSLATION
 seven_cities_cibola.10.b: "Postačí niekoľko vojakov a sprievodcov." # todo: NEW TRANSLATION
 cibola_friar_sails_tt: "[target_character.GetName] vypláva s výpravou" # todo: NEW TRANSLATION
 seven_cities_cibola.10.historical_info: "Fray Marcos de Niza sa v roku 1539 vydal na sever z Culiacánu s pokynom pozorovať a podávať správy. Vrátil sa s prísažným tvrdením, že z diaľky videl mesto Cibola, väčšie než Mexico-Tenochtitlan. Obozretne sa k nemu nepriblížil. Táto správa vyvolala v Novom Španielsku obrovský rozruch a miestokráľ na jej základe zhromaždil dosiaľ najväčšiu pozemnú výpravu v Amerike. Keď o rok neskôr Coronadovi vojaci konečne stáli pred hradbami z nepálenej tehly v Hawikuhu, generál napísal, že mních nepovedal pravdu ani o jedinej veci, ktorú uviedol. Dodnes sa vedú spory o tom, či Marcos jednoducho klamal, pomýlil si odlesk zapadajúceho slnka na omietnutej nepálenej tehle, alebo len oznámil to, čo od neho znepokojená kolónia chcela počuť." # todo: NEW TRANSLATION
 seven_cities_cibola.11.title: "Kríže na ceste" # todo: NEW TRANSLATION
 seven_cities_cibola.11.desc: "Náš prieskumník opäť predbehol kolónu. Je to muž, ktorý týmito krajinami už raz prešiel, stroskotaný a bosý, a dediny si ho pamätajú: kráča vpredu s dvoma sprievodcami a tekvicovou hrkálkou a vždy, keď cesta vedie správnym smerom, pošle späť drevený kríž. Prvý kríž bol veľký ako dlaň. Ten, ktorý dnes ráno priniesli do tábora, je vysoký ako muž. Dôstojníci sa dohadujú, či kríže merajú krajinu pred nami, alebo muža, ktorého do nej vyslali." # todo: NEW TRANSLATION
 seven_cities_cibola.11.a: "Nech sa túla. Kríže hovoria dosť jasne." # todo: NEW TRANSLATION
 seven_cities_cibola.11.b: "Odvolajte ho. Kolóna sa presúva ako jeden celok, alebo vôbec." # todo: NEW TRANSLATION
 seven_cities_cibola.11.historical_info: "Estevanico, marocký otrok, ktorý prežil nešťastnú výpravu Narváeza a osem rokov putoval naprieč kontinentom s Cabeza de Vacom, sa v roku 1539 vydal pred Fraya Marcosa ako prieskumník výpravy. Dohodli sa, že pošle kríž zodpovedajúci tomu, čo zistil: malý kríž pre dobrú krajinu a väčší pre bohatú. Kríže rástli, až ich bežci sotva uniesli, a mních sa ponáhľal za mužom, ktorý už bol niekoľko krajín pred ním a užíval si každý krok. Dodnes sa vedú spory o tom, čo vlastne kríže merali." # todo: NEW TRANSLATION
 seven_cities_cibola.12.title: "Pustatina" # todo: NEW TRANSLATION
 seven_cities_cibola.12.desc: "Medzi poslednými priateľskými dedinami a mestom z legendy leží krajina, ktorú sprievodcovia nazývajú despoblado: pustatina plná tŕnia a vyschnutých riečnych korýt, ktorú možno prejsť prinajlepšom za pätnásť dní a kde kolóna nenájde nič na jedenie. Každú nálož kukurice, ktorú prinesieme, musí niesť chrbát alebo kopyto, ktoré tiež potrebuje potravu. Zásobovač náklady trikrát prepočítal a nepovedal ani slovo. Mesto je už blízko. Hlad tiež." # todo: NEW TRANSLATION
 seven_cities_cibola.12.desc_friar: "Mních začal pri večerných ohňoch kázať a jeho posolstvo sa nemení: mesto leží hneď za pustatinou, videl ho na vlastné oči a Boh neukazuje človeku niečo len preto, aby ho nechal zomrieť od hladu tesne pred cieľom. Zásobovač, ktorý dvakrát prepočítal zásoby na prechod cez despoblado, poznamenáva, že nebo túto kolónu ešte nikdy nenasýtilo inak než zásobami z jej vlastných vakov. [target_leader.GetName] si teraz musí vybrať medzi kázňou a počtami." # todo: NEW TRANSLATION
 seven_cities_cibola.12.a: "Predvoj vyrazí napred a nalehko." # todo: NEW TRANSLATION
 seven_cities_cibola.12.b: "Celá kolóna aj so zásobovacími stádami. Pomaly znamená živí." # todo: NEW TRANSLATION
 seven_cities_cibola.12.historical_info: "Coronado prekonal despoblado, neobývanú krajinu medzi údolím Sonory a sídlami Zuniov, rozdelením výpravy: predvoj jazdcov sa vydal napred s ním, zatiaľ čo hlavný oddiel postupoval po etapách so stádami. Predvoj, ktorý dorazil do Hawikuhu v júli 1540, bol taký vyhladovaný, že boj o pueblo sa podľa priznania jedného kronikára zviedol predovšetkým kvôli kukurici, ktorá sa v ňom nachádzala. Despoblado ovplyvnilo náladu výpravy viac než ktorákoľvek legenda; muži, ktorí napokon uvideli Cibolu, už týždeň jedli krmivo pre svoje kone a na ich ďalších činoch to bolo vidieť." # todo: NEW TRANSLATION
 seven_cities_cibola.13.title: "Kríž vysoký ako muž" # todo: NEW TRANSLATION
 seven_cities_cibola.13.desc: "Bežci už kríže nenosia; vlečú ich. Najnovší je vysoký ako muž, vyrezaný zo zeleného dreva a ťažký. Sprievodcovia, ktorí ho dotiahli do tábora, hovoria, že prieskumník k drevu prestal posielať správy, akoby k nemu už nemal čo dodať. Je už blízko. Kráča deň pred svojím sprievodom, trasie tekvicovou hrkálkou a mestá sa vyprázdňujú, aby ho mohli sledovať. Jeho poslednou žiadosťou, doručenou spolu s krížom, je povolenie vstúpiť do samotného mesta a pozdraviť jeho pánov ešte pred príchodom kolóny." # todo: NEW TRANSLATION
 seven_cities_cibola.13.a: "Nech pozdraví mesto. Zaslúžil si, aby ho uvidel ako prvý." # todo: NEW TRANSLATION
 seven_cities_cibola.13.a.tt: "#italic Prieskumník dostane povolenie a niekde ďaleko pred nami kráča ďalej k bránam#!" # todo: NEW TRANSLATION
 seven_cities_cibola.13.b: "Okamžite ho odvolajte a nech sa vráti aj s poznámkami." # todo: NEW TRANSLATION
 seven_cities_cibola.13.historical_info: "Estevanico putoval severnými údoliami ako niečo medzi prieskumníkom a svätou postavou: kráčal pred mníchmi v sprievode obdivovateľov, nosil obradnú tekvicovú hrkálku ozdobenú zvončekmi a perím a v každom meste ho zasypávali darmi z tyrkysu. Táto predstava vznikla počas rokov, ktoré strávil medzi národmi vnútrozemia, a fungovala — až kým neprestala. Podľa jedného z rozprávaní pueblovskí obyvatelia spoznali tekvicovú hrkálku, ktorú poslal napred, aby ohlásila jeho príchod do Ciboly, ako predmet patriaci nepriateľskému národu, a jeho posolstvo odmietli ešte predtým, než sa dostal k hradbám." # todo: NEW TRANSLATION
 seven_cities_cibola.14.title: "Zabitý pri bránach" # todo: NEW TRANSLATION
 seven_cities_cibola.14.desc: "Muži z jeho sprievodu sa vracajú vychudnutí a mlčanliví, po dvoch či troch, v priebehu celého týždňa. Ich výpovede sa v podrobnostiach líšia, no v podstate sa zhodujú. Prieskumník dorazil do mesta. Stojí, ako hovoria, nad rovinou, z kameňa na kameni, presne tam, kam ukazovali kríže. Jeho páni ho odmietli pri bránach, nechali ho noc vonku za hradbami a ráno ho zabili, keď sa odmietol vrátiť. Kolóna má potvrdenie a jeho cenu sme celú cestu mali pred sebou — muža, ktorý triasol tekvicovou hrkálkou." # todo: NEW TRANSLATION
 seven_cities_cibola.14.a: "Našiel ho. Zhromaždite vojsko v jeho mene a vyrazte." # todo: NEW TRANSLATION
 seven_cities_cibola.14.historical_info: "Estevanica zabili v Hawikuhu v máji 1539. Bol prvým mužom zo Starého sveta, ktorý dorazil k Siedmim mestám, a prvým, ktorý za ne zomrel. Tí, čo prežili z jeho sprievodu, utiekli na juh a stretli Fraya Marcosa, ktorý postupoval po tej istej ceste. Mních podľa vlastných slov pokračoval len natoľko, aby si mesto prezrel z diaľky, a potom sa vrátil do Mexika so správou. Jeho smrť sa považovala skôr za dôkaz než za varovanie, pretože mesto, ktoré zabíja vyslancov, zjavne má čo strážiť. Vojská, ktoré vyrazili nasledujúcu jar, boli v tomto zmysle Estevanicovým pomníkom." # todo: NEW TRANSLATION

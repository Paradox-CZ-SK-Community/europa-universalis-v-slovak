l_polish:
 gold_caravan_expedition: "Zlatá karavána" # todo: NEW TRANSLATION
 gold_caravan_expedition_desc: "Pošlite karavánu na juh cez Saharu na zlaté trhy v #italic Bilād as-Sūdān#! a vymeňte soľ a látky za bohatstvo Sahelu. Cesta je dlhá a púšť nebezpečná, no karavána, ktorá sa vráti domov, prinesie zlato Sahelu na trh vo vašom hlavnom meste." # todo: NEW TRANSLATION
 gold_caravan_expedition_haul_tt: "#G [ROOT.GetVariable('gold_caravan_last_haul').GetValue|V0]#! [ShowGoodsName('goods_gold')] pridané do zásob nášho trhu v [ROOT.GetCountry.GetCapital.GetAltAdjective('L')]" # todo: NEW TRANSLATION # todo: COUNTRY CASE
 gold_caravan_outcome_windfall: "Úspech karavány priláka obchodníkov" # todo: NEW TRANSLATION
 gold_caravan_outcome_nickname: "Vodca karavány si získa zlatú povesť" # todo: NEW TRANSLATION
 gold_caravan_outcome_midas: "Vládcu obohatia poklady z karavány" # todo: NEW TRANSLATION
 gold_caravan_outcome_leader_skills: "Vodca karavány získa ťažko nadobudnuté skúsenosti" # todo: NEW TRANSLATION
 cibola_expedition: "Pátranie po siedmich mestách Ciboly" # todo: NEW TRANSLATION
 cibola_expedition_desc: "Vyzbrojte výpravu a vydajte sa na sever od sonorského pobrežia do krajiny, ktorú mnísi a utečení otroci opisujú ako územie siedmich zlatých pueblos. Cesta je náročná a domorodci vravia, že tam nie sú vítaní, no tí istí mnísi tvrdia, že na jej konci čaká niečo väčšie než čokoľvek, čo kedy uzreli." # todo: NEW TRANSLATION
 quivira_expedition: "Pátranie po kráľovstve Quivira" # todo: NEW TRANSLATION
 quivira_expedition_desc: "Vydajte sa za krajinu pueblos do otvorených trávnatých plání, ktoré sa tiahnu bez konca na východ, a riaďte sa slovami zajatého sprievodcu, podľa ktorého leží v rovinách bohaté kráľovstvo, vzdialené mesiac pochodu. Trávnaté more je pusté a rieky tečú lenivo, no ak je tá odmena skutočná, vyrovnala by sa dobytiu Peru." # todo: NEW TRANSLATION
 sierra_de_la_plata_expedition: "Pátranie po Sierra de la Plata" # todo: NEW TRANSLATION
 sierra_de_la_plata_expedition_desc: "Vydajte sa na západ a sever od La Platy do andských predhorí a pátrajte po Sierra de la Plata, striebornej hore, o ktorej rozprávajú guaraníjski sprievodcovia a ktorej existenciu prisahali preživší zo Solísovej výpravy. Ak horu nájdeme, nepôjde o objavenie jednej bane, ale celej ríše drahých kovov, ktorá čaká na svoj rozmach." # todo: NEW TRANSLATION
 norumbega_expedition: "Pátranie po Norumbega" # todo: NEW TRANSLATION
 norumbega_expedition_desc: "Vydajte sa z pobrežia Nového Anglicka proti prúdu Penobscotu a pátrajte po Norumbega, opevnenom meste pri veľkej rieke, o ktorom hovorili Verrazzanovi kormidelníci i rybári z Bristolu. Krajina je husto zalesnená, rieka dlhá a domorodci odmeraní, no ak mesto existuje, bolo by prvým sídlom v Novom svete vybudovaným v európskom štýle a druhým, ktoré sme nepostavili my." # todo: NEW TRANSLATION
 saguenay_expedition: "Pátranie po kráľovstve Saguenay" # todo: NEW TRANSLATION
 saguenay_expedition_desc: "Vydajte sa proti prúdu Saguenay od rieky svätého Vavrinca do vnútrozemia Novej Francúzska a pátrajte po kráľovstve, ktoré Donnacona opísal Cartierovi v Stadacone: krajine, kde podľa náčelníka žijú svetlopletí muži v kožušinových plášťoch, v horách sa nachádza zlato a v riekach striebro, niekde na severe od veľkej kanadskej rieky. Cartier ho nikdy nedosiahol. My by sme mohli." # todo: NEW TRANSLATION
 city_of_caesars_expedition: "Pátranie po meste Cézarov" # todo: NEW TRANSLATION
 city_of_caesars_expedition_desc: "Vyslať pozemnú výpravu z [ShowRegionName('la_plata_region')] na juh, do patagónskeho vnútrozemia, podľa správy preživších z potopenej galeóny, ktorí tvrdia, že videli mesto postavené medzi dvoma horami. Jeho obyvatelia hovorili kastílskou španielčinou, ktorú by dnes žiadny dvor nepoznal. Patagónska zima je krutá a preživší sú nespoľahlivými svedkami, no nikto sa to ešte nepokúsil preveriť." # todo: NEW TRANSLATION
 city_of_caesars_expedition_historical_info: "Legenda o meste Cézarov, španielsky hovoriacom sídle, ktoré založili preživší zo stroskotanej lode zo 16. storočia na patagónskom pobreží a údajne sa ukrývalo vo vnútrozemí, mala dôveru španielskej koruny až do 18. storočia. V rokoch 1530 až 1750 bolo na jeho hľadanie vyslaných najmenej sedem výprav. Žiadna nič nenašla. Legenda pretrvala sčasti preto, že Patagóniu bolo v tom čase naozaj ťažké zmapovať, sčasti preto, že preživší z vrakov lodí sa občas vracali s podrobnými príbehmi, ktorými vysvetľovali svoju dlhú neprítomnosť, a sčasti preto, že koloniálne byrokracie mali sklon konať na základe vierohodných povestí namiesto toho, aby ich ignorovali." # todo: NEW TRANSLATION
 city_of_caesars_expedition_outcome_overview: "$BULLET$Pátranie samo osebe počas svojho trvania prináša postupný prírastok [Concept('prestige','prestíž')|e].\n$BULLET$Výsledok potom závisí od toho, koľko stôp sa nájde:\n$BULLET_WITH_TAB$Žiadna: #R -5#! [prestige].\n$BULLET_WITH_TAB$Jedna alebo viac: #G +10#! [prestige], [Concept('gold','dukáty')|e] a trvalý [Concept('location_modifier','modifikátor lokality')|e] [ShowModifier('city_of_caesars_discovered')] na mieste mesta.\n$BULLET_WITH_TAB$Štyri alebo viac: #G +20#! [prestige] a oveľa viac [gold].\n$BULLET$Všetko bohatstvo nazbierané cestou sa doručí na náš [Concept('market','trh')|e], pričom najvzácnejšie artefakty sa stanú [Concept('work_of_art','umelecké dielo')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 el_dorado_expedition: "Pátranie po El Dorade" # todo: NEW TRANSLATION
 el_dorado_expedition_desc: "Vydajte sa z delty Orinoka do vnútrozemia a pátrajte po pozlátenom kráľovi, na ktorého spomínajú Muiscovia: náčelníkovi, ktorého každý rok pomazali zlatým prachom v srdci kráľovstva, kam dosiaľ nevkročila španielska čižma. Džungľa je hustá, rieky kľukaté, domorodci opatrní a zlato, ak je skutočné, leží za všetkými týmito prekážkami." # todo: NEW TRANSLATION
 el_dorado_expedition_historical_info: "Guatavita je posvätné jazero v sopečnom kráteri na vysočine dnešnej Kolumbie. Bolo kultovým centrom konfederácie Muiscov, ktorá až do príchodu Španielov v 30. rokoch 16. storočia vládla bogotskej savane. Obrad, ktorý tvorí jadro legendy o El Dorade — občasné pomazanie nového náčelníka zlatým prachom predtým, ako ho na člne odviezli na jazero a prach z neho zmyli do vody — bol skutočný a pri Guatavite sa vykonával až do raného koloniálneho obdobia. Kráľovstvo, ktoré tento obrad vykonávalo, sa však už rozpadalo, keď na savanu dorazila prvá európska výprava. Zdecimovali ho kiahne aj politická kríza, ktorú príchod európskych chorôb vyvolal takmer všade." # todo: NEW TRANSLATION
 el_dorado_expedition_outcome_overview: "$BULLET$Pátranie samo osebe počas svojho trvania prináša postupný prírastok [Concept('prestige','prestíž')|e].\n$BULLET$Výsledok potom závisí od toho, koľko stôp sa nájde:\n$BULLET_WITH_TAB$Žiadna: #R -10#! [prestige].\n$BULLET_WITH_TAB$Jedna alebo viac: #G +10#! [prestige], [Concept('gold','dukáty')|e] a trvalý [Concept('location_modifier','modifikátor lokality')|e] [ShowModifier('el_dorado_discovered')] na mieste mesta.\n$BULLET_WITH_TAB$Päť alebo viac: #G +20#! [prestige] a oveľa viac [gold].\n$BULLET$Všetko bohatstvo, exotický tovar a artefakty nazbierané cestou sa doručia na náš [Concept('market','trh')|e], pričom najvzácnejšie sa stanú [Concept('work_of_art','umelecké dielo')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 fountain_of_youth_expedition: "Pátranie po prameni mladosti" # todo: NEW TRANSLATION
 fountain_of_youth_expedition_desc: "Vyzbrojte menšiu výpravu a vyšlite ju na polostrov Florida pátrať po prameni, ktorý Tainovia nazývajú Prameňom Bimini: voda, ktorá podľa starších navracia mužovi silu a žene krásu, aké mali v dvadsiatke. Španielski vojaci sa tej predstave smejú. Starí muži z ostrovov nie." # todo: NEW TRANSLATION
 fountain_of_youth_expedition_historical_info: "Výprava Ponceho de Leóna na Floridu v roku 1513 sa zvyčajne spája s hľadaním prameňa mladosti, no toto spojenie vzniklo až po jeho smrti. Prvýkrát sa objavuje v španielskych kronikách po jeho úmrtí a neskorší historici ho upevnili, pretože sa im takéto pútavé podanie hodilo. Samotná výprava bola bežnou prieskumnou misiou, ktorú financoval súkromný investor a ktorý chcel na území, o ktorom sa vtedy predpokladalo, že je ostrovom, zriadiť základňu na obchod s otrokmi. Prameň sa s Ponceho de Leónom začal spájať preto, že zomrel pomerne mladý, v päťdesiatke, na následky šípového zranenia, ktoré utrpel na Floride. Rozprávači nasledujúcej generácie si túto iróniu nemohli nechať ujsť." # todo: NEW TRANSLATION
 fountain_of_youth_expedition_outcome_overview: "$BULLET$Pátranie samo osebe počas svojho trvania prináša postupný prírastok [Concept('prestige','prestíž')|e].\n$BULLET$Výsledok potom závisí od toho, koľko stôp sa nájde:\n$BULLET_WITH_TAB$Žiadna: #R -5#! [prestige].\n$BULLET_WITH_TAB$Jedna alebo viac: #G +10#! [prestige] a trvalý [Concept('location_modifier','modifikátor lokality')|e] [ShowModifier('fountain_of_youth_discovered')].\n$BULLET_WITH_TAB$Päť alebo viac: #G +20#! [prestige].\n$BULLET$Každá prinesená voda predĺži život nášho [Concept('ruler','panovníka')|e] aj [Concept('heir','dedič')|e] vďaka modifikátoru [ShowModifier('rejuvenating_waters_modifier')] a domorodý liečiteľ sa môže pridať k nášmu dvoru ako nová [Concept('character','postava')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 gold_fleet_tierra_firme_expedition: "Galeones de Tierra Firme" # todo: NEW TRANSLATION
 gold_fleet_tierra_firme_expedition_desc: "Vyšlite konvoj galeón z nášho najlepšieho domovského prístavu do našich držav v Novej Granade a na Panamskej šiji, aby vyzdvihol striebro, drahokamy a kože. Flotila Tierra Firme je tepnou španielskej koloniálnej ríše a dopravuje bohatstvo Indie na trhy v Seville." # todo: NEW TRANSLATION
 gold_fleet_tierra_firme_expedition_historical_info: "#italic Galeones de Tierra Firme#! bola jedna z dvoch konvojových flotíl tvoriacich španielsku #italic Carrera de Indias#!. Flotila Tierra Firme obsluhovala juhoamerické vicekráľovstvá a v prístavoch Portobelo a Cartagena vyzdvihovala striebro z baní v Potosí v Hornom Peru a ďalšie koloniálne príjmy. Striebro sa pred nalodením prepravovalo po súši z pobrežia Tichého oceánu cez Panamskú šiju. Filip II. v roku 1566 zaviedol systém konvojov, ktorý vyžadoval, aby sa všetok obchod prevážal v ozbrojených flotilách a prechádzal cez sevillskú #italic Casa de Contratación#!, ktorá vyberala kráľovskú #italic quinto real#!, teda pätinu všetkých drahých kovov vyťažených v Novom svete." # todo: NEW TRANSLATION
 gold_fleet_tierra_firme_expedition_outcome_overview: "Konvoj naloží naše koloniálne [ShowGoodsName('silver')] a [ShowGoodsName('goods_gold')] a doručí ich domov ako [Concept('gold','dukáty')|e], pričom po príchode získa #G +10#! [Concept('prestige','prestíž')|e]. Naloženie [ShowGoodsName('gems')], [ShowGoodsName('pearls')] alebo karavány mulíc zväčší náklad, no pritiahne viac pozornosti. Stretnutie s $gold_fleet_nueva_espana_expedition$ v [ShowScriptedGeographyName('island_of_cuba_geography')] prinesie #G +10#! [prestige] a zaistí bezpečnejší prechod. Búrky a nájazdníci môžu odniesť časť nákladu, v najhoršom prípade aj celý." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 gold_fleet_nueva_espana_expedition: "Flota de Nueva España" # todo: NEW TRANSLATION
 gold_fleet_nueva_espana_expedition_desc: "Vyšlite konvoj Novej Španielska z nášho najlepšieho domovského prístavu do našich držav v Mezoamerike, aby vyzdvihol striebro a vzácne farbivá. Flotila sa plaví cez prieliv Mona do Karibiku a potom sa zhromaždí v Havane pred plavbou cez Atlantik." # todo: NEW TRANSLATION
 gold_fleet_nueva_espana_expedition_historical_info: "#italic Flota de Nueva España#! bola jedna z dvoch konvojových flotíl tvoriacich španielsku #italic Carrera de Indias#!. Slúžila vicekráľovstvu Nové Španielsko a v prístave San Juan de Ulúa pri Veracruze vyzdvihovala striebro z baní v Zacatecase, Guanajuate a ďalších mexických nálezísk, ako aj cenný tovar vrátane košenilového farbiva z Oaxacy, indiga, vanilky a kakaa. #italic Flota#! zvyčajne vyplávala zo Španielska na jar a vracala sa na jeseň, keď sa v Havane spojila s galeónami Tierra Firme a spoločne preplávali Atlantik. Trasa cez prieliv Mona medzi Hispaniolou a Portorikom bola štandardnou vstupnou cestou do východného Karibiku." # todo: NEW TRANSLATION
 gold_fleet_nueva_espana_expedition_outcome_overview: "Konvoj naloží naše koloniálne [ShowGoodsName('silver')] a [ShowGoodsName('goods_gold')] a doručí ich domov ako [Concept('gold','dukáty')|e], pričom po príchode získa #G +10#! [Concept('prestige','prestíž')|e]. Sprievod strieborného transportu alebo naloženie [ShowGoodsName('lumber')] zväčší náklad, no pritiahne viac pozornosti. Stretnutie s $gold_fleet_tierra_firme_expedition$ v [ShowScriptedGeographyName('island_of_cuba_geography')] prinesie #G +10#! [prestige] a zaistí bezpečnejší prechod. Búrky a nájazdníci môžu odniesť časť nákladu, v najhoršom prípade aj celý." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 gold_fleet_tierra_firme_expedition_expedition_special: "Náklad na palube: [EXPEDITION.GetVariable('gold_fleet_cargo')|0] zlata" # todo: NEW TRANSLATION
 gold_fleet_nueva_espana_expedition_expedition_special: "Náklad na palube: [EXPEDITION.GetVariable('gold_fleet_cargo')|0] zlata" # todo: NEW TRANSLATION
 gold_fleet_cargo: "Poklad na palube" # todo: NEW TRANSLATION
 gold_fleet_cargo_desc: "Striebro a zlato naložené počas plavby a doručené do pokladnice po bezpečnom návrate flotily." # todo: NEW TRANSLATION
 gold_fleet_danger: "Úroveň nebezpečenstva" # todo: NEW TRANSLATION
 gold_fleet_danger_desc: "Riziko útoku pirátov a ďalších nešťastí na trase. Stúpa alebo klesá podľa rozhodnutí počas plavby." # todo: NEW TRANSLATION

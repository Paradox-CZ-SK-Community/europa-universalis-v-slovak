l_polish:
 COLONY_FORECAST_ETA_LINE: "#T Čaká sa#! Približne $MONTHS|v0$ mesiacov do ďalšieho osídlenia.\nOdhad vychádza zo súčasného prílevu [Concept('migration','migrácii')|e] do tejto kolónie. Zmení sa podľa toho, či sa tento prílev zrýchli alebo spomalí." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 COLONY_FORECAST_ETA_LINE_SHORT: "~$MONTHS|v0$ mesiacov" # todo: NEW TRANSLATION
 COLONY_FORECAST_ETA_UNKNOWN: "#T Čaká sa#!\nTáto kolónia zatiaľ nemá zdroj [Concept('migration','migrácia')|e]. Odhad sa zobrazí, keď začnú prichádzať osadníci." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 COLONY_FORECAST_ETA_UNKNOWN_SHORT: "Čaká sa" # todo: NEW TRANSLATION
 BOTTLENECK_SOURCE_DEPLETED: "@warning_icon! @peasants! Vyčerpaný zdroj" # todo: NEW TRANSLATION
 BOTTLENECK_SOURCE_DEPLETED_TT: "#T Spomalenie: Vyčerpaný zdroj#!\nNáš zdroj osadníkov vyschol. V mieste, ktoré posiela [ShowPopTypeName('peasants')] do tejto kolónie, už nezostali žiadni, ktorých by mohlo poslať, takže [Concept('migration','migrácia')|e] zostane pomalá, kým nenájdeme nový zdroj." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 BOTTLENECK_GOODS: "@warning_icon! @goods! Nedostatok tovaru" # todo: NEW TRANSLATION
 BOTTLENECK_GOODS_TT: "#T Spomalenie: Nedostatok tovaru#!\nKolónii chýbajú zásoby. Dostáva menej než 75 % [Concept('goods','tovary')|e], ktoré potrebuje, a preto dokáže uživiť menej nových osadníkov." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 BOTTLENECK_MARITIME: "@warning_icon! @maritime_presence! Obmedzená námorná prítomnosť" # todo: NEW TRANSLATION
 BOTTLENECK_MARITIME_TT: "#T Spomalenie: Obmedzená námorná prítomnosť#!\nOsadníci musia na cestu do tejto kolónie prekonať more a naša [Concept('maritime_presence','námorná prítomnosť')|e] v tejto oblasti je príliš slabá na to, aby ich prepravila plnou rýchlosťou." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 BOTTLENECK_LOW_MIGRATION: "@warning_icon! @migration! Nízka migrácia" # todo: NEW TRANSLATION
 BOTTLENECK_LOW_MIGRATION_TT: "#T Spomalenie: Nízka migrácia#!\nLen málo našich ľudí je ochotných odísť do kolónií. Naša [Concept('migration','migrácia')|e] je príliš nízka na to, aby osadníci prichádzali pravidelne." # todo: NEW TRANSLATION # todo: CONCEPT CASE

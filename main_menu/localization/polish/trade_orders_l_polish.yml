 TRADE_ORDER_MODE_PROFIT_TT: "Príkaz využije svoju [Concept('merchant_capacity','neobchodnú kapacitu')|e] na najziskovejšie [Concept('trades','obchody')|e], ktoré nájde medzi vybraným tovarom a trhmi." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 TRADE_ORDER_MODE_FOOD_TT: "Príkaz využije svoju [Concept('merchant_capacity','neobchodnú kapacitu')|e] na [Concept('trades','obchody')|e], ktoré prepravia najviac [Concept('food','potraviny')|e] na trhy, na ktorých ubúdajú potraviny a ktorých [Concept('food_stockpile','zásoby potravín')|e] je nižšia ako [GetDefine('NAI','TRADE_ORDER_FOOD_MAINTAIN_STOCKPILE_FRACTION')|V0%]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 TRADE_ORDER_MODE_NEEDS_TT: "Príkaz využije svoju [Concept('merchant_capacity','neobchodnú kapacitu')|e] na pokrytie nedostatku [Concept('goods','tovarom')|e] na cieľových trhoch, postupne podľa jednotlivých položiek. Dodáva sa iba tovar, ktorého [Concept('stockpile','zásob')|e] je nižšia ako [GetDefine('NAI','TRADE_ORDER_NEEDS_STOCKPILE_EXCLUSION_FRACTION')|V0%]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 TRADE_ORDER_MODE_PROFIT_INFO: "Tento príkaz uprednostňuje #italic zisk#!: svoju [Concept('merchant_capacity','neobchodnú kapacitu')|e] využíva na najziskovejšie [Concept('trades','obchody')|e] medzi vybraným tovarom a trhmi." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 TRADE_ORDER_MODE_FOOD_INFO: "Tento príkaz uprednostňuje #italic potraviny#!: svoju [Concept('merchant_capacity','neobchodnú kapacitu')|e] využíva na [Concept('trades','obchody')|e], ktoré prepravia najviac [Concept('food','potraviny')|e] na trhy, ktoré ich potrebujú.\n\nTrhu pomáha iba vtedy, ak by bez tohto príkazu prichádzal o potraviny a jeho [Concept('food_stockpile','zásob potravín')|e] je nižšia ako [GetDefine('NAI','TRADE_ORDER_FOOD_MAINTAIN_STOCKPILE_FRACTION')|V0%]. Ak je nižšia ako [GetDefine('NAI','TRADE_ORDER_FOOD_GROWTH_STOCKPILE_FRACTION')|V0%], príkaz navyše každý mesiac dopĺňa zásoby o [GetDefine('NAI','TRADE_ORDER_FOOD_MONTHLY_STOCKPILE_GAIN')|V0%] ich maximálneho množstva. Ak je vyššia ako [GetDefine('NAI','TRADE_ORDER_FOOD_MAINTAIN_STOCKPILE_FRACTION')|V0%], trh sa považuje za zásobený a nedostane nič.\n\nVývoz sa pozastaví, keď sú zásoby potravín na vlastnom trhu príkazu nižšie ako [GetDefine('NAI','TRADE_ORDER_FOOD_EXPORT_SELF_STOP_FRACTION')|V0%] [food_stockpile], a zruší sa, keď klesnú pod [GetDefine('NAI','TRADE_ORDER_FOOD_EXPORT_SELF_CANCEL_FRACTION')|V0%]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 TRADE_ORDER_MODE_NEEDS_INFO: "Tento príkaz uprednostňuje #italic potreby#!: svoju [Concept('merchant_capacity','neobchodnú kapacitu')|e] využíva na pokrytie jednotlivých druhov tovaru v zozname, pričom prednosť majú tie, ktoré sú uvedené skôr.\n\nTovar sa dodáva iba vtedy, ak ho cieľový trh spotrebúva vo väčšom množstve, než koľko ho miestne vyprodukuje, a jeho [Concept('stockpile','zásob')|e] je nižšia ako [GetDefine('NAI','TRADE_ORDER_NEEDS_STOCKPILE_EXCLUSION_FRACTION')|V0%]. Príkaz prepraví iba toľko tovaru, aby sa bilancia vyrovnala, pričom započítava aj pomoc, ktorá už prichádza odinakiaľ. Nedostatok spôsobený iba vývozom ignoruje.\n\nAk je [Concept('stockpile','zásoby')|e] daného tovaru nižšia ako [GetDefine('NAI','TRADE_ORDER_NEEDS_GROWTH_STOCKPILE_FRACTION')|V0%], príkaz ju navyše každý mesiac dopĺňa o [GetDefine('NAI','TRADE_ORDER_NEEDS_MONTHLY_STOCKPILE_GAIN')|V1%] maximálneho množstva. Keď je medzi touto hranicou a [GetDefine('NAI','TRADE_ORDER_NEEDS_STOCKPILE_EXCLUSION_FRACTION')|V0%], pokrýva iba rozdiel v bilancii." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 TRADE_ORDER_NEW_TOOLTIP_SUMMARY: "Nový [Concept('trade_order','obchodný príkaz')|e] prideľuje [TradeOrderLateralView.GetEffectiveTC|2]@trade_capacity!. AI preň po potvrdení vytvorí [Concept('trades','obchodoch')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE

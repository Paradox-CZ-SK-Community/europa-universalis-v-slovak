l_polish:
 petition_for_the_bula_de_cruzada: "Žiadosť o bulu de Cruzada" # todo: NEW TRANSLATION
 petition_for_the_bula_de_cruzada_desc: "Ako svetský vodca [Concept('crusade','križiacka výprava')|e] požiadaj pápeža o bulu [crusade]. Počas troch rokov bude [Concept('tithe','desiatok')|e] každej krajiny [ShowReligionAdjective('catholic')] plynúť do našej pokladnice namiesto pápežovi alebo do vojenskej pokladnice [crusade]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 petition_for_the_bula_de_cruzada_tt: "Počas #G 3#! rokov bude [Concept('tithe','desiatok')|e] každej krajiny [ShowReligionAdjective('catholic')] odvádzaný do pokladnice namiesto pápežovi alebo do pokladnice [Concept('crusade','križiacka výprava')|e]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 summon_iberian_military_orders_crusade: "Povolaj iberské vojenské rády" # todo: NEW TRANSLATION
 summon_iberian_military_orders_crusade_desc: "Povolaj jeden z vojenských rádov Iberie na [Concept('crusade','križiacku výpravu')|e], ako to zamýšľali jeho zakladatelia, a nechaj jeho bratov vyraziť do boja proti nepriateľom viery." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 summon_iberian_military_orders_effect_tt: "Získaš od rádu 7 až 15 plukov ťažkej pechoty a ťažkej jazdy, pričom ich počet závisí od jeho náboženského zápalu, a zvýšiš #Y náboženský zápal#! [Concept('crusade','križiacka výprava')|e] o #G 5#!" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 summon_iberian_military_orders_no_target_tt: "Získaš od vybraného vojenského rádu 7 až 15 plukov ťažkej pechoty a ťažkej jazdy, pričom ich počet závisí od jeho náboženského zápalu, a zvýšiš #Y náboženský zápal#! [Concept('crusade','križiacka výprava')|e] o #G 5#!" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 summon_iberian_military_orders_order_tt: "Vybraný vojenský rád získa #G 10#! [Concept('zeal','horlivosť')|e]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 summon_iberian_military_orders_event_tt: "Stane sa nám [Concept('event','udalosti')|e] „$d009_holy_war.1.title$“" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 choose_military_order_to_summon: "Vyber vojenský rád" # todo: NEW TRANSLATION
 summon_iberian_military_orders_no_orders: "@trigger_no! Nie je k dispozícii žiadny vojenský rád, ktorý by sa dal povolať." # todo: NEW TRANSLATION
 launch_a_cabalgada: "Vykonaj cabalgadu" # todo: NEW TRANSLATION
 launch_a_cabalgada_desc: "Prepadni jednu z nepriateľských prihraničných provincií. Každé nebránené miesto v nej, na ktorom sa nenachádza pevnosť ani armáda, bude vyplienené a stratí rozvoj; jeho vlastník dostane výzvu, aby v reakcii zhromaždil vojsko." # todo: NEW TRANSLATION
 launch_a_cabalgada_tt: "Stojí ťa toľko [Concept('manpower','živá sila')|e], koľko získame za rok, znižuje náboženský zápal [Concept('crusade','križiacka výprava')|e] o #R 10#! a posúva jej prípravy späť o #R 10#!" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 launch_a_cabalgada_loot_tt: "Vyplieni každé nebránené miesto v provincii, na ktorom sa nenachádza pevnosť ani armáda, v odhadovanej hodnote [actor.MakeScope.ScriptValue('cabalgada_estimated_total')|0+=][gold_i], a zníži ich rozvoj" # todo: NEW TRANSLATION
 choose_province_for_cabalgada: "Vyber provinciu na prepadnutie" # todo: NEW TRANSLATION
 launch_a_cabalgada_no_provinces: "@trigger_no! Nepriateľ nedrží žiadnu nebránenú pohraničnú provinciu, ktorú by bolo možné prepadnúť." # todo: NEW TRANSLATION
 demand_parias: "Požaduj tribút" # todo: NEW TRANSLATION
 demand_parias_desc: "Ako svetský vodca [Concept('crusade','križiacka výprava')|e] požaduj od nepriateľskej ríše tribút počas jej príprav. Môžu zaplatiť a oddialiť zhromaždenie vojska pre [crusade], alebo odmietnuť a zvýšiť jej náboženský zápal." # todo: NEW TRANSLATION # todo: CONCEPT CASE

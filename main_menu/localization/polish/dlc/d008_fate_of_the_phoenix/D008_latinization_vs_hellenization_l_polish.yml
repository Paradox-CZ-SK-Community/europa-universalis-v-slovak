l_polish:
 latinization_vs_hellenization.1.title: "Ozveny múdrosti [ShowCultureGroupNameWithNoTooltip('greek_group')]" # todo: NEW TRANSLATION
 latinization_vs_hellenization.1.desc: "V kláštoroch a prednáškových sálach [target_location.GetName] sa medzi veriacimi i učenými šíria zbierky teologických spisov a diela Otcov Cirkvi. Kázne a komentáre čerpajú z hlbokých prameňov ortodoxného učenia a kópie týchto textov sa začínajú dostávať do rúk negréckych významných osôb, čo u dvora vyvoláva rastúce znepokojenie u tých, ktorí vidia budúcnosť v tesnejších väzbách s latinským Západom." # todo: NEW TRANSLATION
 latinization_vs_hellenization.1.a: "Nech ich poznatky obohatia našu krajinu." # todo: NEW TRANSLATION
 latinization_vs_hellenization.1.b: "Táto fascinácia starými zvitkami už dosť ďaleko zášla." # todo: NEW TRANSLATION
 target_character_disappears_tt: "[target_character.GetName] zmizne" # todo: NEW TRANSLATION
 latinization_vs_hellenization.2.title: "Rastúca priazeň k [ShowLanguageNameWithNoTooltip('latin_language')]" # todo: NEW TRANSLATION
 latinization_vs_hellenization.2.desc: "V salónoch a sídlach [ROOT.GetCountry.GetName] sa prebúdza nenápadný, no rastúci prúd priaznivcov zvyklostí, práva a ceremónií [ShowLanguageName('latin_language')]. Mladí šľachtici posýpajú svoju reč cudzími výrazmi, korešpondujú s [ShowLanguageNameWithNoTooltip('latin_language')] dvorcami a volajú po reformách, ktoré by naše [ROOT.GetCountry.GetFlavorRank] priblížili k módam Západu, zatiaľ čo iní sú znepokojení tým, ako rýchlo staré istoty miznú." # todo: NEW TRANSLATION
 latinization_vs_hellenization.2.a: "Z toho nemôže vzniknúť nič zlé." # todo: NEW TRANSLATION
 latinization_vs_hellenization.2.b: "Okamžite zmeňme kurz!" # todo: NEW TRANSLATION
 stability_scales_with_current_latinization_hellenization: "Zmena [Concept('stability','stabilita')|e] bude závisieť od našej aktuálnej hodnoty [ShowSocietyDirectionName('latinization')] alebo [ShowSocietyDirectionName('hellenization')]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 while_this_modifier_active_reduced_latinization_gain_from_events_tt: "Kým je tento [Concept('country_modifier','modifikátor krajiny')|e] aktívny, nasledujúce [Concept('events','udalosti')|e] zosilňujúce [ShowSocietyDirectionName('latinization')] sú výrazne oslabené, čím sa znižujú ich bonusy" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 bonus_weakened_because_of_suppressing_latinization_modifier: "Prínosy tejto voľby sú znížené kvôli [ShowModifier('suppressing_latinization_modifier')]" # todo: NEW TRANSLATION
 latinization_vs_hellenization.3.title: "[ShowSocietyDirectionNameWithNoTooltip('latinization')] prosperuje" # todo: NEW TRANSLATION
 latinization_vs_hellenization.3.desc: "Obchodníci, právnici a učenci hlásia, že nedávny obrat k [ShowLanguageName('latin_language')] formám začína prinášať úžitok. Zmluvy sa píšu jasnejšie, zahraniční partneri považujú naše postupy za známe a energia reforiem akoby oživila život [ROOT.GetCountry.GetName], hoci niektorí šepkajú, že tieto zisky stoja na základoch, ktoré ešte môžu byť otrasené." # todo: NEW TRANSLATION
 latinization_vs_hellenization.3.a: "Je čas zožať plody našich dobrých politík." # todo: NEW TRANSLATION
 latinization_vs_hellenization.3.b: "Múdry by zvolil napraviť chyby minulosti!" # todo: NEW TRANSLATION
 latinization_vs_hellenization.4.title: "Sláva [target_unit.GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 latinization_vs_hellenization.4.desc: "Dostali sa k [ROOT.GetCountry.GetGovernment.GetCourtTitle] správy o príkladnej disciplíne a odvahe, ktorú preukázal [target_unit.GetName] v nedávnych taženiach. Ich rady držia pevne na pochode i pri výcviku a príbehy o ich správaní sa začali šíriť medzi obyčajnými vojakmi i [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')], ktorí ich vnímajú ako vzor pre légie [ROOT.GetCountry.GetName]." # todo: NEW TRANSLATION
 latinization_vs_hellenization.4.a: "Ich služba je nám drahá." # todo: NEW TRANSLATION
 target_character_will_receive_a_nickname_tt: "[target_character.GetName] bude poctený vhodnou prezývkou na znak [target_character.GetHerHis] príkladnej služby" # todo: NEW TRANSLATION
 latinization_vs_hellenization.5.title: "Spor o študijné osnovy v [target_location.GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 latinization_vs_hellenization.5.desc: "Na [ShowBuildingTypeName('university')] v [target_location.GetName] sa učenci hádajú o správny jazyk vyššieho vzdelávania. Niektorí trvajú, že len [ShowLanguageName('latin_language')] môže postaviť naše [ROOT.GetCountry.GetFlavorRank] medzi veľmoci, zatiaľ čo iní trvajú, že štúdium v tradícii Konštantínopola a Cirkvi musí zostať zachované." # todo: NEW TRANSLATION
 latinization_vs_hellenization.5.a: "Univerzita bude vyučovať v [ShowLanguageNameWithNoTooltip('latin_language')]." # todo: NEW TRANSLATION
 latinization_vs_hellenization.5.b: "Tradícia našej Cirkvi a Impéria nebude vzdaná." # todo: NEW TRANSLATION
 pops_in_target_province_mild_bonus_satisfaction: "Naše [Concept('pops','populácie')|e] v [target_province.GetName] získajú [ShowNamedValue('pop_satisfaction_mild_bonus')|+=2%] [Concept('pop_satisfaction','spokojnosť populácie')|e]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 pops_in_target_province_mild_penalty_satisfaction: "Naše [Concept('pops','populácie')|e] v [target_province.GetName] budú trpieť [ShowNamedValue('pop_satisfaction_mild_penalty')|+=2%] [Concept('pop_satisfaction','spokojnosť populácie')|e]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 latinization_vs_hellenization.6.title: "Varovanie od [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('clergy_estate')]" # todo: NEW TRANSLATION
 latinization_vs_hellenization.6.desc: "Uznávaný člen [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')], [target_character.GetName], prišiel pred [ROOT.GetCountry.GetGovernment.GetCourtTitle] so závažnými obavami. [target_character.GetSheHe|U] varuje, že [ShowLanguageName('latin_language')] módy v doktríne a zvykoch erodujú základy našej viery a jedného dňa ohrozia oltár i trón." # todo: NEW TRANSLATION
 latinization_vs_hellenization.6.a: "Boli by sme múdri, keby sme si vzali k srdcu radu [target_character.GetHerHis]." # todo: NEW TRANSLATION
 latinization_vs_hellenization.6.b: "Nenecháme plaché duše riadiť naše politiky." # todo: NEW TRANSLATION
 latinization_vs_hellenization.7.title: "[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')] napodobňujú cudzie zvyky" # todo: NEW TRANSLATION
 latinization_vs_hellenization.7.desc: "Od hál [target_location.GetName] až po vzdialené sídla naša [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')] dychtivo napodobňuje spôsoby, módu a jazyk [target_culture.GetName]. Niektorí to oslavujú ako kultivovanosť, iní šepkajú, že naša aristokracia zabúda, čo znamená byť [ROOT.GetCountry.GetAdjective]." # todo: NEW TRANSLATION
 latinization_vs_hellenization.7.a: "Nech si vezmú, čo je užitočné zo spôsobov kultúry [target_culture.GetNameWithNoTooltip]." # todo: NEW TRANSLATION
 latinization_vs_hellenization.7.b: "Táto cudzia náklonnosť už prekročila hranicu." # todo: NEW TRANSLATION
 destabilize_our_realm: "Náš obranný postoj voči týmto trendom destabilizuje naše [ROOT.GetCountry.GetFlavorRank]" # todo: NEW TRANSLATION
 perceived_as_weakness: "Zakazovanie ochutnávky cudzích zvykov je vnímané ako slabosť" # todo: NEW TRANSLATION
 latinization_vs_hellenization.8.title: "Preusporiadanie provincií" # todo: NEW TRANSLATION
 latinization_vs_hellenization.8.desc: "Úradníci v [ROOT.GetCountry.GetCapital.GetName] predložili návrh komplexnej reorganizácie provincií ako [target_province.GetName], zosúlaďujúc jurisdikcie a administratívu bližšie s naším kultúrnym a politickým centrom. Plán sľubuje väčšiu kontrolu, ale riskuje rozrušenie dlho zavedených miestnych rovnováh." # todo: NEW TRANSLATION
 latinization_vs_hellenization.8.a: "Utvrdíme nový poriadok, nech to stojí čokoľvek." # todo: NEW TRANSLATION
 latinization_vs_hellenization.8.b: "Rešpektujme miestne dohody a zmierme ich obavy." # todo: NEW TRANSLATION
 pops_in_selected_provinces_will_gain_mild_bonus_satisfaction_tt: "Naši [Concept('pops','populácie')|e] v postihnutých [Concept('provinces','provinciách')|e] získajú [ShowNamedValue('pop_satisfaction_mild_bonus')|+=2%] [Concept('pop_satisfaction','spokojnosť populácie')|e]" # todo: CHANGED # todo: CONCEPT CASE
 latinization_vs_hellenization.9.title: "Výchova [target_character.GetShortNameWithNoTooltip]" # todo: NEW TRANSLATION
 latinization_vs_hellenization.9.desc: "Ako [target_character.GetName] dospieva, vychovávatelia a dvorania sa hádajú o správny priebeh [target_character.GetHerHis] štúdií. Každá voľba jazyka, textu a mentora hrozí stať sa zástupnou bitkou o budúcu dušu [ROOT.GetCountry.GetName]." # todo: NEW TRANSLATION
 latinization_vs_hellenization.9.a: "[target_character.GetHerHis|U] výchova musí nasledovať jasný, premyslený smer." # todo: NEW TRANSLATION
 latinization_vs_hellenization.9.b: "Nebudeme politizovať výchovu [target_character.GetShortNameWithNoTooltip]." # todo: NEW TRANSLATION
 refusal_to_politicize_tt: "Náš odmietavý postoj zasahovať otvorene do výchovy [target_character.GetName] môže byť niektorými na [ROOT.GetCountry.GetGovernment.GetCourtTitle] vnímané ako slabosť" # todo: NEW TRANSLATION
 court_does_not_react: "[ROOT.GetCountry.GetGovernment.GetCourtTitle] nereaguje" # todo: NEW TRANSLATION
 latinization_vs_hellenization.10.title: "Obnova veľkoleposti [ShowCultureNameWithNoTooltip('roman_culture')]" # todo: NEW TRANSLATION
 latinization_vs_hellenization.10.desc: "Architekti oboznámení s novými metódami rozkvitajúcimi v mestách Talianska navrhujú formovať [target_province.GetName] v renesančnom štýle: široké bulváre, usporiadané mriežky a verejné diela, ktoré pripomínajú veľkoleposť Ríma, ako ju znovu predstavili majstri latinského Západu. Tí, ktorí obdivujú takéto vysoké plány, vidia znovuzrodenie dôstojnosti. Možno je to druh obnovy, ktorý môže priniesť len otvorenosť k Západu." # todo: NEW TRANSLATION
 latinization_vs_hellenization.10.a: "Nech [target_province.GetNameWithNoTooltip] znova povstane." # todo: NEW TRANSLATION
 latinization_vs_hellenization.10.b: "Nech sídla prosperujú prirodzene." # todo: NEW TRANSLATION
 target_character_artist_skill: "[target_character.GetName] [Concept('artistic_skill','Umelecká zručnosť')|e]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 latinization_vs_hellenization.11.title: "Stavať v cisárskej tradícii pre [target_province.GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 latinization_vs_hellenization.11.desc: "Patróni umení a miestne cechy lobovali za obnovu [target_province.GetName] čerpajúc z veľkej tradície našich cisárskych miest: arkádové ulice, otvorené fóra a kamenárske práce, ktoré odlišovali Konštantínopol a trvácne mestá Rímskeho Východu. Mnohí z našich poradcov veria, že obnova takýchto foriem silno vysiela posolstvo o dôstojnosti nášho nepretržitého rímskeho dedičstva." # todo: NEW TRANSLATION
 latinization_vs_hellenization.11.a: "Takáto pôvabnosť sa hodí nášmu [ROOT.GetCountry.GetFlavorRank]." # todo: NEW TRANSLATION
 latinization_vs_hellenization.11.b: "$latinization_vs_hellenization.10.b$" # todo: NEW TRANSLATION
 latinization_vs_hellenization.12.title: "Debata o novom daňovom systéme" # todo: NEW TRANSLATION
 latinization_vs_hellenization.12.desc: "Finanční úradníci predložili rozsiahlu reformu našich daňových zákonov, prevzatú zo zahraničných modelov, aby zintenzívnila odhad a výber. Tento radikálny návrh sľubuje väčší poriadok a príjmy, ale tiež hrozí rozhnevať privilegované záujmy v celom [ROOT.GetCountry.GetFlavorRank]." # todo: NEW TRANSLATION
 latinization_vs_hellenization.12.a: "Zaviesť nový systém." # todo: NEW TRANSLATION
 latinization_vs_hellenization.12.b: "Zatiaľ tieto myšlienky opustiť." # todo: NEW TRANSLATION
 proposed_taxation_upsets_estates_tt: "Navrhované daňové usporiadanie naruší zavedené privilégiá niekoľkých [Concept('estates','stavov')|e]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 new_tax_code_will_destabilize_the_realm: "Revidovaný daňový systém destabilizuje naše [ROOT.GetCountry.GetFlavorRank]" # todo: NEW TRANSLATION
 latinization_vs_hellenization.13.title: "[target_location.GetNameWithNoTooltip] žiada vlastnú radu" # todo: NEW TRANSLATION
 latinization_vs_hellenization.13.desc: "Významní obyvatelia [target_location.GetName] predložili petíciu [ROOT.GetCountry.GetGovernment.GetCourtTitle] za autonómnu mestskú radu, poukazujúc na príklad samosprávnych komun talianskych miest ako dôkaz, že miestne vládnutie prináša prosperitu. Splnenie ich želania by oslabilo centralnú kontrolu a posunulo [ROOT.GetCountry.GetFlavorRank] k latinským modelom správy, ale odmietnutie môže rozhorčiť vplyvných elít, ktoré hľadajú inšpiráciu na západe." # todo: NEW TRANSLATION
 latinization_vs_hellenization.13.a: "Udeľme im ich radu." # todo: NEW TRANSLATION
 latinization_vs_hellenization.13.b: "Zostanú pod naším priamym dohľadom." # todo: NEW TRANSLATION
 upper_class_pops_in_these_cities_angry: "Naše [Concept('upper_class','vyššia trieda')|e] [Concept('pops','populácií')|e] v dotknutých [Concept('locations','lokalitách')|e] budú nespokojné s naším odmietnutím a utrpia [ShowNamedValue('pop_satisfaction_mild_penalty')|+=2%] [Concept('pop_satisfaction','spokojnosť populácie')|e]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 latinization_vs_hellenization.14.title: "Veľký festival v [target_province.GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 latinization_vs_hellenization.14.desc: "Miestni vodcovia v [target_province.GetName] chcú usporiadať veľký festival, poďakovanie za zvyky a bohatstvo zeme. Kým takéto veselie by mohlo zmierniť napätie a posilniť spoločnú identitu, vyžadovalo by si investíciu z provincie i nášho pokladu, ku rozhorčeniu našich finančných poradcov." # todo: NEW TRANSLATION
 latinization_vs_hellenization.14.a: "Oslava len pre [target_province.GetNameWithNoTooltip]." # todo: NEW TRANSLATION
 latinization_vs_hellenization.14.b: "Nech sa pripoja susedné provincie k slávnostiam!" # todo: NEW TRANSLATION
 latinization_vs_hellenization.14.c: "Ak majú čas zaháľať, majú čas aj pracovať." # todo: NEW TRANSLATION
 pops_are_happier_tt: "Naše [Concept('pops','populácie')|e], ktoré sa v tejto [Concept('province','provincii')|e] nepovažujú za súčasť [Concept('upper_class','vyššiu triedu')|e], získajú v dôsledku prebiehajúcich festivalov [ShowNamedValue('pop_satisfaction_mild_bonus')|+=2%] [Concept('pop_satisfaction','spokojnosti populácie')|e]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 latinization_vs_hellenization.15.title: "Manuál latinského spôsobu" # todo: NEW TRANSLATION
 latinization_vs_hellenization.15.desc: "Starostlivo vypracovaný manuál cvičení a bojových manévrov, čerpaný z metód žoldnierskych kapitánov a vojenských rád latinského Západu, sa začal šíriť medzi našimi dôstojníkmi. Jeho diagramy a rozkazy sľubujú priniesť poriadok a jednotnosť do našich radov, ak ho prijmeme za oficiálnu doktrínu." # todo: NEW TRANSLATION
 latinization_vs_hellenization.15.a: "Rozšírte ho!" # todo: NEW TRANSLATION
 latinization_vs_hellenization.15.b: "Takéto vplyvy nepotrebujeme." # todo: NEW TRANSLATION
 latinization_vs_hellenization.16.title: "[target_character.GetShortNameWithNoTooltip] sa dostal do konfliktu s [target_estate.GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 latinization_vs_hellenization.16.desc: "Bohužiaľ! Vyhrotený spor prepukol medzi [target_character.GetName] a vedúcimi predstaviteľmi [target_estate.GetName], pričom sa navzájom obviňujú z prekročenia právomocí. Spor hrozí skaziť vzťahy medzi dôstojníckym zborom a širšími záujmami nášho [ROOT.GetCountry.GetFlavorRank]." # todo: NEW TRANSLATION
 latinization_vs_hellenization.16.a: "Majú pravdu, keď [target_character.GetHerHim] napomínajú." # todo: NEW TRANSLATION
 latinization_vs_hellenization.16.b: "[target_estate.GetNameWithNoTooltip] neurčujú vojenské otázky!" # todo: NEW TRANSLATION
 court_faction_increases_influence: "Opačná frakcia [ROOT.GetCountry.GetGovernment.GetCourtTitle] zvýši svoj vplyv" # todo: NEW TRANSLATION
 our_authority_will_suffer_penalty: "Naša autorita utrpí" # todo: NEW TRANSLATION
 latinization_vs_hellenization.17.title: "[target_character.GetShortNameWithNoTooltip] sa ponúka do služby" # todo: NEW TRANSLATION
 latinization_vs_hellenization.17.desc: "Vďaka našim väzbám s [target_country.GetName] sa skúsený bojovník pôvodu [target_culture.GetName] vyjadril, že sa chce slúžiť pod našou zástavou. [target_character.GetSheHe|U] so sebou prináša vojenské vedomosti latinského Západu a ponúka [target_character.GetHerHis] expertízu našej veci." # todo: NEW TRANSLATION
 latinization_vs_hellenization.17.a: "Každý vodca [target_culture.GetNameWithNoTooltip] je vítaný!" # todo: NEW TRANSLATION
 latinization_vs_hellenization.18.title: "Nesúhlas medzi vodcami" # todo: NEW TRANSLATION
 latinization_vs_hellenization.18.desc: "Dvaja z našich veliteľov, [target_character_1.GetName] a [target_character_2.GetName], sa dostali do otvoreného sporu o taktike a výcviku. Ich rivalita hrozí rozdeliť dôstojnícky zbor a zmiasť vojakov v tažení. Je tento rozkol len najnovším príznakom rozdeleného vojenského aparátu? V každom prípade by sme mali tieto spory ukončiť v záujme národnej bezpečnosti." # todo: NEW TRANSLATION
 latinization_vs_hellenization.18.a: "Vypočujme radu [target_character_1.GetShortNameWithNoTooltip]." # todo: NEW TRANSLATION
 latinization_vs_hellenization.18.b: "[target_character_2.GetNameWithNoTooltip] má pravdu!" # todo: NEW TRANSLATION
 latinization_vs_hellenization.19.title: "[target_province_destination.GetNameWithNoTooltip] priťahuje prisťahovalcov" # todo: NEW TRANSLATION
 latinization_vs_hellenization.19.desc: "Pýcha a dobré meno [target_province_destination.GetName] viedli ľudí z [target_province_origin.GetName] na cestu do našich krajín. Ak prichádzajú zo západu latinského, ich usídlenie prehĺbi naše spojenia tam; ak ide o ortodoxných susedov, ich príchod posilní starobylý charakter provincie." # todo: NEW TRANSLATION
 latinization_vs_hellenization.19.a: "Obohatia našu spoločnosť!" # todo: NEW TRANSLATION
 latinization_vs_hellenization.19.b: "Nie sú vítaní." # todo: NEW TRANSLATION
 latinization_vs_hellenization.20.title: "Vernosť [target_character.GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 latinization_vs_hellenization.20.desc: "Chýry sa šíria, že [target_character.GetName] sa stretával s poslov a agentmi, ktorých vernosti ležia inde. Či už zlom alebo nepochopením, takéto šepoty podkopávajú dôveru v našom velení. Kým naši špióni hlásia nedôveru, bolo by múdre situáciu starostlivo zvážiť." # todo: NEW TRANSLATION
 latinization_vs_hellenization.20.a: "[target_character.GetSheHe|U] si zaslúžil [target_character.GetHerselfHimself] trochu dovolenky..." # todo: NEW TRANSLATION
 latinization_vs_hellenization.20.b: "Nemôžeme počúvať tieto zbytočné reči!" # todo: NEW TRANSLATION
 target_character_spills_the_beans: "[target_character.GetShortName] prezrádza naše tajomstvá našim [Concept('rivals','rivalom')|e] a [Concept('rival_enemies','nepriatelia')|e]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 target_character_lips_shut: "[target_character.GetHerHis|U] pery zostávajú zatvorené" # todo: NEW TRANSLATION
 latinization_vs_hellenization.21.title: "Inflačné politiky" # todo: NEW TRANSLATION
 latinization_vs_hellenization.21.desc: "Prílev znehodnotených a falšovaných mincí začal skresľovať ceny po celom [ROOT.GetCountry.GetName]. Niektorí z našich poradcov na [ROOT.GetCountry.GetGovernment.GetCourtTitle] naliehajú na okamžitý zásah, zatiaľ čo iní tvrdia, že liek môže byť rovnako bolestivý ako choroba." # todo: NEW TRANSLATION
 latinization_vs_hellenization.21.a: "Zvýšme kontrolu nad menou." # todo: NEW TRANSLATION
 latinization_vs_hellenization.21.b: "Nechajme trh, aby si to vyriešil." # todo: NEW TRANSLATION
 inflation_creeping_in_tt: "Ak sa nebude kontrolovať, [Concept('inflation','inflácia')|e] môže v budúcnosti spôsobiť vážne problémy" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 burghers_pleased: "[ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')] sú spokojní s našou zdržačlivosťou" # todo: NEW TRANSLATION
 burghers_upset: "Naša nečinnosť rozčuľuje [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')]" # todo: NEW TRANSLATION
 inflation_causes_instability: "Rozbehnutá [Concept('inflation','inflácia')|e] negatívne ovplyvňuje našu [Concept('stability','stabilitu')|e]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 latinization_vs_hellenization.22.title: "Učiteľ-kamarát [target_character_1.GetShortNameWithNoTooltip]" # todo: NEW TRANSLATION
 latinization_vs_hellenization.22.desc: "[target_character_1.GetName] sa obzvlášť spriatelil s [target_character_2.GetName], ktorého lekcie teraz presahujú jednoduché písmená a počty. Niektorí hovoria, že toto priateľstvo rozširuje obzory [target_character_1.GetHerHis], zatiaľ čo iní sa obávajú neprijateľného vplyvu na budúcnosť nášho [ROOT.GetCountry.GetFlavorRank]." # todo: NEW TRANSLATION
 latinization_vs_hellenization.22.a: "Len to najlepšie pre nášho malého [target_character_1.GetShortNameWithNoTooltip]!" # todo: NEW TRANSLATION
 latinization_vs_hellenization.22.b: "[target_character_1.GetSheHe|U] sa narodil viesť, nie čítať!" # todo: NEW TRANSLATION
 heir_will_receive_more_tutoring_tt: "Náš milovaný [target_character_1.GetShortName] dostane doplnkové vyučovanie, ktoré môže zlepšiť [target_character_1.GetHerHis] [Concept('abilities','schopnosti')|e]. To môže ovplyvniť [target_character_1.GetHerHis] tvorbu politík, ak [target_character_1.GetSheHe] nastúpi na trón." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 latinization_vs_hellenization.23.title: "Osoba písmen [target_character.GetWomanMan|U]" # todo: NEW TRANSLATION
 latinization_vs_hellenization.23.desc: "Blúdiaci učenec [target_culture.GetName], vycvičený v humanistických tradíciách talianskych miest, prišiel na náš [ROOT.GetCountry.GetGovernment.GetCourtTitle], nesúc latinské rukopisy, filozofické komentáre a myšlienky ťažené z rozkvitajúceho učenia Západu. Takáto postava môže byť cenným spojovacím článkom k intelektuálnym prúdom latinského sveta. Avšak mali by sme byť ostražití voči cudzej sympatii, ktorú [target_character.GetSheHe] môže priniesť so sebou." # todo: NEW TRANSLATION
 latinization_vs_hellenization.23.a: "Zostaň u nás chvíľu, unavený cestovateľ." # todo: NEW TRANSLATION
 latinization_vs_hellenization.23.b: "Nestaráme sa o úvahy toulajúcich sa žobrákov." # todo: NEW TRANSLATION
 latinization_vs_hellenization.24.title: "Znalý cestovateľ" # todo: NEW TRANSLATION
 latinization_vs_hellenization.24.desc: "Učený [target_character.GetWomanMan] oboznámený s dielami Otcov Cirkvi a komentármi veľkých ortodoxných teológov požiadal o povolenie pobývať na našom [ROOT.GetCountry.GetGovernment.GetCourtTitle], ponúkajúc zdieľať rukopisy zhromaždené z východných kláštorov a hlboké poznanie cisárskeho práva a ortodoxnej doktríny. Či táto múdrosť posilní naše tradície alebo len pridá ďalší hlas do už preplneného dvora, závisí od nás." # todo: NEW TRANSLATION
 latinization_vs_hellenization.24.a: "Dobre, [target_character.GetShortNameWithNoTooltip] môže zostať." # todo: NEW TRANSLATION
 latinization_vs_hellenization.24.b: "Nie je nič výnimočné, [target_character.GetSheHe] je len ďalšia tehla v múre." # todo: NEW TRANSLATION
 latinization_vs_hellenization.25.title: "Kultúrny rozpad" # todo: NEW TRANSLATION
 latinization_vs_hellenization.25.desc: "Kronikári oplakávajú, že kultúrna sila [ROOT.GetCountry.GetName] vyprcháva. Mecenát slabne, tradície sa zanedbávajú a diela, ktoré kedysi inšpirovali náš ľud, teraz prachujú v knižniciach a trezoroch. Sme, ako nositelia veľkej kultúry, odtrhnutí?" # todo: NEW TRANSLATION
 latinization_vs_hellenization.25.a: "Musíme prijať, že naše dedičstvo zoslablo." # todo: NEW TRANSLATION
 latinization_vs_hellenization.25.b: "Nie, to sú všetci ostatní, ktorí sa mýlia!" # todo: NEW TRANSLATION
 latinization_vs_hellenization.26.title: "Východné módy na [ROOT.GetCountry.GetGovernment.GetCourtTitle]" # todo: NEW TRANSLATION
 latinization_vs_hellenization.26.desc: "Hodváb, parfumy a zvyky prenesené obchodníkmi a vyslancami z dvorov Východu uchvátili predstavivosť našej [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]. Niektorí to považujú za prirodzené pre impérium, ktoré dlho stálo medzi Východom a Západom, zatiaľ čo iní tvrdia, že naša budúcnosť leží pri latinských mocnostiach a že dvore smerujúci na východ len odženie našich západných spojencov." # todo: NEW TRANSLATION
 latinization_vs_hellenization.26.a: "Východ bol vždy súčasťou nášho sveta." # todo: NEW TRANSLATION
 latinization_vs_hellenization.26.b: "Musíme hľadieť na Západ, nie na Východ." # todo: NEW TRANSLATION
 latinization_vs_hellenization.27.title: "Politiky [ShowSocietyDirectionNameWithNoTooltip('hellenization')] sa vyplácajú" # todo: NEW TRANSLATION
 latinization_vs_hellenization.27.desc: "Kultúrne politiky, ktoré sme prijali, konečne prinášajú ovocie. Učeníci chvália obnovenú jasnosť, admirálovia hovoria o obnovenom sebavedomí a ľud cíti, že naša cesta, hoci sporná, vedie k niečomu cieľavedomému." # todo: NEW TRANSLATION
 latinization_vs_hellenization.27.a: "Usmievajme sa, robíme naše predky hrdými." # todo: NEW TRANSLATION
 strength_of_hellenization_desc: "Sila nášho [ShowModifierTypeName('monthly_towards_hellenization')] [Concept('country_modifier','modifikátora krajiny')|e]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 latinization_vs_hellenization.28.title: "[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')] odoláva aktuálnym trendom" # todo: NEW TRANSLATION
 latinization_vs_hellenization.28.desc: "Vládnuce rodiny v rámci [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] sa sťažujú, že [ROOT.GetCountry.GetFlavorRank] sa príliš a príliš rýchlo odkláňa v svojich kultúrnych politikách. Tvrdia, že len ich pevná ruka môže udržať [ROOT.GetCountry.GetName] pred úplnou stratou charakteru." # todo: NEW TRANSLATION
 latinization_vs_hellenization.28.a: "Vyhovme ich požiadavkám." # todo: NEW TRANSLATION
 latinization_vs_hellenization.28.b: "Nezmeníme kurz." # todo: NEW TRANSLATION
 latinization_vs_hellenization.29.title: "[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('clergy_estate')] odoláva aktuálnym trendom" # todo: NEW TRANSLATION
 latinization_vs_hellenization.29.desc: "K nášmu zármutku, [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] nedávno začali hovoriť s obavami o našom kultúrnom smere. Niektorí vidia tieto odchýlky ako skazné alebo dokonca nebezpečné, no všetci sa zhodujú, že viera musí byť ochránená pred takýmito škodlivými prúdmi." # todo: NEW TRANSLATION
 latinization_vs_hellenization.29.a: "Vypočujme ich varovania." # todo: NEW TRANSLATION
 latinization_vs_hellenization.29.b: "Doktrína nesmie riadiť politiku." # todo: NEW TRANSLATION
 refusal_leads_instability: "Naše odmietnutie vyhovieť vedie k nestabilite" # todo: NEW TRANSLATION
 situation_dissipates: "Vypätá výmena sa neeskaluje" # todo: NEW TRANSLATION
 latinization_vs_hellenization.30.title: "[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('peasants_estate')] odoláva aktuálnym trendom" # todo: NEW TRANSLATION
 latinization_vs_hellenization.30.desc: "Medzi poliami a dedinami [ROOT.GetCountry.GetName] mnohí členovia nižšej triedy reptajú, že vzdialené debaty o prenasledovaní veľkoleposti a zvykoch im prinášajú len nové povinnosti a čudných úradníkov. Ich tichý odpor by sa mohol zosilniť, ak sa na to nebude reagovať." # todo: NEW TRANSLATION
 latinization_vs_hellenization.30.a: "Uspokojme [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('peasants_estate')]." # todo: NEW TRANSLATION
 latinization_vs_hellenization.30.b: "Vynúťme súlad s aktuálnym trendom." # todo: NEW TRANSLATION

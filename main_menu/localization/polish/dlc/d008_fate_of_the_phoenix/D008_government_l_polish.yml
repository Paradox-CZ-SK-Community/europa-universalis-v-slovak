 spread_philhellenism: "Šíriť filhelénstvo" # todo: NEW TRANSLATION
 spread_philhellenism_desc: "Zvýšením učenia, umenia a filozofie [ShowCultureGroupName('greek_group')] chceme ovplyvniť, ako je náš štát vnímaný doma i v zahraničí. Učeníci, umelci a obdivovatelia kultúry [ShowCultureName('greek_culture')] sú k nám priťahovaní, čím posilňujú náš lesk a vplyv skôr obdivom než silou." # todo: NEW TRANSLATION

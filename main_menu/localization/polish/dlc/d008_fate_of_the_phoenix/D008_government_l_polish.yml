 encourage_latin_militarism: "Podporiť [ShowLanguageNameWithNoTooltip('latin_language')] militarizmus" # todo: NEW TRANSLATION
 encourage_latin_militarism_desc: "Zaviažeme náš štát k [ShowLanguageName('latin_language')] ideálu usporiadaného vedenia vojny: dodržiavanie zmlúv, štandardizované cvičenia a bremeno zbraní sa stane rutinou. Takáto disciplína určite zníži náklady na udržanie vojakov v teréne a podporí profesionálnu tradíciu služby." # todo: NEW TRANSLATION
 encourage_latin_militarism_action: "Podporiť latinský militarizmus" # todo: NEW TRANSLATION

 cb_restore_roman_borders: "Obnoviť $ROM_ADJ$ hranice" # todo: NEW TRANSLATION
 cb_restore_roman_borders_desc: "Lesk starého impéria nás volá. Je čas, aby fénix roztiahol krídla a zmaril osudy všetkých, ktorí sa odvážia postaviť medzi nás a našu ambíciu obnoviť [ShowScriptedGeographyName('roman_borders_geography')] dávnych čias." # todo: NEW TRANSLATION
 roman_borders_geography: "$ROM_ADJ$ hranice" # todo: NEW TRANSLATION
 epic_hellenic_history: "Epos helénskej histórie" # todo: NEW TRANSLATION
 epic_hellenic_history_desc: "Prepis slávnej histórie starovekého gréckeho sveta, písaný na zlatom liste a zdobený kaligrafiou. Toto umelecké dielo svedčí o našom blahobyte a o veľkých osobnostiach, ktoré máme to šťastie nazývať našimi predkami. Táto kronika obsahuje zbierku príbehov, ako zničenie Tróje, kde veľký Achilles našiel svoju smrť, putovania legendárneho Odyssea a plavby Jásona a jeho argonautov, medzi inými." # todo: NEW TRANSLATION
 nomos_empsychos_bureaucracy: "Nómos Émpsychos" # todo: NEW TRANSLATION
 nomos_empsychos_bureaucracy_desc: "Derivujúc z konceptu živej legislatívy (#italic Nómos Émpsychos#!), cisár tvorí základný kameň našej správy a stelesňuje samotnú zvrchovanú moc. Prvýkrát formulovaný za vlády Justiniána, tento princíp viaže legislatívu, spravodlivosť a velenie na imperiálnu osobu, umiestňujúc vládcu do samotného jadra rímskeho štátu." # todo: NEW TRANSLATION
 honorary_titles_bureaucracy: "Čestné tituly" # todo: NEW TRANSLATION
 honorary_titles_bureaucracy_desc: "Od #italic Patrikios#! a #italic Anthypatos#! po #italic Magistros#! a #italic Kouropalatēs#! náš dvor riadi ambície skôr dôstojnosťou než príkazom.\n\nTento zložitý systém, založený na udeľovaní honorácií s rôznymi hodnosťami, hodvábu a privilégií, umožňuje cisárovi viazať generálov, senátorov a provinčné elity k trónu odmeňovaním lojality, zmierňovaním rivality a premenou prestíže sama o sebe na nástroj vlády." # todo: NEW TRANSLATION
 court_eunuchs_bureaucracy: "Dvoroví eunuchovia" # todo: NEW TRANSLATION
 court_eunuchs_bureaucracy_desc: "Vzdelaní, lojálni a vylúčení z dynastických ambícií, dvoroví eunuchovia tvoria dôveryhodnú administratívnu vrstvu. Ich blízkosť k cisárovi a odstup od rodinnej moci z nich robí ideálnych správcov palácovej správy, financií a cisárskej korešpondencie." # todo: NEW TRANSLATION
 ritualistic_court_bureaucracy: "Rituálny dvor" # todo: NEW TRANSLATION
 ritualistic_court_bureaucracy_desc: "Ceremónia je správa spravená viditeľnou. Prostredníctvom regulovaných rituálov, prednosti a slávností cisársky dvor premieňa autoritu na posvätné divadlo, poriadkuje hierarchiu doma a zároveň ohromuje zahraničných poslov majestátom nášho veľkého hlavného mesta, vnímaného ako centrum civilizovaného sveta." # todo: NEW TRANSLATION
 sixty_books_of_the_basilika_bureaucracy: "Knihy Basiliká" # todo: NEW TRANSLATION
 HAS_SIXTY_BOOKS_OF_THE_BASILIKA_TRIGGER: "Má $sixty_books_of_the_basilika_bureaucracy$" # todo: NEW TRANSLATION
 THIRD_HAS_SIXTY_BOOKS_OF_THE_BASILIKA_TRIGGER: "Má $sixty_books_of_the_basilika_bureaucracy$" # todo: NEW TRANSLATION
 FATE_OF_THE_PHOENIX_DISASTER_ACTIVE_TRIGGER: "The $fate_of_the_phoenix$ [disaster|e] is active" # todo: NEW TRANSLATION
 THIRD_FATE_OF_THE_PHOENIX_DISASTER_ACTIVE_TRIGGER: "The $fate_of_the_phoenix$ [disaster|e] is active" # todo: NEW TRANSLATION
 sixty_books_basilika_satisfaction_scale_tt: "Sankcia pre [estate_satisfaction|e] roľníkov sa mení podľa posúvača údržby $sixty_books_of_the_basilika_bureaucracy$. (#R -5%#! pri plnej údržbe a #R -20%#! pri žiadnej údržbe)" # todo: NEW TRANSLATION
 sixty_books_of_the_basilika_bureaucracy_desc: "Stavajúc na Justinianovom #italic Corpus Juris Civilis#!, $sixty_books_of_the_basilika_bureaucracy$ reorganizujú rímske právo do koherentného [ShowLanguageName('greek_language')] právneho korpusu. Zjednocovaním, štandardizáciou a harmonizáciou storočí jurisprudencie robia cisárovo právo nepochybným, autoritatívnym a univerzálnym." # todo: NEW TRANSLATION
 romanitas_bureaucracy: "Romanitas" # todo: NEW TRANSLATION
 romanitas_bureaucracy_desc: "$romanitas_bureaucracy$ potvrdzuje nepretržitú rímsku štátnosť. Cisár vládne nie dobývaním či etnicitou, ale ako zákonný dedič autority, práva a tradície siahajúcej viac než tisícročie. Táto identita spája impérium a vieru, prezentujúc rímsku vládu ako božsky ospravedlnenú a morálne nadradenú." # todo: NEW TRANSLATION
 imperial_senate_bureaucracy: "Impériálny senát" # todo: NEW TRANSLATION
 imperial_senate_bureaucracy_desc: "Zložený zo starších dôstojníkov vymenovaných cisárskou mocou, senát slúži ako telo aklamácie a rady. Jeho súhlas legitimizuje panovania, nástupníctva a významné akty, zachovávajúc rímsku kontinuitu a zároveň zabezpečujúc, že suverenita zostáva pevne cisárska." # todo: NEW TRANSLATION
 kephalai_bureaucracy: "Kephalai" # todo: NEW TRANSLATION
 kephalai_bureaucracy_desc: "#italic Kephalai#! sú administratívne a právne kompendiá navrhnuté tak, aby správa impéria bola praktická. Nahrádzajúc staršie regionálne usporiadania ako #italic Katepaníkion#!, zhusťujú zákon, dane a vojenské povinnosti do štandardizovaných smerníc, zabezpečujúc jednotnú vládu naprieč provinciami." # todo: NEW TRANSLATION
 won_fate_of_the_phoenix_disaster_tt: "Prostredníctvom [ShowDisasterName('fate_of_the_phoenix')] [disaster|e] sme vyšli víťazne" # todo: NEW TRANSLATION
 fop_renaissance_latin_merchants_tt: "Udelili sme privilégiá obchodníkom [ShowCultureGroupName('latin_group')]" # todo: NEW TRANSLATION
 magister_militum_bureaucracy: "Strategarchia" # todo: NEW TRANSLATION
 magister_militum_bureaucracy_desc: "#italic Strategarchia#! zosobňuje inštitucionálne velenie cisárskej armády. Generáli sú menovaní, rotovaní a obmedzovaní byrokraciou, čím sa zabezpečuje, že vojenská sila slúži štátu, nie osobným ambíciám. Vojna sa tak stáva administratívnou funkciou riadenou hierarchiou namiesto vernosti, pričom zaručuje, že len najlepší vystúpia na vrchol." # todo: NEW TRANSLATION
 has_unlocked_bureaucracy_via_flavor_byz_31_tt: "Odblokovali sme túto [bureaucracy|e] prostredníctvom $flavor_byz.31.title$ [event|e], ktorý môže nastať po roku #Y 1400#!" # todo: NEW TRANSLATION
 themata_bureaucracy: "Thémata" # todo: NEW TRANSLATION
 themata_bureaucracy_desc: "Vzniknuté v reakcii na existenčné hrozby, #italic Thémata#! rozdeľujú impérium na provinčné vojensko-administratívne okresy. Každá z týchto divízií je spravovaná #italic Strategós#!, ktorý spája civilnú a vojenskú moc, umožňujúc rýchlu miestnu obranu pričom zostáva formálne podriadený imperiálnej hierarchii." # todo: NEW TRANSLATION
 allelengyon_bureaucracy: "Allelengyon" # todo: NEW TRANSLATION
 allelengyon_bureaucracy_desc: "Pôvodne koncipovaný za cisára Basila II. (bežne známeho pod prezývkou #italic the Bulgar-Slayer#!) a vychádzajúci z [ShowLanguageName('greek_language')] slova #italic allilengýi#! (solidarita), #italic $allelengyon_bureaucracy$#! bol daňovou povinnosťou navrhnutou na presun fiškálneho bremena. Keď malí držitelia pôdy nedokážu splniť svoje povinnosti, zodpovednosť je právne prenesená na bohatších vlastníkov pôdy v okrese, čím sa zabezpečujú cisárske príjmy a zabraňuje sa skaze a pohlteniu roľníckych pozemkov. Tým sa fiškálna solidarita stáva páčkou stability a kontroly." # todo: NEW TRANSLATION
 katepanata: "Katepanáta" # todo: NEW TRANSLATION
 katepanata_desc: "Odpoveďou na vojnových susedov je konsolidácia novo dobitých území prostredníctvom rozhodného vojenského velenia. Pochádzajúce zo slova #italic katepánō#! — toho, kto je postavený na vrchu — $katepanata$ stoja nad bežnými témami, zoskupujúc provincie pod jedným veliteľom obdareným civilnou aj vojenskou mocou. Prvýkrát použité s významom v 10. a 11. storočí, od [ShowRegionName('italy_region')] so sídlom v [ShowLocationName('bari')] až po nestále pohraničia [ShowAreaNameWithNoTooltip('armenia_area')] za cisárov ako Basil II, tieto veľké okresy zabezpečili, že vzdialené a sporné krajiny neostali ponechané rozdrobenému vládnutiu. Nech tieto bašty našej vôle slúžia ako zástava proti všetkým, ktorí sa snažia obrať nás o korunu!" # todo: NEW TRANSLATION
 has_completed_fate_of_the_phoenix_disaster: "Úspešne sme dokončili [ShowDisasterName('fate_of_the_phoenix')] [disaster|e]" # todo: NEW TRANSLATION

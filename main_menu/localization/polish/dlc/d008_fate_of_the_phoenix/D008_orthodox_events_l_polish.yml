l_polish:
 d008_orthodox_events.1.title: "Ponuka od [actor.GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 d008_orthodox_events.1.desc: "Delegácia z [actor.GetLongName] sa obrátila na nášho [ROOT.GetCountry.GetGovernment.GetCourtTitle] s ponukou požičať nám jeden zo svojich nádherných kusov náboženskej ikonografie, [target.GetName]. Samozrejme, nebude to úplne zadarmo, no zároveň to prispeje k zblíženiu našich krajín." # todo: NEW TRANSLATION
 d008_orthodox_events.1.a: "Radi prijímame." # todo: NEW TRANSLATION
 d008_orthodox_events.1.b: "Povedzte im, že ho už máme." # todo: NEW TRANSLATION
 d008_orthodox_events.2.title: "Ponuka prijatá" # todo: NEW TRANSLATION
 d008_orthodox_events.2.desc: "Slávni [target_country.GetLongName] sa rozhodli prijať našu veľkorysú ponuku požičať im [target.GetName]. Už nám poslali finančnú náhradu a toto iste prispeje k zblíženiu našich krajín. Dúfajme len, že ikonu vrátia, keď nastane čas." # todo: NEW TRANSLATION
 d008_orthodox_events.2.a: "Medzitým sa o ňu dobre postarajte." # todo: NEW TRANSLATION
 d008_orthodox_events.3.title: "Ponuka odmietnutá" # todo: NEW TRANSLATION
 d008_orthodox_events.3.desc: "Bezbožní blázni z [target_country.GetName] odmietli našu ponuku požičať im [target.GetName]. Ponuku sme urobili v dobrej viere, ale svojím odmietnutím dokázali, že nemajú ani vieru, ani dobrotu. Iba ten, kto popiera samotnú [ROOT.GetCountry.GetReligion.GetName], by sa odvážil odmietnuť [ShowWorkOfArtTypeName('icon')]." # todo: NEW TRANSLATION
 d008_orthodox_events.3.a: "Do pekla s nimi!" # todo: NEW TRANSLATION
 d008_orthodox_events.4.title: "Výpôžička [target_art.GetNameWithNoTooltip] vypršala" # todo: NEW TRANSLATION
 d008_orthodox_events.4.desc: "[ShowWorkOfArtTypeName('icon')], ktorý nám požičal [origin_country.GetName], dosiahol koniec predpísanej doby výpožičky. Je teda čas vrátiť [target_art.GetName] jeho pôvodnému majiteľovi, a očividne to od nás očakávajú. Avšak môžeme tvrdiť, že sme ho 'stratili', a tak nevrátiť." # todo: NEW TRANSLATION
 d008_orthodox_events.4.desc_no_country: "[target_art.GetName] je už nejaký čas v našom vlastníctve. Pôvodne nám bol požičaný, ale keďže pôvodný vlastník už neexistuje ako nezávislý štát, nemáme potrebu ho nikomu vracať." # todo: NEW TRANSLATION
 d008_orthodox_events.4.a: "Vráťme to, ako sa patrí." # todo: NEW TRANSLATION
 d008_orthodox_events.4.b: "Teraz je naše!" # todo: NEW TRANSLATION
 d008_orthodox_events.5.title: "$d008_orthodox_events.4.title$" # todo: NEW TRANSLATION
 d008_orthodox_events.5.desc: "Výpôžička [target_art.GetName] pre [target_country.GetLongName] skončila. Vrátili nám ju s patričným obradom a riadne splnili podmienky našej dohody." # todo: NEW TRANSLATION
 d008_orthodox_events.5.a: "To je to, čo by mal urobiť riadny [ROOT.GetCountry.GetReligion.GetAdjectiveWithNoTooltip] štát." # todo: NEW TRANSLATION
 d008_orthodox_events.6.title: "$d008_orthodox_events.4.title$" # todo: NEW TRANSLATION
 d008_orthodox_events.6.desc: "Výpôžička [target_art.GetName] pre [target_country.GetLongName] skončila. Avšak svine z [target_country.GetName] odmietli jeho vrátenie a predložili len slabé výhovorky." # todo: NEW TRANSLATION
 d008_orthodox_events.6.a: "Za túto urážku zaplatia!" # todo: NEW TRANSLATION
 d008_orthodox_events.7.title: "Sídlo [target_pentarchy.GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 d008_orthodox_events.7.desc: "[target_pentarchy.GetName], jedno zo sídiel Pentarchy, veľkých centier [ShowReligionGroupName('christian')], sa dostalo do našich rúk. [target_patriarch.GetName] teraz zaujme svoje miesto a budeme ohlasovať slávu [ShowReligionAdjective('orthodox')] viery." # todo: NEW TRANSLATION
 d008_orthodox_events.7.a: "Pentarchy bude naše!" # todo: NEW TRANSLATION
 d008_orthodox_events.8.title: "Strata [target_pentarchy.GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 d008_orthodox_events.8.desc: "[target_pentarchy.GetName] nám bol odobraný, spolu s mocou a úctou, ktoré vyžaroval. Opustil nás Boh? [ShowReligionAdjective('orthodox')] cirkev [ROOT.GetCountry.GetName] bude touto stratou určite poškodená." # todo: NEW TRANSLATION
 d008_orthodox_events.8.desc_all_pentarchy: "So stratou [target_pentarchy.GetName] bola Pentarchy rozbitá, keďže už nekontrolujeme všetky jej sídla. Ak chceme zabezpečiť silu viery, musíme znova získať všetkých päť sídiel pod našu zástavu." # todo: NEW TRANSLATION
 d008_orthodox_events.8.a: "Budeme ho musieť získať späť!" # todo: NEW TRANSLATION
 downgrade_pentarchy_modifier_tt: "Už nedostaneme zvýšené efekty z kontrolovaných sídiel Pentarchy" # todo: NEW TRANSLATION
 d008_orthodox_events.9.title: "Pentarchy obnovená" # todo: NEW TRANSLATION
 d008_orthodox_events.9.desc: "S [target_pentarchy.GetName] v našich rukách sú všetkých päť sídiel Pentarchy pod našou kontrolou. To, čo bolo kedysi roztriešteným vzťahom medzi jednotlivými sídlami, je teraz zjednotené pod našou autoritou. Dokonca aj tie, ktoré padli do rúk pohanom a kacírom, boli vrátené do stáda našou milosťou. Cirkev bude opäť zjednotená a naši patriarchovia povedú jej chod." # todo: NEW TRANSLATION
 d008_orthodox_events.9.a: "Cirkev bude opäť zjednotená." # todo: NEW TRANSLATION
 upgrade_pentarchy_modifier_tt: "Účinky kontrolovaných sídiel Pentarchy budú zvýšené" # todo: NEW TRANSLATION
 pentarchy_unlocked_abilities_tt: "Získava prístup k [ShowGenericActionName('mend_schism')] a [ShowGenericActionName('restore_rome_primacy')] [Concept('actions','akciám')|e]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 d008_orthodox_events.10.title: "Zahojenie schizmy" # todo: NEW TRANSLATION
 d008_orthodox_events.10.desc: "Škodlivá schizma hnisala v srdci [ShowReligionGroupName('christian')] po stáročia, odvtedy, čo došlo k rozdeleniu medzi patriarchami [ShowLocationName('rome')] a [ShowLocationName('constantinople')]. Rozdelenie západnej cirkvi len pokrúcilo Kristovo slovo, z čoho sa radoval iba samotný diabol.\n\nTeraz, keď sú všetkých päť sídiel Pentarchy pod našou autoritou, východní a západní patriarchovia sú opäť zjednotení v tej istej cirkvi a zdieľajú rovnaké názory. Hoci stále existuje mnoho kacírov, ktorí odmietajú uznať istotu Pravej cirkvi, je to len otázka času, kým sa všetky ovce vrátia k svojmu skutočnému pastierovi." # todo: NEW TRANSLATION
 d008_orthodox_events.10.a: "Existuje len jedna [ShowReligionGroupAdjectiveWithNoTooltip('christian')] cirkev." # todo: NEW TRANSLATION
 d008_orthodox_events.11.title: "Obnovenie primátu [ShowLocationNameWithNoTooltip('rome')]" # todo: NEW TRANSLATION
 d008_orthodox_events.11.desc: "Pôvod a kolíska Ríše, maják kultúry a civilizácie antiky; dlho ležalo Večné mesto pod závojom temnoty kvôli kacírstvu a barbarstvu. Teraz, opäť v našich spravodlivých rukách, bude jeho sláva obnovená a jeho miesto ako centrum sveta znovu ustanovené.\n\nZ tohto nového [ROOT.GetCountry.GetGovernment.GetAdjective] hlavného mesta bude moc nášho [ROOT.GetCountry.GetFlavorRank] vyžarovať široko-ďaleko a z všetkých kútov sveta pocítia ľudia našu prítomnosť. Sláva [ShowLocationName('rome')]! Sláva [ROOT.GetCountry.GetLongName]!" # todo: NEW TRANSLATION
 d008_orthodox_events.11.a: "#italic Urbs aeterna restituta!#!" # todo: NEW TRANSLATION
 patriarchate_will_relocate_to_rome_tt: "Patriarcha [ShowLocationName('rome')] bude teraz hlavou nášho [GetInternationalOrganizationType('autocephalous_patriarchate').GetName]" # todo: NEW TRANSLATION
 d008_orthodox_events.12.title: "Schizma vyhlásená za uzdravenú" # todo: NEW TRANSLATION
 d008_orthodox_events.12.desc: "[scope:actor.GetName] tvrdí, že vyliečil Veľkú schizmu, zjednotil kresťanstvo pod Konštantínopolom." # todo: NEW TRANSLATION
 d008_orthodox_events.12.a: "Pridajte sa k ortodoxnej viere." # todo: NEW TRANSLATION
 d008_orthodox_events.12.b: "Rím je náš pastier." # todo: NEW TRANSLATION
 d008_orthodox_events.13.title: "Schizma vyhlásená za uzdravenú" # todo: NEW TRANSLATION
 d008_orthodox_events.13.desc: "[scope:actor.GetName] si dovoľuje vyhlásiť, že schizma je uzdravená podľa svojich vlastných podmienok." # todo: NEW TRANSLATION
 d008_orthodox_events.13.a: "Skandál." # todo: NEW TRANSLATION
 d008_orthodox_events.14.title: "Patriarcha sa sťahuje do Ríma" # todo: NEW TRANSLATION
 d008_orthodox_events.14.desc: "[scope:actor.GetName] presťahoval ekumenického patriarchy do Ríma, čím vyhlasuje priame nároky na naše mesto." # todo: NEW TRANSLATION
 d008_orthodox_events.14.a: "Rím nikdy neodstúpime." # todo: NEW TRANSLATION

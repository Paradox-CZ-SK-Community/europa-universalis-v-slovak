l_polish:
 a_legionaries_1: "Raní legionári" # todo: NEW TRANSLATION
 a_legionaries_1_desc: "$a_legionaries_1$ dodržiavajú najstaršie tradície výcviku a disciplíny. Kopije, široké štíty a pevné zoskupenie im umožňujú stáť neochvejne aj keď sa bitka okolo nich mení." # todo: NEW TRANSLATION
 a_legionaries_2: "Legionári" # todo: NEW TRANSLATION
 a_legionaries_2_desc: "Legionári vycvičení v zdokonalenom umení boja zblízka, nesú hádzacie kopije a krátke meče. Ich sila spočíva v stabilných formáciách a vojenskej kultúre neúprosného tréningu." # todo: NEW TRANSLATION
 a_legionaries_3: "Reformovaní legionári" # todo: NEW TRANSLATION
 a_legionaries_3_desc: "$a_legionaries_3$ sú otužení pešiaci, vybavení najlepšími brneniami a zbraňami, ktorí tvoria jadro našich armád." # todo: NEW TRANSLATION
 a_legionaries_4: "Ťažkí legionári" # todo: NEW TRANSLATION
 a_legionaries_4_desc: "$a_legionaries_4$ sú elitní pešiaci, vybavení najlepším brnením a zbraňami. Rovnako ako ťažko obrnené légie starovekého Ríma, tieto jednotky budú kladivom, ktorým prevalcujeme našich nepriateľov." # todo: NEW TRANSLATION
 a_legionaries_5: "Strážni legionári" # todo: NEW TRANSLATION
 a_legionaries_5_desc: "$a_legionaries_5$ stelesňujú najvyšší štandard vojakov v légiach. Vybraní z najlepších kohort, sú poverení vykonávaním kritických misií a ochranou najvyšších štátnych inštitúcií." # todo: NEW TRANSLATION
 a_legionaries_6: "Cisárski legionári" # todo: NEW TRANSLATION
 a_legionaries_6_desc: "Títo $a_legionaries_6$ stoja na vrchole storočí vojenského vývoja. Majstri v oblasti výzbroje aj doktríny, slúžia pri osobnej garde, ktorej samotná prítomnosť dokáže ustáliť chvejné línie." # todo: NEW TRANSLATION
 a_byzantine_cataphracts_2: "Neskoro stredovekí kataphrakti" # todo: NEW TRANSLATION
 a_byzantine_cataphracts_2_desc: "$a_byzantine_cataphracts_2$ sú jazdci i kone pokryté reťazovým brnením, vrhajú sa do boja s dlhými kopijami a mohutnými štítmi. Ich šokové výpady a železná disciplína sú pre našich nepriateľov desivým pohľadom." # todo: NEW TRANSLATION
 a_byzantine_cataphracts_3: "Reformovaní kataphrakti" # todo: NEW TRANSLATION
 a_byzantine_cataphracts_3_desc: "Títo $a_byzantine_cataphracts_3$ spájajú staré cisárske cvičenia s novšími taktikami, kombinujúc kopije s lukmi a bočnými zbraňami. Bojujú ako flexibilný zbor ťažkej jazdy, schopný obťažovať na diaľku a potom doraziť svojich nepriateľov v boji zblízka." # todo: NEW TRANSLATION
 a_byzantine_cataphracts_4: "Ťažkí kataphrakti" # todo: NEW TRANSLATION
 a_byzantine_cataphracts_4_desc: "$a_byzantine_cataphracts_4$ jazdia v vrstvenom brnení, ktoré odráža väčšinu šípov a čepeľí. Organizovaní do klínov elitných bojovníkov, lámu nepriateľské línie opakovanými výpadmi, ktorým len málo formácií odolá." # todo: NEW TRANSLATION
 a_byzantine_cataphracts_5: "Strážni kataphrakti" # todo: NEW TRANSLATION
 a_byzantine_cataphracts_5_desc: "Vybraní z najlepších kopijníkov, $a_byzantine_cataphracts_5$ slúžia ako jazdecká garda trónu a našej metropoly. Ich prítomnosť v každej bitke je zároveň zbraňou i symbolom, povzbudzuje našich vojakov a desí nepriateľov." # todo: NEW TRANSLATION
 a_byzantine_cataphracts_6: "Cisárski kataphrakti" # todo: NEW TRANSLATION
 a_byzantine_cataphracts_6_desc: "$a_byzantine_cataphracts_6$ sú vyvrcholením storočí tradície jazdy: ošľahaní veteráni v brnení, vynikajúco osadnutí a cvičení do dokonalosti. Slúžia ako cisárova osobná garda, schopná rozhodnúť kampane jediným dobre načasovaným útokom." # todo: NEW TRANSLATION
 n_greek_fire_galley_renaissance: "Siphōnes" # todo: NEW TRANSLATION
 n_greek_fire_galley_renaissance_desc: "Vybavené špeciálnymi rúrami na nasadenie gréckeho ohňa, tieto plavidlá rozpúšťajú inferno plameňov na nepriateľské lode a v okamihu z nich spravia žeravé uhlíky. Na krátku vzdialenosť prinášajú len zničenie." # todo: NEW TRANSLATION
 n_greek_fire_galley_discovery: "Advanced Siphōnes" # todo: NEW TRANSLATION
 n_greek_fire_galley_discovery_desc: "Prispôsobenie systému nasadzovania gréckeho ohňa novším typom lodí mu umožňuje stále premieňať nepriateľské lode na popol a zostáva symbolom nášho námorníctva ako celku." # todo: NEW TRANSLATION
 a_greek_fire_renaissance_infantry: "Cheirosiphōnes" # todo: NEW TRANSLATION
 a_greek_fire_renaissance_infantry_desc: "Nielen lode môžu profitovať z gréckeho ohňa; aj naše pozemné jednotky môžu byť vybavené ručnými prístrojmi na vytryskávanie horúcej látky na nepriateľov. Oheň a zničenie roztrhnú nepriateľské rady a otvoria cestu nášmu postupu." # todo: NEW TRANSLATION
 a_greek_fire_discovery_infantry: "Advanced Cheirosiphōnes" # todo: NEW TRANSLATION
 a_greek_fire_discovery_infantry_desc: "Armády a jednotky sa menia, no oblievanie nepriateľov plameňmi a podpálenie zostáva účinnou metódou boja. Grécky oheň si teda zachováva miesto v našich armádach a naďalej je obávaný našimi protivníkmi." # todo: NEW TRANSLATION

l_polish:
 d008_flavor_byz.1.title: "Alchymické sľuby" # todo: NEW TRANSLATION
 d008_flavor_byz.1.entry: "$d008_flavor_byz.1.title$" # todo: NEW TRANSLATION
 d008_flavor_byz.1.desc: "V minulosti bol grécky oheň známy po celom Stredozemí a ešte ďalej a medzi námornými silami našich nepriateľov vzbudzoval taký strach, že nadobudol legendárny status. Jeho schopnosť horieť silnejšie než ktorýkoľvek plameň aj na vode a nemožnosť uhasiť ho bežnými prostriedkami znamenala, že dokázal premeniť akúkoľvek loď na popol takmer okamžite. Jeho výroba bola u nás vždy prísne strážené tajomstvo, ale bohužiaľ aj ono časom zaniklo a my už nedokážeme vyrábať grécky oheň tak, ako kedysi.\n\nTeraz nás jeden z našich najvýznamnejších alchymistov, [target_artist.GetName], uisťuje, že [target_artist.GetSheHe] dokáže obnoviť stratený recept a zopakovať jeho výrobu. Ak by to bola pravda, mohli by sme opäť výzbrojiť naše flotily týmto smrteľným ohňom. Naše [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] aj [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')] sú touto správou nadšené, hoci na jeho skutočný vývoj [target_artist.GetNameWithNoTooltip] potrebuje od nás isté prostriedky na [target_artist.GetHerHis] experimenty." # todo: NEW TRANSLATION
 d008_flavor_byz.1.a: "[target_artist.GetSheHe|U] dostane všetko, čo [target_artist.GetSheHe] potrebuje!" # todo: NEW TRANSLATION
 d008_flavor_byz.1.b: "Naše námorníctvo je už dosť silné a minulé fantázie nepotrebujeme." # todo: NEW TRANSLATION
 d008_flavor_byz.1.a.tt: "[target_artist.GetName] bude viesť experimenty pri hľadaní receptúry gréckeho ohňa" # todo: NEW TRANSLATION
 d008_flavor_byz.2.title: "Pátranie po ohni" # todo: NEW TRANSLATION
 d008_flavor_byz.2.desc: "Už je to nejaký čas, čo sa [target_artist.GetName] uzavrel(a) do svojho laboratória, aby hľadal(a) recept na grécky oheň, ale doteraz dokázal(a) vyprodukovať len sériu nočných explózií a pár pripálených obočiek. Zdá sa, že jeho/jej zjavná neobratnosť už mnohých privádza do pochybností, či sa mu/jej vôbec podarí v úsilí uspieť, zatiaľ čo on(a) nás uisťuje, že je na pokraji prelomového objavu a že k tomu potrebuje len ešte trochu času a peňazí." # todo: NEW TRANSLATION
 d008_flavor_byz.2.a: "Dobre, poskytnite [target_artist.GetHerHim] dodatočné prostriedky." # todo: NEW TRANSLATION
 d008_flavor_byz.2.b: "Máme už dosť takýchto fantázií." # todo: NEW TRANSLATION
 d008_flavor_byz.2.a.tt: "[target_artist.GetName] bude pokračovať v hľadaní receptúry gréckeho ohňa" # todo: NEW TRANSLATION
 d008_flavor_byz.3.title: "Grécky oheň" # todo: NEW TRANSLATION
 d008_flavor_byz.3.desc: "Mnohé noci obyvateľov [ROOT.GetCountry.GetCapital.GetName] rušili výbuchy spôsobené experimentmi [target_artist.GetName]. Mnohokrát sa pri nich [target_artist.GetHerselfHimself] popálil(a), no všetky tie útrapy priniesli plody. Po mnohých pokusoch a omyloch sa [target_artist.GetSheHe] podarilo spoľahlivo replikovať grécky oheň tak, ako je popísaný v historických záznamoch. Teraz môžeme rozšíriť jeho výrobu a vyzbrojiť naše lode. Aj keď presný recept a spôsob výroby ostanú tajomstvom, musíme sa postarať, aby sme tento raz nezabudli, ako ho vyrábať." # todo: NEW TRANSLATION
 d008_flavor_byz.3.a: "Opäť raz [ROOT.GetCountry.GetAdjectiveWithNoTooltip] námorníctvo zapáli more!" # todo: NEW TRANSLATION
 unlocked_greek_fire_tt: "Získame prístup k [ShowUnitDefinitionName('n_greek_fire_galley_renaissance')], [ShowUnitDefinitionName('n_greek_fire_galley_discovery')], [ShowUnitDefinitionName('a_greek_fire_renaissance_infantry')] a [ShowUnitDefinitionName('a_greek_fire_discovery_infantry')] [unit_types|e]" # todo: NEW TRANSLATION
 d008_flavor_byz.4.title: "Pátranie [target.GetNameWithNoTooltip] sa skončilo" # todo: NEW TRANSLATION
 d008_flavor_byz.4.desc: "Predčasná smrť [target.GetName] bohužiaľ spôsobila, že [target.GetHerHis] pátranie po gréckom ohni zostalo nedokončené. [target.GetHerHis|U] žiaci a ďalší významní alchymisti prezreli [target.GetHerHis] poznámky, aby zistili, či sa [target.GetHerHis] výskum dá zachrániť a pokračovať, ale bohužiaľ sa zdá, že [target.GetHerHis] experimenty sa točili v kruhu bez niečoho konkrétneho, za čo by sa dalo chytiť. Grécky oheň tak navždy zostane záhadou uzavretou v dejinách." # todo: NEW TRANSLATION
 d008_flavor_byz.4.a: "Ach... no, čo už..." # todo: NEW TRANSLATION

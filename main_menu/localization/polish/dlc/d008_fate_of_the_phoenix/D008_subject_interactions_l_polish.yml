 pronoia: "Prónoia" # todo: NEW TRANSLATION
 pronoia_desc: "Dôležitou súčasťou administratívnej organizácie [GetCountry('BYZ').GetName] boli Prónoiai, ktorí boli pôvodne dočasne vymenovaní ako výbercovia daní. Zmena doby ich však prinútila zmeniť aj svoje povinnosti. Premenení na dedičné úradné miesta, ktoré poskytujú vojenskú podporu a zároveň vyberajú peniaze z územia, naďalej slúžia ako predĺženie vôle cisára." # todo: NEW TRANSLATION

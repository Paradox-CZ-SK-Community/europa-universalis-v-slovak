l_polish:
 civic_religion_aspect: "Občianske náboženstvo" # todo: NEW TRANSLATION
 civic_religion_aspect_desc: "Uctievanie bohov je to isté ako udržiavanie blahobytu štátu. Náboženské praktiky a obrady sú teda občianskou povinnosťou, ktorú musíme zachovávať, aby sme zabezpečili prosperitu našej polis." # todo: NEW TRANSLATION
 hero_cult_aspect: "Kulty hrdinov" # todo: NEW TRANSLATION
 hero_cult_aspect_desc: "Naša história je plná mocných postáv, ktoré formovali našu spoločnosť a charakter. Boli to smrteľní synovia bohov, ľudia s mimoriadnymi schopnosťami, ktorí často stretli tragický osud a ktorí ochraňovali a viedli našich predkov pri zakladaní národa, ktorým sme dnes. Je našou povinnosťou uctievať ich a učiť sa z ich príbehov." # todo: NEW TRANSLATION
 dionysian_mysteries_aspect: "Dionýzove mystériá" # todo: NEW TRANSLATION
 dionysian_mysteries_aspect_desc: "Rituály, tanec a hudba zasvätených do mystérií Dionýza prinášajú členom oslobodenie a úľavu bez ohľadu na spoločenské triedy. Smrť a znovuzrodenie boha sa odrážajú v cykle viniča, ktorý rastie zo zeme, stáva sa vínom a napokon je vypitý zasvätenými na slávu Dionýza." # todo: NEW TRANSLATION
 eleusinian_mysteries_aspect: "Eleusínske mystériá" # todo: NEW TRANSLATION
 eleusinian_mysteries_aspect_desc: "Zasvätení Eleusínskych mystérií nasledujú mýtus o únose Persefony od jej matky Demeter kráľom podsvetia Hádesom a jej následnom oslobodení a klamstve. Pre zasvätených tento mýtus predstavuje cyklus rastu a znovuzrodenia všetkého rastlinného života a večnosť života, ktorý preteká z jednej generácie do druhej." # todo: NEW TRANSLATION
 samothracian_mysteries_aspect: "Samothracké mystériá" # todo: NEW TRANSLATION
 samothracian_mysteries_aspect_desc: "Na ostrove Samothrake prosperoval počas vrcholu helenizmu mysteriózny kult; preslávil sa tým, že prijímal každého, kto sa chcel pridať, bez ohľadu na spoločenskú triedu. Hovorí sa, že mnohí mýtickí hrdinovia, ako Heracles, Jason či Orpheus, boli zasvätení na Samothrake. Môžeme tieto mystériá zozbierať a zrekonštruovať z pozostatkov a ruín a priviesť tento kult späť do bývalej slávy." # todo: NEW TRANSLATION
 olympiad_aspect: "Olympijské hry" # todo: NEW TRANSLATION
 olympiad_aspect_desc: "Olympijské hry sú oslavu bohov a demonštráciou sily a jednoty našej krajiny. Účasť na hrách je občianskou povinnosťou, ktorá prináša slávu našim športovcom." # todo: NEW TRANSLATION
 mithraic_mysteries_aspect: "Mithraistické mystériá" # todo: NEW TRANSLATION
 mithraic_mysteries_aspect_desc: "Zasvätení v mithraistických mystériách, ktorí sa nazývali Syndexioi, si počas vrcholu Rímskej ríše získali veľkú obľubu v Ríme a Západnej Ríši. Ich rituály, zhromaždenia a hostiny prebiehali v tajných podzemných chrámoch, no môžeme ich priniesť na svetlo a oživiť ich tradície pre dobro nášho ľudu." # todo: NEW TRANSLATION
 imperial_cult_aspect: "Cisársky kult" # todo: NEW TRANSLATION
 imperial_cult_aspect_desc: "Tak ako boli starí cisári Ríma kedysi považovaní ľudom a senátom za božské, aj náš vládca a jeho dynastia sú považovaní za podobné. Ich veličnosť, majestát a autorita ich jasne označujú nie len za božsky zmocnených, ale rovno za bohov." # todo: NEW TRANSLATION
 dii_familiares_aspect: "Dii Familiares" # todo: NEW TRANSLATION
 dii_familiares_aspect_desc: "Domáci a familiárni bohovia zohrávajú pre ľudí v našej krajine veľmi dôležitú úlohu. Chránia a ovplyvňujú všetko, čo sa deje na území človeka — bežne ide o domácnosť, no môže to zahŕňať aj cesty, susedstvá alebo celé mestá." # todo: NEW TRANSLATION
 mos_maiorum_aspect: "Mos Maiorum" # todo: NEW TRANSLATION
 mos_maiorum_aspect_desc: "Nezapisovaný kódex, ktorý riadil životy Rimanov od staroveku do vrcholu ríše — 'Cesta predkov.' Táto sústava tradícií a praktík definovala, čo znamená byť Rimanom a ako sa správať v domácnosti i na verejnosti." # todo: NEW TRANSLATION
 monism_aspect: "Monizmus" # todo: NEW TRANSLATION
 monism_aspect_desc: "Filozofi nášho obrodenia tvrdia, že celé bytie vychádza z Jedného — jedného transcendujúceho princípu, z ktorého vychádzajú všetci bohovia a všetky veci. Tradičný panteón sa stáva alegóriou; bohovia sú aspektmi Jedného. Veštiace znamenia strácajú svoj osobitný účinok, ale viera v Jedno presakuje do každého aktu správy vecí verejných." # todo: NEW TRANSLATION
 the_thunderer_omen: "Hromovládca" # todo: NEW TRANSLATION
 the_thunderer_omen_desc: "Nebá sa hnevajú s bleskami a hromom, a každý, kto sa nám postaví, sa zachvie strachom." # todo: NEW TRANSLATION
 supreme_of_gods_omen: "Najvyšší z bohov" # todo: NEW TRANSLATION
 supreme_of_gods_omen_desc: "Žeravé slnko signalizuje, že máme priazeň najsilnejšieho zo všetkých bohov. Nikto nebude pochybovať o našej sláve!" # todo: NEW TRANSLATION
 monarch_of_the_sky_omen: "Panovník nebies" # todo: NEW TRANSLATION
 monarch_of_the_sky_omen_desc: "Kŕdeľ vtákov vzlietne, odpovedajúc [ShowGodName('zeus_god')] a nesúc jeho vôľu." # todo: NEW TRANSLATION
 omnipotence_of_heaven_omen: "Všemocnosť neba" # todo: NEW TRANSLATION
 omnipotence_of_heaven_omen_desc: "Sme skutočne v prítomnosti [ShowGodName('zeus_god')], cítiť jeho moc a ako preňho nie je nič nemožné." # todo: NEW TRANSLATION
 the_liberator_omen: "Osloboditeľ" # todo: NEW TRANSLATION
 the_liberator_omen_desc: "Sila [ShowGodName('zeus_god')] pomáhala našim predkom proti útlaku Perzie; oslobodí nás z našich okov." # todo: NEW TRANSLATION
 the_bountiful_one_omen: "Hojný" # todo: NEW TRANSLATION
 the_bountiful_one_omen_desc: "Všetci, ktorí pozrú nahor na [ShowGodName('zeus_god')], zdieľajú jeho moc a dostanú sa k jeho hojnosti." # todo: NEW TRANSLATION
 the_holy_omen: "Svätý" # todo: NEW TRANSLATION
 the_holy_omen_desc: "Niet nič svätejšie ako byť v prítomnosti najvyššieho z božstiev a mať jeho priazeň." # todo: NEW TRANSLATION
 king_of_all_omen: "Kráľ všetkých" # todo: NEW TRANSLATION
 king_of_all_omen_desc: "[ShowGodName('zeus_god')] je najvyššia autorita medzi božstvami, rovnako ako náš vládca je nad naším ľudom." # todo: NEW TRANSLATION
 immortal_omen: "Nesmrtelný" # todo: NEW TRANSLATION
 immortal_omen_desc: "Ako možno zabiť boha? S ochranou [ShowGodName('zeus_god')] ako môžu naše vojská zlyhať?" # todo: NEW TRANSLATION
 splendor_omen: "Lesk" # todo: NEW TRANSLATION
 splendor_omen_desc: "Jasné nebo ukazuje, že sláva [ShowGodName('zeus_god')] je nepopierateľná. Priazeň, ktorú nám preukáže, budú vidieť všetci po svete." # todo: NEW TRANSLATION
 mother_of_love_omen: "Matka lásky" # todo: NEW TRANSLATION
 mother_of_love_omen_desc: "Láska prúdi z [ShowGodName('aphrodite_god')] a naše obyvateľstvo sa bude tejto láske tešiť." # todo: NEW TRANSLATION
 the_foam_born_omen: "Zrodená z peny" # todo: NEW TRANSLATION
 the_foam_born_omen_desc: "Morská pena, z ktorej sa zrodila [ShowGodName('aphrodite_god')], umýva naše pobrežia a ona s láskou sprevádza naše lode." # todo: NEW TRANSLATION
 the_seductress_omen: "Zviedka" # todo: NEW TRANSLATION
 the_seductress_omen_desc: "Láska a zvádzanie sú doménou [ShowGodName('aphrodite_god')], a jej umenie a priazeň pritiahnu mnohých k nám." # todo: NEW TRANSLATION
 giver_of_joy_omen: "Dárkyňa radosti" # todo: NEW TRANSLATION
 giver_of_joy_omen_desc: "Niet nič blaženejšie ako byť v prítomnosti bohyne krásy a mať jej priazeň." # todo: NEW TRANSLATION
 nurturer_of_children_omen: "Opatrovateľka detí" # todo: NEW TRANSLATION
 nurturer_of_children_omen_desc: "Niet väčšieho prejavu bohynej lásky než láska k deťom; jej materská náklonnosť sa rozširuje na nás všetkých." # todo: NEW TRANSLATION
 the_beautiful_omen: "Krásna" # todo: NEW TRANSLATION
 the_beautiful_omen_desc: "Ako najkrajšia bohyňa, [ShowGodName('aphrodite_god')] si získa mnoho priaznivcov, a tak ich budeme mať aj my s jej priaznou." # todo: NEW TRANSLATION
 the_secretive_omen: "Tajomná" # todo: NEW TRANSLATION
 the_secretive_omen_desc: "Nie každá láska musí byť verejná. Diskrétnosť a tajnosť sú tiež nástroje bohyne." # todo: NEW TRANSLATION
 the_harmonizer_omen: "Usteľovačka harmónie" # todo: NEW TRANSLATION
 the_harmonizer_omen_desc: "Láska [ShowGodName('aphrodite_god')] je rovnako rozdelená medzi všetkých, a tak bude aj naša láska k ľudu." # todo: NEW TRANSLATION
 the_lover_of_laughter_omen: "Milovníčka smiechu" # todo: NEW TRANSLATION
 the_lover_of_laughter_omen_desc: "Tvár [ShowGodName('aphrodite_god')] je vždy usmiata; taká budú i naše tváre." # todo: NEW TRANSLATION
 the_desired_omen: "Žiaduce" # todo: NEW TRANSLATION
 the_desired_omen_desc: "Ako najkrajšia bohyňa [ShowGodName('aphrodite_god')] vzbudzuje túžbu u všetkých. Mať jej priazeň pritiahne iných." # todo: NEW TRANSLATION
 tempest_omen: "Búrka" # todo: NEW TRANSLATION
 tempest_omen_desc: "Božský hnev rozvíri vody a spustí búrky, ktoré skúšajú aj najodvážnejších námorníkov." # todo: NEW TRANSLATION
 lord_of_the_sea_omen: "Pán mora" # todo: NEW TRANSLATION
 lord_of_the_sea_omen_desc: "Panovanie nad morami znamená nadvládu nad svetom." # todo: NEW TRANSLATION
 protector_of_horses_omen: "Ochranca koní" # todo: NEW TRANSLATION
 protector_of_horses_omen_desc: "S priaznou božského otca všetkých koní naše vlastné kone zažijú rozmach a získajú silu." # todo: NEW TRANSLATION
 wielder_of_the_trident_omen: "Držiteľ trojzubca" # todo: NEW TRANSLATION
 wielder_of_the_trident_omen_desc: "Niet známejšej zbrane než zbraň boha mora; dokazuje, že viacpríponový útok je najlepšou voľbou." # todo: NEW TRANSLATION
 earth_shaker_omen: "Tŕpavec zeme" # todo: NEW TRANSLATION
 earth_shaker_omen_desc: "Ako uderil do zeme, aby stvoril prameň, tak budú potrestaní nepriatelia, ktorí vkročia na našu pôdu." # todo: NEW TRANSLATION
 leader_of_the_nymphs_omen: "Vodca nýmf" # todo: NEW TRANSLATION
 leader_of_the_nymphs_omen_desc: "Priazeň [ShowGodName('poseidon_god')] prináša priazeň jeho nýmf, ktoré požehnajú naše vody a pramene." # todo: NEW TRANSLATION
 the_watcher_omen: "Strážca" # todo: NEW TRANSLATION
 the_watcher_omen_desc: "Pohľad [ShowGodName('poseidon_god')] je všadeprítomný nad všetkými moriami a vodami; nič neunikne jeho zraku." # todo: NEW TRANSLATION
 the_graceful_omen: "Pôvabný" # todo: NEW TRANSLATION
 the_graceful_omen_desc: "V mori a vlnách je krása; správne rozjímanie nad nimi prináša krásu srdcu." # todo: NEW TRANSLATION
 master_of_the_waves_omen: "Pán vĺn" # todo: NEW TRANSLATION
 master_of_the_waves_omen_desc: "Nikto nebude plaviť more bez dovolenia [ShowGodName('poseidon_god')]." # todo: NEW TRANSLATION
 dark_blue_haired_omen: "Tmavomodrovovlasý" # todo: NEW TRANSLATION
 dark_blue_haired_omen_desc: "Vlny sú modré vlasy samotného boha a naše lode budú s jeho priaznou rýchlo plávať." # todo: NEW TRANSLATION
 messenger_omen: "Posol" # todo: NEW TRANSLATION
 messenger_omen_desc: "Krídlaté päty vždy doručia akúkoľvek správu rýchlo a bezpiečne." # todo: NEW TRANSLATION
 golden_wand_omen: "Zlatý prút" # todo: NEW TRANSLATION
 golden_wand_omen_desc: "Kadukéus bol používaný na oddelenie dvoch hadov, ale to, čo oddeľuje, zároveň spája." # todo: NEW TRANSLATION
 god_of_travelers_omen: "Boh cestovateľov" # todo: NEW TRANSLATION
 god_of_travelers_omen_desc: "Všetci cestovatelia a putujúci obchodníci sa obracajú na [ShowGodName('hermes_god')] pre bezpečie a ochranu." # todo: NEW TRANSLATION
 protector_of_merchants_omen: "Ochranca obchodníkov" # todo: NEW TRANSLATION
 protector_of_merchants_omen_desc: "Pod bdelým zrakom [ShowGodName('hermes_god')] budú obchodníci cestovať bezpečne a prinášať bohatstvo cez našu zem." # todo: NEW TRANSLATION
 wing_footed_omen: "Krídlonohý" # todo: NEW TRANSLATION
 wing_footed_omen_desc: "Priazeň [ShowGodName('hermes_god')] umožní našim silám pohybovať sa tak rýchlo, ako samotný boh." # todo: NEW TRANSLATION
 trickster_omen: "Šibal" # todo: NEW TRANSLATION
 trickster_omen_desc: "Zmena vetrov ukazuje, že aj [ShowGodName('hermes_god')] má vrtkavú povahu a že všetko je vystavené zmene a klamu." # todo: NEW TRANSLATION
 patron_of_thieves_omen: "Patrón zlodejov" # todo: NEW TRANSLATION
 patron_of_thieves_omen_desc: "Rýchlosť možno použiť k dobru alebo zlu, ale v každom prípade je to cenná vlastnosť." # todo: NEW TRANSLATION
 president_of_games_omen: "Vlastník hier" # todo: NEW TRANSLATION
 president_of_games_omen_desc: "Priazeň [ShowGodName('hermes_god')] padá na atletické hry, ktoré nám prinášajú zábavu aj zdravú činnosť." # todo: NEW TRANSLATION
 guardian_of_the_gates_omen: "Strážca brán" # todo: NEW TRANSLATION
 guardian_of_the_gates_omen_desc: "Všetky cesty a cestujúci skôr či neskôr prejdú bránou, ktorá im buď umožní prechod, alebo ho zablokuje." # todo: NEW TRANSLATION
 giver_of_wealth_omen: "Darca bohatstva" # todo: NEW TRANSLATION
 giver_of_wealth_omen_desc: "Pod záštitou [ShowGodName('hermes_god')] nie je obchod len pohybom tovaru, ale aj prúdením bohatstva." # todo: NEW TRANSLATION
 throng_of_battle_omen: "Zástup bitky" # todo: NEW TRANSLATION
 throng_of_battle_omen_desc: "V každom konflikte, v každom boji prebýva [ShowGodName('ares_god')], a jeho vôľa určuje výsledok." # todo: NEW TRANSLATION
 insatiable_at_war_omen: "Nenasýtený v boji" # todo: NEW TRANSLATION
 insatiable_at_war_omen_desc: "[ShowGodName('ares_god')] sa raduje z bitky; čím dlhšia a krvavejšia, tým väčšia jeho priazeň." # todo: NEW TRANSLATION
 slayer_of_men_omen: "Vrah ľudí" # todo: NEW TRANSLATION
 slayer_of_men_omen_desc: "Hnev [ShowGodName('ares_god')] bude sprevádzať našich mužov v boji a jeho sila bude v ich zbraniach." # todo: NEW TRANSLATION
 plague_of_mankind_omen: "Mor ľudstva" # todo: NEW TRANSLATION
 plague_of_mankind_omen_desc: "Nikto si nemôže dovoliť postaviť sa bohu vojny a očakávať, že sa dožije ďalšieho dňa." # todo: NEW TRANSLATION
 warrior_omen: "Bojovník" # todo: NEW TRANSLATION
 warrior_omen_desc: "Jednoduché vyvražďovanie nestačí na uspokojenie boha boja; len slávny súboj je dostatočný." # todo: NEW TRANSLATION
 audacious_omen: "Odvážny" # todo: NEW TRANSLATION
 audacious_omen_desc: "Vrhnúť sa do boja, aby sme zasadili úder nepriateľom, zaručí priazeň [ShowGodName('ares_god')] a získa jeho milosť." # todo: NEW TRANSLATION
 blood_soaked_omen: "Preliaty krvou" # todo: NEW TRANSLATION
 blood_soaked_omen_desc: "Krv našich nepriateľov bude zliata a obetovaná bohu, ktorý to žiada." # todo: NEW TRANSLATION
 malignant_omen: "Zlovestný" # todo: NEW TRANSLATION
 malignant_omen_desc: "Žiadna stratégia nie je príliš podlý, ak má zabezpečiť zničenie našich nepriateľov." # todo: NEW TRANSLATION
 indestructible_omen: "Nedobytný" # todo: NEW TRANSLATION
 indestructible_omen_desc: "[ShowGodName('ares_god')] drží nielen kopiju na útok nepriateľa, ale aj štít na vlastnú ochranu." # todo: NEW TRANSLATION
 fickle_lord_of_war_omen: "Rozmarný pán vojny" # todo: NEW TRANSLATION
 fickle_lord_of_war_omen_desc: "Vojna a bitky sa môžu otočiť v ktorýkoľvek moment, ale priazeň [ShowGodName('ares_god')] zabezpečí, že sa otočia v náš prospech." # todo: NEW TRANSLATION
 unseen_hand_omen: "Neviditeľná ruka" # todo: NEW TRANSLATION
 unseen_hand_omen_desc: "Žiadny plán nepadá len náhodou; nebo inšpiruje velenie invázií k zlým rozhodnutiam. Hliadky sú zavádzané do pascí, zásobovacie linky sú prerušené a kapitáni zavádzajú." # todo: NEW TRANSLATION
 unwavering_omen: "Neochvejný" # todo: NEW TRANSLATION
 unwavering_omen_desc: "Ako [ShowGodName('athena_god')] stojí pyšne a neochvejne, tak ani my nebudeme ovplyvnení únavou." # todo: NEW TRANSLATION
 she_who_fights_in_front_omen: "Tá, čo bojuje vpredu" # todo: NEW TRANSLATION
 she_who_fights_in_front_omen_desc: "Rýchlo sa postaviť nepriateľovi a čeliť mu je najrýchlejší spôsob, ako ho skoncovať." # todo: NEW TRANSLATION
 the_industrious_omen: "Pracovitá" # todo: NEW TRANSLATION
 the_industrious_omen_desc: "Diligencia a nasadenie v práci sú najlepší spôsob, ako dosiahnuť zisk a pozitívne výsledky." # todo: NEW TRANSLATION
 the_judge_omen: "Sudca" # todo: NEW TRANSLATION
 the_judge_omen_desc: "Pod bdelým zrakom a múdrosťou [ShowGodName('athena_god')] žiadny zločin neprejde bez trestu a žiadny nevinný nebude niesť nespravodlivosť." # todo: NEW TRANSLATION
 the_chieftain_of_war_omen: "Vojvodca vojny" # todo: NEW TRANSLATION
 the_chieftain_of_war_omen_desc: "Ako mravce sa budú potulovať bez cilov bez čiary, za ktorou majú nasledovať, tak sa armády rozptýlia bez riadneho velenia a vedenia." # todo: NEW TRANSLATION
 teacher_of_the_waves_omen: "Učiteľ vĺn" # todo: NEW TRANSLATION
 teacher_of_the_waves_omen_desc: "[ShowGodName('poseidon_god')] možno vládne vlnám, ale [ShowGodName('athena_god')] ich skrotila loďami." # todo: NEW TRANSLATION
 protector_of_the_anchorage_omen: "Ochranca kotviska" # todo: NEW TRANSLATION
 protector_of_the_anchorage_omen_desc: "Ako majster stavby lodí, ako by naše plavidlá neboli v bezpečí pod priaznou [ShowGodName('athena_god')]?" # todo: NEW TRANSLATION
 the_bright_eyed_omen: "S jasným pohľadom" # todo: NEW TRANSLATION
 the_bright_eyed_omen_desc: "Pod znakom sovy sme skutočne príjemcami priazne a múdrosti [ShowGodName('athena_god')]." # todo: NEW TRANSLATION
 the_armed_one_omen: "Ozbrojená" # todo: NEW TRANSLATION
 the_armed_one_omen_desc: "Ozbrojená od narodenia, [ShowGodName('athena_god')] nám ukazuje, že vždy byť pripravený na boj je najlepšia stratégia." # todo: NEW TRANSLATION
 hellenism_religion.1.title: "[target_god.GetNameWithNoTooltip] sa usmieva na nás" # todo: NEW TRANSLATION
 hellenism_religion.1.desc: "V týchto pokojnejších dňoch bohovia neodvrátili svoj zrak od nás. Znaky sa objavujú v zvláštnych zhode okolností, v náhlych úderoch šťastia a v rutine, ktorá sa šíri cez [ROOT.GetCountry.GetGovernment.GetCourtTitle].\n\nKňazi vyhlasujú, že [target_god.GetName] sa usmieva na našu [ROOT.GetCountry.GetFlavorRank] a na nášho milovaného [target_character.GetNameWithNoTooltip]. Zdá sa, že naše šťastie sa obracia a obety, ktoré sme obetovali, konečne priniesli ovocie v našom osude!" # todo: NEW TRANSLATION
 hellenism_religion.1.a: "Prijímame požehnanie." # todo: NEW TRANSLATION
 fertile_ruler_and_family_tt: "[target_character.GetName] a [Concept('consort','konzort panovníka')|e] budú mať zvýšenú [Concept('fertility','plodnosť')|e]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 hellenism_religion.2.title: "Orol [target_character.GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 hellenism_religion.2.desc: "Čo povedať o [target_character.GetName], ktorého taktické majstrovstvo je žiarivým príkladom vojenských tradícií, ktoré vyznávali predkovia našej [ROOT.GetCountry.GetFlavorRank]? Málokto sa môže zaradiť vedľa takých postáv ako Odysseus, Jason alebo Ajax čo do prefíkanosti, vytrvalosti a odvahy.\n\nNapriek tomu je [target_character.GetShortNameWithNoTooltip] hrdým produktom našej oddanosti [ShowReligionAdjective('hellenism_religion')] koreňom, pravým orlom bojiska!" # todo: NEW TRANSLATION
 hellenism_religion.2.a: "Bude [target_character.GetSheHe] bojovať v tieni?" # todo: NEW TRANSLATION
 hellenism_religion.2.b: "Pošlite [target_character.GetHerHim] učiť do akadémie!" # todo: NEW TRANSLATION
 hellenism_religion.3.title: "Filozofické krídlo [target_location.GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 hellenism_religion.3.desc: "Odkiaľ pochádza ľudská duša? Čo nás čaká po smrti? Bolo by lepšie žiť ako bezchvostý dvojnohý tvor? Takéto horúce otázky zamestnávajú preplnené mysle intelektuálov a filozofov [ShowBuildingTypeName('university')] v [target_location.GetName].\n\nNedávno fakulta získala podporu bohatého miestneho mecenáša, ktorý teraz žiada o zvýšenie financovania a tvrdí, že zariadenie môže skutočne pomôcť šíriť inovatívne a pokrokové myšlienky." # todo: NEW TRANSLATION
 hellenism_religion.3.a: "Pokým neučia žiadneho Diogenesa..." # todo: NEW TRANSLATION
 hellenism_religion.3.b: "Nemôžu si jednoducho predstaviť, že majú financie?" # todo: NEW TRANSLATION
 hellenism_religion.4.title: "Talizman pre [target_character_2.GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 hellenism_religion.4.desc: "Nepriatelia i protivníci usilovne plánujú našu skazu. Pozícia dedičstva je však bezpečná, pokiaľ žije [target_character_2.GetName]. Dieťa drží budúcnosť celej našej [ROOT.GetCountry.GetFlavorRank] vo svojich krehkých rukách.\n\nPosiate božským žiarením olympských bohov je [target_character_2.GetShortNameWithNoTooltip] predurčený ku veľkosti, v tom sme si istí. Jeden z našich dvoranov, mystik [target_character_3.GetWomanMan] menom [target_character_3.GetName], ponúkol odísť s ochranným talizmanom. Hovorí sa, že obsahuje jedinú kvapku božskej esencie, schopnú odvrátiť zlá, kým malý [target_character_2.GetShortNameWithNoTooltip] nedosiahne dospelosť." # todo: NEW TRANSLATION
 hellenism_religion.4.a: "Poďakujte [target_character_3.GetShortNameWithNoTooltip] v mene [target_character_2.GetShortNameWithNoTooltip]." # todo: NEW TRANSLATION
 hellenism_religion.4.b: "Také poverčivosti nás nezaujímajú!" # todo: NEW TRANSLATION
 talisman_tt: "Talizman darovaný malému [target_character_2.GetName] #italic môže#! chrániť [target_character_2.GetHerHim] pred chorobami súvisiacimi s [Concept('events','udalosťami')|e] a poľovníckymi nehodami" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 target_character_3_is_declined_tt: "Ponuka [target_character_3.GetName] je zdvorilo odmietnutá" # todo: NEW TRANSLATION
 hellenism_religion.5.title: "[target_province.GetNameWithNoTooltip] oslavuje [target_god.GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 hellenism_religion.5.desc: "Radostné správy prichádzajú z [target_province.GetName], kde ľudia vyšli do ulíc oslavovať [target_god.GetName]. V bezprecedentnom pobožnom geste sa miestni organizovali do vlastných festivalov, túžiac osláviť svoje nedávne šťastie.\n\nNa deň sú aj bremená vlády ľahšie. Bohovia sú uctení, davy sú hlučné a oddanosť sa šíri provinciou ako ambrozia na Olymp." # todo: NEW TRANSLATION
 hellenism_religion.5.a: "Nech provincia oslavuje." # todo: NEW TRANSLATION
 every_pop_in_target_province_gains_10_satisfaction_tt: "Naši [Concept('pops','populácie')|e] v [target_province.GetName] získajú [ShowNamedValue('pop_satisfaction_mild_bonus')|+=2%] [Concept('pop_satisfaction','spokojnosť populácie')|e]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 hellenism_religion.6.title: "V najjasnejší deň" # todo: NEW TRANSLATION
 hellenism_religion.6.desc: "Vláda [target_character.GetName] dosiahla bezprecedentné výšky pod pobožným vedením olympských bohov. Dobré politiky, zdieľanie bohatstva a všeobecne stabilné a mierové obdobie sú len niektoré z darov, ktoré nám bohovia poskytli. Naozaj, toto je zlatá éra, ktorú si ľud užíva, keď spievajú meno [target_character.GetShortNameWithNoTooltip], nesmrteľniac [target_character.GetHerHim] vedľa iných legendárnych postáv ako Heracles a Pericles." # todo: NEW TRANSLATION
 hellenism_religion.6.a: "Zamerajme našu prosperitu na správu!" # todo: NEW TRANSLATION
 hellenism_religion.6.b: "Nech naša diplomatická váha vládne svetu." # todo: NEW TRANSLATION
 hellenism_religion.6.c: "Naši nepriatelia budú zničení!" # todo: NEW TRANSLATION
 hellenism_religion.7.title: "Avatar [ShowGodNameWithNoTooltip('ares_god')]" # todo: NEW TRANSLATION
 hellenism_religion.7.desc: "Oheň, síra a desivý zvuk krvavých výkrikov sprevádzajú [target_character.GetName] na [target_character.GetHerHis] ceste. Už od detstva známy ako schopný bojovník, toto [target_character.GetWomanMan] mnohokrát preukázal dar končiť životy svojich nepriateľov.\n\nTeraz, označený vojskom za avatara [ShowGodName('ares_god')], je odsúdený prebádať krajinu a siahať po spustošení v mene našej [ROOT.GetCountry.GetFlavorRank]." # todo: NEW TRANSLATION
 hellenism_religion.7.a: "[target_character.GetSheHe|U] vie, že víťazi sú tí, ktorí obetujú všetko." # todo: NEW TRANSLATION
 hellenism_religion.7.b: "Nemôžeme riskovať uvoľnenie takej katastrofálnej sily..." # todo: NEW TRANSLATION
 hellenism_religion.8.title: "Eposy histórie [ShowCultureNameWithNoTooltip('greek_culture')]" # todo: NEW TRANSLATION
 hellenism_religion.8.desc: "Eposy Homéra už dávno slúžia ako vodítko pre rozvoj kultúry a gramotnosti, slúžiac ako zachované drahokamy našej tradície.\n\nNa počesť takého dedičstva vystúpil [target_character.GetName] s návrhom na sponzorstvo, aby sa vydali štúdie a diela o Iliade a Odysei. [target_character.GetSheHe|U] chce uctiť našu slávnu minulosť výmenou za povolenie hlbšie preskúmať legendárne stránky." # todo: NEW TRANSLATION
 hellenism_religion.8.a: "[ROOT.GetCountry.Custom('common_string_ok')]" # todo: NEW TRANSLATION
 hellenism_religion.8.b: "$jurchen_confederation_events.3.b$" # todo: NEW TRANSLATION
 hellenism_religion.9.title: "[target_province.GetNameWithNoTooltip] hojnosti" # todo: NEW TRANSLATION
 hellenism_religion.9.desc: "Je zjavné, že [target_province.GetName] má priazeň bohov, čo je viditeľné z rastúcej prosperity v celej provincii. Nedávno k nám prišli prieskumníci a miestni developeri s plánmi koncentrovať to bohatstvo v mestských centrách provincie na úkor okolitých dedín. Takýto krok by posilnil urbanizačné úsilie, ale pripravil by miestnych o prebytočné výhody." # todo: NEW TRANSLATION
 hellenism_religion.9.a: "Bohatstvo pre ľud!" # todo: NEW TRANSLATION
 hellenism_religion.9.b: "Koncentrujme naše úsilie." # todo: NEW TRANSLATION
 pops_in_aforementioned_provinces_weak_satisfaction_tt: "Naši [Concept('pops','populácie')|e] v spomínaných [Concept('provinces','provinciách')|e] získajú [ShowNamedValue('pop_satisfaction_weak_bonus')|+=2%] [Concept('pop_satisfaction','spokojnosť populácie')|e]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 hellenism_religion.10.title: "Požehnanie [ROOT.GetCountry.Custom('GetDemeterMomName')]" # todo: NEW TRANSLATION
 hellenism_religion.10.desc: "Už nejaký čas sklady obilnín v [target_market.GetName] zažívajú hojnosť. To je iste znamenie, že [ROOT.GetCountry.Custom('GetDemeterMomName')], bohyně úrody, sa na nás usmieva. Naše novonadobudnuté bohatstvo je najnovším prejavom božskej priazne. Miestni prišli žiadať o rozdelenie zvyšného obživy, zatiaľ čo kňazi navrhujú ďalší prídel na obete." # todo: NEW TRANSLATION
 hellenism_religion.10.a: "Dajte to ľudu." # todo: NEW TRANSLATION
 hellenism_religion.10.b: "Bohovia to dostanú." # todo: NEW TRANSLATION
 Demeter_latin_name: "Ceres" # todo: NEW TRANSLATION
 Demeter_base_name: "Demeter" # todo: NEW TRANSLATION
 hellenism_religion.11.title: "[target_god.GetNameWithNoTooltip] je nespokojný" # todo: NEW TRANSLATION
 hellenism_religion.11.desc: "Pod nemilosrdným zrakom božstva sa zdá, že [target_god.GetName] je s nami veľmi nespokojný! Nočné temné znamenia, pretrvávajúce tiene a stále rastúci pocit skazy sa šíria medzi našimi ľuďmi. Nevieme, čo sme urobili, aby sme rozzúrili tak mocné božstvo, a jedinou cestou k znovuzískaniu ich priazne je pokorne sa skláňať pred božstvom." # todo: NEW TRANSLATION
 hellenism_religion.11.a: "Taký je život." # todo: NEW TRANSLATION
 hellenism_religion.11.b: "Okamžite zorganizujte rozsiahlu obetu." # todo: NEW TRANSLATION
 hellenism_religion.12.title: "Monštruózne narodenie" # todo: NEW TRANSLATION
 hellenism_religion.12.desc: "Ticho padlo na [ROOT.GetCountry.GetGovernment.GetCourtTitle]. V dojčenských izbách v rámci [ROOT.GetCountry.GetGovernment.GetAdjective] rezidencie sa narodilo dieťa [target_character_1.GetName] za sprievodu panikárskych modlitieb a bezsenných nocí, dieťa, ktoré prináša so sebou osudnú črtu.\n\n[ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] to volajú znamením. Služobníci tomu hovoria kliatba. Naši rivali tomu povedia slabosť. Napriek tomu [target_character_2.GetShortName] stále dýcha a osud takého potomka môže ešte rozhodnúť naše potomstvo..." # todo: NEW TRANSLATION
 hellenism_religion.12.a: "Blázni! [target_character_2.GetShortNameWithNoTooltip] je len dieťa!" # todo: NEW TRANSLATION
 hellenism_religion.12.b: "Nemôžeme riskovať boží hnev." # todo: NEW TRANSLATION
 hellenism_religion.13.title: "Korumpovaný kňaz" # todo: NEW TRANSLATION
 hellenism_religion.13.desc: "Bohovia môžu byť veční, no ich služobníci sú z mäsa a krvi. Prišli k nám správy, že [target_character.GetName] zneužíva svoj svätý úrad ako súkromnú truhlicu, zbiera dary a mince tam, kde by mali plynúť len obety.\n\nAk zasiahneme, [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] bude výjsť o urážke a ponížení. Ak sa pozeráme inam, učíme každého intrikána v našej [ROOT.GetCountry.GetFlavorRank], že pobožnosť je len ďalší obchod, čím riskujeme uraziť aj samotných bohov." # todo: NEW TRANSLATION
 hellenism_religion.13.a: "Jeho/jej [target_character.GetHerHis|U] chamtivosť nás všetkých pohubí!" # todo: NEW TRANSLATION
 hellenism_religion.13.b: "Nechajme to bez povšimnutia." # todo: NEW TRANSLATION
 hellenism_religion.14.title: "[target_province.GetNameWithNoTooltip] zanedbáva [target_god.GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 hellenism_religion.14.desc: "Správy z [target_province.GetName] sú znepokojujúce. Obrady [target_god.GetName] sú zanedbávané, obety sa odkladajú a veriaci si sťažujú, že dvere chrámu už nie sú otvorené ako kedysi.\n\nČi už ide o lenivosť, chudobu alebo tichý odpor, to je nepodstatné. Keď sa o boha hovorí, že je ignorovaný, každé nešťastie si rýchlo nájde božského vinníka. Kňazi žiadajú akciu a [target_province.GetNameWithNoTooltip] čaká na náš rozsudok." # todo: NEW TRANSLATION
 hellenism_religion.14.a: "Vynútme si ich oddanosť silou." # todo: NEW TRANSLATION
 hellenism_religion.14.b: "Nevládneme bičom." # todo: NEW TRANSLATION
 pops_in_target_province_mild_pop_satisfaction_malus_tt: "Naši [Concept('pops','populácie')|e] v [target_province.GetName] získajú [ShowNamedValue('pop_satisfaction_mild_penalty')|+=2%] [Concept('pop_satisfaction','spokojnosť populácie')|e]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 riots_destroy_temple_desc: "Dav sa stáva násilným a chrám sa stáva terčom. Na úsvite zostane len spálený kameň." # todo: NEW TRANSLATION
 riots_cause_minimal_damage_desc: "V uliciach je nepokoj a kričanie, ale najhoršie sa vyhne." # todo: NEW TRANSLATION
 hellenism_religion.15.title: "Spor o veštenie" # todo: NEW TRANSLATION
 hellenism_religion.15.desc: "Pri mocnom brade [ShowGodName('zeus_god')] sú veštci navzájom v sporoch! Dve výklady tých istých znakov, dve úplne odlišné varovania, a obidve odovzdané s rovnakou istotou.\n\n[ROOT.GetCountry.GetGovernment.GetCourtTitle] stojí pred dilemou. Čo musia ľudia myslieť, keď je náš [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] tak jasne rozdelený? Stratili sme svoje spôsoby? Nech už je interpretácia týchto znamení akákoľvek, isté je, že znášame následky..." # todo: NEW TRANSLATION
 hellenism_religion.15.a: "Máme dosť zvrzganí starcov!" # todo: NEW TRANSLATION
 hellenism_religion.16.title: "Hnev bohov" # todo: NEW TRANSLATION
 hellenism_religion.16.desc: "Vo našich sieňach vypukol spor a kňazi trvajú na tom, že bohovia nás sledujú. Poukazujú na naše rozpŕchnuté krajiny, na naše tenké uchopenie vzdialených miest a šeptajú, že pýcha pozýva božskú nápravu.\n\nAk nám bohovia chcú pripomenúť našu krehkosť, nepošlú zdvorilý list. Pošlú počasie, oheň a hrôzu a vyberú si miesto, kde to najviac bolí." # todo: NEW TRANSLATION
 hellenism_religion.16.a: "Nech búrka rýchlo prejde." # todo: NEW TRANSLATION
 hellenism_religion.17.title: "Pandorina škatuľa" # todo: NEW TRANSLATION
 hellenism_religion.17.desc: "Zvláštna zvedavosť sa dostala do [target_province.GetName], prechádzajúc z ruky do ruky s vedomými úsmevmi a hlúpymi odvahami. Niektorí tvrdia, že je neškodná. Iní trvajú na tom, že je prekliata, vec, ktorá provokuje nedočkavých a trestá pyšných.\n\nČi je skutočne prekliata alebo len iskrou paniky, nešťastie sa má tendenciu stať skutočnosťou, keď v to dostatočne verí veľa ľudí. Niektorí miestni kňazi dokonca hlásili, že škatuľa nesie zvláštnu tvár pripomínajúcu bolestný výraz a je pokrytá krvavými škvrnami." # todo: NEW TRANSLATION
 hellenism_religion.17.a: "Poverčivosť nás nezaujíma." # todo: NEW TRANSLATION
 hellenism_religion.17.b: "Zaplaťte, aby ju uložili pod zámok." # todo: NEW TRANSLATION
 locations_and_pops_in_target_province_suffer_minimal_damage_tt: "[target_province.GetName] a miestni budú ušetrení božského trestu" # todo: NEW TRANSLATION
 hellenism_religion.18.title: "V najtmavšiu noc" # todo: NEW TRANSLATION
 hellenism_religion.18.desc: "Noc sa zdá byť dlhšia, než má byť. V každom kúte našej [ROOT.GetCountry.GetFlavorRank] ľudia hovoria o skaze, hlade, porážke a o tom, že bohovia odvracajú tváre. Je zrejmé, že sme v turbulentnom období, či už z našich vlastných zlyhaní alebo z rozhnietenia olympských bohov.\n\n[ROOT.GetCountry.GetGovernment.GetRulerOrRegent.GetName] nemôže uniknúť týmto šepotám. Keď je naša základňa otrasená, aj najsilnejšia koruna sa cíti ťažko." # todo: NEW TRANSLATION
 hellenism_religion.18.a: "Sme stratení v zúfalstve." # todo: NEW TRANSLATION
 hellenism_religion.18.b: "Obeta, nech bohovia vypočujú." # todo: NEW TRANSLATION
 hellenism_religion.19.title: "Strach a hlad" # todo: NEW TRANSLATION
 hellenism_religion.19.desc: "Panika sa šíri rýchlejšie než akákoľvek nákaza. Zlá úroda tu, nešťastie tam a zrazu každý sused hrá rolu veštca s pochmúrnym príbehom. Napriek našim najlepším snahám upokojiť obyvateľstvo sa zdá, že zoznam vnímaných zlých znamení stačí na rozhýrenie celých komunít do paniky.\n\nKňazi tvrdia, že strach treba viesť, aby neprerástol v vzdor. Ľudia v [target_province.GetName] hľadajú u nás istotu, aj keď musí byť kúpená." # todo: NEW TRANSLATION
 hellenism_religion.19.a: "Nech to zem ponesie." # todo: NEW TRANSLATION
 hellenism_religion.19.b: "Ponúknime udobrovanie a zmiernime úder." # todo: NEW TRANSLATION
 sacrifice_to_the_gods: "Udobrovanie bohov" # todo: NEW TRANSLATION
 hellenism_religion.20.title: "Bohovia nesúhlasia s vojnou" # todo: NEW TRANSLATION
 hellenism_religion.20.desc: "Nie všetci bohovia sa tešia zo zabíjania. Ako [target_war.GetName] pokračuje, kňazi varujú, že nebo chladne voči našej veci. Na rozdiel od [ShowGodName('ares_god')], iní bohovia nepodporujú každý konflikt bez ohľadu na odôvodnenie.\n\nVojaci možno povzbudzujú naše zástavy, ale ľud je unavený a každá ťažkosť je teraz pripisovaná božskému rozhorčeniu. V takých časoch aj víťazstvo môže pôsobiť ako trest, dlhá a neistá destinácia..." # todo: NEW TRANSLATION
 hellenism_religion.20.a: "Pretrpíme ich nevôľu." # todo: NEW TRANSLATION
 hellenism_religion.21.title: "[target_location.GetNameWithNoTooltip] zanedbáva obrady" # todo: NEW TRANSLATION
 hellenism_religion.21.desc: "Je pochopiteľné, že ľudia zabúdajú na svoje povinnosti voči bohom, najmä v obdobiach pokoja alebo prosperity. V [target_location.GetName] obradov ubúda a sú polovičné. Procesie sú menšie, obety menej početné a staré piesne sa spievajú bez presvedčenia.\n\nKňazi žiadajú, aby sme niekoho príkladne potrestali. Ak mesto nebude uctievať bohov dobrovoľne, možno ich naučí strach. Tak či onak, nemôžeme dovoliť, aby naša viera zakrpela." # todo: NEW TRANSLATION
 hellenism_religion.21.a: "Nech obyčajný ľud spomenie." # todo: NEW TRANSLATION
 hellenism_religion.21.b: "Elita si príliš zvykla." # todo: NEW TRANSLATION
 hellenism_religion.21.c: "Nech sú a prijmime riziko." # todo: NEW TRANSLATION
 pops_go_unpunished_gods_angry_tt: "Neudelenie trestu určite rozhnije bohov" # todo: NEW TRANSLATION
 hellenism_religion.22.title: "Ornitomantické praktiky v hlavnom meste" # todo: NEW TRANSLATION
 hellenism_religion.22.desc: "[target_character.GetName] sa stal predmetom rečí v hlavnom meste. Napriek svojmu výstrednému odevu tvrdí, že má hlbokú schopnosť čítať budúcnosť. S vtákmi, kosťami a bezodnou istotou [target_character.GetSheHe] tvrdí, že číta vôľu bohov, či už k dobrému, alebo k zlému.\n\nNiektorí v [ROOT.GetCountry.GetGovernment.GetCourtTitle] sa tomu smejú. Iní potichu platia, dúfajúc, že aj hlúpy príznak môže byť užitočný, fascinujúca novinka." # todo: NEW TRANSLATION
 hellenism_religion.22.a: "Kvačkaj ďalej, [target_character.GetShortNameWithNoTooltip]!" # todo: NEW TRANSLATION
 hellenism_religion.22.b: "To je hanba." # todo: NEW TRANSLATION
 birds_divinations_come_true_desc: "Znaky sa zosúladia a šťastie nasleduje. [ROOT.GetCountry.GetGovernment.GetCourtTitle] to nazýva dôkazom." # todo: NEW TRANSLATION
 the_divinations_lie_desc: "Ništ z toho. Vtáky zostávajú vtákmi a [ROOT.GetCountry.GetGovernment.GetCourtTitle] zostáva podráždené." # todo: NEW TRANSLATION
 hellenism_religion.23.title: "Rozšírenie náboženských priestorov" # todo: NEW TRANSLATION
 hellenism_religion.23.desc: "Kňazi prišli s ambicióznym návrhom, ktorý by preformoval samotné sväté miesta. Chrámy, ako ten v [target_location.GetName], sa majú rozšíriť, ich sály rozšíriť a nádvorie vyzdobiť, aby veriaci opäť pocítili veľkoleposť bohov na svojich pleciach.\n\nKamene sa však samy nepohnú a remeselníci nepracujú iba pre modlitby. Či už toto rozšírenie financujeme z pokladnice, alebo prinútíme ľud, aby prispel, náklady sa prejavia a bohovia si všimnú, akým spôsobom ich zaplatíme." # todo: NEW TRANSLATION
 hellenism_religion.23.a: "Financujme rozšírenie poriadne." # todo: NEW TRANSLATION
 hellenism_religion.23.b: "Nech ľud nesie bremeno." # todo: NEW TRANSLATION
 hellenism_religion.24.title: "Deisidaimonia" # todo: NEW TRANSLATION
 hellenism_religion.24.desc: "V [ROOT.GetCountry.GetGovernment.GetCourtTitle] sa usadila rastúca úzkosť a najviac sa jej drží [target_character.GetName]. Malé znamenia sa stávajú veľkými, sny sa menia na varovania a aj nevinné zhody okolností sa považujú za posolstvá zhora.\n\nTakýto strach môže byť užitočný, ak rodí opatrnosť, ale môže tiež skaziť vôľu konať. Ak sa [target_character.GetShortNameWithNoTooltip] týchto myšlienok nezbaví, naše vládnutie môže byť čoskoro riadené skôr poverou než rozumom." # todo: NEW TRANSLATION
 hellenism_religion.24.a: "Lepšie opatrne než ľahkomyseľne." # todo: NEW TRANSLATION
 hellenism_religion.24.b: "Musíme myslieť nad poverou." # todo: NEW TRANSLATION
 hellenism_religion.25.title: "Obety pre vojnu" # todo: NEW TRANSLATION
 hellenism_religion.25.desc: "Vojna má schopnosť pohltiť všetko a aj najskúsenejší vojaci sa začnú obracať k nebesám, keď sa osud zdá neistý. Kňazi trvajú na tom, že náš boj v [target_war.GetName] nebude rozhodnutý len oceľou a že bohovia musia byť uctení, ak chceme pretrvať, čo príde.\n\nNavrhuje sa drahá obeta, určená na to, aby zapôsobila na božstvo a posilnila ducha ľudu. Ak odmietneme, môžeme ušetriť mince, ale riskujeme, že pochybnosti sa usadia v radoch a bohovia budú počuť len naše mlčanie." # todo: NEW TRANSLATION
 hellenism_religion.25.a: "Nešetri." # todo: NEW TRANSLATION
 hellenism_religion.25.b: "Vyhráme bez ich divadla." # todo: NEW TRANSLATION
 we_will_win_the_ongoing_conflict_without_gods_tt: "Nebudeme sa spoliehať na božské poverčivosti, aby sme vyhrali prebiehajúci konflikt" # todo: NEW TRANSLATION
 hellenism_religion.26.title: "[target_god.GetNameWithNoTooltip] vypočuj našu prosbu" # todo: NEW TRANSLATION
 hellenism_religion.26.desc: "Kadidlo bolo husté, hymny hlasné a oltáre neboli ochudobnené o dary. Kňazi tvrdia, že naša oddanosť dosiahla uši Olympu a že bohovia teraz zostávajú natoľko blízko, že môžu odpovedať vďaka týmto snahám.\n\nBožskosť však nikdy neodpustí bez podmienky. Ak teraz požiadať o požehnanie, musíme prijať, že [target_god.GetName] môže požadovať cenu a že odpoveď môže zmeniť smer našej [ROOT.GetCountry.GetFlavorRank] spôsobmi, ktoré nedokážeme predvídať." # todo: NEW TRANSLATION
 hellenism_religion.26.a: "Nech [target_god.GetNameWithNoTooltip] odpovie." # todo: NEW TRANSLATION
 hellenism_religion.26.b: "Nevyvoláme ich súd." # todo: NEW TRANSLATION
 gods_reward_our_piety_tt: "[target_god.GetName] odmení našu pobožnosť [Concept('gold','dukáty')|e]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 gods_imbue_stability_tt: "Priazeň [target_god.GetName] zvyšuje našu [Concept('stability','stabilitu')|e]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 gods_sent_capable_character_tt: "Sprostredníctvom [target_character_2.GetName] sa zjaví [target_god.GetName]" # todo: NEW TRANSLATION
 hellenism_religion.27.title: "Filozofov paradox" # todo: NEW TRANSLATION
 hellenism_religion.27.desc: "Ostrousta filozofka menom [target_character.GetName] začala prednášať v [ROOT.GetCountry.GetGovernment.GetCourtTitle], premieňajúc istotu na pochybnosť každou vetou. Dvory sa schádzajú, polovične pobavené a polovične znepokojené, keď aj jednoduché pravdy sú potiahnuté na kúsky ako vlákna z rúcha.\n\nMúdrosť môže byť dar, ale aj nechcená vec, keď sa odmieta skláňať. Ak tomuto mysliteľovi dovolíme, [ROOT.GetCountry.GetGovernment.GetCourtTitle] môže zosilnieť múdrosťou, alebo sa môže stať nepokojné, lebo myšlienky majú zvyk šíriť sa mimo siení, ktoré ich prvotne obsahujú." # todo: NEW TRANSLATION
 hellenism_religion.27.a: "Nech diskusia pokračuje." # todo: NEW TRANSLATION
 hellenism_religion.27.b: "Dosť hádaniek. Pošlite [target_character.GetHerHim] preč." # todo: NEW TRANSLATION
 hellenism_religion.28.title: "Múdrosť [ShowGodNameWithNoTooltip('athena_god')]" # todo: NEW TRANSLATION
 hellenism_religion.28.desc: "V časoch pokoja utícha ambícia a vzrastá rozvaha; kňazi často spomínajú [ShowGodName('athena_god')]. Tvrdia, že múdrosť nie je len cnosť, ale zbraň, ktorá sa najlepšie kuje, keď [ROOT.GetCountry.GetFlavorRank] nie je rušená vojnou.\n\nPredložený návrh je nákladný, no rozumný a sľubuje poriadok tam, kde je plytvanie, a jasno tam, kde je pochybnosť. Ak odmietneme, môžeme si udržať mince, no [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] nám nezabudne, že sme sa vzdali rady bohyne." # todo: NEW TRANSLATION
 hellenism_religion.28.a: "Zaplaťme cenu múdrosti." # todo: NEW TRANSLATION
 hellenism_religion.28.b: "Nech nám žiadna bohyňa nemyslí za nás." # todo: NEW TRANSLATION
 because_athena_omen_active_desc: "Keďže je momentálne aktívne [Concept('omen','omen')|e] [ShowGodName('athena_god')], jeho účinok sa škáluje podľa našej [Concept('religious_unity','náboženskej jednoty')|e]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 if_athena_omen_was_active_tt: "Ak by bolo momentálne aktívne [Concept('omen','omen')|e] [ShowGodName('athena_god')], bonus tejto [Concept('event_option','možnosti udalosti')|e] by bol silnejší" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 our_denial_angers_the_clergy_tt: "Naše odmietnutie určite rozzúri [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')]" # todo: NEW TRANSLATION
 hellenism_religion.29.title: "[target_god.GetNameWithNoTooltip] žiada obetu" # todo: NEW TRANSLATION
 hellenism_religion.29.desc: "Kňazi prichádzajú s vážnymi tvárami a naliehavými hlasmi, trvajúc na tom, že nad našou [ROOT.GetCountry.GetFlavorRank] visí božské rozhorčenie. Tvrdia, že znaky sú jasné a že len obety [target_god.GetName] môžu obnoviť priazeň skôr, než sa nešťastie zmení na katastrofu.\n\nZlato je najjednoduchšia ponuka a môže byť daná bez váhania, no Olympus zriedka stačí len mince. Ak zvolíme drahšiu obeť, môžeme získať väčšiu priazeň, no zároveň zanecháme rany v zemi a ľud si zapamätá, kto to nariadil." # todo: NEW TRANSLATION
 hellenism_religion.29.a: "Prineste zlaté na oltár." # todo: NEW TRANSLATION
 hellenism_religion.29.b: "Nech utrpí zem sama." # todo: NEW TRANSLATION
 hellenism_religion.29.c: "Odmietame túto požiadavku." # todo: NEW TRANSLATION
 hellenism_religion.30.title: "Kult žoldnéra" # todo: NEW TRANSLATION
 hellenism_religion.30.desc: "Zvláštne šepoty stúpajú z [target_province.GetName], nesené cestovateľmi a opakované nervóznymi miestnymi. V tieni vznikol kult oddaný ideálu žoldnérstva, chváliaci silu nad všetkým a zhromažďujúci nasledovníkov tajnými rituálmi a sľubmi ochrany. Jeden z ich vedúcich, [target_character.GetName], sa postavil do popredia a túži vstúpiť do politickej scény v našej [ROOT.GetCountry.GetFlavorRank] a hovoriť v ich mene ako bývalý mysthios, tvrdíac, že ich oddanosť môže byť obrátená v náš prospech.\n\nAvšak šepoty v tieňoch prezrádzajú tajný plán kultu dominancie, nenásytnú túžbu po moci. Ak ich privítame, môžeme získať vplyv tam, kde je viera slabá, ale môžeme tiež vpustiť skrytú hnilobu do srdca nášho [ROOT.GetCountry.GetGovernment.GetCourtTitle]." # todo: NEW TRANSLATION
 hellenism_religion.30.a: "Pustíme ich Dnu a budeme ich pozorne sledovať." # todo: NEW TRANSLATION
 hellenism_religion.30.b: "Vyhneme ich do tieňov." # todo: NEW TRANSLATION
 cult_operates_shadows_tt: "Kult bude pokračovať v činnosti z tieňov..." # todo: NEW TRANSLATION
 hellenism_religion.empty: "" # todo: NEW TRANSLATION
 hellenism_religion.32.title: "Pramäť bytia" # todo: NEW TRANSLATION
 hellenism_religion.32.desc: "Filozof v [ROOT.GetCountry.GetGovernment.GetCourtTitle] dokončil dielo jedinečnej ambície. V meranom a neúnavnom slohu argumentuje, že prvotný princíp — zdroj, z ktorého všetci bohovia a celé stvorenie vychádzajú, ako svetlo z nevyčerpateľného slnka — nie je boh medzi bohmi, ale samotné podložie božstva. Tradičný panteón zostáva reálny, trvá na tom, ale každý boh je aspekt, emanácia toho jediného nepojmenovateľného zdroja: poriadok do inteligencie, inteligencia do duše, duša do hmoty.\n\nTento traktát sa už kopíruje po celom [ROOT.GetCountry.GetGovernment.GetCourtTitle]. Jeho myšlienky sú živé a budú sa šíriť, či už zasiahneme, alebo nie." # todo: NEW TRANSLATION
 hellenism_religion.32.a: "Zadajte kópie a široko ich rozdávajte." # todo: NEW TRANSLATION
 hellenism_religion.32.b: "Nech myšlienka stojí na vlastných zásluhách." # todo: NEW TRANSLATION
 hellenism_religion.33.title: "Kresťanská otázka" # todo: NEW TRANSLATION
 hellenism_religion.33.desc: "Biskup značného učenia prichádza do [ROOT.GetCountry.GetGovernment.GetCourtTitle], neprichádzajúc s mečom ani so sťažnosťami — iba otázky. [target_character.GetName] venuje [target_character.GetHerHis] život platónskej filozofii a s tichou presvedčivosťou tvrdí, že Boh kresťanov a prvý princíp filozofov sú jedno a to isté. Trojica, ako tvrdí [target_character.GetSheHe], je jednoducho triádou Jedného, Nous a Duše, vyjadrenou inými slovami.\n\nTento argument má svoju váhu, a [target_character.GetSheHe] hovorí s opatrným pokojom toho, kto už počul každý protiargument. Či sa zapojíme alebo odmietneme, [target_character.GetHerHis] návšteva neostane bez povšimnutia v [ROOT.GetCountry.GetCapital.GetName] ani mimo nej." # todo: CHANGED
 hellenism_religion.33.a: "Privítajme dialóg. Myšlienky nie sú nákazlivé." # todo: NEW TRANSLATION
 hellenism_religion.33.b: "Odmietame zrovnávanie. Prvotný princíp nie je ich Boh." # todo: NEW TRANSLATION
 hellenism_religion.34.title: "Svetová duša" # todo: NEW TRANSLATION
 hellenism_religion.34.desc: "Filozofi [ROOT.GetCountry.GetGovernment.GetCourtTitle] hovoria o Svetovej duši — tej emanácii prvotného princípu, ktorá preteká všetkým živým stvorením, oživuje polia a rieky, telo a dych. Dvaja veľkí bohovia sú podľa nich lepšie chápateľní nie ako vládci mora a neba, ale ako spárované aspekty tejto Duše: sila, ktorá pohybuje všetkým a vždy sa vracia k svojmu zdroju.\n\nV [target_province.GetName], kde boli ročné obdobia štedré, zdá sa, že ľudia tento argument cítia až v kosťiach. Zem je veľkorysá a filozofi hovoria, že je to Opatrovateľstvo ukázané — Svetová duša v harmónii s Jedným." # todo: NEW TRANSLATION
 hellenism_religion.34.a: "Zadajte diela o starostlivosti. Starať sa o zem znamená starať sa o Dušu." # todo: NEW TRANSLATION
 hellenism_religion.34.b: "Zverejnite teologickú deklaráciu. Nech je doktrína napísaná." # todo: NEW TRANSLATION
 hellenism_religion_34_work_of_art: "Psyche Kosmou" # todo: NEW TRANSLATION
 hellenism_religion_34_work_of_art_desc: "Teologická štúdia o platónskej filozofii, ktorá tvrdí, že Svetová duša je oživujúcou silou všetkých živých vecí, pretekajúcou prírodou a vracajúcou sa k svojmu zdroju v Jednom." # todo: NEW TRANSLATION
 hellenism_religion.35.title: "Vzrastajúca duša" # todo: NEW TRANSLATION
 hellenism_religion.35.desc: "Zvesti dorazili do [ROOT.GetCountry.GetGovernment.GetCourtTitle], že [target_character.GetName], filozof, ktorého dielo potichu formovalo myslenie generácie, umiera. V posledných týždňoch [target_character.GetSheHe] neprestajne učil — nie z kníh, ale priamym kontemplovaním, opisujúc troje stupňov vylepšenia: najprv obrátenie duše od hmoty, potom zosúladenie rozumových schopností s Nous a nakoniec — a tu [target_character.GetHerHis] hlas klesá na takmer šepot — moment zjednotenia s Jedným samým, za hranicou mysle, za hranicou bytia.\n\nVládca bol pozvaný byť svedkom. [target_character.GetName] žiadal len, aby učenie nebolo stratené." # todo: NEW TRANSLATION
 hellenism_religion.35.a: "Záznam a distribúcia [target_character.GetHerHis] posledných slov." # todo: NEW TRANSLATION
 hellenism_religion.35.b: "Založte školu nesúcu meno [target_character.GetHerHis]." # todo: NEW TRANSLATION
 target_character_ascends_to_the_one_tt: "[target_character.GetName] odchádza pokojne, povedal všetko, čo sa dalo povedať." # todo: NEW TRANSLATION
 hellenism_religion.36.title: "Olympskí restaurátori" # todo: NEW TRANSLATION
 hellenism_religion.36.desc: "Nie všetci v [ROOT.GetCountry.GetFlavorRank] sa zmierili s novou teológiou. Frakcia medzi [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] — verejne vedená [target_character.GetName] — sa hlasnejšie ozýva so svojimi námietkami. Ich argument je jednoduchý a cíti sa v útrobách skôr než v mysli: ľud potrebuje Dia, Athénu, Aresa a Poseidona. Nie symboly. Nie emanácie. Nie aspekty nepojmenovateľného princípu, ktorý nemožno osloviť alebo potešiť. Potrebujú bohov Olympu, s ich tvárami, chrámami a hladom po obetiach.\n\nAbstraktné Jedno, tvrdí, nemôže počuť. Starí bohovia mohli. [target_character.GetName] otvorene žiada zrušenie monistickej doktríny a návrat k tradičnému uctievaní." # todo: NEW TRANSLATION
 hellenism_religion.36.a: "Bráňte doktrínu. Uspíšte frakciu." # todo: NEW TRANSLATION
 hellenism_religion.36.b: "Umožnite formálnu disputáciu. Nech obe strany prehovoria." # todo: NEW TRANSLATION
 hellenism_religion.36.c: "Zrušte monistickú doktrínu. Vráťte sa k olympskej viere." # todo: NEW TRANSLATION

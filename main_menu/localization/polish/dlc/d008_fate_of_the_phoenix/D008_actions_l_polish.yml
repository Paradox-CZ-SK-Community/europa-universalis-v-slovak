 vinalia_rustica_tt: "Festival Vinalia Rustica sa sústreďuje na zber hrozna, rast zeleniny a plodnosť. Koná sa na počesť [ShowGodName('zeus_god')] aj [ShowGodName('aphrodite_god')]." # todo: NEW TRANSLATION

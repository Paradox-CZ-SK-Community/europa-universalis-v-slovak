 explanation_roman_festivals_tt: "[ShowReligionAdjective('hellenism_religion')] ľudia oslavujú množstvo slávností venovaných svojim božstvám. Každý mesiac sa oslavy líšia a my získame rôzne účinky v závislosti od spôsobu ich priebehu." # todo: NEW TRANSLATION
 compitalia_tt: "Festival Compitalia sa koná na počesť #italic Lares Compitales#!, domácich božstiev križovatiek." # todo: NEW TRANSLATION
 lupercalia_tt: "Festival Lupercalia sa sústreďuje na zdravie a plodnosť a očistenie mesta." # todo: NEW TRANSLATION
 quinquatria_tt: "Quinquatria je festival na počesť bohyne [ShowGodName('athena_god')]." # todo: NEW TRANSLATION
 fordicidia_tt: "Fordicidia je festival, ktorý sa sústreďuje na plodnosť, poľnohospodárstvo a chov zvierat. Počas tohto podujatia obetujú účastníci tehotnú kravu bohyni zeme, #italic Tellus#!." # todo: NEW TRANSLATION

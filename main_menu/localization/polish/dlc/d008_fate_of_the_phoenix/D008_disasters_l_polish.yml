l_polish:
 fate_of_the_phoenix: "Osud Fénixa" # todo: NEW TRANSLATION
 fate_of_the_phoenix_desc: "Posledné storočia boli svedkami postupného úpadku nášho slávneho [GetCountry('BYZ').GetFlavorRank]. Neustále spory, vnútorná nestabilita a pretrvávajúci [ShowSituationName('rise_of_the_ottomans')] predznamenávajú katastrofu pre nás a náš ľud, zatiaľ čo [GetCountry('SER').GetName] a [GetCountry('BUL').GetName] vkrádajú na našu severnú hranicu. Surovou silou a vytrvalosťou musíme skoncovať s korupciou a obnoviť autoritu koruny, kým nebude príliš neskoro..." # todo: NEW TRANSLATION
 remember_no_turk_tt: "Žiadna iná [country|e] so svojím [capital|e] v [ShowRegionName('anatolia_region')], okrem nás, nevlastní viac než #Y 100#! [locations|e] vrátane svojich [subjects|e] a je buď [ShowCultureName('turkish_culture')] alebo [ShowCultureName('turkoman_culture')], alebo nemá [ShowGovernmentReformName('anatolian_beylik')] [government_reform|e]" # todo: NEW TRANSLATION
 fate_of_the_phoenix.1.title: "Osud Fénixa" # todo: NEW TRANSLATION
 fate_of_the_phoenix.1.desc_a: "Kedysi múry [ShowLocationName('constantinople')] označovali stred sveta. Odtiaľ prúdili zákon, viera a cisársky poriadok — dedičstvo nárokované samotnou $ROM$. Teraz na nás toto dedičstvo ťažko dolieha.\n\nRoky intríg, prázdnych víťazstiev a rozplývajúcej sa autority zanechali [ROOT.GetCountry.GetFlavorRank] oslabený na duchu, ak už nie na mene. Mimo našich hraníc sa trpezlivo zhromažďujú nové mocnosti hladné po moci, zatiaľ čo vo vnútri úrady hnijú z nepozornosti. Náš ľud si zaslúži lepší spôsob života, hodný lesku a bohatstva našich slávnych predkov!" # todo: NEW TRANSLATION
 fate_of_the_phoenix.1.desc_b: "Prišla správa z [ShowLocationName('constantinople')]. Zdá sa, že starobylé cisárske sídlo je znepokojené, jeho autorita sa rozpadá pod ťarchou rozkolu a úpadku. Po celé generácie formoval osud [target_location.GetRank.GetName] poriadok [ShowReligionGroupAdjective('christian')] krajín v [ShowRegionName('balkan_region')], spájajúc naše dejiny vierou, každý meč väčšinou držal druhý v pochve.\n\nTeraz, keď jeho úchop slabne, rovnováha, ktorá kedysi riadila naše hranice, sa stáva neistou. Niektorí z našich vplyvných rodín naliehajú na opatrnosť, varujúc, že pád takejto opory rozruší všetkých, ktorí zdieľajú jeho obrady. Iní hovoria priamočiarejšie: staré záruky miznú a to, čo bolo kedysi urovnané tradíciou, môže byť čoskoro rozhodnuté silou. V týchto neistejších časoch bude smer, ktorý si zvolíme, znieť ďaleko za hranicami nášho [ROOT.GetCountry.GetFlavorRank]." # todo: NEW TRANSLATION
 fate_of_the_phoenix.1.desc_c: "Cisárska slabosť sa málokedy hlási ceremóniami. Po sebe idúce prejavy slabosti, neschopnosť brániť hranice a strata prestíže v [GetCountry('BYZ').GetLongName] sú znamením, že ich čas na slnku sa blíži k tvrdému a náhlemu koncu. Preto situácia na západe už nevyžaduje úctu ani opatrnosť — len rozvahu. My budeme tí, ktorí sa na ich pozostatkoch nasýtia a vystúpia na ich miesto." # todo: NEW TRANSLATION
 fate_of_the_phoenix.1.a: "Nádej ešte nie je stratená." # todo: NEW TRANSLATION
 fate_of_the_phoenix.1.b: "Zmena je krutá milenka..." # todo: NEW TRANSLATION
 fop_parameters_a_tt: "Výsledok tohto nešťastia rozhodne o našom osude. Počas tohto búrlivého obdobia získame cez panel [disaster|e] prístup k jedinečným [actions|e]" # todo: NEW TRANSLATION
 fop_parameters_b_tt: "Ak ukončíme [disaster|e] úspešným zvrátením úpadku, môže to zapríčiniť vlny v kronikách a ohlásiť druhé zlaté obdobie pre náš ľud" # todo: NEW TRANSLATION
 fop_paramenters_bul_tur_ser_tt: "Kým [GetCountry('BYZ').GetLongName] prechádza [ShowDisasterName('fate_of_the_phoenix')] [disaster|e], dostaneme príležitosti využiť ich slabosť" # todo: NEW TRANSLATION
 fate_of_the_phoenix.2.title: "[target_location.GetName] znovu dobyté!" # todo: NEW TRANSLATION
 fate_of_the_phoenix.2.desc: "Prápory [ROOT.GetCountry.GetFlavorRank] opäť vlajú nad [target_location.GetName]. Dlhodobo spochybňovaný [ShowCultureName('turkish_culture')] vojvodcami, pirátmi a súpermi, tento životne dôležitý egejský prístav sa teraz vracia do rúk [ROOT.GetCountry.GetAdjective]. Jeho prístavy a trhy sú zničené, no plné nádeje. Spôsob, akým obnovíme naše nové vlastníctvo, určí naše postavenie na východných moriach pre nasledujúce generácie." # todo: NEW TRANSLATION
 fate_of_the_phoenix.2.a: "Obnoviť prístav." # todo: NEW TRANSLATION
 fate_of_the_phoenix.2.b: "Namiesto toho obnoviť trhy a sklady." # todo: NEW TRANSLATION
 building_set_to_max_level_tt: "Budova [building|e] bude nastavená na svoju maximálnu úroveň" # todo: NEW TRANSLATION
 fate_of_the_phoenix.3.title: "$fate_of_the_phoenix.2.title$" # todo: NEW TRANSLATION
 fate_of_the_phoenix.3.desc: "[target_location.GetName], kedysi útočisko cisárov a sídlo cisárskej kontinuity po pohrome roku 1204, sa vrátilo pod našu nadvládu. Z týchto múrov [ROOT.GetCountry.GetFlavorRank] znášal vyhnanstvo, strážil svoje zákony a zachoval nárok na univerzálne panovanie. Jeho obnova je viac než len územné získanie. Je to skutočne zúčtovanie s cestou, ktorou sa [ROOT.GetCountry.GetFlavorRank] teraz vydá." # todo: NEW TRANSLATION
 fate_of_the_phoenix.3.a: "[ROOT.GetCountry.GetGovernment.GetRulerOrRegent.GetNameWithNoTooltip] osobne bude dozerať na tento projekt!" # todo: NEW TRANSLATION
 fate_of_the_phoenix.3.b: "Znak nášho vracajúceho sa cisárskeho lesku!" # todo: NEW TRANSLATION
 fate_of_the_phoenix.3.c: "Je čas obnoviť správu [ShowRegionNameWithNoTooltip('anatolia_region')]!" # todo: NEW TRANSLATION
 fate_of_the_phoenix.4.title: "$fate_of_the_phoenix.2.title$" # todo: NEW TRANSLATION
 fate_of_the_phoenix.4.desc: "[target_location.GetName], bývalá kolíska moci [GetCountry('TUR').GetAdjective], padla do cisárskych rúk. Z tohto [target_location.GetRank.GetName] si beyliky kedysi brali silu, ambície a tribut. Jeho dobytie vysiela jasné posolstvo naprieč [ShowRegionName('anatolia_region')]: príliv sa obrátil a [ROOT.GetCountry.GetFlavorRank] už nie je v defenzíve." # todo: NEW TRANSLATION
 fate_of_the_phoenix.4.a: "Sme pánmi [ShowRegionNameWithNoTooltip('anatolia_region')]!" # todo: NEW TRANSLATION
 unlocks_demand_beylik_tribute_disaster_action_tt: "Umožní prístup k [ShowGenericActionName('demand_beylik_tribute')] [action|e] na dobu trvania tohto [disaster|e]" # todo: NEW TRANSLATION
 fate_of_the_phoenix.5.title: "Víťazstvo nad [loser.GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 fate_of_the_phoenix.5.desc: "Narastajúca nestabilita spôsobená bojujúcimi beylikmi vyústila do vzostupu [loser.GetLongName]. Silou a schopnou diplomaciou sa stali stálym ohrozením nezávislosti nášho [ROOT.GetCountry.GetFlavorRank]. Avšak nedávne víťazstvá nad nimi pripomínajú, že sme hlasateľmi $ROM$, a napriek búrlivej dobe sa stále bijeme ako levy. Nech tento okamih znamená zlom, novú éru, ktorá zvráti úpadok minulých rokov!" # todo: NEW TRANSLATION
 fate_of_the_phoenix.5.a: "Príliv sa obracia!" # todo: NEW TRANSLATION
 high_legitimacy_grants_extra_benefits_tt: "Po dobu #Y 30#! rokov bude udržiavanie viac ako #Y 50#! [legitimacy|e] významne zvyšovať našu [assimilation|e] a [integration|e] [locations|e]" # todo: NEW TRANSLATION
 fate_of_the_phoenix.6.title: "[target_province.GetNameWithNoTooltip] vzdoruje našej autorite" # todo: NEW TRANSLATION
 fate_of_the_phoenix.6.desc: "[target_province.GetName] odmietla spolupracovať počas tohto búrlivého obdobia. Ak ich požiadavky na autonómiu zostanú nesplnené, môže nasledovať otvorené povstanie. Naši poradcovia naliehajú na ústupky, no ustúpiť teraz by ešte viac podrývalo autoritu [ROOT.GetCountry.GetFlavorRank]." # todo: NEW TRANSLATION
 fate_of_the_phoenix.6.a: "Fénix sa nezaoberá triviálnymi sťažnosťami." # todo: NEW TRANSLATION
 fate_of_the_phoenix.6.b: "Možno to zvládne [target_character.GetShortNameWithNoTooltip]?" # todo: NEW TRANSLATION
 fate_of_the_phoenix.6.c: "Mali by sme vypočuť ľudí!" # todo: NEW TRANSLATION
 target_character_goes_to_target_province_to_restore_order_tt: "[target_character.GetName] bude dohliadať na obnovu poriadku v [target_province.GetName]. [target_character.GetSheHe|U] bude nedostupný/á po dobu #Y 2#! rokov" # todo: NEW TRANSLATION
 fate_of_the_phoenix.7.title: "Slabosť [target_country.GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 fate_of_the_phoenix.7.desc: "[target_country.GetName] vykazuje jasné známky slabosti a naša blízkosť predstavuje vzácnu príležitosť. Ak chceme uplatniť svoje nároky, musíme konať rýchlo, skôr než [target_character.GetName] dokáže obnoviť poriadok a silu." # todo: NEW TRANSLATION
 fate_of_the_phoenix.7.a: "Nastal náš čas." # todo: NEW TRANSLATION
 fate_of_the_phoenix.7.b: "Rovnováha síl musí byť zachovaná!" # todo: NEW TRANSLATION
 we_may_have_another_chance_soon_tt: "#italic Môžeme mať čoskoro ďalšiu šancu získať tieto nároky...#!" # todo: NEW TRANSLATION
 fate_of_the_phoenix.8.title: "Vojny [actor.GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 fate_of_the_phoenix.8.desc: "[actor.GetName] je momentálne zapojený do vojny proti tým, ktorých označuje za nepriateľov Pravého vierovyznania. Ako spolučlenovia [GetInternationalOrganizationType('autocephalous_patriarchate').GetNameWithNoTooltip] teraz žiadajú, aby sme vzali zbrane po ich boku proti tomuto údajnemu spoločnému nepriateľovi. Ak odmietneme, hrozia vylúčením z Patriarchátu — vážnym duchovným pohoršením, ktoré by tiež vrhalo dlhý tieň na vzťahy medzi našimi krajinami." # todo: NEW TRANSLATION
 fate_of_the_phoenix.8.a: "Do zbrane!" # todo: NEW TRANSLATION
 fate_of_the_phoenix.8.b: "Nestojí to za náš čas." # todo: NEW TRANSLATION
 fate_of_the_phoenix.9.title: "Dezerteri v [target_army.GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 fate_of_the_phoenix.9.desc: "Správy z [target_army.GetName] sú veľmi znepokojujúce. Pod velením [target_character.GetName] morálka kolabuje a dezercií pribúda. Takéto zlyhania poškodzujú povesť nášho [ROOT.GetCountry.GetFlavorRank] a posmelenia našich nepriateľov." # todo: NEW TRANSLATION
 fate_of_the_phoenix.9.a: "Zbabelci! Všetci!" # todo: NEW TRANSLATION
 target_army_suffers_losses_tt: "[target_army.GetName] stratí #R [ROOT.GetVariable('visual_strength_loss_variable').GetValue|V2]%#! [strength|e] kvôli dezerciám" # todo: NEW TRANSLATION
 fate_of_the_phoenix.10.title: "Vzostup verného strategosa" # todo: NEW TRANSLATION
 fate_of_the_phoenix.10.desc: "Desiatky rokov [target_character.GetName], veliteľ [target_unit.GetName], slúžil s vyznamenaním. Vďaka vernosti a opakovaným víťazstvám sa [target_character.GetSheHe] stal symbolom pre mužov, stelesnením disciplíny a odhodlania v čase neistoty." # todo: NEW TRANSLATION
 fate_of_the_phoenix.10.a: "[target_character.GetShortNameWithNoTooltip] nás dovedie k víťazstvu!" # todo: NEW TRANSLATION
 major_victories_enhance_stats_tt: "Ak [target_character.GetName] vyhrá veľké [battles|e], [target_character.GetHerHis] [abilities|e] sa môžu zlepšiť" # todo: NEW TRANSLATION
 fate_of_the_phoenix.11.title: "[target_character.GetNameWithNoTooltip] dosiahne veľké víťazstvo" # todo: NEW TRANSLATION
 fate_of_the_phoenix.11.desc: "Naše [target_unit.GetName] dosiahlo veľké víťazstvo nad armádou vedenou [target_losing_country.GetName] pri [target_location.GetName]. Správa o triumfe sa rýchlo šíri a obnovuje istotu, že Fénix ešte pretrváva. [target_character.GetShortName] je na dobrej ceste stať sa legendárnou postavou." # todo: NEW TRANSLATION
 fate_of_the_phoenix.11.a: "Nech [target_character.GetSheHe] vedie naše armády naveky!" # todo: NEW TRANSLATION
 fate_of_the_phoenix.12.title: "[target_character.GetNameWithNoTooltip] utrpí porážku" # todo: NEW TRANSLATION
 fate_of_the_phoenix.12.desc: "Čierny deň plný hnilobných znamení! [target_character.GetName] utrpel vážnu porážku proti armáde velenej [target_character_2.GetName] pri [target_location.GetName]. Strata je vážna a rivali určite budú pozorne sledovať ďalšie známky slabosti. Je to znamenie obratu prílivu proti nám? Dúfajme v to najlepšie, keď sa snažíme vyhrať prebiehajúcu vojnu." # todo: NEW TRANSLATION
 fate_of_the_phoenix.12.a: "Hanebné predstavenie!" # todo: NEW TRANSLATION
 fate_of_the_phoenix.13.title: "Správa [target_character.GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 fate_of_the_phoenix.13.desc: "Tento okamih môže byť rozhodujúci pre [ROOT.GetCountry.GetFlavorRank]. Dlho sme znášali úpadok; vnútorné spory, zahraničné zasahovanie a pomalé odumieranie autority zaťažovali náš ľud. Prostredníctvom nových kabinetných iniciatív môžeme konečne vnuknúť poriadok do chaosu, obnoviť disciplínu v našich inštitúciách a zmysel správy krajiny.\n\nTakéto reformy si vyžiadajú odhodlanie a obete, lebo návyky rozkladu sú hlboko zakorenené a odpor je nevyhnutný. Ak sa však plne zaviažeme, tieto opatrenia môžu zastaviť dlhý ústup [ROOT.GetCountry.GetFlavorRank] a položiť základy obnovenia, inak by váhanie odsúdilo nás na ďalšiu fragmentáciu a bezvýznamnosť." # todo: NEW TRANSLATION
 fate_of_the_phoenix.13.a: "Návrat slávneho slnka si žiada obete." # todo: NEW TRANSLATION
 enable_unlock_spread_philhellenism_and_encourage_latin_militarism_tt: "Na dobu trvania [ShowDisasterName('fate_of_the_phoenix')] [disaster|e] odomkneme [ShowCabinetActionName('spread_philhellenism')] a [ShowCabinetActionName('encourage_latin_militarism')] [cabinet_actions|e]\n\nAk tento [disaster|e] úspešne ukončíme, získame k týmto kabinetným akciám prístup #Y navždy#!" # todo: NEW TRANSLATION
 fate_of_the_phoenix.14.title: "Vzkriesenie Fénixa" # todo: NEW TRANSLATION
 fate_of_the_phoenix.14.desc: "Územia kedysi stratené boli znovu získané a vek úpadku sa chýli ku koncu. [ROOT.GetCountry.GetName] stojí obnovené ako riadny [ROOT.GetCountry.GetFlavorRank], pripravené znovu čeliť svojim nepriateľom. Teraz čaká [ShowLocationName('rome')]." # todo: NEW TRANSLATION
 fate_of_the_phoenix.14.a: "Pod naším dohľadom nebude žiadny mramorový [ROOT.GetCountry.GetGovernment.GetRulerTitle]!" # todo: NEW TRANSLATION
 maintain_cabinet_actions_tt: "Naše víťazné oživenie cez [disaster|e] nám umožnilo zachovať prístup k obom [ShowCabinetActionName('spread_philhellenism')] a [ShowCabinetActionName('encourage_latin_militarism')] [cabinet_actions|e]" # todo: NEW TRANSLATION
 because_we_made_military_reforms_tt: "Keďže sme uskutočnili jednu alebo viac vojenských reforiem pomocou [ShowGenericActionName('reform_imperial_armies')] [action|e]:" # todo: NEW TRANSLATION
 num_of_reforms_desc: "Počet reforiem" # todo: NEW TRANSLATION
 unlock_allelengyon_bureaucracy_kephalai_bureaucracy_tt: "Odomkne $allelengyon_bureaucracy$ a $kephalai_bureaucracy$ [bureaucracies|e]" # todo: NEW TRANSLATION
 unlock_kritai_katholikoi_reformed_extra_effect: "Účinok [ShowModifierTypeName('country_cabinet_efficiency')] [ShowGovernmentReformName('kritai_katholikoi_reformed')] [government_reform|e] sa stane trvalým" # todo: NEW TRANSLATION
 italian_wars_empowerment_if_latin_tt: "Ak by sme viedli [GetUniqueInternationalOrganization('foreign_league_balkan').GetName] počas nadchádzajúcej [GetSituationByKey('italian_wars').GetName] [situation|e], [ShowCultureGroupName('italian_group')] [countries|e] by sa mohli na základe nášho [ShowSocietyDirectionName('latinization')] ľahšie pripojiť k našej Lige" # todo: NEW TRANSLATION
 fate_of_the_phoenix.15.title: "Éra úpadku" # todo: NEW TRANSLATION
 fate_of_the_phoenix.15.desc: "Napriek našim snahám sa nedarilo získať späť nedávno stratené územia. Vzostup susedných beylikov spolu s nepriateľskými mocnosťami za hranicami [ShowRegionName('balkan_region')] urobil zvrátenie nemožným. Dlhý úpadok pretrváva a budúcnosť [ROOT.GetCountry.GetFlavorRank] je zahalená neistotou." # todo: NEW TRANSLATION
 fate_of_the_phoenix.15.a: "Naša budúcnosť je zahalená tieňmi a neistotou." # todo: NEW TRANSLATION
 no_longer_access_to_the_cabinet_actions_tt: "Už nebudeme mať prístup k [ShowCabinetActionName('spread_philhellenism')] a [ShowCabinetActionName('encourage_latin_militarism')] [cabinet_actions|e]" # todo: NEW TRANSLATION
 fate_of_the_phoenix.16.title: "[actor.GetNameWithNoTooltip] žiada o dar" # todo: NEW TRANSLATION
 fate_of_the_phoenix.16.desc: "Dostali sme správu o zúrivom nepokoji pohlcujúcom [actor.GetName]. Ako poslednú možnosť poslali vyslancov, aby prosili o finančnú pomoc. Výmenou sľubujú, že otvoria svoj [actor.GetFlavorRank] pre šírenie našich noriem a zvykov. Takýto čin je bezprecedentný a môže naznačovať vážnosť situácie v [actor.GetCapital.GetName]." # todo: NEW TRANSLATION
 fate_of_the_phoenix.16.a: "Malý symbolický dar je na mieste." # todo: NEW TRANSLATION
 fate_of_the_phoenix.16.b: "Musíme podporiť štít proti hordám [ShowRegionNameWithNoTooltip('anatolia_region')]." # todo: NEW TRANSLATION
 fate_of_the_phoenix.16.c: "Žiadne mince pre heretikov!" # todo: NEW TRANSLATION
 no_money_for_byz_tt: "Neposkytneme [actor.GetName] žiadnu pomoc." # todo: NEW TRANSLATION
 fate_of_the_phoenix.17.title: "[actor.GetNameWithNoTooltip] ponúka obchodné privilégiá" # todo: NEW TRANSLATION
 fate_of_the_phoenix.17.desc: "Už obchodujeme v [ShowLocationName('constantinople')], ale teraz nás [actor.GetName] oslovili s ponukou dodať im stavebný materiál pre ich flotilu výmenou za preferenčné privilégiá na trhoch ich hlavného mesta." # todo: NEW TRANSLATION
 fate_of_the_phoenix.17.a: "[target_country.GetGovernment.GetRulerOrRegent.GetShortNameWithNoTooltip] je obchodník, podniká!" # todo: NEW TRANSLATION
 fate_of_the_phoenix.17.b: "Zabudnime na to." # todo: NEW TRANSLATION
 selected_republic_may_donate_ships_to_our_cause_tt: "Vybraná $merchant_republic$ môže darovať galéry [ships|e] a [sailors|e] výmenou za [merchant_power|e] v [ShowLocationName('constantinople')]" # todo: NEW TRANSLATION
 byzantines_left_fend_themselves_tt: "[actor.GetLongName] je ponechané samo na seba" # todo: NEW TRANSLATION
 latin_merchant_privileges_key: "$italian_group$ Obchodné privilégiá" # todo: NEW TRANSLATION
 fate_of_the_phoenix.18.title: "[target_character.GetNameWithNoTooltip] prichádza do [ROOT.GetCountry.GetCapital.GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 fate_of_the_phoenix.18.desc: "Na základe odporúčania našich dôveryhodných priateľov z [target_country.GetName] prišiel [target_character.GetName] zo [target_location.GetRank.GetName] [target_location.GetName], nesúc so sebou zručnosti a vedomosti, ktorými sú krajiny [target_culture.GetName] preslávené. Zocelený zahraničnými dvorcami a vycvičený metódami polostrova, [target_character.GetSheHe] teraz ponúka svoje služby nášmu [ROOT.GetCountry.GetFlavorRank] — láskavý a srdečný čin.\n\nTakýto príchod nielen sľubuje praktický úžitok, ale tiež prehlbuje putá, ktoré nás spájajú s našimi [ShowCultureGroupName('italian_group')] bratmi, ktorých vedomosti a vynaliezavosť naďalej formujú záležitosti kniežat i cisárov." # todo: NEW TRANSLATION
 fate_of_the_phoenix.18.a: "S veľkým záujmom budeme sledovať kariéru [target_character.GetHerHis]!" # todo: NEW TRANSLATION
 fate_of_the_phoenix.19.title: "[actor.GetNameWithNoTooltip] požaduje tribut" # todo: NEW TRANSLATION
 fate_of_the_phoenix.19.desc: "Po páde [ShowLocationName('bursa')] do rúk [actor.GetName] sa autorita [target_character_1.GetName] obnovila a zostáva nezpochybniteľná. Z [target_location_1.GetName] prichádzajú vyslanci s požiadavkami namiesto zdvorilostí. Žiadajú tribut ako cenu za naše údajne pohanské zvyky a ich slová sú ostrené nepovedanou hrozbou násilia. Či už zlatom, krvou alebo vzdorom, očakáva sa odpoveď a jej dôsledky pocítia dobre za našimi hranicami." # todo: NEW TRANSLATION
 fate_of_the_phoenix.19.a: "Nemáme inú možnosť, než sa rozlúčiť s naším zlatom." # todo: NEW TRANSLATION
 fate_of_the_phoenix.19.b: "Namiesto toho im pošleme zdatných mužov." # todo: NEW TRANSLATION
 fate_of_the_phoenix.19.c: "Nič nedostanú!" # todo: NEW TRANSLATION
 fate_of_the_phoenix.20.title: "Reforma [actor.GetAdjectiveWithNoTooltip] armády" # todo: NEW TRANSLATION
 fate_of_the_phoenix.20.desc_a: "Roky zanedbávania a finančného tlaku zanechali armády [ROOT.GetCountry.GetFlavorRank] nepripravené na skúšky, ktoré prídu. Pod vedením [target_character.GetName] možno zaviesť nové predpisy na obnovenie disciplíny, reorganizáciu velenia a oživenie tradícií, ktoré kedysi robili armády [ROOT.GetCountry.GetCapital.GetName] hrozivými po zemi aj pri hraniciach. Hoci nákladné, takéto reformy môžu ešte zastaviť dlhý úpadok našej vojenskej sily." # todo: NEW TRANSLATION
 fate_of_the_phoenix.20.desc_b: "More dlhodobo slúžili ako štít i životná linka [ROOT.GetCountry.GetFlavorRank], no naše flotily teraz trpia zastaranými praktikami a ubúdajúcou odbornosťou. Pod vedením [target_character.GetName] by sa mohli urobiť kroky na obnovenie námorného velenia, zlepšenie výcviku a modernizáciu inštitúcií, ktoré udržiavajú našu námornú moc. Ak uspejeme, [ROOT.GetCountry.GetAdjective] námorníctvo opäť zaistí naše pobrežia a obchod proti všetkým rivalom." # todo: NEW TRANSLATION
 fate_of_the_phoenix.20.a: "Nevyhnutný krok v boji proti úpadku." # todo: NEW TRANSLATION
 fate_of_the_phoenix.20.b: "Možno ešte nie práve teraz." # todo: NEW TRANSLATION
 reformation_of_the_school_of_admirals_better_stats_tt: "Kým je tento [modifier|e] aktívny, použitie [ShowGenericActionName('train_admiral')] [action|e] prinesie [characters|e] s lepšími celkovými [abilities|e]" # todo: NEW TRANSLATION

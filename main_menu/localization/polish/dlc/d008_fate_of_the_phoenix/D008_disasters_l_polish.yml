 target_country_forced_to_give_tribute_tt: "Vybraná [country|e] môže byť presvedčená dať nám [gold|e] alebo [manpower|e]" # todo: NEW TRANSLATION
 at_war_with_heathens_or_heretics_tt: "V súčasnosti vedieme [war|e] proti [country|e], ktorá NIE JE nasledovníkom [actor.GetReligion.GetName]" # todo: NEW TRANSLATION
 selected_country_may_join_every_ongoing_war_against_heathen_and_heretics_tt: "Vybraná [country|e] sa môže pripojiť k našim prebiehajúcim [wars|e], ktorých [war_leaders|e] sú buď [heathens|e] alebo [heretics|e]" # todo: NEW TRANSLATION
 pops_in_capital_province_convert_catholic_tt: "Niektorí z našich [pops|e], ktorí nasledujú [actor.GetReligion.GetName] v [actor.GetCapital.GetProvince.GetName], prijmú [ShowReligionName('catholic')]" # todo: NEW TRANSLATION
 fate_of_phoenix_actions_price: "$fate_of_the_phoenix$ Cena akcií" # todo: NEW TRANSLATION
 request_papal_donation: "Požiadať o $PAP_ADJ$ dar" # todo: NEW TRANSLATION
 request_papal_donation_desc: "Keďže je [actor.GetFlavorRank] oslabený a jeho truhly prázdne, môžeme poslať vyslancov do $PAP$ žiadať o pomoc v mene [ShowReligionGroupName('christian')]. Hoci takéto žiadosti sa zriedka podávajú bez následkov, ich zlato nám môže predsa kúpiť čas v našej hodine núdze." # todo: NEW TRANSLATION
 grant_latin_merchants_privileges: "Udeľte [ShowCultureGroupNameWithNoTooltip('italian_group')] obchodníkom privilégiá" # todo: NEW TRANSLATION
 grant_latin_merchants_privileges_desc: "Rozšírením špeciálnych práv pre [ShowCultureGroupName('italian_group')] obchodné republiky dúfame oživiť obchod a zabezpečiť námornú podporu. Tieto ústupky môžu posilniť obchod v [actor.GetCapital.GetName], hoci riskujú prehĺbenie cudzieho vplyvu v [actor.GetCapital.GetRank.GetName]." # todo: NEW TRANSLATION
 grant_latin_merchants_privileges_tooltip: "Akýkoľvek [country|e] v [ShowRegionName('italy_region')] s [ShowGovernmentReformName('merchant_republic')] nie je ani naším vazalom, ani naším rivalom" # todo: NEW TRANSLATION
 accept_catholic_delegation: "Prijať [ShowReligionAdjectiveWithNoTooltip('catholic')] delegáciu" # todo: NEW TRANSLATION
 accept_catholic_delegation_desc: "Delegáti z [GetUniqueInternationalOrganization('catholic_church').GetName] môžu byť pozvaní do [actor.GetCapital.GetName], nesúc slová jednoty a potichu očakávajúc kompromisy. Podľa mnohých našich poradcov môže hostenie týchto delegátov zlepšiť vzťahy s [ShowReligionAdjective('catholic')] svetom, no takéto gesta nie sú bez vnútornej napätosti." # todo: NEW TRANSLATION
 attract_italian_engineer: "Prilákať [ShowCultureGroupNameWithNoTooltip('italian_group')] inžiniera" # todo: NEW TRANSLATION
 attract_italian_engineer_desc: "Preslávení inžinieri [ShowCultureGroupName('italian_group')] sú hľadaní, aby zlepšili naše opevnenia a vojenské stavby. Ich odborné znalosti sľubujú moderné riešenia starobylých problémov, možno za cenu viazania nás na západné metódy a vplyv." # todo: NEW TRANSLATION
 demand_beylik_tribute: "Požadovať tribut od beyliku" # todo: NEW TRANSLATION
 demand_beylik_tribute_desc: "Keď je naša autorita znovu potvrdená v [ShowRegionName('anatolia_region')], môžeme opäť prinútiť blízke beyliky uznať nadvládu [actor.GetAdjective]. Tribut vymáhaný teraz môže oslabiť budúcich rivalov a obnoviť dôveru v silu [actor.GetFlavorRank]." # todo: NEW TRANSLATION
 summon_patriarchate_member: "Privolať člena patriarchátu" # todo: NEW TRANSLATION
 summon_patriarchate_member_desc: "Ako vodca nášho [GetInternationalOrganizationType('autocephalous_patriarchate').GetNameWithNoTooltip] môžeme povolať ostatných [ShowReligionAdjective('orthodox')] vodcov, aby nám pomohli proti nepriateľom viery. Takéto odvolania sa spoliehajú na spoločnú vieru skôr než na povinnosť a môžu pritiahnuť meče na našu stranu." # todo: NEW TRANSLATION
 reform_imperial_armies: "Reformovať [GetCountry('BYZ').GetAdjectiveWithNoTooltip] armádu" # todo: NEW TRANSLATION
 reform_imperial_armies_desc: "Ozbrojené sily [actor.GetFlavorRank] trpeli desaťročia zanedbávania a improvizácie. Komplexná reforma sľubuje obnovenú disciplínu a štruktúru, hoci vyžaduje stabilitu, striebro a vôľu zmeniť zakorenené návyky." # todo: NEW TRANSLATION
 patronize_orthodox_monastery: "Podporiť $orthodox_monastery$" # todo: NEW TRANSLATION
 patronize_orthodox_monastery_desc: "Udeľovaním patronátu miestnemu [ShowBuildingTypeName('orthodox_monastery')] potvrdzujeme našu oddanosť a posilňujeme miestny náboženský život. Takáto štedrosť určite zlepší miestnu kvalitu života a pripomenie veriacim, že [actor.GetLongName] stále stojí ako ochránca pravej viery." # todo: NEW TRANSLATION
 reform_armed_forces_tt: "Budeme schopní reformovať našu [army|e] alebo [navy|e], zvrátiac úpadok uplynulých storočí" # todo: NEW TRANSLATION
 has_not_completed_all_six_reforms_tt: "Nedokončili sme všetkých #Y 6#! dostupných reforiem" # todo: NEW TRANSLATION
 patronize_orth_monastery_tt: "Vybraná [location|e] dostane [ShowModifier('patronize_orthodox_monastery_modifier')] [modifier|e], zatiaľ čo mnohým z našich [ShowReligionAdjective('orthodox')] [pops|e] bude udelené [ShowNamedValue('pop_satisfaction_mild_bonus')|+=2%] [pop_satisfaction|e]" # todo: NEW TRANSLATION

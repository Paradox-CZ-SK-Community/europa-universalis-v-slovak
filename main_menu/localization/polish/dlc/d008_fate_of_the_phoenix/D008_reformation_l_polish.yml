l_polish:
 contact_patriarch_of_constantinople: "Kontaktujte patriarchu Konštantínopolu" # todo: NEW TRANSLATION
 contact_patriarch_of_constantinople_desc: "Pošlite Melanchthona do Konštantínopolu s naším Vyznaním viery a otvorte kanál dialógu s [ShowReligionAdjective('orthodox')] patriarchátom." # todo: NEW TRANSLATION
 reformation.17.title: "List [GetCharacter('reformer_philip_melanchton').GetLastNameWithNoTooltip] do Konštantínopolu" # todo: NEW TRANSLATION
 reformation.17.desc: "[melanchthon.GetName], popredný teológ v našom panstve, navrhol smelý krok: vyslať vyslanca k patriarchovi Konštantínopolu s naším Vyznaním viery. Aj keď sú [ShowReligionAdjective('orthodox')] a [ShowReligionAdjective('lutheran')] vierovyznania v mnohých otázkach rozdelené, zdieľajú spoločné odmietnutie pápežskej nadvlády. Možno patriarcha privíta pokus o kontakt od ďalších odporcov Ríma." # todo: NEW TRANSLATION
 reformation.17.a: "Pošlite [GetCharacter('reformer_philip_melanchton').GetLastNameWithNoTooltip] s naším Vyznaním viery." # todo: NEW TRANSLATION
 reformation.17.b: "Teraz nie je vhodný čas na takéto oslovenia." # todo: NEW TRANSLATION
 reformation.17.historical_info: "Philipp Melanchthon (1497–1560), najbližší spolupracovník Luthera a autor Augsburského vyznania (1530), prejavil hlboký záujem o východnú cirkev ako potenciálneho spojenca proti Rímu. Jeho korešpondencia s gréckymi učencami položila základy neskorším luteránskym pokusom o kontakt s Konštantínopolom. V roku 1573 teológovia z Tübingenu poslali grécky preklad Augsburského vyznania patriarchovi Jeremiasovi II., čím odštartovali jeden z najtrvácnejších teologických dialógov medzi luteránstvom a pravoslávím v období reformácie." # todo: NEW TRANSLATION
 reformation.18.title: "List od luteránskych reformátorov" # todo: NEW TRANSLATION
 reformation.18.desc: "Do Konštantínopolu dorazila delegácia z [lutheran_country.GetLongName] s teologickou prácou — Vyznaním svojej viery. Zdá sa, že [ShowReligionAdjective('lutheran')] reformátori hľadajú dialóg s naším patriarchátom, odvolávajúc sa na spoločný odpor voči biskupovi Ríma. Či sú ich úmysly úprimné alebo vedené vlastným záujmom, ukáže sa." # todo: NEW TRANSLATION
 reformation.18.a: "Vstúpte s týmito reformátormi do opatrného teologického dialógu." # todo: NEW TRANSLATION
 reformation.18.b: "Sú heretici. Odošlite ich." # todo: NEW TRANSLATION
 reformation.18.historical_info: "Ekumenický patriarchát Konštantínopolu si udržiaval duchovnú autoritu nad pravoslávnymi kresťanmi aj po osmanskom dobytí v roku 1453. Patriarcha Jeremias II. (vládl. 1572–1595) bol známy svojou teologickou erudíciou a vážne sa zaoberal listami teológov z Tübingenu, pričom medzi rokmi 1576 a 1581 vypracoval tri podrobné odpovede. Odmietol luteránsku doktrínu o ospravedlnení, slobodnej vôli a filioque, zároveň však uznal úprimnosť dopytu — postoj, ktorý jeho reakcie odlišoval od jednoduchého odmietnutia." # todo: NEW TRANSLATION
 reformation.19.title: "Patriarcha reaguje so záujmom" # todo: NEW TRANSLATION
 reformation.19.desc: "Patriarcha zareagoval s opatrnou zvedavosťou na návštevu nášho vyslanca. Hoci sa nedosiahla doktrinálna dohoda, výmena otvorila kanál medzi Konštantínopolom a našou štátnou cirkvou — malý, ale významný krok k porozumeniu medzi [ShowReligionAdjective('lutheran')] a [ShowReligionAdjective('orthodox')] kresťanstvom." # todo: NEW TRANSLATION
 reformation.19.a: "Most, hoci úzky, je lepší ako nič." # todo: NEW TRANSLATION
 reformation.19.historical_info: "Korešpondencia z Tübingenu je považovaná za míľnik skorého ekumenického dialógu. Tri odpovede patriarchu Jeremiasa II. (1576, 1579, 1581) sa vážne zaoberali luteránskou teológiou, hoci odmietli jej základné tvrdenia. K otázkam sola fide, slobodnej vôle a filioque pristupoval s podrobnými patristrickými argumentmi — úroveň angažovanosti, ktorá ukázala intelektuálnu vitalitu patriarchátu pod osmanskou nadvládou. Obe strany si korešpondenciu starostlivo uchovali." # todo: NEW TRANSLATION
 reformation.20.title: "Patriarcha odmietol delegáciu" # todo: NEW TRANSLATION
 reformation.20.desc: "Naša delegácia bola v Konštantínopole prijatá chladne. Patriarcha označil naše Vyznanie za ďalšiu formu herezie a náš vyslanec bol odoslaný bez ceremonií. Je to pripomienka, že [ShowReligionName('lutheran')] stojí bokom — od Ríma aj od Konštantínopolu." # todo: NEW TRANSLATION
 reformation.20.a: "Naša viera nepotrebuje schválenie žiadneho patriarchátu." # todo: NEW TRANSLATION
 reformation.20.historical_info: "Korešpondencia z Tübingenu nakoniec neviedla k doktrinálnej zhode: tri odpovede patriarchu Jeremiasa II. (1576, 1579, 1581) odmietli luteránske stanoviská k sola fide, sola scriptura a filioque a trvali na tom, že pravoslávie nemôže prijať to, čo považuje za novoty. Luteráni nakoniec dospeli k záveru, že ďalšia korešpondencia by bola márna, a v roku 1581 výmenu ukončili." # todo: NEW TRANSLATION
 reformation.21.title: "Prichádza pravoslávny učenec" # todo: NEW TRANSLATION
 reformation.21.desc: "Správa o našej korešpondencii s Konštantínopolom priniesla nečakané ovocie. [ShowReligionAdjective('orthodox')] učenec, [orthodox_scholar.GetName], prišiel na náš dvor s cieľom pokračovať v teologickej výmene, ktorú začal náš vyslanec. Návšteva je citlivá — príliš srdečné prijatie môže vyprovokovať našich klerikov, zatiaľ čo odmietnutie by mohlo zničiť dobrú vôľu získanú v Konštantínopole." # todo: NEW TRANSLATION
 reformation.21.a: "Usporiadajte dlhodobú akademickú výmenu." # todo: NEW TRANSLATION
 reformation.21.b: "Poďakujte im zdvorilo, ale odmietnite ďalšiu výmenu." # todo: NEW TRANSLATION
 reformation.21.historical_info: "Napriek tomu, že korešpondencia z Tübingenu nevyústila do doktrinálnej jednoty, vyvolala na oboch stranách značný akademický záujem. Grécki pravoslávni intelektuáli sa bližšie oboznámili s luteránskou teológiou, zatiaľ čo luteránski učenci získali hlbšie poznatky o cirkevných otcoch a východnej kresťanskej tradícii. Táto medzikonfesijná výmena prispela k širšiemu európskemu humanizmu, ktorý pristupoval k starovekému gréckemu kresťanstvu ako k zdroju nezávislému od Ríma." # todo: NEW TRANSLATION

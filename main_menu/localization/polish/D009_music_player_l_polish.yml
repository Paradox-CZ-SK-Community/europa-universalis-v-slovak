l_polish:
 musicplayer_sol_moroccan_berma_lalla: "Marocká - Berma Lalla" # todo: NEW TRANSLATION
 musicplayer_sol_moroccan_berma_lalla_flavour: "Pieseň vzývajúca Lallu, jednu z ženských mlouk v panteóne duchov Gnawa. Účinkujú Asmaa Hamzaoui a jej skupina Bnat Timbouktou, prvá ženská skupina Gnawa v Maroku." # todo: NEW TRANSLATION
 musicplayer_sol_moroccan_boulila: "Marocká - Boulila" # todo: NEW TRANSLATION
 musicplayer_sol_moroccan_boulila_flavour: "Základná súčasť repertoáru Gnawa, ktorá sa hrá počas lila, celonočného liečebného obradu, pri ktorom piesne vzývajú mlouk — duchov spájaných s farbami, kadidlom a obradmi." # todo: NEW TRANSLATION
 musicplayer_sol_moroccan_soyo_soyo: "Marocká - Soyo Soyo" # todo: NEW TRANSLATION
 musicplayer_sol_moroccan_soyo_soyo_flavour: "Skladba, ktorá sa odovzdáva medzi generáciami majstrov Gnawa — od Mahmouda Guiniu po Bnat Timbouktou. Jej korene siahajú k západoafrickej diaspóre, ktorá od 16. storočia formovala hudobné dedičstvo Maroka." # todo: NEW TRANSLATION
 musicplayer_sol_castilian_ay_triste_que_vengo: "Kastílska - Ay triste que vengo" # todo: NEW TRANSLATION
 musicplayer_sol_castilian_ay_triste_que_vengo_flavour: "Táto villancico, zhudobnená báseň z Encinovho vlastného Cancionera (1496), odhaľuje, ako neostrá bola hranica medzi poéziou a piesňou na renesančnom dvore vojvodu z Alby." # todo: NEW TRANSLATION
 musicplayer_sol_castilian_con_amores_la_mi_madre: "Kastílska - Con amores la mi madre" # todo: NEW TRANSLATION
 musicplayer_sol_castilian_con_amores_la_mi_madre_flavour: "Táto villancico, napísaná na dvore Katolíckych Veličenstiev, osciluje medzi milostnou piesňou dcéry a mystickým rozhovorom duše s Pannou Máriou." # todo: NEW TRANSLATION
 musicplayer_sol_castilian_conde_claros: "Kastílska - Conde Claros" # todo: NEW TRANSLATION
 musicplayer_sol_castilian_conde_claros_flavour: "Príbeh grófa Clarosa a princeznej Claraniñy, jedna z najobľúbenejších balád Španielska 16. storočia, sa tu zachoval ako vihuelové variácie od Narváeza, z ktorých kedysi spievali ciegos (pouliční speváci)." # todo: NEW TRANSLATION
 musicplayer_sol_castilian_falai_minha_amor: "Kastílska - Falai minha amor" # todo: NEW TRANSLATION
 musicplayer_sol_castilian_falai_minha_amor_flavour: "Táto pieseň zo zbierky El Maestro (1536), prvej tlačenej zbierky pre vihuelu v dejinách, má portugalský text, ktorý odráža dynastické väzby medzi Valenciou a Lisabonom a vzdáva hold Milánovmu patrónovi, kráľovi Jánovi III." # todo: NEW TRANSLATION
 musicplayer_sol_castilian_recercada_i_sopra_i_tenori_italiani: "Kastílska - Recercada I sopra i tenori italiani" # todo: NEW TRANSLATION
 musicplayer_sol_castilian_recercada_i_sopra_i_tenori_italiani_flavour: "Táto Recercada z prvej učebnice venovanej výučbe ozdobnej hry na viole ukazuje, ako glosar nad passamezzo antico, jedným zo štandardných talianskych harmonických postupov tej doby." # todo: NEW TRANSLATION
 musicplayer_sol_castilian_recercada_ii_sobre_l_espagna: "Kastílska - Recercada II sobre l'Espagna" # todo: NEW TRANSLATION
 musicplayer_sol_castilian_recercada_ii_sobre_l_espagna_flavour: "Ortizova Recercada vychádza z La Spagna, jednej z najčastejšie zhudobňovaných melódií renesancie. V diele Trattado de Glosas (Rím, 1553) predstavuje glosar — umenie improvizovať variácie na známy basový nápev." # todo: NEW TRANSLATION

 por_estado_da_india_decision.desc: "#italic Casa da Índia#! spravuje náš obchod, no naše pevnosti a obchodné stanice od $india$ až po Juhočínske more stále nepodliehajú jednej autorite. Navrhlo sa, aby sa Goa stalo sídlom formálneho miestokráľovstva — #italic Estado#! — pod ktoré by spadala každá posádka, flotila a obchodná stanica východne od Mysu." # todo: NEW TRANSLATION
 por_estado_da_india_decision.desc.entry: "Casa da Índia vedie naše účtovné knihy, no naše posádky, flotily a obchodné stanice východne od Mysu stále nepodliehajú jednej autorite. Miestokráľ sídliaci v Goe by ich všetky zjednotil pod jediným Estado." # todo: NEW TRANSLATION

l_polish:
 game_concept_with_icon: "$ICON$ $NAME$"
 game_concept_modifier: "Modifikátor"
 game_concept_modifiers: "Modifikátory"
 game_concept_modifier_desc: "Modifikátory sú hodnoty, ktoré ovplyvňujú fungovanie hry, napríklad pridaním alebo vynásobením určitého výpočtu.\nModifikátory sú pripojené k určitej entite, ako napr. [Concept('country_modifiers','Modifikátory krajín')|el] ku [Concept('countries','krajine')|e], [Concept('location_modifiers','modifikátorom lokalít')|el] ku [Concept('locations','lokalitám')|e], [Concept('character_modifiers','modifikátorom postavy')|el] k [Concept('characters','postavám')|e] a [Concept('international_organization_modifiers','modifikátorom medzinárodnej organizácie')|el] k [Concept('international_organizations','medzinárodným organizáciám')|e]." # todo: CONCEPT CASE
 game_concept_location_modifier: "Modifikátor lokality"
 game_concept_location_modifiers: "Modifikátory lokalít"
 game_concept_location_modifier_desc: "[Concept('modifier','Modifikátor')|e], ktorý sa vzťahuje na [Concept('location','lokáciu')|e]." # todo: CONCEPT CASE
 game_concept_province_modifier: "Modifikátor provincie"
 game_concept_province_modifiers: "Modifikátory provincií"
 game_concept_province_modifier_desc: "[Concept('modifier','Modifikátor')|e], ktorý sa vzťahuje na [Concept('province','provinciu')|e]." # todo: CONCEPT CASE
 game_concept_country_modifier: "Modifikátor krajiny"
 game_concept_country_modifiers: "Modifikátory krajín"
 game_concept_country_modifier_desc: "[Concept('modifier','Modifikátor')|e], ktorý sa vzťahuje na celú [Concept('country','krajinu')|e]." # todo: CONCEPT CASE
 game_concept_unit_modifier: "Modifikátor jednotky"
 game_concept_unit_modifiers: "Modifikátory jednotiek"
 game_concept_unit_modifier_desc: "[Concept('modifier','Modifikátor')|e], ktorý sa vzťahuje na konkrétnu [Concept('unit','jednotku')|e]." # todo: CONCEPT CASE
 game_concept_character_modifier: "Modifikátor postavy"
 game_concept_character_modifiers: "Modifikátory postavy"
 game_concept_character_modifier_desc: "[Concept('modifier','Modifikátor')|e], ktorý sa vzťahuje na [Concept('character','postavu')|e]. Typy modifikátorov, ktoré majú cieliť na [Concept('country','krajinu')|e], sú aktívne len ak je [Concept('character','postava')|e] [Concept('ruler','panovníka')|e] danej krajiny." # todo: CONCEPT CASE
 game_concept_dynasty_modifier: "Modifikátor dynastie" # todo: NEW TRANSLATION
 game_concept_dynasty_modifiers: "Modifikátory dynastie" # todo: NEW TRANSLATION
 game_concept_dynasty_modifier_desc: "[Concept('modifier','Modifikátor')|e], ktorý sa vzťahuje na [Concept('dynasty','dynastiu')|e]. Typy modifikátorov, ktoré sú určené pre [Concept('character','postavu')|e], sú aktívne pre každého žijúceho člena dynastie, hoci [Concept('country_modifiers','modifikátory krajín')|e] sa uplatnia len vtedy, ak je daná postava [Concept('ruler','panovník')|e] danej krajiny." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_movement_modifier: "Modifikátor pohybu" # todo: NEW TRANSLATION
 game_concept_movement_modifiers: "Modifikátory pohybu" # todo: NEW TRANSLATION
 game_concept_movement_modifier_desc: "Modifikátor [Concept('modifier','modifikátor')|e], ktorý sa uplatňuje na [Concept('movement','hnutie')|e]. Uplatní sa na každé [Concept('location','lokalitu')|e], ktoré dané hnutie ovplyvňuje." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_international_organization_modifier: "Modifikátor medzinárodnej organizácie"
 game_concept_international_organization_modifiers: "Modifikátory medzinárodnej organizácie"
 game_concept_international_organization_modifier_desc: "[Concept('modifier','Modifikátor')|e], ktorý sa vzťahuje na [Concept('international_organization','medzinárodné organizácie')|e]." # todo: CONCEPT CASE
 game_concept_effect: "Efekt"
 game_concept_effects: "Efekty"
 game_concept_effect_desc: "Efekty sa používajú na dynamické ovplyvňovanie hry. Môžu siahať od jednoduchého pridávania [Concept('gold','zlata')|e] po zložitejšie akcie, ako je odomknutie [Concept('government_reform','reformy vlády')|e]. Efekty sa zvyčajne vyskytujú v [Concept('event','udalosti')|e] alebo sú odmenami z [Concept('missions','misií')|e]." # todo: CONCEPT CASE
 game_concept_trigger: "Spúšťač"
 game_concept_triggers: "Spúšťače"
 game_concept_condition: "Podmienka"
 game_concept_conditions: "Podmienky"
 game_concept_trigger_desc: "Spúšťače sú podmienky, ktoré musia byť splnené, aby boli aktívne určité [Concept('effects','efekty')|e], [Concept('events','udalosti')|e], [Concept('tasks','úlohy')|e] a iné herné prvky."
 game_concept_action: "Akcia"
 game_concept_actions: "Akcie"
 game_concept_action_desc: "Akcia je tlačidlo, ktoré spôsobí [Concept('effect','efekty')|e] vo svete hry. Takéto akcie sú zvyčajne vo forme [Concept('country_interactions','interakciám s krajinami')|e], [Concept('situation_actions','situačným akciám')|e] alebo [Concept('unit_abilities','schopností jednotiek')|e]." # todo: CONCEPT CASE
 game_concept_country: "Krajina"
 game_concept_country_s: "Krajinný"
 game_concept_countries: "Krajiny"
 game_concept_nation: "Národ"
 game_concept_nations: "Národy"
 game_concept_country_desc: "Krajina je politická entita, ktorá môže participovať na [Concept('diplomacy','diplomaciu')|e]. Má [Concept('government','vládu')|E], [Concept('primary_culture','hlavnej kultúry')|e] a [Concept('primary_religion','hlavné náboženstvo')|e]. Môže ovládať [Concept('armies','armády')|e] a [Concept('navies','námorné sily')|e], aby prejavila svoju moc.\n\nKaždá krajina je buď [Concept('settled','osídlená')|E], [Concept('extraterritorial','extrateritoriálna')|E], [Concept('army_based','armádne založená')|e] alebo [Concept('society_of_pops','tvorená populáciou')|E].\n\nKaždú krajinu ovláda buď hráč, alebo AI." # todo: CONCEPT CASE
 game_concept_settled_country: "Osídlená krajina"
 game_concept_settle: "Osídliť"
 game_concept_settled: "Osídlený"
 game_concept_location_based: "Krajina viazaná na územie" # todo: NEW TRANSLATION
 game_concept_settled_country_desc: "Osídlená krajina je [Concept('country','krajina')|el], ktorá potrebuje [Concept('own','vlastniť')|e] [Concept('locations','lokalít')|e] aby existovala." # todo: CONCEPT CASE
 game_concept_army_based: "Krajina založená na armáde"
 game_concept_army_based_countries: "Krajiny založené na armáde"
 game_concept_army_based_desc: "Krajina založená na armáde je [Concept('country','krajina')|el], ktorá [Concept('own','vlastní')|e] [Concept('locations','lokality')|e], ale jej existencia spočíva úplne na [Concept('armies|e','armáde')]. Ak sú zničené, tak krajina skolabuje." # todo: CONCEPT CASE
 game_concept_navy_based: "Krajina založená na námorníctve"
 game_concept_navy_based_countries: "Krajiny založené na námorníctve"
 game_concept_navy_based_desc: "Krajina založená na armáde je [Concept('country','krajina')|el], ktorá [Concept('own','vlastní')|e] [Concept('locations','lokality')|e], ale jej existencia spočíva úplne na [Concept('navy|e','flotile')]. Ak sú zničené, tak krajina skolabuje." # todo: CONCEPT CASE
 game_concept_extraterritorial_country: "Extrateritoriálna krajina"
 game_concept_extraterritorial_countries: "Extrateritoriálne krajiny"
 game_concept_extraterritorial: "Extrateritoriálne"
 game_concept_building_based: "Krajina založená na budovách"
 game_concept_extraterritorial_country_desc: "Extrateritoriálna krajina je [Concept('country','krajina')|el], ktorá existuje na základe jej [Concept('buildings','budov')|e] a nepotrebuje [Concept('own','vlastniť')|e] žiadne [Concept('locations','lokality')|e]." # todo: CONCEPT CASE
 game_concept_society_of_pops: "Spoločnosť obyvateľstva" # todo: NEW TRANSLATION
 game_concept_societies_of_pops: "Spoločnosti obyvateľstva" # todo: NEW TRANSLATION
 game_concept_pop_based: "Krajina založená na obyvateľstve"
 game_concept_society_of_pops_desc: "Spoločnosť obyvateľstva je [Concept('country','krajina')|el], ktorá existuje na základe jej [Concept('pops','populácií')|el] a nepotrebuje [Concept('own','vlastniť')|e] žiadne [Concept('locations','lokality')|e]." # todo: CONCEPT CASE
 game_concept_diplomacy: "Diplomacia"
 game_concept_diplomacy_desc: "Diplomacia je interakcia medzi dvoma [Concept('countries','krajinou')|e] v rámci [Concept('diplomatic_range','diplomatického dosahu')|e]. Umožňujú ju [Concept('diplomats','diplomatov')|e].\n\nPokrýva všetko od [Concept('alliances','aliancií')|e], [Concept('treaties','dohôd')|e], [Concept('subjects','vazalov')|e] a [overlords|e], a riadi [Concept('war','vojny')|e] a [Concept('peace','mieru')|e].\n\nVysoké [Concept('prestige','prestíže')|e] uľahčuje diplomaciu, zatiaľ čo vysoké [Concept('antagonism','antagonizmov')|e] ju sťažuje." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_threat: "Hrozba" # todo: NEW TRANSLATION
 game_concept_threatening: "Ohrozujúci" # todo: NEW TRANSLATION
 game_concept_threat_desc: "Popisuje, ako veľmi je [Concept('country','krajina')|e] znepokojená inou krajinou. Silnejší sused bude mať vysokú úroveň hrozby." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_war_enthusiasm: "Vojnové nadšenie"
 game_concept_war_enthusiasm_desc: "Popisuje ochotu [Concept('country','krajinu')|e] pokračovať v tejto [Concept('war','vojne')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_decaying_modifier: "Postupne odoznievajúci modifikátor" # todo: NEW TRANSLATION
 game_concept_decaying_modifier_desc: "Postupne odoznievajúce modifikátory sú podobné bežným [Concept('modifiers','modifikátorom')|e], ale ich účinky sa postupne oslabujú pri približovaní sa doby ich vypršania. To vytvára dočasné zmeny, ktoré časom miznú." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_overseas: "Zámorie"
 game_concept_overseas_desc: "Ide o [Concept('location','lokalitu')|e], ktoré nemá pozemné spojenie s [Concept('capital','hlavným mestom')|e] [Concept('country','krajinou')|e], nachádza sa na inom [Concept('continent','kontinente')|e] a nie je na susednom [Concept('sub_continent','subkontinent')|e]." # todo: CHANGED # todo: CONCEPT CASE
 game_concept_goods_demand: "Dopyt po tovare" # todo: NEW TRANSLATION
 game_concept_goods_demands: "Dopyty po tovaroch" # todo: NEW TRANSLATION
 game_concept_goods_demand_desc: "Toto sú [Concept('goods','tovary')|e], ktoré sú potrebné pre [Concept('construction','výstavbu')|e], [Concept('production_method','spôsob výroby')|e], [Concept('pop_needs','potreby populácie')|e] alebo čokoľvek iné, čo si vyžaduje tovar." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_government_needs: "Potreby vlády" # todo: NEW TRANSLATION
 game_concept_government_needs_desc: "[government_needs] sú tie [Concept('goods','tovary')|e], ktoré vaša [Concept('country','krajina')|e] potrebuje pre [Concept('constructions','výstavby')|e] ako [Concept('buildings','budovy')|e], vylepšovanie [Concept('location_rank','rang lokality')|e], verbovanie [Concept('armies','armády')|e] a [Concept('navies','námorné sily')|e] alebo prípravu [Concept('explorations','prieskumy')|e].\n\n[Concept('constructions','Výstavby')|e] sa zastavia, ak [government_needs] nemožno zabezpečiť na [Concept('market','trh')|e] v [Concept('location','lokalite')|e], preto by uspokojenie [government_needs] malo byť prioritou každej vlády." # todo: CHANGED # todo: CONCEPT CASE
 game_concept_production_method: "Spôsob výroby" # todo: NEW TRANSLATION
 game_concept_production_methods: "Spôsoby výroby" # todo: NEW TRANSLATION
 game_concept_production_method_desc: "Je to nastavenie, ktoré možno zmeniť v [Concept('building','budove')|e], aby sa zmenili [Concept('goods','tovary')|e] potrebné pre jeho výkon a/alebo čo je daná budova schopná robiť." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_ruler: "Panovník"
 game_concept_ruler_s: "Panovníka"
 game_concept_rulers: "Panovníci"
 game_concept_ruler_desc: "Každá [Concept('country','krajina')|E] môže mať za vládcu [Concept('character','postavu')|E]. Podľa [Concept('government_type','typu vlády')|e] môže vládnuť doživotne alebo po určenú dobu, než bude nahradený. [Concept('traits','Vlastnosti')|E] vládcu ovplyvňujú celú [Concept('country','krajinu')|e], a [Concept('adm','administratívna schopnosť')|e], [Concept('mil','vojenská schopnosť')|e] a [Concept('dip','diplomatická schopnosť')|e] majú priamy vplyv na efektivitu [Concept('cabinet','kabinet')|e].\n\nBudúcich vládcov vyberá [Concept('heir_selection','nástupnícke právo')|e]. Pokiaľ nie je žiadny legitímny [adult], namiesto toho vládne [government] prostredníctvom [Concept('regent','regenta')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_title_history: "História titulov" # todo: NEW TRANSLATION
 game_concept_title_history_desc: "História titulov je vzťah všetkých [Concept('countries','krajinu')|e], ktorým [Concept('character','postave')|e] počas svojho života vládol." # todo: RETRANSLATED ENGLISH # todo: CONCEPT CASE
 game_concept_monarch: "Monarcha" # todo: NEW TRANSLATION
 game_concept_monarchs: "Monarchovia" # todo: NEW TRANSLATION
 game_concept_road: "Cesta" # todo: NEW TRANSLATION
 game_concept_roads: "Cesty" # todo: NEW TRANSLATION
 game_concept_road_desc: "Cesta je vybudované spojenie medzi dvoma [Concept('locations','lokalitami')|e]. Uľahčujú [Concept('country','krajina')|e] uplatňovať [Concept('control','kontrola')|e] nad svojím územím, zjednodušujú [Concept('trade','obchod')|e] a umožňujú [Concept('armies','armády')|e] rýchlejší pochod." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_employment_system: "Systém zamestnávania" # todo: NEW TRANSLATION
 game_concept_employment_systems: "Systémy zamestnávania" # todo: NEW TRANSLATION
 game_concept_employment_system_desc: "Popisuje, ako [Concept('locations','lokality')|e] obsadzujú svoje [Concept('buildings','budovy')|e] pracovníkmi." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_subject_military_stance: "Vojenské postoje" # todo: NEW TRANSLATION
 game_concept_subject_military_stances: "Vojenské postoje" # todo: NEW TRANSLATION
 game_concept_subject_military_stance_desc: "Popisuje, ako sa [Concept('subjects','vazalov')|e] rozhodujú, čo urobia pre svojich [overlords|e] v čase [Concept('war','vojne')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_location_size: "Veľkosť lokality" # todo: NEW TRANSLATION
 game_concept_location_size_desc: "Fyzická veľkosť [Concept('location','lokalita')|e]. Nie všetky [Concept('locations','lokality')|e] majú rovnakú veľkosť." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_province: "Provincia" # todo: NEW TRANSLATION
 game_concept_provinces: "Provincie" # todo: NEW TRANSLATION
 game_concept_province_desc: "Provincia je skupina [Concept('locations','lokality')|e] [Concept('owned','vlastnené')|e] tou istou [Concept('country','krajinou')|e]. Provincia zdieľa a rozdeľuje [Concept('food','potraviny')|e] medzi svojimi lokalitami, a [Concept('army_levies','armádny branci')|e] a [Concept('navy_levies','povolané loďstvo')|e] sa z celej provincie zvolávajú naraz. Niekoľko [Concept('cabinet_actions','akcií kabinetu')|e] cieli na provinciu." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_province_definition: "Definícia provincie" # todo: NEW TRANSLATION
 game_concept_province_definitions: "Definície provincií" # todo: NEW TRANSLATION
 game_concept_province_definition_desc: "Definícia provincie je vopred určená skupina [Concept('locations','lokality')|e], ktorá určuje, ako sa počas hry vytvárajú [Concept('provinces','provincie')|e].\n\n[areas_with_icon|e] sú rozdelené na definície provincií, ktoré následne obsahujú jednotlivé [locations_with_icon|e]. Všetky [locations] patriace do tej istej definície provincie a [Concept('owned','vlastnené')|e] tým istým [country_with_icon|e] budú tvoriť jednu spoločnú [Concept('province','provincii')|e].\n\nAk [countries] vlastnia [locations] v rámci tej istej definície provincie, vznikne toľko rôznych [provinces], koľko je tam vlastníkov – každá so svojím vlastným [province_capital_with_icon|e] a [food_stockpile_with_icon|e]." # todo: CONCEPT CASE
 game_concept_province_capital: "Hlavné mesto provincie" # todo: NEW TRANSLATION
 game_concept_province_capitals: "Hlavné mestá provincií" # todo: NEW TRANSLATION
 game_concept_province_capital_desc: "Hlavné mesto provincie je [Concept('location','lokalita')|e], ktoré je obrazným srdcom svojej [Concept('province','provincii')|e]. Najhustejšie obývané alebo najrozvinutejšie [location] v [province] bude automaticky vybrané za Hlavné mesto provincie, hoci ho je možné manuálne zmeniť v Paneli lokácie. Keď je táto [location] počas [Concept('war','vojny')|e] [Concept('occupied','okupované')|e], zostávajúce [locations] provincie automaticky pripadnú útočníkovi počas krátkeho časového obdobia.\n\nHlavné mesto provincie tiež určuje [Concept('market','trh')|e], z ktorého celá [Concept('province','provincie')|e] nakupuje a predáva [Concept('food','potraviny')|e]." # todo: CHANGED # todo: CONCEPT CASE
 game_concept_location: "Lokalita"
 game_concept_locations: "Lokality"
 game_concept_location_desc: "Najmenšia jednotka krajiny a súčasť [Concept('province','provinciu')|e]. Jej základné charakteristiky sú definované [Concept('topography','topografia')|e], [Concept('vegetation','vegetácia')|e] a [Concept('climate','klíma')|e]. Môže tiež obsahovať [Concept('river','rieka')|e].\n\nKaždá lokalita má [Concept('raw_material','surovina')|e], ktorý môžu zhromažďovať [Concept('pops','populácie')|e] žijúci tam. V lokáciách je možné stavať [Concept('buildings','budovy')|e], ktoré tiež [Concept('employ','zamestnať')|e] Pops. Väčšina lokácií je [Concept('rural','vidiecky')|e], ale môže im byť udelený aj status [Concept('town_or_city','mestská lokalita')|e].\n\nKaždú Lokáciu môžu [Concept('owned','vlastnené')|e] a [Concept('controlled','kontrolované')|e] [Concept('countries','krajiny')|e], a [Concept('armies','armády')|e] sa môžu pohybovať medzi rôznymi lokalitami, aby ich dobyli počas [Concept('war','vojny')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_lake: "Jazero" # todo: NEW TRANSLATION
 game_concept_lakes: "Jazerá" # todo: NEW TRANSLATION
 game_concept_lake_desc: "Jazerá predstavujú vnútrozemské vodné plochy bez kontaktu s otvoreným morom, okrem možných riek, takže sa v nich nemôžu plaviť relevantné [Concept('ships','lode')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_seazone: "Morská zóna" # todo: NEW TRANSLATION
 game_concept_seazones: "Morské zóny" # todo: NEW TRANSLATION
 game_concept_seazone_desc: "Morská zóna je podobná [Concept('location','lokalita')|e], okrem toho, že obsahuje iba vodu. Je to delenie mapy, ktoré nie je [Concept('owned','vlastnené')|e] ani [Concept('controlled','kontrolované')|e] nikým. Ak je morská zóna pobrežná, bude mať tiež [Concept('maritime_presence','námorná prítomnosť')|e] od susedných [Concept('countries','krajín')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_sea_current: "Morský prúd" # todo: NEW TRANSLATION
 game_concept_sea_currents: "Morské prúdy" # todo: NEW TRANSLATION
 game_concept_sea_current_desc: "A $game_concept_sea_current$ is a particularity of certain [Concept('seazones','morské zóny')|e] that allows for faster movement of [Concept('navies','námorné sily')|e] in a specific direction." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_frozen: "Zamrznuté" # todo: NEW TRANSLATION
 game_concept_frozen_freeze_over: "Zamrznúť" # todo: NEW TRANSLATION
 game_concept_frozen_desc: "Zamrznutú [Concept('seazone','morskú zónu')|e] môžu prekračovať [Concept('armies','armády')|e] a umožňuje väčšiu kontrolu nad územiami, ktoré dosahuje; avšak spôsobí, že [Concept('navies','námorné sily')|e] zostanú uviaznuté, kým sa neroztopí. Buďte opatrní pri zmene počasia, roztopenie môže mať katastrofálne následky, ak sa [Concept('army','armádu')|e] nachádza na ľade." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_impassable: "Nepriechodné"
 game_concept_passable: "Priechod"
 game_concept_wasteland: "Pustatina"
 game_concept_wastelands: "Pustatiny"
 game_concept_impassable_desc: "Je to [Concept('location','lokalita')|e] alebo [Concept('seazone','morská zóna')|e], do ktorého sa nemožno vstúpiť s [Concept('units','jednotkami')|e], ani tam nemôže žiť udržateľné množstvo ľudí." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_area: "Oblasť" # todo: NEW TRANSLATION
 game_concept_areas: "Oblasti" # todo: NEW TRANSLATION
 game_concept_area_desc: "Oblasť je skupina [Concept('provinces','provincie')|e] a je súčasťou [Concept('region','regiónom')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_region: "Región" # todo: NEW TRANSLATION
 game_concept_regions: "Regióny" # todo: NEW TRANSLATION
 game_concept_region_desc: "Región je skupina [Concept('areas','oblasti')|e], ktorá je súčasťou [Concept('sub_continent','subkontinentom')|e]. [ShowRegionName('scandinavian_region')] je príkladom regiónu." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_sub_continent: "Subkontinent" # todo: NEW TRANSLATION
 game_concept_sub_continents: "Subkontinenty" # todo: NEW TRANSLATION
 game_concept_sub_continent_desc: "Subkontinent je skupina [Concept('regions','regióny')|e], ktorá je súčasťou [Concept('continent','kontinentom')|e]. [ShowSubContinentName('western_europe')] alebo $india$ sú príklady subkontinentu." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_geography: "Geografia" # todo: NEW TRANSLATION
 game_concept_geography_desc: "Geografia je povaha a vzájomné usporiadanie miest a fyzických prvkov. [Concept('continents','Kontinenty')|e], [Concept('sub_continents','subkontinentov')|e], [Concept('regions','regiónov')|e], [Concept('areas','oblastí')|e], [Concept('provinces','provincií')|e] a [Concept('locations','lokality')|e] sú všetky súčasťou geografie sveta." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_continent: "Kontinent" # todo: NEW TRANSLATION
 game_concept_continents: "Kontinenty" # todo: NEW TRANSLATION
 game_concept_continent_desc: "Svet je rozdelený na niekoľko kontinentov, ktoré sú následne rozdelené na [Concept('sub_continents','subkontinenty')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_geographical_term: "Geografický pojem" # todo: NEW TRANSLATION
 game_concept_geographical_terms: "Geografické pojmy" # todo: NEW TRANSLATION
 game_concept_geographical_term_desc: "Ľubovoľná zbierka geografických pojmov, ako sú [Concept('continents','kontinenty')|e], [Concept('sub_continents','subkontinenty')|e], [Concept('regions','regióny')|e], [Concept('areas','oblasti')|e], [Concept('provinces','provincie')|e] a [Concept('locations','lokality')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_men: "Muži" # todo: NEW TRANSLATION
 game_concept_men_i: "@army_strength!" # todo: NEW TRANSLATION
 game_concept_manpower: "Živá sila" # todo: NEW TRANSLATION
 game_concept_manpower_i: "@manpower!" # todo: NEW TRANSLATION
 game_concept_manpower_desc: "Živá sila predstavuje limit toho, koľko darebákov a šibalov môže [Concept('country','krajina')|e] podporovať vo svojej profesionálnej [Concept('army','armáde')|e].\n\nŽivá sila sa spotrebováva pri výcviku a udržiavaní profesionálnych [Concept('regiments','plukov')|e], ktoré sú zvyčajne efektívnejšie než [Concept('army_levies','armádny branci')|e].\n\nRýchlosť, akou sa získava živá sila, možno zvýšiť výstavbou [Concept('buildings','budovami')|e] zvyšujúcich živú silu alebo výskumom určitých [Concept('advances','pokroky')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_sailors: "Námorníci" # todo: NEW TRANSLATION
 game_concept_sailors_i: "@sailors!" # todo: NEW TRANSLATION
 game_concept_sailors_desc: "[Concept('country','Krajina')|e] môže disponovať počtom námorníkov, ktorí predstavujú rybárov, obchodných námorníkov a námorných dôstojníkov, ktorí živia na otvorenom mori.\n\nTakí skúsení námorníci sú potrební na stavbu [Concept('ships','lode')|e], a spotrebúvajú sa pri udržiavaní [Concept('navy','námorníctve')|e]. Títo sú oddelení od [Concept('navy_levies','povolané loďstva')|e] a sú účinnejší. Sú dokonca potrební na obsluhu [Concept('exploration','prieskum')|e].\n\nRýchlosť získavania námorníkov možno zvýšiť výstavbou prístavných [Concept('buildings','budovy')|e] alebo výskumom určitých [Concept('advances','pokroky')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_river: "Rieka"
 game_concept_rivers: "Rieky"
 game_concept_river_desc: "Na [Concept('location','lokalitu')|e] môže byť [Concept('river','rieka')|e], pohyblivá vodná plocha.\n\nRieky nie sú splavné pre [Concept('navies','námorné sily')|e], ale ukladajú [Concept('crossing','prechod')|e] bojový malus pre [Concept('armies','armády')|e], ktoré sa pokúšajú vstúpiť do [location] s riekou. Okrem toho mierne zvyšujú [Concept('population_capacity','kapacita obyvateľstva')|e] lokácie." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_religion: "Náboženstvo"
 game_concept_faith: "Viera"
 game_concept_religions: "Náboženstvá" # todo: NEW TRANSLATION
 game_concept_religion_desc: "Náboženstvo je akýkoľvek systém viery, ktorý patrí do [Concept('religion_group','náboženskej skupiny')|e]. Každá [Concept('person','osoby')|e] má náboženstvo (a môže byť [Concept('converted','konvertované')|e] na iné), a každá [Concept('country','krajinu')|e] má [Concept('primary_religion','hlavné náboženstvo')|e].\n\nNáboženstvá v rovnakom [religion_group] považujú jedno druhé za [Concept('heretic','kacíra')|e], zatiaľ čo náboženstvá v rôznych [religion_groups] sa považujú navzájom za [Concept('heathen','neznaboha')|e]. Okrem toho môžu mať náboženstvá špecifické názory na iné náboženstvá." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_religion_group: "Náboženská skupina" # todo: NEW TRANSLATION
 game_concept_religion_groups: "Náboženské skupiny" # todo: NEW TRANSLATION
 game_concept_religion_group_desc: "Náboženská skupina je súbor [Concept('religions','náboženstvá')|e], ktoré sú si podobné a môžu sa navzájom považovať skôr za nesprávne než za zlé. To ich však nezastaví od začatia [Concept('wars','vojny')|e] medzi sebou." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_culture_group: "Kultúrna skupina" # todo: NEW TRANSLATION
 game_concept_culture_groups: "Kultúrne skupiny" # todo: NEW TRANSLATION
 game_concept_culture_group_short: "Skupina" # todo: NEW TRANSLATION
 game_concept_culture_groups_short: "Skupiny" # todo: NEW TRANSLATION
 game_concept_culture_group_desc: "Kultúrna skupina je súbor [Concept('cultures','kultúry')|e], ktoré sú si podobné niektorým spôsobom, či už prostredníctvom spoločného dedičstva, podobných tradícií alebo jednoducho regionálnej blízkosti.\n\n[culture] môže patriť do ľubovoľného počtu Kultúrnych skupín, hoci môže byť aj natoľko izolovaná, že do žiadnej nepatrí.\n\n[Concept('countries','Krajiny')|e], ktorých [Concept('primary_cultures','hlavných kultúr')|e] zdieľajú aspoň jednu Kultúrnu skupinu, budú mať navzájom malý bonus [Concept('opinion','názor')|e], ktorý sa však nesčítava, ak zdieľajú viacero.\n\nNiektoré [culture_groups] môžu byť nakoniec [Concept('merged_culture_group_merged','zjednotená')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_dominant_country: "Dominantná krajina" # todo: NEW TRANSLATION
 game_concept_dominant_country_dominant: "Dominantná" # todo: NEW TRANSLATION
 game_concept_dominant_country_desc: "[Concept('country','Krajina')|e], ktorá má najväčší počet [Concept('population','populácia')|e] svojej [Concept('primary_culture','hlavnej kultúre')|e], sa stáva [Concept('dominant_country','dominantná krajina')|e] danej [Concept('culture','kultúre')|e]. Krajina nemôže byť $game_concept_dominant_country_dominant$, ak jej [overlord|e] patrí k tej istej kultúre." # todo: NOVÝ PREKLAD # todo: CONCEPT CASE
 game_concept_merged_culture_group: "Zjednotená kultúrna skupina" # todo: NEW TRANSLATION
 game_concept_merged_culture_groups: "Zjednotené kultúrne skupiny" # todo: NEW TRANSLATION
 game_concept_merged_culture_group_merged: "Zjednotená" # todo: NEW TRANSLATION
 game_concept_merged_culture_group_merge: "Zjednotiť" # todo: NEW TRANSLATION
 game_concept_merged_culture_group_merges: "Zjednocuje" # todo: NEW TRANSLATION
 game_concept_merged_culture_group_merged_culture: "Zjednotená kultúra" # todo: NEW TRANSLATION
 game_concept_merged_culture_group_merging: "Zjednotenie"
 game_concept_merged_culture_group_desc: "Niektoré [Concept('culture_groups','kultúrne skupiny')|e] je možné $game_concept_merged_culture_group_merged$ do jednej [Concept('culture','kultúry')|e].\n\nKrajina môže $game_concept_merged_culture_group_merge$ jednu zo svojich [Concept('primary_culture','hlavnej kultúry')|e]'s [culture_groups], čo spôsobí vytvorenie novej [culture]. [Concept('pops','Populácie')|e] starej [Concept('primary_culture','hlavnej kultúre')|e] a tie z [Concept('accepted_cultures','akceptovaných kultúr')|e], ktoré sú v tej istej [culture_group_short] a používajú rovnaký [Concept('language','jazyk')|e], budú okamžite asimilované.\n\nZjednotené kultúrne skupiny majú významný bonus k [Concept('assimilating','asimilovaniu')|e] kultúram tejto kultúrnej skupine.\n\n[culture_group] môže byť $game_concept_merged_culture_group_merged$ len raz." # todo: CHANGED # todo: CONCEPT CASE
 game_concept_dominant_religion: "Dominantné náboženstvo" # todo: NEW TRANSLATION
 game_concept_dominant_religion_desc: "Dominantné náboženstvo je [Concept('religion','náboženstvo')|e], ktorému nasleduje najviac [Concept('pops','populácie')|e] v [Concept('location','lokalite')|e] alebo [Concept('country','krajina')|e].\nTo však nemusí znamenať, že ide o väčšinu." # todo: RETRANSLATED ENGLISH # todo: CONCEPT CASE
 game_concept_convert: "Konvertovať" # todo: NEW TRANSLATION
 game_concept_converts: "Konverzie" # todo: NEW TRANSLATION
 game_concept_converting: "Konvertovanie" # todo: NEW TRANSLATION
 game_concept_conversion: "Konverzia" # todo: NEW TRANSLATION
 game_concept_conversion_rate: "Miera konverzie" # todo: NEW TRANSLATION
 game_concept_converted: "Konvertované" # todo: NEW TRANSLATION
 game_concept_conversion_desc: "Ide o proces, ktorým sa [Concept('pops','populácie')|e] časom menia z jedného [Concept('religion','náboženstva')|e] na iné. [Concept('cabinet','Kabinet')|e] je najspoľahlivejším prostriedkom, ktorým môže [Concept('country','krajina')|e] ovplyvniť $game_concept_conversion$, ale [Concept('laws','zákony')|e], [Concept('privileges','privilégiá')|e], [Concept('advances','pokroky')|e] a [Concept('societal_values','sociálne hodnoty')|e] tiež hrajú podstatnú úlohu." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_reform_desire: "Túžba po reforme" # todo: NEW TRANSLATION
 game_concept_reform_desire_desc: "[ShowReligionAdjective('catholic')] náboženstvo má vnútorné rozpory v tom, čo je a čo nie je správna doktrína, a čo patrí alebo nepatrí k viere. Postupom času túžba po reforme narastá a ovplyvní všetky budúce diskusie o doktríne [ShowReligionNameWithNoTooltip('catholic')]." # todo: NOVÝ PREKLAD
 game_concept_reformation: "Reformácia" # todo: NEW TRANSLATION
 game_concept_protestant: "Protestant" # todo: NEW TRANSLATION
 game_concept_protestants: "Protestanti" # todo: NEW TRANSLATION
 game_concept_reformation_desc: "Reformácia je vplyvné hnutie v [ShowReligionGroupAdjective('christian')] svete, ktoré rozdeľuje [ShowReligionAdjective('catholic')] vieru na niekoľko nových náboženstiev. Toto hnutie spúšťa [ShowSituationName('reformation')] [Concept('situation','situácia')|e].\nNasledujúce náboženstvá sú súčasťou reformáciou:\n$BULLET_WITH_TAB$[ShowReligionName('hussite')]\n$BULLET_WITH_TAB$[ShowReligionName('lutheran')]\n$BULLET_WITH_TAB$[ShowReligionName('calvinist')]\n$BULLET_WITH_TAB$[ShowReligionName('anglican')]" # todo: NOVÝ PREKLAD # todo: CONCEPT CASE
 game_concept_culture: "Kultúra" # todo: NEW TRANSLATION
 game_concept_cultures: "Kultúry" # todo: NEW TRANSLATION
 game_concept_secondary_culture: "Sekundárna kultúra" # todo: NEW TRANSLATION
 game_concept_culture_desc: "Kultúra je skupina [Concept('people','ľudia')|e], ktoré zdieľajú pocit spolupatričnosti.\n\nKaždá Kultúra disponuje [Concept('language','jazyk')|e], ktorú môže zdieľať s inými Kultúrami.\n\nKaždá Kultúra má [Concept('cultural_tradition','kultúrna tradícia')|e] a [Concept('cultural_influence','kultúrny vplyv')|e]. Rôzne Kultúry majú meniacie sa [Concept('cultural_opinions','kultúrne názory')|e] navzájom.\n\nKaždá [Concept('country','krajina')|e] má [Concept('primary_culture','hlavná kultúra')|e] a môže mať niekoľko [Concept('accepted_cultures','akceptovaných kultúr')|e] a/alebo [Concept('tolerated_cultures','tolerované kultúry')|e]. Všetky ostatné Kultúry v krajine sú považované za [Concept('non_accepted_cultures','diskriminované kultúry')|e]. Kultúry môžu byť [Concept('assimilated','asimilované')|e] inými Kultúrami.\n\nMnoho Kultúr patrí do jednej alebo viacerých [Concept('culture_groups','kultúrnych skupín')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_graphical_culture: "Grafická kultúra" # todo: NEW TRANSLATION
 game_concept_graphical_culture_desc: "Hlavná [Concept('culture','kultúra')|e] používaná na reprezentáciu grafiky a vizuálov v hre." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_ethnicity: "Etnicita" # todo: NEW TRANSLATION
 game_concept_ethnicity_desc: "Etnicita definuje hlavné fyzické črty [Concept('character','postava')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_cultural_opinion: "Kultúrny názor" # todo: NEW TRANSLATION
 game_concept_cultural_opinion_short: "Názor" # todo: NEW TRANSLATION
 game_concept_cultural_opinions: "Kultúrne názory" # todo: NEW TRANSLATION
 game_concept_cultural_opinion_desc: "Každá [Concept('culture','kultúra')|E] má Kultúrny názor na každú inú Kultúru. To ovplyvňuje [Concept('opinion','názor')|e], ktoré má [Concept('country','krajina')|e] s jednou [culture] na [country] s inou [culture], a tiež ovplyvňuje [Concept('pop_satisfaction','spokojnosť populácie')|e] [Concept('pop','populácie')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_non_accepted_culture: "Diskriminovaná kultúra" # todo: NEW TRANSLATION
 game_concept_non_accepted_culture_short: "Diskriminovaná" # todo: NEW TRANSLATION
 game_concept_non_accepted_cultures: "Diskriminované kultúry" # todo: NEW TRANSLATION
 game_concept_non_accepted_culture_desc: "Každá [Concept('culture','kultúra')|e] prítomná v [Concept('country','krajine')|e], ktorá nie je [Concept('primary_culture','hlavná kultúra')|e], ani [Concept('accepted_culture','akceptovaná kultúra')|e], ani [Concept('tolerated_culture','tolerovaná kultúra')|e], sa počíta ako Diskriminovaná kultúra.\n\nPops patriace takejto [culture] nemôžu byť povolané ako [Concept('army_levies','armádnemu brancom')|e] a [Concept('navy_levies','povolané loďstvu')|e] bez špeciálneho [Concept('law','zákonu')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_accepted_culture: "Akceptovaná kultúra"
 game_concept_accept: "Akceptovať"
 game_concept_accepted_culture_short: "Akceptovaná"
 game_concept_accepted_cultures: "Akceptované kultúry"
 game_concept_accepted_culture_desc: "Každá [Concept('country','krajina')|e] môže mať niekoľko [Concept('cultures','kultúry')|e], ktoré sú zaobchádzané úplne rovnako ako [Concept('primary_culture','hlavná kultúra')|e].\n\nPresný počet kultúr, ktoré si krajina môže dovoliť prijať bez postihov, je variabilný a môže byť zvýšený niektorými [Concept('advances','pokrokmi')|e].\n\n[Concept('pops','Populácie')|e] patriace Akceptovanej kultúre môžu byť povolané ako [Concept('army_levies','armádnemu brancom')|e] a [Concept('navy_levies','povolané loďstvu')|e] bez potreby špeciálneho [Concept('law','zákonu')|e].\n\n[pops_with_icon|e] patriace akceptovanej kultúre uvidia svoje [pop_satisfaction_with_icon|e] zvýšené o [GetDefine('NPop','ACCEPTED_CULTURE_SATISFACTION')|%G]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_tolerated_culture: "Tolerovaná kultúra" # todo: NEW TRANSLATION
 game_concept_tolerated_culture_short: "Tolerovaná" # todo: NEW TRANSLATION
 game_concept_tolerate: "Tolerovať" # todo: NEW TRANSLATION
 game_concept_tolerated_cultures: "Tolerované kultúry" # todo: NEW TRANSLATION
 game_concept_tolerated_culture_desc: "Každá [Concept('country','krajina')|e] môže mať niekoľko [Concept('cultures','kultúry')|e], s ktorými sa zaobchádza lepšie než s [Concept('non_accepted_cultures','diskriminovanými kultúrami')|e], ale nie tak dobre ako s [Concept('primary_culture','hlavnou kultúrou')|e].\n\nPresný počet kultúr, ktoré si krajina môže dovoliť tolerovať bez postihov, je variabilný a môže byť zvýšený niektorými [Concept('advances','pokrokmi')|e].\n\n[Concept('pops','Populácie')|e] patriace k tolerovanej kultúre je možné naverbovať ako [Concept('army_levies','armádnemu brancom')|e] a [Concept('navy_levies','povolané loďstvu')|e] bez potreby špeciálneho [Concept('law','zákonu')|e].\n\n[pops_with_icon|e] patriace k tolerovanej kultúre uvidia zvýšenie svojej [pop_satisfaction_with_icon|e] o [GetDefine('NPop','TOLERATED_CULTURE_SATISFACTION')|%G]." # todo: CHANGED # todo: CONCEPT CASE
 game_concept_primary_culture: "Hlavná kultúra" # todo: NEW TRANSLATION
 game_concept_primary_culture_short: "Hlavná" # todo: NEW TRANSLATION
 game_concept_primary_cultures: "Hlavné kultúry" # todo: NEW TRANSLATION
 game_concept_primary_culture_desc: "To je [Concept('culture','kultúra')|e], ku ktorej sa [Concept('country','krajinu')|E] považuje patriť. [Concept('pops','Populácie')|e] inej kultúry sa k nej budú [Concept('assimilate','asimilovať')|e], keď budú podmienky vhodné.\n\n[Concept('common_language','Bežný jazyk')|e] každej [country] je určený [language] ich $game_concept_primary_culture$.\n\n[pops] patriace hlavnej kultúre danej [country] uvidia svoje [pop_satisfaction_with_icon|e] zvýšené o [GetDefine('NPop','PRIMARY_CULTURE_SATISFACTION')|%G]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_primary_or_accepted_culture: "Hlavná alebo akceptovaná kultúra" # todo: NEW TRANSLATION
 game_concept_primary_or_accepted_culture_desc: "Toto je [Concept('culture','kultúra')|e], ktorá je buď [Concept('primary_culture_short','hlavná')|e] alebo [Concept('accepted_culture','akceptovaná kultúra')|e] v [Concept('country','krajine')|E]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_cultural_capacity: "Kultúrna kapacita" # todo: NEW TRANSLATION
 game_concept_cultural_capacity_desc: "Náklady pre [Concept('country','krajinu')|e], aby mala [Concept('culture','kultúra')|e] ako [Concept('accepted_culture','akceptovaná kultúra')|e], závisia od ich [Concept('cultural_opinion','kultúrny názor')|e] o [Concept('primary_culture','hlavnú kultúru')|e] a veľkosti tej kultúry vo vzťahu k hlavnej kultúre." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_religious_status: "Náboženský status" # todo: NEW TRANSLATION
 game_concept_religious_status_desc: "Toto vyjadruje, ako je [Concept('religion','náboženstvo')|e] kategorizované v porovnaní s [Concept('primary_religion','hlavným náboženstvom')|e].\n$BULLET_WITH_TAB$[Concept('primary_religion','Hlavné náboženstvo')|e]\n$BULLET_WITH_TAB$[Concept('heretic','Kacír')|e]\n$BULLET_WITH_TAB$[Concept('heathen','Neznaboh')|e]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_religious_opinion: "Náboženský názor" # todo: NEW TRANSLATION
 game_concept_religious_opinions: "Náboženské názory" # todo: NEW TRANSLATION
 game_concept_religious_opinion_desc: "Každé [Concept('religion','náboženstvo')|E] má náboženský názor na každé iné [religion]. To ovplyvňuje [Concept('opinion','názor')|e], ktorý má [Concept('country','krajina')|e] s jedným [religion] voči [country] s iným [religion], a takisto ovplyvňuje [Concept('pop_satisfaction','spokojnosť populácie')|e] [Concept('pop','populácie')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_primary_religion: "Hlavné náboženstvo" # todo: NEW TRANSLATION
 game_concept_primary_religion_short: "Hlavné" # todo: NEW TRANSLATION
 game_concept_true_faith: "Pravé náboženstvo" # todo: NEW TRANSLATION
 game_concept_official_religion: "Oficiálne náboženstvo" # todo: NEW TRANSLATION
 game_concept_state_religion: "Štátne náboženstvo" # todo: NEW TRANSLATION
 game_concept_state_religion_desc: "Oficiálne [Concept('religion','náboženstvo')|e] [Concept('country','krajiny')|e]. Poskytuje prístup k odlišnému obsahu a mechanikám a môže umožniť veľmi odlišné štýly hrania.\n\n[Concept('pops','Populácie')|e] budú mať vyššie [Concept('pop_satisfaction','spokojnosť populácie')|e], ak patria k hlavnému náboženstvu, a ostatné $game_concept_pops$ sa za vhodných podmienok pomaly budú [Concept('convert','konvertovať')|e] na hlavné náboženstvo.\n\nHlavné náboženstvo má tiež veľký vplyv na [Concept('diplomacy','diplomaciu')|e], keďže krajiny zdieľajúce vieru majú tendenciu vnímať jedna druhú priaznivejšie." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_heretic: "Kacír"
 game_concept_heretics: "Kacíri"
 game_concept_heresy: "Kacírsvo" # todo: NEW TRANSLATION
 game_concept_heretic_desc: "Akékoľvek [Concept('religion','náboženstvo')|e], ktoré zdieľa [Concept('religion_group','náboženská skupina')|e] s [Concept('primary_religion','hlavným náboženstvom')|e] v [Concept('country','krajine')|e], bude považované za kacírske.\n\nV závislosti od [Concept('heretic_tolerance','tolerancie kacírov')|e] v krajine budú kacírske [Concept('pops','populácie')|e] všeobecne mať nižšie [Concept('pop_satisfaction','spokojnosť populácie')|e], a vedenie [Concept('diplomacy','diplomacia')|e] s kacírskymi krajinami môže byť náročnejšie." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_heathen: "Neznaboh"
 game_concept_heathens: "Neznabohovia"
 game_concept_heathenry: "Pohanstvo" # todo: NEW TRANSLATION
 game_concept_heathen_desc: "Akékoľvek [Concept('religion','náboženstvo')|e], ktoré patrí do inej [Concept('religion_group','náboženskej skupiny')|e] než [Concept('primary_religion','hlavné náboženstvo')|e] v [Concept('country','krajine')|e], bude považované za pohanské.\n\nV závislosti od [Concept('heathenry_tolerance','tolerancie neznabohov')|e] v krajine budú pohanské [Concept('pops','populácie')|e] všeobecne mať nižšie [Concept('pop_satisfaction','spokojnosť populácie')|e], a vedenie [Concept('diplomacy','diplomacia')|e] s pohanskými krajinami môže byť náročnejšie." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_dominant_upper_class_culture: "Dominantná kultúra vyššej triedy" # todo: NEW TRANSLATION
 game_concept_dominant_upper_class_culture_desc: "Dominantná [Concept('upper_class','vyššia trieda')|e] kultúra je najväčšia [Concept('culture','kultúra')|e] v [Concept('country','krajine')|e] medzi všetkými [Concept('pops','populáciami')|e] vyššej triedy, vážená podľa [Concept('control','kontroly')|e] miest, kde sú prítomní, a takisto podľa vrodenej [Concept('political_power','politickej moci')|e] [Concept('estate','stavu')|e], ku ktorému patria.\n\nTo neznamená nevyhnutne, že ide o väčšinu." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_dominant_culture: "Dominantná kultúra" # todo: NEW TRANSLATION
 game_concept_dominant_culture_desc: "Dominantná kultúra je najväčšia [Concept('culture','kultúra')|e] v [Concept('location','lokalite')|e] alebo v [Concept('country','krajine')|e].\nTo neznamená nevyhnutne, že ide o väčšinu." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_foreign_culture: "Cudzia kultúra" # todo: NEW TRANSLATION
 game_concept_foreign_culture_short: "Cudzia" # todo: NEW TRANSLATION
 game_concept_foreign_culture_desc: "Toto je [Concept('cultural_status','kultúrny status')|e] [Concept('culture','kultúry')|e], ktorá nemá v [Concept('country','krajine')|e] žiadne [Concept('pops','populácie')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_cultural_status: "Kultúrny status" # todo: NEW TRANSLATION
 game_concept_cultural_status_short: "Status" # todo: NEW TRANSLATION
 game_concept_cultural_status_desc: "Každá [Concept('culture','kultúra')|e] je pre [Concept('country','krajinu')|e] vnímaná ako jedna z nasledujúcich:\n$BULLET_WITH_TAB$[Concept('primary_culture','Hlavná kultúra')|e]\n$BULLET_WITH_TAB$[Concept('accepted_culture','Akceptovaná kultúra')|e]\n$BULLET_WITH_TAB$[Concept('non_accepted_culture','Diskriminovaná kultúra')|e]\n$BULLET_WITH_TAB$[Concept('tolerated_culture','Tolerovaná kultúra')|e]\n$BULLET_WITH_TAB$[Concept('foreign_culture','Cudzia kultúra')|e]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_assimilate: "Asimilovať"
 game_concept_assimilates: "Asimilácie"
 game_concept_assimilating: "Asimilovanie"
 game_concept_assimilated: "Asimilované"
 game_concept_assimilation: "Asimilácia"
 game_concept_assimilation_rate: "Rýchlosť asimilácie"
 game_concept_assimilate_desc: "Ide o proces, pri ktorom sa [Concept('pops','populácie')|e] jednej [Concept('culture','kultúre')|e] časom menia na [Concept('primary_culture','hlavnú kultúru')|e] [Concept('country','krajinu')|e], ktorá ich [Concept('owns','vlastní')|e].\n\nProces sa zrýchľuje, ak má [primary_culture] vysokú [Concept('culture_war_power','silu kultúrnu vojny')|e] oproti kultúre daného [Concept('pop','populácie')|e].\n\nNiektoré konkrétne [Concept('cultures','kultúry')|e] sú priamo viazané na svoju [Concept('faith','vieru')|e], takže nebudú asimilovateľné, kým nebudú najprv [Concept('converted','konvertované')|e].\n\nKultúra musí byť buď prítomná v krajine, alebo mať voči hráčovi neutrálny alebo vyšší názor, aby bola vyberateľná." # todo: CHANGED # todo: CONCEPT CASE
 game_concept_occupation: "Okupácia"
 game_concept_occupations: "Okupácie"
 game_concept_occupied: "Okupované"
 game_concept_occupier: "Okupant"
 game_concept_occupy: "Okupovať"
 game_concept_occupying: "Okupovanie"
 game_concept_occupation_desc: "Okupácia nastane, keď je [Concept('controller','kontrolujúci')|e] [Concept('location','lokality')|e] odlišný od jeho [Concept('owner','majiteľa')|e]. To sa stáva, keď [location] padne do [zone_of_control] [fortification|e], ktorú [controlled] [Concept('enemy','vojnového nepriateľa')|e], alebo keď [Concept('army','armáda')|e] úspešne [Concept('sieges','obliehania')|e] dané miesto.\n\nV mnohých prípadoch musí byť [Concept('location','lokalita')|e] obsadené, skôr než môže byť pridané do [Concept('peace_treaty','mierovej dohody')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_siege: "Obliehanie"
 game_concept_besieged: "Obliehaný"
 game_concept_sieged: "Obliehaný"
 game_concept_sieges: "Obliehania"
 game_concept_siege_desc: "Obliehanie nastane, keď [Concept('army','armáda')|e] príde do [Concept('location','lokality')|e], keď sú [Concept('controller','kontrolujúci')|e] a $game_concept_army$ [Concept('enemies','vojnoví nepriatelia')|e].\n\nObleženie $game_concept_location$ bez [fortification|e] zvyčajne trvá približne mesiac, avšak ak je prítomná $game_concept_fortification$, potrvá to oveľa dlhšie v závislosti na úrovni $game_concept_fortification$.\n\nAk $game_concept_army$ vyhrá proti lokalite [Concept('owned','vlastnené')|e] vojnovému nepriateľovi, stane sa následne [Concept('occupied','okupované')|e] a zvýši [Concept('war_score','vojnové skóre')|e] pre armádu majiteľa.\n\nAby sa [Concept('siege','obliehanie')|e] mohol posúvať, musí byť obliehajúcich aspoň toľko mužov, koľko je v [Concept('garrison','posádke')|e]. Pre [Concept('location','lokalitu')|e] bez [Concept('fortifications','opevnení')|e] musí byť aspoň #V 100#! mužov." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_assault: "Priamy útok"
 game_concept_assault_desc: "Priamy útok nastáva, keď útočník v [Concept('siege','obliehaní')|e] sa pokúsi vtrhnúť do [fortification|e], aby ho obsadil čo najrýchlejšie. Útok môže byť veľmi nákladný, pretože útočník utrpí veľké straty." # todo: CONCEPT CASE
 game_concept_garrison: "Posádka" # todo: NEW TRANSLATION
 game_concept_garrisons: "Posádky" # todo: NEW TRANSLATION
 game_concept_garrison_desc: "Sú to vojaci, ktorí bránia [Concept('fortifications','opevnenia')|e] [Concept('location','lokality')|e]. Keď sú všetci zabití, alebo stratí svoju [Concept('morale','morálku')|e], [Concept('siege','obliehanie')|e] pre obrancu skončí prehrou.\n\nAby sa [Concept('siege','obliehanie')|e] mohol posúvať, musí byť obliehajúcich aspoň toľko mužov, koľko je v [Concept('garrison','posádke')|e]. Pre [Concept('location','lokalitu')|e] bez [Concept('fortifications','opevnení')|e] musí byť aspoň #V 100#! mužov." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_combat: "Boj" # todo: NEW TRANSLATION
 game_concept_battle: "Bitka" # todo: NEW TRANSLATION
 game_concept_battles: "Bitky" # todo: NEW TRANSLATION
 game_concept_combats: "Boje" # todo: NEW TRANSLATION
 game_concept_combat_desc: "Ak sa dve alebo viac [Concept('armies','armády')|e] stretnú v [Concept('location','lokalite')|e], alebo dve alebo viac [Concept('navies','námorné sily')|e] v [Concept('seazone','morskej zóne')|e], a sú si navzájom [Concept('hostile','nepriateľský')|e], začne medzi nimi bitka.\nBitka zvyčajne začína [Concept('bombard_phase','bombardovaciu fázu')|e] a potom pokračuje v [Concept('combat_phase','bojovej fáze')|e]. Každý [Concept('regiment','pluk')|e] alebo [Concept('ship','loď')|e] sa pokúsi [Concept('engage','zapojiť')|e] nepriateľa a bojovať, až kým jedna strana [Concept('retreats','ústupy')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_attacker: "Útočník" # todo: NEW TRANSLATION
 game_concept_attacker_desc: "Útočník v [Concept('battle','bitke')|e] môže mať niekoľko nevýhod, keďže dostane prípadné tresty za [Concept('topography','topografiu')|e], [Concept('vegetation','vegetáciu')|e] alebo [Concept('crossing','prechod')|e]. Druhá strana sa nazýva [Concept('defender','obranca')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_defender: "Obranca" # todo: NEW TRANSLATION
 game_concept_defender_desc: "Obranca v [Concept('battle','bitke')|e] sa vyhne trestom, ktoré môže dostať [Concept('attacker','útočník')|e]. Zvyčajne je obranca [Concept('army','armáda')|e] alebo [Concept('navy','námorníctvo')|e], ktorá je prvá prítomná v [Concept('location','lokalite')|e], pokiaľ nie je zaneprázdnená v [Concept('siege','obliehaní')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_crossing: "Prechod" # todo: NEW TRANSLATION
 game_concept_river_crossing: "Brod cez rieku" # todo: NEW TRANSLATION
 game_concept_strait_crossing: "Úžinný prechod" # todo: NEW TRANSLATION
 game_concept_sea_landing: "Vylodenie" # todo: NEW TRANSLATION
 game_concept_crossing_desc: "[Concept('army','Armáda')|e] prechádzajúca riekou medzi dvoma [Concept('locations','lokalitami')|e], prekonávajúca [Concept('strait','prieliv')|e] alebo pristávajúca z [Concept('seazone','morskej zóny')|e] dostane penalizáciu v [Concept('battle','bitke')|e], ak sú [Concept('attacker','útočník')|e].\n\nPrechod cez [river] ukladá penalizáciu pre [attacker] vo výške [GetDefine('NCombat','RIVER_CROSSING_DICE')|R] na hode kockou. Prechod cez [strait] ukladá penalizáciu [GetDefine('NCombat','STRAIT_CROSSING_DICE')|R]." # todo: CHANGED # todo: CONCEPT CASE
 game_concept_army_experience: "Skúsenosti armády" # todo: NEW TRANSLATION
 game_concept_navy_experience: "Skúsenosti námorníctva" # todo: NEW TRANSLATION
 game_concept_experience: "Skúsenosti" # todo: NEW TRANSLATION
 game_concept_experience_desc: "Skúsenosti znižujú [Concept('damage_taken','obdržané poškodenie')|e] v [Concept('battle','bitke')|e] a primárne sa získavajú účasťou v [battle], v [Concept('siege','obliehaní')|e] alebo v [Concept('blockade','blokáde')|e]. V priebehu času skúsenosti [Concept('regiment','pluk')|e] alebo [Concept('ship','loď')|e] pomaly klesajú.\n[regiments] môžu tiež získať skúsenosti pomocou [ShowUnitAbilityName('drill_army')] [Concept('unit_ability','schopnosti jednotky')|e].\nS niektorými [Concept('recruitment_methods','metódami náboru')|e] môže nová jednotka začínať s vyššou úrovňou skúseností." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_capital: "Hlavné mesto" # todo: NEW TRANSLATION
 game_concept_capital_desc: "To je [Concept('location','lokalita')|e], ktoré je politickým centrom [Concept('country','krajinou')|e], kde sídli [Concept('government','vláda')|e]. Jeho [Concept('occupied','okupované')|e] získanie v [Concept('war','vojne')|e] môže byť devastujúce." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_price: "Cena" # todo: NEW TRANSLATION
 game_concept_prices: "Ceny" # todo: NEW TRANSLATION
 game_concept_cost: "Náklad" # todo: NEW TRANSLATION
 game_concept_costs: "Náklady" # todo: NEW TRANSLATION
 game_concept_price_desc: "Cena je niečo, čo [Concept('country','krajina')|e] platí za aktivitu. Cena môže byť [Concept('gold','dukáty')|e], [Concept('manpower','živá sila')|e], vplyv na [Concept('stability','stabilitu')|e] alebo iné veci." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_unit: "Jednotka" # todo: NEW TRANSLATION
 game_concept_units: "Jednotky" # todo: NEW TRANSLATION
 game_concept_unit_desc: "Jednotka môže byť buď [Concept('army','armáda')|e] alebo [Concept('navy','námorníctvo')|e]. Skladá sa z [Concept('sub_units','podjednotky')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_unit_template: "Šablóna jednotky" # todo: NEW TRANSLATION
 game_concept_unit_templates: "Šablóny jednotiek" # todo: NEW TRANSLATION
 game_concept_unit_template_desc: "Šablóna jednotky je zbierka [Concept('unit_types','typy jednotiek')|e], ktorá môže byť použitá na priamy nábor rôznych [Concept('units','jednotiek')|e]. Dá sa použiť na vytvorenie [Concept('regiments','pluky')|e] aj [Concept('ships','lode')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_sub_unit: "Podjednotka" # todo: NEW TRANSLATION
 game_concept_sub_units: "Podjednotky" # todo: NEW TRANSLATION
 game_concept_sub_unit_desc: "Podjednotky sú jednotlivé zložky [Concept('unit','jednotka')|e], ktoré bojujú ako [Concept('regiments','pluky')|e] alebo ako [Concept('ships','lode')|e]. Vždy sú určitého [Concept('unit_type','typu jednotky')|e] a patria do [unit_category|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_distributing_food: "Distribúcia jedla" # todo: NEW TRANSLATION
 game_concept_distribute_food: "Distribuovať jedlo" # todo: NEW TRANSLATION
 game_concept_distributing_food_desc: "Toto pošle [Concept('food','potraviny')|e] z [Concept('navy','námorníctva')|e] do ľubovoľnej [Concept('army','armády')|e] v susednom [Concept('location','lokalite')|e], ktorá nedokáže získať [food] zo svojej aktuálnej [location] alebo blízkeho [Concept('supply_depot','zásobovacieho skladu')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_gathering_food: "Zhromažďovanie jedla" # todo: NEW TRANSLATION
 game_concept_gather_food: "Zhromaždiť jedlo" # todo: NEW TRANSLATION
 game_concept_gathering_food_desc: "[Concept('navy','Námorníctvo')|e], ktorá zhromažďuje jedlo, zoberie [Concept('food','potraviny')|e] zo všetkých susedných [Concept('locations','lokality')|e], ku ktorým má [Concept('food_access','prístup k potravinám')|e], aby naplnila svoju [Concept('food_capacity','kapacitu potravín')|e]. [navy] potom môže v prípade potreby [Concept('distribute_food','distribuovať jedlo')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_food_source: "Zdroj jedla" # todo: NEW TRANSLATION
 game_concept_food_source_desc: "[Concept('army','Armáda')|e] bude zbierať jedlo z [Concept('province','provincie')|e], kde má [Concept('food_access','prístup k potravinám')|e], z priateľského [Concept('supply_depot','zásobovacieho skladu')|e] alebo z [Concept('navy','námorníctva')|e], ktorá [Concept('distributing_food','distribúcie jedla')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_food_decay: "Znehodnocovanie potravín" # todo: NEW TRANSLATION
 game_concept_food_decay_desc: "[Concept('food','Potraviny')|e] nevydrží večne, každý mesiac sa časť pokazí." # todo: CHANGED # todo: CONCEPT CASE
 game_concept_logistics_distance: "Logistická vzdialenosť" # todo: NEW TRANSLATION
 game_concept_logistics_distance_desc: "Toto udáva, ako ďaleko môže [Concept('army','armáda')|e] viesť svoje zásobovacie linky k [Concept('food_source','zdroju jedla')|e]. Armády budú získavať jedlo z [Concept('province','provincie')|e], kde majú [Concept('food_access','prístup k potravinám')|e], z priateľského [Concept('supply_depot','zásobovacieho skladu')|e] alebo z [Concept('navy','námorníctva')|e], ktorá [Concept('distributing_food','distribúcie jedla')|e]. [Concept('hostile','Nepriateľská')|e] armáda alebo [Concept('zone_of_control','zóna kontroly')|e] to zablokujú." # todo: CHANGED # todo: CONCEPT CASE
 game_concept_military_objective: "Vojenský cieľ" # todo: NEW TRANSLATION
 game_concept_military_objectives: "Vojenské ciele" # todo: NEW TRANSLATION
 game_concept_military_objective_desc: "[Concept('armies','Armády')|e] a [Concept('navies','námorné sily')|e] môžu mať priradené ciele, ktoré sa budú snažiť plniť samostatne." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_army: "Armáda" # todo: NEW TRANSLATION
 game_concept_armies: "Armády" # todo: NEW TRANSLATION
 game_concept_army_desc: "Armáda je skupina [Concept('regiments','pluky')|e] vedená [Concept('character','postava')|e], ktorá môže viesť [Concept('battles','bitky')|e] a [Concept('siege','obliehanie')|e] protivníkových [Concept('fortifications','opevnení')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_navy: "Námorníctvo" # todo: NEW TRANSLATION
 game_concept_navies: "Námorné sily" # todo: NEW TRANSLATION
 game_concept_navy_desc: "Námorné sily umožňujú [Concept('country','krajina')|e] presadzovať moc za hranicami svojho územia. Námorné sily sú skupiny [Concept('ships','lode')|e] vedené [Concept('character','postava')|e], ktoré môžu viesť [Concept('battles','bitky')|e], [Concept('blockade','blokáda')|e] [Concept('hostile','nepriateľské')|e] pobrežia, narúšať nepriateľskú [Concept('maritime_presence','námornú prítomnosť')|e] a prepravovať [Concept('armies','armády')|e] tam, kde sú potrebné. Tiež pomáhajú s logistikou, pretože môžu [Concept('distribute_food','distribuovať jedlo')|e] a [Concept('gather_food','zhromaždiť jedlo')|e]." # todo: CHANGED # todo: CONCEPT CASE
 game_concept_ship: "Loď" # todo: NEW TRANSLATION
 game_concept_ships: "Lode" # todo: NEW TRANSLATION
 game_concept_ship_desc: "Základná stavebná jednotka [Concept('navy','námorníctvo')|e]. Loď môže niesť [Concept('food','potraviny')|e], [Concept('regiments','pluky')|e] a svoju posádku. Každá loď má špecifický [Concept('ship_type','typ lode')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_regular_regiment: "Stály pluk" # todo: NEW TRANSLATION
 game_concept_regular_regiments: "Stále pluky" # todo: NEW TRANSLATION
 game_concept_regular: "Stály vojak" # todo: NEW TRANSLATION
 game_concept_regulars: "Stáli vojaci" # todo: NEW TRANSLATION
 game_concept_regular_regiment_desc: "Stále pluky sa verbujú manuálne [Concept('country','krajina')|e], najčastejšie pomocou [Concept('manpower','živej sily')|e] a [Concept('gold','dukáty')|e]. Tvoria stálu [Concept('armies','armádu')|e] a ich počet je skromný, kým nezískate [Concept('advances','pokroky')|e] z neskorších [Concept('ages','vekov')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_regular_ship: "Bežná loď" # todo: CHANGED
 game_concept_regular_ships: "Stále lode" # todo: NEW TRANSLATION
 game_concept_regular_ship_desc: "Pravidelné lode sa verbujú manuálne [Concept('country','krajina')|e] pomocou [Concept('sailors','námorníkov')|e] a [Concept('gold','dukáty')|e]. Tvoria stálu [Concept('navies','námorné sily')|e] a ich počet je obmedzený, kým nezískate [Concept('advances','pokroky')|e] z neskorších [Concept('ages','vekov')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_regiment: "Pluk" # todo: NEW TRANSLATION
 game_concept_regiments: "Pluky" # todo: NEW TRANSLATION
 game_concept_regiment_desc: "Pluk je stavebný blok [Concept('army','armáda')|e]. Každý má [Concept('maximum_strength','maximálna sila')|e] [Concept('manpower','živej sily')|e] a je určeného [Concept('unit_type','typu jednotky')|e]. Môže byť [Concept('army_levy','armádny branec')|e], [Concept('mercenary','žoldnier')|e] alebo [Concept('regular_regiment','stály pluk')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_average_morale: "Priemerná morálka" # todo: NEW TRANSLATION
 game_concept_average_morale_desc: "Toto je priemerná [Concept('morale','morálka')|e] všetkých [Concept('regiments','pluky')|e] alebo [Concept('ships','lode')|e] v [Concept('unit','jednotke')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_army_morale: "Morálka armády" # todo: NEW TRANSLATION
 game_concept_navy_morale: "Morálka námorníctva" # todo: NEW TRANSLATION
 game_concept_morale: "Morálka" # todo: NEW TRANSLATION
 game_concept_morale_i: "@morale!" # todo: NEW TRANSLATION
 game_concept_morale_desc: "Morálka udáva, ako dlho bude [Concept('army','armáda')|e] alebo [Concept('navy','námorníctvo')|e] bojovať, kým sa nevzdá.\n\nV [Concept('battle','bitke')|e] každý [Concept('regiment','pluk')|e] alebo [Concept('ship','loď')|e] spôsobuje [Concept('morale_damage_done','spôsobené poškodenie morálky')|e] svojmu protivníkovi, ktorého efekt je upravený podľa protivníkovej [Concept('morale_damage_taken','obdržaného poškodenia morálky')|e]. Keď morálka dosiahne nulu, armáda alebo námorníctvo sa [Concept('retreat','ústup')|e] a prehrá [battle]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_locked: "Zamknuté" # todo: NEW TRANSLATION
 game_concept_locked_desc: "[Concept('army','Armáda')|e] alebo [Concept('navy','námorníctvo')|e], ktorá je zamknutá, nemôže dostať rozkazy. Musíte počkať, kým znovu nezískate prístup k tejto jednotke." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_trade_profit: "Zisk z obchodu" # todo: NEW TRANSLATION
 game_concept_trade_profit_desc: "Zisk z obchodu závisí predovšetkým od rozdielu medzi [Concept('market_prices','trhovými cenami')|e] [Concept('goods','tovarmi')|e] v [Concept('export_market','vývoznom trhu')|e] a [Concept('import_market','dovoznom trhu')|e]. Existujú aj prevádzkové náklady, ktoré znížia zisk, a niektoré obchody môžu byť povinné platiť [Concept('sound_toll','prieplavné mýto')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_trade_orders: "Obchodné príkazy" # todo: NEW TRANSLATION
 game_concept_trade_order: "Obchodný príkaz" # todo: NEW TRANSLATION
 game_concept_trade_orders_desc: "Obchodné príkazy vám umožňujú prideliť [Concept('merchant_capacity','obchodná kapacita')|e] na automatické [Concept('import','dovoz')|e] alebo [Concept('export','vývoz')|e] konkrétneho [Concept('good','tovaru')|e] bez určenia cieľa. AI si každý deň vyberie najlepšiu trasu." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_trade: "Obchod" # todo: NEW TRANSLATION
 game_concept_trading: "Obchodovanie" # todo: NEW TRANSLATION
 game_concept_trades: "Obchody" # todo: NEW TRANSLATION
 game_concept_trade_desc: "Obchod je presun [Concept('good','tovar')|e] z jedného [Concept('market','trhu')|e] do druhého. Towary sa nakupujú na jednom trhu a predávajú na druhom s cieľom dosiahnuť [Concept('trade_profit','zisk z obchodu')|e] pre vlastníka obchodu. Počet potrebného [Concept('merchant_capacity','neobchodnej kapacity')|e] závisí od vzdialenosti medzi trhmi a množstva [goods], ktoré obchod spracúva.\n\n[Concept('trade_income','Príjem z obchodu')|e] sa delí medzi Korunu a [estates_with_icon|e] podľa ich [estate_power_with_icon|e]. Iba percento [crown_power_with_icon|e] ide do [Concept('treasury','pokladnice')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_import: "Dovoz" # todo: NEW TRANSLATION
 game_concept_importing: "Dovážanie" # todo: NEW TRANSLATION
 game_concept_imported: "Dovezené" # todo: NEW TRANSLATION
 game_concept_imports: "Dovozy" # todo: NEW TRANSLATION
 game_concept_import_desc: "Import je [Concept('trade','obchod')|e], ktorý presúva [Concept('goods','tovary')|e] do [Concept('market','trhu')|e], a tým zvyšuje jeho [Concept('supply','ponuky')|e] v tomto [Concept('market','trhu')|e]." # todo: CHANGED # todo: CONCEPT CASE
 game_concept_export: "Vývoz" # todo: NEW TRANSLATION
 game_concept_exporting: "Vyvážanie" # todo: NEW TRANSLATION
 game_concept_exported: "Vyvezené" # todo: NEW TRANSLATION
 game_concept_exports: "Vývozy" # todo: NEW TRANSLATION
 game_concept_export_desc: "Export je [Concept('trade','obchod')|e], ktorý presúva [Concept('goods','tovary')|e] z [Concept('market','trhu')|e] von a tým zvyšuje jeho [Concept('demand','dopytu')|e] v tom [Concept('market','trhu')|e].\n\nAk sa viaceré obchodné toky snažia exportovať rovnaké tovary, sú tovary prideľované podľa poradia [Concept('merchant_power','obchodná výhoda')|e]." # todo: CHANGED # todo: CONCEPT CASE
 game_concept_trade_income: "Príjem z obchodu" # todo: NEW TRANSLATION
 game_concept_trade_income_share: "Podiel na príjmoch z obchodu" # todo: NEW TRANSLATION
 game_concept_trade_income_desc: "Peniaze získané z [trades_with_icon|e] predajom [goods_with_icon|e] na [markets_with_icon|e].\n\nPríjem z obchodu sa delí medzi Korunu a [estates_with_icon|e] podľa ich [estate_power_with_icon|e]. Iba percento [crown_power_with_icon|e] ide do [Concept('treasury','pokladnice')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_trade_expense: "Náklady na obchod" # todo: NEW TRANSLATION
 game_concept_trade_expense_desc: "Peniaze vynaložené na [Concept('trades','obchody')|e], nákup [Concept('goods','tovary')|e] z [Concept('markets','trhov')|e] a náklady na [Concept('merchant_maintenance','údržbu neobchodnú trasy')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_burgher_trade: "$burghers$ obchodovanie" # todo: NEW TRANSLATION
 game_concept_burgher_trades: "$burghers$ obchody" # todo: NEW TRANSLATION
 game_concept_burgher_trade_desc: "[ShowPopTypeName('burghers')] sa budú snažiť uspokojiť potreby po [Concept('goods','tovaroch')|e] v [Concept('market','trhu')|e], kde sa nachádza ich [Concept('town_or_city','mestská lokalita')|e], prostredníctvom vlastných [Concept('trades','obchodov')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_burghers_exporting: "$burghers$ vyvážanie" # todo: NEW TRANSLATION
 game_concept_burghers_importing: "$burghers$ dovážanie" # todo: NEW TRANSLATION
 game_concept_common_goods: "Bežné tovary" # todo: NEW TRANSLATION
 game_concept_base_production: "Základná produkcia" # todo: NEW TRANSLATION
 game_concept_common_goods_desc: "Niektoré [Concept('goods','tovary')|e], ako [ShowGoodsName('stone')] alebo [ShowGoodsName('clay')], sa dajú vyrábať všade bez potreby [Concept('rgo','R.G.O.')|e], a považujú sa za bežné tovary. Rovnako ako ostatné $game_concept_goods$, sú potom poskytované na [Concept('market','trh')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_topography: "Topografia" # todo: NEW TRANSLATION
 game_concept_topography_desc: "Topografia predstavuje členitosť a nadmorskú výšku terénu v [Concept('location','lokalite')|e]. Rovnejší terén je všeobecne lepší pre rast [Concept('towns_and_cities','mestské lokality')|e], zatiaľ čo členitejší terén sa ľahšie bráni." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_vegetation: "Vegetácia" # todo: NEW TRANSLATION
 game_concept_vegetation_desc: "Vegetácia predstavuje pokrytie rastlinstvom v [Concept('location','lokalite')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_construction: "Výstavba" # todo: NEW TRANSLATION
 game_concept_constructions: "Výstavby" # todo: NEW TRANSLATION
 game_concept_construction_desc: "Proces budovania niečoho v [Concept('location','lokalite')|e], napríklad [Concept('building','budova')|e], [Concept('regiment','pluk')|e] alebo [ShowLocationRankName('city')].\n\nVýstavba vyžaduje [Concept('goods','tovary')|e] z [Concept('market','trhu')|e] [Concept('location','lokality')|e], v ktorom prebieha. Ak potrebné [goods] nie sú dostupné, [construction] sa zastaví." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_regular_army: "Stála armáda" # todo: NEW TRANSLATION
 game_concept_regular_army_desc: "Označuje stálu [Concept('army','armádu')|e], ktorú má [Concept('country','krajina')|e], s výnimkou [Concept('levies','brancami')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_unit_type: "Typ jednotky" # todo: NEW TRANSLATION
 game_concept_ship_type: "Typ lode" # todo: NEW TRANSLATION
 game_concept_unit_types: "Typy jednotiek" # todo: NEW TRANSLATION
 game_concept_unit_type_short: "Typ" # todo: NEW TRANSLATION
 game_concept_unit_types_short: "Typy" # todo: NEW TRANSLATION
 game_concept_unit_type_desc: "Každá [Concept('unit_category','kategória jednotky')|e] obsahuje množstvo variantov typov. Rôzne typy vznikajú z [Concept('advances','pokrokov')|e], [Concept('culture','kultúry')|E] alebo z iných zdrojov. Typ robí jednotku jedinečnou a dáva jej schopnosti a atribúty. Príklady pre [Concept('ships','lode')|e] zahŕňajú [ShowUnitDefinitionName('n_cog')], [ShowUnitDefinitionName('n_twodecker')] a [ShowUnitDefinitionName('n_xebec')], zatiaľ čo [Concept('regiments','pluky')|e] zahŕňajú [ShowUnitDefinitionName('a_arquebusiers')] a [ShowUnitDefinitionName('a_cavaliers')] medzi mnohými ďalšími." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_unit_category: "Kategória jednotky" # todo: NEW TRANSLATION
 game_concept_unit_categories: "Kategórie jednotiek" # todo: NEW TRANSLATION
 game_concept_unit_category_short: "Kategória" # todo: NEW TRANSLATION
 game_concept_unit_categories_short: "Kategórie" # todo: NEW TRANSLATION
 game_concept_unit_category_upper_desc: "Pluk alebo loď vždy patrí do jednej z nasledujúcich kategórií." # todo: NEW TRANSLATION
 game_concept_unit_category_list_title: "Zoznam kategórií jednotiek" # todo: NEW TRANSLATION
 game_concept_unit_category_desc: "$game_concept_unit_category_upper_desc$\n[ShowDatabase('unit_category')]" # todo: NEW TRANSLATION
 game_concept_language: "Jazyk" # todo: NEW TRANSLATION
 game_concept_languages: "Jazyky" # todo: NEW TRANSLATION
 game_concept_language_desc: "Každá [Concept('culture','kultúra')|E] má [language], ktorý môže zdieľať s inými [cultures]. [language] má [Concept('language_power','silou jazyka')|e] a ľubovoľný počet [Concept('dialects','dialekty')|e], ktoré určujú mená [Concept('characters','postavy')|e].\n\n[Concept('country','Krajina')|e] môže mať [Concept('court_language','jazyk dvora')|e], [Concept('liturgical_language','liturgický jazyk')|e] a zdieľa svoj [Concept('common_language','bežný jazyk')|e] s [Concept('primary_culture','hlavnou kultúrou')|e].\n\nNiektoré jazyky patria do [Concept('language_family','jazykovej rodiny')|e], zatiaľ čo iné sú [Concept('isolated_language_short','izolovaný')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_isolated_language: "Izolovaný jazyk" # todo: NEW TRANSLATION
 game_concept_isolated_languages: "Izolované jazyky" # todo: NEW TRANSLATION
 game_concept_isolated_language_short: "Izolovaný" # todo: NEW TRANSLATION
 game_concept_isolated_language_desc: "[Concept('language','Jazyk')|e] je [isolated_language_short], keď nezdieľa [Concept('language_family','jazyková rodina')|e] s inými [languages]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_language_family: "Jazyková rodina" # todo: NEW TRANSLATION
 game_concept_language_families: "Jazykové rodiny" # todo: NEW TRANSLATION
 game_concept_language_family_short: "Rodina" # todo: NEW TRANSLATION
 game_concept_language_families_short: "Rodiny" # todo: NEW TRANSLATION
 game_concept_language_family_desc: "Jazyková rodina je súbor [Concept('languages','jazyky')|e], ktoré pochádzajú z spoločného predka a môžu teda zdieľať veľa podobností.\n\nNiektoré [languages] nepatria do [language_family_short] a sú preto [Concept('isolated_language','izolovaný jazyk')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_dialect: "Dialekt" # todo: NEW TRANSLATION
 game_concept_dialects: "Dialekty" # todo: NEW TRANSLATION
 game_concept_dialect_desc: "[dialect] je variácia [Concept('language','jazyk')|e]. Predovšetkým ovplyvňuje mená, ako sú [Concept('characters','postavy')|e] a [Concept('locations','lokality')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_language_power: "Sila jazyka" # todo: NEW TRANSLATION
 game_concept_language_power_desc: "Sila jazyka predstavuje dosah, vplyv a prestíž [Concept('language','jazyk')|e]. Je vyjadrená ako percento vzhľadom na najsilnejší jazyk na svete.\n\nVypočítava sa z celkovej [Concept('political_power','politickej moci')|e] [Concept('pops','populácie')|e] s [Concept('primary_culture','hlavnou kultúrou')|e] v [Concept('countries','krajine')|e], kde je to [Concept('court_language','jazyk dvora')|e], a počtu klerikov nasledovných [Concept('primary_religion','hlavné náboženstvo')|e] v krajinách, kde je to [Concept('liturgical_language','liturgický jazyk')|e].\n\nMať [liturgical_language] s vysokou jazykovou silou zvyšuje rýchlosť [Concept('research','výskum')|e], zatiaľ čo [court_language] s vysokou jazykovou silou zvyšuje [Concept('estate_satisfaction','spokojnosť stavu')|e] Nobility." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_dominant_language: "Dominantný jazyk" # todo: NEW TRANSLATION
 game_concept_dominant_language_desc: "Dominantný jazyk je [Concept('language','jazyk')|e] s najväčším počtom [Concept('pops','populáciami')|e] hovoriacich ním v [Concept('location','lokalite')|e].\nTo neznamená nevyhnutne, že ide o väčšinu." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_dominant_dialect: "Dominantný dialekt" # todo: NEW TRANSLATION
 game_concept_dominant_dialect_desc: "Dominantný dialekt je [Concept('dialect','dialekt')|e] s najväčším počtom [Concept('pops','populáciami')|e] hovoriacich ním v [Concept('location','lokalite')|e].\nTo neznamená nevyhnutne, že ide o väčšinu." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_ability: "Schopnosť" # todo: NEW TRANSLATION
 game_concept_abilities: "Schopnosti" # todo: NEW TRANSLATION
 game_concept_ability_desc: "Schopnosť predstavuje rôzne nadania každého [Concept('character','postavy')|e]. Hodnoty každej sú v rozsahu 0 až 100. Novorodenci začínajú na 0 a postupne si zlepšujú schopnosti, ako rastú.\n\nExistujú tri typy schopností:\n - [Concept('adm_short','administratívneho')|e]\n - [Concept('dip_short','diplomatického')|e]\n - [Concept('mil_short','vojenského')|e]\n\nSpolu tvoria [character] [Concept('total_ability','celkovej schopnosti')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_liturgical_language: "Liturgický jazyk" # todo: NEW TRANSLATION
 game_concept_liturgical_languages: "Liturgické jazyky" # todo: NEW TRANSLATION
 game_concept_liturgical_language_desc: "Oficiálny [Concept('language','jazyk')|e], ktorý [Concept('country','krajina')|e] používa pre svoje oficiálne [Concept('religion','náboženstvo')|e]. Niektoré náboženstvá, ako [ShowReligionName('catholic')], majú pevne daný $game_concept_liturgical_language$, ktorý sa nedá zmeniť, ale iné náboženstvá umožňujú krajinám zmeniť ho. [Concept('language_power','Sila jazyka')|e] Liturgický jazyk krajiny ovplyvňuje rýchlosť, akou [Concept('research','výskumom')|e] nové [Concept('advances','pokroky')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_liturgical_dialect: "Liturgický dialekt" # todo: NEW TRANSLATION
 game_concept_liturgical_dialect_desc: "Hlavný [Concept('dialect','dialekt')|e] [Concept('liturgical_language','liturgického jazyka')|e] v [Concept('country','krajine')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_common_language: "Bežný jazyk" # todo: NEW TRANSLATION
 game_concept_common_languages: "Bežné jazyky" # todo: NEW TRANSLATION
 game_concept_common_language_desc: "Toto je [Concept('language','jazyk')|e] [Concept('primary_culture','hlavnej kultúry')|e] v [Concept('country','krajine')|e]. Ak je to zároveň [Concept('court_language','jazyk dvora')|e], [ShowEstateTypeName('peasants_estate')] bude spokojný." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_market_language: "Jazyk trhu"
 game_concept_market_language_desc: "Toto je [Concept('language','jazyk')|e], ktorým hovorí väčšina [ShowPopTypeName('burghers')] v [Concept('market_center','trhovom centre')|e].\n\n[ShowPopTypeNameWithNoTooltip('burghers')] ktorí už hovoria $game_concept_market_language$ svojho trhu, sú neochotní sa ho vzdať. Ich miera [Concept('assimilate','asimilovať')|e] smerom ku kultúram, ktoré tento jazyk nezdieľajú, je znížená úmerne [Concept('market_access','prístup na trh')|e] lokality — silné obchodné väzby spomaľujú asimiláciu, zatiaľ čo slabé väzby ju takmer neovplyvnia." # todo: CHANGED # todo: CONCEPT CASE
 game_concept_foreign_language: "Cudzí jazyk" # todo: NEW TRANSLATION
 game_concept_foreign_language_desc: "[Concept('language','Jazyk')|e], ktorý nie je ani [Concept('common_language','bežný jazyk')|e], ani [Concept('liturgical_language','liturgický jazyk')|e] [Concept('country','krajiny')|e], bude považovaný za cudzí jazyk." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_court_language: "Jazyk dvora" # todo: NEW TRANSLATION
 game_concept_court_language_desc: "Jazyk dvora [language_with_icon|e] vlády v [country_with_icon|e].\n\nNiektoré jazyky môžu ovplyvniť [Concept('estate_satisfaction','spokojnosť stavu')|e] rôznych [Concept('estates','stavov')|e]:\n$BULLET$[ShowEstateTypeName('nobles_estate')] uprednostňujú vysokú [language_power_with_icon|e].\n$BULLET$[ShowEstateTypeName('clergy_estate')] uprednostňujú [liturgical_language_with_icon|e].\n$BULLET$[ShowEstateTypeName('peasants_estate')] uprednostňujú [common_language_with_icon|e].\n$BULLET$Použitie [market_language_with_icon|e] nášho [capital] zvýši [Concept('selling_efficiency','efektivita predaja')|e].\n\nJazyk dvora získava nárast svojej [language_power] vzhľadom na celkovú [Concept('political_power','politickú moc')|e] [Concept('pops','populácie')|e] patriacich k [Concept('primary_culture','hlavnej kultúre')|e] krajiny.\n\nMôžeme zmeniť náš jazyk dvora na:\n$BULLET$[common_language],\n$BULLET$[liturgical_language],\n$BULLET$[Concept('dominant_dialect','Dominantný dialekt')|e],\n$BULLET$[Concept('market_language','Jazyk trhu')|e] nášho [capital],\n$BULLET$jazyku [Concept('accepted_culture','akceptovanej kultúre')|e],\n$BULLET$jazyku nášho vládcu,\n$BULLET$jazyku nášho hlavy dynastie,\n$BULLET$[court_language] vedúceho [Concept('international_organization_leader','lídra medzinárodnú organizácie')|e],\n$BULLET$[court_language] nášho [overlord|e]." # todo: CHANGED # todo: CONCEPT CASE
 game_concept_court_dialect: "Súdny dialekt" # todo: NEW TRANSLATION
 game_concept_court_dialect_desc: "Hlavný [Concept('dialect','dialekt')|e] [Concept('court_language','jazyka dvora')|e] v [Concept('country','krajine')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_estates_enrichment: "Obohatenie stavov" # todo: NEW TRANSLATION
 game_concept_estate_enrichment: "Obohatenie štátov" # todo: NEW TRANSLATION
 game_concept_estates_enrichment_desc: "Koľko si [Concept('estate','stavu')|e] môže mesačne zadržať zo svojho zdaniteľného príjmu." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_political_power: "Politická moc" # todo: NEW TRANSLATION
 game_concept_political_power_desc: "Politická moc predstavuje vplyv, ktorý majú [Concept('pops','populácie')|e] v rámci [Concept('government','vlády')|e]. Používa sa na výpočet [Concept('estate_power','sily stavu')|e] a [Concept('language_power','sily jazyka')|e], ako aj na určenie [Concept('dominant_upper_class_culture','dominantnej kultúry vyššej triedy')|e] každej [Concept('country','krajiny')|e].\n\nKaždý [pop] uplatňuje odlišnú mieru politickej moci v závislosti od [Concept('estate','stavu')|e], do ktorého patrí. Napríklad [pop] patriaci k [ShowEstateTypeName('nobles_estate')] prirodzene disponuje stonásobne väčšou politickou mocou než [pop] patriaci k [ShowEstateTypeName('peasants_estate')]." # todo: NOVÝ PREKLAD # todo: CONCEPT CASE
 game_concept_cultural_tradition: "Kultúrna tradícia" # todo: NEW TRANSLATION
 game_concept_cultural_tradition_short: "Tradícia" # todo: NEW TRANSLATION
 game_concept_cultural_tradition_desc: "Toto je obranná sila [Concept('culture','kultúra')|e] v kontexte [Concept('culture_war','kultúrnej vojne')|e], ktorá predstavuje, nakoľko tradície tejto kultúry rezonujú s jej ľuďmi.\n\nTradícia sa mení mesačne v závislosti od príslušných [Concept('buildings','budov')|e], [Concept('societal_values','sociálnych hodnôt')|e], [Concept('advances','pokrokov')|e] a mnohých ďalších faktorov." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_cultural_influence: "Kultúrny vplyv" # todo: NEW TRANSLATION
 game_concept_cultural_influence_short: "Vplyv" # todo: NEW TRANSLATION
 game_concept_cultural_influence_desc: "Ide o útočnú silu [Concept('culture','kultúru')|e] v kontexte [Concept('culture_war','kultúrnej vojne')|e], ktorá vyjadruje, ako pôsobivé sa javí iným kultúram a aký dosah má za hranicami svojej vlastnej oblasti.\n\nMá mesačný nárast po dokončení [Concept('work_of_art','umeleckom diele')|e] a získava mesačný nárast z mnohých zdrojov, ako sú [Concept('prestige','prestíž')|e] a určité [Concept('buildings','budovy')|e], [Concept('advances','pokroky')|e], [Concept('laws','zákony')|e] a mnohé ďalšie. Ale pozor, má aj prirodzený mesačný úbytok." # todo: CHANGED # todo: CONCEPT CASE
 game_concept_culture_war_power: "Sila kultúrnej vojny" # todo: NEW TRANSLATION
 game_concept_culture_war: "Kultúrna vojna" # todo: NEW TRANSLATION
 game_concept_culture_war_power_desc: "Toto je sila útočiacej [Concept('culture','kultúre')|e] v podobe jej [Concept('cultural_influence','kultúrneho vplyvu')|e] proti [Concept('cultural_tradition','kultúrnej tradícii')|e] cieľovej [culture].\n\nVysoká sila kultúrnej vojny ovplyvňuje procesy ako [Concept('assimilation','asimilácia')|e], [Concept('integration','integrácia')|e], [Concept('spy_networks','špionážne siete')|e], [Concept('diplomacy','diplomacia')|e] a dokonca [Concept('siege','obliehanie')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_climate: "Klíma" # todo: NEW TRANSLATION
 game_concept_climate_upper_desc: "Klíma [Concept('location','lokalita')|e] ovplyvňuje, ako dobre sa tam [Concept('pops','populácie')|e] môžu usadiť, vrátane toho, koľko [Concept('food','potraviny')|e] sa môže vyprodukovať. Tiež ovplyvňuje maximálnu úroveň [Concept('winter_level','úroveň zimy')|e] [location].\n\nExistujú nasledujúce klímy:" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_climate_list_title: "Zoznam typov klímy" # todo: NEW TRANSLATION
 game_concept_climate_desc: "$game_concept_climate_upper_desc$\n[ShowDatabase('climate')]" # todo: NEW TRANSLATION
 game_concept_immortality: "Nesmrtelnosť" # todo: NEW TRANSLATION
 game_concept_immortal: "Nesmrtelný" # todo: NEW TRANSLATION
 game_concept_immortality_desc: "Keď je [Concept('character','postava')|e] nesmrteľný, nezomrie na starobu. Môže však stále zomrieť z iných príčin, ako sú [Concept('battle','bitka')|e] alebo niečo omnoho horšie, napríklad [Concept('disease','choroba')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_character: "Postava" # todo: NEW TRANSLATION
 game_concept_characters: "Postavy" # todo: NEW TRANSLATION
 game_concept_character_desc: "Postava je jednotlivý [Concept('person','osoba')|e], ktorý má [Concept('abilities','schopnosti')|e], [Concept('traits','vlastností')|e], [Concept('culture','kultúry')|e] a [Concept('religion','náboženstvo')|e]. Môže tiež patriť do [Concept('dynasty','dynastie')|e], ak pochádza z urodzeného rodu.\n\nKeď dosiahne vek [Concept('adult','dospelý')|e], môže byť [Concept('ruler','panovník')|e] alebo [Concept('regent','regent')|e], alebo može byť pridelená do [Concept('cabinet','kabinetu')|e], alebo ako [Concept('general','generál')|e] či [Concept('admiral','admirál')|e].\n\n[adults] sa tiež môžu [Concept('marry','vzatia si')|e] a mať [Concept('children','deti')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_courtier: "Dvoran" # todo: NEW TRANSLATION
 game_concept_courtiers: "Dvorania" # todo: NEW TRANSLATION
 game_concept_courtier_desc: "Každý [Concept('character','postava')|e] v [Concept('country','krajine')|e], ktorý nezastáva špecifickú [Concept('role','rolu')|e], sa považuje za dvorana. Dvorania môžu byť zamestnaní ako [Concept('cabinet_members','členovia kabinetu')|e], [Concept('generals','generáli')|e], [Concept('admirals','admiráli')|e] alebo [Concept('explorers','prieskumníci')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_fertility: "Plodnosť" # todo: NEW TRANSLATION
 game_concept_fertility_desc: "Ovlplyvňuje schopnosť [Concept('character','postava')|e] otehotnieť, ak je žena, alebo oplodniť ženu, ak je muž." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_roman_borders: "Rímske hranice" # todo: NEW TRANSLATION
 game_concept_roman_borders_desc: "Toto sú územia, ktoré označujú vrchol moci Rímskej ríše. Zahrnuté regióny sú: [ShowRegionName('italy_region')], [ShowRegionName('france_region')], [ShowRegionName('iberia_region')], [ShowRegionName('great_britain_region')], [ShowRegionName('balkan_region')], [ShowRegionName('anatolia_region')], [ShowRegionName('crescent_region')], [ShowRegionName('egypt_region')] a [ShowRegionName('maghreb_region')]." # todo: NEW TRANSLATION
 game_concept_consort: "Konzort panovníka" # todo: NEW TRANSLATION
 game_concept_consorts: "Konzorti panovníka" # todo: NEW TRANSLATION
 game_concept_spouse: "Manžel/ka" # todo: NEW TRANSLATION
 game_concept_spouses: "Manželia" # todo: NEW TRANSLATION
 game_concept_consort_desc: "Manžel/ka panovníka je [Concept('character','postava')|e], ktorý/á je [Concept('married','V sňatku')|e] s [Concept('ruler','panovníkom')|e]. V niektorých formách vlády môže mať právomoci, ale vo väčšine prípadov je prítomný/prítomná, aby pomohol/pomohla zabezpečiť [Concept('heirs','dediči')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_heir: "Dedič" # todo: NEW TRANSLATION
 game_concept_heirs: "Dediči" # todo: NEW TRANSLATION
 game_concept_heir_desc: "[Concept('character','Postava')|e], ktorý je ďalší v poradí na trón, keď súčasný [Concept('ruler','panovník')|e] zomrie alebo abdikuje. Poradie nastupovania určuje [Concept('heir_selection','nástupnícke právo')|e] [Concept('government','vlády')|e].\n\nAk nastane nástupníctvo, ale neexistuje platný [heir], alebo je dedič [Concept('child','dieťa')|e], spustí sa [Concept('regency','regentstvo')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_dynasty: "Dynastia" # todo: NEW TRANSLATION
 game_concept_dynasties: "Dynastie" # todo: NEW TRANSLATION
 game_concept_dynasty_desc: "Skupina postáv, ktoré majú spoločného predka a sú tak navzájom príbuzné. Najdôležitejšou [Concept('character','postavou')|e] v dynastii je [Concept('dynasty_head','hlava dynastie')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_dynastic_power: "Dynastická moc" # todo: NEW TRANSLATION
 game_concept_dynastic_power_hausmacht: "Hausmacht" # todo: NEW TRANSLATION
 game_concept_dynastic_power_desc: "Dynastická moc je hodnota politickej moci, ktorú [Concept('dynasty','dynastiu')|e] drží v [international_organization|e]. Zohráva významnú úlohu v rámci [GetUniqueInternationalOrganization('hre').GetName] a vypočítava sa vynásobením [great_power_score|e] a vlastníctva [Concept('pops','populácií')|e] v [Concept('countries','krajine')|e] danej [international_organization]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_dynasty_founder: "Zakladateľ dynastie" # todo: NEW TRANSLATION
 game_concept_dynasty_founder_desc: "Zakladateľ [Concept('dynasty','dynastia')|El]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_dynasty_head: "Hlava dynastie" # todo: NEW TRANSLATION
 game_concept_dynasty_head_desc: "Toto je najprestížnejšia a najdôležitejšia [Concept('character','postava')|e] v [Concept('dynasty','dynastii')|e]. [Concept('dialect','Dialekt')|e] dynastie sa určuje podľa [Concept('dialect','dialektu')|e] jej hlavy dynastie, a niektoré [Concept('events','udalosti')|e] a iný obsah môžu vyžadovať $game_concept_dynasty_head$." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_dynasty_seat: "Sídlo dynastie" # todo: NEW TRANSLATION
 game_concept_dynasty_seat_desc: "Každá dynastia má svoje rodové sídlo v konkrétnej [Concept('location','lokalite')|e]. [locations], ktoré majú $game_concept_dynasty_seat$, budú mať viac [ShowPopTypeName('nobles')] ako obvykle." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_lowborn: "Neurodzený" # todo: NEW TRANSLATION
 game_concept_lowborn_desc: "Toto je [Concept('character','postava')|e], ktorý nepatrí do žiadnej významnej [Concept('dynasty','dynastie')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_government: "Vláda" # todo: NEW TRANSLATION
 game_concept_government_desc: "Každý [Concept('country','krajina')|e] má vládu konkrétneho [Concept('government_type','typu vlády')|e] umiestnenú v svojej [Concept('capital','hlavnom meste')|e].\n\nVlády pozostávajú z [Concept('ruler','panovníka')|e] a [Concept('cabinet','kabinetu')|e], a formujú ich [Concept('societal_values','sociálne hodnoty')|e], [Concept('government_reforms','vládne reformy')|e] a [Concept('laws','zákony')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_government_type: "Typ vlády" # todo: NEW TRANSLATION
 game_concept_government_types: "Typy vlád" # todo: NEW TRANSLATION
 game_concept_government_type_upper_desc: "$game_concept_government_type [Concept('country','krajine')|e] definuje vnútornú štruktúru ich vlády. Predovšetkým určuje, akú [Concept('government_power','vládnu moc')|e] používajú a aké [Concept('heir_selections','nástupnícke práva')|e] majú k dispozícii, ale tiež odomyká konkrétne [Concept('laws','zákony')|e], [Concept('government_reforms','vládne reformy')|e], [Concept('estate_privileges','privilégiá stavov')|e] a [Concept('advances','pokroky')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_government_type_list_title: "Zoznam typov vlád" # todo: NEW TRANSLATION
 game_concept_government_type_desc: "$game_concept_government_type_upper_desc$\n[ShowDatabase('government_type')]" # todo: NEW TRANSLATION
 game_concept_international_organization: "Medzinárodná organizácia" # todo: NEW TRANSLATION
 game_concept_international_organizations: "Medzinárodné organizácie" # todo: NEW TRANSLATION
 game_concept_international_organization_desc: "Skupina [Concept('countries','krajiny')|e], ktoré sa zjednotili v nejakej dohode, niekedy zameranej proti inému [country]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_international_organization_type: "Typ medzinárodnej organizácie" # todo: NEW TRANSLATION
 game_concept_international_organization_types: "Typy medzinárodných organizácií" # todo: NEW TRANSLATION
 game_concept_international_organization_type_upper_title: "$game_concept_international_organization_type [international_organization|e] definuje jej celkovú štruktúru, ako napríklad interakcie, ktoré sú s ňou možné, alebo jej vedúcu štruktúru." # todo: NEW TRANSLATION
 game_concept_international_organization_type_upper_desc: "Každá medzinárodná organizácia patrí k jednému z typov nižšie." # todo: NEW TRANSLATION
 game_concept_international_organization_type_list_title: "Zoznam typov medzinárodných organizácií" # todo: NEW TRANSLATION
 game_concept_international_organization_type_desc: "$game_concept_international_organization_type [international_organization|e] definuje jej celkovú štruktúru, ako napríklad interakcie, ktoré sú s ňou možné, alebo jej vedúcu štruktúru.\n\n$game_concept_international_organization_type_upper_desc$\n[ShowDatabaseWithIcon('international_organization_type')]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_member: "Člen" # todo: NEW TRANSLATION
 game_concept_members: "Členovia" # todo: NEW TRANSLATION
 game_concept_member_desc: "Sú to [Concept('countries','krajiny')|e], ktoré sú súčasťou [international_organization|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_elector: "Kurfirst" # todo: NEW TRANSLATION
 game_concept_electors: "Kurfirstí" # todo: NEW TRANSLATION
 game_concept_electorship: "Voľba kurfirstov" # todo: NEW TRANSLATION
 game_concept_elector_desc: "Sú to [Concept('members','členovia')|e], ktorí majú [Concept('special_status','špeciálny status')|e], ktorý im umožňuje rozhodovať, kto bude ďalším [Concept('international_organization_leader_short','lídrom')|e] [international_organization|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_imperial_religion: "Impériálne náboženstvo" # todo: NEW TRANSLATION
 game_concept_imperial_religion_imperial: "Impériálny" # todo: NEW TRANSLATION
 game_concept_imperial_religion_desc: "Impériálne náboženstvo určuje, aké [Concept('religion','náboženstvá')|e] musí nasledovať [Concept('member','člen')|e], aby mohol byť zvolený za [Concept('international_organization_leader_short','lídra')|e] [Concept('holy_roman_empire','svätú rímsku ríšu')|e]. Tiež je možné, že Impériálne náboženstvo môže byť skupinou náboženstiev [Concept('religion_group','náboženskej skupiny')|e] alebo môže byť úplne zrušená, čím sa náboženstvo stane nepodstatným pri hlasovaní." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_leader_type: "Typ vodcu" # todo: NEW TRANSLATION
 game_concept_leader_type_desc: "To určuje, kto v skutočnosti je [Concept('international_organization_leader_short','líder')|e] [Concept('international_organization','medzinárodná organizácia')|e]. Existujú tri typy vedenia medzinárodných organizácií:\n- #Y $LEADER_TYPE_CHARACTER$#! - Organizáciu vedie [Concept('character','postava')|e] a krajina, ktorej patrí\n- #Y $LEADER_TYPE_COUNTRY$#! - Organizáciu vedie určený [Concept('country','krajina')|e], ktorý je v čele aj v prípade, že sa jeho vlastný [Concept('ruler','panovník')|e] zmení\n- #Y $LEADER_TYPE_NONE$#! - Organizácia je v trvalom medzivojnovom stave a ani postava, ani krajina ju nebudú zastupovať" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_leader_change_method: "Spôsob zmeny vodcu" # todo: NEW TRANSLATION
 game_concept_leader_change_method_desc: "Určuje, ako sa [Concept('international_organization_leader_short','lídra')|e] [international_organization|e] vyberá. Existuje päť metód:\n- #Y $LEADER_CHANGE_METHOD_ROTATION$#! - Súčasný vodca bude po vypršaní svojho kola posledný v rade\n- #Y $LEADER_CHANGE_METHOD_VOTE$#! - Vodca bude zvolený prostredníctvom [Concept('leadership_election_resolution','rozhodnutia o voľbe vodcu')|e]\n- #Y $LEADER_CHANGE_METHOD_LOTTERY$#! - Vodca bude vybraný náhodne z možných kandidátov\n- #Y $LEADER_CHANGE_METHOD_SCORE$#! - Vodca bude vybraný dynamicky na základe interného bodového systému špecifického pre medzinárodnú organizáciu\n- #Y $LEADER_CHANGE_METHOD_NONE$#! - Spôsob výberu vodcu nie je definovaný, pretože vodca nie je potrebný alebo organizácia zatiaľ nespísala pravidlá vedenia" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_leader_change_trigger: "Spúšťač zmeny vodcu" # todo: NEW TRANSLATION
 game_concept_leader_change_trigger_desc: "Určuje, za akých podmienok sa mení [Concept('international_organization_leader_short','líder')|e] [Concept('international_organization','medzinárodná organizácia')|e]. Existujú tri spúšťače, kedy môže dôjsť k zmene:\n- #Y $LEADER_CHANGE_TRIGGER_TYPE_RULER_CHANGE$#! - Kedykoľvek sa zmení vodca, zvažuje sa nový vodca pre medzinárodnú organizáciu\n- #Y $LEADER_CHANGE_TRIGGER_TYPE_TIMED$#! - Nový vodca je zvažovaný po uplynutí určitého počtu mesiacov\n- #Y $LEADER_CHANGE_TRIGGER_TYPE_NONE$#! - Vodca zostáva vo funkcii navždy" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_leadership_election_resolution: "Rozhodnutie o voľbe vodcu" # todo: NEW TRANSLATION
 game_concept_leadership_election_resolution_desc: "Špeciálne [Concept('resolution','rezolúcia')|e] používané na určenie, ako sa volí [Concept('international_organization_leader_short','líder')|e] [Concept('international_organization','medzinárodná organizácia')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_candidate: "Kandidát" # todo: NEW TRANSLATION
 game_concept_candidates: "Kandidáti" # todo: NEW TRANSLATION
 game_concept_candidate_desc: "Sú to [Concept('countries','krajiny')|e], ktoré sú momentálne považované za potenciálnych ďalších [Concept('international_organization_leader_short','lídrov')|e] [international_organization|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_free_city: "Slobodné mesto" # todo: NEW TRANSLATION
 game_concept_free_cities: "Slobodné mestá" # todo: NEW TRANSLATION
 game_concept_free_imperial_city: "Slobodné cisárske mesto" # todo: NEW TRANSLATION
 game_concept_free_imperial_cities: "Slobodné cisárske mestá" # todo: NEW TRANSLATION
 game_concept_free_city_desc: "$free_city_desc$" # todo: NEW TRANSLATION
 GET_GOD_OR_GODDESS: "[Concept('god','Boh')|e]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 GET_GOD_OR_GODDESS_FEMALE: "[Concept('goddess','Bohyňa')|e]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 GET_GOD_OR_GODDESS_WITH_NO_TOOLTIP: "Boh" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 GET_GOD_OR_GODDESS_WITH_NO_TOOLTIP_FEMALE: "Bohyňa" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_god: "Boh" # todo: NEW TRANSLATION
 game_concept_gods: "Bohovia" # todo: NEW TRANSLATION
 game_concept_goddess: "Bohyňa" # todo: NEW TRANSLATION
 game_concept_goddesses: "Bohyne" # todo: NEW TRANSLATION
 game_concept_god_desc: "Boh, Bohyňa alebo božstvo je nadprirodzená bytosť, ktorá slúži ako centrum uctievania pre dané náboženstvo a zvyčajne má moc nad určitými aspektmi vesmíru či ľudského bytia." # todo: NEW TRANSLATION
 game_concept_avatar: "Avatár" # todo: NEW TRANSLATION
 game_concept_avatars: "Avatáry" # todo: NEW TRANSLATION
 game_concept_avatar_desc: "Avatáry sú rôzne aspekty, manifestácie alebo inkarnácie, ktoré môže konkrétny [Concept('god','boh')|e] nadobudnúť v [ShowReligionName('hindu')]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_omen: "Omen" # todo: NEW TRANSLATION
 game_concept_omens: "Omeny" # todo: NEW TRANSLATION
 game_concept_omen_desc: "Omeny sú javy v [ShowReligionAdjective('hellenism_religion')] [Concept('religion','náboženstve')|e] späté s [Concept('gods','bohmi')|e]. Volajú sa cez [ShowGenericActionName('select_omen_god')] a [ShowGenericActionName('select_omen')]. Ich sila je zvýšená [Concept('ability','schopnosť')|e] [Concept('ruler','panovníka')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_offered_omens: "Ponúkané znamenia" # todo: NEW TRANSLATION
 game_concept_offered_omens_desc: "Počet [Concept('omens','omeny')|e], ktoré môže naša krajina súčasne privolať. Určuje ho modifikátor $MODIFIER_TYPE_NAME_omens_offered$ z našej [Concept('religion','náboženstva')|e] a [Concept('religious_aspects','náboženských aspektov')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_disease: "Choroba" # todo: NEW TRANSLATION
 game_concept_diseases: "Choroby" # todo: NEW TRANSLATION
 game_concept_disease_desc: "Choroba môže spôsobiť pohromu medzi našimi [Concept('people','ľuďmi')|e]. Rôzne choroby majú rôzne špecifikované šance na [Concept('outbreak','vypuknutie')|e], metódy šírenia a mieru úmrtnosti. Ich hrozné následky je možné znížiť pomocou [Concept('disease_resistance','odolnosti voči chorobám')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_disease_outbreak: "Vypuknutie choroby" # todo: NEW TRANSLATION
 game_concept_disease_outbreaks: "Vypuknutia chorôb" # todo: NEW TRANSLATION
 game_concept_outbreak: "Vypuknutie" # todo: NEW TRANSLATION
 game_concept_disease_outbreak_desc: "Keď sa [Concept('disease','chorobu')|e] vyskytne v konkrétnej [Concept('location','lokalite')|e], môže sa odtiaľ šíriť rôznymi spôsobmi... a môže si po ceste vyberať obete." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_holy_site: "Sväté miesto" # todo: NEW TRANSLATION
 game_concept_holy_sites: "Sväté miesta" # todo: NEW TRANSLATION
 game_concept_holy_site_desc: "Miesto, ktoré má osobitný význam pre určité [Concept('religion','náboženstvo')|e]. Sväté miesto môže poskytovať rôzne bonusy [Concept('location','lokalita')|e] alebo [Concept('owner','majiteľ')|e], ktoré sú škálované podľa jeho [Concept('holy_site_importance_short','dôležitosti')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_holy_site_type: "Typ svätého miesta" # todo: NEW TRANSLATION
 game_concept_holy_site_types: "Typy svätých miest" # todo: NEW TRANSLATION
 game_concept_holy_site_type_short: "Typ" # todo: NEW TRANSLATION
 game_concept_holy_site_types_short: "Typy" # todo: NEW TRANSLATION
 game_concept_holy_site_type_upper_desc: "Každé [Concept('holy_site','sväté miesto')|e] patrí k jednému z typov nižšie." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_holy_site_type_list_title: "Zoznam typov svätých miest" # todo: NEW TRANSLATION
 game_concept_holy_site_type_desc: "$game_concept_holy_site_type_upper_desc$\n[ShowDatabase('holy_site_type')]" # todo: NEW TRANSLATION
 game_concept_holy_site_importance: "Sväté miesto $game_concept_holy_site_importance_short$" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_holy_site_importance_short: "Dôležitosť" # todo: NEW TRANSLATION
 game_concept_holy_site_importance_desc: "Dôležitosť [Concept('holy_site','sväté miesto')|e] určuje, ako sa škálujú bonusy, ktoré sa uplatňujú v jeho [Concept('location','lokalite')|e] alebo pre jeho [Concept('owner','majiteľa')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_heir_selection: "Nástupnícke právo" # todo: NEW TRANSLATION
 game_concept_heir_selections: "Nástupnícke práva" # todo: NEW TRANSLATION
 game_concept_succession_law: "Nástupnícke právo" # todo: NEW TRANSLATION
 game_concept_heir_selection_desc: "Každý [Concept('government','vláda')|e] má Nástupnícke právo, ktoré definuje, ktorý [Concept('character','postava')|e] sa stane ďalším [Concept('ruler','panovníkom')|e], keď súčasný zomrie alebo abdikuje.\n\nMnohé Nástupnícke práva určujú [Concept('heir','dedič')|e] pred samotným nástupníctvom na základe [heir_selection_score|e] toho charakteru, zatiaľ čo iné vyžadujú [Concept('election','voľba')|e].\n\nKaždé Nástupnícke právo má svoje vlastné pravidlá, napríklad či môže byť nástupca z tej istej [Concept('dynasty','dynastie')|e], alebo či musí patriť do konkrétnych [Concept('estates','stavov')|e].\n\n[Krajina|e] môže zvoliť iné Nástupnícke právo; dostupné možnosti môžu ovplyvniť faktory ako sú aktuálny [Concept('government_type','typ vlády')|e] a aktívne [Concept('government_reforms','vládne reformy')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_heir_selection_score: "Skóre nástupcu" # todo: NEW TRANSLATION
 game_concept_heir_selection_score_short: "Skóre" # todo: NEW TRANSLATION
 game_concept_heir_selection_score_desc: "$game_concept_heir_selection_score určuje, do akej miery je [Concept('character','postava')|e] preferovaný pri voľbe podľa [Concept('heir_selection','nástupníckeho práva')|e] [Concept('country','krajiny')|e]. Zvyčajne sa po nástupe stáva novým [Concept('ruler','panovníkom')|e] postava s najvyšším skóre." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_eligibility_rules: "Pravidlá oprávnenia" # todo: NEW TRANSLATION
 game_concept_eligibility_rules_desc: "$game_concept_eligibility_rules [Concept('heir_selection','nástupnícke právo')|e] určujú, ktoré [Concept('characters','postavy')|e] sú oprávnené stať sa [Concept('heir','dediča')|e] [Concept('country','krajiny')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_election: "Voľba" # todo: NEW TRANSLATION
 game_concept_elections: "Voľby" # todo: NEW TRANSLATION
 game_concept_election_desc: "Niektoré [Concept('heir_selections','nástupnícke práva')|e] môžu vyžadovať voľbu na rozhodnutie, ktorý [Concept('character','postava')|e] bude ďalším [Concept('ruler','panovníkom')|e].\n\nV závislosti od pravidiel [heir_selection] sa voľba môže konať pravidelne alebo po smrti predchádzajúceho [ruler].\n\nAk neexistuje žiadny [ruler], vládu dočasne vykonáva [Concept('regency','regentstvo')|e], kým voľba neskončí." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_people: "Ľudia" # todo: NEW TRANSLATION
 game_concept_person: "Osoba" # todo: NEW TRANSLATION
 game_concept_people_desc: "Jednotliví ľudia. Poloodnovený zdroj, zoskupovaný v [Concept('pops','populáciách')|e] alebo sa môže objaviť ako [Concept('characters','postavy')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_population_growth: "Rast populácie" # todo: NEW TRANSLATION
 game_concept_population_growth_desc: "Rast populácie [Concept('pops','populácie')|e] v [Concept('location','lokalite')|e] súvisí s počtom narodení za mesiac v porovnaní s počtom úmrtí. Nedostatok [Concept('food','potraviny')|e], šírenie choroby, [Concept('siege','obliehanie')|e] alebo iné pohromy môžu zvýšiť počet úmrtí." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_pop: "Populácia"
 game_concept_pops: "Populácie"
 game_concept_pop_desc: "Populácia je skupina [Concept('people','ľudí')|e] rovnakej [Concept('pop_type','sociálnej triede')|e], [Concept('religion','náboženstvu')|e] a [Concept('culture','kultúry')|e]. Majú potreby ktoré napĺňajú spotrebou [Concept('goods','tovarmi')|e] a ich [Concept('pop_satisfaction','spokojnosť')|e] ovplyvňuje [Concept('location','lokalita')|e], v ktorej žijú." # todo: CONCEPT CASE
 game_concept_upper_class: "Vyššia trieda" # todo: NEW TRANSLATION
 game_concept_upper_class_desc: "Skupina [Concept('pop_types','sociálne triedy')|e], ktoré patria do jednej z [Concept('estates','stavov')|e], ktoré zvyčajne majú najväčšiu moc v [Concept('country','krajine')|e], a sú jedným z nasledujúcich [pop_types]:\n$BULLET_WITH_TAB$[ShowPopTypeName('nobles')]\n$BULLET_WITH_TAB$[ShowPopTypeName('clergy')]\n$BULLET_WITH_TAB$[ShowPopTypeName('burghers')]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_lower_class: "Nižšia trieda" # todo: NEW TRANSLATION
 game_concept_lower_class_desc: "Ide o skupinu [Concept('pop_types','sociálne triedy')|e], ktoré patria do nižších vrstiev spoločnosti, vrátane nasledujúcich [pop_types]:\n$BULLET_WITH_TAB$[ShowPopTypeName('laborers')]\n$BULLET_WITH_TAB$[ShowPopTypeName('soldiers')]\n$BULLET_WITH_TAB$[ShowPopTypeName('peasants')]\n$BULLET_WITH_TAB$[ShowPopTypeName('tribesmen')]\n$BULLET_WITH_TAB$[ShowPopTypeName('slaves')]" # todo: CHANGED # todo: CONCEPT CASE
 game_concept_promote: "Povýšiť" # todo: NEW TRANSLATION
 game_concept_promoted: "Povýšený" # todo: NEW TRANSLATION
 game_concept_promotes: "Povýšenia" # todo: NEW TRANSLATION
 game_concept_promotion: "Povýšenie" # todo: NEW TRANSLATION
 game_concept_promote_desc: "[Concept('pops','Populácie')|e] sa budú [Concept('promote','povýšiť')|e] z [ShowPopTypeName('peasants')] keď sú v ich [Concept('location','lokalita')|e] dostupné vhodné pozície. Pops musia patriť aspoň k [Concept('tolerated_culture','tolerovanej kultúre')|e], aby sa mohli povýšiť." # todo: CHANGED # todo: CONCEPT CASE
 game_concept_demoted: "Degradovaný" # todo: NEW TRANSLATION
 game_concept_demotion: "Degradácia" # todo: NEW TRANSLATION
 game_concept_demote: "Degradovať" # todo: NEW TRANSLATION
 game_concept_demote_desc: "[Concept('pops','Populácie')|e] sa budú demotovať na [ShowPopTypeName('peasants')] keď bude v ich [Concept('location','lokalita')|e] príliš veľa ich súčasného [Concept('pop_type','sociálnej triedy')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_pop_type: "Sociálna trieda" # todo: NEW TRANSLATION
 game_concept_pop_types: "Sociálne triedy" # todo: NEW TRANSLATION
 game_concept_pop_type_upper_desc: "Každý [Concept('pop','populácia')|e] je zaradený do jednej z nižšie uvedených sociálnych tried." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_pop_type_list_title: "Zoznam sociálnych tried" # todo: NEW TRANSLATION
 game_concept_pop_type_desc: "$game_concept_pop_type_upper_desc$\n[ShowDatabase('pop_type')]" # todo: NEW TRANSLATION
 game_concept_good: "Tovar" # todo: NEW TRANSLATION
 game_concept_goods: "Tovary" # todo: NEW TRANSLATION
 game_concept_goods_desc: "Tovary môžu byť buď [Concept('raw_materials','suroviny')|e], ktoré sa pestujú, zbierajú, ťažia, vyrubávajú alebo lovia, alebo [Concept('produced_goods','vyrábané tovary')|e], ktoré sa primárne vyrábajú v mestách.\n\n[Concept('food_raw_materials','Surové potraviny')|e] sú tiež zdrojom [Concept('food','potravinami')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_raw_materials: "Suroviny" # todo: NEW TRANSLATION
 game_concept_raw_material: "Surovina" # todo: NEW TRANSLATION
 game_concept_raw_materials_desc: "Každé [Concept('location','lokalita')|e] [Concept('produces','produkuje')|e] jeden typ $game_concept_raw_material$. Množstvo, ktoré [produces], závisí od toho, ako veľmi je [Concept('location','lokalita')|e] rozvinuté. Čo odlišuje suroviny od [Concept('produced_goods','vyrábaných tovarov')|e] je to, že nevyžadujú [Concept('buildings','budovy')|e] na produkciu a závisia výlučne od [Concept('rgo_pops','robotníkov alebo otroci')|e]. Niektoré surovín však môže tiež produkovať [buildings]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_produced_goods: "Vyrábané tovary" # todo: NEW TRANSLATION
 game_concept_produced_good: "Vyrábaný tovar" # todo: NEW TRANSLATION
 game_concept_produced_goods_desc: "Toto je typ [Concept('goods','tovary')|e], ktorý vyrábajú [Concept('pops','populácie')|e] pracujúci v [Concept('building','budove')|e]. V mnohých prípadoch tieto budovy vyžadujú [Concept('raw_materials','suroviny')|e] alebo iné vyrábané tovary na funkčnosť." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_rgo: "R.G.O."
 game_concept_resource_gathering_operations: "Prevádzky získavania zdrojov" # todo: NEW TRANSLATION
 game_concept_rgo_desc: "Skratka $game_concept_resource_gathering_operations$. Každé [Concept('location','lokalita')|e] má [Concept('raw_material','surovina')|e], ktorý vzniká z $rgo_mining$, $rgo_farming$, $rgo_gathering$, $rgo_forestry$ alebo $rgo_hunting$.\n\nKaždá úroveň $game_concept_rgo$ môže [Concept('employ','zamestnať')|e] až #V 1,000#! [Concept('rgo_pops','robotníci alebo otroci')|e], zatiaľ čo maximálna úroveň závisí od [Concept('development','rozvoja')|e], [Concept('advances','pokrokov')|e] a ďalších faktorov." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_prosperity: "Prosperita" # todo: NEW TRANSLATION
 game_concept_prosperity_desc: "Prosperita reprezentuje, ako prosperujúce a zdrojovo bohaté je [Concept('location','lokalita')|e]. Pozitívna prosperita zvyšuje [Concept('development','rozvoj')|e] [location] v čase a zvyšuje pravdepodobnosť [Concept('migration','migrácia')|e].\n\nProsperita prirodzene rastie v priebehu času, ale klesá v dôsledku nízkeho [Concept('pop_satisfaction','spokojnosti populácie')|e], [Concept('diseases','chorôb')|e], [Concept('sieges','obliehania')|e], [Concept('occupation','okupácie')|e], [Concept('blockades','blokád')|e] alebo ak je [location] [Concept('looted','vyplienené')|e] nepriateľskou [Concept('army','armádou')|e]. Negatívna prosperita môže mať katastrofálne následky pre [Concept('population','populáciu')|e] [location]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_development: "Rozvoj" # todo: NEW TRANSLATION
 game_concept_development_desc: "Rozvoj predstavuje, ako obdarená je krajina a do akej miery ju využívajú [Concept('pops','populácie')|e]. Čím vyšší rozvoj, tým viac ľudí tam môže žiť a tým viac sa dá využívať." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_control: "Kontrola" # todo: NEW TRANSLATION
 game_concept_control_desc: "Kontrola, ktorú má [Concept('owner','majiteľ')|e] nad [Concept('location','lokalitou')|e], určuje [Concept('tax_base','daňový základ')|e], [Concept('army_levies','armádny branci')|e] a [Concept('navy_levies','povolané loďstvo')|e] dostupné v [location]. Tiež ovplyvňuje rýchlosť [Concept('promotion','povýšenie')|e], [Concept('assimilation','asimilácia')|e] a [Concept('conversion','konverzia')|e], ako aj množstvo mesačného [Concept('manpower','živej sily')|e] a [Concept('sailors','námorníci')|e], ktoré poskytuje. Kontrola [location] sa bude pomaly meniť smerom k svojej [Concept('max_control','maximálnej kontrole')|e], čo znamená, že ak je kontrola nad Maxom, pomaly klesá, alebo ak je pod Maxom, pomaly stúpa.\n\nNiektoré [Concept('buildings','budovy')|e] môžu zvýšiť Max kontrolu, ale primárne závisí od [Concept('proximity','blízkosti')|e] k [Concept('capital','hlavnému mestu')|e] [Concept('country','krajine')|e]. Vytvorenie trasy cez [Concept('roads','cesty')|e] alebo [Concept('maritime_presence','námorná prítomnosť')|e] pozdĺž našich pobreží zvyšuje [Concept('proximity','blízkosť')|e], čím sa zvyšuje [max_control] [location]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_max_control: "Maximálna kontrola" # todo: NEW TRANSLATION
 game_concept_max_control_desc: "Kontrola [location] sa bude pomaly posúvať smerom k svojej Maximálnej kontrole. Hlavným zdrojom Maximálnej kontroly je [Concept('proximity','blízkosť')|e], ale dôležitú úlohu zohrávajú aj [Concept('integration_status','stav integrácie')|e] a [Concept('pop_satisfaction','spokojnosť populácie')|e].\n\nMaximálna kontrola [location] môže byť dočasne zvýšená stacionovaním Armády v [Concept('province','provincii')|e], ako aj pomocou [ShowCabinetActionName('increase_control_province')] [Concept('cabinet_action','akcie kabinetu')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_power_projection: "Projekcia sily" # todo: NEW TRANSLATION
 game_concept_power_projection_desc: "[Concept('countries','Krajiny')|e] s vyššou projekciou sily môžu vykořisťovať národy s nižšou. Ak máme vyššiu hodnotu ako iná krajina, môžeme v ich [Concept('locations','lokality')|e] postaviť [ShowBuildingTypeName('trade_office')], [ShowBuildingTypeName('slave_center')], [ShowBuildingTypeName('missionary_building')] alebo iné špecifické budovy. Čím vyššia je naša $game_concept_power_projection$, tým rýchlejšie môžu naše [Concept('colonial_charters','koloniálne listiny')|e] získať kontrolu nad lokalitami. Mať vyššiu projekciu sily než iná krajina tiež znižuje [Concept('stability','stabilita')|e] náklady na vyhlásenie [Concept('war','vojna')|e] voči nej, ako aj [Concept('war_exhaustion','vojnová vyčerpanosť')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_proximity: "Blízkosť" # todo: NEW TRANSLATION
 game_concept_proximity_desc: "Proximitu [location_with_icon|e] meria, ako blízko sa nachádza k [capital_with_icon|e] svojho [Concept('owner','majiteľovi')|e], a určuje, koľko [control_with_icon|e] môžu [locations] mať.\n\n[proximity] začína na #high 100%#! v [capital] každej [Concept('country','krajine')|e] a preskakuje na blízke [locations], čím im prideľuje [proximity]. Časť [proximity] sa stratí pri každom ďalšom preskoku v závislosti od terénu a infraštruktúry prítomnej v [location]. [proximity], ktorá sa stratí pri preskoku z jednej [location] na druhú, sa nazýva náklady na proximitu.\n\nNáklady na proximitu medzi [locations] sa výrazne líšia podľa [topography_with_icon|e] a [vegetation_with_icon|e]. Na súši ich možno znížiť budovaním [roads_with_icon|e], zvyšovaním [development_with_icon|e] a [ShowSocietyDirectionName('land')] [societal_value_with_icon|e]. Na mori ich možno znížiť [harbor_capacity_with_icon|e], [maritime_presence_with_icon|e] a [ShowSocietyDirectionName('naval')] [societal_value]." # todo: CHANGED # todo: CONCEPT CASE
 game_concept_output: "Produkcia" # todo: NEW TRANSLATION
 game_concept_produce: "Výroba" # todo: NEW TRANSLATION
 game_concept_produces: "Produkuje" # todo: NEW TRANSLATION
 game_concept_producing: "Produkujúce" # todo: NEW TRANSLATION
 game_concept_output_desc: "Množstvo [Concept('goods','tovary')|e], ktoré sa vytvára buď v [Concept('building','budove')|e] ako [Concept('produced_goods','vyrábané tovary')|e], alebo ako [Concept('raw_materials','suroviny')|e] v [Concept('location','lokalite')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_foreign_building: "Cudzia budova" # todo: NEW TRANSLATION
 game_concept_foreign_buildings: "Cudzie budovy" # todo: NEW TRANSLATION
 game_concept_foreign_building_desc: "Toto je [Concept('building','budova')|e], ktoré patrí [Concept('country','krajina')|e] odlišnému od [Concept('owner','majiteľa')|e] [Concept('location','lokality')|e]." # todo: CHANGED # todo: CONCEPT CASE
 game_concept_building: "Budova" # todo: NEW TRANSLATION
 game_concept_buildings: "Budovy" # todo: NEW TRANSLATION
 game_concept_building_desc: "Budovy sú jedinečné príklady [Concept('building_types','typy budov')|e] v [Concept('location','lokalite')|e].\n\nBudovy majú širokú škálu funkcií, od zvyšovania [Concept('supply','ponuky')|e] vyrábaných [Concept('goods','tovary')|e] až po odomknutie unikátnych [Concept('unit_types','typov jednotiek')|e]. Ich efektivita závisí od počtu [Concept('pops','populácií')|e] aktuálne v nich [Concept('employed','zamestnaný')|e].\n\nVäčšina budov má počiatočné stavebné náklady v [Concept('gold','dukátoch')|e] a následne vytvára ďalší [Concept('demand','dopyt')|e] na určité [goods] v [location] [Concept('market','trhu')|e]. Ak budova beží stratovo, jej [Concept('owner','majiteľa')|e] ju môže [Concept('subsidize','dotovať')|e].\n\n[Concept('estates','Stavy')|e] môžu tiež stavať budovy.\n\nBudovy môžu byť tiež zničené.\n\nBudova má jeden alebo viac [Concept('production_methods','spôsoby výroby')|e], ktoré je možné zmeniť, čo ovplyvňuje jej výstup." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_building_type: "Typ budovy" # todo: NEW TRANSLATION
 game_concept_building_types: "Typy budov" # todo: NEW TRANSLATION
 game_concept_building_type_desc: "Typ budovy je plán [Concept('building','budova')|e] a patrí do [building_category|e]. Väčšina vlastností [building] závisí od toho, aký typ budovy to je." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_building_category: "Kategória budovy" # todo: NEW TRANSLATION
 game_concept_building_categories: "Kategórie budov" # todo: NEW TRANSLATION
 game_concept_building_category_desc: "[Concept('building_types','Typy budov')|e] sú zoskupené do rôznych kategórií, čo primárne slúži na identifikáciu podobných typov." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_supported_building_levels: "Podporované úrovne budov" # todo: NEW TRANSLATION
 game_concept_supported_building_levels_desc: "Každá [Concept('location','lokalita')|e] má mäkký limit na počet úrovní [Concept('building','budovy')|e], ktoré môže obsahovať. Presiahnutie tohto limitu spôsobí postupne vyššie náklady na výstavbu.\n\nPočet $game_concept_supported_building_levels$ závisí predovšetkým od [Concept('location_rank','rangu lokality')|e] a [Concept('development','rozvoja')|e] [location]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_building_maintenance: "Údržba budov" # todo: NEW TRANSLATION
 game_concept_building_maintenance_desc: "[buildings], ktoré neprodukujú [Concept('goods','tovary')|e], vyžadujú náklady na údržbu pre ich [owner]. Náklady závisia od [Concept('market_price','trhovej ceny')|e] [goods], ktoré budova používa, a sú ovplyvnené [Concept('crown_power','moc koruny')|e] vlastníka." # todo: CHANGED # todo: CONCEPT CASE
 game_concept_employ: "Zamestnať" # todo: NEW TRANSLATION
 game_concept_employed: "Zamestnaný" # todo: NEW TRANSLATION
 game_concept_employment: "Zamestnanie" # todo: NEW TRANSLATION
 game_concept_employ_desc: "[Concept('pops','Populácie')|e] môžu byť zamestnané buď v [Concept('building','budove')|e] alebo v [rgo|e]. Budova môže podporovať iba jeden [Concept('pop_type','sociálna trieda')|e] a maximálny počet závisí od typu budovy a počtu jej úrovní." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_unemploy: "Dostupné obyvateľstvo" # todo: NEW TRANSLATION
 game_concept_unemployed: "Dostupné" # todo: NEW TRANSLATION
 game_concept_available: "Dostupné" # todo: NEW TRANSLATION
 game_concept_available_population: "Dostupné obyvateľstvo" # todo: NEW TRANSLATION
 game_concept_unemploy_desc: "[Concept('pops','Populácie')|e] môžu byť [Concept('employed','zamestnaný')|e] buď v [Concept('building','budove')|e] alebo v [rgo|e]. Tí, ktorí to nerobia, sú považovaní za dostupné." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_peasant_enfranchisement: "$MODIFIER_TYPE_NAME_global_peasant_enfranchisment$" # todo: NEW TRANSLATION
 game_concept_peasant_enfranchisement_desc: "$MODIFIER_TYPE_DESC_global_peasant_enfranchisment$\n\nUdeľovanie práv závisí predovšetkým od [ShowSocietyDirectionName('free_subjects')] [societal_value_with_icon|e]. [Concept('towns_and_cities','Mestské lokality')|e] majú vyššiu úroveň než [Concept('rural_locations','vidiecke lokality')|e], a niektoré [Concept('buildings','budovy')|e] ju môžu zvýšiť alebo znížiť." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_foreign: "Zahraničný" # todo: NEW TRANSLATION
 game_concept_foreign_desc: "Toto je [Concept('location','lokalita')|e], ktorú nevlastní [Concept('country','krajina')|e], ktorú práve hráte." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_estate: "Stav"
 game_concept_estates: "Stavy"
 game_concept_estate_type: "Typ stavu" # todo: NEW TRANSLATION
 game_concept_estate_types: "Typy stavov" # todo: NEW TRANSLATION
 game_concept_estate_desc: "Špeciálne záujmové skupiny v rámci [country_with_icon|e], stavy majú [estate_power_with_icon|e] reprezentujúcu ich politickú silu v rámci vlády, [estate_satisfaction_with_icon|e] ukazujúcu, nakoľko sú ich potreby uspokojené, [estate_culture_with_icon|e] a [estate_religion_with_icon|e] dedené od ich dominantných [Concept('pops','populácií')|e], a [Concept('estate_opinions','názorov stavov')|e] ostatných krajín.\n\nStavy môžu mať aj [estate_privileges_with_icon|e], čo sú špeciálne práva, ktoré zvyšujú ich moc a ktoré vláda môže udeľovať alebo odoberať. V zátahu [estates] poskytujú [taxes_with_icon|e], [army_levies_with_icon|e] a [navy_levies_with_icon|e] svojej [country].\n\nStavy vyberajú [tax_base_with_icon|e] z [locations_with_icon|e], ako aj časť zisku z [Concept('trade','obchodu')|e], a používajú tieto prostriedky na výstavbu [buildings_with_icon|e] a platenie za [pop_needs_with_icon|e]. Ak je ich [estate_satisfaction] nízka, budú stavať len stavovské budovy na podporu vlastnej [estate_power].\n\nKaždý [character_with_icon|e] patrí do jedného zo Stavov a zvyšuje jeho moc, keď je vymenovaný do [cabinet_with_icon|e], alebo keď velí [Concept('armies','armád')|e] a [Concept('navies','námorných síl')|e]. Niektoré [Concept('heir_selections','nástupníckych práv')|e] obmedzujú ich [Concept('heirs','dedičov')|e] na konkrétne stavy." # todo: CHANGED # todo: CONCEPT CASE
 game_concept_wealth_impact: "Dopad bohatstva" # todo: NEW TRANSLATION
 game_concept_wealth_impact_desc: "Dopad bohatstva je pomer medzi mesačnými [Concept('gold','dukátmi')|e] príjmami [Concept('estate','stavom')|e] a jeho mesačnými výdavkami.\n\nHodnota nad 100 % znamená, že panstvo zarába viac, než míňa, čo mu umožňuje hromadiť bohatstvo a investovať do [Concept('buildings','budov')|e] a [Concept('roads','ciest')|e]. Nízky Dopad bohatstva robí panstvo opatrným, obmedzujúc ho na výstavbu len pre vlastnú [Concept('estate_power','silu stavu')|e] a znižujúc, koľko je ochotné financovať." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_estate_opinion: "Názor stavu" # todo: NEW TRANSLATION
 game_concept_estate_opinions: "Názory stavov" # todo: NEW TRANSLATION
 game_concept_estate_opinion_desc: "Stavy v [Concept('country','krajine')|e] budú mať názory o iných krajinách, t.j. proti ktorým byť [Concept('hostile','nepriateľský')|e] a s ktorými nadviazať priateľstvo, všetko za účelom naplnenia vlastných potrieb." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_estate_culture: "Kultúra stavu" # todo: NEW TRANSLATION
 game_concept_estate_cultures: "Kultúry stavov" # todo: NEW TRANSLATION
 game_concept_estate_culture_desc: "Každý [Concept('estate','stav')|e] má dominantnú Kultúru stavu, váženú podľa [Concept('pops','populácií')|e], ktoré majú politickú váhu v [Concept('country','krajine')|e]. Najprv sa vyberie dominantný [Concept('language','jazyk')|e] medzi týmito populáciami a potom dominantná [Concept('culture','kultúra')|e] medzi populáciami, ktoré tým jazykom hovoria.\n\nPanstvo, ktorého kultúra je [Concept('primary_culture','hlavná kultúra')|e] alebo [Concept('accepted_culture','akceptovaná kultúra')|e], má vyššie [Concept('estate_satisfaction','spokojnosť stavu')|e] a [Concept('estate_power','sila stavu')|e]. [Concept('tolerated_culture','Tolerovaná kultúra')|e] je neutrálna, zatiaľ čo akákoľvek iná kultúra znižuje obe." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_estate_religion: "Náboženstvo stavu" # todo: NEW TRANSLATION
 game_concept_estate_religions: "Náboženstvá stavov" # todo: NEW TRANSLATION
 game_concept_estate_religion_desc: "Každý [Concept('estate','stav')|e] má dominantné Náboženstvo stavu, vybrané podľa toho [Concept('religion','náboženstva')|e], ktoré má najväčšiu politickú váhu medzi [Concept('pops','populáciami')|e] stavu.\n\n[Concept('estate_satisfaction','Spokojnosť stavu')|e] a [Concept('estate_power','sila stavu')|e] stavu sa upravujú podľa tolerantnosti [Concept('country','krajina')|e] voči náboženstvu stavu — [Concept('primary_religion_tolerance','tolerancie hlavného náboženstva')|e], ak sa zhoduje so [Concept('state_religion','štátnym náboženstvom')|e], [Concept('heretic_tolerance','toleranciou kacírov')|e], ak ide o [Concept('heretic','kacíra')|e] vieru v rámci tej istej skupiny, a [Concept('heathenry_tolerance','tolerancie neznabohov')|e], ak patrí do inej náboženskej skupiny." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_estate_building: "Budova štátnej vrstvy" # todo: NEW TRANSLATION
 game_concept_estate_buildings: "Budovy štátnych vrstiev" # todo: NEW TRANSLATION
 game_concept_estate_building_desc: "Budovy štátnych vrstiev sú [Concept('buildings','budovy')|e], ktoré stavajú a udržiavajú iba [Concept('estates','stavy')|e] s cieľom zvýšiť svoje [Concept('political_power','politickú moc')|e]. Ich efekty zvyčajne idú proti záujmom [ShowEstateTypeName('crown_estate')]. [estates] ich budú uprednostňovať v [Concept('locations','lokalitách')|e] s nízkou úrovňou [Concept('control','kontrolou')|e], a Koruna ich môže zničiť, ak je [control] dostatočne vysoké, alebo prostredníctvom [Concept('parliament_agenda','parlamentnej agendy')|e].\n\n[estates] môžu tiež stavať bežné [buildings] a [Concept('rgo','R.G.O.')|e], aby zvýšili svoje príjmy, a preto uprednostnia miesta s nízkym [control], kde už majú vysoký [Concept('wealth_share','podiel na bohatstve')|e].\n\n[estates] platia #W [GetDefine('NEconomy','ESTATE_MAX_PRICE_MULTIPLIER')]#!-krát vyššiu bežnú konštrukčnú [Concept('price','cenu')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_food: "Potraviny" # todo: NEW TRANSLATION
 game_concept_food_desc: "To, na čom sa [Concept('armies','armády')|e] živia pri pochodoch a na čom [Concept('pops','populácie')|e] prežívajú. Bez potravín budú [Concept('armies','armády')|e] trpieť [Concept('attrition','vyčerpanie')|e] a $game_concept_pops$ budú trpieť [Concept('starvation','hladovanie')|e]. [Concept('food_raw_materials','Surové potraviny')|e] sú primárnym zdrojom potravinami, hoci určitú úlohu hrajú aj niektoré [Concept('buildings','budovy')|e].\n\nExistujú 3 úrovne zapojené do výroby a distribúcie $game_concept_food$:\n\n@location! [Concept('local_food','Lokálne potraviny')|e]:\nPotraviny sa vyrába a spotrebúva v [Concept('locations','lokalitách')|e], a akýkoľvek prebytok alebo deficit sa pridá do provinčných potravín.\n\n@province! [Concept('provincial_food','Provinčné potraviny')|e]:\nProvinčné potraviny je najdôležitejšia úroveň. Ak [Concept('province','provincia')|e] nevyrába dosť $game_concept_food$, aby zabezpečila spotrebu všetkých svojich lokalít, zásoba provincie sa zníži. Keď sa vyčerpá, všetky $game_concept_locations$ v rámci provincie budú trpieť [Concept('starvation','hladovania')|e]. Predtým sa však provincie pokúsi [Concept('buy_food','kúpiť potravín')|e] z svojho trhu.\n\n@market! [Concept('market_food','Trhové potraviny')|e]:\nVšetky provincií v [Concept('market','trhu')|e] sa pokúsia [Concept('sell_food','predať potravín')|e], keď majú zásoby plné, a [buy_food] keď sú nízke. Pokiaľ je v trhu dostatok potravín, nikto nebude hladovať." # todo: CHANGED # todo: CONCEPT CASE
 game_concept_monthly_food: "Mesačné potraviny" # todo: NEW TRANSLATION
 game_concept_monthly_food_desc: "Akékoľvek [Concept('food','potraviny')|e], ktoré nie sú spotrebované Popmi v území, sa prispievajú do zásob [Concept('provincial_food','provinčných potravín')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_local_food: "Lokálne potraviny" # todo: NEW TRANSLATION
 game_concept_local_food_desc: "Toto je množstvo [Concept('food','potraviny')|e], ktoré [Concept('location','lokalita')|e] prispieva do [Concept('provincial_food','provinčných potravín')|e]. Ak je záporné, lokalitu si jednoducho vezme $game_concept_food$ z iných lokalít v jeho [Concept('province','provincii')|e].\n\nKaždé lokalite vyrába isté množstvo $game_concept_food$ v závislosti od jeho [Concept('subsistence_agriculture','sebestačného poľnohospodárstva')|e] a [Concept('food_productivity','produktivity potravín')|e], ale väčšina produkcie $game_concept_food$ prebieha v lokalitách s [Concept('food_raw_materials','surovými potravinami')|e].\n\nKaždé lokalitou bude mať tiež určitú [Concept('pop_food_consumption','spotrebu potravín populáciou')|e] v závislosti od [Concept('population','populácie')|e], ktorá v ňom žije.\n\n[Concept('towns_and_cities','Mestské lokality')|e] často budú mať zápornú bilanciu lokálne potraviny, no to nie je problém, pokiaľ je $game_concept_provincial_food$ kladné." # todo: CHANGED # todo: CONCEPT CASE
 game_concept_provincial_food: "Provinčné potraviny" # todo: NEW TRANSLATION
 game_concept_provincial_food_desc: "Toto je množstvo [Concept('food','potraviny')|e], ktoré má [Concept('province','provincia')|e] uložené. Ak je [Concept('monthly_food','mesačné potraviny')|e] záporné, zásoby sa nakoniec vyčerpajú. Ak je deficit, provincia bude [Concept('buy_food','kúpiť potraviny')|e] na miestnom [Concept('market','trh')|e] a pri prebytku bude [Concept('sell_food','predať potraviny')|e].\n\nAkékoľvek [food], ktoré nie sú spotrebované [Concept('pops','populácie')|e] v [Concept('location','lokalite')|e], sa prispievajú do provinciálnych zásob potravín.\n\nVšetky územia v provincii môžu čerpať z týchto zásob, aby nakŕmili svojich obyvateľov. [Concept('armies','Armády')|e] v provincii môžu tiež spotrebovať uložené potraviny, ak by inak trpeli [Concept('attrition','vyčerpanie')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_market_food: "Trhové potraviny" # todo: NEW TRANSLATION
 game_concept_market_food_desc: "Každá [Concept('province','provincia')|e] bude buď [Concept('buy_food','kúpiť potraviny')|e], alebo [Concept('sell_food','predať potraviny')|e] v [Concept('market','trhu')|e], ku ktorému patrí, za cenu, ktorá závisí od množstva potravín uloženého v trhu [Concept('stockpile','zásob')|e]. [Concept('owner','Majiteľ')|e] Provincia bude tým, kto pocíti náklady alebo zisk transakcie, čo znamená, že $game_concept_provinces$ s prebytkom potravinami prinesú [Concept('income','príjem')|e] ich $game_concept_owner$, zatiaľ čo deficity povedú k [Concept('expenses','výdavkom')|e].\n\nMôžete vytvárať [Concept('trades','obchody')|e] [Concept('food_raw_materials','surových potravín')|e], aby ste presunuli $game_concept_food$ medzi trhmi." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_pop_food_consumption: "Spotreba potravín populáciou" # todo: NEW TRANSLATION
 game_concept_pop_food_consumption_desc: "Toto je množstvo [Concept('food','potraviny')|e], ktoré [Concept('pop','populácia')|e] spotrebuje každý mesiac." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_food_productivity: "Produktivita potravín" # todo: NEW TRANSLATION
 game_concept_food_productivity_desc: "Produktivita potravín [Concept('location','lokality')|e] ovplyvňuje, ako efektívne produkuje [Concept('food','potraviny')|e].\n\nZávisí hlavne na geografii lokalite, ale niektoré [Concept('laws','zákony')|e], [Concept('societal_values','sociálne hodnoty')|e] a [Concept('advances','pokroky')|e] to môžu tiež ovplyvniť. [Concept('towns_and_cities','Mestské lokality')|e] sú menej efektívne pri produkcii potravinám než [Concept('rural_locations','vidiecke lokality')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_subsistence_agriculture: "Sebestačné poľnohospodárstvo" # todo: NEW TRANSLATION
 game_concept_subsistence_agriculture_desc: "[Concept('rgo_pops','Robotníci alebo otroci')|e], ktoré nie sú zamestnané v [rgo|e] alebo v [Concept('building','budove')|e], pracujú v sebestačnom poľnohospodárstve. Generujú jedlo v menších množstvách než $game_concept_resource_gathering_operations$ pracujúce na [Concept('food_raw_materials','surové potraviny')|e], často sotva dosť na uspokojenie vlastných potrieb. Predpokladá sa, že všetko [Concept('unemployed','dostupné')|e] obyvateľstvo vykonáva túto jednoduchšiu formu zberu [Concept('food','potravinám')|e], aj keď $game_concept_location$ má [Concept('raw_material','surovina')|e], ktorá nie je priamo súvisiaca s [Concept('food','potravinami')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_starvation: "Hladovanie" # todo: NEW TRANSLATION
 game_concept_starving: "Hladujúci" # todo: NEW TRANSLATION
 game_concept_starving_desc: "Keď [Concept('province','provincia')|e] nemá v [Concept('provincial_food','provinčných potravinách')|e] žiadne [Concept('food','potraviny')|e], [Concept('pops','populácie')|e] budú hladovať a umierať.\n\nTo spôsobí nasledujúci efekt:\n[ShowModifierEffect('province_starving')]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_food_raw_material: "Surová potravina" # todo: NEW TRANSLATION
 game_concept_food_raw_materials: "Surové potraviny" # todo: NEW TRANSLATION
 game_concept_food_raw_material_desc: "Okrem toho, že sa obchodujú a používajú ako ostatné [Concept('goods','tovary')|e], niektoré [Concept('raw_materials','suroviny')|e] tiež produkujú [Concept('food','potraviny')|e]. Sú produkované v [rgo|e] a predstavujú omnoho efektívnejší zdroj $game_concept_food$ než $game_concept_subsistence_agriculture$. \n\nPotraviny sa tiež presúva medzi [Concept('markets','trhmi')|e], keď sú $game_concept_food_raw_materials$ obchodované." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_food_raw_material_list_title: "Zoznam $game_concept_food_raw_materials$" # todo: NEW TRANSLATION
 game_concept_selling_food: "Predaj potravín" # todo: NEW TRANSLATION
 game_concept_sell_food: "Predať potraviny" # todo: NEW TRANSLATION
 game_concept_sell_food_short: "Predať" # todo: NEW TRANSLATION
 game_concept_selling_food_desc: "Keď má [Concept('province','provincia')|e] prebytok [Concept('food','potraviny')|e] a už ho nemôže viac skladovať, predá ho na svojom miestnom [Concept('market','trh')|e]. To je možné len ak provincia nie je pod [Concept('siege','obliehaním')|e].\n\n[province] môže za mesiac kúpiť naraz len toľko [Concept('food','potraviny')|e], koľko je celková kapacita [Concept('food_stockpile','zásoby potravín')|e] tejto [province]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_buying_food: "Nákup potravín" # todo: NEW TRANSLATION
 game_concept_buy_food: "Kúpiť potraviny" # todo: NEW TRANSLATION
 game_concept_buy_food_short: "Kúpiť" # todo: NEW TRANSLATION
 game_concept_buying_food_desc: "Keď má [Concept('province','provincia')|e] nízke množstvo [Concept('food','potraviny')|e], kúpi si viac na svojom miestnom [Concept('market','trh')|e]. To je možné len ak provincia nie je pod [Concept('siege','obliehaním')|e].\n\n[province] môže za mesiac kúpiť naraz len toľko [Concept('food','potraviny')|e], koľko je celková kapacita [Concept('food_stockpile','zásoby potravín')|e] tejto [province]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_food_stockpile: "Zásoby potravín" # todo: NEW TRANSLATION
 game_concept_food_stockpile_desc: "Mesačný prebytok [Concept('food','potraviny')|e] z @location! [Concept('locations','lokalít')|e] sa ukladá v @province! [Concept('province','provincii')|e] zásobách. Mesačný prebytok [food] z [provinces] sa ukladá v @market! [Concept('market','trhu')|e] zásobách.\n\nDostatočne veľké [food_stockpile] môže pomôcť predísť [Concept('starvation','hladovanie')|e] počas krutej [Concept('winter','zimy')|e], keď je [Concept('food_productivity','produktivita potravín')|e] nízka.\n\nVyšší $game_concept_food_stockpile$ v @province! [Concept('province','provincii')|e] mu tiež umožňuje [Concept('buy_food','kúpiť potraviny')|e] a [Concept('sell_food','predať potraviny')|e] vo väčších množstvách každý mesiac." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_construction_material: "Stavebný materiál" # todo: NEW TRANSLATION
 game_concept_construction_materials: "Stavebné materiály" # todo: NEW TRANSLATION
 game_concept_construction_material_desc: "Stavebné materiály sú [Concept('raw_materials','suroviny')|e], ktoré zohrávajú významnú úlohu pri [Concept('construction','výstavbe')|e] [Concept('buildings','budovách')|e]. Sú produkované v [rgo|e] a zvyčajne sú nevyhnutné pre rozvoj [Concept('towns_and_cities','mestské lokality')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_construction_material_list_title: "Zoznam $game_concept_construction_materials$" # todo: NEW TRANSLATION
 game_concept_loan: "Pôžička" # todo: NEW TRANSLATION
 game_concept_loaned: "Požičané" # todo: NEW TRANSLATION
 game_concept_lent: "Požičané" # todo: NEW TRANSLATION
 game_concept_lend: "Požičať" # todo: NEW TRANSLATION
 game_concept_lends: "Požičiava" # todo: NEW TRANSLATION
 game_concept_loans: "Pôžičky" # todo: NEW TRANSLATION
 game_concept_loan_desc: "Pôžička je množstvo [Concept('gold','dukáty')|e], ktoré poskytol [Concept('lender','veriteľ')|e] a ktoré bude potrebné splatiť s mesačným [Concept('interest','úrokom')|e]. Pôžička môže byť užitočná, keď [Concept('country','krajina')|e] potrebuje okamžite [Concept('gold','dukáty')|e]. Vziať pôžičku zvýši [Concept('debt','dlh')|e] [country]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_loan_capacity: "Kapacita pôžičiek" # todo: NEW TRANSLATION
 game_concept_loan_capacity_desc: "Toto je, koľko peňazí si môže [Concept('country','krajina')|e] [Concept('lend','požičať')|e] zo svojich interných zdrojov. [Concept('estates','Stavy')|e] do toho môžu investovať a získavať všetky [Concept('interest','úrok')|e], ktoré [Concept('country','krajina')|e] z týchto pôžičiek platí. Niektoré [Concept('buildings','budovy')|e], [Concept('advances','pokroky')|e] alebo [Concept('government_reforms','vládne reformy')|e] to tiež môžu ovplyvniť." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_government_bond: "Vládny dlhopis" # todo: NEW TRANSLATION
 game_concept_government_bonds: "Vládne dlhopisy" # todo: NEW TRANSLATION
 game_concept_government_bond_desc: "Vládny dlhopis je forma dlhodobého [Concept('debt','dlhu')|e] vydaná [Concept('country','krajina')|e]. Na rozdiel od [Concept('estate','stavu')|e] [Concept('loan','pôžičky')|e] nemá dlhopis dátum splatnosti a nikdy sa automaticky nesplatí. [Concept('country','Krajina')|e] dostane predom zlato a mesačne platí [Concept('bond_interest','úrok z dlhopisu')|e] donekonečna, až kým sa nerozhodne dlhopis odkúpiť zaplatením nominálnej hodnoty." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_bond_interest: "Úrok z dlhopisu" # todo: NEW TRANSLATION
 game_concept_bond_interest_desc: "Mesačná [Concept('interest','úrok')|e] sadzba platená z nesplatených [Concept('government_bonds','vládne dlhopisov')|e]. Na rozdiel od úrokov z [Concept('estate','stavu')|e] pôžičiek je tento náklad odtokom z pokladnice bez prijímateľa — predstavuje priebežné náklady suverénneho dlhu." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_central_bank: "Centrálna banka" # todo: NEW TRANSLATION
 game_concept_central_bank_desc: "Centrálna banka je [Concept('building','budova')|e] v [Concept('capital','hlavnom meste')|e], ktorá umožňuje [Concept('country','krajina')|e] vydávať [Concept('government_bonds','vládne dlhopisy')|e]. Poskytuje kapacitu pre dlhopisy, znižuje [Concept('bond_interest','úrok z dlhopisu')|e] a zvyšuje veľkosť každého vydaného dlhopisu." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_interest: "Úrok" # todo: NEW TRANSLATION
 game_concept_interest_desc: "Toto je poplatok, ktorý má každá [Concept('loan','pôžičky')|e] a ktorý sa platí každý mesiac [Concept('lender','veriteľa')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_debt: "Dlh" # todo: NEW TRANSLATION
 game_concept_debts: "Dlhy" # todo: NEW TRANSLATION
 game_concept_debt_desc: "Toto je celkové množstvo [Concept('loans','pôžičky')|e], ktoré má krajina, vrátane akéhokoľvek zostávajúceho [Concept('interest','úrok')|e]. Ak sa tento dlh príliš zväčší, [Concept('country','krajina')|e] pôjde [Concept('bankrupt','bankrot')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_lender: "Veriteľ" # todo: NEW TRANSLATION
 game_concept_lender_desc: "To je buď banka, ktorá požičiava [Concept('gold','dukáty')|e], aby na tom zarobila [Concept('interest','úrok')|e], alebo iná [Concept('country','krajina')|e], ktorá peniaze požičiava." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_borrower: "Dlžník" # todo: NEW TRANSLATION
 game_concept_borrower_desc: "Ide o [Concept('country','krajinu')|e], ktorá dlží [Concept('gold','dukáty')|e] a musí zaň platiť [Concept('interest','úrok')|e], zvyčajne inej [Concept('country','krajiny')|e] alebo [Concept('estate','stav')|e]." # todo: CHANGED # todo: CONCEPT CASE
 game_concept_creditworthiness: "Kreditná spôsobilosť" # todo: NEW TRANSLATION
 game_concept_creditworthiness_desc: "Kreditná spôsobilosť meria, ako spoľahlivo [Concept('country','krajina')|e] spláca svoje [Concept('debts','dlhy')|e]. Pohybuje sa od 0 do 100, pričom 50 je neutrálny stav. Vyššie hodnoty znižujú [Concept('interest','úrok')|e] sadzbu na všetky [Concept('loans','pôžičky')|e] a robia zahraničných veriteľov ochotnejšími ponúkať úver; nižšie hodnoty zvyšujú úroky a veriteľov odrádzajú. Bankrot ([Concept('bankrupt','bankrot')|e]) spôsobí veľký pokles kreditnej spôsobilosti, ktorá sa potom pomaly zotavuje." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 adm_concept: "[Concept('adm','Administratívna schopnosť')|e]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 dip_concept: "[Concept('dip','Diplomatická schopnosť')|e]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 mil_concept: "[Concept('mil','Vojenská schopnosť')|e]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_adm: "Administratívna schopnosť" # todo: NEW TRANSLATION
 game_concept_adm_short: "Administratívny" # todo: NEW TRANSLATION
 game_concept_adm_i: "@adm!" # todo: NEW TRANSLATION
 game_concept_adm_desc: "Táto [Concept('ability','schopnosť')|e] predstavuje, ako dobrý je [Concept('character','postava')|e] v riešení administratívnych úloh, ako dobre vie organizovať veci, riadiť ekonomiku a zabezpečiť chod krajiny." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_dip: "Diplomatická schopnosť" # todo: NEW TRANSLATION
 game_concept_dip_short: "Diplomatický" # todo: NEW TRANSLATION
 game_concept_dip_i: "@dip!" # todo: NEW TRANSLATION
 game_concept_dip_desc: "Táto [Concept('ability','schopnosť')|e] predstavuje, ako dobrý je [Concept('character','postava')|e] v presviedčaní iných ľudí, aby niečo urobili. Tiež predstavuje, ako obľúbený je daný charakter." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_mil: "Vojenská schopnosť" # todo: NEW TRANSLATION
 game_concept_mil_short: "Vojenský" # todo: NEW TRANSLATION
 game_concept_mil_i: "@mil!" # todo: NEW TRANSLATION
 game_concept_mil_desc: "Táto [Concept('ability','schopnosť')|e] predstavuje, ako dobrý je [Concept('character','postava')|e] v pochopení vojenských aspektov, ako rozumie taktike a ako robí ťažké rozhodnutia." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_inflation: "Inflácia" # todo: NEW TRANSLATION
 game_concept_inflation_i: "@inflation!" # todo: NEW TRANSLATION
 game_concept_inflation_desc: "Inflácia predstavuje rast cien vo všetkých oblastiach hry. Zvyšuje sa [minting|e] väčšieho množstva zlata, aby sme zvýšili náš [Concept('income','príjem')|e], a môžeme ju znížiť [Concept('cabinet_action','akcia kabinetu')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_stability: "Stabilita" # todo: NEW TRANSLATION
 game_concept_stability_i: "@stability!" # todo: NEW TRANSLATION
 game_concept_stability_desc: "Stabilita je mierou vnútorného mieru [Concept('country','krajinu')|e]. Ak je negatívna, znamená to nepokoj, ak je pozitívna, pokoj. V priebehu času sa stabilita bude prirodzene približovať k #Y 0#!, pokiaľ ju nenarušia iné faktory. Začatie [Concept('wars','vojny')|e] je jednou z akcií, ktoré znižujú stabilitu krajiny." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_complacency: "Bezstarostnosť" # todo: NEW TRANSLATION
 game_concept_complacency_i: "@complacency!" # todo: NEW TRANSLATION
 game_concept_complacency_desc: "Toto predstavuje, ako sa ľud v [Concept('country','krajine')|e] stal spokojný, keď nemá vonkajšie hrozby. Spokojnosť prirodzene rastie s našou veľkosťou a silou a dá sa udržať pod kontrolou prítomnosťou [Concept('rivals','rivalmi')|e], ktoré predstavujú [Concept('threat','hrozba')|e], zvýšením našich [Concept('diplomatic_maintenance','diplomatických výdavkov')|e] a udržiavaním vysokej priemernej [Concept('control','kontrole')|e].\n\nVysoká spokojnosť môže spôsobovať vážne postihy pre našu [country], ale jej efekty sa aktivujú len v kontexte určitých [Concept('disasters','katastrofy')|e].\n\n[GetComplacencyDisasters]" # todo: CHANGED # todo: CONCEPT CASE
 game_concept_prestige: "Prestíž" # todo: NEW TRANSLATION
 game_concept_prestige_i: "@prestige!" # todo: NEW TRANSLATION
 game_concept_prestige_desc: "Prestíž [Concept('country','krajina')|e] určuje, ako dobre je krajina vnímaná. Zvyšuje [Concept('cultural_influence','kultúrny vplyv')|e] jej [Concept('primary_culture','hlavnej kultúry')|e] a uľahčuje [Concept('diplomacy','diplomacia')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_war_exhaustion: "Vojnová vyčerpanosť" # todo: NEW TRANSLATION
 game_concept_war_exhaustion_i: "@war_exhaustion!" # todo: NEW TRANSLATION
 game_concept_war_exhaustion_desc: "Vojnová vyčerpanosť predstavuje, ako veľmi je naša [Concept('country','krajina')|e] zdevastovaná [Concept('war','vojna')|e]. Ak je dostatočne vysoké, budeme nútení podpísať [Concept('peace_treaty','mierová dohoda')|e]. Toto sú efekty pri 1 vojnovej vyčerpanosti:\n[ShowAutoModifierEffect('war_exhaustion_impact')]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_exile: "V exile" # todo: NEW TRANSLATION
 game_concept_exiled: "Vyhnaný" # todo: NEW TRANSLATION
 game_concept_exile_desc: "[Concept('army','Armáda')|e] alebo [Concept('navy','námorníctvo')|e] môžu byť umiestnené do Exilu, čo znamená, že nebudú schopné obliehať alebo bojovať s akýmikoľvek [Concept('units','jednotkami')|e], kým ich nevrátime na priateľské územie. To sa stáva, keď sú na území, ku ktorému už nemajú prístup, zvyčajne po podpísaní [Concept('peace_treaty','mierovej dohode')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_retreat: "Ústup" # todo: NEW TRANSLATION
 game_concept_retreats: "Ústupy" # todo: NEW TRANSLATION
 game_concept_retreating: "Ustupovanie" # todo: NEW TRANSLATION
 game_concept_retreat_desc: "[Concept('army','Armáda')|e] alebo [Concept('navy','námorníctvo')|e] môže byť nútená ustúpiť po prehre bitky, ak má príliš nízke [Concept('morale','morálka')|e], alebo sa môže dobrovoľne rozhodnúť [Concept('retreat','ústup')|e]. Počas ústupu nebude schopná opäť bojovať ani dostať nové rozkazy, kým nedosiahne svoj cieľ." # todo: CHANGED # todo: CONCEPT CASE
 game_concept_army_tradition: "Armádna tradícia" # todo: NEW TRANSLATION
 game_concept_army_tradition_i: "@army_tradition!" # todo: NEW TRANSLATION
 game_concept_army_tradition_desc: "Toto predstavuje nahromadené skúsenosti [Concept('armies','armády')|e], [Concept('battles','bitky')|e] a [Concept('sieges','obliehania')|e] danej [Concept('country','krajine')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_navy_tradition: "Námorná tradícia" # todo: NEW TRANSLATION
 game_concept_navy_tradition_i: "@navy_tradition!" # todo: NEW TRANSLATION
 game_concept_navy_tradition_desc: "Toto predstavuje nahromadené skúsenosti [Concept('navies','námorné sily')|e], ich [Concept('battles','bitky')|e], [Concept('blockades','blokády')|e] a všetky ostatné námořné aspekty, ktoré má [Concept('country','krajina')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_recruit: "Nábor" # todo: NEW TRANSLATION
 game_concept_recruiting: "Nábor" # todo: NEW TRANSLATION
 game_concept_recruit_desc: "Nábor je proces, ktorým sa na mape formujú [Concept('manpower','živá sila')|e] ako [Concept('units','jednotky')|e]. To zvyčajne zahŕňa náklady v [Concept('gold','dukátoch')|e] a [Concept('goods','tovaroch')|e] [Concept('demand','dopyte')|e]. Napríklad jazdec bez koňa sotva môže byť považovaný za jazdca." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_unit_formation_preference: "Preferencia formovania jednotiek" # todo: NEW TRANSLATION
 game_concept_unit_formation_preference_desc: "Určuje logiku formácie, ktorá sa aplikuje pri použití akcie #W $BALANCE_ARMY$#! alebo keď je formácia vašich jednotiek automatizovaná." # todo: CHANGED
 game_concept_recruitment_method: "Metóda náboru" # todo: NEW TRANSLATION
 game_concept_recruitment_methods: "Metódy náboru" # todo: NEW TRANSLATION
 game_concept_recruitment_method_desc: "Môžeme sa rozhodnúť, či chceme venovať viac času výcviku našich vojakov, aby získali viac [Concept('experience','skúsenosti')|e], alebo či chceme pripraviť [Concept('regiment','pluk')|e] rýchlejšie, ale s nižším [Concept('maximum_strength','maximálnou silou')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_age: "Vek" # todo: NEW TRANSLATION
 game_concept_ages: "Veky" # todo: NEW TRANSLATION
 game_concept_age_upper_desc: "Hra je rozdelená do viacerých vekov, zvyčajne po jednom na storočie. Každý vek má svoje vlastné pravidlá a mechaniky a tiež vlastný strom [Concept('advances','pokroky')|e], ktorým sa dá postupovať." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_age_lower_desc: "Na začiatku každého veku si vyberieme zameranie medzi [adm_short], [dip_short] alebo [mil_short] Focus, čo ovplyvní, aký bude strom našich [Concept('country','krajiny')|e] v tom veku." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_age_list_title: "Zoznam vekov" # todo: NEW TRANSLATION
 game_concept_age_desc: "$game_concept_age_upper_desc$\n\n[ShowDatabase('age')]\n\n$game_concept_age_lower_desc$" # todo: NEW TRANSLATION
 game_concept_institution: "Inštitúcia" # todo: NEW TRANSLATION
 game_concept_institutions: "Inštitúcie" # todo: NEW TRANSLATION
 game_concept_institution_desc: "Každý [Concept('age','vek')|e] má tri rôzne inštitúcie, ktoré sa objavia v príslušnom [Concept('location','lokalite')|e] na mape. Potom sa budú rozširovať po mape a keď ich [Concept('countries','krajiny')|e] [Concept('embrace','prijať')|e], odomykajú nové [Concept('advances','pokroky')|e] pre daný vek.\n\nAk zistíme, že sa inštitúcia našej [country] nešíri dostatočne rýchlo, môžeme sa pokúsiť o [ShowCabinetActionName('study_institutions')]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_embrace: "Prijať" # todo: NEW TRANSLATION
 game_concept_embraced: "Prijaté" # todo: NEW TRANSLATION
 game_concept_embrace_desc: "[Concept('country','Krajina')|e] môže [Concept('embrace','prijať')|e] [Concept('institution','inštitúcie')|e], keď dostatočná časť [Concept('population','populácie')|e] danej [Concept('country','krajine')|e] žije v [Concept('locations','lokalitách')|e], kde sa plne rozšírila. To znamená, že krajina úplne pochopila [institution] a môže [Concept('research','výskum')|e] [Concept('advances','pokrokov')|e], ktoré ju vyžadujú." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_advance: "Pokrok" # todo: NEW TRANSLATION
 game_concept_advances: "Pokroky" # todo: NEW TRANSLATION
 game_concept_advance_desc: "Pokroky predstavujú myšlienky, vynálezy, technológie a iné oblasti ľudského poznania.\n\nNaraz môže byť [Concept('researched','vyskúmané')|e] len jeden Advance a rýchlosť, akou ich môže [Concept('country','krajina')|e] skúmať, závisí od ich [research_progress_with_icon|e].\n\nS každým [Concept('age','vekom')|e] sa pre [countries] sprístupnia nové [advances_with_icon|e]. Niektoré sú exkluzívne pre konkrétne [countries], [Concept('cultures','kultúry')|e] alebo [Concept('religions','náboženstvá')|e], ale väčšina vyžaduje len prijatie príslušných [institutions_with_icon|e].\n\nRýchlosť, akou postupujeme k novým [advances_with_icon|e], závisí hlavne od sily nášho [liturgical_language_with_icon|e], priemernej [literacy_with_icon|e] našich [pops_with_icon|e], [Concept('estate_satisfaction','spokojnosti stavu')|e] nášho [ShowEstateTypeName('clergy_estate')] a počtu [institutions_with_icon|e], ktoré sme [Concept('embraced','prijaté')|e]." # todo: CHANGED # todo: CONCEPT CASE
 game_concept_research: "Výskum" # todo: NEW TRANSLATION
 game_concept_researched: "Vyskúmané" # todo: NEW TRANSLATION
 game_concept_researching: "Výskum" # todo: NEW TRANSLATION
 game_concept_research_desc: "Výskum [Concept('advance','pokrok')|e] trvá čas a [Concept('country','krajina')|e] môže naraz skúmať len jeden pokrok. Výhodu pokroku získame, keď náš [Concept('research_progress','pokrok výskumu')|e] dosiahne jeho cenu.\n\nRýchlosť, akou postupujeme k novým [advances_with_icon|e], závisí hlavne od sily nášho [liturgical_language_with_icon|e], priemernej [literacy_with_icon|e] našich [pops_with_icon|e], [Concept('estate_satisfaction','spokojnosti stavu')|e] nášho [ShowEstateTypeName('clergy_estate')] a počtu [institutions_with_icon|e], ktoré máme [Concept('embraced','prijaté')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_research_progress: "Pokrok výskumu" # todo: NEW TRANSLATION
 game_concept_research_progress_desc: "Náš [Concept('research_progress','pokrok výskumu')|e] závisí hlavne od sily nášho [liturgical_language_with_icon|e], priemernej [literacy_with_icon|e] našich [pops_with_icon|e], [Concept('estate_satisfaction','spokojnosti stavu')|e] [ShowEstateTypeName('clergy_estate')] a počtu [institutions_with_icon|e], ktoré sme [Concept('embraced','prijaté')|e]." # todo: CHANGED # todo: CONCEPT CASE
 game_concept_stored_research: "Uložený pokrok výskumu" # todo: NEW TRANSLATION
 game_concept_stored_research_desc: "Uložený $game_concept_research_progress$ sa akumuluje, keď nie je vybraný žiadny [Concept('advance','pokrok')|e]. Uložený výskum sa okamžite použije po výbere [Concept('advance','pokroku')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_literacy: "Gramotnosť" # todo: NEW TRANSLATION
 game_concept_literacy_desc: "To ukazuje, ako dobre sa naši [Concept('pops','populácie')|e] vedia čítať a písať. Je to väčšinou prospešné, pretože priemerná gramotnosť v krajine pozitívne ovplyvňuje náš [Concept('research_progress','pokrok výskumu')|e], ale tiež zvyšuje vplyv [Concept('market_price','trhovú cenu')|e] ich potrieb na [Concept('pop_satisfaction','spokojnosť populácie')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_artillery_bonus: "Bonus delostrelectva" # todo: NEW TRANSLATION
 game_concept_artillery_bonus_desc: "Delostrelecké [Concept('regiments','pluky')|e] majú silu bombardovať [Concept('fortifications','opevnenia')|e] svojimi delami. Ich sila závisí od ich [Concept('artillery_barrage','delostrelecká salva')|e] a úrovne [Concept('fort','pevnosť')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_artillery_barrage: "Delostrelecká salva" # todo: NEW TRANSLATION
 game_concept_artillery_barrage_desc: "Ak je toto počas [Concept('siege','obliehania')|e] vyššie než úroveň [Concept('fort','pevnosť')|e], môže to dať útočníkovi bonus!" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_estate_privilege: "Privilégiá stavu" # todo: NEW TRANSLATION
 game_concept_estate_privileges: "Privilégiá stavov" # todo: NEW TRANSLATION
 game_concept_privileges: "Privilégiá" # todo: NEW TRANSLATION
 game_concept_privilege: "Privilégium" # todo: NEW TRANSLATION
 game_concept_estate_privilege_desc: "[Concept('ruler','Panovník')|e] môže občas udeľovať určité privilegiá určitým skupinám ľudí. Môžu to byť daňové úľavy, monopoly alebo iné práva, ktoré dávajú výhodu konkrétnemu [Concept('estate','stavu')|e]. Zvyčajne to prichádza za nejakú cenu pre korunu, či už v podobe vplyvu [estate] alebo iného nákladu." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_supply_depot: "Zásobovací sklad" # todo: NEW TRANSLATION
 game_concept_supply_depots: "Zásobovacie sklady" # todo: NEW TRANSLATION
 game_concept_supply_depot_desc: "[Concept('armies','Armády')|e] môžu vytvárať zásobovacie sklady v [Concept('hostile','nepriateľskom')|e] [Concept('locations','lokalitách')|e], kde môžu ukladať [Concept('food','potraviny')|e]. [Concept('friendly','Priateľské')|e] armády potom môžu čerpať tieto zásoby na vzdialenosť až #V 2#! [locations]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_unit_ability: "Schopnosť jednotky" # todo: NEW TRANSLATION
 game_concept_unit_abilities: "Schopnosti jednotiek" # todo: NEW TRANSLATION
 game_concept_unit_ability_desc: "Toto je názov pre rozkazy ako [ShowUnitAbilityName('drill_army')] alebo [ShowUnitAbilityName('march_to_sound_of_guns')], ktoré možno dať [Concept('units','jednotky')|e]. Niektoré z nich sú okamžité akcie, iné sú stav, ktorý možno zapnúť alebo vypnúť." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_character_interaction: "Interakcia postáv" # todo: NEW TRANSLATION
 game_concept_character_interactions: "Interakcie postáv" # todo: NEW TRANSLATION
 game_concept_character_interaction_desc: "Toto sú [Concept('actions','akcie')|e], ktoré môžeme vykonať s [Concept('character','postavou')|e]. Príklady zahŕňajú [ShowCharacterInteractionName('marry_noble')], [ShowCharacterInteractionName('seppuku')] alebo [ShowCharacterInteractionName('resign_as_grand_master')]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_integration_status: "Stav integrácie" # todo: NEW TRANSLATION
 game_concept_integration_status_desc: "Toto predstavuje, ako dobre je [Concept('location','lokalita')|e] začlenené do administratívneho aparátu jeho [Concept('owner','majiteľa')|e]. Každé [owned] [location] spadá do jedného zo štyroch rôznych stavov:\n\n$BULLET$[Concept('colonized','Kolonizované')|e]\n$BULLET$[Concept('conquered','Dobytá')|e]\n$BULLET$[Concept('integrated','Integrované')|e]\n$BULLET$[Concept('core','Jadro')|e]\n\nKaždé [conquered] [location] môže byť [integrated] pomocou [Concept('cabinet_action','akcie kabinetu')|e], ale dosiahnutie stavu [core] vyžaduje, aby veľká časť [Concept('pops','populácií')|e] mala [Concept('primary_culture','hlavná kultúra')|e] alebo niektorú z [Concept('accepted_cultures','akceptovaných kultúr')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_integration_status_desc_intro: "Toto predstavuje, ako dobre je [Concept('location','lokalita')|e] začlenené do administratívneho aparátu jeho [Concept('owner','majiteľa')|e]. Každé [owned] [location] spadá do jedného zo štyroch rôznych stavov:" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_integration_status_list: "$BULLET$[Concept('colonized','Kolonizované')|e]\n$BULLET$[Concept('conquered','Dobytá')|e]\n$BULLET$[Concept('integrated','Integrované')|e]\n$BULLET$[Concept('core','Jadro')|e]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_integration_status_lower_desc: "Každé [conquered] [location] môže byť [integrated] pomocou [Concept('cabinet_action','akcie kabinetu')|e], ale dosiahnutie stavu [core] vyžaduje, aby veľká časť [Concept('pops','populácií')|e] mala [Concept('primary_culture','hlavná kultúra')|e] alebo niektorú z [Concept('accepted_cultures','akceptovaných kultúr')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_integration: "Integrácia" # todo: NEW TRANSLATION
 game_concept_integrated: "Integrované" # todo: NEW TRANSLATION
 game_concept_integrate: "Integrovať" # todo: NEW TRANSLATION
 game_concept_integrating: "Integruje sa" # todo: NEW TRANSLATION
 game_concept_integration_list_title: "Integrované [location] získava nasledujúce efekty:" # todo: NEW TRANSLATION
 game_concept_integration_list: "[ShowModifierEffect('integration_integrated')]" # todo: NEW TRANSLATION
 game_concept_integration_desc: "Integrovaná [Concept('location','lokalita')|e] bola riadne začlenená do štátu, a preto sa spravuje omnoho ľahšie než [Concept('conquered','dobytá')|e] [location].\n\n[Concept('conquered','Dobytá')|e] [locations] je potrebné integrovať pomocou [Concept('cabinet_action','akcie kabinetu')|e], ktorá cieli na celú [Concept('province','provinciu')|e], a ktorej rýchlosť závisí od rôznych faktorov vrátane počtu [locations], ich [Concept('culture','kultúra')|e] alebo ich [Concept('location_rank','rang lokality')|e]." # todo: CHANGED # todo: CONCEPT CASE
 game_concept_government_reform: "Reforma vlády" # todo: NEW TRANSLATION
 game_concept_government_reforms: "Vládne reformy" # todo: NEW TRANSLATION
 game_concept_reforms: "Reformy" # todo: NEW TRANSLATION
 game_concept_reform: "Reforma" # todo: NEW TRANSLATION
 game_concept_government_reform_desc: "Zastupujú všetko od starobylých tradícií po progresívne dodatky; vládne reformy načrtávajú podobu vlády v [Concept('country','krajine')|e]. Každá je jedinečná, často však prináša silné kompromisy alebo otvára jedinečné herné štýly.\n\n[countries] môžu mať len niekoľko vládnych reforiem, ale toto povolenie môžu zvýšiť niektorými [Concept('advances','pokrokmi')|e].\n\nNiektoré reformy sú [Concept('major_reforms','hlavné reformy')|e]; [country] nesmie mať viac než jednu z nich." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_major_reform: "Hlavná reforma" # todo: NEW TRANSLATION
 game_concept_major_reforms: "Hlavné reformy" # todo: NEW TRANSLATION
 game_concept_major_reform_desc: "Hlavná reforma je špeciálna [Concept('government_reform','reforma vlády')|e], ktorá definuje [Concept('country','krajina')|e]. [country] môže mať naraz len jednu hlavnú reformu." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_cabinet_action: "Akcia kabinetu" # todo: NEW TRANSLATION
 game_concept_cabinet_actions: "Akcie kabinetu" # todo: NEW TRANSLATION
 game_concept_cabinet_action_desc: "Člen [Concept('cabinet','kabinet')|e] môže byť pridelený k akcii kabinetu. Tieto sú vykonávané buď dovtedy, kým nie sú dokončené, alebo dovtedy, kým sa rozhodneme ich zmeniť. \nTieto sú rôzne dostupné akcie: \n\n#T Administratívny $game_concept_actions$ #!\n[ShowCabinetTypeDatabase('adm')] \n\n#T Diplomatické akcie #!\n[ShowCabinetTypeDatabase('dip')] \n\n#T Vojenský $game_concept_actions$ #!\n[ShowCabinetTypeDatabase('mil')] " # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_cabinet_seat: "Miesto v kabinete" # todo: NEW TRANSLATION
 game_concept_cabinet_seats: "Miesta v kabinete" # todo: NEW TRANSLATION
 game_concept_cabinet_seats_desc: "To určuje počet [Concept('cabinet_members','členovia kabinetu')|e], ktorých môže [Concept('country','krajina')|e] súčasne zamestnať vo svojom [Concept('cabinet','kabinete')|e]. Niektoré [Concept('advances','pokrokoch')|e] môžu zvýšiť počet dostupných miesta v kabinete." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_cabinet_efficiency: "Efektivita kabinetu" # todo: NEW TRANSLATION
 game_concept_cabinet_efficiency_desc: "Je to rýchlosť a účinnosť, s akou [Concept('characters','postavou')|e] z [Concept('cabinet','kabinetu')|e] budú pracovať, keď sú pridelení vykonávať [Concept('cabinet_actions','akcie kabinetu')|e]. Ovplyvňuje ju [Concept('crown_power','moc koruny')|e] a [Concept('societal_values','sociálne hodnoty')|e] a môže byť upravená aj [Concept('advances','pokroky')|e], [Concept('government_reforms','vládne reformy')|e], [Concept('policies','politiky')|e] a [Concept('buildings','budovy')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_cabinet: "Kabinet" # todo: NEW TRANSLATION
 game_concept_cabinet_desc: "Kabinet je zhromaždenie vyšších úradníkov, ktorí pomáhajú spravovať [Concept('country','krajina')|e] prostredníctvom [Concept('cabinet_actions','akcií kabinetu')|e]. Počet [Concept('cabinet_seats','miesta v kabinete')|e] zvyšujú [Concept('advances','pokroky')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_cabinet_member: "Člen kabinetu" # todo: NEW TRANSLATION
 game_concept_cabinet_members: "Členovia kabinetu" # todo: NEW TRANSLATION
 game_concept_cabinet_member_desc: "Člen kabinetu je [Concept('character','postava')|e] zamestnaný v [Concept('cabinet','kabinete')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_artist: "Umelec" # todo: NEW TRANSLATION
 game_concept_artists: "Umelci" # todo: NEW TRANSLATION
 game_concept_artist_upper_desc: "Umelec je [Concept('character','postava')|e], ktorý vytvára [Concept('works_of_art','umelecké diela')|e]. Umelec môže byť niektorého z nižšie uvedených typov." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_artist_list_title: "Zoznam typov umelcov" # todo: NEW TRANSLATION
 game_concept_artist_desc: "$game_concept_artist_upper_desc$\n[ShowDatabase('artist')]" # todo: NEW TRANSLATION
 game_concept_religious_figure: "Náboženský predstaviteľ" # todo: NEW TRANSLATION
 game_concept_religious_figures: "Náboženskí predstavitelia" # todo: NEW TRANSLATION
 game_concept_religious_figure_upper_desc: "Náboženský predstaviteľ je [Concept('character','postava')|e], ktorý cestuje po svete a prináša náboženské bonusy do miest, kde sa usadí. Môžu ich najímať krajiny s príslušným [Concept('religion','náboženstvom')|e]. Hoci môžeme priamo nasledovať len jednu [Concept('religious_school','náboženskú školu')|e], môžeme pozvať náboženských predstaviteľov iných škôl, aby sme sa inšpirovali a získali časť ich výhod. Náboženský predstaviteľ môže byť ktoréhokoľvek z nižšie uvedených typov." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_religious_figure_list_title: "Zoznam typov náboženských predstaviteľov" # todo: NEW TRANSLATION
 game_concept_religious_figure_desc: "$game_concept_religious_figure_upper_desc$\n[ShowDatabase('religious_figures')]" # todo: NEW TRANSLATION
 game_concept_invited_religious_figure: "Pozvaný náboženský predstaviteľ" # todo: NEW TRANSLATION
 game_concept_invited_religious_figures: "Pozvaní náboženskí predstavitelia" # todo: NEW TRANSLATION
 game_concept_invite_religious_figure: "Pozvať náboženského predstaviteľa" # todo: NEW TRANSLATION
 game_concept_work_of_art: "Umelecké dielo" # todo: NEW TRANSLATION
 game_concept_works_of_art: "Umelecké diela" # todo: NEW TRANSLATION
 game_concept_work_of_art_desc: "Umelecké dielo je niečo, čo vytvoril [Concept('artist','umelec')|e]. Keď je dielo vytvorené, priamo zvýši [Concept('cultural_influence','kultúrny vplyv')|e] [Concept('primary_culture','hlavnej kultúry')|e] [Concept('country','krajiny')|E], v ktorej [artist] pracuje. Umenie sa nachádza v [Concept('location','lokalite')|e], ale môže byť zničené alebo zajaté, ak sa dané miesto stane [Concept('occupied','okupované')|e] ktorýmkoľvek [Concept('enemy','vojnovému nepriateľovi')|e].\nMať umelecké dielo v našom [country] prináša výhody pre náš [Concept('prestige','prestíž')|e] a [Concept('cultural_tradition','kultúrna tradícia')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_work_of_art_list_title: "Typy umeleckých diel" # todo: NEW TRANSLATION
 game_concept_art_quality: "Kvalita umenia" # todo: NEW TRANSLATION
 game_concept_art_quality_desc: "Kvalita [Concept('works_of_art','umelecké diela')|e] ovplyvňuje, koľko [Concept('prestige','prestíž')|e] a [Concept('cultural_tradition','kultúrna tradícia')|e] môžu poskytnúť.\n\nUmelecké dielo môže mať nasledovné úrovne kvality, od najnižšej po najvyššiu:\n$BULLET_WITH_TAB$ $art_quality_bad$\n$BULLET_WITH_TAB$ $art_quality_below_average$\n$BULLET_WITH_TAB$ $art_quality_average$\n$BULLET_WITH_TAB$ $art_quality_above_average$\n$BULLET_WITH_TAB$ $art_quality_good$\n$BULLET_WITH_TAB$ $art_quality_very_good$\n$BULLET_WITH_TAB$ $art_quality_great$\n$BULLET_WITH_TAB$ $art_quality_best$" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_legitimacy: "Legitimita" # todo: NEW TRANSLATION
 game_concept_legitimacy_i: "@legitimacy!" # todo: NEW TRANSLATION
 game_concept_legitimacy_desc: "Legitimita je mierou toho, do akej miery je vláda prijímaná obyvateľstvom a stavmi v ich [Concept('country','krajina')|e]. Je to v podstate predpoklad pre hladké riadenie krajiny - pri nízkych hodnotách zistíme, že s nami nikto nechce spolupracovať a môžu vypuknúť povstania, ktoré sa pokúsia dosadiť [Concept('ruler','panovník')|e], ktorého považujú za prijateľnejšieho." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_republican_tradition: "Republikánska tradícia" # todo: NEW TRANSLATION
 game_concept_republican_tradition_i: "@republican_tradition!" # todo: NEW TRANSLATION
 game_concept_republican_tradition_desc: "Republikánska tradícia meria, ako pevne je republikanizmus zakorenený v našej krajine. Republikánska tradícia vyjadruje, aké silné sú tradície v [ShowGovernmentTypeName('republic')]. [ShowGovernmentTypeNameWithNoTooltip('republic')] volí nového [Concept('ruler','panovníkovi')|e] každých niekoľko rokov a udržiavanie toho istého [ruler] cez niekoľko [Concept('elections','volieb')|e] znižuje našu republikánsku tradíciu. Pri nízkych hodnotách môže sklesnúť a prejsť do nejakej formy autokracie. Pre dobre fungujúcu republiku by mala byť táto mierka udržiavaná vysoko." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_devotion: "Oddanosť" # todo: NEW TRANSLATION
 game_concept_devotion_i: "@devotion!" # todo: NEW TRANSLATION
 game_concept_devotion_desc: "Oddanosť predstavuje horlivosť [Concept('faith','viera')|e] v našej krajine. Čím je vyššia, tým efektívnejšie bude fungovať náš [ShowGovernmentTypeName('theocracy')]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_horde_unity: "Jednota hordy" # todo: NEW TRANSLATION
 game_concept_horde_unity_i: "@horde_unity!" # todo: NEW TRANSLATION
 game_concept_horde_unity_desc: "Jednota hordy je mierou toho, koľko podpory má $rank_kingdom_horde_ruler_suffix_male$ od kmeňov. S časom klesá a zvyšuje sa lúpežami a pálením provincií. [ShowGovernmentTypeName('steppe_horde')] s nízkou jednotou pravdepodobne podľahne vnútorným nepokojom." # todo: NEW TRANSLATION
 game_concept_tribal_cohesion: "Kmeňová súdržnosť" # todo: NEW TRANSLATION
 game_concept_tribal_cohesion_i: "@tribal_cohesion!" # todo: NEW TRANSLATION
 game_concept_tribal_cohesion_desc: "Kmeňová súdržnosť je mierou, ako veľmi sú členovia nášho [ShowGovernmentTypeName('tribe')] zladení v otázkach [Concept('religion','náboženstve')|e] a [Concept('culture','kultúra')|e]. Pri nízkych hodnotách bude riadenie [ShowGovernmentTypeNameWithNoTooltip('tribe')] ako pasenie mačiek — každý bude chcieť robiť po svojom. Aby sa [ShowGovernmentTypeNameWithNoTooltip('tribe')] dala efektívne riadiť, treba ju udržiavať vysoko." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_government_power: "Vládna moc" # todo: NEW TRANSLATION
 game_concept_government_power_i: "@government_power!" # todo: NEW TRANSLATION
 game_concept_government_power_desc: "Je to všeobecný pojem pre mieru, ako dobre naša [Concept('government','vláda')|e] funguje. Existuje niekoľko typov: [Concept('legitimacy','legitimity')|e], [Concept('republican_tradition','republikánskej tradície')|e], [Concept('devotion','oddanosti')|e], [Concept('horde_unity','jednoty hordy')|e] a [Concept('tribal_cohesion','kmeňová súdržnosť')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_policy: "Politika" # todo: NEW TRANSLATION
 game_concept_policies: "Politiky" # todo: NEW TRANSLATION
 game_concept_policy_desc: "Každý [Concept('law','zákon')|e] má jeden alebo viacero Politík na výber. Tie určujú, ako sa zákon uplatňuje v [Concept('country','krajine')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_law: "Zákon" # todo: NEW TRANSLATION
 game_concept_laws: "Zákony" # todo: NEW TRANSLATION
 game_concept_law_desc: "Každý zákon musí mať zvolenú [Concept('policy','politiku')|e], inak nie je aktívny. Rôzne [Concept('government_types','typy vlád')|e] a [Concept('religions','náboženstvá')|e] získavajú rôzne zákony a viac zákonov je udelených prostredníctvom [Concept('advances','pokrokov')|e]. V závislosti od toho, ktorú [policy] v zákone vyberieme, často ovplyvníme naše [Concept('societal_values','sociálne hodnoty')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_antagonism: "Antagonizmus" # todo: NEW TRANSLATION
 game_concept_antagonism_i: "@antagonism!" # todo: NEW TRANSLATION
 game_concept_antagonism_desc: "Antagonizmus ukazuje, ako nás pravdepodobne vnímajú iné [Concept('countries','krajiny')|e], čo ovplyvňuje ich [Concept('opinion','názor')|e] o nás. Ak k nám cítia veľa antagonizmu, krajiny, ktoré nás považujú za relevantných pre svoje záujmy, budú menej naklonené zapájať sa do [Concept('diplomacy','diplomacie')|e] a môžu konať proti našim záujmom. Antagonizmus spôsobujú základné rozdiely v [Concept('societal_values','sociálnych hodnotách')|e], [Concept('government_types','typoch vlád')|e], [Concept('religion','náboženstve')|e], [Concept('culture','kultúre')|e] a [Concept('language','jazyku')|e] medzi krajinami. Niektoré akcie môžu tiež spustiť antagonizujúcu 'bombu' v [Concept('location','lokalite')|e], ktorá ovplyvní blízke krajiny v rôznej miere v závislosti od toho, ako veľmi sa im dané miesto a antagonizujúca krajina týkajú. Tieto účinky antagonizujúcej 'bomby' sa zvyčajne s časom rozptýlia." # todo: CHANGED # todo: CONCEPT CASE
 game_concept_antagonism_received_modifier: "Obdržaný antagonizmus" # todo: NEW TRANSLATION
 game_concept_antagonism_received_modifier_desc: "To udáva, do akej miery nepriateľské diplomatické akcie ako [Concept('war','vojna')|e] ovplyvnia náš [Concept('antagonism','antagonizmus')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_diplomatic_action: "Diplomatická akcia" # todo: NEW TRANSLATION
 game_concept_diplomatic_actions: "Diplomatické akcie" # todo: NEW TRANSLATION
 game_concept_diplomatic_action_desc: "Ide o akciu vykonanú jednou [Concept('country','krajinou')|e] voči inej s použitím [Concept('diplomats','diplomatmi')|e]. Patrí sem uzatváranie [Concept('alliances','aliancie')|e], vypovedanie [Concept('war','vojna')|e] či mnoho ďalších vecí." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_diplomatic_limitation: "Diplomatické obmedzenie" # todo: NEW TRANSLATION
 game_concept_diplomatic_limitations: "Diplomatické obmedzenia" # todo: NEW TRANSLATION
 game_concept_diplomatically_limited: "Diplomaticky obmedzené" # todo: NEW TRANSLATION
 game_concept_limited_diplomacy: "Obmedzená diplomacia" # todo: NEW TRANSLATION
 game_concept_unlimited_diplomacy: "Neobmedzená diplomacia" # todo: NEW TRANSLATION
 game_concept_diplomatic_limitation_desc: "Krajina, ktorá je buď veľmi závislým [Concept('subject','vazalmi')|e] alebo [Concept('junior_partner','mladší partner')|e] v [Concept('union','únii')|e], môže byť diplomaticky obmedzená. To znamená, že nasledujúce diplomatické akcie sú buď nemožné, alebo výrazne obmedzené:\n\n$BULLET$ [ShowRelationTypeName('alliance')]\n$BULLET$ [ShowRelationTypeName('food_access')]\n$BULLET$ [ShowRelationTypeName('guarantee')]\n$BULLET$ [ShowRelationTypeName('military_access')]\n$BULLET$ [ShowRelationTypeName('fleet_basing_rights')]\n$BULLET$ [ShowGenericActionName('create_building_subject')]\n$BULLET$ [ShowGenericActionName('create_province_subject')]\n\nVäčšina subjektov s obmedzenou diplomaciou nie je schopná vyhlásiť vlastné [Concept('wars','vojny')|e], pokiaľ nie sú cieľom veľmi špecifických spojencov." # todo: CHANGED # todo: CONCEPT CASE
 game_concept_diplomats: "Diplomati" # todo: NEW TRANSLATION
 game_concept_diplomat: "Diplomat" # todo: NEW TRANSLATION
 game_concept_diplomat_desc: "Reprezentuje, koľko [Concept('diplomacy','diplomacia')|e] môže [Concept('country','krajina')|e] vykonať za daný čas. Niektoré [Concept('advances','pokroky')|e] alebo [Concept('societal_values','sociálne hodnoty')|e] tento počet zvýšia." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_opinion: "Názor" # todo: NEW TRANSLATION
 game_concept_diplomatic_opinion: "Diplomatický názor" # todo: NEW TRANSLATION
 game_concept_diplomatic_opinions: "Diplomatické názory" # todo: NEW TRANSLATION
 game_concept_opinion_i: "@opinion!" # todo: NEW TRANSLATION
 game_concept_opinion_desc: "To ukazuje, do akej miery má [Concept('country','krajina')|e] rád alebo neznáša inú [country]. Rozdiel medzi [Concept('trust','dôverou')|e] a názorom spočíva v tom, že vysoký názor zabráni [country] v nepriateľstve, ale na spoluprácu by sme potrebovali [Concept('trust','dôvera')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_bias: "Postoj" # todo: NEW TRANSLATION
 game_concept_bias_desc: "Bias je určitý postoj, ktorý môže mať [Concept('country','krajina')|e] voči inej. Je rozdelený do troch kategórií: [Concept('opinion','názoru')|e], [Concept('trust','dôvery')|e] a [Concept('antagonism','antagonizmus')|e]. [Concept('country_interactions','Interakcie s krajinami')|e], [Concept('events','udalosti')|e] a historické nastavenie zvyčajne ovplyvňujú niektorý z týchto troch diplomatických aspektov." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_rival: "Rival"
 game_concept_rivals: "Rivali"
 game_concept_rivals_tooltip: "[Concept('rivals','Rivali')|e]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_rival_desc: "[Concept('countries','Krajiny')|e] môžu vyhlásiť svoju nepriateľskosť voči iným krajinám tým, že ich označia za rivalov. Krajiny majú voči svojim rivalom niektoré ďalšie nepriateľské akcie, napríklad schopnosť sfalšovať [Concept('casus_belli','casus Belli')|e] a možnosť zasiahnuť do ich [Concept('wars','vojny')|e].\n\nRival $game_concept_country$ neprijme priateľské [Concept('treaties','dohody')|e] ako [Concept('alliances','aliancie')|e], ale [countries] so spoločnými rivalmi budú mať jednoduchšie uzatvárať [treaties] medzi sebou.\n\nRivalita nie je vzájomná, čo znamená, že nie je nevyhnutné ani automatické, aby $game_concept_country$ oplácala rivalitu tým, ktorí ju označili za rivala. [country], ktorá vyhlásila inú za svojho rivala, je známa ako jej [Concept('rival_enemy','nepriateľa')|e].\n\nIba [countries] s podobným [great_power_score|e] a nie veľmi dobrým [Concept('opinion','názorom')|e] môžu byť vyhlásené za rivala, a maximálny počet $game_concept_rivals$, ktoré môže [country] mať, závisí od jej [Concept('country_rank','rangu krajiny')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_rival_enemy: "Nepriateľ" # todo: NEW TRANSLATION
 game_concept_rival_enemies: "Nepriatelia" # todo: NEW TRANSLATION
 game_concept_rival_enemy_desc: "Krajina, ktorá označila inú za [Concept('rival','rivala')|e], bude pre ňu známa ako jej Nepriateľ. [country] mohla vyhlásiť mnoho [rivals], a predsa nemať žiadnych Nepriateľov, ak ju žiadna iná [country] neoznačila za rivala." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_cobelligerent: "Spolubojovník" # todo: NEW TRANSLATION
 game_concept_cobelligerents: "Spolubojovníci" # todo: NEW TRANSLATION
 game_concept_cobelligerent_desc: "[Concept('country','Krajina')|e], ktorá je povolaná do [Concept('war','vojny')|e] ako $game_concept_cobelligerent$, bude môcť povolať svojich vlastných [Concept('allies','spojencov')|e] do [war].\n\nZískať [Concept('locations','lokality')|e] od spolubojovníka [country] v [Concept('peace_treaty','mierovej dohode')|e] bude mať rovnaké náklady ako u vodcu vojny." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_enemy: "Vojnový nepriateľ" # todo: NEW TRANSLATION
 game_concept_enemies: "Vojnoví nepriatelia" # todo: NEW TRANSLATION
 game_concept_enemies_tooltip: "[Concept('enemies','Vojnoví nepriatelia')|e]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_enemy_desc: "Dve [Concept('countries','krajiny')|e], ktoré sú medzi sebou vo [Concept('war','vojne')|e], budú vnímať jedna druhú ako nepriateľov a budú sa [Concept('battle','bitku')|e], keď sa ich [Concept('armies','armády')|e] alebo [Concept('navies','námorné sily')|e] stretnú.\n\n[Concept('rebels','Povstalci')|e] a [Concept('pirates','piráti')|e] sú nepriateľmi pre všetkých." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_royal_marriage: "Kráľovský sňatok" # todo: NEW TRANSLATION
 game_concept_royal_marriages: "Kráľovské sňatky" # todo: NEW TRANSLATION
 game_concept_married: "V sňatku" # todo: NEW TRANSLATION
 game_concept_marry: "Vzatia si" # todo: NEW TRANSLATION
 game_concept_marriage: "Manželstvo" # todo: NEW TRANSLATION
 game_concept_marrying: "Sobáš" # todo: NEW TRANSLATION
 game_concept_royal_marriage_desc: "Kráľovský sňatok je sobáš medzi dvoma [Concept('characters','postavami')|e] z dvoch rôznych [Concept('countries','krajín')|e] s cieľom ich viac zviazať a dodať [Concept('prestige','prestíž')|e] ich [Concept('rulers','panovníci')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_union: "Únia" # todo: NEW TRANSLATION
 game_concept_senior_partner: "Hlavný partner" # todo: NEW TRANSLATION
 game_concept_junior_partner: "Mladší partner" # todo: NEW TRANSLATION
 game_concept_junior_partners: "Mladší partneri" # todo: NEW TRANSLATION
 game_concept_union_partner: "Partner únie" # todo: NEW TRANSLATION
 game_concept_union_partners: "Partneri únie" # todo: NEW TRANSLATION
 game_concept_personal_union: "Personálna únia" # todo: NEW TRANSLATION
 game_concept_personal_unions: "Personálne únie" # todo: NEW TRANSLATION
 game_concept_union_desc: "Únia je typ [Concept('treaty','dohoda')|e], ktorý vznikne, keď dve alebo viac [Concept('countries','krajiny')|e] majú toho istého [Concept('ruler','panovníka')|e] v dôsledku [royal_marriages|e]. Funguje to ako obranné [Concept('alliance','aliancia')|e], pretože si automaticky pomáhajú pri útoku, ale k únii je možné pridať [Concept('laws','zákony')|e], ktoré zmenia spôsob jej fungovania. Najdôležitejší člen únie sa nazýva $game_concept_senior_partner$, zatiaľ čo zvyšné krajiny v únii sú $game_concept_junior_partners$." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_union_integration_level: "Úroveň integrácie únie" # todo: NEW TRANSLATION
 game_concept_union_integration_level_short: "Úroveň integrácie" # todo: NEW TRANSLATION
 game_concept_union_integration_level_member: "Úroveň integrácie člena" # todo: NEW TRANSLATION
 game_concept_union_integration_level_desc: "Úroveň integrácie únie popisuje, ako centralizovaná je [Concept('personal_union','personálna únia')|e] prostredníctvom [Concept('laws','zákonov')|e] a [Concept('policies','politiky')|e]. Každý [Concept('member','člen')|e], ktorý je prítomný pri implementácii centralizačnej politiky, zvýši svoju úroveň. Po poslednej centralizačnej politike sa všetky $game_concept_junior_partners$, ktoré majú rovnakú úroveň ako $game_concept_union$, zjednotia $game_concept_senior_partner$.\n\nČlenovia, ktorí sa k únii pripoja neskôr, si musia dohnať svoj postup, aby boli integrovaní cez [Concept('parliament','parlament')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_ally: "Spojenec" # todo: NEW TRANSLATION
 game_concept_allies: "Spojenci" # todo: NEW TRANSLATION
 game_concept_allied: "V aliancii" # todo: NEW TRANSLATION
 game_concept_alliance: "Aliancia" # todo: NEW TRANSLATION
 game_concept_alliances: "Aliancie" # todo: NEW TRANSLATION
 game_concept_alliance_desc: "Aliancia je [Concept('treaty','dohoda')|e] medzi dvoma [Concept('countries','krajinou')|e]. [countries], ktoré sú v aliancii, si nemôžu vyhlásiť [Concept('war','vojna')|e] navzájom a môžu byť tiež povolané, aby si pomohli v [wars]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_alliance_bloc: "Aliančný blok" # todo: NEW TRANSLATION
 game_concept_alliance_blocs: "Aliančné bloky" # todo: NEW TRANSLATION
 game_concept_alliance_bloc_desc: "Aliančný blok je koalícia [Concept('great_powers','veľmoci')|e] a [Concept('regional_powers','regionálne mocnosti')|e] zviazaná [Concept('alliances','aliancie')|e]. Čím viac silných spojencov má [Concept('country','krajina')|e], tým vyššia je jeho #Y alliance bloc saturation#!, čo zvyšuje [Concept('diplomatic_capacity','diplomatická kapacita')|e] náklady na každú udržiavanú [Concept('alliance','alianciu')|e].\n\n[Concept('great_power','Veľmoc')|e] spojenec prispieva 1.0 do saturácie; [Concept('regional_power','regionálna mocnosť')|e] spojenec prispieva 0.5. Tieto náklady rastú s každým pridaným silným [Concept('ally','spojencami')|e], čím sa odrádza jeden [Concept('country','krajina')|e] od nahromadenia nadmernej siete mocných spojencov." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_war_allies: "Vojnoví spojenci" # todo: NEW TRANSLATION
 game_concept_war_ally: "Vojnový spojenec" # todo: NEW TRANSLATION
 game_concept_war_ally_desc: "Sú to [Concept('countries','krajiny')|e], ktoré si navzájom pomáhajú na tej istej strane [Concept('war','vojne')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_war_leader: "Vodca vojny" # todo: NEW TRANSLATION
 game_concept_war_leaders: "Vodcovia vojny" # todo: NEW TRANSLATION
 game_concept_war_leader_desc: "Vodca vojny je jedna z dvoch [Concept('countries','krajiny')|e], ktoré vedú svoju príslušnú stranu v [Concept('war','vojne')|e]. Budú diskutovať o možných výsledkoch konfliktu rozhodovaním o [Concept('peace_treaties','mierové dohody')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_call_to_arms: "Volanie do zbrane" # todo: NEW TRANSLATION
 game_concept_call_to_arms_desc: "Výzva na zbrane je [Concept('diplomatic_action','diplomatická akcia')|e], ktorú je možné vykonať počas [Concept('war','vojny')|e] voči všetkým [Concept('ally','spojencovi')|e] a iným [Concept('countries','krajine')|e], ktoré prisľúbili účasť na vojenských konfliktoch.\n\nKrajiny, ktoré sú [Concept('war_defender','obranca')|e], automaticky zvolajú svojich spojencov do vojny, zatiaľ čo krajiny, ktoré sú [Concept('war_attacker','útočník')|e], ich musia volať manuálne a je pre nich ťažšie presvedčiť ich, aby sa pridali." # todo: CHANGED # todo: CONCEPT CASE
 game_concept_treaty: "Dohoda" # todo: NEW TRANSLATION
 game_concept_treaties: "Dohody" # todo: NEW TRANSLATION
 game_concept_treaty_desc: "Dohoda je podpísaný diplomatický stav medzi dvoma alebo viac [Concept('countries','krajiny')|e]. Môžu byť na obmedzený čas alebo do odvolania.\nDohody zahŕňajú [Concept('alliances','aliancie')|e], [Concept('military_access','vojenský prístup')|e], [Concept('truce','prímerie')|e] a mnoho ďalších, ktoré je možné vytvoriť prostredníctvom [Concept('diplomacy','diplomacie')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_blocked_treaties: "Blokované dohody" # todo: NEW TRANSLATION
 game_concept_blocked_treaties_desc: "Toto znemožňuje [Concept('country','krajina')|e] podpísať akýkoľvek druh [Concept('treaty','dohoda')|e] s krajinou, s ktorou je blokovaná." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_economic_support: "Ekonomická podpora" # todo: NEW TRANSLATION
 game_concept_economic_support_desc: "Je to [Concept('treaty','dohoda')|e], v ktorom jedna [Concept('country','krajina')|e] posiela [Concept('gold','dukáty')|e] každý mesiac, aby podporila [Concept('finances','financie')|e] druhej [country]. Často ide o situáciu, keď krajina nechce byť priamo zapojená do [Concept('war','vojny')|e], ale napriek tomu chce podporiť snahy." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_war_reparations: "Vojnové reparácie" # todo: NEW TRANSLATION
 game_concept_war_reparations_desc: "Je to mierová [Concept('treaty','dohoda')|e], v ktorej je jedna [Concept('country','krajina')|e] donútená posielať [GetDefine('NDiplomacy','WAR_REPARATIONS_FACTOR')|Y%0] svojho príjmu v [Concept('gold','dukátoch')|e] každý mesiac na podporu [Concept('finances','financie')|e] druhej [country], zvyčajne víťaza, ako odplatu za práve skončenú vojnu." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_guarantee: "Garancia" # todo: NEW TRANSLATION
 game_concept_guaranteed: "Garantované" # todo: NEW TRANSLATION
 game_concept_guaranteeing: "Garantovanie" # todo: NEW TRANSLATION
 game_concept_guarantee_desc: "Je to [Concept('treaty','dohoda')|e], v ktorej jedna [Concept('country','krajina')|e] garantuje druhú [country], s prisľubom, že ju ochráni, ak bude napadnutá vo [Concept('war','vojne')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_estate_satisfaction_equilibrium: "Rovnováha spokojnosti" # todo: NEW TRANSLATION
 game_concept_estate_satisfaction_equilibrium_desc: "To je hodnota, ku ktorej sa bude približovať [Concept('estate_satisfaction','spokojnosť stavu')|e] [Concept('estate','stavu')|e]. Rýchlosť, akou sa mení, závisí od mnohých faktorov." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_estate_satisfaction: "Spokojnosť stavu" # todo: NEW TRANSLATION
 game_concept_estate_satisfaction_short: "Spokojnosť" # todo: NEW TRANSLATION
 game_concept_estate_satisfaction_desc: "Ukazuje, ako spokojný je [Concept('estate','stav')|e] s tým, ako je momentálne spravovaná [Concept('country','krajina')|e]. Ak je vysoká, krajina získa niektoré bonusy, ale ak je nízka, prinesie to postihy, a ak je dostatočne nízka, nebudeme môcť z tohto [estate] verbovať [Concept('army_levies','armádny branci')|e] a [Concept('navy_levies','povolané loďstvo')|e].\n\nMá to tiež priamy vplyv na [Concept('pop_satisfaction','spokojnosť populácie')|e] [Concept('pops','populácie')|e], ktoré patria tomuto [estate]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_estate_power: "Sila stavu" # todo: NEW TRANSLATION
 game_concept_estate_power_desc: "Je to moc, ktorú má [Concept('estate','stav')|e] v [Concept('country','krajine')|e]. Závisí najmä na veľkosti [Concept('population','populácia')|e] [Concept('pop_types','sociálnych tried')|e], ktoré patria k [estate], a na tom, aké [Concept('estate_privileges','privilégiá stavov')|e] im boli udelené.\n\nNiektoré [Concept('pop_types','sociálne triedy')|e], ako [ShowPopTypeName('nobles')], získavajú omnoho viac sily stavu za [Concept('pop','populáciu')|e] než [ShowPopTypeName('slaves')].\n\n$BULLET_WITH_TAB$Celková sila [estates] znižuje [Concept('crown_power','moc koruny')|e] [country].\n$BULLET_WITH_TAB$[Concept('tax_base','Daňový základ')|e] [Concept('location','Lokalita')|e] sa rozdeľuje v závislosti od veľkosti, sily stavu a [pop_type] každého popu tam." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_crown_power: "Moc koruny" # todo: NEW TRANSLATION
 game_concept_crown_power_desc: "Je to moc, ktorú má koruna v [Concept('country','krajine')|e]. Čím je väčšia, tým mocnejšia a efektívnejšia sa [country] stáva. Ak bolo [Concept('estates','stavy')|e] udelených príliš veľa [Concept('estate_privileges','privilégiá stavov')|e], môže byť tak nízka, že krajina dostane postihy.\n\nExistujú [Concept('advances','pokroky')|e] v priebehu [Concept('ages','vekov')|e], ktoré zvyšujú [Concept('crown_power','moc koruny')|e], obzvlášť pri postupe do [ShowAgeName('age_5_absolutism')]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_estate_tax_base: "Daňový základ stavu" # todo: NEW TRANSLATION
 game_concept_estate_tax_base_desc: "Každý [Concept('estate','stav')|e] získava [Concept('gold','dukáty')|e] z časti [Concept('tax_base','daňového základu')|e] v každom [Concept('location','lokalite')|e], ktorá závisí od jeho [Concept('estate_power','sily stavu')|e] tam v porovnaní s ostatnými [estates]. Toto sa potom zníži o [Concept('estate_enrichment','obohatenie štátov')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_civil_war: "Občianska vojna" # todo: NEW TRANSLATION
 game_concept_civil_wars: "Občianske vojny" # todo: NEW TRANSLATION
 game_concept_civil_war_desc: "Občianska vojna je špeciálny typ [Concept('war','vojna')|e], v ktorom je [Concept('country','krajina')|e] vo [war] nie s inou [country], ale s časťou seba samého. Líši sa aj od bežných [wars] tým, že nedochádza k [Concept('occupation','okupácii')|e] [Concept('locations','lokalitám')|e], ale tie okamžite zmenia [Concept('controller','kontrolujúci')|e], keď sú [Concept('sieged','obliehaný')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_war_goal: "Vojnový cieľ" # todo: NEW TRANSLATION
 game_concept_war_goals: "Vojnové ciele" # todo: NEW TRANSLATION
 game_concept_war_goal_desc: "Vojnový cieľ je cieľ stanovený pre konkrétnu [Concept('war','vojnu')|e] a závisí od typu použitého [casus_belli|e]. Dosiahnutie vojnového cieľa poskytne značné množstvo [Concept('war_score','vojnové skóre')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_war_score: "Vojnové skóre" # todo: NEW TRANSLATION
 game_concept_war_score_desc: "Vojnové skóre je hodnota, ktorá ukazuje, ako dobre sa [Concept('country','krajinu')|e] darí v konkrétnej [Concept('war','vojne')|e]. [country] môže zvýšiť svoje vojnové skóre víťazstvom v [Concept('battles','bitkách')|e], úspešným [Concept('siege','obliehaní')|e] [Concept('enemy','vojnovom nepriateľovi')|e] [Concept('locations','lokalitách')|e], dosiahnutím [Concept('war_goal','vojnovom cieli')|e] a zavedením [Concept('blockades','blokádami')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_war_participation: "Účasť vo vojne" # todo: NEW TRANSLATION
 game_concept_war_participation_desc: "Udáva, do akej miery sa [Concept('country','krajinu')|e] podieľala na priebehu [Concept('war','vojny')|e]. Dosahuje sa to predovšetkým cez [Concept('battles','bitky')|e], [Concept('blockades','blokády')|e] a [Concept('sieges','obliehanie')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_peace_cost: "Hodnota mierovej ponuky" # todo: CHANGED
 game_concept_peace_cost_desc: "Udáva, koľko bude stáť pridanie [Concept('peace_treaty','mierová dohoda')|e] k [Concept('peace_offer','ponuke mieru')|e]. Zvyčajne sa porovnáva s [war_score|e], aby sa zistilo, či ho druhá [Concept('country','krajina')|e] prijme." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_unconditional_surrender: "Bezpodmienečná kapitulácia" # todo: NEW TRANSLATION
 game_concept_unconditionally_surrender: "Bezpodmienečne kapitulovať" # todo: NEW TRANSLATION
 game_concept_unconditionally_surrendered: "Bezpodmienečne kapituloval" # todo: NEW TRANSLATION
 game_concept_unconditionally_surrenders: "Bezpodmienečná kapitulácia" # todo: NEW TRANSLATION
 game_concept_unconditional_surrender_desc: "Po ponúknutí bezpodmienečnej kapitulácie prejdú všetky aktuálne neobsadené [Concept('locations','lokality')|e] pod kontrolu nepriateľa a nepriateľ získa 100% [Concept('war_score','vojnové skóre')|e]. [Concept('armies','Armády')|e] [Concept('country','Krajina')|e], ktorá kapitulovala, sa stanú [Concept('exiled','vyhnaný')|e] a nebudú môcť bojovať v budúcich [Concept('battles','bitiek')|e] až do podpísania [Concept('peace','mieru')|e]. Príjemca bezpodmienečnej kapitulácie bude informovaný o kapitulácii nepriateľa a od tohto momentu bude môcť vynucovať akýkoľvek možný mier až do ceny 100% warscore. Ak príjemca mier neodkývne niekoľko mesiacov, dostane výzvu na mier, ktorá mu bude dávať mesačné [Concept('war_exhaustion','vojnovú vyčerpanosť')|e], ktoré rastie rýchlejšie ako obvykle. Mier bude automaticky prijatý krajinou, ktorá kapitulovala. Keď prirodzene dosiahne 100% warscore, AI sa zvyčajne bezpodmienečne vzdá. Existujú aj iné prípady, keď sa AI bezpodmienečne vzdáva." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_war: "Vojna" # todo: NEW TRANSLATION
 game_concept_wars: "Vojny" # todo: NEW TRANSLATION
 game_concept_offensive_war: "Ofenzívna vojna" # todo: NEW TRANSLATION
 game_concept_defensive_war: "Defenzívna vojna" # todo: NEW TRANSLATION
 game_concept_offensive_wars: "Ofenzívne vojny" # todo: NEW TRANSLATION
 game_concept_defensive_wars: "Defenzívne vojny" # todo: NEW TRANSLATION
 game_concept_war_desc: "Vojna vznikne, keď jedna [Concept('country','krajina')|e] použije [Concept('diplomat','diplomat')|e] voči inej krajine, aby začala konflikt. Krajiny, ktoré sú [Concept('allied','V aliancii')|e] s ktoroukoľvek stranou, môžu byť povolané do vojny.\n\nPočas vojny sa [Concept('armies','armády')|e] a [Concept('navies','námorné sily')|e] z oboch strán, ktoré sa stretnú, budú [Concept('battle','bitka')|e]. [armies] budú môcť [Concept('siege','obliehanie')|e] [Concept('enemies','vojnových nepriateľov')|e] [Concept('locations','lokalít')|e], zatiaľ čo [Concept('navies','námorné sily')|e] môžu [Concept('blockade','blokáda')|e] ich [Concept('ports','prístavy')|e].\n\nVojna pokračuje, až kým nie je podpísaný [Concept('peace_treaty','mierová dohoda')|e] a medzi zúčastnenými [countries] opäť zavládne [Concept('peace','mier')|e]. " # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_war_attacker: "Útočník" # todo: NEW TRANSLATION
 game_concept_war_attackers: "Útočníci" # todo: NEW TRANSLATION
 game_concept_war_attacker_desc: "V [war_with_icon|e] je Útočníkom strana, ktorej vodca inicioval konflikt a zvolil [casus_belli_with_icon|e].\n\nAby získala [war_score_with_icon|e], musí strana útočníka splniť [war_goal_with_icon|e]." # todo: NEW TRANSLATION
 game_concept_war_defender: "Obranca" # todo: NEW TRANSLATION
 game_concept_war_defenders: "Obrancovia" # todo: NEW TRANSLATION
 game_concept_war_defender_desc: "V [war_with_icon|e] je Obrancom strana, ktorej vodcovi bola vyhlásená vojna. Strana obrancov automaticky povolá svojich [allies_with_icon|e] do [war].\n\nAby získala [war_score_with_icon|e], musí strana obrancov zabrániť [Concept('war_attacker','útočník')|e] v splnení [war_goal_with_icon|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_peace: "Mier" # todo: NEW TRANSLATION
 game_concept_peace_desc: "Mier je stav, v ktorom [Concept('country','krajine')|e] nie je zapojená do žiadnej prebiehajúcej [Concept('war','vojny')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_white_peace: "Status quo ante bellum"
 game_concept_white_peace_desc: "Je to [Concept('peace_treaty','mierová dohoda')|e], ktoré vracia stav pred vojnou. #italic status quo ante bellum z latinčiny stav ako pred konfliktom#!" # todo: CONCEPT CASE
 game_concept_peace_treaty: "Mierová dohoda" # todo: NEW TRANSLATION
 game_concept_peace_treaties: "Mierové dohody" # todo: NEW TRANSLATION
 game_concept_peace_treaty_desc: "Toto budú podmienky [Concept('peace_offer','ponuka mieru')|e], ktoré môžu zahŕňať prenos [Concept('location','lokalitu')|e] medzi dvoma [Concept('countries','krajinou')|e], alebo tribut v [Concept('gold','dukátoch')|e] medzi nimi, alebo aj niektoré špeciálne dohody ako [ShowPeaceTreatyTypeName('abandon_colonial_claim')], [ShowPeaceTreatyTypeName('execute_ruler')], či [ShowPeaceTreatyTypeName('peace_humiliate')]." # todo: CHANGED # todo: CONCEPT CASE
 game_concept_peace_offer: "Ponuka mieru" # todo: NEW TRANSLATION
 game_concept_peace_offer_desc: "Je to diplomatická akcia, ktorá ukončuje prebiehajúcu [Concept('war','vojnu')|e] medzi dvoma alebo viacerými [Concept('countries','krajinou')|e]. V nej jedna strana môže stanoviť svoje podmienky druhej strane ako [Concept('peace_treaties','mierové dohody')|e]. Keď ich druhá strana akceptuje, pokoj bude podpísaný a [war] skončí.\n\nKoľko môže [country] získať z mierovej dohody, závisí od jeho [war_score]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_casus_belli: "Casus Belli" # todo: NEW TRANSLATION
 game_concept_casus_bellis: "Casus Belli" # todo: NEW TRANSLATION
 game_concept_casus_belli_desc: "Doslovne znamená #italic Príčina vojny#!; je to odôvodnenie, ktoré [Concept('country','krajina')|e] používa na začatie [Concept('war','vojna')|e]. V závislosti od použitého Casus Belli bude odlišný typ [war] a [Concept('war_goal','vojnový cieľ')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_stockpile: "Zásoby" # todo: NEW TRANSLATION
 game_concept_stockpile_desc: "Sú to množstvá [Concept('good','tovar')|e], ktoré sú momentálne uložené v skladoch na [Concept('market','trh')|e]. Zvýši sa, ak je [Concept('supply','ponuka')|e] vyšší než [Concept('demand','dopyt')|e], a zníži sa v opačnom prípade. [Concept('buildings','Budovy')|e], [Concept('constructions','výstavbách')|e], [Concept('units','jednotkách')|e] a [Concept('pops','populácie')|e] na trhu budú používať zásoby pre svoje potreby." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_effective_supply: "Efektívna zásoba" # todo: NEW TRANSLATION
 game_concept_effective_supply_desc: "Je to založené na [Concept('supply','ponuku')|e] [Concept('good','tovar')|e] v [Concept('market','trhu')|e], ale vplyv [Concept('imports','dovozy')|e] je znížený." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_effective_demand: "Efektívny dopyt" # todo: NEW TRANSLATION
 game_concept_effective_demand_desc: "Je to založené na [Concept('demand','dopyt')|e] [Concept('good','tovar')|e] v [Concept('market','trhu')|e], ale vplyv [Concept('exports','vývozy')|e] je znížený." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_supply: "Ponuka" # todo: NEW TRANSLATION
 game_concept_supply_desc: "Toto je množstvo [Concept('good','tovar')|e], ktoré sa vyrába z [Concept('buildings','budov')|e], získava ako [Concept('raw_materials','suroviny')|e] alebo [Concept('imported','dovezené')|e] do [Concept('market','trhu')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_demand: "Dopyt" # todo: NEW TRANSLATION
 game_concept_demands: "Dopyty" # todo: NEW TRANSLATION
 game_concept_demand_desc: "Toto je množstvo [Concept('good','tovar')|e], ktoré [Concept('buildings','budovy')|e] potrebujú ako vstup, čo [Concept('pops','populácie')|e] potrebujú na život, koľko rôzne [Concept('constructions','výstavby')|e] vyžadujú, a koľko [Concept('exports','vývozy')|e] si vyžaduje [Concept('market','trh')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_market_balance: "Trhová bilancia" # todo: NEW TRANSLATION
 game_concept_market_balance_short: "Bilancia" # todo: NEW TRANSLATION
 game_concept_market_balance_desc: "Hodnota $game_concept_market_balance$ [Concept('good','tovar')|e] je rozdiel medzi [supply_with_icon|e] a [demand_with_icon|e] toho [good] v rámci [market_with_icon|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_market_value: "Trhová hodnota" # todo: NEW TRANSLATION
 game_concept_market_value_desc: "Toto je agregovaná hodnota všetkých mesačných transakcií v [Concept('market','trhu')|e]. Slúži ako odhad jeho celkového bohatstva." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_price_impact: "Vplyv ceny" # todo: NEW TRANSLATION
 game_concept_price_impact_desc: "Cena [Concept('market_price','trhová cena')|e] [Concept('goods','tovarov')|e], ktoré sú [Concept('pop_needs','potreby populácie')|e] pre [Concept('pop','populáciu')|e], má priamy vplyv na jeho [Concept('pop_satisfaction','spokojnosť populácie')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_price_stability: "Stabilita cien" # todo: NEW TRANSLATION
 game_concept_price_stability_desc: "Stabilita cien je určená aktuálnym [Concept('age','vekom')|e] a rozhoduje, do akej miery je [Concept('target_price','cieľová cena')|e] ovplyvnená [Concept('supply','ponuka')|e] a [Concept('demand','dopyt')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_market_price: "Trhová cena" # todo: NEW TRANSLATION
 game_concept_market_prices: "Trhové ceny" # todo: NEW TRANSLATION
 game_concept_market_price_desc: "Cena, za ktorú sa určitý [Concept('good','tovar')|e] obchoduje v [Concept('market_center','trhovom centre')|e].\nTrhová cena sa postupne prispôsobuje [Concept('target_price','cieľová cena')|e].\n[Concept('sell_price','Predajná cena')|E] v iných lokalitách sa môže líšiť od trhovej ceny v závislosti od [Concept('market_access','prístupu na trh')|e]." # todo: RETRANSLATED ENGLISH # todo: CONCEPT CASE
 game_concept_target_price: "Cieľová cena" # todo: NEW TRANSLATION
 game_concept_target_price_desc: "Cieľová cena je určená [Concept('supply','ponuka')|e], [Concept('demand','dopyt')|e] a [Concept('price_stability','stabilita cien')|e].\nAko pomer k základnej cene sa bude pohybovať medzi [price_stability] pri prevažujúcej ponuke a 1 / [price_stability] pri prevažujúcom dopyte." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_export_market: "Vývozný trh" # todo: NEW TRANSLATION
 game_concept_export_market_desc: "Toto je [Concept('market','trh')|e], kde sa [Concept('goods','tovary')|e] obchodujú kúpou, čím vzniká [Concept('export','vývoz')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_import_market: "Dovozný trh" # todo: NEW TRANSLATION
 game_concept_import_market_desc: "Toto je [Concept('market','trh')|e], kde sa [Concept('goods','tovary')|e] obchodujú predajom, čím vzniká [Concept('import','dovoz')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_market: "Trh" # todo: NEW TRANSLATION
 game_concept_markets: "Trhy" # todo: NEW TRANSLATION
 game_concept_market_desc: "Trh je miesto, kde sa [Concept('goods','tovary')|e] kupujú a predávajú.\nNachádza sa v [Concept('market_center','trhovom centre')|e], ale zahŕňa aj iné lokácie na základe ich [Concept('market_access','prístup na trh')|e] a [Concept('protectionism','trhová ochrana')|e].\nVšetky tieto lokácie budú výlučne nakupovať od a predávať do tohto trhu [Concept('stockpile','zásob')|e].\n\n[markets] sú farebne označené podľa toho, aké sú pre vás relevantné:\n\nPodľa vášho vzťahu s nimi môžu byť [markets] [domestic_markets], [trading_markets], [foreign_markets] alebo [distant_markets]." # todo: CHANGED # todo: CONCEPT CASE
 game_concept_domestic_market: "Domáci trh" # todo: NEW TRANSLATION
 game_concept_domestic_markets: "Domáce trhy" # todo: NEW TRANSLATION
 game_concept_domestic_market_desc: "A $game_concept_domestic_market$ je [market_with_icon|e], v ktorom vlastníte [locations_with_icon|e]. Vaše [locations] sú závislé na svojom [market], aby nakúpili všetko, čo potrebujú, či už na vládne [construction_with_icon|e], [buildings_with_icon|e], [pop_needs_with_icon|e] alebo [food_with_icon|e].\n\nZabezpečenie dodávok [goods] vo vašich domácich trhov je kľúčové pre fungovanie vášho [country], pretože nemusíte byť schopní postaviť [buildings] alebo verbovať [Concept('regiments','pluky')|e], ak chýbajú potrebné [goods]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_trading_market: "Obchodný trh" # todo: NEW TRANSLATION
 game_concept_trading_markets: "Obchodné trhy" # todo: NEW TRANSLATION
 game_concept_trading_market_desc: "A $game_concept_trading_market$ je [market_with_icon|e], v ktorom nevlastníte [Concept('own','vlastniť')|e] žiadne územie, ale máte [merchant_capacity_with_icon|e] z vašich [foreign_buildings_with_icon|e].\n\nTo znamená, že sa nemusíte nevyhnutne starať o potreby [good_with_icon|e] tohto [market], jeho zásoby [Concept('food','potraviny')|e] alebo jeho [Concept('population','populácie')|e], ale môžete tam využiť svoju [merchant_capacity] na získanie zisku alebo na zásobovanie vašich [domestic_markets_with_icon|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_foreign_market: "Zahraničný trh" # todo: NEW TRANSLATION
 game_concept_foreign_markets: "Zahraničné trhy" # todo: NEW TRANSLATION
 game_concept_foreign_market_desc: "A $game_concept_foreign_market$ je [market_with_icon|e], v ktorom nevlastníte [Concept('own','vlastniť')|e] žiadne územie ani nemáte [merchant_capacity_with_icon|e]. To znamená, že z nich nemôžete viesť [trade_with_icon|e], ale stále s nimi môžete obchodovať pomocou svojej [merchant_capacity] v iných [markets] v rámci [trade_range_with_icon|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_distant_market: "Vzdialený trh" # todo: NEW TRANSLATION
 game_concept_distant_markets: "Vzdialené trhy" # todo: NEW TRANSLATION
 game_concept_distant_market_desc: "A $game_concept_distant_market$ je [market_with_icon|e], ktorý leží mimo [trade_range_with_icon|e] všetkých vašich [domestic_markets_with_icon|e], takže s nimi nemôžete viesť žiadny [trade_with_icon|e]." # todo: NEW TRANSLATION
 SUBTAB_TRADING_TT_TEXT: "Na tejto karte môžete spravovať svoje [Concept('trades','obchody')|e], ak máte [Concept('merchant_capacity','obchodná kapacita')|e] v akomkoľvek [Concept('market','trhu')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_protectionism: "Trhová ochrana" # todo: NEW TRANSLATION
 game_concept_trade_protection: "Trhová ochrana" # todo: NEW TRANSLATION
 game_concept_protectionism_desc: "$MODIFIER_TYPE_DESC_local_trade_protection_factor$\n\nTrhová ochrana sa zvyšuje hlavne s [Concept('control','kontrolou')|e] [location]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_market_center: "Trhové centrum" # todo: NEW TRANSLATION
 game_concept_market_centers: "Trhové centrá" # todo: NEW TRANSLATION
 game_concept_market_center_desc: "Lokalita [Concept('location','lokalita')|e], na ktorej je [Concept('market','trh')|e] sústredený. [Concept('owner','Majiteľ')|e] tejto lokality z toho má určité výhody, ale najdôležitejšie je, že môže kontrolovať, kto má prístup k tomuto trhu." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_market_owner: "Majiteľ trhu" # todo: NEW TRANSLATION
 game_concept_market_owner_desc: "Majiteľ trhu [Concept('market','trhu')|e] je [Concept('country','krajina')|e], ktorý [Concept('owns','vlastní')|e] jeho [Concept('market_center','trhového centra')|e]. Majiteľ trhu môže trh zničiť alebo presunúť a zabrániť iným [countries] v obchodovaní na ňom." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_market_access: "Prístup na trh" # todo: NEW TRANSLATION
 game_concept_market_access_desc: "Prístup na trh predstavuje, ako ľahko môže [Concept('location','lokalita')|e] interagovať so svojím [Concept('market','trhom')|e], a závisí od vzdialenosti k [Concept('market_center','trhovému centru')|e].\n\nPrístup na trh je dôležitý v troch kľúčových ohľadoch:\n\n$BULLET$ Lokality budú mať vyššie [market_attraction_with_icon|e] k [markets] s vyšším prístupom. To znamená, že [locations] budú mať tendenciu patriť k najbližšiemu [market].\n\n$BULLET$ [locations] v [market] nakupujú [goods_with_icon|e] a [food_with_icon|e] podľa poradia ich prístupu na trh.\n\n$BULLET$ Nízky prístup na trh škodí miestnemu priemyslu znížením [Concept('output','produkciou')|e] [buildings_with_icon|e] a ziskov [rgo_with_icon|e]\n\nPrístup na trh sa lepšie šíri cez moria a [Concept('rivers','rieky')|e] a môže sa zlepšiť výstavbou [Concept('roads','cestami')|e] a $naval_category$, alebo vytvorením nového [market]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_market_attraction: "Atraktivita trhu" # todo: NEW TRANSLATION
 game_concept_market_attraction_desc: "Toto ovplyvňuje, akú príťažlivosť má [Concept('market_center','trhové centrum')|e] nad [Concept('location','lokalitou')|e], aby sa stala súčasťou jeho [Concept('market','trhu')|e].\n\nProti tomu pôsobí [Concept('protectionism','trhová ochrana')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_sell_price: "Predajná cena" # todo: NEW TRANSLATION
 game_concept_sell_price_desc: "Cena, za ktorú sa [Concept('goods','tovary')|e] predávajú v [Concept('location','lokalite')|e].\nPredajná cena môže byť nižšia ako [Concept('market_price','trhová cena')|e], ak je nízky [Concept('market_access','prístup na trh')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_counterespionage: "Kontrašpionáž" # todo: NEW TRANSLATION
 game_concept_counterespionage_desc: "Kontrašpionáž opisuje, ako dobre je [Concept('country','krajina')|e] schopná aktívne zabrániť budovaniu [Concept('foreign','zahraničnému')|e] [Concept('spy_networks','špionážnych sietí')|e] vo svojej krajine." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_spy_network: "Špionážna sieť" # todo: NEW TRANSLATION
 game_concept_spy_network_i: "@spy_network!" # todo: NEW TRANSLATION
 game_concept_spy_networks: "Špionážne siete" # todo: NEW TRANSLATION
 game_concept_spy_network_desc: "Toto popisuje, do akej miery [Concept('country','krajina')|e] infiltrovala inú krajinu sieťou informátorov, dvojitých agentov a všeobecných zradcov, a teda, koľko vnútorných informácií o tej krajine má. Dá sa to využiť pri rôznych zákerných diplomatických akciách." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_spy_network_fog: "Hmla spravodajstva" # todo: NEW TRANSLATION
 game_concept_spy_network_fog_desc: "Niektoré informácie o cudzích [Concept('countries','krajín')|e] a ich [Concept('locations','lokality')|e] sú skryté, pokiaľ v danej krajine nemáte dostatočnú [Concept('spy_network','špionážnu sieť')|e]. Vybudovanie silnejšej špiónskej siete odhaľuje podrobnejšie údaje, vrátane zloženia [Concept('population','populácia')|e], ekonomického výkonu, vojenskej sily a ďalších." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_favor: "Láskavosť" # todo: NEW TRANSLATION
 game_concept_favors_i: "@favors!" # todo: NEW TRANSLATION
 game_concept_favors: "Láskavosti" # todo: NEW TRANSLATION
 game_concept_favors_desc: "Láskavosti predstavujú, koľko si jedno [Concept('country','krajina')|e] sľúbilo, alebo inak dlhuje druhému [Concept('country','krajine')|e].\nLáskavosti možno minúť na to, aby ste požiadali druhé [country] o vykonanie niečoho. Ak sú láskavosti príliš nevyvážené, odmietnutie týchto požiadaviek môže spôsobiť stratu [Concept('trust','dôveru')|e] alebo dokonca [Concept('diplomatic_reputation','diplomatická reputácia')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_trust: "Dôvera" # todo: NEW TRANSLATION
 game_concept_trust_i: "@trust!" # todo: NEW TRANSLATION
 game_concept_trusted: "Dôveryhodný" # todo: NEW TRANSLATION
 game_concept_trust_desc: "Dôvera predstavuje, ako veľmi jeden [Concept('country','krajina')|e] považuje druhého [Concept('country','krajiny')|e] za schopného konať čestne voči nemu.\nČi už priateľ alebo nepriateľ, dôvera je kľúčovým prvkom pri uzatváraní trvalých dohôd." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_trust_equilibrium: "Rovnováha dôvery" # todo: NEW TRANSLATION
 game_concept_trust_equilibrium_desc: "Rovnováha dôvery predstavuje hodnotu, ku ktorej sa [Concept('trust','dôveru')|e] s inou [country] bude postupne približovať. Dôvera je kľúčovou zložkou pri uzatváraní dlhodobých dohôd." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_supportrebels: "Podpora vzbúrencov" # todo: NEW TRANSLATION
 game_concept_support_rebels: "Podpora vzbúrencov" # todo: NEW TRANSLATION
 game_concept_supportrebels_desc: "Ide o situáciu, keď [Concept('country','krajina')|e] rozhodne poskytnúť pomoc skupine [Concept('rebels','povstalcom')|e] v inej [Concept('country','krajine')|e], v nádeji, že ak [rebels] zvíťazia, nová vláda bude k nim priaznivo naklonená." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_great_power: "Veľmoc" # todo: NEW TRANSLATION
 game_concept_great_powers: "Veľmoci" # todo: NEW TRANSLATION
 game_concept_great_power_desc: "[great_power] je [Concept('country','krajina')|e], ktorá nazbierala dostatok [Concept('great_power_points','body veľmoci $game_concept_great_power_points_short$')|e] dominovaním oblastí s vysokou ekonomickou hodnotou, aby mohla projektovať svoj vplyv po celom svete.\n\n[country] dominuje [Concept('area','oblasť')|e], keď kontroluje aspoň dve tretiny vlastných vlastniteľných [Concept('locations','lokality')|e] oblasti, pričom [Concept('subjects','vazali')|e] sa počítajú so zníženou váhou. Každá oblasť má hodnotu 1–10 [Concept('great_power_points','body veľmoci $game_concept_great_power_points_short$')|e] v závislosti od jej potenciálnej daňovej základne vzhľadom na svetovú mediánovú hodnotu.\n\nKeď [country] prekročí prah [Concept('great_power_points','body veľmoci $game_concept_great_power_points_short$')|e], získa dodatočné [Concept('diplomatic_capacity','diplomatická kapacita')|e], [Concept('diplomats','diplomati')|e], [Concept('power_projection','projekcia sily')|e], [Concept('prestige','prestíž')|e] a [ShowModifierTypeName('mercenary_range')], ako aj schopnosť #T Vynucovať mier, Zasahovať do vojen a Vyhrážat sa vojnou#! kdekoľvek na svete." # todo: CHANGED # todo: CONCEPT CASE
 game_concept_regional_power: "Regionálna mocnosť" # todo: NEW TRANSLATION
 game_concept_regional_powers: "Regionálne mocnosti" # todo: NEW TRANSLATION
 game_concept_regional_power_desc: "A [regional_power] je [Concept('country','krajina')|e], ktorý nahromadil dostatok [Concept('great_power_points','body veľmoci $game_concept_great_power_points_short$')|e], aby dominoval svojmu regiónu, no ešte nedosiahol status [Concept('great_power','veľmoc')|e].\n\n[regional_power] získava polovicu bonusov [great_power] — dodatočnú [Concept('diplomatic_capacity','diplomatickú kapacitu')|e], [Concept('diplomats','diplomatov')|e], [Concept('power_projection','projekciu sily')|e], [Concept('prestige','prestíž')|e] a [ShowModifierTypeName('mercenary_range')] — ale jeho #T Enforce Peace, Intervene in Wars, and Threaten War#! akcie kdekoľvek vo svete sú obmedzené len na [Concept('countries','krajinu')|e], ktorých hlavné mesto leží v susednom [Concept('region','regióne')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_normal_power: "Bežná mocnosť" # todo: NEW TRANSLATION
 game_concept_normal_power_desc: "[normal_power] je [Concept('country','krajina')|e], ktoré nie je [Concept('great_power','veľmoc')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_hegemony: "Hegemónia" # todo: NEW TRANSLATION
 game_concept_hegemon: "Hegemón" # todo: NEW TRANSLATION
 game_concept_hegemons: "Hegemóni" # todo: NEW TRANSLATION
 game_concept_hegemonies: "Hegemónie" # todo: NEW TRANSLATION
 game_concept_hegemony_desc: "Hegemónia sa ustanovuje v rôznych oblastiach, kde [Concept('great_power','veľmoc')|e] s najvyššou úrovňou v každej oblasti bude vyhlásený za Hegemona a získa určité výhody.\n[ShowDatabase('hegemony')]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_tier: "Úroveň" # todo: NEW TRANSLATION
 game_concept_tiers: "Úrovne" # todo: NEW TRANSLATION
 game_concept_tier_desc: "Toto je názov úrovne, ktorú má [Concept('formable_country','sformovateľná krajina')|e]. Každá [Concept('country','krajiny')|e] patrí do úrovne od I do IV, v závislosti od náročnosti požiadaviek na formovanie. Najdôležitejšie je, že [countries] môžu formovať len krajiny vyšších úrovní než svoju aktuálnu." # todo: CHANGED # todo: CONCEPT CASE
 game_concept_country_rank: "Rang krajiny" # todo: NEW TRANSLATION
 game_concept_country_ranks: "Rangy krajín" # todo: NEW TRANSLATION
 game_concept_country_rank_upper_desc: "Rang krajiny predstavuje rešpekt, ktorý [Concept('countries','krajiny')|e] vzbudzujú medzi svojimi rovesníkmi. Primárne bude závisieť od veľkosti a sily $game_concept_country$, hoci samotná tradícia často stačí na získanie rešpektu, takže raz získané postavenie už nemožno stratiť.\n\nKaždé $game_concept_country_rank$ umožňuje väčšie diplomatické možnosti, pričom vyššie postavenia odomykajú nové prostriedky na ovplyvňovanie iných krajiny cez [Concept('diplomacy','diplomaciu')|e]." # todo: RETRANSLATED ENGLISH # todo: CONCEPT CASE
 game_concept_country_rank_list_title: "Zoznam hodností krajín" # todo: NEW TRANSLATION
 game_concept_country_rank_desc: "$game_concept_country_rank_upper_desc$\n[ShowDatabaseWithIcon('country_rank')]" # todo: NEW TRANSLATION
 game_concept_country_type: "Typ krajiny" # todo: NEW TRANSLATION
 game_concept_type_of_country: "Typ krajiny" # todo: NEW TRANSLATION
 game_concept_country_type_list_title: "Zoznam typov krajín" # todo: NEW TRANSLATION
 game_concept_country_type_list: "$BULLET_WITH_TAB$[Concept('settled_country','Osídlená krajina')|e]\n$BULLET_WITH_TAB$[Concept('army_based','Krajina založená na armáde')|e]\n$BULLET_WITH_TAB$[Concept('extraterritorial_country','Extrateritoriálna krajina')|e]\n$BULLET_WITH_TAB$[Concept('society_of_pops','Spoločnosť obyvateľstva')|e]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_country_type_desc: "Typ krajiny definuje podmienky existencie [Concept('country','krajina')|e] a má obrovské herné dôsledky. Niektoré $game_concept_countries$ sú definované [Concept('locations','lokality')|e], ktoré [Concept('own','vlastniť')|e], a bez nich nemôžu existovať, zatiaľ čo iné sú definované svojimi [Concept('armies','armádami')|e], [Concept('buildings','budovami')|e] alebo [Concept('pops','populácie')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_diplomatic_range: "Diplomatický dosah" # todo: NEW TRANSLATION
 game_concept_diplomatic_range_desc: "Diplomatický dosah obmedzuje fyzickú vzdialenosť, ktorú môžu naši diplomati prekonať pri vykonávaní diplomacie. Vzdialenosť sa meria od jedného hlavného mesta k druhému." # todo: NEW TRANSLATION
 game_concept_diplomatic_capacity: "Diplomatická kapacita" # todo: NEW TRANSLATION
 game_concept_diplomatic_capacity_used: "Využitá diplomatická kapacita" # todo: NEW TRANSLATION
 game_concept_diplomatic_upkeep: "Diplomatické náklady" # todo: NEW TRANSLATION
 game_concept_diplomatic_capacity_desc: "Aliancia so všetkými je aliancia s nikým. [Concept('country','Krajina')|e], ktorý udržiava viac vzťahov než jeho diplomatickej kapacity, utrpí penalizáciu na [Concept('diplomatic_reputation','diplomatickú reputáciu')|e] a [Concept('prestige','prestíž')|e]. Niektoré [Concept('subject_types','druhy vazalov')|e] majú $game_concept_diplomatic_upkeep$, ktorý tiež znižuje dostupnú kapacitu.\n\nČlenstvo v niektorých [Concept('international_organizations','medzinárodných organizáciách')|e] bude stáť časť diplomatickej kapacity, a sila vášho [Concept('ally','spojenca')|e] určuje cenu [Concept('alliance','alianciu')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_diplomatic_reputation: "Diplomatická reputácia" # todo: NEW TRANSLATION
 game_concept_diplomatic_reputation_desc: "Diplomatická reputácia [Concept('country','krajina')|e] predstavuje, ako vysoko je v medzinárodných vzťahoch cenená. Najmä ovplyvňuje, ako [Concept('trusted','dôveryhodný')|e] je u všetkých ostatných krajín." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_naval_range: "Námorný dosah" # todo: NEW TRANSLATION
 game_concept_naval_range_desc: "Jednoducho vzdialenosť, ktorú môžu naše [Concept('ships','lode')|e] [Concept('explore','preskúmať')|e] predtým, než sa musia vrátiť kvôli zásobám." # todo: CHANGED # todo: CONCEPT CASE
 game_concept_colonial_range: "Koloniálny dosah" # todo: NEW TRANSLATION
 game_concept_colonial_range_desc: "Jednoducho, ako ďaleko môžeme [Concept('colonize','kolonizovať')|e]." # todo: CHANGED # todo: CONCEPT CASE
 game_concept_military_access: "Vojenský prístup" # todo: NEW TRANSLATION
 game_concept_military_access_desc: "Vojenský prístup umožňuje našim jednotkám pohybovať sa cez územie iných [Concept('countries','krajiny')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_fleet_basing_rights: "Práva kotvenia flotily" # todo: NEW TRANSLATION
 game_concept_fleet_basing_rights_desc: "Práva kotvenia flotily umožňujú, aby [Concept('ports','prístavy')|e] jednej krajiny používali [Concept('ships','lode')|e] inej krajiny, čím sa predlžuje ich dosah prieskumu a umožňuje im [Concept('repair','oprave')|e] mimo domova." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_mothballed: "Zakonzervované" # todo: NEW TRANSLATION
 game_concept_mothball: "Zakonzervovať" # todo: NEW TRANSLATION
 game_concept_mothballed_desc: "Zakonzervované [Concept('ships','lode')|e] vyžadujú málo [Concept('gold','dukáty')|e] na údržbu, ale nie sú udržiavané v [Concept('combat','boji')|e] pohotovosti, takže ich možno poraziť omnoho ľahšie." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_country_interaction: "Interakcia s krajinou" # todo: NEW TRANSLATION
 game_concept_country_interactions: "Interakcie s krajinami" # todo: NEW TRANSLATION
 game_concept_country_interaction_desc: "Toto sú [Concept('actions','akcie')|e], ktoré môžeme vykonať s [Concept('country','krajinou')|e]. Buď prostredníctvom [Concept('diplomacy','diplomacie')|e] alebo interakciou s [Concept('subject','vazalom')|e].\n\nPríklady zahŕňajú [ShowCountryInteractionName('sabotage_reputation')], [ShowCountryInteractionName('pay_off_debt')] alebo [ShowCountryInteractionName('give_location_to_subject')]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_relation_type: "Typ vzťahu" # todo: NEW TRANSLATION
 game_concept_relation_types: "Typy vzťahov" # todo: NEW TRANSLATION
 game_concept_relation_type_desc: "Toto sú vzťahy, ktoré môžeme nadviazať s [Concept('country','krajinou')|e]. Buď cez [Concept('diplomacy','diplomaciu')|e] alebo interakciou s [Concept('subject','vazalom')|e].\n\nPríklady zahŕňajú [ShowRelationTypeName('embargo_nation')], [ShowRelationTypeName('sound_toll_exemption')] alebo [ShowRelationTypeName('scutage')]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_army_levy: "Armádny branec" # todo: NEW TRANSLATION
 game_concept_army_levies: "Armádny branci" # todo: NEW TRANSLATION
 game_concept_army_levy_desc: "Armádny lízing (levy) je [Concept('regiment','pluk')|e] vybraný priamo z [Concept('pops','populácií')|e]. Keď je jednotka naverbovaná, sú znížené [pops], z ktorých bola odobratá, a keď je jednotka rozpustená, preživší sa vrátia späť k [pops]. Títo ľudia sú menej vycvičení než bežná [Concept('army','armáda')|e] naverbovaná z [Concept('manpower','živej sily')|e] a neprijímajú posily.\n\nLevy [Concept('regiment','pluk')|e] má tiež nasledujúci efekt:\n\n[ShowModifierEffect('is_army_levy')]" # todo: CHANGED # todo: CONCEPT CASE
 game_concept_navy_levy: "Povolané loďstvo" # todo: NEW TRANSLATION
 game_concept_navy_levies: "Povolané loďstvo" # todo: NEW TRANSLATION
 game_concept_navy_levy_desc: "Námorný lízing (levy) je transportná [Concept('ship','loď')|e], ktorá bola zabavená priamo od [Concept('pops','populácií')|e]. Keď je jednotka naverbovaná, sú z [pops] v [Concept('locations','lokalitách')|e] odobratí vlastníci lode a ich posádka, a keď je jednotka rozpustená, preživší sa vrátia späť k [pops]. Tieto lode sú všeobecne krehkejšie než [Concept('navy','námorníctvo')|e] naverbované z [Concept('sailors','námorníkov')|e] a mali by byť chránené vhodnými plavidlami s delami.\n\nLevy [Concept('ship','loď')|e] má tiež nasledujúci efekt:\n\n[ShowModifierEffect('is_navy_levy')]" # todo: CHANGED # todo: CONCEPT CASE
 game_concept_levy: "Branec" # todo: NEW TRANSLATION
 game_concept_levies: "Branci" # todo: NEW TRANSLATION
 game_concept_levy_desc: "Branci je vojenská jednotka, ktorú [Concept('pop','populáciu')|e] povolá, keď je vyzvaná. Je to buď [Concept('army_levy','armádny branec')|e] alebo [Concept('navy_levy','povolané loďstvo')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_levy_combat_efficiency: "Efektivita boja brancov" # todo: NEW TRANSLATION
 game_concept_levy_combat_efficiency_desc: "Toto ovplyvňuje, ako efektívne bude [Concept('regiment','pluk')|e] [Concept('levies','brancov')|e] pôsobiť v [Concept('combat','boji')|e] v porovnaní s [Concept('regular_regiment','stálym plukom')|e]." # todo: CHANGED # todo: CONCEPT CASE
 game_concept_weather_system: "Poveternostná podmienka" # todo: NEW TRANSLATION
 game_concept_weather_systems: "Poveternostné podmienky" # todo: NEW TRANSLATION
 game_concept_weather_system_desc: "Ide o poveternostné podmienky, ktoré môžu priniesť silné vetry, dážď, sneh a piesočné búrky do [Concept('locations','lokalít')|e] po celom svete a občas spôsobiť škody." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_mercenaries: "Žoldnieri" # todo: NEW TRANSLATION
 game_concept_mercenary: "Žoldnier" # todo: NEW TRANSLATION
 game_concept_mercenary_desc: "Žoldnieri sú súkromné osoby, ktoré sa zúčastňujú vojenského konfliktu za [Concept('gold','dukáty')|e], ale inak sú pre konflikt cudzí. Jednotky [Concept('country','krajina')|e] môžu byť prenajaté iným krajinám ako žoldnieri.\n\nZákladné náklady na žoldnierov sú o 50 % vyššie než na [Concept('regulars','stálych vojakov')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_mercenary_hiring_fee: "Poplatok za najatie" # todo: NEW TRANSLATION
 game_concept_mercenary_hiring_fees: "Poplatky za najatie" # todo: NEW TRANSLATION
 game_concept_mercenary_hiring_fee_desc: "Toto je vopred platená cena za najatie tejto žoldnierskej spoločnosti, bez ohľadu na [Concept('mercenary_contract_length','dĺžku zmluvy')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_mercenary_monthly_fee: "Mesačný poplatok" # todo: NEW TRANSLATION
 game_concept_mercenary_monthly_fees: "Mesačné poplatky" # todo: NEW TRANSLATION
 game_concept_mercenary_monthly_fee_desc: "Toto sú mesačné náklady na najatie tejto spoločnosti. Závisia predovšetkým od počtu a kvality jej [Concept('regiments','plukov')|e], ako aj od [Concept('abilities','schopností')|e] jej [Concept('commander','veliteľa')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_mercenary_contract_length: "Dĺžka zmluvy" # todo: NEW TRANSLATION
 game_concept_mercenary_contract_length_desc: "Toto je počet mesiacov, počas ktorých bude táto spoločnosť slúžiť na požiadanie svojho zmluvného partnera." # todo: NEW TRANSLATION
 game_concept_prisoner: "Väzeň" # todo: NEW TRANSLATION
 game_concept_prisoners: "Väzni" # todo: NEW TRANSLATION
 game_concept_prisoner_desc: "Väzni sú nepriateľské [Concept('regiments','pluky')|e], ktoré boli zajaté po bitke. Môžu byť podplatené, aby sa stali [Concept('mercenaries','žoldnieri')|e] bojujúcimi za svojich zajímateľov, môžu byť prepustení za výkupné, alebo jednoducho zlikvidované... humánne alebo nie." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_privateer_maintenance: "Náklady na korzárov" # todo: NEW TRANSLATION
 game_concept_privateer_maintenance_desc: "Aj keď sa [Concept('privateers','korzárov')|e] môžu obohatiť, pri [Concept('sailors','námorníkoch')|e] ich stále musí podporovať [Concept('country','krajina')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_privateer_durability: "Odolnosť korzárov" # todo: NEW TRANSLATION
 game_concept_privateer_durability_desc: "[Concept('privateers','Korzári')|e] môžu byť poškodení a zničení [Concept('anti_piracy_warfare','dopad proti pirátstvu')|e] v ich [Concept('area','oblasť')|e]. Pri vyššej Privateer Durability prežijú dlhšie." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_civil_construction: "Civilná výstavba" # todo: NEW TRANSLATION
 game_concept_civil_constructions: "Civilné výstavby" # todo: NEW TRANSLATION
 game_concept_civil_construction_desc: "Civilné výstavby sú čokoľvek, čo sa práve stavia v [Concept('location','lokalite')|e], čo nie je jednotka [Concept('army','armáda')|e] alebo [Concept('navy','námorníctvo')|e], napríklad [Concept('buildings','budovy')|e], presunutie vášho [Concept('capital','hlavného mesta')|e], vytvorenie [Concept('market','trh')|e] alebo výstavba [Concept('roads','cesty')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_country_strength: "Sila krajiny" # todo: NEW TRANSLATION
 game_concept_country_strength_desc: "Toto je odhad moci [Concept('country','krajina')|e]. Zohľadňuje jeho [Concept('military_strength','vojenskej sily')|e], [Concept('income','príjmu')|e] a [Concept('population','populácia')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_military_strength: "Vojenská sila" # todo: NEW TRANSLATION
 game_concept_military_strength_desc: "Vojenská sila [Concept('country','krajina')|e] sa počíta z jeho maximálneho [Concept('manpower','živej sily')|e], veľkosti [Concept('army','armáda')|e] a sily [Concept('levy','branec')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_naval_strength: "Námorná sila" # todo: NEW TRANSLATION
 game_concept_naval_strength_desc: "Námorná sila [Concept('country','krajina')|e] sa počíta z jeho maximálneho počtu [Concept('sailors','námorníkov')|e], veľkosti [Concept('navy','námorníctvo')|e] a sily [Concept('navy_levy','povolané loďstvo')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_privateer: "Korzár" # todo: NEW TRANSLATION
 game_concept_privateers: "Korzári" # todo: NEW TRANSLATION
 game_concept_privateer_desc: "Korzári sú podnikaví ľudia, ktorí reagovali na výzvu [Concept('country','krajinu')|e] ničiť [Concept('maritime_presence','námorná prítomnosť')|e] kohokoľvek potenciálneho [Concept('hostile','nepriateľský')|e]. Pre tých, čo ich stretnú, sú nerozlíšiteľní od [Concept('pirates','pirátov')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_pirate: "Pirát" # todo: NEW TRANSLATION
 game_concept_pirates: "Piráti" # todo: NEW TRANSLATION
 game_concept_pirate_desc: "Piráti sú útočníci na mori, ktorí napádajú iné [Concept('ships','lode')|e] alebo pobrežné oblasti a kradnú [Concept('goods','tovary')|e] alebo [Concept('gold','dukáty')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_core: "Jadro" # todo: NEW TRANSLATION
 game_concept_cores: "Jadrá" # todo: NEW TRANSLATION
 game_concept_cored: "S jadrom" # todo: NEW TRANSLATION
 game_concept_core_list_title: "Jadrová [location] dostáva nasledujúce efekty:" # todo: NEW TRANSLATION
 game_concept_core_desc: "Jadro (Core) [Concept('location','lokalita')|e] pre [Concept('country','krajinu')|e] je integrálna súčasť tejto [country].\nAk je táto [location] niekedy stratená v [Concept('war','vojne')|e], je ľahké vytvoriť [Concept('casus_belli','casus Belli')|e], aby sme sa ju pokúsili získať späť.\nKaždá [Concept('integrated','integrované')|e] [location], ktorá má väčšinu [Concept('owner_s','majiteľov')|e] [Concept('primary_culture','hlavnej kultúry')|e] alebo akúkoľvek [Concept('accepted_culture','akceptovanú kultúru')|e], sa stane jadrom.\nJadrá získané cez [Concept('effects','efekty')|e] alebo tie, ktoré boli stratené iným krajinám, zmiznú po [GetDefine('NCountry', 'SCRIPTED_CORE_DURATION_YEARS')] rokoch, ak nemajú správnu [Concept('culture','kultúru')|e]." # todo: CHANGED # todo: CONCEPT CASE
 game_concept_colonial_charter: "Koloniálna listina" # todo: NEW TRANSLATION
 game_concept_colonial_charters: "Koloniálne listiny" # todo: NEW TRANSLATION
 game_concept_colonial_charter_desc: "Koloniálna listina je vytvorená [Concept('country','krajina')|e], ktorá chce [Concept('colonize','kolonizovať')|e] celú [Concept('province','provinciu')|e].\nKoloniálna listina bude [Concept('migrate','migrovať')|e] [Concept('pops','populácií')|e] do [province]. Keď je [Concept('location','lokalita')|e] [Concept('fully_settled','plne osídlené')|e], [location] sa stane [Concept('owned','vlastnené')|e] kolonizátorom." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_fully_settled: "Plne osídlené" # todo: NEW TRANSLATION
 game_concept_fully_settled_desc: "Keď v [Concept('location','lokalite')|e] žije aspoň #G 1 000#! [Concept('pops','populácie')|e] a dostatočný počet [Concept('pops','populácie')|e] v [location] v rámci [Concept('colonial_charter','koloniálnej listiny')|e] sú [Concept('primary_or_accepted_culture','hlavnej alebo akceptovanej kultúry')|e] a oficiálne [Concept('primary_religion','hlavného náboženstva')|e] majiteľa listiny, lokalita sa považuje za plne osídlenú. Požadované percento závisí od [Concept('power_projection','projekcie sily')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_colonized: "Kolonizované" # todo: NEW TRANSLATION
 game_concept_colonization: "Kolonizácia" # todo: NEW TRANSLATION
 game_concept_colonize: "Kolonizovať" # todo: NEW TRANSLATION
 game_concept_colony: "Kolónia" # todo: NEW TRANSLATION
 game_concept_colonies: "Kolónie" # todo: NEW TRANSLATION
 game_concept_colonized_list_title: "Kolonizovaná [location] dostáva nasledujúce efekty:" # todo: NEW TRANSLATION
 game_concept_colonized_desc: "Kolónia je, keď [Concept('country','krajina')|e] má v [Concept('province','provincii')|e] [Concept('colonial_charter','koloniálnej listine')|e], ktorá pomaly presiela vlastnú [Concept('population','populáciu')|e], aby sa stali novou väčšinou." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_conquer: "Dobyť" # todo: NEW TRANSLATION
 game_concept_conquered: "Dobytá" # todo: NEW TRANSLATION
 game_concept_conquest: "Dobytie" # todo: NEW TRANSLATION
 game_concept_conquer_list_title: "Dobytá [location] dostáva nasledujúce efekty:" # todo: NEW TRANSLATION
 game_concept_conquer_desc: "Ide o situáciu, keď sa [Concept('location','lokalitu')|e] zmení [Concept('owner','majiteľ')|e] z jednej [Concept('country','krajiny')|e] na inú. Zvyčajne sa tak stane prostredníctvom [Concept('peace_treaty','mierovej dohody')|e] po [Concept('war','vojne')|e], ale existujú aj iné spôsoby, napríklad predaj [locations] cez [diplomacy].\n\nPodmanená [location] potrebuje byť [Concept('integrated','integrované')|e], aby mohla byť efektívne spravovaná." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_separatism: "Separatizmus" # todo: NEW TRANSLATION
 game_concept_separatism_desc: "[Concept('pops','Populácie')|e], ktoré nie sú [Concept('primary_culture','hlavná kultúra')|e], budú mať nižšie [Concept('pop_satisfaction','spokojnosť populácie')|e], keď žijú v [Concept('location','lokalite')|e], ktorá bola dobytá a ešte nie je [Concept('integrated','integrované')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_owner: "Majiteľ" # todo: NEW TRANSLATION
 game_concept_owners: "Majitelia" # todo: NEW TRANSLATION
 game_concept_ownership: "Vlastníctvo" # todo: NEW TRANSLATION
 game_concept_owner_s: "Majiteľov" # todo: NEW TRANSLATION
 game_concept_owned: "Vlastnené" # todo: NEW TRANSLATION
 game_concept_owns: "Vlastní" # todo: NEW TRANSLATION
 game_concept_own: "Vlastniť" # todo: NEW TRANSLATION
 game_concept_owner_desc: "[Concept('country','Krajina')|e], ktorý je de iure považovaný za vlastníka [Concept('location','lokalitu')|e]. Aj keď [Concept('controller','kontrolujúci')|e] môže byť momentálne iná krajina." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_controller: "Kontrolujúci" # todo: NEW TRANSLATION
 game_concept_controlled: "Kontrolované" # todo: NEW TRANSLATION
 game_concept_controls: "Kontroluje" # todo: NEW TRANSLATION
 game_concept_controller_desc: "[Concept('country','Krajina')|e], ktorý je momentálne schopný vykonávať de facto moc nad [Concept('location','lokalitou')|e].\n\nZvyčajne je to [Concept('owner','majiteľ')|e], ale počas [Concept('war','vojny')|e] to môže byť [Concept('enemy','vojnový nepriateľ')|e], ak sa [location] stane [Concept('occupied','okupované')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_rgo_pops: "Robotníci alebo otroci" # todo: NEW TRANSLATION
 game_concept_rgo_pops_desc: "Toto sú [Concept('pop_types','sociálne triedy')|e], ktoré môžu pracovať pri získavaní [Concept('raw_materials','surovinách')|e].\n\n$BULLET_WITH_TAB$[ShowPopTypeName('laborers')]\n$BULLET_WITH_TAB$[ShowPopTypeName('slaves')]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_plantation: "Plantáž" # todo: NEW TRANSLATION
 game_concept_plantations: "Plantáže" # todo: NEW TRANSLATION
 game_concept_plantation_desc: "Ide o špecifické [Concept('buildings','budovy')|e], ktoré musia byť postavené na využívanie určitých typov [Concept('raw_materials','surovín')|e] ako [ShowGoodsName('cotton')], [ShowGoodsName('sugar')] a [ShowGoodsName('tobacco')].\n\nPre tieto budovy budeme konkrétne potrebovať [ShowPopTypeName('slaves')]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_friend: "Priateľ" # todo: NEW TRANSLATION
 game_concept_friendly: "Priateľský" # todo: NEW TRANSLATION
 game_concept_friend_desc: "Priateľská [Concept('country','krajina')|e] je tá, ktorá je buď naším [Concept('subject','vazalom')|e], naším [overlord|e], alebo [Concept('war_ally','vojnový spojenec')|e]. Samozrejme, naša vlastná krajina je tiež považovaná za priateľskú." # todo: CHANGED # todo: CONCEPT CASE
 game_concept_hostile: "Nepriateľský" # todo: NEW TRANSLATION
 game_concept_hostile_desc: "Nepriateľská [Concept('country','krajina')|e] je tá, ktorá nám chce ublížiť, napríklad [Concept('rebels','povstalci')|e], [Concept('pirates','piráti')|e] alebo krajina, s ktorou sme vo [Concept('war','vojne')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_regency: "Regentstvo" # todo: NEW TRANSLATION
 game_concept_regencies: "Regentstvá" # todo: NEW TRANSLATION
 game_concept_regency_desc: "Regentstvo nastáva, keď [Concept('government','vláda')|e] nemá legitimného [Concept('ruler','panovníka')|e] a namiesto neho je vedené [Concept('regent','regent')|e].\n\nZvyčajne sa to stane, keď [Concept('heir_selection','nástupnícke právo')|e] nevytvorí platného [Concept('heir','dediča')|e], alebo keď je [heir] len [Concept('child','dieťa')|e].\n\nV [ShowGovernmentTypeName('monarchy')] sa [Concept('consort','konzort panovníka')|e] môže stať [regent], inak je to [Concept('character','postava')|e] spojený s najsilnejším [Concept('estate','stavom')|e], alebo dokonca s [overlord|e].\n\nRegentstvo pretrváva, kým nie je obnovený riadny [ruler]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_situation: "Situácia" # todo: NEW TRANSLATION
 game_concept_situations: "Situácie" # todo: NEW TRANSLATION
 game_concept_situation_desc: "Situácia je to, čo hra používa pre najdôležitejšie historické incidenty, ktoré zahŕňajú viac než jednu [Concept('country','krajinu')|e], a/alebo ktoré prebiehajú počas určitého obdobia.\n\nMedzi najdôležitejšie Situácie patrí [ShowSituationName('black_death')] a [ShowSituationName('reformation')].\n\nSituácie [ShowAgeName('age_1_traditions')]:\n$BULLET$Storočná vojna\n$BULLET$Guelphovia a Ghibellinovia\n$BULLET$Vzostup Turkov\n$BULLET$Nanbokuchō Jidai\n$BULLET$Pád Dillí\n\nSituácie [ShowAgeName('age_2_renaissance')]:\n$BULLET$Čierna smrť\n$BULLET$Husitské vojny\n$BULLET$Povstania Červených šatiek\n$BULLET$Vzostup $name_timur$\n$BULLET$Západný schizmus\n\nSituácie [ShowAgeName('age_3_discovery')]:\n$BULLET$Veľké morové ochorenie\n$BULLET$Talianske vojny\n$BULLET$Reformácia\n$BULLET$Sengoku Jidai\n$BULLET$Zmluva z Tordesillas\n\nSituácie [ShowAgeName('age_4_reformation')]:\n$BULLET$Tridentský koncil\n$BULLET$Náboženské vojny\n\nSituácie [ShowAgeName('age_5_absolutism')]:\n$BULLET$Kolumbov výmenný obchod\n$BULLET$Zlatý vek pirátstva\n$BULLET$Malá doba ľadová\n\nSituácie [ShowAgeName('age_6_revolutions')]:\n$BULLET$Koloniálna revolúcia\n$BULLET$Ľudové povstanie" # todo: CHANGED # todo: CONCEPT CASE
 game_concept_situation_tension: "Napätie" # todo: NEW TRANSLATION
 game_concept_situation_tension_desc: "Meria, do akej miery sa vyostrujú [ShowSituationName('italian_wars')]. Rastie pasívne každý mesiac a rýchlejšie, keď sú lídri Ligy aktívne vo vojne. Vyššie Napätie robí všetkých lídrov Ligy agresívnejšími a skracuje čas medzi ich vojnami.\n\nNapätie výrazne klesne, keď je Liga rozpustená prostredníctvom mierovej dohody." # todo: NEW TRANSLATION
 game_concept_situation_action: "Situačná akcia" # todo: NEW TRANSLATION
 game_concept_situation_actions: "Situačné akcie" # todo: NEW TRANSLATION
 game_concept_situation_action_desc: "Toto sú [Concept('actions','akcie')|e], ktoré môžeme vykonať, kým je určitá [Concept('situation','situácia')|e] aktívna. Zaniknú, keď sa situácia vyrieši.\n\nNiektoré príklady sú [ShowGenericActionName('hide_from_black_death')] a [ShowGenericActionName('rtr_rekindle_revolt')]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_disaster: "Katastrofa" # todo: NEW TRANSLATION
 game_concept_disasters: "Katastrofy" # todo: NEW TRANSLATION
 game_concept_disaster_desc: "Katastrofa je významná a rušivá udalosť ovplyvňujúca jediný [Concept('country','krajina')|e], ktorá môže trvať alebo zostať aktívna dlhý čas, kým ju krajina neprekoná.\n\nMedzi najdôležitejšie katastrofy patria [ShowDisasterName('ambrosian_republic_disaster')] a [ShowDisasterName('dissolution_of_delhi')]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_tax_efficiency: "Efektivita výberu daní" # todo: NEW TRANSLATION
 game_concept_tax_efficiency_desc: "Toto ukazuje, ako efektívna je naša [Concept('country','krajina')|e] pri výbere [Concept('tax','dani')|e]. Ovplyvňuje množstvo $game_concept_taxes$, ktoré sa pri zdanení [Concept('estates','stavoch')|e] dostane do [Concept('treasury','pokladnice')|e]." # todo: CHANGED # todo: CONCEPT CASE
 game_concept_selling_efficiency: "Efektivita predaja" # todo: NEW TRANSLATION
 game_concept_selling_efficiency_desc: "Toto mení, aké ziskové bude [Concept('trade','obchod')|e], tým že priamo ovplyvňuje cenu, za ktorú predávate [Concept('goods','tovary')|e] na cieľovom [Concept('market','trh')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_export_efficiency: "Efektivita exportu" # todo: NEW TRANSLATION
 game_concept_export_efficiency_desc: "Toto mení, aké ziskové bude [Concept('trade','obchod')|e] na strane predaja, tým že priamo ovplyvňuje cenu získanú pri exporte [Concept('goods','tovaroch')|e] na zahraničný [Concept('market','trh')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_import_efficiency: "Efektivita importu" # todo: NEW TRANSLATION
 game_concept_import_efficiency_desc: "Toto znižuje náklady pri importe [Concept('goods','tovaroch')|e] zo zahraničného [Concept('market','trhu')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_production_efficiency: "Efektivita produkcie" # todo: NEW TRANSLATION
 game_concept_production_efficiency_desc: "Toto ovplyvňuje [Concept('output','produkcia')|e] [Concept('buildings','budov')|e]. Pozitívna efektívnosť produkcie zvyšuje zisk, zatiaľ čo negatívna môže spôsobiť, že nebude výhodné budovu udržiavať v prevádzke." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_establishment: "Zabehnutie" # todo: NEW TRANSLATION
 game_concept_establishment_desc: "Novovystavané [Concept('buildings','budovy')|e] začínajú nezabehnuté. Pod prahom zabehnutia pracujú pri zníženom výkone, pričom spotrebúvajú menej vstupov a produkujú menej výstupov. Po dosiahnutí prahu budova funguje na plný výkon a začína získavať bonus k [Concept('production_efficiency','efektivite produkcie')|e] úmerný svojmu zabehnutiu, rastúci až do +[GetDefine('NEconomy','STARTUP_MAX_PE_BONUS')|+=2%] pri plnom zabehnutí. [Concept('establishment','Zabehnutie')|e] sa získava každý mesiac a stráca sa, ak sa budova zatvorí." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_economical_base: "Ekonomická základňa" # todo: NEW TRANSLATION
 game_concept_economical_base_desc: "Toto je založené na celkovom [Concept('wealth','bohatstvo')|e] a [Concept('population','populáciu')|e] [Concept('country','krajinu')|e], bez ohľadu na [Concept('control','kontrolu')|e].\n\nPočet [Concept('subjects','vazali')|e] a [Concept('institutions','inštitúcie')|e], ktoré boli [Concept('embraced','prijaté')|e], ho tiež zvyšuje, ako aj akýkoľvek [Concept('income','príjem')|e] z [Concept('interest','úroku')|e] alebo [Concept('foreign_buildings','cudzie budovy')|e]." # todo: CHANGED # todo: CONCEPT CASE
 game_concept_tax_rate: "Daňová sadzba" # todo: NEW TRANSLATION
 game_concept_tax_rate_desc: "Percento z [Concept('max_tax','maximálnej dane')|e], ktoré [Concept('estate','stavu')|e] platí ako [Concept('taxes','dane')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_max_tax: "Maximálna daň" # todo: NEW TRANSLATION
 game_concept_maximum_tax: "Maximálna daň" # todo: NEW TRANSLATION
 game_concept_max_tax_desc: "Toto je najvyššie percento [Concept('tax','daň')|e], ktoré môže byť odobraté z [Concept('estate','stavu')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_min_tax: "Minimálna daň" # todo: NEW TRANSLATION
 game_concept_minimum_tax: "Minimálna daň" # todo: NEW TRANSLATION
 game_concept_min_tax_desc: "Toto je najnižšie percento [Concept('tax','daň')|e], ktoré môže byť odobraté z [Concept('estate','stavu')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_profit: "Zisk" # todo: NEW TRANSLATION
 game_concept_profit_desc: "Toto je suma, ktorú [Concept('building','budovu')|e] alebo [Concept('rgo','R.G.O.')|e] prispieva k [Concept('wealth','bohatstvu')|e] svojho [location]. Inými slovami, [Concept('gold','dukátmi')|e], ktoré sú vytvorené z [building].\n\nAk je hodnota negatívna, budova sa považuje za neprofesionálnu a prestane fungovať." # todo: CHANGED # todo: CONCEPT CASE
 game_concept_taxable_profit: "Zdaniteľný zisk" # todo: NEW TRANSLATION
 game_concept_taxable_profit_desc: "Ide o množstvo [Concept('gold','dukáty')|e] vytvárané [building] alebo [rgo], ktoré podlieha [Concept('taxes','dane')|e], pričom sa berie do úvahy [Concept('control','kontrola')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_tax: "Daň" # todo: NEW TRANSLATION
 game_concept_taxes: "Dane" # todo: NEW TRANSLATION
 game_concept_tax_desc: "Môžeme sa rozhodnúť vyberať dane od našich [Concept('estates','stavov')|e]. To zvýši náš [Concept('treasury','pokladnica')|e], no vyššie dane znížia ich [Concept('estate_satisfaction','spokojnosť stavu')|e].\n\nMnožstvo [Concept('wealth','bohatstvo')|e], ktoré je možné zdaňovať, závisí od [Concept('control','kontroly')|e] lokácií generujúcich [wealth] pre [estates]." # todo: CHANGED # todo: CONCEPT CASE
 game_concept_tax_base: "Daňový základ" # todo: NEW TRANSLATION
 game_concept_tax_base_desc: "Tax Base (daňový základ) je celkové množstvo [Concept('wealth','bohatstvo')|e], ktoré môže byť ovplyvnené [Concept('taxes','dane')|e] v [location], čo priamo závisí od jeho [Concept('control','kontroly')|e]. Bohatstvo bez [control] ide priamo [estates], a nemožno ho zdaňovať.\n\n[wealth] je rozdelené medzi [estates] podľa ich [Concept('wealth_share','podiel na bohatstve')|e] v [location]. Každé [estate] potom zaplatí časť tohto daňového základu do [Concept('treasury','pokladnice')|e] podľa uvalenej [Concept('tax_rate','daňovej sadzby')|e]." # todo: CHANGED # todo: CONCEPT CASE
 game_concept_wealth: "Bohatstvo" # todo: NEW TRANSLATION
 game_concept_wealth_desc: "Bohatstvo [Concept('location','lokalita')|e] je súhrnný zisk jeho [rgo|e] a [Concept('buildings','budovy')|e] z predaja ich [Concept('goods','tovary')|e] na [Concept('market','trh')|e]. Ak sú v [location] prítomní [ShowPopTypeName('burghers')], [burgher_trade|e] môže tiež zvýšiť bohatstvo lokality.\n\nBohatstvo [location] sa delí medzi [Concept('estates','stavmi')|e] podľa ich [wealth_share] v [location]. Bohatstvo lokality vynásobené [Concept('control','kontrola')|e] tvorí [Concept('tax_base','daňový základ')|e] lokality, čo je množstvo [Concept('gold','dukáty')|e], ktoré môže vláda zdaníť. Bohatstvo bez [control] ide priamo k [estates] a nemôže byť zdanené." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_wealth_share: "Podiel na bohatstve" # todo: NEW TRANSLATION
 game_concept_wealth_share_desc: "[Concept('wealth','Bohatstvo')|e] [Concept('location','Lokalita')|e] sa rozdeľuje medzi [Concept('estates','stavmi')|e] podľa ich relatívnej [Concept('population','populácii')|e] v [location]. [ShowPopTypeName('nobles')] získavajú oveľa väčší podiel na obyvateľa ako [ShowPopTypeName('burghers')], ktorí zas získavajú oveľa väčší podiel na obyvateľa ako [ShowPopTypeName('peasants')].\n\nV závislosti od [ShowModifierTypeName('local_peasant_enfranchisment')] v [location] sa percento podielu [ShowEstateTypeName('peasants_estate')] prenesie na [ShowEstateTypeName('nobles_estate')]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_bankrupt: "Bankrot" # todo: NEW TRANSLATION
 game_concept_bankruptcy: "Bankrot" # todo: NEW TRANSLATION
 game_concept_bankrupt_desc: "[Concept('country','Krajina')|e], ktorá sa rozhodne vyhlásiť bankrot, vymaže všetok svoj [Concept('debt','dlh')|e]. Avšak to prinesie 5-ročné obdobie prísnych [Concept('modifiers','modifikátorov')|e].\n[country] môže byť tiež donútená k bankrotu, ak jej dôjdu peniaze a nebude schopná zobrať ďalšie [Concept('loans','pôžičky')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_formable_country: "Sformovateľná krajina" # todo: NEW TRANSLATION
 game_concept_formable: "Sformovateľné" # todo: NEW TRANSLATION
 game_concept_formables: "Sformovateľné" # todo: NEW TRANSLATION
 game_concept_formable_country_formed: "Sformované" # todo: NEW TRANSLATION
 game_concept_formable_country_form: "Sformovať" # todo: NEW TRANSLATION
 game_concept_formable_country_formation: "Sformovanie" # todo: NEW TRANSLATION
 game_concept_formable_forming: "Formuje sa" # todo: NEW TRANSLATION
 game_concept_formable_countries: "Krajiny na sformovanie" # todo: NEW TRANSLATION
 game_concept_formable_country_desc: "Formovateľná krajina (Formable Country) je nová národná identita, ktorú môže [Concept('country','krajina')|e] vytvoriť (alebo obnoviť) splnením určitých podmienok.\n\nTieto podmienky môžu zahŕňať kontrolu percenta [Concept('locations','lokalít')|e] v [Concept('region','regióne')|e] alebo mať konkrétnu [Concept('primary_culture','hlavnú kultúru')|e].\n\nMôžeme vytvoriť len Formable Country, ktorá má vyšší [Concept('tier','úrovne')|e] než náš aktuálny [tier].\n\nZvyčajne predstavujú historické únie alebo dokonca legendárne ambície. Po vytvorení sa stará [country] zmení názov, vlajku a farby na tie, ktoré má Formable Country." # todo: CHANGED # todo: CONCEPT CASE
 game_concept_revolter: "Povstalec" # todo: NEW TRANSLATION
 game_concept_revolt: "Povstanie" # todo: NEW TRANSLATION
 game_concept_revolter_desc: "Povstanie nastane, keď sa skupina [Concept('locations','lokality')|e] odtrhne ako nová [Concept('country','krajina')|e] a začne [Concept('war','vojna')|e] proti pôvodnému [Concept('owner','majiteľovi')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_rebel_movement: "Povstalecké hnutie" # todo: NEW TRANSLATION
 game_concept_rebel_movements: "Povstalecké hnutia" # todo: NEW TRANSLATION
 game_concept_rebel: "Povstalec" # todo: NEW TRANSLATION
 game_concept_rebels: "Povstalci" # todo: NEW TRANSLATION
 game_concept_rebellion: "Povstanie" # todo: NEW TRANSLATION
 game_concept_rebellions: "Povstania" # todo: NEW TRANSLATION
 game_concept_rebel_movement_desc: "Povstalecké hnutie je skupina [Concept('pops','populácie')|e], ktoré sa zjednotia proti svojej vláde kvôli nízkej [pop_satisfaction].\n\nExistujú rôzne typy povstaleckých hnutí. Napríklad [Concept('pops','populácie')|e] inej [Concept('culture','kultúry')|e] alebo [Concept('religion','náboženstvo')|e] sa pokúsia o [Concept('revolt','povstanie')|e], zatiaľ čo nespokojné [Concept('estate','stav')|e] sa pokúsia vyvolať [Concept('civil_war','občianska vojna')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_minor_revolt: "Menšie povstanie" # todo: NEW TRANSLATION
 game_concept_minor_revolts: "Menšie povstania" # todo: NEW TRANSLATION
 game_concept_minor_revolt_desc: "Ak sa [Concept('rebel_movement','povstalecké hnutie')|e] nedokázalo získať dostatočnú podporu, keď dosiahne #W 100%#!, nevystúpi v otvorenom [Concept('revolt','povstaní')|e], ale spôsobí [ShowModifier('minor_rebel_uprising')] v dotknutých [Concept('locations','lokalitách')|e], s nasledujúcimi trestmi:\n\n[ShowModifierEffect('minor_rebel_uprising')]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_estate_rebels: "Stavovi povstalci" # todo: NEW TRANSLATION
 game_concept_estate_rebels_desc: "Povstalci sú frakcia, ktorá sú buď [Concept('pops','populácie')|e] inej [Concept('culture','kultúry')|e] alebo [Concept('religion','náboženstvo')|e], ktorá sa pokúša o [Concept('revolt','povstanie')|e], alebo nespokojné [Concept('estate','stav')|e], ktoré sa snažia vynútiť [Concept('civil_war','občianska vojna')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_nationalist_rebels: "Nacionalistickí povstalci" # todo: NEW TRANSLATION
 game_concept_nationalist_rebels_desc: "Povstalci sú frakcia, ktorá sú buď [Concept('pops','populácie')|e] inej [Concept('culture','kultúry')|e] alebo [Concept('religion','náboženstvo')|e], ktorá sa pokúša o [Concept('revolt','povstanie')|e], alebo nespokojné [Concept('estate','stav')|e], ktoré sa snažia vynútiť [Concept('civil_war','občianska vojna')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_pretender_rebels: "Povstalci podporujúci pretendentov" # todo: NEW TRANSLATION
 game_concept_pretender_rebels_desc: "Povstalci sú frakcia, ktorá sú buď [Concept('pops','populácie')|e] inej [Concept('culture','kultúry')|e] alebo [Concept('religion','náboženstvo')|e], ktorá sa pokúša o [Concept('revolt','povstanie')|e], alebo nespokojné [Concept('estate','stav')|e], ktoré sa snažia vynútiť [Concept('civil_war','občianska vojna')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_religious_rebels: "Náboženskí povstalci" # todo: NEW TRANSLATION
 game_concept_religious_rebels_desc: "Povstalci sú frakcia, ktorá sú buď [Concept('pops','populácie')|e] inej [Concept('culture','kultúry')|e] alebo [Concept('religion','náboženstvo')|e], ktorá sa pokúša o [Concept('revolt','povstanie')|e], alebo nespokojné [Concept('estate','stav')|e], ktoré sa snažia vynútiť [Concept('civil_war','občianska vojna')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_slave_rebels: "Povstalci otrokov" # todo: NEW TRANSLATION
 game_concept_slave_rebels_desc: "Povstalci sú frakcia, ktorá sú buď [Concept('pops','populácie')|e] inej [Concept('culture','kultúry')|e] alebo [Concept('religion','náboženstvo')|e], ktorá sa pokúša o [Concept('revolt','povstanie')|e], alebo nespokojné [Concept('estate','stav')|e], ktoré sa snažia vynútiť [Concept('civil_war','občianska vojna')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_disloyal_subjects: "Nelojálni vazali" # todo: NEW TRANSLATION
 game_concept_disloyal_subject: "Nelojálny vazal" # todo: NEW TRANSLATION
 game_concept_disloyal_subjects_short: "Nelojálni" # todo: NEW TRANSLATION
 game_concept_disloyal_subjects_desc: "Keď má [subject] menej než [GetDefine('NDiplomacy','TOO_DISLOYAL_THRESHOLD')] [Concept('subject_loyalty','vernosť vazala')|e] voči svojmu [overlord|e], stáva sa z neho Disloyal Subject.\n\nV takomto stave už nebude pomáhať v [Concept('wars','vojnách')|e] svojho [overlord] a nemožno ho [Concept('annexed','anektované')|e]." # todo: CHANGED # todo: CONCEPT CASE
 game_concept_loyal_subjects: "Lojálni vazali" # todo: NEW TRANSLATION
 game_concept_loyal_subject: "Lojálny vazal" # todo: NEW TRANSLATION
 game_concept_loyal_subjects_short: "Lojálni" # todo: NEW TRANSLATION
 game_concept_loyal_subjects_desc: "Keď má [subject] viac než [GetDefine('NDiplomacy','TOO_DISLOYAL_THRESHOLD')] [Concept('subject_loyalty','vernosť vazala')|e] voči svojmu [overlord|e], stáva sa z neho Lojálny vazal.\n\nV takom stave sa pridá do [Concept('wars','vojen')|e] svojho [overlord] a môže byť [Concept('annexed','anektované')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_pop_needs: "Potreby populácie" # todo: NEW TRANSLATION
 game_concept_pop_needs_desc: "[pop_with_icon|e] má zoznam [goods_with_icon|e], ktoré potrebuje pre svoj život, čo závisí od jeho [Concept('pop_type','sociálnej triedy')|e], [Concept('culture','kultúry')|e], [Concept('religion','náboženstva')|e] a miesta, kde žije. Napríklad [ShowPopTypeName('nobles')] majú oveľa vyššie nároky než [Concept('lower_class','nižšia trieda')|e]. Ak tieto potreby nemôžu byť splnené, trpí ich [pop_satisfaction_with_icon|e].\n\nMnožstvo [goods] požadovaných [pop] sa zvyšuje s [development_with_icon|e] [Concept('location','lokalitou')|e], v ktorom žijú." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_pop_satisfaction: "Spokojnosť populácie"
 game_concept_pop_satisfaction_desc: "To je, ako spokojný je [Concept('pop','populácia')|e] so svojou životnou situáciou. Ovlplyvňujú to nasledujúce faktory:\n$BULLET_WITH_TAB$[Concept('estate_satisfaction','Spokojnosť stavu')|e]\n$BULLET_WITH_TAB$[Concept('unrest','Nepokoje')|e] [Concept('location','Lokalita')|e]\n$BULLET_WITH_TAB$Tolerancia [Concept('religion','náboženstvo')|e]\n$BULLET_WITH_TAB$Či je [Concept('accepted_culture','akceptovaná kultúra')|e] alebo nie\n$BULLET_WITH_TAB$Prístup k [Concept('pop_needs','potrebám populácie')|e]\n$BULLET_WITH_TAB$[Concept('market_price','Trhová cena')|e] za [Concept('pop_needs','potreby populácie')|e]\n$BULLET_WITH_TAB$[Concept('cultural_opinion','Kultúrny názor')|e] jeho [Concept('culture','kultúru')|e] voči [culture] [Concept('country','krajine')|e]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_average_satisfaction: "Priemerná spokojnosť" # todo: NEW TRANSLATION
 game_concept_average_satisfaction_desc: "Toto je priemerná [Concept('pop_satisfaction','spokojnosť populácie')|e] v [Concept('location','lokalite')|e]. Má negatívny vplyv na [Concept('prosperity','prosperitu')|e] a [Concept('control','kontrolu')|e] lokality." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_port: "Prístav" # todo: NEW TRANSLATION
 game_concept_ports: "Prístavy" # todo: NEW TRANSLATION
 game_concept_port_desc: "Prístav je pozemná [Concept('location','lokalita')|e] pri mori, ktorá má potenciál stavať a kotviť [Concept('ships','lode')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_colonial_migration: "Koloniálna migrácia" # todo: NEW TRANSLATION
 game_concept_colonial_migration_desc: "[Concept('colonial_migration','Koloniálna migrácia')|e] je, keď sa [Concept('pops','populácie')|e] [Concept('migrate','migrovať')|e] z [Concept('core','jadra')|e] [Concept('locations','lokalít')|e] do [Concept('colonial_charter','koloniálnej listiny')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_disease_resistance: "Odolnosť voči chorobám" # todo: NEW TRANSLATION
 game_concept_disease_resistance_desc: "Toto ovplyvňuje, aká je pravdepodobnosť, že [Concept('pops','populácie')|e] a [Concept('characters','postavy')|e] prežijú [Concept('diseases','choroby')|e], ako je [ShowDiseaseName('bubonic_plague')]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_migration_attraction: "Migračná príťažlivosť" # todo: NEW TRANSLATION
 game_concept_migration_attraction_desc: "Keď [Concept('pops','populácie')|e] žijú v [Concept('location','lokalite')|e] s negatívnou Priťažlivosťou migrácie, budú chcieť presunúť sa do [location] s najvyššou Priťažlivosťou migrácie v tom istom [Concept('market','trhu')|e]. Niektoré typy [Concept('pops','populácie')|e], ako [ShowPopTypeName('slaves')], sú trvale obmedzené z migrácie, zatiaľ čo iné, ako [ShowPopTypeName('peasants')], sa môžu presúvať len ak im to umožnia [Concept('estate_privileges','privilégiá stavov')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_migration: "Migrácia" # todo: NEW TRANSLATION
 game_concept_migrate: "Migrovať" # todo: NEW TRANSLATION
 game_concept_migrates: "Migrujú" # todo: NEW TRANSLATION
 game_concept_migrated: "Migrovali" # todo: NEW TRANSLATION
 game_concept_migration_desc: "[Concept('pops','Populácie')|e] sa budú presúvať z jednej [Concept('location','lokality')|e] do druhej, ak cítia, že by mali lepší život. Pops z niektorých [Concept('estates','stavov')|e] nemusia mať povolené slobodne migrovať, v závislosti od [Concept('estate_privileges','privilégií stavov')|e], ktoré [Concept('country','krajín')|e] mohla vyhlásiť. Pops obyčajne migrujú len v rámci toho istého [Concept('market','trhu')|e], pokiaľ nemigrujú do [Concept('colonial_charter','koloniálnej listiny')|e], alebo v dôsledku [Concept('event','udalosti')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_unrest: "Nepokoje" # todo: NEW TRANSLATION
 game_concept_unrest_desc: "Je to hodnota, ktorá negatívne ovplyvňuje [Concept('pop_satisfaction','spokojnosť populácie')|e] [Concept('pops','populácií')|e] v určitej [Concept('location','lokalite')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_truce: "Prímerie" # todo: NEW TRANSLATION
 game_concept_truce_desc: "Prímerie sa vytvorí automaticky, keď sa medzi dvoma [Concept('countries','krajinou')|e] podpíše [Concept('peace_treaty','mierová dohoda')|e]. Vyhlásiť [Concept('war','vojna')|e] proti niekomu, s kým máme prímierie, bude mať vážne sankcie. Niektoré diplomatické akcie môžu byť voči štátom, s ktorými máme prímierie, úplne zablokované." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_trait: "Vlastnosť" # todo: NEW TRANSLATION
 game_concept_traits: "Vlastnosti" # todo: NEW TRANSLATION
 game_concept_trait_upper_desc: "Vlastnosti definujú osobnosť a správanie [Concept('character','postava')|e] v rôznych situáciách. Rôzne typy $game_concept_traits$ možno získať pri plnení špecifických [Concept('roles','rolách')|e], ale $game_concept_character$ využije len tie $game_concept_traits$, ktoré sú relevantné pre jeho aktuálnu rolu.\n\n" # todo: CHANGED # todo: CONCEPT CASE
 game_concept_trait_desc: "$game_concept_trait_upper_desc$" # todo: NEW TRANSLATION
 game_concept_ruler_trait: "Vlastnosť panovníka" # todo: NEW TRANSLATION
 game_concept_ruler_traits: "Vlastnosti panovníka" # todo: NEW TRANSLATION
 game_concept_ruler_trait_desc: "Vlastnosť panovníka je typ [Concept('trait','vlastnosť')|e], ktorý je aktívny len keď je [Concept('character','postava')|e] [Concept('ruler','panovníka')|e] alebo [Concept('regent','regent')|e].\n\nPostava môže počas vládnutia získať až tri $game_concept_ruler_traits$." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_general_trait: "Vlastnosť generála" # todo: NEW TRANSLATION
 game_concept_general_traits: "Vlastnosti generála" # todo: NEW TRANSLATION
 game_concept_general_trait_desc: "Vlastnosť generála je typ [Concept('trait','vlastnosť')|e], ktorý je aktívny len keď je [Concept('character','postava')|e] [Concept('general','generála')|e].\n\nPostava môže počas vedenia pozemných [Concept('battles','bitky')|e] získať maximálne jednu vlastnosť generála." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_admiral_trait: "Vlastnosť admirála" # todo: NEW TRANSLATION
 game_concept_admiral_traits: "Vlastnosti admirála" # todo: NEW TRANSLATION
 game_concept_admiral_trait_desc: "Vlastnosť admirála je typ [Concept('trait','vlastnosť')|e], ktorý je aktívny len keď je [Concept('character','postava')|e] [Concept('admiral','admirála')|e].\n\nPostava môže počas vedenia námorných [Concept('battles','bitiek')|e] získať maximálne jednu vlastnosť admirála." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_explorer_trait: "Vlastnosť prieskumníka" # todo: NEW TRANSLATION
 game_concept_explorer_traits: "Vlastnosti prieskumníka" # todo: NEW TRANSLATION
 game_concept_explorer_trait_desc: "Vlastnosť prieskumníka je typ [Concept('trait','vlastnosť')|e], ktorý je aktívny len keď je [Concept('character','postava')|e] [Concept('explorer','prieskumníka')|e].\n\nPostava môže počas vedenia [Concept('exploration','prieskumu')|e] získať maximálne jednu vlastnosť prieskumníka." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_artist_trait: "Vlastnosť umelca" # todo: NEW TRANSLATION
 game_concept_artist_traits: "Vlastnosti umelca" # todo: NEW TRANSLATION
 game_concept_artist_trait_desc: "Vlastnosť umelca je typ [Concept('trait','vlastnosť')|e], ktorý je aktívny len keď je [Concept('character','postava')|e] [Concept('artist','umelca')|e].\n\nKaždému umelcovi je jeho vlastnosť priradená pri jeho vzniku ako $game_concept_character$." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_child_trait: "Vlastnosť dieťaťa" # todo: NEW TRANSLATION
 game_concept_child_traits: "Vlastnosti dieťaťa" # todo: NEW TRANSLATION
 game_concept_child_trait_desc: "Každé [Concept('child','dieťa')|e] a [Concept('adolescent','dorastenec')|e] má počas rastu jednu vlastnosť dieťaťa, ktorá sa odstráni po dosiahnutí dospelosti. Vlastnosti dieťaťa ovplyvňujú rýchlosť, akou zvyšujú svoje [Concept('abilities','schopnosti')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_religious_figure_trait: "Vlastnosť náboženskej osobnosti" # todo: NEW TRANSLATION
 game_concept_religious_figure_traits: "Vlastnosti náboženských osobností" # todo: NEW TRANSLATION
 game_concept_religious_figure_trait_desc: "Vlastnosť náboženskej osobnosti je typ [Concept('trait','vlastnosť')|e], ktorý je aktívny len keď je [Concept('character','postava')|e] [Concept('religious_figure','náboženského predstaviteľa')|e].\n\nPostava s vlastnosťou náboženskou osobnosti môže dať posilnenie [Concept('country','krajina')|e], ktorý ich zamestná." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_health_trait: "Zdravotná vlastnosť" # todo: NEW TRANSLATION
 game_concept_health_traits: "Zdravotné vlastnosti" # todo: NEW TRANSLATION
 game_concept_health_trait_short: "Zdravie" # todo: NEW TRANSLATION
 game_concept_health_trait_desc: "A $game_concept_health_trait$ je typ [Concept('trait','vlastnosť')|e], ktorý odráža zdravotný stav (alebo nezdravie) [Concept('character','postava')|e].\n\nPostava môže počas života získať ľubovoľný počet $game_concept_health_traits$.\n\nMôžu byť nadobudnuté z rôznych zdrojov, ako sú [Concept('events','udalosti')|e], [Concept('diseases','choroby')|e] alebo [Concept('battle','bitka')|e]. Niektoré $game_concept_health_traits$ môžu postihnúť postavu už pri narodení.\n\nVlastnosti získané z bitky majú väčšiu pravdepodobnosť v závislosti od počtu priateľských obetí." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_cabinet_trait: "Vlastnosť kabinetu" # todo: NEW TRANSLATION
 game_concept_cabinet_traits: "Vlastnosti kabinetu" # todo: NEW TRANSLATION
 game_concept_cabinet_trait_desc: "A $game_concept_cabinet_trait$ je typ [Concept('trait','vlastnosť')|e], ktorý je aktívny len pokiaľ je [Concept('character','postava')|e] [Concept('cabinet_member','člena kabinetu')|e].\n\nPostava s vlastnosťou kabinetu môže poskytnúť posilnenie [Concept('country','krajina')|e], ktorá ho zamestná.\n\nEfekty $game_concept_cabinet_trait$ sa zdvojnásobia, ak je charakter povýšený na [Concept('head_of_the_cabinet','predsedu kabinetu')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_fortification: "Opevnenie" # todo: NEW TRANSLATION
 game_concept_fortifications: "Opevnenia" # todo: NEW TRANSLATION
 game_concept_fort: "Pevnosť" # todo: NEW TRANSLATION
 game_concept_forts: "Pevnosti" # todo: NEW TRANSLATION
 game_concept_fortification_desc: "Sú to obranné [Concept('buildings','budovy')|e] navrhnuté na ochranu vlastné [Concept('locations','lokality')|e] [Concept('country','krajiny')|e] proti [Concept('enemy','vojnovému nepriateľovi')|e] [Concept('armies','armádam')|e]. [Location] s pevnosťou nemôže byť okamžite [Concept('sieged','obliehaný')|e], namiesto toho vyžaduje dlhodobé [siege]. Niektoré [Concept('advances','pokroky')|e] umožňujú stavať efektívnejšie pevnosti, pričom každá úroveň zvyšuje náročnosť [siege], potrebného na ich [Concept('occupy','okupovať')|e].\n\nPevnosti majú [Concept('zone_of_control','zóna kontroly')|e] nad susednými [locations].\n\nPevnosti majú náklady na [fort_maintenance_with_icon|e], ktoré idú priamo do [treasury] krajiny a závisia od cien [goods] na ich [Concept('market','trh')|e]. Všetky [countries] majú [fort_limit] počtu pevností, ktoré môžu efektívne udržiavať; jeho prekročenie zvyšuje [fort_maintenance] výrazne." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_fort_limit: "Limit pevností" # todo: NEW TRANSLATION
 game_concept_fort_limit_desc: "Hodnota $game_concept_fort_limit$ [country_with_icon|e] predstavuje jej schopnosť udržiavať [fortifications_with_icon|e] bez preťažovania administratívy. Krajina môže prekročiť svoj Fort Limit, avšak takéto prekročenie bude spôsobovať postupne vyššie náklady na [fort_maintenance_with_icon|e].\n\nLimit pevností sa zvyšuje predovšetkým s počtom vlastnených [locations_with_icon|e], ale aj s [country_rank_with_icon|e] a počtom [locations] s [ShowLocationRankName('city')] [Concept('location_rank','rangom lokality')|e]. [ShowSocietyDirectionName('defensive')] [societal_value_with_icon|e] a niektoré [advances_with_icon|e] ho tiež môžu zvýšiť." # todo: CHANGED # todo: CONCEPT CASE
 game_concept_zone_of_control: "Zóna kontroly" # todo: NEW TRANSLATION
 game_concept_zones_of_control: "Zóny kontroly" # todo: NEW TRANSLATION
 game_concept_zone_of_control_desc: "Zóna kontroly predstavuje obranné schopnosti [Concept('fortification','opevnenie')|e] blokovať pohyb [Concept('enemy','vojnový nepriateľ')|e] [Concept('armies','armád')|e] cez [Concept('locations','lokality')|e] susediace s ňou. Vpadnuté [army], stojace na [enemy] [location] susediacej s [enemy] [fort], musia najprv [Concept('siege','obliehanie')|e] ten [fort], než sa môžu pohnúť ďalej do ktorejkoľvek inej susednej [location] tohto [fort].\n\nPriateľská zóna kontroly tiež chráni [armies] pred lokálnymi zdrojmi [Concept('attrition','vyčerpaním')|e], vrátane [Concept('winter','zima')|e]. Táto ochrana sa vzťahuje aj na pevnosti vlastnené vašimi priamymi [Concept('subjects','vazalmi')|e] a na vášho priameho [overlord|e]." # todo: CHANGED # todo: CONCEPT CASE
 game_concept_role: "Rola" # todo: NEW TRANSLATION
 game_concept_roles: "Roly" # todo: NEW TRANSLATION
 game_concept_role_list_title: "Zoznam rolí" # todo: NEW TRANSLATION
 game_concept_role_list: "[Concept('ruler','Panovník')|e]\n[Concept('regent','Regent')|e]\n[Concept('cabinet_member','Člen kabinetu')|e]\n[Concept('general','Generál')|e]\n[Concept('admiral','Admirál')|e]\n[Concept('explorer','Prieskumník')|e]\n[Concept('artist','Umelec')|e]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_role_desc: "Roly sú rôzne pozície, ktoré môže dospelý [Concept('character','postava')|e] zaujímať v [Concept('country','krajine')|e]. [Abilities|e] Postava budú mať rôzne účinky podľa jeho Role a budú môcť získať rôzne [Concept('traits','vlastnosti')|e].\n\nNormálne môže $game_concept_character$ vykonávať len jednu rolu naraz, ale niekedy môžu [Concept('rulers','panovníci')|e] a [Concept('regents','regenti')|e] pôsobiť aj ako [Concept('generals','generáli')|e] alebo [Concept('admirals','admiráli')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_regent: "Regent" # todo: NEW TRANSLATION
 game_concept_regents: "Regenti" # todo: NEW TRANSLATION
 game_concept_regent_desc: "Toto je [Concept('character','postava')|e], ktorý pôsobí ako [Concept('ruler','panovník')|e] [Concept('country','krajiny')|e] počas [Concept('regency','regentstva')|e]." # todo: CHANGED # todo: CONCEPT CASE
 game_concept_commander: "Veliteľ" # todo: NEW TRANSLATION
 game_concept_commanders: "Velitelia" # todo: NEW TRANSLATION
 game_concept_commander_desc: "Veliteľ je [Concept('admiral','admirál')|e] alebo [Concept('general','generál')|e] zodpovedný za [Concept('unit','jednotku')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_admiral: "Admirál" # todo: NEW TRANSLATION
 game_concept_admirals: "Admiráli" # todo: NEW TRANSLATION
 game_concept_admiral_desc: "Toto je [Concept('character','postava')|e], ktorému bola pridelená rola vedenia [Concept('navy','námorníctva')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_general: "Generál" # todo: NEW TRANSLATION
 game_concept_generals: "Generáli" # todo: NEW TRANSLATION
 game_concept_general_desc: "Toto je [Concept('character','postava')|e], ktorému bola pridelená rola vedenia [Concept('army','armády')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_artistic_skill: "Umelecká zručnosť" # todo: NEW TRANSLATION
 game_concept_artistic_skill_desc: "Táto zručnosť má najväčší vplyv na [Concept('art_quality','kvalitu umenia')|e] [Concept('work_of_art','umelecké dielo')|e], ktoré môže vytvoriť [Concept('artist','umelec')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_artist_salary: "Plat umelca" # todo: NEW TRANSLATION
 game_concept_artist_salary_desc: "Množstvo [Concept('gold','dukáty')|e], ktoré [Concept('artist','umelec')|e] zarobí." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_merchant: "Obchodník" # todo: NEW TRANSLATION
 game_concept_merchants: "Obchodníci" # todo: NEW TRANSLATION
 game_concept_merchant_desc: "Obchodníci sú spoločnosti lojálne [Concept('country','krajina')|e], prítomné v [Concept('market','trhu')|e], ktoré môžu využiť svoj [Concept('merchant_power','neobchodnú výhodu')|e] a [Concept('merchant_capacity','obchodná kapacita')|e] na [Concept('trade','obchod')|e] [Concept('goods','tovary')|e] s iným [Concept('market','trhom')|e] v nádeji na zisk." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_merchant_power: "Obchodná výhoda" # todo: NEW TRANSLATION
 game_concept_merchant_power_desc: "Obchodná výhoda [Concept('countries','krajiny')|e] v [Concept('market','trhu')|e] určuje, kto bude schopný mať svoje [Concept('exports','vývozy')|e] uspokojené ako prvý.\n\nAk je v trhu obmedzené množstvo [Concept('supply','ponuka')|e] [Concept('goods','tovarov')|e], sú rozdelené podľa neobchodnej výhody, ktorý má každá [Concept('country','krajiny')|e] v tom trhu." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_merchant_capacity: "Obchodná kapacita" # todo: NEW TRANSLATION
 game_concept_merchant_capacity_desc: "Toto predstavuje, koľko môže [Concept('country','krajina')|e] [Concept('export','vývozu')|e] a/alebo [Concept('import','dovoz')|e] z [Concept('market','trhu')|e].\n\nKaždý [Concept('trade','obchod')|e] vytvorený z tohto [market] používa [merchant_capacity] v závislosti od vzdialenosti k druhému [market] a objemu [Concept('goods','tovarov')|e], ktoré ten [trade] vykonáva." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_merchant_maintenance: "Údržba obchodnej trasy" # todo: NEW TRANSLATION
 game_concept_merchant_maintenance_desc: "Toto predstavuje náklady na nadviazanie [Concept('trades','obchody')|e] medzi [Concept('markets','trhmi')|e]. Obchodovanie nie je zadarmo, lode, povozy a karavány treba udržiavať a obchodníkov zaplatiť.\n\nNáklady na obchod stúpajú s vzdialenosťou a ovplyvňujú ich aj [Concept('sound_tolls','prieplavné mýta')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_subject_taxation: "Zdanenie vazalov" # todo: NEW TRANSLATION
 game_concept_subject_taxation_desc: "Zdanenie vazalov je [Concept('gold','dukáty')|e], ktoré [Concept('overlord','suzerén')|e] dostáva od svojich [Concept('subjects','vazalov')|e]. Presné množstvo závisí od ekonomiky [subject] a je potom upravené pravidlami v [Concept('subject_type','druhu vazala')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_subject_territory_connectivity: "Prepojenosť územia subjektu" # todo: NEW TRANSLATION
 game_concept_subject_territory_connectivity_desc: "Prepojenosť územia subjektu (Subject Territory Connectivity) meria, ako dobre je územie [Concept('subject','vazala')|e] prepojené s jeho [overlord|e], hodnotené od 0 do 100.\n\nPozemné spojenie začína na 100 a stráca body za každú oblasť, ktorou vedie cesta, na základe toho, aká nízka je jej priemerná [Concept('control','kontrola')|e]. Oblasti s úplnou kontrolou nič nestojí; oblasti bez kontroly znižujú skóre až o 20 za oblasť.\n\nNámorné spojenie sa hodnotí z troch zložiek: [Concept('maritime_presence','námornej prítomnosti')|e] v odchodnom prístave subjektu, námorná vzdialenosť medzi prístavmi a [Concept('maritime_presence','námorná prítomnosť')|e] v prístave príchodu overlorda. [Concept('subject_type','Druh vazala')|e] môže zvýšiť alebo znížiť tolerovanú vzdialenosť trasy.\n\nŽiadne spojenie má skóre 0.\n\nVyššia prepojenosť zvyšuje jeho [Concept('subject_loyalty','vernosti vazala')|e]." # todo: CHANGED # todo: CONCEPT CASE
 game_concept_subject_loyalty: "Vernosť vazala" # todo: NEW TRANSLATION
 game_concept_subject_loyalty_desc: "Každý [Concept('subject','vazal')|e] má voči svojmu [overlord|e] určité [Concept('subject_loyalty','vernosť vazala')|e]. Pohybuje sa od 0 do 100; keď klesne pod 50, [subject] sa stane [Concept('disloyal_subject','nelojálny vazal')|e].\n\nJej hodnotu priamo ovplyvňuje [Concept('liberty_desire','túžba po slobode')|e] a môže byť ďalej znížená [ShowCabinetActionName('sow_disloyalty')] [Concept('cabinet_action','akcia kabinetu')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_subject_type: "Druh vazala" # todo: NEW TRANSLATION
 game_concept_subject_types: "Druhy vazalov" # todo: NEW TRANSLATION
 game_concept_subject_type_desc: "Každý [Concept('subject','vazal')|e] má Typ vazala, ktorý v podstate definuje pravidlá, ktorým musí podliehať v otázkach ako [Concept('war','vojna')|e] a [Concept('heir_selection','nástupnícke právo')|e].\n\nTypy vazalov tiež určujú [Concept('subject_taxation','zdanenie vazalov')|e] a [Concept('great_power_score','skóre veľmoci $game_concept_great_power_score_short$')|e], ktoré musí každý [subject] odovzdať svojmu [overlord|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_subject: "Vazal" # todo: NEW TRANSLATION
 game_concept_subjects: "Vazali" # todo: NEW TRANSLATION
 game_concept_subjugate: "Podrobenie" # todo: NEW TRANSLATION
 game_concept_subjugated: "Podrobený" # todo: NEW TRANSLATION
 game_concept_subject_desc: "[Subject] je akýkoľvek [Concept('country','krajina')|e], ktorý je podriadený [Concept('overlord','suzerén')|E].\n\nZvyčajne má obmedzenia v [Concept('diplomacy','diplomacii')|e] výmenou za ochranu v [Concept('war','vojne')|e].\n\nVazali môžu tiež znášať [Concept('subject_taxation','zdanenie vazalov')|e] a určitú časť svojho [great_power_score|e] musí odovzdať svojmu [overlord]. Okrem toho sazavala nemôže stať [Concept('great_power','veľmoc')|e]. Presné pravidlá závisia od [Concept('subject_type','druhu vazala')|e].\n\nVazali majú [Concept('subject_loyalty','vernosť vazala')|e] voči svojmu [overlord] a [Concept('liberty_desire','túžba po slobode')|e] – oboje znázorňuje ich postoj k podriadeniu, napríklad či sú [Concept('loyal_subjects_short','lojálni')|e] alebo [Concept('disloyal_subjects_short','nelojálni')|e].\n\nAkýkoľvek vazal môže zase byť [overlord] iných [countries], čo umožňuje dlhé reťazce vzťahov Poddaný–Suzerén.\n\nNiektorí vazali sú [Concept('non_sovereign_subjects','nesuverénni vazali')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_non_sovereign_subject: "Nesuverénny vazal" # todo: NEW TRANSLATION
 game_concept_non_sovereign_subjects: "Nesuverénni vazali" # todo: NEW TRANSLATION
 game_concept_non_sovereign_subject_desc: "Nesuverénny vazal je typ [Concept('subject','vazal')|e], ktorý nemôže konať nezávisle od svojho [overlord|e] a má preto obmedzenú kapacitu viesť [Concept('diplomacy','diplomacia')|e] a nemôže samostatne viesť [Concept('wars','vojny')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_overlord: "Suzerén" # todo: NEW TRANSLATION
 game_concept_overlords: "Suzeréni" # todo: NEW TRANSLATION
 game_concept_direct_overlord: "Priamy suzerén" # todo: NEW TRANSLATION
 game_concept_overlord_desc: "Suzerén je [Concept('country','krajina')|e], ktorý má akýkoľvek počet [Concept('subjects','vazali')|E] ako svojich poddaných.\n\nVýmenou za ochranu každého [subject] v [Concept('wars','vojnách')|e] zvyčajne dostáva [Concept('subject_taxation','zdanenie vazalov')|e] a požaduje určitú časť [subject] [great_power_score|e]. Presné pravidlá závisia od [Concept('subject_type','druhu vazala')|e] každého [subject].\n\nKaždý suzerén môže byť sám [subject] iných [countries], čo umožňuje dlhé reťazce vzťahov [subject]–Suzerén." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_liberty_desire: "Túžba po slobode" # todo: NEW TRANSLATION
 game_concept_liberty_desire_desc: "Túžba po slobode predstavuje aktuálne úsilie [Concept('subject','vazal')|e] o nezávislosť od jeho [overlord|e] a ovplyvňuje [Concept('subject_loyalty','vernosť vazala')|e].\n\nJej hodnota sa pohybuje od -100 do +100, pričom má mesačný úbytok smerom k 0.\n\nHodnota sa tiež používa ako mena v niektorých interakciách so subjektmi." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_societal_value: "Sociálna hodnota" # todo: NEW TRANSLATION
 game_concept_societal_values: "Sociálne hodnoty" # todo: NEW TRANSLATION
 game_concept_societal_value_upper_desc: "Sociálne hodnoty definujú sociálnu a politickú štruktúru [Concept('country','krajinu')|e], zvyky jeho ľudu a charakteristiky jeho právneho orgánu. Ich efekty môžu výrazne ovplyvniť spôsob hrania krajiny a niektoré pokročilé [Concept('government_reforms','vládne reformy')|e] vyžadujú konkrétne kombinácie [societal_values] na prijatie. Sociálne hodnoty tiež zohrávajú dôležitú úlohu v [Concept('diplomacy','diplomacii')|e], pretože [countries] s afinnými Sociálnymi hodnotami budú mať tendenciu mať vyššie [Concept('opinion','názor')|e] o sebe navzájom.\n\nKaždá Sociálna hodnota je os s dvoma opačnými pólmi, ktoré môžu dosiahnuť až 100. Postavenie krajiny na osi je primárne ovplyvnené [Concept('laws','zákony')|e], [Concept('estate_privileges','privilégiá stavov')|e] a [Concept('cabinet_actions','akcie kabinetu')|e], a pomaly sa v priebehu času posúva smerom k jednému z pólov. Pokrok smerom k jednému pólu sa však zastaví na maxime, ktoré je určené celkovým množstvom faktorov tlačiacich ho tým smerom. Čím vyššia Sociálna hodnota, tým viac faktorov je potrebných na jej ďalší posun." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_societal_value_list_title: "Zoznam sociálnych hodnôt" # todo: NEW TRANSLATION
 game_concept_societal_value_desc: "$game_concept_societal_value_upper_desc$\n\n[ShowDatabase('societal_values')]" # todo: NEW TRANSLATION
 game_concept_religious_head: "Náboženský vodca" # todo: NEW TRANSLATION
 game_concept_pope: "Pápež" # todo: NEW TRANSLATION
 game_concept_religious_head_desc: "Je to [Concept('character','postava')|e], ktorý je považovaný za osobu na čele a za zástupcu celej denominácie [Concept('religion','náboženstvo')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_excommunication: "Exkomunikácia" # todo: NEW TRANSLATION
 game_concept_excommunications: "Exkomunikácie" # todo: NEW TRANSLATION
 game_concept_excommunicate: "Exkomunikovať" # todo: NEW TRANSLATION
 game_concept_excommunicates: "Exkomunikuje" # todo: NEW TRANSLATION
 game_concept_excommunicated: "Exkomunikovaný" # todo: NEW TRANSLATION
 game_concept_excommunication_desc: "Exkomunikácia je medzinárodný status [Concept('ruler','panovník')|e] s vážnymi náboženskými a diplomatickými penáliami. Všetky [Concept('countries','krajiny')|e] rovnakého [Concept('religion','náboženstva')|e] získajú [ShowBiasValue('opinion_excommunicated')|+=0] [Concept('opinion','názor')|e] exkomunikovanej [country] a [ShowCasusBelliName('cb_excommunication')] [Concept('casus_belli','casus Belli')|e] proti nej. Okrem toho exkomunikovaná [country] dostane nasledujúce penalizácie až do nasledujúceho panovníka:\n[ShowModifierEffect('excommunicated')]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_karma: "Karma" # todo: NEW TRANSLATION
 game_concept_karma_i: "@karma!" # todo: NEW TRANSLATION
 game_concept_karma_desc: "Karma je meraná na škále od #R -100#! do #R +100#! a odráža minulé činy [Concept('country','krajina')|e].\nKrajina bude mať najväčší úžitok, keď je jej karma v rovnováhe, medzi #G -33#! a #G +33#!." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_pious: "Pobožný" # todo: NEW TRANSLATION
 game_concept_purity: "Čistota" # todo: NEW TRANSLATION
 game_concept_purity_i: "@purity!" # todo: NEW TRANSLATION
 game_concept_purity_desc: "Je to ukazovateľ, do akej miery je naša [Concept('country','krajina')|e] čistá podľa [ShowReligionName('shinto')]. Čistota sa stráca kontaktom s čímkoľvek nečistým, ako sú zabíjania a straty [Concept('people','ľudia')|e] v [Concept('battles','bitkách')|e], alebo epidémie, pretože smrť a krv sú nečisté. Získava sa vykonávaním náboženských úkonov, ako sú púte na [Concept('holy_sites','sväté miesta')|e] alebo rituálne samovraždy." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_honor: "Česť" # todo: NEW TRANSLATION
 game_concept_honor_i: "@honor!" # todo: NEW TRANSLATION
 game_concept_honor_desc: "Ako čestná je naša [Concept('country','krajina')|e] v očiach nášho ľudu.\n\nUdržiavanie [Concept('purity','čistota')|E] krajiny nad 75 zvýši našu [Concept('honor','česť')|E], zatiaľ čo nízka čistota ju zníži.\n\nĎalšie náboženské a diplomatické činy ju tiež môžu ovplyvniť." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_yanantin: "Yanantin" # todo: NEW TRANSLATION
 game_concept_yanantin_i: "@yanantin!" # todo: NEW TRANSLATION
 game_concept_yanantin_desc: "Yanantin predstavuje rovnováhu medzi dvoma komplementárnymi, ale protichodnými entitami. Podľa zmýšľania [ShowCultureGroupName('andean_group')] [Concept('cultures','kultúry')|e] možno harmóniu dosiahnuť len keď bytosť, muž, tma, Slnko nájde svoj doplnok a spojí sa s ním — žena, svetlo, Mesiac." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_righteousness: "Spravodlivosť" # todo: NEW TRANSLATION
 game_concept_righteousness_i: "@righteousness!" # todo: NEW TRANSLATION
 game_concept_righteousness_desc: "Spravodlivosť je miera toho, do akej miery je vláda vnímaná ako nasledujúca filozofiu a morálku $SECT_CONFUCIANISM_NAME$." # todo: NEW TRANSLATION
 game_concept_harmony: "Harmónia" # todo: NEW TRANSLATION
 game_concept_harmony_i: "@harmony!" # todo: NEW TRANSLATION
 game_concept_harmony_desc: "Harmónia je miera toho, ako dobre [Concept('country','krajina')|e] nasleduje princípy Dào, pričom musí vyvážiť vplyv [GetAutoModifier('negative_harmony').GetNameWithTooltip] alebo [GetAutoModifier('positive_harmony').GetNameWithTooltip]. Krajina bude dostávať mnohé efekty, ktoré ju posúvajú jedným či druhým smerom, hlavne cez [Concept('events','udalosti')|e], a mala by sa snažiť udržať [GetAutoModifier('balanced_harmony').GetNameWithTooltip]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_self_control: "Sebakontrola" # todo: NEW TRANSLATION
 game_concept_self_control_i: "@self_control!" # todo: NEW TRANSLATION
 game_concept_self_control_desc: "Sebakontrola (Self Control) je miera toho, do akej miery sa [Concept('country','krajinu')|e] a jeho [Concept('ruler','panovníka')|e] vzdávajú potešení a materiálnych vecí a nasledujú cestu jógy.\n\nPozitívna hodnota $self_control$ znamená, že inklinujú k asketizmu, čo prináša výhody k [Concept('stability','stabilite')|e], [Concept('migration','migrácii')|e], [Concept('annexation','anexii')|e] a zníženú [Concept('food_consumption','dennú spotrebu potravín')|e], zatiaľ čo negatívne $self_control$ znamená, že inklinujú k zvrhlosti, čo prináša zvýšené [Concept('tax','daň')|e] a [Concept('food_consumption','denná spotreba potravín')|e], ale znížené [Concept('war_exhaustion','vojnová vyčerpanosť')|e]. Vyvážené $self_control$ zase prináša lepšiu rýchlosť [Concept('research','výskum')|e], [Concept('prestige','prestíž')|e] a [Concept('estate_satisfaction','spokojnosť stavu')|e]." # todo: CHANGED # todo: CONCEPT CASE
 game_concept_doom: "Záhuba" # todo: NEW TRANSLATION
 game_concept_doom_i: "@doom!" # todo: NEW TRANSLATION
 game_concept_doom_desc: "Doom je špeciálna mena používaná [Concept('countries','krajiny')|e] s [ShowReligionAdjective('nahuatl')] [Concept('religion','náboženstvom')|e].\n\nVlastnenie [Concept('locations','lokalitami')|e] — najmä [Concept('towns_and_cities','mestské lokality')|e] — pasívne zvyšuje Doom.\n\nVysoká hodnota Doom znižuje [ShowModifierTypeName('subject_loyalty')] a [ShowModifierTypeName('global_estate_target_satisfaction')], ale zvyšuje [ShowModifierTypeName('stability_decay')].\n\nExistuje niekoľko spôsobov, ktoré Doom znižujú, vrátane:\n- Zabíjania [Concept('enemy','vojnového nepriateľa')|e] jednotiek v [Concept('combat','boji')|e]\n- Lúpeží [locations] s vysokým [Concept('development','rozvojom')|e]\n\nKeď je konečne dosiahnutý maximálny Doom, [Concept('ruler','panovník')|e] a ich celá [Concept('dynasty','dynastia')|e] sú obetovaní a nahradení novým [ruler]." # todo: CHANGED # todo: CONCEPT CASE
 game_concept_religious_reform: "Náboženská reforma" # todo: NEW TRANSLATION
 game_concept_religious_reform_desc: "Náboženská reforma je niekedy potrebná alebo vítaná pre lepší osud [Concept('religion','náboženstvo')|e], predstavuje neustále prispôsobovanie obradov a viery v dôsledku túžob veriacich a inštitúcií." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_patriarch: "Patriarcha" # todo: NEW TRANSLATION
 game_concept_patriarchs: "Patriarchovia" # todo: NEW TRANSLATION
 game_concept_patriarch_desc: "Patriarchovia sú najvyššie postavení biskupi v niektorých [ShowReligionGroupAdjective('christian')] [Concept('religions','náboženstvách')|e]. V každom [religion] ich môže byť viac než jeden, pričom vládnu nad vlastným patriarchátom." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_religious_influence: "Náboženský vplyv" # todo: NEW TRANSLATION
 game_concept_religious_influence_i: "@religious_influence!" # todo: NEW TRANSLATION
 game_concept_religious_influence_desc: "Je to hodnota schopnosti, ktorú má [Concept('country','krajina')|e] na interakciu s a ovplyvňovanie záležitostí svojej [Concept('primary_religion','hlavnému náboženstvu')|e]. V závislosti od [Concept('religion','náboženstva')|e] sa líšia jej použitia aj spôsoby, akými ju môže [country] nadobudnúť." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_papal_bull: "Pápežská bula" # todo: NEW TRANSLATION
 game_concept_papal_bulls: "Pápežské buly" # todo: NEW TRANSLATION
 game_concept_papal_bull_desc: "Pápežská bula je medzinárodný edikt vydaný s použitím [Concept('gold','dukátmi')|e], ktorý ovplyvňuje všetky [Concept('countries','krajiny')|e] [ShowReligionAdjective('catholic')] [Concept('religion','náboženstvo')|e]. Zatiaľ čo niektoré pápežské buly majú [Concept('effects','efekty')|e] a prijatý [Concept('law','zákon')|e], všetky pápežské buly majú [Concept('modifiers','modifikátory')|e] pre krajiny, ktorých efektivita sa škáluje podľa [Concept('papal_authority','pápežskej autority')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_papal_authority: "Pápežská autorita" # todo: NEW TRANSLATION
 game_concept_papal_authority_desc: "Pápežská autorita (Papal Authority) je miera toho, ako je [Concept('pope','pápež')|e] rešpektovaný a uznávaný. Je to [Concept('international_organization_variable','hodnota medzinárodnej organizácie')|e] [GetInternationalOrganizationType('catholic_church').GetName], s mesačnými zmenami ovplyvňovanými: [Concept('reform_desire','túžbou po reforme')|e], vnútorným mierom, doktrínami, [Concept('cardinals','kardinálmi')|e], [Concept('excommunications','exkomunikáciami')|e] a ďalšími faktormi.\n$PA_TOOLTIP_THRESHOLDS$" # todo: CHANGED # todo: CONCEPT CASE
 game_concept_religious_war: "Náboženská vojna" # todo: NEW TRANSLATION
 game_concept_crusade: "Križiacka výprava" # todo: NEW TRANSLATION
 game_concept_jihad: "$jihad$" # todo: NEW TRANSLATION
 game_concept_religious_war_desc: "Náboženskú vojnu vyhlasuje [Concept('international_organization','medzinárodná organizácia')|e] krajín rovnakej viery voči [Concept('heathen','neznabohovi')|e] krajine. Najznámejšími príkladmi v hre sú #Y Krížové výpravy#! a #Y Jihady#! [ShowReligionGroupAdjective('christian')] a [ShowReligionGroupAdjective('muslim')] [Concept('religions','náboženstvá')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_religious_school: "Náboženská škola" # todo: NEW TRANSLATION
 game_concept_religious_schools: "Náboženské školy" # todo: NEW TRANSLATION
 game_concept_religious_school_desc: "Sväté písmo môže byť neomylné, ale vznikli rôzne školy názorov o tom, ako najlepšie zosúladiť zákony a normy s ním.\nKtorú školu [Concept('country','krajinu')|e] nasleduje, ovplyvní jeho ďalšiu cestu." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_religious_faction: "Náboženská frakcia" # todo: NEW TRANSLATION
 game_concept_religious_factions: "Náboženské frakcie" # todo: NEW TRANSLATION
 game_concept_religious_faction_desc: "Sú to rôzne organizácie v rámci jednej [Concept('religion','náboženstva')|e], predstavujúce rôzne prúdy myslenia v nej. Budú medzi sebou súperiť o priazeň [Concept('country','krajiny')|e], a samotná [country] s nimi môže interagovať a získavať rôzne výhody." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_religious_focus: "Náboženské zameranie" # todo: NEW TRANSLATION
 game_concept_religious_focuses: "Náboženské zamerania" # todo: NEW TRANSLATION
 game_concept_religious_focus_desc: "Niektoré [Concept('religions','náboženstvá')|e] majú atribúty, na ktoré sa môže [Concept('country','krajina')|e] zamerať, aby získala dodatočné výhody. Keď sa dokončí dostatok zameraní, [religion] sa môže reformovať." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_religious_aspect: "Náboženský aspekt" # todo: NEW TRANSLATION
 game_concept_religious_aspects: "Náboženské aspekty" # todo: NEW TRANSLATION
 game_concept_religious_aspect_desc: "Niektoré [Concept('religions','náboženstvá')|e] majú aspekty, ktoré ďalej špecializujú detaily každej [Concept('country_s','krajinnej')|e] verzie [Concept('religion','náboženstvo')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_location_rank: "Rang lokality" # todo: NEW TRANSLATION
 game_concept_location_rank_desc: "Každá [Concept('location','lokalita')|e] má poradie (rank), ktoré možno opísať ako [Concept('urban_location','mestská lokalita')|e] alebo [Concept('rural_location','vidiecka lokalita')|e].\n\n[ShowDatabaseWithIcon('location_rank')]" # todo: CHANGED # todo: CONCEPT CASE
 game_concept_original_location_rank: "Pôvodné hodnotenie lokality" # todo: NEW TRANSLATION
 game_concept_original_location_rank_desc: "Hodnosť [Concept('location_rank','rang lokality')|e], ktorú mal každý [Concept('location','lokalita')|e] na začiatku kampane.\n\n[ShowDatabase('original_location_rank')]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_corridor: "Koridor" # todo: NEW TRANSLATION
 game_concept_corridors: "Koridory" # todo: NEW TRANSLATION
 game_concept_corridor_desc: "Koridory sú špeciálne [Concept('locations','lokality')|e], ktoré nemôže obývať ani [Concept('own','vlastniť')|e] žiadna [Concept('country','krajina')|e], ale na rozdiel od [Concept('wastelands','pustatín')|e] nimi môžu prechádzať [Concept('armies','armády')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_strait: "Prieliv" # todo: NEW TRANSLATION
 game_concept_straits: "Prielivy" # todo: NEW TRANSLATION
 game_concept_strait_desc: "Prieliv spája dve [Concept('locations','lokality')|e] oddelené [Concept('seazone','morská zóna')|e], ale dostatočne blízko na to, aby jimi [Concept('armies','armády')|e] mohli prejsť bez potreby [Concept('navy','námorníctvo')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_katun: "K'atun" # todo: NEW TRANSLATION
 game_concept_katun_desc: "K'atun je meradlo času ľudí [ShowReligionAdjective('mayan')], zodpovedá približne 19,7 roka. Koniec jedného K'atunu a začiatok nového bol sprevádzaný mnohými obradmi a oslavami, čo z tejto udalosti robilo dôležitý dátum pre vládcov a ich ľud.\n\nAk do konca súčasného K'atunu investujeme dostatok prostriedkov na prípravu osláv, získame [ShowModifier('katun_celebration')] na 10 rokov. Naopak, ak nebudeme pripravení, môžeme získať [ShowModifier('katun_celebration_bad')] na 10 rokov. Budeme považovaní za plne pripravených, keď bude naša [Concept('religious_influence','náboženský vplyv')|e] aspoň 90." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_town_and_city: "Mestská lokalita" # todo: NEW TRANSLATION
 game_concept_urban_location: "Mestská lokalita" # todo: NEW TRANSLATION
 game_concept_urban_locations: "Mestské lokality" # todo: NEW TRANSLATION
 game_concept_towns_and_cities: "Mestské lokality" # todo: NEW TRANSLATION
 game_concept_towns_or_cities: "Mestské lokality" # todo: NEW TRANSLATION
 game_concept_town_or_city: "Mestská lokalita" # todo: NEW TRANSLATION
 game_concept_town_and_city_desc: "Ide o [Concept('location','lokalitu')|e] s významným ľudským osídlením. Môže obsahovať viac špecializovaných [Concept('buildings','budovy')|e] a umožňuje rozkvet [ShowPopTypeName('burghers')]. Je to opak [Concept('rural_location','vidiecka lokalita')|e].\n\nV závislosti od veľkosti môže byť [urban_location] [ShowLocationRankName('town')], [ShowLocationRankName('city')] alebo [ShowLocationRankName('megalopolis')]." # todo: CHANGED # todo: CONCEPT CASE
 game_concept_rural_location: "Vidiecka lokalita" # todo: NEW TRANSLATION
 game_concept_rural_locations: "Vidiecke lokality" # todo: NEW TRANSLATION
 game_concept_rural: "Vidiecky" # todo: NEW TRANSLATION
 game_concept_rural_location_desc: "Ide o [Concept('location','lokalitu')|e] bez významného sídla, a teda s menšími možnosťami budovať špeciálne [Concept('buildings','budovy')|e]. Je to opak [Concept('town_or_city','mestská lokalita')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_cardinal: "Kardinál" # todo: NEW TRANSLATION
 game_concept_cardinals: "Kardináli" # todo: NEW TRANSLATION
 game_concept_cardinal_s: "Kardinála" # todo: NEW TRANSLATION
 game_concept_cardinal_desc: "Kardinál je zástupca [ShowReligionAdjective('catholic')] cirkvi, hneď pod [pope]. Kardináli sú priradení k [Concept('locations','lokalitám')|e] výstavbou špeciálneho [Concept('building','budovy')|e] nazvaného [ShowBuildingTypeName('seat_of_cardinal')], a budú lojálni [Concept('country','krajina')|e], ktoré to [location] [Concept('owns','vlastní')|e].\n\n[country] môže používať svojich kardinálov na účasť na [Concept('curia_actions','akcie kúrie')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_saint: "Svätý" # todo: NEW TRANSLATION
 game_concept_saints: "Svätci" # todo: NEW TRANSLATION
 game_concept_saint_desc: "Svätý je [Concept('character','postava')|e], ktorý je v [ShowReligionGroupAdjective('christian')] [Concept('religion','náboženstve')|e] uznaný za mimoriadne svätého vďaka svojim skutkom. Proces, ktorým sa stáva [saint], sa nazýva [Concept('canonization','kanonizácia')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_gurus: "Guruovia" # todo: NEW TRANSLATION
 game_concept_god_emperors: "Bohovia cisári" # todo: NEW TRANSLATION
 game_concept_god_emperors_desc: "Bohocisár je [Concept('character','postava')|e], ktorý je v [ShowReligionGroupAdjective('hellenistic')] [Concept('religion','náboženstve')|e] uznaný za mimoriadne svätého pre svoje činy. Proces stať sa Bohocisárom sa nazýva kanonizácia." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_heroes: "Hrdinovia" # todo: NEW TRANSLATION
 game_concept_heroes_desc: "Hrdina je [Concept('character','postava')|e], ktorý je v [ShowReligionGroupAdjective('hellenistic')] [Concept('religion','náboženstve')|e] uznaný podľa aspektu Heroic Cults za mimoriadne svätého pre svoje činy. Proces stať sa Hrdinom sa nazýva kanonizácia." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_divine_emperors: "Božskí cisári" # todo: NEW TRANSLATION
 game_concept_divine_emperors_desc: "Božský cisár je [Concept('character','postava')|e], ktorý je v [ShowReligionGroupAdjective('hellenistic')] [Concept('religion','náboženstve')|e] uznaný podľa aspektu Imperial Cult za mimoriadne svätého pre svoje činy. Proces stať sa Božským cisárom sa nazýva kanonizácia." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_canonization: "Kanonizácia" # todo: NEW TRANSLATION
 game_concept_canonize: "Kanonizovať" # todo: NEW TRANSLATION
 game_concept_canonized: "Kanonizovaný" # todo: NEW TRANSLATION
 game_concept_canonization_desc: "Bývalý [Concept('ruler','panovník')|e] [Concept('country','krajiny')|e] môže byť kanonizovaný, t. j. udelí sa mu titul [Concept('saint','svätého')|e]. To poteší [ShowEstateTypeName('clergy_estate')] a okamžite poskytne [Concept('legitimacy','legitimita')|e] a [Concept('prestige','prestíž')|e] krajine, škálované podľa schopností [Concept('character','postavy')|e] za jeho života." # todo: CHANGED # todo: CONCEPT CASE
 game_concept_resolutions: "Rezolúcie" # todo: NEW TRANSLATION
 game_concept_resolution: "Rezolúcia" # todo: NEW TRANSLATION
 game_concept_vote: "Hlas" # todo: NEW TRANSLATION
 game_concept_votes: "Hlasy" # todo: NEW TRANSLATION
 game_concept_vote_verb: "Hlasovať" # todo: NEW TRANSLATION
 game_concept_voting: "Hlasovanie" # todo: NEW TRANSLATION
 game_concept_resolution_desc: "Sú to akcie prijímané [Concept('international_organizations','medzinárodné organizácie')|e], ktoré ovplyvňujú celú organizáciu. Akýkoľvek [Concept('member','člen')|e] [Concept('country','krajiny')|e] môže navrhnúť rezolúciu ostatným [members], a každý [member] bude môcť ovplyvniť výsledok debaty tým, že ju podporí alebo jej bude odporovať.\n\nAk sa schváli, efekty závisia od toho, ktorá rezolúcia bola prijatá." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_curia_actions: "Akcie kúrie" # todo: NEW TRANSLATION
 game_concept_curia_action: "Akcia kúrie" # todo: NEW TRANSLATION
 game_concept_curia_action_desc: "Sú to akcie prijímané [Concept('curia','kúria')|e], ktoré ovplyvňujú celý [ShowReligionAdjective('catholic')] svet. Akákoľvek [ShowReligionAdjective('catholic')] [Concept('country','krajina')|e] môže navrhnúť debatu v [curia], a každý [country] s [Concept('cardinal','kardinálom')|e] bude môcť ovplyvniť výsledok debaty podporou alebo odporom.\n\nAk sa schváli, efekty závisia od toho, ktorá akcia kúrie bola prijatá, ale budú sa uplatňovať na všetky [ShowReligionAdjective('catholic')] [countries]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_curia: "Kúria" # todo: NEW TRANSLATION
 game_concept_curia_desc: "Kúria je administratívnym telom Svätej stolice a teda aj celej [ShowReligionAdjective('catholic')] cirkvi. Každá [ShowReligionAdjective('catholic')] [Concept('country','krajina')|e] môže interagovať s kúriou a minúť [Concept('religious_influence','náboženský vplyv')|e] na navrhnutie [Concept('curia_action','akcia kúrie')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_population_capacity: "Kapacita obyvateľstva" # todo: NEW TRANSLATION
 game_concept_population_capacity_desc: "Toto je množstvo [Concept('population','populácia')|e], ktoré môže [Concept('location','lokalita')|e] podporiť. Ak je [population] vyššia než kapacita, nebude sa môcť ďalej zvyšovať, a ak je príliš vysoká, môže dokonca klesať." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_total_population: "Celková populácia" # todo: NEW TRANSLATION
 game_concept_total_population_desc: "Toto je celkové množstvo [Concept('pops','populácie')|e], ktoré žijú v [Concept('country','krajine')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_population: "Populácia" # todo: NEW TRANSLATION
 game_concept_population_i: "@population!" # todo: NEW TRANSLATION
 game_concept_population_desc: "Populácia [Concept('location','lokalita')|e] je celkové množstvo [Concept('pops','populácie')|e], ktoré tam žijú." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_maritime_presence: "Námorná prítomnosť" # todo: NEW TRANSLATION
 game_concept_maritime: "Námorný" # todo: NEW TRANSLATION
 game_concept_maritime_presence_power: "Sila námornej prítomnosti" # todo: NEW TRANSLATION
 game_concept_maritime_presence_desc: "Námorná prítomnosť pozdĺž našich pobreží je kľúčová pre [Concept('trade','obchod')|e] a pre naše [Concept('control','kontrola')|e] nad územím.\n\nMaritime Presence sa buduje v čase, ak sme v mieru, len z držania [Concept('ports','prístavy')|e], zatiaľ čo [Concept('blockade','blokáda')|e] rýchlo zníži našu prítomnosť. [Navy|e] v [Concept('seazone','morskej zóne')|e] môže prítomnosť rýchlo obnoviť.\n\nVysoké $game_concept_maritime_presence$ znižuje stratu [Concept('proximity','blízkosť')|e] medzi [Concept('seazones','morskými zónami')|e] pri výpočte kontrole. Námorná prítomnosť v pobrežných morských zónach [Concept('market','trhu')|e] je tiež dôležitým zdrojom [Concept('merchant_power','neobchodnou výhodou')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_merchant_maritime_power: "Námorná $game_concept_merchant_power$" # todo: NEW TRANSLATION
 game_concept_merchant_maritime_power_desc: "Vaša $game_concept_merchant_maritime_power$ predstavuje schopnosť vašich [Concept('navies','námorných síl')|e] efektívne chrániť a ovplyvňovať námorný obchod. Určuje množstvo [Concept('merchant_power','obchodná výhoda')|e], ktoré [Concept('country','krajina')|e] generuje z [Concept('maritime_presence','námornej prítomnosti')|e] v pobrežných [Concept('seazones','morských zónach')|e] [Concept('market','trhoch')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_blockade: "Blokáda" # todo: NEW TRANSLATION
 game_concept_blockaded: "Zablokované" # todo: NEW TRANSLATION
 game_concept_blockades: "Blokády" # todo: NEW TRANSLATION
 game_concept_blockading: "Blokovanie" # todo: NEW TRANSLATION
 game_concept_blockade_desc: "Blokáda nastáva, keď sa [Concept('hostile','nepriateľský')|e] [Concept('navy','námorníctva')|e] nachádza v [Concept('seazone','morskej zóne')|e] pred [Concept('port','prístavom')|e]; počet potrebných [Concept('ships','lode')|e] závisí od [Concept('population','populácie')|e] a [Concept('development','rozvoja')|e] postihnutých [Concept('ports','prístavov')|e].\n\nNajdôležitejšie efekty blokády:\n$BULLET_WITH_TAB$Znížiť produkciu [Concept('food','potraviny')|e]\n$BULLET_WITH_TAB$Znížiť [Concept('maritime_presence','námorná prítomnosť')|e]\n$BULLET_WITH_TAB$Znížiť [development]\n$BULLET_WITH_TAB$Znížiť [Concept('control','kontrola')|e]\n$BULLET_WITH_TAB$Znížiť [Concept('prosperity','prosperita')|e]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_religious_unity: "Náboženská jednota" # todo: NEW TRANSLATION
 game_concept_religious_unity_desc: "Náboženská jednota je percento [Concept('country','krajina')|e]'s [Concept('population','populáciou')|e], ktoré nasleduje oficiálne štátne [Concept('religion','náboženstvo')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_cultural_unity: "Kultúrna jednota" # todo: NEW TRANSLATION
 game_concept_cultural_unity_desc: "Kultúrna jednota je percento [Concept('country','krajina')|e]'s [Concept('population','populáciou')|e], ktoré patrí k [Concept('primary_culture','hlavnej kultúre')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_transport_capacity: "Prepravná kapacita" # todo: NEW TRANSLATION
 game_concept_transport_capacity_desc: "Prepravná kapacita jednoducho popisuje, koľko mužov alebo [Concept('strength','sila')|e] z [Concept('regiments','plukov')|e] môžeme naložiť na náš [Concept('ship','loď')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_food_storage: "Zásoba potravín" # todo: NEW TRANSLATION
 game_concept_food_storage_desc: "Toto je množstvo [Concept('food','potraviny')|e], ktoré môže [Concept('regiment','pluk')|e] alebo [Concept('ship','loď')|e] niesť." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_food_storage_per_strength: "Zásoba potravín" # todo: NEW TRANSLATION
 game_concept_food_storage_per_strength_desc: "Toto je množstvo [Concept('food','potraviny')|e], ktoré môže [Concept('regiment','pluk')|e] alebo [Concept('ship','loď')|e] niesť." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_food_capacity: "Kapacita potravín" # todo: NEW TRANSLATION
 game_concept_food_capacity_desc: "To je, koľko [Concept('food','potraviny')|e] môže [Concept('unit','jednotka')|e] niesť pri pohybe." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_food_capacity_per_strength: "Kapacita potravín" # todo: NEW TRANSLATION
 game_concept_food_capacity_per_strength_desc: "$game_concept_food_capacity_desc$" # todo: NEW TRANSLATION
 game_concept_food_consumption: "Denná spotreba potravín" # todo: CHANGED
 game_concept_food_consumption_desc: "Toto je množstvo [Concept('food','potraviny')|e], ktoré [Concept('regiment','pluk')|e] spotrebuje každý deň." # todo: CHANGED # todo: CONCEPT CASE
 game_concept_food_consumption_per_strength: "Spotreba potravín" # todo: NEW TRANSLATION
 game_concept_food_consumption_per_strength_desc: "$game_concept_food_consumption_desc$" # todo: NEW TRANSLATION
 game_concept_food_access: "Prístup k potravinám" # todo: NEW TRANSLATION
 game_concept_food_access_desc: "Prístup k potravinám umožňuje našim [Concept('armies','armádam')|e] a [Concept('navies','námorné sily')|e] získavať [Concept('food','potraviny')|e] z [Concept('locations','lokalít')|e] iných [Concept('countries','krajín')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_hull_size: "Veľkosť trupu" # todo: NEW TRANSLATION
 game_concept_hull_size_desc: "Čím väčšia veľkosť trupu, tým menej poškodenia [Concept('ship','lode')|e] utrpí v [Concept('combat','boji')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_cannons: "Delá" # todo: NEW TRANSLATION
 game_concept_cannons_desc: "Čím viac diel má [Concept('ship','loď')|e], tým viac poškodenia môže spôsobiť v [Concept('combat','boji')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_flanking_ability: "Schopnosť obkľúčenia" # todo: NEW TRANSLATION
 game_concept_flanking_ability_desc: "Toto určuje, koľko poškodenia môže spôsobiť jednotkám v inej [Concept('section','sekcii')|e] počas boja." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_secure_flanks: "Zabezpečené krídla" # todo: NEW TRANSLATION
 game_concept_secure_flanks_defense: "Obrana zabezpečených bokov" # todo: NEW TRANSLATION
 game_concept_secure_flanks_desc: "Poskytuje obranný bonus, keď sa v susednej [Concept('section','sekcii')|e] nachádzajú [Concept('friendly','priateľské')|e] jednotky. Ak sú zabezpečené obe krídla, bonus sa zdvojnásobí." # todo: CHANGED # todo: CONCEPT CASE
 game_concept_secure_flanks_defense_desc: "$game_concept_secure_flanks_desc$" # todo: NEW TRANSLATION
 game_concept_combat_power: "Bojová sila" # todo: NEW TRANSLATION
 game_concept_combat_power_desc: "Toto je priama atribút poškodzovania [Concept('regiment','pluku')|e] v [Concept('combat','boji')|e]. Násobí sa [Concept('strength','silu')|e] [regiment] pri určovaní, koľko poškodenia [regiment] spôsobí." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_frontage: "Šírka fronty" # todo: NEW TRANSLATION
 game_concept_frontage_desc: "V [Concept('combat','boji')|e] môže bojovať naraz len obmedzený počet [Concept('regiments','pluky')|e] alebo [Concept('ships','lode')|e], čo sa nazýva frontage. Niektoré [Concept('locations','lokality')|e] s náročnejším [Concept('topography','topografiou')|e] alebo [Concept('vegetation','vegetácia')|e] môžu frontage ďalej znižovať. Niektoré typy [Concept('sub_units','podjednotky')|e] môžu používať menej frontage a iné viac." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_anti_piracy_warfare: "Dopad proti pirátstvu" # todo: NEW TRANSLATION
 game_concept_anti_piracy_warfare_desc: "Toto je efekt, ktorý bude mať [Concept('ship','loď')|e] na [Concept('privateers','korzárov')|e] vo svojom obvode." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_section: "Sekcia" # todo: NEW TRANSLATION
 game_concept_sections: "Sekcie" # todo: NEW TRANSLATION
 game_concept_section_desc: "Každá strana v [combat_with_icon|e] má štyri Sekcie: tri vpredu bitky ([Concept('center','stred')|e], ľavý [Concept('flank','krídlo')|e] a pravý [Concept('flank','krídlo')|e]) a jednu vzadu, [Concept('reserves','rezervy')|e].\n\nPočas boja sa [Concept('regiments','pluky')|e] alebo [Concept('ships','lode')|e] v predných Sekciách pokúšajú zapojiť nepriateľov v opačnej sekcii. Ak je opačná Sekcia prázdna, môžu zaútočiť na ktorúkoľvek inú prednú Sekciu, kde jednotka s dobrou [Concept('flanking_ability','schopnosťou obkľúčenia')|e] môže spôsobiť dodatočné poškodenie.\n\nAk sú jednotky zničené alebo ustúpia kvôli príliš nízkemu [Concept('morale','morálke')|e], jednotky z [reserves] sa pokúsia postúpiť dopredu a nahradiť ich hodením [combat_speed_with_icon|e]. [Combat] končí, keď na jednej strane nie sú žiadne jednotky v predných Sekciách." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_center: "Stred" # todo: NEW TRANSLATION
 game_concept_center_desc: "Toto je stredná [Concept('section','sekcia')|e] jednotky. Ak v strede nie je žiadny protivník, môže ľahko dosiahnuť buď ľavý [Concept('flank','krídlo')|e] alebo pravý [Concept('flank','krídlo')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_reserves: "Rezervy" # todo: NEW TRANSLATION
 game_concept_reserves_desc: "Tieto [Concept('regiments','pluky')|e] alebo [Concept('ships','lode')|e] sa aktívne nezúčastňujú boja, ale podľa potreby sa môžu presunúť do [Concept('center','stredu')|e] alebo na ktorýkoľvek [Concept('flank','krídlo')|e].\nKaždý [regiment] alebo [Concept('ship','loď')|e] hodí [Concept('d20','D20')|e] a ak je výsledok nižší ako jeho [Concept('combat_speed','rýchlosti boja')|e], bude môcť vstúpiť do boja. Avšak len toľko jednotiek, koľko zodpovedá možnej [Concept('frontage','šírke fronty')|e] bitky, sa pokúsi posilniť každú hodinu." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_broken_units: "Dezorganizované jednotky" # todo: NEW TRANSLATION
 game_concept_broken_units_desc: "Sú to [Concept('regiments','pluky')|e] alebo [Concept('ships','lode')|e], ktoré boli v aktuálnej [Concept('battle','bitke')|e] rozbehnuté. Už sa tejto bitky viac nezúčastnia." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_flank: "Krídlo" # todo: NEW TRANSLATION
 game_concept_right_flank: "Pravé krídlo" # todo: NEW TRANSLATION
 game_concept_left_flank: "Ľavé krídlo" # todo: NEW TRANSLATION
 game_concept_flanks: "Krídla" # todo: NEW TRANSLATION
 game_concept_flank_desc: "Krídla sú [Concept('sections','sekcie')|e] armády okrem [Concept('center','stredu')|e]. Ľavý $game_concept_section$ zvyčajne bojuje proti pravému sekcii protivníka a pravý $game_concept_section$ zvyčajne bojuje proti ľavému sekcii protivníka. Avšak [Concept('flanking_ability','schopnosť obkľúčenia')|e] tiež umožňuje poškodzovať susedné $game_concept_sections$." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_bombard_efficiency: "Efektivita bombardovania" # todo: NEW TRANSLATION
 game_concept_bombard_efficiency_desc: "Toto je šanca, že delostrelecké [Concept('regiments','pluky')|e] budú strieľať počas [Concept('bombard_phase','bombardovacej fázy')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_phase: "Fáza" # todo: NEW TRANSLATION
 game_concept_phases: "Fázy" # todo: NEW TRANSLATION
 game_concept_phase_desc: "V [Concept('combat','boji')|e] sú dve fázy, ktoré začínajú počiatočnou [GetDefine('NCombat','BOMBARD_HOURS')|W]-hodinovou [Concept('bombard_phase','bombardovacou fázou')|e] (ak sú prítomné [Concept('regiments','pluky')|e], ktoré dokážu [Concept('bombard','bombardovať')|e]), po ktorej nasleduje [Concept('combat_phase','bojová fáza')|e]." # todo: CHANGED # todo: CONCEPT CASE
 game_concept_combat_phase: "Bojová fáza" # todo: NEW TRANSLATION
 game_concept_combat_phase_desc: "Bojová fáza je hlavná [Concept('phase','fáza')|e] [Concept('combat','boja')|e], ktorá prebieha po počiatočnej [Concept('bombard_phase','bombardovacej fáze')|e]. [Concept('regiments','Pluky')|e] alebo [Concept('ships','lode')|e] sa pokúšajú zapojiť svojich [Concept('enemy','vojnového nepriateľa')|e] protějšků." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_bombard_phase: "Bombardovacia fáza" # todo: NEW TRANSLATION
 game_concept_bombard_phase_desc: "Bombard fáza je úvodná fáza [Concept('combat','boj')|e], ktorá prebieha pred hlavnou [Concept('combat_phase','bojovou fázou')|e]. Trvá [GetDefine('NCombat','BOMBARD_HOURS')|W] hodín a využívajú ju výlučne [Concept('regiments','pluky')|e], ktoré môžu [Concept('bombard','bombardovať')|e], napríklad [ShowUnitCategoryName('army_artillery')].\n\nKaždú hodinu Bombard fázy majú platné [regiments] šancu [bombard], čo spôsobí ich [Concept('combat_power','bojová sila')|e] ako poškodenie nepriateľskému [regiment] na rovnakej [Concept('section','sekciu')|e]." # todo: CHANGED # todo: CONCEPT CASE
 game_concept_bombard: "Bombardovať" # todo: NEW TRANSLATION
 game_concept_bombarding: "Bombardovanie" # todo: NEW TRANSLATION
 game_concept_bombard_desc: "[Concept('regiments','Pluky')|e], ktoré dokážu bombardovať, spôsobia svoje [Concept('combat_power','bojovú silu')|e] ako poškodenie počas úvodnej [Concept('bombard_phase','bombardovacej fázy')|e] [Concept('combat','boja')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_initiative: "Iniciatíva" # todo: NEW TRANSLATION
 game_concept_initiative_desc: "Iniciatíva je šanca, že sa [Concept('regiment','pluk')|e] bude [Concept('engage','zapojiť')|e] počas [Concept('combat_phase','bojovej fázy')|e] [Concept('combat','boja')|e].\n\nKaždú hodinu, pokiaľ je dostupná dostatočná [Concept('frontage','šírka fronty')|e], všetky [regiments], ktoré nie sú momentálne [engaged], sa pokúsia zapojiť do boja.\n\nŠanca sa vypočíta ako (Iniciatíva * [GetDefine('NCombat','INITIATIVE_CHANCE_EACH')]) + ([GetDefine('NCombat','INITIATIVE_CHANCE_EACH')] * počet hodín v boji); ak je šanca vyššia než [Concept('d100','D100')|e], tak sa [regiment] stane [engaged] v boji.\n\nVo všeobecnosti majú najvyššiu Iniciatívu ľahké a delostrelecké [Concept('regiments','pluky')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_engagement: "Zapojenie" # todo: NEW TRANSLATION
 game_concept_engage: "Zapojiť" # todo: NEW TRANSLATION
 game_concept_engaged: "Zapojené" # todo: NEW TRANSLATION
 game_concept_engagement_desc: "Keď začína [combat_with_icon|e], [regiments_with_icon|e] v predných [sections_with_icon|e] hádžu [initiative_with_icon|e] každú hodinu, až kým nie sú zapojené. Keď je [regiment] zapojený v [combat], spôsobuje poškodenie. Keď sa jednotka stiahne, prestane byť zapojená a do tej istej [combat] sa už nevráti.\n\nIba určitý počet [frontage_with_icon|e] môže byť naraz zapojený v jednej [section]." # todo: NEW TRANSLATION
 game_concept_d10: "D10" # todo: NEW TRANSLATION
 game_concept_d10_desc: "D10 je desaťstenná kocka používaná v [Concept('combat','boji')|e] na určenie, ako dobre sa jednej strane darí." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_d20: "D20" # todo: NEW TRANSLATION
 game_concept_d20_desc: "D20 je hod kockou so dvadsiatimi stranami používaný v [Concept('combat','boji')|e], keď sa [Concept('regiment','pluk')|e] alebo [Concept('ship','loď')|e] vyťahuje z [Concept('reserves','rezerv')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_d100: "D100" # todo: NEW TRANSLATION
 game_concept_d100_desc: "D100 je hod kockou so sto stranami používaný na kontrolu šancí založených na percentách." # todo: NEW TRANSLATION
 game_concept_dice: "Kocky" # todo: NEW TRANSLATION
 game_concept_dice_upper_desc: "Kocky sa často hádžu, aby sa určil výsledok akcie, napríklad [Concept('phases','fázy')|e] [Concept('siege','obliehania')|e] alebo [Concept('battle','bitka')|e]. " # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_dice_desc: "$game_concept_dice_upper_desc$\n[d6|e]\n[Concept('d20','D20')|e]\n[Concept('d100','D100')|e]" # todo: CHANGED NUMBER # todo: CONCEPT CASE
 game_concept_combat_speed: "Rýchlosť boja" # todo: NEW TRANSLATION
 game_concept_combat_speed_desc: "Toto je schopnosť presunúť sa z [Concept('reserves','rezerv')|e] do akejkoľvek inej [Concept('section','sekcie')|e] v rámci [Concept('battle','bitky')|e]. Pre [Concept('ships','lode')|e] to tiež ovplyvňuje, ako rýchlo môže poškodená loď opustiť aktuálnu [Concept('section','sekcie')|e] a ustúpiť." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_blockade_capacity: "Kapacita blokády" # todo: NEW TRANSLATION
 game_concept_blockade_capacity_desc: "Určuje, ako dobre je [Concept('ship','loď')|e] schopný blokádovať. To sa priamo porovná s hodnotou v cieľovom [Concept('location','lokalite')|e] v závislosti od jeho [Concept('development','rozvoja')|e], [Concept('population','populácie')|e], [Concept('imports','dovozov')|e] a [Concept('exports','vývozov')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_crew_size: "Veľkosť posádky" # todo: NEW TRANSLATION
 game_concept_crew_size_desc: "Určuje, koľko [Concept('sailors','námorníci')|e] je potrebných, aby [Concept('ship','loď')|e] bol prevádzkyschopný." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_maximum_strength: "Maximálna sila" # todo: NEW TRANSLATION
 game_concept_max_strength: "Maximálna sila" # todo: NEW TRANSLATION
 game_concept_maximum_strength_desc: "Zvyšuje, koľko mužov má [Concept('regiment','pluk')|e], čím sa zvyšujú jeho náklady na [Concept('manpower','živú silu')|e]. [Regiment] s vyšším počtom [manpower], ale s rovnakou [Concept('frontage','šírkou fronty')|e], je v [Concept('combat','boji')|e] efektívnejší." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_max_strength_desc: "$game_concept_maximum_strength_desc$" # todo: NEW TRANSLATION
 game_concept_strength: "Sila" # todo: NEW TRANSLATION
 game_concept_strength_desc: "Toľko mužov má [Concept('regiment','pluk')|e] v súčasnosti." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_total_strength: "Celková sila" # todo: NEW TRANSLATION
 game_concept_total_strength_desc: "Toľko mužov má [Concept('army','armáda')|e] spolu, spočítaním všetkých individuálnych [Concept('strength','síl')|e] každého [Concept('regiment','pluku')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_non_avoidable_attrition: "Neodvratná nadobudnutá strata" # todo: NEW TRANSLATION
 game_concept_non_avoidable_attrition_desc: "Zvyčajne [Concept('armies','armády')|e] netrpia [Concept('attrition','vyčerpanie')|e], ak sa nachádzajú v [Concept('zone_of_control','zóne kontroly')|e] [Concept('fort','pevnosti')|e] vlastneného a kontrolovaného nimi, ich priamymi [Concept('subjects','vazalmi')|e] alebo ich priamym [overlord|e], ale niektoré udalosti ako [ShowSituationName('black_death')] sa takto nedajú vyhnúť." # todo: CHANGED # todo: CONCEPT CASE
 game_concept_attrition_losses: "Straty v dôsledku vyčerpania" # todo: NEW TRANSLATION
 game_concept_attrition_loss: "Strata z vyčerpania" # todo: NEW TRANSLATION
 game_concept_attrition_loss_desc: "Koľko poškodenia spôsobí [Concept('attrition','vyčerpanie')|e] [Concept('regiment','pluku')|e] alebo [Concept('ship','loď')|e] každý mesiac." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_attrition: "Vyčerpanie" # todo: NEW TRANSLATION
 game_concept_attrition_desc: "Vyčerpanie sa uplatňuje na začiatku každého mesiaca, čo pre [Concept('regiments','pluky')|e] znamená, že ľudia umierajú, zatiaľ čo pre [Concept('ships','lode')|e] to tiež poškodzuje samotnú loď. Niektoré attrition sú [Concept('non_avoidable_attrition','neodvratná nadobudnutá strata')|e] a hlavné zdroje attrition zahŕňajú:\n$BULLET_WITH_TAB$[Concept('army','Armáda')|e] bez [Concept('food','potravín')|e]\n$BULLET_WITH_TAB$Celkové [Concept('unit_weight','hmotnosti jednotky')|e] v [Concept('location','lokalite')|e] nad [Concept('supply_limit','limitom zásob')|e]\n$BULLET_WITH_TAB$[Concept('winter','Zima')|e], [Concept('topography','topografiou')|e], [Concept('vegetation','vegetáciou')|e] alebo [Concept('climate','klíma')|e]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_supply_limit: "Limit zásob" # todo: NEW TRANSLATION
 game_concept_supply_limit_desc: "Toto je maximálne [Concept('unit_weight','hmotnosť jednotky')|e], ktoré môže [Concept('location','lokalita')|e] zásobovať bez spôsobenia dodatočnej spotreby [Concept('food','potraviny')|e] pre [Concept('army','armádu')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_unit_weight: "Hmotnosť jednotky" # todo: NEW TRANSLATION
 game_concept_unit_weight_desc: "Je to kumulatívna hodnota závislá od aktuálnej [Concept('strength','sily')|e] [Concept('regiment','pluku')|e] a typu [Concept('unit_type','typu jednotky')|e].\nToto sa pri výpočte [Concept('attrition','vyčerpaní')|e] porovnáva priamo s [Concept('supply_limit','limitom zásob')|e] v aktuálnom [Concept('location','lokalite')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_loot: "Lúpež" # todo: NEW TRANSLATION
 game_concept_looted: "Vyplienené" # todo: NEW TRANSLATION
 game_concept_loot_desc: "Keď [Concept('armies','armády')|e] [Concept('occupy','okupovať')|e] [Concept('locations','lokalít')|e], ukradnú z nich [Concept('gold','dukáty')|e] a dajú [Concept('location','lokalita')|e] [ShowModifier('looted')] [Concept('modifier','modifikátor')|e] približne na #V 12#! mesiacov." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_reinforce: "Doplniť" # todo: NEW TRANSLATION
 game_concept_reinforced: "Doplnené" # todo: NEW TRANSLATION
 game_concept_reinforcement: "Posily" # todo: NEW TRANSLATION
 game_concept_reinforce_desc: "Keď je [Concept('regiment','pluk')|e] pod svojou [Concept('maximum_strength','maximálnou silou')|e], pokúsi sa doplniť, čerpaním [Concept('manpower','živou silou')|e] a [Concept('gold','dukáty')|e] od svojho [Concept('country','krajiny')|e]. Len [Concept('regular_regiment','stály pluk')|e] sa dokáže dopĺňať, a pokiaľ nie je v [Concept('friendly','priateľskom')|e] [Concept('location','lokalite')|e], nebude to možné." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_repair: "Oprava" # todo: NEW TRANSLATION
 game_concept_repaired: "Opravené" # todo: NEW TRANSLATION
 game_concept_repair_desc: "Keď je [Concept('ship','loď')|e] poškodená, môže byť opravená v niektorom z našich [Concept('ports','prístavov')|e] alebo tam, kde máme [Concept('fleet_basing_rights','práva kotvenia flotily')|e], čerpaním [Concept('sailors','námorníkov')|e] a [Concept('gold','dukáty')|e] od svojho [Concept('country','krajiny')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_naval_damage: "Námorné poškodenie" # todo: NEW TRANSLATION
 game_concept_naval_damage_desc: "To ovplyvňuje, koľko poškodenia môžu [Concept('ships','lode')|e] zniesť alebo spôsobiť počas [Concept('combat','boja')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_damage_taken: "Obdržané poškodenie" # todo: NEW TRANSLATION
 game_concept_damage_taken_desc: "Počas [Concept('battle','bitky')|e] [Concept('regiment','pluku')|e] alebo [Concept('ship','loď')|e] utrpia poškodenie na [Concept('morale','morálku')|e] aj na [Concept('strength','silu')|e]. Množstvo závisí od [Concept('combat_power','bojovej sily')|e], [Concept('strength','sily')|e] a ďalších štatistík nepriateľa, zatiaľ čo atribúty ako [Concept('experience','skúsenosti')|e], [Concept('strength_damage_taken','obdržané poškodenie sily')|e] alebo [Concept('morale_damage_taken','obdržané poškodenie morálky')|e] ho môžu znížiť." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_strength_damage_taken: "Obdržané poškodenie sily" # todo: NEW TRANSLATION
 game_concept_strength_damage_taken_desc: "Toto ovplyvňuje množstvo poškodenia, ktoré jednotka utrpí v [Concept('combat','boji')|e]. Pre [Concept('ships','lode')|e] ide o poškodenie samotnej [Concept('ship','lodi')|e], zatiaľ čo pre [Concept('regiments','pluky')|e] to určuje, koľko [Concept('manpower','živá sila')|e] zahynie v boji." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_morale_damage_taken: "Obdržané poškodenie morálky" # todo: NEW TRANSLATION
 game_concept_morale_damage_taken_desc: "Toto ovplyvňuje množstvo poškodenia [Concept('morale','morálky')|e], ktoré jednotka utrpí v [Concept('combat','boji')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_strength_damage_done: "Spôsobené poškodenie sily" # todo: NEW TRANSLATION
 game_concept_strength_damage_done_desc: "Toto ovplyvňuje množstvo poškodenia spôsobeného nepriateľovi. Pre [Concept('ships','lode')|e] to poškodzuje samotnú [Concept('ship','loď')|e], zatiaľ čo pre [Concept('regiments','pluky')|e] to určuje, koľko [Concept('manpower','živá sila')|e] zabijú." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_morale_damage_done: "Spôsobené poškodenie morálky" # todo: NEW TRANSLATION
 game_concept_morale_damage_done_desc: "Toto ovplyvňuje množstvo poškodenia, ktoré sa v [Concept('combat','boji')|e] spôsobí [Concept('morale','morálke')|e] nepriateľa." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_movement_speed: "Rýchlosť pohybu" # todo: NEW TRANSLATION
 game_concept_movement_speed_desc: "Táto hodnota určuje, ako rýchlo sa [Concept('unit','jednotku')|e] pohybuje po mape." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_discipline: "Disciplína" # todo: NEW TRANSLATION
 game_concept_discipline_desc: "Ovplyvňuje škody, ktoré [Concept('regiment','pluk')|e] spôsobí v [Concept('combat','boji')|e], aj [Concept('damage_taken','obdržané poškodenie')|e]. Čím vyššia disciplína, tým viac spôsobených škôd a menej [Concept('damage_taken','obdržané poškodenie')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_military_tactics: "Vojenské taktiky" # todo: NEW TRANSLATION
 game_concept_military_tactics_desc: "Znižuje [Concept('damage_taken','obdržané poškodenie')|e] [Concept('regiment','pluku')|e] v [Concept('combat','boji')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_combined_arms: "Kombinované zbrane" # todo: NEW TRANSLATION
 game_concept_combined_arms_desc: "[armies] a [navies] s vyváženým zložením [unit_categories|e] dostávajú bonus k svojej [Concept('combat_power','bojovej sile')|e] v [Concept('battle','bitke')|e] za každú ďalšiu zapojenú kategóriu. Sila bonusu sa môže líšiť podľa technológie a iných zdrojov.\n\nAby ste získali Combined Arms bonus, [army] nesmie mať #W 50%#! alebo viac [Concept('regiments','pluky')|e] tej istej kategórie. Príklady rôznych [unit_categories|e] sú [ShowUnitCategoryName('navy_light_ship')] a [ShowUnitCategoryName('navy_heavy_ship')], alebo [ShowUnitCategoryName('army_light_infantry')] a [ShowUnitCategoryName('army_heavy_cavalry')]." # todo: CHANGED # todo: CONCEPT CASE
 game_concept_adult: "Dospelý" # todo: NEW TRANSLATION
 game_concept_adults: "Dospelí" # todo: NEW TRANSLATION
 game_concept_adult_desc: "[Concept('character','Postava')|e], ktorý má aspoň #Y [ShowAdultAge]#! rokov, sa považuje za dospelého. Môže slúžiť ako [Concept('rulers','panovníci')|e] bez [Concept('regent','regenta')|e], stať sa [Concept('general','generála')|e] alebo [Concept('admiral','admirál')|e], slúžiť v [Concept('cabinet','kabinete')|e] a tiež sa môže [Concept('married','V sňatku')|e]. Postava, ktorá nie je dospelá, sa považuje za [Concept('infant','dojča')|e], [Concept('child','dieťa')|e] alebo [Concept('adolescent','dorastenec')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_infant: "Dojča" # todo: NEW TRANSLATION
 game_concept_infants: "Dojčatá" # todo: NEW TRANSLATION
 game_concept_infant_desc: "[Concept('character','Postava')|e], ktorý má do #Y [ShowMaxInfantAge]#! rokov, je dojača. Nemôže slúžiť svojmu [Concept('country','krajine')|e] ani dostávať [Concept('child_education','výchova dieťaťa')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_child: "Dieťa" # todo: NEW TRANSLATION
 game_concept_children: "Deti" # todo: NEW TRANSLATION
 game_concept_child_desc: "[Concept('character','Postava')|e], ktorý je medzi #Y [ShowMinChildAge]#! a #Y [ShowMaxChildAge]#! rokov, je dieťa. Nemôže slúžiť svojmu [Concept('country','krajine')|e], ale ak patrí do [Concept('ruler','panovníka')|e]ovej [Concept('dynasty','dynastie')|e], môžete mu dať [Concept('child_education','výchova dieťaťa')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_adolescent: "Dorastenec" # todo: NEW TRANSLATION
 game_concept_adolescents: "Dorastenci" # todo: NEW TRANSLATION
 game_concept_adolescent_desc: "[Concept('character','Postava')|e], ktorý je medzi #Y [ShowMinAdolescentAge]#! a #Y [ShowMaxAdolescentAge]#! rokov, je dorastenec. Ešte nie je [Concept('adult','dospelý')|e], ale už nie je ani [Concept('child','dieťa')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_child_education: "Výchova dieťaťa" # todo: NEW TRANSLATION
 game_concept_education: "Vzdelanie" # todo: NEW TRANSLATION
 game_concept_child_education_desc: "[Concept('children','Deti')|e] možno dať vzdelanie od veku #Y 3#!. To určí, ako sa ich [Concept('abilities','schopnosti')|e] v priebehu času zlepšujú.\n\nKaždý mesiac má [child] [GetDefine('NCharacter','MONTHLY_STAT_INCREASE_CHANCE_FOR_CHILD')|Y]% šancu zvýšiť svoje [abilities] podľa svojho vzdelania." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_exploration: "Prieskum" # todo: NEW TRANSLATION
 game_concept_explorations: "Prieskumy" # todo: NEW TRANSLATION
 game_concept_exploring: "Prieskum" # todo: NEW TRANSLATION
 game_concept_exploration_desc: "Prieskum je misia vedená [Concept('explorer','prieskumník')|e] s cieľom [Concept('discovering','objavovaním')|e] neznámej [Concept('area','oblasťou')|e] pevniny alebo mora v rámci [Concept('naval_range','námorného dosahu')|e].\n\nKaždý prieskum má náklad progresu, ktorý sa zvyšuje podľa vzdialenosti od [Concept('capital','hlavného mesta')|e], ale znižuje podľa [Concept('naval_range','námorného dosahu')|e]. Rýchlosť, akou [explorer] postupuje, závisí od jeho [Concept('mil','vojenskej schopnosti')|e].\n\nKaždý prieskum má mesačné náklady na [Concept('gold','dukáty')|e], ktoré [explorer] znižuje úmerne svojmu [Concept('adm','administratívnej schopnosti')|e].\n\nKeď prieskum dosiahne koniec svojho [Concept('exploration_progress','postupu prieskumu')|e], [area] bude [discovered] a [explorer] sa vráti." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_exploration_success: "Úspech prieskumu" # todo: NEW TRANSLATION
 game_concept_exploration_progress: "Postup prieskumu" # todo: NEW TRANSLATION
 game_concept_exploration_progress_desc: "Každá [Concept('area','oblasť')|e] má náklady, ktoré treba splniť, aby bola plne [Concept('explored','preskúmané')|e]. Závisí to od mnohých faktorov, predovšetkým od zručnosti [Concept('explorer','prieskumník')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_known_world: "Známy svet" # todo: NEW TRANSLATION
 game_concept_known_world_desc: "Toto je časť sveta, ktorú ste už [Concept('discovered','objavené')|e]. Akékoľvek územie nedišcoverované vaším [Concept('country','krajinou')|e] sa považuje za [terra_incognita|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_terra_incognita: "Terra Incognita" # todo: NEW TRANSLATION
 game_concept_terra_incognita_desc: "Predtým, než je [Concept('location','lokalita')|e] [Concept('discovered','objavené')|e] [Concept('country','krajiny')|e] prostredníctvom [Concept('exploration','prieskumu')|e] alebo iných zdrojov, nie je viditeľné na mape a táto krajina s týmto štátom nemôže interagovať; takému územiu sa hovorí Terra Incognita, latinsky neznámá zem." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_discover: "Objaviť" # todo: NEW TRANSLATION
 game_concept_discovered: "Objavené" # todo: NEW TRANSLATION
 game_concept_discovering: "Objavovanie" # todo: NEW TRANSLATION
 game_concept_explore: "Preskúmať" # todo: NEW TRANSLATION
 game_concept_explored: "Preskúmané" # todo: NEW TRANSLATION
 game_concept_discover_desc: "Keď je [Concept('location','lokalita')|e] objavené, odstráni sa z neho [terra_incognita|e] a teraz je viditeľné a s ním je možné interagovať." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_explorer: "Prieskumník" # todo: NEW TRANSLATION
 game_concept_explorers: "Prieskumníci" # todo: NEW TRANSLATION
 game_concept_explorer_desc: "Prieskumník je [Concept('character','postava')|e], ktorý má určité [Concept('traits','vlastností')|e] užitočné pri priradení na [Concept('exploration','prieskum')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_conquistador: "Conquistador"
 game_concept_conquistadors: "Conquistadori"
 game_concept_conquistador_desc: "Conquistador je [Concept('character','postava')|e], ktorému bola zverená úloha dobyť cudzí kraj a vytvoriť nový [Concept('subject','vazal')|e] nášho [Concept('country','krajiny')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_budget: "Rozpočet"
 game_concept_balance: "Bilancia"
 game_concept_finances: "Financie"
 game_concept_budget_desc: "Mesačný rozpočet je založený na celkovom množstve [Concept('incomes','zisku')|e] a [Concept('expenses','výdajov')|e], ktoré má [Concept('country','krajina')|el]. Výsledok ovplyvňuje [Concept('treasury','pokladnicu')|e] krajiny." # todo: CONCEPT CASE
 game_concept_gdp_per_capita: "HDP na obyvateľa" # todo: NEW TRANSLATION
 game_concept_gdp_per_capita_desc: "Hrubý domáci produkt na obyvateľa je celkový [Concept('income','príjem')|e] [Concept('country','krajiny')|e] delený jej celkovým [Concept('population','populáciou')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_income: "Príjem" # todo: NEW TRANSLATION
 game_concept_incomes: "Príjmy" # todo: NEW TRANSLATION
 game_concept_income_desc: "Toto sú [Concept('gold','dukáty')|e], ktoré [Concept('country','krajina')|e] dostáva každý mesiac. Zahŕňa to [Concept('taxes','dane')|e] z každého [Concept('estate','stavu')|e] a príjmy z [Concept('trades','obchodov')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_expense: "Výdavok" # todo: NEW TRANSLATION
 game_concept_expenses: "Výdavky" # todo: NEW TRANSLATION
 game_concept_expense_desc: "To sú bežné náklady štátu. Zahŕňa platenie za [Concept('armies','armády')|e], [Concept('navies','námorné sily')|e], [Concept('trades','obchody')|e], [Concept('artists','umelcov')|e], [Concept('fortifications','opevnenia')|e], [Concept('colonial_charters','koloniálne listiny')|e] a ďalšie každý mesiac." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_treasury: "Pokladnica" # todo: NEW TRANSLATION
 game_concept_treasury_desc: "To je množstvo [Concept('gold','dukáty')|e], ktoré [Concept('country','krajina')|e] má. Ak klesne pod nulu, automaticky sa vezme [Concept('loan','pôžička')|e]. Ak už nie je možné žiadne [loans] zobrať, krajina skrachuje ([Concept('bankrupt','bankrot')|e])." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_minting: "Ražba mincí" # todo: NEW TRANSLATION
 game_concept_mint: "Ražba" # todo: NEW TRANSLATION
 game_concept_minting_desc: "Ražba je spôsob, ako zvýšiť našu [Concept('treasury','pokladnicu')|e] za cenu [Concept('inflation','infláciu')|e]. Ak nebudeme raziť mince, naša [inflation] sa môže znižovať." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_annexation: "Anexia" # todo: NEW TRANSLATION
 game_concept_annexations: "Anexie" # todo: NEW TRANSLATION
 game_concept_annex: "Anektovať"
 game_concept_annexing: "Anektovanie"
 game_concept_annexed: "Anektované"
 game_concept_annexation_desc: "Keď [Concept('overlord','suzerén')|e] úplne prevezme jednu zo svojich [Concept('subjects','vazalov')|e].\n\n[Concept('overlord','Suzerén')|e] získa všetky [Concept('owned','vlastnené')|e] [Concept('locations','lokalít')|e], [Concept('cores','jadrá')|e] a [Concept('characters','postavy')|e] [Concept('subject','vazala')|e]. [Subject|e] už nebude existovať ako [Concept('country','krajina')|e].\n\nPredmet môže spomaliť postup pomocou [ShowCabinetActionName('frustrate_annexation')] [Concept('cabinet_action','akcie kabinetu')|e] alebo vyhlásiť [Concept('war','vojna')|e] so svojím špeciálnym [ShowCasusBelliName('cb_resist_annexation')] [casus_belli|e].\n\n[Disloyal_subject|e] nemôže byť anektovaný." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_court_maintenance: "Náklady dvora"
 game_concept_court: "Dvor"
 game_concept_court_maintenance_desc: "Dvor je rozšírená domácnosť [Concept('ruler','panovník')|e], vrátane všetkých, ktorí ich pravidelne navštevujú. V najväčších dvoroch môže tento počet narásť na tisíce ľudí, zahŕňajúc kamarillu, personál domácnosti, duchovenstvo, šľachtu, stráže, harém, konkubíny, eunuchov a mnoho ďalších rolí. Títo ľudia nie sú zadarmo a táto hodnota predstavuje náklady na ich udržanie." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_diplomatic_maintenance: "Diplomatické výdavky" # todo: NEW TRANSLATION
 game_concept_diplomatic_maintenance_desc: "Ak to budeme potrebovať, počet [diplomats_with_icon|e] a naša [diplomatic_capacity_with_icon|e] sa dajú zvýšiť vynaložením dodatočného [Concept('gold','dukáta')|e].\n\nDiplomatické výdavky tiež zlepšujú [subject_loyalty_with_icon|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_maintenance: "Údržba" # todo: NEW TRANSLATION
 game_concept_maintaining: "Udržiavanie" # todo: NEW TRANSLATION
 game_concept_maintain: "Udržiavať" # todo: NEW TRANSLATION
 game_concept_maintenance_desc: "Každý mesiac musíme platiť [Concept('army_maintenance','údržba armády')|e] za naše [Concept('regiments','pluky')|e] a [Concept('navy_maintenance','údržba námorníctva')|e] za naše [Concept('ships','lode')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_army_maintenance: "Údržba armády" # todo: NEW TRANSLATION
 game_concept_army_maintenance_desc: "Musíme platiť, vybavovať, živiť a obliekať naše [Concept('armies','armády')|e], inak nebudú veľmi efektívne. Údržba armády je spôsob merania, koľko [Concept('gold','dukáty')|e] presúvame na zabezpečenie potrebného vybavenia pre naše [armies]. Bez toho utrpí [Concept('morale','morálka')|e] a naše jednotky budú menej účinné." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_navy_maintenance: "Údržba námorníctva" # todo: NEW TRANSLATION
 game_concept_navy_maintenance_desc: "Je pekné mať veľkú, lesklú flotilu [Concept('ships','lode')|e] pripravenú vyplávať. Tieto plavidlá sa však samy neudržiavajú: treba míňať [Concept('gold','dukáty')|e], aby zostali v dobrom stave. Údržba námorníctva meria, koľko prostriedkov presúvame na udržanie lodí v dobrom stave.\n\nPri nižšej údržbe utrpí [Concept('morale','morálka')|e], a naše lode budú menej efektívne v boji aj pri zvyšovaní [Concept('maritime_presence','námornej prítomnosti')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_fort_maintenance: "Údržba pevností" # todo: NEW TRANSLATION
 game_concept_fort_maintenance_desc: "[Forts|e] sú užitočné na odrážanie útočiacich [Concept('armies','armády')|e], ale vyžadujú [Concept('gold','dukáty')|e] na údržbu, aby boli schopné svoju úlohu plniť. Údržba pevností meria, koľko prostriedkov [Concept('country','krajiny')|e] presúva na zabezpečenie dobrého stavu [Concept('forts','pevností')|e]. Čím viac prostriedkov sa minie, tým účinnejšie pevnosti budú." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_cultural_maintenance: "Investovanie do kultúry" # todo: NEW TRANSLATION
 game_concept_cultural_maintenance_s: "Investícia do kultúry" # todo: NEW TRANSLATION
 game_concept_cultural_maintenance_desc: "Tieto peniaze sú vynakladané na [Concept('artists','umelcov')|e], aby mohli vytvárať lepšie [Concept('work_of_art','umelecké dielo')|e]. Tiež priamo zvyšujú [Concept('prestige','prestíž')|e] nášho [Concept('country','krajiny')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_colonial_maintenance: "Náklady na kolónie" # todo: NEW TRANSLATION
 game_concept_colonial_maintenance_desc: "Stojí [Concept('gold','dukáty')|e] posielať lode, ľudí a zásoby na udržanie [Concept('colonial_charter','koloniálna listina')|e]. Tieto náklady sú tu zobrazené." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_mercenary_income: "Príjem zo žoldnierov" # todo: NEW TRANSLATION
 game_concept_mercenary_income_desc: "To sú [Concept('gold','dukáty')|e], ktoré získavame prenájmom našich [Concept('armies','armád')|e] alebo [Concept('navies','námorné sily')|e] ako [Concept('mercenaries','žoldnieri')|e] iným [Concept('countries','krajine')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_mercenary_expense: "Najímanie žoldnierov" # todo: NEW TRANSLATION
 game_concept_mercenary_expense_desc: "To sú naše náklady na najímanie [Concept('mercenaries','žoldnieri')|e], aby za nás bojovali." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_subsidy_expense: "Dotácie na budovy" # todo: NEW TRANSLATION
 game_concept_subsidy_expense_desc: "Niektoré [Concept('buildings','budovy')|e] nemusia byť ziskové, ale potrebujeme [Concept('goods','tovary')|e], ktoré vyrábajú. Takýmto budovám je možné poskytnúť [Concept('subsidy','dotácia')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_subsidy: "Dotácia" # todo: NEW TRANSLATION
 game_concept_subsidy_desc: "Keď [Concept('building','budova')|e] nie je ziskový, nekúpi potrebné [Concept('goods','tovary')|e] a nebude fungovať. [Country|e] môže rozhodnúť dotovať [building], platením mu dosť [Concept('gold','dukáty')|e] každý mesiac, aby prežil." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_exploration_expense: "Náklady na prieskum" # todo: NEW TRANSLATION
 game_concept_exploration_expense_desc: "[Exploration|e] misie majú náklady na údržbu, ktoré môžu byť znížené určitými [Concept('advances','pokrokmi')|e], [Concept('laws','zákonmi')|e] a [Concept('privileges','privilégiá')|e], ako aj [Concept('explorer','prieskumník')|e]ovou schopnosťou [Concept('adm','administratívnou schopnosťou')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_diplomatic_income: "Diplomatický príjem" # todo: NEW TRANSLATION
 game_concept_diplomatic_income_s: "Diplomacia" # todo: NEW TRANSLATION
 game_concept_diplomatic_income_desc: "To je suma prichádzajúca do našej [Concept('treasury','pokladnice')|e] od iných [Concept('countries','krajín')|e], či sa im to páči alebo nie." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_diplomatic_expense: "Diplomatické výdavky" # todo: NEW TRANSLATION
 game_concept_diplomatic_expense_s: "Diplomacia" # todo: NEW TRANSLATION
 game_concept_diplomatic_expense_desc: "Či už dohodou alebo silou, toto je suma odčítaná z našej [Concept('treasury','pokladnice')|e] inými [Concept('countries','krajín')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_stability_investment: "Investícia do stability" # todo: NEW TRANSLATION
 game_concept_stability_investment_s: "Stabilita" # todo: NEW TRANSLATION
 game_concept_stability_investment_desc: "Vynaloženie časti [Concept('budget','rozpočtu')|e] na [Concept('stability','stabilitu')|e] je jedným z troch hlavných spôsobov, ako zvýšiť stabilitu; ostatné zahŕňajú použitie [Concept('cabinet_actions','akcie kabinetu')|e] alebo mať dostatok [ShowEstateTypeName('clergy_estate')] primárneho [Concept('primary_religion','hlavné náboženstvo')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_sound_toll: "Prieplavné mýto" # todo: NEW TRANSLATION
 game_concept_sound_tolls: "Prieplavné mýta" # todo: NEW TRANSLATION
 game_concept_sound_toll_desc: "Existujú niektoré úžiny na svete, kde môže kontrolor vyberať poplatok od [Concept('trades','obchodov')|e] plaviacich sa okolo. Napríklad:\n$BULLET_WITH_TAB$[ShowLocationName('oresund')]\n$BULLET_WITH_TAB$[ShowLocationName('gulf_izmit')]\n\nKaždý Sound Toll je viazaný na konkrétnu pevninskú [Concept('location','lokalitu')|e], ktorú musíte vlastniť, aby ste boli kontrolorom úžiny, a [Concept('income','príjem')|e] generovaný z mýta je škálovaný podľa vášho [Concept('control','kontroly')|e] v tejto [location]." # todo: CHANGED # todo: CONCEPT CASE
 game_concept_great_power_score: "Skóre veľmoci $game_concept_great_power_score_short$" # todo: NEW TRANSLATION
 game_concept_great_power_score_short: "Skóre" # todo: NEW TRANSLATION
 game_concept_great_power_points: "Body veľmoci $game_concept_great_power_points_short$" # todo: NEW TRANSLATION
 game_concept_great_power_points_short: "Body" # todo: NEW TRANSLATION
 game_concept_great_power_points_desc: "Body veľmoci merajú, koľko svetového ekonomického územia [Concept('country','krajinu')|e] dominuje. [country] získava body kontrolovaním aspoň dvoch tretín vlastniteľné [Concept('locations','lokality')|e] v [Concept('area','oblasti')|e], pričom [Concept('subjects','vazaloch')|e] sa počítajú zníženou mierou. Každá oblasť je hodnotená 1–10 bodmi na základe svojho potenciálu daňového základu v porovnaní so svetovým mediánom.\n\nNázbierajte dostatok bodov, aby ste sa stali [Concept('regional_power','regionálna mocnosť')|e] alebo [Concept('great_power','veľmoc')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_great_power_score_desc: "Skóre veľmoci je nepochybným meradlom, ktorá [Concept('country','krajina')|e] je najlepšia. Najvyššie hodnotené $game_concept_countries$ sú [Concept('great_powers','veľmoci')|e]. Celkový počet veľmocí sa mení v závislosti od porovnania skóre najvyššej veľmoci s ostatnými.\n\nKrajiny získavajú $game_concept_great_power_score_short$ vlastníctvom väčšej [Concept('population','populácie')|e], vyššieho [Concept('prestige','prestíže')|e], zvýšením [Concept('country_rank','rangom krajiny')|e] a rôznymi ďalšími zdrojmi.\n\n[Subjects|e] tiež odovzdávajú určitú percentuálnu časť svojho skóre svojmu [overlord|e], v závislosti od ich [Concept('subject_type','druh vazala')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_great_power_rank: "Veľmoc $game_concept_great_power_rank_short$" # todo: NEW TRANSLATION
 game_concept_great_power_rank_short: "Poradie" # todo: NEW TRANSLATION
 game_concept_great_power_rank_desc: "Poradie veľmocí ukazuje aktuálnu pozíciu, ktorú [Concept('country','krajinu')|e] zaujíma v závode o konečné víťazstvo. Poradie sa rozhoduje súčtom [great_power_score|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_event: "Udalosť" # todo: NEW TRANSLATION
 game_concept_events: "Udalosti" # todo: NEW TRANSLATION
 game_concept_event_desc: "Udalosti sú udalosti, ktoré sa dejú [Concept('country','krajina')|e] počas hry, ak sú splnené ich podmienky. Zvyčajne majú pripojený [Concept('effect','efekt')|e] a rozprávajú kus príbehu v hre.\nNiektoré [countries] majú prístup k [Concept('dynamic_historical_events','dynamickým historickým udalostiam')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_dynamic_historical_event: "Dynamická historická udalosť" # todo: NEW TRANSLATION
 game_concept_dynamic_historical_events: "Dynamické historické udalosti" # todo: NEW TRANSLATION
 game_concept_dynamic_historical_event_desc: "Sú to historické [Concept('events','udalosti')|e], ktoré sa stanú konkrétnej [Concept('country','krajine')|e] v zadanom časovom období, ak sú podmienky správne." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_historical_option: "Historická možnosť" # todo: NEW TRANSLATION
 game_concept_historical_option_desc: "Toto je historická [Concept('event','udalosť')|e], a táto [Concept('event_option','možnosť udalosti')|e] je tá, ktorá vás prinúti urobiť rovnaké rozhodnutie, aké krajina urobila v histórii." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_event_option: "Možnosť udalosti" # todo: NEW TRANSLATION
 game_concept_event_option_desc: "Každá [Concept('event','udalosť')|e] má aspoň jednu možnosť, ktorú môže hráč vybrať. Ak je udalosť [Concept('dynamic_historical_event','dynamická historická udalosť')|e], môže mať [Concept('historical_option','historická možnosť')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_mission: "Misia" # todo: NEW TRANSLATION
 game_concept_missions: "Misie" # todo: NEW TRANSLATION
 game_concept_mission_desc: "Misie sú balíčky jednotlivých [Concept('tasks','úlohy')|e], ktoré sú dostupné [Concept('country','krajina')|e]. Slúžia ako vodítko pre [country] a poskytujú užitočné odmeny po splnení úlohy alebo všetkých úloh, podľa nastavení." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_mission_task: "Úloha misie" # todo: NEW TRANSLATION
 game_concept_mission_tasks: "Úlohy misií" # todo: NEW TRANSLATION
 game_concept_task: "Úloha" # todo: NEW TRANSLATION
 game_concept_tasks: "Úlohy" # todo: NEW TRANSLATION
 game_concept_mission_task_desc: "Úloha je časť [Concept('mission','misie')|e]. Skladá sa z požiadavky a môže obsahovať odmenu, ak je spomínaná podmienka splnená. Všetky úlohy musia byť dokončené, aby bola [mission] ukončená." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_infiltrate_administration: "Infiltrovať administratívu" # todo: NEW TRANSLATION
 game_concept_infiltrate_administration_desc: "Toto nám umožňuje odstrániť [Concept('fog_of_war','vojnová hmla')|e] nad inou [Concept('country','krajinou')|e] na určitú dobu." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_coastal: "Pobrežný" # todo: NEW TRANSLATION
 game_concept_coast: "Pobrežie" # todo: NEW TRANSLATION
 game_concept_coastal_desc: "[Location|e], ktoré je pobrežné, je v kontakte s [Concept('seazone','morskou zónou')|e], a preto bude mať [Concept('port','prístav')|e] a bude môcť stavať [Concept('ships','lode')|e], ak má príslušný [Concept('building','budova')|e], ako [ShowBuildingTypeName('wharf')] alebo [ShowBuildingTypeName('dock')]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_inland: "Vnútrozemský" # todo: NEW TRANSLATION
 game_concept_inland_desc: "[Location|e], ktoré je vnútrozemské, nie je v kontakte so žiadnou [Concept('seazone','morskou zónou')|e], takže nebude mať [Concept('port','prístav')|e] a nebude môcť stavať [Concept('ships','lode')|e].\n\nOpakom vnútrozemského lokality je [Concept('coastal','pobrežný')|e] lokality." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_disembark: "Vylodenie" # todo: NEW TRANSLATION
 game_concept_embarking: "Naloďovanie" # todo: NEW TRANSLATION
 game_concept_disembarked: "Vylodené" # todo: NEW TRANSLATION
 game_concept_embarking_desc: "[Army|e], ktorá je prepravovaná [Concept('navy','námorníctvo')|e], sa môže vylodiť z [Concept('seazone','morskej zóny')|e] na susedné [Concept('coastal','pobrežného')|e] [Concept('location','lokalitu')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_embarkings: "Naloďovania" # todo: NEW TRANSLATION
 game_concept_embarkings_desc: "[Army|e], ktorá je prepravovaná [Concept('navy','námorníctvo')|e], sa môže vylodiť z [Concept('seazone','morskej zóny')|e] na susedné [Concept('coastal','pobrežného')|e] [Concept('location','lokalitu')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_gold: "Dukáty" # todo: NEW TRANSLATION
 game_concept_gold_i: "@gold!" # todo: NEW TRANSLATION
 game_concept_gold_desc: "Predstavuje likvidné bohatstvo; je to primárna forma meny v každom [Concept('country','krajine')|e]. Množstvo dukátov, ktoré [country] momentálne vlastní, je jeho [Concept('treasury','pokladnice')|e].\n\nDukáty možno generovať prostredníctvom [Concept('taxes','daní')|e] od [Concept('estates','stavov')|e] a [Concept('subjects','vazalov')|e], a vynakladajú sa takmer na všetko, od stavby [Concept('buildings','budovy')|e] po údržbu [Concept('armies','armády')|e]. Menia majiteľa pri nákupe a predaji [Concept('food','potravinách')|e] a [Concept('goods','tovary')|e] a môžu byť investované do [Concept('stability','stability')|e] a [Concept('court','dvora')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_improve_relations: "Zlepšiť vzťahy" # todo: NEW TRANSLATION
 game_concept_improve_relation: "Zlepšiť vzťah" # todo: NEW TRANSLATION
 game_concept_improve_relations_desc: "Je to [Concept('diplomacy','diplomacia')|e] akcia s úmyslom zlepšiť [Concept('opinion','názor')|e], ktorú má iná [Concept('country','krajiny')|e] o našom [country]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_winter: "Zima" # todo: NEW TRANSLATION
 game_concept_winters: "Zimy" # todo: NEW TRANSLATION
 game_concept_winter_desc: "Zima vplýva na [Concept('locations','lokality')|e] negatívne. Spôsob, akým sa každá zima prejaví, je náhodný, ale jej závažnosť, alebo [Concept('winter_level','úroveň zimy')|e], je ovplyvnená [Concept('climate','klíma')|e].\n\nMesiace, v ktorých nastane zima, závisia od [Concept('hemisphere','pologule')|e] [location]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_winter_level: "Úroveň zimy" # todo: NEW TRANSLATION
 game_concept_winter_levels: "Úrovne zimy" # todo: NEW TRANSLATION
 game_concept_winter_level_max: "Maximálna úroveň zimy" # todo: NEW TRANSLATION
 game_concept_winter_level_desc: "Úroveň zimy (Winter Level) je závažnosť [Concept('winter','zima')|e] v [Concept('location','lokalite')|e]. Prísnejšia [winter] zastaví [Concept('constructions','výstavby')|e] a dokonca môže [Concept('frozen_freeze_over','zamrznúť')|e] niektoré plytké [Concept('seazones','morské zóny')|e].\n\n[Concept('armies','Armády')|e] nemôžu vstúpiť do [locations] s [ShowTopographyName('mountains')] [Concept('topography','topografiou')|e] počas Normálnej alebo Prísnej [winter].\n\n[armies] ukryté v priateľskom [Concept('fort','pevnosti')|e] alebo v jeho [Concept('zone_of_control','zóne kontroly')|e] netrpia zimným [Concept('attrition','vyčerpaním')|e]. Táto ochrana sa vzťahuje aj na pevnosti vlastnené vašimi priamymi [Concept('subjects','vazalmi')|e] a na vášho priameho [overlord|e].\n\nMaximálna Úroveň zimy, ktorú [location] môže zažiť, závisí od miestneho [Concept('climate','klímy')|e].\n\nÚrovne zimy sú nasledovné:\n- [ShowModifier('winter_none')]\n- [ShowModifier('winter_mild')]\n- [ShowModifier('winter_normal')]\n- [ShowModifier('winter_severe')]" # todo: CHANGED # todo: CONCEPT CASE
 game_concept_hemisphere: "Pologuľa" # todo: NEW TRANSLATION
 game_concept_hemisphere_desc: "Každé [Concept('location','lokalita')|e] leží v jednej z dvoch polgúľ: na severe alebo na juhu od rovníka.\n\nPolkula primárne určuje mesiace, v ktorých je pravdepodobné, že nastane [Concept('winter','zima')|e]: okolo januára na severnej polkuli a okolo júna na južnej polkuli." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_tolerance: "Tolerancia" # todo: NEW TRANSLATION
 game_concept_tolerance_desc: "Tolerancia predstavuje, s akým rešpektom je obyvateľstvo určitého [Concept('religion','náboženstva')|e] v spoločnosti zaobchádzané. Každý [Concept('country','krajina')|e] má odlišnú hodnotu toleranciu voči svojej [Concept('primary_religion','hlavnému náboženstvu')|e], voči [Concept('heretics','kacírom')|e] a voči [Concept('heathens','neznabohom')|e].\n\nPozitívna hodnota $game_concept_tolerance$ zvyšuje [Concept('pop_satisfaction','spokojnosť populácie')|e] [Concept('pops','populácií')|e], ako aj [Concept('diplomatic_opinion','diplomatický názor')|e] voči krajine danej náboženstvu. Naopak, negatívna $game_concept_tolerance$ zvyšuje [Concept('unrest','nepokoje')|e] a znižuje $game_concept_diplomatic_opinions$." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_tolerance_list: "$BULLET_WITH_TAB$[Concept('primary_religion_tolerance','Tolerancia hlavného náboženstva')|e]\n$BULLET_WITH_TAB$[Concept('heretic_tolerance','Tolerancia kacírov')|e]\n$BULLET_WITH_TAB$[Concept('heathenry_tolerance','Tolerancia neznabohov')|e]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_true_faith_tolerance: "Tolerancia pravého náboženstva" # todo: NEW TRANSLATION
 game_concept_primary_religion_tolerance: "Tolerancia hlavného náboženstva" # todo: NEW TRANSLATION
 game_concept_true_faith_tolerance_desc: "Tolerancia hlavného náboženstva predstavuje, ako veľmi [Concept('country','krajina')|e] uprednostňuje nasledovníkov svojho [Concept('primary_religion','hlavného náboženstva')|e]. Ovplyvňuje [Concept('pop_satisfaction','spokojnosť populácie')|e] [Concept('pops','populácií')|e] príslušnej $game_concept_primary_religion a mení [Concept('diplomatic_opinion','diplomatický názor')|e] krajiny voči bratským krajine.\n\nTolerancia hlavného náboženstva je vo všeobecnosti predvolene kladná a môže byť ďalej zvýšená určitými [Concept('laws','zákonmi')|e], [Concept('privileges','privilégiami')|e] a [Concept('societal_values','sociálne hodnoty')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_heretic_tolerance: "Tolerancia kacírov" # todo: NEW TRANSLATION
 game_concept_heretic_tolerance_desc: "Tolerancia kacírov predstavuje spoločenskú a politickú diskrimináciu, ktorej sú [Concept('heretics','kacíri')|e] v [Concept('country','krajine')|e] vystavení. Ovplyvňuje [Concept('pop_satisfaction','spokojnosť populácie')|e] heretických [Concept('pops','populácií')|e] a mení [Concept('diplomatic_opinion','diplomatický názor')|e] krajiny voči heretickým krajinám.\n\nTolerancia kacírov je vo všeobecnosti predvolene nízka a môže byť upravená určitými [Concept('laws','zákonmi')|e], [Concept('privileges','privilégiami')|e] a [Concept('societal_values','sociálne hodnoty')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_heathenry_tolerance: "Tolerancia neznabohov" # todo: NEW TRANSLATION
 game_concept_heathenry_tolerance_desc: "Tolerancia neznabohov predstavuje spoločenskú a politickú diskrimináciu, ktorej sú [Concept('heathens','neznabohovia')|e] v [Concept('country','krajine')|e] vystavení. Ovplyvňuje [Concept('pop_satisfaction','spokojnosť populácie')|e] pohanských [Concept('pops','populácií')|e] a mení [Concept('diplomatic_opinion','diplomatický názor')|e] krajiny voči pohanským krajine.\n\nTolerancia neznabohov je vo väčšine prípadov predvolene veľmi nízka a môže byť upravená určitými [Concept('laws','zákonmi')|e], [Concept('privileges','privilégiami')|e] a [Concept('societal_values','sociálne hodnoty')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_autocephalous_patriarchate: "Autokefálny patriarchát" # todo: NEW TRANSLATION
 game_concept_autocephalous_patriarchates: "Autokefálne patriarcháty" # todo: NEW TRANSLATION
 game_concept_autocephalous_patriarchate_desc: "Autokefálny patriarchát je skupina [Concept('countries','krajiny')|e] toho istého východného [ShowReligionGroupAdjective('christian')] [Concept('religion','náboženstva')|e], ktorá má na čele svojej cirkvi jedného biskupa, ktorý nepodlieha žiadnemu inému v rámci [religion]. [Concept('international_organization_leader_short','Líder')|e] autokefálneho patriarchátu získava dodatočné výhody a členstvo môže prinášať výhody, až kým člen [country] neprerastie [international_organization_leader_short], kedy môže byť výhodné odbočiť a vytvoriť vlastný patriarchát. Ak má patriarchát vo svojom území [Concept('holy_site','svätom mieste')|e], môže byť sídlo patriarchátu presunuté tam pre ďalšie výhody." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_sect: "Sekta" # todo: NEW TRANSLATION
 game_concept_sects: "Sekty" # todo: NEW TRANSLATION
 game_concept_sect_desc: "$sect_desc$" # todo: NEW TRANSLATION
 game_concept_hindu_branch: "Hinduistická odnož" # todo: NEW TRANSLATION
 game_concept_hindu_branches: "Hinduistické odnože" # todo: NEW TRANSLATION
 game_concept_hindu_branch_desc: "$hindu_branch_desc$" # todo: NEW TRANSLATION
 game_concept_subsidization: "Dotovanie" # todo: NEW TRANSLATION
 game_concept_subsidize: "Dotovať" # todo: NEW TRANSLATION
 game_concept_subsidized: "Dotované" # todo: NEW TRANSLATION
 game_concept_subsidization_desc: "Niektoré výrobné [Concept('buildings','budovy')|e] môžu mať svoje finančné straty [Concept('subsidized','dotované')|e] ich [Concept('owner','majiteľ')|e]. Akékoľvek [Concept('gold','dukáty')|e] straty, ktoré takáto budova môže spôsobovať, budú vyplatené priamo z [Concept('country','krajiny')|e] [Concept('balance','bilancie')|e], čo jej umožní fungovať normálne." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_special_status: "Špeciálny status" # todo: NEW TRANSLATION
 game_concept_special_statuses: "Špeciálne statusy" # todo: NEW TRANSLATION
 game_concept_special_status_desc: "Členovia so Špeciálnym statusom v [international_organization|e] majú určité privilégiá alebo majú plniť určité povinnosti. V niektorých prípadoch má [Concept('international_organization_leader_short','líder')|e] organizácie špeciálny status, ktorý zdôrazňuje ich jedinečnú pozíciu. Iné organizácie majú namiesto toho [electors|e], ktorí sú reprezentovaní špeciálnym statusom." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_special_status_power: "Moc špeciálneho statusu" # todo: NEW TRANSLATION
 game_concept_special_status_power_short: "Moc" # todo: NEW TRANSLATION
 game_concept_special_status_power_desc: "Toto je politická sila, ktorú má skupina [Concept('members','členovia')|e] so špecifickým [Concept('special_status','špeciálnym statusom')|e] v [international_organization|e]. Tento vplyv môže byť relevantný pri schvaľovaní určitých [Concept('parliament_issues','parlamentných záležitostiach')|e] v [Concept('parliament','parlamente')|e], pokiaľ nie sú vyriešené prostredníctvom [Concept('resolution','rezolúcie')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_international_organization_variable: "Hodnota medzinárodnej organizácie" # todo: NEW TRANSLATION
 game_concept_international_organization_variable_desc: "Hodnoty v [international_organization|e] môžu predstavovať rôzne mechaniky v závislosti od $game_concept_international_organization$. V niektorých prípadoch predstavujú autoritu [Concept('international_organization_leader_short','lídra')|e] organizácie, napríklad v [GetUniqueInternationalOrganization('hre').GetName] alebo v [GetUniqueInternationalOrganization('middle_kingdom').GetName]. V iných prípadoch, napríklad v [GetInternationalOrganizationType('sect').GetName], predstavujú vplyv samotného $game_concept_international_organization$. Môžu existovať aj iné využitia týchto hodnôt, ktoré budú závisieť od typu každého $game_concept_international_organization$." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_land_ownership_rule: "Pravidlo vlastníctva pôdy" # todo: NEW TRANSLATION
 game_concept_land_ownership_rule_desc: "Niektoré [Concept('international_organizations','medzinárodné organizácie')|e] sú schopné vlastniť [Concept('locations','lokality')|e]. Pravidlo vlastníctva pôdy popisuje povahu tohto vlastníctva a aké [Concept('modifiers','modifikátory')|e] sa uplatňujú na tieto Locations." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_international_organization_leader: "Líder medzinárodnej organizácie" # todo: NEW TRANSLATION
 game_concept_international_organization_leader_short: "Líder" # todo: NEW TRANSLATION
 game_concept_international_organization_leader_desc: "[Concept('international_organization','Medzinárodná organizácia')|e] môže mať za svojho [Concept('international_organization_leader_short','lídra')|e] určitý [Concept('country','krajina')|e]. Každá [international_organization] je iná, ale vo všeobecnosti ide o najsilnejší [Concept('country','krajinu')|e] v danej [international_organization].\n\nNiektoré organizácie majú systém hlasovania pre [country], ktoré má byť [international_organization_leader_short], zatiaľ čo iné sa spoliehajú na iné systémy pre určenie vedenia, a niektoré organizácie nemusia mať [international_organization_leader_short] vôbec." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_hre_emperor: "Cisár" # todo: NEW TRANSLATION
 game_concept_hre_emperor_desc: "Cisár je [international_organization_leader_short] [Concept('holy_roman_empire','svätej rímskej ríše')|e]. Je povinnosťou cisára chrániť [Concept('members','členovia')|e] pred vonkajšími a vnútornými hrozbami." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_hre_law_level: "Úroveň cisárskeho zákona" # todo: NEW TRANSLATION
 game_concept_hre_law_level_desc: "Úroveň zákona popisuje, do akej miery je konkrétny zákon pre [Concept('holy_roman_empire','svätú rímsku ríšu')|e] decentralizovaný alebo centralizovaný. Nižšia úroveň predstavuje vyššiu moc [Concept('hre_emperor','cisár')|e], zatiaľ čo vyššia úroveň predstavuje decentralizovaný stav.\n\nReformy je možné schvaľovať iba na susedných úrovniach, čo znamená, že cisár nemôže zvoliť reformu úrovne 2, ak je súčasný zákon na úrovni 4. Väčšina [Concept('laws','zákonov')|e] začína na úrovni #Y 3#!" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_holy_roman_empire: "Svätá rímska ríša" # todo: NEW TRANSLATION
 game_concept_hre: "SRR" # todo: NEW TRANSLATION
 game_concept_holy_roman_empire_desc: "[GetUniqueInternationalOrganization('hre').GetName] je [Concept('international_organization','medzinárodná organizácia')|e], ktorá dominuje politickej sfére [ShowRegionName('north_german_region')], [ShowRegionName('south_german_region')] a čiastočne [ShowRegionName('italy_region')] a [ShowRegionName('france_region')]. [GetUniqueInternationalOrganization('hre').GetNameWithNoTooltip] je zmes nespočetných [Concept('countries','krajín')|e] od bezvýznamných po stredné mocnosti, ktoré všetky spadajú pod ochranu svojho [Concept('international_organization_leader_short','lídra')|e].\n\n[GetUniqueInternationalOrganization('hre').GetLeaderTitle] je hlavou tejto organizácie, ktorá je do tejto pozície volená." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_hre_electoral_college: "Zbor kurfirstov" # todo: NEW TRANSLATION
 game_concept_hre_electoral_college_desc: "Zbor kurfirstov pozostáva z [ShowSpecialStatusNamePlural('elector')] [GetUniqueInternationalOrganization('hre').GetName].\n\nZákon [ShowLawName('golden_bull')] ovplyvňuje spôsob, akým [ShowSpecialStatusNamePluralWithNoTooltip('elector')] odovzdávajú svoje hlasy z nasledujúcich dôvodov:\n- vplyv [Concept('country_rank','rang krajiny')|e] je stanovený\n- vplyv [Concept('opinion','názor')|e] je polovičný\n- vplyv [great_power_score|e] je znásobený štyrikrát" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_trade_range: "Obchodný dosah" # todo: NEW TRANSLATION
 game_concept_trade_range_desc: "Definuje, ako ďaleko môže [Concept('country','krajina')|e] obchodovať bez dodatočných nákladov. Trasy v rámci neobchodného dosahu nemajú žiadny ďalší prepravný penal.\n\nTrasy, ktoré ho prekračujú, sú stále možné, ale prepravné náklady rastú s distanciou nad limitom rozsahu.\n\nVäčší neobchodného dosahu robí dlhé trasy — ako koloniálne tovary z Nového sveta alebo korenie z Ázie — dostupnejšími posunutím väčšej časti každej trasy do zóny bez poplatkov.\n\nObchodný dosah možno primárne zvýšiť prostredníctvom [Concept('advances','pokrokov')|e], hoci niektoré [Concept('laws','zákonov')|e], [Concept('privileges','privilégií')|e] a [Concept('reforms','reforiem')|e] ho môžu tiež ovplyvniť." # todo: CHANGED # todo: CONCEPT CASE
 game_concept_parliament: "Parlament" # todo: NEW TRANSLATION
 game_concept_parliament_desc: "[Concept('country','Krajina')|e] môže zvolať svoje [Concept('estates','stavy')|e] do zasadnutia $game_concept_parliament$, aby vyriešilo akékoľvek [Concept('parliament_issue','parlamentná záležitosť')|e], ktoré môžu mať, a zároveň získať príležitosti vytvoriť [Concept('casus_belli','casus Belli')|e], zvýšiť [Concept('taxes','dane')|e], navýšiť [Concept('army_levies','armádny branci')|e] a [Concept('navy_levies','povolané loďstvo')|e], alebo zmeniť niektoré z aktuálnych [Concept('laws','zákonov')|e]. Akékoľvek [Concept('estate','stav')|e] môže mať [Concept('parliament_agenda','parlamentná agenda')|e], ktoré treba vyriešiť predtým, než prisľúbia svoju podporu.\n\nParlament sa môže konať v [Concept('capital','hlavnom meste')|e] alebo inom [Concept('location','lokalite')|e], pokiaľ ide o mesto, mesto s privilégiami alebo [Concept('province_capital','hlavné mesto provincie')|e], a má viac než jednu [Concept('proximity','blízkosť')|e], ktorá dostáva malé výhody. Ak sa [location] stane [Concept('occupied','okupované')|e], $game_concept_parliament$ zlyhá.\n\n[Concept('international_organizations','Medzinárodné organizácie')|e], ako [GetUniqueInternationalOrganization('hre').GetName], môžu tiež mať $game_concept_parliament$. Systém parlamentu však závisí od typu organizácie, pretože niektoré vyžadujú podporu [Concept('members','členov')|e] so špecifickým [Concept('special_status','špeciálnym statusom')|e] a ich [Concept('special_status_power','moc špeciálneho statusu')|e] na schválenie." # todo: CHANGED # todo: CONCEPT CASE
 game_concept_parliament_seat: "Sídlo parlamentu" # todo: NEW TRANSLATION
 game_concept_parliament_seat_desc: "Toto je [Concept('location','lokalita')|e], v ktorom sa koná [Concept('parliament','parlament')|e] [Concept('country','krajiny')|e] alebo [Concept('international_organization','medzinárodná organizácia')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_parliament_type: "Typ parlamentu" # todo: NEW TRANSLATION
 game_concept_parliament_types: "Typy parlamentov" # todo: NEW TRANSLATION
 game_concept_parliament_type_desc: "[Concept('parliament','Parlament')|e] môže byť rôzneho [parliament_type]. To ovplyvňuje, ako parlament funguje.\n\n[ShowParliamentTypes]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_parliament_agenda: "Parlamentná agenda" # todo: NEW TRANSLATION
 game_concept_parliament_agenda_short: "Agenda" # todo: NEW TRANSLATION
 game_concept_parliament_agendas: "Parlamentné agendy" # todo: NEW TRANSLATION
 game_concept_parliament_agendas_short: "Agendy" # todo: NEW TRANSLATION
 game_concept_parliament_agenda_desc: "Každé [Concept('estate','stav')|e] môže mať $game_concept_parliament_agenda$, ktorú treba vyriešiť, než prisľúbi svoju podporu. Toto môže byť pre [Concept('country','krajinu')|e] nákladné, pretože poskytnutá podpora závisí od [Concept('estate_power','sily stavu')|e], ktorú dané estate má.\n\nV kontexte [Concept('international_organizations','medzinárodných organizáciách')|e] predstavia [Concept('members','členovia')|e] so [Concept('special_status','špeciálnym statusom')|e] namiesto toho svoju parlamentnú agendu. Prijatie týchto agend môže poskytnúť ich garantovanú podporu vo forme ich [Concept('special_status_power','moc špeciálneho statusu')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_parliament_issue: "Parlamentná záležitosť" # todo: NEW TRANSLATION
 game_concept_parliament_issue_short: "Záležitosť" # todo: NEW TRANSLATION
 game_concept_parliament_issues: "Parlamentné záležitosti" # todo: NEW TRANSLATION
 game_concept_parliament_issues_short: "Záležitosti" # todo: NEW TRANSLATION
 game_concept_parliament_issue_desc: "Ide o niečo, o čom sa už dlhšie debatovalo a čo bude potrebné vyriešiť v [Concept('parliament','parlamente')|e] [Concept('estates','stavoch')|e], inak sa [Concept('country','krajinu')|e] oslabí.\n\nV prípade [Concept('international_organizations','medzinárodných organizáciách')|e] je potrebné tieto debaty prerokovať s mocnými [Concept('members','členmi')|e] so [Concept('special_status','špeciálnym statusom')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_parliament_support: "Podpora parlamentu" # todo: NEW TRANSLATION
 game_concept_parliament_support_short: "Podpora" # todo: NEW TRANSLATION
 game_concept_parliament_support_desc: "Toto je hodnota, ktorá reprezentuje, nakoľko je [Concept('parliament','parlament')|e] ochotný schváliť [Concept('parliament_issue','parlamentná záležitosť')|e]. Je tiež potrebná, keď štát chce vykonať konkrétna [Concept('parliament_request','parlamentná požiadavka')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_parliament_base_support: "Základná podpora parlamentu" # todo: NEW TRANSLATION
 game_concept_parliament_base_support_short: "Základná podpora" # todo: NEW TRANSLATION
 game_concept_parliament_base_support_desc: "To ovplyvňuje počiatočnú [Concept('parliament_support','podporu parlamentu')|e], keď sa zvolá [Concept('parliament','parlament')|e]. Zvyšuje sa hlavne [Concept('crown_power','moc koruny')|e], ale ovplyvniť ju môžu aj [Concept('laws','zákony')|e], [Concept('government_reforms','vládne reformy')|e] a [Concept('advances','pokroky')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_parliament_requests: "Parlamentné požiadavky" # todo: NEW TRANSLATION
 game_concept_parliament_requests_desc: "Ide o akcie, za ktoré môže [Concept('country','krajina')|e] minúť [Concept('parliament_support','podpora parlamentu')|e], aby ich prerokoval." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_parliament_request: "Parlamentná požiadavka" # todo: NEW TRANSLATION
 game_concept_parliament_request_desc: "Ide o akciu, za ktorú môže [Concept('country','krajina')|e] minúť [Concept('parliament_support','podpora parlamentu')|e], aby ju prerokoval." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_isolate: "Izolovať" # todo: NEW TRANSLATION
 game_concept_isolation: "Izolácia" # todo: NEW TRANSLATION
 game_concept_isolated: "Izolovaný" # todo: NEW TRANSLATION
 game_concept_isolate_desc: "[Concept('country','Krajina')|e], ktoré je izolované, nedovolí žiadnej inej krajine [Concept('export','vývozu')|e] alebo [Concept('import','dovoz')|e] [Concept('goods','tovarov')|e] v ich [Concept('markets','trhy')|e]. Môžu niektorým krajinám udeliť výhradné práva, aby tieto pravidlá obchádzali." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_total_ability: "Celková schopnosť" # todo: NEW TRANSLATION
 game_concept_total_ability_desc: "Celková schopnosť [Concept('character','postava')|e] je súčet všetkých ich [Concept('adm_short','administratívny')|e], [Concept('dip_short','diplomatický')|e] a [Concept('mil_short','vojenský')|e] [Concept('ability','schopnosti')|e] skóre." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_legislative_efficiency: "Legislatívna efektívnosť" # todo: NEW TRANSLATION
 game_concept_legislative_efficiency_desc: "Ovplyvňuje, ako rýchlo môže [Concept('country','krajina')|e] zavádzať [Concept('laws','zákony')|e], [Concept('government_reforms','vládne reformy')|e] a [Concept('estate_privileges','privilégiá stavov')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_victory_card: "Víťazná karta" # todo: NEW TRANSLATION
 game_concept_victory_cards: "Víťazné karty" # todo: NEW TRANSLATION
 game_concept_victory_card_desc: "Víťazná karta je cieľ dobyť celé [Concept('area','oblasť')|e] na mape pre [Concept('country','krajinu')|e]. Keď je celé územie [Concept('owned','vlastnené')|e], [Concept('controlled','kontrolované')|e] a má [Concept('core','jadro')|e], krajina získa [Concept('score','skóre')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_map_mode_slot: "Slot režimu mapy" # todo: NEW TRANSLATION
 game_concept_map_mode_slots: "Sloty režimov mapy" # todo: NEW TRANSLATION
 game_concept_map_mode_slot_desc: "Slot režimu mapy je kontajner s niekoľkými mapovými režimami. Kliknite opakovane na slot, aby ste medzi nimi prechádzali. Otvorte kategóriu mapových režimov a pravým klikom pridajte akýkoľvek režim do slotu." # todo: NEW TRANSLATION
 game_concept_score: "Skóre" # todo: NEW TRANSLATION
 game_concept_score_desc: "Toto je spôsob, ako sledovať, ako dobre sa [Concept('country','krajinu')|e] darí. Každá krajina je hodnotená v [Concept('adm_short','administratívnom')|e], [Concept('dip_short','diplomatickom')|e] a [Concept('mil_short','vojenskom')|e] výkone a získa skóre podľa svojho poradia v týchto kategóriách.\nVäčšie krajiny tiež získavajú skóre držaním [Concept('victory_cards','víťaznými kartami')|e], ktoré dostanú jednu v každom [Concept('age','veku')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_tithe: "Desiatok" # todo: NEW TRANSLATION
 game_concept_tithe_desc: "Toto je množstvo [Concept('gold','dukáty')|e] vyzbierané od všetkých [Concept('pops','populácií')|e] [ShowReligionAdjective('catholic')] viery v krajinách, ktoré nasledujú rovnakú vieru, a odovzdané Pápežstvu. Krajiny s negatívnym [Concept('opinion','názorom')|e] na Pápežstvo nebudú platiť desiatok." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_legal_male: "Legálne muž" # todo: NEW TRANSLATION
 game_concept_legal_male_plural: "Legálni muži" # todo: NEW TRANSLATION
 game_concept_legally_male: "Legálne muž" # todo: NEW TRANSLATION
 game_concept_legal_male_desc: "Legálne muž je ženská postava [Concept('character','postava')|e], ktorá je podľa zákona považovaná za muža. To jej dáva rovnaké práva ako jej mužským náprotivok pri otázke [Concept('heir_selection','nástupníckemu právu')|e]. Tento status môže byť vyhlásený pre ženu pomocou [ShowCharacterInteractionName('prefection')] [Concept('character_interaction','interakcie postáv')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_coalition: "Koalícia" # todo: NEW TRANSLATION
 game_concept_coalition_desc: "[Concept('countries','Krajiny')|e], ktorých [Concept('antagonism','antagonizmus')|e] voči konkrétnej [Concept('country','krajine')|e] prekročil prijateľné hranice, sa môžu rozhodnúť pridať sa do Koalície zameranej proti tejto krajine. Na pripojenie krajina potrebuje [Concept('antagonism','antagonizmus')|e] nad 50 a [Concept('opinion','názorom')|e] pod −50 voči cieľu, musí byť v diplomatickom dosahu a nesmie byť vo vojne, v prímerí ani v únijnom zväzku s cieľom — ani subjektom cieľa (prípadní tributári sú výnimkou). Členovia sa budú brániť navzájom, ak cieľ napadne jedného z nich, a môžu spoločne vyhlásiť [Concept('war','vojna')|e] cieľu. Člen nemôže opustiť koalíciu počas vojny s cieľom, ale automaticky odíde, ak jeho [Concept('antagonism','antagonizmu')|e] klesne pod 30 počas mieru s cieľom. Koalícia sa rozpustí okamžite, ak jej líder odíde alebo ak cieľová krajina prestane existovať." # todo: CHANGED # todo: CONCEPT CASE
 game_concept_head_of_the_cabinet: "Predseda kabinetu" # todo: NEW TRANSLATION
 game_concept_head_of_the_cabinet_desc: "Predseda kabinetu je [Concept('character','postava')|e], ktorý bol navýšený dvorom, aby zastupoval [Concept('cabinet','kabinet')|e].\n\n[character] získava nasledujúce bonusy:\n[ShowModifierEffect('head_of_the_cabinet_modifier')]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_natural_harbor_suitability: "Vhodnosť prírodného prístavu" # todo: NEW TRANSLATION
 game_concept_natural_harbor_suitability_desc: "Ako dobre sa [Concept('location','lokalitu')|e] prirodzene hodí na kotvenie lodí a nakladanie/vykládanie mužov a materiálu, ešte pred akýmikoľvek ľudskými vylepšeniami. Znižuje náklady na výstavbu prístavných [Concept('buildings','budovy')|e] a zvyšuje [Concept('harbor_capacity','kapacita prístavu')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_harbor_capacity: "Kapacita prístavu" # todo: NEW TRANSLATION
 game_concept_harbor_capacity_desc: "Kapacita prístavu znižuje náklady pri prechode z mora na súš a naopak vo výpočtoch [Concept('proximity','blízkosti')|e] a [Concept('trade','obchod')|e].\n\nKapacita prístavu [location] závisí najmä od jeho [Concept('natural_harbor_suitability','vhodnosti prírodného prístavu')|e], ale mnohé prístavné [Concept('buildings','budovy')|e] ju môžu tiež výrazne zvýšiť." # todo: CHANGED # todo: CONCEPT CASE
 game_concept_payment: "Platba" # todo: NEW TRANSLATION
 game_concept_payments: "Platby" # todo: NEW TRANSLATION
 game_concept_payment_desc: "Ide o dohodu v [international_organization|e], kde niektorí členovia sú povinní platiť iným [Concept('members','členom')|e] [Concept('gold','dukáta')|e], [Concept('manpower','živej sile')|e], [Concept('sailors','námorníkom')|e] alebo niečo iné výmenou za členstvo v organizácii. Platby môžu byť zavedené alebo zrušené cez rôzne [Concept('laws','zákony')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_fow: "Vojnová hmla" # todo: NEW TRANSLATION
 game_concept_fog_of_war: "Vojnová hmla" # todo: NEW TRANSLATION
 game_concept_fow_vision: "Viditeľnosť" # todo: NEW TRANSLATION
 game_concept_fow_desc: "Závoj, ktorý zahaluje [Concept('discovered','objavené')|e] časti mapy, sa nazýva [fow].\n\n[Concept('units','Jednotky')|e] patriace iným [Concept('countries','krajine')|e] sú [Concept('hidden','skrytý')|e], keď sa skrývajú v [fow].\n\n[Concept('location','Lokalita')|e] je vždy viditeľné pre svojho [Concept('controller','kontrolujúcich')|e]. Ďalej [Concept('country','krajinu')|e] môže vždy vidieť do [Concept('cores','jadier')|e], ktoré vlastnia, aj keď sú [Concept('occupied','okupované')|e] nepriateľom.\n\n[Concept('allies','Spojenci')|e], [Concept('subjects','vazalom')|e] a [overlords|e] zdieľajú svoje videnie medzi sebou.\n\nNiektoré [Concept('locations','lokalitami')|e] budú vždy v [fow], napríklad tie s [ShowVegetationName('forest')] [Concept('vegetation','vegetáciou')|e] alebo [ShowTopographyName('mountains')] [Concept('topography','topografii')|e].\n\n[Concept('seazones','Morské zóny')|e] s [ShowTopographyName('narrows')] [topography] budú obmedzovať videnie len voči iným [seazones]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_town_rights: "Mestské práva" # todo: NEW TRANSLATION
 game_concept_town_rights_desc: "Mestské práva (Urban Rights) sú špeciálne privilégiá, ktoré môže [Concept('country','krajina')|e] udeliť [Concept('town_or_city','mestská lokalita')|e]. Tieto môžu ovplyvniť [Concept('location','lokalita')|e] a/alebo [Concept('country','krajina')|e].\n\nNiektoré [countries] začínajú s prístupom k historickým mestským právam a niekoľko z nich je udelených od roku 1337. Neskôr, začínajúc v [ShowAgeName('age_3_discovery')], všetky [countries] môžu preskúmať [advance_icon][ShowAdvanceName('town_rights_enable')] [Concept('advance','pokrok')|e], čím získajú prístup k Mestským právam, ktoré umožňujú špecializáciu [Concept('urban_locations','mestské lokality')|e] na konkrétny účel, napríklad produkciu určitého [Concept('good','tovaru')|e].\n\nŠtandardne môže mať [ShowLocationRankName('town')] 1 Mestské právo, [ShowLocationRankName('city')] 2 a [ShowLocationRankName('megalopolis')] 3, hoci niektoré [Concept('government_reforms','vládne reformy')|e] môžu tieto hodnoty zvýšiť." # todo: CHANGED # todo: CONCEPT CASE
 game_concept_hidden: "Skrytý" # todo: NEW TRANSLATION
 game_concept_hidden_desc: "[Concept('unit','Jednotka')|e] umiestnená v [Concept('fow','vojnovej hmle')|e] je pre ostatné [Concept('countries','krajiny')|e] [hidden].\n\nKeď je [unit] skrytý, ostatné [countries] o jeho existencii nemajú ani tušenie, nieto informácie o jeho zložení.\n\nSkryté [units] nedostávajú priamy [Concept('combat','boj')|e] bonus, ale zákerné útoky môžu často poskytnúť strategickú výhodu." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_location_importance: "Dôležitosť lokality" # todo: NEW TRANSLATION
 game_concept_location_importance_desc: "Táto hodnota je určená na základe množstva faktorov, ako sú vhodnosť prístavu [Concept('location','lokalite')|e], veľkosť jeho [Concept('population','populácie')|e], koľko [Concept('roads','cesty')|e] k nemu vedie, koľko má [Concept('buildings','budovy')|e], či ide o naše [Concept('capital','hlavné mesto')|e], či má [ShowBuildingTypeName('castle')] a jeho [Concept('market_access','prístupu na trh')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_monthly_income_trade_and_tax: "Mesačný príjem z obchodu a daní" # todo: NEW TRANSLATION
 game_concept_monthly_income_trade_and_tax_desc: "Toto je mesačný [Concept('income','príjem')|e] z [Concept('trading','obchodovania')|e] a [Concept('taxes','daní')|e] spolu." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_monthly_manpower: "Mesačný prírastok živej sily" # todo: NEW TRANSLATION
 game_concept_monthly_manpower_desc: "Toto je mesačný prírastok novú [Concept('manpower','živú silu')|e] pre [Concept('country','krajinu')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_revolutionary: "Revolučný" # todo: NEW TRANSLATION
 game_concept_revolution: "Revolúcia" # todo: NEW TRANSLATION
 game_concept_revolutionary_desc: "[revolution] je jedinečná transformácia spoločnosti [Concept('country','krajina')|e] počas [ShowAgeName('age_6_revolutions')]. Štáty, ktoré prejdú [ShowDisasterName('revolution_disaster')] a zlyhajú v obrane svojho absolútneho stavu, sa môžu stať [revolutionary], čo im poskytne prístup k silným [Concept('actions','akciám')|e], [Concept('reforms','reformám')|e] a [Concept('laws','zákonom')|e] za cenu stať sa potenciálnym cieľom ne-[revolutionary] štátov." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_revolutionary_target: "Cieľ revolúcie" # todo: NEW TRANSLATION
 game_concept_revolutionary_target_desc: "Toto je bijúce srdce revolúcie a najsilnejší [Concept('revolutionary','revolučný')|e] [Concept('country','krajiny')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_celestial_authority_gc: "Nebeská autorita" # todo: NEW TRANSLATION
 game_concept_celestial_authority_gc_desc: "Toto je miera legitimity vládcu [GetUniqueInternationalOrganization('middle_kingdom').GetName]. Používa sa na schvaľovanie [Concept('laws','zákony')|e] a [Concept('policies','politiky')|e] v rámci tejto [international_organization|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_share_of_power_gc: "Podiel moci" # todo: NEW TRANSLATION
 game_concept_share_of_power_gc_desc: "Toto je miera sily konkrétnej opozičnej strany počas [ShowSituationName('fall_of_delhi')] [Concept('situation','situácie')|e]. [GetCountry('DLH').GetName] môže jeho hodnotu zvyšovať nasledujúcimi prostriedkami:\n- Akcie situácie\n- [Concept('events','udalosti')|e]\n- Špeciálne mierové zmluvy\n- Diplomatická podpora od iných [Concept('countries','krajín')|e]\n\nOponenti môžu svoj podiel zvyšovať prostredníctvom útočných vojen a víťazstiev proti [GetCountry('DLH').GetNameWithNoTooltip]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_bureaucracy: "Bureaukracia" # todo: NEW TRANSLATION
 game_concept_bureaucracies: "Bureaukracie" # todo: NEW TRANSLATION
 game_concept_bureaucracy_desc: "A $game_concept_bureaucracy$ je odvetvie [Concept('government','vláda')|e], ktoré rastie v čase, čerpá peniaze z [Concept('balance','bilancie')|e] a poskytuje kladné i záporné modifikátory s dynamickou silou.\n\nKaždá $game_concept_bureaucracy$ má kladné, záporné a konštantné modifikátory. Konštantné modifikátory sú konštantné.\n\nMnožstvo [Concept('gold','dukáty')|e] vynaložené na [Concept('bureaucracy_maintenance_short','prevádzku')|e] ovplyvňuje, či prevláda záporný alebo kladný modifikátor.\n\n[Concept('entrenchment','Zakorenenie')|e] rastie postupne v čase, zvyšuje náklady, ale tiež zvyšuje silu kladných aj záporných modifikátorov. Bureaukracia s vyšším zakorenením je tiež náročnejšie odstrániť.\n\n[Concept('estates','Stavy')|e] môžu mať ku aktívnym $game_concept_bureaucracies$ kladný alebo záporný postoj, čo ovplyvní ich [Concept('estate_satisfaction','spokojnosť stavu')|e] vzhľadom na zakorenenie. Môžu tiež žiadať zvýšenie alebo zníženie $game_concept_entrenchment$ prostredníctvom [Concept('parliament_agendas','parlamentných agend')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_bureaucracy_maintenance: "Prevádzka byrokracie" # todo: NEW TRANSLATION
 game_concept_bureaucracy_maintenance_short: "Prevádzka" # todo: NEW TRANSLATION
 game_concept_bureaucracy_maintenance_desc: "Týka sa to nákladov na prevádzku [bureaucracy|e] každý mesiac. Plne financovaná $game_concept_bureaucracy$ nebude mať žiadne záporné modifikátory, zatiaľ čo zle financovaná bude mať len záporné efekty." # todo: NEW TRANSLATION
 game_concept_entrenchment: "Zakorenenie" # todo: NEW TRANSLATION
 game_concept_entrenched: "Zakorenené" # todo: NEW TRANSLATION
 game_concept_entrenchment_desc: "Toto udáva, ako hlboko je [Concept('bureaucracy','bureaukracia')|e] vložená do [Concept('government','vlády')|e]. Čím vyššie Zakorenenie, tým viac robí, tým viac stojí a tým ťažšie je sa ho zbaviť.\n\nTiež to ovplyvňuje [estate_satisfaction] [Concept('estates','stavov')|e], ktoré danú $game_concept_bureaucracy$ majú rady alebo ju neznášajú." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_bureaucracy_type: "Typ byrokracie" # todo: NEW TRANSLATION
 game_concept_bureaucracy_type_desc: "Typ byrokracie je plán [Concept('bureaucracy','bureaukracia')|e] a určuje jeho charakteristiky." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_movement_definition: "Typ hnutia" # todo: NEW TRANSLATION
 game_concept_movement_definitions: "Typy hnutí" # todo: NEW TRANSLATION
 game_concept_movement_definition_desc: "Hnutie zahŕňa myšlienky šíriace sa populáciou. Môže mať rôzne efekty na každý [Concept('pop','populácia')|e], ktorého sa dotkne." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_movement: "Hnutie" # todo: NEW TRANSLATION
 game_concept_movements: "Hnutia" # todo: NEW TRANSLATION
 game_concept_movement_desc: "Hnutie vznikne, keď sa nový [Concept('movement_definition','typ hnutia')|e] rozvinie v [Concept('location','lokalite')|e]. Slúžia ako epicentrá pre každý [movement_definition]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_divorce: "Rozvod" # todo: NEW TRANSLATION
 game_concept_divorced: "Rozvedený" # todo: NEW TRANSLATION
 game_concept_divorce_desc: "Spôsob, ako ukončiť [Concept('marriage','manželstvo')|e], často vyžaduje povolenie tretej strany." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_ai_personality: "Osobnosť krajiny" # todo: NEW TRANSLATION
 game_concept_ai_personalities: "Osobnosti krajín" # todo: NEW TRANSLATION
 game_concept_ai_personality_upper_desc: "Osobnosť národa odráža jeho základný charakter a prístup k štátnej správe — či uprednostňuje dobytie, opatrnosť, diplomaciu alebo izoláciu. Osobnosti sa nastavujú na začiatku hry a môžu sa zmeniť len prostredníctvom udalostí alebo pravidiel hry.\n\nExistujú nasledujúce osobnosti:" # todo: NEW TRANSLATION
 game_concept_ai_personality_list_title: "Zoznam osobností krajín" # todo: NEW TRANSLATION
 game_concept_ai_personality_desc: "$game_concept_ai_personality_upper_desc$\n[ShowDatabase('ai_personality')]" # todo: NEW TRANSLATION
 game_concept_chivalric_order: "Rytierenský rád" # todo: NEW TRANSLATION
 game_concept_chivalric_orders: "Rytierenské rády" # todo: NEW TRANSLATION
 game_concept_chivalric_order_desc: "A #Y Chivalric Order#! je exkluzívne bratsvo šľachtických bojovníkov oddaných vojenským ideálom krajiny. Oprávnení aktéri môžu byť pozvaní na vstup, získavajúc modifikátory a bonusy rádovej postavy. Krajina sama získava krajinné modifikátory rádu, pokiaľ má aktívny rád a panovníka, ktorý je jeho členom." # todo: NEW TRANSLATION
 game_concept_ai_disposition: "Postoj krajiny" # todo: NEW TRANSLATION
 game_concept_ai_dispositions: "Postoje krajín" # todo: NEW TRANSLATION
 game_concept_ai_disposition_upper_desc: "Postoj krajiny odráža, ako vás momentálne vníma, formovaný vašou relatívnou silou, či má nárok na vaše územia a akéhokoľvek formálneho rivala. Postoje sa priebežne prehodnocujú a môžu sa meniť so zmenou moci.\n\nExistujú nasledujúce postoje:" # todo: NEW TRANSLATION
 game_concept_ai_disposition_list_title: "Zoznam postojov krajín" # todo: NEW TRANSLATION
 game_concept_ai_disposition_desc: "$game_concept_ai_disposition_upper_desc$\n[ShowValues('ai_disposition')]" # todo: NEW TRANSLATION
 game_concept_country_personality: "Osobnosť krajiny" # todo: NEW TRANSLATION
 game_concept_country_personalities: "Osobnosti krajín" # todo: NEW TRANSLATION

 judicial_election_regency_desc: "Nového [Concept('ruler','panovníka')|e] volí rada. Proces je byrokratický chaos a jeho vyriešenie môže trvať niekoľko mesiacov alebo aj rokov." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 mamluk_succesion_regency: "$mamluk$ nástupníctvo" # todo: NEW TRANSLATION
 mamluk_succesion_regency_desc: "Nový [Concept('ruler','panovník')|e] ako aj všetci [Concept('regents','regenti')|e] musia pochádzať z disciplinovaných a prestížnych radov elitných $mamluk$ jednotiek pod naším velením." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 fratricide_succesion_regency: "Bratský boj" # todo: NEW TRANSLATION
 fratricide_succesion_regency_desc: "Nového [Concept('ruler','panovníka')|e] volí sám Boh, ktorý uprednostní jedného zo synov starého [Concept('ruler','panovníka')|e] pred ostatnými." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 fratricide_succesion_regency_tt1: "Žiadny syn predchádzajúceho vládcu nemôže dediť trón, takže nastupuje iný člen dynastie." # todo: NEW TRANSLATION
 fratricide_succesion_regency_tt2: "Žiadny člen dynastie nemôže dediť trón, takže vznikne nová dynastia." # todo: NEW TRANSLATION
 fratricide_succesion_regency_tt3: "Jediný schopný syn predchádzajúceho vládcu je ten, ktorý okamžite nastúpi na trón." # todo: NEW TRANSLATION
 fratricide_succesion_regency_tt4: "Synovia musia najprv vyrásť, než sa otázka trónu vyrieši." # todo: NEW TRANSLATION
 republican_election_regency_desc: "Keď republika nemá [Concept('ruler','panovník')|e], je dočasne vymenovaný [Concept('regent','regent')|e], ktorý ju bude spravovať, kým sa neuskutoční oficiálna [Concept('election','voľba')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 cabinet_head_regency_desc: "Keď [Concept('country','krajina')|e] nemá [Concept('ruler','panovník')|e], [Concept('head_of_the_cabinet','predseda kabinetu')|e] preberie vedenie ako [Concept('regent','regent')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 consort_regency_desc: "Keď [Concept('ruler','panovník')|e] monarchie zomrie a [Concept('heir','dedič')|e] je ešte [Concept('child','dieťa')|e], [Concept('consort','konzort panovníka')|e] môže namiesto neho vládnuť [Concept('country','krajina')|e] ako [Concept('regent','regent')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 nobles_estate_regency_desc: "Keď [Concept('country','krajina')|e] nemá [Concept('ruler','panovník')|e], môže byť dočasne vymenovaný člen $nobles_estate$, ktorý bude vládnuť ako [Concept('regent','regent')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 clergy_estate_regency_desc: "Keď [Concept('country','krajina')|e] nemá [Concept('ruler','panovník')|e], môže byť dočasne vymenovaný člen $clergy_estate$, ktorý bude vládnuť ako [Concept('regent','regent')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 burghers_estate_regency_desc: "Keď [Concept('country','krajina')|e] nemá [Concept('ruler','panovník')|e], môže byť dočasne vymenovaný člen $burghers_estate$, ktorý bude vládnuť ako [Concept('regent','regent')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 peasants_estate_regency_desc: "Keď [Concept('country','krajina')|e] nemá [Concept('ruler','panovník')|e], môže byť dočasne vymenovaný člen $peasants_estate$, ktorý bude vládnuť ako [Concept('regent','regent')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 overlord_regency_desc: "Keď je [Concept('country','krajina')|e] [Concept('subject','vazal')|e] a nemá [Concept('ruler','panovník')|e], [Concept('overlord','suzerén')|e]'s [ruler] môže namiesto toho vládnuť ako [Concept('regent','regent')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 lordship_of_ireland_regency_desc: "Keď je [Concept('country','krajina')|e] [Concept('member','člen')|e] [GetUniqueInternationalOrganization('lordship_of_ireland').GetName] [Concept('international_organization','medzinárodná organizácia')|e] a nemá [Concept('ruler','panovník')|e], [Concept('international_organization_leader_short','líder')|e]'s [ruler] môže namiesto toho vládnuť ako [Concept('regent','regent')|e]." # todo: RETRANSLATED ENGLISH # todo: CONCEPT CASE
 subject_regency_desc: "Keď je [Concept('country','krajina')|e] [Concept('overlord','suzerén')|e] a nemá [Concept('ruler','panovník')|e], mocný [Concept('subject','vazal')|e]'s [ruler] môže namiesto toho vládnuť ako [Concept('regent','regent')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 interregnum_desc: "Keď [Concept('country','krajina')|e] nemá [Concept('ruler','panovník')|e], dočasná provizórna administrácia ho bude viesť, až kým nebude vymenovaný oficiálny [ruler], čo môže byť rýchle alebo trvať dlhý čas."" # todo: NEW TRANSLATION # todo: CONCEPT CASE

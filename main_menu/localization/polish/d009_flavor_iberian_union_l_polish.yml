 d009_flavor_iberian_union.1.title: "Vyhlásiť španielsku monarchiu" # todo: NEW TRANSLATION
 d009_flavor_iberian_union.1.desc: "Koruny našej únie sa tak úzko spojili, že tvoria jedinú ríšu, hoci sa tak ešte nenazýva. Naša správa riadi celé územie, naše zákony a mena platia od jedného konca polostrova po druhý a menšie kráľovstvá sa stali provinciami väčšieho celku.\n\nNadišla chvíľa odložiť staré tituly a vyhlásiť pred celým svetom jedinú, zvrchovanú monarchiu: Španielsko." # todo: NEW TRANSLATION
 d009_flavor_iberian_union.1.a: "Nech je vyhlásená španielska monarchia!" # todo: NEW TRANSLATION

l_polish:
 tali_a_watchtower: "Strážna veža Ṭalī'a" # todo: NEW TRANSLATION
 tali_a_watchtower_desc: "Murovaná veža andalúzskej pobrežnej stráže, ktorá slúži aj ako pozorovateľňa a malá opevnená posádka. Takéto veže stoja v reťaziach pozdĺž južného pobrežia, včas zaznamenávajú nájazdníkov ešte pred ich vylodením a strážia pobrežie, kým poplašné ohne nezvolajú vnútrozemské odvody." # todo: NEW TRANSLATION
 thagr_fort: "Pevnosť Ṯaḡr" # todo: NEW TRANSLATION
 thagr_fort_desc: "#italic ṯaḡr#! je pohraničie, kde sa náš emirát stretáva s územiami kresťanských kráľov. Pevnosť postavená na vrchole kopca alebo pri ceste, spolu s jej strážnymi stanovišťami, vyberá poplatok od každej kolóny, ktorá chce prekročiť našu hranicu. Spomaľuje postup kresťanov, odopiera ich vojskám potravu a vodu a poskytuje našim jazdcom miesto na zhromaždenie a doplnenie zásob, keď podnikajú výpravy proti nepriateľovi." # todo: NEW TRANSLATION
 saqaliba_barracks: "Kasárne Ṣaqālibov" # todo: NEW TRANSLATION
 saqaliba_barracks_desc: "Zbrojnica a cvičisko #italic Ṣaqālibov#!, kde otročí vojaci panovníkovho dvora dostávajú zbrane a skladujú pušný prach i oceľ, a kde sa zhromažďujú na výcvik. Z ich brán pochoduje zbor na hranice a náborové oddiely sa k nim vracajú s čerstvými posilami do radov." # todo: NEW TRANSLATION
 saqaliba_barracks_maintenance: "Údržba kasární Ṣaqālibov" # todo: NEW TRANSLATION
 EFFECTIVE_SAQALIBA_BARRACKS: "Kasárne Ṣaqālibov" # todo: NEW TRANSLATION
 EFFECTIVE_ROYAL_COURT_BUILDINGS: "Efektívne budovy [ShowBuildingTypeName('royal_court')]" # todo: NEW TRANSLATION
 qadi_office: "Úrad kádiho" # todo: NEW TRANSLATION
 qadi_office_desc: "#italic Kádi#! je sudcom svätého práva a jeho súd je sídlom spravodlivosti v každom meste veriacich. V hlavných mestách našich podriadených ríš #italic kádi#! urovnáva spory, registruje zmluvy a posudzuje každú krivdu podľa #italic šaríe#!. Tam, kde zasadá, sa udržiava poriadok nášho rodu, vzbúrenci sú skrotení a poddaní sa ešte pevnejšie pripútavajú k svojmu pánovi." # todo: NEW TRANSLATION
 qadi_office_maintenance: "Údržba úradu kádiho" # todo: NEW TRANSLATION
 can_only_be_built_via_qadi_gc_action_tt: "Túto [Concept('building','budovu')|e] nemožno postaviť bežnou výstavbou. Zakladá sa v [Concept('capital','hlavnom meste')|e] [Concept('subject','vazalovi')|e] iba prostredníctvom [Concept('action','akcie')|e] [ShowGenericActionName('adu_build_qadi_office')], dostupnej počas [Concept('situation','situácie')|e] [GetSituationByKey('golden_century').GetName], keď dosiahneme #Y 75#! [Concept('gc_colonial_dominance','koloniálna dominancia')|e]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 madinat_al_zahra: "Madīna az-Zahrā'" # todo: NEW TRANSLATION
 madinat_al_zahra_desc: "Miesto známe ako „Žiarivé mesto“, $madinat_al_zahra$ nám umožní ďalej rozšíriť našu prestíž v [ShowRegionName('iberia_region')]." # todo: NEW TRANSLATION
 palazzo_ajutamicristo: "Palazzo Ajutamicristo" # todo: NEW TRANSLATION
 palazzo_ajutamicristo_desc: "Aby ozdobili druhý dvor v [ShowRegionName('italy_region')], $palazzo_ajutamicristo$ si objednali štát aj kupecké rodiny ako prejav prestíže a bohatstva." # todo: NEW TRANSLATION
 italian_court_building: "Dvor [ShowCultureGroupNameWithNoTooltip('italian_group')]" # todo: NEW TRANSLATION
 italian_court_building_desc: "Ak budeme udržiavať dvory v našej hlavnej ríši aj v [ShowRegionName('italy_region')], dokážeme účinnejšie spravovať obe šľachty." # todo: NEW TRANSLATION

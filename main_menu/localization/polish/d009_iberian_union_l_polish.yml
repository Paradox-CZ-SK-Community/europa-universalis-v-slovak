 iberian_wedding_pact_relation_desc: "Tieto dve [Concept('countries','krajiny')|e] spája $diplomatic_status_iberian_wedding_pact_name$, ktorý prepája ich nástupníctvo a môže jedného dňa spojiť ich koruny do [Concept('union','únie')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE

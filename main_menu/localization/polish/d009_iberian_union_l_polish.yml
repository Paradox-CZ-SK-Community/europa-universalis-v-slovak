l_polish:
 catholic_monarchs_law: "Katolícki panovníci" # todo: NEW TRANSLATION
 catholic_monarchs_law_desc: "Manželstvo, ktoré spája naše koruny, je základom všetkého, čo príde. To, ako sa kráľovský pár rozhodne vládnuť — či ako rovnocenní, alebo s prevahou jedného rodu — bude formovať toto spojenie po celé generácie." # todo: NEW TRANSLATION
 iu_establish_iberian_wedding_succession_tt: "Uzavrie medzi oboma korunami [ShowRelationTypeName('iberian_wedding_pact')] a nastaví ich [Concept('heir_selection','nástupnícke právo')|e] na [ShowHeirSelectionName('iberian_union_succession')], čím prepojí ich nástupníctvo, aby spoločný dedič mohol zjednotiť ríše" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 composite_monarchy_law: "Zložená monarchia" # todo: NEW TRANSLATION
 composite_monarchy_law_desc: "Naše ríše sú spojené pod jedným panovníkom, no každá si zachováva vlastné zákony a požíva slobody zvané #italic fueros#!. Musíme rozhodnúť, či budeme tieto #italic fueros#! rešpektovať, alebo sústredíme ich správu do jedných rúk." # todo: NEW TRANSLATION
 asientos_law: "Asientos" # todo: NEW TRANSLATION
 asientos_law_desc: "Koruna udeľuje #italic asientos#!, výhradné zmluvy na zásobovanie a vystrojovanie našich zámorských domínií. Ich držitelia profitujú z každého nákladu, zatiaľ čo ríše, ktoré ich napĺňajú, udržujú svoje dielne v chode. Únia musí rozhodnúť, či bude koruna udeľovať tieto zmluvy sama sebe, alebo sa o ne podelí s obchodníkmi zo všetkých svojich ríš." # todo: NEW TRANSLATION
 religious_authority_law: "Náboženská autorita" # todo: NEW TRANSLATION
 religious_authority_law_desc: "Naše zjednotené koruny musia rozhodnúť, ako uplatnia autoritu viery. Koruna môže prostredníctvom #italic Patronato Real#! riadiť cirkev v našich ríšach, alebo obrátiť svoju horlivosť navonok a stať sa mečom a štítom kresťanstva." # todo: NEW TRANSLATION
 legislative_authority_law: "Zákonodarná autorita" # todo: NEW TRANSLATION
 legislative_authority_law_desc: "Čia vôľa bude riadiť naše ríše? Zákony môžu vychádzať z kráľovskej ruky prostredníctvom záväzných #italic pragmáticas#!, alebo sa môžu opierať o súhlas vlastných #italic Cortes#! každého kráľovstva." # todo: NEW TRANSLATION
 crown_settlement_law: "Usporiadanie korún" # todo: NEW TRANSLATION
 crown_settlement_law_desc: "Konečnú podobu únie treba ustáliť. Jeden zákon a jedna mena môžu spojiť mnohé kráľovstvá do jedinej zjednotenej monarchie, alebo môžu koruny pretrvať ako trvalé partnerstvo rovnocenných." # todo: NEW TRANSLATION
 union_of_arms_law: "Union de Armas" # todo: NEW TRANSLATION
 union_of_arms_law_desc: "Obrana únie je povinnosťou každej ríše, ktorá je jej súčasťou. Či už prostredníctvom povinných kvót alebo dobrovoľných príspevkov, kráľovstvá ponesú bremeno zbrojenia spoločne." # todo: NEW TRANSLATION
 iu_tanto_monta_policy: "Tanto Monta" # todo: NEW TRANSLATION
 iu_tanto_monta_policy_desc: "#italic Tanto monta, monta tanto#! — obaja panovníci vládnu ako rovnocenní, ani jeden nestojí nad druhým. Únia rovnocennej dôstojnosti spája ríše vo vzájomnej úcte a spoločnom dynastickom vystupovaní." # todo: NEW TRANSLATION
 iu_tanto_monta_no_seniority_tt: "Týmto spôsobom sa neurčuje žiadny [ShowSpecialStatusName('senior_partner')] a v rámci [Concept('union','únie')|e] nie sú uzákonené [ShowPolicyName('union_establish_seniority_policy')] ani [ShowPolicyName('union_senior_succession_law')]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 iu_dynastic_primacy_policy: "Dynastická nadradenosť" # todo: NEW TRANSLATION
 iu_dynastic_primacy_policy_desc: "Jedna koruna je uznaná za vedúcu v únii a jej dynastia má medzi ríšami prednosť. Vládnuci rod získava najväčšiu prestíž, zatiaľ čo všetci členovia zdieľajú vážnosť sebavedomej monarchie." # todo: NEW TRANSLATION
 iu_dynastic_primacy_senior_only_tt: "Ak sme [Concept('senior_partner','hlavný partner')|e]:" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 iu_dynastic_primacy_seniority_tt: "Pri vzniku tejto [Concept('union','únii')|e] bude člen s najvyššou [Concept('economical_base','ekonomickou základňou')|e] určený ako [ShowSpecialStatusName('senior_partner')], čím sa pre celú úniu uzákonia [ShowPolicyName('union_establish_seniority_policy')] a [ShowPolicyName('union_senior_succession_law')]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 iu_respect_fueros_policy: "Rešpektovanie fueros" # todo: NEW TRANSLATION
 iu_respect_fueros_policy_desc: "Starobylé slobody každého kráľovstva sú potvrdené a chránené. Menšie ríše sa pokojne spravujú samy, zatiaľ čo vedúca koruna si získava úctu, ktorá patrí panovníkovi verne dodržiavajúcemu tradície svojich ríš." # todo: NEW TRANSLATION
 iu_centralized_administration_policy: "Centralizovaná správa" # todo: NEW TRANSLATION
 iu_centralized_administration_policy_desc: "Správa ríš sa sústreďuje pod jedinú administratívu. Vedúca koruna rozširuje svoj dosah, zatiaľ čo menšie ríše čerpajú legitimitu z poriadku zjednoteného štátu." # todo: NEW TRANSLATION
 iu_crown_asientos_policy: "Korunné asientos" # todo: NEW TRANSLATION
 iu_crown_asientos_policy_desc: "Koruna udeľuje zásobovacie zmluvy sama sebe, čím sústreďuje obchod a jeho drahé kovy vo vedúcej ríši. Menšie kráľovstvá profitujú zo zásobovania domínií a dopyt oživuje ich priemysel." # todo: NEW TRANSLATION
 iu_shared_asientos_policy: "Zdieľané asientos" # todo: NEW TRANSLATION
 iu_shared_asientos_policy_desc: "Zmluvy sa rozdeľujú medzi obchodníkov zo všetkých ríš. Menšie kráľovstvá získavajú priamy prístup k výnosnému zásobovaciemu obchodu, zatiaľ čo vedúca koruna má úžitok z lacnejšieho tovaru prúdiaceho cez spoločnú sieť." # todo: NEW TRANSLATION
 iu_patronato_real_policy: "Patronato Real" # todo: NEW TRANSLATION
 iu_patronato_real_policy_desc: "Prostredníctvom #italic Patronato Real#! koruna riadi cirkev v našich ríšach, vymenúva jej prelátov a čerpá z jej príjmov. Viera spravovaná trónom je vierou spätou s trónom." # todo: NEW TRANSLATION
 iu_catholic_champion_policy: "Obhajca viery" # todo: NEW TRANSLATION
 iu_catholic_champion_policy_desc: "Naše zjednotené koruny pozdvihnú zástavu kresťanstva a budú obhajovať vieru na každom dvore v Európe. Nech sú naše ríše známe ako meč a štít cirkvi a nech sú za to naši zbožní poddaní uctievaní." # todo: NEW TRANSLATION
 iu_pragmaticas_policy: "Pragmáticas Reales" # todo: NEW TRANSLATION
 iu_pragmaticas_policy_desc: "Zákony budú vychádzať z kráľovskej vôle. Prostredníctvom záväzných výnosov, #italic pragmáticas#!, panovník uzákoňuje pravidlá pre všetky ríše naraz bez toho, aby čakal na súhlas ktoréhokoľvek zhromaždenia." # todo: NEW TRANSLATION
 iu_regional_cortes_policy: "Regionálne Cortes" # todo: NEW TRANSLATION
 iu_regional_cortes_policy_desc: "Každá ríša vládne so súhlasom vlastných #italic Cortes#!. Vláda prostredníctvom starobylých zhromaždení dodáva legitimitu každej korune a spája úniu dobrovoľnou vernosťou." # todo: NEW TRANSLATION
 iu_una_ley_una_moneda_policy: "Una Ley, Una Moneda" # todo: NEW TRANSLATION
 iu_una_ley_una_moneda_policy_desc: "Jeden zákon a jedna mena pre všetky naše ríše. Takéto zjednotenie korún stiera staré hranice a posilňuje putá medzi mnohými kráľovstvami, ktoré premieňa na jedinú zjednotenú monarchiu. Menšie ríše tak môžu slobodne pracovať a obchodovať na celom jej území, akoby boli doma." # todo: NEW TRANSLATION
 iu_perpetual_crown_policy: "Trvalá federálna koruna" # todo: NEW TRANSLATION
 iu_perpetual_crown_policy_desc: "Únia sa spečatí ako trvalá dohoda medzi korunami. Ustálené a dlhotrvajúce partnerstvo dodáva každej ríši legitimitu a stabilitu a puto medzi členmi je v únii najsilnejšie." # todo: NEW TRANSLATION
 iu_proportional_levy_policy: "Primeraný odvod" # todo: NEW TRANSLATION
 iu_proportional_levy_policy_desc: "Každá ríša vyšle svoj podiel do spoločného vojska. Únia získa väčšiu a lepšiu armádu a vedúca koruna bude veliť odvodom, ktoré sa pod jej velením sústredia." # todo: NEW TRANSLATION
 iu_negotiated_contribution_policy: "Dohodnutý príspevok" # todo: NEW TRANSLATION
 iu_negotiated_contribution_policy_desc: "Ríše prispievajú na spoločnú obranu na základe vzájomnej dohody, nie príkazu. Dobrovoľné bremeno sa znáša ľahšie a jeho plnenie podporuje disciplínu na bojisku aj súlad medzi členmi." # todo: NEW TRANSLATION
 proclaim_spanish_monarchy: "Vyhlásiť španielsku monarchiu" # todo: NEW TRANSLATION
 proclaim_spanish_monarchy_desc: "Vyhlásiť mnohé koruny našej únie za jedinú zjednotenú monarchiu a prijať meno i dôstojnosť Španielska." # todo: NEW TRANSLATION
 proclaim_spanish_monarchy_integration_tt: "Naša únia musí dosiahnuť úroveň integrácie aspoň 5" # todo: NEW TRANSLATION

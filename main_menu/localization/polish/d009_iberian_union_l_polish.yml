 iberian_union_succession: "Nástupníctvo v Pyrenejskej únii" # todo: NEW TRANSLATION
 iberian_union_succession_desc: "Druh [Concept('heir_selection','nástupnícke právo')|e] používaný kresťanskými monarchiami v oblasti [ShowRegionName('iberia_region')], ktoré spája [ShowRelationTypeName('iberian_wedding_pact')]. Ak niektorý panovník zomrie bez vlastného legitímneho dediča, druhý panovník zdedí jeho trón a spojí koruny do [Concept('union','únie')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 iberian_union_succession_tt: "Vytvorí sa [Concept('union','úniu')|e], ak náš nástupca nie je dedičom nášho predchádzajúceho panovníka" # todo: NEW TRANSLATION # todo: CONCEPT CASE

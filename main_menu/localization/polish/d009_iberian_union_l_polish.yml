 offer_iberian_wedding_pact_happened_desc: "Krajinu [SCOPE.sCountry('recipient').GetAltAdjective('A')] teraz s nami spája $diplomatic_status_iberian_wedding_pact_name$. Ak niektorý z našich panovníkov zomrie bez vlastného dediča, druhý zdedí oba tróny a naše koruny vytvoria [Concept('union','únia')|e]." # todo: NEW TRANSLATION # todo: COUNTRY CASE # todo: CONCEPT CASE

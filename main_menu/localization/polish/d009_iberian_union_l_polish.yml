 iberian_wedding_pact_effect_text: "[SCOPE.sCountry('actor').GetName] uzatvára pyrenejský sobášny pakt s krajinou [SCOPE.sCountry('recipient').GetAltAdjective('I')], čím prepája nástupníctvo ich korún." # todo: NEW TRANSLATION # todo: COUNTRY CASE
 iberian_wedding_pact_effect_text_past: "[SCOPE.sCountry('actor').GetName] uzavrela pyrenejský sobášny pakt s krajinou [SCOPE.sCountry('recipient').GetAltAdjective('I')], čím prepojila nástupníctvo ich korún." # todo: NEW TRANSLATION # todo: COUNTRY CASE
 diplomatic_status_iberian_wedding_pact_tooltip: "#T $diplomatic_status_iberian_wedding_pact_name$#!\nTieto koruny spája pyrenejský sobášny pakt. Ak niektorý z panovníkov zomrie bez vlastného dediča, druhý zdedí jeho trón a vytvorí sa [Concept('union','úniu')|e] medzi oboma krajinami." # todo: NEW TRANSLATION # todo: CONCEPT CASE

l_polish:
 summon_volunteers_of_the_faith: "Povolanie dobrovoľníkov viery" # todo: NEW TRANSLATION
 summon_volunteers_of_the_faith_desc: "Vyzve kmene [ShowReligionGroupAdjective('muslim')], aby vyslali svätých bojovníkov do [jihad|e]. Jeden z berberských kmeňov vytvorí žoldniersky pluk vo vlastnom štýle boja, či už z rýchlych jazdcov, zahalených pešiakov, alebo vyváženého vojska, a podnieti náboženský zápal [jihad]. Ríša, ktorá zorganizovala svojich svätých bojovníkov do stáleho zboru alebo ktorej stavy prisľúbili svojich dobrovoľníkov na túto vec, vyšle mocnejšie vojsko. Každý kmeň môže odpovedať na výzvu iba raz a znovu ju vyslyší, keď bude jeho pluk rozpustený." # todo: NEW TRANSLATION
 summon_volunteers_of_the_faith_effect_tt: "Zvýši #Y náboženský zápal#! [Concept('jihad','$jihad$')|e] o #G 5#!" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 summon_volunteers_cavalry_tier2_tt: "Zverbujú sa 10 ľahkých jazdcov, 4 ľahkí pešiaci a 2 ťažkí jazdci" # todo: NEW TRANSLATION
 summon_volunteers_cavalry_tier1_tt: "Zverbujú sa 8 ľahkých jazdcov a 4 ľahkí pešiaci" # todo: NEW TRANSLATION
 summon_volunteers_cavalry_tier0_tt: "Zverbujú sa 6 ľahkí jazdci a 3 ľahkí pešiaci" # todo: NEW TRANSLATION
 summon_volunteers_infantry_tier2_tt: "Zverbujú sa 8 ťažkých pešiakov, 4 ľahkí pešiaci a 1 ťažký jazdec" # todo: NEW TRANSLATION
 summon_volunteers_infantry_tier1_tt: "Zverbujú sa 6 ťažkých pešiakov a 4 ľahkí pešiaci" # todo: NEW TRANSLATION
 summon_volunteers_infantry_tier0_tt: "Zverbujú sa 4 ťažkí pešiaci a 4 ľahkí pešiaci" # todo: NEW TRANSLATION
 summon_volunteers_mixed_tier2_tt: "Zverbujú sa 7 ľahkých jazdcov, 5 ľahkých pešiakov a 2 ťažkí pešiaci" # todo: NEW TRANSLATION
 summon_volunteers_mixed_tier1_tt: "Zverbujú sa 6 ľahkí jazdci a 5 ľahkí pešiaci" # todo: NEW TRANSLATION
 summon_volunteers_mixed_tier0_tt: "Zverbujú sa 4 ľahkí jazdci a 4 ľahkí pešiaci" # todo: NEW TRANSLATION
 choose_tribe_for_volunteers: "Vyberte kmeň" # todo: NEW TRANSLATION
 summon_volunteers_no_tribes: "@trigger_no! Žiadny kmeň nemôže odpovedať na výzvu." # todo: NEW TRANSLATION
 ghuzat_regiment_name: "Dobrovoľníci viery" # todo: NEW TRANSLATION
 summon_volunteers_bureaucracy_bonus_tt: "Náš stály zbor gházíjských dobrovoľníkov rozšíri pluk o ďalších, lepších bojovníkov." # todo: NEW TRANSLATION
 proclaim_the_ghazw: "Vyhlásiť Ḡazw" # todo: NEW TRANSLATION
 proclaim_the_ghazw_desc: "Vyhlásiť pohraničný nájazd cez prieliv do jednej z pohraničných provincií nepriateľa [ShowReligionGroupAdjective('christian')]. Každé tamojšie nebránené miesto, v ktorom sa nenachádza pevnosť ani armáda, bude vyrabované a ochudobnené, čo podnieti jeho pána zhromaždiť vojsko proti nám." # todo: NEW TRANSLATION
 proclaim_the_ghazw_tt: "Zníži náboženský zápal [Concept('jihad','$jihad$')|e] o #R 10#! a posunie jeho prípravu späť o #R 10#!" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 proclaim_the_ghazw_loot_tt: "Vyrabuje každé nebránené miesto v provincii, v ktorom sa nenachádza pevnosť ani armáda, a získa odhadom [actor.MakeScope.ScriptValue('ghazw_estimated_total')|0+=][gold_i]; zároveň zníži ich rozvoj" # todo: NEW TRANSLATION
 choose_province_for_ghazw: "Vyberte provinciu na nájazd" # todo: NEW TRANSLATION
 proclaim_the_ghazw_no_provinces: "@trigger_no! Nepriateľ nedrží žiadnu nebránenú pohraničnú provinciu, ktorú možno napadnúť." # todo: NEW TRANSLATION
 cross_the_strait: "Plavba po mori" # todo: NEW TRANSLATION
 cross_the_strait_desc: "Najmite si v jednom z našich prístavov žoldniersku flotilu transportných lodí, aby armády Maghrebu mohli preplávať cez [ShowLocationName('strait_of_gibraltar')] do al-'Andalus. Zverbá sa dosť transportných lodí na prepravu približne štvrtiny našej armády a preplavbu možno počas svätej vojny zopakovať kedykoľvek." # todo: NEW TRANSLATION
 cross_the_strait_effect_tt: "Zverbujú sa transportné lode na prepravu približne štvrtiny našej armády za cenu [Concept('gold','dukáty')|e], ktorá rastie s veľkosťou flotily, a náboženský zápal [Concept('jihad','$jihad$')|e] sa zníži o #R 10#!" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 cross_the_strait_fleet_name: "Flotila na prepravu" # todo: NEW TRANSLATION
 cross_the_strait_hire_tt: "Najme flotilu na prepravu našich vojsk cez prieliv" # todo: NEW TRANSLATION
 choose_port_for_crossing: "Vyberte prístav" # todo: NEW TRANSLATION
 cross_the_strait_no_ports: "@trigger_no! Nemáme žiadny prístav, z ktorého by sme mohli vyplávať." # todo: NEW TRANSLATION
 raid_the_shores: "Vyplieniť pobrežie" # todo: NEW TRANSLATION
 raid_the_shores_desc: "Vypustite korzársky nájazd na pobrežie jednej z provincií nepriateľa [ShowReligionGroupAdjective('christian')], v ktorej už podnikáme korzárske výpravy. Každé tamojšie nebránené pobrežné miesto, v ktorom sa nenachádza pevnosť ani armáda, bude vyrabované a každý stý [ShowReligionAdjective('catholic')] sedliak bude odvlečený do otroctva v našom hlavnom meste." # todo: NEW TRANSLATION
 raid_the_shores_tt: "Zníži náboženský zápal [Concept('jihad','$jihad$')|e] o #R 10#! a posunie jeho prípravu späť o #R 10#!" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 raid_the_shores_loot_tt: "Vyrabuje každé nebránené pobrežné miesto vo vybranej provincii a odvlečie do otroctva každého stého [ShowReligionAdjective('catholic')] sedliaka" # todo: NEW TRANSLATION
 choose_province_for_shore_raid: "Vyberte pobrežie na nájazd" # todo: NEW TRANSLATION
 raid_the_shores_no_provinces: "@trigger_no! Nepriateľ nemá pobrežie hraničiace s morskou zónou, v ktorej pôsobia naši [Concept('privateers','korzárov')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE

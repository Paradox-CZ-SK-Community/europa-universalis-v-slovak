l_polish:
 d009_fountain_of_youth_events.1.title: "Liečivý prameň" # todo: NEW TRANSLATION
 d009_fountain_of_youth_events.1.desc: "Sprievodcovia nás zavedú z chodníka k jazierku, z ktorého pod skupinou paliem vyviera studená, čistá voda, a nedovolia nám odísť, kým sa nenapijeme. Jedna starena medzi nimi pantomimicky predvádza, ako sa hrbatý chrbát narovnáva a sivé vlasy opäť tmavnú. Jeden z našich, kopijník, ktorého od pobrežia sužuje horúčka a kríva, si kľakne a napije sa dosýta. Do večera prisahá, že bolesť z jeho nôh zmizla. Chirurg si mrmlie, že človek, ktorý sa chce vyliečiť dosť úporne, sa bude deň či dva cítiť lepšie bez ohľadu na to, čo vypije. Voda je však sladká a tento príbeh starší než ktokoľvek z nás. Preplavili sme oceány aj za menej presvedčivými sľubmi." # todo: NEW TRANSLATION
 d009_fountain_of_youth_events.1.a: "Naplňme fľaše vodou a odmeňme sprievodcov, ktorí nás sem priviedli." # todo: NEW TRANSLATION
 d009_fountain_of_youth_events.1.b: "Kaluž je len kaluž. Pokračujme v pochode." # todo: NEW TRANSLATION
 d009_fountain_of_youth_events.1.b.tt: "#italic Odchádzame od jazierka bez toho, aby sme ho vyskúšali, a pokračujeme v pochode s prázdnymi mechmi na vodu#!" # todo: NEW TRANSLATION
 the_spring_runs_potent: "#Y Prameň sa ukáže ako účinný a muži naplnia všetky mechy, ktoré so sebou nesú#!" # todo: NEW TRANSLATION
 the_spring_is_ordinary: "#Y Voda je sladká, ale zjavne obyčajná#!" # todo: NEW TRANSLATION
 the_waters_may_restore_vigor_tt: "Voda, ktorú si odnesieme domov, by ešte mohla starým vrátiť silu" # todo: NEW TRANSLATION
 d009_fountain_of_youth_events.2.title: "Cena liečiteľa" # todo: NEW TRANSLATION
 d009_fountain_of_youth_events.2.desc: "Z dediny prichádza liečiteľ, staršina ovešaný mušľami a kosťami, ktorého si miestni zjavne veľmi vážia. Cez tlmočníka pochopíme, že pozná krajinu, na ktorú sa vypytujeme: pramene, ku ktorým nosia chorých, aj miesta, ktoré miestni pokladajú za posvätné. Takéto vedomosti sa ozbrojeným cudzincom len tak neodovzdávajú. Majú svoju cenu, no nie je to zlato. Je ňou úcta, alebo aspoň jej presvedčivý prejav, správne dary podané správnym spôsobom a dôsledné dodržiavanie starých zdvorilostných zvyklostí. Náš kaplán sa búri proti pohanskému obradu. Ubytovateľ poznamená, že sprievodca, ktorý vie, kde vyviera voda, má oveľa väčšiu cenu než kaplánovo pohodlie." # todo: NEW TRANSLATION
 d009_fountain_of_youth_events.2.a: "Uctíme ich zvyky a získame si dôveru liečiteľa." # todo: NEW TRANSLATION
 d009_fountain_of_youth_events.2.b: "Štedro im zaplaťme za sprievodcu." # todo: NEW TRANSLATION
 d009_fountain_of_youth_events.2.c: "Zajmime sprievodcu a bude po starostiach." # todo: NEW TRANSLATION
 the_healer_will_accompany_us_tt: "Liečiteľ bude sprevádzať [Concept('expedition','výprava')|e] a po jej návrate vstúpi na náš dvor" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 coerced_guide_breeds_resentment_tt: "Náš [Concept('cultural_opinion','kultúrny názor')|e] o kultúre [target_location.GetDominantCulture.GetName] sa zhorší" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 d009_fountain_of_youth_events.3.title: "Horúčka v radoch" # todo: NEW TRANSLATION
 d009_fountain_of_youth_events.3.desc: "Začína sa to tým, že sa dvaja muži trasú pri ohni uprostred horúceho popoludnia, a do tretieho rána ich už tucet leží so žltými očami a v blúznení. V močiaroch, ktorými sa brodíme, sa množí niečo, čomu európske telá nikdy neboli vystavené. Chirurg má svoje banky a lancety, a okrem toho aj čoraz menšiu zásobu liečiv. Miestni majú vlastné lieky: horké čaje a obklady z listov, ktoré by nepoznal nijaký lekárnik v Seville. Ani jedna strana nedôveruje liečbe tej druhej a horúčku veľmi nezaujíma, čo jej ponúkneme." # todo: NEW TRANSLATION
 d009_fountain_of_youth_events.3.a: "Povolajme lodných lekárov, nech to stojí čokoľvek." # todo: NEW TRANSLATION
 d009_fountain_of_youth_events.3.b: "Dôverujme miestnym liečiteľom a ich liekom." # todo: NEW TRANSLATION
 d009_fountain_of_youth_events.3.c: "Pokračujme v pochode a nechajme horúčku, nech sama ustúpi." # todo: NEW TRANSLATION
 the_fever_passes: "#Y Horúčka ustupuje a muži v radoch opäť naberajú silu#!" # todo: NEW TRANSLATION
 the_fever_claims_our_progress: "#Y Horúčka neustupuje a prichádzame o dni ťažko vydobytého pokroku#!" # todo: NEW TRANSLATION
 the_remedies_take_hold: "#Y Horké čaje zaberajú a liečitelia si získavajú dôveru mužov#!" # todo: NEW TRANSLATION
 the_remedies_fail: "#Y Lieky nezaberajú a horúčka prejde celým svojím priebehom#!" # todo: NEW TRANSLATION
 d009_fountain_of_youth_events.4.title: "Nádej starého muža" # todo: NEW TRANSLATION
 d009_fountain_of_youth_events.4.desc: "[target_leader.GetName] už nie je mladý a v poslednom čase naňho roky doliehajú čoraz ťažšie. V spôsobe, akým dlho do noci študuje mapy, sa objavil nový hlad, a keď poľavíme v tempe, prejavuje sa v ňom ostrosť. Muži si začali šepkať, že veliteľ hľadá tieto vody skôr kvôli tvári v holiacom zrkadle než kvôli korune a krajine. Je to starý príbeh, starší než ktokoľvek z nás: dobyvateľ, ktorý získal všetko okrem ďalšieho času, sa vydáva do močiarov za jedinou korisťou, ktorú ešte nikdy nedobyl nijaký meč. Či nás táto túžba privedie k sláve, alebo do predčasného hrobu, ženie nás vpred neúprosne." # todo: NEW TRANSLATION
 d009_fountain_of_youth_events.4.a: "Nech nás nádej starého muža ženie ďalej." # todo: NEW TRANSLATION
 d009_fountain_of_youth_events.4.b: "Povzbuďme ho k trpezlivosti, skôr než jeho horlivosť zlomí mužov." # todo: NEW TRANSLATION
 d009_fountain_of_youth_events.5.title: "Ostrov Bimini" # todo: NEW TRANSLATION
 d009_fountain_of_youth_events.5.desc: "Námorníci teraz majú na jazyku jedno meno a neprestávajú si ho šepkať: Bimini, ostrov neďaleko tohto pobrežia, kde vyviera prameň, ktorý vracia roky odobraté starým morom. Každý kormidelník tvrdí, že to počul od muža, ktorý to počul od iného muža. Na mape je roztrúsených niekoľko nízkych zelených ostrovov, vzdialených len pár dní plavby, a každý z nich by mohol byť tým miestom... alebo ani jeden. Odkloniť sa od pevniny znamená riskovať týždne zásob kvôli rybárskej povesti — čo je, keď sa nad tým zamyslíme, presne tá povesť, ktorá previedla celú túto výpravu cez oceán." # todo: NEW TRANSLATION
 d009_fountain_of_youth_events.5.a: "Vyplávajme k ostrovu, ktorého meno námorníci neprestávajú opakovať." # todo: NEW TRANSLATION
 d009_fountain_of_youth_events.5.b: "Držme sa pevniny. Ostrovy sú pre utopencov." # todo: NEW TRANSLATION
 d009_fountain_of_youth_events.5.b.tt: "#italic Držíme sa pevniny a nechávame ostrov Bimini, aby si uchoval svoje tajomstvo#!" # todo: NEW TRANSLATION
 the_island_rewards_the_crossing: "#Y Ostrov nám za plavbu ponúka čerstvú vodu a lepšiu orientáciu#!" # todo: NEW TRANSLATION
 the_island_is_barren: "#Y Ostrov je pustým piesočným výbežkom a plavba naň nás stojí vzácne dni#!" # todo: NEW TRANSLATION
 d009_fountain_of_youth_events.fountain_desc: "Juan Ponce de Leon, conquistador a prvý guvernér Portorika, sa v roku 1513 plavil na sever a pristál na pobreží, ktoré pomenoval La Florida podľa veľkonočného obdobia, v ktorom ho objavil. Zmapoval polostrov aj silný Golfský prúd; bojoval s Calusmi a obchodoval s Timucuami, no nijaký zázračný prameň nenašiel a podľa vlastných správ ho ani nehľadal. Príbeh o tom, že sa preplavil cez more v snahe nájsť vodu, ktorá vracia mladosť, sa k jeho menu pripojil až po jeho smrti, a to zásluhou kronikárov ako Gonzalo Fernandez de Oviedo a Antonio de Herrera y Tordesillas, ako aj zajatca Hernanda de Escalante Fontanedu, ktorý sa posmieval tomu, že mnohí sa pri hľadaní takej vody utopili. Povesti o liečivom prameni na ostrove Bimini boli medzi námorníkmi aj domorodcami skutočné; ich spojenie s jedným starnúcim guvernérom bolo zväčša neskorším výmyslom, sčasti posmeškom a sčasti mýtom. Ponce de Leon sa v roku 1521 vrátil, aby založil kolóniu, do stehna ho zasiahol šíp Calusov a na následky zranenia zomrel v Havane. Nenašiel ani mladosť, ani pokoj." # todo: NEW TRANSLATION

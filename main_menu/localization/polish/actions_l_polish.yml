 sengoku_force_end_war_desc: "Zničujúce vojny škodia našej krajine. Môžeme využiť našu cisársku autoritu a prinútiť ktorýkoľvek zúčastnený klan prestať bojovať, ak mu pošleme oficiálne cisárske posolstvo." # todo: NEW TRANSLATION

 this_will_end_the_disaster_tt: "Tým sa ukončí [ShowDisasterName('aspiration_for_liberty')] [Concept('disaster','katastrofa')|e]\n" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 move_nw_good_to_new_location: "Rozšíriť tovar Nového sveta" # todo: NEW TRANSLATION
 move_nw_good_to_new_location_desc: "Môžeme rozšíriť jeden z tovarov nájdených v [ShowContinentName('america')] do ktoréhokoľvek z našich [Concept('locations','lokalít')|e], ale miestni tomu nebudú priať a budeme musieť obnoviť rozvoj [Concept('rgo','R.G.O.')|e] tej lokality." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 move_nw_good_to_new_location_no_available_good: "@trigger_no! Nemáte žiadnu [Concept('location','lokalitu')|e], ktorá patrí k trhu obchodujúcemu alebo vyrábajúcemu tento [good]" # todo: NEW TRANSLATION # todo: CONCEPT CASE

 encourage_innovativeness: "Podporiť inovatívnosť" # todo: NEW TRANSLATION
 encourage_innovativeness_desc: "Staré názory Cirkvi sú pozostatkom poverčivosti. Musíme podporovať inovatívnosť medzi duchovenstvom a naším ľudom." # todo: NEW TRANSLATION
 progress_of_the_supreme_governor: "Pokrok Najvyššieho guvernéra" # todo: NEW TRANSLATION
 progress_of_the_supreme_governor_desc: "Prezentovanie Najvyššieho guvernéra, teda aj hlavy štátu, naprieč krajinou posilňuje verejný duch a podporuje lojalitu." # todo: NEW TRANSLATION

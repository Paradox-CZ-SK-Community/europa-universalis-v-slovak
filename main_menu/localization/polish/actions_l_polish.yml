 sengoku_revoke_clans_land_desc: "Zrušte časť pridelených pozemkov a obnovte ich pod priamu kontrolu [GetUniqueInternationalOrganization('japanese_shogunate').GetName]. Šance, že klan prijme naše požiadavky, závisia od ich [Concept('opinion','názor')|e] k nám a našej [Concept('diplomatic_reputation','diplomatickej reputácie')|e]." # todo: CHANGED # todo: CONCEPT CASE
 sengoku_limit_clans_autonomy: "Obmedziť autonómiu klanu" # todo: NEW TRANSLATION
 sengoku_limit_clans_autonomy_desc: "Klanom sa vymyká kontrola a konajú nezávisle, ignorujúc našu autoritu. Musíme ich prinútiť, aby sa podriadili a nasledovali smernice [GetUniqueInternationalOrganization('japanese_shogunate').GetName]. Šance, že klan prijme naše požiadavky, závisia od ich [Concept('opinion','názor')|e] k nám a našej [Concept('diplomatic_reputation','diplomatickej reputácie')|e]." # todo: CHANGED # todo: CONCEPT CASE
 sengoku_summon_to_court: "Predvolať na dvor" # todo: NEW TRANSLATION
 sengoku_summon_to_court_desc: "Vodcovia klanov odmietajú uznať našu autoritu. Mali by sme ich zvolať na náš dvor, aby sme ich mohli udržať pod kontrolou, alebo ich odmietnutie takého predvolania využiť ako dôvod na obvinenie zo zrady. Šance, že klan prijme naše požiadavky, závisia od ich [Concept('opinion','názor')|e] k nám a našej [Concept('diplomatic_reputation','diplomatickej reputácie')|e]." # todo: CHANGED # todo: CONCEPT CASE
 sengoku_proclaim_clan_independence: "Vyhlásiť nezávislosť klanu" # todo: NEW TRANSLATION

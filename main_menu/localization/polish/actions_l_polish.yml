 cmd_negotiate_with_rebels: "Vyjednať s povstalcami" # todo: NEW TRANSLATION
 cmd_negotiate_with_rebels_desc: "Je načase vypočuť si prosbu ľudu a vynaložiť maximálne úsilie na obnovenie stability v našej krajine, inak riskujeme eróziu toho, čo nás kedysi robilo veľkými." # todo: NEW TRANSLATION
 cmd_negotiate_with_rebels_tt: "Obetovaním #R 3#! [Concept('celestial_authority_gc','nebeská autorita')|e] a v závislosti od #italic sily#! a podpory [Concept('rebellion','povstania')|e] sa môže stať nasledujúce:" # todo: RETRANSLATED ENGLISH # todo: CONCEPT CASE
 cmd_negotiate_nationalist: "#Y $REBELS_CATEGORY_nationalist$#! budú požadovať zníženie [Concept('control','kontrola')|e] vo svojich krajinách a tlačiť nás smerom k [ShowSocietyDirectionName('free_subjects')]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 cmd_negotiate_estate: "#Y $REBELS_CATEGORY_estate$#!: Budú požadovať zníženie [Concept('tax','daň')|e] a [Concept('privileges','privilégiá')|e]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 cmd_negotiate_religious: "#Y $REBELS_CATEGORY_religious$#!: Budú požadovať [ShowModifier('religious_concessions_modifier')] a tlačiť nás smerom k [ShowSocietyDirectionName('humanist')]" # todo: NEW TRANSLATION
 cmd_reform_the_cabinet: "Reformovať kabinet" # todo: NEW TRANSLATION
 cmd_reform_the_cabinet_desc: "V starších časoch poradcovia slúžiaci v našom [ROOT.GetCountry.GetGovernment.GetCabinetTitle] dávali záujmy ľudu nadovšetko. Nedávno však ich dekadencia a úpadok dosiahli bezprecedentnú úroveň. Upevnení vo svojich privilégiách žiadajú úradné pozície a nevykonávajú svoje povinnosti podľa zákona. Toto sa musí zmeniť, aj keby sme stratili ich priazeň." # todo: NEW TRANSLATION
 cmd_revise_the_tax_code: "Zrevidovať daňový kódex" # todo: NEW TRANSLATION
 cmd_revise_the_tax_code_desc: "Neefektívne zdaňovanie našich mnohých provincií spôsobilo mnohé straty, ktoré v konečnom dôsledku znižujú bohatstvo našej pokladnice. Aby sme pozdvihli naše nálady a vyhli sa rozkladu dynastie, musíme sa postarať o naše zdroje príjmov!" # todo: NEW TRANSLATION
 has_revised_tax_code_action_tt: "Dokončili sme [ShowCabinetActionName('reform_taxation_system')] [Concept('cabinet_action','akcia kabinetu')|e] a [ShowGenericActionName('cmd_revise_the_tax_code')] [Concept('disaster','katastrofa')|e] [Concept('action','akcie')|e]" # todo: RETRANSLATED ENGLISH # todo: CONCEPT CASE
 cmd_restore_stability: "Obnoviť stabilitu v [GetCountry('CHI').GetFlavorRank]" # todo: NEW TRANSLATION
 cmd_restore_stability_desc: "Nedávna katastrofa, ktorá postihla náš veľký ľud, značne ovplyvnila našu stabilitu. Ak ju chceme prekonať a vyjsť z tohto turbulentného obdobia v bezpečí, musíme sa pozrieť dovnútra a postarať sa o naše záležitosti." # todo: NEW TRANSLATION
 cmd_strengthen_crown: "Posilniť trón" # todo: NEW TRANSLATION
 cmd_strengthen_crown_desc: "Naša legitimita ako nositeľov Nebeského mandátu je spochybnená. Musíme stlmiť našich kritikov a získať späť našu slávu ako vyvolených." # todo: NEW TRANSLATION
 has_completed_revised_tax_code_tt: "Dokončené [ShowCabinetActionName('reform_taxation_system')] [Concept('cabinet_action','akcia kabinetu')|e]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 has_not_already_enacted_this_action_during_the_disaster_tt: "Tento [Concept('action','akcia')|e] ešte nebol prijatý počas tohto [Concept('disaster','katastrofy')|e]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 peranakan_trading_rights: "Obchodné práva Peranakanov" # todo: NEW TRANSLATION
 restrict_peranakan_trading_rights: "Obmedziť $peranakan_trading_rights$" # todo: NEW TRANSLATION
 restrict_peranakan_trading_rights_desc: "[ShowReligionGroupName('muslim')] sa k nám dostali cez činnosť [ShowReligionGroupAdjectiveWithNoTooltip('muslim')] obchodníkov, mnohí z ktorých sa usadili v našich severných prístavoch a sú známi ako Peranakan. Aby sme spomalili konverziu našich provincií, môžeme obmedziť ich obchodné práva." # todo: NEW TRANSLATION
 unrestrict_peranakan_trading_rights: "Obnoviť $peranakan_trading_rights$" # todo: NEW TRANSLATION
 unrestrict_peranakan_trading_rights_desc: "Obmedzenia uvalené na Peranakan obchodníkov sú dlhodobo neznesiteľné a musia byť zrušené." # todo: NEW TRANSLATION
 ban_conversion_of_adipatis: "Zákaz konverzie Adipatis" # todo: NEW TRANSLATION
 ban_conversion_of_adipatis_desc: "Konverzia našich provinčných guvernérov, Adipatis, čoraz viac ohrozuje súdržnosť nášho štátu. Ak zakážeme túto prax, môžeme udržať stabilitu dlhšie, ale za cenu veľkého hnevu našich podriadených." # todo: NEW TRANSLATION
 unban_conversion_of_adipatis: "Zrušiť zákaz konverzie Adipatis" # todo: NEW TRANSLATION
 unban_conversion_of_adipatis_desc: "Zákaz konverzie na [ShowReligionGroupAdjective('muslim')] vyvolal príliš veľa problémov a nepokojov. Zrušením ho možno získame istú náklonnosť od našich poddaných" # todo: NEW TRANSLATION
 control_the_bhres: "Ovládnuť Bhres" # todo: NEW TRANSLATION
 control_the_bhres_desc: "Mnohí kniežatá a ich dvory sa postupne konvertujú na [ShowReligionGroupName('muslim')]. Zvyčajne by sme takúto akciu ignorovali, ale pri dlhodobých dôsledkoch to stavia ich lojalitu pod otáznik." # todo: NEW TRANSLATION
 maj_convert_to_islam: "Prejsť na [ShowReligionGroupNameWithNoTooltip('muslim')]" # todo: NEW TRANSLATION
 maj_convert_to_islam_desc: " [ShowReligionAdjective('sunni')] [ShowReligionGroupName('muslim')] sa rýchlo šíri v našich hraniciach a mnohí z našich guvernérov už konvertovali. Možno je čas prehltnúť pýchu a konvertovať tiež, akokoľvek by to bolo katastrofálne pre našu prestíž." # todo: NEW TRANSLATION
 maj_consequences_of_conversion: "Konverzia na [ShowReligionName('sunni')] spôsobí, že každý [Concept('subject','vazal')|e] s menej než #y 10.0%#! [Concept('liberty_desire','túžba po slobode')|e] sa odtrhne, ako aj nasledujúce:" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 MAJ_reduce_sunni_dominance: "$demak_progress$ sa zníži o #g -10.0%#!" # todo: NEW TRANSLATION
 MAJ_for_as_long_as_this_modifier_is_active: "Pokým bude aktívny [ShowModifier('adipati_conversion_ban')], už nebudeme strácať [Concept('cores','jadrá')|e], keď sa [Concept('location','lokalitu')|e] stane dominantne [ShowReligionAdjective('sunni')]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 peranakan_trading_rights_restriction_event_impact: "Pokým bude aktívny [ShowModifier('peranakan_trading_rights_restriction')], udalosť '$death_of_hayan_wuruk.6.title$' [Concept('event','udalosť')|e] sa spustí dvakrát zriedkavejšie." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 hide_from_black_death: "Presunúť dvor do úkrytu" # todo: NEW TRANSLATION
 hide_from_black_death_desc: "Tým sa zníži riziko, že niekto na dvore zomrie na mor. To však spôsobí, že [Concept('pops','populácie')|e] budú myslieť, že sme ich opustili osudu." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 stop_hide_from_black_death: "Opustiť úkryt" # todo: NEW TRANSLATION
 stop_hide_from_black_death_desc: "Musíme sa ukázať, že sa nebojíme Čiernej smrti." # todo: NEW TRANSLATION
 isolate_cities_black_death: "Izolovať mestá" # todo: NEW TRANSLATION
 isolate_cities_black_death_desc: "Nariadením zatvoriť hradby našich miest a obmedziť pohyb do nich aj z nich si myslíme, že môžeme obmedziť dopad choroby a získať potrebnú kontrolu." # todo: NEW TRANSLATION
 stop_isolate_cities_black_death: "Znovu otvoriť mestá" # todo: NEW TRANSLATION
 stop_isolate_cities_black_death_desc: "Keď už najhoršie z choroby pominulo, znovu otvárame naše mestá pre obchodníkov a cudzincov." # todo: NEW TRANSLATION
 isolate_cities_effect_tt: "Všetky [Concept('towns_and_cities','mestské lokality')|e] získajú [ShowModifier('isolating_cities')], škálované podľa toho, koľko [Concept('control','kontrola')|e] máme v [Concept('location','lokalite')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 control_the_food_market: "Kontrolovať trh s potravinami" # todo: NEW TRANSLATION
 control_the_food_market_desc: "V týchto skúšobných časoch je našou najväčšou prioritou zabezpečiť dodávky obilia a iných potravín a zakázať ich vývoz. Aj za cenu pohnevu obchodníkov našej krajiny." # todo: NEW TRANSLATION
 stop_control_the_food_market: "Zrušiť '$control_the_food_market$'" # todo: NEW TRANSLATION
 stop_control_the_food_market_desc: "Tieto opatrenia už nepotrebujeme, obchodníci sú opäť slobodní obchodovať." # todo: NEW TRANSLATION
 close_the_borders: "Izolovať krajinu" # todo: NEW TRANSLATION
 close_the_borders_desc: "Obchodníci a ďalší cestovatelia prinášajú mor z iných území. Aby sme ochránili náš ľud, sme nútení úplne zatvoriť hranice pre akýkoľvek obchod, nech už to stojí čokoľvek pre našu ekonomiku." # todo: NEW TRANSLATION
 stop_close_the_borders: "Zrušiť '$close_the_borders$'" # todo: NEW TRANSLATION
 stop_close_the_borders_desc: "Je čas otvoriť našu krajinu pre zahraničné tovary a obchodníkov." # todo: NEW TRANSLATION
 no_contact_with_outsiders: "Žiadny kontakt s cudzincami" # todo: NEW TRANSLATION
 no_contact_with_outsiders_desc: "Všetci vedia, že cudzí obchodníci a cestovatelia z okolitých kmeňov priniesli mor do nášho územia. Aby sme zabránili ďalšiemu šíreniu, prerušíme všetky väzby so susedmi a zatvoríme hranice pre akýkoľvek obchod, nech to stojí čokoľvek pre našu ekonomiku." # todo: NEW TRANSLATION

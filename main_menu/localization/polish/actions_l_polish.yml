 move_ow_good_to_new_location: "Rozšíriť tovar Starého sveta" # todo: NEW TRANSLATION
 move_ow_good_to_new_location_desc: "Môžeme rozšíriť jeden z našich tradičných tovarov do [Concept('locations','lokalít')|e] v [ShowContinentName('america')], ale miestni tomu nebudú priať a budeme musieť obnoviť rozvoj [Concept('rgo','R.G.O.')|e] tej lokality." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 learn_from_foreigners: "Učiť sa od cudzincov" # todo: NEW TRANSLATION
 learn_from_foreigners_desc: "Od týchto zvláštnych cudzincov sa môžeme veľa naučiť; určitý obchod a dobré vzťahy určite pomôžu nášmu ľudu." # todo: NEW TRANSLATION
 absorb_institutions: "Prevziať inštitúcie" # todo: NEW TRANSLATION
 absorb_institutions_desc: "Zvláštnosti týchto cudzincov mätú a desia náš ľud, ale iste sa nájde mnoho vecí, ktoré by sme sa od nich mohli naučiť a aplikovať v našej spoločnosti." # todo: NEW TRANSLATION
 choose_institution: "Vybrať [Concept('institution','inštitúcia')|e]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 no_valid_institution: "@trigger_no! Žiadna platná [Concept('institution','inštitúcia')|e]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 lordship_of_ireland_casus_belli: "Získať casus belli" # todo: NEW TRANSLATION
 lordship_of_ireland_casus_belli_desc: "Získajte [ShowCasusBelliName('cb_subjugation')] [Concept('casus_belli','casus Belli')|e], ktoré môžete použiť proti krajinám mimo [GetUniqueInternationalOrganization('lordship_of_ireland').GetName]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 lordship_of_ireland_casus_belli_none_tt: "Vyberte [Concept('country','krajina')|e] za cieľ!" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 lordship_of_ireland_invite_planters: "Požiadať o osadníkov" # todo: NEW TRANSLATION
 lordship_of_ireland_invite_planters_desc: "Poslať osadníkov z domoviny na posilnenie verného obyvateľstva." # todo: NEW TRANSLATION
 lordship_of_ireland_invite_planters_effect_none_tt: "Približne 2 400 [Concept('pops','populácie')|e] našej [Concept('religion','náboženstva')|e] sa pomaly presunie z [Concept('area','oblasti')|e] v [ShowRegionName('great_britain_region')] do [Concept('province_definition','definície provincie')|e] v [ShowRegionName('ireland_region')] počas nasledujúcich 10 rokov." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 lordship_of_ireland_invite_planters_effect_tt: "Približne 2 400 [Concept('pops','populácie')|e] sa pomaly presunie z [origin_area.GetName] do [target_province.GetName] počas nasledujúcich 10 rokov." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 lordship_of_ireland_form_kingdom: "Uhlásiť nárok na kráľovstvo" # todo: NEW TRANSLATION
 lordship_of_ireland_form_kingdom_desc: "Titul kráľa Írska je konečne náš na uchopenie, čo posilní našu legitimitu nad krajinou a jej ľudom." # todo: NEW TRANSLATION
 lordship_of_ireland_form_kingdom_region_tt: "Každá [Concept('location','lokalita')|e] v [ShowRegionName('ireland_region')] [Concept('region','regióne')|e] musí byť [Concept('owned','vlastnené')|e] členom [GetUniqueInternationalOrganization('lordship_of_ireland').GetName]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 IRE_f_lordship_tt: "Toto nemôžeme urobiť, pokiaľ sme [Concept('member','člen')|e] [GetUniqueInternationalOrganization('lordship_of_ireland').GetName]. Iba [Concept('international_organization_leader_short','líder')|e] môže tak urobiť cez akciu [ShowGenericActionName('lordship_of_ireland_form_kingdom')]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 neither_highkingship_nor_lordship_exist_tt: "Ani [GetUniqueInternationalOrganization('lordship_of_ireland').GetName] ani [GetInternationalOrganizationType('high_kingship').GetName] v [ShowRegionName('ireland_region')] nemôžu existovať." # todo: CHANGED
 IRE_f_sole_high_kingship_tt: "Sme jediným zostávajúcim členom Vysokého kráľovstva Írska." # todo: NEW TRANSLATION
 IRE_high_kingship_f_leader_tt: "Musíme byť [Concept('international_organization_leader_short','líder')|e] [GetInternationalOrganizationType('high_kingship').GetName] [ShowRegionName('ireland_region')]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 IRE_lordship_of_ireland_f_leader_tt: "Musíme byť [ShowSpecialStatusName('lord_of_ireland')] [GetUniqueInternationalOrganization('lordship_of_ireland').GetName]" # todo: NEW TRANSLATION
 violate_treaty_of_tordesillas: "Porušiť $treaty_of_tordesillas$" # todo: NEW TRANSLATION
 violate_treaty_of_tordesillas_desc: "$treaty_of_tordesillas$ je len kúsok bezvýznamného papiera pre tých, ktorí riskujú svoje životy, aby si vykopali lepšiu budúcnosť v nevděčnej a nebezpečnej novej zemi.\n\nIgnorujeme tieto pravidlá a dovolíme nášmu ľudu vziať si to, čo majú právo vlastniť." # todo: NEW TRANSLATION
 stop_violate_treaty_of_tordesillas: "Prestať porušovať zmluvu o [GetSituationByKey('treaty_of_tordesillas').MakeScope.GetVariable('treaty_location').GetLocation.GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 stop_violate_treaty_of_tordesillas_desc: "V záujme diplomatických vzťahov našej krajiny sa opäť prispôsobíme pravidlám stanoveným $treaty_of_tordesillas$." # todo: NEW TRANSLATION
 tordesillas_claim_conflicting_area_price: "Nárokovať konfliktné územie" # todo: NEW TRANSLATION
 tordesillas_claim_area_price: "Nárokovať oblasť" # todo: NEW TRANSLATION
 tordesillas_claim_area: "Nárokovať oblasť" # todo: NEW TRANSLATION
 tordesillas_claim_area_desc: "Rozšíriť naše koloniálne nároky do susednej [Concept('area','oblasti')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 tordesillas_free_claim_area: "Nárokovať voľnú oblasť" # todo: NEW TRANSLATION
 tordesillas_free_claim_area_desc: "Vytvoriť koloniálny nárok v ktorejkoľvek [Concept('area','oblasti')|e] v našom koloniálnom dosahu." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 tordesillas_claim_conflicting_area: "Nárokovať konfliktné územie" # todo: NEW TRANSLATION
 tordesillas_claim_conflicting_area_desc: "Využijeme náš vplyv nad [GetCountry('PAP').GetLongName], aby sme vytvorili koloniálny nárok v [Concept('area','oblasti')|e], kde my aj náš koloniálny rival kontrolujeme pôdu." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 tordesillas_push_to_settle_treaty: "Tlačiť na uzavretie zmluvy" # todo: NEW TRANSLATION
 tordesillas_push_to_settle_treaty_desc: "Využijúc náš vplyv nad [GetCountry('PAP').GetLongName] urýchlime ratifikáciu a vstup do platnosti $treaty_of_tordesillas$ v jeho súčasnej podobe." # todo: NEW TRANSLATION
 tordesillas_push_to_settle_treaty.tt: "Pokrok k ratifikácii sa posunie o #G 10#!" # todo: NEW TRANSLATION
 tordesillas_upheld_treaty_relevance: "Posilniť význam zmluvy" # todo: NEW TRANSLATION
 tordesillas_upheld_treaty_relevance_desc: "Obhajovať dôležitosť $treaty_of_tordesillas$ a jeho nebesky odôvodnenú správnosť." # todo: NEW TRANSLATION
 tordesillas_upheld_treaty_relevance.tt: "Význam zmluvy sa zvýši o #G 10#!" # todo: NEW TRANSLATION
 tordesillas_demand_transfer_colony: "Žiadať prevod nárokovanej provincie" # todo: NEW TRANSLATION
 tordesillas_demand_transfer_colony_desc: "[GetCountry('PAP').GetGovernment.GetRulerTitle] dal nám a len nám právo kolonizovať a vládnuť týmto krajinám v mene [GetCountry('PAP').GetReligion.GetGodName]. Tí, ktorí tento nebeský mandát prekročili, by nám mali bez reptania odovzdať svoje územie, alebo čeliť následkom." # todo: NEW TRANSLATION
 tordesillas_demand_transfer_colony.tt: "Ak odmietnu našu štedrú žiadosť, získame [Concept('casus_belli','casus Belli')|e], aby sme si ju vzali sami" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 tordesillas_revoke_claim: "Zrušiť nárok" # todo: NEW TRANSLATION
 tordesillas_revoke_claim_desc: "Jednanie je vždy procesom ústupkov a kompromisov; musíme dovoliť rivalom získať to, čo chcú, od času k času, je to súčasť umenia diplomacie, aby sme potom vrátili výhodu späť.\n\nVyužitím nášho vplyvu presvedčíme [GetCountry('PAP').GetLongName] zrušiť jeden z aktívnych nárokov nášho spolupodpisujúceho, čím posunieme rokovania späť do bodu, kde budeme mať vedúcu úlohu." # todo: NEW TRANSLATION
 tordesillas_move_the_line: "Posunúť čiaru" # todo: NEW TRANSLATION
 tordesillas_move_the_line_desc: "Súčasné rozdelenie určované $treaty_of_tordesillas$ nám nevyhovuje tak, ako by malo. Mali by sme posunúť čiaru rozdeľujúcu svet trochu v náš prospech a ukázať svetu, že s nami sa nehrá." # todo: NEW TRANSLATION
 tordesillas_move_the_line.tt: "Imaginárna čiara, ktorá rozdeľuje svet medzi signatárov, bude presunutá na novú [Concept('location','lokalitu')|e]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 tordesillas_move_the_line.tt2: "Pokrok k ratifikácii bude oneskorený o #R 5#!" # todo: NEW TRANSLATION
 tordesillas_swap_sides: "Vymeniť strany" # todo: NEW TRANSLATION
 tordesillas_swap_sides_desc: "Počas rokovaní nám bolo jasné, že podiel nášho rivala je lepší než náš. Využijeme našu povesť a prestíž, aby sme ich presvedčili, že je v ich záujme vymeniť naše nároky s ich." # todo: NEW TRANSLATION
 tordesillas_swap_claim: "Vymeniť nároky" # todo: NEW TRANSLATION
 tordesillas_swap_claim_desc: "S ratifikáciou $treaty_of_tordesillas$ bol svet rozdelený medzi hlavné koloniálne mocnosti, no to nám stále nevyhovuje; možno by sme vymenili niektoré nároky s iným mocnosťami výhodnejšie." # todo: NEW TRANSLATION
 POLICY_BIAS_REFORM_DESIRE: "Túžba po reforme" # todo: NEW TRANSLATION
 conduct_investigation: "Viesť vyšetrovanie" # todo: NEW TRANSLATION
 conduct_investigation_desc: "Dôkladné preskúmanie administratívy a dvora osvetlí a odhalí hady, ktoré chcú otráviť trón!" # todo: NEW TRANSLATION
 any_conspirators_are_active_tt: "Aspoň 1 [Concept('character','postava')|e] je sprisahanec" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 is_a_conspirator: "@trigger_no! V prebiehajúcom pokuse o prevrat už nie sú žiadni sprisahanci" # todo: NEW TRANSLATION
 execute_court_member: "Popraviť člena dvora" # todo: NEW TRANSLATION

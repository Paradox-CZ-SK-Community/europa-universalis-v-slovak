 move_ow_good_to_new_location_no_available_location: "@trigger_no! Nemáte žiadnu platnú [Concept('location','lokalitu')|e], ktorá môže nahradiť svoje súčasné [Concept('rgo','R.G.O.')|e] tovarom Starého sveta" # todo: NEW TRANSLATION # todo: CONCEPT CASE

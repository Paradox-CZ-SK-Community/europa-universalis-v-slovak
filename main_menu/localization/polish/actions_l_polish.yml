 sengoku_ask_for_hostage_desc: "Môžeme požiadať klan, aby nám poslali člena svojej rodiny ako rukojemníka, aby sme posilnili väzby." # todo: NEW TRANSLATION
 sengoku_prove_heritage: "Preukázať pôvod" # todo: NEW TRANSLATION
 sengoku_prove_heritage_desc: "Naša rodina pochádza z hlbokej minulosti, ako vlastne všetky. Môžeme sa pokúsiť 'nájsť' v archívoch dokumenty, ktoré preukážu, ako stará je naša línia a ako úzko sme spätí s najdôležitejšími rodmi a klanmi." # todo: NEW TRANSLATION

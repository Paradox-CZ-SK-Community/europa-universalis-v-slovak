 divorce_ruler: "Umožniť panovníkovi rozvod" # todo: NEW TRANSLATION
 divorce_ruler_desc: "Sila našich cirkevných úradov sa meria činmi ako umožnenie žiadosti o právny rozvod. To by nám nepochybne poskytlo väčšiu diplomatickú a dynastickú manévrovateľnosť." # todo: NEW TRANSLATION
 choose_consort_to_divorce_from: "Vyberte [Concept('consort','konzort panovníka')|e], od ktorého sa rozviesť" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 summon_mystic: "Privolať mystika" # todo: NEW TRANSLATION
 summon_mystic_desc: "V našich monastických spoločenstvách žijú ľudia obzvlášť oddaní dosiahnutiu blízkosti s Bohom. Títo ľudia, nazývaní mystici, sú muži a ženy veľkej múdrosti, ktorí nám môžu lepšie pomôcť viesť krajinu. Nemali by sme váhať, keď je potrebné urobiť z nich poradcov." # todo: NEW TRANSLATION
 bosnian_church_diplomacy: "Poslať vyslancov do Ríma" # todo: NEW TRANSLATION
 bosnian_church_diplomacy_desc: "V dôsledku izolácie našej viery sú naše väzby na katolicizmus často spochybňované mnohými susedmi, ktorí nás obviňujú z kacírstva. Mali by sme poslať zástupcu našej cirkvi do Ríma, aby zložil prísahu vernosti pápežovi a ukončil tieto klebety, ktoré nás ohrozujú." # todo: CHANGED
 bosnian_church_diplomacy_tt: "Zlepšíme naše vzťahy s krajinami, ktoré nasledujú [ShowLocationName('rome')]" # todo: NEW TRANSLATION
 improve_opinion_with_all_catholics_tt: "Zlepšíme [Concept('opinion','názor')|e] každého [ShowReligionAdjective('catholic')] [Concept('country','krajiny')|e] voči nám o [ShowBiasValue('opinion_bosnian_church_diplomacy')|+=0]" # todo: CHANGED # todo: CONCEPT CASE
 expose_the_enemies_of_the_faith: "Odhaľte nepriateľov viery" # todo: NEW TRANSLATION
 expose_the_enemies_of_the_faith_desc: "Historicky bola naša krajina považovaná za hniezdo kacírstva, cieľ krížových výprav a pod tlakom, aby sme opustili naše rítusy. Preto spočíva sila našej cirkvi v ostražitosti; identifikovaním agentov nepriateľských cirkví a dvorov im odoberáme všetky prostriedky na podkopanie našej viery a opätovné ohrozenie nás." # todo: NEW TRANSLATION
 expose_the_enemies_of_the_faith_tt: "Zmenší veľkosť každého nepriateľského [Concept('spy_network','špionážnej siete')|e] v [Concept('country','krajine')|e] o #G -10.00#!" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 affirm_the_confession_of_biljno_polje: "Potvrdiť vyznanie z Biljno Polje" # todo: NEW TRANSLATION
 affirm_the_confession_of_biljno_polje_desc: "V roku 1203 zástupcovia našej cirkvi podpísali na Biljno Polje dokument, v ktorom sa zaviazali upustiť od kacírskych a schizmatických praktík a podriadiť sa autorite Ríma. Potvrdzme túto dohodu znova, aj keď naše tradície a zvyky ticho pretrvávajú, ako vždy." # todo: NEW TRANSLATION
 support_the_krstjani_monasteries: "Podporiť $bosnian_church_ADJ$ kláštory" # todo: NEW TRANSLATION
 support_the_krstjani_monasteries_desc: "Kláštory $bosnian_church_ADJ$ sú srdcom našej viery a tichým základom, na ktorom pretrvávame. Ich trvalá podpora zabezpečuje náboženskú stabilitu aj miestnu lojalitu." # todo: NEW TRANSLATION
 support_the_krstjani_monasteries_tt: "Provincia [target_province.GetName] získa [ShowNamedValue('prosperity_mild_bonus')|+=2%] [Concept('prosperity','prosperita')|e] a všetky [Concept('pops','populácie')|e] v [target_province.GetName], ktoré vyznávajú náboženstvo [ShowReligionAdjective('bosnian_church')], získajú [ShowNamedValue('pop_satisfaction_mild_bonus')|+=2%] [Concept('pop_satisfaction','spokojnosť populácie')|e]" # todo: NEW TRANSLATION # todo: CONCEPT CASE

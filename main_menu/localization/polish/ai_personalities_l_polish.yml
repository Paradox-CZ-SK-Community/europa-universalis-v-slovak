 AI_DISPOSITION_ALARMED_DESC: "Tento [country_disposition|e] znamená, že vás považujú za existenčnú hrozbu a pravdepodobne budú hľadať obranné aliancie alebo podniknú predbežné kroky proti vám." # todo: CHANGED
 AI_DISPOSITION_WARY_DESC: "Tento [country_disposition|e] znamená, že sú k vám ostražití a budú neochotní robiť ústupky alebo znižovať ostražitosť." # todo: NEW TRANSLATION
 AI_DISPOSITION_PLANNING_WAR_DESC: "Tento [country_disposition|e] znamená, že majú aktívny nárok alebo sťažnosť a pripravujú sa ho uplatniť silou." # todo: NEW TRANSLATION
 AI_DISPOSITION_COVETS_DESC: "Tento [country_disposition|e] znamená, že vaše územia považujú za atraktívny cieľ a môžu sa pokúsiť vás dobyť alebo podrobiť, keď sa naskytne príležitosť." # todo: NEW TRANSLATION
 AI_DISPOSITION_DOMINEERING_DESC: "Tento [country_disposition|e] znamená, že vás svojou mocou prevyšujú a usilujú sa vás podriadiť prostredníctvom podrobenia alebo vazalizácie, hoci nepotrebujú žiadnu konkrétnu vašu provinciu." # todo: NEW TRANSLATION
 AI_DISPOSITION_RIVALS_DESC: "Tento [country_disposition|e] znamená, že vás vnímajú ako rivala a budú sa proti vám postaviť všade, kde môžu, vrátane podpory vašich nepriateľov." # todo: NEW TRANSLATION
 AI_DISPOSITION_INDIFFERENT_DESC: "Tento [country_disposition|e] naznačuje, že k vám momentálne nemajú silné city." # todo: NEW TRANSLATION
 AI_DISPOSITION_FRIENDLY_DESC: "Tento [country_disposition|e] znamená, že vás považujú za priateľa, či už vzhľadom na trvalú obrannú alianciu, alebo jednoducho priaznivé vzťahy, a majú sklon s vami spolupracovať." # todo: NEW TRANSLATION

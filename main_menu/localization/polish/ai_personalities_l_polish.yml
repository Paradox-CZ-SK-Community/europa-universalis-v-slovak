 ai_aggressive_desc: "Tento štát usiluje o moc silou. Rýchlo vyvoláva vojny, požaduje tvrdé mierové podmienky a považuje susedné veľmoci za prekážky, ktoré treba zdolať, skôr než za partnerov, s ktorými je potrebné nadväzovať vzťahy." # todo: NEW TRANSLATION
 ai_expansionist_desc: "Tento štát sa snaží rozširovať svoje hranice a vplyv. Uprednostňuje teritoriálny rast, aktívne uplatňuje nároky a pri príležitosti skôr inklinuje k podrobeniu než priamej anektácii." # todo: NEW TRANSLATION
 ai_defensive_desc: "Tento štát sa primárne stará o ochranu toho, čo má. Radšej sa vyhýba zbytočným konfliktom, buduje silu doma a reaguje na hrozby namiesto ich vytvárania." # todo: NEW TRANSLATION
 ai_cautious_desc: "Tento štát sa vyhýba riziku a je trpezlivý. Najprv hľadá diplomatické riešenia, vyhýba sa vojnám, ktoré nemôže rozhodne vyhrať, a uprednostňuje stabilitu pred dobrodružstvom." # todo: NEW TRANSLATION
 ai_opportunistic_desc: "Tento štát je vypočítavý a pragmatický. Sleduje slabiny iných a využíva výhodné momenty, no vyhýba sa zapájaniu do konfliktov, ak je výsledok neistý." # todo: NEW TRANSLATION
 ai_isolationist_desc: "Tento štát sa sústreďuje dovnútra, uprednostňuje vnútorný rozvoj a odoláva zahraničným zapleteniam. Silno preferuje neutralitu a diplomatické záväzky vníma s podozrením." # todo: NEW TRANSLATION
 ai_friendly_desc: "Tento štát si cení aliancie, dobrú vôľu a férové dohody. Silno investuje do diplomacie, prijíma rozumné mierové podmienky a časom si vytvára spoľahlivých partnerov." # todo: NEW TRANSLATION

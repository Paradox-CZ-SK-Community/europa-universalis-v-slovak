# Výnimky pre generátor „Krajiny: pády a prídavné mená“ (SK_custom_countries.py).
# Kľúč je slovenský názov krajiny z country_names_l_polish.yml.
# G D A L I = pády, R = rod pre zhodu slovesa (m, f, n, p = množné číslo).

# ženský rod na spoluhlásku (vzor dlaň/kosť)
Halič: {G: Haliče, D: Haliči, A: Halič, L: Haliči, I: Haličou, R: f}
Volyň: {G: Volyne, D: Volyni, A: Volyň, L: Volyni, I: Volyňou, R: f}
Riazaň: {G: Riazane, D: Riazani, A: Riazaň, L: Riazani, I: Riazaňou, R: f}
Tver: {G: Tveri, D: Tveri, A: Tver, L: Tveri, I: Tverou, R: f}

# pomnožné
Benátky: {G: Benátok, D: Benátkam, A: Benátky, L: Benátkach, I: Benátkami, R: p}

# mužský rod s genitívom na -a
Janov: {G: Janova, D: Janovu, A: Janov, L: Janove, I: Janovom, R: m}
Egypt: {G: Egypta, D: Egyptu, A: Egypt, L: Egypte, I: Egyptom, R: m}

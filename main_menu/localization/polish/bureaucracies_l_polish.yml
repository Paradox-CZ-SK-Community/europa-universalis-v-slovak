 board_of_revenue_bureaucracy: "Rada pre príjmy" # todo: NEW TRANSLATION
 board_of_revenue_bureaucracy_desc: "Centralizovaný orgán zodpovedný za výber, posudzovanie a správu štátnych príjmov. Inštitúcie ako English Board of Treasury alebo francúzsky #italic Contrôle général des finances#! ukázali, ako dobre financovaná Rada pre príjmy môže dramaticky zvýšiť príjmy koruny — ale zanedbaná, presýtená sinekurami a korupciou, sa stáva bremenom pre samotné prostriedky, ktoré mala chrániť." # todo: NEW TRANSLATION
 privy_council_bureaucracy: "Tajná rada" # todo: NEW TRANSLATION
 privy_council_bureaucracy_desc: "Vnútorná rada dôveryhodných poradcov, ktorá slúži ako hlavný nástroj kráľovskej vlády. Orgány ako English Privy Council alebo španielsky #italic Consejo Real#! umožnili panovníkom efektívne vládnuť tým, že zjednotili veľké štátne úrady pod jednou koordinovanou inštitúciou. Bez primeranej podpory sa však Tajná rada zmení na fórum frakčných sporov, odcudzujúc tie stavy, bez ktorých by koruna nemohla fungovať." # todo: NEW TRANSLATION
 audit_bureau_bureaucracy: "Audítorský úrad" # todo: NEW TRANSLATION
 audit_bureau_bureaucracy_desc: "Vyhradený orgán poverený kontrolou verejných účtov a odhaľovaním korupčných praktík úradníkov a daňových farmárov. Inštitúcie modelované podľa francúzskeho #italic Cour des Comptes#! alebo holandského #italic Rekenkamer#! dali korune silný nástroj na obnovu stratených príjmov a pohnanie správcov k zodpovednosti. Ak je však Audítorský úrad podfinancovaný, stratí svoju nezávislosť — zakorenené záujmy vyplnia vákuum a daňový aparát je obsadený tými istými stranami, ktoré mal kontrolovať." # todo: NEW TRANSLATION
 colonial_office_bureaucracy: "Koloniálny úrad" # todo: NEW TRANSLATION
 colonial_office_bureaucracy_desc: "Ministerstvo zodpovedné za smerovanie politiky voči zámoorským územiam, riadenie koloniálnych menovaní a dohľad nad právnym rámcom impéria. English Colonial Office ilustruje, ako organizovaný metropolitný dohľad môže urýchliť osídľovanie vzdialených panstiev. Bez primeraného financovania však propagácia kolonizácie povzbudzuje ľudí opustiť našu krajinu, ani im pritom neponúka lepšie možnosti v rámci nášho impéria." # todo: NEW TRANSLATION
 admiralty_board_bureaucracy: "Admiralitná rada" # todo: NEW TRANSLATION
 admiralty_board_bureaucracy_desc: "Rada komisárov zodpovedná za správu, zásobovanie a strategické smerovanie námorníctva. Britská Admiralty a španielska #italic Consejo de Guerra#!'s námorné oddelenie preukázali, že profesionálna námorná správa bola rovnako rozhodujúca ako samotné lode. Dobre udržiavaná Admiralitná rada dokáže vytvoriť veľkú a skúsenú rezervu námorníkov — ale keď financovanie zlyhá, nábor pokračuje, zatiaľ čo výcvik nie, a námorná tradícia eroduje aj pri raste flotily." # todo: NEW TRANSLATION
 foreign_ministry_bureaucracy: "Ministerstvo zahraničných vecí" # todo: NEW TRANSLATION
 foreign_ministry_bureaucracy_desc: "Stály úrad venovaný vedenie vonkajších vzťahov štátu, udržiavaniu zboru rezidentných veľvyslancov a koordinácii spravodajských informácií zo zahraničia. Francúzsky #italic Ministère des Affaires Étrangères#! stál pri zrode profesionálnej diplomatickej služby, ktorú si neskôr osvojili aj ďalšie mocnosti. Náležite financované ministerstvo zahraničných vecí buduje prestíž úspešnými rokovaniami — ale podfinancované prináša trápne situácie: vyslanci, ktorí si nemôžu dovoliť svoje domácnosti, neodpovedané depeše a poškodenú reputáciu." # todo: NEW TRANSLATION
 trade_commission_bureaucracy: "Obchodná komisia" # todo: NEW TRANSLATION
 trade_commission_bureaucracy_desc: "Regulačný orgán poverený vydávaním licencií obchodníkom, rozhodovaním v obchodných sporoch, stanovovaním ciel a bojom proti pašovaniu. Inštitúcie ako British Board of Trade alebo dohľadové rady holandskej #italic Vereenigde Oost-Indische Compagnie#! ukázali, ako organizovaná štátna angažovanosť v obchode môže transformovať národné bohatstvo. Bez presadzovacích schopností sa Obchodná komisia stáva bezmocnou — licencované monopoly sa obchádzajú, príjmy z ciel unikajú a širšia obchodná ekonomika na tom bude horšie než predtým." # todo: NEW TRANSLATION
 war_council_bureaucracy: "Vojenská rada" # todo: NEW TRANSLATION
 war_council_bureaucracy_desc: "Najvyšší vojenský výbor zodpovedný za plánovanie, koordináciu a dohľad nad pozemnými silami. Habsburský #italic Hofkriegsrat#! a britský War Office predstavujú rôzne odpovede na ten istý problém, ako vniesť strategické smerovanie do armád príliš veľkých na to, aby ich mohol ovládať jediný veliteľ. Financovaná Vojenská rada vytvára stále prúdy schopných dôstojníkov — ale keď sa jej rozpočty znížia, inštitucionálny mechanizmus, ktorý identifikuje a povyšuje talenty, sa rozpadne a vojenská tradícia upadne." # todo: NEW TRANSLATION
 ordnance_board_bureaucracy: "Rada pre výzbroj" # todo: NEW TRANSLATION
 ordnance_board_bureaucracy_desc: "Špecializované oddelenie zodpovedné za výrobu, skladovanie a zásobovanie delostrelectva, streliva a poľného inžinierstva. Anglický Board of Ordnance a francúzsky #italic Corps Royal de l'Artillerie#! ukázali, že profesionalizácia obliehacieho boja si vyžaduje trvalú byrokratickú inštitúciu, nie improvizovaných dodávateľov. Dobre financovaná Rada pre výzbroj výrazne zlepší obliehacie schopnosti — ale keď je ukrátená o zdroje, uzatvára sa do seba: zlievarne sa neudržiavajú, prehliadky skladov sa vynechávajú a pevnosti, ktoré mala Rada udržiavať, začínajú chátrať." # todo: NEW TRANSLATION
 commissariat_bureaucracy: "Komisariát" # todo: NEW TRANSLATION
 commissariat_bureaucracy_desc: "Logistická vetva vojenského aparátu zodpovedná za zásobovanie armád v poli potravou, krmivom, odevom a výstrojom. Systém vyvinutý pod Louvoisom pre armády Ľudovíta XIV. — neskôr prepracovaný do #italic Intendance#! — ukázal, že armáda, ktorá sa zásobuje z organizovaných depotov, môže viesť ťaženia v rozsahu a trvaní nemožnom pre sily žijúce na úkor krajiny. Náležite financovaný Komisariát zväčšuje efektívnu početnosť dostupných síl pre taženia; podfinancovaný núti armády kompenzovať to prostredníctvom ruinóznych súkromných zmlúv, čím sa náklady na údržbu zvyšujú oveľa viac, než stojí zisk z počtu vojakov." # todo: NEW TRANSLATION
 central_secretariat_bureaucracy: "Centrálny sekretariát" # todo: NEW TRANSLATION
 central_secretariat_bureaucracy_desc: "The #italic $zhongshu_sheng$#! bol vrcholným civilným administratívnym orgánom dynastie Yuán, ktorý riadil všetku správu v impériu z hlavného mesta. Dobre financovaný sekretariát legitimizuje autoritu dynastie prostredníctvom rozhodného, koordinovaného vládnutia — ale keď sú jeho operácie zanedbané, vznikajúci administratívny chaos zvyšuje náklady na každé politické rozhodnutie, ktoré koruna musí urobiť." # todo: NEW TRANSLATION
 imperial_censorate_bureaucracy: "Cisársky cenzorát" # todo: NEW TRANSLATION
 imperial_censorate_bureaucracy_desc: "The #italic Yùshǐtái#! pod dynastiou Yuán — neskôr reformovaný ako #italic Dūcháyuàn#! za dynastie Míng — bol inšpektorát poverený odhaľovaním korupcie medzi úradníkmi a dohľadom nad dodržiavaním zákonov od hlavného mesta až po provincie. Keď je primerane financovaný, jeho vyšetrovateľia dokážu obnoviť daňové príjmy, ktoré by inak unikali cez úradnícke zneužitia — ale ak zostanú bez prostriedkov, stratia dosah na činnosť a stavy rýchlo začnú využívať vzniknuté médium dohľadu." # todo: NEW TRANSLATION
 six_boards_bureaucracy: "Šesť ministerstiev" # todo: NEW TRANSLATION
 six_boards_bureaucracy_desc: "The #italic Liùbù#! boli šesť ministerstiev dynastie Míng — personál, príjmy, obrady, vojna, spravodlivosť a verejné práce — ktoré spoločne spravovali celý aparát štátu. Spoločne predstavujú najkomplexnejšiu byrokratickú štruktúru na svete; dobre financované prinášajú výrazný nárast daňových príjmov, ale zanedbané sa šesť úradov mení na upevnené centrá moci pre frakčných úradníkov, ktorí uprednostňujú svoje vlastné záujmy pred záujmami trónu." # todo: NEW TRANSLATION
 six_boards_deactivate_disables_oversight_law_tt: "Odstránenie tejto [bureaucracy|e] znemožní prístup k zákonu [ShowLawName('six_ministries_overseer_law')]" # todo: NEW TRANSLATION
 grand_secretariat_bureaucracy: "Veľký sekretariát" # todo: NEW TRANSLATION
 grand_secretariat_bureaucracy_desc: "The #italic Nèigé#! bol vnútorný poradný zbor, ktorý v praxi vládol impériu Míng, zostavoval dekréty, sprostredkovával medzi cisárom a vonkajšou byrokraciou a koordinoval politiku naprieč $six_boards_bureaucracy$. Náležite financovaný Veľký sekretariát buduje cisársku prestíž prostredníctvom rozhodného, jednotného vládnutia — ale podfinancovaný príde o cisárov sluch a legitimita, ktorú mal udržiavať, začne erodovať." # todo: NEW TRANSLATION

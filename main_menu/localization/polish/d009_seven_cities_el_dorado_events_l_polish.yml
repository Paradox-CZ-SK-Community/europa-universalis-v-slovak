 seven_cities_el_dorado.1.title: "Jazero, loď a nič" # todo: NEW TRANSLATION
 seven_cities_el_dorado.1.desc: "Po šiestich mesiacoch na vysočine dorazila výprava k jazeru, ktoré muiskovskí kňazi opisujú ako srdce obradu: kruhovému kráteru naplnenému tmavou vodou, obkolesenému terasovitými kopcami, s jedinou obradnou cestou vedúcou dolu k brehu. Kňazi tu už nie sú; krajinu vyľudnili pravé kiahne generáciu pred naším príchodom. Tím domorodých potápačov, ochotných prijať platbu v podobe obchodného tovaru, prehľadal tri miesta v jazere. Vytiahli niekoľko zlatých predmetov, množstvo keramiky, kosti rýb a psa, ale nič, čo by pripomínalo kráľa. [target_leader.GetName] musí dospieť k záveru, že obrad bol skutočný, no kráľovstvo, ktoré ho podporovalo, zaniklo." # todo: NEW TRANSLATION
 seven_cities_el_dorado.1.a: "Spustite zástavu. Niet tu už krajiny, s ktorou by sa dalo rokovať." # todo: NEW TRANSLATION
 seven_cities_el_dorado.1.historical_info: "Guatavita je posvätné kráterové jazero na vysočine dnešnej Kolumbie a kultové centrum konfederácie Muiscov, ktorá vládla bogotskej savane až do príchodu Španielov v 30. rokoch 16. storočia. Obrad, ktorý tvorí jadro legendy o El Dorade — pravidelné posypanie nového náčelníka zlatým prachom, po ktorom ho na člne vyviezli na jazero a prach z neho zmyli do vody — bol skutočný a v Guatavite sa konal ešte dlho do raného koloniálneho obdobia. Kráľovstvo, ktoré ho vykonávalo, však už upadalo, keď prvá európska výprava dorazila do savany. Zdecimovali ho pravé kiahne a politická kríza, ktorú príchod európskych chorôb vyvolal takmer všade." # todo: NEW TRANSLATION
 seven_cities_el_dorado.2.title: "Zlaté predmety a spomienky" # todo: NEW TRANSLATION
 seven_cities_el_dorado.2.desc: "Krajina, do ktorej sme dorazili, už nie je krajinou, v ktorej žil El Dorado. Náčelníctva na vysočine sú rozdrobené a oslabené; ústredný dvor zanikol a jazero už neslúži na obrady. Dielne tu však stále stoja. Zlatníci stále pracujú podľa starých postupov. Od jedného dedinského kováča kupujeme tepaný zlatý náprsník zobrazujúci muža na plti, a to za cenu železnej sekery. Kronikár ho dvakrát načrtne. Obchod so spracovaným zlatom možno udržať. Legendárny dvor však nemožno znovu obnoviť." # todo: NEW TRANSLATION
 seven_cities_el_dorado.2.a: "Založte obchodnú stanicu na predaj zlatých predmetov." # todo: NEW TRANSLATION
 seven_cities_el_dorado.2.historical_info: "Metalurgia Muiscov patrila k najvyspelejším v predkolumbovskej Amerike. Spracúvali nielen zlato, ale aj zliatinu medi a zlata zvanú tumbaga, ktorá umožňovala zložité odlievanie metódou strateného vosku pri nízkych teplotách. Keďže sa muiskovská tradícia v útržkoch zachovala aj do koloniálneho obdobia, v dielňach na vysočine sa až do 17. storočia naďalej vyrábali pôvodné predkolumbovské zlaté predmety, niekedy pre tradičných zákazníkov, inokedy pre španielsky trh. Známa muiskovská figúrka plte zobrazujúca obrad El Dorada vznikla v tomto období a dnes sa nachádza v Múzeu zlata v Bogote." # todo: NEW TRANSLATION
 seven_cities_el_dorado.3.title: "Pozlátený kráľ" # todo: NEW TRANSLATION
 seven_cities_el_dorado.3.desc: "Krajina, do ktorej sme dorazili, je krajinou z legendy, ktorú sme našli ešte pred jej pádom: konfederáciou horských náčelníctiev s ústredným dvorom, posvätným jazerom a každoročným obradom, pri ktorom najvyššieho náčelníka posypú zlatým prachom v srdci jeho územia. Dvor prijíma [target_leader.GetName] s náležitou úctou. Ponúknutá zmluva je obchodnou, nie dobyvačnou zmluvou; náčelník nechce byť vazalom, ale je ochotný stať sa partnerom. Samotné zlaté predmety stoja za náklady na výpravu. Ak bude zmluva dodržiavaná, má ešte väčšiu cenu." # todo: NEW TRANSLATION
 seven_cities_el_dorado.3.a: "Podpíšte ju. Partner v Novom svete, nie dobytá provincia." # todo: NEW TRANSLATION
 seven_cities_el_dorado.3.historical_info: "Mýtus o El Dorade v jeho ustálenej podobe — bohaté vnútrozemské kráľovstvo, ktorého vládcu každoročne posypú zlatým prachom — poháňal výpravy do vnútrozemia Južnej Ameriky ešte dve a pol storočia po tom, čo bolo skutočné kultové centrum v Guatavite zdokumentované, vyľudnené a potichu zabudnuté. Pretrvávanie tohto mýtu v európskej predstavivosti napriek pribúdajúcim dôkazom, že čokoľvek tam kedysi existovalo, už nebolo, je učebnicovým príkladom toho, čo ekonómovia nazývajú uvažovaním založeným na utopených nákladoch, ktoré pretrváva naprieč generáciami štátom financovaného prieskumu." # todo: NEW TRANSLATION

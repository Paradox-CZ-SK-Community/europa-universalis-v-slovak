l_polish:
 flavor_cas.142.title: "Čierna legenda" # todo: NEW TRANSLATION
 flavor_cas.142.entry: "$flavor_cas.142.title$" # todo: NEW TRANSLATION
 flavor_cas.142.desc: "Dozvedeli sme sa, že naši koloniálni rivali nešetria úsilím, aby očiernili meno krajiny [ROOT.GetCountry.GetAltAdjective('G')]. V pamfletoch a príbehoch vykresľujú našich conquistadorov ako krvilačných tyranov a naše kolónie ako územia udržiavané výlučne krutosťou. Keďže sa tieto obvinenia rýchlo šíria po celom kontinente [ShowContinentName('europe')], musíme na tieto ohovárania a výmysly, ktoré pramenia zo závisti, reagovať." # todo: NEW TRANSLATION # todo: COUNTRY CASE
 flavor_cas.142.a: "Ich závisť je dôkazom našej veľkosti." # todo: NEW TRANSLATION
 flavor_cas.142.b: "Zhromaždime dôkazy a predložme ich verejnosti." # todo: NEW TRANSLATION
 flavor_cas.142.b_tt: "Hoci sa nám možno podarí zachrániť si dobré meno, mnohí si našu odpoveď môžu vyložiť ako priznanie, že sme sa nechali oklamať ich klamstvami a výmyslami" # todo: NEW TRANSLATION
 flavor_cas.142.historical_info: "Od 16. storočia začali španielski koloniálni rivali — prevažne protestanti — viesť očierňovaciu kampaň, ktorá neskôr dostala názov Čierna legenda. Hoci sa sami dopúšťali podobných činov, snažili sa démonizovať Španielsko zdôrazňovaním jeho krutosti v Amerike a opätovným vydávaním španielskych diel, napríklad spisov Bartolomého de las Casas, pričom do nich vkladali mnohé preháňania a vytrhávali veci z kontextu, aby poškodili povesť španielskej koruny." # todo: NEW TRANSLATION
 flavor_cas.143.title: "Cesta [ROOT.GetCountry.GetAdjectiveWithNoTooltip]" # todo: NEW TRANSLATION
 flavor_cas.143.entry: "Španielska cesta" # todo: NEW TRANSLATION
 flavor_cas.143.desc: "Keďže naše panstvá siahajú od [ShowRegionName('italy_region')] až po [target_province2.GetName], preprava tovaru a vojakov z jedného miesta na druhé je čoraz väčším problémom. Naše lode sú totiž vo veľkom nebezpečenstve, najmä keď sa plavia okolo [ShowRegionName('great_britain_region')]. Navrhli nám, aby sme investovali do cestnej siete, ktorá postupne prepojí všetky naše územia na kontinente [ShowContinentName('europe')]." # todo: NEW TRANSLATION
 flavor_cas.143.a: "Začneme s výstavbou." # todo: NEW TRANSLATION
 flavor_cas.143.a_tt: "[ShowRoadTypeName('paved_road')] bude vybudovaná v každej [Concept('location','lokalite')|e] v [Concept('province','provincii')|e] [target_province1.GetName] a [target_province2.GetName], za cenu v [Concept('gold','dukátoch')|e], ktorá závisí od terénu a už vybudovaných ciest" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 flavor_cas.143.b: "Naše námorníctvo nič neohrozí." # todo: NEW TRANSLATION
 flavor_cas.143.historical_info: "Španielska cesta bola vojenským a logistickým koridorom zriadeným v polovici 16. storočia, ktorý spájal španielske územia v Taliansku so španielskym Nizozemskom cez spojenecké územia, prevažne v rámci Svätej ríše rímskej. Vybudovali ju, aby sa vyhli nebezpečným vodám Lamanšského prielivu, kde mohlo nepriateľské námorníctvo ľahko zachytiť španielske lode." # todo: NEW TRANSLATION
 flavor_cas.148.title: "Empresa de China" # todo: NEW TRANSLATION
 flavor_cas.148.entry: "$flavor_cas.148.title$" # todo: NEW TRANSLATION
 flavor_cas.148.desc: "Odkedy sme dorazili do [ShowRegionName('indonesia_region')], mnohí tvrdia, že dobytie Číny je nielen možné, ale aj predurčené. Správy od obchodníkov a vyslancov opisujú národy sužované korupciou, ktoré by nemali šancu proti sile krajiny [ROOT.GetCountry.GetAltAdjective('G')]. Naši špehovia usilovne prenikajú do [target_country.GetName] a domnievajú sa, že [target_location.GetName] by bolo ideálnym odrazovým mostíkom na naše konečné podmanenie celej Číny." # todo: NEW TRANSLATION # todo: COUNTRY CASE
 flavor_cas.148.a: "Začnime prípravy na inváziu." # todo: NEW TRANSLATION
 flavor_cas.148.b: "Nemôžeme konať na základe týchto klebiet." # todo: NEW TRANSLATION
 flavor_cas.148.historical_info: "Po španielskom dobytí Filipín navrhlo mnoho úradníkov a jezuitských misionárov ambiciózny plán s názvom #italic Empresa de China#!, podľa ktorého malo Španielsko napadnúť mingskú Čínu a obrátiť ju na kresťanstvo. Jezuiti pôsobiaci v Číne hlásili, že ríša je vnútorne slabá a dá sa ľahko dobyť. V roku 1588 Filip II. povolil prípravy na inváziu, no tá sa napokon nikdy neuskutočnila a zostáva jedným z najambicióznejších nerealizovaných expanzívnych projektov Španielskej ríše." # todo: NEW TRANSLATION
 flavor_cas.152.title: "Jedna daň pre celú ríšu" # todo: NEW TRANSLATION
 flavor_cas.152.entry: "$flavor_cas.152.title$" # todo: NEW TRANSLATION
 flavor_cas.152.desc: "Naša vojna proti Maurom ťažko zaťažila pokladnicu a [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')] musí hľadať nové zdroje príjmov na financovanie vojny. Mestá v krajine súhlasili, že nám poskytnú daň z predaja, no táto ponuka podnietila mnohých našich radcov k úvahe, že by to nemalo byť len dočasné opatrenie, ale trvalý a inštitucionalizovaný zdroj príjmov." # todo: NEW TRANSLATION
 flavor_cas.152.a: "Nemôžeme sa spoliehať na dočasné dary." # todo: NEW TRANSLATION
 flavor_cas.152.b: "Nebudeme zneužívať ich štedrosť." # todo: NEW TRANSLATION
 flavor_cas.152.historical_info: "Za vlády Alfonza XI. čelila Kastília finančným problémom v dôsledku ťažení proti Granade. Na financovanie obliehania a dobytia Algecirasu udelili kastílske mestá kráľovi právo vyberať #italic Alcabalu#!, daň z predaja uvalenú na obchodné transakcie. Daň, ktorá mala pôvodne predstavovať mimoriadny vojnový príspevok schválený mestami prostredníctvom kortesov, sa čoskoro stala jedným z najdôležitejších zdrojov kráľovských príjmov v Kastílii. Neskorší panovníci daň rozšírili a inštitucionalizovali a zmenili ju na trvalý odvod, ktorý po stáročia tvoril významnú časť príjmov koruny." # todo: NEW TRANSLATION

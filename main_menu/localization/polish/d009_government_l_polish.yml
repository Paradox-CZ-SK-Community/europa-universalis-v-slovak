l_polish:
 agraw_federation_reform: "Agrawská federácia" # todo: NEW TRANSLATION
 agraw_federation_reform_desc: " #italic agraw#! — poradné zhromaždenie dedín a klanov kabylskej vysočiny — vládne bez ústrednej výkonnej moci: rozhodnutia prijaté na rade zaväzujú všetky zúčastnené klany a žiadny jednotlivý úrad nemôže prevážiť spoločný hlas zhromaždených starších. Vďaka tejto federálnej štruktúre sme takmer imúnni voči bežnému spôsobu dobývania — niet trónu, ktorý by bolo možné dobyť, paláca, ktorý by bolo možné vypáliť, ani jedinej zmluvy, ktorú by bolo možné vypovedať — a spája dediny do jednej správnej jednotky bez toho, aby im vnucovala aparát vzdialeného sultána. Pomalšie rozhodovanie prijímame ako cenu za skutočnú samosprávu a zisťujeme, že naši ľudia, ponechaní na rozhodovanie vlastných zhromaždení, majú len málo dôvodov vzbúriť sa proti nim." # todo: NEW TRANSLATION
 alg_dey_regency_reform: "Regentstvo Alžíru" # todo: NEW TRANSLATION
 alg_dey_regency_reform_desc: "Regentstvo Alžíru si vyvinulo osobitú formu vlády: #italic dey#! volený janičiarskym zborom armády, aga veliteľ pozemných síl a #italic divan#! vyšších dôstojníkov, ktorí spoločne tvoria kabinet aj parlament štátu. Nejde o dynastiu — #italic dey#! sa zodpovedá zboru, ktorý ho dosadil, a #italic dey#!, ktorý stratí dôveru #italic odjaku#!, zriedka vydrží do konca sezóny — no je to stabilný systém svojho druhu, vytvárajúci administratívne schopný korzársky vojenský štát, ktorý svojím námorným a obchodným dosahom výrazne prevyšuje možnosti svojho obyvateľstva. Toto usporiadanie sme kodifikovali ako ústavnú formu regentstva a prijali nestálosť vojenského nástupníctva výmenou za armádu, ktorá si vládne sama, a pokladnicu plnenú morom." # todo: NEW TRANSLATION
 amenokal_paramountcy_reform: "Najvyššia moc amenokala" # todo: NEW TRANSLATION
 amenokal_paramountcy_reform_desc: "#italic Amenokal#! — najvyšší náčelník tuarégskej konfederácie — nevládne prostredníctvom byrokracie, ale osobnou autoritou svojho titulu, odznakmi úradu s obradným bubnom a vernosťou urodzenej kasty #italic imashaghen#!, ktorá presadzuje jeho vôľu medzi roztrúsenými klanmi. Jeho moc je zároveň osobná aj konfederatívna: dostatočne skutočná na to, aby zmobilizoval jazdcov a kopijníkov každého člena konfederácie, a zároveň dostatočne rozptýlená na to, aby sa rozprestierala stovky míľ naprieč púšťou bez potreby držať každú oázu posádkou. Túto štruktúru najvyššej moci sme kodifikovali ako formu našej vlády, sústredili diplomatickú a vojenskú koordináciu v rukách amenokala a každodennú správu jednotlivých klanov ponechali ich vlastným zvyklostiam." # todo: NEW TRANSLATION
 amir_al_muslimin: "Amīr al-Muslimīn" # todo: NEW TRANSLATION
 amir_al_muslimin_desc: "Titul #italic Amīr al-Muslimīn#! — veliteľ moslimov — nosili almorávidski sultáni, ktorí prekročili Saharu, aby zachránili al-'Andalus pred kresťanským postupom, aj naši marinidskí predkovia, ktorí sa za tým istým cieľom znova a znova vracali cez prieliv. Dobytie prielivu od flotíl Kastílie a Aragónska nás zaradilo do tejto línie: sme ochrancami poslednej západnej hranice islamu a naše postavenie uznáva khuṭba v každej mešite od Fezu až po Guadalquivir. Tento titul spája andalúzske komunity s naším trónom, plní naše zástavy ochotnými bojovníkmi viery a nesie naše meno na každý moslimský dvor, ktorý sleduje Pyrenejský polostrov." # todo: NEW TRANSLATION
 anr_coprincipality_reform: "Štruktúra spoluvlády" # todo: NEW TRANSLATION
 anr_coprincipality_reform_desc: "Andorra sa spravuje podľa jedinečného ústavného usporiadania: spoločnej zvrchovanosti dvoch spolukniežat, biskupa z Urgellu a grófa z Foix, ktorých súperiace nároky paradoxne vytvorili stabilnú rovnováhu. Ani jeden panovník nemôže konať bez súhlasu druhého a táto vzájomná kontrola uchránila Andorru pred pohltením ktorýmkoľvek zo susedov. Túto štruktúru spolukniežatstva sme formalizovali ako ústavný základ našej krajiny a prijali obmedzenia, ktoré kladie jednostrannému konaniu, výmenou za diplomatickú ochranu, ktorú nám poskytuje." # todo: NEW TRANSLATION
 ara_diputacion_general_reform: "Diputación General de Aragón" # todo: NEW TRANSLATION
 ara_diputacion_general_reform_desc: "#italic Diputació General d'Aragó#! vznikla ako stály výbor Aragónskych kortesov poverený dohľadom nad vyberaním subvencií udelených korune a odvtedy sa stala trvalou vládnou inštitúciou. Spravujú ju volení #italic Diputados#! z troch stavov a zabezpečuje fiškálnu zodpovednosť i ochranu ústavných #italic fueros#! pred zásahmi kráľovskej moci. Diputación zasadá po celý rok a mení niekdajšie príležitostné zhromaždenie na stály orgán aragónskej samosprávy." # todo: NEW TRANSLATION
 basque_juntas_generales_reform: "Juntas Generales" # todo: NEW TRANSLATION
 basque_juntas_generales_reform_desc: "#italic Juntas Generales#! sú tradičné zastupiteľské zhromaždenia baskických provincií, ktoré sa schádzajú pod prastarým dubom v Gernike, aby rokovali o zákonoch, daniach a ochrane miestnych práv. Každá provincia má vlastné #italic fuero#!, súbor obyčajového práva, ktoré musí každý zvrchovaný vládca prisahať dodržiavať, než je uznaná jeho autorita. Juntas predstavujú formu decentralizovanej samosprávy jedinečnú v [ShowRegionName('iberia_region')], ktorú sa nepodarilo zrušiť nijakej centralizačnej korune bez toho, aby vyvolala prudký odpor." # todo: NEW TRANSLATION
 cas_santa_hermandad_reform: "Santa Hermandad" # todo: NEW TRANSLATION
 cas_santa_hermandad_reform_desc: "#italic Santa Hermandad#! je stála kráľovská žandárska jednotka poverená dohľadom nad cestami a potláčaním lúpežníctva v celej našej krajine. Založená spoločnou autoritou Fernanda a Isabely, nahrádza staré mestské bratstvá centralizovanou silou podliehajúcou korune. #italic Hermandad#! zabezpečuje bezpečné cestovanie a obchod aj na vidieku a prináša dosah kráľovskej spravodlivosti ďaleko za mestské hradby." # todo: NEW TRANSLATION
 cas_santa_hermandad_unlocks_hermandad_infantry_tt: "Umožní nám verbovať jednotku [ShowUnitDefinitionName('a_hermandad_infantry')]" # todo: NEW TRANSLATION
 cas_santa_hermandad_unlocks_summon_santa_hermandad_tt: "Odomkne [Concept('cabinet_action','akcia kabinetu')|e] [ShowCabinetActionName('summon_santa_hermandad')]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 cat_corts_catalanes_reform: "Corts Catalanes" # todo: NEW TRANSLATION
 cat_corts_catalanes_reform_desc: "#italic Corts Catalanes#! patria k najstarším zastupiteľským zhromaždeniam v Európe a sú usporiadané do troch stavov — duchovenstva, šľachty a #italic braç reial#!, ktorý zastupuje kráľovské mestá. Bez súhlasu všetkých troch stavov nemožno ukladať mimoriadne dane a koruna musí najprv prerokovať sťažnosti zhromaždenia, než jej bude udelená akákoľvek subvencia. Táto trojstavovská ústava vymedzuje katalánske politické zriadenie ako dohodu medzi vládcom a ovládanými, v ktorej zvrchovanosť spočíva nielen v panovníkovi, ale v organickom celku krajiny." # todo: NEW TRANSLATION
 cat_generalitat_reform: "Generalitat de Catalunya" # todo: NEW TRANSLATION
 cat_generalitat_reform_desc: "#italic Generalitat de Catalunya#! vznikla ako stály výbor katalánskych kortesov, poverený správou subvencií a vládnutím v čase medzi zasadnutiami celého zhromaždenia. Postupne sa stala stelesnením katalánskych ústavných slobôd — stálym orgánom volených zástupcov, ktorí dohliadajú na to, aby koruna dodržiavala svoje prísahy. Trvalá existencia Generalitat mení katalánsku parlamentnú tradíciu z príležitostného zhromaždenia na každodennú realitu vládnutia." # todo: NEW TRANSLATION
 diwan_of_the_azzaba_reform: "Dīwān al-'Azzāba" # todo: NEW TRANSLATION
 diwan_of_the_azzaba_reform_desc: "#italic Dīwān al-'Azzāba#! — rada ibádijských náboženských učencov, ktorí sú zároveň právnikmi, rozhodcami a vládcami — je jedinečnou politickou formou mzábskej pentapoly a najbližším priblížením k pôvodnému ibádijskému ideálu spoločenstva, v ktorom vládnu najvzdelanejší, nie najmocnejší. Štát a viera tu nie sú oddelené: #italic 'Azzāba#! súdia v mešite, rozhodujú obchodné spory podľa rovnakého doktrinálneho rámca ako teologické otázky a na legitímne konanie je potrebný súhlas tejto duchovenskej rady. Túto prísnosť prijímame ako ústavnú zásadu: naša krajina sa nebude spravovať ako kráľovstvá, ale ako spoločenstvo veriacich zodpovedných Bohu aj jeden druhému." # todo: NEW TRANSLATION
 glc_xunta_xeral_reform: "Xunta Xeral do Reino de Galicia" # todo: NEW TRANSLATION
 glc_xunta_xeral_reform_desc: "#italic Xunta Xeral do Reino de Galicia#! je zastupiteľské zhromaždenie nášho kráľovstva, ktoré zvoláva delegátov zo siedmich provincií Galície, aby rokovali o daniach, spravodlivosti a ochrane regionálnych práv. Ako stála inštitúcia poskytuje galícijskej šľachte, duchovenstvu a mestám formálny priestor na rokovania s korunou a ochranu osobitých zvyklostí tohto kúta [ShowRegionName('iberia_region')]. Trvalá autorita #italic Xunta#! urobila z Galície jednu z lepšie spravovaných okrajových oblastí polostrova." # todo: NEW TRANSLATION
 gra_hajib_reform: "Ḥājib ad-Dawla" # todo: NEW TRANSLATION
 gra_hajib_reform_desc: "Úrad #italic Ḥājib#! — komorníka a hlavného ministra — je osou, okolo ktorej sa otáča správa nášho emirátu. Ḥājib koordinuje kráľovský dvor, dohliada na finančnú správu #italic dīwānu#! a pôsobí ako hlavný sprostredkovateľ medzi sultánom a byrokratickým aparátom štátu. Formalizovaním a posilnením tohto úradu sústreďujeme každodennú správu krajiny do rúk jediného schopného správcu, čím sultána oslobodzujeme pre úlohy vojny a diplomacie a zároveň zabezpečujeme hladké fungovanie krajiny." # todo: NEW TRANSLATION
 jamaa_parliament: "Jamā'a" # todo: NEW TRANSLATION
 jamaa_parliament_desc: "Stály poradný orgán nášho emirátu, ktorý pod jednou strechou zhromažďuje #italic qāḍī al-jamā'a#!, #italic wazīr#!, #italic šayḵ al-ḡuzāt#! a popredné pohraničné klany, aby žiadna frakcia nehovorila hlasnejšie než všetci spoločne." # todo: NEW TRANSLATION
 lon_cortes_de_leon_reform: "Cortes de León" # todo: NEW TRANSLATION
 lon_cortes_de_leon_reform_desc: "#italic Cortes de León#! — prvýkrát zvolané v roku 1188 za vlády Alfonsa IX. — patria k najstarším zastupiteľským zhromaždeniam v európskych dejinách a anglický parlament predchádzajú takmer o celé storočie. Zhromažďujú duchovenstvo, šľachtu a zástupcov miest a ustanovili zásadu, podľa ktorej musí panovník pred uložením nových povinností požiadať o radu všetky stavy. Táto zakladajúca ústavná tradícia dáva nášmu vládnutiu legitimitu, ktorá nespočíva iba na dobytí, ale aj na formálnom súhlase krajiny." # todo: NEW TRANSLATION
 mll_universitat_de_mallorca_reform: "Universitat de Mallorca" # todo: NEW TRANSLATION
 mll_universitat_de_mallorca_reform_desc: "#italic Universitat de la Ciutat i Regne de Mallorca#! je vládnym orgánom nášho ostrovného kráľovstva. Spravujú ju volení #italic Jurats#!, ktorí dohliadajú na dane, verejné práce a záujmy meštianskych a obchodníckych obcí. Jej dlhá tradícia mestskej samosprávy zabezpečila, že obchodnícka vrstva sa stala dominantnou silou v mallorských záležitostiach a obchodná politika i správa prístavov tak odrážajú potreby tých, ktorí zarábajú na mori. Schopná občianska správa Universitat je základom mallorskej prosperity." # todo: NEW TRANSLATION
 mor_marinid_zenata_confederation_reform: "Marinidská zenatská konfederácia" # todo: NEW TRANSLATION
 mor_marinid_zenata_confederation_reform_desc: "#italic Banū Marīn#! vyrazili z [ShowLocationName('figuig')] ako [ShowCultureName('zenati')] jazdní páni a vďaka kmeňovej súdržnosti a zástave [ShowReligiousSchoolName('maliki_school')] ortodoxie získali [ShowLocationName('fez')] od upadajúcej dynastie [ShowDynastyName('almohad_dynasty')]. Naša dynastia [ShowDynastyName('marinid_dynasty')] stále stojí na oboch pilieroch: klany [ShowCultureNameWithNoTooltip('zenati')] vyrážajú do boja, keď ich zvolá náš [GetCountry('MOR').GetGovernment.GetRulerTitle|l], #italic fuqahā'#! žehnajú [GetCountry('MOR').GetGovernment.GetRuler.GetHerHis] vláde a #italic jihād#! v al-'Andalus je odpoveďou na každú výzvu. [ShowDynastyNameWithNoTooltip('marinid_dynasty')] [GetCountry('MOR').GetGovernment.GetRulerTitle|l] rozkazuje, pretože [GetCountry('MOR').GetGovernment.GetRuler.GetHerHis] kmeňoví druhovia ho nasledujú a [GetCountry('MOR').GetGovernment.GetRuler.GetHerHis] učenci mu dávajú požehnanie — a oboje musí neustále dokazovať mečom." # todo: NEW TRANSLATION
 mor_sharifian_sultanate_reform: "Šarífsky sultanát" # todo: NEW TRANSLATION
 mor_sharifian_sultanate_reform_desc: "Šarífski sultáni premenili Maroko z konfederácie závislej od kmeňových odvodov na centralizovanú monarchiu, ktorej autorita vychádza zo svätosti pôvodu aj z vojenskej disciplíny. Kmeňové oddiely #italic jīš#! sa usádzajú na korunných pozemkoch, andalúzski delostrelci cvičia na fezenskej strelnici a rozsiahly aparát #italic maḵzan#! pravidelne rozosiela po celej krajine daňové výmery a súdne nariadenia, čo sa Marinidom nikdy nepodarilo. Takáto štátna forma premieňa naše #italic baraka#! — posvätnú charizmu pochádzajúcu z pôvodu od Proroka — z nároku na legitimitu na systém vládnutia: sultanát, ktorý je zároveň dynastiou, byrokraciou aj náboženským súdom." # todo: NEW TRANSLATION
 nav_cortes_navarra_reform: "Cortes de Navarra" # todo: NEW TRANSLATION
 nav_cortes_navarra_reform_desc: "Navarrské kortesy združujú tri stavy kráľovstva — duchovenstvo, šľachtu a mestá — do zhromaždenia, ktorého súhlas je potrebný pri každom mimoriadnom zdanení alebo významnom zákone. Navarrské kortesy, staršie než väčšina parlamentov na Pyrenejskom polostrove, žiarlivo strážili tradičné slobody krajiny a zachovávali osobitné právne kódexy, ktoré odlišujú Navarru od jej väčších susedov. Inštitucionalizovaním tohto zhromaždenia formálne uznávame, že autorita koruny vychádza zo stavov a vyžaduje si ich súhlas." # todo: NEW TRANSLATION
 por_estado_da_india_reform: "Estado da Índia" # todo: NEW TRANSLATION
 por_estado_da_india_reform_desc: "#italic Estado da Índia#! je formálny správny rámec, prostredníctvom ktorého [GetCountry('POR').GetName] spravuje svoju rozľahlú sieť obchodných staníc, pevností a kolónií v Ázii. Riadi sa zo sídla miestokráľa v Goe a koordinuje flotily, posádky a príjmy námornej ríše, ktorá sa rozprestiera od Perzského zálivu až po Juhočínske more. #italic Centralizácia koloniálnej správy#! pod jedinou miestokráľovskou autoritou umožňuje korune získavať príjmy a presadzovať moc oveľa ďalej, než by dokázal udržať akýkoľvek súkromný obchodný podnik." # todo: NEW TRANSLATION
 ribat_state_tradition_reform: "Tradícia štátu-ribátu" # todo: NEW TRANSLATION
 ribat_state_tradition_reform_desc: "#italic ribaṭ#! — opevnený kláštor, z ktorého almorávidske hnutie zorganizovalo svoj postup naprieč Saharou a ďalej cez Maghreb — je viac než budova: je to model vládnutia, v ktorom nábožensko-vojenské bratstvo obsadzuje sieť pevností a mešít a spravuje z nich okolité územie zbožnosťou svojej posádky, nie výplatnou listinou civilnej byrokracie. Túto tradíciu sme zdedili: naša krajina sa spravuje z pevnostných oporných bodov, nie z jediného paláca; naši správcovia sú zároveň bojovníkmi aj mužmi viery a naša legitimita spočíva v neochvejnej disciplíne pohraničia, nie v rodokmeni dynastie. Táto strohá forma vládnutia nám dáva dobre bránené pozície, duchovenstvo schopné bojovať a bojovníkov, ktorí sa modlia." # todo: NEW TRANSLATION
 tun_husaynid_beylik_reform: "Husajnidský bejlik" # todo: NEW TRANSLATION
 tun_husaynid_beylik_reform_desc: "Kým osmanské usporiadanie dosadzovalo striedajúcich sa miestodržiteľov zodpovedných Vysokej Porte, husajnídsky #italic bey#! premenil tuniský #italic beylik#! na dedičnú dynastiu takmer vo všetkom okrem mena. Vyjednal ústavnú fikciu — menovitú osmanskú zvrchovanosť a skutočnú dynastickú vládu — ktorá pretrvala až do modernej éry. Husajnídovci vybudovali schopnú správu založenú na kabinete, zachovali kultúrnu kontinuitu Ifríkije a s väčším dôvtipom než väčšina porovnateľných štátov zvládali rovnováhu medzi čoraz formálnejším osmanským spojením a praktickými požiadavkami európskej diplomacie. Toto hybridné usporiadanie sme inštitucionalizovali: štát spravovaný dynastiou, administratívne moderný vďaka svojmu kabinetu a dostatočne prestížny na to, aby vystupoval ako uznaný zvrchovaný štát, pričom si zachováva teologické krytie islamskej zvrchovanosti." # todo: NEW TRANSLATION

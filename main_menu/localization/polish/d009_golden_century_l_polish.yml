 adu_proclaim_a_fatwa: "Vyhlásiť fatwu" # todo: NEW TRANSLATION
 golden_century_events.4.title: "Jedna viera a kultúra" # todo: NEW TRANSLATION
 golden_century_events.4.desc: "Nadišiel čas, aby naši správcovia v oblasti [target.GetName] prevzali opraty a presadili nariadenie o konformite. Naši radcovia tvrdia, že snaha o jednotnosť je nevyhnutná, ak sa chceme stať krajinou jednej viery a jednej kultúry. Modlitebne tých, ktorí nezdieľajú vieru nášho [ROOT.GetCountry.GetFlavorRank], budú zatvorené a v nasledujúcich rokoch budú ich deti vychovávané ako naše vlastné.\n\nJe to krutá úloha a jej bolesť pretrvá, no ľud jedného vierovyznania a jednej tradície sa vládne ľahšie." # todo: NEW TRANSLATION
 golden_century_events.4.a: "Je to v záujme viery." # todo: NEW TRANSLATION
 enforce_conformity_result_tt: "Každá [Concept('location','lokalita')|e] v oblasti [target.GetName] získa modifikátor [ShowModifier('enforce_conformity_modifier')] na #Y 10#! rokov" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 explain_enforce_conformity_tt: "[Concept('locations','Lokality')|e] vo vybranej [Concept('area','oblasti')|e] získajú [Concept('modifier','modifikátor')|e] [ShowModifier('enforce_conformity_modifier')] na #Y 10#! rokov" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 golden_century_events.5.title: "Vyhlásenie fatwy" # todo: NEW TRANSLATION
 golden_century_events.5.desc: "[ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] sa zhromaždí na výzvu [target_ruler.GetName], pripravené požičať práci našej vlády autoritu viery. O čom majú vyniesť rozhodnutie?\n\nNech vyhlásia čokoľvek, veriaci ich poslúchnu, pretože rozhodnutie v mene viery má väčšiu váhu než akýkoľvek obyčajný výnos." # todo: NEW TRANSLATION
 golden_century_events.5.desc.historical_info: "#italic Fatwa#! je formálne právne stanovisko, ktoré vydáva kvalifikovaný moslimský právnik, #italic muftí#!, ako odpoveď na otázku náboženského práva. Nie je záväzná ako súdny rozsudok, no rozhodnutie uznávaného učenca malo veľkú morálnu váhu a vládcovia oň často žiadali, aby legitimizovali svoje rozhodnutia. V pätnástom storočí povýšili osmanskí sultáni úrad #italic şeyhülislam#!, najvyššieho právnika ríše, na trvalý význam a učenci ako Molla Hüsrev a Molla Gürani poskytli náboženskú podporu výbojom Mehmeda II. Na moslimskom západe vydal maghrebský právnik Ahmad al-Wansharīsī známe rozhodnutie, podľa ktorého boli moslimovia padlého al-'Andalusu povinní odísť do emigrácie, a nie žiť pod kresťanskou vládou." # todo: NEW TRANSLATION
 golden_century_events.5.a: "Nech posvätia prácu našej správy." # todo: NEW TRANSLATION
 golden_century_events.5.b: "Nech požehnajú naše vzťahy s ostatnými mocnosťami." # todo: NEW TRANSLATION
 golden_century_events.5.c: "Nech vyhlásia boj proti neveriacim." # todo: NEW TRANSLATION
 golden_century_events.6.title: "Vplyv v [ShowContinentNameWithNoTooltip('europe')]" # todo: NEW TRANSLATION
 golden_century_events.6.desc.desc_spa: "Náš [ROOT.GetCountry.GetFlavorRank] už nie je odsunutý na okraj a teraz patrí medzi mocnosti, ktorých slovo formuje [ShowContinentName('europe')]. Naše oddiely pochodujú do [ShowRegionName('italy_region')] ako rovný s rovným s jeho najpyšnejšími rodmi a pod vedením [target_ruler.GetName] sa naše odvody zhromažďujú rýchlejšie, než naši súperi stihnú postaviť vlastné vojsko.\n\nStále môžeme vystúpiť vyššie, no časy, keď nás susedia mohli prehliadať, sa skončili. Nech sa presvedčia, čo znamená zrátať si sily s nami." # todo: NEW TRANSLATION
 golden_century_events.6.desc.desc_adu: "Zástavy veriacich sa zhromažďujú ako nikdy za celé generácie. Naprieč [ShowContinentName('europe')] vyslovujú naše meno s obozretnou úctou a z každej hranice prichádzajú dobrovoľníci viery, aby odpovedali na výzvu [target_ruler.GetName].\n\nVrchol je ešte ďaleko, no [ShowReligionGroupAdjective('christian')] kniežatá už o nás nehovoria ako o prežitku, ktorý treba odložiť bokom. Svätý boj opäť naberá na sile." # todo: NEW TRANSLATION
 golden_century_events.6.desc.historical_info_spa: "Dlhá vojna o Granadu, zavŕšená v roku 1492, spojila Kastíliu a Aragónsko do jednej vojenskej mocnosti. Katolícke Veličenstvá vytvorili stále roty a korunou financovanú milíciu #italic Santa Hermandad#!, čím nahradili nespoľahlivé feudálne odvody vojskami, ktoré mohla koruna kedykoľvek vyslať na pochod.\n\nTáto zocelená armáda, ktorá po páde Granady nemala čo robiť, bola čoskoro nasadená za hranicami, v Stredozemí. Španielska pechota do desaťročia prekročila hranice Talianska a položila základy formácií, ktoré na celé storočie ovládli európske bojiská." # todo: NEW TRANSLATION
 golden_century_events.6.desc.historical_info_adu: "#italic Ḡuzāt#! boli dobrovoľníci, ktorí prekračovali hranice zo severnej Afriky, aby viedli svätú vojnu na kresťanskej hranici al-'Andalusu. Tieto vojenské družiny veriacich, organizované pod vedením #italic shaykh al-ḡuzāt#!, boli oporou obrany nasridskej Granady. Prichádzali do nich bojovníci z celého Maghrebu, ktorí hľadali zásluhy v boji.\n\nHoci boli nepoddajní a ťažko ovládateľní, ḡuzāt stelesňovali ideál #italic džihádu#! na iberskej hranici. Sultán, ktorý ich dokázal zvolať, velil horlivosti, akej sa nijaký žoldnier nevyrovnal." # todo: NEW TRANSLATION
 golden_century_events.6.a: "Náš vzostup sa ešte len začína." # todo: NEW TRANSLATION
 as_long_as_we_remain_at_50_european_dominance_european_aspirations_modifier_tt: "Pokiaľ si počas zvyšku [GetSituationByKey('golden_century').GetName] udržíme [Concept('gc_european_dominance','európska dominancia')|e] na hodnote #Y 50#!, budeme využívať výhody modifikátora [ShowModifier('european_aspirations_modifier')]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 enables_emergency_conscription_tt: "Odomkne [Concept('parliament','parlament')|e] akciu #Y Núdzový odvod#!, ktorá počas vojny rýchlo doplní [Concept('manpower','živá sila')|e]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 as_long_as_we_remain_at_50_european_dominance_holy_struggle_modifier_tt: "Pokiaľ si počas zvyšku [GetSituationByKey('golden_century').GetName] udržíme [Concept('gc_european_dominance','európska dominancia')|e] na hodnote #Y 50#!, budeme využívať výhody modifikátora [ShowModifier('holy_struggle_modifier')]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 enables_muster_the_ghuzat_tt: "Odomkne [Concept('action','akcia')|e] [ShowGenericActionName('adu_muster_the_ghuzat')], ktorým povoláme dobrovoľníkov viery z celého [ShowReligionGroupAdjective('muslim')] sveta, aby posilnili naše vojská" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 adu_muster_the_ghuzat: "Zvolať Ḡuzāt" # todo: NEW TRANSLATION
 adu_proclaim_a_fatwa_desc: "Zvolajte našich náboženských učencov, aby vydali fatwu a požičali autoritu viery jednému aspektu nášho vládnutia: správe krajiny, diplomacii alebo vojnám." # todo: NEW TRANSLATION
 adu_muster_the_ghuzat_desc: "Vydajte výzvu ḡuzāt a dobrovoľníci viery prídu z najbližších [ShowReligionGroupAdjective('muslim')] krajín, aby sa chopili zbraní v našich službách." # todo: NEW TRANSLATION
 spa_enforce_conformity_desc: "Vyberte oblasť, ktorú ovládame na kontinente [ShowContinentName('europe')], a priveďte jej obyvateľstvo k jednej viere a jednej kultúre. Obráťte na našu vieru a asimilujte tých, ktorí ju zatiaľ nezdieľajú." # todo: NEW TRANSLATION
 golden_century_events.7.title: "Ḡuzāt odpovedajú na výzvu" # todo: NEW TRANSLATION
 golden_century_events.7.desc: "Správa o našom svätom boji sa šíri krajinami veriacich a #italic ḡuzāt#! odpovedajú na výzvu. Z najbližších [ShowReligionGroupAdjective('muslim')] krajín v našom dosahu prekračujú hranice horliví dobrovoľníci, aby sa pod vedením [target_ruler.GetName] chopili zbraní. Naše vojsko tak posilňujú muži, ktorí nebojujú za žold, ale za raj.\n\nNech sa neveriaci trasú. Hranica opäť našla svojich bojovníkov." # todo: NEW TRANSLATION
 golden_century_events.7.a: "Nech nájdu raj v našich službách." # todo: NEW TRANSLATION
 missed_reward_ghuzat_mujahidin_tt: "Ak by sme mali zapnutú [bureaucracy|e] [ShowBureaucracyTypeName('diwan_al_jund_bureaucracy')], do našich radov by sa pridal aj [target_ghazi_general.GetName]" # todo: NEW TRANSLATION
 plan_partition_campaign: "Naplánovať rozdelenie" # todo: NEW TRANSLATION
 plan_partition_campaign_desc: "Naši nepriatelia si upevnili svoje územia viac, než by nám vyhovovalo. Ich snahy o získanie moci nevyhnutne povedú k spoločnému postupu proti nášmu ľudu, čo predstavuje jasnú hrozbu pre našu ďalšiu prosperitu. Také očividné prejavy sily nemôžeme nechať bez odpovede!" # todo: NEW TRANSLATION
 selected_country_target_cb_tt: "Získame [Concept('casus_belli','casus Belli')|e] [ShowCasusBelliName('cb_partition')] proti cieľovej [Concept('country','krajine')|e]. Tento [Concept('casus_belli','casus Belli')|e] umožňuje použiť [Concept('peace_treaty','mierová dohoda')|e] [ShowPeaceTreatyTypeName('peace_partition')]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 plan_partition_campaign_select_rival_or_enemy: "Vyberte [Concept('rival','rival')|e] alebo [Concept('enemy','vojnový nepriateľ')|e], ktorého rozdelíme" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 no_neighbor_enemies_rivals_available: "@trigger_no!Nemáme susedného [Concept('rival','rivala')|e] ani [Concept('enemy','vojnový nepriateľ')|e], ktorého by sme mohli rozdeliť" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 invoke_ummayad_legacy: "Dovolávať sa umajjovského dedičstva" # todo: NEW TRANSLATION
 invoke_ummayad_legacy_desc: "Umajjovci, ktorí kedysi vládli z [ShowLocationName('cordoba')], nám zanechali dedičstvo, na ktoré si môžeme robiť nárok. Mali by sme sa zamerať na ktorúkoľvek krajinu na území [ShowScriptedGeographyName('umayyad_caliphate_geography')] a uplatniť si dávne právo obnoviť nad ňou svoju vládu silou meča." # todo: NEW TRANSLATION
 selected_country_ummayad_cb_tt: "Získame [Concept('casus_belli','casus Belli')|e] [ShowCasusBelliName('cb_restore_ummayad_caliphate')] proti cieľovej [Concept('country','krajine')|e]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 invoke_ummayad_legacy_select_country: "Vyberte [Concept('country','krajina')|e], ktorá ovláda umajjovské územia" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 invoke_ummayad_legacy_no_country_available: "@trigger_no!Na území [ShowScriptedGeographyName('umayyad_caliphate_geography')] nesídli nijaká [Concept('country','krajina')|e]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 spa_patronize_golden_century: "Podporovať zlatý vek" # todo: NEW TRANSLATION
 spa_patronize_golden_century_desc: "Budeme podporovať umelcov a štedro míňať na veľkoleposť, financovať maliarov, básnikov a architektov našej doby. Táto investícia rozvíja kultúru nášho ľudu a zlatým písmom zapíše naše meno do análov dejín." # todo: NEW TRANSLATION
 golden_century_events.8.title: "Patróni zlatého veku" # todo: NEW TRANSLATION
 golden_century_events.8.desc: "Bohatstvo našej doby priťahuje majstrov zo všetkých kútov [ShowContinentName('europe')]. [target_location.GetName] sa stalo kultúrnym strediskom maliarov a sochárov, architektov a básnikov, ktorí sa uchádzajú o priazeň [target_ruler.GetName] a miesto v lesku nášho storočia.\n\nStačí naše slovo a dielne sa naplnia nadšenými umelcami, pripravenými zvečniť našu veľkoleposť. To, čo sa rozhodneme podporiť dnes, pretrvá všetky zmluvy aj vojny. Keď sa na naše vojská už zabudne, práve táto hojnosť bude tým, podľa čoho si nás toto obdobie zapamätá." # todo: NEW TRANSLATION
 golden_century_events.8.a: "Nech rozkvitne umenie!" # todo: NEW TRANSLATION
 target_character_serves_in_court_tt: "[target_character.GetName] zaujme miesto na našom dvore ako majster [target_character.GetHerHis] remesla" # todo: NEW TRANSLATION
 artist_appears_in_court_tt: "Na našom dvore zaujme miesto majster [Concept('artist','umelec')|e]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 artist_expands_royal_quarters: "V kráľovskom sídle vyrastie nádherné nové krídlo a správy o jeho kráse rozšíria našu slávu po dvoroch [ShowContinentNameWithNoTooltip('europe')]" # todo: NEW TRANSLATION
 artist_drafts_traditional_art: "Naši majstri zaznamenajú motívy a formy našej tradície pre budúce generácie a obohatia dedičstvo, ktoré po sebe zanecháme" # todo: NEW TRANSLATION
 artist_furthers_our_technological_understanding_tt: "[target_character.GetShortNameWithNoTooltip] premení mecenášstvo na objavy a rozšíri vzdelanosť nášho [ROOT.GetCountry.GetFlavorRank]" # todo: NEW TRANSLATION
 golden_century_events.9.title: "Vyhnanie [ShowCultureNameWithNoTooltip('andalusi')] z [target.GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 golden_century_events.9.desc: "[ShowCultureName('andalusi')] v oblasti [target.GetName] sa od nás vždy odlišovali a hlásili sa k viere a kultúre, ktoré nie sú naše. Nech u nás žijú akokoľvek dlho, pochybujeme, že ich srdcia niekedy budú patriť nám.\n\nNaša trpezlivosť sa minula. Zhromaždíme ich z domovov, odvedieme do prístavov a nalodíme na lode smerujúce do oblasti [target_province_destination.GetName], kde ich môžu prijať tí, ktorí zdieľajú ich vieru.\n\nDomy a polia, ktoré po sebe zanechajú, dlho prázdne nezostanú. Naše obyvateľstvo osídli pôdu, ktorú kedysi obrábali ich otcovia, a ich majetok prejde do bezpečnejších rúk." # todo: NEW TRANSLATION
 golden_century_events.9.desc.historical_info: "V rokoch 1609 až 1614 nariadil španielsky kráľ Filip III. vyhnanie Moriskov, potomkov moslimov z Ibérie, ktorí boli o storočie skôr prinútení prijať kresťanstvo. Dlhodobo boli podozrievaní z tajného odpadlíctva a sprisahaní s Osmanmi a barbarskými korzármi. Zo svojich domovov vyhnali približne tristo tisíc ľudí.\n\nVäčšina odišla do Maghrebu, no mnohí sa vydali ďalej na východ, na osmanské územia, kde sa usadili v Anatólii, Levante a balkánskych mestách. Prijala ich tam sultánova vláda. Ich odchod pripravil východné Španielsko o skúsených roľníkov a remeselníkov a niekoľko jeho oblastí sa z toho nikdy úplne nespamätalo." # todo: NEW TRANSLATION
 golden_century_events.9.a: "Ich odchod je pre dobro veci." # todo: NEW TRANSLATION
 spa_edict_expulsion: "Vydať výnos o vyhnaní" # todo: NEW TRANSLATION
 spa_edict_expulsion_desc: "Vyberte provinciu, ktorú ovládame, a vyžeňte jej obyvateľstvo kultúry [ShowCultureName('andalusi')] do zámoria. Pôdu a majetky, ktoré po sebe zanechá, budú môcť osídliť naši vlastní osadníci." # todo: NEW TRANSLATION
 select_expulsion_no_province: "@trigger_no!Nie je dostupná nijaká [Concept('province','provincia')|e] s početným obyvateľstvom kultúry $andalusi$" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 select_province_removes_andalusi_tt: "Vo vybranej [Concept('province','provincii')|e] sa začne vyháňanie [Concept('pops','populácie')|e] kultúry [ShowCultureName('andalusi')] prostredníctvom [Concept('migration','migrácie')|e]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 select_province_to_evict_pops_from: "Vyberte [Concept('province','provincia')|e], z ktorej vyhostíte [Concept('pops','populácie')|e]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 spa_seize_colony: "Zmocniť sa kolónie" # todo: NEW TRANSLATION
 spa_seize_colony_desc: "Bohatstvo Nového sveta nemusíme získavať iba rýľom. Vyberieme si nelojálnu kolóniu konkurenčnej mocnosti v našom dosahu a zlákame ju, aby opustila svojich vzdialených pánov a pridala sa k našej korune. Tak získame bohaté domínium jediným úderom — a vyslúžime si trvalé nepriateľstvo vládcu, ktorého oň pripravíme." # todo: NEW TRANSLATION
 select_colonial_subject_to_seize: "Vyberte nelojálnu [Concept('colony','koloniu')|e], ktorej sa zmocníme" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 no_available_colonial_subjects_to_seize: "@trigger_no!V našom dosahu sa nenachádza nijaký nelojálny koloniálny [Concept('subject','vazal')|e] konkurenčnej mocnosti" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 selected_subject_receives_offer_to_defect_tt: "Vybraná [ShowSubjectTypeName('colonial_nation')] dostane ponuku stať sa naším [Concept('subject','vazalom')|e]. Ak ju prijme, naše vzťahy s jej súčasným [overlord|e] sa výrazne zhoršia a tento [overlord] získa [Concept('casus_belli','casus Belli')|e], aby si ju mohol vziať späť" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 golden_century_events.10.title: "Ponuka vernosti" # todo: NEW TRANSLATION
 golden_century_events.10.desc: "Vyslanci krajiny [seizing_country.GetName] sa vkradli do našich prístavov s návrhom, ktorý zašepkali, namiesto toho, aby ho vyhlásili. Naši vzdialení páni v krajine [target_overlord.GetName] zanedbávajú naše potreby a nepočúvajú naše sťažnosti, zatiaľ čo [seizing_country.GetNameWithNoTooltip] by nás s radosťou prijala medzi svojich a odmenila našu vernosť.\n\nRozhodnutie, ktorému [target_ruler.GetName] čelí, nie je jednoduché. Prijať ponuku znamená vymeniť jedného vládcu za druhého a privolať na seba hnev krajiny [target_overlord.GetNameWithNoTooltip]; odmietnuť ju znamená dokázať svoju oddanosť a ešte väčšmi sa pripútať ku korune, ktorej už slúžime." # todo: NEW TRANSLATION
 golden_century_events.10.a: "Spojme svoj osud s krajinou [seizing_country.GetNameWithNoTooltip]." # todo: NEW TRANSLATION
 golden_century_events.10.a.alt: "Spojme svoj osud s nimi." # todo: NEW TRANSLATION
 golden_century_events.10.b: "Naša vernosť nie je na predaj." # todo: NEW TRANSLATION
 adu_integrate_natives: "Začleniť koloniálnu oblasť" # todo: NEW TRANSLATION
 adu_integrate_natives_desc: "Namiesto toho, aby sme domorodcov pobili mečom, budeme s nimi rokovať, s ich pomocou spoznáme ich krajinu a začleníme ich do štruktúry našej zámorskej domínií." # todo: NEW TRANSLATION
 adu_integrate_natives_tt: "Vo vybranej [Concept('province','provincii')|e] založíme [Concept('colonial_charter','koloniálna listina')|e] a osídime jej neobsadené [Concept('locations','lokality')|e]. Potom si vyberieme, ako naložíme s domorodcami, ktorí tam žijú" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 golden_century_events.11.title: "Obzor za hranicami [target.GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 golden_century_events.11.desc: "Podarilo sa nám uzavrieť mier s domorodcami v oblasti [target.GetName]. Vďaka ich pomoci sme zmapovali celú provinciu a založili v nej mnoho kolónií. Naši radcovia sa teraz nevedia zhodnúť, čo by malo nasledovať.\n\nNiektorí podporujú rozširovanie kolónií a príchod nových osadníkov z domoviny. Iní vidia zisk iba v domorodcoch samotných a chceli by ich spútať a poslať pracovať na naše trhy doma. Pár opatrnejších hlasov by miestnych nechalo na pokoji a dovolilo našej novej výprave rozvíjať sa vlastným tempom." # todo: NEW TRANSLATION
 golden_century_events.11.a: "Nariaďte nové migračné vlny." # todo: NEW TRANSLATION
 golden_century_events.11.b: "Presídliť ich späť domov ako robotníkov." # todo: NEW TRANSLATION
 golden_century_events.11.c: "Nechať provinciu prirodzene sa rozvíjať." # todo: NEW TRANSLATION
 all_those_slaves_go_back_home: "[ShowPopTypeName('slaves')] vytvorení touto [Concept('action','akciou')|e] budú presídlení do okolia nášho [Concept('capital','hlavného mesta')|e] v [ROOT.GetCountry.GetCapital.GetProvince.GetName]" # todo: NEW TRANSLATION # todo: COUNTRY CASE # todo: CONCEPT CASE
 spa_demand_tribute_fleets: "Požadovať tributárne flotily" # todo: NEW TRANSLATION
 spa_demand_tribute_fleets_desc: "Vyberte jednu z našich lojálnych zámorských kolónií a povolajte jej bohatstvo domov. Tributárna flotila naložená striebrom a bohatstvom jej baní a polí vypláva do našich prístavov a po zakotvení naplní našu pokladnicu." # todo: NEW TRANSLATION
 select_colonial_subject: "Vybrať lojálnu [Concept('colony','koloniu')|e]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 no_loyal_colonial_subject: "@trigger_no!Nemáme lojálneho koloniálneho [Concept('subject','vazala')|e]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 spa_demand_tribute_fleets_tt: "Vybraná lojálna [ShowSubjectTypeName('colonial_nation')] bude požiadaná, aby do našich prístavov poslala tributárnu flotilu naloženú buď [Concept('gold','dukáty')|e], drahými kovmi, alebo [Concept('pops','populácie')|e]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 adu_build_qadi_office: "Postaviť úrad kádího" # todo: NEW TRANSLATION
 adu_build_qadi_office_desc: "Pre naše podriadené krajiny je najvyššou poctou stať sa sídlom budovy [ShowBuildingTypeName('qadi_office')]. Jej sudca bude v našom mene vykonávať sväté právo, urovnávať spory ľudu a pevnejšie pripútavať jeho vládcu k našim záležitostiam." # todo: NEW TRANSLATION
 no_available_colonial_subject: "@trigger_no!Nemáme [Concept('subject','vazal')|e], ktorého hlavné mesto NEMÁ budovu [ShowBuildingTypeNameWithNoTooltip('qadi_office')]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 adu_build_qadi_office_tt: "V [Concept('capital','hlavnom meste')|e] vybraného [Concept('subject','vazalovi')|e] postavíme budovu [ShowBuildingTypeName('qadi_office')], poveríme jej sudcu vykonávaním svätého práva a pevnejšie pripútame krajinu k našej vláde" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 if_we_had_qadi_al_jamaa_bureaucracy_tt: "Keby sme mali [Concept('bureaucracy','bureaukracia')|e] [ShowBureaucracyTypeName('qadi_al_jamaa_bureaucracy')], získali by sme aj [Concept('modifier','modifikátor')|e] [ShowModifier('empowered_qadi_al_jamaa_modifier')]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 adu_dispatch_gold_caravan: "Vyslať zlatú karavánu" # todo: NEW TRANSLATION
 adu_dispatch_gold_caravan_desc: "Vyberte jedného z našich ľudí, ktorý povedie karavánu na juh cez Saharu. Naložená [ShowGoodsName('salt')] a [ShowGoodsName('cloth')] bude obchodovať za [ShowGoodsName('goods_gold')] z oblasti [ShowRegionName('sahel_region')] a privezie toto bohatstvo domov, aby obohatila naše trhy." # todo: NEW TRANSLATION
 adu_dispatch_gold_caravan_select_leader: "Vybrať vodcu karavány" # todo: NEW TRANSLATION
 adu_dispatch_gold_caravan_no_leader: "@trigger_no!Nemáme [Concept('character','postava')|e] spôsobilú viesť [Concept('expedition','výprava')|e]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 adu_dispatch_gold_caravan_tt: "Vybraná [Concept('character','postava')|e] povedie [Concept('expedition','výprava')|e] na juh cez Saharu, kde bude obchodovať za [ShowGoodsName('goods_gold')] z oblasti [ShowRegionName('sahel_region')] a privezie toto bohatstvo domov na naše trhy" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 nick_the_golden: "Zlatý" # todo: NEW TRANSLATION
 golden_century_events.12.title: "Tribút od [target_country.GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 golden_century_events.12.desc: "Naša lojálna kolónia [target_country.GetName] pod našou ochranou prosperovala a nastal čas, aby nám odovzdala, čo nám patrí. V jej prístavoch čaká pripravená tributárna flotila a [target_ruler.GetName] čaká na pokyny, čo má priviezť domov. Môžeme požadovať pravidelný prísun mincí, ktorý naplní našu pokladnicu, alebo striebro a zlato z jej baní, ktoré obohatí naše trhy. Alebo môžeme odvrátiť zrak od jej bohatstva a zamerať sa na jej ľudí: poslať osadníkov cez oceán, aby rozšírili provincie nášho vlastného kráľovstva." # todo: NEW TRANSLATION
 golden_century_events.12.a: "Požadovať každoročný tribút v zlate." # todo: NEW TRANSLATION
 golden_century_events.12.b: "Privlastniť si striebro a zlato z ich baní." # todo: NEW TRANSLATION
 golden_century_events.12.c: "Poslať ich ľudí osídliť naše územia." # todo: NEW TRANSLATION
 spa_issue_royal_decree: "Vydať Cédula de Población" # todo: NEW TRANSLATION
 spa_issue_royal_decree_desc: "Vyberte oblasť v našom zámorskom panstve a otvorte jej prístavy osadníkom. Na základe kráľovského dekrétu prekročia oceán rodiny z krajín, ktoré zdieľajú našu vieru, aby si na našej hranici vybudovali nový život, a prázdne končiny sa zaplnia ochotnými rukami." # todo: NEW TRANSLATION
 select_colonial_area_to_direct_migrants: "Vybrať [Concept('area','oblasť')|e], kam prilákame našich osadníkov" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 no_available_colonial_area: "@trigger_no!Nemáme [Concept('area','oblasť')|e] vhodnú na prijatie nových osadníkov" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 spa_issue_royal_decree_tt: "Otvoríme vybranú [Concept('area','oblasť')|e] migrácii, prilákame do jej [Concept('locations','lokalít')|e] osadníkov z krajín, ktoré zdieľajú našu vieru, a poskytneme im trvalý bonus" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 golden_century_events.13.title: "[target_area.GetNameWithNoTooltip] víta vlny prisťahovalcov" # todo: NEW TRANSLATION
 golden_century_events.13.desc: "Naše úsilie o rozšírenie koloniálnej hranice prinieslo ovocie. Dekrét, ktorým sme otvorili [target_area.GetName] osadníkom, sa rozšíril ďaleko za hranice našich vlastných prístavov a prilákal rodiny až z [target_origin_province_1.GetName], ktoré túžia hľadať nový život pod našou zástavou.\n\nNeprichádzajú s prázdnymi rukami. Niektorí prinášajú zvyky susedov, ktorí sú oddávna zvyknutí žiť po boku cudzincov, iní nástroje a remeslá zo svojich starých dielní a ďalší zasa len svoj počet a túžbu budovať. Nech si so sebou prinášajú čokoľvek, [target_ruler.GetName] sa postará, aby sa dobre usadili, pretože osídlená hranica je hranicou, ktorú si udržíme." # todo: NEW TRANSLATION
 golden_century_events.13.a: "Vitajte!" # todo: NEW TRANSLATION
 migrants_bring_cultural_understanding_tt: "Noví osadníci prinášajú [ShowModifier('harmonious_understanding_modifier')] na #Y 5#! rokov" # todo: NEW TRANSLATION
 migrants_bring_tool_expertise_tt: "Nástrojári a skúsení remeselníci požehnajú naše kolónie [ShowModifier('new_tooling_techniques_modifier')] na #Y 5#! rokov" # todo: NEW TRANSLATION
 shared_prosperity_event_13_tt: "[ShowModifier('shared_prosperity_modifier')] bude v nových domovoch pôsobiť #Y 5#! rokov" # todo: NEW TRANSLATION
 golden_century_events.13.desc.historical_info: "#italic Cédula de población#! bola kráľovská listina, ktorou sa španielska koruna usilovala osídliť riedko obývané končiny svojej ríše. Kolonistom ochotným prekročiť oceán prisľúbili pôdu, úľavy od daní a ciel a postavenie lojálnych poddaných, aby sa vzdialené nároky na mape mohli premeniť na farmy, mestá a prístavy, ktoré by sa dokázali uživiť a brániť.\n\nNajslávnejšou z nich bola #italic Real Cédula de Población#!, ktorú v roku 1783 udelil Karol III. ostrovu Trinidad, na ktorý si Španielsko dlho nárokovalo, no ktorý bol len slabo obývaný. Privítala rímskokatolíckych osadníkov zo zahraničia a udeľovala pôdu úmerne veľkosti každej rodiny a počtu zotročených robotníkov, ktorých so sebou priviedla. Za jedinú generáciu sa tak z takmer prázdnej základne stala preplnená plantážnická kolónia. Dodnes je najodvážnejším prejavom bourbonskej ambície prinútiť zanedbané okraje ríše, aby konečne prinášali úžitok." # todo: NEW TRANSLATION
 golden_century_events.14.title: "Tieň [gc_hegemon.GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 golden_century_events.14.desc: "[GetSituationByKey('battle_for_the_strait').GetName] sa skončila a z nej vyšla [gc_hegemon.GetName] ako mocnosť, ktorá zatieňuje nás všetkých. Ich armády preukázali svoju silu, ich pokladnice sú plné a ich ambície sú zjavné, pretože teraz prekračujú vlastné hranice a usilujú sa ovládnuť celú túto éru. Patríme medzi tých, ktorí majú dôvod sa ich obávať.\n\nNo vzostup hegemóna vyvoláva aj vlastnú odpoveď. Na dvoroch vystrašených krajín sa začína formovať koalícia a čím ďalej [gc_hegemon.GetNameWithNoTooltip] rozširuje svoj dosah, tým urputnejšie sa ho toto spojenectvo bude snažiť zadržať. O nadchádzajúcom storočí rozhodne, či sa tento vzostup podarí zastaviť, alebo či úplne pohltí svetovú rovnováhu." # todo: NEW TRANSLATION
 golden_century_events.14.a: "Nebudeme proti nim stáť sami." # todo: NEW TRANSLATION
 golden_century_events.15.title: "Vzostup [gc_hegemon.GetNameWithNoTooltip]" # todo: NEW TRANSLATION
 golden_century_events.15.desc: "Na náš dvor dorazila správa, že [gc_hegemon.GetName] zvíťazila v [GetSituationByKey('battle_for_the_strait').GetName] a teraz stojí na čele mocností tejto éry. Viaže nás k nej prísaha alebo záväzok, a tak je jej triumf do istej miery aj náš a jej vzostup je prílivom, ktorý nás môže vyniesť nahor.\n\nZdieľané šťastie však prináša aj zdieľané riziko. Čím vyššie [gc_hegemon.GetNameWithNoTooltip] stúpa, tým viac sa proti nej budú spájať ustráchaní a závistliví. Tí, ktorých spája s hegemónom spojenectvo, môžu tiež pocítiť nepriateľstvo namierené proti svojmu patrónovi. Nadchádzajúce roky ukážu, či sa naše puto stane naším požehnaním, alebo skazou." # todo: NEW TRANSLATION
 golden_century_events.15.a: "Budeme pozorne sledovať jej vzostup." # todo: NEW TRANSLATION
 golden_century_events.16.title: "Vzostup novej mocnosti" # todo: NEW TRANSLATION
 golden_century_events.16.desc: "Za našimi hranicami sa [gc_hegemon.GetName] povzdiha nad svojich súperov a z [GetSituationByKey('battle_for_the_strait').GetName] vychádza s ambíciou dosiahnuť nadvládu, ktorá sa nezastaví na jej vlastných hraniciach. Nie sme jej zaviazaní prísahou ani proti nej nebojujeme, no mocnosť s takými ambíciami vrhá dlhý tieň na všetkých, ktorí žijú v jej susedstve.\n\nNaše rozhodnutie nepočká navždy. Ak sa začneme obávať jej dosahu, koalícia ostražitých krajín je pripravená prijať nás. Ak však situáciu vyhodnotíme inak, môžeme nájsť bezpečie v jej priazni. Či sa podvolíme, budeme vzdorovať, alebo len vyčkáme, nadchádzajúce storočie nás určite zasiahne." # todo: NEW TRANSLATION
 golden_century_events.16.a: "Svoj postup si dobre premyslíme." # todo: NEW TRANSLATION
 gc_grand_alliance_leader_tt: "Vedieme [GetInternationalOrganizationType('grand_alliance').GetName], ktorá sa postavila proti [gc_hegemon.GetName]. S každým dosiahnutým prahom ich [Concept('gc_european_dominance','európska dominancia')|e] a [Concept('gc_colonial_dominance','koloniálna dominancia')|e] sa zvyšujú bonusy k [Concept('modifier','modifikátoru')|e], ktoré táto [Concept('international_organization','medzinárodná organizácia')|e] poskytuje svojim [Concept('members','členom')|e]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 gc_grand_alliance_member_tt: "Každá krajina, ktorá sa obáva [gc_hegemon.GetName], sa môže pridať k [GetInternationalOrganizationType('grand_alliance').GetName], ktorá sa postavila proti nej. S každým dosiahnutým prahom ich [Concept('gc_european_dominance','európska dominancia')|e] a [Concept('gc_colonial_dominance','koloniálna dominancia')|e] sa zvyšujú bonusy k [Concept('modifier','modifikátoru')|e], ktoré táto [Concept('international_organization','medzinárodná organizácia')|e] poskytuje svojim [Concept('members','členom')|e]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 gc_grand_alliance_prospect_tt: "Ak sa začneme obávať [gc_hegemon.GetName], môžeme sa proti nej pridať k [GetInternationalOrganizationType('grand_alliance').GetName]. Čím vyššie vystúpia jej [Concept('gc_european_dominance','europskej dominancie')|e] a [Concept('gc_colonial_dominance','koloniálna dominancia')|e], tým silnejšie budú bonusy k [Concept('modifier','modifikátoru')|e], ktoré táto [Concept('international_organization','medzinárodná organizácia')|e] poskytuje svojim [Concept('members','členom')|e]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 gc_curb_dominance_peace_tt: "Ak porazíme [gc_hegemon.GetName] vo vojne, môžeme jej vnútiť [Concept('peace_treaty','mierová dohoda')|e], ktorý zníži jej [Concept('gc_european_dominance','europskej dominancie')|e] alebo [Concept('gc_colonial_dominance','koloniálna dominancia')|e] o #Y 25#!" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 gc_dominance_growth_observer_tt: "[gc_hegemon.GetName] zvyšuje svoju [Concept('gc_european_dominance','europskú dominanciu')|e] a [Concept('gc_colonial_dominance','koloniálna dominancia')|e] míľovými krokmi prostredníctvom dobývania, kolonizácie a štátnictva. Každý dosiahnutý prah upevňuje jej zovretie nad touto érou" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 gc_flashpoints_observer_tt: "Počas tejto [Concept('situation','situácie')|e] sa môžu krajine [gc_hegemon.GetName] prihodiť [Concept('events','udalosti')|e] súvisiace s [Concept('flashpoint','zlomovým bodom')|E]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 gc_hegemon_backer_tt: "Spája nás puto s [gc_hegemon.GetName]. Jej triumfy nám môžu pomôcť, no proti nej sa zhromažďuje [GetInternationalOrganizationType('grand_alliance').GetName] a jej vojny sa môžu stať aj našimi" # todo: NEW TRANSLATION

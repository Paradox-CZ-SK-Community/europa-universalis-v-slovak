 gc_flashpoint_meter_desc: "Tlak, ktorý sa hromadí pod povrchom nášho zlatého storočia. Živí ho sila autority a naše postavenie v zahraničí, ale aj bremeno dlhov a znehodnocovanie našej meny. Keď tieto faktory dosiahnu vrchol, nastane [Concept('flashpoint','zlomový bod')|e] — rozhodujúci okamih, ktorý môže našu ríšu buď povzniesť, alebo ňou otriasť." # todo: NEW TRANSLATION # todo: CONCEPT CASE

 as_long_as_we_remain_at_75_european_dominance_sword_of_the_west_modifier_tt: "Pokiaľ si počas zvyšku [GetSituationByKey('golden_century').GetName] udržíme [Concept('gc_european_dominance','európska dominancia')|e] na hodnote #Y 75#!, budeme využívať výhody modifikátora [ShowModifier('sword_of_the_west_modifier')]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 enables_proclaim_fatwa_action_tt: "Odomkne [Concept('action','akcia')|e] [ShowGenericActionName('adu_proclaim_a_fatwa')], ktorým naša [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] dodá autoritu viery zvolenému aspektu našej vlády" # todo: NEW TRANSLATION # todo: CONCEPT CASE

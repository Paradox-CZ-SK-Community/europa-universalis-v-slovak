 ga_threshold_bonus_title: "#T $grand_alliance$ získava:#!" # todo: NEW TRANSLATION
 golden_century: "Zlaté storočie" # todo: NEW TRANSLATION
 golden_century_info: "Víťaz [GetSituationByKey('battle_for_the_strait').GetName] povstal a zatienil celú túto éru. Sto rokov presadzuje svoju nadvládu nad [ShowContinentName('europe')] a Novým svetom, zatiaľ čo ríše, ktoré zatieňuje, hľadajú spôsob, ako ho opäť zraziť na kolená." # todo: NEW TRANSLATION
 golden_century_desc: "[GetSituationByKey('battle_for_the_strait').GetName] sa skončila a z nej povstal jediný Kolos, mocnejší než ktorýkoľvek súper, čo ešte stojí. Storočie, ktoré sa teraz začína, bude určovať dosah tejto moci, na dvoroch i bojiskách [ShowContinentName('europe')] a v obchode a kolóniách celého širého sveta.\n\nTakáto nadvláda sa nikdy netoleruje ľahko. Čím vyššie Kolos vyrastá, tým väčší strach vzbudzuje, až sa vystrašení a ctižiadostiví spoja v rámci Veľkej aliancie, ktorá prisahá, že ho udrží na uzde. O tom, či sa toto zlaté storočie skončí univerzálnou monarchiou alebo pádom Kolosa, rozhodne, ako ďaleko možno túto nadvládu presadiť, kým sa rovnováha tejto éry nenaruší." # todo: NEW TRANSLATION
 golden_century_colossus_endures: "Kolos pretrváva" # todo: NEW TRANSLATION
 golden_century_colossus_endures_desc: "Kolos si udrží svoje storočie. Získa [ShowModifier('gc_european_triumph_modifier')] a [ShowModifier('gc_colonial_triumph_modifier')], pričom každý z nich bude zodpovedať skutočnému dosahu jeho moci. Tam, kde jeho dosah nečelil nijakému odporu, bude korunovaný za [ShowModifier('hegemon_of_europe_modifier')] alebo [ShowModifier('hegemon_of_new_world_modifier')]." # todo: NEW TRANSLATION
 golden_century_colossus_destroyed: "Kolos padá" # todo: NEW TRANSLATION
 golden_century_colossus_destroyed_desc: "Keďže samotný Kolos zanikol, nikto nezíska triumf ani postih: táto éra jednoducho stráca mocnosť, ktorá ju definovala." # todo: NEW TRANSLATION
 golden_century_colossus_diminished: "Kolos oslabený" # todo: NEW TRANSLATION
 golden_century_colossus_diminished_desc: "Kolos prežije, ale za to, že bol zrazený na kolená, utrpí vážny úder do svojej [Concept('stability','stability')|e]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 golden_century_lost_quarter_starting_locations_tt: "Hlavná [Concept('country','krajina')|e] tejto [Concept('situation','situácii')|e] stratila štvrtinu svojich počiatočných [Concept('locations','lokality')|e]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 as_long_as_the_golden_century_is_active_desc: "kým bude [Concept('situation','situácia')|e] $golden_century$ aktívna" # todo: NEW TRANSLATION # todo: CONCEPT CASE

 golden_century_events.1.title: "Zlatý vek krajiny [ROOT.GetCountry.GetAltAdjectiveWithNoTooltip('G')]" # todo: NEW TRANSLATION # todo: COUNTRY CASE
 golden_century_events.1.desc.desc_spa: "Dlhý [GetSituationByKey('battle_for_the_strait').GetName] sa skončil v náš prospech a náš [ROOT.GetCountry.GetFlavorRank] z neho vychádza ako najmocnejší štát [ShowRegionName('iberia_region')]. Starí súperi sú pokorení, južná hranica je konečne pokojná a náš [ROOT.GetCountry.GetFlavorRank] sa pod vládou [target_ruler.GetName] obracia od svätej vojny k náročnejšej úlohe zjednotiť mnohé územia.\n\nPred nami sa otvárajú dva nové obzory. V celej [ShowContinentName('europe')] teraz naše slovo preniká do rád a na bojiská, kde ho predtým nikto nepočúval, a za oceánom čakajú krajiny a duše, ktoré si ešte nepodmanila nijaká mocnosť [ShowReligionGroupAdjective('christian')]. To, koľko si z oboch prisvojíme, určí, ako sa bude hodnotiť storočie pred nami." # todo: NEW TRANSLATION
 golden_century_events.1.desc.desc_adu: "[ShowLocationName('strait_of_gibraltar')] je v našich rukách, súper je zahnaný a prvýkrát po stáročiach sa nad [ShowRegionName('iberia_region')], zjednoteným pod jednou zástavou, ozýva volanie k modlitbe. Vek drobných kráľov sa skončil a [target_ruler.GetName] znovu spojil to, čo sa rozpadlo po páde [ShowLocationName('cordoba')].\n\nKráľovstvá [ShowReligionGroupAdjective('christian')] za horami, ktoré nás dlho považovali za porazenú a upadajúcu mocnosť, sa teraz musia vyrovnať s naším návratom. Na juhu sľubujú karavánové cesty a otvorené more zlato, vzdelanosť aj panstvo, zatiaľ čo v celej [ShowContinentName('europe')] má naše meno váhu, akú nemalo celé veky. Nech nasledujúce roky ukážu, kam až dosiahne svetlo [ROOT.GetCountry.GetAltAdjective('A')]." # todo: NEW TRANSLATION # todo: COUNTRY CASE
 golden_century_events.1.desc.historical_info_spa: "Španielsky zlatý vek, #italic Siglo de Oro#!, bol dlhým obdobím imperiálneho a kultúrneho rozmachu, ktorý nasledoval po spojení Kastílie a Aragónska pod vládou Izabely a Ferdinanda v roku 1469. Katolícki panovníci dobyli v roku 1492 Granadu, čím ukončili takmer osem storočí reconquisty, a v tom istom roku vyslali Kolumba cez Atlantik.\n\nStriebro z Indie, prevaha #italic tercios#! na európskych bojiskách a dedičstvo habsburských korún urobili zo Španielska prvé skutočne globálne impérium, o ktorom sa vravelo, že nad ním slnko nikdy nezapadá. Toto bohatstvo podporilo rozkvet umenia a literatúry — od Cervantesa a Lopeho de Vegu po Velázqueza a El Greca — ktorý dal tomuto obdobiu jeho meno." # todo: NEW TRANSLATION
 golden_century_events.1.desc.historical_info_adu: "Al-'Andalus bolo kedysi pulzujúcim srdcom moslimskej civilizácie na Pyrenejskom polostrove. Vzniklo po dobytí v roku 711 a vrchol dosiahlo za Córdobského kalifátu, ktorý v roku 929 vyhlásil 'Abd al-Raḥmān III. Córdoba bola istý čas najväčším a najvzdelanejším mestom západnej Európy a jej knižnice, mešity a trhy nemali severne od Stredozemného mora konkurenciu.\n\nJej učenci šírili algebru, medicínu, astronómiu a filozofiu ďaleko za hranice latinského sveta a diela staroveku sa zachovali a odovzdávali ďalej vďaka arabským prekladom. Hoci sa kalifát po roku 1031 rozpadol na kráľovstvá #italic ṭā'ifa#! a postupne ustúpil kresťanskému postupu, spomienka na jeho vzdelanosť a veľkoleposť pretrvala ako jeden z vrcholov stredovekej civilizácie." # todo: NEW TRANSLATION
 golden_century_events.1.a: "Pred nami je storočie bohatstva a upevňovania moci." # todo: NEW TRANSLATION
 explain_golden_century_dominance_tt: "Umožní [Concept('gc_european_dominance','európska dominancia')|e] a [Concept('gc_colonial_dominance','koloniálna dominancia')|e]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 explain_golden_century_antagonists_tt: "Umožní [GetInternationalOrganizationType('grand_alliance').GetName] [Concept('international_organization','medzinárodná organizácia')|e]. Vznikne, keď hodnota #Y Nadvlády#! dosiahne #Y 25#!, pričom ju podporia naši [Concept('rival_enemies','nepriateľov')|e], [Concept('rivals','rivalov')|e] alebo krajiny, ktoré k nám zaujímajú ustráchaný postoj. Jej [Concept('members','členov')|e] budú silnejší, čím vyššie stúpne naša nadvláda. Zostane obranným spolkom, kým niektorá z hodnôt neprekročí #Y 75#!. Potom jej členovia získajú jedinečné [Concept('casus_belli','casus Belli')|e], aby proti nám mohli viesť vojnu a v prípade víťazstva obmedziť našu nadvládu prostredníctvom svojich [Concept('peace_treaties','mierových dohôd')|e]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 explain_golden_century_flashpoints_tt: "Počas tejto [Concept('situation','situácie')|e] u nás môžu nastať [Concept('events','udalosti')|e] súvisiace s [Concept('flashpoint','zlomovým bodom')|E]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 golden_century_events.2.title: "Nadvláda v [ShowContinentNameWithNoTooltip('europe')]" # todo: NEW TRANSLATION
 golden_century_events.2.desc.desc_spa: "Napriek úsiliu všetkých súperov a nepriateľov sme na kontinente [ShowContinentName('europe')] dosiahli samotný vrchol nášho [GetSituationByKey('golden_century').GetName]. Žiadna koalícia sa nám nedokáže postaviť, nijaký dvor sa neodváži ignorovať naše želania a [target_ruler.GetName] je skutkami, ak nie titulom, uznávaný ako najvznešenejší panovník kresťanstva.\n\nPluky [ShowUnitDefinitionName('a_tercio')] sú pánmi bojiska, cisárska hodnosť je na dosah a od [ShowRegionName('italy_region')] až po Nížiny sa osud [ShowContinentNameWithNoTooltip('europe')] odvíja od našej vôle. Nech si naši nepriatelia kujú plány, ako chcú; tento vek patrí nám." # todo: NEW TRANSLATION
 golden_century_events.2.desc.desc_adu: "Na vrchole nášho [GetSituationByKey('golden_century').GetName] opäť stojíme ako najmocnejšia sila v [ShowRegionName('iberia_region')]. Moc, ktorú už dávno odpísali ako poslednú iskru zaniknutej éry, dnes nemožno ignorovať a [ShowReligionGroupAdjective('christian')] kráľovstvá za horami s nami musia rokovať alebo odísť v tichosti.\n\nNaše loďstvo ovláda západné more, naše posádky držia každý priesmyk a meno [target_ruler.GetName] vyslovujú s úctou, aká kedysi patrila kalifom z [ShowLocationName('cordoba')]. Od Pyrenejí až po najvzdialenejšie pobrežie [ShowContinentName('europe')] sa nik neodváži pozdvihnúť ruku proti veriacim bez toho, aby sa najprv zodpovedal nám. Sláva krajiny [ROOT.GetCountry.GetAltAdjective('G')] sa obnovila a nik z dnes žijúcich sa nedožije jej úpadku." # todo: NEW TRANSLATION # todo: COUNTRY CASE
 golden_century_events.2.desc.historical_info_spa: "Na vrchole šestnásteho storočia bolo habsburské Španielsko najmocnejšou krajinou Európy. Za vlády Karola V. a jeho syna Filipa II. ovládalo najbohatšiu ríšu na svete a najobávanejšiu armádu svojej doby — #italic tercios#!, ktorých formácie pikenierov a mušketierov vyše storočia ovládali bojiská kontinentu.\n\nVíťazstvo pri Pavii v roku 1525 urobilo z francúzskeho kráľa zajatca a španielskym loďstvom vedená flotila v roku 1571 pri Lepante zlomila osmanskú námornú moc v Stredozemnom mori. Zo španielskej koruny v Madride sa riadili záležitosti Talianska, Nížin aj Svätej ríše rímskej. Toto obdobie nadvlády sa neskôr spomínalo ako #italic Pax Hispanica#!." # todo: NEW TRANSLATION
 golden_century_events.2.desc.historical_info_adu: "Na vrchole svojej moci za córdobského kalifátu bol al-'Andalus dominantnou silou v západnom Stredozemí. 'Abd ar-Raḥmān III., ktorý v roku 929 prijal titul kalifa, a jeho syn al-Ḥakam II. vládli štátu, ktorého armády, loďstvo a bohatstvo prevyšovali všetky kresťanské kráľovstvá polostrova.\n\nPo smrti al-Ḥakama II. viedol komorník a regent Abū 'Āmir Muḥammad ibn Abī 'Āmir al-Ma'āfirī, prezývaný a všeobecne známy ako al-Manṣūr, „Víťazný“, córdobské vojská na výpravy, „razzie“, ktoré takmer bez prekážok terorizovali severnú Ibériu. Plienili významné mestá, ako Barcelona, León či dokonca Santiago de Compostela, ktoré vyplienili v roku 997. Jeho zlaté dináre obiehali po celom Stredozemí, jeho vyslanci sa dostali až do Byzancie a k cisárom Svätej ríše rímskej a istý čas sa nijaká západná mocnosť nemohla vyrovnať jeho bohatstvu ani dosahu." # todo: NEW TRANSLATION
 golden_century_events.2.a: "Zlatý vek navždy!" # todo: NEW TRANSLATION
 as_long_as_we_remain_at_100_european_dominance_universal_monarchy_modifier_tt: "Pokiaľ si počas zvyšku [Concept('situation','situácii')|e] [GetSituationByKey('golden_century').GetName] udržíme [Concept('gc_european_dominance','európska dominancia')|e] na hodnote #Y 100#!, budeme využívať výhody modifikátora [ShowModifier('universal_monarchy_modifier')]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 as_long_as_we_remain_at_100_european_dominance_renewed_faith_modifier_tt: "Pokiaľ si počas zvyšku [Concept('situation','situácii')|e] [GetSituationByKey('golden_century').GetName] udržíme [Concept('gc_european_dominance','európska dominancia')|e] na hodnote #Y 100#!, budeme využívať výhody modifikátora [ShowModifier('renewed_faith_modifier')]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 enables_partition_cb_tt: "Umožní [Concept('casus_belli','casus Belli')|e] [ShowCasusBelliName('cb_partition')] a tiež [Concept('peace_treaty','mierová dohoda')|e] [ShowPeaceTreatyTypeName('peace_partition')]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 unlock_saqaliba_advances_units_building_tt: "Odomkne [ShowAdvanceName('saqaliba_barracks_advance')] a tri úrovne pechotných [Concept('advances','pokroky')|e] #italic aṣ-Ṣaqāliba al-Judud#!, našich stálych zborov otrockých vojakov, ktoré možno nasadiť, keď máme [Concept('gc_european_dominance','európska dominancia')|e] na hodnote #Y 100#!" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 golden_century_events.3.title: "Prevaha v [ShowContinentNameWithNoTooltip('europe')]" # todo: NEW TRANSLATION
 golden_century_events.3.desc.desc_spa: "Naše zástavy sa teraz radia medzi najvýznamnejšie v [ShowContinentName('europe')]. Kým kedysi naši vyslanci čakali v predsieňach, teraz určuje podmienky [target_ruler.GetName] a dvory [ShowRegionName('italy_region')] aj [GetInternationalOrganizationType('hre').GetName] prispôsobujú svoje plány tým našim.\n\nSkutočné ovládnutie kontinentu je ešte pred nami, no nijaký súper už nepochybuje o tom, že na západe povstala nová veľmoc. Využime svoju výhodu, kým ju máme." # todo: NEW TRANSLATION
 golden_century_events.3.desc.desc_adu: "Príliv, ktorý po stáročia smeroval proti nám, sa obrátil. Od [ShowLocationName('strait_of_gibraltar')] až po severné priesmyky cítiť silu krajiny [ROOT.GetCountry.GetAltAdjective('G')] naprieč [ShowContinentName('europe')] a pod vedením [target_ruler.GetName] zvažujú [ShowReligionGroupAdjective('christian')] kniežatá každý svoj krok vzhľadom na našu moc.\n\nVrchol sme ešte nedosiahli, no veriaci neboli na západe takí mocní už celé generácie. Pokračujme v postupe, kým šťastena praje odvážnym." # todo: NEW TRANSLATION # todo: COUNTRY CASE
 golden_century_events.3.desc.historical_info_spa: "V prvých desaťročiach šestnásteho storočia sa Španielsko závratnou rýchlosťou premenilo z novozjednoteného kráľovstva na poprednú európsku mocnosť. Vojenské ťaženia Gonzala Fernándeza de Córdoby, #italic El Gran Capitán#!, v rokoch 1503 až 1504 vyrvali Neapol Francúzsku a zmenili umenie vojny vďaka disciplinovanej pechote.\n\nDiplomacia Ferdinanda Aragónskeho a sobáš katolíckych Veličenstiev zaplietli Španielsko do dynastických zväzkov polovice Európy. Keď Karol Habsburský v roku 1516 zdedil koruny, základy kontinentálnej hegemónie už boli položené." # todo: NEW TRANSLATION
 golden_century_events.3.desc.historical_info_adu: "Po páde córdobského kalifátu zachránili al-'Andalus pred postupujúcimi kresťanskými kráľovstvami dvakrát berberské ríše z juhu. Almorávidi v roku 1086 rozdrvili Alfonza VI. pri Sagrajase a na celú generáciu zastavili reconquistu. Nasledujúci Almohádovci potom v roku 1195 opäť porazili Kastílčanov pri Alarcos.\n\nZa týchto dynastií sa al-'Andalus znovu zjednotil a jeho hranice zostali pevné. Mestá ako Córdoba a Sevilla opäť prekvitali ako centrá vzdelanosti a obchodu, kým sa neobnovil dlhý postup kresťanov." # todo: NEW TRANSLATION
 golden_century_events.3.a: "Vrchol je na dosah." # todo: NEW TRANSLATION
 as_long_as_we_remain_at_75_european_dominance_expanded_cabinet_jurisdiction_modifier_tt: "Pokiaľ si počas zvyšku [GetSituationByKey('golden_century').GetName] udržíme [Concept('gc_european_dominance','európska dominancia')|e] na hodnote #Y 75#!, budeme využívať výhody modifikátora [ShowModifier('expanded_cabinet_jurisdiction_modifier')]" # todo: NEW TRANSLATION # todo: CONCEPT CASE

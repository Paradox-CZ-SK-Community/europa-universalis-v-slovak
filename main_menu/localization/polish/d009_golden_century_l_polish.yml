 saharan_trade_house_desc: "Veľké stredisko transsaharského obchodu, ktorého sklady sú plné zlata, soli a látok. Zriadené v [Concept('urban_location','mestskej lokalite')|e] ovláda karavánové cesty a premieňa obchod s púšťou na prúd bohatstva." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 can_only_be_built_via_saharan_trade_house_action_tt: "Možno zriadiť iba prostredníctvom [Concept('action','akcie')|e] [ShowGenericActionName('adu_charter_saharan_trade_house')] počas [GetSituationByKey('golden_century').GetName] [Concept('situation','situácie')|e]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 RECONQUER_IBERIA_WAR_NAME: "Znovudobytie Ibérie" # todo: NEW TRANSLATION
 golden_century_events.30.title: "Zmar storočia" # todo: NEW TRANSLATION
 golden_century_events.30.desc: "Zlaté storočie, ktoré sme chceli vybudovať, leží v troskách. Štvrtina území, ktoré sme držali na jeho úsvite, sa nám vyšmykla z rúk a zabrali ich mocnosti, ktoré vyvolal náš vlastný vzostup. Za vlády [target_ruler.GetName] už naša [ROOT.GetCountry.GetFlavorRank] nemôže tvrdiť, že vládne tak ako kedysi.\n\nDejiny si zapamätajú náš vzostup i náš pád. Zostáva nám zhromaždiť sily, ktoré nám ešte zostali, a prečkať roky, ktoré prídu." # todo: NEW TRANSLATION
 golden_century_events.30.a: "Tak sa končí náš zlatý vek." # todo: NEW TRANSLATION
 golden_century_events.31.title: "Pád kolosu" # todo: NEW TRANSLATION
 golden_century_events.31.desc: "[gc_hegemon.GetName], ktorý kedysi čnel nad svojou dobou, bol pokorený a prišiel o štvrtinu svojho územia. Kolos, ktorý zatieňoval [ShowContinentName('europe')] aj moria za jeho hranicami, je konečne zlomený a rovnováha síl sa opäť mení." # todo: NEW TRANSLATION
 golden_century_events.31.desc.destroyed: "Kolos, ktorý kedysi čnel nad svojou dobou, bol úplne vymazaný z mapy. Mocnosť, ktorá zatieňovala [ShowContinentName('europe')] aj moria za jeho hranicami, bola zvrhnutá a jej územia si rozdelili tí, ktorých kedysi držala v šachu. Rovnováha síl sa opäť mení." # todo: NEW TRANSLATION
 golden_century_events.31.a: "Koalícia splnila svoju úlohu." # todo: NEW TRANSLATION
 golden_century_events.31.b: "Doba sa mení." # todo: NEW TRANSLATION
 gc_ending_defeat_member_tt: "Keďže sme stáli v koalícii proti [gc_hegemon.GetName], môžeme teraz sfalšovať [ShowCasusBelliName('cb_reconquer_iberia')] a zmocniť sa území [ShowRegionName('iberia_region')] za nižšiu cenu a najmocnejší z nás prevezme titul Premožiteľa regiónu $iberia_region$" # todo: NEW TRANSLATION
 golden_century_events.33.title: "Zlaté storočie" # todo: NEW TRANSLATION
 golden_century_events.33.desc: "Od začiatku nášho vzostupu uplynulo sto rokov a aj na ich konci stojíme neporazení. Prežili sme všetkých súperov, ktorí sa proti nám postavili, aj každú koalíciu a pod vedením [target_ruler.GetName] zažila naša krajina [ROOT.GetCountry.GetFlavorRank] zlatý vek, o ktorom sa bude hovoriť celé stáročia.\n\nTo, čo sme získali v [ShowContinentName('europe')] i za oceánom, je teraz naše a je tak hlboko votkané do štruktúry našej ríše, že to už nijaký zvrat nedokáže úplne zvrátiť." # todo: NEW TRANSLATION
 golden_century_events.33.a: "Naše storočie je zavŕšené." # todo: NEW TRANSLATION
 golden_century_events.34.title: "Kolos pretrváva" # todo: NEW TRANSLATION
 golden_century_events.34.desc: "[gc_hegemon.GetName] prečkal celé storočie neporazený a jeho zlatý vek vstupuje do dejín s jeho nadvládou nedotknutou. Stopa, ktorú zanechá v [ShowContinentName('europe')] i v širšom svete, nás všetkých prežije." # todo: NEW TRANSLATION
 golden_century_events.34.a: "Nedokázali sme ich zlomiť." # todo: NEW TRANSLATION
 golden_century_events.34.b: "Takto sa na túto dobu bude spomínať." # todo: NEW TRANSLATION
 golden_century_events.54.title: "Veľká aliancia pokorená" # todo: NEW TRANSLATION
 golden_century_events.54.desc: "Koalícia vytvorená, aby nás zastavila, bola porazená v otvorenej vojne a jej členovia teraz znášajú následky svojej opovážlivosti. Tí, ktorí proti nám pochodovali, opustili svoju veľkú alianciu a dali prednosť samostatnému prežitiu pred spoločnou porážkou.\n\nNaše zbrane obstáli pred všetkými dvormi [ShowContinentName('europe')]. Kniežatá, ktoré si šepkali, že náš vzostup možno zastaviť, o ňom teraz budú hovoriť iným tónom." # todo: NEW TRANSLATION
 golden_century_events.54.a: "Nech sa rozutekajú." # todo: NEW TRANSLATION
 gc_ga_humbled_tt: "Víťazstvo vo vojne nad Veľkou alianciou zvýši našu [Concept('gc_european_dominance','europskú dominanciu')|e] o #Y 10#! a jej porazení členovia opustia [Concept('international_organization','medzinárodná organizácia')|e]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 gc_salamanca_embrace_tt: "Mnohé [Concept('pops','populácie')|e] v našich vzdelávacích centrách, ktoré nevyznávajú naše [Concept('religion','náboženstvo')|e] ani [Concept('culture','kultúra')|e], ich prijmú" # todo: NEW TRANSLATION # todo: CONCEPT CASE

 golden_century_events.40.title: "Povstanie stavov" # todo: NEW TRANSLATION
 golden_century_events.40.desc.desc_spa: "Privilegované stavy našej krajiny [ROOT.GetCountry.GetFlavorRank] povstali proti nám ako jeden. Naše nedávne pokusy nahromadiť viac moci na ich úkor neunikli pozornosti. Grandovia, preláti aj obchodníci z miest s privilégiami protestujú, že sme sústredili priveľa moci do svojich rúk, a dvíhajú svoje zástavy i družiny, aby nás prinútili ustúpiť." # todo: NEW TRANSLATION
 golden_century_events.40.desc.desc_adu: "Veľké rody našej krajiny [ROOT.GetCountry.GetFlavorRank] sa spojili proti nám. Od dávnych čias sme nevideli takú bezočivú neposlušnosť zo strany tých, ktorých sme sami povýšili medzi privilegovaných. Nie je to nič iné než drzosť a pýcha. Každý bezvýznamný pán, obchodník a duchovný teraz túži po moci, ktorá nám právom patrí, a to nedopustíme!" # todo: NEW TRANSLATION
 golden_century_events.40.desc.historical_info_spa: "Centralizačné ambície španielskej koruny narazili na prudký odpor privilegovaných vrstiev. Povstanie komunérov v rokoch 1520 až 1521 priviedlo mestá Kastílie k vzbure proti Karolovi V. a grandovia i kortesy dlho bránili svoje slobody pred dosahom trónu." # todo: NEW TRANSLATION
 golden_century_events.40.desc.historical_info_adu: "Ústredná moc v al-'Andaluse bola neustále spochybňovaná významnými rodmi a provinčnými pánmi. Občianske vojny známe ako #italic fitna#! po roku 1009 rozvrátili Córdobský kalifát a ctižiadostiví miestodržitelia sa znovu a znovu odtrhli od centra, aby vládli podľa vlastnej vôle." # todo: NEW TRANSLATION
 golden_century_events.40.a: "Zabúdajú, komu slúžia!" # todo: NEW TRANSLATION
 X_provinces_may_rise_in_revolt_tt: "#Y [ROOT.GetVariable('golden_century_events_40_display_prov_rebel_variable').GetValue|V0]#! [Concept('provinces','provincie')|e] sa pridajú k povstalcom [target_rebel.GetName] a všetci príslušníci vyššej triedy v nich sa obrátia proti nám" # todo: NEW TRANSLATION # todo: CONCEPT CASE

 grand_alliance: "Veľká aliancia" # todo: NEW TRANSLATION
 grand_alliance_desc: "Spojenectvo mocností, ktoré spojil strach zo vzmáhajúceho sa Kolosa. Čím viac táto mocnosť rozširuje svoju nadvládu naprieč [ShowContinentNameWithNoTooltip('europe')] a Novým svetom, tým silnejšia je odpoveď tejto koalície, až kým rovnováha tejto éry nebude závisieť od toho, či sa ju podarí zadržať. Na jej čele stojí najmocnejší člen a pridať sa môže každá krajina, ktorá sa Kolosa obáva alebo sa mu protiví." # todo: NEW TRANSLATION

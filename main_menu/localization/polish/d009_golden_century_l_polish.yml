 crown_of_al_andalus_desc: "Jedna koruna ich teraz všetkých spája. Taify regiónu [ShowRegionName('iberia_region')], dlho rozdelené od pádu [ShowLocationName('cordoba')], sa zhromaždili pod jediným trónom a veriaci aj dhimmi sa podriaďujú autorite nášho rodu." # todo: NEW TRANSLATION
 adu_restored_f: "Al-'Andalus" # todo: NEW TRANSLATION
 adu_restored_f_desc: "Boj o [ShowLocationName('strait_of_gibraltar')] sme vyhrali a cesta k obnoveniu krajiny $adu_restored_f$ je otvorená. Keďže [ShowReligionGroupAdjective('muslim')] vec zvíťazila, menej krajín v regióne [ShowRegionName('iberia_region')] sa musí podriadiť nášmu trónu, aby mohol starý poriadok opäť povstať." # todo: NEW TRANSLATION

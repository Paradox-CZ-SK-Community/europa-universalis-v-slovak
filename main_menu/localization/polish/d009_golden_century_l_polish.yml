 golden_century_events.41.title: "Zrážka starého s novým" # todo: NEW TRANSLATION
 golden_century_events.41.desc: "Stavy na nás naliehajú, aby sme sa vzdali časti svojej ústrednej autority. Tvrdia, že naše nedávne pokusy odobrať im výsady oslabili ich vplyv, a žiadajú výrazný obrat.\n\nStarý poriadok sa vzpiera novému: prastaré rody a ich zdedené práva stoja proti centralizovanej vláde, ktorú sme sa usilovali vybudovať. Každý nový výnos z centra vnímajú ako krádež toho, čo im právom patrí. Ústupok by naklonil rovnováhu výrazne v ich prospech a ohlásil návrat k starým spôsobom dávno minulej hierarchie." # todo: NEW TRANSLATION
 golden_century_events.41.desc.historical_info_spa: "Centralizujúca sa monarchia, ktorú Katolícki panovníci vybudovali z Kastílie a Aragónska, narážala na odpor starých privilegovaných stavov na každom kroku. Cortes strážili svoje právo schvaľovať dane, aragónske a katalánske #italic fueros#! zväzovali ruky korune a veľmoži aj mestá s vlastnými výsadami sa držali slobôd, ktoré nijaký reformný minister nedokázal ľahko zrušiť." # todo: NEW TRANSLATION
 golden_century_events.41.desc.historical_info_adu: "Ústrednej autorite v al-'Andalus provinciálna šľachta neustále odporovala. Umajjovský štát v Córdobe spravovala platená byrokracia, no mocné rody, pohraniční vládcovia a mestá sa proti nej vzpierali. Po roku 1031 sa ríša rozpadla na kráľovstvá #italic ṭā'ifa#!, v ktorých si každý vládca počínal po svojom." # todo: NEW TRANSLATION
 golden_century_events.41.a: "Ustúpime ich požiadavkám." # todo: NEW TRANSLATION
 golden_century_events.41.b: "Každá kríza je príležitosťou." # todo: NEW TRANSLATION
 estates_protest_our_rejection_tt: "Stavy zúria nad naším odmietnutím" # todo: NEW TRANSLATION
 golden_century_events.42.title: "Sústredenie moci" # todo: NEW TRANSLATION
 golden_century_events.42.desc: "Nastal priaznivý okamih, aby sme prevzali opraty moci do vlastných rúk. Staré výsady a miestne slobody, ktoré tak dlho zväzovali ústrednú vládu, možno konečne odložiť a celý štátny aparát podriadiť jedinému cieľu.\n\nTakáto príležitosť sa už nemusí naskytnúť. Ak teraz využijeme svoju výhodu, môžeme pevnejšie dostať pod svoju kontrolu rady, súdy aj výber daní a zabezpečiť, aby sa celé naše panstvo riadilo jednotne." # todo: NEW TRANSLATION
 golden_century_events.42.desc.historical_info_spa: "Spojenie Kastílie a Aragónska pod vládou Izabely a Ferdinanda vytvorilo jeden z prvých moderných štátov v Európe. Prostredníctvom kráľovských rád, #italic corregidores#! vysielaných na správu miest a podrobenia Cortes i vojenských rád si koruna počas šestnásteho storočia neustále upevňovala svoju moc." # todo: NEW TRANSLATION
 golden_century_events.42.desc.historical_info_adu: "Na vrchole svojej moci patril Córdobský kalifát, upevnený po roku 929 'Abd al-Raḥmānom III., k najcentralizovanejším štátom svojej doby. Kalif vládol z jedného hlavného mesta zjednotenému al-'Andalus vďaka platenému #italic dīwān#!, stálej armáde a sieti vymenovaných miestodržiteľov, čo vzbudzovalo závisť rozdrobených ríš v okolí." # todo: NEW TRANSLATION
 golden_century_events.42.a: "Sústreďme moc v centre." # todo: NEW TRANSLATION
 golden_century_events.42.b: "Posilnime vládnucu radu." # todo: NEW TRANSLATION
 golden_century_events.42.c: "Vybudujme väčšiu armádu." # todo: NEW TRANSLATION
 golden_century_events.43.title: "Zlatý vek umenia" # todo: NEW TRANSLATION
 golden_century_events.43.desc.desc_spa: "Bohatstvo a sebadôvera uvoľnili v [ROOT.GetCountry.GetCapital.GetName] záplavu talentu. Divadlá sú každé popoludnie preplnené, tlačiarne nestíhajú vydávať diela básnikov a maliari, akých už možno nikdy neuvidíme, berú do rúk štetce v službách koruny a oltára.\n\nNajväčšie mysle [ShowContinentName('europe')] teraz vzhliadajú k nášmu dvoru a [ROOT.GetCountry.GetGovernment.GetRuler.GetName] má byť veľkým patrónom tejto doby. Striebro nám získalo územia, no môže nám priniesť aj slávu, pretože storočia si pamätáme nielen podľa toho, čo si vzali, ale aj podľa toho, čo vytvorili. Otvorme pokladnicu nášho [ROOT.GetCountry.GetFlavorRank] a podporte tento rozkvet." # todo: NEW TRANSLATION # todo: COUNTRY CASE
 golden_century_events.43.desc.desc_adu: "V sálach [ROOT.GetCountry.GetCapital.GetName] znovu ožíva dávne učenie. Básnici si počas noci vymieňajú verše, lekári a astronómovia sa schádzajú na dvore a piesne al-'Andalus opäť znejú na nádvoriach, ktoré už dávno stíchli.\n\nNaše mestá boli po stáročia svetlom, podľa ktorého sa vzdelával Západ, a túto žiaru môžeme znovu roznieť. [ROOT.GetCountry.GetGovernment.GetRuler.GetName] má zhromaždiť najnadanejších ľudí zo všetkých krajín, naplniť naše knižnice a podporiť školy, aby sa opäť hovorilo, že múdrosť sídli v [ROOT.GetCountry.GetAltAdjective('L')]. Teraz nastal čas, aby sa náš [ROOT.GetCountry.GetFlavorRank] stal patrónom nadaných." # todo: NEW TRANSLATION # todo: COUNTRY CASE
 golden_century_events.43.desc.historical_info_spa: "Španielsky zlatý vek, #italic Siglo de Oro#!, bol kultúrnym rozkvetom, ktorý sprevádzal vznik ríše a ktorý do veľkej miery financovalo striebro z Indie. Svetu priniesol Cervantesov román #italic Don Quijote#!, divadelné hry Lopeho de Vegu a Calderóna a obrazy El Greca, Velázqueza a Murilla." # todo: NEW TRANSLATION
 golden_century_events.43.desc.historical_info_adu: "Córdoba desiateho storočia bola najvzdelanejším mestom západnej Európy a jej knižnica najväčšou na kontinente. Učenci ako filozof Ibn Rushd a chirurg al-Zahrāwī šírili medicínu, filozofiu a astronómiu ďaleko za hranice moslimského sveta. Jej veľkoleposť pretrvala až do nasridskej Alhambry v Granade." # todo: NEW TRANSLATION
 golden_century_events.43.a: "Nech nastane zlatý vek." # todo: NEW TRANSLATION
 golden_century_events.44.title: "[target_character.GetNameWithNoTooltip] vstupuje do našich služieb" # todo: NEW TRANSLATION
 golden_century_events.44.desc.desc_spa: "[ROOT.GetCountry.GetGovernment.GetRuler.GetShortName] sa dopočul o [target_character.GetName] a tí, ktorí [target_character.GetHerHim] videli pri práci, nehovoria takmer o ničom inom. Či už [target_character.GetSheHe] zhromažďuje vojská na bojisku, alebo si získava slovo v rade, nesie na sebe nezameniteľnú pečať talentu — takého služobníka dostane koruna možno len raz za vládu.\n\nTakýto talent nezostáva bez práce ani bez iných pánov. Ak má [target_character.GetNameWithNoTooltip] slúžiť nášmu [ROOT.GetCountry.GetFlavorRank], a nie súperiacemu trónu, musíme si [target_character.GetHerHim] získať hneď, ponúknuť dostatočné pocty a úrad, aby [target_character.GetHerHim] zostal na našej strane." # todo: NEW TRANSLATION
 golden_century_events.44.desc.desc_adu: "[target_character.GetName] predstúpila pred [ROOT.GetCountry.GetGovernment.GetRuler.GetName] a chýry o [target_character.GetHerHim] nie sú iba prázdnymi lichôtkami dvoranov. V rokovacej sieni aj na pochode [target_character.GetSheHe] prejavuje vzácne nadanie, od ktorého často závisel osud celej dynastie.\n\nMyseľ [target_character.GetHerHis] je korisťou, ktorú by každý dvor uchmatol bez váhania. Povýšme [target_character.GetNameWithNoTooltip] do úradu a preukážme pocty. Potom môže [target_character.GetHerHim] slúžiť nášmu [ROOT.GetCountry.GetFlavorRank] celú generáciu; ak zaváhame, určite tak urobí niekto iný." # todo: NEW TRANSLATION # todo: COUNTRY CASE
 golden_century_events.44.desc.historical_info_spa: "Gonzalo Fernández de Córdoba, známy ako #italic El Gran Capitán#!, bol najlepším vojakom svojej doby. Počas talianskych vojen porazil pri Cerignole a na Garigliane oveľa početnejšie francúzske vojská. Tieto víťazstvá získali Neapolsko španielskej korune a z neho urobili jej prvého miestokráľa. Jeho reformy pechoty, ktoré spojili piku, meč a strelné zbrane do jedného disciplinovaného útvaru, položili základy #italic tercios#!, ktoré viac než storočie ovládali európske bojiská." # todo: NEW TRANSLATION
 golden_century_events.44.desc.historical_info_adu: "Osud al-'Andalus často závisel od jediného veľkého ministra, najmä od #italic hajib#! al-Manṣūra, ktorého kresťania nazývali Almanzor. Jeho vojenské ťaženia pokorili severné kráľovstvá a urobili z neho vládcu kalifátu vo všetkom okrem mena." # todo: NEW TRANSLATION
 golden_century_events.44.a: "Prijmime [target_character.GetNameWithNoTooltip] do svojich služieb." # todo: NEW TRANSLATION
 golden_century_events.45.title: "Sčítanie ríše" # todo: NEW TRANSLATION
 golden_century_events.45.desc.desc_spa: "Naši úradníci prichádzajú za [ROOT.GetCountry.GetGovernment.GetRuler.GetName] s návrhom na rozsiahle sčítanie: spočítať každé obydlie, zmerať každé pole a zapísať skutočné bohatstvo nášho [ROOT.GetCountry.GetFlavorRank] do dôveryhodných kráľovských registrov. Je to pomalá a nevďačná práca a tí, čo sa vyhýbajú daniam, budú geodetom nadávať pri každom dome.\n\nRíša, ktorá pozná samu seba, sa však dá dobre spravovať. Spravodlivo vyberať dane, zverbovať vojská úmerne našim možnostiam a míňať na základe presných účtov namiesto optimistických odhadov — to je tichá sila, na ktorej spočívajú dlhotrvajúce vlády. Vedomosti sú svojím spôsobom panstvo. Nariaďme sčítanie." # todo: NEW TRANSLATION # todo: COUNTRY CASE
 golden_century_events.45.desc.desc_adu: "Naši tajomníci naliehajú na [ROOT.GetCountry.GetGovernment.GetRuler.GetName], aby dal opäť do poriadku registre a spočítal obyvateľov i ich majetok, ako to kedysi robil #italic dīwān#! od Córdoby až po Bagdad. Poctivo vedené účtovníctvo je podľa nich základom každej silnej vlády.\n\nPráve vďaka takémuto dôkladnému účtovníctvu dokázali naši predkovia udržiavať platených úradníkov, stále armády a pokladnicu, ktorú sever mohol iba obdivovať. Obnovenie tejto disciplíny nahradí vládcove dohady istotou úradníkov a zverí celý náš [ROOT.GetCountry.GetFlavorRank] do rúk jediného, dobre informovaného vládcu. Nariaďme sčítanie." # todo: NEW TRANSLATION # todo: COUNTRY CASE
 golden_century_events.45.desc.historical_info_spa: "Kastílska koruna pravidelne nariaďovala rozsiahle sčítania, #italic averiguaciones#!, pri ktorých sa zaznamenávali obydlia a majetok s cieľom určiť dane. Habsburgovci túto prax rozšírili na svoje rozľahlé panstvá." # todo: NEW TRANSLATION
 golden_century_events.45.desc.historical_info_adu: "Umajjovský štát v Córdobe spravoval prepracovaný #italic dīwān#!, ktorého daňové registre a platení úradníci zaručovali príjmy, aké kresťanská Európa mohla iba závidieť. Išlo o dedičstvo správy štátu z Damasku a Bagdadu." # todo: NEW TRANSLATION
 golden_century_events.45.a: "Nariaďme sčítanie." # todo: NEW TRANSLATION
 golden_century_events.46.title: "Jarmoky prekypujú" # todo: NEW TRANSLATION
 golden_century_events.46.desc.desc_spa: "Tohtoročné jarmoky sú väčšie, než si ktokoľvek pamätá. Obchodníci sa hrnú z každého kráľovstva [ShowContinentName('europe')], zmenky sa vystavujú na sumy, za ktoré by sa kedysi dala viesť vojna, a v účtovných domoch nášho [ROOT.GetCountry.GetFlavorRank] neutícha od svitu do mrku cinkot mincí.\n\nTakéto príležitosti netrvajú večne. Kým sú Janovčania a veľké bankové domy ochotní spolupracovať a striebro prúdi, môžeme si ich úver pripútať ku korune, presmerovať ich obchod cez vlastné mestá a získať podiel z každej uzavretej dohody. Šťastena nám priniesla zlatú sezónu. Využime ju naplno." # todo: NEW TRANSLATION
 golden_century_events.46.desc.desc_adu: "Súky v [ROOT.GetCountry.GetCapital.GetName] nezažili také davy, odkedy si kto pamätá. Karavány z [ShowRegionName('maghreb_region')] a lode spoza mora zapĺňajú naše prístaviská hodvábom, papierom, kožou a glazovaným tovarom, ktorý vyrábajú naši remeselníci. Zmenárnici sotva stíhajú obsluhovať zákazníkov.\n\nObchod na západnom mori bol vždy životnou silou al-'Andalus a v dobrých rokoch prináša väčšie bohatstvo než akýkoľvek tribút vymáhaný od porazeného nepriateľa. Ak budeme chrániť cesty, uľahčíme cestovanie obchodníkom a zachováme naše prístavy ako pýchu pobrežia, tento rozmach môže napĺňať našu pokladnicu celú generáciu. Využime priaznivý vietor." # todo: NEW TRANSLATION # todo: COUNTRY CASE
 golden_century_events.46.desc.historical_info_spa: "Jarmoky v Medine del Campo boli finančným srdcom Kastílie. Vyrovnávali sa na nich zmenky z veľkej časti Európy a janovské i nemecké bankové domy tam obchodovali s korunou." # todo: NEW TRANSLATION
 golden_century_events.46.desc.historical_info_adu: "Andalúzsky obchod siahal od Maghrebu po Levantu. Hodváb, papier, koža a lesklá keramika z Córdoby a Granady sa vyvážali do zahraničia a mestské trhy patrili k najrušnejším v stredovekom Stredomorí." # todo: NEW TRANSLATION
 golden_century_events.46.a: "Nech obchod prekvitá." # todo: NEW TRANSLATION
 golden_century_events.47.title: "Nové vojnové umenie" # todo: NEW TRANSLATION
 golden_century_events.47.desc.desc_spa: "Naši kapitáni cvičia pechotu novým spôsobom: spájajú pikenierov a strelcov do šíkov, ktoré odolávajú jazde aj pechote. Starí vojaci, ktorí bojovali na všetkých bojiskách [ShowContinentName('europe')], prisahajú, že ešte nikdy nevideli takú pevnú formáciu.\n\nAk armády nášho [ROOT.GetCountry.GetFlavorRank] podporíme zlatom a dáme im čas na výcvik, môžu sa stať postrachom každého bojiska. Meno našich plukov bude vzbudzovať strach od [ShowRegionName('italy_region')] až po sever. Vojny vyhrávajú tí, ktorí ovládnu nové umenie skôr, než sa ich súperi naučia brániť. Financujme reformy." # todo: NEW TRANSLATION
 golden_century_events.47.desc.desc_adu: "Naši velitelia žiadajú od [ROOT.GetCountry.GetGovernment.GetRuler.GetName] obnovu starých vojenských umení: rýchlej ľahkej jazdy, ktorá obťažuje a obkľučuje nepriateľa, i nových strelných zbraní nasadených na jej podporu. Pohraničie vždy prialo rýchlosti a prekvapeniu a len málokto ich využíval tak dobre ako naši predkovia.\n\nSpojme toto zdedené umenie s delostrelectvom našej doby a zástavy nášho [ROOT.GetCountry.GetFlavorRank] budú vzbudzovať strach na mori aj v piesku, na kresťanskom pohraničí i na pobreží [ShowRegionName('maghreb_region')]. Mocnosť, ktorá sa nenaučí nové spôsoby vedenia vojny, svoje hranice dlho neudrží. Financujme reformy." # todo: NEW TRANSLATION # todo: COUNTRY CASE
 golden_century_events.47.desc.historical_info_spa: "Španielske vojská pod velením Gonzala de Córdoby ako prvé zaviedli #italic tercio#!, útvar spájajúci pikenierov a arkebuzierov, ktorý vyše storočia ovládal európske bojiská a urobil zo Španielska poprednú vojenskú mocnosť svojej doby." # todo: NEW TRANSLATION
 golden_century_events.47.desc.historical_info_adu: "Andalúzske a berberské vojenské umenie si cenilo #italic jinete#!, rýchleho ľahkého jazdca vyzbrojeného oštepom a mečom. Nasridi z Granady patrili na Pyrenejskom polostrove medzi prvých, ktorí obrátili delostrelectvo na strelný prach proti svojim nepriateľom." # todo: NEW TRANSLATION
 golden_century_events.47.a: "Financujme reformy." # todo: NEW TRANSLATION
 golden_century_events.48.title: "Maják vzdelanosti" # todo: NEW TRANSLATION
 golden_century_events.48.desc.desc_spa: "Prednáškové siene nášho [ROOT.GetCountry.GetFlavorRank] ešte nikdy neboli také hlučné. Právnici sa sporia, či môže knieža zákonne konať tak, ako aj tak zamýšľa, teológovia zvažujú práva národov za oceánom a polovica dvorov [ShowContinentName('europe')] nás žiada o kópiu rozsudku.\n\nNech sa nikdy nehovorí, že sme učencovi odopreli štipendium. Podporme veľké školy a pozdvihnime [ShowLocationNameWithNoTooltip('salamanca')] nad všetky ostatné. Potom sa bude o našom [ROOT.GetCountry.GetFlavorRank] hovoriť aj v sálach, kam naše vojská nikdy nevkročili. Vzbudiť strach je bežné; dosiahnuť, aby nás počúvali, je vzácnejšia sláva. Podporme učencov." # todo: NEW TRANSLATION
 golden_century_events.48.desc.desc_adu: "Medresy nášho [ROOT.GetCountry.GetFlavorRank] sú opäť preplnené a naši lekári, astronómovia a prekladatelia sa pustili do práce, akoby zaháľali pridlho. Staré knihy schádzajú z políc a spory, ktoré vyvolávajú, sú ešte staršie.\n\nPodporme tieto stánky vzdelanosti a sledujme, ako prekvitajú. Nech nás spomienka na veľkú knižnicu v [ShowLocationNameWithNoTooltip('cordoba')], ktorá kedysi zatienila každý dvor na Západe, podnieti k viac než len nostalgii — to, čo sa rozptýlilo, môžeme opäť zhromaždiť. Podporme učencov." # todo: NEW TRANSLATION
 golden_century_events.48.desc.historical_info_spa: "Salamanská univerzita, založená v roku 1218, patrila k najstarším a najuznávanejším v Európe. V šestnástom storočí jej Salamanská škola pod vedením dominikána Francisca de Vitoriu oživila scholastické myslenie a viedla debaty o právach obyvateľov Ameriky a zákonných hraniciach vojny. Tieto otázky sa považujú za základy medzinárodného práva." # todo: NEW TRANSLATION
 golden_century_events.48.desc.historical_info_adu: "Hovorilo sa, že kalifská knižnica v Córdobe, zhromaždená za vlády al-Ḥakama II., obsahovala státisíce zväzkov a bola najväčšou zbierkou na Západe. Jej prekladatelia priniesli #italic falsafa#! Ibn Ruscha, ktorého Latini nazývali Averroes, do kresťanskej Európy, zatiaľ čo v granadskej nemocnici #italic bīmāristān#! sa vyučovala medicína v dobe, keď sa veľká časť kontinentu spoliehala iba na modlitby." # todo: NEW TRANSLATION
 golden_century_events.48.a: "Podporme učencov." # todo: NEW TRANSLATION
 golden_century_events.49.title: "Zúčtovanie dlhov" # todo: NEW TRANSLATION
 golden_century_events.49.desc.desc_spa: "Napriek všetkému drahému kovu, ktorý k nám putuje cez oceán, nás veritelia dostali do úzkych. Bankári držia naše zmenky, úroky pohltia ďalšiu flotilu skôr, než vôbec zakotví, a teraz žiadajú splátku, ktorú pokladnica nášho [ROOT.GetCountry.GetFlavorRank] nedokáže uhradiť v plnej výške.\n\nNezostáva nám nijaký čestný spôsob, ako im odpovedať, iba tvrdé riešenia. Môžeme pozastaviť splácanie dlhov a porušiť dôveru bankových domov, ktoré financujú naše vojny, alebo ešte viac zaťažiť ríšu výberom peňazí, ktoré nemá." # todo: NEW TRANSLATION
 golden_century_events.49.desc.desc_adu: "[ROOT.GetCountry.GetCapital.GetName] už nedokáže plniť svoje finančné záväzky. Nekonečné výdavky na pohraničné vojny, žold vojakov v [ShowRegionName('maghreb_region')] a tribút požadovaný mocnejšími susedmi naraz vyčerpali naše príjmy.\n\nVeritelia sú čoraz naliehavejší a výplatcovia žoldov ešte viac, pretože nezaplatená armáda sa rozpadne alebo obráti zbrane proti nám. Zúčtovanie už nemožno odkladať: musíme zohnať peniaze, vzdať sa splatenia dlhu alebo prísť o mužov, ktorí chránia naše hranice." # todo: NEW TRANSLATION
 golden_century_events.49.desc.historical_info_spa: "Napriek prílevu amerického striebra španielska koruna opakovane vyhlásila bankrot — napríklad v rokoch 1557, 1575 a 1596 — pretože nedokázala splácať obrovské pôžičky od Fuggerovcov a janovských bankových domov." # todo: NEW TRANSLATION
 golden_century_events.49.desc.historical_info_adu: "Štáty al-'Andalus a Maghrebu neustále zaťažovali náklady na pohraničné vojny, žold berberských žoldnierov a tribút požadovaný mocnejšími susedmi. Tieto bremená dokázali vyprázdniť pokladnicu rýchlejšie, než ju akákoľvek daň stihla naplniť." # todo: NEW TRANSLATION
 golden_century_events.49.a: "Znehodnoťme mince a prečkajte búrku." # todo: NEW TRANSLATION
 golden_century_events.49.b: "Utiahnime si opasky!" # todo: NEW TRANSLATION
 golden_century_events.50.title: "Choroba v srdci krajiny" # todo: NEW TRANSLATION
 golden_century_events.50.desc: "[ShowDiseaseName('bubonic_plague')] zasiahla srdce nášho [ROOT.GetCountry.GetFlavorRank]. Vyľudňuje dediny a šíri sa mestskými uličkami, nešetrí ani štvrte boháčov, ani najchudobnejšie chatrče. Cintoríny za hradbami čoskoro nebudú stíhať prijímať mŕtvych. Zatiaľ nijaký lekár nenašiel spôsob, ako ju zastaviť.\n\nProti nepriateľovi, na ktorého neplatia obliehania ani zmluvy, môže koruna robiť len pokornú prácu potrebnú na prežitie: pochovávať mŕtvych so zvyškom dôstojnosti, živiť a chrániť živých a udržiavať aspoň aký-taký poriadok, pretože panika by mohla zabiť viac ľudí než samotná choroba. Môžeme sa len starať o ľud, vytrvať a modliť sa, aby to najhoršie čoskoro pominulo." # todo: NEW TRANSLATION
 golden_century_events.50.desc.historical_info: "Od čias čiernej smrti v štrnástom storočí zasahovali Pyrenejský polostrov opakované vlny moru. Vyľudňovali mestá aj polia a ničili pracovnú silu a príjmy, od ktorých závisel každý štát. Kastílsky mor v rokoch 1596 až 1602 pripravil o život možno až šesťstotisíc ľudí. Kastília sa z tejto demografickej rany nikdy úplne nespamätala a historici ju považujú za jednu z príčin jej dlhého úpadku." # todo: NEW TRANSLATION
 golden_century_events.50.a: "Prestaňte na seba kašľať!" # todo: NEW TRANSLATION
 golden_century_events.51.title: "Povstanie na pohraničí" # todo: NEW TRANSLATION
 golden_century_events.51.desc: "[target_area.GetName] povstalo a nachádza sa priamo v oblasti, v ktorej leží naše hlavné mesto. Obyvatelia sa chopili zbraní, vyhnali našich úradníkov a vyhlásili, že sa nám už nebudú zodpovedať.\n\nTakéto povstanie v samom srdci nášho [ROOT.GetCountry.GetFlavorRank] nemôžeme strpieť. Každý kraj, ktorý uvidí, ako sa nám [target_area.GetNameWithNoTooltip] vzpiera bez trestu, začne zvažovať vlastné šance. Z jednej vzdorovitej oblasti sa môže stať hrozba pre celú ríšu. Musíme povstanie potlačiť skôr, než sa jeho príklad rozšíri." # todo: NEW TRANSLATION
 golden_century_events.51.desc.historical_info: "Vládcov Pyrenejského polostrova neustále prenasledovali povstania vlastných krajov. Córdobský kalifát sa po roku 1031 rozpadol na kráľovstvá #italic ṭā'ifa#!, v ktorých sa každý miestodržiteľ stal drobným kráľom. O niekoľko storočí neskôr povstali Moriskovia v Alpujarras proti Kastílii v rokoch 1568 až 1571 v krutej horskej vojne a #italic fueros#! Aragónska a Katalánska kládli korune prísne hranice. Na tomto polostrove sa vždy našla provincia, ktorá po prílišnom nátlaku zdvihla vlastnú zástavu." # todo: NEW TRANSLATION
 golden_century_events.51.a: "Odpovieme na ich vzdor." # todo: NEW TRANSLATION
 golden_century_events.52.title: "Hlad a nepokoje" # todo: NEW TRANSLATION
 golden_century_events.52.desc: "Úroda zlyhala a chlieb je pre obyčajných ľudí nedostupne drahý. V mestách nášho [ROOT.GetCountry.GetFlavorRank] sa pri sýpkach zhromažďujú hladné davy a vyvolávajú nepokoje. Vidiek sa vyľudňuje, keď zúfalí ľudia vyrážajú na cesty a hľadajú miesto, kde by sa dosýta najedli.\n\nVládcu posudzujú v chudobných rokoch oveľa prísnejšie než v časoch hojnosti. Hladujúcich nezaujíma striebro získané v cudzine, ak doma nemajú ani kúsok chleba. Od prázdneho žalúdka kameňom hodeným po našich úradníkoch je len krôčik. Musíme nájsť obilie na naplnenie trhov a udržať poriadok v uliciach, inak hlad vykoná to, čo nijaká nepriateľská armáda nedokázala." # todo: NEW TRANSLATION
 golden_century_events.52.desc.historical_info: "Husté osídlenie miest na Pyrenejskom polostrove ich vždy vystavovalo nebezpečenstvu nedostatku potravín. Jediná neúroda alebo prerušená obchodná cesta mohli už za jednu sezónu vyvolať hladomor a nepokoje. Hladomory a vyľudňovanie vidieka na začiatku sedemnásteho storočia, ktoré sa spájajú s úpadkom Kastílie, vyhnali hladujúcich z ich domovov a spôsobili, že chlebové nepokoje sa stali bežnou súčasťou života španielskych miest." # todo: NEW TRANSLATION
 golden_century_events.52.a: "Postavme sa hladným davom." # todo: NEW TRANSLATION
 gc_decision.title: "Nastáva zlatý vek" # todo: NEW TRANSLATION
 gc_decision.desc: "[GetSituationByKey('battle_for_the_strait').GetName] sa skončila a nad [ShowLocationName('strait_of_gibraltar')] zaviala naša zástava. Juh poslúcha náš [ROOT.GetCountry.GetFlavorRank] od jedného pobrežia k druhému a v [ShowRegionName('iberia_region')] nám už nijaký súper nebráni v tom, čo sme získali.\n\nTo, čo príde, musí byť viac než len víťazstvo, na ktoré budeme spomínať. V celej [ShowContinentName('europe')] teraz náš hlas siaha ďalej než kedykoľvek naše vojská a za oceánom ležia pobrežia, ktoré ešte nikdy nevideli naše plachty. Nech sa začínajúci vek nesie v mene [ROOT.GetCountry.GetAltAdjective('D')]." # todo: NEW TRANSLATION # todo: COUNTRY CASE
 gc_decision.desc.entry: "Kto ovláda [ShowLocationName('strait_of_gibraltar')], ovláda bránu medzi Stredozemným morom a oceánom. A táto brána je teraz naša. Mier na juhu uvoľní naše financie a lode pre väčšie ciele v [ShowContinentName('europe')] aj na vzdialených pobrežiach. Vojny sa vyhrávajú za jednu sezónu, no zlatý vek treba vybudovať." # todo: NEW TRANSLATION
 gc_decision.a: "Mnohé mapy čoskoro zastarajú!" # todo: NEW TRANSLATION
 restore_cordoba.title: "Obnova [ShowLocationNameWithNoTooltip('cordoba')]" # todo: NEW TRANSLATION
 restore_cordoba.desc: "[ShowLocationName('cordoba')] bola kedysi divom Západu, no nikdy znovu nedosiahla veľkoleposť, ktorú poznala za kalifov, keď jej knižnice a veľká mešita vzbudzovali závisť celého kontinentu. Vložme do jej stavieb bohatstvo nášho [ROOT.GetCountry.GetFlavorRank] a obnovme jej postavenie klenotu [ROOT.GetCountry.GetAltAdjective('G')]." # todo: NEW TRANSLATION # todo: COUNTRY CASE
 restore_cordoba.a: "Obnovme žiarivý klenot al-'Andalus." # todo: NEW TRANSLATION
 enable_decision_to_restore_learning_center_in_cordoba_tt: "Odomkne #Y $restore_cordoba.title$#! [Concept('decision','rozhodnutie')|e]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 library_cordoba: "Knižnica v $cordoba$" # todo: NEW TRANSLATION
 library_cordoba_desc: "V časoch svojej najväčšej slávy mala $library_cordoba$ státisíce zväzkov a bola najväčšou zbierkou na Západe, ktorej závideli všetky dvory od [ShowRegionName('maghreb_region')] po [ShowRegionName('crescent_region')]. Po obnove priťahuje učencov, prekladateľov a odpisovačov z celého sveta a opäť robí z [ShowLocationName('cordoba')] maják vzdelanosti." # todo: NEW TRANSLATION
 library_cordoba_maintenance: "$library_cordoba$" # todo: NEW TRANSLATION
 gc_change_colonial_dominance: "[Concept('gc_colonial_dominance','Koloniálna dominancia')|e]: $VALUE|+$" # todo: NEW TRANSLATION # todo: CONCEPT CASE

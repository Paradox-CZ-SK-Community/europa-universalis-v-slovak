 gc_develop_target_province_tt: "Zvyšuje [Concept('prosperity','prosperita')|e] každej [Concept('location','lokalite')|e] v provincii [target_province.GetName] a [Concept('development','rozvoj')|e] lokality [target_location.GetName]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 gc_decision_iberian_union_leader_tt: "Sme [Concept('senior_partner','hlavný partner')|e] v Iberskej únii s úrovňou [Concept('union_integration_level','úrovňou integrácie únie')|e] aspoň #Y 3#!" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 gc_decision_muslim_branch_tt: "Vládneme ako [ShowFormableCountryName('MOR_f')], alebo sme obnovili [ShowFormableCountryName('ADU_f')]" # todo: NEW TRANSLATION
 gc_colonial_dominance: "Koloniálna nadvláda" # todo: NEW TRANSLATION
 gc_colonial_dominance_desc: "Ako ďaleko siaha náš dosah v Novom svete, ktorý sa mesiac čo mesiac rozširuje vďaka našim kolóniám, flotilám s pokladmi, námorným tradíciám a viere, ktorú šírime za oceánom. Meria, nakoľko je naše storočie za oceánom zlaté, a každá dosiahnutá hranica nám prináša trvalú odmenu. Len čo táto hodnota alebo naša [Concept('gc_european_dominance','európska dominancia')|e] prvýkrát dosiahne 25, [GetInternationalOrganizationType('grand_alliance').GetName] sa sformuje proti nám." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 GC_COLONIAL_DOMINANCE_DISPLAY: "$VAL$" # todo: NEW TRANSLATION
 gc_european_dominance: "Európska nadvláda" # todo: NEW TRANSLATION
 gc_european_dominance_desc: "Ako silno naša moc dolieha na Európu; mesiac čo mesiac rastie vďaka rozlohe našej ríše, jej stabilite a armádnym tradíciám, ako aj našej legitimite a pevnému zovretiu domovského regiónu. Meria naše postavenie doma a každá dosiahnutá hranica nám prináša trvalú odmenu. Len čo táto hodnota alebo naša [Concept('gc_colonial_dominance','koloniálna dominancia')|e] prvýkrát dosiahne 25, [GetInternationalOrganizationType('grand_alliance').GetName] sa sformuje proti nám." # todo: NEW TRANSLATION # todo: CONCEPT CASE

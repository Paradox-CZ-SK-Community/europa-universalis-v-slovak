 grand_alliance_leader_desc: "Najmocnejší člen organizácie $grand_alliance$, určovaný nanovo každý rok. S meniacim sa šťastím sa môže vedenie presunúť na iného člena." # todo: NEW TRANSLATION
 spa_increase_capital_market_demands: "Zvýšiť dopyt na trhu hlavného mesta" # todo: NEW TRANSLATION
 spa_increase_capital_market_demands_desc: "Bohatstvo našej éry urobilo z nášho hlavného mesta závisť celého sveta. Vyberte tovar obchodovaný na jeho trhu a vyhláste ho za dvornú módu, čím podnietite prudký nárast dopytu a obohatíte každého kupca, ktorý ho privezie na naše brehy." # todo: NEW TRANSLATION
 gc_increase_market_demand_select_good: "Vybrať uprednostňovaný tovar" # todo: NEW TRANSLATION
 gc_increase_market_demand_no_good: "@trigger_no!Na trhu nášho [Concept('capital','hlavného mesta')|e] sa neobchoduje so žiadnym vhodným tovarom" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 gc_increase_market_demand_tt: "Vyberieme tovar obchodovaný na trhu nášho [Concept('capital','hlavného mesta')|e] a dlhodobo tam prudko zvýšime jeho dopyt. Dodatočný dopyt závisí od počtu obyvateľov nášho [capital] a potrvá #Y 10#! rokov. Ostatné trhy to neovplyvní, takže cena tovaru stúpne v prospech všetkých, ktorí ho privezú na naše brehy" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 golden_century_events.22.title: "Dvorná móda" # todo: NEW TRANSLATION
 golden_century_events.22.desc: "Bohatstvo zlatého veku rozmaznalo obyvateľov [ROOT.GetCountry.GetCapital.GetName]. Ich šľachtici, prelati a bohatí mešťania sa predbiehajú v okázalosti a ich agenti prehľadávajú trhy, aby získali [target_good.GetName] na výzdobu svojich sál a stolov.\n\nZa vlády [target_ruler.GetName] môžeme túto túžbu využiť a vyhlásiť [target_good.GetNameWithNoTooltip] za dvornú módu, takže dopyt po ňom v našom hlavnom meste prudko vzrastie nad rámec toho, čo by naši ľudia vôbec potrebovali. Každý kupec, ktorý ho privezie na naše brehy, na tom zarobí — a vďaka clám a vlastnému obchodu aj my." # todo: NEW TRANSLATION # todo: COUNTRY CASE
 golden_century_events.22.a: "Nech módu určuje dvor." # todo: NEW TRANSLATION
 gc_increase_market_demand_result_tt: "Dopyt po [target_good.GetName] na trhu v [ROOT.GetCountry.GetCapital.GetName] prudko vzrastie na nasledujúcich #Y 10#! rokov, čím sa zvýši jeho cena v prospech všetkých, ktorí ho predávajú" # todo: NEW TRANSLATION # todo: COUNTRY CASE
 adu_charter_saharan_trade_house: "Zriadiť saharský obchodný dom" # todo: NEW TRANSLATION
 adu_charter_saharan_trade_house_desc: "Zlaté cesty Sahary sú životnou miazgou nášho blahobytu. Vyberte [Concept('urban_location','mestská lokalita')|e] v našej ríši a zriaďte tam veľký saharský obchodný dom, stredisko karaván a obchodu, ktoré pritiahne bohatstvo púštneho obchodu do našich rúk." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 adu_charter_saharan_trade_house_select_market: "Vyberte [Concept('urban_location','mestská lokalita')|e]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 adu_charter_saharan_trade_house_no_market: "@trigger_no!Nemáme žiadnu [Concept('urban_location','mestskú lokalitu')|e], ktorá by sa hodila na zriadenie saharského obchodného domu" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 adu_charter_saharan_trade_house_tt: "Vo vybranej [Concept('urban_location','mestskej lokalite')|e] zriadime [ShowBuildingTypeName('saharan_trade_house')], významné stredisko karavánového obchodu" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 golden_century_events.23.title: "[ShowBuildingTypeNameWithNoTooltip('saharan_trade_house')]" # todo: NEW TRANSLATION
 golden_century_events.23.desc: "Tam, kde sa stretávajú karavánové cesty, menia mince majiteľov a bohatstvo sa tvorí v podobe [ShowGoodsName('salt')], [ShowGoodsName('goods_gold')] a [ShowGoodsName('cloth')]. V [target.GetName] vybudujeme veľký obchodný dom, ktorý ovládne tento obchod. Jeho sklady a účtovne budú odvádzať bohatstvo púštnych ciest do pokladníc krajiny [actor.GetName].\n\nPod jeho strechou sa zhromaždia kupci z celého [ShowRegionName('sahel_region')] i [ShowRegionName('maghreb_region')] a bohatstvo dvoch pobreží bude prúdiť v náš prospech." # todo: NEW TRANSLATION
 golden_century_events.23.a: "Nech prídu karavány." # todo: NEW TRANSLATION
 golden_century_events.17.title: "Rády v [ShowSituationNameWithNoTooltip('golden_century')]" # todo: NEW TRANSLATION
 golden_century_events.17.desc: "Prišlo naše storočie a ani zďaleka sa nepodobá tomu, na ktoré boli vojenské rády pripravené.\n\nDnešné úlohy sa odohrávajú v [ShowAreaName('flanders_area')], v [ShowLocationName('milano')] i za oceánom: flotily, banky a #italic tercios#! platené striebrom. Rády držia hrady na hranici, ktorá už za života nikoho z nás neexistuje, a ich bratia, stále najlepšia ťažká jazda v [ShowReligionAdjective('catholic')] svete, trávia čas vyberaním nájomného a spormi o prednosť.\n\nSú zdrojom, ktorý [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')] prestal využívať." # todo: NEW TRANSLATION
 golden_century_events.17.a: "Dajme im úlohu hodnú našej [ROOT.GetCountry.GetFlavorRank]." # todo: NEW TRANSLATION
 golden_century_events.17.b: "Zabezpečme im pohodlný odchod do dôchodku." # todo: NEW TRANSLATION
 golden_century_events.17.c: "Nech si ďalej vyberajú nájomné." # todo: NEW TRANSLATION
 gc_orders_given_new_purpose_tt: "$bfts_orders_given_new_purpose_tt$" # todo: NEW TRANSLATION
 golden_century_events.18.title: "Nečinné kopije" # todo: NEW TRANSLATION
 golden_century_events.18.desc: "Dve komendy sa dostali do sporu o hranicu, mlyn a dvesto rokov starú urážku. Záležitosť sa vyhrotila viac, než ktokoľvek zamýšľal. Na oboch stranách sú mŕtvi a obaja majstri nám napísali ako prví, presvedčení, že pravda je na ich strane.\n\nTakto sa správa vojenský rád, keď niet vojny. Bratia sú stále ozbrojení, stále vyňatí z právomoci bežných súdov a v našej [ROOT.GetCountry.GetFlavorRank] sa zodpovedajú iba nám." # todo: NEW TRANSLATION
 golden_century_events.18.a: "Oboch verejne potrestajme." # todo: NEW TRANSLATION
 golden_century_events.18.b: "Nech si to vyriešia medzi sebou." # todo: NEW TRANSLATION
 golden_century_events.19.title: "Zámorské rády" # todo: NEW TRANSLATION
 golden_century_events.19.desc: "Od majstrov prišla žiadosť a je nanajvýš ambiciózna. Chcú založiť komendy v Indii a venovať sa tam rovnakej činnosti ako kedysi na maurskej hranici, pričom nové pohraničné územia chcú spravovať tak, ako spravovali tie staré.\n\nBuď pôjde o záchranu inštitúcie, ktorej došli hranice, alebo o vývoz problému, ktorý sme doma nevyriešili." # todo: NEW TRANSLATION
 golden_century_events.19.desc_expected: "Povedali sme im, aby sa obrátili k oceánu, a oni to urobili. Majstri prijali pokyn s väčším nadšením, než sme možno zamýšľali.\n\nNa flotilách majú kaplánov, v prístavoch bratov a teraz aj oficiálnu žiadosť o komendy v Indii, ktorú spísali právnici, čo na nej očividne pracujú už dlhší čas. Rády našli novú hranicu hneď, ako sme im na ňu ukázali." # todo: NEW TRANSLATION
 golden_century_events.19.a: "Udeľme im právo pôsobiť v Indii." # todo: NEW TRANSLATION
 golden_century_events.19.b: "India patrí [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('crown_estate')], nie [GetUniqueInternationalOrganization('catholic_church').GetNameWithNoTooltip]." # todo: NEW TRANSLATION
 golden_century_events.24.title: "Vplyv v [ShowContinentNameWithNoTooltip('europe')]" # todo: NEW TRANSLATION
 golden_century_events.24.desc.desc_spa: "Príliš dlho rozhodovali dvory za Pyrenejami o záležitostiach [ShowContinentName('europe')], akoby na juh od nich nebolo nič dôležité. Teraz sa učia, že to tak nie je. Naši vyslanci, ktorí kedysi čakali v predsieňach, teraz nachádzajú otvorené dvere a pripravené miesta. Za vlády [target_ruler.GetName] sa o sobášoch a zmluvách našej [ROOT.GetCountry.GetFlavorRank] rokuje v každej kancelárii, ktorá vie, čo robí.\n\nZatiaľ sa nás neboja a sotva sa o nás uchádzajú, no už nás neprehliadajú. Tak sa začína vzostup každej veľmoci. Nech si staré tróny užívajú svoje prednostné postavenie, kým môžu." # todo: NEW TRANSLATION
 golden_century_events.24.desc.desc_adu: "[ShowReligionGroupAdjective('christian')] kniežatá nás už dávno odpísali vo svojich kronikách ako uzavretú kapitolu. A predsa teraz stoja ich vyslanci pri bránach [ROOT.GetCountry.GetCapital.GetName], prinášajú dary a opatrné komplimenty a zrazu ich zaujíma, čo zamýšľa [target_ruler.GetName]. Mocnosť, ktorú pochovali, im stále narúša pohreb.\n\nZatiaľ nevládneme, iba sme znovu získali miesto pri stole, ktorému sme kedysi predsedali. Veriaci sa však opäť zapojili do diania na [ShowContinentName('europe')] a tentoraz nemáme v úmysle odísť." # todo: NEW TRANSLATION # todo: COUNTRY CASE
 golden_century_events.24.desc.historical_info_spa: "Spojenie Kastílie a Aragónska sa Európe ohlásilo skôr sobášmi než zbraňami. Ferdinand a Izabela vydali svoje deti za členov portugalskej, habsbursko-burgundskej a tudorovskej dynastie v priebehu niečo vyše desaťročia. Dvojité sobáše z rokov 1496 a 1497 tak zaplietli Španielsko do dynastických väzieb polovice kontinentu. Dávno predtým, než sa začali obávať #italic tercios#!, sa európske kancelárie naučili pri každom rozhodovaní počítať so španielskymi korunami." # todo: NEW TRANSLATION
 golden_century_events.24.desc.historical_info_adu: "Za vlády „Abd ar-Rahmána II. v 9. storočí sa Córdobský emirát zaradil medzi veľmoci. Byzantský cisár Theofilos vyslal v roku 840 posolstvo, aby získal jeho priateľstvo proti Abbásovcom. Dvor v Córdobe odpovedal rovnakým spôsobom a vymieňal si vyslancov a dary s ríšami, ktoré kedysi al-Andalus považovali za odľahlú odbojnícku provinciu." # todo: NEW TRANSLATION
 golden_century_events.24.a: "Dorazili sme." # todo: NEW TRANSLATION
 as_long_as_we_remain_at_25_european_dominance_rising_iberian_power_modifier_tt: "Pokiaľ si po zvyšok [GetSituationByKey('golden_century').GetName] udržíme [Concept('gc_european_dominance','európska dominancia')|e] na úrovni #Y 25#!, budeme využívať výhody modifikátora [ShowModifier('rising_iberian_power_modifier')]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 as_long_as_we_remain_at_25_european_dominance_restoration_of_al_andalus_modifier_tt: "Pokiaľ si po zvyšok [GetSituationByKey('golden_century').GetName] udržíme [Concept('gc_european_dominance','európska dominancia')|e] na úrovni #Y 25#!, budeme využívať výhody modifikátora [ShowModifier('restoration_of_al_andalus_modifier')]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 enables_edict_of_expulsion_action_tt: "Odomkne [Concept('action','akcia')|e] [ShowGenericActionName('spa_edict_expulsion')], ktorým z našich krajín vyženieme prívržencov viery, ktorú nebudeme tolerovať" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 enables_restore_caliphate_cb_taifa_tt: "Odomkne [Concept('casus_belli','casus Belli')|e] [ShowCasusBelliName('cb_restore_ummayad_caliphate')] a typ [Concept('subject','vazal')|e] Ṭā’ifa" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 golden_century_events.25.title: "Prítomnosť za obzorom" # todo: NEW TRANSLATION
 golden_century_events.25.desc.desc_spa: "Prvé lode sa vrátili s hlboko ponorenými bokmi a [ROOT.GetCountry.GetCapital.GetName] dostalo chuť na ďalšie. Cez účtovné stoly prechádza cukor, farbivá a ešte podivuhodnejší tovar. Každú vracajúcu sa plachtu čakajú na nábreží muži s pripravenými zmluvami a za vlády [target_ruler.GetName] získava naša [ROOT.GetCountry.GetFlavorRank] skutočné bohatstvo z pobreží, ktoré by väčšina našich poddaných na mape ani nenašla.\n\nZatiaľ je to len kvapka v porovnaní s tým, čím sa to môže stať. Kupci však vycítia meniaci sa príliv skôr než ktorýkoľvek admirál a už stavajú väčšie sklady." # todo: NEW TRANSLATION
 golden_century_events.25.desc.desc_adu: "Karavány sa znovu vydávajú na sever. Staré cesty cez piesky sa otvorili a s nimi prichádza zlato z [ShowRegionName('sahel_region')], na juh putuje výmenou soľ a trhoviská našej [ROOT.GetCountry.GetFlavorRank] ožívajú obchodom s púšťou.\n\nNaši otcovia toto bohatstvo poznali, no nechali si ho prekĺznuť pomedzi prsty. Za vlády [target_ruler.GetName] si ho chceme udržať: studne budú strážiť posádky, cesty budú pod dohľadom a každá unca zlata, ktorá prekročí púšť, zaplatí svoj podiel na našich trhoch, skôr než poputuje ďalej." # todo: NEW TRANSLATION
 golden_century_events.25.desc.historical_info_spa: "Do desiatich rokov od Kolumbovho vylodenia začala španielska koruna spravovať oceán ako svoju záležitosť. Casa de Contratación, založená v Seville v roku 1503, udeľovala povolenia každej lodi, registrovala každý náklad a zdaňovala každý návrat z Indie. Roztrúsené výpravy tak premenila na kráľovský podnik skôr, než samotné kolónie vôbec nadobudli význam." # todo: NEW TRANSLATION
 golden_century_events.25.desc.historical_info_adu: "Bohatstvo západného Sudánu sa do Stredomoria dostávalo cez púštne prístavy, ako bola Sijilmása, kde sa vystrojovali a zdaňovali karavány transsaharského obchodu. Keď Almorávidi v polovici 11. storočia dobyli Sijilmásu a Awdaghust, ovládli oba konce západnej zlatej cesty a zlato Sahelu prúdilo na sever pod vládou jedinej mocnosti." # todo: NEW TRANSLATION
 golden_century_events.25.a: "Za obzorom leží bohatstvo." # todo: NEW TRANSLATION
 as_long_as_we_remain_at_25_colonial_dominance_market_dominance_modifier_tt: "Pokiaľ si po zvyšok [GetSituationByKey('golden_century').GetName] udržíme [Concept('gc_colonial_dominance','koloniálna dominancia')|e] na úrovni #Y 25#!, budeme využívať výhody modifikátora [ShowModifier('market_dominance_modifier')]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 as_long_as_we_remain_at_25_colonial_dominance_wealth_sahel_modifier_tt: "Pokiaľ si po zvyšok [GetSituationByKey('golden_century').GetName] udržíme [Concept('gc_colonial_dominance','koloniálna dominancia')|e] na úrovni #Y 25#!, budeme využívať výhody modifikátora [ShowModifier('wealth_sahel_modifier')]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 enables_increase_capital_market_demands_action_tt: "Odomkne [ShowGenericActionName('spa_increase_capital_market_demands')] [Concept('action','akcia')|e], ktorým pritiahneme vybraný [Concept('goods','tovary')|e] na [Concept('market','trh')|e] nášho hlavného mesta" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 enables_charter_saharan_trade_house_action_tt: "Odomkne [Concept('action','akcia')|e] [ShowGenericActionName('adu_charter_saharan_trade_house')], ktorým v jednej z našich [Concept('urban_locations','mestských lokalít')|e] zriadime veľké stredisko púštneho obchodu" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 golden_century_events.26.title: "Vplyv za obzorom" # todo: NEW TRANSLATION
 golden_century_events.26.desc.desc_spa: "Cesta, ktorá sa začala ako výprava dobrodruhov, sa zmenila na cestu celých rodín. Každá flotila dnes vezie osadníkov aj vojakov a na vzdialenom pobreží pribúdajú farmy, farnosti a deti, ktoré nikdy neuvidia [ROOT.GetCountry.GetCapital.GetName]. Za vlády [target_ruler.GetName] koruna vzdialené krajiny už len nenárokuje; osídľuje ich.\n\nO nároku na mape sa dá polemizovať. Tisíce domácností však nie. Dajme pripraviť dekréty a udeľme povolenia na plavbu, lebo každá rodina, ktorú pošleme cez more, zapustí korene tak hlboko, že ich nijaký súper nevytrhne." # todo: NEW TRANSLATION
 golden_century_events.26.desc.desc_adu: "Zlatá cesta sa stala inštitúciou. Karavány odchádzajú a vracajú sa podľa plánu, sudcovia v oázových mestách riešia spory kupcov a účtovne v [ROOT.GetCountry.GetCapital.GetName] plánujú s púštnymi karavánami rovnako spoľahlivo, ako roľníci počítajú s úrodou.\n\nBohatstvo, ktoré príde raz, je šťastie; bohatstvo, ktoré prichádza každé ročné obdobie, je moc. Za vlády [target_ruler.GetName] sa púšť stala naším druhým morom a my sme jeho jedinou flotilou." # todo: NEW TRANSLATION # todo: COUNTRY CASE
 golden_century_events.26.desc.historical_info_spa: "Španielske vysťahovalectvo do Indie podliehalo povoleniam a registrácii, prebiehalo cez Sevillu a podporovali ho kráľovské granty pôdy a výnimky pre tých, ktorí boli ochotní vydať sa na cestu. Pomocou nástrojov, ako boli #italic cédulas de población#!, premenila koruna dobývanie na osídľovanie. Do polovice 16. storočia už cestu cez oceán podnikli desaťtisíce Kastílčanov." # todo: NEW TRANSLATION
 golden_century_events.26.desc.historical_info_adu: "Zlato Sahelu stálo za razbou mincí na moslimskom západe. Almorávidský dinár, razený zo saharského zlata, bol taký dôveryhodný, že ho kresťanské kráľovstvá na Pyrenejskom polostrove priamo napodobnili. Ich #italic maravedí#! prevzal jeho štandard aj názov od #italic murābiṭūn#!, ktorí razili pôvodné mince." # todo: NEW TRANSLATION
 golden_century_events.26.a: "Nech zlatý prúd plynie." # todo: NEW TRANSLATION
 as_long_as_we_remain_at_50_colonial_dominance_migratory_waves_modifier_tt: "Pokiaľ si po zvyšok [GetSituationByKey('golden_century').GetName] udržíme [Concept('gc_colonial_dominance','koloniálna dominancia')|e] na úrovni #Y 50#!, budeme využívať výhody modifikátora [ShowModifier('migratory_waves_modifier')]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 as_long_as_we_remain_at_50_colonial_dominance_golden_road_modifier_tt: "Pokiaľ si po zvyšok [GetSituationByKey('golden_century').GetName] udržíme [Concept('gc_colonial_dominance','koloniálna dominancia')|e] na úrovni #Y 50#!, budeme využívať výhody modifikátora [ShowModifier('golden_road_modifier')]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 enables_issue_royal_decree_action_tt: "Odomkne [Concept('action','akcia')|e] [ShowGenericActionName('spa_issue_royal_decree')], ktorým osídlime naše vzdialené državy na základe kráľovskej listiny" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 enables_gold_caravan_expedition_action_tt: "Odomkne [Concept('action','akcia')|e] [ShowGenericActionName('adu_dispatch_gold_caravan')], ktorým vyšleme karavánu na juh za zlatom z [ShowRegionName('sahel_region')]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 golden_century_events.27.title: "Prevaha za obzorom" # todo: NEW TRANSLATION
 golden_century_events.27.desc.desc_spa: "Vzdialené panstvá začínajú hovoriť naším jazykom. Ich mestá sa budujú podľa našich vzorov, ich súdy uplatňujú naše zákony a ich prístavy sa na rozkaz plnia flotilami, ktoré domov vezú tribút. Niekdajšia hranica sa mení na zrkadlo a za vlády [target_ruler.GetName] sa v ňom odráža [ROOT.GetCountry.GetName].\n\nVzdialenosť, starý nepriateľ každej ríše, s nami prehráva svoj spor. Keď vzdialené pobrežie uctieva, súdi a platí ako my, prestáva byť cudzou krajinou; je len ďaleko." # todo: NEW TRANSLATION
 golden_century_events.27.desc.desc_adu: "Viera putuje s karavánami a právo nasleduje vieru. V mestách, ktoré naši starí otcovia poznali iba po mene, sa teraz modlia ako my, sudcovia zasadajú na základe nášho vymenovania a panovníci vzdialených krajín sa na nás obracajú, aby získali legitimitu. Čo nedobyla mečom, to viera potichu pripája k našej ríši.\n\nZa vlády [target_ruler.GetName] sa #italic da’wa#! stala nástrojom štátu rovnako ako každá armáda, a navyše lacnejším, pretože obrátení si sami strážia svoje krajiny." # todo: NEW TRANSLATION
 golden_century_events.27.desc.historical_info_spa: "V polovici 16. storočia sa v Indii už nielen vládlo, ale spravovala sa ako súčasť ríše. Miestokráľovstvá Nové Španielsko a Peru, založené v rokoch 1535 a 1542, poskytli španielskej korune súdy, rady a biskupov vzdialených od Kastílie cez celý oceán. Každoročné flotily s pokladmi potom pripútali celú túto stavbu k Seville striebornou reťazou." # todo: NEW TRANSLATION
 golden_century_events.27.desc.historical_info_adu: "Islam prekročil Saharu v účtovných knihách kupcov dávno predtým, než ho nasledovalo vojsko. Viera zapustila korene v obchodných mestách pozdĺž karavánových ciest Sahelu. Panovníci, napríklad vládcovia Takrúru, ju prijali už v 11. storočí a spolu s vierou prišli učenci a sudcovia, ktorí právom a vzdelanosťou zviazali krajiny zlatého obchodu s moslimským západom." # todo: NEW TRANSLATION
 golden_century_events.27.a: "Naše zákonom i duchom." # todo: NEW TRANSLATION
 as_long_as_we_remain_at_75_colonial_dominance_elevated_cultural_identity_modifier_tt: "Pokiaľ si po zvyšok [GetSituationByKey('golden_century').GetName] udržíme [Concept('gc_colonial_dominance','koloniálna dominancia')|e] na úrovni #Y 75#!, budeme využívať výhody modifikátora [ShowModifier('elevated_cultural_identity_modifier')]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 as_long_as_we_remain_at_75_colonial_dominance_dawa_colonial_administration_modifier_tt: "Pokiaľ si po zvyšok [GetSituationByKey('golden_century').GetName] udržíme [Concept('gc_colonial_dominance','koloniálna dominancia')|e] na úrovni #Y 75#!, odomkneme [Concept('bureaucracy','bureaukracia')|e] [ShowBureaucracyTypeName('dawa_bureaucracy')] a budeme využívať výhody modifikátora [ShowModifier('dawa_colonial_administration_modifier')]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 enables_demand_tribute_fleets_action_tt: "Odomkne [Concept('action','akcia')|e] [ShowGenericActionName('spa_demand_tribute_fleets')], ktorým prikážeme svojim poddaným posielať svoje bohatstvo domov po mori" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 enables_build_qadi_office_action_tt: "Odomkne [Concept('action','akcia')|e] [ShowGenericActionName('adu_build_qadi_office')], ktorým v hlavnom meste [Concept('subject','vazalovi')|e] ustanovíme sudcu posvätného práva" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 golden_century_events.28.title: "Nadvláda za obzorom" # todo: NEW TRANSLATION
 golden_century_events.28.desc.desc_spa: "Už niet obzoru, za ktorým by nám nepatrila aspoň časť sveta. Vzdialené moria sú diaľnicami nášho obchodu, kolónie iných korún existujú iba vďaka našej zhovievavosti a keď si [target_ruler.GetName] zaželá prístav, úžinu či ostrov, zostáva už len dohodnúť cenu za jeho odovzdanie.\n\nNaši starí otcovia prosili cudzích moreplavcov o mapy. Naši vnuci nájdu naše meno už napísané na každom pobreží, ku ktorému doplávajú. Medzi týmito generáciami stojí tá naša, ktorá to všetko vykonala." # todo: NEW TRANSLATION
 golden_century_events.28.desc.desc_adu: "Od vzdialeného okraja púšte až po západné more sa vzdialený obchod zodpovedá jedinému pánovi. Nijaká karavána sa nepohne a nijaká plachta neprepláva, kým sa najprv nezapočíta náš podiel. Národy vzdialených krajín, kedysi cudzie, sa teraz modlia, obchodujú a zhromažďujú vojsko ako naši vlastní ľudia.\n\n[ShowReligionGroupAdjective('christian')] králi držia svoje pobrežia len s naším dovolením a vedia o tom. Za vlády [target_ruler.GetName] prestal byť svet za obzorom pohraničím; je jednoducho zvyškom našej [ROOT.GetCountry.GetFlavorRank]." # todo: NEW TRANSLATION
 golden_century_events.28.desc.historical_info_spa: "V druhej polovici 16. storočia sa Španielska ríša zmenila na globálny stroj. Strieborná hora Potosí, otvorená v roku 1545, chrlila mince, ktorými platil celý svet, a od roku 1565 ich manilské galeóny prevážali cez Tichý oceán a vymieňali za ázijský hodváb. Hovorilo sa, a nebola to iba lichôtka, že nad panstvami španielskeho kráľa slnko nikdy nezapadá." # todo: NEW TRANSLATION
 golden_century_events.28.desc.historical_info_adu: "Na vrchole svojej moci ovládala Almohadská ríša západné Stredomorie z oboch jeho brehov. Jej flotila bola považovaná za najsilnejšiu svojej doby. Keď Saladin v roku 1189 hľadal pomoc proti križiakom, napísal almohadskému kalifovi a požiadal ho o lode, ktoré by uzavreli more pred Frankmi." # todo: NEW TRANSLATION
 golden_century_events.28.a: "Obzor patrí nám." # todo: NEW TRANSLATION

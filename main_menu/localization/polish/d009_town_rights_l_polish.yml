l_polish:
 andalusi_refugee_town_rights: "Charta andalúzskych utečencov" # todo: NEW TRANSLATION
 andalusi_refugee_town_rights_desc: "Táto osada získala osobitné výsady, aby prilákala a usídlila remeselníkov, učencov a kupcov, ktorých z al-'Andalus vyhnali vonkajšie tlaky a prevraty dávnych čias. Títo utečenci prinášajú svoje remeslá a kultúru, obohacujú naše mestá a zvyšujú efektivitu miestnej výroby. Vítame ich i ich zručnosti v nádeji, že v našich krajinách zapustia pevné korene." # todo: NEW TRANSLATION
 andalusi_resettlement_town_rights: "Presídlenie Andalúzanov" # todo: NEW TRANSLATION
 andalusi_resettlement_town_rights_desc: "Táto osada otvorila svoje brány remeselníkom a roľníkom z al-'Andalus, ktorí sa sem presídlili na základe výsad zaručujúcich im domy, dielne a práva na vodu pre ich sady. Neprichádzajú ako utečenci prenasledovaní vojskom, ale ako osadníci pozvaní usadiť sa tu natrvalo, a prinášajú si so sebou hodvábne krosná, zavlažovacie kanály i remeslá južných trhovísk. Správy o takýchto podmienkach sa rýchlo šíria, a tam, kde sa prvým rodinám darí, nasledujú ďalšie." # todo: NEW TRANSLATION
 andalusi_resettlement_golden_age_town_rights: "Presídlenie zlatého veku" # todo: NEW TRANSLATION
 andalusi_resettlement_golden_age_town_rights_desc: "Naša nadvláda nad prielivom urobila z tejto osady najvyhľadávanejšie útočisko pre nadaných ľudí vyhnaných z al-'Andalus. Prichádzajú celé lode tkáčov hodvábu, lekárov, matematikov i majstrov murárov a výsady, ktoré im udeľujeme, sú najštedrejšie na celom polostrove. Z niekdajšieho prúdu osadníkov sa zrodila nová epocha a miestne dielne pracujú takým tempom, akému sa nijaký konkurenčný prístav nevyrovná." # todo: NEW TRANSLATION
 iberian_aljama_charter: "Charta aljamy" # todo: NEW TRANSLATION
 iberian_aljama_charter_desc: "Charta #italic aljama#! oficiálne upravuje právne postavenie samosprávnej komunity $muslim_ADJ$ v tejto lokalite a uznáva jej právo spravovať vlastné záležitosti, vyberať vnútorné dane a vyznávať svoju vieru. Dovoľujeme komunite udržiavať jej mešity, trhoviská a spoločenské inštitúcie výmenou za jej produktívne začlenenie do nášho hospodárstva. Toto usporiadanie má v mestách $iberia_region$ hlboké korene a odzrkadľuje praktickú realitu správy krajín, kde populácie $muslim_ADJ$ a $christian_ADJ$ už dlho žijú vedľa seba." # todo: NEW TRANSLATION
 mozarab_charter_town_rights: "Mozarabská charta" # todo: NEW TRANSLATION
 mozarab_charter_town_rights_desc: "Potvrdili sme dávnu dohodu s #italic musta'ribun#! tejto osady — arabizovanými kresťanmi, ktorí si počas generácií našej vlády zachovali svoju liturgiu a latinské knihy. Ich duchovenstvo podlieha vlastnému biskupovi a ich spory rozhodujú ich vlastní sudcovia; na oplátku bez reptania odvádzajú #italic jizya#! a nepovstanú proti nám. V osade je vďaka tomu pokojnejšie a reči o zbavení sa našej nadvlády nachádzajú len malú odozvu v uliciach, ktorým sme už dali to, o čo by sa inak vzbúrili. Komunita, ktorá má také istoty vo svojich obradoch, však nemá dôvod ich opúšťať." # todo: NEW TRANSLATION
 medina_charter_town_rights: "Charta mediny" # todo: NEW TRANSLATION
 medina_charter_town_rights_desc: "Tejto osade sme udelili štatúty #italic mediny#! — opevnenej mestskej štvrte, ktorej vládne #italic qāyid#! a na ktorú dohliada #italic muḥtasib#! s právomocami nad trhmi, ulicami i verejnou morálkou. Tieto výsady nám umožňujú získavať vyššie príjmy z husto usporiadaného mestského prostredia. Dávne usporiadanie ulíc spomaľuje výstavbu nových budov, no poriadok, ktorý prináša, robí z tejto osady jeden zo základných pilierov správy Maghrebu." # todo: NEW TRANSLATION
 mzab_pentapolis_town_rights: "Pentapolis Mzabu" # todo: NEW TRANSLATION
 mzab_pentapolis_town_rights_desc: "Táto osada získala komunitné výsady údolia Mzab, kde ibádijské mestá spravuje prísna rada #italic 'azzāba#! — právnicko-náboženskí učenci, ktorí majú v rukách právo i obchod. Komunitná dohoda otvára trh regulovanému obchodu a pevne spája komunitu s týmto miestom, vďaka čomu je osada stabilnou a sebestačnou enklávou. Mešťania sú tu vyrovnanejší a spokojnejší so svojím regulovaným blahobytom." # todo: NEW TRANSLATION
 tribal_souk_town_rights: "Charta kmeňového súku" # todo: NEW TRANSLATION
 tribal_souk_town_rights_desc: "Táto osada bola určená za pravidelné kmeňové trhovisko — #italic sūq#!, kde sa stretávajú kmene z vnútrozemia, aby obchodovali, urovnávali spory a obnovovali svoje vzájomné dohody. Toto uznanie kmeňom veľmi prospieva a nad trhoviskom si zachovávajú značnú mieru samostatnosti, čím sa oslabuje naša priama kontrola nad osadou. Množstvo tovaru, ktorý tadiaľto prechádza, sem láka karavány z okolitého vidieka." # todo: NEW TRANSLATION
 taifa_al_rais_town_rights: "Taifa reisov" # todo: NEW TRANSLATION
 taifa_al_rais_town_rights_desc: "Tento prístav podlieha #italic ṭāʾifat al-ruyūs#!, stálej korporácii korzárskych kapitánov, ktorých vystrojené lode brázdia celé pobrežie Berberska od Salé až po Tripolis. Kapitáni si nad prístavom udržiavajú vlastnú radu a ich povesť láka na nábrežie skúsených námorníkov. Tam, kde kotvia reisi, nikdy nechýbajú námorníci." # todo: NEW TRANSLATION
 sale_arsenal_town_rights: "Salésky arzenál" # todo: NEW TRANSLATION
 sale_arsenal_town_rights_desc: "Kráľovská #italic dār al-ṣināʿa#! v Salé stojí pri ústí rieky Bou Regreg, kde marinidskí stavitelia lodí kladú kýly a vystrojujú plavidlá, ktoré ponesú našu vlajku na Atlantiku. V lodeniciach je vždy poruke stály zbor tesárov a skúsených lodivodov, takže keď je trup pripravený na vodu, posádka sa rýchlo nájde. Nijaký iný prístav na tomto pobreží nedokáže vyzbrojiť flotilu tak ľahko." # todo: NEW TRANSLATION
 guich_charter_town_rights: "Charta giš" # todo: NEW TRANSLATION
 guich_charter_town_rights_desc: "Na týchto pozemkoch sme usadili jeden z kmeňov #italic jayš#! a udelili mu polia a pastviny oslobodené od sultánových daní výmenou za meče, ktoré dlhuje trónu. Ich jazdci sa zhromaždia pri prvom vojnovom povolaní a ich domácnosti vychovávajú synov skôr k sedlu než k pluhu. O čo pokladnica príde na príjmoch, o to armáda získa pripravených mužov." # todo: NEW TRANSLATION

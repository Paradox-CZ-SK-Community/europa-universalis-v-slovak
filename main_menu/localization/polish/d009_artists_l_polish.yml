l_polish:
 muqni_at_al_sa_il: "Muqni'at as-Sā'il 'an al-Maraḍ al-Hā'il" # todo: NEW TRANSLATION
 muqni_at_al_sa_il_desc: "Keď Čierna smrť vyprázdnila ulice Granady, vezír a lekár Lisan al-Din ibn al-Khatib odmietol pohodlnú náuku, že mor sa šíri výlučne z Božieho rozhodnutia. Pozoroval, ako choroba prechádza z nakazených na zdravých dychom, odevmi a spoločnými miestnosťami, a zaznamenal, čo videl.\n\nJeho trvanie na tom, že choroba sa šíri kontaktom, ho postavilo proti právnikom, ktorí tvrdili, že takéto tvrdenie hraničí s bezbožnosťou. Napriek tomu sa táto polemika zachovala a lekári ju prepisovali od Fesu po Káhiru ešte dlho po tom, čo najhoršia vlna moru pominula." # todo: NEW TRANSLATION

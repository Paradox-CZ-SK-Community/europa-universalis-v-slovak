l_polish:
 flavor_gra.7.entry: "$flavor_gra.7.title$" # todo: NEW TRANSLATION
 flavor_gra.7.title: "Znovuzískanie [ShowLocationNameWithNoTooltip('cordoba')]" # todo: NEW TRANSLATION
 flavor_gra.7.desc: "[target_location.GetRank.GetName] [target_location.GetName] bolo znovuzískané v mene [ROOT.GetCountry.GetReligion.GetGodName]. Kedysi išlo o kľúčové miesto pre $ADU$, a teraz si tu [target_character.GetName] a [ROOT.GetCountry.GetGovernment.GetCourtTitle] želajú obnoviť [ROOT.GetCountry.GetReligion.GetAdjective] vplyv, ktorý tu kedysi panoval." # todo: NEW TRANSLATION
 flavor_gra.7.a: "Musíme zachovať jeho [ROOT.GetCountry.GetReligion.GetAdjectiveWithNoTooltip] minulosť." # todo: NEW TRANSLATION
 gra_convert_cordoba_to_root_religion: "Niektorí [Concept('pops','populácie')|e] v [target_location.GetName] konvertujú na [ROOT.GetCountry.GetReligion.GetName]" # todo: NEW TRANSLATION # todo: COUNTRY CASE # todo: CONCEPT CASE
 gra_cordoba_province_gains_core: "Každá [Concept('location','lokalita')|e] v [Concept('province','provincii')|e] [target_location.GetProvinceDefinition.GetName] sa stane [Concept('core','jadro')|e] krajiny [ROOT.GetCountry.GetAltAdjective('G')]" # todo: NEW TRANSLATION # todo: COUNTRY CASE # todo: CONCEPT CASE
 flavor_gra.7.b: "Namiesto násilného obracania kohokoľvek na našu vieru bude lepšie prijať ich a začleniť." # todo: NEW TRANSLATION
 flavor_gra.8.entry: "$flavor_gra.8.title$" # todo: NEW TRANSLATION
 flavor_gra.8.title: "Klenot [ShowRegionNameWithNoTooltip('iberia_region')]" # todo: NEW TRANSLATION
 flavor_gra.8.desc: "V srdci [ShowRegionName('iberia_region')] leží [target_location.GetRank.GetName], ktoré je už dlho centrom kultúr [ShowReligionGroupAdjective('christian')], [ShowReligionGroupAdjective('muslim')] a [ShowReligionAdjective('judaism')]. Teraz je pod našou kontrolou a [ROOT.GetCountry.GetRank.GetName] bude môcť rozhodnúť o jeho osude.\n\n[ROOT.GetCountry.GetGovernment.GetCourtTitle] aj [target_character.GetName] si želajú, aby toto [target_location.GetRank.GetNameWithNoTooltip] dosiahlo ešte väčšieho rozkvetu. Všetky stavy prispeli k úsiliu premeniť [target_location.GetName] na klenot [ShowRegionNameWithNoTooltip('iberia_region')]." # todo: NEW TRANSLATION
 flavor_gra.8.a: "Nech [ShowLocationNameWithNoTooltip('toledo')] prekvitá!" # todo: NEW TRANSLATION
 flavor_gra.17.entry: "$flavor_gra.17.title$" # todo: NEW TRANSLATION
 flavor_gra.17.title: "Hlavné mesto starého kalifátu" # todo: NEW TRANSLATION
 flavor_gra.17.desc: "Sídlo v [ShowLocationName('cordoba')] zohráva pre krajinu [ROOT.GetCountry.GetAltAdjective('A')] už dlho významnú úlohu. Kedysi to bolo prosperujúce [ShowLocationRankName('city')] a hlavné mesto [ShowRegionName('iberia_region')]; jeho ulice sú však teraz plné zločinu, obyvatelia preklínajú úpadok, ktorý toto miesto postihol, a mnohé starobylé pamiatky zostávajú po našich konfliktoch s vládcami [ShowReligionGroupAdjective('christian')] v ruinách.\n\n[target_character.GetName] nedovolí, aby tento rozklad pokračoval. Kedysi to bolo prestížne miesto, odkiaľ vládli najmocnejšie osobnosti v [ShowContinentName('europe')], tak prečo by z neho [target_character.GetSheHe] nemal urobiť najväčšie hlavné mesto, aké kedy svet videl?" # todo: NEW TRANSLATION # todo: COUNTRY CASE
 flavor_gra.17.a: "[ShowLocationNameWithNoTooltip('cordoba')] bude opäť prekvitať!" # todo: NEW TRANSLATION
 flavor_gra.17.b: "Naše [ROOT.GetCountry.GetGovernment.GetCourtTitle] by sme mali ponechať tam, kde je." # todo: NEW TRANSLATION
 flavor_gra.21.entry: "$flavor_gra.21.title$" # todo: NEW TRANSLATION
 flavor_gra.21.title: "Palácové [ShowLocationRankNameWithNoTooltip('city')] [ShowLocationNameWithNoTooltip('cordoba')]" # todo: NEW TRANSLATION
 flavor_gra.21.desc: "Fitna 11. storočia uvrhla [ShowReligionGroupAdjective('muslim')] časť [ShowRegionName('iberia_region')] do chaosu a spolu s ňou zaniklo aj mnoho významných miest. Jedným z nich bol [ShowBuildingTypeName('madinat_al_zahra')], veľkolepý palác, ktorý sa rozprestieral na západnom okraji [ShowLocationName('cordoba')]. Bol plný honosných mešít, nádherných záhrad a dobre vyzbrojených kasární a slúžil ako symbol nadradenosti $rank_empire_muslim_ruler_male$ nad zvyškom [ShowReligionGroupAdjectiveWithNoTooltip('muslim')] sveta.\n\n[target_character.GetName] si želá toto [ShowLocationRankName('city')] obnoviť a postaviť [target_character.GetHerselfHimself] tak nad ostatných vládcov a uchádzačov o moc, ktorí by mohli [target_character.GetHerHim] vyzvať." # todo: NEW TRANSLATION
 flavor_gra.21.a: "Uvidia našu prestíž!" # todo: NEW TRANSLATION
 flavor_gra.21.b: "Staré ruiny netreba obnovovať." # todo: NEW TRANSLATION
 flavor_gra.22.entry: "$flavor_gra.22.title$" # todo: NEW TRANSLATION
 flavor_gra.22.title: "[ShowBuildingTypeNameWithNoTooltip('library_cordoba')]" # todo: NEW TRANSLATION
 flavor_gra.22.desc: "Obnovenie [ShowBuildingTypeName('library_cordoba')] prinieslo obyvateľom [ShowLocationName('cordoba')] novú éru literárneho rozkvetu.\n\nTak ako za starých čias, učenci z celého [ShowReligionGroupAdjective('muslim')] sveta prichádzajú do [ShowLocationNameWithNoTooltip('cordoba')], aby využili bohatú zbierku kníh o literatúre, vede, teológii a mnohých ďalších odboroch. To prinieslo prosperitu aj občanom, ktorí sa dozvedajú o vzdialených kultúrach a mnohé z ich zvykov prijali za svoje." # todo: NEW TRANSLATION
 flavor_gra.22.a: "Obyvatelia [ShowLocationNameWithNoTooltip('cordoba')] zažijú skutočný rozkvet!" # todo: NEW TRANSLATION
 add_pop_satisfaction_based_on_literacy: "Každá [Concept('pop','populácia')|e] v [Concept('location','lokalite')|e] získa [ShowNamedValue('pop_satisfaction_extreme_bonus')|+=2%] [Concept('pop_satisfaction','spokojnosť populácie')|e], ktoré sa bude meniť v závislosti od [Concept('literacy','gramotnosti')|e] [pop]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 flavor_gra.23.entry: "$flavor_gra.23.title$" # todo: NEW TRANSLATION
 flavor_gra.23.title: "Útočisko vzdelanosti pre všetkých" # todo: NEW TRANSLATION
 flavor_gra.23.desc: "Vďaka našej liberálnej a inovatívnej politike sa krajina [ROOT.GetCountry.GetName] stala útočiskom poznania a múdrosti. Naši učenci sú ospevovaní zahraničnými vládcami a pokrok v oblasti vzdelanosti je čoraz zreteľnejší, keďže na štúdium na našich prestížnych univerzitách prúdi stále viac návštevníkov.\n\nSamotné [ROOT.GetCountry.GetGovernment.GetCourtTitle] je teraz plné vzdelanejších členov, ktorí si želajú rozvíjať akademickú obec odstránením zbytočných obmedzení v samotnom vzdelávacom systéme." # todo: NEW TRANSLATION
 flavor_gra.23.a: "Toto je pokrok pre nás!" # todo: NEW TRANSLATION
 flavor_gra.24.title: "Bašta [ShowReligionGroupNameWithNoTooltip('muslim')]" # todo: NEW TRANSLATION
 flavor_gra.24.desc: "Správy o našom víťazstve v boji o [ShowRegionName('iberia_region')] sa rozšírili po celom [ShowReligionGroupAdjective('muslim')] svete. Je to obrovský úspech, ktorý nám pomôže ďalej odolávať každej blížiacej sa búrke. V krajine [ROOT.GetCountry.GetAltAdjective('D')] teraz [target_character.GetName] oslavujú ako hrdinu, ochrancu a štít pred nepriateľmi, ktorí chcú uhasiť náš plameň." # todo: NEW TRANSLATION # todo: COUNTRY CASE
 flavor_gra.24.a: "Oslavujme." # todo: NEW TRANSLATION
 conquest_of_andalusi_integration_tt: "Dobývanie [Concept('locations','lokality')|e] s [Concept('pops','populáciami')|e] kultúry [ShowCultureName('andalusi')] prináša pokrok v [Concept('integration','integrácii')|e] úmerný zastúpeniu tejto [Concept('culture','kultúre')|e]" # todo: NEW TRANSLATION # todo: CONCEPT CASE

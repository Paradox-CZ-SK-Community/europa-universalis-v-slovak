l_polish:
 d009_el_dorado_events.1.title: "Mapa pochybného pôvodu" # todo: NEW TRANSLATION
 d009_el_dorado_events.1.desc: "Pri našom ohni sa objavia dvaja muži so sebaistotou skúsených klamárov: dezertéri, hazardní hráči či utečení trestanci, lebo ich príbeh sa pri každom rozprávaní mení. Jediné, čo sa nemení, je mapa, ktorú nesú — mastný štvorcový kus kože, na ktorom sa tlačia zlaté jazerá, hory z čistého striebra a mestá vykreslené veľkolepejšie než čokoľvek, čo by mohlo naozaj existovať. Prisahajú na život, že každá pamiatka na mape je pravá, no náš seržant poznamenáva, že ich životy nestoja za veľa. Napriek tomu je to jediná mapa, ktorú máme, a odvážne nasledovanie falošnej stopy už nejednu výpravu zaviedlo ďalej než poctivé odmietnutie zo strachu." # todo: NEW TRANSLATION
 d009_el_dorado_events.el_dorado_desc: "El Dorado, Pozlátený, vzniklo ako skutočný obrad medzi Muiscami z kolumbijských vysočín, pri ktorom nového vládcu posypali zlatým prachom a na člne ho vypravili na jazero Guatavita, aby do jeho vôd vhádzal obetné dary zo zlata a smaragdov. V podaniach španielskych a neskôr anglických dobrodruhov sa pozlátený muž zmenil na zlaté mesto, potom na skryté kráľovstvo a napokon na celú stratenú ríšu, ktorej údajná poloha sa stále vzďaľovala do vnútrozemia — od Ánd cez Orinoko až po lesy Guyany. Pátranie pohltilo celú generáciu výprav: Jiménez de Quesada, Belalcázar aj katastrofálna výprava Gonzala Pizarra a Francisca de Orellanu, ktorá nenašla zlato, no priniesla prvú európsku plavbu po Amazonke. Neskoršie výpravy sa končili vzburami, najznámejšie pod vedením Lopeho de Aguirreho, zatiaľ čo iní sa namáhali vypustiť samotné jazero Guatavita a za obrovskú cenu získali len neveľký poklad. Nijaké kráľovstvo nikdy nenašli, pretože nikdy neexistovalo, no táto legenda prežila všetkých, ktorí za ňou zahynuli." # todo: NEW TRANSLATION
 d009_el_dorado_events.1.a: "Je to najlepšia mapa, akú máme. Nasledujme ju." # todo: NEW TRANSLATION
 d009_el_dorado_events.1.b: "Pošlite tých darebákov preč." # todo: NEW TRANSLATION
 d009_el_dorado_events.1.b.tt: "#italic Vyženieme darebákov a pokračujeme bez ich mastnej mapy#!" # todo: NEW TRANSLATION
 new_location_grants_clue_for_el_dorado: "#Y [target_new_waypoint.GetName] poskytuje stopu k El Doradu#!" # todo: NEW TRANSLATION
 cartographer_cannot_read: "#Y Kartografove čitateľské schopnosti zabrzdia [Concept('expedition','výprava')|e]#!" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 gasp_its_a_trap: "#Y [Concept('expedition','Výprava')|e] zahynie pri prepade — bola to pasca!#!" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 will_reduce_our_chances_to_uncovering_goal_tt: "Zníži to naše šance odhaliť, čo hľadáme" # todo: NEW TRANSLATION
 d009_el_dorado_events.2.title: "Pamiatky si odporujú" # todo: NEW TRANSLATION
 d009_el_dorado_events.2.desc: "Mapa sa tentoraz takmer zhoduje s krajinou. Vytesaná modla stojí na hrebeni presne tam, kde to sľuboval pergamen, až po výčnelok jej kamennej čeľuste. Veľký vodopád, ktorý by mal hrmieť na východ od nej, však namiesto toho padá na západ a dvojvršie za ním sa dvíha v úplne opačnom poradí. Buď bol kartograf nedbalý, alebo zakreslil miesto, o ktorom iba počul, alebo nám krajinu opísali ľudia, ktorí by nás radi videli, ako sa v nej stratíme. [target_leader.GetName] obracia pergamen sem a tam, akoby pravda mohla byť napísaná na jeho zadnej strane." # todo: NEW TRANSLATION
 d009_el_dorado_events.2.a: "Mapa sa dosť približuje. Pochodujme ďalej." # todo: NEW TRANSLATION
 d009_el_dorado_events.2.b: "Podľa mapy klamára nepôjdeme naslepo." # todo: NEW TRANSLATION
 d009_el_dorado_events.2.b.tt: "#italic Odložíme falošnú mapu a budeme sa v krajine pred nami spoliehať na vlastné oči#!" # todo: NEW TRANSLATION
 the_expedition_doublebacks: "#Y [Concept('expedition','Výprava')|e] sa vracia po už prejdenej trase a vzácne dni ubiehajú#!" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 press_on_regardless: "#Y Pokračujeme napriek všetkému a dôverujeme pergamenu viac než vlastným očiam#!" # todo: NEW TRANSLATION
 extort_locals: "#Y Násilím vymáhame od miestnych zásoby a pokyny#!" # todo: NEW TRANSLATION
 d009_el_dorado_events.3.title: "Presne toto sme chceli počuť" # todo: NEW TRANSLATION
 d009_el_dorado_events.3.desc: "Zajatca privedú pred [target_leader.GetName] a on sa celý trasie. Povie nám všetko, čo sme dúfali, že sa dozvieme: áno, zlatý vládca skutočne existuje; áno, jeho dvor leží len niekoľko dní plavby proti prúdu; áno, aj strechy sú pokryté zlatom, ktoré každú jar snímu a znovu roztavia. Je to nádherný príbeh, podaný s rozžiarenými, dychtivými očami muža, ktorý presne pochopil, čo jeho vypočúvatelia precestovali celý kontinent nájsť. Náš tlmočník odvedie [target_leader.GetName] nabok a zamrmle varovanie: vystrašený človek prisahá, že obloha je zelená, ak verí, že tým ozbrojených cudzincov odláka od svojej dediny. Problém je, že každé jeho slovo je zároveň presne tým, čo sme si želali počuť." # todo: NEW TRANSLATION
 d009_el_dorado_events.3.a: "Vypočujme ho do najmenších podrobností." # todo: NEW TRANSLATION
 d009_el_dorado_events.3.b: "Odmeňme úprimnosť, nie lichôtky." # todo: NEW TRANSLATION
 d009_el_dorado_events.3.c: "Vynúťme si z neho pravdu." # todo: NEW TRANSLATION
 guide_told_us_what_we_wished: "#Y Sprievodca nám povedal iba to, čo sme chceli počuť, a stopa nikam nevedie#!" # todo: NEW TRANSLATION
 fear_loosens_the_guides_tongue: "#Y Strach rozviaže sprievodcovi jazyk a jeho výpoveď znie pravdivo#!" # todo: NEW TRANSLATION
 forced_confession_breeds_hatred_tt: "Náš [Concept('cultural_opinion','kultúrny názor')|e] o kultúre [target_location.GetDominantCulture.GetName] sa zhorší" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 d009_el_dorado_events.4.title: "Odmena hodná zdržania" # todo: NEW TRANSLATION
 d009_el_dorado_events.4.desc: "Stopári sa vracajú bez dychu: deň pochodu od našej trasy, v údolí, do ktorého sme vôbec nemali vkročiť, leží mestečko bohatšie než čokoľvek, čo sme od pobrežia videli. Terasovité polia, plné sýpky, spracované zlato ligotajúce sa na hrdlách jeho obyvateľov. Nie je to mesto, ktoré sme mali nájsť, a ak odbočíme, stratíme týždne, ktoré si toto ročné obdobie nemôže dovoliť. Muži však ten ligot už zazreli a kolóna, ktorá obíde zlato, ktoré vidí, a pritom naháňa zlato, o ktorom iba počula, začne klásť svojmu veliteľovi nepríjemné otázky." # todo: NEW TRANSLATION
 d009_el_dorado_events.4.a: "Odbočme k bohatému sídlisku." # todo: NEW TRANSLATION
 d009_el_dorado_events.4.b: "Vezmime si len to, čo nám dobrovoľne ponúknu." # todo: NEW TRANSLATION
 d009_el_dorado_events.4.c: "Držme sa kurzu." # todo: NEW TRANSLATION
 d009_el_dorado_events.4.c.tt: "#italic Pochodujeme popri zlate, ktoré vidíme, a zachovávame vernosť zlatu, ktoré nám sľúbili#!" # todo: NEW TRANSLATION
 a_modest_haul: "#Y Sídlisko prispeje do našej pokladnice skromnou korisťou#!" # todo: NEW TRANSLATION
 a_peaceful_exchange: "Pokojná výmena obohatí to, čo si odnesieme domov" # todo: NEW TRANSLATION
 d009_el_dorado_events.5.title: "Dobre strážený poklad" # todo: NEW TRANSLATION
 d009_el_dorado_events.5.desc: "Za líniou stromov stojí miesto, ku ktorému sa sprievodcovia odmietajú priblížiť: opevnená svätyňa s bránou zdobenou opracovaným zlatom a hradbami lemovanými tichými, ostražitými mužmi. Čokoľvek sa ukrýva vo vnútri, zjavne stojí za to, aby zaň niekto položil život — a podľa našich dôstojníkov teda zjavne stojí za to, aby sme si ho vzali. [target_leader.GetName] zvažuje počet kopijníkov oproti váhe tých dverí a výsledok ho príliš neteší. Je tu zlato, ktoré si môžeme vziať, ak sme ochotní zaplatiť zaň niečím iným než striebrom." # todo: NEW TRANSLATION
 d009_el_dorado_events.5.a: "Zmocnime sa pokladu silou." # todo: NEW TRANSLATION
 d009_el_dorado_events.5.b: "Opatrne vyjednajme o podiele." # todo: NEW TRANSLATION
 d009_el_dorado_events.5.c: "Je príliš dobre strážený. Nechajme ho tak." # todo: NEW TRANSLATION
 d009_el_dorado_events.5.c.tt: "#italic Zvážime hradby a korisť a poklad prenecháme jeho strážcom#!" # todo: NEW TRANSLATION
 the_hoard_is_seized: "#Y Zmocníme sa pokladu a jeho zlato zväčší to, čo si odnesieme domov#!" # todo: NEW TRANSLATION
 a_wary_bargain: "Opatrným vyjednávaním získame podiel z pokladu" # todo: NEW TRANSLATION

l_polish:
 textiles: "Textil" # todo: NEW TRANSLATION
 textiles_desc: "Tkanie a výroba látok, od obyčajnej vlny až po jemné luxusné tkaniny. Podpora textilnej výroby zvyšuje dopyt po látkach v celej krajine a urýchľuje vznik tkáčskych dielní a manufaktúr vo vybranej oblasti." # todo: NEW TRANSLATION
 crafts: "Remeslá" # todo: NEW TRANSLATION
 crafts_desc: "Výroba nástrojov, opracovanej ocele, kožených výrobkov a murárskych prác remeselníkmi a cechmi. Základ kvalifikovaných remesiel v meste." # todo: NEW TRANSLATION
 arms: "Zbrojárstvo" # todo: NEW TRANSLATION
 arms_desc: "Výroba zbraní a časom aj strelných zbraní a diel. Podporované zbrojárstvo zásobuje armády z domácich kováční." # todo: NEW TRANSLATION
 luxury: "Luxusný tovar" # todo: NEW TRANSLATION
 luxury_desc: "Hodnotné remeselné výrobky, ako sklo, šperky, porcelán a lakovaný tovar. Prestížne odvetvia, ktoré prinášajú bohatstvo mešťanom, ktorí ich ovládajú." # todo: NEW TRANSLATION
 paper_goods: "Papierový tovar" # todo: NEW TRANSLATION
 paper_goods_desc: "Papierne a tlač kníh. Podporuje gramotnosť a správu krajiny rovnako ako obchod." # todo: NEW TRANSLATION
 furnishings: "Bytové zariadenie" # todo: NEW TRANSLATION
 furnishings_desc: "Nábytok a keramika pre domácnosti všetkých spoločenských vrstiev." # todo: NEW TRANSLATION
 naval: "Lodné zásoby" # todo: NEW TRANSLATION
 naval_desc: "Lodné zásoby a decht, materiály potrebné na stavbu a údržbu flotíl." # todo: NEW TRANSLATION
 beverages: "Nápoje" # todo: NEW TRANSLATION
 beverages_desc: "Víno, liehoviny a pivo. Smädný trh prináša úžitok regiónom, ktoré ho zásobujú." # todo: NEW TRANSLATION

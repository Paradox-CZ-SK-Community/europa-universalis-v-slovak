 game_concept_industry_promotion_desc: "Podpora odvetvia vyhradí jednu [Concept('area','oblasť')|e] pre konkrétne priemyselné odvetvie. Každé odvetvie zahŕňa určitý súbor [Concept('goods','tovary')|e]: jeho podporou sa zvýši [Concept('output','produkcia')|e] každej [Concept('building','budove')|e] v danej [area], ktorá vyrába tento [goods], a zároveň sa zvýši dopyt, ktorý po nich majú tvoje [Concept('pops','populácie')|e] v celej [Concept('country','krajine')|e].\n\nPodpora odvetvia vyžaduje [advance_icon][ShowAdvanceName('industry_promotion_advance')] [Concept('advance','pokrok')|e]. Počet odvetví, ktoré môžeš podporovať naraz, určuje $MODIFIER_TYPE_NAME_possible_industry_promotions$. Tento počet sa zvyšuje s hodnosťou tvojej [country], tvojimi [Concept('government_reforms','vládnymi reformami')|e] a neskoršími [advances]. Podporu môžeš kedykoľvek zrušiť a uvoľniť tak jej miesto." # todo: NEW TRANSLATION # todo: CONCEPT CASE

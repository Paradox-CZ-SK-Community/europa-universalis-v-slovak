l_polish:
 lutheranism_movement: "Luteránstvo" # todo: NEW TRANSLATION
 lutheranism_movement_desc: "Protestantská reformácia sa šíri celým kresťanstvom. Učenie Martina Luthera vyvolalo náboženské otrasenie, ktoré spochybňuje autoritu Katolíckej cirkvi a rýchlo sa šíri medzi nespokojnými obyvateľmi." # todo: NEW TRANSLATION
 lutheranism_movement_location_modifier: "$lutheranism_movement$ Modifikátor" # todo: NEW TRANSLATION
 calvinism_movement: "Kalvinizmus" # todo: NEW TRANSLATION
 calvinism_movement_desc: "Inšpirované reformovanou teológiou Johna Calvina, toto hnutie rozširuje prísnejšiu a systematickejšiu formu protestantskej doktríny, ktorá oslovuje najmä obchodnícke vrstvy a mestské obyvateľstvo Európy." # todo: NEW TRANSLATION
 calvinism_movement_location_modifier: "$calvinism_movement$ Modifikátor" # todo: NEW TRANSLATION

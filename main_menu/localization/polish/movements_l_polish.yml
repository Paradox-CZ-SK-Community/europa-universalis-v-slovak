 roman_culture_movement_allow_tt: "[GetCountry('BYZ').GetName] sa musí prikláňať k [ShowSocietyDirectionName('latinization')] a vlastniť [Concept('urban_location','mestskej lokalite')|e] s [ShowLanguageFamilyName('romance_language_family')] [Concept('dominant_language','dominantným jazykom')|e], ktorý má [Concept('average_satisfaction','priemerná spokojnosť')|e] nad 50%." # todo: NEW TRANSLATION # todo: CONCEPT CASE

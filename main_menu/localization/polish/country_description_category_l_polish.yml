 difficulty_level_name_1: "#G Veľmi ľahké #!" # todo: NEW TRANSLATION
 difficulty_level_desc_1: "#T Veľmi ľahké #!\nTento [Concept('country','krajina')|e] má #G veľmi ľahkú#! počiatočnú pozíciu a je odporúčaný pre #G Novice#!.\n\n#G Veľmi ľahké#! [countries] zvyčajne majú zvládnuteľnú veľkosť, patria do jedného [Concept('market','trhu')|e], majú slabších alebo veľmi priateľských susedov a nie sú obmedzené špeciálnymi mechanikami." # todo: CHANGED # todo: CONCEPT CASE
 difficulty_level_name_2: "#G Ľahké #!" # todo: NEW TRANSLATION
 difficulty_level_desc_2: "#T Ľahké #!\nTento [Concept('country','krajina')|e] má #G ľahkú#! počiatočnú pozíciu a odporúča sa pre #G Novice#!.\n\n#G Ľahké#! [countries] zvyčajne majú zvládnuteľnú veľkosť, patria do jedného [Concept('market','trhu')|e] a majú slabších alebo priateľských susedov." # todo: CHANGED # todo: CONCEPT CASE
 difficulty_level_name_3: "#W Stredné #!" # todo: CHANGED
 difficulty_level_desc_3: "#T Stredné #!\nTento [Concept('country','krajina')|e] má strednú obtiažnosť a je odporúčaný, ak už poznáte základy hry.\n\n#W Stredné#! [countries] zvyčajne majú väčšiu veľkosť, zasahujú do viacerých [Concept('markets','trhov')|e] a ich susedia môžu predstavovať väčšiu hrozbu, ohrozujúc ich prežitie.\n\n#W Stredné#! [countries] môžu byť tiež už od začiatku zapojené do špeciálneho obsahu ako [Concept('situations','situácie')|e], [Concept('disasters','katastrofy')|e] alebo [Concept('international_organizations','medzinárodné organizácie')|e], čo môže spôsobiť, že ich štýl hrania sa bude líšiť od normy." # todo: CHANGED # todo: CONCEPT CASE
 difficulty_level_name_4: "#R Ťažké #!" # todo: NEW TRANSLATION
 difficulty_level_desc_4: "#T Ťažké #!\nHrať sa za [Concept('country','krajinu')|e] je #R Ťažké#! a je najlepšie sa mu vyhnúť, kým neovládnete základy #italic Europa Universalis V#!.\n\n#R Ťažké#! [countries] sú buď zložité na vnútorné riadenie, pretože sú príliš veľké a komplikované na spravovanie; alebo veľmi zraniteľné voči silnejším susedom už od začiatku." # todo: CHANGED # todo: CONCEPT CASE
 difficulty_level_name_5: "#R Veľmi ťažké #!" # todo: NEW TRANSLATION
 difficulty_level_desc_5: "#T Veľmi ťažké #!\nHrať sa za [Concept('country','krajinu')|e] je #R Veľmi ťažké#! a je najlepšie sa mu vyhnúť, kým sa nestanete majstrom #italic Europa Universalis V#!.\n\n#R Veľmi ťažké#! [countries] sú buď veľmi zložité na vnútorné riadenie, pretože sú príliš veľké a komplikované na spravovanie; alebo extrémne zraniteľné voči silnejším susedom už od začiatku." # todo: CHANGED # todo: CONCEPT CASE

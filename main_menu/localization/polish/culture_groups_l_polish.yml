 steppe_group: "Stepná skupina" # todo: NEW TRANSLATION
 steppe_group_desc: "$steppe_group$ tvoria rôzne kultúry patriace do $mongolian_group$ a $tatar_group$, ktoré žijú na stepiách Eurázie." # todo: CHANGED
 rhaetian_group: "Rhaetian" # todo: NEW TRANSLATION
 rhaetian_group_desc: "Ľudia $rhaetian_group$ sú etnolingvistickou skupinou zloženou z troch hlavných alpských spoločenstiev: Romansh, Ladins a Friulians. Hoci nezdieľajú jednotný politický útvar, spája ich pôvod v bežnom vulgárnom latinskom substráte zmiešanom so starými ráetskymi a keltskými vplyvmi." # todo: NEW TRANSLATION
 hmong_mien_group: "Hmong-Mien" # todo: NEW TRANSLATION
 hmong_mien_group_desc: "Národy Hmong‑Mien obývajú vysočiny južnej Číny a juhovýchodnej Ázie a hovoria jazykmi nezávislej Hmong‑Mien rodiny, nesúvisiacimi so žiadnym z ich susedov. Známí sú svojimi pestrofarebnými textilnými tradíciami a tvrdohlavou nezávislosťou; historicky odolávali asimilácii do nížinných impérií okolo nich." # todo: NEW TRANSLATION
 papuan_group: "Papuan" # todo: NEW TRANSLATION
 papuan_group_desc: "Papuánske národy sú domorodými obyvateľmi Novej Guiney a susedných ostrovov, hovoriacimi stovkami jazykov z rôznorodých a vo veľkej miere nesúvisiacich jazykových rodín, súhrnne označovaných ako papuánske. Ich pozoruhodná jazyková a kultúrna rozmanitosť odráža tisícky rokov izolovaného vývoja v drsnom teréne ostrova." # todo: NEW TRANSLATION
 atlantic_group: "Atlantic" # todo: NEW TRANSLATION
 atlantic_group_desc: "Atlantické národy západnej Afriky obývajú pobrežia a savany od Senegambie po Sierra Leone a hovoria jazyky atlantickej vetvy niger‑kongó jazykovej rodiny. Zahŕňajú veľkých jazdcov a obchodníkov pobrežia Senegambie aj lesné národy Mel vo vnútrozemí Sierra Leone." # todo: NEW TRANSLATION
 kru_group: "Kru" # todo: NEW TRANSLATION
 kru_group_desc: "Kru národy liberijského a ivorijského pobrežia hovoria jazykmi vetvy Kru v niger‑kongó rodine a sú známi svojou námornou zručnosťou a tvrdým odporom proti zotročovaniu. Ich námorné tradície ich po stáročia robili cenými námorníkmi pozdĺž západoafrického pobrežia." # todo: NEW TRANSLATION
 kwa_group: "Kwa" # todo: NEW TRANSLATION
 kwa_group_desc: "Kwa národy Zlatého pobrežia a Beninského zálivu hovoria jazykmi vetvy Kwa v niger‑kongó rodine, pričom zahŕňajú akanovské štáty vnútrozemia a pobrežné kráľovstvá Ewe a Fon. Ich spoločnosti sú poznačené matrilineárnym dedičstvom medzi Akanmi a silnou vodunskou náboženskou tradíciou medzi Fonmi a Ewe." # todo: NEW TRANSLATION
 volta_niger_group: "Volta-Niger" # todo: NEW TRANSLATION
 volta_niger_group_desc: "Národy Volta‑Niger v oblasti Nigérie hovoria jazykmi vetvy Volta‑Niger niger‑kongó rodiny a zahŕňajú niektoré z najhustejšie osídlených a politicky sofistikovaných spoločností v západnej Afrike. Meštianske mestské štáty Yoruba, dedinské republiky Igbo a Beninské kráľovstvo patria medzi najvýznamnejšie politické útvary na kontinente." # todo: NEW TRANSLATION
 bantu_group: "Bantu" # todo: NEW TRANSLATION
 bantu_group_desc: "Banťanské národy tvoria najväčšiu jazykovú skupinu v subsaharskej Afrike; ich expanzia z oblasti pri hraniciach Kamerunu a Nigérie rozšírila banťanské jazyky a poľnohospodárske praktiky cez strednú, východnú a južnú Afriku počas troch tisícročí. Dnes banťanské jazyky hovoria takmer v celej južnej polovici kontinentu." # todo: NEW TRANSLATION
 central_african_group: "Central African" # todo: NEW TRANSLATION
 central_african_group_desc: "Národy strednej Afriky obývajú rozsiahly Kongo basén a okolité vysočiny a hovoria jazykmi adamawa, ubangian a príbuzných rodín. Ich kultúry sú tak rozmanité ako dažďové pralesy, savany a rieky, ktoré nazývajú domovom – od lesných Baka až po riečnych obchodníkov veľkých prítokov Konga." # todo: NEW TRANSLATION
 nilotic_group: "Nilotic" # todo: NEW TRANSLATION
 nilotic_group_desc: "Nílotské národy sú pastevné a polopastevné komunity v údolí Nilu a na rovínach východnej Afriky, hovoriace jazyky nilotskej vetvy nilo‑saharskej rodiny. Od dobytkárskych Masajov v Rift Valley až po rybárov v Sudd, spája ich veková štruktúra spoločnosti a hlboká závislosť na dobytku." # todo: NEW TRANSLATION
 nilosahelian_group: "Nilo-Saharan" # todo: NEW TRANSLATION
 nilosahelian_group_desc: "Nilo‑saharské národy obývajú široký pás od Sahary po etiopské vysočiny a hovoria jazyky rozmanitej nilo‑saharskej rodiny. Zahŕňajú roľníkov z hôr Nuba, obchodníkov sultanátov Dárfúru a nomádov na saharskom okraji." # todo: NEW TRANSLATION
 cushitic_group: "Cushitic" # todo: NEW TRANSLATION
 cushitic_group_desc: "Kušitické národy rohu Afriky a údolia Nilu hovoria jazykmi kušitickej vetvy afroázijskej rodiny. Zahŕňajú ťavích nomádov Somálska a Ogadénu, horských roľníkov etiopského riftu a starobylý ľud Beja pozdĺž pobrežia Červeného mora." # todo: NEW TRANSLATION
 khoisan_group: "Khoisan" # todo: NEW TRANSLATION
 khoisan_group_desc: "Khoisan národy južnej a východnej Afriky patria medzi najstaršie stále žijúce populácie na Zemi a hovoria jazykmi, ktoré sú známe svojimi pozoruhodnými klikovými súhláskami. Patrí sem San, lovci‑zberači Kalahari, a Khoikhoi, pastieri Kapska – ľudia, ktorí obývali južnú Afriku dávno pred banťanskou expanziou." # todo: NEW TRANSLATION
 permic_group: "Permic" # todo: NEW TRANSLATION
 permic_group_desc: "Permické národy oblasti Uralu hovoria jazykmi permickej vetvy uralskej rodiny, tesne príbuzné fínčine a estónčine. Komi a Udmurtovia dlhodobo obývajú lesy medzi Volgou a Uralom a obchodujú s kožušinami so svojimi slovanskými a tatárskymi susedmi." # todo: NEW TRANSLATION
 mordvinic_group: "Mordvinic" # todo: NEW TRANSLATION
 mordvinic_group_desc: "Mordvínske národy stredného Povolia Volgy hovoria jazykmi mordvínskej vetvy uralskej rodiny a tvoria jednu z najväčších domorodých skupín v európskom Rusku. Mokša a Erzja sú si navzájom blízke, no hovoria odlišné jazyky a udržiavajú samostatné kultúrne identity." # todo: NEW TRANSLATION
 pama_nyungan_group: "Pama-Nyungan" # todo: NEW TRANSLATION
 pama_nyungan_group_desc: "Pama‑Nyungan národy obývajú väčšinu austrálskeho kontinentu a hovoria jazykmi pama‑nyungan rodiny, ktoré pokrývajú približne osemdesiat percent územia Austrálie. Napriek obrovskej vnútorného rozmanitosti zdieľajú tieto národy široké kultúrne vzorce vrátane komplexných príbuzenských systémov, konceptu Dreamingu a spôsobu obživy založeného na love a zbere." # todo: NEW TRANSLATION
 australian_group: "Australian Aboriginal" # todo: NEW TRANSLATION
 australian_group_desc: "Aborigénske národy Austrálie patria medzi najstaršie kontinuálne kultúry na Zemi; obývajú kontinent minimálne 65 000 rokov. Ich hlboké puto k zemi, vyjadrené cez koncept Dreamingu, a ich sofistikované ekologické vedomosti ich robia jedinečnými medzi národmi sveta." # todo: NEW TRANSLATION
 east_african_coast_group: "Swahili Coast" # todo: NEW TRANSLATION
 east_african_coast_group_desc: "Obyvatelia Swahili Coast vybudovali charakteristickú námornú civilizáciu pozdĺž pobrežia Indického oceánu východnej Afriky, spájajúc banťanské poľnohospodárske tradície s obchodnou kultúrou arabských a perzských obchodníkov. Ich koralovo‑kamenné mestské štáty od Mogadishu po Kilwu tvorili africký koniec veľkej indickomorskej obchodnej siete." # todo: NEW TRANSLATION
 great_lakes_kingdoms_group: "Great Lakes Kingdoms" # todo: NEW TRANSLATION
 great_lakes_kingdoms_group_desc: "Národy regiónu Veľkých afrických jazier vyvinuli niektoré z najsofistikovanejších štátnych štruktúr v subsaharskej Afrike, s hierarchickými kráľovstvami založenými na bohatstve dobytka a dedičnej kráľovskej moci. Od kráľovstva Buganda na severnom brehu Viktóriinho jazera až po terasovité kopce Rwandy, tieto medzi‑jazerové spoločnosti zdieľajú politickú kultúru tribútov, kráľovských dvorov a klanovej organizácie." # todo: NEW TRANSLATION
 east_african_nomad_group: "East African Pastoralist" # todo: NEW TRANSLATION
 east_african_nomad_group_desc: "Pastevné národy východnej Afriky sa pohybujú cez veľké savany a polopúštne pláně od etiopských vysočín po tanzánsku step, chovajúc dobytok, ťavy a kozy medzi sezónnymi pastvinami. Organizované cez vekové bojovnícke systémy a bez trvalých územných štátov, tvoria cezjazykový kultúrny svet presahujúci nilotské, kušitické a ďalšie jazykové rodiny." # todo: NEW TRANSLATION
 nguni_group: "Nguni" # todo: NEW TRANSLATION
 nguni_group_desc: "Nguni národy juhovýchodnej Afriky hovoria skupinu navzájom blízkych banťanských jazykov, ktoré sa vyznačujú bohatým systémom klikových súhlások prevzatých od susedných khoisan národov. Organizované okolo bohatstva dobytka, vekových systémov a mocných náčelníctiev, Nguni dali vznik veľkým národom Zulu a Xhosa, ktoré dominovali východnému pobrežiu južnej Afriky." # todo: NEW TRANSLATION
 sotho_tswana_group: "Sotho-Tswana" # todo: NEW TRANSLATION
 sotho_tswana_group_desc: "Sotho‑Tswana národy juhoafrického vysokohoria hovoria blízko príbuzné jazyky Sotho a Tswana a zdieľajú spoločné dedičstvo koncentrovaného dedinského života, bohatstva založeného na dobytku a vyspelých železiarskych tradícií. Ich veľké sídla na suchom náhornom plate patrili medzi najhustejšie osídlené predkoloniálne mestá južnej Afriky." # todo: NEW TRANSLATION
 shona_group: "Shona" # todo: NEW TRANSLATION
 shona_group_desc: "Shona hovoriace národy plošiny Zimbabwe a údolia Limpopo vybudovali jednu z najpozoruhodnejších predkoloniálnych civilizácií Afriky, sústredenú okolo veľkých kamenných komplexov Great Zimbabwe a ich nástupníckych štátov. Ich kontrola zlatých obchodných trás k indickomorskému pobrežiu z nich urobila obchodnú veľmoc, ktorej bohatstvo dosahovalo až do Číny a Perzie." # todo: NEW TRANSLATION
 kongo_group: "Kongo" # todo: NEW TRANSLATION
 kongo_group_desc: "Kongo národy dolného povodia Konga a atlantického pobrežia vyvinuli jeden z najcentralizovanejších štátov v subsaharskej Afrike, Kráľovstvo Kongo, so sofistikovanou byrokraciou, provinčnými guvernérmi a rozsiahlou menovou sústavou využívajúcou škrupiny nzimbu. Ich skoré stretnutie s portugalskými obchodníkmi koncom 15. storočia urobilo Kráľovstvo Kongo jedným z prvých afrických polytopov, ktorý sa diplomaticky zapojil do vzťahov s európskymi mocnosťami ako rovnocenný partner." # todo: NEW TRANSLATION
 luba_group: "Luba" # todo: NEW TRANSLATION
 luba_group_desc: "Luba a Lunda národy Katangskej plošiny a povodia Kasaï vybudovali prepojenú sieť tributárnych impérií, ktoré storočia dominovali jadru Strednej Afriky. Lubské impérium zaviedlo model božského kráľovstva v strednej Afrike a Lundané rozšírenie prenieslo ich politický systém vymenovaných guvernérov cez široký pás kontinentu od Angoly po Zambiu." # todo: NEW TRANSLATION
 chokwe_group: "Chokwe" # todo: NEW TRANSLATION
 chokwe_group_desc: "Chokwe národy angolskej plošiny sú preslávené svojimi výnimočnými umeleckými tradíciami, najmä maskami a drevorezbami, a svojou úlohou v diaľkových obchodných sieťach spájajúcich atlantické pobrežie s vnútrozemím Strednej Afriky. Pôvodne patrili pod Lunda impérium, v 19. storočí sa dramaticky rozšírili a stali sa jedným z dominantných národov regiónu." # todo: NEW TRANSLATION

 high_king: "Vysoký kráľ" # todo: NEW TRANSLATION
 high_king_desc: "$high_king$ je [Concept('international_organization_leader_short','líder')|e] [GetInternationalOrganizationType('high_kingship').GetName]. Môže existovať iba jeden $high_king$." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 high_kingship_region: "Región" # todo: CHANGED
 high_kingship_region_desc: "Územie, kde [GetInternationalOrganizationType('high_kingship').GetName] uplatňuje svoju autoritu." # todo: NEW TRANSLATION
 high_kingship_leader_title: "Práva a povinnosti $high_king$" # todo: NEW TRANSLATION
 high_kingship_leader_desc: "Je povinnosťou [ShowSpecialStatusName('high_king')] udržiavať keltské kmene zjednotené proti cudziemu útlaku.\n\nVo $high_kingship$ môže byť len jeden vodca a jeho vláda môže byť spochybnená. Držanie takejto kľúčovej pozície preto prináša veľkú prestíž, ale aj neustále nebezpečenstvo.\n\n[ShowSpecialStatusName('high_king')] môže [ShowGenericActionName('reclaim_high_kingship_land')] proti každému cudzím silám, ktoré držia pôdu v [Concept('region','regióne')|e].\n\nKoruna nie je nikdy bezpečná. Akýkoľvek člen môže spochybniť panovníka pomocou akcie [ShowCasusBelliName('cb_high_kingship_overthrow')], viesť vojnu a silou uchmatnúť titul." # todo: CHANGED # todo: CONCEPT CASE

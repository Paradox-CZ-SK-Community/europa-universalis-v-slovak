 high_kingship_desc: "Ako moc v priebehu tisícročí rastie a klesá, občas sa silný vodca zhromaždí dostatok moci a podpory na to, aby si prisvojil titul Vysokého kráľa, veľkého nadvládcu keltských národov." # todo: NEW TRANSLATION

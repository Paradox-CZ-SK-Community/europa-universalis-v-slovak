 HIGH_KINGSHIP_OUR_DISPOSITION_RIVALS: "$AI_DISPOSITION_RIVALS$ k nim" # todo: NEW TRANSLATION
 HIGH_KINGSHIP_OUR_DISPOSITION_COVETS: "$AI_DISPOSITION_COVETS$ k nim" # todo: NEW TRANSLATION
 HIGH_KINGSHIP_OUR_DISPOSITION_DOMINEERING: "$AI_DISPOSITION_DOMINEERING$ k nim" # todo: NEW TRANSLATION
 HIGH_KINGSHIP_OUR_DISPOSITION_PLANNING_WAR: "$AI_DISPOSITION_PLANNING_WAR$ k nim" # todo: NEW TRANSLATION
 high_kingship_members_title: "Príležitosti pre členov" # todo: NEW TRANSLATION
 high_kingship_members_desc: "Členstvo v $high_kingship$ nie je pouhou poctou; otvára cesty k moci, ktoré sú pre cudzincov zatvorené.\n\nPomocou [ShowGenericActionName('subjugate_high_kingship_member')] člen získa unikátny [Concept('casus_belli','casus Belli')|e], aby podrobil iného člena a prinútil ho stať sa [Concept('subject','vazala')|e].\n\nPomocou akcie [ShowGenericActionName('overthrow_high_king')] získa ambiciózny člen [Concept('casus_belli','casus Belli')|e] na vyzvanie vládnuceho [ShowSpecialStatusName('high_king')] o samotný titul." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 high_kingship_voting_title: "Stať sa $high_king$" # todo: NEW TRANSLATION
 high_kingship_voting_desc: "$high_kingship$ je voľný a nie dedičný. Jeho [Concept('international_organization_leader_short','lídra')|e] sa volí vždy, keď trón zostane prázdny, a musí získať aspoň #W 50%#! hlasov.\n\nHlas [Concept('member','člen')|e] rastie s jeho silou: jeho územia, pevnosti, [Concept('subjects','vazali')|e] a bohatstvo, a zdvojnásobuje sa po zvrhnutí [ShowSpecialStatusName('high_king')].\n\nKandidátov hodnotia predovšetkým [Concept('opinion','názor')|e] voliča, jeho [Concept('government_power','vládnej moci')|e] a [Concept('ability','schopnosť')|e] jeho [Concept('ruler','panovníka')|e]. Vysoký [Concept('country_rank','rang krajiny')|e], [Concept('alliance','aliancia')|e] alebo spoločný [Concept('rival','rival')|e] tiež pomáhajú.\n\nSúčasnému Vysokému kráľovi sa v hlasovaní ukladá penalizácia. Nikto nesmie podporiť [Concept('rival','rival')|e] alebo krajinu, s ktorou sú vo [Concept('war','vojne')|e], [Concept('loyal_subject','lojálnom vazalovi')|e] musí podporiť svojho [overlord|e], [Concept('disloyal_subject','nelojálneho vazala')|e] kohokoľvek iného a subjekt iného člena sa nemôže uchádzať.\n\nKorunu môžete tiež získať silou pomocou [ShowCasusBelliName('cb_high_kingship_overthrow')], ktorý zosadí Vysokého kráľa a vynúti si nové hlasovanie, v ktorom budete mať predpoklad na výhru." # todo: NEW TRANSLATION # todo: CONCEPT CASE

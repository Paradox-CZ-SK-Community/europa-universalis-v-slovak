 lordship_of_ireland: "Lordstvo Írska" # todo: NEW TRANSLATION
 lordship_of_ireland_desc: "Anglická nadvláda nad Írskom je vo vratkom stave. Od pôvodného dobytia okolo roku 1170 sa priama kontrola Koruny zúžila na zvyškovú správu okolo Dublinu. Spolieha sa na verného miestodržiteľa a v súčasnosti vykonáva len nominálnu kontrolu nad svojimi čoraz vzdialenejšími vazalmi. Potomkovia dobyvateľských dobrodruhov — hoci boli bohato odmenení grófstvami a baróniami — sa v jazyku a kultúre stále viac podobajú svojim gaelickým predchodcom, zatiaľ čo iní úplne unikli anglickej kontrole." # todo: NEW TRANSLATION

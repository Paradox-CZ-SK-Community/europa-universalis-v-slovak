 TATAR_YOKE_HINT_1: "Tatárske jarmo je pozostatkom stredoveku, ktoré upevňuje mongolskú nadvládu nad východoeurópskymi kniežatstvami.\n\nNie je možné sa k nemu pripojiť.\n\n#T Odporúčané opatrenia pre rôzne úlohy v Jarme#!\n@arrow_bonus_tier_3![ShowSpecialStatusName('tatar_overlord')] by mal udržiavať ostatných na uzde, zabraňujúc tomu, aby sa príliš zosilneli.\n@arrow_bonus_tier_3![ShowSpecialStatusName('tatar_tax_collector')] môže využiť svoju pozíciu na nahromadenie bohatstva a moci, čím sa ocitne v ideálnej pozícii na zvrhnutie [ShowSpecialStatusNameWithNoTooltip('tatar_overlord')].\n@arrow_bonus_tier_3!Bežný člen túži získať úlohu [ShowSpecialStatusName('tatar_tax_collector')] alebo sám zložiť jarmo." # todo: RETRANSLATED ENGLISH

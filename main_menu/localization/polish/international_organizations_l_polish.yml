 hre_court_assembly: "Dvorové zhromaždenie" # todo: NEW TRANSLATION
 hre_court_assembly_desc: "Od starých čias [GetCharacter('ogk_otto_liudolfinger').GetName] je $hre_court_assembly$ starobylý a primitívny štýl zhromaždenia v rámci [GetUniqueInternationalOrganization('hre').GetName]. V dôsledku nedostatku kodifikovaných procesov je diskusia o uplatnení zákonov s [GetUniqueInternationalOrganization('hre').GetLeaderTitle] menej efektívna, než by mohla byť.\n\n$BULLET_WITH_TAB$ Veľmi zvyšuje hlasovaciu silu pre [ShowSpecialStatusName('emperor')], [ShowSpecialStatusNamePlural('elector')], a [ShowSpecialStatusNamePlural('archbishop_elector')]\n$BULLET_WITH_TAB$ Výrazne znižuje vplyv [ShowSpecialStatusNamePlural('free_city')], [ShowSpecialStatusNamePlural('imperial_prelate')], [ShowSpecialStatusNamePlural('primas_germaniae')], a [ShowSpecialStatusNamePlural('legatus_natus')]\n$BULLET_WITH_TAB$ [ShowSpecialStatusNamePlural('imperial_peasant_republic')] majú štandardnú silu" # todo: NEW TRANSLATION
 hre_early_imperial_diet: "Skorý cisársky snem" # todo: NEW TRANSLATION
 hre_early_imperial_diet_desc: "Najskoršia forma [ShowLawName('imperial_diet_law')] predstavuje tradičný poriadok [GetInternationalOrganizationType('hre').GetName]. Iba [ShowSpecialStatusNamePlural('elector')], [ShowSpecialStatusNamePlural('archbishop_elector')], a [ShowSpecialStatusNamePlural('imperial_prince')] sa môžu zúčastňovať, pričom [ShowSpecialStatusNamePlural('free_city')] a nižšie cirkevné subjekty sú vylúčené z legislatívneho procesu.\n\n$BULLET_WITH_TAB$ Silná hlasovacia sila pre [ShowSpecialStatusNamePlural('emperor')], [ShowSpecialStatusNamePlural('elector')], [ShowSpecialStatusNamePlural('archbishop_elector')], a [ShowSpecialStatusNamePlural('imperial_prince')]\n$BULLET_WITH_TAB$ [ShowSpecialStatusNamePlural('free_city')] a [ShowSpecialStatusNamePlural('imperial_peasant_republic')] nemajú žiadnu hlasovaciu silu\n$BULLET_WITH_TAB$ Menšie cirkevné úlohy ako [ShowSpecialStatusNamePlural('imperial_prelate')], [ShowSpecialStatusNamePlural('primas_germaniae')], a [ShowSpecialStatusNamePlural('legatus_natus')] majú obmedzenú moc" # todo: NEW TRANSLATION
 hre_bi_camerial_imperial_diet: "Dvojkomorový cisársky snem" # todo: NEW TRANSLATION
 hre_bi_camerial_imperial_diet_desc: "[ShowParliamentTypeName('hre_bi_camerial_imperial_diet')] rozširuje zastúpenie tým, že udeľuje právo hlasovať cirkevným hodnostárom aj kniežacím vládcov, vytvárajúc dve komory v rámci snemu.\n\n$BULLET_WITH_TAB$ Štandardná sila pre [ShowSpecialStatusNamePlural('emperor')], [ShowSpecialStatusNamePlural('elector')], [ShowSpecialStatusNamePlural('archbishop_elector')], a [ShowSpecialStatusNamePlural('imperial_prince')]\n$BULLET_WITH_TAB$ [ShowSpecialStatusNamePlural('imperial_prelate')] získavajú významný vplyv\n$BULLET_WITH_TAB$ [ShowSpecialStatusNamePlural('free_city')] a [ShowSpecialStatusNamePlural('imperial_peasant_republic')] stále nemajú zastúpenie" # todo: NEW TRANSLATION
 hre_tri_camerial_imperial_diet: "Trojkomorový cisársky snem" # todo: NEW TRANSLATION
 hre_tri_camerial_imperial_diet_desc: "S [ShowParliamentTypeName('hre_tri_camerial_imperial_diet')] [ShowSpecialStatusNamePlural('free_city')] konečne získavajú rozhodujúci hlas. Cisársky snem teraz pozostáva z troch komôr — cirkevnej, kniežacej a občianskej — čo odráža inkluzívnejšiu rovnováhu moci.\n\n$BULLET_WITH_TAB$ Vyvážená moc medzi [ShowSpecialStatusName('emperor')], [ShowSpecialStatusNamePlural('elector')], [ShowSpecialStatusNamePlural('archbishop_elector')], [ShowSpecialStatusNamePlural('imperial_prince')], [ShowSpecialStatusNamePlural('free_city')], a menšími teokratickými úlohami\n$BULLET_WITH_TAB$ [ShowSpecialStatusNamePlural('imperial_peasant_republic')] tu získavajú najväčší vplyv\n$BULLET_WITH_TAB$ Najinkluzívnejšia forma snemu" # todo: NEW TRANSLATION

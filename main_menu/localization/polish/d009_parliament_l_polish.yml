 ahl_al_hall_wal_aqd_parliament: "Ahl al-Ḥall wa-l-'Aqd" # todo: NEW TRANSLATION
 ahl_al_hall_wal_aqd_parliament_desc: " #italic Ahl al-Ḥall wa-l-'Aqd#! — tí, ktorí rozväzujú a zväzujú — sú skupinou právnikov, učencov a vážených hodnostárov, ktorých spoločný súhlas tradične udeľoval islamským vládcom legitimitu a ktorých názor predstavoval potvrdenie zvrchovanej moci zo strany obce. Zvolávame túto radu ako formálnu poradnú inštitúciu našej ríše a dávame tak #italic 'ulamā'#! a popredným rodom organizovaný hlas v záležitostiach štátu. Rada, ktorá sa teší širokej podpore, premieňa autoritu učencov na trvalú legitimitu; bez zdrojov potrebných na jej udržiavanie majú jej rozhodnutia menšiu váhu a dosiahnutie súhlasu, ktorý upevňuje našu autoritu, je náročnejšie." # todo: NEW TRANSLATION
 tribal_jamaa_parliament: "Jamā'a" # todo: NEW TRANSLATION
 tribal_jamaa_parliament_desc: " #italic Jamā'a#! je starobylá inštitúcia kolektívnej správy Amazighov, v ktorej slobodní muži kmeňa — a náčelníci, ktorí ich zastupujú — na verejnom zhromaždení rokujú o otázkach vojny, spravodlivosti a využívania zdrojov. Uznávame #italic Jamā'a#! ako formálny parlamentný orgán našej ríše a opierame tak našu autoritu o súhlas kmeňových spoločenstiev, ktoré tvoria jej základ. Fungujúce zhromaždenie zapája tieto spoločenstvá do politického života štátu a poskytuje ich krivdám pokojný spôsob riešenia; bez zdrojov na jeho podporu stráca zhromaždenie právomoc zvolávať sa a kmene sa uchyľujú k samostatnému konaniu." # todo: NEW TRANSLATION

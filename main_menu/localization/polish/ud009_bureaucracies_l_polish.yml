l_polish:
 dar_al_tiraz_bureaucracy: "Dār al-Ṭirāz" # todo: NEW TRANSLATION
 dar_al_tiraz_bureaucracy_desc: "Okázalé vyšívané odevy pochádzajúce z Perzie sa v islamskom svete už dlho používajú ako čestné rúcha, ktorými panovník obdarúva svojich obľúbencov. Dobre financovaná kráľovská dielňa #italic $dar_al_tiraz_bureaucracy$#!, v ktorej sa tká hodváb, brokát a výšivky, zaodeje dvor do nádhery a vyšle vzácne látky na každý trh." # todo: NEW TRANSLATION
 diwan_al_mustakhlas_bureaucracy: "Dīwān al-Mustaḵlaṣ" # todo: NEW TRANSLATION
 diwan_al_mustakhlas_bureaucracy_desc: "#italic $diwan_al_mustakhlas_bureaucracy$#! spravuje sultánove súkromné majetky, mlyny a príjmy, oddelené od štátnej pokladnice, ktoré financujú dvor a $alhambra$. Starostlivá správa udržiava korunu bohatú a nezávislú vďaka jej majetkom, no nedostatočný dohľad zvádza samotných úradníkov, ktorí ju spravujú, aby odvádzali jej bohatstvo do vlastných pokladníc." # todo: NEW TRANSLATION
 diwan_al_qawafil_bureaucracy: "Dīwān al-Qawāfil" # todo: NEW TRANSLATION
 diwan_al_qawafil_bureaucracy_desc: "#italic $diwan_al_qawafil_bureaucracy$#! dohliada na veľké karavány transsaharského obchodu, na trasy cez Sijilmāsu, ktorými sa na sever preváža zlato a otroci a na juh soľ a látky. Dobre vedený úrad chráni obchodníkov aj ich zvieratá a rozmnožuje bohatstvo putujúce cez púšť. Inak sa karavány môžu stať korisťou nájazdníkov a kmene piesočných krajov sa obrátia proti moci, ktorá už nezabezpečuje cestu." # todo: NEW TRANSLATION
 ghuzat_mujahidin_bureaucracy: "Al-Ḡuzāt al-Mujāhidīn" # todo: NEW TRANSLATION
 ghuzat_mujahidin_bureaucracy_desc: "#italic $ghuzat_mujahidin_bureaucracy$#! sú dobrovoľníci viery, severoafrická jazda, ktorá pod vedením vlastného $rank_county_arabic_ruler_male$ prekračuje prieliv, aby viedla svätú vojnu na hranici. Títo horliví bojovníci bojujú s nadšením prameniacim z oddanosti a ich zbožnosť inšpiruje náš ľud, aby nasledoval ich zápal." # todo: NEW TRANSLATION
 makhzan_bureaucracy: "Al-Maḵzan" # todo: NEW TRANSLATION
 makhzan_bureaucracy_desc: "#italic $makhzan_bureaucracy$#! je ústredným aparátom sultánovej moci a jeho vyberači daní a miestodržitelia šíria vôľu trónu. Silný #italic maḵzan#! upevňuje vládu koruny nad vzdialenými kmeňmi a mestami, no keď jeho správa ochabne, krajina sa naozaj stáva #italic bilād as-sība#!, krajinou neposlušnosti, a odľahlé provincie sa prikláňajú k vzbure a autonómii." # todo: NEW TRANSLATION
 marinid_madaris_bureaucracy: "Ri'āyat al-Madāris" # todo: NEW TRANSLATION
 marinid_madaris_bureaucracy_desc: "#italic $marinid_madaris_bureaucracy$#! predstavuje kráľovskú podporu madras, škôl, ktoré vzdelávajú právnikov, pisárov a úradníkov, od ktorých závisí štát. Veľkorysé obdarovanie týchto škôl napĺňa štátnu radu vzdelanými a lojálnymi služobníkmi a upevňuje formálne právo právnických škôl." # todo: NEW TRANSLATION
 qadi_al_jamaa_bureaucracy: "Qāḍī al-Jamā'a" # todo: NEW TRANSLATION
 qadi_al_jamaa_bureaucracy_desc: "#italic $qadi_al_jamaa_bureaucracy$#! je najvyšším sudcom obce, ktorý predsedá súdom $maliki_school$ a vymenúva mnohých miestnych qāḍī v ríši. Rešpektované súdnictvo rieši spory podľa práva uznávaného všetkými a dodáva trónu legitimitu spravodlivosti, čím prehlbuje oddanosť ľudu formálnej právnej náuke." # todo: NEW TRANSLATION
 wulat_al_thughur_bureaucracy: "Wulāt al-Ṯuḡūr" # todo: NEW TRANSLATION
 wulat_al_thughur_bureaucracy_desc: "#italic $wulat_al_thughur_bureaucracy$#! sú strážcami pohraničných oblastí. Obsadzujú pohraničné hrady, strážia horské priesmyky a spravujú prímeria a tribúty, ktoré držia na uzde väčšie kresťanské kráľovstvá. Dobre spravovaná pohraničná oblasť prekypuje obrancami a vďaka obozretnej diplomacii kupuje ríši čas. Ak totiž zanedbáme hranicu, dodáme susedom odvahu — môžu vycítiť našu slabosť a dôraznejšie si uplatňovať svoje nároky." # todo: NEW TRANSLATION
 diwan_al_gharb_bureaucracy: "Dīwān al-Ḡarb" # todo: NEW TRANSLATION
 diwan_al_gharb_bureaucracy_desc: "#italic $diwan_al_gharb_bureaucracy$#! — Úrad Západu — je správny orgán, ktorý zriaďujeme v našich andalúzskych provinciách, aby spravoval obyvateľstvo, ktoré hovorí arabizovaným románskym jazykom rovnako plynulo ako arabčinou a ktorého farské kostoly stále prevyšujú počtom naše mešity. Jeho pisári vyberajú sultánove príjmy, vymenúvajú qāḍī do zmiešaných súdov a presadzujú asimiláciu, ktorá z dobytého územia robí provinciu. Dobre vedený úrad pripútava tieto západné kraje k nášmu právu; zanedbaný úrad ich vydáva na milosť ktorémukoľvek klanu, ktorý si dokáže vynútiť vlastnú vládu." # todo: NEW TRANSLATION
 dawa_bureaucracy: "Dīwān al-Daʿwa" # todo: NEW TRANSLATION
 dawa_bureaucracy_desc: "#italic $dawa_bureaucracy$#! je úrad, prostredníctvom ktorého panovník spravuje vieru za oceánom a vysiela qāḍī a kazateľov do vzdialených provincií, kde naša vláda dosiahla ďalej než mešity. Jeho #italic duʿāt#! prinášajú národom na týchto brehoch výzvu islamu a jeho pisári pripútavajú nové kolónie k zákonu ummy. Ak je tento úrad dobre podporovaný, mení vzdialené výboje na riadne spravované provincie a rozširuje rady veriacich pod vládou koruny. Ak ho zanedbáme, vzdialené stádo sa vymkne panovníkovej moci a výzva utíchne tam, kde nikto nedostáva odmenu za jej šírenie." # todo: NEW TRANSLATION
 mozabite_azzaba_bureaucracy: "Rada 'Azzāba" # todo: NEW TRANSLATION
 mozabite_azzaba_bureaucracy_desc: "#italic ʿAzzāba#! je tajná rada ibádijských učencov, ktorá tvorí skutočnú oporu vlády mozabitských obcí v údolí Mzāb. Rokuje o náboženskom práve, rozhoduje spory a presadzuje prísny mravný kódex, vďaka ktorému si ibádijci zachovali svoju identitu napriek stáročiam vonkajšieho tlaku. Udržiavame túto radu ako najvyššieho rozhodcu nášho spoločného života, financujeme jej učencov a ctíme jej rozhodnutia ako prejavy božského práva. Dobre podporovaná 'Azzāba si získava oddanosť veriacich a šíri ibádijskú právnu náuku do každej domácnosti; bez zdrojov sa jej autorita rozpadá a priestor, ktorý zanechá jej mlčanie, zaplnia bludné náuky." # todo: NEW TRANSLATION
 nav_diputacion_navarra_bureaucracy: "Diputación de Navarra" # todo: NEW TRANSLATION
 nav_diputacion_navarra_bureaucracy_desc: "$nav_diputacion_navarra_bureaucracy$ spravuje ústavné záležitosti Navarry v období medzi zasadnutiami Cortes, dohliada na výber #italic donativo#! a zabezpečuje dôsledné dodržiavanie #italic fueros#!, ktoré vymedzujú navarrskú autonómiu. Jej členovia pochádzajú z troch stavov kráľovstva, takže šľachta, duchovenstvo aj mestá majú v správe svojej krajiny trvalé inštitucionálne zastúpenie. Dobre financovaná Diputación zaručuje dodržiavanie forálnych práv; bez dostatočných zdrojov nedokáže odolávať centralizačnému tlaku, ktorý veľké monarchie nevyhnutne vyvíjajú na svoje menšie územia." # todo: NEW TRANSLATION
 por_desembargo_do_paco_bureaucracy: "Desembargo do Paço" # todo: NEW TRANSLATION
 por_desembargo_do_paco_bureaucracy_desc: "$por_desembargo_do_paco_bureaucracy$ je najvyššou kráľovskou radou Portugalska. Jej úlohou je preskúmavať zákony, udeľovať milosti a dohliadať na súdne vymenovania, vďaka ktorým koruna zasahuje do každého kúta ríše. Na rozdiel od bežných súdov, ktorých zamestnancami sú právnici vzdelaní na univerzitách, Desembargo vyberá mužov s právnickými znalosťami aj dôverou koruny, čím spája odbornú právnu prax s priamou službou panovníkovi. Dobre fungujúce Desembargo urýchľuje správne procesy a zabezpečuje, aby sa kráľovské rozhodnutia vykonávali s právnou presnosťou." # todo: NEW TRANSLATION
 por_mesa_da_consciencia_e_ordens_bureaucracy: "Mesa da Consciência e Ordens" # todo: NEW TRANSLATION
 por_mesa_da_consciencia_e_ordens_bureaucracy_desc: "$por_mesa_da_consciencia_e_ordens_bureaucracy$ bola zriadená na správu portugalských vojenských rádov — Rádu Krista, Rádu svätého Jakuba a Rádu Avizu — ktorých územia, príjmy a duchovnú moc spravuje koruna ako veľmajster. Tribunál preskúmava žiadosti o náboženské dišpenzy, rozhoduje o prideľovaní komend kráľovským stúpencom a urovnáva vzťahy medzi kanonickým právom a kráľovským patronátom. Jeho zriadenie premenilo vojenské rády z autonómnych cirkevných organizácií na nástroje kráľovskej politiky, pevne späté s náboženským programom koruny." # todo: NEW TRANSLATION
 spa_council_of_aragon_bureaucracy: "Consejo de Aragón" # todo: NEW TRANSLATION
 spa_council_of_aragon_bureaucracy_desc: "Východné územia [ShowRegionName('iberia_region')] v rámci [ShowScriptedGeographyName('aragon_geography')] bude spravovať #italic $spa_council_of_aragon_bureaucracy$#!. Úrad sa bude predovšetkým starať o udržiavanie našich väzieb na stredomorský obchod a o potreby miestnych fueros." # todo: NEW TRANSLATION
 spa_council_of_castile_bureaucracy: "Consejo de Castilla" # todo: NEW TRANSLATION
 spa_council_of_castile_bureaucracy_desc: "#italic $spa_council_of_castile_bureaucracy$#! zodpovedá za územia [ShowScriptedGeographyName('castile_geography')], ktoré bude v našom mene spravovať spolu s ich obyvateľstvom." # todo: NEW TRANSLATION
 spa_council_of_flanders_bureaucracy: "Consejo de Flandes" # todo: NEW TRANSLATION
 spa_council_of_flanders_bureaucracy_desc: "Keďže spravuje územia vzdialené od našich tradičných držav, #italic $spa_council_of_flanders_bureaucracy$#! bude musieť pevne držať [ShowScriptedGeographyName('spanish_netherlands_geography')], aby zachoval v regióne poriadok a produktivitu." # todo: NEW TRANSLATION
 spa_council_of_italy_bureaucracy: "Consejo de Italia" # todo: NEW TRANSLATION
 spa_council_of_italy_bureaucracy_desc: "Keďže naša prítomnosť v [ShowRegionName('italy_region')] neustále rastie, mali by sme zriadiť radu, ktorej hlavnou úlohou bude spravovať naše nové výboje. Spravovanie týchto území pre nás bude inou výzvou než spravovanie našich držav v [ShowRegionName('iberia_region')]." # todo: NEW TRANSLATION
 spa_council_of_portugal_bureaucracy: "Conselho de Portugal" # todo: NEW TRANSLATION
 spa_council_of_portugal_bureaucracy_desc: "Keďže sme získali ďalšie územia, mali by sme zriadiť osobitnú radu pre naše državy v [ShowScriptedGeographyName('portugal_geography')]. Úrad sa bude predovšetkým zaoberať naším atlantickým obchodom a námornými záležitosťami." # todo: NEW TRANSLATION
 spa_viceroy_bureaucracy: "Úrad miestokráľa" # todo: NEW TRANSLATION
 spa_viceroy_bureaucracy_desc: "$spa_council_of_indies_bureaucracy_desc$" # todo: NEW TRANSLATION
 spa_council_of_crusade_bureaucracy: "Consejo de Cruzada" # todo: NEW TRANSLATION
 spa_council_of_crusade_bureaucracy_desc: "Rada #italic $spa_council_of_crusade_bureaucracy$#!, zriadená v súlade s [GetUniqueInternationalOrganization('catholic_church').GetName] a [pope], bude usmerňovať naše výboje a úsilie priniesť svetlo [ShowReligionAdjective('catholic')] viery do všetkých kútov sveta." # todo: NEW TRANSLATION
 spa_council_of_finance_bureaucracy: "Consejo de Hacienda" # todo: NEW TRANSLATION
 spa_council_of_finance_bureaucracy_desc: "#italic $spa_council_of_finance_bureaucracy$#! nahradí dva predchádzajúce úrady, účtovný úrad a úrad hlavného účtovníctva. Odstráni napätie medzi nimi a vytvorí jednotný úrad, ktorý bude spravovať štátne financie." # todo: NEW TRANSLATION
 spa_council_of_indies_bureaucracy: "Consejo de las Indias" # todo: NEW TRANSLATION
 spa_council_of_indies_bureaucracy_desc: "Všetko, čo leží za morom, bude spadať pod právomoc #italic $spa_council_of_indies_bureaucracy$#!. Rada bude spravovať všetok obchod prúdiaci z kolónií do našej domoviny aj k našim poddaným na cudzích brehoch a zabezpečí stály prílev bohatstva do našich pokladníc. Táto rada bude spravovať aj živobytie a práva našich novozískaných poddaných a prideľovať pôdu na koloniálne využitie." # todo: NEW TRANSLATION
 spa_council_of_inquisition_bureaucracy: "Consejo de la Suprema Inquisición" # todo: NEW TRANSLATION
 spa_council_of_inquisition_bureaucracy_desc: "#italic $spa_council_of_inquisition_bureaucracy$#!, zložená z viacerých apoštolských inkvizítorov a vedená veľkým inkvizítorom, dohliada na náboženskú pravovernosť a súdne procesy v našej krajine. Bude slúžiť ako najvyšší odvolací súd v cirkevných aj svetských záležitostiach." # todo: NEW TRANSLATION
 spa_council_of_military_orders_bureaucracy: "Consejo de las Órdenes" # todo: NEW TRANSLATION
 spa_council_of_military_orders_bureaucracy_desc: "#italic $spa_council_of_military_orders_bureaucracy$#! bude spravovať ich bývalé územia a zohrá kľúčovú úlohu pri prideľovaní pôdy na vojenské účely, rozširovaní zdrojov na nábor do našich armád a zabezpečovaní vzdelávania i náboru schopných dôstojníkov do našich ozbrojených síl." # todo: NEW TRANSLATION
 spa_council_of_state_bureaucracy: "Consejo de Estado" # todo: NEW TRANSLATION
 spa_council_of_state_bureaucracy_desc: "#italic $spa_council_of_state_bureaucracy$#! vedie priamo náš vládca a pomáha mu v zahraničných záležitostiach bez zasahovania vonkajších vplyvov. Rada pozostáva zo schopných príslušníkov šľachty a duchovenstva, vzdelaných v diplomacii a medzinárodných vzťahoch. Bude spravovať naše zahraničné vyslanectvá a radiť nám pri riešení zložitých medzinárodných záležitostí." # todo: NEW TRANSLATION

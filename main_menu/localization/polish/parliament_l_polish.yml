 bolster_the_republic_desc: "$bolster_the_monarchy_desc$" # todo: NEW TRANSLATION
 bolster_the_divine_mandate: "$bolster_the_monarchy$" # todo: NEW TRANSLATION
 bolster_the_divine_mandate_desc: "$bolster_the_monarchy_desc$" # todo: NEW TRANSLATION
 bolster_the_tribal_leader: "$bolster_the_monarchy$" # todo: NEW TRANSLATION
 bolster_the_tribal_leader_desc: "$bolster_the_monarchy_desc$" # todo: NEW TRANSLATION
 bolster_the_khan: "$bolster_the_monarchy$" # todo: NEW TRANSLATION
 bolster_the_khan_desc: "$bolster_the_monarchy_desc$" # todo: NEW TRANSLATION
 conduct_a_census: "Vykonať sčítanie obyvateľstva" # todo: NEW TRANSLATION
 conduct_a_census_desc: "Riadené zdokumentovanie našich ľudí pri starostlivosti o ich rozvoj a prosperitu je skvelý spôsob, ako podporiť stabilitu v kráľovstve." # todo: NEW TRANSLATION
 support_ruler: "Podporiť štát" # todo: NEW TRANSLATION
 support_ruler_desc: "Naša vláda nemôže fungovať bez náležitého uznania svojej moci. Náležitým vyhlásením parlamentu môžeme upevniť našu reputáciu a posilniť panovníka." # todo: NEW TRANSLATION
 increase_our_control: "Zvýšiť našu kontrolu" # todo: NEW TRANSLATION
 increase_our_control_desc: "Uplatňovanie kontroly nad naším územím je životné pre fungovanie štátu. Mali by sme zlepšiť inštitúcie, ktoré vykonávajú kontrolu nad našimi mestami." # todo: NEW TRANSLATION
 promote_state_religion: "Podporiť štátnu cirkev" # todo: NEW TRANSLATION
 promote_state_religion_desc: "Aby naši poddaní nasledovali náboženstvo štátu, je rozhodujúcim krokom k stabilite ríše. Mali by sme zvýšiť úsilie o obrátenie ľudu." # todo: NEW TRANSLATION
 promote_burghers_member: "Povýšiť člena mešťanov" # todo: NEW TRANSLATION
 promote_burghers_member_desc: "Mešťania sú pre náš štát zásadní, ako obchodníci aj ako členovia cechov. Mali by sme povýšiť schopných členov ich stavu do našej vlády." # todo: NEW TRANSLATION
 promote_burghers_member_passed.tt: "Objaví sa schopný člen [ShowEstateTypeName('burghers_estate')]." # todo: NEW TRANSLATION
 expand_diplomatic_corps_generic_desc: "Iba meč nás dovezie len tak ďaleko. Omnoho prospešnejšie by bolo, ak by pero podporilo meč, aby sme dosiahli veľké veci." # todo: NEW TRANSLATION
 expand_diplomatic_corps_minors: "Posilniť väzby so susedmi" # todo: NEW TRANSLATION
 expand_diplomatic_corps_minors_desc: "$expand_diplomatic_corps_generic_desc$ Našou hlavnou starosťou by mali byť menšie krajiny v okolí." # todo: NEW TRANSLATION
 expand_diplomatic_corps_religion: "Rozšíriť náboženské väzby" # todo: NEW TRANSLATION
 expand_diplomatic_corps_religion_desc: "$expand_diplomatic_corps_generic_desc$ Je pre nás životne dôležité zlepšiť kontakty s našimi náboženskými bratmi." # todo: NEW TRANSLATION
 expand_diplomatic_corps_majors: "Vzťahy s veľmocami" # todo: NEW TRANSLATION
 expand_diplomatic_corps_majors_desc: "$expand_diplomatic_corps_generic_desc$ Musíme zabezpečiť naše vzťahy s veľmocami sveta." # todo: NEW TRANSLATION
 improve_subject_relations: "Posilniť väzby s podriadeným štátom" # todo: NEW TRANSLATION
 improve_subject_relations_desc: "Zvýšením našich diplomatických a administratívnych väzieb na náš podriadený štát ich budeme môcť viac zviazať s naším štátom." # todo: NEW TRANSLATION
 promote_clergy_member: "Povýšiť člena duchovenstva" # todo: NEW TRANSLATION
 promote_clergy_member_desc: "Naša administrácia by mohla využiť podporu duchovenstva, aby fungovala efektívnejšie. Ponúknutím vyšších postov v našej vláde im môžeme zlepšiť situáciu štátu." # todo: NEW TRANSLATION
 promote_clergy_member_passed.tt: "Objaví sa schopný člen [ShowEstateTypeName('clergy_estate')]." # todo: NEW TRANSLATION
 expand_our_market: "Zákony na rozšírenie trhu" # todo: NEW TRANSLATION
 expand_our_market_desc: "Náš trh by výrazne profitoval z uvoľnenia mercantilistických regulácií." # todo: NEW TRANSLATION
 protect_our_market: "Regulácia trhu" # todo: NEW TRANSLATION
 protect_our_market_desc: "Vzhľadom na konkurencieschopnosť našich trhov by bolo rozumné sprísniť mercantilistické regulácie, aby sme našim obchodníkom zabezpečili konkurenčnú výhodu." # todo: NEW TRANSLATION
 sponsor_a_merchant_expedition: "Sponzorovať obchodnú expedíciu" # todo: NEW TRANSLATION
 sponsor_a_merchant_expedition_desc: "Mali by sme investovať do špecializovanej obchodnej expedície za účelom nadviazania obchodných spojení s inými trhmi." # todo: NEW TRANSLATION
 sponsor_urban_development: "Rozvíjať vnútrozemie" # todo: NEW TRANSLATION
 sponsor_urban_development_desc: "Nemali by sme zanedbávať vnútrozemie a mali by sme ho primerane rozvíjať." # todo: NEW TRANSLATION
 support_religious_art: "Sponzorovať náboženské umenie" # todo: NEW TRANSLATION
 support_religious_art_desc: "Naša viera slúži ako veľká inšpirácia pre umelcov v celej krajine. Keďže náš dvor môže podporovať umelcov, mali by sme si najať jedného z tých, ktorí sú inšpirovaní božským." # todo: NEW TRANSLATION
 support_nobles_art: "Sponzorovať šľachtické umenie" # todo: NEW TRANSLATION
 support_nobles_art_desc: "Naša sofistikovaná elita túži predovšetkým po viac umenia na obdivovanie. Keby sme zamestnali viac umelcov, určite by sme ich potešili." # todo: NEW TRANSLATION
 support_religious_education: "Podporiť náboženské vzdelávanie" # todo: NEW TRANSLATION
 support_religious_education_desc: "Naša závislosť na služobníkoch viery môže byť veľkým prínosom vo vzdelávaní obyvateľstva. To by urýchlilo naše vedecké pokroky a zároveň zvýšilo lojalitu našich oddaných nasledovníkov." # todo: NEW TRANSLATION
 support_religious_education_passed.tt: "Všetci [ShowPopTypeName('clergy')] a [ShowPopTypeName('peasants')] nasledujúci našu vieru získajú [ShowNamedValue('pop_satisfaction_mild_bonus')|+=2%] [pop_satisfaction|e]." # todo: NEW TRANSLATION
 improve_relations_with_the_faith: "Podporiť náboženské vzťahy" # todo: NEW TRANSLATION
 improve_relations_with_the_faith_desc: "Vzťahy medzi našou vierou a štátom môžu byť narušené mnohými rozhodnutiami, najmä ak je samotná viera rozdelená v otázke. Pôsobenie ako sprostredkovateľ medzi rôznymi frakciami a prinútenie ich k rokovaniam by mohlo zabrániť ďalšiemu, vážnemu rozkolu." # todo: NEW TRANSLATION
 curb_central_authority: "Obmedziť centrálnu autoritu" # todo: NEW TRANSLATION
 curb_central_authority_desc: "Autorita [Player.GetGovernment.GetParliament.GetName] nemôže ani nebude prekonaná žiadnou autoritou mimo jej siení. Aby sme sledovali naše ideály, musíme uplatniť toto právo napriek kráľovským dekrétom!" # todo: NEW TRANSLATION
 revoke_privilege_of_the_nobles: "Odobrať privilégiá šľachte" # todo: NEW TRANSLATION
 revoke_privilege_of_the_nobles_desc: "Tí, ktorí využívali prácu a pot obyčajných ľudí, sa teraz trasú pri predstave, že im budú odňaté ich chabé privilégiá." # todo: NEW TRANSLATION
 reduce_peasant_taxation: "Znížiť dane roľníkom" # todo: NEW TRANSLATION
 reduce_peasant_taxation_desc: "Bežný človek celý život platil dane pánovi. Aby sme presadili naše programy oslobodzovania ľudu, toto zdanenie musí prestať!" # todo: NEW TRANSLATION
 establish_a_constitution: "Zaviesť ústavu" # todo: NEW TRANSLATION
 establish_a_constitution_desc: "Vôľa ľudu musí byť zapísaná do písomného dokumentu, prijatého všetkými, aby sa upevnili naše práva a zároveň obmedzila centrálna autorita." # todo: NEW TRANSLATION
 random_noble_privilege_revoked_tt: "Bude odňaté náhodné [estate_privilege|e] [ShowEstateTypeName('nobles_estate')]" # todo: NEW TRANSLATION
 baronial_burghs_rights: "Rozšíriť práva barónskych burghov" # todo: NEW TRANSLATION
 baronial_burghs_rights_desc: "Rozšírenie práv barónskych burghov podporí rozvoj našej krajiny." # todo: NEW TRANSLATION
 ecclesiastical_burghs_rights: "Rozšíriť práva cirkevných burghov" # todo: NEW TRANSLATION
 ecclesiastical_burghs_rights_desc: "Rozšírenie práv cirkevných burghov podporí rozvoj našej krajiny." # todo: NEW TRANSLATION
 compulsory_education_nobles: "Zákon o vzdelávaní šľachty" # todo: NEW TRANSLATION
 compulsory_education_nobles_desc: "Mali by sme výrazne investovať do vzdelávania šľachty, aby sme posunuli našu administráciu dopredu." # todo: NEW TRANSLATION
 presbyterian_education: "Zákon o presbyteriánskom vzdelávaní" # todo: NEW TRANSLATION
 presbyterian_education_desc: "Mali by sme zriadiť školu v každej farnosti našej krajiny na podporu vzdelávania nášho ľudu. Budú riadené členmi Cirkvi a financované daňou uloženou na majiteľov pôdy." # todo: NEW TRANSLATION
 found_college_of_justice: "Zriadiť Katedru spravodlivosti" # todo: NEW TRANSLATION
 found_college_of_justice_desc: "Právny kódex je aktuálne nedostatočný a nespĺňa naše štandardy. Mali by sme založiť novú inštitúciu, Katedru spravodlivosti, aby riešila tieto otázky a založila silný právny systém." # todo: NEW TRANSLATION
 establish_the_signoria_of_venice: "Zriadiť Signoriu Benátok" # todo: NEW TRANSLATION
 establish_the_signoria_of_venice_desc: "Starý Benátsky komún slúži svojmu účelu a má dlhú tradíciu v našom štáte. Avšak jeho administratívna efektivita stráca na kvalite. Možno by sme chceli prepracovať najvyšší vládny orgán a nahradiť ho novým systémom, ktorý lepšie rieši vnútorné problémy krajiny." # todo: NEW TRANSLATION
 appease_english_population: "Uspokojiť anglické obyvateľstvo" # todo: NEW TRANSLATION
 appease_english_population_desc: "Naši poddaní v Británii sa zdajú byť nespokojní napriek nášmu nároku. Ukázať im, že nie sme utláčateľmi, by im mohlo pomôcť upokojiť situáciu." # todo: NEW TRANSLATION
 increase_control_in_britain: "Zvýšiť kontrolu v Británii" # todo: NEW TRANSLATION
 increase_control_in_britain_desc: "Britské ostrovy sú odpojené od zvyšku európskeho kontinentu, čo nám sťažuje ich správu. Mali by sme vynaložiť úsilie, aby sme tento problém prekonali a zvýšili tam našu kontrolu." # todo: NEW TRANSLATION
 tolerance_of_non_hindus: "Tolerancia pohanov" # todo: NEW TRANSLATION
 tolerance_of_non_hindus_desc: "Keďže je naše kráľovstvo multiverové a náš panovník verí v toleranciu, mali by sme dovoliť tieto odlišné vierovyznania v našej krajine." # todo: NEW TRANSLATION
 VIJ_ALL_NON_HINDU_POPS_GAIN_SATISFACTION: "Všetky naše [heretics|e] a [heathen|e] [pops|e] získajú [ShowNamedValue('pop_satisfaction_severe_bonus')|+=2%] [pop_satisfaction|e]." # todo: NEW TRANSLATION
 increase_non_hindu_control: "Kontrola nad pohanmi" # todo: NEW TRANSLATION
 increase_non_hindu_control_desc: "Namiesto toho, aby sme dovolili, aby sa v našej krajine rozšírili rôzne vierovyznania, mali by sme sa ich snažiť viac ovládať, aby sa nepostavili proti nám." # todo: NEW TRANSLATION
 VIJ_ALL_NON_HINDU_POPS_LOCATIONS_GAIN_CONTROL: "Všetky naše [locations|e] s aspoň #Y 5%#! [heretics|e] alebo [heathen|e] [pops|e] získajú [ShowNamedValue('control_mild_bonus')|+=2%] [control|e]." # todo: NEW TRANSLATION
 dlh_famine_reductions: "Bojovať proti hladomoru" # todo: NEW TRANSLATION
 dlh_famine_reductions_desc: "Namiesto toho, aby sme sedeli nečinne, zatiaľ čo obyvateľstvo hladovie, mali by sme poskytovať pomoc akýmkoľvek oblastiam, ktorým chýbajú zásoby potravín." # todo: NEW TRANSLATION
 new_model_army_pi: "Nová modelová armáda" # todo: NEW TRANSLATION
 new_model_army_pi_desc: "Útrapy prebiehajúcej občianskej vojny proti royalistom ukázali, že naša armáda potrebuje úplnú reformu." # todo: NEW TRANSLATION
 edict_of_nantes_issue: "Nantský edikt" # todo: NEW TRANSLATION
 edict_of_nantes_issue_desc: "Po rokoch náboženských bojov je čas podporiť jednotu prostredníctvom spolužitia a ukončiť zbytočné prelievanie krvi." # todo: NEW TRANSLATION
 end_the_french_wars_religion_tt: "[ShowDisasterName('french_wars_religion')] [disaster|e] sa skončí" # todo: NEW TRANSLATION
 mug_promote_rajput_officials: "Povýšiť $rajasthani_language$ úradníkov" # todo: NEW TRANSLATION
 mug_promote_rajput_officials_desc: "Povýšením ľudí hovoriacich $rajasthani_language$ v krajine si môžeme zabezpečiť viacero militaristických úradníkov, na ktorých sa môžeme spoľahnúť." # todo: NEW TRANSLATION
 promote_rajput_officials_passed_tt: "Objaví sa schopný člen [ShowLanguageName('rajasthani_language')] [language|e]." # todo: NEW TRANSLATION
 hussite_army_reform: "$hussite_ADJ$ Vojenské reformy" # todo: NEW TRANSLATION
 hussite_army_reform_desc: "Náš národ prešiel údoliami dejín napriek všetkým prekážkam. Prežil vojny, križiacke výpravy a prenasledovanie. Naše armády si zaslúžia používať tie najlepšie taktiky a prejsť do útoku proti všetkým, ktorí usilujú o náš zánik!" # todo: NEW TRANSLATION
 lit_measures_against_romuva: "Opatrenia proti $romuva_ADJ$ oživeniu" # todo: NEW TRANSLATION
 lit_measures_against_romuva_desc: "S oživením viery [ShowReligionAdjective('romuva')] sa mnohí obávajú, že by mohli vyvolať nepokoje. Musíme zvolať stavy, aby túto záležitosť vyriešili." # todo: NEW TRANSLATION
 lit_5_percent_of_pops_convert_to_our_religion_tt: "#Y 5%#! z [ShowReligionAdjective('romuva')] [pops|e] prejde na [ROOT.GetCountry.GetReligion.GetName]" # todo: NEW TRANSLATION
 hre_law_debate: "Diskusia o cisárskom práve" # todo: NEW TRANSLATION
 hre_law_debate_desc: "[ShowSpecialStatusName('emperor')] [GetUniqueInternationalOrganization('hre').GetName] plánuje zaviesť nový zákon. Teraz je príležitosť pre cisárske stavy vyjednávať za alebo proti návrhu." # todo: NEW TRANSLATION
 hre_request_additional_military_support: "Cisárska vojenská podpora" # todo: NEW TRANSLATION
 hre_request_additional_military_support_desc: "[GetUniqueInternationalOrganization('hre').GetName] je ohrozená cudzou inváziou. [GetUniqueInternationalOrganization('hre').GetLeaderTitle] sa cíti nútený požiadať o vojenskú silu celého Impéria a všetkých jeho členov." # todo: NEW TRANSLATION
 hre_roman_month: "Rímsky mesiac" # todo: NEW TRANSLATION
 hre_roman_month_desc: "Pokladnica [GetUniqueInternationalOrganization('hre').GetName] sa v poslednom čase vyprázdňuje. [GetUniqueInternationalOrganization('hre').GetLeaderTitle] žiada finančnú podporu členov Impéria, aby zabezpečil jeho bezpečnosť." # todo: NEW TRANSLATION
 hre_roman_month_modifier_effect: "[ShowModifierEffect('pi_hre_increased_imperial_tax_modifier')]" # todo: NEW TRANSLATION
 hre_demand_internal_peace: "Požadovať vnútorný mier" # todo: NEW TRANSLATION
 hre_demand_internal_peace_desc: "Autorita [GetUniqueInternationalOrganization('hre').GetLeaderTitle] je narušená vnútornými konfliktmi v [GetUniqueInternationalOrganization('hre').GetName]. V záujme Impéria je zabezpečiť vnútorný mier a stabilitu." # todo: NEW TRANSLATION
 hre_demand_internal_peace_tt: "Každý [member|e] uzavrie [white_peace|e] v každej [war|e], ktorá zahŕňa iného [member] z [THIS.GetInternationalOrganization.GetName]" # todo: NEW TRANSLATION
 hre_establish_perpetual_diet: "Zriadiť stály snem" # todo: NEW TRANSLATION
 hre_establish_perpetual_diet_desc: "$perpetual_diet_law_desc$" # todo: NEW TRANSLATION
 hre_establish_perpetual_diet_tt: "[parliament_seat|e] [GetUniqueInternationalOrganization('hre').GetName] sa stáva jediným platným [location|e], kde sa môže konať [parliament|e]." # todo: NEW TRANSLATION
 hre_force_emperor_to_abdicate: "Prinútiť cisára abdikovať" # todo: NEW TRANSLATION
 hre_force_emperor_to_abdicate_desc: "Vládnutie [GetUniqueInternationalOrganization('hre').GetLeaderCountry.GetLongName] bolo [ShowSpecialStatusNamePlural('elector')] vyhodnotené ako nedostatočné. Cisársky snem bol zvolaný, aby prerokoval budúcnosť vedenia [GetUniqueInternationalOrganization('hre').GetName]." # todo: NEW TRANSLATION
 union_enforce_law_implementation: "Vynútiť vykonávanie zákonov" # todo: NEW TRANSLATION
 union_enforce_law_implementation_desc: "Niektorí členovia [GetInternationalOrganizationType('union').GetName] sú buď nováčikovia, alebo sa im podarilo odraziť akýkoľvek pokus o centralizáciu $union$. Je potrebné vynútiť tieto zákony u každého člena, ak chceme bezproblémovú anexiu ostatných členov." # todo: NEW TRANSLATION
 union_enforce_law_implementation_at: "Každý [member|e] nastaví svoju [union_integration_level_member|e] v [THIS.GetInternationalOrganization.GetName] na [THIS.GetInternationalOrganization.GetModifierValueString('union_integration_level')]" # todo: NEW TRANSLATION
 pa_add_privilege: "Udeľovanie privilégií" # todo: NEW TRANSLATION
 pa_add_privilege_simple: "Podplatiť stav" # todo: NEW TRANSLATION
 pa_add_privilege_desc: "Niekedy musíte poskytnúť trvalé výsady [estate|e], aby ste získali ich podporu v krátkodobom horizonte." # todo: NEW TRANSLATION
 pa_change_policy: "Zmeniť politiku" # todo: NEW TRANSLATION
 pa_change_policy_simple: "Podplatiť stav" # todo: NEW TRANSLATION
 pa_change_policy_desc: "Tento [estate|e] má výhrady k našej súčasnej [policy|e] a bol by viac naklonený, keby sme zmenili naše stanovisko na niečo výhodnejšie." # todo: NEW TRANSLATION
 push_towards_desc: "Naša spoločnosť sa príliš vzdialila od našich koreňov. Musíme tlačiť smerom k návratu k našim ideálom a" # todo: NEW TRANSLATION

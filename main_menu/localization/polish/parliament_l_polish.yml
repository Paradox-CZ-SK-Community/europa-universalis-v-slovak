 pa_change_court_language_to_estate_language_desc: "Stav požaduje, aby sa [court_language|e] zmenil na taký, ktorý lepšie odráža jeho identitu." # todo: NEW TRANSLATION
 iw_militarize_country: "Militarizovať krajinu" # todo: NEW TRANSLATION
 iw_militarize_country_desc: "Požiadať [parliament|e] o podporu mimoriadnej vojenskej mobilizácie, ktorá poskytne [army_tradition|e] a posilní naše najskúsenejšie [army|e]." # todo: NEW TRANSLATION

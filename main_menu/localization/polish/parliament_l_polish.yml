 reform_the_royal_treasury_desc: "Nekontrolované rozširovanie razby mincí zvýšilo ceny a oslabilo hodnotu našej meny. Dôkladný audit kráľovských financií a reforma pokladničných praktík by obnovili stabilnú menu v ríši." # todo: NEW TRANSLATION
 issue_royal_censure: "Vydanie kráľovského pokarhania" # todo: NEW TRANSLATION
 issue_royal_censure_desc: "Naši rivali podnikli kroky, ktoré nemožno nechať bez formálneho odsúdenia. Kráľovské pokarhanie, podporené autoritou tohto parlamentu, jasne ukáže, že takúto činnosť nebudeme tolerovať bez reakcie." # todo: NEW TRANSLATION
 mandate_emergency_levies: "Nariadiť núdzové príspevky" # todo: NEW TRANSLATION
 mandate_emergency_levies_desc: "Náš vojnový úspech potrebuje väčšiu podporu zo všetkých kútov ríše. Koruna musí vyzvať všetky stavy a poddaných, aby prispeli, čo môžu, aby sme túto skúšku prekonali." # todo: NEW TRANSLATION
 fund_royal_art_patronage: "Financovať kráľovský patronát umenia" # todo: NEW TRANSLATION
 fund_royal_art_patronage_desc: "Veľkosť ríše sa meria nielen armádami a zlatom, ale aj dielami umenia a kultúry, ktoré produkuje. Mali by sme investovať do patronátu umelcov a remeselníkov, ktorí zveční slávu našej dynastie." # todo: NEW TRANSLATION
 institute_feudal_levies: "Zaviesť feudálne odvody" # todo: NEW TRANSLATION
 institute_feudal_levies_desc: "Základom každej skvelej armády je jazdecká šľachta. Formalizovaním vojenských povinností šľachtických domov — najmä dodávania ťažkej jazdy — posilníme naše sily v poli." # todo: NEW TRANSLATION
 establish_military_exercises: "Zaviesť vojenské cvičenia" # todo: NEW TRANSLATION
 establish_military_exercises_desc: "Naše šľachtické družiny ochabnú v dobách pokoja. Nariadením pravidelných polných cvičení a turnajov zabezpečíme, že naši bojovníci zostanú zruční a armády pripravené, keď príde výzva." # todo: NEW TRANSLATION
 establish_heralds_college: "Zriadiť kolégium heraldikov" # todo: NEW TRANSLATION
 establish_heralds_college_desc: "Prednosť titulov, práva erbu a poradie šľachtických hodností sú záležitosti veľkého významu. Kolégium heraldikov by prinieslo poriadok do týchto vecí a zvýšilo prestíž nášho kráľovstva v zahraničí." # todo: NEW TRANSLATION
 promote_chivalric_orders: "Podporiť rytierske rády" # todo: NEW TRANSLATION
 promote_chivalric_orders_desc: "Naše rytierske rády sú zosobnením šľachtickej vojenskej cnosti. Uznaním a financovaním posilníme putá medzi korunou a jej najlepšími bojovníkmi." # todo: NEW TRANSLATION
 license_noble_privateers: "Udeľovať povolenia šľachtickým korzárom" # todo: NEW TRANSLATION
 license_noble_privateers_desc: "More ponúka bohatstvo odvážnym a šľachtické rody sú schopné vybaviť vojnové lode pre zisk. Udeľovaním listín dáme ich podnikaniu formu a legitímnosť, pričom koruna bude ťažiť z narušenia nepriateľského obchodu." # todo: NEW TRANSLATION
 monopolize_land_trade_routes: "Monopol na pozemné obchodné trasy" # todo: NEW TRANSLATION
 monopolize_land_trade_routes_desc: "Naša šľachta kontroluje cesty, priechody a mosty, ktorými musí prechádzať pozemný obchod. Udeľovaním formálnych mýtnych práv nad pozemnými obchodníkmi nasmerujeme tieto zisky do rúk najvernejších poddaných." # todo: NEW TRANSLATION
 fund_noble_colonization: "Financovať šľachtickú kolonizáciu" # todo: NEW TRANSLATION
 fund_noble_colonization_desc: "Veľké šľachtické rody majú prostriedky a ambície financovať koloniálne výpravy. Mali by sme im udeliť chartu a podporiť tieto podniky, aby rozšírili náš dosah za obzor." # todo: NEW TRANSLATION
 grant_exclusive_hunting_rights: "Udeľovať výhradné práva na lov" # todo: NEW TRANSLATION
 grant_exclusive_hunting_rights_desc: "Lesy a zver patria prirodzene do domény šľachty. Udeľovaním výhradných práv na lov a správu týchto území posilníme ich väzbu na panstvo a vernosť korunke." # todo: NEW TRANSLATION
 establish_noble_garrison_law: "Zaviesť zákon o šľachtických posádkach" # todo: NEW TRANSLATION
 establish_noble_garrison_law_desc: "Nepokoje ohrozujú našu ríšu a bez silných miestnych posádok ich nezastavíme. Nech sú šľachtické rody zákonom povinné udržiavať opevnené pozície vo svojich doménach, pripravené brániť korunu a krajinu." # todo: NEW TRANSLATION
 establish_clergy_charity: "Zriadiť cirkevnú charitu" # todo: NEW TRANSLATION
 establish_clergy_charity_desc: "Naši ľudia trpia hladom, zatiaľ čo sýpky veľkých pánov sú plné. Je povinnosťou Cirkvi organizovať pomoc chudobným a hladným — povinnosť, ktorú musíme formalizovať a financovať." # todo: NEW TRANSLATION
 launch_religious_missions: "Vyslať náboženské misie" # todo: NEW TRANSLATION
 launch_religious_missions_desc: "Veľká časť našej ríše ešte leží mimo svetla pravej viery. Cirkev musí organizovať a posielať misionárov, aby privádzali duše do viery, a my im poskytneme potrebnú podporu." # todo: NEW TRANSLATION
 institute_canonical_law: "Zaviesť kanonické právo" # todo: NEW TRANSLATION
 institute_canonical_law_desc: "Ríša rozdelená vo viere je rozdelená v duchu. Kódifikáciou cirkevného práva a jeho jednotnou aplikáciou v provinciách posilníme putá viery, ktoré spájajú náš ľud." # todo: NEW TRANSLATION
 establish_inquisition_courts: "Zriadiť inkvizičné súdy" # todo: NEW TRANSLATION
 establish_inquisition_courts_desc: "Semienka herézy sa usadzujú a len systematická činnosť cirkevných súdov ich môže vyrvať. Musíme konať rýchlo, kým sa nákaza nerozšíri." # todo: NEW TRANSLATION
 promote_religious_tolerance: "Podporiť náboženskú toleranciu" # todo: NEW TRANSLATION
 promote_religious_tolerance_desc: "V našej ríši žijú mnohí, ktorí nezdieľajú našu vieru, a ich nespokojnosť rodí nepokoje. Je múdre, aby Cirkev uznala, že mier skôr prinesie tolerancia než neustále konflikty." # todo: NEW TRANSLATION
 fund_monastery_network: "Financovať sieť kláštorov" # todo: NEW TRANSLATION
 fund_monastery_network_desc: "Kláštory sú centrá učenia, charity a poriadku. Mali by sme rozšíriť ich sieť a patrične ich dotovať, aby ich dobré skutky dosiahli každý kút ríše." # todo: NEW TRANSLATION
 establish_pilgrimage_routes: "Zriadiť pútnické trasy" # todo: NEW TRANSLATION
 establish_pilgrimage_routes_desc: "Sväté miesta priťahujú pútnikov zblízka i zďaleka. Formálnym chránením a údržbou ciest k týmto miestam prejavíme zbožnosť a prinesieme našej ríši prestíž." # todo: NEW TRANSLATION
 regulate_tithe_collection: "Regulovať zber desiatkov" # todo: NEW TRANSLATION
 regulate_tithe_collection_desc: "Zber desiatkov je nejednotný a sporný. Štandardizáciou podielu cirkvi na príjmoch zabezpečíme spravodlivé a spoľahlivé príjmy pre klerikov a zbavíme ľud neistoty." # todo: NEW TRANSLATION
 sponsor_theological_seminaries: "Financovať teologické semináre" # todo: NEW TRANSLATION
 sponsor_theological_seminaries_desc: "Vzdelaný klerik je základom duchovne zdravej ríše. Musíme financovať zriadenie a rozšírenie seminárov na vychovanie novej generácie učených duchovných." # todo: NEW TRANSLATION
 promote_export_trade: "Podporiť vývoz" # todo: NEW TRANSLATION
 promote_export_trade_desc: "Naši obchodníci sú pripravení odviezť naše tovary do najvzdialenejších kútov sveta, ale potrebujú podporu parlamentu na rozšírenie sietí. Podpora vývozu obohatí krajinu a posilní naše postavenie v zahraničí." # todo: NEW TRANSLATION
 establish_import_controls: "Zaviesť dovozné kontroly" # todo: NEW TRANSLATION
 establish_import_controls_desc: "Nesmie sa dovoliť, aby záplava zahraničných tovarov podrývala našich domácich výrobcov. Zavedením formálnych kontrol nad tým, čo vstupuje na trh, ochránime priemysel a zabezpečíme konkurencieschopnosť našich obchodníkov." # todo: NEW TRANSLATION
 fund_trade_expeditions: "Financovať obchodné expedície" # todo: NEW TRANSLATION
 fund_trade_expeditions_desc: "Obchodné cechy sú pripravené spojiť kapitál na diaľkové plavby, ale takéto podniky vyžadujú zákonnú podporu a istotu, ktorú prináša parlament." # todo: NEW TRANSLATION
 establish_commodity_exchange: "Zriadiť burzu komodít" # todo: NEW TRANSLATION
 establish_commodity_exchange_desc: "Naše trhové centrá sú rušné, ale postrádajú formálnu burzu, kde by sa veľkoobjemové tovary obchodovali usporiadane. Zriadenie takejto burzy by spravilo naše trhy závideniahodné." # todo: NEW TRANSLATION
 promote_maritime_trade: "Podporiť námorný obchod" # todo: NEW TRANSLATION
 promote_maritime_trade_desc: "Morské cesty sú diaľnicami bohatstva pre odvážnych. Mali by sme investovať do infraštruktúry a inštitúcií podporujúcich námorný obchod a zabezpečiť, aby naši obchodníci ovládli vody." # todo: NEW TRANSLATION
 license_trading_companies: "Licencovať obchodné spoločnosti" # todo: NEW TRANSLATION
 license_trading_companies_desc: "Riziká a odmeny diaľkového obchodu sú príliš veľké pre jediného obchodníka. Mali by sme licencovať formálne obchodné spoločnosti, aby spájali zdroje a zdieľali riziká v prospech celej ríše." # todo: NEW TRANSLATION
 establish_customs_houses: "Zriadiť colnice" # todo: NEW TRANSLATION
 establish_customs_houses_desc: "Naše hranice sú priepustné a zahraniční obchodníci profitujú z dovozu bez účtovania. Vybudovaním colníc vnútornímusporiadame dovoz a zaistíme spravodlivý podiel pre korunu a našich obchodníkov." # todo: NEW TRANSLATION
 fund_artisan_guilds: "Financovať cechy remeselníkov" # todo: NEW TRANSLATION
 fund_artisan_guilds_desc: "Zruční remeselníci vyrábajú výrobky výnimočnej kvality, no postrádajú organizáciu a podporu. Mali by sme financovať a chrániť cechy, ktoré ich zastupujú." # todo: NEW TRANSLATION
 establish_trade_insurance: "Zriadiť obchodné poistenie" # todo: NEW TRANSLATION
 establish_trade_insurance_desc: "Riziká obchodu — vraky lodí, banditizmus, vojna — odrádzajú mnohých obchodníkov od podnikov, ktoré by obohatili ríšu. Zriadením formálnych poistných schém umožníme obchodníkom obchodovať s väčšou istotou." # todo: NEW TRANSLATION
 expand_postal_relay_network: "Rozšíriť sieť poštových staníc" # todo: NEW TRANSLATION
 expand_postal_relay_network_desc: "Spoľahlivá komunikácia je životodarnou tepnou obchodu. Obchodné domy sú ochotné financovať sieť prestupných staníc, ktoré by prenášali správy a tovary rýchlejšie — investíciu, ktorá sa mnohonásobne vráti." # todo: NEW TRANSLATION
 establish_common_food_stores: "Zriadiť spoločné zásobárne potravín" # todo: NEW TRANSLATION
 establish_common_food_stores_desc: "Naši ľudia sú zraniteľní voči zlým úrodom a hlad rodí zúfalstvo. Zriadením komunitných zásobníkov obilia zabezpečíme, že žiadna bieda nezanechá ľud bez pomoci." # todo: NEW TRANSLATION
 promote_farming_innovation: "Podporiť poľnohospodárske inovácie" # todo: NEW TRANSLATION
 promote_farming_innovation_desc: "Nové metódy osevného striedania a obhospodarovania priniesli pozoruhodné výsledky inde. Podporíme ich prijatie naprieč kráľovstvom, aby polia prinášali vyššie výnosy a ľudia trpeli menej." # todo: NEW TRANSLATION
 sponsor_irrigation_projects: "Financovať zavlažovacie projekty" # todo: NEW TRANSLATION
 sponsor_irrigation_projects_desc: "Veľa našej pôdy by prinieslo omnoho viac úrody, keby sa k nej dostala voda. Financovaním výstavby vodných kanálov a zavlažovacích diel zmeníme suché územia na úrodné polia." # todo: NEW TRANSLATION
 reduce_serfdom: "Znížiť nevoľníctvo" # todo: NEW TRANSLATION
 reduce_serfdom_desc: "Putá nevoľníctva ťažia obyčajný ľud, viažu ho k zemi a dusia prácu, ktorá nás živí. Uľahčením týchto bremien a povolením väčšej mobility posilníme vernosť a produktivitu ľudu." # todo: NEW TRANSLATION
 establish_village_councils: "Zriadiť dedinské rady" # todo: NEW TRANSLATION
 establish_village_councils_desc: "Naše vidiecke komunity riadia vzdialení páni, ktorí nepoznajú miestne potreby. Zriadením dedinských rád s právomocou spravovať miestne záležitosti dáme ľuďom hlas a prinesieme poriadok bližšie k domovu." # todo: NEW TRANSLATION
 charter_artisan_guilds: "Udeľovať listiny remeselníckym cechom" # todo: NEW TRANSLATION
 charter_artisan_guilds_desc: "Majstri a učni v dielňach pracujú bez formálneho uznania od koruny. Udeľovaním cechových listín uvedieme ich remeslá pod zákonný poriadok a získame priazeň tých, ktorých ruky udržujú prosperitu." # todo: NEW TRANSLATION
 subsidize_grain_imports: "Dotovať dovoz obilia" # todo: NEW TRANSLATION
 subsidize_grain_imports_desc: "Naše trhy môžu nakŕmiť ľud, ale len ak cena obilia zostane dostupná. Dotovaním dovozu obilia zabezpečíme, že nedostatok a bieda nevedú k zúfalstvu." # todo: NEW TRANSLATION
 rural_crafts_charter: "Charta vidieckych remesiel" # todo: NEW TRANSLATION
 rural_crafts_charter_desc: "Mestské cechy dusia domáce výroby, ktoré udržujú vidiecke rodiny v ťažkých časoch. Mali by sme udeliť chartu a chrániť vidieckych remeselníkov pred takýmto zasahovaním." # todo: NEW TRANSLATION
 prevent_noble_enclosure: "Zabrániť uzurpácii spoločných pozemkov šľachtou" # todo: NEW TRANSLATION
 prevent_noble_enclosure_desc: "Veľkí páni už príliš dlho zabierajú spoločné pozemky, od ktorých závisia naši roľníci. Musíme chrániť to málo, čo im zostalo, skôr než sa nespokojnosť zmení na niečo oveľa nebezpečnejšie." # todo: NEW TRANSLATION
 declare_war_taxes: "Vyhlásiť vojnové dane" # todo: NEW TRANSLATION
 declare_war_taxes_desc: "Náš vojnový úspech si vyžaduje prostriedky nad rámec bežných príjmov. Parlament musí povoliť núdzové odvody od všetkých stavov — bremeno zdieľané všetkými pre prežitie a slávu ríše." # todo: NEW TRANSLATION
 wartime_cavalry_reserve: "Vojnová jazdecká rezerva" # todo: NEW TRANSLATION
 wartime_cavalry_reserve_desc: "Rozhodujúce stretutie môže prísť kedykoľvek a musíme zabezpečiť, aby naša ťažká jazda bola v plnej pohotovosti. Nech sa šľachtické rody zaviažu udržiavať svojich najlepších jazdcov v neustálom pohotovostnom stave, kým vojna neskončí." # todo: NEW TRANSLATION
 fortify_frontier_passes: "Opevniť pohraničné priechody" # todo: NEW TRANSLATION
 fortify_frontier_passes_desc: "Naše hranice sú silné len do miery, v akej sú opevnené priechody, ktorými nás nepriatelia môžu napadnúť. Mali by sme financovať spevnenie každého zraniteľného priechodu — premeniť prírodné obrany na pasce pre vtieravých nepriateľov." # todo: NEW TRANSLATION
 military_chaplaincy: "Vojenská kaplánska služba" # todo: NEW TRANSLATION
 military_chaplaincy_desc: "Naše armády bojujú nielen za korunu a krajinu, ale aj za vieru a povinnosť. Zahrnutím klerikov ako kaplánov do našich síl udržíme ducha vojakov počas ťažkostí tažení." # todo: NEW TRANSLATION
 establish_field_hospitals: "Zriadiť polné nemocnice" # todo: NEW TRANSLATION
 establish_field_hospitals_desc: "Príliš veľa našich vojakov umiera nie od nepriateľských rán, ale od zranení, ktoré by sa dali liečiť, a chorôb, ktorým by sa dalo predísť. Nech Cirkev zorganizuje pohyblivé nemocnice, ktoré budú nasledovať naše armády a zachrániť životy tých, ktorí za nás bojujú." # todo: NEW TRANSLATION
 naval_supply_contracts: "Námorné zásobovacie zmluvy" # todo: NEW TRANSLATION
 naval_supply_contracts_desc: "Naša flotila nemôže zostať na mori bez spoľahlivého zásobovania a obchodné cechy majú siete na jeho zabezpečenie. Uzatváraním zmlúv s nimi zaistíme, že naše lode budú zásobené a pripravené bojovať bez obáv z nedostatku." # todo: NEW TRANSLATION
 fund_siege_engineers: "Financovať obliehacích inžinierov" # todo: NEW TRANSLATION
 fund_siege_engineers_desc: "Múry nepriateľov nespadnú bez odborného umu, ktorý ich zničí. Mestské cechy môžu financovať špecializovaných inžinierov a obliehaciu techniku potrebnú na zníženie aj najsilnejších opevnení." # todo: NEW TRANSLATION
 wartime_harvest_pooling: "Vojnové spoločné zásoby úrody" # todo: NEW TRANSLATION
 wartime_harvest_pooling_desc: "Naše armády kráčajú na žalúdkoch a hladná armáda sa zle bojuje. Organizovaním zhromažďovania prebytkov úrody do regionálnych skladov môžu naši ľudia priamo zásobovať sily, ktoré ich chránia." # todo: NEW TRANSLATION
 supply_line_labor_draft: "Odvod pracovnej sily na zásobovacie trasy" # todo: NEW TRANSLATION
 supply_line_labor_draft_desc: "Cesty, ktoré nesú naše zásoby na front, musia byť udržiavané a materiál presúvaný bez prestania. Náš ľud môže slúžiť vojnovému úsiliu prácou na zásobovacích trasách — príspevkom rovnako dôležitým ako akýkoľvek meč." # todo: NEW TRANSLATION
 royal_road_commission: "Kráľovská komisia ciest" # todo: NEW TRANSLATION
 royal_road_commission_desc: "Cesty spájajúce naše kráľovstvo sú tepnami, ktorými prúdi autorita a obchod. Zriadením riadnej siete udržiavaných kráľovských ciest zabezpečíme, že naša moc dosiahne každý kút krajiny rýchlo." # todo: NEW TRANSLATION
 mountain_pass_charters: "Charty horských priechodov" # todo: NEW TRANSLATION
 mountain_pass_charters_desc: "Naše šľachtické rody strážia horské priechody, ktoré rozdeľujú naše územie. Udeľovaním charty na ich údržbu a posádky zabezpečíme, že vzdialenosť a terén už neizolujú provincie od koruny." # todo: NEW TRANSLATION
 establish_parish_waypoints: "Zriadiť farské zastávky" # todo: NEW TRANSLATION
 establish_parish_waypoints_desc: "Cesty našej ríše sú dlhé a vzdialenosti unavujú posla i cestovateľa. Zriadením farských staníc pozdĺž kľúčových trás môže Cirkev poskytovať oddych, vedenie a podporu všetkým, ktorí prechádzajú našimi zemami." # todo: NEW TRANSLATION
 coastal_trading_post_network: "Sieť pobrežných obchodných staníc" # todo: NEW TRANSLATION
 coastal_trading_post_network_desc: "Naše pobrežia ponúkajú prirodzené prístavy a zastávky, ktoré ostávajú nevyužité pre nedostatok zariadení. Sieť pobrežných obchodných staníc financovaná obchodníkmi zníži náklady a riziká námorného obchodu a priblíži vzdialené provincie k metropole." # todo: NEW TRANSLATION
 rural_road_upkeep_corvee: "Corvée na údržbu vidieckych ciest" # todo: NEW TRANSLATION
 rural_road_upkeep_corvee_desc: "Naše vidiecke cesty chátrajú pre nedostatok organizovanej údržby. Požadovaním skromnej pracovnej služby od roľníckych domácností na udržanie miestnych ciest priechodných zabezpečíme, že žiadna časť ríše nebude odrezaná od centra." # todo: NEW TRANSLATION
 STATIC_MODIFIER_NAME_parl_royal_monopoly_mod: "Kráľovský obchodný monopol" # todo: NEW TRANSLATION
 STATIC_MODIFIER_NAME_parl_charter_governors_mod: "Guvernéri s chartou" # todo: NEW TRANSLATION
 STATIC_MODIFIER_NAME_parl_colonial_admin_mod: "Koloniálna správa" # todo: NEW TRANSLATION
 STATIC_MODIFIER_NAME_parl_royal_treasury_mod: "Reforma pokladnice" # todo: NEW TRANSLATION
 STATIC_MODIFIER_NAME_parl_royal_censure_mod: "Kráľovské pokarhanie" # todo: NEW TRANSLATION
 STATIC_MODIFIER_NAME_parl_emergency_levies_mod: "Núdzové odvody" # todo: NEW TRANSLATION
 STATIC_MODIFIER_NAME_parl_royal_art_patronage_mod: "Kráľovský patronát umenia" # todo: NEW TRANSLATION
 STATIC_MODIFIER_NAME_parl_feudal_levies_mod: "Feudálne vojenské povinnosti" # todo: NEW TRANSLATION
 STATIC_MODIFIER_NAME_parl_military_exercises_mod: "Vojenské cvičenia" # todo: NEW TRANSLATION
 STATIC_MODIFIER_NAME_parl_heralds_college_mod: "Kolégium heraldikov" # todo: NEW TRANSLATION
 STATIC_MODIFIER_NAME_parl_chivalric_orders_mod: "Uznanie rytierskych rád" # todo: NEW TRANSLATION
 STATIC_MODIFIER_NAME_parl_noble_privateers_mod: "Licencia pre šľachtických korzárov" # todo: NEW TRANSLATION
 STATIC_MODIFIER_NAME_parl_land_trade_mod: "Šľachtický monopol na pozemný obchod" # todo: NEW TRANSLATION
 STATIC_MODIFIER_NAME_parl_noble_colonization_mod: "Charta šľachtickej kolonizácie" # todo: NEW TRANSLATION
 STATIC_MODIFIER_NAME_parl_hunting_rights_mod: "Výhradné práva na lov" # todo: NEW TRANSLATION
 STATIC_MODIFIER_NAME_parl_garrison_law_mod: "Zákon o šľachtických posádkach" # todo: NEW TRANSLATION

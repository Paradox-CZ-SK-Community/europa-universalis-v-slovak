 establish_standing_regiments: "Zriadiť stále pluky" # todo: NEW TRANSLATION
 establish_standing_regiments_desc: "Doba zvolávania verných pomocníkov podľa potreby už pominula. Namiesto toho by naše šľachtické rody mali dodávať vycvičených dôstojníkov, ktorí povedú pluky trvalo slúžiace v kráľovskej službe — bojovú silu, ktorá je svojou disciplínou zaviazaná korune skôr než svojmu pánovi." # todo: NEW TRANSLATION
 mandate_wartime_conscription: "Nariadiť vojnový odvod" # todo: NEW TRANSLATION
 mandate_wartime_conscription_desc: "Naši nepriatelia postavili armády z odvedencov, a my musíme urobiť to isté. Povolávaním záloh a brancov cez farské zoznamy sa naše sily v tejto hodine núdze rozšíria." # todo: NEW TRANSLATION
 promote_industrial_workshops: "Podporiť priemyselné dielne" # todo: NEW TRANSLATION
 promote_industrial_workshops_desc: "Remeselnícke bratstvá, ktoré kedysi udržiavali naše mestá, už nedokážu dosiahnuť produkciu, akú si vyžaduje náš vek. Mali by sme investovať do nových manufaktúr a mechanizovaných dielní, ktoré vyrábajú oveľa viac a oveľa rýchlejšie, aby naše remeslá držali krok s dobou." # todo: NEW TRANSLATION
 wartime_officer_corps: "Posilniť dôstojnícky zbor" # todo: NEW TRANSLATION
 wartime_officer_corps_desc: "Nápor jazdy už nerozhoduje deň. To, čo dnes rozhoduje bitku, je zručnosť tých, ktorí velia, a parlament by mal armáde umožniť vybrať si našich najlepších dôstojníkov, vycvičených a nasadených pred začiatkom kampane." # todo: NEW TRANSLATION
 pa_accept_estate_culture: "Prijať kultúru stavu" # todo: NEW TRANSLATION
 pa_accept_estate_culture_simple: "Podplatiť stav" # todo: NEW TRANSLATION
 pa_accept_estate_culture_desc: "Stav požaduje, aby dominantná [culture|e] jeho ľudu získala oficiálne uznanie." # todo: NEW TRANSLATION
 pa_convert_to_estate_religion: "Prejsť na náboženstvo stavu" # todo: NEW TRANSLATION
 pa_convert_to_estate_religion_simple: "Podplatiť stav" # todo: NEW TRANSLATION
 pa_convert_to_estate_religion_desc: "Stav požaduje, aby krajina prešla na [religion|e] svojich ľudí." # todo: NEW TRANSLATION
 pa_change_court_language_to_estate_language: "Zmeniť dvorný jazyk" # todo: NEW TRANSLATION

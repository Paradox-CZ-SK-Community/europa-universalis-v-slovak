l_polish:
 nobles: "Šľachta"
 clergy: "Duchovní"
 burghers: "Mešťania"
 laborers: "Pracovníci"
 soldiers: "Vojaci"
 peasants: "Roľníci"
 slaves: "Otroci"
 tribesmen: "Domorodci"
 nobles_desc: "Títo predstavujú bohatých a mocných, s pôvodom, ktorý nemožno spochybniť. Toto sú [Concept('pops','populácie')|el], ktorí poskytujú hlavné [Concept('characters','postavy')|el] na vedenie [Concept('country','krajiny')|e]." # todo: CONCEPT CASE
 clergy_desc: "Duchovní sú duchovnými vodcami [Concept('country','krajinou')|e]. [Concept('pop','Populácia')|e] duchovných tvorí skupinu, ktorá dohliada na náboženské tradície a vzdeláva ľud v tajomstvách viery." # todo: CONCEPT CASE
 burghers_desc: "Mešťania predstavujú obchodné vrstvy [Concept('country','krajiny')|e], hospodárstvo a financie sú ich doménou. Sídlia väčšinou v [Concept('towns_and_cities','mestských lokalitách')|e], kde podporujú bohatstvo prostredníctvom produktívnych [Concept('buildings','budov')|e]."
 peasants_desc: "Roľníci predstavujú obyčajných ľudí, nad ktorými vládneme. Väčšina z nich žije z poľnohospodárstva na vlastnú spotrebu alebo v dedinách."
 slaves_desc: "Otroci predstavujú ľudí zbavených práv pracujúcich pri zbere [Concept('raw_materials','surovinách')|e] alebo na [Concept('plantations','plantáže')|e] pre svojich pánov; sú považovaní za komodity či už narodením, alebo nadobudnutím na obchodných [Concept('markets','trhy')|e]." # todo: CONCEPT CASE
 tribesmen_desc: "Domorodci predstavujú komunity obývajúce [Concept('rural_locations','vidiecke lokality')|el], ktoré sa živia samostatne ako farmári, pastieri alebo ako lovci-zberači, a ktoré len ťažko ovládame, pretože si zachovávajú vlastné odlišné sociálne štruktúry a organizáciu." # todo: CONCEPT CASE
 laborers_desc: "Pracovníci predstavujú ľudí, ktorí vykonávajú manuálnu prácu v našich [Concept('towns_and_cities','mestských lokalít')|e] a [Concept('rural_locations','vidieckych'|e] lokalitách. Obrábajú pôdu pri vytváraní, zbere a získavaní [Concept('raw_materials','suroviny')|e], ktoré sú chrbticou krajiny, alebo pracujú ako nekvalifikovaní pracovníci v mlynoch." # todo: CONCEPT CASE
 soldiers_desc: "Vojaci predstavujú obyčajných ľudí, ktorí poskytujú [Concept('manpower',živá sila')|e] pre naše [Concept('armies','armády')|e] a [Concept('garrisons','posádku')|e], ako aj [Concept('sailors','námorníkov')|e] pre naše [Concept('navies','námorné sily')|el]." # todo: CONCEPT CASE

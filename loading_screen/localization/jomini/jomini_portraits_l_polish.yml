l_polish:
 SETTING_ANIMATED_PORTRAITS: "Animované postavy"
 SETTING_ANIMATED_PORTRAITS_TOOLTIP: "#T $SETTING_ANIMATED_PORTRAITS$\n#!Určuje, či majú byť hlavné postavy animované.\n\nVypnutie môže zvýšiť výkon."
 SETTING_PORTRAITS_SSAO: "SSAO pre postavy"
 SETTING_PORTRAITS_SSAO_TOOLTIP: "#T $SETTING_PORTRAITS_SSAO$\n#!Určuje, či sa má na portréty postáv aplikovať screen space ambient occlusion (SSAO).\n\nVypnutie môže zvýšiť výkon."
 SETTING_PORTRAITS_UNSHARP_MASKING: "Ostrenie portrétov" # todo: NEW TRANSLATION
 SETTING_PORTRAITS_UNSHARP_MASKING_TOOLTIP: "#T $SETTING_PORTRAITS_UNSHARP_MASKING$\n#!Určuje, či sa má na portréty použiť technika 'unsharp masking', aby vyzerali ostrejšie.\n\nVypnutie môže zvýšiť výkon." # todo: NEW TRANSLATION
 SETTING_GRUESOME_PORTRAITS_TRAITS_VISIBLE: "Ohavné portréty" # todo: NEW TRANSLATION
 SETTING_GRUESOME_PORTRAITS_TRAITS_VISIBLE_TOOLTIP: "#T $SETTING_GRUESOME_PORTRAITS_TRAITS_VISIBLE$\n#!Určuje, či sa majú v portrétoch zobrazovať ohavné črty, ako napríklad znetvorenie.\n\nAk ich považujete za príliš nepríjemné, vypnite ich." # todo: NEW TRANSLATION
